uestion":"দৃশ্যকল্প-১ এ কী ধরনের পরিবর্তন ঘটেছিল? সমীকরণসহ বর্ণনা কর।","answer":"দৃশ্যকল্প-১ এ লোহার রডের উপর বাদামি বর্ণের আস্তরণ পড়া হলো লোহায় মরিচা ধরা। এটি একটি রাসায়নিক পরিবর্তন । খোলা আকাশের নিচে লোহা বাতাসের অক্সিজেন ও জলীয় বাষ্প (পানি) এর সংস্পর্শে আসে এবং ধীরে ধীরে জারিত হয়ে আর্দ্র ফেরিক অক্সাইড বা মরিচা (Fe₂O₃.nH₂O) উৎপন্ন করে।\n4Fe(s)+3O₂(g)+2nH₂O(l)→2Fe₂O₃.nH₂O(s)\nএই বিক্রিয়ায় Fe এর জারণ সংখ্যা 0 থেকে +3 এ বৃদ্ধি পায়, অর্থাৎ লোহা জারিত হয় এবং অক্সিজেন বিজারিত হয়। তাই এটি একটি জারণ-বিজারণ বিক্রিয়া ।\nFe→Fe³⁺+3e⁻\nউৎপন্ন মরিচা একটি নতুন পদার্থ, যার ধর্ম লোহা থেকে সম্পূর্ণ ভিন্ন এবং সহজ উপায়ে একে পুনরায় লোহায় ফিরিয়ে আনা যায় না। সুতরাং দৃশ্যকল্প-১ এ রাসায়নিক পরিবর্তন (জারণ বা মরিচা ধরা) ঘটেছিল ।"},{"label":"ঘ","question":"(i) এবং (ii) এ বিক্রিয়ায় উপস্থিত মৌলসমূহের জারণ সংখ্যার হ্রাস-বৃদ্ধি ঘটে।—বিশ্লেষণ কর।","answer":"যে বিক্রিয়ায় কোনো মৌলের জারণ সংখ্যা বৃদ্ধি পায় তা জারণ এবং যে বিক্রিয়ায় জারণ সংখ্যা হ্রাস পায় তা বিজারণ। জারণ ও বিজারণ একই সাথে ঘটে। বিক্রিয়া (i)\nH₂S(g)+Cl2(g)→2HCl(g)+S(s)\n• H₂S এ S এর জারণ সংখ্যা: 2(+1)+x=0, x = -2; উৎপাদ S মৌলিক অবস্থায় থাকায় এর জারণ সংখ্যা 0। অর্থাৎ S এর জারণ সংখ্যা -2 থেকে 0 তে বৃদ্ধি পেয়েছে, তাই S জারিত হয়েছে ।\nS²⁻→S+2e⁻\n• Cl₂ মৌলিক অবস্থায় Cl এর জারণ সংখ্যা 0; HCl এ Cl এর জারণ সংখ্যা -1। অর্থাৎ Cl এর জারণ সংখ্যা 0 থেকে -1 এ হ্রাস পেয়েছে, তাই Cl বিজারিত হয়েছে ।\nCl₂+2e⁻→2Cl⁻\n• H এর জারণ সংখ্যা H₂S ও HCl উভয়েই +1, তাই অপরিবর্তিত থাকে। এখানে H₂S বিজারক ও Cl₂ জারক। বিক্রিয়া (ii)\n2SO₂(g)+O₂(g)→2SO₃(g)\n• SO₂ এ S এর জারণ সংখ্যা: x+2(-2)=0, x=+4; SO₃ এ S এর জারণ সংখ্যা: x+3(-2)=0, x=+6। অর্থাৎ S এর জারণ সংখ্যা +4 থেকে +6 এ বৃদ্ধি পেয়েছে, তাই S জারিত হয়েছে ।\nS⁴⁺→S⁶⁺+2e⁻\n• O₂ মৌলিক অবস্থায় O এর জারণ সংখ্যা 0; SO₃ এ O এর জারণ সংখ্যা -2। অর্থাৎ O এর জারণ সংখ্যা 0 থেকে -2 এ হ্রাস পেয়েছে, তাই O বিজারিত হয়েছে ।\nO₂+4e⁻→2O²⁻\nএখানে SO₂ বিজারক ও O₂ জারক।\nসুতরাং (i) ও (ii) উভয় বিক্রিয়ায় একটি মৌলের (S) জারণ সংখ্যা বৃদ্ধি এবং অপর মৌলের (Cl ও O) জারণ সংখ্যা হ্রাস ঘটে; তাই দুটিই জারণ-বিজারণ (রেডক্স) বিক্রিয়া ।"}]},{"id":"ch7-cq4","chapter":7,"num":4,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","board":"কুমিল্লা বোর্ড ২০২৬","stem":"(i)NaCl(s)+H2SO4(aq)→A(aq)+HCl(aq)\n(ii)MgCl2(s)+H₂O(l)→B+HCl(aq)\n(iii)MgCl2(s)+7H₂O(l)→C(s)\nএখানে A, B, C প্রতীকী অর্থে ব্যবহৃত হয়েছে । প্রচলিত কোনো মৌলের প্রতীক নয়।","subQuestions":[{"label":"ক","question":"তড়িৎযোজী বন্ধন কাকে বলে?","answer":"তড়িৎযোজী বন্ধন: ধাতব পরমাণু থেকে এক বা একাধিক ইলেকট্রন অধাতব পরমাণুতে স্থানান্তরের ফলে সৃষ্ট ধনাত্মক ও ঋণাত্মক আয়নের মধ্যে যে স্থির বৈদ্যুতিক আকর্ষণ বল দ্বারা বন্ধন গঠিত হয়, তাকে তড়িৎযোজী বা আয়নিক বন্ধন বলে।"},{"label":"খ","question":"সমানুপতা বলতে কী বুঝায়? ব্যাখ্যা কর।","answer":"সমানুপতা বা সমাণুতা (Isomerism) বলতে বোঝায়, একই আণবিক সংকেতবিশিষ্ট একাধিক যৌগের গাঠনিক সংকেত ভিন্ন হওয়ায় তাদের ভৌত ও রাসায়নিক ধর্ম ভিন্ন হওয়ার ঘটনা। এরূপ যৌগগুলোকে পরস্পরের সমাণু বলে।\nযেমন: বিউটেনের আণবিক সংকেত C₄H₁₀। এর দুটি গাঠনিক রূপ সম্ভব —\n• নরমাল বিউটেন: CH₃-CH₂-CH₂-CH₃\n• আইসো বিউটেন: CH₃-CH(CH₃)-CH₃ আণবিক সংকেত একই হলেও কার্বন শিকলের গঠন ভিন্ন হওয়ায় এদের স্ফুটনাঙ্কসহ বিভিন্ন ধর্ম ভিন্ন হয়।"},{"label":"গ","question":"A যৌগের মৌলগুলোর শতকরা সংযুতি নির্ণয় কর।","answer":"বিক্রিয়া (i) এ সোডিয়াম ক্লোরাইড ও সালফিউরিক এসিডের বিক্রিয়ায় সোডিয়াম হাইড্রোজেন সালফেট ও হাইড্রোজেন ক্লোরাইড উৎপন্ন হয়।\nNaCl(s)+H2SO4(aq)→NaHSO4(aq)+HCl(aq)\nঅতএব, A = NaHSO₄ (সোডিয়াম হাইড্রোজেন সালফেট) NaHSO₄ এর আণবিক ভর =23+1+32+(16×4)=120 Na এর শতকরা পরিমাণ =(23×100)/120%=19.17% H এর শতকরা পরিমাণ =(1×100)/120%=0.83% S এর শতকরা পরিমাণ =(32×100)/120%=26.67% O এর শতকরা পরিমাণ =(64×100)/120%=53.33% অতএব, A যৌগে Na 19.17%, H 0.83%, S 26.67% এবং O 53.33%।"},{"label":"ঘ","question":"(ii) ও (iii) নং বিক্রিয়ায় বিক্রিয়ক একই হলেও বিক্রিয়ার ধরন ভিন্ন—বিশ্লেষণ কর।","answer":"(ii) ও (iii) উভয় বিক্রিয়ায় বিক্রিয়ক ম্যাগনেসিয়াম ক্লোরাইড (MgCl₂) ও পানি (H₂O)। বিক্রিয়া (ii): আর্দ্রবিশ্লেষণ\nMgCl2(s)+H₂O(l)→Mg(OH)Cl+HCl(aq)\nএখানে পানির অণু H⁺ ও OH⁻ আয়নে বিভক্ত হয়ে MgCl₂ এর সাথে বিক্রিয়া করে। OH⁻ আয়ন Mg এর সাথে যুক্ত হয়ে B = Mg(OH)Cl (ম্যাগনেসিয়াম হাইড্রোক্সি ক্লোরাইড) এবং H⁺ আয়ন Cl⁻ এর সাথে যুক্ত হয়ে HCl উৎপন্ন করে । পানির সাথে লবণের বিক্রিয়ায় পানি বিশ্লিষ্ট হয়ে নতুন যৌগ গঠন করায় এটি আর্দ্রবিশ্লেষণ (Hydrolysis) বিক্রিয়া । (অধিক পানি ও তাপে বিক্রিয়াটি সম্পূর্ণ হয়ে Mg(OH)₂\nগঠন করে: MgCl₂+2H₂O→Mg(OH)₂+2HCl)\nবিক্রিয়া (iii): পানিযোজন\nMgCl2(s)+7H₂O(l)→MgCl₂.7H₂O(s)\nএখানে পানির অণু বিভক্ত হয় না; অবিকৃত অবস্থায় নির্দিষ্ট সংখ্যক পানির অণু কেলাস পানি হিসেবে MgCl₂ এর সাথে যুক্ত হয়ে আর্দ্র লবণ C = MgCl₂.7H₂O গঠন করে। এজন্য এটি পানিযোজন (Hydration) বিক্রিয়া । বিষয় বিক্রিয়া (ii) বিক্রিয়া (iii) বিক্রিয়ার ধরন আর্দ্রবিশ্লেষণ পানিযোজন পানির অণু H⁺ ও OH− এ বিভক্ত অবিভক্ত থাকে হয় উৎপাদ Mg(OH)Cl ও HCl MgCl₂.7H₂O (কেলাস (নতুন যৌগ) পানিযুক্ত লবণ) সুতরাং (ii) ও (iii) নং বিক্রিয়ায় বিক্রিয়ক একই হলেও পানির অংশগ্রহণের প্রকৃতি ভিন্ন হওয়ায় বিক্রিয়ার ধরন ভিন্ন—একটি আর্দ্রবিশ্লেষণ, অপরটি পানিযোজন ।"}]},{"id":"ch7-cq5","chapter":7,"num":5,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","board":"ঢাকা বোর্ড ২০২৬","stem":"উদ্দীপকের বিক্রিয়াসমূহ লক্ষ্য কর :\n(i)A(s)+O₂(g)→AO₂(g)\n(ii)2AO₂(g)+O₂(g)⇌2AO₃(g); ΔH = -197kJ\n‘A’ একটি অধাতব মৌল যার পরমাণুর নিউক্লিয়াসে ১৬টি প্রোটন বিদ্যমান।","subQuestions":[{"label":"ক","question":"মোলার আয়তন কী?","answer":"একই তাপমাত্রা ও চাপে যেকোনো গ্যাসীয় পদার্থের এক মোল যে আয়তন দখল করে, তাকে মোলার আয়তন বলে। STP তে যেকোনো গ্যাসের মোলার আয়তন 22.4 L।"},{"label":"খ","question":"‘আপেক্ষিক পারমাণবিক ভর এককবিহীন রাশি’—ব্যাখ্যা কর।","answer":"কোনো মৌলের একটি পরমাণুর ভর একটি কার্বন-12 আইসোটোপের ভরের 1/12 অংশের তুলনায় যতগুণ ভারী, সেই সংখ্যাকে ঐ মৌলের আপেক্ষিক পারমাণবিক ভর বলে। আপেক্ষিক পারমাণবিক ভর = একটি পরমাণুর ভর / (একটি C-12 পরমাণুর ভরের 1/12 অংশ) এখানে লব ও হর উভয়ই ভর এবং একই এককে প্রকাশিত হয়। ফলে ভাগ করলে একক কাটাকাটি হয়ে যায় এবং শুধু একটি সংখ্যা পাওয়া যায়। যেমন: অক্সিজেনের আপেক্ষিক পারমাণবিক ভর 16, এর কোনো একক নেই। তাই আপেক্ষিক পারমাণবিক ভর এককবিহীন রাশি।"},{"label":"গ","question":"উদ্দীপকের (i) নং বিক্রিয়াটি কোন কোন ধরনের বিক্রিয়ার প্রতিনিধিত্ব করে যুক্তিসহ ব্যাখ্যা কর।","answer":"উদ্দীপকের ‘A’ মৌলের নিউক্লিয়াসে 16টি প্রোটন আছে, অর্থাৎ এর পারমাণবিক সংখ্যা 16। সুতরাং A হলো অধাতু সালফার (S)। অতএব (i) নং বিক্রিয়াটি হলো:\nS(s)+O₂(g)→SO₂(g)\nএ বিক্রিয়াটি নিম্নোক্ত ধরনের বিক্রিয়ার প্রতিনিধিত্ব করে:\n১. সংযোজন বিক্রিয়া: দুটি মৌলিক পদার্থ S ও O₂ পরস্পর যুক্ত হয়ে একটি মাত্র নতুন যৌগ SO₂ উৎপন্ন করেছে। তাই এটি সংযোজন বিক্রিয়া ।\n২. দহন বিক্রিয়া: সালফার বাতাসের অক্সিজেনে পুড়ে নীল শিখাসহ জ্বলে SO₂ উৎপন্ন করে এবং তাপ উৎপন্ন হয়। তাই এটি একটি দহন বিক্রিয়া ।\n৩. জারণ-বিজারণ (রেডক্স) বিক্রিয়া: বিক্রিয়ায় S এর জারণ সংখ্যা 0 থেকে বৃদ্ধি পেয়ে +4 হয়েছে, অর্থাৎ S জারিত হয়েছে; আবার O এর জারণ সংখ্যা 0 থেকে হ্রাস পেয়ে -2 হয়েছে, অর্থাৎ O₂ বিজারিত হয়েছে ।\nজারণ অর্ধবিক্রিয়া : S→S⁴⁺+4e⁻\nবিজারণ অর্ধবিক্রিয়া : O₂+4e⁻→2O²⁻\n৪. তাপোৎপাদী বিক্রিয়া: বিক্রিয়ায় তাপ নির্গত হয়, তাই এটি\nতাপোৎপাদী বিক্রিয়া ।\nসুতরাং উদ্দীপকের (i) নং বিক্রিয়াটি একই সাথে সংযোজন, দহন, জারণ-বিজারণ ও তাপোৎপাদী বিক্রিয়া ।"},{"label":"ঘ","question":"উদ্দীপকের (ii) নং বিক্রিয়ার সাম্যাবস্থার উপর তাপ ও চাপের প্রভাব বিশ্লেষণ কর।","answer":"উদ্দীপকের A হলো সালফার। সুতরাং (ii) নং বিক্রিয়াটি হলো:\n2SO₂(g)+O₂(g)⇌2SO₃(g); ΔH = -197 kJ\nএটি একটি উভমুখী ও তাপোৎপাদী বিক্রিয়া (ΔH ঋণাত্মক)। লা- শাতেলিয়ের নীতি অনুসারে, সাম্যাবস্থায় থাকা কোনো বিক্রিয়ার তাপমাত্রা, চাপ বা ঘনমাত্রা পরিবর্তন করলে সাম্যাবস্থা এমন দিকে সরে যায় যাতে ঐ পরিবর্তনের ফল প্রশমিত হয়।\nতাপের প্রভাব সম্মুখমুখী বিক্রিয়াটি তাপোৎপাদী, তাই পশ্চাৎমুখী বিক্রিয়াটি তাপহারী । তাপমাত্রা বাড়ালে সাম্যাবস্থা তাপ শোষণের দিকে অর্থাৎ বাম দিকে সরে যায়, ফলে SO₃ এর উৎপাদন কমে যায়। আবার তাপমাত্রা কমালে সাম্যাবস্থা ডানদিকে সরে যায় এবং SO₃ এর উৎপাদন বাড়ে । তবে তাপমাত্রা খুব কম হলে বিক্রিয়ার হার অত্যন্ত কমে যায়। তাই শিল্পক্ষেত্রে (স্পর্শ পদ্ধতিতে) V₂O₅ প্রভাবকের উপস্থিতিতে প্রায় 450°C তাপমাত্রা ব্যবহার করা হয়।\nচাপের প্রভাব বিক্রিয়কের দিকে গ্যাসের মোট মোল সংখ্যা =2+1=3 এবং উৎপাদের দিকে গ্যাসের মোল সংখ্যা = 2। অর্থাৎ সম্মুখমুখী বিক্রিয়ায় গ্যাসের মোল সংখ্যা তথা আয়তন হ্রাস পায়।\nআয়তন হ্রাস : 3 আয়তন → 2 আয়তন\nতাই চাপ বাড়ালে সাম্যাবস্থা কম আয়তনের দিকে অর্থাৎ ডানদিকে সরে যায় এবং SO₃ এর উৎপাদন বৃদ্ধি পায়। আবার চাপ কমালে সাম্যাবস্থা বাম দিকে সরে যায় এবং SO₃ এর উৎপাদন হ্রাস পায়। শিল্পক্ষেত্রে সাধারণত 1-2 atm চাপেই যথেষ্ট পরিমাণ SO₃ পাওয়া যায়। সুতরাং, (ii) নং বিক্রিয়ায় নিম্ন তাপমাত্রা ও উচ্চ চাপ SO₃ উৎপাদনের অনুকূল, আর উচ্চ তাপমাত্রা ও নিম্ন চাপ সাম্যাবস্থাকে বিক্রিয়কের দিকে সরিয়ে দেয়।"}]},{"id":"ch7-cq6","chapter":7,"num":6,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","board":"দিনাজপুর বোর্ড ২০২৬","stem":"(i)CaCO₃(s)→X(s)+Y(g)\n(ii)CH₄(g)+2O₂(g)⇌CO₂(g)+2H₂O(g); ΔH = −ve","subQuestions":[{"label":"ক","question":"ফরমালিন কাকে বলে?","answer":"ফরমালিন: ফরমালডিহাইড (HCHO) এর 40% জলীয় দ্রবণকে ফরমালিন বলে।"},{"label":"খ","question":"সকল এসিড ও সবল ক্ষারের প্রশমন বিক্রিয়ায় তাপের মান ΔH=−57.34kJ —ব্যাখ্যা কর।","answer":"সবল এসিড ও সবল ক্ষার জলীয় দ্রবণে সম্পূর্ণরূপে বিয়োজিত হয়ে H⁺ ও OH⁻ আয়ন দেয়। যেমন:\nHCl(aq)+NaOH(aq)→NaCl(aq)+H₂O(l); ΔH= −57.34kJ\nএখানে Na⁺ ও Cl⁻ আয়ন বিক্রিয়ায় অংশ নেয় না, শুধু দর্শক আয়ন হিসেবে থাকে। প্রকৃতপক্ষে প্রতিটি সবল এসিড –সবল ক্ষারের প্রশমনে কেবল নিচের বিক্রিয়াটিই ঘটে:\nH⁺(aq)+OH⁻(aq)→H₂O(l); ΔH=−57.34kJ\nযেহেতু প্রতি ক্ষেত্রে 1 mol H⁺ ও 1 mol OH⁻ মিলে 1 mol পানি উৎপন্ন হয়, তাই সবল এসিড ও সবল ক্ষারের প্রশমন তাপের মান সর্বদা ΔH=−57.34kJ হয়।"},{"label":"গ","question":"উদ্দীপকের (i) নং বিক্রিয়ায় উৎপন্ন গ্যাসটির শনাক্তকরণ পরীক্ষা সমীকরণসহ লেখ ।","answer":"উদ্দীপকের (i) নং বিক্রিয়ায় CaCO₃ কে তাপ দিলে বিয়োজিত হয়ে CaO (X) ও CO₂ (Y) গ্যাস উৎপন্ন হয়।\nΔ\nCaCO₃(s)⟶CaO(s)+CO₂(g)\nসুতরাং উৎপন্ন গ্যাসটি হলো কার্বন ডাইঅক্সাইড (CO₂)। শনাক্তকরণ পরীক্ষা\n১. একটি টেস্টটিউবে কিছু পরিমাণ স্বচ্ছ চুনের পানি [Ca(OH)₂] নিয়ে তার মধ্যে উৎপন্ন গ্যাসটি চালনা করা হয়।\n২. দেখা যায় যে, স্বচ্ছ চুনের পানি ঘোলা হয়ে যায়। কারণ CO₂, Ca(OH)₂ এর সাথে বিক্রিয়া করে পানিতে অদ্রবণীয় সাদা CaCO₃ এর অধঃক্ষেপ তৈরি করে।\nCa(OH)2(aq)+CO₂(g)→CaCO₃(s)+H₂O(l)\n৩. ঘোলা দ্রবণে আরও বেশি সময় ধরে CO₂ চালনা করলে দ্রবণটি পুনরায় স্বচ্ছ হয়ে যায়। কারণ পানিতে দ্রবণীয় ক্যালসিয়াম বাইকার্বনেট উৎপন্ন হয়।\nCaCO₃(s)+H₂O(l)+CO₂(g)→Ca(HCO3)2(aq)\nচুনের পানি প্রথমে ঘোলা এবং পরে আবার স্বচ্ছ হওয়ার মাধ্যমে প্রমাণিত হয় যে উৎপন্ন গ্যাসটি CO₂।"},{"label":"ঘ","question":"উদ্দীপকের (ii) নং বিক্রিয়াটির উপর তাপ, চাপ ও ঘনমাত্রার প্রভাব আলোচনা কর।","answer":"উদ্দীপকের (ii) নং বিক্রিয়াটি একটি উভমুখী বিক্রিয়া, যা সাম্যাবস্থায় থাকে:\nCH₄(g)+2O₂(g)⇌CO₂(g)+2H₂O(g); ΔH = −ve\nলা-শাতেলিয়ের নীতি অনুসারে, সাম্যাবস্থায় থাকা কোনো বিক্রিয়ায় তাপমাত্রা, চাপ বা ঘনমাত্রার কোনো একটি পরিবর্তন করলে সাম্যাবস্থা সেই দিকে সরে যায় যেদিকে ঐ পরিবর্তনের ফল প্রশমিত হয়।\nতাপের প্রভাব বিক্রিয়াটির সম্মুখমুখী দিক তাপোৎপাদী (ΔH ঋণাত্মক) এবং পশ্চাৎমুখী দিক তাপহারী । তাপমাত্রা বাড়ালে সাম্যাবস্থা তাপ শোষণের দিকে অর্থাৎ বাম দিকে সরে যায়, ফলে CO₂ ও H₂O এর পরিমাণ কমে। আর তাপমাত্রা কমালে সাম্যাবস্থা ডান দিকে সরে যায়, ফলে উৎপাদের পরিমাণ বাড়ে ।\nচাপের প্রভাব বিক্রিয়কের মোট মোল সংখ্যা =1+2=3mol (গ্যাস) উৎপাদের মোট মোল সংখ্যা =1+2=3mol (গ্যাস) বিক্রিয়ক ও উৎপাদ উভয় পক্ষে গ্যাসীয় অণুর মোল সংখ্যা সমান হওয়ায় চাপ বাড়ালে বা কমালে আয়তনের কোনো পরিবর্তন হয় না। তাই এ বিক্রিয়ার সাম্যাবস্থার উপর চাপের কোনো প্রভাব নেই। ঘনমাত্রার প্রভাব বিক্রিয়ক CH₄ বা O₂ এর ঘনমাত্রা বাড়ালে সাম্যাবস্থা ডান দিকে সরে যায় এবং বেশি পরিমাণে CO₂ ও H₂O উৎপন্ন হয়। আবার উৎপাদ CO₂ বা H₂O এর ঘনমাত্রা বাড়ালে সাম্যাবস্থা বাম দিকে সরে যায়। অপরদিকে উৎপাদ সরিয়ে নিলে সাম্যাবস্থা ডান দিকে সরে যায়। সুতরাং, (ii) নং বিক্রিয়ায় তাপমাত্রা কমালে ও বিক্রিয়কের ঘনমাত্রা বাড়ালে উৎপাদ বৃদ্ধি পায়, কিন্তু চাপের পরিবর্তনে সাম্যাবস্থার কোনো পরিবর্তন হয় না।"}]},{"id":"ch7-cq7","chapter":7,"num":7,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","board":"মাদ্রাসা বোর্ড ২০২৬","stem":"(i)Zn+H₂SO₄→ZnSO₄+X₂(g)\n(ii)HCl(aq)+NaOH(aq)→NaCl(aq)+H₂O(l)\n(iii)FeSO₄+NaOH→Fe(OH)₂↓ + Na₂SO₄","subQuestions":[{"label":"ক","question":"দহন বিক্রিয়া কাকে বলে?","answer":"কোনো মৌল বা যৌগকে বাতাসের অক্সিজেনের উপস্থিতিতে পুড়িয়ে তাপ ও আলোসহ নতুন পদার্থ উৎপন্ন করার বিক্রিয়াকে দহন\nবিক্রিয়া বলে। যেমন: CH₄+2O₂→CO₂+2H₂O+তাপ ।"},{"label":"খ","question":"Ca-এর সর্বশেষ ইলেকট্রন দুটি 3d তে না গিয়ে 4s এ যায় কেন? ব্যাখ্যা কর।","answer":"ইলেকট্রন সর্বদা নিম্ন শক্তির অরবিটালে আগে প্রবেশ করে (আউফবাউ নীতি)। (n + l) মান যার কম তার শক্তি কম। 4s অরবিটালের (n+l)=4+0=4 3d অরবিটালের (n+l)=3+2=5 4s এর শক্তি 3d এর চেয়ে কম হওয়ায় Ca(20) এর 3p পূর্ণ হওয়ার পর শেষ দুটি ইলেকট্রন 3d তে না গিয়ে 4s এ যায়: Ca(20) : 1s² 2s² 2p⁶ 3s² 3p⁶ 4s²।"},{"label":"গ","question":"প্রমাণ অবস্থায় 5g X2 গ্যাসের অণুর সংখ্যা নির্ণয় কর।","answer":"উদ্দীপকের (i) নং বিক্রিয়ায় জিংক লঘু সালফিউরিক এসিডের সাথে বিক্রিয়া করে জিংক সালফেট ও হাইড্রোজেন গ্যাস উৎপন্ন করে।\nZn+H₂SO₄→ZnSO₄+H₂(g)\nসুতরাং X2 গ্যাসটি হলো হাইড্রোজেন (H₂)।\nH₂ এর আণবিক ভর =1×2=2 অর্থাৎ 2 g H₂=1molH₂, এবং 1 mol H₂ তে অণুর সংখ্যা 6.02 × 10²³ টি। 5 g H₂ এর মোল সংখ্যা =5/2mol=2.5mol অণুর সংখ্যা = মোল সংখ্যা × অ্যাভোগেড্রো সংখ্যা =2.5×6.02×10²³ =1.505×10²⁴ টি সুতরাং প্রমাণ অবস্থায় 5 g X2 (H₂) গ্যাসে 1.505 × 10²⁴ টি অণু আছে।"},{"label":"ঘ","question":"উদ্দীপকের (ii) ও (iii) বিক্রিয়ায় সাধারণ বিক্রিয়ক NaOH থাকা সত্ত্বেও বিক্রিয়ার ধরন একই হবে কি? বিশ্লেষণ কর।","answer":"উদ্দীপকের (ii) ও (iii) উভয় বিক্রিয়ায় NaOH বিক্রিয়ক হিসেবে আছে, তবুও বিক্রিয়ার ধরন একই নয়। (ii) নং বিক্রিয়া: প্রশমন বিক্রিয়া\nHCl(aq)+NaOH(aq)→NaCl(aq)+H₂O(l)\nএখানে এসিড (HCl) ও ক্ষার (NaOH) পরস্পর বিক্রিয়া করে লবণ (NaCl) ও পানি উৎপন্ন করেছে। এসিডের H⁺ আয়ন ও ক্ষারের OH⁻ আয়ন যুক্ত হয়ে পানি তৈরি করে:\nH⁺(aq)+OH⁻(aq)→H₂O(l)\nফলে এসিড ও ক্ষার উভয়ের ধর্ম লোপ পায় এবং দ্রবণ নিরপেক্ষ হয় (pH = 7)। তাই এটি একটি প্রশমন বিক্রিয়া (এসিড-ক্ষারক বিক্রিয়া)। এতে তাপ উৎপন্ন হয়, অর্থাৎ এটি তাপোৎপাদী । (iii) নং বিক্রিয়া: অধঃক্ষেপণ বিক্রিয়া সমতাকৃত সমীকরণ:\nFeSO₄+2NaOH→Fe(OH)₂↓ + Na₂SO₄\nএখানে FeSO₄ লবণ ও NaOH ক্ষারের দ্রবণ মিশ্রিত করলে উভয়ের আয়ন পরস্পর স্থান বিনিময় করে (দ্বি-প্রতিস্থাপন) এবং পানিতে অদ্রবণীয় সবুজ বর্ণের Fe(OH)₂ অধঃক্ষেপ সৃষ্টি হয়:\nFe²⁺(aq)+2OH⁻(aq)→Fe(OH)₂(s)\nএ বিক্রিয়ায় কোনো এসিড অংশ নেয়নি এবং পানিও উৎপন্ন হয়নি, বরং অদ্রবণীয় কঠিন পদার্থ (অধঃক্ষেপ) উৎপন্ন হয়েছে । তাই এটি প্রশমন বিক্রিয়া নয়, এটি অধঃক্ষেপণ বিক্রিয়া । উভয় বিক্রিয়াতেই কোনো মৌলের জারণ সংখ্যার পরিবর্তন হয়নি (Fe +2 ই রয়েছে), তাই কোনোটিই রেডক্স বিক্রিয়া নয়; কিন্তু উৎপাদের প্রকৃতি ভিন্ন। সুতরাং সাধারণ বিক্রিয়ক NaOH থাকা সত্ত্বেও (ii) নং বিক্রিয়াটি প্রশমন বিক্রিয়া এবং (iii) নং বিক্রিয়াটি অধঃক্ষেপণ বিক্রিয়া; অর্থাৎ বিক্রিয়ার ধরন একই হবে না।"}]},{"id":"ch7-cq8","chapter":7,"num":8,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","board":"মাদ্রাসা বোর্ড ২০২৬","stem":"(i)N₂(g)+O₂(g)⇌2NO; ΔH=+180KJ\n(ii)FeCl₂+Cl₂→FeCl₃","subQuestions":[{"label":"ক","question":"ইলেকট্রন আসক্তি কাকে বলে?","answer":"গ্যাসীয় অবস্থায় কোনো মৌলের এক মোল বিচ্ছিন্ন পরমাণুতে এক মোল ইলেকট্রন যুক্ত হয়ে এক মোল ঋণাত্মক আয়নে পরিণত হতে যে শক্তি নির্গত হয়, তাকে ঐ মৌলের ইলেকট্রন আসক্তি বলে।"},{"label":"খ","question":"নিয়ন একটি নিষ্ক্রিয় গ্যাস— ব্যাখ্যা কর।","answer":"নিয়নের (Ne) পারমাণবিক সংখ্যা 10। এর ইলেকট্রন বিন্যাস: 1s² 2s² 2p⁶। নিয়নের সর্বশেষ শক্তিস্তরে 8টি ইলেকট্রন আছে, অর্থাৎ অষ্টক পূর্ণ। ফলে এর ইলেকট্রন গ্রহণ, ত্যাগ বা শেয়ার করার প্রবণতা নেই এবং এটি সাধারণত অন্য মৌলের সাথে বিক্রিয়া করে না, এক পরমাণুক অবস্থায় থাকে। তাই নিয়ন একটি নিষ্ক্রিয় গ্যাস (গ্রুপ 18)।"},{"label":"গ","question":"রেডক্স বিক্রিয়ার ধারণার আলোকে (ii)নং বিক্রিয়াটি ব্যাখ্যা কর।","answer":"উদ্দীপকের (ii) নং বিক্রিয়ার সমতাকৃত সমীকরণ:\n2FeCl₂+Cl₂→2FeCl₃\nযে বিক্রিয়ায় একই সাথে জারণ (ইলেকট্রন ত্যাগ) ও বিজারণ (ইলেকট্রন গ্রহণ) ঘটে, তাকে রেডক্স বিক্রিয়া বলে । FeCl₂ তে Fe এর জারণ সংখ্যা +2 এবং FeCl₃ তে Fe এর জারণ সংখ্যা +3। আবার Cl₂ তে Cl এর জারণ সংখ্যা 0 এবং FeCl₃ তে -1।\nজারণ অর্ধবিক্রিয়া\n2Fe²⁺→2Fe³⁺+2e⁻\nFe²⁺ আয়ন ইলেকট্রন ত্যাগ করে Fe³⁺ আয়নে পরিণত হয়েছে, জারণ সংখ্যা +2 থেকে +3 এ বৃদ্ধি পেয়েছে । তাই Fe²⁺ জারিত হয়েছে ।\nবিজারণ অর্ধবিক্রিয়া\nCl₂+2e⁻→2Cl⁻\nCl₂ ইলেকট্রন গ্রহণ করে Cl⁻ আয়নে পরিণত হয়েছে, জারণ সংখ্যা 0 থেকে -1 এ হ্রাস পেয়েছে । তাই Cl₂ বিজারিত হয়েছে ।\nসামগ্রিক বিক্রিয়া\n2Fe²⁺+Cl₂→2Fe³⁺+2Cl⁻\nএখানে FeCl₂ ইলেকট্রন দান করায় বিজারক এবং Cl₂ ইলেকট্রন গ্রহণ করায় জারক হিসেবে কাজ করেছে। একই সাথে জারণ ও বিজারণ ঘটায় (ii) নং বিক্রিয়াটি একটি রেডক্স বিক্রিয়া ।"},{"label":"ঘ","question":"লা-শাতেলিয়ার নীতির আলোকে (i)নং বিক্রিয়াটির সর্বোচ্চ পরিমাণ উৎপাদ তৈরিতে তাপমাত্রা ও চাপের প্রভাব বিশ্লেষণ কর।","answer":"লা-শাতেলিয়ার নীতি: কোনো উভমুখী বিক্রিয়া সাম্যাবস্থায় থাকাকালে তাপমাত্রা, চাপ বা ঘনমাত্রার কোনো একটি পরিবর্তন করলে সাম্যাবস্থা এমন দিকে সরে যায় যাতে ঐ পরিবর্তনের ফল প্রশমিত হয়।\nN₂(g)+O₂(g)⇌2NO(g); ΔH=+180kJ\nতাপমাত্রার প্রভাব বিক্রিয়াটির ΔH ধনাত্মক, অর্থাৎ সম্মুখমুখী বিক্রিয়া তাপহারী এবং পশ্চাৎমুখী বিক্রিয়া তাপোৎপাদী । তাপমাত্রা বাড়ালে সাম্যাবস্থা অতিরিক্ত তাপ শোষণের জন্য তাপহারী দিকে, অর্থাৎ সম্মুখ দিকে সরে যায়। ফলে বেশি NO উৎপন্ন হয়। তাপমাত্রা কমালে সাম্যাবস্থা পশ্চাৎ দিকে সরে যায় এবং NO এর পরিমাণ কমে। তাই সর্বোচ্চ পরিমাণ NO পেতে উচ্চ তাপমাত্রা প্রয়োজন । (এজন্যই বজ্রপাতের সময় উচ্চ তাপে বাতাসের N₂ ও O₂ যুক্ত হয়ে NO তৈরি হয়।)\nচাপের প্রভাব গ্যাসীয় বিক্রিয়ায় চাপ বাড়ালে সাম্যাবস্থা কম মোল গ্যাসের দিকে এবং চাপ কমালে বেশি মোল গ্যাসের দিকে সরে। বিক্রিয়ক পক্ষে গ্যাসের মোল সংখ্যা =1+1=2 উৎপাদ পক্ষে গ্যাসের মোল সংখ্যা = 2 উভয় পক্ষে গ্যাসের মোল সংখ্যা সমান হওয়ায় চাপ বাড়ালে বা কমালে কোনো পক্ষেই আয়তন হ্রাসের সুযোগ নেই। তাই চাপের পরিবর্তনে এ বিক্রিয়ার সাম্যাবস্থার কোনো পরিবর্তন হয় না, উৎপাদের পরিমাণও পরিবর্তিত হয় না। সুতরাং (i) নং বিক্রিয়ায় সর্বোচ্চ পরিমাণ NO উৎপাদনের জন্য উচ্চ তাপমাত্রা প্রয়োজন, কিন্তু চাপের কোনো প্রভাব নেই।"}]},{"id":"ch7-cq9","chapter":7,"num":9,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","board":"রাজশাহী বোর্ড ২০২৬","stem":"(i)N₂(g)+3H₂(g)⇌2NH₃(g); ΔH = (-)\n(ii)HgCl₂+Hg→Hg₂Cl₂","subQuestions":[{"label":"ক","question":"মোলারিটি কাকে বলে?","answer":"মোলারিটি: নির্দিষ্ট তাপমাত্রায় প্রতি লিটার দ্রবণে দ্রবীভূত দ্রবের মোল সংখ্যাকে ঐ দ্রবণের মোলারিটি বলে।"},{"label":"খ","question":"রাসায়নিক সাম্যাবস্থা একটি গতিশীল অবস্থা —ব্যাখ্যা কর।","answer":"উভমুখী বিক্রিয়ায় যে অবস্থায় সম্মুখমুখী বিক্রিয়ার হার ও পশ্চাৎমুখী বিক্রিয়ার হার সমান হয়, সেই অবস্থাকে রাসায়নিক সাম্যাবস্থা বলে।\nH₂(g)+I₂(g)⇌2HI(g)\nসাম্যাবস্থায় বিক্রিয়া থেমে যায় না; সম্মুখ দিকে বিক্রিয়ক থেকে উৎপাদ এবং একই হারে পশ্চাৎ দিকে উৎপাদ থেকে বিক্রিয়ক অবিরত উৎপন্ন হতে থাকে। ফলে বিক্রিয়ক ও উৎপাদের ঘনমাত্রা স্থির মনে হলেও উভয় দিকের বিক্রিয়া চলমান থাকে । তাই রাসায়নিক সাম্যাবস্থা একটি গতিশীল অবস্থা ।"},{"label":"গ","question":"(ii) নং বিক্রিয়ায় জারণ-বিজারণ যুগপৎ ঘটে—ব্যাখ্যা কর।","answer":"যে বিক্রিয়ায় ইলেকট্রন বর্জন (জারণ) ও ইলেকট্রন গ্রহণ (বিজারণ) একই সাথে ঘটে, তাকে জারণ-বিজারণ বিক্রিয়া বলে ।\nHgCl₂+Hg→Hg₂Cl₂\nজারণ সংখ্যা নির্ণয়:\n• HgCl₂ এ Hg এর জারণ সংখ্যা =+2\n• মুক্ত Hg এর জারণ সংখ্যা = 0\n• Hg₂Cl₂ এ Hg এর জারণ সংখ্যা =+1 (কারণ 2x+2(-1)=0, x=+1)\nজারণ অর্ধবিক্রিয়া\nHg→Hg⁺+e⁻\nমুক্ত Hg ইলেকট্রন ত্যাগ করে জারণ সংখ্যা 0 থেকে +1 এ বৃদ্ধি পেয়েছে, অর্থাৎ Hg জারিত হয়েছে (বিজারক)।\nবিজারণ অর্ধবিক্রিয়া\nHg²⁺+e⁻→Hg⁺\nHgCl₂ এর Hg²⁺ ইলেকট্রন গ্রহণ করে জারণ সংখ্যা +2 থেকে +1 এ হ্রাস পেয়েছে, অর্থাৎ HgCl₂ বিজারিত হয়েছে (জারক)।\nসামগ্রিক বিক্রিয়া\nHg+Hg²⁺→2Hg⁺\nHgCl₂+Hg→Hg₂Cl₂\nএখানে Hg যে ইলেকট্রন ত্যাগ করে, Hg²⁺ ঠিক সেই ইলেকট্রনটিই গ্রহণ করে । ইলেকট্রন বর্জন ও গ্রহণ একই সাথে ঘটায় (ii) নং বিক্রিয়ায় জারণ-বিজারণ যুগপৎ ঘটে।"},{"label":"ঘ","question":"(i) নং বিক্রিয়ায় সর্বোচ্চ উৎপাদ পেতে সাম্যাবস্থায় লা- শাতেলিয়ানের নীতির প্রয়োগ বিশ্লেষণ কর।","answer":"(i) নং বিক্রিয়াটি হেবার পদ্ধতিতে অ্যামোনিয়া উৎপাদনের উভমুখী বিক্রিয়া:\nN₂(g)+3H₂(g)⇌2NH₃(g) ; ΔH = (-)\nলা-শাতেলিয়ারের নীতি: সাম্যাবস্থায় থাকা কোনো বিক্রিয়ার তাপমাত্রা, চাপ বা ঘনমাত্রার কোনো একটি পরিবর্তন করলে সাম্যাবস্থা এমন দিকে সরে যায় যাতে ঐ পরিবর্তনের ফল প্রশমিত হয়।\n১. চাপের প্রভাব বিক্রিয়ক পক্ষে মোট গ্যাসের মোল সংখ্যা 1+3=4 এবং উৎপাদ পক্ষে 2। অর্থাৎ সম্মুখমুখী বিক্রিয়ায় আয়তন হ্রাস পায়। চাপ বৃদ্ধি করলে সাম্যাবস্থা কম মোলের দিকে অর্থাৎ ডান দিকে সরে যায় এবং NH₃ এর উৎপাদন বাড়ে । তাই উচ্চ চাপ (প্রায় 200 atm) প্রয়োগ করা হয়।\n২. তাপমাত্রার প্রভাব সম্মুখমুখী বিক্রিয়াটি তাপউৎপাদী (ΔH ঋণাত্মক)। তাপমাত্রা কমালে সাম্যাবস্থা তাপ উৎপন্ন হওয়ার দিকে অর্থাৎ ডান দিকে সরে এবং NH₃ এর পরিমাণ বাড়ে । তবে খুব নিম্ন তাপমাত্রায় বিক্রিয়ার হার অত্যন্ত কমে যায়। তাই অনুকূল তাপমাত্রা প্রায় 450°C - 500°C এবং বিক্রিয়ার হার বাড়াতে লোহার চূর্ণ প্রভাবক ব্যবহার করা হয়।\n৩. ঘনমাত্রার প্রভাব বিক্রিয়ক N₂ ও H₂ এর ঘনমাত্রা বাড়ালে অথবা উৎপন্ন NH₃ কে শীতলীকরণের মাধ্যমে তরল করে বিক্রিয়া মিশ্রণ থেকে সরিয়ে নিলে সাম্যাবস্থা ডান দিকে সরে যায় এবং অধিক NH₃ উৎপন্ন হয়। Fe, 450°C, 200 atm\nN₂(g)+3H₂(g)⟶2NH₃(g)\nসুতরাং লা-শাতেলিয়ারের নীতি অনুসারে উচ্চ চাপ, অনুকূল নিম্ন তাপমাত্রা, বিক্রিয়কের উচ্চ ঘনমাত্রা ও উৎপাদ অপসারণের মাধ্যমে (i) নং বিক্রিয়ায় সর্বোচ্চ পরিমাণ NH₃ পাওয়া যায়।"}]},{"id":"ch7-cq10","chapter":7,"num":10,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","board":"সিলেট বোর্ড ২০২৬","stem":"(i)N₂(g)+O₂(g)⇌2NO(g); ΔH=+180kJ\n(ii)Na+HNO₃→NaNO₃+1/2H₂","subQuestions":[{"label":"ক","question":"পলিমারকরণ বিক্রিয়া কাকে বলে?","answer":"পলিমারকরণ বিক্রিয়া: যে বিক্রিয়ায় উচ্চ চাপে ও তাপে প্রভাবকের উপস্থিতিতে একই বা ভিন্ন জাতীয় অসংখ্য ছোট অণু (মনোমার) পরস্পর যুক্ত হয়ে একটি বৃহৎ অণু (পলিমার) গঠন করে, তাকে পলিমারকরণ বিক্রিয়া বলে।"},{"label":"খ","question":"পরমাণু তড়িৎ নিরপেক্ষ কেন? ব্যাখ্যা করো।","answer":"পরমাণুর নিউক্লিয়াসে ধনাত্মক চার্জযুক্ত প্রোটন এবং নিউক্লিয়াসের বাইরে বিভিন্ন শক্তিস্তরে ঋণাত্মক চার্জযুক্ত ইলেকট্রন থাকে। নিউট্রন চার্জবিহীন । একটি প্রোটনের চার্জ +1 এবং একটি ইলেকট্রনের চার্জ -1, অর্থাৎ পরিমাণে সমান কিন্তু বিপরীত। পরমাণুতে প্রোটন ও ইলেকট্রনের সংখ্যা সমান থাকে, ফলে মোট ধনাত্মক ও ঋণাত্মক চার্জ পরস্পরকে প্রশমিত করে। উদাহরণ: Na পরমাণুতে 11টি প্রোটন ও 11টি ইলেকট্রন থাকে । এজন্য পরমাণু তড়িৎ নিরপেক্ষ।"},{"label":"গ","question":"সাম্যাবস্থায় (i) নং বিক্রিয়ার উপর তাপের প্রভাব ব্যাখ্যা করো।","answer":"উদ্দীপকের (i) নং বিক্রিয়াটি একটি উভমুখী বিক্রিয়া:\nN₂(g)+O₂(g)⇌2NO(g); ΔH=+180kJ\nΔH ধনাত্মক হওয়ায় সম্মুখ বিক্রিয়াটি তাপহারী এবং পশ্চাৎমুখী বিক্রিয়াটি তাপোৎপাদী। লা-শাতেলিয়ের নীতি অনুসারে, সাম্যাবস্থায় থাকা কোনো ব্যবস্থার তাপমাত্রা পরিবর্তন করলে সাম্যাবস্থা এমন দিকে সরে যায় যাতে ঐ পরিবর্তনের ফল প্রশমিত হয়।\n• তাপমাত্রা বৃদ্ধি করলে: অতিরিক্ত তাপ শোষণের জন্য সাম্যাবস্থা তাপহারী দিকে অর্থাৎ ডান দিকে সরে যায়। ফলে NO এর উৎপাদন বৃদ্ধি পায়।\n• তাপমাত্রা হ্রাস করলে: তাপ উৎপাদনের জন্য সাম্যাবস্থা তাপোৎপাদী দিকে অর্থাৎ বাম দিকে সরে যায়। ফলে NO বিয়োজিত হয়ে N₂ ও O₂ এর পরিমাণ বৃদ্ধি পায়। সুতরাং (i) নং বিক্রিয়ায় অধিক NO উৎপাদনের জন্য উচ্চ তাপমাত্রা অনুকূল । এজন্য বজ্রপাতের সময় উচ্চ তাপমাত্রায় বায়ুর N₂ ও O₂ যুক্ত হয়ে NO উৎপন্ন হয়।"},{"label":"ঘ","question":"উদ্দীপকের (ii) নং বিক্রিয়াটিতে জারণ-বিজারণ একই সাথে ঘটে— বিশ্লেষণ করো।","answer":"উদ্দীপকের (ii) নং বিক্রিয়াটির সমতাকৃত রূপ:\n2Na+2HNO₃→2NaNO₃+H₂\nইলেকট্রন ত্যাগ জারণ এবং ইলেকট্রন গ্রহণ বিজারণ। বিক্রিয়াটিকে আয়নিক রূপে লিখে পাই:\n2Na+2H⁺+2NO₃⁻→2Na⁺+2NO₃⁻+H₂\nNO₃⁻ আয়ন অপরিবর্তিত থাকে। তাই নিট বিক্রিয়াকে দুটি অর্ধবিক্রিয়ায় লেখা যায়:\nজারণ অর্ধবিক্রিয়া\n2Na→2Na⁺+2e⁻\nএখানে Na ইলেকট্রন ত্যাগ করে Na⁺ আয়নে পরিণত হয়েছে; Na এর জারণ সংখ্যা 0 থেকে +1 এ বৃদ্ধি পেয়েছে । তাই Na জারিত হয়েছে এবং এটি বিজারক।\nবিজারণ অর্ধবিক্রিয়া\n2H⁺+2e⁻→H₂\nএখানে H⁺ আয়ন ইলেকট্রন গ্রহণ করে H₂ অণুতে পরিণত হয়েছে; H এর জারণ সংখ্যা +1 থেকে 0 তে হ্রাস পেয়েছে । তাই H⁺ বিজারিত হয়েছে এবং HNO₃ জারক। মোট রেডক্স বিক্রিয়া\n2Na+2H⁺→2Na⁺+H₂\nNa যে 2টি ইলেকট্রন ত্যাগ করে, সেই 2টি ইলেকট্রনই H⁺ আয়ন গ্রহণ করে । ইলেকট্রন ত্যাগ ও গ্রহণ একই সাথে না ঘটলে বিক্রিয়াটি সম্পন্ন হতে পারত না। সুতরাং উদ্দীপকের (ii) নং বিক্রিয়ায় জারণ ও বিজারণ একই সাথে ঘটে, অর্থাৎ এটি একটি রেডক্স বিক্রিয়া ।"}]},{"id":"ch7-cq11","chapter":7,"num":11,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","board":"কুমিল্লা বোর্ড ২০২৩","stem":"(ii)Mg+H₂SO₄→MgSO₄+Y","diagramId":"ch7-cq11","subQuestions":[{"label":"ক","question":"নিঃসরণ কাকে বলে?","answer":"সরু ছিদ্রপথে কোনো গ্যাসের অণুসমূহ উচ্চ চাপ থেকে নিম্ন চাপ অঞ্চলে বেরিয়ে আসার প্রক্রিয়াকে নিঃসরণ বলে ।"},{"label":"খ","question":"পরমাণু সামগ্রিকভাবে চার্জ শূন্য কেন? ব্যাখ্যা কর।","answer":"পরমাণুতে ধনাত্মক চার্জযুক্ত প্রোটন এবং ঋণাত্মক চার্জযুক্ত ইলেকট্রন থাকে; নিউট্রন চার্জবিহীন । একটি প্রোটনের চার্জ +1 এবং একটি ইলেকট্রনের চার্জ -1, অর্থাৎ মান সমান কিন্তু বিপরীত। প্রতিটি পরমাণুতে প্রোটন সংখ্যা ও ইলেকট্রন সংখ্যা সমান থাকে । ফলে মোট ধনাত্মক চার্জ ও মোট ঋণাত্মক চার্জ পরস্পরকে নিষ্ক্রিয় করে। যেমন: Na পরমাণুতে 11টি প্রোটন (+11) ও 11টি ইলেকট্রন (-11)। তাই পরমাণু সামগ্রিকভাবে চার্জ শূন্য।"},{"label":"গ","question":"উদ্দীপকের (ii) নং বিক্রিয়াটি যুগপৎভাবে সংঘটিত হয়–ব্যাখ্যা কর।","answer":"উদ্দীপকের (ii) নং বিক্রিয়া:\nMg+H₂SO₄→MgSO₄+H₂\nঅর্থাৎ Y হলো হাইড্রোজেন (H₂) গ্যাস। আয়নিক রূপে লিখলে:\nMg+(2H⁺+SO₄²⁻)→(Mg²⁺+SO₄²⁻)+H₂\nজারণ অর্ধ-বিক্রিয়া: Mg পরমাণু 2টি ইলেকট্রন ত্যাগ করে Mg²⁺ আয়ন হয় (জারণ সংখ্যা 0 থেকে +2)।\nMg→Mg²⁺+2e⁻\nবিজারণ অর্ধ-বিক্রিয়া: 2টি H⁺ আয়ন ঐ 2টি ইলেকট্রন গ্রহণ করে H₂ অণু হয় (জারণ সংখ্যা +1 থেকে 0)।\n2H⁺+2e⁻→H₂\nMg যে ইলেকট্রন ত্যাগ করে, H⁺ আয়ন ঠিক সেই ইলেকট্রনই গ্রহণ করে। ইলেকট্রন ত্যাগ (জারণ) ও ইলেকট্রন গ্রহণ (বিজারণ) একটি ছাড়া অন্যটি ঘটতে পারে না। সুতরাং (ii) নং বিক্রিয়াটি একটি জারণ-বিজারণ বিক্রিয়া, যেখানে জারণ ও বিজারণ যুগপৎভাবে সংঘটিত হয়।"},{"label":"ঘ","question":"'X' ও 'Y' গ্যাস দুটির মধ্যে কোনটি দ্রুত ছড়িয়ে পড়বে? গাণিতিকভাবে বিশ্লেষণ কর।","answer":"X গ্যাস শনাক্তকরণ: কাপড় কাচা সোডা হলো সোডিয়াম কার্বনেট (Na₂CO₃) এবং ভিনেগার হলো ইথানয়িক এসিড (CH₃COOH) এর লঘু জলীয় দ্রবণ । এরা বিক্রিয়া করে CO₂ গ্যাস উৎপন্ন করে ।\nNa₂CO₃+2CH₃COOH→2CH₃COONa+CO₂+H₂O\nসুতরাং X = কার্বন ডাইঅক্সাইড (CO₂)।\nY গ্যাস শনাক্তকরণ: (ii) নং বিক্রিয়া অনুযায়ী Mg+H₂SO₄→\nMgSO₄+H₂, সুতরাং Y = হাইড্রোজেন (H₂)।\nগাণিতিক বিশ্লেষণ: একই তাপমাত্রা ও চাপে গ্যাসের ব্যাপন হার আণবিক ভরের বর্গমূলের ব্যস্তানুপাতিক । r ∝ 1/√M, অতএব r(H2)/r(CO2) = √(M(CO₂)/M(H₂)) আমরা জানি, C = 12, O = 16, H = 1 M(CO₂)=12+16×2=44 M(H₂)=1×2=2 r(H2)/r(CO2) = √44/2 = √22 ≈ 4.69 বা, r(H2) ≈ 4.69 × r(CO2) অর্থাৎ H₂ গ্যাসের আণবিক ভর CO₂ অপেক্ষা অনেক কম হওয়ায় H₂ এর ব্যাপন হার CO₂ এর প্রায় 4.69 গুণ। সুতরাং X (CO₂) ও Y (H₂) গ্যাসের মধ্যে Y অর্থাৎ H₂ গ্যাস দ্রুত ছড়িয়ে পড়বে।"}]},{"id":"ch7-cq12","chapter":7,"num":12,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","board":"ঢাকা বোর্ড ২০২৪","stem":"(i)Na+O₂→Na₂O\n(ii) HNO₃+Mg(OH)₂ →\n(iii) FeSO₄ + NaOH →","subQuestions":[{"label":"ক","question":"ফিটকিরির সংকেত লেখ।","answer":"ফিটকিরির সংকেত: K₂SO₄·Al₂(SO₄)₃·24H₂O"},{"label":"খ","question":"কর্পূর ঊর্ধ্বপাতিত পদার্থ —ব্যাখ্যা কর।","answer":"যে প্রক্রিয়ায় কোনো কঠিন পদার্থকে তাপ দিলে তা তরলে পরিণত না হয়ে সরাসরি বাষ্পে পরিণত হয় এবং বাষ্পকে ঠান্ডা করলে আবার সরাসরি কঠিনে পরিণত হয়, তাকে ঊর্ধ্বপাতন বলে। কর্পূরকে\nতাপ দিলে তা না গলে সরাসরি বাষ্পে পরিণত হয় এবং ঠান্ডা করলে আবার কঠিন কর্পূর পাওয়া যায়। কর্পূর (কঠিন) \u003c=(তাপ / ঠান্ডা)=\u003e কর্পূর (বাষ্প) তাই কর্পূর একটি ঊর্ধ্বপাতিত পদার্থ ।"},{"label":"গ","question":"(i) নং সমীকরণটি রেডক্স বিক্রিয়া —সমীকরণসহ ব্যাখ্যা কর।","answer":"উদ্দীপকের (i) নং সমীকরণের সমতাকৃত রূপ:\n4Na+O₂→2Na₂O\nNa₂O একটি আয়নিক যৌগ (2Na⁺+O²⁻)। আয়নিক রূপে লিখলে:\n4Na+O₂→2(2Na⁺+O²⁻)\nজারণ অর্ধ-বিক্রিয়া: প্রতিটি Na পরমাণু 1টি ইলেকট্রন ত্যাগ করে Na⁺ আয়ন হয় (জারণ সংখ্যা 0 থেকে +1)।\n4Na→4Na⁺+4e⁻\nবিজারণ অর্ধ-বিক্রিয়া: O₂ অণুর প্রতিটি O পরমাণু 2টি করে মোট 4টি ইলেকট্রন গ্রহণ করে 2টি O²⁻ আয়ন হয় (জারণ সংখ্যা 0 থেকে -2)।\nO₂+4e⁻→2O²⁻\nএখানে Na বিজারক হিসেবে জারিত হয় এবং O₂ জারক হিসেবে বিজারিত হয়। ইলেকট্রনের আদান-প্রদানের মাধ্যমে জারণ ও বিজারণ একই সাথে ঘটে। সুতরাং (i) নং বিক্রিয়াটি একটি রেডক্স বিক্রিয়া (সংযোজন বিক্রিয়াও বটে)।"},{"label":"ঘ","question":"(ii) ও (iii) বিক্রিয়া একই ধরনের কিনা? সমীকরণ সম্পূর্ণকরণসহ ব্যাখ্যা কর।","answer":"(ii) নং বিক্রিয়া সম্পূর্ণ করে:\n2HNO₃+Mg(OH)₂→Mg(NO₃)₂+2H₂O\nএখানে এসিড (HNO₃) ও ক্ষার (Mg(OH)₂) বিক্রিয়া করে লবণ ও পানি উৎপন্ন করে । এটি একটি প্রশমন বিক্রিয়া । এসিডের H⁺ ও ক্ষারের OH⁻ যুক্ত হয়ে পানি তৈরি করে।\nH⁺+OH⁻→H₂O\n(iii) নং বিক্রিয়া সম্পূর্ণ করে:\nFeSO4(aq)+2NaOH(aq)→Fe(OH)₂(s)+Na2SO4(aq)\nএখানে দুটি দ্রবণীয় লবণ ও ক্ষার বিক্রিয়া করে অদ্রবণীয় সবুজ বর্ণের Fe(OH)₂ অধঃক্ষেপ তৈরি করে। এটি একটি অধঃক্ষেপণ বিক্রিয়া ।\nFe²⁺+2OH⁻→Fe(OH)₂(s)\nমিল: উভয় বিক্রিয়ায় বিক্রিয়কের আয়নগুলো পরস্পর স্থান বিনিময় করে এবং কোনো মৌলের জারণ সংখ্যার পরিবর্তন হয় না (Mg +2, N +5, Fe +2, S +6, Na +1 অপরিবর্তিত)। অর্থাৎ উভয়ই নন-রেডক্স বিক্রিয়া । অমিল: (ii) নং বিক্রিয়ায় এসিড ও ক্ষার প্রশমিত হয়ে লবণ ও পানি তৈরি হয় এবং তাপ উৎপন্ন হয়, কোনো অধঃক্ষেপ পড়ে না। কিন্তু (iii) নং বিক্রিয়ায় এসিড-ক্ষার প্রশমন নয়, বরং দ্রবণ থেকে অদ্রবণীয় অধঃক্ষেপ সৃষ্টি হয়। সুতরাং (ii) ও (iii) উভয়ই নন-রেডক্স বিক্রিয়া হলেও একই ধরনের নয় — (ii) নং প্রশমন বিক্রিয়া এবং (iii) নং অধঃক্ষেপণ বিক্রিয়া ।"}]},{"id":"ch7-cq13","chapter":7,"num":13,"importance":2,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","board":"ময়মনসিংহ বোর্ড ২০২৪","stem":"Na+H₂SO₄→X+H₂","subQuestions":[{"label":"ক","question":"উভমুখী বিক্রিয়া কাকে বলে?","answer":"যে বিক্রিয়া একই সময়ে একই শর্তে সম্মুখ ও বিপরীত উভয় দিকে ঘটে, অর্থাৎ বিক্রিয়ক থেকে উৎপাদ এবং উৎপাদ থেকে আবার বিক্রিয়ক তৈরি হয়, তাকে উভমুখী বিক্রিয়া বলে। যেমন: N₂+\n3H₂⇌2NH₃"},{"label":"খ","question":"\"নাইট্রোজেনের আণবিক ভর 28\" -ব্যাখ্যা কর।","answer":"কোনো পদার্থের একটি অণুতে উপস্থিত সকল পরমাণুর পারমাণবিক ভরের যোগফলকে ঐ পদার্থের আণবিক ভর বলে। নাইট্রোজেনের পারমাণবিক ভর 14 এবং একটি নাইট্রোজেন অণুতে (N₂) দুটি পরমাণু থাকে। N₂ এর আণবিক ভর =14×2=28 অর্থাৎ একটি নাইট্রোজেন অণুর ভর একটি C-12 আইসোটোপের ভরের 1/12 অংশের 28 গুণ। তাই নাইট্রোজেনের আণবিক ভর 28।"},{"label":"গ","question":"উদ্দীপকের X-যৌগে সালফারের জারণ মান নির্ণয় কর।","answer":"উদ্দীপকের বিক্রিয়াটি সম্পূর্ণ করে লিখলে:\n2Na+H₂SO₄→Na₂SO₄+H₂\nঅতএব, X হলো সোডিয়াম সালফেট (Na₂SO₄)।\nধরি, Na₂SO₄ যৌগে S এর জারণ মান = x। Na এর জারণ মান = +1 এবং O এর জারণ মান = -2। নিরপেক্ষ যৌগে সকল পরমাণুর জারণ মানের যোগফল শূন্য। (+1)×2+x+(-2)×4=0 বা, 2+x-8=0 বা, x=+6 সুতরাং X যৌগে (Na₂SO₄) সালফারের জারণ মান +6।"},{"label":"ঘ","question":"উদ্দীপকের বিক্রিয়াটিতে সমীকরণসহ বিশ্লেষণ কর- \"জারণ ছাড়া বিজারণ বিক্রিয়া সংঘটিত হয়নি\"।","answer":"উদ্দীপকের বিক্রিয়াটি:\n2Na+H₂SO₄→Na₂SO₄+H₂\nআয়নিক রূপে লিখলে:\n2Na+2H⁺+SO₄²⁻→2Na⁺+SO₄²⁻+H₂\nSO₄²⁻ আয়ন উভয় পাশে অপরিবর্তিত থাকে। তাই প্রকৃত বিক্রিয়া:\n2Na+2H⁺→2Na⁺+H₂\nজারণ অর্ধ-বিক্রিয়া: 2Na→2Na⁺+2e⁻(Na এর জারণ সংখ্যা 0\nথেকে +1)\nবিজারণ অর্ধ-বিক্রিয়া: 2H⁺+2e⁻→H₂(H এর জারণ সংখ্যা +1\nথেকে 0) এখানে সোডিয়াম পরমাণু যে দুটি ইলেকট্রন ত্যাগ করেছে, সেই দুটি ইলেকট্রনই H⁺ আয়ন গ্রহণ করে H₂ গ্যাসে বিজারিত হয়েছে । Na ইলেকট্রন ত্যাগ না করলে H⁺ আয়ন ইলেকট্রন পেত না, ফলে বিজারণ ঘটত না। এ বিক্রিয়ায় Na বিজারক এবং H₂SO₄ (H⁺) জারক। সুতরাং উদ্দীপকের বিক্রিয়ায় জারণ ও বিজারণ একই সাথে ঘটেছে; জারণ ছাড়া বিজারণ বিক্রিয়া সংঘটিত হয়নি ।"}]},{"id":"ch7-cq14","chapter":7,"num":14,"importance":2,"topic":"বিশেষ ধরনের রাসায়নিক বিক্রিয়া","board":"চট্টগ্রাম বোর্ড ২০২৩","stem":"(i)FeCl₃+H₂S→FeCl₂+HCl+S\n(ii)","diagramId":"ch7-cq14","subQuestions":[{"label":"ক","question":"প্রশমন তাপ কাকে বলে?","answer":"ক্ষার ও এসিডের লঘু দ্রবণের প্রশমনে 1 মোল পানি উৎপন্ন হলে যে পরিমাণ তাপ উৎপন্ন হয় তাকে প্রশমন তাপ বলে।"},{"label":"খ","question":"মৌমাছির কামড়ে ক্ষতস্থানে চুন লাগানো হয় কেন?","answer":"মৌমাছির হুলে এসিডধর্মী পদার্থ (ফরমিক এসিড) থাকে, যা ক্ষতস্থানে জ্বালাপোড়া সৃষ্টি করে। চুন (CaO) একটি ক্ষারক; এটি পানির সাথে Ca(OH)₂ তৈরি করে। এই ক্ষারক এসিডকে প্রশমিত করে লবণ ও পানি উৎপন্ন করে, ফলে জ্বালাপোড়া কমে যায়। তাই মৌমাছির কামড়ে ক্ষতস্থানে চুন লাগানো হয়।"},{"label":"গ","question":"উদ্দীপকের (i) নং বিক্রিয়াটি ইলেকট্রন স্থানান্তরের মাধ্যমে ব্যাখ্যা দাও।","answer":"উদ্দীপকের (i) নং বিক্রিয়ার সমতাকৃত রূপ:\n2FeCl₃+H₂S→2FeCl₂+2HCl+S\nআয়নিক রূপ:\n(2Fe³⁺+6Cl⁻)+(2H⁺+S²⁻)\n→(2Fe²⁺+4Cl⁻)+(2H⁺+2Cl⁻)+S\nজারণ অর্ধ-বিক্রিয়া:\nS²⁻→S+2e⁻\nবিজারণ অর্ধ-বিক্রিয়া:\n2Fe³⁺+2e⁻→2Fe²⁺\nএখানে S²⁻ আয়ন দুটি ইলেকট্রন ত্যাগ করে S এ জারিত হয় এবং সেই দুটি ইলেকট্রন 2টি Fe³⁺ আয়ন গ্রহণ করে 2Fe²⁺ এ বিজারিত হয়। H⁺ ও Cl⁻ আয়ন অপরিবর্তিত থাকে। সুতরাং (i) নং বিক্রিয়ায় S²⁻ থেকে Fe³⁺ এ ইলেকট্রন স্থানান্তর ঘটে; H₂S বিজারক ও FeCl₃ জারক হিসেবে কাজ করে।"},{"label":"ঘ","question":"উদ্দীপকের (ii) নং এর বিক্রিয়াটি কোন কোন রাসায়নিক বিক্রিয়াকে সমর্থন করে? বিশ্লেষণ কর।","answer":"উদ্দীপকের (ii) নং এ পানিতে AlCl₃ যোগ করা হলে নিচের বিক্রিয়া ঘটে:\nAlCl3(s)+3H₂O(l)→Al(OH)₃(s)+3HCl(aq)\nআর্দ্র বিশ্লেষণ: এখানে পানি বিক্রিয়ক হিসেবে AlCl₃ এর সাথে বিক্রিয়া করে দুটি নতুন উৎপাদ Al(OH)₃ ও HCl উৎপন্ন করেছে। পানি অন্য যৌগের সাথে বিক্রিয়া করে উৎপাদ তৈরি করলে তা আর্দ্র বিশ্লেষণ বা পানি বিশ্লেষণ বিক্রিয়া । অধঃক্ষেপণ: উৎপন্ন HCl পানিতে দ্রবীভূত থাকে, কিন্তু Al(OH)₃ পানিতে অদ্রবণীয় হওয়ায় সাদা অধঃক্ষেপ হিসেবে পাত্রের তলায় জমা হয়। তাই এটি অধঃক্ষেপণ বিক্রিয়াও । নন-রেডক্স: বিক্রিয়ার আগে ও পরে Al এর জারণ সংখ্যা +3 এবং Cl এর −1 অপরিবর্তিত থাকে, তাই এটি জারণ-বিজারণ নয়। সুতরাং (ii) নং বিক্রিয়াটি একই সাথে আর্দ্র বিশ্লেষণ (পানি বিশ্লেষণ) ও অধঃক্ষেপণ বিক্রিয়াকে সমর্থন করে।"}]},{"id":"ch7-cq15","chapter":7,"num":15,"importance":3,"topic":"বিক্রিয়ার গতিবেগ বা বিক্রিয়ার হার","board":"চট্টগ্রাম বোর্ড ২০২৬","stem":"(i)4Al(s)+3O₂(g)→2Al₂O₃(s)\n(ii)CH₄(g)+2O₂(g)→CO₂(g)+2H₂O(g); ΔH = -890\nkJ","subQuestions":[{"label":"ক","question":"তাপহারি বিক্রিয়া কাকে বলে?","answer":"তাপহারি বিক্রিয়া: যে রাসায়নিক বিক্রিয়ায় তাপ শোষিত হয় অর্থাৎ\nΔH ধনাত্মক হয়, তাকে তাপহারি বিক্রিয়া বলে। যেমন: N₂+O₂→\n2NO; ΔH=+180kJ।"},{"label":"খ","question":"পলিথিন হলো ইথিলিনের পলিমার — ব্যাখ্যা কর।","answer":"উচ্চ চাপে (1000 atm) ও উচ্চ তাপমাত্রায় (200°C) সামান্য অক্সিজেন বা প্রভাবকের উপস্থিতিতে অসংখ্য ইথিলিন (CH₂=CH₂) অণু পরস্পর যুক্ত হয়ে বৃহৎ অণু পলিথিন গঠন করে। 1000 atm, 200°C\nnCH₂=CH₂⟶-(CH₂-CH₂)n-\nএখানে ইথিলিন হলো মনোমার এবং এর পুনরাবৃত্তিক একক -CH₂-CH₂- দ্বারা পলিথিন গঠিত । তাই পলিথিন হলো ইথিলিনের পলিমার ।"},{"label":"গ","question":"(i) নং বিক্রিয়াটিতে কীভাবে ইলেকট্রনের স্থানান্তর ঘটে —ব্যাখ্যা কর।","answer":"(i) নং বিক্রিয়াটি একটি জারণ-বিজারণ বিক্রিয়া । এতে Al ধাতু ইলেকট্রন ত্যাগ করে এবং O₂ সেই ইলেকট্রন গ্রহণ করে। Al (13) : 1s² 2s² 2p⁶ 3s² 3p¹ O (8) : 1s² 2s² 2p⁴\nজারণ অর্ধবিক্রিয়া: প্রতিটি Al পরমাণু 3টি ইলেকট্রন ত্যাগ করে Al³⁺ আয়নে পরিণত হয়।\n4Al→4Al³⁺+12e⁻\nবিজারণ অর্ধবিক্রিয়া: প্রতিটি O পরমাণু 2টি ইলেকট্রন গ্রহণ করে O²⁻ আয়নে পরিণত হয়।\n3O₂+12e⁻→6O²⁻\nউভয় অর্ধবিক্রিয়া যোগ করে,\n4Al³⁺+6O²⁻→2Al₂O₃\n4Al(s)+3O₂(g)→2Al₂O₃(s)\nঅর্থাৎ 4টি Al পরমাণু থেকে মোট 12টি ইলেকট্রন 6টি O পরমাণুতে স্থানান্তরিত হয়। Al এর জারণ সংখ্যা 0 থেকে +3 (জারিত, বিজারক) এবং O এর জারণ সংখ্যা 0 থেকে -2 (বিজারিত, জারক) হয়। এভাবে (i) নং বিক্রিয়ায় Al থেকে O তে ইলেকট্রন স্থানান্তর ঘটে।"},{"label":"ঘ","question":"(ii) নং বিক্রিয়ার সাম্যাবস্থায় তাপ ও চাপের প্রভাব বিশ্লেষণ কর।","answer":"(ii) নং বিক্রিয়া: CH₄(g)+2O₂(g)⇌CO₂(g)+2H₂O(g);\nΔH = -890 kJ লা-শাতেলিয়ারের নীতি অনুসারে সাম্যাবস্থায় থাকা কোনো ব্যবস্থার তাপমাত্রা, চাপ বা ঘনমাত্রা পরিবর্তন করলে সাম্যাবস্থা এমন দিকে সরে যায় যাতে ঐ পরিবর্তনের ফল প্রশমিত হয়।\nতাপের প্রভাব বিক্রিয়াটির ΔH ঋণাত্মক, অর্থাৎ সম্মুখমুখী বিক্রিয়া তাপউৎপাদী এবং পশ্চাৎমুখী বিক্রিয়া তাপহারি ।\n• তাপমাত্রা বৃদ্ধি করলে সাম্যাবস্থা তাপ শোষণের দিকে অর্থাৎ বাম দিকে (পশ্চাৎমুখী) সরে যায়; ফলে CO₂ ও H₂O এর পরিমাণ কমে।\n• তাপমাত্রা হ্রাস করলে সাম্যাবস্থা তাপ উৎপাদনের দিকে অর্থাৎ ডান দিকে (সম্মুখমুখী) সরে যায়; ফলে উৎপাদের পরিমাণ বাড়ে ।\nচাপের প্রভাব বিক্রিয়কের গ্যাসীয় মোল সংখ্যা =1+2=3 উৎপাদের গ্যাসীয় মোল সংখ্যা =1+2=3 উভয় দিকে গ্যাসীয় অণুর মোল সংখ্যা সমান (Δn = 0) হওয়ায় চাপ বাড়ালে বা কমালে কোনো দিকেই আয়তন কমে বা বাড়ে না। তাই এ বিক্রিয়ার সাম্যাবস্থার উপর চাপের কোনো প্রভাব নেই। সুতরাং (ii) নং বিক্রিয়ার সাম্যাবস্থায় নিম্ন তাপমাত্রা উৎপাদ গঠনের অনুকূল এবং উচ্চ তাপমাত্রা প্রতিকূল; কিন্তু চাপের পরিবর্তনে সাম্যাবস্থার কোনো পরিবর্তন হয় না।"}]},{"id":"ch7-cq16","chapter":7,"num":16,"importance":3,"topic":"বিক্রিয়ার গতিবেগ বা বিক্রিয়ার হার","board":"ময়মনসিংহ বোর্ড ২০২৬","stem":"(i) N₂O₄(g) + তাপ ⇌ 2NO₂(g)\n(ii)2FeCl₃+H₂S→2FeCl₂+2HCl+S","subQuestions":[{"label":"ক","question":"ভ্যান্ডার ওয়ালস আকর্ষণ বল কাকে বলে?","answer":"ভ্যান্ডার ওয়ালস আকর্ষণ বল: সমযোজী অণুসমূহের মধ্যে বিদ্যমান দুর্বল আন্তঃআণবিক আকর্ষণ বলকে ভ্যান্ডার ওয়ালস আকর্ষণ বল বলে।"},{"label":"খ","question":"আর্দ্র বিশ্লেষণ বিক্রিয়া বলতে কী বোঝ? ব্যাখ্যা কর।","answer":"যে বিক্রিয়ায় কোনো যৌগ পানির সাথে বিক্রিয়া করে বিয়োজিত হয়ে দুই বা ততোধিক নতুন যৌগ উৎপন্ন করে, তাকে আর্দ্র বিশ্লেষণ বা পানি বিশ্লেষণ বিক্রিয়া বলে। এ বিক্রিয়ায় পানির অণু H⁺ ও OH⁻ এ ভেঙে যৌগের বিভিন্ন অংশের সাথে যুক্ত হয়। যেমন: অ্যালুমিনিয়াম ক্লোরাইডকে পানিতে যোগ করলে অ্যালুমিনিয়াম হাইড্রক্সাইড ও হাইড্রোক্লোরিক এসিড উৎপন্ন হয়:\nAlCl₃+3H₂O→Al(OH)₃+3HCl"},{"label":"গ","question":"(ii) বিক্রিয়ায় কোনটি বিজারক পদার্থ? ব্যাখ্যা কর।","answer":"যে পদার্থ ইলেকট্রন ত্যাগ করে নিজে জারিত হয় এবং অপর পদার্থকে বিজারিত করে, তাকে বিজারক বলে।\n2FeCl₃+H₂S→2FeCl₂+2HCl+S\nজারণসংখ্যা বিশ্লেষণ: FeCl₃ এ Fe এর জারণসংখ্যা +3 এবং FeCl₂ এ +2; অর্থাৎ Fe³⁺ ইলেকট্রন গ্রহণ করে বিজারিত হয়েছে । আবার H₂S এ S এর জারণসংখ্যা -2 এবং মুক্ত S এ 0; অর্থাৎ S এর জারণসংখ্যা বৃদ্ধি পেয়েছে ।\nজারণ: S²⁻→S+2e⁻\nবিজারণ: 2Fe³⁺+2e⁻→2Fe²⁺\nএখানে H₂S ইলেকট্রন ত্যাগ করে নিজে জারিত হয়েছে এবং FeCl₃ কে বিজারিত করে FeCl₂ এ পরিণত করেছে। সুতরাং (ii) বিক্রিয়ায় H₂S বিজারক পদার্থ (এবং FeCl₃ জারক পদার্থ)।"},{"label":"ঘ","question":"(i) নং বিক্রিয়ায় কীভাবে উৎপাদ বৃদ্ধি করা যায় তা লা- শাতেলিয়ার নীতির আলোকে বিশ্লেষণ কর।","answer":"লা-শাতেলিয়ার নীতি: সাম্যাবস্থায় থাকা কোনো উভমুখী বিক্রিয়ার তাপমাত্রা, চাপ বা ঘনমাত্রার কোনো একটির পরিবর্তন ঘটালে সাম্যাবস্থা এমন দিকে সরে যায় যাতে ঐ পরিবর্তনের ফল প্রশমিত হয়।\nN₂O₄(g) + তাপ ⇌ 2NO₂(g)\nতাপমাত্রার প্রভাব বিক্রিয়াটির সম্মুখমুখী দিক তাপহারী (তাপ শোষিত হয়)। তাপমাত্রা বৃদ্ধি করলে সাম্যাবস্থা সেই দিকে সরে যাবে যেদিকে তাপ শোষিত হয়, অর্থাৎ সম্মুখ দিকে। ফলে NO₂ এর উৎপাদন বৃদ্ধি পাবে ।\nচাপের প্রভাব বিক্রিয়ক দিকে গ্যাসের মোল সংখ্যা 1 এবং উৎপাদ দিকে 2। চাপ কমালে সাম্যাবস্থা সেই দিকে সরে যায় যেদিকে মোল সংখ্যা তথা আয়তন বেশি, অর্থাৎ সম্মুখ দিকে। ফলে চাপ হ্রাস করলে NO₂ এর উৎপাদন বৃদ্ধি পাবে । ঘনমাত্রার প্রভাব বিক্রিয়ক N₂O₄ এর ঘনমাত্রা বৃদ্ধি করলে অথবা উৎপন্ন NO₂ কে বিক্রিয়া মিশ্রণ থেকে সরিয়ে নিলে সাম্যাবস্থা সম্মুখ দিকে সরে যায় এবং NO₂ এর উৎপাদন বৃদ্ধি পায়। অতএব, লা-শাতেলিয়ার নীতি অনুসারে তাপমাত্রা বৃদ্ধি, চাপ হ্রাস, N₂O₄ এর ঘনমাত্রা বৃদ্ধি ও উৎপন্ন NO₂ অপসারণের মাধ্যমে (i) নং বিক্রিয়ায় উৎপাদ বৃদ্ধি করা যায়।"}]},{"id":"ch7-cq17","chapter":7,"num":17,"importance":3,"topic":"বিক্রিয়ার গতিবেগ বা বিক্রিয়ার হার","board":"রাজশাহী বোর্ড ২০২৫","stem":"(i)Fe+CuSO₄→FeSO₄+Cu.\n(ii)N₂(g)+3H₂(g)⇌(Fe)2NH₃(g); ΔH = -92 kJ.","subQuestions":[{"label":"ক","question":"আইসোটোপ কাকে বলে?","answer":"যেসব পরমাণুর প্রোটন সংখ্যা সমান কিন্তু ভরসংখ্যা ভিন্ন, তাদেরকে পরস্পরের আইসোটোপ বলে। যেমন: 6C₁₂, 6C₁₃, 6C₁₄।"},{"label":"খ","question":"শুষ্ক কোষে MnO₂ ব্যবহার করা হয় কেন? ব্যাখ্যা কর।","answer":"শুষ্ক কোষে কার্বন দণ্ড (ক্যাথোড) এর চারপাশে MnO₂ থাকে। কোষ চালু থাকলে ক্যাথোডে NH₄⁺ আয়ন বিজারিত হয়ে H₂ গ্যাস তৈরি হতে পারে, যা কার্বন দণ্ডের চারপাশে জমে কোষের বিভব কমিয়ে দেয় (পোলারায়ন)। MnO₂ জারক হিসেবে কাজ করে ঐ হাইড্রোজেনকে জারিত করে পানিতে পরিণত করে এবং নিজে বিজারিত হয়ে Mn₂O₃ হয়।\n2MnO₂+2NH₄⁺+2e⁻→Mn₂O₃+2NH₃+H₂O\nতাই পোলারায়ন রোধ করে কোষকে সচল রাখতে শুষ্ক কোষে MnO₂ (বিপোলারক) ব্যবহার করা হয়।"},{"label":"গ","question":"উদ্দীপকের (i) নং বিক্রিয়াটি জারণ-বিজারণ বিক্রিয়া-ব্যাখ্যা কর।","answer":"উদ্দীপকের (i) নং বিক্রিয়া:\nFe+CuSO₄→FeSO₄+Cu\nআয়নিক রূপে লিখলে:\nFe+(Cu²⁺+SO₄²⁻)→(Fe²⁺+SO₄²⁻)+Cu\nSO₄²⁻ আয়ন অপরিবর্তিত থাকে। Fe ও Cu²⁺ এর মধ্যে ইলেকট্রনের আদান-প্রদান ঘটে।\nজারণ অর্ধ-বিক্রিয়া: Fe পরমাণু 2টি ইলেকট্রন ত্যাগ করে Fe²⁺ আয়ন হয়। জারণ সংখ্যা 0 থেকে +2 হয়।\nFe→Fe²⁺+2e⁻\nবিজারণ অর্ধ-বিক্রিয়া: Cu²⁺ আয়ন 2টি ইলেকট্রন গ্রহণ করে Cu পরমাণু হয়। জারণ সংখ্যা +2 থেকে 0 হয়।\nCu²⁺+2e⁻→Cu\nএখানে Fe বিজারক এবং Cu²⁺ জারক। একই সাথে জারণ ও বিজারণ ঘটে এবং ইলেকট্রনের আদান-প্রদান হয়। সুতরাং (i) নং বিক্রিয়াটি একটি জারণ-বিজারণ (রেডক্স) বিক্রিয়া ।"},{"label":"ঘ","question":"(ii) নং বিক্রিয়ার উপর তাপমাত্রা ও চাপের প্রভাব বিশ্লেষণ কর।","answer":"উদ্দীপকের (ii) নং বিক্রিয়া:\nN₂(g)+3H₂(g) \u003c=(Fe)=\u003e 2NH₃(g); ΔH = -92 kJ তাপমাত্রার প্রভাব: ΔH ঋণাত্মক, অর্থাৎ সম্মুখমুখী বিক্রিয়াটি\nতাপোৎপাদী এবং পশ্চাৎমুখী বিক্রিয়াটি তাপহারী। লা-শাতেলিয়ার নীতি অনুসারে তাপমাত্রা বৃদ্ধি করলে বৃদ্ধিজনিত ফলাফল প্রশমিত করতে তাপহারী (পশ্চাৎমুখী) বিক্রিয়া বৃদ্ধি পায়। ফলে সাম্যাবস্থা বাম দিকে সরে যায় এবং NH₃ ভেঙে N₂ ও H₂ এর পরিমাণ বাড়ে । বিপরীতে তাপমাত্রা হ্রাস করলে সাম্যাবস্থা ডান দিকে সরে এবং NH₃ এর উৎপাদন বাড়ে ।\nচাপের প্রভাব: বিক্রিয়ক পক্ষে গ্যাসের মোট মোল সংখ্যা =1+3=4 এবং উৎপাদ পক্ষে = 2। চাপ বৃদ্ধি করলে লা-শাতেলিয়ার নীতি অনুসারে সাম্যাবস্থা বেশি মোল থেকে কম মোলের দিকে, অর্থাৎ ডান দিকে সরে যায়। ফলে N₂ ও H₂ বিক্রিয়া করে বেশি NH₃ উৎপন্ন হয়।\nচাপ হ্রাস করলে সাম্যাবস্থা বাম দিকে সরে NH₃ এর পরিমাণ কমে। সুতরাং (ii) নং বিক্রিয়ায় নিম্ন তাপমাত্রা ও উচ্চ চাপ NH₃ উৎপাদনের অনুকূল । তবে খুব কম তাপমাত্রায় বিক্রিয়ার হার কমে যায়, তাই বাস্তবে মাঝারি তাপমাত্রা, উচ্চ চাপ ও Fe প্রভাবক ব্যবহার করে NH₃ উৎপাদন করা হয়।"}]},{"id":"ch8-cq1","chapter":8,"num":1,"importance":3,"topic":"রাসায়নিক শক্তি","board":"ময়মনসিংহ বোর্ড ২০২০","stem":"(i)C₃H₈(g)+5O₂(g)→3CO₂(g)+4H₂O(g); ΔH = –\n2280kJ\n(ii)N₂(g)+O₂(g)→2NO(g); ΔH=+180kJ\nBond Bond energy C–C 344kJ/mol C–H 414kJ/mol O–H 464kJ/mol O = O 498kJ/mol","subQuestions":[{"label":"ক","question":"তড়িৎ প্রলেপন কী?","answer":"তড়িৎ বিশ্লেষণের মাধ্যমে একটি ধাতুর উপর অন্য একটি ধাতুর প্রলেপ দেওয়াকে তড়িৎ প্রলেপন বা ইলেকট্রোপ্লেটিং বলে।"},{"label":"খ","question":"H₂S এবং SO₂ এর মধ্যে কোনটির ব্যাপন হার সর্বাধিক এবং কেন?","answer":"গ্রাহামের ব্যাপন সূত্র অনুসারে, গ্যাসের ব্যাপন হার এর আণবিক ভরের বর্গমূলের ব্যস্তানুপাতিক । অর্থাৎ আণবিক ভর যত কম, ব্যাপন হার তত বেশি। H₂S এর আণবিক ভর =(2×1)+32=34 SO₂ এর আণবিক ভর =32+(2×16)=64 H₂S এর আণবিক ভর SO₂ এর চেয়ে কম। তাই H₂S এর ব্যাপন হার সর্বাধিক ।"},{"label":"গ","question":"C = O এর বন্ধনশক্তি হিসাব কর।","answer":"উদ্দীপকের (i) নং বিক্রিয়া:\nC₃H₈(g)+5O₂(g)→3CO₂(g)+4H₂O(g) ; ΔH = -2280 kJ\nগাঠনিক সংকেত অনুযায়ী C₃H₈ (CH₃-CH₂-CH₃) এ 2টি C-C ও 8টি C-H বন্ধন; 5O₂ তে 5টি O=O বন্ধন; 3CO₂ (O=C=O) তে 6টি C=O বন্ধন এবং 4H₂O (H-O-H) তে 8টি O-H বন্ধন আছে।\nধরি, C=O এর বন্ধন শক্তি = x kJ/mol বিক্রিয়কের বন্ধন ভাঙতে প্রয়োজনীয় শক্তি, B₁=(2×344)+ (8×414)+(5×498)=688+3312+2490=6490kJ উৎপাদের বন্ধন গঠনে নির্গত শক্তি, B₂=6x+(8×464)= (6x+3712)kJ ΔH = B₁−B₂ বা, -2280=6490-(6x+3712) বা, 6x+3712=8770 বা, 6x = 5058\n∴ x=843kJ/mol অতএব, C=O এর বন্ধন শক্তি 843 kJ/mol।"},{"label":"ঘ","question":"উদ্দীপকে (i) ও (ii) নং বিক্রিয়া দুটির সাম্যাবস্থায় তাপ ও চাপের প্রভাব ভিন্ন-বিশ্লেষণ কর।","answer":"উদ্দীপকের বিক্রিয়া দুটিকে উভমুখী ধরে লা-শাতেলিয়ার নীতি অনুসারে বিশ্লেষণ করা হলো:\n(i)C₃H₈(g)+5O₂(g)⇌3CO₂(g)+4H₂O(g) ; ΔH = -2280 kJ\n(ii)N₂(g)+O₂(g)⇌2NO(g) ; ΔH=+180kJ\nতাপের প্রভাব: (i) নং বিক্রিয়াটি তাপোৎপাদী । তাপমাত্রা বাড়ালে সিস্টেম বাড়তি তাপ শোষণ করতে তাপহারী পশ্চাৎ বিক্রিয়া বেশি ঘটায়, ফলে সাম্যাবস্থা বামে সরে এবং C₃H₈ ও O₂ এর পরিমাণ বাড়ে । অপরদিকে (ii) নং বিক্রিয়াটি তাপহারী, তাই তাপমাত্রা বাড়ালে সম্মুখ বিক্রিয়া বেশি ঘটে, সাম্যাবস্থা ডানে সরে এবং NO এর উৎপাদন বাড়ে । তাপমাত্রা কমালে উভয় ক্ষেত্রে বিপরীত ঘটনা ঘটে।\nচাপের প্রভাব: (i) নং বিক্রিয়ায় বিক্রিয়ক পক্ষে গ্যাসীয় মোল =1+ 5=6 এবং উৎপাদ পক্ষে =3+4=7। চাপ বাড়ালে সাম্যাবস্থা কম মোলের দিকে অর্থাৎ বামে সরে; চাপ কমালে বেশি মোলের দিকে অর্থাৎ ডানে সরে। কিন্তু (ii) নং বিক্রিয়ায় উভয় পক্ষে মোল সংখ্যা সমান (2 = 2), তাই চাপের কোনো প্রভাব নেই। সুতরাং, তাপমাত্রা বৃদ্ধিতে (i) নং এর সাম্যাবস্থা বামে কিন্তু (ii) নং এর ডানে সরে; আবার চাপ পরিবর্তন (i) নং কে প্রভাবিত করলেও (ii) নং কে করে না। অর্থাৎ বিক্রিয়া দুটির সাম্যাবস্থায় তাপ ও চাপের প্রভাব ভিন্ন।"}]},{"id":"ch8-cq2","chapter":8,"num":2,"importance":3,"topic":"রাসায়নিক শক্তি","board":"চট্টগ্রাম বোর্ড ২০২৫","stem":"(i)C₂H₆+Cl₂→C₂H₅Cl+HCl\n[C-H, C-Cl, Cl-Cl, H-Cl এর বন্ধন শক্তি যথাক্রমে 414, 326, 244, 431 kJ/mol]\n(ii)N₂(g)+O₂(g)+180kJ⇌2NO(g).","subQuestions":[{"label":"ক","question":"বন্ধন শক্তি কাকে বলে?","answer":"দুইটি পরমাণুর মধ্যকার বন্ধন ভেঙে পরমাণু দুটিকে আলাদা করতে যে শক্তি দিতে হয় বা দুইটি পরমাণুর মধ্যে বন্ধন তৈরি হলে যে শক্তি নির্গত হয়, তাকে বন্ধন শক্তি বলে।"},{"label":"খ","question":"Na₂CO₃ এর জলীয় দ্রবণ ক্ষারীয় —ব্যাখ্যা কর।","answer":"Na₂CO₃ পানিতে আর্দ্রবিশ্লেষিত হয়ে NaOH ও H₂CO₃ উৎপন্ন করে।\nNa₂CO₃+2H₂O→2NaOH+H₂CO₃\nNaOH একটি তীব্র ক্ষার, যা পানিতে সম্পূর্ণ বিয়োজিত হয়ে প্রচুর OH- আয়ন দেয়; কিন্তু H₂CO₃ একটি দুর্বল এসিড, যা খুব সামান্য H+ আয়ন দেয়। ফলে দ্রবণে OH- আয়নের ঘনমাত্রা H+ আয়নের চেয়ে বেশি হয় (pH \u003e 7)। তাই Na₂CO₃ এর জলীয় দ্রবণ ক্ষারীয় ।"},{"label":"গ","question":"উদ্দীপকের (i) নং বিক্রিয়াটির ΔH এর মান নির্ণয় কর।","answer":"উদ্দীপকের (i) নং বিক্রিয়া:\nC₂H₆+Cl₂→C₂H₅Cl+HCl\nএ বিক্রিয়ায় C₂H₆ এর 1 মোল C-H বন্ধন ও Cl₂ এর 1 মোল Cl-Cl বন্ধন ভাঙে এবং 1 মোল C-Cl ও 1 মোল H-Cl বন্ধন তৈরি হয় (C-C ও বাকি C-H বন্ধন অপরিবর্তিত থাকে)। বিক্রিয়কের বন্ধন ভাঙতে প্রয়োজনীয় শক্তি, B₁=(414+ 244)kJ=658kJ উৎপাদের বন্ধন গঠনে নির্গত শক্তি, B₂=(326+431)kJ=757kJ ΔH=B₁-B₂=(658-757)kJ=-99kJ অতএব, (i) নং বিক্রিয়ার ΔH=-99kJ/mol; ΔH ঋণাত্মক হওয়ায় বিক্রিয়াটি তাপোৎপাদী।"},{"label":"ঘ","question":"উদ্দীপকের (ii) নং বিক্রিয়াটির সাম্যাবস্থার উপর তাপ ও চাপের প্রভাব —বিশ্লেষণ কর।","answer":"উদ্দীপকের (ii) নং বিক্রিয়াটি উভমুখী ও তাপহারী (সম্মুখ দিকে 180 kJ তাপ শোষিত হয়):\nN₂(g)+O₂(g)⇌2NO(g) ; ΔH=+180kJ\nতাপের প্রভাব: লা-শাতেলিয়ার নীতি অনুসারে তাপহারী বিক্রিয়ায় তাপমাত্রা বাড়ালে সিস্টেম অতিরিক্ত তাপ শোষণ করতে সম্মুখ বিক্রিয়া বেশি ঘটায় । ফলে সাম্যাবস্থা ডানে সরে এবং NO এর উৎপাদন বাড়ে । তাপমাত্রা কমালে সাম্যাবস্থা বামে সরে এবং NO ভেঙে N₂ ও O₂ উৎপন্ন হয়।\nচাপের প্রভাব: বিক্রিয়ক পক্ষে মোট গ্যাসীয় মোল =1+1=2 এবং উৎপাদ পক্ষে = 2। উভয় পক্ষে মোল সংখ্যা সমান হওয়ায় চাপ বাড়ালে বা কমালে আয়তনের কোনো পরিবর্তন হয় না। তাই চাপের কোনো প্রভাব নেই। সুতরাং, (ii) নং বিক্রিয়ায় উচ্চ তাপমাত্রায় NO এর উৎপাদন বাড়ে, কিন্তু চাপ পরিবর্তন সাম্যাবস্থাকে প্রভাবিত করে না।"}]},{"id":"ch8-cq3","chapter":8,"num":3,"importance":3,"topic":"রাসায়নিক শক্তি","board":"দিনাজপুর বোর্ড ২০২৪","stem":"(i)C₂H₆(g)+Cl2(g)→C2H5Cl(g)+HCl(g)+481kJ\n[এখানে, C-H=414kJ/mol, Cl-Cl=244kJ/mol, H-Cl=431kJ/mol]\n(ii)N₂(g)+3H₂(g)⇌2NH₃(g) ; ΔH=-92kJ/mol.","subQuestions":[{"label":"ক","question":"সুপ্ত যোজনী কাকে বলে?","answer":"কোনো মৌলের সর্বোচ্চ যোজনী ও কোনো যৌগে তার সক্রিয় যোজনীর পার্থক্যকে ঐ মৌলের সুপ্ত যোজনী বলে। যেমন: FeCl₂ যৌগে Fe এর সক্রিয় যোজনী 2, সর্বোচ্চ যোজনী 3; তাই সুপ্ত যোজনী 1।"},{"label":"খ","question":"He কে গ্রুপ-২ এ রাখা হয়নি কেন? ব্যাখ্যা কর।","answer":"হিলিয়ামের (He) পারমাণবিক সংখ্যা 2; ইলেকট্রন বিন্যাস 1s²। ইলেকট্রন বিন্যাস অনুসারে এর সর্বশেষ স্তরে 2টি ইলেকট্রন থাকায় একে গ্রুপ-২ এ রাখার কথা। কিন্তু He এর একমাত্র শক্তিস্তর (প্রথম শক্তিস্তর) 2টি ইলেকট্রনে সম্পূর্ণ পূর্ণ, তাই এটি স্থিতিশীল ও নিষ্ক্রিয়; কোনো ইলেকট্রন ত্যাগ, গ্রহণ বা শেয়ার করে না। অপরদিকে গ্রুপ-২ এর মৌলগুলো (Be, Mg, Ca) সক্রিয় ধাতু, যারা 2টি ইলেকট্রন ত্যাগ করে ধনাত্মক আয়ন গঠন করে । He এর ধর্ম নিষ্ক্রিয় গ্যাস Ne, Ar এর মতো হওয়ায় একে গ্রুপ-২ এ না রেখে গ্রুপ-১৮ এ রাখা হয়েছে ।"},{"label":"গ","question":"(i) নং বিক্রিয়া C-Cl এর বন্ধন শক্তি নির্ণয় কর।","answer":"উদ্দীপকের (i) নং বিক্রিয়া:\nC₂H₆(g)+Cl2(g)→C2H5Cl(g)+HCl(g)+481kJ\nবিক্রিয়ায় 481 kJ তাপ উৎপন্ন হয়, তাই ΔH = -481 kJ। এ বিক্রিয়ায় ইথেনের 1টি C-H বন্ধন ও 1টি Cl-Cl বন্ধন ভাঙে এবং 1টি C-Cl ও 1টি H-Cl বন্ধন গঠিত হয়। ইথেনের C-C বন্ধন ও বাকি 5টি C-H বন্ধন অপরিবর্তিত থাকে।\nধরি, C-Cl বন্ধন শক্তি = x kJ/mol বিক্রিয়কের বন্ধন ভাঙতে প্রয়োজনীয় শক্তি, B₁=(414+ 244)kJ=658kJ উৎপাদের বন্ধন গঠনে নির্গত শক্তি, B₂=(x+431)kJ ΔH = B₁−B₂ বা, -481=658-(x+431) বা, -481 = 227 - x\n∴ x=708kJ/mol সুতরাং, উদ্দীপকের তথ্য অনুযায়ী C-Cl বন্ধনের বন্ধন শক্তি 708 kJ/mol।"},{"label":"ঘ","question":"(ii) নং বিক্রিয়াটির সাম্যাবস্থার উপর তাপ ও চাপের প্রভাব বিশ্লেষণ কর।","answer":"উদ্দীপকের (ii) নং বিক্রিয়াটি হেবার পদ্ধতিতে অ্যামোনিয়া উৎপাদনের উভমুখী বিক্রিয়া:\nN₂(g)+3H₂(g)⇌2NH₃(g) ; ΔH=-92kJ/mol\nলা-শাতেলিয়ার নীতি অনুসারে, সাম্যাবস্থায় থাকা বিক্রিয়ার তাপমাত্রা বা চাপ পরিবর্তন করলে সাম্যাবস্থা এমন দিকে সরে যায় যাতে ঐ পরিবর্তনের প্রভাব প্রশমিত হয়।\nতাপের প্রভাব: ΔH ঋণাত্মক, তাই সম্মুখ বিক্রিয়াটি তাপোৎপাদী এবং পশ্চাৎমুখী বিক্রিয়াটি তাপহারী । তাপমাত্রা বাড়ালে সিস্টেম অতিরিক্ত\nতাপ শোষণ করতে চায়, ফলে সাম্যাবস্থা বামে সরে এবং NH₃ ভেঙে N₂ ও H₂ উৎপন্ন হয়। তাপমাত্রা কমালে সাম্যাবস্থা ডানে সরে এবং NH₃ এর পরিমাণ বাড়ে । তবে খুব কম তাপমাত্রায় বিক্রিয়ার হার অত্যন্ত কমে যায়; তাই Fe প্রভাবকের উপস্থিতিতে 450°C-550°C তাপমাত্রা ব্যবহার করা হয়।\nচাপের প্রভাব: বিক্রিয়কের মোট মোল সংখ্যা (1+3)=4 এবং উৎপাদের মোল সংখ্যা 2। চাপ বাড়ালে সাম্যাবস্থা কম মোলের দিকে অর্থাৎ ডানে সরে এবং NH₃ এর পরিমাণ বাড়ে । চাপ কমালে সাম্যাবস্থা বামে সরে এবং NH₃ ভেঙে N₂ ও H₂ উৎপন্ন হয়। তাই শিল্পক্ষেত্রে 200-250 atm উচ্চ চাপ ব্যবহার করা হয়। N₂(g)+3H₂(g) \u003c=(Fe, 200-250 atm, 450°C-550°C)=\u003e 2NH₃(g) ; ΔH = -92 kJ সুতরাং, (ii) নং বিক্রিয়ায় নিম্ন তাপমাত্রা ও উচ্চ চাপ NH₃ উৎপাদনের অনুকূল; বাস্তবে হার ও উৎপাদ দুটোই বিবেচনা করে প্রভাবকসহ মাঝারি তাপমাত্রা ও উচ্চ চাপে বিক্রিয়াটি ঘটানো হয়।"}]},{"id":"ch8-cq4","chapter":8,"num":4,"importance":3,"topic":"রাসায়নিক শক্তি","board":"কুমিল্লা বোর্ড ২০২০","stem":"N₂(g)+O₂(g)⇌2NO(g), এখানে N=O, O=O এবং N≡N\nএর বন্ধন শক্তি যথাক্রমে 632kJ/mole, 498kJ/mole এবং 946kJ/mole.","subQuestions":[{"label":"ক","question":"যোজ্যতা ইলেকট্রন কাকে বলে?","answer":"পরমাণুর সর্ববহিঃস্থ শক্তিস্তরে অবস্থিত ইলেকট্রনকে যোজ্যতা ইলেকট্রন বলে।"},{"label":"খ","question":"নিউক্লিয়ার ফিশন বিক্রিয়া বলতে কী বুঝায়?","answer":"যে নিউক্লিয়ার প্রক্রিয়ায় কোনো বড় ও ভারী মৌলের নিউক্লিয়াস ভেঙে ছোট ছোট মৌলের নিউক্লিয়াসে পরিণত হয় এবং সেই সাথে নিউট্রন ও প্রচুর শক্তি উৎপন্ন হয়, তাকে নিউক্লিয়ার ফিশন বিক্রিয়া বলে।\nযেমন: স্বল্পগতির নিউট্রন দিয়ে U-235 নিউক্লিয়াসকে আঘাত করলে তা প্রায় দুটি সমান অংশে ভেঙে Ba-141 ও Kr-92 নিউক্লিয়াস, তিনটি নিউট্রন ও প্রচুর শক্তি উৎপন্ন করে ।\n235U+1n→141Ba+92Kr+31n+শক্তি"},{"label":"গ","question":"(i) নং বিক্রিয়াটির ক্ষেত্রে ΔH এর মান নির্ণয় কর।","answer":"উদ্দীপকের বিক্রিয়া:\nN₂(g)+O₂(g)⇌2NO(g)\nগাঠনিক সংকেত অনুযায়ী: N≡N+O=O⇌2(N=O)। এখানে 1\nমোল N≡N ও 1 মোল O=O বন্ধন ভাঙে এবং 2 মোল N=O বন্ধন গঠিত হয়। বিক্রিয়কের বন্ধন ভাঙতে প্রয়োজনীয় শক্তি, B₁=(1×946)+ (1×498)=1444kJ উৎপাদের বন্ধন গঠনে নির্গত শক্তি, B₂=2×632=1264kJ ΔH=B₁-B₂=(1444-1264)kJ=+180kJ অতএব, বিক্রিয়াটির ΔH=+180kJ; ΔH ধনাত্মক হওয়ায় বিক্রিয়াটি তাপহারী ।"},{"label":"ঘ","question":"উদ্দীপকের বিক্রিয়ায় সাম্যাবস্থায় চাপ ও ঘনমাত্রার প্রভাব লা শাতেলিয়ে নীতির সাহায্যে বিশ্লেষণ কর।","answer":"উদ্দীপকের বিক্রিয়াটি উভমুখী এবং সকল বিক্রিয়ক ও উৎপাদ গ্যাসীয়:\nN₂(g)+O₂(g)⇌2NO(g) ; ΔH=+180kJ\nলা-শাতেলিয়ার নীতি অনুসারে, সাম্যাবস্থায় থাকা কোনো বিক্রিয়ার তাপমাত্রা, চাপ বা ঘনমাত্রা পরিবর্তন করলে সাম্যাবস্থা এমন দিকে সরে যায় যাতে ঐ পরিবর্তনের ফল প্রশমিত হয়।\nচাপের প্রভাব: বিক্রিয়ক পক্ষে মোট গ্যাসীয় মোল =1+1=2 এবং উৎপাদ পক্ষে = 2। উভয় পক্ষে মোল সংখ্যা সমান হওয়ায় চাপ বাড়ালে বা কমালে কোনো দিকেই আয়তন কমানো বা বাড়ানোর সুযোগ নেই। তাই এ বিক্রিয়ার সাম্যাবস্থায় চাপের কোনো প্রভাব নেই। ঘনমাত্রার প্রভাব: N₂ বা O₂ এর ঘনমাত্রা বাড়ালে বাড়তি বিক্রিয়ক ব্যবহারের জন্য সম্মুখ বিক্রিয়া বেশি ঘটে, ফলে সাম্যাবস্থা ডানে সরে এবং NO এর পরিমাণ বাড়ে । আবার NO এর ঘনমাত্রা বাড়ালে পশ্চাৎ বিক্রিয়া বেশি ঘটে, সাম্যাবস্থা বামে সরে এবং N₂ ও O₂ এর পরিমাণ বাড়ে । একইভাবে NO সরিয়ে নিলে সাম্যাবস্থা ডানে সরে। সুতরাং, এ বিক্রিয়ার সাম্যাবস্থায় চাপের কোনো প্রভাব নেই, কিন্তু ঘনমাত্রা পরিবর্তন সাম্যাবস্থার অবস্থানকে প্রভাবিত করে।"}]},{"id":"ch8-cq5","chapter":8,"num":5,"importance":3,"topic":"রাসায়নিক শক্তি","board":"দিনাজপুর বোর্ড ২০২৫","stem":"(i)SiCl₄+H₂O→Si(OH)₄+HCl\n(ii)AgNO₃+KCl→AgCl+KNO₃\n(iii) মিথেনের দহন বিক্রিয়ায় 890 kJ/mole তাপশক্তি উৎপন্ন হয়। [এখানে C-H, O=O এবং O-H এর বন্ধন শক্তি যথাক্রমে 414, 498 এবং 464 kJ/mole.]","subQuestions":[{"label":"ক","question":"সুপ্ত যোজনী কাকে বলে?","answer":"কোনো মৌলের সর্বোচ্চ যোজনী ও কোনো যৌগে তার সক্রিয় যোজনীর পার্থক্যকে ঐ মৌলের সুপ্ত যোজনী বলে। যেমন: SO₂ যৌগে S এর সক্রিয় যোজনী 4, সর্বোচ্চ যোজনী 6; তাই সুপ্ত যোজনী 2।"},{"label":"খ","question":"উভমুখী বিক্রিয়াকে তুমি কীভাবে একমুখী বিক্রিয়ায় রূপান্তর করবে?","answer":"উভমুখী বিক্রিয়ায় উৎপাদ পরস্পর বিক্রিয়া করে আবার বিক্রিয়ক তৈরি করে। কোনো উৎপাদকে বিক্রিয়ার পাত্র থেকে সরিয়ে ফেললে বিপরীতমুখী বিক্রিয়া আর ঘটতে পারে না, ফলে বিক্রিয়াটি একমুখী হয়ে যায়।\nযেমন: আবদ্ধ পাত্রে CaCO₃ কে তাপ দিলে বিক্রিয়াটি উভমুখী হয়। কিন্তু খোলা পাত্রে তাপ দিলে উৎপন্ন CO₂ গ্যাস বাতাসে চলে যায়, তাই বিক্রিয়াটি একমুখী হয়।\nCaCO₃(s)⇌CaO(s)+CO₂(g) (আবদ্ধ পাত্রে)\nতাপ\nCaCO₃(s)⟶CaO(s)+CO₂(g)(খোলা পাত্রে)\nএভাবে উৎপন্ন গ্যাস বের করে দিয়ে বা অধঃক্ষেপ আকারে সরিয়ে নিয়ে উভমুখী বিক্রিয়াকে একমুখী করা যায়।"},{"label":"গ","question":"উদ্দীপক (iii) নং হতে C=O এর বন্ধন শক্তি নির্ণয় কর।","answer":"উদ্দীপকের (iii) নং বিক্রিয়াটি মিথেনের দহন বিক্রিয়া:\nCH₄(g)+2O₂(g)→CO₂(g)+2H₂O(g) ; ΔH=-890kJ/mol\nগাঠনিক সংকেতে লিখলে, মিথেনের 4টি C-H বন্ধন ও 2টি O=O বন্ধন ভাঙে এবং CO₂ এর 2টি C=O বন্ধন ও 2H₂O এর 4টি O-H বন্ধন গঠিত হয়।\nধরি, C=O বন্ধন শক্তি = x kJ/mol বিক্রিয়কের বন্ধন ভাঙতে প্রয়োজনীয় শক্তি, B₁=(4×414)+ (2×498)=1656+996=2652kJ উৎপাদের বন্ধন গঠনে নির্গত শক্তি, B₂=(2×x)+(4× 464)=(2x+1856)kJ ΔH = B₁−B₂ বা, -890=2652-(2x+1856) বা, -890=796-2x বা, 2x = 1686\n∴ x=843kJ/mol সুতরাং, C=O বন্ধনের বন্ধন শক্তি 843 kJ/mol।"},{"label":"ঘ","question":"(i) ও (ii) নং বিক্রিয়ায় সাদৃশ্য ও বৈসাদৃশ্য বিশ্লেষণ কর।","answer":"উদ্দীপকের বিক্রিয়া দুটির সমতাকৃত রূপ:\n(i)SiCl₄+4H₂O→Si(OH)₄+4HCl\n(ii)AgNO3(aq)+KCl(aq)→AgCl(s)+KNO3(aq)\nসাদৃশ্য\n• দুটি বিক্রিয়াতেই কোনো মৌলের জারণ সংখ্যার পরিবর্তন হয়নি । (i) এ Si (+4), Cl (-1), H (+1), O (-2) এবং (ii) এ Ag (+1), N (+5), K (+1), Cl (-1) অপরিবর্তিত থাকে। তাই দুটিই নন-রেডক্স বিক্রিয়া ।\n• দুটি বিক্রিয়াতেই বিক্রিয়কের অংশ পরস্পর স্থান বিনিময় করে নতুন দুটি যৌগ তৈরি করে। (i) এ SiCl₄ এর Cl ও H₂O এর OH স্থান বিনিময় করে; (ii) এ Ag⁺ ও K⁺ স্থান বিনিময় করে। বৈসাদৃশ্য\n• (i) নং বিক্রিয়ায় সমযোজী যৌগ SiCl₄ পানির সাথে বিক্রিয়া করে ভেঙে Si(OH)₄ ও HCl উৎপন্ন করে । পানির সাথে বিক্রিয়ায় যৌগের এরূপ বিয়োজনকে আর্দ্র বিশ্লেষণ বিক্রিয়া বলে।\n• (ii) নং বিক্রিয়ায় দুটি পানিতে দ্রবণীয় আয়নিক লবণের দ্রবণ মিশালে পানিতে অদ্রবণীয় AgCl এর সাদা অধঃক্ষেপ পড়ে । তাই এটি অধঃক্ষেপণ বিক্রিয়া ।\n• (i) নং বিক্রিয়ায় উৎপাদ হিসেবে এসিড (HCl) তৈরি হয়, তাই দ্রবণ অম্লীয় হয়; (ii) নং বিক্রিয়ার দ্রবণ প্রশম থাকে। সুতরাং, বিক্রিয়া দুটি নন-রেডক্স ও উপাদান বিনিময়ের দিক থেকে একই রকম হলেও (i) নং আর্দ্র বিশ্লেষণ এবং (ii) নং অধঃক্ষেপণ বিক্রিয়া ।"}]},{"id":"ch8-cq6","chapter":8,"num":6,"importance":2,"topic":"তড়িৎ-রাসায়নিক প্রক্রিয়া","board":"রাজশাহী বোর্ড ২০২০","stem":"নিচের চিত্রটি লক্ষ কর এবং প্রদত্ত প্রশ্নগুলোর উত্তর দাও:","diagramId":"ch8-cq6","subQuestions":[{"label":"ক","question":"হাইড্রোকার্বন কাকে বলে?","answer":"শুধু কার্বন ও হাইড্রোজেন দ্বারা গঠিত জৈব যৌগকে হাইড্রোকার্বন বলে। যেমন: মিথেন (CH₄), ইথিন (CH₂=CH₂)।"},{"label":"খ","question":"প্রশমন বিক্রিয়া ননরেডক্স কেন? ব্যাখ্যা কর।","answer":"যে বিক্রিয়ায় ইলেকট্রন আদান-প্রদান হয় অর্থাৎ কোনো মৌলের জারণ সংখ্যার পরিবর্তন ঘটে তাকে রেডক্স বিক্রিয়া বলে। প্রশমন বিক্রিয়ায় এসিড ও ক্ষারক বিক্রিয়া করে লবণ ও পানি উৎপন্ন করে।\nNaOH+HCl→NaCl+H₂O\nএখানে বিক্রিয়ার আগে ও পরে Na (+1), O (-2), H (+1) ও Cl (-1) এর জারণ সংখ্যা একই থাকে; কোনো ইলেকট্রন আদান-প্রদান হয় না, শুধু H⁺ ও OH⁻ মিলে পানি তৈরি করে। তাই প্রশমন বিক্রিয়া ননরেডক্স বিক্রিয়া ।"},{"label":"গ","question":"উদ্দীপকের কোষটির তড়িৎ বিশ্লেষণ কৌশল বর্ণনা কর।","answer":"উদ্দীপকের কোষটি একটি তড়িৎ বিশ্লেষ্য কোষ। এখানে তড়িৎ বিশ্লেষ্য গলিত পটাশিয়াম ক্লোরাইড (KCl) এবং দুটি গ্রাফাইট দণ্ড তড়িৎদ্বার হিসেবে ব্যাটারির সাথে যুক্ত। ব্যাটারির ধনাত্মক প্রান্তে যুক্ত দণ্ডটি অ্যানোড এবং ঋণাত্মক প্রান্তে যুক্ত দণ্ডটি ক্যাথোড। গলিত অবস্থায় KCl সম্পূর্ণ আয়নিত থাকে:\nKCl→K⁺+Cl⁻\nচিত্র: গলিত KCl পূর্ণ পাত্রে দুটি গ্রাফাইট দণ্ড; বাম দণ্ড অ্যানোড (+) ও ডান দণ্ড ক্যাথোড (-), ব্যাটারির সাথে যুক্ত; Cl⁻ আয়ন অ্যানোডের দিকে এবং K⁺ আয়ন ক্যাথোডের দিকে যাচ্ছে, অ্যানোড থেকে ক্লোরিন গ্যাস বের হচ্ছে । বিদ্যুৎ প্রবাহিত করলে ঋণাত্মক Cl⁻ আয়ন অ্যানোডের দিকে এবং ধনাত্মক K⁺ আয়ন ক্যাথোডের দিকে যায়।\nঅ্যানোডে জারণ: Cl⁻ আয়ন ইলেকট্রন ত্যাগ করে ক্লোরিন গ্যাসে পরিণত হয়।\nCl⁻→Cl+e⁻\nCl+Cl→Cl₂\nক্যাথোডে বিজারণ: K⁺ আয়ন ইলেকট্রন গ্রহণ করে ধাতব পটাশিয়ামে পরিণত হয়।\nK⁺+e⁻→K\nসামগ্রিক বিক্রিয়া:\nবিদ্যুৎ\n2KCl⟶2K+Cl₂\nসুতরাং গলিত KCl এর তড়িৎ বিশ্লেষণে অ্যানোডে ক্লোরিন গ্যাস এবং\nক্যাথোডে গলিত পটাশিয়াম ধাতু পাওয়া যায়।"},{"label":"ঘ","question":"উদ্দীপকের কোষে গলিত KCl এর পরিবর্তে CuSO₄ এর জলীয় দ্রবণ ব্যবহার করলে তড়িৎ বিশ্লেষণের পর উৎপন্ন অবশেষটি একটি নিরুদক —বিশ্লেষণ কর।","answer":"গলিত KCl এর পরিবর্তে CuSO₄ এর জলীয় দ্রবণ ব্যবহার করলে (গ্রাফাইট তড়িৎদ্বার) দ্রবণে নিচের আয়নগুলো থাকে:\nCuSO₄→Cu²⁺+SO₄²⁻\nH₂O⇌H⁺+OH⁻\nক্যাথোডের দিকে Cu²⁺ ও H⁺ যায়। Cu²⁺ এর ইলেকট্রন গ্রহণের প্রবণতা বেশি, তাই ক্যাথোডে কপার জমা হয়।\nCu²⁺+2e⁻→Cu\nঅ্যানোডের দিকে SO₄²⁻ ও OH⁻ যায়। অ্যানায়নের তড়িৎ রাসায়নিক সারিতে OH⁻ নিচে থাকায় OH⁻ আগে চার্জমুক্ত হয় এবং অক্সিজেন গ্যাস উৎপন্ন হয়।\n4OH⁻→O₂+2H₂O+4e⁻\nফলে দ্রবণে H⁺ ও SO₄²⁻ আয়ন থেকে যায়, যারা মিলে সালফিউরিক এসিড তৈরি করে।\n2H⁺+SO₄²⁻→H₂SO₄\nসামগ্রিক বিক্রিয়া:\nবিদ্যুৎ\n2CuSO₄+2H₂O⟶2Cu+O₂+2H₂SO₄\nঅর্থাৎ তড়িৎ বিশ্লেষণের পর অবশেষ হিসেবে H₂SO₄ পাওয়া যায়। এ দ্রবণকে গাঢ় করলে গাঢ় H₂SO₄ পাওয়া যায়, যা একটি শক্তিশালী নিরুদক (পানি শোষক)। গাঢ় H₂SO₄ কোনো যৌগের অণু থেকে H ও O কে 2 : 1 অনুপাতে পানি হিসেবে সরিয়ে নেয়। যেমন: চিনিতে গাঢ় H₂SO₄ যোগ করলে চিনি থেকে পানি অপসারিত হয়ে কালো কার্বন অবশিষ্ট থাকে। গাঢ় H₂SO₄\nC₁₂H₂₂O₁₁⟶12C+11H₂O\nসুতরাং CuSO₄ দ্রবণের তড়িৎ বিশ্লেষণে উৎপন্ন অবশেষ H₂SO₄ একটি নিরুদক ।"}]},{"id":"ch8-cq7","chapter":8,"num":7,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার মাধ্যমে বিদ্যুৎ উৎপাদন","board":"বরিশাল বোর্ড ২০২৪","stem":"Mg(s)+Fe²⁺(aq)→Mg²⁺(aq)+Fe(s)","subQuestions":[{"label":"ক","question":"আকরিক কাকে বলে?","answer":"যেসব খনিজ থেকে লাভজনকভাবে ও সহজে ধাতু নিষ্কাশন করা যায় তাদের আকরিক বলে। যেমন: বক্সাইট (Al₂O₃.2H₂O) অ্যালুমিনিয়ামের আকরিক ।"},{"label":"খ","question":"গ্লুকোজের জলীয় দ্রবণ বিদ্যুৎ পরিবহণ করে না কেন? ব্যাখ্যা কর।","answer":"কোনো দ্রবণ বিদ্যুৎ পরিবহণ করতে হলে দ্রবণে মুক্ত আয়ন থাকতে হয়। গ্লুকোজ (C₆H₁₂O₆) একটি সমযোজী যৌগ। পানিতে দ্রবীভূত হলে গ্লুকোজ অণু আয়নে বিভক্ত হয় না, অণু হিসেবেই থাকে। দ্রবণে কোনো মুক্ত আয়ন না থাকায় বিদ্যুৎ বহন করার মতো চার্জযুক্ত কণা থাকে না। তাই গ্লুকোজের জলীয় দ্রবণ বিদ্যুৎ পরিবহণ করে না।"},{"label":"গ","question":"উদ্দীপকের ২য় ধাতুর তৈরি জিনিসের উপর তড়িৎ প্রলেপন প্রক্রিয়া বর্ণনা কর।","answer":"উদ্দীপকের বিক্রিয়ার ২য় ধাতুটি আয়রন (Fe)। লোহা আর্দ্র বাতাসে সহজে মরিচা ধরে ক্ষয় হয়, তাই লোহার জিনিসের উপর অপেক্ষাকৃত কম সক্রিয় নিকেল (Ni) ধাতুর প্রলেপ দেওয়া হয়। কৌশল: একটি বিকারে তড়িৎ বিশ্লেষ্য হিসেবে নিকেল সালফেট (NiSO₄) দ্রবণ নেওয়া হয়। বিশুদ্ধ নিকেলের দণ্ডকে ব্যাটারির ধনাত্মক প্রান্তে যুক্ত করে অ্যানোড এবং পরিষ্কার লোহার চামচকে ব্যাটারির ঋণাত্মক প্রান্তে যুক্ত করে ক্যাথোড হিসেবে দ্রবণে ডুবানো হয়। চিত্র: NiSO₄ দ্রবণপূর্ণ বিকারে নিকেল দণ্ড (অ্যানোড, +) ও লোহার চামচ (ক্যাথোড, -) ব্যাটারির সাথে যুক্ত; Ni²⁺ আয়ন চামচের দিকে এবং SO₄²⁻ আয়ন নিকেল দণ্ডের দিকে যাচ্ছে। দ্রবণে NiSO₄ আয়নিত থাকে:\nNiSO₄→Ni²⁺+SO₄²⁻\nঅ্যানোডে জারণ:\nNi→Ni²⁺+2e⁻\nক্যাথোডে বিজারণ:\nNi²⁺+2e⁻→Ni\nবিদ্যুৎ প্রবাহিত করলে অ্যানোডের নিকেল ক্ষয় হয়ে Ni²⁺ আয়ন হিসেবে দ্রবণে আসে এবং দ্রবণের Ni²⁺ আয়ন ক্যাথোড থেকে ইলেকট্রন গ্রহণ করে ধাতব নিকেল হিসেবে লোহার চামচের উপর জমা হয়। ফলে লোহার চামচের উপর নিকেলের উজ্জ্বল প্রলেপ পড়ে, যা লোহাকে বাতাস ও জলীয় বাষ্পের সংস্পর্শ থেকে রক্ষা করে মরিচা পড়া রোধ করে ।"},{"label":"ঘ","question":"উদ্দীপকের বিক্রিয়ার মাধ্যমে বিদ্যুৎ উৎপাদন কি সম্ভব? চিত্রসহ বিশ্লেষণ কর।","answer":"উদ্দীপকের বিক্রিয়া:\nMg(s)+Fe²⁺(aq)→Mg²⁺(aq)+Fe(s)\nএটি একটি জারণ-বিজারণ বিক্রিয়া, যেখানে Mg ইলেকট্রন ত্যাগ করে (জারণ) এবং Fe²⁺ ইলেকট্রন গ্রহণ করে (বিজারণ)। জারণ ও\nবিজারণ অর্ধ-বিক্রিয়া দুটিকে আলাদা পাত্রে ঘটিয়ে গ্যালভানিক কোষ তৈরি করলে বিদ্যুৎ উৎপাদন সম্ভব । সক্রিয়তা সারিতে Mg আয়রনের (Fe) উপরে, তাই Mg দণ্ড অ্যানোড এবং Fe দণ্ড ক্যাথোড হিসেবে কাজ করে। গঠন: একটি বিকারে MgSO₄ দ্রবণে Mg দণ্ড এবং অপর বিকারে FeSO₄ দ্রবণে Fe দণ্ড রাখা হয়। দ্রবণ দুটি KCl এর লবণ সেতু দিয়ে এবং দণ্ড দুটি বাল্বসহ ধাতব তার দিয়ে যুক্ত করা হয়। চিত্র: বাম বিকারে MgSO₄ দ্রবণে Mg দণ্ড (অ্যানোড), ডান বিকারে FeSO₄ দ্রবণে Fe দণ্ড (ক্যাথোড), মাঝে U আকৃতির লবণ সেতু (K⁺, Cl⁻), উপরে তারে বাল্ব; ইলেকট্রন Mg থেকে Fe এর দিকে প্রবাহিত হচ্ছে।\nঅ্যানোডে জারণ:\nMg→Mg²⁺+2e⁻\nক্যাথোডে বিজারণ:\nFe²⁺+2e⁻→Fe\nMg দণ্ডে উৎপন্ন ইলেকট্রন তারের মধ্য দিয়ে Fe দণ্ডে যায়, ফলে তারে বিদ্যুৎ প্রবাহ সৃষ্টি হয় এবং বাল্ব জ্বলে ওঠে। লবণ সেতু দুই দ্রবণের তড়িৎ নিরপেক্ষতা বজায় রেখে বিদ্যুৎ প্রবাহ চালু রাখে। সুতরাং উদ্দীপকের বিক্রিয়ার মাধ্যমে বিদ্যুৎ উৎপাদন সম্ভব ।"}]},{"id":"ch9-cq1","chapter":9,"num":1,"importance":2,"topic":"এসিড","board":"ঢাকা বোর্ড ২০২০","stem":"(i)C₄H₁₀+Cl₂→C₄H₉Cl+HCl\n(ii)","diagramId":"ch9-cq1","subQuestions":[{"label":"ক","question":"নিউক্লিয়ার ফিশন বিক্রিয়া কী?","answer":"যে নিউক্লিয়ার বিক্রিয়ায় কোনো ভারী মৌলের নিউক্লিয়াস (যেমন U-235) নিউট্রন দ্বারা আঘাতপ্রাপ্ত হয়ে প্রায় সমান ভরের দুটি হালকা নিউক্লিয়াসে বিভক্ত হয় এবং বিপুল পরিমাণ শক্তি নির্গত হয়, তাকে নিউক্লিয়ার ফিশন বিক্রিয়া বলে ।"},{"label":"খ","question":"অ্যানোডকে জারণ তড়িৎদ্বার বলা হয় কেন —ব্যাখ্যা কর।","answer":"তড়িৎ বিশ্লেষ্য কোষে ব্যাটারির ধনাত্মক প্রান্তের সাথে যুক্ত তড়িৎদ্বারকে অ্যানোড বলে। তড়িৎ বিশ্লেষণের সময় দ্রবণের অ্যানায়নগুলো অ্যানোডে গিয়ে ইলেকট্রন ত্যাগ করে চার্জমুক্ত হয়। ইলেকট্রন ত্যাগ করা অর্থ জারণ।\n2Cl⁻→Cl₂+2e⁻\nযেহেতু অ্যানোডে সবসময় জারণ বিক্রিয়া ঘটে, তাই অ্যানোডকে জারণ তড়িৎদ্বার বলা হয়।"},{"label":"গ","question":"(i) নং বিক্রিয়ার ΔH এর মান নির্ণয় কর।","answer":"(i) নং বিক্রিয়া: C₄H₁₀+Cl₂→C₄H₉Cl+HCl\nএ বিক্রিয়ায় বিক্রিয়কের 1 মোল C-H বন্ধন ও 1 মোল Cl-Cl বন্ধন ভাঙে এবং উৎপাদে 1 মোল C-Cl বন্ধন ও 1 মোল H-Cl বন্ধন গঠিত হয়। অন্যান্য বন্ধন অপরিবর্তিত থাকে।\nদেওয়া আছে, বন্ধন শক্তি: C-H=414kJ/mol, Cl-Cl=244kJ/mol, C-Cl=326kJ/mol, H-Cl=431kJ/mol বন্ধন ভাঙতে শোষিত শক্তি =(414+244)kJ=658kJ বন্ধন গঠনে নির্গত শক্তি =(326+431)kJ=757kJ ΔH = শোষিত শক্তি − নির্গত শক্তি =(658−757)kJ=−99kJ সুতরাং (i) নং বিক্রিয়ার ΔH=−99kJ/mol; ΔH ঋণাত্মক হওয়ায় বিক্রিয়াটি তাপোৎপাদী।"},{"label":"ঘ","question":"উদ্দীপকে (ii) নং কোষের তড়িৎদ্বারে সংঘটিত বিক্রিয়া এবং উৎপন্ন ভারি গ্যাসটির জলীয় দ্রবণ এসিড নাকি ক্ষার —বিক্রিয়াসহ বিশ্লেষণ কর।","answer":"(ii) নং কোষে NaCl এর জলীয় দ্রবণে নিম্নোক্ত আয়ন থাকে:\nNaCl→Na⁺+Cl⁻\nH₂O⇌H⁺+OH⁻\nক্যাথোডে (ঋণাত্মক তড়িৎদ্বার): Na⁺ ও H⁺ আয়ন আকৃষ্ট হয়। চার্জমুক্ত হওয়ার প্রবণতা বেশি হওয়ায় H⁺ আয়ন ইলেকট্রন গ্রহণ করে (বিজারণ) H₂ গ্যাস উৎপন্ন করে।\n2H⁺+2e⁻→H₂↑\nঅ্যানোডে (ধনাত্মক তড়িৎদ্বার): Cl⁻ ও OH⁻ আয়ন আকৃষ্ট হয়। দ্রবণে Cl⁻ আয়নের ঘনমাত্রা OH⁻ আয়নের ঘনমাত্রার চেয়ে অনেক বেশি হওয়ায় Cl⁻ আয়ন ইলেকট্রন ত্যাগ করে (জারণ) Cl₂ গ্যাস উৎপন্ন করে ।\n2Cl⁻→Cl₂↑ + 2e⁻\nদ্রবণে Na⁺ ও OH⁻ আয়ন থেকে যায়, অর্থাৎ NaOH তৈরি হয়। উৎপন্ন গ্যাস দুটির আণবিক ভর: H₂ = 2, Cl₂ = 71। সুতরাং ভারী গ্যাসটি ক্লোরিন (Cl₂)। Cl₂ পানির সাথে বিক্রিয়া করে হাইড্রোক্লোরিক এসিড ও হাইপোক্লোরাস এসিড উৎপন্ন করে:\nCl₂+H₂O→HCl+HOCl\nHCl(aq)→H⁺(aq)+Cl⁻(aq)\nদ্রবণে H⁺ আয়ন থাকায় এটি নীল লিটমাসকে লাল করে (HOCl এর বিরঞ্জন ক্রিয়ার জন্য পরে বর্ণহীনও করে)। এর pH 7 এর কম। সুতরাং উৎপন্ন ভারী গ্যাস Cl₂ এর জলীয় দ্রবণ এসিড।"}]},{"id":"ch9-cq2","chapter":9,"num":2,"importance":3,"topic":"ক্ষারক এবং ক্ষার","board":"কুমিল্লা বোর্ড ২০২৪","stem":"নিচের উদ্দীপকটি পড়ো এবং প্রশ্নগুলোর উত্তর দাও:","diagramId":"ch9-cq2","subQuestions":[{"label":"ক","question":"অম্ল কাকে বলে?","answer":"যেসব যৌগ জলীয় দ্রবণে হাইড্রোজেন আয়ন (H⁺) দেয় তাদেরকে অম্ল বা এসিড বলে। যেমন: HCl, H₂SO₄।"},{"label":"খ","question":"কৃষিক্ষেত্রে pH এর গুরুত্ব ব্যাখ্যা কর।","answer":"প্রতিটি ফসল একটি নির্দিষ্ট pH সীমার মাটিতে ভালো জন্মায়; বেশিরভাগ ফসলের জন্য মাটির pH প্রায় 6-7 উপযোগী। মাটি বেশি অম্লীয় (pH কম) হলে চুন (CaO) বা চুনাপাথর প্রয়োগ করে pH বাড়ানো হয়। মাটি বেশি ক্ষারীয় হলে অম্লধর্মী সার (যেমন অ্যামোনিয়াম সালফেট) বা জৈব সার প্রয়োগ করে pH কমানো হয়। তাই pH জেনে মাটি সংশোধন ও সঠিক ফসল নির্বাচন করলে উৎপাদন বাড়ে ।"},{"label":"গ","question":"উদ্দীপকের পাত্রটিতে সংঘটিত রাসায়নিক প্রক্রিয়াটি ব্যাখ্যা কর।","answer":"শামুকের খোলসের প্রধান উপাদান ক্যালসিয়াম কার্বনেট (CaCO₃, প্রায় 98%)। পাত্রে তাপ দিলে CaCO₃ তাপ শোষণ করে বিয়োজিত হয়ে ক্যালসিয়াম অক্সাইড (CaO, পোড়া চুন) ও CO₂ গ্যাস উৎপন্ন করে।\nতাপ\nCaCO₃(s)⟶CaO(s)+CO₂(g);ΔH=ধনাত্মক\nএকটি যৌগ ভেঙে একাধিক পদার্থ তৈরি হওয়ায় এটি তাপীয় বিয়োজন বিক্রিয়া; বিক্রিয়ায় তাপ শোষিত হয়, তাই এটি তাপহারী বিক্রিয়া । সুতরাং পাত্রে সংঘটিত প্রক্রিয়াটি হলো CaCO₃ এর তাপহারী তাপীয় বিয়োজন ।"},{"label":"ঘ","question":"বিক্রিয়া পাত্রে প্রাপ্ত যৌগটির জলীয় দ্রবণে CO₂ গ্যাস চালনা করলে কী ঘটে? সমীকরণসহ বিশ্লেষণ কর।","answer":"বিক্রিয়া পাত্রে প্রাপ্ত যৌগ হলো CaO (ক্ষারক)। একে পানিতে দিলে প্রচুর তাপ উৎপন্ন করে কলিচুন Ca(OH)₂ তৈরি হয়, যা পানিতে দ্রবণীয় ক্ষার। এর স্বচ্ছ জলীয় দ্রবণই চুনের পানি।\nCaO+H₂O→Ca(OH)₂+তাপ\nচুনের পানিতে CO₂ চালনা করলে অদ্রবণীয় CaCO₃ উৎপন্ন হয়, ফলে দ্রবণ ঘোলা (সাদা) হয়ে যায়।\nCa(OH)₂+CO₂→CaCO₃↓ + H₂O\nআরও বেশি CO₂ চালনা করতে থাকলে CaCO₃, CO₂ ও পানির সাথে বিক্রিয়া করে পানিতে দ্রবণীয় ক্যালসিয়াম বাইকার্বনেট তৈরি করে, ফলে ঘোলা দ্রবণ আবার স্বচ্ছ হয়।\nCaCO₃+CO₂+H₂O→Ca(HCO₃)₂\nসুতরাং, প্রাপ্ত যৌগের জলীয় দ্রবণে CO₂ চালনা করলে প্রথমে দ্রবণ ঘোলা হয় এবং অতিরিক্ত CO₂ চালনায় আবার স্বচ্ছ হয়।"}]},{"id":"ch9-cq3","chapter":9,"num":3,"importance":3,"topic":"প্রশমন বিক্রিয়া","board":"যশোর বোর্ড ২০২৬","stem":"পাত্র - A: HNO₃, 25 g, 250 ml পাত্র - B: Ca(OH)₂, 0.5 M, 250 ml","subQuestions":[{"label":"ক","question":"আইসোটোপ কাকে বলে?","answer":"যেসব পরমাণুর প্রোটন সংখ্যা (পারমাণবিক সংখ্যা) একই কিন্তু ভরসংখ্যা ভিন্ন, তাদেরকে পরস্পরের আইসোটোপ বলে। যেমন: হাইড্রোজেনের আইসোটোপ ¹H, ²H ও ³H।"},{"label":"খ","question":"পটাশিয়াম 2n² সূত্রকে সমর্থন করে না কেন? ব্যাখ্যা কর।","answer":"2n² সূত্র অনুসারে কোনো শক্তিস্তরে সর্বোচ্চ 2n² সংখ্যক ইলেকট্রন থাকতে পারে। এ অনুসারে তৃতীয় শক্তিস্তরে (n = 3) সর্বোচ্চ 2 × 3² = 18টি ইলেকট্রন থাকতে পারে। পটাশিয়ামের (19) ইলেকট্রন বিন্যাস: 1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹, অর্থাৎ শক্তিস্তর অনুযায়ী 2, 8, 8, 1। এখানে তৃতীয় শক্তিস্তরে 18টি ইলেকট্রন পূর্ণ না হয়েই (মাত্র 8টি) ১৯তম ইলেকট্রনটি চতুর্থ শক্তিস্তরে প্রবেশ করে। এর কারণ, 3d অরবিটালের (n+l=5) চেয়ে 4s অরবিটালের (n+l=4) শক্তি কম, তাই আউফবাউ নীতি অনুসারে ইলেকট্রন আগে 4s এ যায়। এজন্য পটাশিয়াম 2n² সূত্রকে সমর্থন করে না।"},{"label":"গ","question":"A পাত্রের দ্রবণের ঘনমাত্রা নির্ণয় কর।","answer":"A পাত্রে 250 mL দ্রবণে 25 g HNO₃ আছে।\nHNO₃ এর আণবিক ভর =1+14+(16×3)=63g/mol HNO₃ এর মোল সংখ্যা, n=25/63mol=0.397mol দ্রবণের আয়তন, V = 250 mL = 0.25 L ঘনমাত্রা, S=n/V=0.397/0.25mol/L = 1.587 M অতএব, A পাত্রের দ্রবণের ঘনমাত্রা 1.587 M (মোলার)।"},{"label":"ঘ","question":"A ও B পাত্রের দ্রবণদ্বয় মিশ্রিত করলে মিশ্রণের প্রকৃতি কীরূপ হবে? বিশ্লেষণ কর।","answer":"A পাত্রে আছে HNO₃ (এসিড) এবং B পাত্রে আছে Ca(OH)₂ (ক্ষার)। মিশ্রিত করলে প্রশমন বিক্রিয়া ঘটে:\n2HNO₃+Ca(OH)₂→Ca(NO₃)₂+2H₂O\nসমীকরণ অনুসারে 1 mol Ca(OH)₂ কে প্রশমিত করতে 2 mol HNO₃ প্রয়োজন । A পাত্রে HNO₃ এর মোল সংখ্যা =25/63=0.397mol (গ হতে) B পাত্রে Ca(OH)₂ এর মোল সংখ্যা =(0.5×250)/1000=0.125mol 0.125 mol Ca(OH)₂ প্রশমনে প্রয়োজনীয় HNO₃ = 2 × 0.125 = 0.25 mol অবশিষ্ট (অতিরিক্ত) HNO₃ = 0.397 − 0.25 = 0.147 mol অর্থাৎ সম্পূর্ণ Ca(OH)₂ প্রশমিত হওয়ার পরও 0.147 mol HNO₃ অবিক্রিত থেকে যায়। মিশ্রণের মোট আয়তন =250+250=500mL=0.5L। মিশ্রণে HNO₃ এর ঘনমাত্রা =0.147/0.5=0.294M HNO₃ একটি তীব্র এসিড, তাই মিশ্রণে [H⁺] = 0.294 M এবং pH= −log(0.294) ≈ 0.53, যা 7 এর চেয়ে অনেক কম। অতএব, A ও B পাত্রের দ্রবণদ্বয় মিশ্রিত করলে মিশ্রণটি প্রশম হবে না, বরং অতিরিক্ত HNO₃ থাকার কারণে মিশ্রণের প্রকৃতি অম্লীয় (এসিডিক) হবে; এটি নীল লিটমাসকে লাল করবে ।"}]},{"id":"ch9-cq4","chapter":9,"num":4,"importance":3,"topic":"প্রশমন বিক্রিয়া","board":"চট্টগ্রাম বোর্ড ২০২৫","stem":"নিচের উদ্দীপকটি পড়ো এবং প্রশ্নগুলোর উত্তর দাও:","diagramId":"ch9-cq4","subQuestions":[{"label":"ক","question":"বাষ্পীভবন কাকে বলে?","answer":"যে প্রক্রিয়ায় কোনো তরল পদার্থ তাপ গ্রহণ করে স্ফুটনাংকের নিচে যেকোনো তাপমাত্রায় শুধু তরলের উপরিতল থেকে ধীরে ধীরে বাষ্পে পরিণত হয়, তাকে বাষ্পীভবন বলে।"},{"label":"খ","question":"ম্যাগনেসিয়াম একটি মৃৎক্ষার ধাতু—ব্যাখ্যা কর।","answer":"ম্যাগনেসিয়ামের (Mg) পারমাণবিক সংখ্যা 12; ইলেকট্রন বিন্যাস 1s² 2s² 2p⁶ 3s²। এর সর্ববহিঃস্থ স্তরে 2টি ইলেকট্রন থাকায় এটি পর্যায় সারণির গ্রুপ-2 এর মৌল। গ্রুপ-2 এর মৌলগুলোর অক্সাইড ও হাইড্রোক্সাইড ক্ষারধর্মী এবং এদের যৌগ ভূত্বকে (মাটিতে) বিভিন্ন খনিজরূপে পাওয়া যায়। তাই এদের মৃৎক্ষার ধাতু বলে।\n2Mg+O₂→2MgO; MgO+H₂O→Mg(OH)₂\nসুতরাং, ম্যাগনেসিয়াম একটি মৃৎক্ষার ধাতু।"},{"label":"গ","question":"১ম বিকারের দ্রবণের ঘনমাত্রা নির্ণয় কর।","answer":"১ম বিকারে আছে সোডিয়াম হাইড্রোক্সাইডের (NaOH) দ্রবণ ।\nদেওয়া আছে, NaOH এর ভর, w = 20 g দ্রবণের আয়তন, V = 550 mL NaOH এর আণবিক ভর, M=23+16+1=40g/mol ঘনমাত্রা, S = ? আমরা জানি, S=(w×1000)/(M×V) =(20×1000)/(40×550) = 0.909 M\n∴ ১ম বিকারের দ্রবণের ঘনমাত্রা 0.909 M।"},{"label":"ঘ","question":"উভয় বিকারের দ্রবণ একত্রিত করলে মিশ্রিত দ্রবণের প্রকৃতি বিশ্লেষণ কর।","answer":"১ম বিকারে NaOH (ক্ষার) এবং ২য় বিকারে H₂SO₄ (এসিড) আছে। দ্রবণদ্বয় মিশ্রিত করলে প্রশমন বিক্রিয়া ঘটে।\n2NaOH+H₂SO₄→Na₂SO₄+2H₂O\n২য় বিকারে H₂SO₄ এর ভর নির্ণয়:\nদেওয়া আছে, S = 0.816 M, V = 250 mL, H₂SO₄ এর আণবিক ভর M=2+32+64=98g/mol w=(S×M×V)/1000=(0.816×98×250)/1000=19.992g সমীকরণ অনুযায়ী, 2NaOH = 2 × 40 = 80 g এবং H₂SO₄ = 98 g। 98 g H₂SO₄ বিক্রিয়া করে 80 g NaOH এর সাথে\n∴ 19.992 g H₂SO₄ বিক্রিয়া করে (80 × 19.992)/98 g = 16.32 g NaOH এর সাথে কিন্তু ১ম বিকারে NaOH আছে 20 g।\n∴ অবশিষ্ট NaOH = (20 - 16.32) g = 3.68 g অর্থাৎ H₂SO₄ সম্পূর্ণ শেষ হয়ে যায় এবং 3.68 g NaOH অতিরিক্ত থেকে যায়। অবশিষ্ট NaOH পানিতে বিয়োজিত হয়ে OH⁻ আয়ন দেয়, ফলে দ্রবণের pH 7 এর বেশি হয়। সুতরাং, মিশ্রিত দ্রবণটি ক্ষারীয় প্রকৃতির হবে; এতে লাল লিটমাস নীল হবে।"}]},{"id":"ch9-cq5","chapter":9,"num":5,"importance":3,"topic":"প্রশমন বিক্রিয়া","board":"ময়মনসিংহ বোর্ড ২০২০","stem":"নিচের উদ্দীপকটি পড়ো এবং প্রশ্নগুলোর উত্তর দাও:","diagramId":"ch9-cq5","subQuestions":[{"label":"ক","question":"লিমিটিং বিক্রিয়ক কী?","answer":"কোনো রাসায়নিক বিক্রিয়ায় একাধিক বিক্রিয়কের মধ্যে যে বিক্রিয়কটি পরিমাণে কম থাকার কারণে সম্পূর্ণরূপে বিক্রিয়া করে শেষ হয়ে যায় এবং উৎপাদের পরিমাণ নির্ধারণ করে, তাকে লিমিটিং বিক্রিয়ক বলে।"},{"label":"খ","question":"নাইট্রোজেন-এর যোজনী ও যোজনী ইলেকট্রন সমান নয় কেন? ব্যাখ্যা কর।","answer":"নাইট্রোজেনের (N) পারমাণবিক সংখ্যা 7; ইলেকট্রন বিন্যাস: 1s² 2s² 2p³। এর সর্ববহিঃস্থ শক্তিস্তরে 5টি ইলেকট্রন আছে, তাই নাইট্রোজেনের যোজনী ইলেকট্রন 5। কিন্তু অষ্টক পূর্ণ করতে নাইট্রোজেনের আরও 3টি ইলেকট্রন প্রয়োজন হয়, তাই এটি 3টি ইলেকট্রন শেয়ার বা গ্রহণ করে বন্ধন গঠন করে।\nযেমন: NH₃ অণুতে N এর যোজনী 3।\nঅর্থাৎ যোজনী ইলেকট্রন হলো সর্ববহিঃস্থ স্তরের মোট ইলেকট্রন, আর যোজনী হলো বন্ধন গঠনে অংশগ্রহণকারী ইলেকট্রনের সংখ্যা। তাই নাইট্রোজেনের যোজনী (3) ও যোজনী ইলেকট্রন (5) সমান নয়।"},{"label":"গ","question":"বিকার-A তে 10g Zn যোগ করলে উৎপাদিত গ্যাসের আয়তন STP-তে কত হবে?","answer":"বিকার-A তে আছে 200 mL 0.5 M HCl। Zn যোগ করলে H₂ গ্যাস উৎপন্ন হয়।\nZn+2HCl→ZnCl₂+H₂\nZn = 65; HCl এর আণবিক ভর =1+35.5=36.5; 2HCl = 73 HCl এর ভর, w=SMV/1000=(0.5×36.5×200)/1000=3.65g সমীকরণ অনুযায়ী, 73 g HCl বিক্রিয়া করে 65 g Zn এর সাথে\n∴ 3.65 g HCl বিক্রিয়া করে (65×3.65)/73=3.25gZn এর সাথে যোগ করা Zn = 10 g, যা প্রয়োজনের চেয়ে বেশি; (10-3.25)=6.75gZn অবিক্রিত থাকবে । তাই HCl হলো লিমিটিং বিক্রিয়ক এবং H₂ এর পরিমাণ HCl দ্বারা নির্ধারিত হবে। সমীকরণ অনুযায়ী, 73 g HCl থেকে STP তে H₂ উৎপন্ন হয় 22.4 L\n∴ 3.65 g HCl থেকে H₂ উৎপন্ন হয় (22.4×3.65)/73=1.12L সুতরাং, বিকার-A তে 10 g Zn যোগ করলে STP তে 1.12 L হাইড্রোজেন গ্যাস উৎপন্ন হবে।"},{"label":"ঘ","question":"উদ্দীপকের বিকার দুটির দ্রবণ মিশ্রিত করলে দ্রবণের প্রকৃতি কেমন হবে? বিশ্লেষণ কর।","answer":"বিকার-A তে আছে HCl এসিড এবং বিকার-B তে আছে KOH ক্ষার। মিশ্রিত করলে প্রশমন বিক্রিয়া ঘটে।\nHCl+KOH→KCl+HO\nবিকার-A তে HCl এর ভর =(2 0.5×36.5×200)/1000=3.65g বিকার-B তে KOH এর ভর = 4 g; KOH এর আণবিক ভর =39+ 16+1=56 সমীকরণ অনুযায়ী, 56 g KOH বিক্রিয়া করে 36.5 g HCl এর সাথে\n∴ 4 g KOH বিক্রিয়া করে (36.5×4)/56=2.61gHCl এর সাথে\n∴ অবিক্রিত HCl=(3.65-2.61)g=1.04g মোল হিসেবে: HCl=3.65/36.5=0.1 মোল, KOH=4/56=0.0714 মোল। 1 : 1 অনুপাতে বিক্রিয়া হওয়ায় KOH সম্পূর্ণ শেষ হয়ে (0.1-0.0714)=0.0286 মোল HCl অবশিষ্ট থাকে। মিশ্রণে অতিরিক্ত HCl থাকায় দ্রবণে H+ আয়নের আধিক্য থাকবে, pH 7 এর কম হবে এবং দ্রবণটি নীল লিটমাসকে লাল করবে । সুতরাং, বিকার দুটির দ্রবণ মিশ্রিত করলে মিশ্রণটি অম্লীয় প্রকৃতির হবে।"}]},{"id":"ch9-cq6","chapter":9,"num":6,"importance":3,"topic":"এসিড বৃষ্টি","board":"দিনাজপুর বোর্ড ২০২০","stem":"নিচের উদ্দীপকটি পড়ো এবং প্রশ্নগুলোর উত্তর দাও:","diagramId":"ch9-cq6","subQuestions":[{"label":"ক","question":"সোডা অ্যাস কী?","answer":"অনার্দ্র সোডিয়াম কার্বনেটকে (Na₂CO₃) সোডা অ্যাশ বলে।"},{"label":"খ","question":"\"সকল খনিজই আকরিক নয়\"— ব্যাখ্যা কর।","answer":"ভূ-পৃষ্ঠে বা ভূ-গর্ভে প্রাকৃতিকভাবে প্রাপ্ত যেসব পদার্থে ধাতু মুক্ত অবস্থায় বা যৌগরূপে থাকে, তাদের খনিজ বলে। কিন্তু যেসব খনিজ থেকে লাভজনকভাবে ও সহজে ধাতু নিষ্কাশন করা যায়, শুধু সেগুলোকেই আকরিক বলে।\nযেমন: অ্যালুমিনিয়াম কাদামাটি (Al₂O₃.2SiO₂.2H₂O) এবং বক্সাইট (Al₂O₃.2H₂O) উভয়ই অ্যালুমিনিয়ামের খনিজ। কিন্তু কাদামাটি থেকে অ্যালুমিনিয়াম নিষ্কাশন ব্যয়বহুল ও কঠিন, তাই এটি আকরিক নয়; বক্সাইট থেকে সহজে ও লাভজনকভাবে Al নিষ্কাশন করা যায়, তাই এটি আকরিক । অর্থাৎ সকল আকরিকই খনিজ, কিন্তু সকল খনিজ আকরিক নয়।"},{"label":"গ","question":"উপযুক্ত বিক্রিয়াসহ B যৌগটি সনাক্ত কর।","answer":"উদ্দীপকের ফ্লাস্কে চুনাপাথর (CaCO₃) ও খনিজ এসিড (যেমন: লঘু HCl) নেওয়া হয়েছে । এদের বিক্রিয়ায় উৎপন্ন গ্যাস B গ্যাসজারে সংগ্রহ করা হয়।\nCaCO₃+2HCl→CaCl₂+CO₂+H₂O\nসুতরাং, B হলো কার্বন ডাইঅক্সাইড (CO₂)।\nশনাক্তকরণ: উৎপন্ন গ্যাসকে স্বচ্ছ চুনের পানিতে [Ca(OH)₂ দ্রবণ] চালনা করলে অদ্রবণীয় ক্যালসিয়াম কার্বনেট তৈরি হয়ে পানি ঘোলা হয়ে যায়।\nCa(OH)₂+CO₂→CaCO₃+H₂O\nআরও বেশি সময় ধরে গ্যাস চালনা করলে দ্রবণীয় ক্যালসিয়াম বাইকার্বনেট তৈরি হয়ে ঘোলা ভাব দূর হয় এবং পানি আবার স্বচ্ছ হয়।\nCaCO₃+CO₂+H₂O→Ca(HCO₃)₂\nএছাড়া গ্যাসটি জ্বলন্ত কাঠি নিভিয়ে দেয় এবং ভেজা নীল লিটমাসকে হালকা লাল করে। এসব পরীক্ষা থেকে নিশ্চিত হওয়া যায় যে, B যৌগটি CO₂।"},{"label":"ঘ","question":"পরিবেশের উপর B যৌগটির প্রভাব বিশ্লেষণ কর।","answer":"'গ' থেকে পাই, B যৌগটি কার্বন ডাইঅক্সাইড (CO₂), যা একটি অম্লধর্মী অক্সাইড ও প্রধান গ্রিনহাউস গ্যাস। বায়ুমণ্ডলে স্বাভাবিক মাত্রার CO₂ উদ্ভিদের সালোকসংশ্লেষণের জন্য প্রয়োজনীয় এবং পৃথিবীকে উষ্ণ রাখে। কিন্তু এর পরিমাণ বেড়ে গেলে পরিবেশের ক্ষতি হয়:\n১. গ্রিনহাউস প্রভাব ও বৈশ্বিক উষ্ণায়ন: অতিরিক্ত CO₂ ভূপৃষ্ঠ থেকে বিকিরিত তাপ আটকে রাখে, ফলে পৃথিবীর গড় তাপমাত্রা বাড়ে । মেরু অঞ্চলের বরফ গলে সমুদ্রপৃষ্ঠের উচ্চতা বাড়ে এবং নিচু উপকূলীয় এলাকা তলিয়ে যাওয়ার আশঙ্কা দেখা দেয়।\n২. জলবায়ু পরিবর্তন: ঋতুচক্রের পরিবর্তন, অনাবৃষ্টি, অতিবৃষ্টি, ঘূর্ণিঝড় ও বন্যা বেড়ে যায়, কৃষি উৎপাদন ব্যাহত হয়।\n৩. এসিড বৃষ্টি: CO₂ বৃষ্টির পানিতে দ্রবীভূত হয়ে কার্বনিক এসিড তৈরি করে এবং এসিড বৃষ্টিতে ভূমিকা রাখে। এতে মাটি ও জলাশয়ের pH কমে, ফসল, গাছপালা, মাছ ও প্ল্যাংকটনসহ জলজ জীব ক্ষতিগ্রস্ত হয়।\nCO₂+H₂O→H₂CO₃\n৪. সমুদ্রের অম্লতা বৃদ্ধি: সমুদ্রের পানিতে CO₂ দ্রবীভূত হয়ে অম্লতা বাড়ায়, ফলে প্রবাল ও খোলসযুক্ত প্রাণীর ক্ষতি হয়। যানবাহন, বিদ্যুৎকেন্দ্র, কলকারখানা ও ইটভাটায় জীবাশ্ম জ্বালানির দহন এবং বন উজাড়ের ফলে বায়ুমণ্ডলে CO₂ এর পরিমাণ ক্রমাগত বাড়ছে । সুতরাং B যৌগটি (CO₂) অতিরিক্ত মাত্রায় পরিবেশের জন্য অত্যন্ত ক্ষতিকর।"}]},{"id":"ch9-cq7","chapter":9,"num":7,"importance":3,"topic":"এসিড বৃষ্টি","board":"যশোর বোর্ড ২০২৫","stem":"(i)S+O₂→E(g)\n(ii)NO+O₂→F(g)\n(iii)C+O₂→H(g)","subQuestions":[{"label":"ক","question":"ইলেকট্রোপ্লেটিং কাকে বলে?","answer":"তড়িৎ বিশ্লেষণের মাধ্যমে কোনো ধাতুর উপর অন্য কোনো ধাতুর প্রলেপ দেওয়ার প্রক্রিয়াকে ইলেকট্রোপ্লেটিং বা তড়িৎ প্রলেপন বলে।"},{"label":"খ","question":"নিউক্লিয়ার ফিশন বিক্রিয়া কী? ব্যাখ্যা কর।","answer":"যে নিউক্লিয়ার বিক্রিয়ায় কোনো ভারী মৌলের নিউক্লিয়াসকে নিউট্রন দ্বারা আঘাত করলে তা ভেঙে প্রায় সমান ভরের দুটি হালকা মৌলের নিউক্লিয়াসে পরিণত হয় এবং সেই সাথে কয়েকটি নিউট্রন ও বিপুল পরিমাণ শক্তি নির্গত হয়, তাকে নিউক্লিয়ার ফিশন বিক্রিয়া বলে।\n235U+1n→141Ba+92Kr+31n+শক্তি\nউৎপন্ন নিউট্রনগুলো আবার অন্য U-235 নিউক্লিয়াসকে আঘাত করে শৃঙ্খল বিক্রিয়া চালিয়ে যায়। পারমাণবিক বিদ্যুৎকেন্দ্রে এ বিক্রিয়ার মাধ্যমে বিদ্যুৎ উৎপাদন করা হয়।"},{"label":"গ","question":"(i) নং বিক্রিয়াটিতে জারণ-বিজারণ সংঘটিত হয়েছে-ব্যাখ্যা কর।","answer":"উদ্দীপকের (i) নং বিক্রিয়াটি হলো সালফারের দহন:\nS+O₂→SO₂\nজারণ সংখ্যার পরিবর্তন: বিক্রিয়ার পূর্বে মুক্ত মৌল S ও O₂ এর জারণ সংখ্যা 0। SO₂ অণুতে O এর জারণ সংখ্যা -2, তাই S এর জারণ সংখ্যা x+2(-2)=0 বা x=+4। অর্থাৎ S এর জারণ সংখ্যা 0 থেকে +4 এ বৃদ্ধি পেয়েছে, তাই S এর জারণ ঘটেছে । আবার O এর জারণ সংখ্যা 0 থেকে -2 এ হ্রাস পেয়েছে, তাই O এর বিজারণ ঘটেছে। ইলেকট্রন স্থানান্তরের ভিত্তিতে অর্ধবিক্রিয়া:\nজারণ অর্ধবিক্রিয়া: S→S⁴⁺+4e⁻\nবিজারণ অর্ধবিক্রিয়া: O₂+4e⁻→2O²⁻\nএখানে S ইলেকট্রন ত্যাগ করে বিজারক এবং O₂ ইলেকট্রন গ্রহণ করে জারক হিসেবে কাজ করেছে । একই সাথে জারণ ও বিজারণ ঘটায় (i) নং বিক্রিয়াটি একটি জারণ-বিজারণ (রেডক্স) বিক্রিয়া ।"},{"label":"ঘ","question":"E(g), F(g) এবং H(g) এর পরিবেশের উপর ক্ষতিকর প্রভাবসমূহ বিক্রিয়াসহ ব্যাখ্যা কর।","answer":"উদ্দীপকের বিক্রিয়াগুলো:\n(i)S+O₂→SO₂(E)\n(ii)2NO+O₂→2NO₂(F)\n(iii)C+O₂→CO₂(H)\nঅর্থাৎ E হলো সালফার ডাইঅক্সাইড (SO₂), F হলো নাইট্রোজেন ডাইঅক্সাইড (NO₂) এবং H হলো কার্বন ডাইঅক্সাইড (CO₂)। এদের পরিবেশের উপর ক্ষতিকর প্রভাব: এসিড বৃষ্টি: SO₂ ও NO₂ বাতাসের জলীয় বাষ্প ও অক্সিজেনের সাথে বিক্রিয়া করে সালফিউরিক এসিড, সালফিউরাস এসিড ও নাইট্রিক এসিড তৈরি করে, যা বৃষ্টির পানির সাথে নেমে এসে এসিড বৃষ্টি ঘটায় ।\nSO₂+H₂O→H₂SO₃\n2SO₂+O₂→2SO₃; SO₃+H₂O→H₂SO₄\n4NO₂+O₂+2H₂O→4HNO₃\nCO₂ পানিতে দ্রবীভূত হয়ে দুর্বল কার্বনিক এসিড তৈরি করে বৃষ্টির পানিকে কিছুটা অম্লীয় করে ।\nCO₂+H₂O→H₂CO₃\nএসিড বৃষ্টির ফলে মাটি ও জলাশয়ের pH কমে যায়। এতে ফসল উৎপাদন কমে, গাছপালা মারা যায়, মাছসহ জলজ প্রাণীর অস্তিত্ব হুমকির মুখে পড়ে । এছাড়া মার্বেল পাথরের (CaCO₃) স্থাপনা, ভাস্কর্য ও ধাতব অবকাঠামো ক্ষয়প্রাপ্ত হয়।\nCaCO₃+H₂SO₄→CaSO₄+H₂O+CO₂\nগ্রিনহাউস প্রভাব: CO₂ একটি গ্রিনহাউস গ্যাস। বায়ুমণ্ডলে CO₂ এর পরিমাণ বাড়লে তা ভূপৃষ্ঠ থেকে বিকিরিত তাপ আটকে রাখে, ফলে পৃথিবীর তাপমাত্রা বেড়ে যায় (বৈশ্বিক উষ্ণায়ন)। এতে মেরু অঞ্চলের বরফ গলে সমুদ্রপৃষ্ঠের উচ্চতা বৃদ্ধি পায় এবং জলবায়ুর পরিবর্তন ঘটে। স্বাস্থ্যঝুঁকি: SO₂ ও NO₂ বিষাক্ত গ্যাস; এগুলো শ্বাসকষ্ট, হাঁপানি, ফুসফুসের রোগ ও চোখ জ্বালাপোড়ার সৃষ্টি করে এবং ধোঁয়াশা (smog) তৈরিতে ভূমিকা রাখে। সুতরাং, E, F ও H গ্যাস তিনটি পরিবেশ ও জীবজগতের জন্য ক্ষতিকর।"}]},{"id":"ch9-cq8","chapter":9,"num":8,"importance":2,"topic":"পানি","board":"কুমিল্লা বোর্ড ২০২৫","stem":"(i)N₂O₄(g)⇌2NO₂(g)\n(ii)","diagramId":"ch9-cq8","subQuestions":[{"label":"ক","question":"অম্ল কাকে বলে?","answer":"যেসব যৌগ জলীয় দ্রবণে হাইড্রোজেন আয়ন (H⁺) দান করে বা ক্ষারকের সাথে বিক্রিয়া করে লবণ ও পানি উৎপন্ন করে, তাদের অম্ল (এসিড) বলে। যেমন— HCl, H₂SO₄।"},{"label":"খ","question":"সকল খনিজ আকরিক নয়–ব্যাখ্যা কর।","answer":"যেসব খনিজ থেকে লাভজনকভাবে ও সহজে ধাতু নিষ্কাশন করা যায় সেগুলোই আকরিক । সব খনিজে ধাতুর পরিমাণ বেশি থাকে না বা তা থেকে লাভজনকভাবে ধাতু নিষ্কাশন করা যায় না। যেমন— কাদামাটি (Al₂O₃.2SiO₂.2H₂O) অ্যালুমিনিয়ামের খনিজ, কিন্তু তা থেকে লাভজনকভাবে Al নিষ্কাশন করা যায় না; অথচ বক্সাইট (Al₂O₃.2H₂O) থেকে করা যায়। তাই বক্সাইট আকরিক, কাদামাটি নয়। সুতরাং সকল আকরিক খনিজ, কিন্তু সকল খনিজ আকরিক নয়।"},{"label":"গ","question":"(i) নং বিক্রিয়ার ক্ষেত্রে সাম্যাবস্থায় চাপের প্রভাব লা-শাতেলিয়ার নীতির আলোকে ব্যাখ্যা কর।","answer":"N₂O₄(g)⇌2NO₂(g)\nএখানে বিক্রিয়কের গ্যাসীয় মোল সংখ্যা 1 এবং উৎপাদের মোল সংখ্যা 2; অর্থাৎ সম্মুখমুখী বিক্রিয়ায় মোল সংখ্যা তথা আয়তন বৃদ্ধি পায়। লা-শাতেলিয়ার নীতি অনুসারে, সাম্যাবস্থায় থাকা কোনো ব্যবস্থার চাপ পরিবর্তন করলে সাম্যাবস্থা এমন দিকে সরে যায় যাতে চাপ পরিবর্তনের ফল প্রশমিত হয়।\n• চাপ বৃদ্ধি করলে: সাম্যাবস্থা কম মোলের দিকে অর্থাৎ বাম দিকে সরে যাবে। NO₂ যুক্ত হয়ে N₂O₄ উৎপন্ন হবে, ফলে উৎপাদ (NO₂) এর পরিমাণ কমবে।\n• চাপ হ্রাস করলে: সাম্যাবস্থা বেশি মোলের দিকে অর্থাৎ ডান দিকে সরে যাবে। N₂O₄ বিয়োজিত হয়ে বেশি NO₂ উৎপন্ন হবে। সুতরাং এ বিক্রিয়ায় NO₂ এর উৎপাদন বাড়াতে নিম্ন চাপ অনুকূল ।"},{"label":"ঘ","question":"উদ্দীপকের পাত্রদ্বয়ের পানিকে কাপড় কাঁচার উপযোগী করার প্রক্রিয়া ভিন্ন–বিশ্লেষণ কর।","answer":"কাপড় কাচার উপযোগী হতে হলে পানিকে মৃদু হতে হবে, অর্থাৎ পানি থেকে Ca²⁺ ও Mg²⁺ আয়ন অপসারণ করতে হবে। পাত্র-ক: এতে CaCl₂ দ্রবীভূত আছে । ক্লোরাইড লবণ স্থায়ী খরতা সৃষ্টি করে, তাই এ পানি স্থায়ী খর পানি। শুধু তাপ দিলে এ খরতা দূর হয় না। এতে সোডিয়াম কার্বনেট যোগ করলে অদ্রবণীয় CaCO₃ অধঃক্ষিপ্ত হয় এবং Ca²⁺ আয়ন অপসারিত হয়:\nCaCl2(aq)+Na2CO3(aq)→CaCO₃(s)↓ + 2NaCl(aq)\nউৎপন্ন NaCl খরতা সৃষ্টি করে না; অধঃক্ষেপ ছেঁকে নিলে মৃদু পানি পাওয়া যায়। পাত্র-খ: এতে Mg(HCO₃)₂ দ্রবীভূত আছে । বাইকার্বনেট লবণ অস্থায়ী খরতা সৃষ্টি করে, তাই এ পানি অস্থায়ী খর পানি। শুধু উত্তপ্ত করলেই অদ্রবণীয় MgCO₃ তলানি পড়ে ও CO₂ বের হয়ে যায়:\nΔ\nMg(HCO3)2(aq)⟶MgCO₃(s)↓+CO₂(g)↑+H₂O(l)\nতলানি ছেঁকে পৃথক করলে পানি মৃদু হয়।\nসুতরাং পাত্র-ক এর পানি রাসায়নিক পদার্থ (Na₂CO₃) যোগ করে এবং পাত্র-খ এর পানি শুধু তাপ দিয়ে মৃদু করা হয় — তাই দুই পাত্রের পানিকে কাপড় কাচার উপযোগী করার প্রক্রিয়া ভিন্ন।"}]},{"id":"ch10-cq1","chapter":10,"num":1,"importance":3,"topic":"ধাতু নিষ্কাশন","board":"বরিশাল বোর্ড ২০২০","stem":"(i) চালকোসাইট (ii) বক্সাইট (iii) ক্যালামাইন","subQuestions":[{"label":"ক","question":"নিঃসরণ কাকে বলে?","answer":"উচ্চচাপ অঞ্চল থেকে কোনো গ্যাসের অণুসমূহ সরু ছিদ্রপথে নিম্নচাপ অঞ্চলে বেরিয়ে আসার প্রক্রিয়াকে নিঃসরণ বলে।"},{"label":"খ","question":"গ্রুপ-11 এর মৌলগুলোকে মুদ্রা ধাতু বলা হয় কেন? ব্যাখ্যা কর।","answer":"পর্যায় সারণির গ্রুপ-11 এর মৌল কপার (Cu), সিলভার (Ag) ও গোল্ড (Au)। এ ধাতুগুলো কম সক্রিয়, তাই বাতাস, পানি ও অক্সিজেনের সাথে সহজে বিক্রিয়া করে না এবং সহজে ক্ষয় হয় না। এরা উজ্জ্বল, আঘাতে ভাঙে না এবং সহজে পাত ও তারে পরিণত করা যায়। এসব বৈশিষ্ট্যের কারণে প্রাচীনকাল থেকে
