। [৩ বোর্ডে এনসনছ]","answer":"১র্ র কানি আনছ সোডিয়াম হাইন বািাইনর্ি (NaOH) দ্রবণ। দেওয়া আনছ, NaOH এর ভর, w = 20 g রদ্রবণেি আেতে, V = 550 mL NaOH এর আণর ক ভর, M=23+16+1=40g/mol ঘেমানা, S =? w×1000 আমরা োরন, S = M×V 20 × 1000 = 40 × 550 = 0.909 M ∴ ১র্ র কানভর দ্রবণেি ঘেমানা 0.909 M।"},{"label":"ঘ","question":"উভয় র কানভর দ্রবণ একমেত করলে মর্প্শ্ত দ্রবণেি প্কৃ রত র র র র 6 2 6 1 বিশ্লেষণ কি। [২ বোর্ডে এনসনছ] ় ্ ত","answer":"১র্ র কানি NaOH (ক্ষার) এবং ২ে র কানি H SO (এসিড) 2 4 ্ ় ় আনছ। দ্রবণদে মর্প্শ্ত করলে প্শর্ে বিক্রিয়া ঘনট। র র র 2NaOH+H SO →Na SO +2H O 2 4 2 4 2 ় ় ২ে র কানি H SO এর ভর নির্ণয়: 2 4 দেওয়া আনছ, S = 0.816 M, V = 250 mL, H SO এর আণর ক 2 4 ভর M=2+32+64=98g/mol S × M × V 0. 816 × 98 × 250 w = = =19.992g 1000 1000 সর্ীকিণ অেুযায়ী, 2NaOH = 2 × 40 = 80 g এবং H SO = 98 2 4 g। 98 g H SO বিক্রিয়া করে 80 g NaOH এর সাথে 2 4 ∴ 19.992 g H SO রবভতর্ব যা কজর (80 × 19.992)/98 g = 16.32 2 4 g NaOH এর সাথে কিন্তু ১র্ র কানি NaOH আনছ 20 g। ∴ অবভশটট NaOH = (20 - 16.32) g = 3.68 g ় ় অর্থাৎ H SO সম্পূর্ণ থশষ হয়ে যায় এবং 3.68 g NaOH অরতরিকব 2 4 − ় ় ় ় থেকে যায়। অ মশটট NaOH পানিনত র নোরৈত হয়ে OH আয়ন ় ় দেয়, িনল দ্রবণেি pH 7 এর বেশি হয়। সু তিাং, মর্প্শ্ত দ্রবণটি ক্ষারীে প্কৃ রতি হন; এনত লাল ললটর্াস েীল র র র হন।"}],"board":"চট্টগ্রাম বোর্ড ২০২৫","diagramId":"ch9-cq4"},{"id":"ch9-cq5","chapter":9,"num":5,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও:","subQuestions":[{"label":"ক","question":"ললমর্টিং র মে্ব েক কী? [২ বোর্ডে এনসনছ]","answer":"কোনো রাসায়নিক বিক্রিয়াে একারধক র মে্বজনকি মধ্যে বে ় ় র মে্ ব েকটি পরির্ার্ণ কম থাকাি কারণে সম্পূর্ণিূর্প বিক্রিয়া করে টাইপ ভিততি ﻿ ় ় থশষ হয়ে যায় এবং উৎপানদি পরিমাণ রেধডািণ করে, তানক ললমর্টিং র মে্ ব েক বলে। 2"},{"label":"খ","question":"নাইট্রোজেন-এর যোজনী ও যোজনী ইলেকট্রন সমান েে কেন? র র ব্যাখ্যা কি।","answer":"নাইট্রোজেনের (N) পারমাণবিক সংখ্যা 7; ইলেকট্রন বিন্যাস: 1s র র 2 3 2s 2p। এর স ড ছহঃথ শক্তিস্তরে 5টি ইলেকট্রন আনছ, তাই ি র নাইট্রোজেনের যোজনী ইলেকট্রন 5। র র কিন্তু অটট ক পূর্ণ কিনত নাইট্রোজেনের আিও 3টি ইলেকট্রন প্নোৈে র র ় ় হয়, তাই এটি 3টি ইলেকট্রন থশোি বা গ্রহণ করে ন্ধে গঠে করে। র র যেমন: NH অণুনত N এর যোজনী 3। 3 অর্থাৎ যোজনী ইলেকট্রন হলো স ড ছহঃথ তনভর মোট ইলেকট্রন, আি বিভব র যোজনী হলো ন্ধে গঠনে অংশগ্রহণকািী ইনলক ট নেি সংখ্যা। তাই র র নাইট্রোজেনের যোজনী (3) ও যোজনী ইলেকট্রন (5) সমান েে। র র"},{"label":"গ","question":"র কাি-A বত 10g Zn যোগ করলে উৎপারদত গ্যাসের আেতে STP-বত কত হন?","answer":"র কাি-A বত আনছ 200 mL 0.5 M HCl। Zn যোগ করলে H 2 ় গ্যাস উৎপন্ন হয়। Zn+2HCl→ZnCl +H 2 2 Zn = 65; HCl এর আণর ক ভর = 1+35.5 = 36.5; 2HCl = 73 SMV 0.5×36.5×200 HCl এবিভবর, w = = =3.65g 1000 1000 ় ় সর্ীকিণ অেুযায়ী, 73 g HCl বিক্রিয়া করে 65 g Zn এর সাথে 65×3.65 ∴ 3.65 g HCl রবভতর্ব যা কজর =3.25gZn এর সাথে 73 ় ় যোগ করা Zn = 10 g, ো প্নোৈনেি বচনে বেশি; (10-3.25) = 6.75gZn অর মেব্ ত থাকন। তাই HCl হলো ললমর্টি ং র মে্ব েক এবং H এর পরিমাণ HCl দ্বারা রেধডারিত হন। 2 ় ন ় সর্ীকিণ অেুযায়ী, 73 g HCl থেকে STP বত H উৎপন্ন হয় 22.4 L 2 22.4×3.65 ন ় ∴ 3.65 g HCl ক্ষেজক H2 উৎপন্ন হয =1.12L 73 সু তিাং, র কাি-A বত 10 g Zn যোগ করলে STP বত 1.12 L হাইরোজেন গ্যাস উৎপন্ন হন।"},{"label":"ঘ","question":"উদ্দীপকের র কাি দুটি ি দ্রবণ মর্প্শ্ত করলে দ্রবণেি প্কৃ রত র র র র বকমে হন? বিশ্লেষণ কি। [২ বোর্ডে এনসনছ]","answer":"র কাি-A বত আনছ HCl এসিড এবং র কাি-B বত আনছ KOH ক্ষার। মর্প্শ্ত করলে প্শর্ে বিক্রিয়া ঘনট। র র HCl+KOH→KCl+H O 2 রবকার-A কি HCl এবিভবর = 0.5×36.5×200 = 3.65g 1000 র কাি-B বত KOH এর ভর = 4 g; KOH এর আণর ক ভর = 39+ 16+1=56 ় ় সর্ীকিণ অেুযায়ী, 56 g KOH বিক্রিয়া করে 36.5 g HCl এর সাথে 36.5×4 ∴ 4 g KOH রবভতর্ব যা কজর =2.61gHCl এর সাথে 56 ∴ অরবভতরব্ ি HCl = (3.65-2.61)g = 1.04g মোল ছহনসন : HCl = 3.65 = 0.1 মোল, KOH = 4 = 0.0714 36.5 56 ় ় ় ় মোল। 1 : 1 অেুপানত বিক্রিয়া হওয়ায় KOH সম্পূর্ণ থশষ হয়ে (0.1-0.0714) = 0.0286 মোল HCl অ মশটট থাকে। ্ ় ় মর্শ্র্ণ অরতরিকব HCl থাকাে দ্রবণে H+ আয়নেি আরধকয থাকন, র র pH 7 এর কম হন এবং দ্রবণটি েীল ললটর্াসনক লাল কিন। সু তিাং, র কাি দুটি ি দ্রবণ মর্প্শ্ত করলে মর্শ্ণটি অম্ল ীে প্কৃ রতি র র র র হন। ক মাস্ট ার সাজেশন এসিড বৃটটি"}],"board":"ময়মনসিংহ বোর্ড ২০২০","diagramId":"ch9-cq5"},{"id":"ch9-cq6","chapter":9,"num":6,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও:","subQuestions":[{"label":"ক","question":"বসার্া অযাস কী?","answer":"অোদ্ড সোডিয়াম কার্বনেটনক (Na CO ) বসার্া অযাশ বলে। র 2 3 ূ ূ ু ্"},{"label":"খ","question":"\"সকল খনিজই আকরিক েে\"— ব্যাখ্যা কি। [৩ বোর্ডে এনসনছ] ্ ় ্","answer":"ি-পৃনঠে বা ি-গনিড প্াকৃ রতকরান প্াপ্ বেস পদার্থড ধাত র্ুকব র র ত অবস্থাে বা যৌগিূর্প থাকে, তানদি খনিজ বলে। কিন্তু বেস খনিজ ্ ় থেকে লাভজনকভাবে ও সহজে ধাত নিষ্কাশন করা যায়, শুধু বসগুনলানকই আকরিক বলে। যেমন: অযালুমর্রেোর্ কাদামাটি (Al O .2SiO .2H O) এবং িাইট 2 3 2 2 ় ় (Al O .2H O) উভয়ই অযালুমর্রেোনর্ি খনিজ। কিন্তু কাদামাটি 2 3 2 ় ্ ় থেকে অযালুমর্রেোর্ নিষ্কাশন যে হুল ও কঠ ি ে, তাই এটি আকরিক ় ্ ় েে; িাইট থেকে সহজে ও লাভজনকভাবে Al নিষ্কাশন করা যায়, তাই এটি আকরিক। অর্থাৎ সকল আকরিকই খনিজ, কিন্তু সকল খনিজ আকরিক েে। ্ ু"},{"label":"গ","question":"উপেুকব বিক্রিয়াসহ B যৌগটি সোকব কি।","answer":"উদ্দীপকের ফ্ার্স্ক চোপাথি (CaCO ) ও খনিজ এসিড (যেমন: ল 3 ় ় ় ় ন লঘু HCl) বেওো হয়েছে। এদের বিক্রিয়াে উৎপন্ন গ্যাস B গ্যাসৈানি সংগ্হ করা হয়। CaCO +2HCl→CaCl +CO +H O 3 2 2 2 সু তিাং, B হলো কার্বন র্াইঅক্সাইড (CO )। 2 ্ ু শনািবকরণ: উৎপন্ন গ্যাসনক স্বচ্ছ চনেি পানিনত [Ca(OH) দ্রবণ] 2 র ় ় ় চালো করলে অদ্রবণীে ক্যালসিয়াম কার্বনেট ততরি হয়ে পানি বঘালা ় ় হয়ে যায়। Ca(OH) +CO →CaCO +H O 2 2 3 2 ় ় ় আিও বেশি সময় ধনি গ্যাস চালো করলে দ্রবণীে ক্যালসিয়াম ় ় ্ ় াইকার্বনেট ততরি হয়ে বঘালা িা দি হয় এবং পানি আ াি স্বচ্ছ হয়। CaCO +CO +H O→Ca(HCO ) 3 2 2 3 2 ত ় ় এছাড় বা গ্যাসটি জ্লন্ কাঠ ি রেমিনে দেয় এবং বিৈা েীল ললটর্াসনক ় ় হালকা লাল করে। এস পিীক্ষা থেকে রেক্স্চত হওো যায় বে, B যৌগটি CO। 2"},{"label":"ঘ","question":"পরিবেশেি উপর B যৌগটভর প্রবণতা বিশ্লেষণ কি। [২ বোর্ডে এনসনছ] র ্","answer":"'গ' থেকে পাই, B যৌগটি কার্বন র্াইঅক্সাইড (CO ), ো একটি 2 ী ় ্ অম্ল ধর্ী অক্সাইড ও প্ধাে মগ্েহাউস গ্যাস। াে়ুর্ণ্ল স্ব ািার ক র র ় ় মানাি CO উলিনদি সানলাকসংন্লষর্ণি জন্য প্নোৈেীে এবং 2 ্ র টাইপ ভিততিক মাস্ট ﻿ পৃ রথ ীনক উষ্ণ িার্খ। কিন্তু এর পরিমাণ ব নড় থগনল পরিবেশেি ক্ষরত হে: ্ ় ্ ূ ১. ভগ্নহাউস প্রবণতাব ও ববর্ে ক উষ্ণাযন: অরতরিকব CO িপৃঠে থেকে র র 2 র রকরিত তাপ আটনক িার্খ, িনল পৃরথ ীি গড় তাপমানা ানড়। বর্িু অঞ্চনলি ভর গনল সর্ুদ্পৃনঠে ি উচ্চতা ানড় এবং রেচ ় ় ় ় উপকূ লীে এলাকা তললনে োওোি আশঙ্কা বদখা দেয়। ় ু ২. েেবায়ু পরিবর্তন: ঋতচতরে্ব ি পরি তড ে, অো ৃটটি, অরত ৃটটি, ় ় ঘূ চণড ঝড় ও েযা ব নড় যায়, কৃ রষ উৎপাদে যাহত হয়। ূ ় ৩. এসিড বৃটটি : CO ৃটটি ি পানিনত দ্ ীিত হয়ে কা ডরেক এসিড 2 র ততরি করে এবং এসিড ৃটটি নত িমর্কা িার্খ। এনত মাটি ও ৈলাশনেি pH কনর্, িসল, গাছপালা, র্াছ ও প্ যাংকটেসহ ত ় ৈলৈ ৈী ক্ষরতগ্ত হয়। CO +H O→H CO 2 2 2 3 ে ্ ূ ় ৪. সমু তরদ্র অ্িা বৃ দ্বধ: সর্ু তরদ্ি পানিনত CO দ্ ীিত হয়ে অম্ল তা র ্ র 2 র ় ্ ় াড় াে, িনল প্ াল ও থখালসেুকব প্াণীি ক্ষরত হয়। র র যায় াহয়, র দুযৎনকনড ্, কলকািখাো ও ইটিাটাে ৈী া্মল জ্ালারেি র ব দহয় এবং ে উৈানড় ি িনল াে়ুর্ণ্ল CO এর পরিমাণ েব্ র্াগত 2 ্ ় াড় নছ। সু তিাং B যৌগটি (CO2) অরতরিকব র্াযায় পরিবেশেি জন্য অতযন্ ক্ষরতকি।"}],"board":"দিনাজপুর বোর্ড ২০২০","diagramId":"ch9-cq6"},{"id":"ch9-cq7","chapter":9,"num":7,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: (i)S + O →E(g) 2 (ii)NO + O →F(g) 2 (iii)C + O →H(g) 2","subQuestions":[{"label":"ক","question":"ইনলকন ট ানপ্ টিং কাকে বলে? ় ়","answer":"তপ্ড় ৎ র ন্ল ষর্ণি মাধ্যমে কোনো ধাতি উপর অেয কোনো ধাতি ় ় প্নলপ দেওয়াি প্মে্বোনক ইনলকন ট ানপ্ টিং বা তপ্ড় ৎ প্নলপে বলে। র র র ় ় ় ়"},{"label":"খ","question":"রেউর্োি মিশে বিক্রিয়া কী? ব্যাখ্যা কি। [৩ বোর্ডে এনসনছ] ় ়","answer":"বে রেউর্োি বিক্রিয়াে কোনো িািী মৌলের রেউর্োসনক ল ল ্ ় রেউ ট ে দ্বারা আঘাত করলে তা বিনে প্রায় সমান ভরের দুটি হালকা ় ় ় মৌলের নিউক্লিয়াসে পরিণত হয় এবং বসই সাথে কনেকটি রেউ ট ে ও ল র ্ ় ় ় র পুল পরিমাণ শক্তি রেগডত হয়, তানক রেউর্োি মিশে বিক্রিয়া বলে। 235U+1n→141Ba+92Kr+31n+শক্তি ় উৎপন্ন রেউ ট েগুনলা আ াি অেয U-235 রেউর্োসনক আঘাত করে র ল ় ় ় ় শৃ ঙ্খল র মে্ ব ো চাললনে যায়। পারমাণবিক র দুযৎনকননড ্ এ বিক্রিয়াি মাধ্যমে র দুযৎ উৎপাদে করা হয়।"},{"label":"গ","question":"(i) েং বিক্রিয়াটিনত জারণ-র জারণ সংঘটি ত হয়েছে- ব্যাখ্যা কি।","answer":"উদ্দীপকের (i) েং বিক্রিয়াটি হলো সালিানভর দহে: S+O →SO 2 2 ় ্ জারণ সংখ্যাি পরি তড ে: বিক্রিয়াি পূন ড র্ুকব মৌল S ও O এর 2 জারণ সংখ্যা 0। SO অণুনত O এর জারণ সংখ্যা -2, তাই S এর 2 জারণ সংখ্যা x+2(-2) = 0 বা x = +4। ্ ় অর্থাৎ S এর জারণ সংখ্যা 0 থেকে +4 এ বৃদ্ধি থপনেনছ, তাই S এর জারণ ঘনটনছ। আ াি O এর জারণ সংখ্যা 0 থেকে -2 এ হ্াস থপনেনছ, তাই O এর র জারণ ঘনটনছ। ার সাজেশন ত ় ইলেকট্রন থাোন্নভর মিপ্কনত অধডবিক্রিয়া: বিভব 4+ − জারণ অধডবিক্রিয়া: S → S +4e − 2− র জারণ অধডবিক্রিয়া: O +4e → 2O 2 এখানে S ইলেকট্রন তযাগ করে র জারক এবং O ইলেকট্রন গ্রহণ র 2 র র করে জারক ছহনসন কাৈ করেনছ। একই সাথে জারণ ও র জারণ ় ় ় ঘটাে (i) েং বিক্রিয়াটি একটি জারণ-র জারণ (বির্ি) বিক্রিয়া।"},{"label":"ঘ","question":"E(g), F(g) এবং H(g) এর পরিবেশেি উপর ক্ষরতকি প্রবণতা সর্ূহ র মে্ ব োসহ ব্যাখ্যা কি। [২ বোর্ডে এনসনছ]","answer":"উদ্দীপকের বিক্রিয়াগুনলা: (i)S + O → SO (E) 2 2 (ii)2NO+O →2NO (F) 2 2 (iii)C + O → CO (H) 2 2 অর্থাৎ E হলো সালিাি র্াইঅক্সাইড (SO ), F হলো নাইট্রোজেন 2 র র্াইঅক্সাইড (NO ) এবং H হলো কার্বন র্াইঅক্সাইড (CO )। এদের 2 2 পরিবেশেি উপর ক্ষরতকি প্রবণতা : এসিড বৃটটি : SO ও NO াতানসি জলীয় বাষ্প ও অক্সিজেনের সাথে 2 2 র মে্ ব ো করে সালমিউরিক এসিড, সালমিউিাস এসিড ও োইটি ক এসিড ততরি করে, ো ৃটিটি পানির সাথে বেনর্ এনস এসিড ৃটটি ঘটাে। SO +H O→H SO 2 2 2 3 2SO +O →2SO; SO +H O→H SO 2 2 3 3 2 2 4 4NO +O +2H O→4HNO 2 2 2 3 ূ ় CO পানিনত দ্ ীিত হয়ে দু ডল কা ডরেক এসিড ততরি করে ৃটটি ি 2 র পারজনক রকছটা অম্ল ীে করে। CO +H O→H CO 2 2 2 3 ় ় এসিড ৃটটি ি িনল মাটি ও ৈলাশনেি pH কনর্ যায়। এনত িসল ় ত উৎপাদে কনর্, গাছপালা র্ািা যায়, র্াছসহ ৈলৈ প্াণীি অলতত র ব ্ হুর্রকি র্ু র্খ পনড়। এছাড় বা র্ান ডল পাথনভর (CaCO ) থাপো, িাস্ক েড 3 ি ় ় ও ধাত অ কাঠানর্া ক্ষেপ্াপ্ হয়। র ত CaCO +H SO →CaSO +H O+CO 3 2 4 4 2 2 ভগ্নহাউস প্রবণতাব: CO একটি মগ্েহাউস গ্যাস। াে়ুর্ণ্ল CO এর র র 2 র 2 পরিমাণ াড় বলে তা িপৃঠে থেকে র রকরিত তাপ আটনক িার্খ, িনল ় ্ ় পৃ রথ ীি তাপমানা ব নড় যায় (ত র্ল ক উষ্ণােে)। এনত বর্িু অঞ্চনলি ্ ় ় ভর গনল সর্ুদ্পৃনঠে ি উচ্চতা বৃদ্ধি পায় এবং ৈল াে়ুি পরি তড ে র ্ ঘনট। ্ ্ সব াস্যঝু রক: SO ও NO র ষাকব গ্যাস; এগুনলা ্ল াসকটট, হ াপানি, থ 2 2 িু সিু নসি বিাগ ও বচাখ জ্ালার্পাড় াি সৃটটি করে এবং বধ াোশা (smog) ততরিনত িমর্কা িার্খ। সু তিাং, E, F ও H গ্যাস রতেটি পরিন শ ও ৈী ৈগনতি জন্য ক্ষরতকি। পারন"}],"board":"যশোর বোর্ড ২০২৫"},{"id":"ch9-cq8","chapter":9,"num":8,"importance":2,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: (i)N O (g) ⇌ 2NO (g) 2 4 2 (ii)","subQuestions":[{"label":"ক","question":"অম্ল কাকে বলে? [৩ বোর্ডে এনসনছ] টাইপ ভিততিক ম ﻿","answer":"বেস যৌগ জলীয় দ্রবণে হাইরোজেন আয়ন (H ) দাে করে বা ় ক্ষারনকি সাথে বিক্রিয়া করে লবণ ও পানি উৎপন্ন করে, তানদি অম্ল (এসিড) বলে। যেমন— HCl, H SO। 2 4 ্ ্"},{"label":"খ","question":"সকল খনিজ আকরিক েে– ব্যাখ্যা কি। [৩ বোর্ডে এনসনছ] ় ় ়","answer":"বেস খনিজ থেকে লাভজনকভাবে ও সহজে ধাত নিষ্কাশন করা ় ু যায় বসগুনলাই আকরিক। স খরেনৈ ধাতি পরিমাণ বেশি থাকে ো ু ্ ় বা তা থেকে লাভজনকভাবে ধাত নিষ্কাশন করা যায় ো। যেমন— কাদামাটি (Al O .2SiO .2H O) অযালুমর্রেোনর্ি খনিজ, 2 3 2 2 ্ ় কিন্তু তা থেকে লাভজনকভাবে Al নিষ্কাশন করা যায় ো; অথচ িাইট (Al O .2H O) থেকে করা যায়। তাই িাইট আকরিক, 2 3 2 কাদামাটি েে। সু তিাং সকল আকরিক খনিজ, কিন্তু সকল খনিজ আকরিক েে।"},{"label":"গ","question":"(i) েং বিক্রিয়াি থক্ষতরে সার্যা থাে চার্পি প্রবণতা লা-শানতললোি েীরতি আনলানক ব্যাখ্যা কি। ্ ়","answer":"N O (g) ⇌ 2NO (g) 2 4 2 ় ় এখানে র মে্ব জনকি গ্যাসীে মোল সংখ্যা 1 এবং উৎপানদি মোল ় ় ় ্ সংখ্যা 2; অর্থাৎ সম্মখর্ুখী বিক্রিয়াে মোল সংখ্যা তথা আেতে বৃদ্ধি ু ্ পায়। ় ় লা-শানতললোি েীরত অনুসারে, সার্যা থাে থাকা কোনো য থাি চাপ ি ি পরি তড ে করলে সার্যা থা এর্ে রদনক সনি যায় োনত চাপ পরি তড নেি িল প্শমর্ত হয়। • িাপ বৃ দ্বধ করজে: সার্যা থা কম বর্ানলি রদনক অর্থাৎ ার্ রদনক ্ ় সনি োন। NO েুকব হয়ে N O উৎপন্ন হন, িনল উৎপাদ 2 2 4 (NO ) এর পরিমাণ কমন। 2 • িাপ হ্াস করজে: সার্যা থা বেশি বর্ানলি রদনক অর্থাৎ মান রদনক বিভব ় ় সনি োন। N O র নোরৈত হয়ে বেশি NO উৎপন্ন হন। 2 4 2 ় ় সু তিাং এ বিক্রিয়াে NO এর উৎপাদে াড় ানত রেম্ন চাপ অেুকূ ল। 2"},{"label":"ঘ","question":"উদ্দীপকের পায়দনেি পারজনক কাপড় ক াচাি উপনোগী করাি ় প্মে্ ব ো ভিন্ন–বিশ্লেষণ কি। র ্","answer":"কাপড় কাচাি উপনোগী হনত হলে পারজনক র্ৃদু হনত হন, অর্থাৎ 2+ 2+ পানি থেকে Ca ও Mg আয়ন অপসািণ কিনত হন। ূ ় পাতর-ক: এনত CaCl দ্ ীিত আনছ। ক্লোরাইড লবণ থােী খিতা সৃটটি 2 র ল ি ় ় করে, তাই এ পানি থােী খি পানি। শুধু তাপ রদনল এ খিতা দি হয় ় ় ো। এনত সোডিয়াম কার্বনেট যোগ করলে অদ্রবণীে CaCO র 3 2+ ় ় ় অধঃপ্ক্ষপ্ হয় এবং Ca আয়ন অপসারিত হে: CaCl2(aq)+Na2CO3(aq) → CaCO (s)↓ + 2NaCl(aq) 3 উৎপন্ন NaCl খিতা সৃটটি করে ো; অধঃর্ক্ষপ বছ নক রেনল র্ৃদু পানি ় ় পাওয়া যায়। পাতর-খ্: এনত Mg(HCO ) দ্ ীিত আনছ। াইকার্বনেট লবণ 3 2 র ় ় অথােী খিতা সৃটটি করে, তাই এ পানি অথােী খি পানি। শুধু উকপ্ ি ি ত ় ় ় করলেই অদ্রবণীে MgCO তলারে পনড় ও CO ব ি হয়ে যায়: র 3 2 Δ Mg(HCO3)2(aq) ⟶MgCO (s)↓+CO (g)↑+H O(l) 3 2 2 তলারে বছ নক পৃথক করলে পানি র্ৃদু হয়। সু তিাং পায়-ক এর পানি রাসায়নিক পদাথড (Na CO ) যোগ করে 2 3 ় ় এবং পায়-খ এর পানি শুধু তাপ দিয়ে র্ৃদু করা হয় — তাই দুই পাতরেি ় পারজনক কাপড় কাচাি উপনোগী করাি প্মে্বো ভিন্ন। াস্ট ার সাজেশন খ্রনে সম্পদ"}],"board":"কুমিল্লা বোর্ড ২০২৫","diagramId":"ch9-cq8"},{"id":"ch10-cq1","chapter":10,"num":1,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: ্ ় (i) িােজকাসাইট (ii) বিাইট (iii) কযাোমাইন ু ্ ্","subQuestions":[{"label":"ক","question":"নিঃসরণ কাকে বলে?","answer":"উচ্চচাপ অঞ্চল থেকে কোনো গ্যাসের অণুসর্ূহ সিু ছছদ্পর্থ ় ় রেম্ন চাপ অঞ্চনল ব রিনে আসাি প্মে্বোনক নিঃসরণ বলে।"},{"label":"খ","question":"গ্রুপ-11 এর মৌলগুনলানক র্ুদ্া ধাত লা হয় কেন? ব্যাখ্যা কি। র র","answer":"পর্যায় সািরণি গ্রুপ-11 এর মৌল কপাি (Cu), মসলিাি (Ag) ও ় র থগাল্ (Au)। এ ধাতগুনলা কম সমে্বে, তাই াতাস, পানি ও ় ় ় অক্সিজেনের সাথে সহজে বিক্রিয়া করে ো এবং সহজে ক্ষে হয় ো। এরা উল, আঘানত িানে ো এবং সহজে পাত ও তানি পরিণত করা ু ্ ্ ় ় যায়। এস ত মশনটট যি কারণে প্াচীেকাল থেকে এদের দিয়ে র্ুদ্া ততরি র র ় করা হয়। তাই গ্রুপ-11 এর মৌলগুনলানক র্ুদ্া ধাত লা হয়। র র"},{"label":"গ","question":"উদ্দীপকের বকাে আকরিকটি নক তাপজারণ পদধরতনত অিাইনর্ ত ় িূপান্ি করা হে? ব্যাখ্যা কি। [২ বোর্ডে এনসনছ] ু ্ ্","answer":"উদ্দীপকের আকরিক রতেটি হলো— • (i) চালনকাসাইট: Cu2S (সালফাইড আকরিক) • (ii) িাইট: Al O .2H O (পানিেুকব অক্সাইড আকরিক) 2 3 2 • (iii) কযালার্াইে: ZnCO (কার্বনেট আকরিক) 3 সাধারণত সালফাইড আকরিনকি তাপজারণ করা হয়। তাপৈাির্ণ ় ় ঘেীকৃ ত আকরিকনক গলোনঙ্কি বচনে কম তাপর্াযায় াতানসি উপমথরতনত উকপ্ করা হয়। এনত সালিাি, িসভরাস, আনসডরেক ি ত টাইপ ভিততিক মাস্ট ার সাজেশন ্ ় ় ু ইতযারদ উদােী খনিজর্ল অক্সাইড ছহনসন দি হয় এবং ধাতি সালফাইড ধাতি অিাইনর্ পরিণত হয়। উদ্দীপকের রতেটি আকরিনকি মধ্যে কেবল চালনকাসাইট (Cu S) 2 সালফাইড আকরিক। তাই চালনকাসাইটনক তাপজারণ পদধরতনত ত ় অিাইনর্ িূপান্ি করা হয়। Δ 2Cu S+3O ⟶2Cu O+2SO 2 2 2 2 অপিরদনক, িাইট ও কযালার্াইে সালফাইড আকরিক েে। কযালার্াইজনক াতানসি অেুপমথরতনত উকপ্ করে (িস্মীকিণ) ZnO ি ত বত পরিণত করা হয়। Δ ZnCO ⟶ZnO+CO 3 2 সু তিাং উদ্দীপকের (i) েং আকরিক চালনকাসাইটনক তাপজারণ ্ ত ় পদধরতনত অিাইনর্ িূপান্ি করা হয়।"},{"label":"ঘ","question":"উদ্দীপকের আকরিক (ii) ও (iii) হনত ধাত নিষ্কাশন পদধরত কী একই উকরেি সপর্ক্ষ র্তার্ত দাও। [২ বোর্ডে এনসনছ]","answer":"উদ্দীপকের (ii) েং আকরিক িাইট (Al O .2H O), ো থেকে 2 3 2 অযালুমর্রেোর্ (Al) এবং (iii) েং আকরিক কযালার্াইে (ZnCO ), ো 3 ্ ় থেকে রৈংক (Zn) নিষ্কাশন করা হয়। ধাতি সমে্বেতা মসরিনৈ ্ ় ু অবস্থানেি উপর র জারণ পদধরত রেিড ি করে। Al বেশি সমে্বে ধাত, ় ু ্ ্ ় কিন্তু Zn র্ধযর্ সমে্ব ে ধাত। তাই এদের নিষ্কাশন পদধরত একই েে। ্ বিাইট ক্ষেজক Al নিষ্কাশন (িততড় ৎ রবজ্ল ে ষণ): ঘেীকৃ ত িাইট থেকে ্ ় ় ় ় র শুদধ Al O পাওয়া যায়। Al খু সমে্বে বলে কার্বন দিয়ে Al O বক ্ 2 3 2 3 র ৈারিত করা যায় ো। Al O এর গলোঙ্ক 2050°C, তাই এর সাথে 2 3 ় ় ় ে্ ব ানোলাইট (Na3AlF6) মর্মশনে 800°C-1000°C তাপর্াযায় ় ত ্ গলানো হয়। গ্ািাইনটি আতিণেুকব সস ি বলেি পায় ক্যাথোড এবং কার্বন দণ্ড অযানোর্ ছহনসন কাৈ করে। 3+ 2− Al O (l) → 2Al +3O 2 3 ক্যাথোডে: 2Al3+ + 6e− → 2Al 2− 3 − অযানোনর্: 3O → +6e 2O 2 ় ় গললত Al পাতরেি তলাে ৈর্া হয়। ্ ্ কযাোমাইন ক্ষেজক Zn নিষ্কাশন (কাবন রবোরণ): প্রথমে কযালার্াইজনক িস্মীকিণ করে ZnO বত পরিণত করা হয়। এরপি ু ্ ় ZnO বক কার্বনসহ উকপ্ করলে Zn ধাত র্ুকব হয়। Δ ZnCO ⟶ZnO+CO 3 2 Δ ZnO+C⟶Zn+CO সু তিাং িাইট থেকে তপ্ড় ৎ র ন্ল ষর্ণ এবং কযালার্াইে থেকে কার্বন ্ ় ু ্ র ৈাির্ণ ধাত নিষ্কাশন করা হে; অর্থাৎ (ii) ও (iii) েং আকরিক ু ্ ্ ্ ় থেকে ধাত নিষ্কাশন পদধরত একই েে।"}],"board":"বরিশাল বোর্ড ২০২০"},{"id":"ch10-cq2","chapter":10,"num":2,"importance":2,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: (i) Al O . 2H O 2 3 2 (ii) Fe O . 3H O 2 3 2 (iii)ZnS + O →A(s)+B(g) 2","subQuestions":[{"label":"ক","question":"ইনলকন ট ার্ কাকে বলে? ় ়","answer":"তপ্ড় ৎ র ন্ল ষয কোনষ বে ধাত দণ্ড বা গ্ািাইট দনণ্ডি মাধ্যমে ্ র তপ্ড় ৎ প্ াহ তপ্ড় ৎ র ন্ল নষয প্রবেশ করে বা ব ি হয়ে আনস, তানক র ্ র ইনলকন ট ার্ বলে। ় ় ় ়"},{"label":"খ","question":"কেন বিক্রিয়াি সার্যা থা গরতশীল সার্যা থা হে? ব্যাখ্যা কি। ি ি","answer":"উির্ুখী বিক্রিয়াে সম্মখ বিক্রিয়াি হার ও প্চাৎ বিক্রিয়াি হার ় ় ় সমান হলে সার্যা থা সৃটটি হয়। এ অবস্থাে াইনি থেকে র মে্বেক ও ি ি ় ় উৎপানদি পরিমাণ মথি র্নে হলেও বিক্রিয়া থথনর্ যায় ো। ় ় ় সার্যা থাে বে হানি র মে্ব েক থেকে উৎপাদ ততরি হয়, ঠ ি ক বসই হানি ় ় উৎপাদ বিনে আ াি র মে্বেক ততরি হয়। যেমন– N +3H ⇌2NH 2 2 3 ় ় ় এখানে উভয় রদনকি বিক্রিয়া একই সাথে চলনত থাকে বলে বিক্রিয়াি সার্যা থাকে গরতশীল সার্যা থা লা হয়। ি ি ড ়"},{"label":"গ","question":"উদ্দীপকের 'B' থেকে এসিড প্তু রত সর্ীকিণসহ ণডো কি। ু ্ ্","answer":"রৈংক ব রন্নক (ZnS) াে়ুি উপমথরতনত উকপ্ করলে ল ি ত ় (তাপজারণ) রৈংক অক্সাইড ও সালিাি র্াইঅক্সাইড উৎপন্ন হে: Δ 2ZnS+3O ⟶2ZnO+2SO 2 2 সু তিাং A = রৈংক অক্সাইড (ZnO) এবং B = সালিাি র্াইঅক্সাইড (SO ) গ্যাস। 2 B (SO ) থেকে স্পশড পদধরতনত সালমিউরিক এসিড (H SO ) প্তু ত 2 ্ 2 4 র করা হয়। ্ ় ় ১. SO গ্যাসের সাথে শুষ্ক াে়ু (O ) মর্মশনে 450°C-550°C 2 2 ় ় তাপর্াযায় িযাোপ্র্োর্ থপনট াঅক্সাইড (V O ) প্রবণতা নকি ড 2 5 র ু উপমথরতনত চপ্ল্নত বপ্িণ করলে সালিাি ট াইঅক্সাইড উৎপন্ন ল বিভব র হে: V2O, 450°C-550°C 5 2SO +O ⟶ 2SO 2 2 3 ২. SO বক সিাসরি পানিনত থশাষণ করানল বাষ্পীে H SO ঘে 3 2 4 ় ূ কু োশাি সৃটটি করে, ো ঘেীিত করা কঠ ি ে। তাই SO বক গাঢ় 3 H SO এ থশাষণ করে ধূমানমান সালমিউরিক এসিড বা 2 4 ় ় অললোর্ ততরি করা হে: H SO +SO →H S O 2 4 3 2 2 7 ৩. অললোনর্ পরিমর্ত পানি যোগ করলে তিল সালমিউরিক এসিড ় ় পাওয়া যায়: H S O +H O→2H SO 2 2 7 2 2 4 এরান উদ্দীপকের B তথা SO থেকে সালমিউরিক এসিড প্তু ত 2 র করা হয়।"},{"label":"ঘ","question":"(i) ও (ii) েং আকরিক থেকে ধাত রেষ্ক াশনেি জন্য একই নিষ্কাশন ্ ভ ় ্ পদধরত ব্যবহার করা সম্ েে-েুপ্কবসহ বিশ্লেষণ কি। ্ ্ টাইপ ভিততিক মা ﻿","answer":"উদ্দীপকের (i) Al O .2H O হলো িাইট, অযালুমর্রেোনর্ি 2 3 2 (Al) আকরিক। (ii) Fe O .3H O হলো ললনমানাইট, আেিনেি (Fe) 2 3 2 আকরিক। ় ় সমে্ব েতা মসরিনৈ Al উপনভর রদনক (অরধক সমে্বে) এবং Fe ় ্ ্ ন র্াঝার্ারঝ (র্ধযর্ সমে্ব ে)। তাই এদের নিষ্কাশন পদধরত ভিন্ন। (i) বিাইট ক্ষেজক Al: িততড় ৎ রবজ্ল ে ষণ ় ্ ় Al অরধক সমে্বে বলে Al O বক কার্বন দ্বারা র ৈারিত করা যায় ো। 2 3 ় ্ ্ প্রথমে রাসায়নিক পদধরতনত িাইট থেকে র শুদধ Al O ততরি করা র ্ ্ 2 3 হে: Δ Al O .2H O+2NaOH⟶2NaAlO +3H O 2 3 2 2 2 NaAlO +2H O→Al(OH) +NaOH 2 2 3 1100°C 2Al(OH) ⟶ Al O +3H O 3 2 3 2 Al O এর গলোঙ্ক 2050°C, কিন্তু ে্বানোলাইট (Na AlF ) মর্শানল 2 3 3 6 ত ্ 800°C-1000°C এ গবলে। গ্ািাইনটি আতিণেুকব সস ি বলেি পায় স্ট ার সাজেশন ক্যাথোড এবং কার্বন দণ্ড অযানোর্ ছহনসন ব্যবহার করে তপ্ড় ৎ বিশ্লেষণ করা হে: 3+ 2− Al O →2Al +3O 2 3 2Al3+ +6e− → 2Al [ক্যাথোড] 2− − 6O →3O +12e [অযানোর্] 2 (ii) লেজমানাইট ক্ষেজক Fe: কাবন রবোরণ ললনমানাইটনক িস্মীকিণ করে Fe O বত পরিণত করা হয় এবং 2 3 ু ্ ় াতযাচপ্ল্নত বকাক দ্বারা র ৈারিত করা হে: Δ Fe O .3H O ⟶Fe O +3H O 2 3 2 2 3 Δ Fe O +3C⟶2Fe+3CO 2 3 Fe O +3CO→2Fe+3CO 2 3 অতএ, অরধক সমে্বে Al এর আকরিক িাইট থেকে তপ্ড় ৎ র ন্ল ষর্ণ এবং র্ধযর্ সমে্ব ে Fe এর আকরিক ললনমানাইট থেকে ু ্ ্ ় কার্বন র ৈাির্ণ ধাত নিষ্কাশন কিনত হয়। তাই (i) ও (ii) েং আকরিক ্ ু ্ ভ ় থেকে একই পদধরতনত ধাত নিষ্কাশন সম্ েে।"}],"board":"যশোর বোর্ড ২০২৫"},{"id":"ch10-cq3","chapter":10,"num":3,"importance":2,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: মৌল আ P চালনকাসাইট Q বহর্াটাইট = Fe R মসন্া াি = Hg [এখ্াজন P, Q, R প্িীকী অথে বযবহবি]","subQuestions":[{"label":"ক","question":"নিরুদক কাকে বলে?","answer":"বে পদাথড কোনো যৌগ থেকে পানি থশাষণ করে বেে, তানক নিরুদক বলে। যেমন– গাঢ় H SO। 2 4"},{"label":"খ","question":"ভিনেগার দ্বারা কীিান খাদয সংিক্ষণ করা হে? ব্যাখ্যা কি।","answer":"ভিনেগার হলো ইথানয়িক এসিডের (CH COOH) লঘু জলীয় 3 দ্রবণ। খাদযদ্ য মিনেগানি র্র নে িাখনল খানদযি pH কনর্ যায় র র ় ় অর্থাৎ পরিন শ অম্ল ীে হয়। ় ় অম্ল ীে পরিবেশে খাদয পচেকািী ব্যাকটেরিয়া ও ছোক ৈন্মানত ও ংশ বৃদ্ধি কিনত পানি ো। িনল খাদয সহজে পনচ ো এবং দীঘডরদে সংিক্ষণ করা যায়। এজন্য আচাি, চাটরে ইতযারদ সংিক্ষর্ণ ভিনেগার ব্যবহার করা হয়।"},{"label":"গ","question":"উদ্দীপকের P মৌলের র শুদধকিণ চচেসহ ণডো কি। ু ্","answer":"উদ্দীপকের P মৌলের আকরিক চালনকাসাইট (Cu2S)। সুতিাং P = কপাি (Cu)। ্ ্ ় স্ব র জারণ পদধরতনত প্াপ্ কপাি প্রায় 98% র শুদধ। তপ্ড় ৎ র র্শাধে ্ র ত র ্ ্ ় পদধরতনত এনক 99.9% র শুদধ করা হয়। ্ ্ চিতরতরর রববরণ (কপাজরবিভবততড় ৎ রবথশাধ্ন) • একটি পাতরে তপ্ড় ৎ র ন্ল ষয ছহনসন কপাি সালনিট (CuSO ) এর জলীয় দ্রবণ। • অযানোর্: মোটা অর শুদধ কপাি দণ্ড, যাটারভর ধোতমক প্ানন্ েুকব। • ক্যাথোড: পাতলা র শুদধ কপাি দণ্ড বা পাত, যাটারভর ঋণাতমক ত ্ প্ানন্ েু কব। • অযানোনর্ি রেনচ পাতরেি তলাে অপদ্ য (অযানোর্ র্ার্) ৈর্া হয়। ﻿ কাযপ্ণালে দ্রবণে র দুযৎ প্ াছহত করলে অযানোনর্ি অর শুদধ কপানভর পরমাণু র র ্ 2+ ় ় ইলেকট্রন তযাগ করে Cu আয়নিূর্প দ্রবণে যায় (জারণ): র র 2+ − Cu(s) → Cu (aq)+2e [অযানোর্] 2+ ় ্ দ্রবণেি Cu আয়ন ক্যাথোড থেকে ইলেকট্রন গ্রহণ করে র শুদধ র র ্ কপাভরূর্প ক্যাথোডে ৈর্া হয় (র জারণ): ় 2+ − Cu (aq)+2e →Cu(s) [ক্যাথোড] ় ় িনল অযানোর্ েব্ র্শ ক্ষে হয় এবং ক্যাথোড মোটা হনত থাকে। অপদ্ যগুনলা অযানোনর্ি রেনচ তলারেিূর্প পনড় থাকে বা দ্রবণে র র 2 থেকে যায়। ু ্ এরান উদ্দীপকের P (Cu) ধাতনক 99.9% র শুদধ করা হয়। 2"},{"label":"ঘ","question":"উদ্দীপকের Q ও R ধাত দুইটি ি নিষ্কাশন প্মে্ব োি ভিন্নতা বিশ্লেষণ কি।","answer":"উদ্দীপকের Q এর আকরিক বহর্াটাইট (Fe O ), তাই Q = 2 3 ় আেিে (Fe)। R এর আকরিক মসন্া াি (HgS), তাই R = র্াকড ারি (Hg)। ় ় ় ু সমে্ব েতা মসরিনৈ Fe র্ধযর্ সমে্ব ে এবং Hg কম সমে্ব ে ধাত। তাই ্ ন ্ ় ় এদের রেষ্ক াশনে ভিন্ন র জারণ পদধরত প্নোগ করা হয়। ্ র ্ ্ Q (Fe) এর নিষ্কাশন: কাবন রবোরণ ূ ূ ু বহর্াটাইটনক চণড ও ঘেীিত করে বকাক ও চোপাথনভর সাথে কররক াতযাচপ্ল্নত উকপ্ করা হয়। এখানে কার্বন ও CO র ৈািনকি কাৈ ল ত করে: C+O →CO 2 2 CO +C→2CO 2 Fe O +3CO→2Fe+3CO 2 3 2 Fe O +3C→2Fe+3CO 2 3 ় ু খনিজর্ল দি হয় ধাতর্ল (CaSiO ) িূর্প: ূ 3 Δ CaCO ⟶CaO+CO 3 2 ় ন ্ CaO+SiO →CaSiO 2 3 ্ ্ R (Hg) এর নিষ্কাশন: সব রবোরণ ় ় Hg কম সমে্বে বলে মসন্া ািনক কোনো র জারক ছাড় বা শুধু াে়ুনত ় ় ় উকপ্ করলেই র্াকড ারি পাওয়া যায়: Δ HgS+O ⟶Hg+SO 2 2 অথ া, Δ 2HgS+3O ⟶2HgO+2SO 2 2 Δ 2HgO+HgS⟶3Hg+SO 2 ্ অতএ, Q (Fe) রেষ্ক াশনে কা ডজনক র জারক ছহনসন যোগ কিনত ় ্ হয়, কিন্তু R (Hg) রেষ্ক াশনে কোনো াইনভর র জারক লার্গ ো। তাই ্ ় ন Q ও R এর নিষ্কাশন প্মে্ব ো ভিন্ন। ় ় ় ু ু করিপয ধ্াি এবং সংকর ধ্াির েয হওযার েেণ, কারণ ও প্রিকার"}],"board":"চট্টগ্রাম বোর্ড ২০২৫"},{"id":"ch10-cq4","chapter":10,"num":4,"importance":2,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: P, Q ও R রিনটি ধ্ািব মৌল। ি-তজক মৌলগুজোর প্াততপ্রবণতার 4 ব র ত হার তর্ ব মবধ্মান। P-মৌলটি র পারমাণরবক সংখ্যা 19। ত ্ র","subQuestions":[{"label":"ক","question":"ঊধ্ডপাতে কাকে বলে?","answer":"বে প্মে্ব যায় কোনো কঠ ি ে পদাথক তাপ রদনল তা তিনল ় ় পরিণত ো হয়ে সিাসরি ববাষ্প পরিণত হয় এবং বাষ্পনক ঠান্া করলে আ াি সিাসরি কঠ ি নে পরিণত হয়, তানক ঊধ্ডপাতে বলে। যেমন: কপূডি, েযাপথাললে, আনোপ্র্ে।"},{"label":"খ","question":"চচরকৎসা থক্ষতরে বতৈমথব ে আইসোটোপ গুিুতপূর্ণ— ব্যাখ্যা কি। র ্ ব ু ্ ়","answer":"বতৈমথব ে আইসোটোপ থেকে রেগডত িশ্লম বিাগ নির্ণয় ও র ্ 60 ় ্ ় চচরকৎসাে য হবত হয়। বকা াল ট -60 ( Co) থেকে রেগডত গার্া িশ্মল ় ত ় দিয়ে কযান্সাি আে্ব ান্ বকাষ ধ্ংস করা হয় (বিপ্র্ওর্থিামপ)। ় ় ় আনোপ্র্ে-131 থাইিনের্ গ্ছন্তি বিাগ নির্ণয় ও চচরকৎসাে এবং ় ত ু বটকনেমশোর্-99m বদনহি অিযন্নভর অনঙ্গি ছর তনল বিাগ রেণে ্ ় ় ় য হব ত হয়। এছাড় বা বতৈমথব ে িশ্মল দিয়ে চচরকৎসা সিঞ্জার্ র ্ ্ ় ় জীবাণুর্ুকব করা হয়। তাই চচরকৎসা থক্ষতরে বতৈমথব ে আইসোটোপ র ্ গুিুতপূর্ণ।"},{"label":"গ","question":"সর্ীকিণসহ Q ধাতটভর নিষ্কাশন প্মে্ব ো ণডো কি। টাইপ ভিততিক মাস্ট ার সাজেশন ু ্","answer":"P মৌলের পারমাণবিক সংখ্যা 19, তাই P হলো পটাশিয়াম (K)। িতনক প্াপ্প্তা: K 3%, Ca 4%, Fe 5%। প্াপ্প্তাি হার েব্ র্ ধডমান ব র ত র ত ় ় বলে Q = ক্যালসিয়াম (Ca) এবং R = আেিে (Fe)। ় Ca অরধক সমে্বে ধাত (সমে্বেতা মসরিনৈি উপনভর রদনক), তাই ় ় কার্বন দিয়ে এর অক্সাইড র ৈারিত হয় ো; তপ্ড় ৎ র ন্লষর্ণি মাধ্যমে ্ ় Ca নিষ্কাশন করা হয়। গললত ক্যালসিয়াম ক্লোরাইড (CaCl ) তপ্ড় ৎ র ন্লষয ছহনসন রেনে ল 2 গ্ািাইট দণ্ক অযানোর্ (ধোতমক প্ান্) এবং বলাহার দণ্ক র র ক্যাথোড (ঋণাতমক প্ান্) ছহনসন ব্যবহার করে তপ্ড় ৎ প্ াছহত করা ় ় ় ় হয়। গললত অবস্থাে CaCl আয়নে র নোরৈত থাকে। ি 2 2+ − CaCl2 → Ca +2Cl − − 2Cl →Cl2+2e [অযানোনর্ জারণ] 2+ − Ca +2e →Ca [ক্যাথোডে র জারণ] ় ় ক্যাথোডে ধাত ক্যালসিয়াম ৈর্া হয় এবং অযানোনর্ Cl গ্যাস ় ় ু ্ উপৈাত ছহনসন পাওয়া যায়। এরান Q ধাত (Ca) নিষ্কাশন করা হয়।"},{"label":"ঘ","question":"উদ্দীপকের R-ধাতটি দ্বারা ততরি রেতয য হবত েন্তগুনলা দীঘডথােী করাি প্মে্ব ো—আনলাচো কি।","answer":"উদ্দীপকের R ধাতটি আেিে (Fe)। বলাহার ততরি েন্ত াতানসি ় ় O ও পানির সংস্পর্শড র্রিচা পনড় ক্ষেপ্াপ্ হয়। র ত 2 4Fe+3O +6H O→4Fe(OH) 2 2 3 2Fe(OH) →Fe O .3H O (র্রিচা) 3 2 3 2 বলাহানক O ও পানির সংস্পর্শড আসনত ো রদনল ক্ষে হয় ো। এজন্য 2 ় ় রেনচি প্মে্ব োগুনলা ব্যবহার করে েন্তগুনলা দীঘডথােী করা হে— বিভব (i) রং করা: বলাহার দিৈা-ৈাোলা, মগ্ল ইতযারদনত িনেি আ িণ বলাহানক াতাস ও পানি থেকে আলাদা িার্খ। (ii) ইজেকজট াজপ্টি ং: তপ্ড় ৎ র ন্ল ষর্ণ বলাহার উপর কম সমে্ব ে ধাতি ল ্ ় ় প্নলপ দেওয়া হয়। যেমন: CuSO দ্রবণে Cu দণ্ক অযানোর্ র 4 র (ধোতমক প্ান্) এবং বলাহার তু নক ক্যাথোড (ঋণাতমক প্ান্) করে তপ্ড় ৎ প্ াছহত করলে বলাহার উপর Cu এর প্নলপ পনড়। র র 2+ − Cu →Cu +2e [অযানোনর্ জারণ] 2+ − Cu +2e →Cu [ক্যাথোডে র জারণ] (iii) গযােিানাইরেং: বলাহার উপর রৈংনকি প্নলপ দেওয়া হয় (যেমন: বঢউটি ে); এনত তপ্ড় ৎ বিশ্লেষণ লার্গ ো। প্নলপ বলাহানক O ্ র ও পানি থেকে িক্ষা করে। সু তিাং িং করা, ইনলকন ট ানপ্ টিং ও গযালিাোইরৈং এর মাধ্যমে বলাহানক াতানসি O ও পানির সংস্পশড থেকে দনি বির্খ R ধাতি 2 ূ ্ ় ় ততরি রেতয য হব ত েন্তগুনলা দীঘডথােী করা যায়। বিভব ﻿ ি ু খ্রনে অধ্াি"}],"board":"ঢাকা বোর্ড ২০২০"},{"id":"ch10-cq5","chapter":10,"num":5,"importance":2,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: Δ ড িােজকাসাইট +O ⟶ X+Y(g) 2","subQuestions":[{"label":"ক","question":"অপধাত কাকে বলে? [২ বোর্ডে এনসনছ] িঁ ়","answer":"বেস মৌল ধাত ও অধাত উিনেি রকছ রকছ ধর্ম প্দশডে করে, তানদিনক অপধাত বলে। যেমন: ব ািে (B), মসললকে (Si), ৈানর্ডরেোর্ (Ge), আনসডরেক (As)। িঁ"},{"label":"খ","question":"মপপড়াি কার্নড় ি ক্ষতথানে চে প্নোগ করা হয় কেন? ্ ্","answer":"মপপড়া কার্ড় রদনল ক্ষতথানে ভরমর্ক এসিড (HCOOH) প্রবেশ ় ় করাে। এই এসিডের কারণে ক্ষতথানে জ্ালা-েন্তণা হয়। ি ব র চে (CaO) পানির সংস্পর্শড ক্ষারীে Ca(OH) ততরি করে। ক্ষতথানে 2 ি ু চে রদনল এটি ভরমর্ক এসিক প্শমর্ত করে লবণ ও পানি উৎপন্ন করে। 2HCOOH+Ca(OH) →(HCOO) Ca+2H O 2 2 2 ় ় ় িঁ িনল এসিডের মে্বো েটট হয় এবং জ্ালা কনর্ যায়। এজন্য মপপড়াি ় কার্নড় ি ক্ষতথানে চে প্নোগ করা হয়।"},{"label":"গ","question":"'X' যৌগ হনত কাঙ্ক্ধক্ষত ধাত নিষ্কাশন ব্যাখ্যা কি। ী ভ","answer":"চালনকাসাইট হলো কপানভর আকরিক (Cu2S)। এনক াে়ুি র উপমথরতনত উকপ্ (তাপজারণ) করলে রকউপ্াস অক্সাইড ও সালিাি ত র ় র্াই-অক্সাইড উৎপন্ন হয়। Δ 2Cu S+3O ⟶2Cu O+2SO 2 2 2 2 সু তিাং X হলো রকউপ্াস অক্সাইড (Cu O) এবং Y হলো সালিাি র 2 2 র্াই-অক্সাইড (SO )। কাঙ্ক্ধক্ষত ধাত কপাি (Cu)। 2 ্ ় ্ ় ় ু সব রবোরণ: কপাি সমে্বেতা মসরিনৈি রেনচি রদনকি কম সমে্বে ধাত। তাই াইনি থেকে কোনো র জারক যোগ কিনত হয় ো। তাপৈাির্ণ উৎপন্ন Cu O অ মশটট Cu S এর সাথে াে়ুি অেুপমথরতনত উকপ্ 2 2 ি ত ় ু হলে রেনৈিাই বিক্রিয়া করে কপাি ধাত উৎপন্ন করে। Δ Cu S+2Cu O⟶6Cu+SO ় 2 2 2 ় ্ এরান প্াপ্ কপাি প্রায় 98% র শুদধ। র ত র ্ ় ্ িততড় ৎ রবথশাধ্ন: CuSO এর জলীয় দ্রবণে অর শুদধ কপানভর মোটা 4 র ্ দণ্ক অযানোর্ এবং র শুদধ কপানভর পাতলা দণ্ক ক্যাথোড ছহনসন ব্যবহার করে র দুযৎ চালো করা হয়। ় ু অযানোনর্: Cu(s) → Cu2+ + 2e− 2+ − ক্যাথোডে: Cu +2e →Cu(s) ্ ় িনল ক্যাথোডে 99.9% র শুদধ কপাি ৈর্া হয়। সু তিাং স্ব র জারণ ও তপ্ড় ৎ র র্শাধনেি মাধ্যমে 'X' (Cu2O) থেকে ু ্ ় কপাি ধাত নিষ্কাশন করা হয়। ় ়"},{"label":"ঘ","question":"'Y' যৌগ হনত জারক ও নিরুদকধর্ী এসিড প্তু ত সম্ রকো? র মে্ ব োসহ বিশ্লেষণ কি।","answer":"উদ্দীপকের Y যৌগ হলো সা , পিপি দুটি সদনসযি মধ্যে একটি -CH - র্ূলনকি পাথডকয থাকে, 2 ় ় রাসায়নিক ধর্ম প্রায় একই এবং বিৌত ধনর্ডি েব্ র্পরি তড ে ঘনট, তানদি সর্র্গােীে বশ্রণ বলে। যেমন: CH, C H, C H ... র 4 2 6"},{"label":"খ","question":"েযাপথাললে একটি অযানিানর্টি ক যৌগ — ব্যাখ্যা করো। [৪ বোর্ডে এনসনছ]","answer":"বেস চামেব্ ক যৌগে ব েরৈে লে থাকে এবং লনে ত ্ ্ একান্ভরান একে ও ছদ ন্ধে থাকে, তানদি অযানিানর্টিক যৌগ বলে। েযাপথাললনেি (C H ) অণুনত দুটি ব েরৈে লে পাশাপামশ েুকব 10 8 ্ ় (একটি C-C ন্ধে দুই লনে িাগািারগ) এবং লনে একে ও ছদ ন্ধে পর্যায়ে্ব নর্ সজ্জিত। ড ্ ্ এর ত মশটটযপূর্ণ গন্ধও আনছ। অর্থাৎ অযানিানর্টিক যৌগের ত মশটট যগুনলা েযাপথাললনে আনছ, তাই এটি একটি অযানিানর্টি ক যৌগ।"},{"label":"গ","question":"'X' এর প্থর্ সদনসযি সাথে ক্লোরিন গ্যাস চালো করলে কী ঘটন? সর্ীকিণসহ বলখ।","answer":"উদ্দীপকের X পৃথক হয় 0°C – 20°C তাপর্াযায়, তাই X হলো ক্ষপজট ালেযাম গ্যাস (কার্বন সংখ্যা 1 – 4)। এর প্থর্ সদসয মিথেন (CH4)। ্ ় মিথেন সম্পৃকব হাইন ব াকার্বন, তাই েুত বিক্রিয়া দেয় ো। অরতন গুরে (UV) আনলাি উপমথরতনত মর্র্থনেি সাথে ক্লোরিন গ্যাস চালো করলে ি ল প্রতথাপে বিক্রিয়া ঘনট; মর্র্থনেি H পরমাণু চাি ধার্প এনক এনক Cl ্ ় দ্বারা প্রতথামপত হয় এবং প্রতটি ধার্প HCl উৎপন্ন হে: র র UV CH +Cl ⟶CH Cl+HCl 4 2 3 UV CH Cl+Cl ⟶CH Cl +HCl 3 2 2 2 UV CH Cl +Cl ⟶CHCl +HCl 2 2 2 3 UV CHCl +Cl ⟶CCl +HCl 3 2 4 ﻿ ় উৎপাদগুনলা েথােব্ নর্ ব্ানিামিথেন, র্াইন্ানিামিথেন, ল ল ড ্ ্ ট াইন্ানিামিথেন (ব্ানিাির্ড) ও বট ট ান্ানিামিথেন। অন্ধকানি এ র ল ল র ল র মে্ ব ো ঘনট ো। ্ ত ভসবধান্: X এর প্থর্ সদসয মর্র্থনেি সাথে UV আনলানত ক্লোরিন ্ র ় চালো করলে ে্বর্ান্নে CH Cl, CH Cl, CHCl ও থশনষ CCl 3 2 2 3 4 ় উৎপন্ন হয়। ়"},{"label":"ঘ","question":"উদ্দীপকের Y, Z এবং P শোকব করে এদের ণডো দাও।","answer":"থপন ট াললোর্ র ভিন্ন হাইন ব াকার্বনেি মর্শ্ণ। আংমশক পাতে র ্ র কলানর্ি রেনচ তাপমানা বেশি, উপরে কম; প্রতটি উপাদান রেৈ ় ় ় স্ফটোঙ্ক-সীমান পৃথক হয়। উদ্দীপকের তাপমানা-সীর্া মর্ললনে ্ ় উপাদানগুনলা শোকব করা যায়। Y = ক্ষপজট াে (গযাজসালেন): স্ফটোঙ্ক 21°C – 70°C; কার্বন সংখ্যা 5 – র ু 10; থপন ট াললোনর্ 5% থাকে; যায় াহয়েি ইমঞ্জনে জ্ালারে ছহনসন র ব ্ ় য হব ত হয়। Z = ককজরাভসন: স্ফটোঙ্ক 121°C – 170°C; কার্বন সংখ্যা 11 – 16; ় ্ ় থপন ট াললোনর্ 13% থাকে; বৈট ইমঞ্জনেি জ্ালারে ছহনসন য হবত হয়। র ব P = প্যারাফিন কমাম: স্ফটোঙ্ক 271°C – 340°C; কার্বন সংখ্যা 20 – 30; উচ্চ আণর ক ভরের অ্যালকেন বলে সাধারণ তাপর্াযায় কঠ ি ে; ় ্ ় টেনলটি ৈ ও িযাসললে ততরিনত য হবত হয়। Y থেকে P এর রদনক কার্বন সংখ্যা ও অণুি আকার াড় াে স্ফটোঙ্ক ানড়; তাই কলানর্ Y স নচনে উপরে, Z র্ানঝ এবং P রেনচি রদনক পৃ থক হয়। ্ ত ভসবধান্: Y হলো থপন ট াল (গযানসাললে), Z হলো বকরোমসে এবং P হলো পযািামিে বর্ার্; স্ফটোনঙ্কি পাথকযি কারণেই আংমশক পাতনে এদের পৃথক করা যায়। ্ ক সম্পৃ িব হাইরোকার্বন: অযােজকন 3 8"}],"board":"ঢাকা বোর্ড ২০২১"},{"id":"ch11-cq2","chapter":11,"num":2,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: Δ (i)A + NaOH(aq) ⟶ B + NaX K Cr O + H SO ় 2 2 7 2 4 (ii)B + [O] ⟶ C ় ্ ড ্ ্ [এখ্াজন A যৌগটি দুই কাবনরবভশটট অযােকাইে হযাোইড]","subQuestions":[{"label":"ক","question":"সর্র্গােীে বশ্রণ কী? [৪ বোর্ডে এনসনছ] ্ ্ ় ়","answer":"একই কােডকিী মূলকর মশটট বেস তৈ যৌগনক একটি সাধারণ ্ ় সংনকত দ্বারা প্কাশ করা যায় এবং োনদি পিপি দুটি সদনসযি মধ্যে CH পাথডকয থাকে, তানদিনক একতরে সর্র্গােীে বশ্রণ বলে। 2 র ় ্ ্ ়"},{"label":"খ","question":"শক্তি শালী এসিড ও শক্তি শালী ক্ষানভর প্শর্ে বিক্রিয়াে উৎপন্ন তার্পি পরিমাণ ধ্ু কেন? ব্যাখ্যা কি। ূ ়","answer":"শক্তি শালী এসিড ও শক্তি শালী ক্ষার জলীয় দ্রবণে সম্পূর্ণিূর্প ় ় আেরেত অবস্থাে থাকে। যেমন: HCl+NaOH→NaCl+H O 2 + − − − + + H +Cl +Na +OH →Na +Cl +H O 2 + − ় ় ় ় এখানে Na ও Cl আয়ন বিক্রিয়াে অংশ বেে ো। প্কৃ তপর্ক্ষ ্ ্ বজনকানো শক্তিশালী এসিড ও শক্তিশালী ক্ষানভর প্শর্নে একই র মে্ ব ো ঘনট: + − H (aq)+OH (aq)→H O(l); ΔH = −57.3kJ/mol 2 টাইপ ভিততিক মাস্ট ার সাজেশন + বেনহত স থক্ষতরে র্ূ ল র মে্ ব ো একটাই, অর্থাৎ 1 mol H ও 1 mol − ় OH মর্নল 1 mol পানি ততরি হয়, তাই উৎপন্ন তার্পি পরিমাণ ধ্ু (প্রায় 57.3 kJ) থাকে।"},{"label":"গ","question":"B যৌগটি কেন পানিনত দ্ ীিত হে? ব্যাখ্যা কি। ় ভ","answer":"A দুই কার্বনর মশটট অযালকাইল হযালাইর্, অর্থাৎ ইথাইল হযালাইর্ (C H X)। এনক জলীয় NaOH এর সাথে উকপ্ করলে ইথানল (B) 2 5 ত উৎপন্ন হে: Δ CH -CH -X+NaOH(aq)⟶CH -CH -OH+NaX 3 2 3 2 অতএ, B যৌগটি ইথানল (CH -CH -OH)। 3 2 ইথােনল থপালাি -OH মূলক আনছ। -OH র্ূলনকি O পরমাণু তপ্ড় ৎ ় ় ঋণাতমক হওয়ায় O-H বন্ধনে H আংমশক ধোতমক (δ+) এবং O আংমশক ঋণাতমক (δ-) হয়। িনল ইথােনলি অণু পানির অণুি সাথে হাইরোজেন ন্ধে গঠে করে: CH3-CH2-O-H ··· O(H)-H তাছাড় বা ইথােনলি অর্পালাি অযালকাইল অংশ (C H -) খু বছাট 2 5 ় ় ় হওয়ায় তা দ্ ীি নে াধা দেয় ো। এ কারণে ইথানল (B) বজনকানো ূ ় অেুপানত পানিনত দ্ ীিত হয়। ় ় ় ্"},{"label":"ঘ","question":"C যৌগ হনত ইর্থে এর সর্র্গােীে যৌগ ততরি করা সম্ রক? বিশ্লেষণ কি।","answer":"(ii) েং বিক্রিয়াে B (ইথানল) বক অম্ল ীে K Cr O দ্বারা ৈারিত 2 2 7 ় ন ় করলে প্রথমে ইথাোল এবং পরে ইথানয়িক এসিড (C) উৎপন্ন হে: K Cr O + H SO 2 2 7 2 4 CH -CH -OH+[O] ⟶ CH -CHO+H O 3 2 3 2 K Cr O + H SO 2 2 7 2 4 CH -CHO+[O] ⟶ CH -COOH 3 3 অতএ, C যৌগটি ইথানয়িক এসিড বা অযামসটিক এসিড (CH COOH)। 3 ইর্থে (C H ) অ্যালকেন সর্র্গােীে বশ্রণি সদসয (সাধারণ সংনকত 2 6 র C H )। এর সর্র্গােীে যৌগ মিথেন (CH ) C যৌগ থেকে ততরি n 2n+2 4 করা সম্। ় ্ ় প্রথমে ইথানয়িক এসিক NaOH দ্বারা প্শমর্ত করে সোডিয়াম র র ় ় ইথােনেট ততরি করা হে: CH COOH+NaOH→CH COONa+H O 3 3 2 ় ় এরপি সোডিয়াম ইথােনেটনক বসার্ালাইনর্ি (NaOH + CaO) সাথে ় উকপ্ করলে কা ডক্সিলর হীেকির্ণি িনল মিথেন গ্যাস উৎপন্ন হে: CaO, Δ CH COONa+NaOH ⟶ CH +Na CO 3 4 2 3 মিথেন (CH ) ও ইর্থে (C H ) উিনেই অ্যালকেন এবং এদের মধ্যে 4 2 6 ় ় একটি CH এর পাথডকয িনেনছ, তাই মিথেন ইর্থনেি সর্র্গােীে 2 যৌগ। অতএ, C যৌগ (CH COOH) হনত ইর্থনেি সর্র্গােীে যৌগ মিথেন 3 ততরি করা সম্।"}],"board":"যশোর বোর্ড ২০২৬"},{"id":"ch11-cq3","chapter":11,"num":3,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: CaO CH COONa(′A′) + NaOH ⟶ B + Na CO 3 2 3","subQuestions":[{"label":"ক","question":"বর্রথনলনটর্ ঙ্কস্পরিট কাকে বলে? [২ বোর্ডে এনসনছ] ্","answer":"কমরেজেজটড স্সপররট: বিক্ি িাইর্ ঙ্কস্পরিনটি (95.6% ইথানল) সাথে ্ ় সামানয পরিমাণ র ষাকব মর্থােল মর্মশনে পানেি অনোগয করা ইথানলনক বর্রথনলনটর্ ঙ্কস্পরিট বলে।"},{"label":"খ","question":"সাইন্ানপ্ামপে অসম্পৃকব ন্ধ মশকল হাইন হাইরোকার্বন— ব্যাখ্যা কি। ল ্ [২ বোর্ডে এনসনছ]","answer":"সাইন্ানপ্ামপনেি আণর ক সংনকত C H। এনত রতেটি কার্বন ল 3 4 ্ ় ় পরমাণু পিস্পি েুকব হয়ে একটি লে বা ন্ধ মশকল গঠে করে, তাই এটি ন্ধ মশকল (চামেব্ ক) হাইন ব াকার্বন। ় ্ এই লনেি দুটি কার্বন পরমাণুর মধ্যে একটি C=C ছদ ন্ধে র দযমান। ্ ় ় ় ছদ ন্ধে থাকাে এটি েুত বিক্রিয়াে অংশ রেনত পানি, অর্থাৎ এটি অসম্পৃকব। ্ এরান ন্ধ মশকল গঠে ও ছদ ববন্ধনের উপমথরতি কারণে ্ সাইন্ানপ্ামপে একটি অসম্পৃকব ন্ধ মশকল হাইন হাইরোকার্বন। ল ্ ় ়"},{"label":"গ","question":"'A' যৌগের উপাদান মৌলের শতকরা সংেুরত নির্ণয় কি। [২ বোর্ডে এনসনছ]","answer":"উদ্দীপকের 'A' যৌগ হলো সোডিয়াম ইথানোনেট (CH COONa); 3 এনত C, H, O ও Na মৌল আনছ। CH COONa এর আণরবক ির = (12 × 2) + (1 × 3) + 3 (16 × 2) + 23 = 82 24×100 C এর শতকরা পরিমাণ = %=29.27% 82 H এর শতকরা পরিমাণ = 3×100% = 3.66% 82 O এর শতকরা পরিমাণ = 32×100% = 39.02% 82 Na এর শতকরা পরিমাণ = 23×100% = 28.05% 82 অতএ, 'A' যৌগে C 29.27%, H 3.66%, O 39.02% এবং Na 28.05% র দযমান। ় ়"},{"label":"ঘ","question":"'B' হনত বট ট ান্ানিা মিথেন ও মর্থােযাল প্তু ত সম্ রকো? র ল বিশ্লেষণ কি। টাইপ ভিততিক ম ﻿","answer":"উদ্দীপকে সোডিয়াম ইথানোনেটনক বসার্ালাইর্সহ উকপ্ করলে ় মিথেন উৎপন্ন হয়। সুতিাং 'B' হলো মিথেন (CH )। 4 CaO, Δ CH COONa+NaOH ⟶ CH +Na CO 3 4 2 3 মিথেন হজি কটট াজলাজরা মিথেন প্রস্তুতি ি র সূ েড ানলানকি উপমথরতনত মিথেন ও অরতরিকব ব্ারিনেি মর্শ্র্ণ ি ল প্রতথাপে বিক্রিয়া ধার্প ধার্প ঘনট। প্রতটি ধার্প একটি H পরমাণু Cl র র ্ ় ় দ্বারা প্রতথামপত হয়ে থশনষ বট ট ান্ানিা মিথেন উৎপন্ন হে: ি র ল সূ েড ানলাক CH +Cl ⟶ CHCl+HCl 4 2 3 সূ েড ানলাক CH Cl+Cl ⟶ CHCl +HCl 3 2 2 2 সূ েড ানলাক CH Cl +Cl ⟶ CHCl +HCl 2 2 2 3 সূ েড ানলাক CHCl +Cl ⟶ CCl +HCl 3 2 4 সূ েড ানলাক সার্মগ্ক বিক্রিয়া: CH + 4Cl ⟶ CCl +4HCl 4 2 4 মিথেন হজি ভমোনযাে প্রস্তুতি মর্র্থজনক প্রবণতা নকি (র্লল নর্োর্ অক্সাইড) উপমথরতনত উকপ্ র ত ় ় ্ অবস্থাে রেেছন্তত পরিমাণ অক্সিজেন দ্বারা আংমশক ৈারিত করলে ি র ় মর্থােযাল উৎপন্ন হে: প্রবণতা ক, Δ CH +O ⟶ HCHO+HO 4 2 2 ় অথ া, ধার্প ধার্প: মিথেন থেকে উৎপন্ন ব্ানিামর্র্থজনক জলীয় NaOH এর সা ীপকের ‘A’ যৌগটি হলো ইথানল (CH -CH -OH)। 3 2 ইথানলনক ৈারিত করলে ইথানোরেক এসিড বা অযামসটিক এসিড ় ় (CH COOH) উৎপন্ন হয়, োি 4-6% জলীয় দ্রবণ ভিনেগার োনর্ 3 র ্ ় খাদয সংিক্ষক ছহনসন য হবত হয়। তাই ‘B’ যৌগটি হলো অযামসটি ক এসিড। K Cr O /H SO 2 2 7 2 4 CH -CH -OH+2[O] ⟶ CH -COOH+H O 3 2 3 2 প্াকৃ রতক গ্যাসের র্ূল উপাদান হলো মিথেন (CH ), ো প্াকৃ রতক র 4 র গ্যাসের প্রায় 80-90% অংশ। ‘B’ যৌগ থেকে দুই ধার্প মিথেন প্তু ত র র করা যায়। ় ় ধ্াপ-১: কসাততডযাম ইোজনাজযট প্রস্তুতি ্ ় অযামসটিক এসিক NaOH দ্রবণ দ্বারা প্শমর্ত করলে সোডিয়াম র র ় ় ় ইথানোনেট (সোডিয়াম অযামসনটট) ও পানি উৎপন্ন হয়। CH -COOH+NaOH→CH -COONa+H O 3 3 2 ধ্াপ-২: মিথেন প্রস্তুতি ্ ্ ় ় শুষ্ক সোডিয়াম ইথানোনেটনক বসার্ালাইর্ (NaOH + CaO) এর সাথে ় মর্মশনে উকপ্ করলে প্র্কা ডক্সিনলশনেি মাধ্যমে মিথেন গ্যাস উৎপন্ন ় ় ় ় ্ ্ হয়। এখানে CaO বিক্রিয়াে অংশ বেে ো, NaOH বক শুষ্ক িার্খ। CaO, তাপ CH -COONa+NaOH ⟶ CH +Na CO 3 4 2 3 উৎপন্ন মিথেন গ্যাস পানির রেম্ন র্ুখী অপসাির্ণি মাধ্যমে গ্যাসৈানি সংগ্হ করা হয়। এরান উদ্দীপকের ‘B’ যৌগ থেকে প্াকৃ রতক গ্যাসের র র র্ূ ল উপাদান মিথেন প্তু ত করা যায়। েশন"},{"label":"ঘ","question":"উদ্দীপকের ‘A’ যৌগ থেকে একটি অসম্পৃকব হাইন হাইরোকার্বন প্তু ত করে এর অসম্পৃকবতাি থপছনে একটি পিীক্ষা উপথাপে কি।","answer":"উদ্দীপকের ‘A’ যৌগটি ইথানল (CH -CH -OH)। ইথানল থেকে 3 2 ্ ় অসম্পৃকব হাইন হাইরোকার্বন ইরথে (CH =CH ) প্তু ত করা যায়। ্ 2 2 ইরেন প্রস্তুতি ইথানলনক অরতরিকব গাঢ় H SO এর সাথে 170°C তাপর্াযায় উকপ্ 2 4 ত ় করলে ইথানল থেকে এক অণু পানি অপসারিত হয়ে ইরথে উৎপন্ন হয়। গাঢ় H SO এখানে নিরুদক ছহনসন কাৈ করে। 2 4 গাঢ় H SO, 170°C 2 4 CH -CH -OH ⟶ CH =CH +H O 3 2 2 2 2 ্ ইরথে অণুনত দুটি কার্বন পরমাণুর মধ্যে একটি ছদ ন্ধে (C=C) আনছ, ্ োি একটি পাই ন্ধে দু ডল। তাই ইরথে অসম্পৃকব হাইন ব াকার্বন এবং ় ় ় এটি সহজে েুত বিক্রিয়াে অংশ বেে। অসম্পৃিব িার পরীো ১: ব রাভমন পারন পরীো একটি বটস ট টি উন লালনচ াদামর্ বর্ণি ব রামর্ে পানি রেনে এর মধ্যে উৎপন্ন ইরথে গ্যাস চালো করলে ব রামর্ে পানির লালনচ াদামর্ ণড ূ ় ় ় ্ দিীিত হয়ে দ্রবণ বর্ণহীন হয়ে যায়। কািণ ইরথনেি ছদ বন্ধনে ব রামর্ে ূ র ্ ্ ় েু কব হয়ে বর্ণহীন 1,2-র্াইতর রানর্াইর্থে উৎপন্ন করে। CH =CH +Br →CH Br-CH Br 2 2 2 2 2 ্ ় অসম্পৃিব িার পরীো ২: কবযার পরীো ইরথে গ্যাসনক লঘু ও শীতল ক্ষারীে KMnO এর থগালামপ বর্ণি 4 ূ ় দ্রবণে চালো করলে দ্রবণেি থগালামপ ণড দিীিত হয় এবং ইরথললে র র ূ ় গল াইকল উৎপন্ন হয়। 3CH =CH +2KMnO +4H O 2 2 4 2 →3HO-CH -CH -OH+2MnO +2KOH 2 2 2 সম্পৃ কব হাইন ব াকার্বন (যেমন: ইর্থে) এ পিীক্ষাগুনলানত ব রামর্ে পানি ্ ্ বা KMnO দ্রবণেি ণড দি করে ো। সুতিাং ব রামর্ে পানি ও KMnO র ূ ্ 4 4 ূ ় দ্রবণেি ণড দিীিত হওো প্রমাণ করে বে ‘A’ যৌগ থেকে প্তু ত ইরথে র ূ র র একটি অসম্পৃকব হাইন ব াকার্বন।"}],"board":"ঢাকা বোর্ড ২০২৬"},{"id":"ch11-cq7","chapter":11,"num":7,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: গাঢ় H SO 2 4 (i)CH3CH2CH2OH ⟶ X+H2O +H2, Ni/200°C (ii)X ⟶ Y","subQuestions":[{"label":"ক","question":"পারমাণবিক সংখ্যা কাকে বলে? [২ বোর্ডে এনসনছ] ় ্","answer":"কোনো মৌলের পরমাণুর নিউক্লিয়াসে উপমথত বপ্াটনেি ল ি সংখ্যানক ঐ মৌলের পারমাণবিক সংখ্যা বলে। যেমন: Na এর পারমাণবিক সংখ্যা 11। 2 2 6 2 2 2 6 2"},{"label":"খ","question":"Ca ও Mg এর মধ্যে বকােটভর আয়নীকিণ শক্তি বেশি— ব্যাখ্যা কি। ় ়","answer":"Mg(12) : 1s 2s 2p 3s এবং Ca(20) : 1s 2s 2p 3s 6 2 3p 4s। উভয়ই গ্রুপ 2 এর মৌল। Mg এর শক্তিস্তর 3টি এবং Ca এর 4টি। তাই Mg এর আকার বছাট ত ় ্ এবং এর সর্বশেষ তনভর ইলেকট্রন রেউর্োস দ্বারা বেশি দঢ় িান র ল আকৃ টট থাকে। িনল Mg থেকে ইলেকট্রন সিানত বেশি শক্তি লার্গ। টাইপ ভিততিক মাস্ট ﻿ ় ্ একই গ্রুপে উপর থেকে রেনচ আয়নীকিণ শক্তি কনর্, তাই Ca ় ্ অপেক্ষা Mg এর আয়নীকিণ শক্তি বেশি। ় ়"},{"label":"গ","question":"প্র্কা ডক্সিনলশে বিক্রিয়াে কীিান উদ্দীপকের 'Y' যৌগটি প্তু ত কিন — সর্ীকিণসহ ব্যাখ্যা কি।","answer":"উদ্দীপকের (i) েং বিক্রিয়াে বপ্াপায়ল গাঢ় H SO এর র 2 4 উপমথরতনত উকপ্ হলে এক অণু পানি অপসারিত হয়ে প্রোপিন ত র ় উৎপন্ন হয়। গাঢ় H SO, তাপ 2 4 CH -CH -CH -OH ⟶ CH -CH=CH +H O 3 2 2 3 2 2 ় ় সু তিাং X হলো প্রোপিন (CH -CH=CH )। (ii) েং বিক্রিয়াে প্রোপিন র 3 2 র Ni প্রবণতা নকি উপমথরতনত 200°C তাপর্াযায় হাইন বানৈনেি সাথে ি ্ ্ ় েু কব হয়ে বপ্ার্পে উৎপন্ন করে। Ni, 200°C CH -CH=CH +H ⟶ CH-CH -CH 3 2 2 3 2 3 সু তিাং Y যৌগটি হলো বপ্ার্পে (CH -CH -CH )। র 3 2 3 ় ় ততডকাবক্সিজেশন রবভতর্ব যায কপ্াথপন প্রস্তুতি র র তৈ এসিডের সোডিয়াম লবণনক বসার্ালাইর্ (NaOH + CaO) সহ উকপ্ করলে কা ডক্সিল মূলক থেকে CO অপসারিত হয়ে (Na CO ত 2 2 3 ় িূর্প) এক কার্বন কম অ্যালকেন উৎপন্ন হয়। এনক প্র্কা ডক্সিনলশে র মে্ ব ো বলে। বপ্ার্পনে 3টি কার্বন আনছ, তাই 4 কার্বনর মশটট র উটােরেক এসিডের ় ় ় সোডিয়াম লবণ সোডিয়াম র উটােনেট (CH -CH -CH -COONa) 3 2 2 ় বক বসার্ালাইর্সহ উকপ্ করলে বপ্ার্পে উৎপন্ন হয়। ত র CaO, তাপ CH -CH -CH -COONa+NaOH ⟶ CH-CH -CH 3 2 2 3 2 3 +Na CO 2 3 এখানে CaO প্রবণতা ক ছহনসন কাৈ করে এবং NaOH বক শুষ্ক িার্খ। ় ় এরান প্র্কা ডক্সিনলশে বিক্রিয়াে উদ্দীপকের Y যৌগ (বপ্ার্পে) প্তু ত করা যায়।"},{"label":"ঘ","question":"উদ্দীপকের 'X' এবং 'Y' যৌগের মধ্যে বকােটি অসম্পৃকব যৌগ? বিশ্লেষণ কি।","answer":"গ অংশ থেকে পাই, X হলো প্রোপিন (CH -CH=CH ) এবং Y র 3 2 হলো বপ্ার্পে (CH -CH -CH )। 3 2 3 ্ বেস হাইন হাইরোকার্বনে কার্বন-কার্বন ছদ ন্ধে বা মে ন্ধে থাকে তানদি অসম্পৃকব হাইন হাইরোকার্বন এবং বেস হাইন হাইরোকার্বনে কার্বন ্ ্ ্ ্ পরমাণুগুনলা কেবল একে বন্ধনে েুকব তানদি সম্পৃকব হাইন হাইরোকার্বন বলে। ্ X (প্রোপিন) এর অণুনত একটি C=C ছদ ন্ধে আনছ। এটি অযালরকে ্ ় বশ্রণি (C H ) সদসয। ছদ ববন্ধনের দু ডল π ন্ধে সহজে বিনে যায় র n 2n ় ় ় বলে X সংনোৈে বিক্রিয়াে অংশ বেে। যেমন: X লালনচ- াদামর্ ্ ় ব রামর্ে দ্রবণেি সাথে েুকব হয়ে বর্ণহীন 1,2-র্াইতর রানর্ানপ্ার্পে উৎপন্ন ্ র ্ র করে: CH -CH=CH +Br →CH -CHBr-CH Br 3 2 2 3 2 উদ্দীপকের (ii) েং বিক্রিয়ানতও X হাইরোজেনের সাথে সংনোৈে ় ় ় ্ র মে্ ব ো দিয়ে Y এ পরিণত হয়েছে, ো X এর অসম্পৃকবতাি প্রমাণ। অপিরদনক Y (বপ্ার্পে) এর অণুনত সকল কার্বন পরমাণু শুধু একে ্ বন্ধনে (σ ন্ধে) েুকব। এটি অ্যালকেন বশ্রণি (C H ) সদসয। র n 2n+2 প্রতটি কার্বনেি চািটি বোৈযতা সম্পূর্ণিান পূর্ণ, তাই এটি আি H র 2 ় ় বা Br এর সাথে সংনোৈে বিক্রিয়া দেয় ো এবং ব রামর্ে দ্রবণেি ণড 2 ্ র ় ় েটট করে ো; কেবল প্রতথাপে বিক্রিয়া দেয়। সু তিাং উদ্দীপকের X (প্রোপিন) অসম্পৃকব যৌগ এবং Y (বপ্ার্পে) র র সম্পৃ কব যৌগ। ার সাজেশন"}],"board":"র্াদ্াসা বোর্ড ২০২৬"}, ্ডে এনসনছ]","answer":"বেস অসম্পৃকব হাইন হাইরোকার্বনেি কার্বন মশকনল অন্ত একটি কার্বন-কার্বন মে ন্ধে (C≡C) থাকে, তানদি অ্যালকাইন (Alkyne) বলে। অযালকাইনেি সাধারণ সংনকত C H; বে n 2n−2 (CH≡CH)। ় ়"},{"label":"খ","question":"বপ্াপায়রেক এসিড দু ডল এসিড— ব্যাখ্যা কি।","answer":"বে এসিড জলীয় দ্রবণে আংমশকরান র নোরৈত হয়ে খু সামানয + ় ় পরিমাণ হাইরোজেন আয়ন (H ) দেয়, তানক দু ডল এসিড (Weak acid) বলে। বপ্াপায়রেক এসিড (CH -CH -COOH) একটি তৈ এসিড বা িযাটি র 3 2 এসিড। এনক পানিনত দ্ ীিত করলে এর অণুগুনলাি খু অল্ অংশই ﻿ + ় ় ় ় ় র নোরৈত হয়ে H ও বপ্াপায়নেট আয়ন দেয়; বেশভরিাগ অণ ় ় অর নোরৈত অবস্থাে থাকে। র নোৈেটি উির্ুখী, এবং সার্যা থা ি ি ার্ রদনক (অর নোরৈত অণুি রদনক) বেশি থাকে। − + CH -CH -COOH(aq) ⇌ CH -CH -COO (aq)+H (aq) 3 2 3 2 ় ় ় ় বপ্াপায়রেক এসিড, বপ্াপায়নেট আয়ন, হাইরোজেন আয়ন র র ় ় অপিরদনক HCl, H SO এর র্নতা তী র এসিড প্রায় সম্পূর্ণ র নোরৈত 2 4 ্ র + ় ় ় ় ় হয়। দ্রবণে H আয়নেি পরিমাণ কম হওয়ায় বপ্াপায়রেক এসিড র র 2 4 ত একটি দু ডল এসিড। ়"},{"label":"গ","question":"উদ্দীপকের 'D' যৌগটি অসম্পৃকব হাইন হাইরোকার্বন—পিীক্ষার সাহানেয কীিান প্রমাণ করা যায় ব্যাখ্যা কি।","answer":"A ও D শনািবকরণ +H O উদ্দীপকে R = -C H (বপ্াপাইল মূলক)। তাই A যৌগ = C H -OH = 2 2 3 7 র 3 7 CH -CH -CH -OH, অর্থাৎ কপ্াপানে (Propanol)। 3 2 2 র অ্যালকোহলনক অরতরিকব গাঢ় H SO সহ উকপ্ করলে এক অণু 2 4 ত পানি অপসারিত হয় (নিরুদন বা Dehydration) এবং অযালরকে ় ্ উৎপন্ন হয়। গাঢ় H SO, 170°C 2 4 CH -CH -CH -OH ⟶ CH -CH=CH +H O 3 2 2 3 2 2 বপ্াপায়ল (A), প্রোপিন (D), পানি র র সু তিাং D যৌগটি হলো কপ্াভপন (Propene), CH -CH=CH। এর র 3 2 3 ্ ্ অণুনত একটি কার্বন-কার্বন ছদ ন্ধে (C=C) আনছ, তাই এটি অসম্পৃকব হাইন ব াকার্বন। পরীো ১: ব রাভমন দ্বণ পরীো ্ র ় ু একটি বটস ট টি উন রকছ লাল (লালনচ- াদামর্) বর্ণি ব রামর্ে দ্রবণ ্ র ় ় (Br এর CCl বা পানিনত দ্রবণ) রেনে তাি র্ধয দিয়ে D গ্যাস চালো 2 4 র ় ় ় করলে দ্রবণেি লালবণড দ্ুত র লুপ্ হয়ে বর্ণহীন হয়ে যায়। কািণ র র ত 2 ্ ্ ্ ্ ্ ় ড ড ছদ ববন্ধনের দু ডল পাই ন্ধে বিনে ব রামর্ে েুকব হয় এবং বর্ণহীন 1,2- ় র্াইতর রানর্ানপ্ার্পে উৎপন্ন হয়। ্ র CH -CH=CH +Br →CH -CHBr-CH Br 3 2 2 3 2 প্রোপিন, ব রামর্ে (লাল), 1,2-র্াইতর রানর্ানপ্ার্পে ( বর্ণহীন) র ্ ্ র পরীো ২: পটাভশযাম পারমযাঙ্গাজনট দ্বণ পরীো ় ় লঘু ক্ষারীে ( বা জলীয়) KMnO দ্রবণেি থগালামপ (ব গুরে) ণড D 4 র ় ় গ্যাস চালো করলে র েটট হয়। KMnO থেকে প্াপ্ ৈােমান 4 র ত ্ ্ ় অক্সিজেন [O] ও পানি ছদ বন্ধনে েুকব হয়ে বপ্ামপললে গলাইকল র ্ (বপ্ার্পে-1,2-র্াইঅল) ততরি করে। KMnO CH -CH=CH +H O+[O] ⟶ 4CH -CH(OH)-CH OH 3 2 2 3 2 প্রোপিন, পানি, ৈােমান অক্সিজেন, বপ্ামপললে গলাইকল ( বর্ণহীন) র র ্ ় ্ একই পিীক্ষাে বপ্ার্পনেি র্নতা সম্পৃকব হাইন ব াকার্বন ব রামর্ে বা র ্ KMnO এর ণড েটট করে ো। 4 ত ভ ্ ত ভসবধান্: D যৌগ (প্রোপিন) ব রামর্ে দ্রবণেি লালবণড ও KMnO ্ র ্ র 4 দ্রবণেি থগালামপ ণড র েটট করে। তাই প্র্ারণত হয় বে D একটি র র ্ ় অসম্পৃকব হাইন হাইরোকার্বন। (পিীক্ষাে বজনকানো একটি পিীক্ষা ললখনলই ের্থটট।)"},{"label":"ঘ","question":"উদ্দীপকের 'A' এবং 'D' যৌগের পািস্পরিক িূপান্ি সম্ — বিশ্লেষণ কি। [৪ বোর্ডে এনসনছ]","answer":"উদ্দীপকের A যৌগ বপ্াপায়ল (CH -CH -CH -OH) এবং D র্ে: ইথাইন র 3 2 2 যৌগ প্রোপিন (CH -CH=CH )। রেনচ বদখানো হলো বে A থেকে D র 3 2 ত ভ এবং D থেকে A — দুই রদনকই িূপান্ি সম্। A (কপ্াপানে) ক্ষেজক D (কপ্াভপন) র র ্ ় বপ্াপায়লনক অরতরিকব গাঢ় সালমিউরিক এসিডসহ প্রায় 170°C র র ় ় তাপর্াযায় উকপ্ করলে নিরুদন ঘনট এবং প্রোপিন উৎপন্ন হয়। ত র এখানে গাঢ় H SO নিরুদক (পানি থশাষক) ছহনসন কাৈ করে। 2 4 টাইপ ভিততিক মাস্ট ার সাজেশন গাঢ় H SO, 170°C 2 4 CH -CH -CH -OH ⟶ CH -CH=CH +H O 3 2 2 3 2 বপ্াপায়ল, প্রোপিন, পানি র র D (কপ্াভপন) ক্ষেজক A (কপ্াপানে) র র ধ্াপ ১: তৈ পািঅক্সাইড বা হাইরোজেন পািঅিাইনর্ি (H O ) ্ 2 2 উপমথরতনত প্রোপিন হাইরোজেন ব রার্াইনর্ি (HBr) সাথে সংনোৈে র ্ ি ্ ় ় ত ় র মে্ ব ো করে। পািঅক্সাইড থাকাে Br পরমাণু প্ান্ীে কার্বনে েুকব ় ় হয় এবং 1-ব রানর্ানপ্ার্পে (বপ্াপাইল ব রার্াইর্) উৎপন্ন হয়। ্ র র ্ H O 2 2 CH -CH=CH +HBr ⟶ CH -CH -CH Br 3 2 3 2 2 প্রোপিন, হাইরোজেন ব রার্াইর্, 1-ব রানর্ানপ্ার্পে র ্ ্ র ় ় ধ্াপ ২: 1-ব রানর্ানপ্ার্পজনক সোডিয়াম হাইন ব ািাইনর্ি জলীয় ্ র ় ় দ্রবণসহ উকপ্ করলে প্রতথাপে (আদ্ড বিশ্লেষণ) বিক্রিয়াে Br এর র ত র র ্ ্ ় ় থান H -CH=CH। (োচাই: 3 × 12 + 3 6 র 3 2 6×1=42) ধ্ারণা ্ ় অসম্পৃকব যৌগের C=C বন্ধনে েুত বিক্রিয়া ঘনট; তাই এরা ব রামর্ে রদ্রবণেি লালবণড ও পটাশিয়াম পাির্যাঙ্গানেনটি থগালামপ ণড েটট করে। পরীো-১: ব রাভমন দ্বণ পরীো ্ র প্রোপিন গ্যাস লাল- াদামর্ ব রামর্ে দ্রবণে (CCl এ) চালো করলে র ্ র 4 দ্রবণেি লালবণড অপসারিত হয় এবং বর্ণহীন 1,2-র্াইতর রানর্ানপ্ার্পে র ্ র ় উৎপন্ন হয়। CCl 4 CH -CH=CH +Br ⟶ CH -CHBr-CH Br 3 2 2 3 2 প্রোপিন + ব রামর্ে (লাল) → 1,2-র্াইতর রানর্ানপ্ার্পে ( বর্ণহীন) র ্ ্ র পরীো-২: পটাভশযাম পারমযাঙ্গাজনট পরীো ক্ষারীে লঘু KMnO এর থগালামপ দ্রবণে প্রোপিন চালো করলে র র 4 থগালামপ ণড েটট হয় এবং বর্ণহীন বপ্ামপললে গলাইকল (বপ্ার্পে-1,2- র ্ র ় র্াইঅল) উৎপন্ন হয়। CH -CH=CH +H O 3 2 2 KMnO, KOH 4 +[O] ⟶ CH-CH(OH)-CH -OH 3 2 প্রোপিন → বপ্ামপললে গলাইকল ( বর্ণহীন) র র ্ ্ ত ভসবধান্ ় ্ প্রোপিন (Y) উভয় দ্রবণেি ণড েটট করে — অতএ Y একটি অসম্পৃকব যৌগ।"},{"label":"ঘ","question":"Y থেকে Z যৌগ এবং Z থেকে Y যৌগ প্তু ত করা সম্ রকো? বিশ্লেষণ করো। [২ বোর্ডে এনসনছ]","answer":"শনািবকরণ 'গ' অংশ থেকে Y = প্রোপিন (C H )। Z একটি অ্যালকোহল, র 3 6 আণর ক ভর 60। C H OH ধিনল: 14n+18=60, ∴ n = 3। n 2n+1 সু তিাং Z = C H OH, কপ্াপানে (Propanol), 3 7 র CH -CH -CH -OH। (োচাই: 36 + 8 + 16 = 60) 3 2 2 ় ত Y ও Z উিনেিই কার্বন সংখ্যা 3, তাই একটি থেকে অেযটি নত িূপান্ি সম্। Y (কপ্াভপন) ক্ষেজক Z (কপ্াপানে) র র ধ্াপ-১: তৈ পািঅক্সাইড বা H O এর উপমথরতনত প্রোপিন HBr 2 2 ি এর সাথে েুত বিক্রিয়া করে 1-ব রানর্ানপ্ার্পে (বপ্াপাইল ব রার্াইর্) ্ র র ্ দেয় (পািঅক্সাইড প্রবণতা; পািঅক্সাইড ো থাকনল প্ধােত 2- র র ব রানর্ানপ্ার্পে হে)। ্ র H O 2 2 CH -CH=CH +HBr ⟶ CH -CH -CH Br 3 2 3 2 2 ধ্াপ-২: বপ্াপাইল ব রার্াইর্নক জলীয় NaOH দ্রবণেি সাথে উকপ্ র ্ র ত ় ় ় করলে প্রতথাপে বিক্রিয়াে বপ্াপায়ল উৎপন্ন হয়। র র Δ CH -CH -CH Br+NaOH(aq)⟶CH -CH -CH -OH+NaBr 3 2 2 3 2 2 Z (কপ্াপানে) ক্ষেজক Y (কপ্াভপন) র র n ্ ় বপ্াপায়লনক অরতরিকব গাঢ় H SO এর সাথে প্রায় 170°C র 2 4 র ় ় তাপর্াযায় উকপ্ করলে এক অণু পানি অপসারিত হয় (নিরুদন, ় Dehydration) এবং প্রোপিন উৎপন্ন হয়। ্তিক মাস্ট ার সাজেশন গাঢ় H SO, 170°C 2 4 CH -CH -CH -OH ⟶ CH -CH=CH +H O 3 2 2 3 বপ্াপায়ল (Z) → প্রোপিন (Y) + পানি র র ্ ত ভসবধান্ ় ় ় উপনভর বিক্রিয়াগুনলা থেকে বদখা যায়, েুত বিক্রিয়া ও প্রতথাপনেি মাধ্যমে Y থেকে Z এবং নিরুদন বিক্রিয়াি মাধ্যমে Z থেকে Y ততরি ় ় করা যায়। অতএ Y ক্ষেজক Z এবং Z ক্ষেজক Y — উিয রূপান্রই সম্ভ ব।"}],"board":"বরিশাল বোর্ড ২০২১"},{"id":"ch11-cq12","chapter":11,"num":12,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: C H (A), C H OH (B) [এখ্াজন n = 3] n 2n n 2n+1","subQuestions":[{"label":"ক","question":"অযালকাইল মূলক কাকে বলে? [৩ বোর্ডে এনসনছ]","answer":"অ্যালকেন থেকে একটি হাইরোজেন পরমাণু অপসািণ করলে ় ় বে একনোৈী মূলক পাওয়া যায় তানক অযালকাইল মূলক বলে। এর সাধারণ সংনকত C H -; যেমন: মর্থাইল (CH -), ইথাইল n 2n+1 3 (C H -)। 2 5 ্ ়"},{"label":"খ","question":"সাইন্ানপ্ামপজনক অযাললসাইর্ক হাইন হাইরোকার্বন লা হয় কেন? ল ল ্ ব্যাখ্যা কি। ্ ্","answer":"বেস দধ মশকল হাইন হাইরোকার্বনে ব েরৈে লে থাকে ো এবং োনদি ধর্ম র্ু কবেশিকল (অযাললনিটিক) হাইন ব াকার্বনেি র্নতা, তানদি অযাললসাইর্ক হাইন হাইরোকার্বন বলে। ল ্ ্ ় সাইন্ানপ্ামপনেি (C H ) রতেটি কার্বন েুকব হয়ে একটি লে গঠে ল 3 4 করেনছ, অর্থাৎ এটি দধ মশকল যৌগ। এনত একটি C=C ছদ ন্ধে আনছ কিন্তু ব েরৈে লে বেই, এবং এটি অযাললনিটিক অসম্পৃকব যৌগের ় ় র্নতা সংনোৈে বিক্রিয়া দেয়। তাই সাইন্ানপ্ামপজনক অযাললসাইর্ক হাইন হাইরোকার্বন লা হয়। ল ল ্"},{"label":"গ","question":"KMnO দ্রবণ দ্বারা A যৌগটভর অসম্পৃকবতাি পিীক্ষা 4 র সর্ীকিণসহ ব্যাখ্যা কি। [২ বোর্ডে এনসনছ] ত ভ","answer":"উদ্দীপকে A = C H এবং n = 3, সুতিাং A = C H, অর্থাৎ n 2n 3 6 ্ কপ্াভপন (CH -CH=CH )। এনত C=C ছদ ন্ধে আনছ। র 3 2 একটি বটস ট টি উন প্রোপিন গ্যাস চালো করে থগালামপ বর্ণি KMnO রদ্রবণ ও KOH যোগ করে ঝ াকানল KMnO ও KOH থেকে ৈােমান 4 অক্সিজেন [O] ততরি হয়। এই [O] ও দ্রবণেি পানি বপ্ামপনেি র র ্ ্ ় ছদ ববন্ধনের দুই কার্বনে েুকব হয়ে বপ্ামপললে গল াইকল ততরি করে, িনল র ্ ় ় থগালামপ ণড দি হয়ে দ্রবণ বর্ণহীন হয়। ূ র CH -CH=CH +H O 3 2 2 KMnO, KOH 4 +[O] ⟶ CH-CH(OH)-CH OH 3 অপিরদনক সম্পৃকব হাইন হাইরোকার্বন যেমন বপ্ার্পে (C H ) রেনল ্ 3 8 ় ় ় কোনো বিক্রিয়া হয় ো, থগালামপ ণড থেক ক্রিয়া। ় ় ়"},{"label":"গ","question":"উদ্দীপকের ‘X’ ও ‘Y’ যৌগদনেি মধ্যে বকােটি অরধক সমে্বে তা েু প্কব সহ ব্যাখ্যা কি।","answer":"ক্যালসিয়াম কা ডাইনর্ি সাথে পানির বিক্রিয়াে ইথাইন ু ন ় (অযামসটিললে) গ্যাস ও চনেি পানি [Ca(OH)2] উৎপন্ন হয়। সুতিাং X 2 হলো ইথাইন (CH≡CH)। CaC +2H O→CH≡CH+Ca(OH) 2 2 2 ইথাইজনক Ni প্রবণতা নকি উপমথরতনত উকপ্ অবস্থাে হাইন বানৈনেি র ত ি ি ্ ় ় সাথে বিক্রিয়া করানল ইর্থে উৎপন্ন হয়। সুতিাং Y হলো ইর্থে (CH -CH )। 3 3 2 Ni, 200°C CH≡CH+2H ⟶ CH-CH 2 3 3 X (ইথাইন) একটি অসম্পৃকব হাইন হাইরোকার্বন (অ্যালকাইন)। এর দুটি কার্বনেি মধ্যে মে ন্ধে আনছ, োি মধ্যে একটি মসগর্া ও দুটি দু ডল টাইপ ভিততিক মাস্ট ার সাজেশন ্ ্ ় পাই ন্ধে। পাই ন্ধে সহজেই বিনে যায়, িনল X সহজে েুত ় ় ় র মে্ ব যায় অংশ বেে। যেমন: ব ার মর্ে পানির ণড দি করে। ্ ূ CH≡CH+2Br →CHBr -CHBr 2 2 2 অপিরদনক Y (ইর্থে) একটি সম্পৃকব হাইন হাইরোকার্বন (অ্যালকেন)। এর ্ ্ ্ ় ় সকল ন্ধে শক্তিশালী মসগর্া ন্ধে হওয়ায় এটি সাধারণ অবস্থাে প্রায় রেরকব ে; কেবল সূেডানলানকি উপমথরতনত প্রতথাপে বিক্রিয়াে অংশ র ্ ি ি বেে এবং ব রামর্ে পানির ণড দি করে ো। ্ ূ সূ েড ানলাক CH -CH +Cl ⟶ CH-CH Cl+HCl 3 3 2 3 2 সু তিাং, উদ্দীপকের X (ইথাইন) যৌগটি Y (ইর্থে) এর বচনে অরধক সমে্ব ে।"},{"label":"ঘ","question":"উদ্দীপকের ‘X’ যৌগটি থেকে কীিান একটি িযাটি অযামসর্ ় ় প্তু ত করা যায় তা উপেুকব বিক্রিয়াসহ বিশ্লেষণ কি। র ্ ্","answer":"উদ্দীপকের X যৌগটি ইথাইন (CH≡CH)। ইথাইন থেকে দুই ধার্প িযাটি অযামসর্ ইথানোরেক এসিড বা অযামসটিক এসিড (CH COOH) প্তু ত করা যায়। অযামসটিক এসিড একটি র্নোকা ডক্সিললক এসিড, ত ু ্ ো িযাটি অযামসর্ বশ্রণি অন্িড কব। ধ্াপ-১: ইোইন ক্ষেজক ইোনযাে প্রস্তুতি ইথাইন গ্যাসনক 1% HgSO ও 40% লঘু H SO এর মর্শ্র্ণ 60- 2 4 4 80°C তাপর্াযায় চালো করলে ইথাইন এক অণু পানির সাথে েুকব ় ় হয়ে প্রথমে অথােী মিোইল অ্যালকোহল উৎপন্ন করে, ো সাথে সাথে ত ় পু ের ড িেযত হয়ে ইথােযাল (অযামসটালপ্র্হাইর্) এ পরিণত হয়। HgSO, লঘু H SO, 60-80°C 4 2 4 CH≡CH+H O ⟶ [CH =CH 2 →CH -CHO 3 ধ্াপ-২: ইোনযাে ক্ষেজক ইোজনারযক এসিড প্রস্তুতি ় ় ইথােযালনক জারক পদাথড অম্ল ীে পটামসোর্ র্াইতরেব্ ানর্ট (K Cr O / ্ ় H SO ) দ্বারা ৈারিত করলে ইথান ালকেন এ দুটি ণড েটট করে ো। A ব রামর্নেি লালবণড ও ় ় 2 2 7 KMnO এর থগালামপ ণড র েটট করাে প্র্ারণত হয় বে A একটি 4 র ় ় অসম্পৃকব হাইন হাইরোকার্বন। ় ় ়"},{"label":"ঘ","question":"'B' যৌগ থেকে ইর্থে যৌগ প্তু ত সম্ রক-ো? েুপ্কব সহ বিশ্লেষণ কি। [২ বোর্ডে এনসনছ] ﻿","answer":"উদ্দীপকের (ii) েং বিক্রিয়াে জলীয় NaOH এর সাথে প্রতথাপে ় ় ন ় র মে্ ব যায় অ্যালকোহল উৎপন্ন হে: CH CH CH Br+NaOH(aq)→CH CH CH OH+NaBr 3 2 2 3 2 2 সু তিাং B = বপ্াপায়ল (3টি কার্বন), আি ইর্থনে 2টি কার্বন। তাই 2 4 3 এর্ে পথ দিকাি বেখানে একটি কার্বন কনর্ — সোডিয়াম ল র্ণি প্র্কা ডক্সিনলশে এ কাৈ করে। ় ্ ধাপ ১: অম্ল ীে K Cr O দ্বারা বপ্াপায়লনক ৈারিত করলে প্রথমে 2 2 7 র র ় ় বপ্াপায়যাল ও পরে বপ্াপায়রেক এসিড উৎপন্ন হয়। র র K Cr O, H SO 2 2 7 2 4 CH -CH -CH OH+[O] ⟶ CH -CH -CHO 3 2 2 3 2 +H O 2 K Cr O, H SO 2 2 7 2 4 CH -CH -CHO+[O] ⟶ CH -CH -COOH 3 2 3 2 ় ্ ় ধাপ ২: বপ্াপায়রেক এসিক NaOH দ্বারা প্শমর্ত করে সোডিয়াম র র ় ় বপ্াপায়নেট ততরি করা হয়। CH -CH -COOH+NaOH→CH -CH -COONa+H O 3 2 3 2 2 ় ় ধাপ ৩: সোডিয়াম বপ্াপায়নেটনক বসার্ালাইর্ (NaOH + CaO) সহ ় ় উকপ্ করলে Na CO ব ি হয়ে যায় এবং একটি কার্বন কম ইর্থে ত 2 3 ় উৎপন্ন হয়। CaO, Δ CH -CH -COONa+NaOH ⟶ CH -CH +Na CO 3 2 3 3 2 3 ় ় সু তিাং বপ্াপায়ল (B) → বপ্াপায়রেক এসিড → সোডিয়াম র র ় ভ বপ্াপায়নেট → ইর্থে — এ পর্থ B থেকে ইর্থে প্তু ত করা সম্। র র টাইপ ভিততিক মাস্ট ার সাজেশন"}],"board":"চট্টগ্রাম বোর্ড ২০২৪"},{"id":"ch11-cq15","chapter":11,"num":15,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: CH3 - C ≡ CH","subQuestions":[{"label":"ক","question":"ভর সংখ্যা কাকে বলে? [৫ বোর্ডে এনসনছ]","answer":"কোনো পরমাণুর নিউক্লিয়াসে উপমথত প্রোটন সংখ্যা ও রেউ ট ে ল ি সংখ্যাি যোগিলনক ঐ পরমাণুবিভবর সংখ্যা (Mass number) বলে। A = Z + N।"},{"label":"খ","question":"কঠ ি ে আনোপ্র্ে একটি ঊধ্ডপারতত পদাথড– ব্যাখ্যা কি। [২ বোর্ডে এনসনছ]","answer":"বেস কঠ ি ে পদাথড তাপ রদনল তিনল পরিণত ো হয়ে সিাসরি ববাষ্প পরিণত হয় এবং বাষ্পনক শীতল করলে সিাসরি কঠ ি নে মিনি ক ক আনস, তানদিনক ঊধ্পারভর পদাে বলে। কঠ ি ে আনোপ্র্নেি দাোনক র্ৃদু তাপ রদনল তা গনল তিল ো হয়ে সিাসরি ব গুরে বর্ণি ববাষ্প পরিণত হয়। আ াি এই বাষ্প ঠান্া কোনো পৃনঠে ি সংস্পর্শড এনল সিাসরি কঠ ি ে আনোপ্র্ে দাযায় মিনি আনস। I (s) ⇌ I (g) 2 2 তাই কঠ ি ে আনোপ্র্ে একটি ঊধ্ডপারতত পদাথড।"},{"label":"গ","question":"উদ্দীপকের যৌগটভর অসম্পৃকবতাি পিীক্ষা সর্ীকিণসহ ললখ। [২ বোর্ডে এনসনছ]","answer":"শনািবকরণ উদ্দীপকের যৌগ CH -C≡CH হলো কপ্াপাইন (Propyne), C H 3 ড ্ ্ ্ — কার্বন-কার্বন মে ন্ধেেুকব অ্যালকাইন, অর্থাৎ একটি অসম্পৃকব হাইন ব াকার্বন। ধ্ারণা ড ্ ্ ড ্ ্ ু মে ববন্ধনের দুটি পাই ন্ধে বিনে প্রতটি কার্বনে েতে পরমাণু েুকব হনত ় ় পানি, তাই অ্যালকাইন দুই ধার্প েুত বিক্রিয়া দেয় (2 মোল Br গ্রহণ করে)। এজন্য এটি ব রামর্ে ও KMnO দ্রবণেি ণড েটট করে। ্ 4 র পরীো-১: ব রাভমন দ্বণ পরীো ্ র লাল- াদামর্ ব রামর্ে দ্রবণে (CCl এ) বপ্াপাইে চালো করলে লালবণড ্ র 4 র অপসারিত হয় এবং বর্ণহীন 1,1,2,2-বট ট াতর রানর্ানপ্ার্পে উৎপন্ন হয়। ্ র CCl 4 CH -C≡CH+2Br ⟶ CH -CBr -CHBr 3 2 3 2 বপ্াপাইে + ব রামর্ে (লাল) → 1,1,2,2-বট ট াতর রানর্ানপ্ার্পে ( বর্ণহীন) র ্ র ্ র পরীো-২: পটাভশযাম পারমযাঙ্গাজনট পরীো ক্ষারীে লঘু KMnO এর থগালামপ দ্রবণে বপ্াপাইে চালো করলে 4 র র থগালামপ ণড েটট হয় এবং বর্ণহীন 1,1,2,2-বট ট াহাই বক্সিনপ্ার্পে র ্ ন ় উৎপন্ন হয়। CH -C≡CH+2H O 3 2 KMnO, KOH 4 +2[O] ⟶ CH-C(OH) -CH(OH) 3 বপ্াপাইে → 1,1,2,2-বট ট াহাই ব ক্সিনপ্ার্পে ( বর্ণহীন) র র র ্ ত ভসবধান্ বপ্াপাইে উভয় দ্রবণেি ণড েটট করে — এটি ই এর অসম্পৃকবতাি র র প্রমাণ। (সম্পৃকব বপ্ার্পে এ দুটি দ্রবণেি ণড েটট করে ো।) র র র ﻿ ়"},{"label":"ঘ","question":"উদ্দীপকের যৌগটি থেকে পললর্াি প্তু ত সম্ রক? সর্ীকিণসহ বিশ্লেষণ কি। [৫ বোর্ডে এনসনছ]","answer":"শনািবকরণ ও রবজ্ল ে ষণ উদ্দীপকের যৌগটি কপ্াপাইন, CH -C≡CH। প্চললত েুত পললর্াি র 3 র ্ ় ্ ড ্ ্ ্ ততরিনত র্নোর্াি ছহনসন ছদ ন্ধেেুকব অযালরকে য হবত হয়। তাই ় ত বপ্াপাইজনক প্রথমে রেেছন্তত হাইন ব ানৈনেশনে বপ্ামপনে িূপান্ি র র র র ্ করে, তািপি বপ্ামপজনক পললর্ািকিণ করলে পললর্াি ় ় (পললনপ্ামপে) পাওয়া যায়। ধ্াপ-১: কপ্াপাইন ক্ষেজক কপ্াভপন র র বপ্াপাইজনক রজনকল (Ni) প্রবণতা নকি উপমথরতনত 180-200°C র র ় ় তাপর্াযায় এক মোল (রেেছন্তত পরিমাণ) H এর সাথে উকপ্ করলে র 2 ত ় ় ় ় প্রোপিন পাওয়া যায়। অরতরিকব H রদনল বিক্রিয়া আিও এরগনে র 2 ় ় সম্পৃ কব বপ্ার্পে ততরি হয়, ো থেকে পললর্াি হয় ো — তাই H র র 2 রেেন্তণ ৈিুরি। Ni, 180-200°C CH -C≡CH+H ⟶ CH -CH=CH ় 3 2 3 2 বপ্াপাইে → প্রোপিন র র ধ্াপ-২: কপ্াভপন ক্ষেজক পলেজপ্াভপন র র বপ্ামপজনক টাইটারেোর্ ক্লোরাইড (TiCl, রৈগলাি-োট্ট বা প্রবণতা ক) র র ল 3 ় ় এর উপমথরতনত প্রায় 120°C তাপর্াযায় ও 140 atm চার্প উকপ্ র ত ্ ড ্ ্ ্ ় করলে অসংখয প্রোপিন অণুি ছদ ন্ধে খুনল পিস্পি েুকব হয় এবং েুত ় পললর্াি পলেজপ্াভপন উৎপন্ন হয়। TiCl, 120°C, 140 atm 3 nCH =CH-CH ⟶ [-CH -CH(CH )-] 2 3 2 3 n প্রোপিন (র্নোর্াি) → পললনপ্ামপে (পললর্াি) র র ্ ় পললনপ্ামপে শকব ও হালকা; এটি দিয়ে ালরত, পাইপ, দপ্ড়, প্ াসস ি নকি পায় ও থখলো ততরি হয়। 3 4 ত ভসবধান্ অতএ, উদ্দীপকের যৌগ বপ্াপাইে থেকে প্রথমে প্রোপিন এবং পরে র র র পললর্ািকির্ণি মাধ্যমে পললনপ্ামপে ততরি করা যায় — অর্থাৎ কপ্াপাইন ক্ষেজক পলেমার প্ুস্ি করা সম্ভ ব। র র অ্যালকোহল 2 র"}],"board":"রাজশাহী বোর্ড ২০২২"},{"id":"ch11-cq16","chapter":11,"num":16,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: A ও B অযােরকন ও অ্যালকোহল। A ও B এর আণরবক ির যোতরব্ জম 42 ও 46। ় [A ও B প্িীকী অথে বযবহবি]","subQuestions":[{"label":"ক","question":"বর্রথনলনটর্ ঙ্কস্পরিট কাকে বলে? [২ বোর্ডে এনসনছ] 2","answer":"কমরেজেজটড স্সপররট: বিক্ি িাইর্ ঙ্কস্পরিনটি (95.6% ইথানল) সাথে ্ ় ় সামানয র ষাকব মর্থােল (প্রায় 5%) মর্মশনে বে পানেি অনোগয মর্শ্ণ র র ততরি করা হয় তানক বর্রথনলনটর্ ঙ্কস্পরিট বলে। টাইপ ভিততিক মাস্ট ার সাজেশন"},{"label":"খ","question":"েযাপথললজনক অযানিানর্টিক হাইন হাইরোকার্বন লা হয় কেন? [২ বোর্ডে এনসনছ] ় ় ্","answer":"েযাপথললনেি আণর ক সংনকত C H। এর অণুনত দুটি 10 8 ় ় ব েরৈে লে পাশাপামশ েুকব থাকে এবং লনে পর্যায়ে্বনর্ একে ও ্ ছদ ন্ধে র দযমান। ় ্ ব েরৈে লেেুকব বে সকল চামেব্ ক হাইন হাইরোকার্বন র র্শষ গন্ধেুকব, তানদি অযানিানর্টিক হাইন ব াকার্বন বলে। েযাপথললে ব েরৈে ় ্ ্ লেেুকব এবং তী র গন্ধেুকব, তাই এনক অযানিানর্টিক হাইন ব াকার্বন লা হয়।"},{"label":"গ","question":"A যৌগনক ক্ষারীে পটাশিয়াম পাির্যাঙ্গানেট দ্বারা ৈারিত করলে কী ঘনট? সর্ীকিণসহ ব্যাখ্যা কি tion":"A ও B ভিন্ন যৌগ হলেও এদের দহয়ে একই িকনর্ি উৎপাদ ততরি হয়।—সর্ীকিণসহ ব্যাখ্যা কি। 2","answer":"উদ্দীপকে A একটি অ্যালকোহল এবং B একটি অযালরকে। n = 2 হলে A = ইথানল (CH -CH -OH) এবং গাঢ় H SO দ্বারা নিরুদন 3 2 2 ় ় করে B = ইরথে (CH =CH ) পাওয়া যায়। 2 2 গাঢ় H SO, 170°C 2 4 CH -CH -OH ⟶ CH =CH +H O 3 2 2 A একটি অ্যালকোহল (কােডকিী মূলক -OH) এবং B একটি ্ ্ ্ অসম্পৃকব হাইন হাইরোকার্বন (C=C ছদ ন্ধে েুকব); তাই এরা ভিন্ন বশ্রণি ভিন্ন যৌগ। ় ় কিন্তু উভয় যৌগেই কার্বন ও হাইরোজেন িনেনছ। পেডাপ্ অক্সিনৈনে পূ ণড দহয়ে কার্বন ৈারিত হয়ে কার্বন র্াইঅক্সাইড এবং হাইরোজেন ় ্ ৈারিত হয়ে পানি উৎপন্ন করে; সাথে তাপশক্তি রেগডত হয়। A (ইোনে) এর দহন CH -CH -OH+3O →2CO +3H O+তাপ 3 2 2 2 2 B (ইরেন) এর দহন CH =CH +3O →2CO +2H O+তাপ 2 2 2 2 2 ় ় সর্ীকিণ দুটি থেকে বদখা যায়, উভয় থক্ষতরেই দহয়েি উৎপাদ CO ও H O (কেবল মোল সংখ্যা ভিন্ন)। 2 ় ্ সু তিাং A ও B ভিন্ন যৌগ হলেও উিনে C ও H দ্বারা গঠ ি ত হওয়ায় এদের দহয়ে একই িকম উৎপাদ (CO ও H O) ততরি হয়। 2 2"}],"board":"কুমিল্লা বোর্ড ২০২৬"},{"id":"ch11-cq18","chapter":11,"num":18,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: Δ (i)PCl ⟶PCl +Cl 5 3 2 উচ্চ তাপ ও চাপ, িসিরিক এসিড (ii)C H +H O ⟶ n 2n 2 [এখ্াজন, n = 2]","subQuestions":[{"label":"ক","question":"আপেক্ষিক পারমাণবিক ভর কী?","answer":"কোনো মৌলের একটি পরমাণুর গড় ভর একটি কার্বন-12 আইনসানটার্পি ভরের 1/12 অংর্শি তলযায় েত গুণ িািী, বসই সংখ্যানক ঐ মৌলের আপেক্ষিক পারমাণবিক ভর বলে।"},{"label":"খ","question":"েযাপথাললে একটি অযানিানর্টি ক যৌগ— ব্যাখ্যা কি। [৪ বোর্ডে এনসনছ]","answer":"বেস চামেব্ ক তৈ যৌগের অণুনত ব েরৈে লে থাকে, ত ্ একান্ি একে ও ছদ ন্ধে থাকে এবং োিা সাধারণত সুগন্ধেুকব, তানদিনক অযানিানর্টিক যৌগ বলে। েযাপথাললনেি (C H ) অণুনত দুটি ব েরৈে লে পাশাপামশ েুকব 10 8 ্ ় ় ত (সংেুকব ) অবস্থাে থাকে এবং লনে একান্ি একে ও ছদ ন্ধে র দযমান। তাছাড় বা এর তী র গন্ধ আনছ (থপাকার্াকড় তাড় ানত য হব ত হে)। তাই েযাপথাললে একটি অযানিানর্টিক যৌগ। ় ়"},{"label":"গ","question":"উদ্দীপকে (i) েং বিক্রিয়াটি একটি জারণ-র জারণ বিক্রিয়া— ব্যাখ্যা কি।","answer":"বে বিক্রিয়াে ইলেকট্রন আদা ়"},{"label":"ঘ","question":"B থেকে খাদয সংিক্ষক প্তু ত করা সম্ —বিশ্লেষণ কি। [২ বোর্ডে র ্ এনসনছ] টাইপ ভিততিক মাস্ট ার সাজেশন","answer":"উদ্দীপকের বিক্রিয়াে A (ইরথে) উচ্চ তাপ ও উচ্চ চার্প H PO 3 প্রবণতা নকি উপমথরতনত পানির সাথে েুত বিক্রিয়া করে ইথানল উৎপন্ন করে। অর্থাৎ B হলো ইথানল (CH -CH -OH)। 3 2 H PO, 300°C, 60 atm CH =CH +H O 3 4 ⟶ CH -CH -OH 2 2 2 3 2 ইথানলনক ৈারিত করলে প্রথমে ইথােযাল ও পরে ইথানয়িক এসিড ় (অযামসটিক এসিড) উৎপন্ন হয়। রাসায়নিক োরণ ় ্ অম্ল ীে K Cr O দ্রবণ দ্বারা ইথানলনক ৈারিত করলে: 2 2 7 K Cr O /H SO 2 2 7 2 4 CH -CH -OH+[O] ⟶ CH -CHO+H O 3 2 3 2 K Cr O /H SO 2 2 7 2 4 CH -CHO+[O] ⟶ CH -COOH 3 3 বেব োরণ (গ ােন) লঘু ইথানল দ্রবণনক াতানসি উপমথরতনত অযামসনটা যা্টি বিভব ় ্ ় ় ব্যাকটেরিয়া দ্বারা ৈারিত করলেও ইথানয়িক এসিড উৎপন্ন হয়। অযামসনটা যা্টি CH -CH -OH+O ⟶ CH -COOH+H O 3 2 2 3 2 টাইপ ভিতত ﻿ ় ় ইথানয়িক এসিডের 4-10% জলীয় দ্রবণনক ভিনেগার বা মসিকা বলে। ভিনেগার একটি রেিাপদ খাদয সংিক্ষক। এটি খানদযি pH কমর্নে ় ় অম্ল ীে পরিন শ সৃটটি করে, িনল খাদয পচেকািী ব্যাকটেরিয়া ও ড ্ ছোক ৈন্মানত ও ংশ বৃদ্ধি কিনত পানি ো। এজন্য আচাি, চাটরে, সস ইতযারদ খাদয সংিক্ষর্ণ ভিনেগার য হবত হয়। সু তিাং B (ইথানল) বক ৈারিত করে ভিনেগার তথা খাদয সংিক্ষক প্তু ত করা সম্।"}],"board":"রাজশাহী বোর্ড ২০২৬"},{"id":"ch11-cq20","chapter":11,"num":20,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: (i)CH -CH -CH Cl + NaOH(alc) → A + NaCl + H O 3 2 2 2 (ii)CH COOH + NaOH → B + H O 3 2","subQuestions":[{"label":"ক","question":"বিকটি িাইর্ ঙ্কস্পরিট কী? [৫ বোর্ডে এনসনছ]","answer":"ইথােনলি 95.6% জলীয় দ্রবণনক করকটি ফাইড স্সপররট (Rectified spirit) বলে। ় ়"},{"label":"খ","question":"ব েরৈজনক অযানিানর্টিক হাইন হাইরোকার্বন লা হয় কেন? ব্যাখ্যা কি। [৪ বোর্ডে এনসনছ]","answer":"5, 6 বা 7 সদসযর মশটট বে সর্তলীে চামেব্ ক ( লে) হাইন ব াকার্বনে ্ ত কার্বন-কার্বন একে ও ছদ ন্ধে পর্যায়ে্বনর্ (একান্ভরান ) থাকে তানক অযাজরাজমটি ক হাইরোকার্বন (Aromatic hydrocarbon) বলে। ব েরৈনেি আণর ক সংনকত C H। এর ছেটি কার্বন পরমাণু একটি 6 6 ় ় ় ু সর্তলীে ষড় িৈ লে গঠে করে এবং লনে রতেটি একে ন্ধে ও ্ ত রতেটি ছদ ন্ধে একান্ভরান সাৈানো থাকে। এর একটি র র্শষ সুগন্ধ আনছ (Aroma অথড সুগন্ধ)। তাই ব েরৈে একটি অযানিানর্টি ক হাইন ব াকার্বন।"},{"label":"গ","question":"'A' যৌগটভর অসম্পৃকবতা কীিান প্রমাণ কিন? সর্ীকিণসহ ব্যাখ্যা কি। [৪ বোর্ডে এনসনছ]","answer":"A শনািবকরণ 4 বপ্াপাইল ক্লোরাইক (1-ব্ানিানপ্ার্পে) NaOH এর র র ল ল অ্যালকোহলীে দ্রবণসহ উকপ্ করলে পাশাপামশ দুই কার্বন থেকে H র ত ় ় ় ও Cl অপসারিত হয়ে (অপসািণ বিক্রিয়া) অযালরকে উৎপন্ন হয়। Δ CH -CH -CH Cl+NaOH(alc) ⟶ CH -CH=CH +NaCl 3 2 2 3 2 +H O 2 ় ় বপ্াপাইল ক্লোরাইড + অ্যালকোহলীে সোডিয়াম হাইন বািাইর্ → প্রোপিন (A) + র ল র সোডিয়াম ক্লোরাইড + পানি ্ সু তিাং, A = কপ্াভপন (C H ), CH -CH=CH। এনত C=C ছদ ন্ধে র 3 6 3 2 আনছ। অসম্পৃিব িা প্রমাণ (১) ব রাভমন দ্বণ পরীো ্ র ্ বপ্ামপজনক লাল বর্ণি ব রামর্ে দ্রবণে চালো করলে ছদ বন্ধনে ব রামর্ে র ্ র ্ ্ ় ় েু কব হয়ে বর্ণহীন 1,2-র্াইতর রানর্ানপ্ার্পে উৎপন্ন হে; িনল ব রামর্নেি ্ র ্ লালবণড র েটট হয়। CH -CH=CH +Br →CH -CHBr-CH Br 3 2 2 3 2 প্রোপিন + ব রামর্ে (লাল) → 1,2-র্াইতর রানর্ানপ্ার্পে ( বর্ণহীন) র ্ ্ বিভবক মাস্ট ার সাজেশন ় ় (২) পটাভশযাম পারমযাঙ্গাজনট (কবযার) পরীো বপ্ামপজনক KOH মর্প্শ্ত থগালামপ বা ব গুরে বর্ণি KMnO দ্রবণে র র চালো করলে বপ্ামপললে গলাইকল (বপ্ার্পে-1,2-র্াইওল) উৎপন্ন হয় র ্ র এবং দ্রবণেি থগালামপ ণড র েটট হয়। CH -CH=CH +H O 3 2 2 KMnO, KOH 4 +[O] ⟶ CH-CH(OH)-CH OH 3 প্রোপিন → বপ্ামপললে গলাইকল ( বর্ণহীন) র র ্ ✓ বজনকানো একটি পিীক্ষা ললখনলই অসম্পৃকবতা প্রমাণ হে; তন ় ্ দু টি ললখনল উকি বেশি পূর্ণাঙ্গ হয়। সম্পৃকব অ্যালকেন এ দুটি দ্রবণেি ণড েটট করে ো। ্ ত ভসবধান্: A যৌগ প্রোপিন ব রামর্ে দ্রবণেি লালবণড ও KMnO দ্রবণেি ্ র ্ র থগালামপ ণড র েটট করে বলে এটি একটি অসম্পৃকব যৌগ।"},{"label":"ঘ","question":"'B' হনত একটি যৌগ ততরি করা যায় ো র্ৃত প্ারণনদহ সংিক্ষর্ণ ্ ় ় ় য হব ত হয় — রাসায়নিক সর্ীকিণসহ র্ূলযােে কি।","answer":"B শনািবকরণ ় ় উদ্দীপকের (ii) েং বিক্রিয়াটি প্শর্ে বিক্রিয়া। CH COOH+NaOH→CH COONa+H O 3 3 ় ় ় ইথানয়িক এসিড + সোডিয়াম হাইন ব ািাইর্ → সোডিয়াম ইথােনেট (B) + পানি ় ় সু তিাং, B = কসাততডযাম ইোনজযট (CH3COONa)। ্ ় র্ৃ ত প্ারণনদহ সংিক্ষর্ণ ফরমালেন য হব ত হয়। মর্থােযাল বা ভরর্ালপ্র্হাইনর্ি (HCHO) 40% জলীয় দ্রবণনক ভরর্াললে বলে। তাই B থেকে মর্থােযাল ততরি করা যায় রক ো তা বদখনত হন। B ক্ষেজক ভমোনযাে প্রস্তুতি ১. প্র্কা ডক্সিনলশে: CaO এর উপমথরতনত সোডিয়াম ইথােনেটনক ় ় NaOH সহ উকপ্ করলে মিথেন পাওয়া যায়। CaO, Δ CH COONa+NaOH ⟶ CH +Na CO 3 4 ় ় ় সোডিয়াম ইথােনেট → মিথেন + সোডিয়াম কার্বনেট ২. হযানলারৈনেশে: র্ৃদু সূেডানলানক মিথেন ব রামর্নেি সাথে বিক্রিয়া করে মর্থাইল ব রার্াইর্ দেয়। র্ৃ দু সূ েড ানলাক CH +Br ⟶ CHBr+HBr 4 2 3 মিথেন → মর্থাইল ব রার্াইর্ ৩. আদ্ড বিশ্লেষণ: মর্থাইল ব রার্াইর্নক জলীয় NaOH সহ উকপ্ র ্ ্ ় করলে মর্থােল উৎপন্ন হয়। Δ CH Br+NaOH(aq)⟶CH -OH+NaBr 3 3 মর্থাইল ব রার্াইর্ → মর্থােল ৪. জারণ: K Cr O ও গাঢ় H SO থেকে প্াপ্ ৈােমান অক্সিজেন র ত 2 2 7 2 4 [O] দ্বারা মর্থােলনক র্ৃদু ৈারিত করলে মর্থােযাল উৎপন্ন হয়। K Cr O, গাঢ় H SO CH -OH+[O] 2 2 7⟶ 2 4 HCHO+H O 3 মর্থােল → মর্থােযাল (ভরর্ালপ্র্হাইর্) ূ উৎপন্ন মর্থােযালনক পানিনত দ্ ীিত করে 40% দ্রবণ ততরি করলে র র ় ় ভরর্াললে পাওয়া যায়। • মর্থােযাল ততরভর পি জারণ বেশি হলে মর্থােরেক এসিড (HCOOH) ততরি হনত পানি; তাই উৎপন্ন মর্থােযালনক দ্ুত সরিনে রেনত হয়। ্ ত ় ় ভসবধান্: B (সোডিয়াম ইথােনেট) → মিথেন → মর্থাইল ব রার্াইর্ → মর্থােল → মর্থােযাল ধার্প ভরর্াললে প্তু ত করা যায়, ো র্ৃত ্ ় প্ারণনদহ সংিক্ষর্ণ য হব ত হয়। সুতিাং উপ্কব টি েথাথড। ﻿ অযােততডহাইড ও বেব এসিড 4 র"}],"board":"বরিশাল বোর্ড ২০২৫"},{"id":"ch11-cq21","chapter":11,"num":21,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: ় (i) প্াকৃ রিক গযাজসর প্রধান উপাদান। র র (ii) কমৌমাদ্ের কামজড় শরীজর এক ধ্রজনর বেব এসিড প্জবশ কজর। 2","subQuestions":[{"label":"ক","question":"বিকটি িাইর্ ঙ্কস্পরিট কাকে বলে? [৫ বোর্ডে এনসনছ]","answer":"করকটি ফাইড স্সপররট: 95.6% ইথানল ও 4.4% পানির মর্শ্ণনক বিকটি িাইর্ ঙ্কস্পরিট বলে। 2"},{"label":"খ","question":"C H যৌগনক অললমিে লা হয় — ব্যাখ্যা কি। [৪ বোর্ডে এনসনছ] 3 6","answer":"অললমিে শর্েি অথড বতল উৎপাদেকািী। অযালরকেসর্ূহ ় ় ্ হযানলানৈনেি সাথে েুত বিক্রিয়াে ততলাকব পদাথড উৎপন্ন করে বলে এদেরনক অললমিে বলে। C H (CH -CH=CH ) হলো প্রোপিন, ো C H সাধারণ 3 6 3 2 র n 2n সংনকতর মশটট অযালরকে বশ্রণি সদসয। এটি ব্ারিনেি সাথে েুত ় ় র মে্ ব যায় বতনলি র্নতা তিল 1,2-র্াইন্ানিানপ্ার্পে উৎপন্ন করে। CH -CH=CH +Cl →CH -CHCl-CH Cl 3 2 2 3 2 তাই C H যৌগনক অললমিে লা হয়। 3 6"},{"label":"গ","question":"উদ্দীপকের (i) েং যৌগের সাথে সূনেডি আনলাি উপমথরতনত Cl ি 2 এর বিক্রিয়াি ধাপগুনলা সর্ীকিণসহ ণডো কি। 4 র","answer":"প্াকৃ রতক গ্যাসের প্ধাে উপাদান মিথেন (CH )। সূনেডি আনলাি র র 4 2 3 উপমথরতনত মিথেন ব্ারিনেি সাথে প্রতথাপে বিক্রিয়া করে। এনত ি ল ি ্ ় মর্র্থনেি H পরমাণুগুনলা একটি একটি করে Cl দ্বারা প্রতথামপত হয়। ় ় র মে্ ব োটি চািটি ধার্প সম্পন্ হে: ১. প্থর্ ধার্প মর্র্থনেি একটি H প্রতথামপত হয়ে ব্ানিামিথেন র বিভব ল ় উৎপন্ন হয়। সূ েড ানলাক CH +Cl ⟶ CHCl+HCl 4 2 3 ্ ় ় ২. ছদতীে ধার্প ব্ানিামিথেন থেকে র্াইন্ানিামিথেন উৎপন্ন হয়। ল ল সূ েড ানলাক CH Cl+Cl ⟶ CHCl +HCl 3 2 2 2 ৃ ় ৩. ততীে ধার্প র্াইন্ানিামিথেন থেকে ট াইন্ানিামিথেন ল র ল ় ় (ব্ানিাির্ড) উৎপন্ন হয়। ় সূ েড ানলাক CH Cl +Cl ⟶ CHCl +HCl 2 2 2 3 2 ু ৪. চতথড ধার্প ব্ানিাির্ড থেকে বট ট ান্ানিামিথেন (কার্বন ল র ল ় বট ট ান্ািাইর্) উৎপন্ন হয়। র ল সূ েড ানলাক CHCl +Cl ⟶ CCl +HCl 3 2 4 ় প্রতটি ধার্প উপৈাত ছহনসন HCl উৎপন্ন হয়। পেডাপ্ ব্ারিনেি র ত ় ় ় উপমথরতনত বিক্রিয়াি থশষ উৎপাদ হয় CCl। বিভব 4"},{"label":"ঘ","question":"উদ্দীপকের (i) েং যৌগ থেকে (ii) েং এর তৈ এসিডটি প্তু রত সর্ীকিণসহ ণডো কি।","answer":"(i) েং যৌগ মিথেন (CH ) এবং বর্ৌর্াছছি কার্নড় শরীরে 4 ্ ় প্রবেশকািী তৈ এসিড হলো ভরমর্ক এসিড বা মর্থানোরেক এসিড টাইপ ভিততিক মাস্ট ার সাজেশন (HCOOH)। মিথেন থেকে রেনম্ন াকব ধার্প ভরমর্ক এসিড প্তু ত করা যায়: ধ্াপ-১: মিথেন ক্ষেজক ভমোনযাে মিথেন ও অক্সিজেনের মর্শ্ণনক 100 atm চার্প ও 300°C তাপর্াযায় Mo O প্রবণতা নকি উপমথরতনত উকপ্ করলে মর্থােযাল র ত 2 3 ি ় (ভরর্ালপ্র্হাইর্) উৎপন্ন হয়। Mo O, 300°C, 100 atm CH +O 2 3 ⟶ HCHO+H O 4 2 ধ্াপ-২: ভমোনযাে ক্ষেজক ভমোজনারযক এসিড মর্থােযালনক গাঢ় H SO মর্প্শ্ত K Cr O এর র্নতা ৈািনকি 2 4 র 2 2 7 উপমথরতনত ৈারিত করলে মর্থানোরেক এসিড (ভরমর্ক এসিড) ় উৎপন্ন হয়। K Cr O /H SO 2 2 7 2 4 HCHO+[O] ⟶ HCOOH র কল্িান, মর্র্থজনক প্রথমে সূেডানলানক Cl দ্বারা ব্ানিামর্র্থনে প র 2 ল ় ্ ত পরিণত করে জলীয় KOH দ্বারা মর্থােনল িূপান্ি করা যায়। মর্থােলনক ৈারিত করে মর্থােযাল এবং মর্থােযালনক পুেিাে ৈারিত ় ় ় করে মর্থানোরেক এসিড পাওয়া যায়। সূ েড ানলাক CH +Cl ⟶ CHCl+HCl 4 2 3 CH Cl+KOH(aq)→CH OH+KCl 3 3 K Cr O /H SO 2 2 7 2 4 CH OH+[O] ⟶ HCHO+H O 3 K Cr O /H SO 2 2 7 2 4 HCHO+[O] ⟶ HCOOH সু তিাং, (i) েং যৌগ মিথেন থেকে ৈাির্ণি মাধ্যমে (ii) েং এর তৈ এসিড অর্থাৎ ভরমর্ক এসিড (HCOOH) প্তু ত করা সম্।"}],"board":"দিনাজপুর বোর্ড ২০২৬"},{"id":"ch11-cq22","chapter":11,"num":22,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: একটি যৌগে Ca = 62.5%, C = 37.5%, কদওযা আজে। ঐ যৌগের আণরবক ির = 64 অপর একটি যৌগের সাধ্ারণ সংকেত CnH2n−2; এখ্াজন n = 2 ্ ত","subQuestions":[{"label":"ক","question":"শক্তি তি কাকে বলে?","answer":"্ ত ় শততিব স্র: পরমাণুর নিউক্লিয়াসেি চািরদনক ইলেকট্রনসর্ূহ বে নির্দিষ্ট ল র ্ শক্তি সম্পন্ ৃ কাকাি কক্ষপর্থ আ তড ে করে, বসগুনলানক শক্তিস্তর বলে।"},{"label":"খ","question":"কপািনক র্ুদ্াধাত লাি কািণ ব্যাখ্যা কি।","answer":"প্াচীেকাল থেকে র্ুদ্া ততরিনত বেস ধাত য হব ত হয়ে আসনছ, র র তানদিনক র্ুদ্াধাত বলে। পর্যায় সািরণি ১১ েং গ্রুপেি মৌল Cu, Ag র র ও Au র্ুদ্াধাত। ় ু কপাি একটি কম সমে্বে ধাত। এটি াতাস ও পানির সাথে সহজে ় ় ় র মে্ ব ো করে ো এবং সহজে ক্ষেপ্াপ্ হয় ো। তাছাড় বা কপাি ের্েীে, র ত ঘাতসহ এবং আকর্ষণীে বর্ণি। এস ত মশনটট যি কারণে কপাি দিয়ে ় র্ু দ্া ততরি করা হয়। তাই কপািনক র্ুদ্াধাত লা হয়। র র ﻿"},{"label":"গ","question":"উদ্দীপকের প্থর্ যৌগটভর আণর ক সংনকত নির্ণয় কি। [৩ বোর্ডে এনসনছ]","answer":"মৌল শতকরা পারমাণরবক পরমাণুর সরে পরিমাণ ির আথপততেক অনুপাি সংখ্যা Ca 62.5 40 62.5 1.5625 40 1.5625 =1.5625 =1 C 37.5 12 37.5 3.125 2 12 1.5625 =3.125 =2 সু তিাং যৌগটভর থল সংনকত CaC িূ 2 স্ে সংকেত ির = 40+(12×2) = 64 থূ ধরি, আণর ক সংনকত = (CaC ) 2 n 64 n = আণরবক ির/স্ে সংকেত ির = =1 থূ 64 আণরবক সংকেত = (CaC ) = CaC 2 1 2 অতএ, প্থর্ যৌগটি ি আণর ক সংনকত CaC (ক্যালসিয়াম র 2 কা ডাইর্)।"},{"label":"ঘ","question":"উদ্দীপকের থশনষাকব যৌগ থেকে তৈ এসিড প্তু রত সম্ — সর্ CH 2 2 2 3 3 ় ় তাই সকল সংন্লষণ বিক্রিয়া সংনোৈে বিক্রিয়া হলেও সকল ় ় ় সংনোৈে বিক্রিয়া সংন্লষণ বিক্রিয়া েে। ় ়"},{"label":"গ","question":"অযালকাইল হযালাইর্ হনত কীিান P যৌগটি প্তু ত কিন সর্ীকিণসহ ব্যাখ্যা কি।","answer":"উদ্দীপকের (i) েং বিক্রিয়াে 20% H SO ও 2% HgSO এর 2 4 উপমথরতনত 80°C তাপর্াযায় ইথাইন পানির সাথে বিক্রিয়া করে অযামসটালপ্র্হাইর্ বা ইথােযাল উৎপন্ন করে। 20% H SO, 2% HgSO, 80°C HC≡CH+H O 2 4 ⟶ 4 CH -CHO 2 সু তিাং P যৌগটি হলো অযামসটালপ্র্হাইর্ বা ইথােযাল (CH CHO)। অযােকাইে হযাোইড ক্ষেজক P প্রস্তুতি ধাপ-১: অযালকাইল হযালাইর্ ইথাইল ক্লোরাইড (CH -CH -Cl) কেবল 3 ় ় জলীয় সোডিয়াম হাই ব িাইর্ ( বা KOH) দ্রবণেি সাথে উকপ্ করলে ় ় ় প্রতথাপে বিক্রিয়াে ইথানল উৎপন্ন হয়। তাপ CH -CH -Cl+NaOH(aq) ⟶ CH -CH -OH+NaCl 3 2 3 2 ় ধাপ-২: উৎপন্ন ইথানলনক জারক পদাথড পটামসোর্ র্াইতরেব্ ানর্ট ও সালমিউরিক এসিডের (K Cr O +H SO ) সাথে র্ৃদু ৈারিত 2 2 7 2 4 ় করলে অযামসটালপ্র্হাইর্ উৎপন্ন হয়। এর্ক্ষতরে অযালপ্র্হাইর্ উৎপন্ন ় ় ় ় হওয়ার সাথে সাথে পারতত করে সরিনে বেওো হয়, োনত তা আিও ় ় ৈারিত হয়ে এমসনর্ পরিণত ো হয়। K Cr O + H SO 2 2 7 2 4 CH -CH -OH+[O] ⟶ CH -CHO+H O 3 2 3 এরান অযালকাইল হযালাইর্ (ইথাইল ক্লোরাইড) থেকে P যৌগ অর্থাৎ অযামসটালপ্র্হাইর্ প্তু ত করা যায়। ় ়"},{"label":"ঘ","question":"খাদয সংিক্ষর্ণ উদ্দীপকের Q যৌগেবিভবমর্কা বিশ্লেষণ কি।","answer":"উদ্দীপকের (ii) েং বিক্রিয়াে P (অযামসটালপ্র্হাইর্) বক K Cr O ও H SO এর উপমথরতনত ৈারিত করলে অযামসটিক এসিড বা 2 4 ি ় ় ইথানয়িক এসিড উৎপন্ন হয়। K Cr O + H SO 2 2 7 2 4 CH -CHO+[O] ⟶ CH -COOH 3 3 সু তিাং Q যৌগটি হলো অযামসটিক এসিড (CH COOH)। অযামসটি ক 3 এসিডের 4-10% জলীয় দ্রবণনক ভিনেগার বা মসিকা বলে, ো খাদয ্ ় সংিক্ষর্ণ যাপকরান য হবত হয়। খাদয পচনেি র্ূল কািণ ব্যাকটেরিয়া ও ছোনকি র্নতা অণুৈী। ্ ় ় এদের বৃদ্ধিি জন্য সাধারণত প্রায় রেির্পক্ষ pH প্নোৈে। ্ র র মিনেগানি উপমথত অযামসটিক এসিড জলীয় দ্রবণে আংমশক ি র + ় ় ় ় র নোরৈত হয়ে H আয়ন দেয়: − + CH COOH⇌CH COO +H 3 3 ﻿ + ় ় ় ় • এই H আয়ন খানদযি pH কমর্নে (প্রায় 4 এর রেনচ) অম্ল ীে পরিন শ ততরি করে। ় ় ্ ত • অম্ল ীে পরিবেশে ব্যাকটেরিয়া ও ছোক বৃদ্ধি থপনত ও ংশর তাি ় ় ় কিনত পানি ো; অনেক অণুৈীন ি বকাষীে এেৈাইর্ রেরকবে হয়ে র ্ যায়। • িনল খাদয দীঘডরদে পচে থেকে িক্ষা পায়। এ কারণে আচাি, চাটরে, সস, বকচাপ, র্াছ ও স রৈি সংিক্ষর্ণ ় ্ ্ ় ভিনেগার ব্যবহার করা হয়। ভিনেগার খানদয টক স্বাদও যোগ করে ় ্ ় এবং নির্দিষ্ট র্াযায় এটি স্ব ানথযি জন্য ক্ষরতকি েে। ় সু তিাং খাদয সংিক্ষর্ণ উদ্দীপকের Q যৌগ অর্থাৎ অযামসটিক এসিড (ভিনেগাবিভবূর্প) একটি রেিাপদ ও কােডকি প্প্ৈািনিটভর ছহনসন গুিুতপূর্ণ িমর্কা পালে করে।"}],"board":"র্াদ্াসা বোর্ড ২০২৬"},{"id":"ch11-cq24","chapter":11,"num":24,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: যৌগ সাধ্ারণ সংকেত N এর মান P C H 1 n 2n+2 Q C H CHO 1 n 2n+1 R C H COOH 1 n 2n+1 4 ়","subQuestions":[{"label":"ক","question":"প্তীক কাকে বলে?","answer":"প্িীক: কোনো মৌলের ইংনিরৈ বা লযাটি ে োনর্ি সংপ্ক্ষপ্ িূপনক ঐ র ত মৌলের প্তীক বলে। যেমন: হাইন বানৈনেি প্তীক H, বসাপ্র্োনর্ি র র প্তীক Na।"},{"label":"খ","question":"অযালকাইল র্ূলনকি যোজনী ব্যাখ্যা কি।","answer":"অ্যালকেন অণু থেকে একটি হাইরোজেন পরমাণু অপসািণ ় ় করলে বে মূলক পাওয়া যায় তানক অযালকাইল মূলক (C H -) n 2n+1 বলে। CH -H → CH - (মর্থাইল মূলক) 4 3 মর্র্থনেি কার্বনেি চািটি বোৈযতাই H দ্বারা পূর্ণ। একটি H ্ ্ অপসাির্ণি িনল কার্বনেি একটি বোৈযতা র্ুকব থাকে, ো দ্বারা 2 ্ ্ র্ূ লকটি অেয একটি পরমাণু বা র্ূলনকি সাথে একটি ন্ধে গঠে কিনত পানি। ু ্ বেনহত অযালকাইল র্ূলনক একটি র্ুকব বোৈযতা থাকে, তাই 2 2 7 অযালকাইল র্ূলনকি যোজনী 1।"},{"label":"গ","question":"R থেকে P এর প্তু রত সর্ীকিণসহ ব্যাখ্যা কি। 3 ়","answer":"উদ্দীপকে n = 1 হলে, • P = C H =CH (মিথেন) n 2n+2 4 • R = C H COOH=CH COOH (ইথানয়িক এসিড বা n 2n+1 3 অযামসটিক এসিড) R (CH COOH) থেকে P (CH ) প্তু রত দুই ধার্প সম্পন্ হয়। 3 4 র ় ় ধ্াপ-১: কসাততডযাম ইোনজযট প্রস্তুতি ় ় ইথানয়িক এসিক NaOH দ্রবণ দ্বারা প্শমর্ত করলে সোডিয়াম র র ় ় ইথােনেট ও পানি উৎপন্ন হয়। CH COOH+NaOH→CH COONa+H O 3 3 2 টাইপ ভিততিক মাস্ট ার সাজেশন ধ্াপ-২: ততডকাবক্সিজেশন ্ ় ় শুষ্ক সোডিয়াম ইথােনেটনক বসার্ালাইর্ (NaOH + CaO) সহ উকপ্ করলে কা ডক্সিল মূলক অপসারিত হয়ে মিথেন গ্যাস উৎপন্ন হয়। এখানে CaO পাজনক NaOH এর ক্ষে থেকে িক্ষা করে ও মর্শ্ণনক ্ ্ শুষ্ক িার্খ। CaO, তাপ CH COONa+NaOH ⟶ CH +Na CO 3 4 এরান R (ইথানয়িক এসিড) থেকে P (মিথেন) প্তু ত করা যায়।"},{"label":"ঘ","question":"P থেকে Q এর সর্র্গােীে বশ্রণি যৌগ উৎপন্ন করে, উৎপন্ন 3 যৌগটভর ব্যবহারিক প্নোগ বিশ্লেষণ কি। র ্","answer":"n = 1 হলে Q = C H CHO=CH CHO (ইথােযাল বা n 2n+1 3 অযামসটালপ্র্হাইর্), ো অযালপ্র্হাইর্ সর্র্গােীে বশ্রণি সদসয। P হলো মিথেন (CH )। 4 মিথেন ও অক্সিজেনের মর্শ্ণনক উচ্চ চার্প (100 atm) ও 400°C তাপর্াযায় র্লল নর্োর্ অক্সাইড প্রবণতা নকি উপমথরতনত চালো করলে মিথেন ৈারিত হয়ে মর্থােযাল (ভরর্ালপ্র্হাইর্) উৎপন্ন হয়। MoO, 400°C, 100 atm 3 CH +O ⟶ HCHO+H O 4 2 উৎপন্ন HCHO (মর্থােযাল) অযালপ্র্হাইর্ বশ্রণি প্থর্ সদসয, অর্থাৎ র র এটি Q (CH CHO) এর সর্র্গােীে যৌগ। 3 ন ় উৎপন্ন যৌগের (HCHO) বযবহাররক প্জযাগ ১. ভরর্ালপ্র্হাইনর্ি 40% জলীয় দ্রবণনক ভরর্াললে বলে। ভরর্াললে জীবাণুোশক ছহনসন এবং ৈী র জ্ঞাে গন ষণাগানি ্ ় প্াণী ও উলিনদি ের্ুো সংিক্ষর্ণ য হবত হয়। ২. র্ৃ তনদহ সংিক্ষর্ণ ভরর্াললে ব্যবহার করা হয়। ৩. বিেনলি সাথে বিক্রিয়া করে ব নকলাইট প্ াসস ি ক এবং ইউরিয়াি ় ় সাথে বিক্রিয়া করে ইউরিয়া-ভরর্ালপ্র্হাইর্ বিরৈে প্তু হয়। ৪. চার্ড় বা টযারেং, িং ও র ভিন্ন রাসায়নিক দ্ য ততরিনত এটি য হব ত হয়। তন ভরর্াললে র ষাকব। র্াছ, িল, দুধ ইতযারদ খাদয সংিক্ষর্ণ ভরর্াললে ব্যবহার করলে তা মান নদনহ কযান্সাি, ললিাি ও রকমরেি ক্ষরতসহ যায়া বিাগ সৃটটি করে। তাই খানদয এর ব্যবহার রেরষদধ ও দণ্ডেীে অপিাধ। সু তিাং P থেকে উৎপন্ন মর্থােযাল মশল্ ও চচরকৎসা থক্ষতরে অতযন্ গুিুতপূর্ণ, তন এর অপ ব্যবহার স্বানথযি জন্য র্ািাতমক ক্ষরতকি। ব ি পলেমার, প্াসসি ্ক ও বেব-অদেব যৌগের পায়কয"}],"board":"রাজশাহী বোর্ড ২০২৬"},{"id":"ch11-cq25","chapter":11,"num":25,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: X পলেরেজনর মজনামার Y প্াকৃ রতক গ্যাসের র্ূল উপাদান","subQuestions":[{"label":"ক","question":"অযালরকে কাকে বলে? [৬ বোর্ডে এনসনছ]","answer":"কার্বন-কার্বন ছদ ন্ধে (C=C) র মশটট অসম্পৃকব হাইন বাকা ডজনক অযােরকন (Alkene) বলে। এর সাধারণ সংনকত C H। যেমন: n 2n ইরথে (CH =CH )। 2 2 ﻿"},{"label":"খ","question":"পললর্ািকিণ বিক্রিয়া ব্যাখ্যা কি।","answer":"উচ্চ চাপ ও তার্প (প্নোৈনে প্রবণতা নকি উপমথরতনত) একই র র ্ ় যৌগের অসংখয ক্ষু দ্ অণু (র্নোর্াি) পিস্পি েুকব হয়ে ৃহৎ আণর ক ় ভরর মশটট েতে যৌগ (পললর্াি) গঠনেি বিক্রিয়ানক পলেমারকরণ রবভতর্ ব যা (Polymerization) বলে। যেমন: সামানয O এর উপমথরতনত 1000 atm চার্প ও 200°C 2 ি ় ্ ় তাপর্াযায় অসংখয ইরথে অণু েুকব হয়ে পললরথে গঠে করে। 2 3 1000 atm, 200°C, সামানয O 2 nCH =CH ⟶ [-CH -CH -] 2 2 ইরথে (র্নোর্াি) → পললরথে (পললর্াি) 2 2 n"},{"label":"গ","question":"উদ্দীপকের \"X\" যৌগটি ব রামর্নেি দ্রবণনক বর্ণহীন করে– ব্যাখ্যা ্ র কি। [২ বোর্ডে এনসনছ]","answer":"X শনািবকরণ পললরথে ততরি হয় ইরথে থেকে, তাই পললরথনেি র্নোর্াি X = ইরেন (C H ), CH =CH। 2 4 2 2 ় বযাখ্যা ইরথে একটি অসম্পৃকব হাইন হাইরোকার্বন, কািণ এর দুই কার্বনেি মধ্যে 2 ্ ্ ্ ্ ড ্ ্ ্ একটি ছদ ন্ধে আনছ। ছদ ববন্ধনের একটি ন্ধে (পাই ন্ধে) দু ডল, তাই ় ু ্ এটি সহজেই বিনে যায় এবং দুই কার্বনে েতে পরমাণু েুকব হনত পানি (সংনোৈে বিক্রিয়া)। ব রামর্ে দ্রবণ লাল বা লালনচ াদামর্ বর্ণি। ইরথজনক এই দ্রবণে ্ র র ্ ্ ্ ় চালো করলে ব রামর্ে অণু ছদ বন্ধনে েুকব হয়ে বর্ণহীন 1,2- ্ ় র্াইতর রানর্াইর্থে উৎপন্ন করে। দ্রবণে আি র্ুকব Br ো থাকাে লাল ্ র 2 ় ় ় ণড দি হয়ে দ্রবণ বর্ণহীন হয়ে যায়। ূ র CH =CH +Br →CH Br-CH Br 2 2 2 2 2 ইরথে + ব রামর্ে (লাল) → 1,2-র্াইতর রানর্াইর্থে ( বর্ণহীন) ্ ্ ত করা ্ ় • সম্পৃ কব অ্যালকেন (যেমন ইর্থে) সাধারণ অবস্থাে ব রামর্ে দ্রবণেি ি ্ র ্ ্ ্ ণড েটট করে ো। তাই এই পিীক্ষা দ্বারা অসম্পৃকবতা শোকব করা হয়। ্ ত ্ ড ্ ্ ্ ্ ভসবধান্: X (ইরথে) ছদ ন্ধেেুকব অসম্পৃকব যৌগ বলে ব রামর্নেি সাথে ্ ্ সংনোৈে বিক্রিয়া করে ব রামর্ে দ্রবণনক বর্ণহীন করে। ্ র"},{"label":"ঘ","question":"উদ্দীপকের \"Y\" যৌগ থেকে CCl প্তু ত সম্ – বিশ্লেষণ কি। [৬ 4 র বোর্ডে এনসনছ]","answer":"Y শনািবকরণ প্াকৃ রতক গ্যাসের র্ূল উপাদান Y = মিথেন (CH )। র 4 বযাখ্যা ্ ় ় মিথেন সম্পৃকব যৌগ, তাই এটি সংনোৈে বিক্রিয়া দেয় ো, রকুন্ অরতন গুরে িশ্মল (UV) বা র্ৃদু সূেডানলানক ব্ারিনেি সাথে প্রিস্াপন ল র ় ় রবভতর্ ব যা দেয়। প্রতটি ধার্প মর্র্থনেি একটি H পরমাণু একটি Cl ্ ় ় ্ পরমাণু দ্বারা প্রতথামপত হয় এবং HCl উৎপন্ন হয়। পেডাপ
