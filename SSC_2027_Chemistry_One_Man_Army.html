SO₄→(NH₄)₂SO₄ ; A = (NH₄)₂SO₄ (অ্যামোনিয়াম\nসালফেট) (i) সঠিক: আণবিক ভর =2(14+4)+32+4×16=36+ 32+64=132। (ii) সঠিক: এতে N ও S দুটোই আছে, উদ্ভিদ এ থেকে নাইট্রোজেন ও সালফার গ্রহণ করে। (iii) সঠিক: এটি অম্লধর্মী সার, তাই ক্ষারীয় মাটিতে (pH \u003e 7) ব্যবহার করা হয়।"},{"id":"ch9-mcq32","chapter":9,"num":32,"importance":2,"topic":"পানি","question":"নিচের কোনটির কারণে পানির স্থায়ী খরতা হয়?","boards":"দিনাজপুর বোর্ড ২০২৪","options":["Ca(HCO₃)₂","CaSO₄","Mg(HCO₃)₂","Al(NO₃)₃"],"answerIndex":1,"explanation":"স্থায়ী খরতার জন্য দায়ী Ca, Mg, Fe এর ক্লোরাইড ও সালফেট লবণ — তাই CaSO₄। Ca(HCO₃)₂ ও Mg(HCO₃)₂ বাইকার্বনেট লবণ, এরা অস্থায়ী খরতা সৃষ্টি করে।"},{"id":"ch10-mcq1","chapter":10,"num":1,"importance":3,"topic":"খনিজ সম্পদ","question":"ভূ-ত্বকে সিলিকনের শতকরা পরিমাণ কত?","boards":"কুমিল্লা বোর্ড ২০২৪; দিনাজপুর বোর্ড ২০২৪; ময়মনসিংহ বোর্ড ২০২৪","options":["3","4","27","46"],"answerIndex":2,"explanation":"পাঠ্যবইয়ের পাই চার্ট অনুযায়ী ভূত্বকে অক্সিজেন 46%, সিলিকন 27%, অ্যালুমিনিয়াম 8.4%। অতএব সিলিকনের শতকরা পরিমাণ 27%। সঠিক উত্তর (গ)।"},{"id":"ch10-mcq2","chapter":10,"num":2,"importance":2,"topic":"খনিজ সম্পদ","stemPrefix":"মৌল | বৈশিষ্ট্য; X | প্রোটন সংখ্যা ২৯; Y | পারমাণবিক সংখ্যা ৯; Z | এটি একটি ধাতু যেটি মরিচা গঠন করে","question":"উদ্দীপকের X এর আকরিক হলো—","boards":"সিলেট বোর্ড ২০২৫","options":["লিমোনাইট","গ্যালেনা","সিন্নাবার","চালকোসাইট"],"answerIndex":3,"explanation":"প্রোটন সংখ্যা 29 মানে পারমাণবিক সংখ্যা 29, অর্থাৎ X = কপার (Cu)। কপারের প্রধান আকরিক চালকোসাইট (Cu₂S)। লিমোনাইট আয়রনের, গ্যালেনা লেডের এবং সিন্নাবার মার্কারির আকরিক ।"},{"id":"ch10-mcq3","chapter":10,"num":3,"importance":2,"topic":"খনিজ সম্পদ","question":"নেত্রকোণার বিজয়পুরে কোনটি পাওয়া যায়?","boards":"চট্টগ্রাম বোর্ড ২০২৪","options":["কেওলিন","জিরকন","বক্সাইট","সিন্নাবার"],"answerIndex":0,"explanation":"নেত্রকোনার বিজয়পুরে ভূপৃষ্ঠেই সাদা মাটি বা কেওলিন খনিজ পাওয়া যায়। জিরকন পাওয়া যায় কক্সবাজারের সমুদ্রের বালিতে; সিন্নাবার মার্কারির আকরিক ।"},{"id":"ch10-mcq4","chapter":10,"num":4,"importance":3,"topic":"ধাতু নিষ্কাশন","question":"সিন্নাবার কোন ধাতুর আকরিক?","boards":"সিলেট বোর্ড ২০২৪; দিনাজপুর বোর্ড ২০২৪","options":["মার্কারি","কপার","জিংক","লেড"],"answerIndex":0,"explanation":"সিন্নাবার হলো মার্কারির সালফাইড আকরিক, সংকেত HgS। কপারের আকরিক চালকোসাইট (Cu₂S), জিংকের ক্যালামাইন (ZnCO₃), লেডের গ্যালেনা (PbS)।"},{"id":"ch10-mcq5","chapter":10,"num":5,"importance":2,"topic":"ধাতু নিষ্কাশন","question":"আয়রনের আকরিক কোনটি?","boards":"চট্টগ্রাম বোর্ড ২০২৫","options":["গ্যালেনা","বক্সাইট","লিমোনাইট","ক্যালামাইন"],"answerIndex":2,"explanation":"লিমোনাইট (Fe₂O₃.3H₂O) আয়রনের আকরিক । আয়রনের অন্য আকরিক হলো ম্যাগনেটাইট (Fe₃O₄) ও হেমাটাইট (Fe₂O₃)। গ্যালেনা (PbS) লেডের, বক্সাইট (Al₂O₃.2H₂O) অ্যালুমিনিয়ামের এবং ক্যালামাইন (ZnCO₃) জিংকের আকরিক। তাই উত্তর গ) লিমোনাইট।"},{"id":"ch10-mcq6","chapter":10,"num":6,"importance":2,"topic":"ধাতু নিষ্কাশন","question":"বক্সাইট কোন ধাতুর আকাধিক?","boards":"কুমিল্লা বোর্ড ২০২৫","options":["Al","Fe","Zn","Pb"],"answerIndex":0,"explanation":"বক্সাইট অ্যালুমিনিয়ামের প্রধান আকরিক, এর সংকেত Al₂O₃.2H₂O। এ থেকে প্রাপ্ত Al₂O₃ কে ক্রায়োলাইটের সাথে গলিয়ে তড়িৎ বিশ্লেষণে Al নিষ্কাশন করা হয়। Fe এর আকরিক হেমাটাইট, Zn এর ক্যালামাইন, Pb এর গ্যালেনা। তাই উত্তর ক) Al।"},{"id":"ch10-mcq7","chapter":10,"num":7,"importance":2,"topic":"ধাতু নিষ্কাশন","question":"'29' পারমাণবিক সংখ্যাবিশিষ্ট মৌলের আকরিক কোনটি?","boards":"দিনাজপুর বোর্ড ২০২৫","options":["সিন্নাবার","বক্সাইট","লিমোনাইট","চালকোসাইট"],"answerIndex":3,"explanation":"পারমাণবিক সংখ্যা 29 বিশিষ্ট মৌল কপার (Cu)। কপারের আকরিক চালকোসাইট (Cu₂S) ও কপার পাইরাইট (CuFeS₂)। সিন্নাবার (HgS) মারকারির, বক্সাইট অ্যালুমিনিয়ামের এবং লিমোনাইট আয়রনের আকরিক । তাই উত্তর ঘ) চালকোসাইট।"},{"id":"ch10-mcq8","chapter":10,"num":8,"importance":2,"topic":"ধাতু নিষ্কাশন","question":"স্ব-বিজারণ পদ্ধতিতে কোনটি নিষ্কাশন করা যায়?","boards":"চট্টগ্রাম বোর্ড ২০২৫","options":["মারকারি","আয়রন","ম্যাগনেসিয়াম","অ্যালুমিনিয়াম"],"answerIndex":0,"explanation":"সক্রিয়তা সিরিজের নিচের দিকের কম সক্রিয় ধাতু (Cu, Hg, Ag) স্ববিজারণ পদ্ধতিতে নিষ্কাশন করা হয়। এতে সালফাইড আকরিককে বাতাসে উত্তপ্ত করলে আকরিক নিজেই বিজারিত হয়ে ধাতু দেয়।\nতাপ\nHgS+O₂⟶Hg+SO₂\nআয়রন কার্বন বিজারণে এবং Mg ও Al তড়িৎ বিশ্লেষণে নিষ্কাশিত হয়। তাই উত্তর ক) মারকারি।"},{"id":"ch10-mcq9","chapter":10,"num":9,"importance":2,"topic":"ধাতু নিষ্কাশন","question":"ধাতু নিষ্কাশনে তড়িৎ বিশ্লেষণের মাধ্যমে বিজারণ ঘটানো হয় কোনটিতে?","boards":"ময়মনসিংহ বোর্ড ২০২৫","options":["Zn","Ca","Pb","Cu"],"answerIndex":1,"explanation":"সক্রিয়তা সিরিজের উপরের দিকের বেশি সক্রিয় ধাতু (K, Na, Ca, Mg, Al) কার্বন দিয়ে বিজারিত হয় না, তাই এদের গলিত যৌগের তড়িৎ বিশ্লেষণে বিজারণ ঘটানো হয়। Zn ও Pb কার্বন বিজারণে এবং Cu স্ববিজারণে নিষ্কাশিত হয়। তাই উত্তর খ) Ca।"},{"id":"ch10-mcq10","chapter":10,"num":10,"importance":2,"topic":"ধাতু নিষ্কাশন","question":"সোডিয়াম ক্লোরাইড 40-42% এবং ক্যালসিয়াম ক্লোরাইড 58-60% মিশ্রণের গলনাঙ্ক কত?","boards":"ঢাকা বোর্ড ২০২৫","options":["801° C","600°C","400°C","363°C"],"answerIndex":1,"explanation":"বিশুদ্ধ NaCl এর গলনাঙ্ক 801°C, এত উচ্চ তাপমাত্রায় গলাতে খরচ বেশি। তাই 40-42% NaCl এর সাথে 58-60% CaCl₂ মিশিয়ে নেওয়া হয়; এ মিশ্রণের গলনাঙ্ক কমে প্রায় 600°C হয়, ফলে কম খরচে তড়িৎ বিশ্লেষণে সোডিয়াম নিষ্কাশন করা যায়। উত্তর খ) 600°C।"},{"id":"ch10-mcq11","chapter":10,"num":11,"importance":2,"topic":"ধাতু নিষ্কাশন","stemPrefix":"একটি সংকর ধাতু অলংকার, কলকব্জার বিয়ারিং, বৈদ্যুতিক সুইচ, দরজার হাতল, ডেকচি পাতিল ইত্যাদি তৈরিতে ব্যবহার করা হয়।","question":"উদ্দীপকের সংকর ধাতুর প্রধান উপাদান নিষ্কাশনের সময় উপজাত গ্যাস কোনটি?","boards":"ময়মনসিংহ বোর্ড ২০২৫","options":["CO₂","SO₂","NO₂","Cl₂"],"answerIndex":1,"explanation":"উদ্দীপকের সংকর ধাতু পিতল, এর প্রধান উপাদান কপার (65%)। কপার কম সক্রিয় ধাতু বলে চালকোসাইট (Cu₂S) থেকে স্ববিজারণ পদ্ধতিতে নিষ্কাশিত হয়।\nতাপ\n2Cu₂S+3O₂⟶2Cu₂O+2SO₂\nতাপ\n2Cu₂O+Cu₂S⟶6Cu+SO₂\nউভয় ধাপে উপজাত হিসেবে SO₂ গ্যাস তৈরি হয়। তাই উত্তর খ) SO₂।"},{"id":"ch10-mcq12","chapter":10,"num":12,"importance":2,"topic":"ধাতু নিষ্কাশন","question":"চালকোসাইট কোন ধাতুর আকরিক?","boards":"ঢাকা বোর্ড ২০২৫","options":["ক্যালসিয়াম","কপার","আয়রন","জিংক"],"answerIndex":1,"explanation":"চালকোসাইট (Cu₂S) কপার ধাতুর আকরিক ।\nক্যালসিয়ামের আকরিক চুনাপাথর (CaCO₃), আয়রনের হেমাটাইট/ম্যাগনেটাইট, জিংকের ক্যালামাইন (ZnCO₃)।"},{"id":"ch10-mcq13","chapter":10,"num":13,"importance":2,"topic":"ধাতু নিষ্কাশন","question":"কোনটি লোহার আকরিক?","boards":"যশোর বোর্ড ২০২৫","options":["হেমাটাইট","সিন্নাবার","ক্যালামাইন","চালকোসাইট"],"answerIndex":0,"explanation":"হেমাটাইট (Fe₂O₃) লোহার প্রধান আকরিক; বাত্যাচুল্লিতে এ থেকে লোহা নিষ্কাশন করা হয়। সিন্নাবার মার্কারির, ক্যালামাইন জিংকের এবং চালকোসাইট কপারের আকরিক ।"},{"id":"ch10-mcq14","chapter":10,"num":14,"importance":3,"topic":"নির্বাচিত সংকর ধাতু","question":"ডুরালমিন এ কপারের শতকরা সংযুক্তি কত?","boards":"যশোর বোর্ড ২০২০; দিনাজপুর বোর্ড ২০২০","options":["65%","12.5%","8.33%","4%"],"answerIndex":3,"explanation":"ডুরালমিনের উপাদান: অ্যালুমিনিয়াম 95%, কপার 4%, ম্যাগনেসিয়াম, ম্যাঙ্গানিজ ও লোহা মিলে 1%। তাই ডুরালমিনে কপারের সংযুক্তি 4%।"},{"id":"ch10-mcq15","chapter":10,"num":15,"importance":2,"topic":"নির্বাচিত সংকর ধাতু","question":"ডুরালুমিনে কী পরিমাণ Cu থাকে?","boards":"সিলেট বোর্ড ২০২৫","options":["4%","8.33%","65%","90%"],"answerIndex":0,"explanation":"ডুরালমিন অ্যালুমিনিয়ামের সংকর ধাতু। এতে অ্যালুমিনিয়াম 95%, কপার 4% এবং ম্যাগনেসিয়াম, ম্যাঙ্গানিজ ও লোহা মিলে 1% থাকে। তাই ডুরালমিনে কপার থাকে ক) 4%।"},{"id":"ch10-mcq16","chapter":10,"num":16,"importance":2,"topic":"নির্বাচিত সংকর ধাতু","question":"ডুরালুমিনে নিচের কোন ধাতুটি থাকে না?","boards":"রাজশাহী বোর্ড ২০২৫","options":["Al","Cu","Mn","Cr"],"answerIndex":3,"explanation":"ডুরালমিনের উপাদান: অ্যালুমিনিয়াম 95%, কপার 4% এবং ম্যাগনেসিয়াম, ম্যাঙ্গানিজ ও লোহা 1%। এখানে Al, Cu ও Mn আছে, কিন্তু ক্রোমিয়াম নেই (Cr থাকে স্টেইনলেস স্টিলে)। তাই উত্তর ঘ) Cr।"},{"id":"ch10-mcq17","chapter":10,"num":17,"importance":2,"topic":"নির্বাচিত সংকর ধাতু","question":"ডুরালুমিন কোন ধাতুর সংকর?","boards":"দিনাজপুর বোর্ড ২০২৫","options":["Ca","Al","Ni","Zn"],"answerIndex":1,"explanation":"ডুরালমিনে অ্যালুমিনিয়াম থাকে 95%, তাই প্রধান ধাতু Al। প্রধান ধাতুর নাম অনুসারে ডুরালমিনকে অ্যালুমিনিয়ামের সংকর ধাতু বলা হয়। বাকি অংশে কপার 4% এবং ম্যাগনেসিয়াম, ম্যাঙ্গানিজ ও লোহা 1%। এটি হালকা ও মজবুত বলে উড়োজাহাজের বডি তৈরিতে ব্যবহৃত হয়। উত্তর খ) Al।"},{"id":"ch10-mcq18","chapter":10,"num":18,"importance":2,"topic":"নির্বাচিত সংকর ধাতু","stemPrefix":"একটি সংকর ধাতু অলংকার, কলকব্জার বিয়ারিং, বৈদ্যুতিক সুইচ, দরজার হাতল, ডেকচি পাতিল ইত্যাদি তৈরিতে ব্যবহার করা হয়।","question":"উদ্দীপকের ধাতু সংকরের নাম কী?","boards":"ময়মনসিংহ বোর্ড ২০২৫","options":["কাঁসা","পিতল","স্টিল","ডুরালুমিন"],"answerIndex":1,"explanation":"অলংকার, কলকব্জার বিয়ারিং, বৈদ্যুতিক সুইচ, দরজার হাতল, ডেকচি পাতিল ইত্যাদি তৈরিতে পিতল (ব্রাস) ব্যবহৃত হয়। পিতলে কপার 65% ও জিংক 35% থাকে। কাঁসা দিয়ে থালা, গ্লাস; স্টিল দিয়ে রেললাইন, ছুরি; ডুরালমিন দিয়ে উড়োজাহাজের বডি তৈরি হয়। তাই উত্তর খ) পিতল।"},{"id":"ch10-mcq19","chapter":10,"num":19,"importance":2,"topic":"নির্বাচিত সংকর ধাতু","question":"কোনটি দ্বারা বৈদ্যুতিক তার তৈরি করা হয়?","boards":"বরিশাল বোর্ড ২০২৫","options":["Na","Cu","Mg","Ca"],"answerIndex":1,"explanation":"কপার (Cu) বিদ্যুতের অত্যন্ত ভালো পরিবাহী, নমনীয় ও প্রসারণশীল — সহজে সরু তারে পরিণত করা যায়। তাই বৈদ্যুতিক তার কপার দিয়ে তৈরি হয়। Na ও Ca পানির সাথে তীব্রভাবে বিক্রিয়া করে, আর Mg তারের জন্য উপযোগী নয়।"},{"id":"ch10-mcq20","chapter":10,"num":20,"importance":2,"topic":"নির্বাচিত সংকর ধাতু","question":"মরিচাহীন ইস্পাতে ক্রোমিয়ামের শতকরা পরিমাণ কত?","boards":"বরিশাল বোর্ড ২০২৪","options":["8%","8.33%","18%","74%"],"answerIndex":2,"explanation":"মরিচাহীন ইস্পাত (স্টেইনলেস স্টিল) এর উপাদান: লোহা 74%, ক্রোমিয়াম 18%, নিকেল 8%। তাই এতে ক্রোমিয়ামের শতকরা পরিমাণ 18%। ক্রোমিয়ামই ইস্পাতকে মরিচা থেকে রক্ষা করে।"},{"id":"ch10-mcq21","chapter":10,"num":21,"importance":2,"topic":"নির্বাচিত সংকর ধাতু","question":"পিতলে কপারের সংযুক্তি কত?","boards":"ঢাকা বোর্ড ২০২৪","options":["35%","65%","74%","90%"],"answerIndex":1,"explanation":"পিতল (ব্রাস) কপার ও জিংকের সংকর ধাতু।\nএতে কপার 65% ও জিংক 35% থাকে; কপার প্রধান ধাতু, তাই পিতল কপারের সংকর ধাতু।"},{"id":"ch10-mcq22","chapter":10,"num":22,"importance":2,"topic":"নির্বাচিত সংকর ধাতু","question":"21 ক্যারেট স্বর্ণে কত ভাগ স্বর্ণ থাকে?","boards":"ময়মনসিংহ বোর্ড ২০২৪","options":["83.33%","87.5%","91.67%","95.13%"],"answerIndex":1,"explanation":"স্বর্ণের শতকরা পরিমাণ = (ক্যারেট ÷ 24) × 100% 21 ক্যারেট স্বর্ণে স্বর্ণ =(21÷24)×100%=87.5%; বাকি 12.5% কপার ও অন্যান্য ধাতু।"},{"id":"ch10-mcq23","chapter":10,"num":23,"importance":2,"topic":"কতিপয় ধাতু এবং সংকর ধাতুর ক্ষয় হওয়ার লক্ষণ, কারণ ও প্রতিকার","question":"কোনটি দ্বারা গ্যালভানাইজিং করা হয়?","boards":"দিনাজপুর বোর্ড ২০২৫","options":["Cu","Zn","Hg","Ag"],"answerIndex":1,"explanation":"কোনো ধাতুর (সাধারণত লোহার) উপর জিংক (Zn) এর প্রলেপ দেওয়াকে গ্যালভানাইজিং বলে। এতে তড়িৎ বিশ্লেষণের প্রয়োজন হয় না। Cu, Ag ইত্যাদির প্রলেপ দেওয়া হয় ইলেকট্রোপ্লেটিং পদ্ধতিতে ।"},{"id":"ch10-mcq24","chapter":10,"num":24,"importance":2,"topic":"কতিপয় ধাতু এবং সংকর ধাতুর ক্ষয় হওয়ার লক্ষণ, কারণ ও প্রতিকার","question":"মরিচার সংকেত কোনটি?","boards":"ঢাকা বোর্ড ২০২০","options":["Fe₂O.nH₂O","Fe₂O₃.H₂O","Fe₂O₃.nH₂O","FeO₃.nH₂O"],"answerIndex":2,"explanation":"লোহা বায়ুর O₂ ও পানির সাথে বিক্রিয়া করে আর্দ্র ফেরিক অক্সাইড তৈরি করে, এটিই মরিচা।\n4Fe+3O₂+6H₂O→4Fe(OH)₃\n2Fe(OH)₃→Fe₂O₃.3H₂O\nপানির অণুর সংখ্যা নির্দিষ্ট নয় বলে মরিচার সংকেত Fe₂O₃.nH₂O লেখা হয়।"},{"id":"ch10-mcq25","chapter":10,"num":25,"importance":2,"topic":"কতিপয় ধাতু এবং সংকর ধাতুর ক্ষয় হওয়ার লক্ষণ, কারণ ও প্রতিকার","question":"ইউরোপে ব্যবহৃত অ্যালুমিনিয়ামের শতকরা কত ভাগ পুনঃপ্রক্রিয়াজাতকৃত?","boards":"রাজশাহী বোর্ড ২০২০","options":["21%","28%","60%","74%"],"answerIndex":2,"explanation":"ইউরোপে যে অ্যালুমিনিয়াম ব্যবহৃত হয় তার 60% পুনঃপ্রক্রিয়াজাতকরণের মাধ্যমে তৈরি হয়। আর আমেরিকায় ব্যবহৃত কপারের প্রায় 21% পুনঃপ্রক্রিয়াজাত ।"},{"id":"ch10-mcq26","chapter":10,"num":26,"importance":3,"topic":"খনিজ অধাতু","question":"অলিয়ামের সংকেত কোনটি?","boards":"কুমিল্লা বোর্ড ২০২৪; চট্টগ্রাম বোর্ড ২০২৪","options":["Na₃AlF₆","H₂S₂O₇","Ca(OCl)Cl","CaCO₃"],"answerIndex":1,"explanation":"ধূমায়মান সালফিউরিক এসিডকে অলিয়াম বলে, এর সংকেত H₂S₂O₇। স্পর্শ পদ্ধতিতে SO₃ কে গাঢ় H₂SO₄ এ শোষণ করালে অলিয়াম তৈরি\nহয়: H₂SO₄+SO₃→H₂S₂O₇।\nNa₃AlF₆ ক্রায়োলাইট, Ca(OCl)Cl ব্লিচিং পাউডার, CaCO₃ চুনাপাথর ।"},{"id":"ch10-mcq27","chapter":10,"num":27,"importance":2,"topic":"খনিজ অধাতু","question":"'সুপার হিটেড ওয়াটার' এর সর্বোচ্চ তাপমাত্রা কত?","boards":"রাজশাহী বোর্ড ২০২৫","options":["100°C","270°C","340°C","374°C"],"answerIndex":3,"explanation":"অতিরিক্ত চাপে 100°C থেকে 374°C তাপমাত্রার মধ্যবর্তী পানিকে সুপার হিটেড ওয়াটার বলে। তাই সুপার হিটেড ওয়াটারের সর্বোচ্চ তাপমাত্রা 374°C।"},{"id":"ch10-mcq28","chapter":10,"num":28,"importance":2,"topic":"খনিজ অধাতু","question":"কোনটিকে রাসায়নিক দ্রব্যের রাজা বলা হয়?","boards":"কুমিল্লা বোর্ড ২০২৫","options":["HNO₃","H₂SO₄","H₂CO₃","HCl"],"answerIndex":1,"explanation":"অন্যান্য রাসায়নিক দ্রব্যের চেয়ে সালফিউরিক এসিড (H₂SO₄) সবচেয়ে বেশি ব্যবহৃত হয়— রাসায়নিক দ্রব্য, রঞ্জক, সাবান-ডিটারজেন্ট, সার, প্লাস্টিক ইত্যাদি তৈরিতে। এজন্য H₂SO₄ কে রাসায়নিক দ্রব্যের রাজা বলা হয়।"},{"id":"ch10-mcq29","chapter":10,"num":29,"importance":2,"topic":"খনিজ অধাতু","stemPrefix":"H₂S₂O₇+H₂O→′A′","question":"'A' যৌগটির নাম কী?","boards":"বরিশাল বোর্ড ২০২৫","options":["সালফিউরিক এসিড","সালফিউরাস এসিড","অলিয়াম","অক্সালিক এসিড"],"answerIndex":0,"explanation":"অলিয়াম (H₂S₂O₇) পানির সাথে বিক্রিয়া করে সালফিউরিক এসিড উৎপন্ন করে।\nH₂S₂O₇+H₂O→2H₂SO₄; অর্থাৎ A = H₂SO₄ (সালফিউরিক\nএসিড)।"},{"id":"ch10-mcq30","chapter":10,"num":30,"importance":2,"topic":"খনিজ অধাতু","stemPrefix":"H₂S₂O₇+H₂O→′A′","question":"লঘু A—\ni. এর জারণ ধর্ম নেই\nii. Cu এর সাথে বিক্রিয়া করে\niii. এর নিরুদন ধর্ম নেই\nনিচের কোনটি সঠিক?","boards":"বরিশাল বোর্ড ২০২৫","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":1,"explanation":"A = H₂SO₄। লঘু H₂SO₄ এ অনেক বেশি পানি থাকে।\ni. সঠিক — লঘু H₂SO₄ এর জারণ ধর্ম নেই।\nii. ভুল— Cu কে জারিত করে কেবল গাঢ় H₂SO₄; লঘু H₂SO₄ Cu এর সাথে বিক্রিয়া করে না।\niii. সঠিক — লঘু H₂SO₄ এর নিরুদন ধর্ম নেই।"},{"id":"ch11-mcq1","chapter":11,"num":1,"importance":3,"topic":"জীবাশ্ম জ্বালানি: প্রাকৃতিক গ্যাস ও পেট্রোলিয়াম","question":"পেট্রোলিয়াম কেরোসিনের শতকরা পরিমাণ কত?","boards":"কুমিল্লা বোর্ড ২০২৫; ঢাকা বোর্ড ২০২২; বরিশাল বোর্ড ২০২১","options":["5","10","13","17"],"answerIndex":2,"explanation":"পেট্রোলিয়ামে কেরোসিন থাকে শতকরা 13 ভাগ (121°C – 170°C অংশ)। 5% পেট্রোলের, 10% ন্যাপথার পরিমাণ; 17 কোনো অংশের পরিমাণ নয়, এটি ডিজেলের কার্বন সংখ্যার শুরু। তাই উত্তর গ) 13।"},{"id":"ch11-mcq2","chapter":11,"num":2,"importance":3,"topic":"জীবাশ্ম জ্বালানি: প্রাকৃতিক গ্যাস ও পেট্রোলিয়াম","question":"পেট্রোলিয়ামে শতকরা কতভাগ গ্যাসোলিন থাকে?","boards":"রাজশাহী বোর্ড ২০২৩; সিলেট বোর্ড ২০২৩; বরিশাল বোর্ড ২০২০","options":["2","5","10","13"],"answerIndex":1,"explanation":"পেট্রোল ও গ্যাসোলিন একই জিনিস; পেট্রোলিয়ামে এর পরিমাণ শতকরা 5 ভাগ। 2% পেট্রোলিয়াম গ্যাসের, 10% ন্যাপথার, 13% কেরোসিনের পরিমাণ। তাই উত্তর খ) 5।"},{"id":"ch11-mcq3","chapter":11,"num":3,"importance":3,"topic":"জীবাশ্ম জ্বালানি: প্রাকৃতিক গ্যাস ও পেট্রোলিয়াম","question":"গ্যাসোলিনে কার্বন পরমাণুর সংখ্যা –","boards":"দিনাজপুর বোর্ড ২০২৪; চট্টগ্রাম বোর্ড ২০২২","options":["1–5","5–10","10–15","15–20"],"answerIndex":1,"explanation":"পেট্রোলিয়ামের আংশিক পাতনে 21°C – 70°C তাপমাত্রায় পেট্রোল বা গ্যাসোলিন পৃথক হয়। এ অংশের হাইড্রোকার্বনগুলোর অণুতে কার্বন সংখ্যা 5 থেকে 10,\nযেমন: পেন্টেন (C₅H₁₂), অকটেন (C₈H₁₈)।\nপেট্রোলিয়াম গ্যাসে 1 – 4, ন্যাপথায় 7 – 14, কেরোসিনে 11 – 16 এবং ডিজেলে 17 – 20টি কার্বন থাকে। তাই উত্তর খ) 5–10।"},{"id":"ch11-mcq4","chapter":11,"num":4,"importance":3,"topic":"জীবাশ্ম জ্বালানি: প্রাকৃতিক গ্যাস ও পেট্রোলিয়াম","question":"কোনটি ন্যাপথায় কার্বন সংখ্যার সীমা?","boards":"রাজশাহী বোর্ড ২০২৪; দিনাজপুর বোর্ড ২০২০","options":["5 – 10","7 – 14","11 – 16","17 – 20"],"answerIndex":1,"explanation":"ন্যাপথা পৃথক হয় 71°C – 120°C তাপমাত্রায়; এর হাইড্রোকার্বনে কার্বন সংখ্যা 7 – 14। 5 – 10 পেট্রোলের, 11 – 16 কেরোসিনের, 17 – 20 ডিজেলের কার্বন সংখ্যা। তাই উত্তর খ) 7 – 14।"},{"id":"ch11-mcq5","chapter":11,"num":5,"importance":3,"topic":"জীবাশ্ম জ্বালানি: প্রাকৃতিক গ্যাস ও পেট্রোলিয়াম","question":"পেট্রোলিয়ামে শতকরা কত ভাগ পেট্রোল থাকে?","boards":"বরিশাল বোর্ড ২০২৩; সিলেট বোর্ড ২০২৩","options":["5%","6%","10%","15%"],"answerIndex":0,"explanation":"পাঠ্যবই অনুযায়ী পেট্রোলিয়ামে বিভিন্ন অংশের শতকরা পরিমাণ: পেট্রোলিয়াম গ্যাস 2%, পেট্রোল 5%, ন্যাপথা 10%, কেরোসিন 13%। পেট্রোল ও গ্যাসোলিন একই অংশ। তাই পেট্রোলিয়ামে শতকরা 5 ভাগ পেট্রোল থাকে — উত্তর ক) 5%।"},{"id":"ch11-mcq6","chapter":11,"num":6,"importance":2,"topic":"জীবাশ্ম জ্বালানি: প্রাকৃতিক গ্যাস ও পেট্রোলিয়াম","question":"পেট্রোকেমিক্যাল শিল্পে কোনটি ব্যবহৃত হয়?","boards":"ময়মনসিংহ বোর্ড ২০২৫","options":["গ্যাসোলিন","ন্যাপথা","পেট্রোল","প্যারাফিন মোম"],"answerIndex":1,"explanation":"ন্যাপথা (71°C – 120°C) জ্বালানি এবং পেট্রোকেমিক্যাল শিল্পে বিভিন্ন রাসায়নিক পদার্থ ও ব্যবহার্য দ্রব্য তৈরিতে ব্যবহৃত হয়। গ্যাসোলিন ও পেট্রোল একই জিনিস, যানবাহনের জ্বালানি; প্যারাফিন মোম টয়লেট্রিজ ও ভ্যাসলিন তৈরিতে লাগে। তাই উত্তর খ) ন্যাপথা।"},{"id":"ch11-mcq7","chapter":11,"num":7,"importance":2,"topic":"জীবাশ্ম জ্বালানি: প্রাকৃতিক গ্যাস ও পেট্রোলিয়াম","question":"কেরোসিনে কোন মৌলটি উপস্থিত?","boards":"বরিশাল বোর্ড ২০২৪","options":["কার্বন","ক্লোরিন","অক্সিজেন","নাইট্রোজেন"],"answerIndex":0,"explanation":"কেরোসিন পেট্রোলিয়ামের একটি অংশ, যা 11 – 16 কার্বনবিশিষ্ট হাইড্রোকার্বনের মিশ্রণ (যেমন C₁₂H₂₆)। হাইড্রোকার্বন শুধু কার্বন ও হাইড্রোজেন দিয়ে গঠিত; এতে ক্লোরিন, অক্সিজেন বা নাইট্রোজেন থাকে না। তাই কেরোসিনে উপস্থিত মৌল হলো ক) কার্বন ।"},{"id":"ch11-mcq8","chapter":11,"num":8,"importance":2,"topic":"জীবাশ্ম জ্বালানি: প্রাকৃতিক গ্যাস ও পেট্রোলিয়াম","question":"অপরিশোধিত তেলকে কত তাপমাত্রায় আংশিক পাতন করলে কেরোসিন পাওয়া যায়?","boards":"দিনাজপুর বোর্ড ২০২১","options":["70°C","120°C","170°C","270°C"],"answerIndex":2,"explanation":"কেরোসিনের স্ফুটনাঙ্ক-সীমা 121°C – 170°C; আংশিক পাতন কলামের চিত্রে এর পাশে উপরের সীমা 170°C লেখা থাকে। 70°C পেট্রোলের, 120°C ন্যাপথার, 270°C ডিজেলের সীমা । তাই উত্তর গ) 170°C।"},{"id":"ch11-mcq9","chapter":11,"num":9,"importance":3,"topic":"হাইড্রোকার্বন: শ্রেণিবিভাগ, সমগোত্রীয় শ্রেণি ও কার্যকরী মূলক","question":"কোনটি অসম্পৃক্ত হাইড্রোকার্বন?","boards":"সিলেট বোর্ড ২০২৪; চট্টগ্রাম বোর্ড ২০২২; ঢাকা বোর্ড ২০২১","options":["C₂H₆","C₃H₆","C₃H₈","C₄H₁₀"],"answerIndex":1,"explanation":"অসম্পৃক্ত হাইড্রোকার্বনে C=C বা C≡C থাকে; এদের সংকেত CnH2n (অ্যালকিন) বা CnH2n−₂ (অ্যালকাইন)। C₃H₆ এ n = 3, H = 2n = 6, তাই এটি অ্যালকিন — প্রোপিন CH₃-CH=CH₂, যাতে একটি C=C আছে। C₂H₆, C₃H₈, C₄H₁₀ — প্রতিটিতে H=2n+2, তাই এরা অ্যালকেন (সম্পৃক্ত)।"},{"id":"ch11-mcq10","chapter":11,"num":10,"importance":3,"topic":"হাইড্রোকার্বন: শ্রেণিবিভাগ, সমগোত্রীয় শ্রেণি ও কার্যকরী মূলক","question":"বেনজিনের সংকেত কোনটি?","boards":"ঢাকা বোর্ড ২০২২; বরিশাল বোর্ড ২০২১","options":["C₁₀H₈","C₁₀H₁₆O","C₆H₆","C₆H₁₂"],"answerIndex":2,"explanation":"বেনজিন ছয়টি কার্বনের সমতলীয় ষড়ভুজ বলয়, প্রতিটি কার্বনে একটি H — তাই সংকেত C₆H₆। C₁₀H₈ হলো ন্যাপথলিন, C₁₀H₁₆O কর্পূর (O আছে), C₆H₁₂ সাইক্লোহেক্সেন ।"},{"id":"ch11-mcq11","chapter":11,"num":11,"importance":2,"topic":"হাইড্রোকার্বন: শ্রেণিবিভাগ, সমগোত্রীয় শ্রেণি ও কার্যকরী মূলক","question":"কোনটির মূল উপাদান হাইড্রোকার্বন?","boards":"ময়মনসিংহ বোর্ড ২০২২","options":["কেরোসিন","ফরমালিন","ভিনেগার","মেথিলেটেড স্পিরিট"],"answerIndex":0,"explanation":"কেরোসিন পেট্রোলিয়াম থেকে পাওয়া C₁₁ – C₁₆ হাইড্রোকার্বনের মিশ্রণ; এতে শুধু C ও H আছে । অন্যগুলোতে অক্সিজেন আছে: ফরমালিন হলো মিথান্যালের (HCHO) 40% জলীয় দ্রবণ, ভিনেগার ইথানয়িক এসিডের (CH₃COOH) লঘু দ্রবণ, মেথিলেটেড স্পিরিটের মূল উপাদান ইথানল (C₂H₅OH)। তাই মূল উপাদান হাইড্রোকার্বন — ক) কেরোসিন ।"},{"id":"ch11-mcq12","chapter":11,"num":12,"importance":2,"topic":"হাইড্রোকার্বন: শ্রেণিবিভাগ, সমগোত্রীয় শ্রেণি ও কার্যকরী মূলক","question":"কোনটি অ্যারোমেটিক হাইড্রোকার্বন?","boards":"চট্টগ্রাম বোর্ড ২০২১","options":["ইথেন","বিউটেন","মিথেন","বেনজিন"],"answerIndex":3,"explanation":"যেসব সমতলীয় চাক্রিক হাইড্রোকার্বনের বলয়ে একক ও দ্বিবন্ধন একান্তরভাবে থাকে, তাদের অ্যারোমেটিক হাইড্রোকার্বন বলে। বেনজিন (C₆H₆) ছয় কার্বনের বলয়, যাতে তিনটি একান্তর দ্বিবন্ধন আছে — তাই এটি অ্যারোমেটিক । মিথেন (CH₄), ইথেন (C₂H₆) ও বিউটেন (C₄H₁₀) মুক্ত শিকলের অ্যালকেন, অর্থাৎ অ্যালিফেটিক । উত্তর ঘ) বেনজিন।"},{"id":"ch11-mcq13","chapter":11,"num":13,"importance":3,"topic":"সম্পৃক্ত হাইড্রোকার্বন: অ্যালকেন","question":"পেন্টেনের স্ফুটনাঙ্ক কত?","boards":"বরিশাল বোর্ড ২০২৫; কুমিল্লা বোর্ড ২০২৩; ময়মনসিংহ বোর্ড ২০২০","options":["25.3° C","36.1° C","45.2°C","46.2°C"],"answerIndex":1,"explanation":"5 কার্বনবিশিষ্ট সম্পৃক্ত হাইড্রোকার্বন পেন্টেনের (C₅H₁₂) স্ফুটনাঙ্ক 36.1°C। এটি কক্ষ তাপমাত্রার চেয়ে বেশি, তাই পেন্টেন সাধারণ অবস্থায় তরল; এটিই প্রথম তরল অ্যালকেন। উত্তর খ)।"},{"id":"ch11-mcq14","chapter":11,"num":14,"importance":3,"topic":"সম্পৃক্ত হাইড্রোকার্বন: অ্যালকেন","question":"অ্যালকাইল মূলকের যোজনী কত?","boards":"যশোর বোর্ড ২০২৪; বরিশাল বোর্ড ২০২৪","options":["1","2","3","4"],"answerIndex":0,"explanation":"অ্যালকেন (CnH2n+₂) থেকে একটি H সরালে অ্যালকাইল মূলক (CnH2n+₁) তৈরি হয়, যার একটি মাত্র মুক্ত বন্ধন থাকে ।\nযেমন: CH₄ থেকে CH₃- (মিথাইল), যা শুধু একটি পরমাণুর সাথে যুক্ত হতে পারে (CH₃-Cl)। তাই অ্যালকাইল মূলক একযোজী, যোজনী 1। উত্তর ক)।"},{"id":"ch11-mcq15","chapter":11,"num":15,"importance":3,"topic":"সম্পৃক্ত হাইড্রোকার্বন: অ্যালকেন","stemPrefix":"Br₂Br₂\nবিক্রিয়া: CH₃-C≡CH⟶X⟶Y","question":"Y যৌগটির নাম কী?","boards":"যশোর বোর্ড ২০২২; চট্টগ্রাম বোর্ড ২০২২","options":["1, 1-ডাইব্রোমো প্রোপেন","2, 2-ডাইব্রোমো প্রোপেন","1, 1, 2, 2-টেট্রাব্রোমো প্রোপেন","1, 2-ডাইব্রোমো প্রোপিন"],"answerIndex":2,"explanation":"প্রোপাইনের ত্রিবন্ধন দুই ধাপে দুই অণু Br₂ এর সাথে যুত বিক্রিয়া দেয়:\nCH₃-C≡CH+Br₂→CH₃-CBr=CHBr(X,1,2-ডাইব্রোমোপ্রোপিন)\nCH₃-CBr=CHBr+Br₂→CH₃-CBr₂-CHBr₂(Y)\nY তে 3টি কার্বন, সব একক বন্ধন, এবং C₁ ও C₂ তে দুটি করে Br। তাই Y = গ) 1, 1, 2, 2-টেট্রাব্রোমো প্রোপেন । (ঘ) হলো প্রথম ধাপের উৎপাদ X।"},{"id":"ch11-mcq16","chapter":11,"num":16,"importance":3,"topic":"সম্পৃক্ত হাইড্রোকার্বন: অ্যালকেন","question":"পেন্টেনের স্ফুটনাঙ্ক কত?","boards":"ঢাকা বোর্ড ২০২৬","options":["-1°C","-5°C","25°C","35.1°C"],"answerIndex":3,"explanation":"পেন্টেন (C₅H₁₂) কক্ষ তাপমাত্রায় তরল; এর স্ফুটনাঙ্ক প্রায় 36°C, অপশন অনুযায়ী 35.1°C।"},{"id":"ch11-mcq17","chapter":11,"num":17,"importance":3,"topic":"সম্পৃক্ত হাইড্রোকার্বন: অ্যালকেন","question":"কক্ষ তাপমাত্রায় কোনটি তরল অবস্থায় থাকে?","boards":"ময়মনসিংহ বোর্ড ২০২৬","options":["C₂H₆","C₃H₈","C₄H₁₀","C₅H₁₂"],"answerIndex":3,"explanation":"C₁-C₄ অ্যালকেন গ্যাস, C₅ থেকে তরল; তাই C₅H₁₂ (পেন্টেন) তরল।"},{"id":"ch11-mcq18","chapter":11,"num":18,"importance":2,"topic":"সম্পৃক্ত হাইড্রোকার্বন: অ্যালকেন","question":"সাধারণ তাপমাত্রায় কোনটি তরল?","boards":"চট্টগ্রাম বোর্ড ২০২৪","options":["C₂H₆","C₄H₁₀","C₆H₁₄","C₂₀H₄₂"],"answerIndex":2,"explanation":"5 থেকে 15 কার্বনের অ্যালকেন সাধারণ তাপমাত্রায় তরল। C₂H₆ ও C₄H₁₀ (1-4 কার্বন) গ্যাসীয়, C₂₀H₄₂ (16+ কার্বন) কঠিন; কেবল C₆H₁₄ (হেক্সেন, 6 কার্বন) তরল । উত্তর গ)।"},{"id":"ch11-mcq19","chapter":11,"num":19,"importance":2,"topic":"সম্পৃক্ত হাইড্রোকার্বন: অ্যালকেন","question":"সোডিয়াম প্রোপানয়েটের সাথে সোডালাইমের বিক্রিয়ায় কোন হাইড্রোকার্বনটি উৎপন্ন হয়?","boards":"কুমিল্লা বোর্ড ২০২৪","options":["C₃H₈","C₃H₆","C₂H₄","C₂H₆"],"answerIndex":3,"explanation":"সোডিয়াম প্রোপানয়েট (CH₃-CH₂-COONa, C = 3) সোডালাইমের সাথে ডিকার্বক্সিলেশনে এক কার্বন কম অ্যালকেন অর্থাৎ ইথেন দেয়। CaO, Δ\nCH₃-CH₂-COONa+NaOH⟶CH₃-CH₃+Na₂CO₃\nউৎপাদ অ্যালকেন, অ্যালকিন (C₂H₄, C₃H₆) নয়; আর কার্বন একটি কমে, তাই C₃H₈ নয়। উত্তর ঘ) C₂H₆।"},{"id":"ch11-mcq20","chapter":11,"num":20,"importance":3,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকিন","question":"প্রোপিন যৌগ– (i) এর স্থুল সংকেত CH₂ (ii) C₃H₈ অপেক্ষা কম সক্রিয় (iii) এর কার্বনের শতকরা সংযুতি 85.71%\nনিচের কোনটি সঠিক?","boards":"রাজশাহী বোর্ড ২০২৪; ঢাকা বোর্ড ২০২৩","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":1,"explanation":"(i) সঠিক: C₃H₆-এ C : H = 3 : 6 = 1 : 2, স্থূল সংকেত CH₂। (ii) ভুল: দ্বিবন্ধনের দুর্বল বন্ধনের জন্য প্রোপিন প্রোপেন (C₃H₈) অপেক্ষা বেশি সক্রিয় । (iii) সঠিক: আণবিক ভর =3×12+6×1=42; C%=(36÷ 42)×100=85.71%। সুতরাং উত্তর (খ) i ও iii।"},{"id":"ch11-mcq21","chapter":11,"num":21,"importance":3,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকিন","question":"অক্টিনের সাধারণ সংকেত কোনটি?","boards":"কুমিল্লা বোর্ড ২০২৩; চট্টগ্রাম বোর্ড ২০২১","options":["CnH2n","CnH2n+₂","CnH2n−₂","CnH2n+₁"],"answerIndex":0,"explanation":"নামের শেষে \"ইন (ene)\" থাকলে যৌগটি অ্যালকিন; অক্টিন ৮ কার্বনের অ্যালকিন (C₈H₁₆)। অ্যালকিনের সাধারণ সংকেত CnH2n, তাই উত্তর (ক)। CnH2n+₂ অ্যালকেনের, CnH2n−₂ অ্যালকাইনের এবং CnH2n+₁ অ্যালকাইল মূলকের সংকেত।"},{"id":"ch11-mcq22","chapter":11,"num":22,"importance":3,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকিন","question":"নিচের কোন যৌগটি ব্রোমিন দ্রবণের লাল বর্ণকে বর্ণহীন করতে পারে-","boards":"ঢাকা বোর্ড ২০২২; বরিশাল বোর্ড ২০২১","options":["C₂H₆","C₃H₈O","C₃H₈","C₃H₆"],"answerIndex":3,"explanation":"ব্রোমিন দ্রবণের লাল বর্ণ কেবল অসম্পৃক্ত হাইড্রোকার্বন দূর করতে পারে। C₃H₆ (প্রোপিন) CnH2n সংকেতের অ্যালকিন: CH₃-CH=CH₂+\nBr₂→CH₃-CHBr-CH₂Br (বর্ণহীন)। উত্তর (ঘ)।\nC₂H₆ ও C₃H₈ সম্পৃক্ত অ্যালকেন, C₃H₈O (প্রোপানল) সম্পৃক্ত অ্যালকোহল; এদের C=C নেই।"},{"id":"ch11-mcq23","chapter":11,"num":23,"importance":3,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকিন","question":"CH₃-C≡CH যৌগটির IUPAC নাম কী?","boards":"ঢাকা বোর্ড ২০২১; চট্টগ্রাম বোর্ড ২০২১","options":["প্রোপাইল","প্রোপেন","প্রোপিন","প্রোপাইন"],"answerIndex":3,"explanation":"CH₃-C≡CH যৌগে 3টি কার্বন (প্রোপ্ ) এবং একটি C≡C ত্রিবন্ধন (-আইন) আছে, তাই নাম প্রোপাইন (C₃H₄)। প্রোপেন (CH₃-CH₂-CH₃) একবন্ধনযুক্ত, প্রোপিন (CH₃-CH=CH₂) দ্বিবন্ধনযুক্ত, আর প্রোপাইল (C₃H₇-) কোনো যৌগ নয়, একটি মূলক। তাই উত্তর ঘ) প্রোপাইন ।"},{"id":"ch11-mcq24","chapter":11,"num":24,"importance":3,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকিন","question":"C₂H₅Cl+NaOH(alc)→X+NaCl+H₂O; X\nযৌগে কোন মূলক বিদ্যমান?","boards":"কুমিল্লা বোর্ড ২০২৬","options":["কার্বক্সিলিক এসিড","অ্যালডিহাইড","অ্যালকোহল","অ্যালকিন"],"answerIndex":3,"explanation":"অ্যালকোহলীয় NaOH এর সাথে HCl অপসারিত হয়ে X = ইথিন (CH₂=CH₂) উৎপন্ন হয়, যা অ্যালকিন ।"},{"id":"ch11-mcq25","chapter":11,"num":25,"importance":3,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকিন","question":"C₂H₅Cl+NaOH(alc)→X+NaCl+H₂O; X\nযৌগটি —\ni. পানির সাথে অ্যালকোহল উৎপন্ন করে\nii. উচ্চ তাপমাত্রা ও চাপে পলিথিন উৎপন্ন করে\niii. H₂ এর সাথে সংযোজন বিক্রিয়া দেয়; কোনটি সঠিক?","boards":"কুমিল্লা বোর্ড ২০২৬","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":3,"explanation":"X = ইথিন: পানি যুক্ত হয়ে ইথানল, পলিমারকরণে পলিথিন এবং H₂ যুক্ত হয়ে ইথেন উৎপন্ন করে।"},{"id":"ch11-mcq26","chapter":11,"num":26,"importance":2,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকিন","question":"অসম্পৃক্ততার পরীক্ষায় কোনটি ব্যবহৃত হয়?","boards":"যশোর বোর্ড ২০২৪","options":["Cl₂","F₂","Br₂","I₂"],"answerIndex":2,"explanation":"অসম্পৃক্ত হাইড্রোকার্বনে (C=C বা C≡C) ব্রোমিন যুক্ত হয়ে বর্ণহীন যৌগ তৈরি করে, ফলে ব্রোমিন দ্রবণের লাল-বাদামি বর্ণ মুছে যায়। এটিই অসম্পৃক্ততার পরীক্ষা ।\nCH₂=CH₂+Br₂→CH₂Br-CH₂Br\nসম্পৃক্ত যৌগে এ পরিবর্তন হয় না। Cl₂, F₂ বা I₂ এই পরীক্ষায় ব্যবহৃত হয় না, তাই সঠিক উত্তর (গ) Br₂।"},{"id":"ch11-mcq27","chapter":11,"num":27,"importance":2,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকিন","question":"কোন হাইড্রোকার্বনটি অ্যালকিন শ্রেণির দ্বিতীয় সদস্য?","boards":"বরিশাল বোর্ড ২০২১","options":["C₃H₈","C₃H₆","C₃H₄","C₂H₆"],"answerIndex":1,"explanation":"অ্যালকিনের সাধারণ সংকেত CnH2n; দ্বিবন্ধনের জন্য অন্তত 2টি কার্বন লাগে বলে প্রথম সদস্য n = 2, অর্থাৎ C₂H₄ (ইথিন)। দ্বিতীয় সদস্যে n = 3, H=2×3=6, অর্থাৎ C₃H₆ (প্রোপিন, CH₃-CH=CH₂)। C₃H₈ ও C₂H₆ অ্যালকেন, C₃H₄ অ্যালকাইন। তাই উত্তর খ) C₃H₆।"},{"id":"ch11-mcq28","chapter":11,"num":28,"importance":3,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকাইন","question":"CaC₂+H₂O→A+Ca(OH)₂ বিক্রিয়ায় 'A' যৌগটি\nহচ্ছে–","boards":"সিলেট বোর্ড ২০২৪; ঢাকা বোর্ড ২০২০","options":["C₂H₂","C₂H₄","CaCO₃","CaO"],"answerIndex":0,"explanation":"পানির H যায় Ca(OH)₂ তে আর CaC₂ এর দুটি C বাকি 2টি H নিয়ে A তৈরি করে, তাই A = C₂H₂ (ইথাইন)।\nCaC₂+2H₂O→CH≡CH+Ca(OH)₂\nC₂H₄ (ইথিন) এ বিক্রিয়ায় পাওয়া যায় না; CaCO₃ বা CaO হতে পারে না, কারণ Ca আগেই Ca(OH)₂ তে গেছে। সমতাকৃত সমীকরণে পানি লাগে 2 অণু।"},{"id":"ch11-mcq29","chapter":11,"num":29,"importance":2,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকাইন","question":"CH₃-C≡C-CH₃ যৌগটির নাম কী?","boards":"ঢাকা বোর্ড ২০২৫","options":["বিউটিন","বিউটাইন-1","বিউটাইন-2","বিউটিন-2"],"answerIndex":2,"explanation":"যৌগটিতে 4টি কার্বন (বিউট্ ) এবং C≡C ত্রিবন্ধন (-আইন) আছে। নম্বর দিলে 1CH₃-2C≡3C-4CH₃ — যেকোনো প্রান্ত থেকে গুনলেও ত্রিবন্ধন শুরু 2 নম্বর কার্বনে । তাই নাম বিউটাইন-2। বিউটিন ও বিউটিন-2 দ্বিবন্ধনযুক্ত; বিউটাইন-1 হলো CH≡C-CH₂-CH₃। উত্তর গ) বিউটাইন-2।"},{"id":"ch11-mcq30","chapter":11,"num":30,"importance":2,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকাইন","question":"কোনটিতে কার্বন-কার্বন ত্রি-বন্ধন বিদ্যমান?","boards":"কুমিল্লা বোর্ড ২০২৫","options":["ইথেন","ইথিলিন","অ্যাসিটিলিন","পলিথিন"],"answerIndex":2,"explanation":"ইথেন CH₃-CH₃ (একক বন্ধন), ইথিলিন CH₂=CH₂ (দ্বিবন্ধন), অ্যাসিটিলিন CH≡CH (ত্রিবন্ধন)। পলিথিনে পলিমারকরণে দ্বিবন্ধন ভেঙে যায়, তাই শুধু একক বন্ধন থাকে। কার্বন-কার্বন ত্রিবন্ধন আছে কেবল অ্যাসিটিলিনে ।"},{"id":"ch11-mcq31","chapter":11,"num":31,"importance":2,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকাইন","stemPrefix":"CaC₂+2H₂O→A+Ca(OH)₂","question":"A যৌগ হতে প্রস্তুত করা যায়— (i) পি.ভি.সি (ii) ইথান্যাল (iii) টেট্রাব্রোমো ইথেন\nনিচের কোনটি সঠিক?","boards":"কুমিল্লা বোর্ড ২০২৫","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":3,"explanation":"CaC₂+2H₂O→CH≡CH+Ca(OH)₂, তাই A = ইথাইন।\nHgCl₂\n(i) সঠিক: CH≡CH+HCl⟶CH₂=CHCl; ভিনাইল ক্লোরাইডের\nপলিমারকরণে PVC।\n(ii) সঠিক: CH≡CH+ 20% H₂SO₄, 2% HgSO₄, 80°C\nH₂O⟶CH₃-CHO (ইথান্যাল)।\n(iii) সঠিক: CH≡CH+2Br₂→CHBr₂-CHBr₂ (টেট্রাব্রোমো\nইথেন)। তাই উত্তর i, ii ও iii।"},{"id":"ch11-mcq32","chapter":11,"num":32,"importance":3,"topic":"অ্যালকোহল","question":"কোনটি রেকটিফাইড স্পিরিটের মূল উপাদান?","boards":"চট্টগ্রাম বোর্ড ২০২৩; ময়মনসিংহ বোর্ড ২০২৩; ঢাকা বোর্ড ২০২১","options":["CH₃COOH","CH₃CHO","HCOOH","CH₃CH₂OH"],"answerIndex":3,"explanation":"রেকটিফাইড স্পিরিট হলো ইথানলের 95.6% জলীয় দ্রবণ । মিশ্রণের প্রায় পুরোটাই ইথানল, তাই এর মূল উপাদান ইথানল (CH₃CH₂OH)। CH₃COOH ইথানয়িক এসিড (ভিনেগারের উপাদান), CH₃CHO ইথান্যাল, HCOOH মিথানয়িক এসিড — কোনোটিই রেকটিফাইড স্পিরিটের মূল উপাদান নয়।"},{"id":"ch11-mcq33","chapter":11,"num":33,"importance":3,"topic":"অ্যালকোহল","question":"চাল →(H₂O, এনজাইম) X →(এনজাইম) Y;\nউদ্দীপকের বিক্রিয়ার ক্ষেত্রে—\ni. Y একটি জৈব দ্রাবক\nii. X একটি হাইড্রোকার্বন\niii. Y থেকে ফ্যাটি এসিড তৈরি সম্ভব;\nনিচের কোনটি সঠিক?","boards":"রাজশাহী বোর্ড ২০২৬","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":1,"explanation":"চালের স্টার্চ আর্দ্র-বিশ্লেষণে X = গ্লুকোজ (কার্বোহাইড্রেট, হাইড্রোকার্বন নয়) এবং গাঁজনে Y = ইথানল হয়। ইথানল জৈব দ্রাবক এবং জারণে ইথানয়িক এসিড (ফ্যাটি এসিড) দেয়।"},{"id":"ch11-mcq34","chapter":11,"num":34,"importance":3,"topic":"অ্যালকোহল","question":"রেক্টিফাইড স্পিরিটে কত ভাগ পানি থাকে?","boards":"রাজশাহী বোর্ড ২০২৬","options":["96%","40%","4%","2%"],"answerIndex":2,"explanation":"রেক্টিফাইড স্পিরিটে প্রায় 95.6% ইথানল ও 4.4% পানি থাকে।"},{"id":"ch11-mcq35","chapter":11,"num":35,"importance":3,"topic":"অ্যালকোহল","question":"ফেনলের সংকেত কোনটি?","boards":"বরিশাল বোর্ড ২০২৬","options":["C₆H₅-OH","CH₃-OH","CH₂(OH)-CH₂(OH)","C₂H₅-OH"],"answerIndex":0,"explanation":"বেনজিন বলয়ে -OH মূলক যুক্ত যৌগ ফেনল (C₆H₅OH)।"},{"id":"ch11-mcq36","chapter":11,"num":36,"importance":3,"topic":"অ্যালকোহল","question":"CnH2n+H₂O→X→[O]Y; এখানে n = 2। X\nযৌগটিতে কয়টি C-H বন্ধন আছে?","boards":"বরিশাল বোর্ড ২০২৬","options":["2","4","5","6"],"answerIndex":2,"explanation":"C₂H₄+H₂O→X=CH₃CH₂OH (ইথানল); CH₃ এ 3টি ও\nCH₂ এ 2টি — মোট 5টি C-H বন্ধন ।"},{"id":"ch11-mcq37","chapter":11,"num":37,"importance":3,"topic":"অ্যালকোহল","question":"CnH2n+H₂O→X→[O]Y; এখানে n = 2।\ni. X\nকসমেটিকস শিল্পে দ্রাবক হিসেবে ব্যবহৃত হয়\nii. Y এর জারণে অম্লধর্মী যৌগ উৎপন্ন হয়\niii. X ও Y একই সমগোত্রীয় শ্রেণিভুক্ত;\nনিচের কোনটি সঠিক?","boards":"বরিশাল বোর্ড ২০২৬","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":0,"explanation":"X = ইথানল (দ্রাবক), Y = ইথান্যাল (অ্যালডিহাইড), যার জারণে ইথানয়িক এসিড হয়। অ্যালকোহল ও অ্যালডিহাইড ভিন্ন সমগোত্রীয় শ্রেণি ।"},{"id":"ch11-mcq38","chapter":11,"num":38,"importance":3,"topic":"অ্যালকোহল","question":"C₃H₇Cl + NaOH(aq) →(∆) X + NaCl; X যৌগে কী\nমূলক আছে?","boards":"ময়মনসিংহ বোর্ড ২০২৬","options":["কার্বক্সিলিক এসিড","অ্যালকোহল","অ্যালডিহাইড","অ্যালকিন"],"answerIndex":1,"explanation":"জলীয় NaOH এর সাথে Cl এর স্থানে -OH যুক্ত হয়ে X = প্রোপানল (C₃H₇OH) উৎপন্ন হয়, যা অ্যালকোহল ।"},{"id":"ch11-mcq39","chapter":11,"num":39,"importance":3,"topic":"অ্যালকোহল","question":"C₃H₇Cl + NaOH(aq) →(∆) X + NaCl; X যৌগ\nথেকে পাওয়া সম্ভব —\ni. অ্যালকিন\nii. জৈব এসিড\niii. অ্যালডিহাইড;\nনিচের কোনটি সঠিক?","boards":"ময়মনসিংহ বোর্ড ২০২৬","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":3,"explanation":"প্রোপানলের নিরুদনে অ্যালকিন (প্রোপিন), মৃদু জারণে অ্যালডিহাইড (প্রোপান্যাল) এবং অধিক জারণে জৈব এসিড (প্রোপানয়িক এসিড) পাওয়া যায়।"},{"id":"ch11-mcq40","chapter":11,"num":40,"importance":2,"topic":"অ্যালকোহল","question":"কোনটির Fermentation-এ ইথানল পাওয়া যায়?","boards":"কুমিল্লা বোর্ড ২০২৪","options":["মাছ","মাংস","ভাত","দুধ"],"answerIndex":2,"explanation":"ইস্টের এনজাইম শ্বেতসার বা শর্করাকে গাঁজন করে ইথানল তৈরি করে। ভাত চাল থেকে তৈরি, যার প্রধান উপাদান শ্বেতসার । ডায়াস্টেজ ও মল্টেজ , পানি জাইমেজ\nস্টার্চ⟶গ্লুকোজ⟶ইথানল\nজাইমেজ\nC₆H₁₂O₆⟶2C₂H₅OH+2CO₂\nমাছ ও মাংস আমিষপ্রধান; দুধের গাঁজনে মূলত ল্যাকটিক এসিড (দই) হয়।"},{"id":"ch11-mcq41","chapter":11,"num":41,"importance":2,"topic":"অ্যালকোহল","stemPrefix":"A+Br→CH₃-CHBr-CH₂Br","question":"A এর সাথে পানির বিক্রিয়ায় কী পাওয়া যায়?","boards":"ঢাকা বোর্ড ২০২৪","options":["প্রোপেন","জৈব এসিড","গ্লাইকল","অ্যালকোহল"],"answerIndex":3,"explanation":"পাশাপাশি দুটি কার্বনে (C₁ ও C₂) একটি করে Br যুক্ত হয়েছে, তাই A এর ঐ দুই কার্বনের মাঝে দ্বিবন্ধন ছিল — A = প্রোপিন ।\nCH₃-CH=CH₂+Br₂→CH₃-CHBr-CH₂Br\nঅ্যালকিন ফসফরিক এসিড প্রভাবকে উচ্চ তাপ ও চাপে পানির সাথে যুত হয়ে অ্যালকোহল দেয়। CH₃-CH=CH₂ H₃PO₄, 300°C, 60 atm\n+H₂O⟶CH₃-CH(OH)-CH₃"},{"id":"ch11-mcq42","chapter":11,"num":42,"importance":2,"topic":"অ্যালকোহল","stemPrefix":"20% H₂SO₄, 2% HgSO₄, 80°C\nCH≡CH+H₂O⟶X.","question":"X যৌগটির নাম কী?","boards":"রাজশাহী বোর্ড ২০২২","options":["ইউরিয়া","ইথানল","ইথান্যাল","ইথেন"],"answerIndex":2,"explanation":"20% H₂SO₄, 2% HgSO₄, 80°C\nCH≡CH+H₂O⟶CH₃-CHO\nইথাইনের সাথে পানির যুত বিক্রিয়ায় ইথান্যাল (অ্যাসিটালডিহাইড) উৎপন্ন হয়। ইথানল পাওয়া যায় ইথিন + পানি (H₃PO₄) থেকে; ইথেন পাওয়া যায় ইথাইন + H₂ (Ni) থেকে।"},{"id":"ch11-mcq43","chapter":11,"num":43,"importance":3,"topic":"অ্যালডিহাইড ও জৈব এসিড","question":"ফরমালিনে কতভাগ পানি থাকে?","boards":"যশোর বোর্ড ২০২৫; বরিশাল বোর্ড ২০২৫; ঢাকা বোর্ড ২০২৩; রাজশাহী বোর্ড ২০২৩","options":["40%","60%","80%","96%"],"answerIndex":1,"explanation":"ফরমালিন হলো মিথান্যালের 40% জলীয় দ্রবণ, অর্থাৎ 100 ভাগে 40 ভাগ মিথান্যাল। পানি =100−40=60 ভাগ। তাই সঠিক উত্তর খ) 60%। 40% হলো মিথান্যালের পরিমাণ, পানির নয়।"},{"id":"ch11-mcq44","chapter":11,"num":44,"importance":3,"topic":"অ্যালডিহাইড ও জৈব এসিড","question":"অ্যালডিহাইডের কার্যকরী মূলক কোনটি?","boards":"যশোর বোর্ড ২০২৪; ময়মনসিংহ বোর্ড ২০২২; কুমিল্লা বোর্ড ২০২১","options":["-OH","\u003eC=C\u003c","-CHO","-C≡C-"],"answerIndex":2,"explanation":"অ্যালডিহাইড শ্রেণির কার্যকরী মূলক –CHO (অ্যালডিহাইড গ্রুপ), যেমন H-CHO, CH₃-CHO। –OH অ্যালকোহলের, \u003eC=C\u003c অ্যালকিনের এবং –C≡C– অ্যালকাইনের কার্যকরী মূলক। তাই সঠিক উত্তর গ) –CHO।"},{"id":"ch11-mcq45","chapter":11,"num":45,"importance":2,"topic":"অ্যালডিহাইড ও জৈব এসিড","stemPrefix":"একটি বিক্রিয়া পাত্রে 100 mL 0.5 M NaOH দ্রবণ রাখা আছে।","question":"বিক্রিয়া পাত্রে প্রয়োজনীয় পরিমাণ ভিনেগার যোগ করা হলে উৎপন্ন লবণের আণবিক ভর কত হবে?","boards":"চট্টগ্রাম বোর্ড ২০২৪","options":["60","68","82","141"],"answerIndex":2,"explanation":"ভিনেগারে আছে ইথানয়িক এসিড; NaOH এর সাথে প্রশমনে লবণ ও পানি হয়।\nCH₃COOH+NaOH→CH₃COONa+H₂O\nলবণ CH₃COONa এর আণবিক ভর =12×2+1×3+ 16×2+23=82। 60 হলো এসিডের (CH₃COOH) ভর, লবণের নয়।"},{"id":"ch11-mcq46","chapter":11,"num":46,"importance":2,"topic":"অ্যালডিহাইড ও জৈব এসিড","question":"কোনটি অসম্পৃক্ত ফ্যাটি এসিড?","boards":"রাজশাহী বোর্ড ২০২৪","options":["স্টিয়ারিক এসিড","অলিক এসিড","কার্বনিক এসিড","সাইট্রিক এসিড"],"answerIndex":1,"explanation":"কার্বন শিকলে C=C দ্বিবন্ধন থাকলে ফ্যাটি এসিড অসম্পৃক্ত হয়। স্টিয়ারিক এসিড C₁₇H₃₅COOH — C₁₇H₃₅=CnH2n+₁, তাই সম্পৃক্ত । অলিক এসিড C₁₇H₃₃COOH — 2টি H কম, অর্থাৎ একটি C=C আছে, তাই অসম্পৃক্ত । কার্বনিক এসিড অজৈব; সাইট্রিক এসিডে কোনো C=C নেই, তাই এটি অসম্পৃক্ত নয়।"},{"id":"ch11-mcq47","chapter":11,"num":47,"importance":3,"topic":"পলিমার, প্লাস্টিক ও জৈব-অজৈব যৌগের পার্থক্য","question":"প্লাস্টিক বোতল তৈরিতে কোন পলিমারটি ব্যবহৃত হয়?","boards":"চট্টগ্রাম বোর্ড ২০২৫, ২০২০; বরিশাল বোর্ড ২০২৩; কুমিল্লা বোর্ড ২০২২; ঢাকা বোর্ড ২০২০","options":["পিভিসি","নাইলন","পলিথিন","পলি প্রোপিন"],"answerIndex":3,"explanation":"প্লাস্টিক বোতল ও প্লাস্টিক রশি তৈরি হয় পলিপ্রোপিন থেকে; এটি পলিথিনের চেয়ে মজবুত, হালকা ও উচ্চ তাপ সহ্য করে। পলিথিন দিয়ে ব্যাগ ও শিট, PVC দিয়ে পানির পাইপ, নাইলন দিয়ে কাপড় ও দাঁতের ব্রাশ তৈরি হয়। তাই উত্তর ঘ।"},{"id":"ch11-mcq48","chapter":11,"num":48,"importance":3,"topic":"পলিমার, প্লাস্টিক ও জৈব-অজৈব যৌগের পার্থক্য","question":"কোনটি ঘনীভবন পলিমার?","boards":"যশোর বোর্ড ২০২৩, ২০২১; বরিশাল বোর্ড ২০২৩; ঢাকা বোর্ড ২০২২","options":["পিভিসি","পলিপ্রোপিন","নাইলন 6 : 6","পলিথিন"],"answerIndex":2,"explanation":"যে পলিমার গঠনের সময় H₂O, CO₂ এর মতো ক্ষুদ্র অণু বের হয়ে যায় সেটি ঘনীভবন পলিমার । nHOOC-(CH₂)₄-COOH TiO₂, Δ\n+nH₂N-(CH₂)₆-NH₂⟶[-OC-(CH₂)₄-CO-NH-(CH₂)₆-NH-]n+2nH₂O\nনাইলন 6:6 গঠনে পানি অপসারিত হয়, তাই এটি ঘনীভবন পলিমার । PVC, পলিপ্রোপিন ও পলিথিনে কোনো অণু বের হয় না, এরা যুত পলিমার ।"},{"id":"ch11-mcq49","chapter":11,"num":49,"importance":3,"topic":"পলিমার, প্লাস্টিক ও জৈব-অজৈব যৌগের পার্থক্য","question":"PVC এর মনোমার কোনটি?","boards":"দিনাজপুর বোর্ড ২০২১; রাজশাহী বোর্ড ২০২০","options":["ClHC = CHCl","H₂C=CCl₂","H₂C = CHCl","ClHC = CCl₂"],"answerIndex":2,"explanation":"PVC = পলিভিনাইল ক্লোরাইড; মনোমার ভিনাইল ক্লোরাইড, যেখানে ইথিনের একটি H এর জায়গায় একটি Cl: H₂C=CHCl। উচ্চ চাপ, উচ্চ তাপমাত্রা , জৈব পারঅক্সাইড\nnCH₂=CHCl⟶(-CH₂-CHCl-\n)n অন্য অপশনগুলোতে দুটি বা তিনটি Cl আছে, তাই সেগুলো ভিনাইল ক্লোরাইড নয়।"},{"id":"ch11-mcq50","chapter":11,"num":50,"importance":3,"topic":"পলিমার, প্লাস্টিক ও জৈব-অজৈব যৌগের পার্থক্য","question":"পলিথিনের মনোমার কোনটি?","boards":"চট্টগ্রাম বোর্ড ২০২০; বরিশাল বোর্ড ২০২০","options":["C₃H₆","C₂H₆","C₂H₄","C₂H₂"],"answerIndex":2,"explanation":"পলিথিন = পলি (অনেক) + ইথিন; মনোমার ইথিন CH₂=CH₂, অর্থাৎ C₂H₄। 1000 atm, 200°C, সামান্য O₂\nnCH₂=CH₂⟶(-CH₂-CH₂-)n\nC₃H₆ প্রোপিন (পলিপ্রোপিনের মনোমার), C₂H₆ ইথেন (দ্বিবন্ধন নেই), C₂H₂ ইথাইন।"},{"id":"ch11-mcq51","chapter":11,"num":51,"importance":2,"topic":"পলিমার, প্লাস্টিক ও জৈব-অজৈব যৌগের পার্থক্য","question":"PVC তৈরির মনোমার কোনটি?","boards":"ঢাকা বোর্ড ২০২৫","options":["CH₂=CH₂","CH₂ = CHCl","CH ≡ CH","CH₂=CCl₂"],"answerIndex":1,"explanation":"PVC = পলিভিনাইল ক্লোরাইড; এর মনোমার ভিনাইল ক্লোরাইড, CH₂=CHCl। উচ্চ চাপ, উচ্চ তাপমাত্রা , জৈব পার-অক্সাইড\nnCH₂=CHCl⟶(-CH₂-CHCl-\n)n CH₂=CH₂ হলো পলিথিনের মনোমার; CH₂=CCl₂ এ Cl দুটি।"},{"id":"ch12-mcq1","chapter":12,"num":1,"importance":3,"topic":"গৃহস্থালির রসায়ন","question":"সোডিয়াম টারটারেট এর সংকেত কোনটি?","boards":"ঢাকা বোর্ড ২০২৫; কুমিল্লা বোর্ড ২০২৫; বরিশাল বোর্ড ২০২৪","options":["C₄H₄Na₂O₂","C₄H₄Na₂O₆","C₄H₄Na₂O₄","C₄H₆Na₂O₄"],"answerIndex":1,"explanation":"টারটারিক এসিডের সংকেত C₄H₆O₆। এর দুটি প্রতিস্থাপনযোগ্য H এর জায়গায় দুটি Na বসলে সোডিয়াম টারটারেট হয়।\n2NaHCO₃+C₄H₆O₆→C₄H₄Na₂O₆+2CO₂+2H₂O\nতাই সোডিয়াম টারটারেট = C₄H₄Na₂O₆।"},{"id":"ch12-mcq2","chapter":12,"num":2,"importance":3,"topic":"গৃহস্থালির রসায়ন","question":"কোমল পানীয়তে কোন এসিড থাকে?","boards":"কুমিল্লা বোর্ড ২০২৪","options":["হাইড্রোক্লোরিক এসিড","সালফিউরিক এসিড","কার্বনিক এসিড","ফসফোরিক এসিড"],"answerIndex":2,"explanation":"ঠান্ডা অবস্থায় ও উচ্চ চাপে পানিতে CO₂ দ্রবীভূত করে কোমল পানীয় তৈরি হয়। CO₂ পানির সাথে বিক্রিয়া করে কার্বনিক এসিড তৈরি করে।\nCO₂+H₂O→H₂CO₃"},{"id":"ch12-mcq3","chapter":12,"num":3,"importance":2,"topic":"গৃহস্থালির রসায়ন","question":"বেকিং পাউডারে কোন এসিড থাকে?","boards":"যশোর বোর্ড ২০২৪","options":["নাইট্রিক এসিড","সাইট্রিক এসিড","টারটারিক এসিড","ম্যালিয়িক এসিড"],"answerIndex":2,"explanation":"বেকিং পাউডার হলো বেকিং সোডা (NaHCO₃) ও টারটারিক এসিডের (C₄H₆O₆) মিশ্রণ । তাপ দিলে এরা বিক্রিয়া করে CO₂ দেয়, যা কেক ফোলায় ।"},{"id":"ch12-mcq4","chapter":12,"num":4,"importance":3,"topic":"পরিষ্কার-পরিচ্ছন্নতায় রসায়ন","question":"সোডা অ্যাসের সংকেত হলো-","boards":"বরিশাল বোর্ড ২০২৫; ঢাকা বোর্ড ২০২০","options":["CaO","Na₂CO₃","CaCO₃","NaHCO₃"],"answerIndex":1,"explanation":"সোডিয়াম কার্বনেট (Na₂CO₃) কে সোডা অ্যাস বলে। এর সাথে 10 অণু পানি যুক্ত হলে কাপড় কাচা সোডা Na₂CO₃.10H₂O হয়। NaHCO₃ হলো খাবার সোডা (বেকিং সোডা), CaCO₃ চুনাপাথর, CaO পোড়াচুন ।"},{"id":"ch12-mcq5","chapter":12,"num":5,"importance":3,"topic":"পরিষ্কার-পরিচ্ছন্নতায় রসায়ন","question":"ডিটারজেন্টকে পাউডার আকৃতি করার জন্য কোনটি যোগ করা হয়?","boards":"দিনাজপুর বোর্ড ২০২৫; ময়মনসিংহ বোর্ড ২০২৫","options":["Na₂SO₄","Na₂CO₃","CaSO₄","CaCO₃"],"answerIndex":0,"explanation":"ডিটারজেন্টকে ব্যবহার উপযোগী পাউডার আকৃতির করার জন্য এর সাথে সোডিয়াম সালফেট (Na₂SO₄) যোগ করা হয়।"},{"id":"ch12-mcq6","chapter":12,"num":6,"importance":3,"topic":"পরিষ্কার-পরিচ্ছন্নতায় রসায়ন","question":"কোনটি বিরঞ্জক পদার্থ?","boards":"কুমিল্লা বোর্ড ২০২৫; ময়মনসিংহ বোর্ড ২০২৪","options":["NaOH","NH₄OH","NaHCO₃","Ca(OCl)Cl"],"answerIndex":3,"explanation":"ব্লিচিং পাউডার Ca(OCl)Cl পানির সাথে বিক্রিয়া করে HOCl দেয়, যা ভেঙে জায়মান অক্সিজেন তৈরি করে:\nCa(OCl)Cl+H₂O→CaCl₂+HOCl ; HOCl→HCl+[O]\nএই [O] রঙিন পদার্থকে বর্ণহীন করে, তাই Ca(OCl)Cl বিরঞ্জক । NaOH, NH₄OH, NaHCO₃ ক্ষারীয় পদার্থ, বিরঞ্জক নয়।"},{"id":"ch12-mcq7","chapter":12,"num":7,"importance":2,"topic":"পরিষ্কার-পরিচ্ছন্নতায় রসায়ন","question":"নিচের কোন জোড়ার উভয়ই রঙিন পদার্থকে বর্ণহীন করে?","boards":"সিলেট বোর্ড ২০২৫","options":["কাপড় কাচা সোডা ও টয়লেট ক্লিনার","ব্লিচিং পাউডার ও গ্লাস ক্লিনার","টয়লেট ক্লিনার ও সাবান","ব্লিচিং পাউডার ও টয়লেট ক্লিনার"],"answerIndex":3,"explanation":"ব্লিচিং পাউডার পানির সাথে বিক্রিয়ায় HOCl তৈরি করে, যা\nভেঙে জায়মান অক্সিজেন [O] দেয়: Ca(OCl)Cl+H₂O→CaCl₂+\nHOCl; HOCl→HCl+[O]\nটয়লেট ক্লিনারে মিশ্রিত NaOCl ও পানির সাথে বিক্রিয়ায় HOCl দেয়:\nNaOCl+H₂O→NaOH+HOCl; HOCl→HCl+[O]\nএই জায়মান অক্সিজেন রঙিন পদার্থকে জারিত করে বর্ণহীন করে। কাপড় কাচা সোডা, গ্লাস ক্লিনার বা সাবান [O] তৈরি করে না। তাই সঠিক উত্তর ঘ।"},{"id":"ch12-mcq8","chapter":12,"num":8,"importance":2,"topic":"পরিষ্কার-পরিচ্ছন্নতায় রসায়ন","question":"অলিভ অয়েল থেকে নিচের কোন এসিডটি পাওয়া যায়?","boards":"রাজশাহী বোর্ড ২০২৫","options":["স্টিয়ারিক","অলিক","সাইট্রিক","ইথানয়িক"],"answerIndex":1,"explanation":"জলপাই থেকে প্রাপ্ত তেলকে অলিভ অয়েল বলে; অলিভ অয়েল থেকে অলিক এসিড পাওয়া যায়, যা একটি অসম্পৃক্ত ফ্যাটি এসিড । স্টিয়ারিক এসিড আসে প্রাণিজ চর্বি থেকে; সাইট্রিক এসিড লেবুতে, ইথানয়িক এসিড ভিনেগারে থাকে।"},{"id":"ch12-mcq9","chapter":12,"num":9,"importance":3,"topic":"পরিষ্কার-পরিচ্ছন্নতায় রসায়ন","question":"কোনটি গ্লাস ক্লিনারের মূল উপাদান?","boards":"রাজশাহী বোর্ড ২০২৪","options":["NaOH","NH₃","HOCl","Ca(OCl)Cl"],"answerIndex":1,"explanation":"গ্লাস ক্লিনার তৈরি হয় অ্যামোনিয়া গ্যাসকে পানিতে দ্রবীভূত করে প্রাপ্ত NH₄OH (অ্যামোনিয়া দ্রবণ) এর সাথে আইসোপ্রোপাইল অ্যালকোহল মিশিয়ে । তাই এর মূল উপাদান অ্যামোনিয়া (NH₃)। NaOH কাচের সিলিকেটের সাথে বিক্রিয়া করে; HOCl ও Ca(OCl)Cl বিরঞ্জক/জীবাণুনাশক ।"},{"id":"ch12-mcq10","chapter":12,"num":10,"importance":2,"topic":"পরিষ্কার-পরিচ্ছন্নতায় রসায়ন","question":"ব্লিচিং পাউডারের সংকেত কোনটি?","boards":"বরিশাল বোর্ড ২০২৪","options":["CaCl₂","Ca(OH)₂","C₆H₅OH","Ca(OCl)Cl"],"answerIndex":3,"explanation":"ব্লিচিং পাউডারের রাসায়নিক নাম ক্যালসিয়াম ক্লোরো হাইপোক্লোরাইট, সংকেত Ca(OCl)Cl। এটি Ca(OH)₂ এর মধ্যে 40°C তাপমাত্রায় Cl₂ চালনা করে তৈরি হয়। CaCl₂ ক্যালসিয়াম ক্লোরাইড, Ca(OH)₂ কলিচুন, C₆H₅OH ফেনল।"},{"id":"ch12-mcq11","chapter":12,"num":11,"importance":2,"topic":"পরিষ্কার-পরিচ্ছন্নতায় রসায়ন","question":"কাপড় কাচা সোডাতে কত অণু পানি যুক্ত থাকে?","boards":"ঢাকা বোর্ড ২০২৪","options":["24","10","7","5"],"answerIndex":1,"explanation":"সোডা অ্যাসের (Na₂CO₃) 1 অণুর সাথে 10 অণু পানি রাসায়নিকভাবে যুক্ত হলে কাপড় কাচা সোডা বা ওয়াশিং সোডা তৈরি হয়।\nNa₂CO₃+10H₂O→Na₂CO₃.10H₂O\nতাই কাপড় কাচা সোডায় 10 অণু কেলাস পানি থাকে।"},{"id":"ch12-mcq12","chapter":12,"num":12,"importance":2,"topic":"পরিষ্কার-পরিচ্ছন্নতায় রসায়ন","question":"কোনটি লবণের সংকেত?","boards":"কুমিল্লা বোর্ড ২০২৪","options":["C₁₂H₂₆O","C₄H₆O₆","C₁₀H₈","C₁₇H₃₅COONa"],"answerIndex":3,"explanation":"C₁₇H₃₅COONa হলো সোডিয়াম স্টিয়ারেট — স্টিয়ারিক এসিডের (C₁₇H₃₅COOH) সোডিয়াম লবণ, অর্থাৎ সাবান। C₁₂H₂₆O হলো লরাইল অ্যালকোহল, C₄H₆O₆ হলো টারটারিক এসিড এবং C₁₀H₈ হলো ন্যাপথালিন; এগুলোর কোনোটিই লবণ নয়।"},{"id":"ch12-mcq13","chapter":12,"num":13,"importance":2,"topic":"পরিষ্কার-পরিচ্ছন্নতায় রসায়ন","question":"কোনটি অসম্পৃক্ত ফ্যাটি এসিড?","boards":"রাজশাহী বোর্ড ২০২৪","options":["স্টিয়ারিক এসিড","অলিক এসিড","কার্বনিক এসিড","সাইট্রিক এসিড"],"answerIndex":1,"explanation":"যেসব ফ্যাটি এসিডে কার্বন-কার্বন দ্বিবন্ধন বা ত্রিবন্ধন থাকে, সেগুলো অসম্পৃক্ত ফ্যাটি এসিড । অলিভ অয়েল থেকে প্রাপ্ত অলিক এসিডে (C₁₇H₃₃COOH) একটি C=C দ্বিবন্ধন আছে, তাই এটি অসম্পৃক্ত । স্টিয়ারিক এসিড (C₁₇H₃₅COOH) সম্পৃক্ত; কার্বনিক এসিড ও সাইট্রিক এসিড ফ্যাটি এসিড নয়।"},{"id":"ch12-mcq14","chapter":12,"num":14,"importance":2,"topic":"পরিষ্কার-পরিচ্ছন্নতায় রসায়ন","question":"সোডিয়াম লরাইল সালফেট এর একটি অণুতে পরমাণুর সংখ্যা কত?","boards":"দিনাজপুর বোর্ড ২০২৪","options":["39","41","43","45"],"answerIndex":2,"explanation":"সোডিয়াম লরাইল সালফেটের সংকেত C₁₂H₂₅SO₄Na। মোট পরমাণু =C12+H25+S1+O4+Na1=43টি"},{"id":"ch12-mcq15","chapter":12,"num":15,"importance":2,"topic":"পরিষ্কার-পরিচ্ছন্নতায় রসায়ন","question":"সাবান এক ধরনের–","boards":"কুমিল্লা বোর্ড ২০২০","options":["অম্ল","ক্ষারক","এস্টার","লবণ"],"answerIndex":3,"explanation":"সাবান হলো উচ্চতর ফ্যাটি এসিডের সোডিয়াম বা পটাশিয়াম লবণ (R-COONa বা R-COOK)। ফ্যাটি এসিড (অম্ল) ও NaOH/KOH (ক্ষারক) এর অংশ মিলে সাবান গঠিত হয়, তাই সাবান এক ধরনের লবণ ।"},{"id":"ch12-mcq16","chapter":12,"num":16,"importance":2,"topic":"পরিষ্কার-পরিচ্ছন্নতায় রসায়ন","question":"গ্লাস ক্লিনারে NH₄OH এর সাথে নিম্নের কোনটি মিশ্রিত করা হয়?","boards":"যশোর বোর্ড ২০২০","options":["CH₃-CH(OH)-CH₃","CH₃-CH(OH)-CH₂(OH)","CH₂(OH)-CH(OH)-CH₂(OH)","CH₃-CH₂-CH₂-OH"],"answerIndex":0,"explanation":"অ্যামোনিয়াম হাইড্রোক্সাইড (NH₄OH) এর সাথে আইসোপ্রোপাইল অ্যালকোহল CH₃-CH(OH)-CH₃ মিশিয়ে গ্লাস ক্লিনার তৈরি করা হয়। NH₄OH কাচের তেল, চর্বি বা গ্রিজ অপসারণ করে এবং আইসোপ্রোপাইল অ্যালকোহল জৈব ময়লা দ্রবীভূত করে। গ বিকল্পটি গ্লিসারল, ঘ বিকল্পটি প্রোপান-১-অল।"},{"id":"ch12-mcq17","chapter":12,"num":17,"importance":2,"topic":"পরিষ্কার-পরিচ্ছন্নতায় রসায়ন","question":"হেবার প্রণালীতে প্রতি মোল NH₃ উৎপাদনে উৎপন্ন তাপশক্তির পরিমাণ কত?","boards":"বরিশাল বোর্ড ২০২০","options":["-92kJ","-46kJ","46kJ","92kJ"],"answerIndex":2,"explanation":"হেবার প্রণালীতে 2 মোল NH₃ উৎপন্ন হলে 92 kJ তাপ উৎপন্ন হয়। Fe, 200-250 atm, 450-550°C\nN₂(g)+3H₂(g)\u003c⟶2NH₃(g)\n+92kJ 1 মোল NH₃ উৎপাদনে উৎপন্ন তাপ =92÷2=46kJ প্রশ্নে উৎপন্ন তাপের পরিমাণ চাওয়া হয়েছে, তাই উত্তর 46 kJ (এনথালপি পরিবর্তন হিসেবে লিখলে ΔH = -46 kJ)।"},{"id":"ch12-mcq18","chapter":12,"num":18,"importance":2,"topic":"পরিষ্কার-পরিচ্ছন্নতায় রসায়ন","question":"ব্লিচিং পাউডার —\ni. কাচ পরিষ্কারক হিসেবে ব্যবহৃত হয়\nii. Ca(OH)₂ এবং Cl₂ এর বিক্রিয়ায় তৈরি\niii. পানির সাথে বিক্রিয়ায় HOCl তৈরি করে\nনিচের কোনটি সঠিক?","boards":"বরিশাল বোর্ড ২০২০","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":2,"explanation":"i. ভুল — কাচ পরিষ্কারক হলো গ্লাস ক্লিনার (NH₄OH + আইসোপ্রোপাইল অ্যালকোহল), ব্লিচিং পাউডার নয়। 40°C\nii. সঠিক — Ca(OH)₂+Cl₂⟶Ca(OCl)Cl+H₂O\niii. সঠিক — Ca(OCl)Cl+H₂O→CaCl₂+HOCl\nতাই সঠিক উত্তর গ (ii ও iii)।"},{"id":"ch12-mcq19","chapter":12,"num":19,"importance":2,"topic":"পরিষ্কার-পরিচ্ছন্নতায় রসায়ন","stemPrefix":"CaO, Δ\nCH₃COONa+NaOH⟶CH₄+A.","question":"A যৌগটি —\ni. ক্ষারীয় প্রকৃতির\nii. সোডা অ্যাস নামে পরিচিত\niii. লঘু এসিডের সাথে বিক্রিয়ায় CO₂ উৎপন্ন করে\nনিচের কোনটি সঠিক?","boards":"যশোর বোর্ড ২০২০","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":3,"explanation":"বিক্রিয়াটি হলো: CH₃COONa+NaOH⟶CH₄+\nNa₂CO₃; সুতরাং A = Na₂CO₃।\ni. সঠিক — Na₂CO₃ শক্তিশালী ক্ষার ও দুর্বল এসিডের লবণ, এর জলীয় দ্রবণ ক্ষারীয় ।\nii. সঠিক — Na₂CO₃ কে সোডা অ্যাস বলে।\niii. সঠিক — Na₂CO₃+2HCl→2NaCl+H₂O+CO₂"},{"id":"ch12-mcq20","chapter":12,"num":20,"importance":2,"topic":"পরিষ্কার-পরিচ্ছন্নতায় রসায়ন","stemPrefix":"40°C\nCa(OH)₂+Cl₂⟶B+H₂O","question":"উদ্দীপকের B যৌগটি —\ni. টয়লেট ক্লিনারের মূল উপাদান\nii. জীবাণুনাশক\niii. বিরঞ্জক পদার্থ\nনিচের কোনটি সঠিক?","boards":"চট্টগ্রাম বোর্ড ২০২০","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":2,"explanation":"Ca(OH)₂+Cl₂⟶Ca(OCl)Cl+H₂O; সুতরাং B = ব্লিচিং পাউডার, Ca(OCl)Cl।\ni. ভুল — টয়লেট ক্লিনারের মূল উপাদান HCl। ii ও iii. সঠিক — পানির সাথে বিক্রিয়ায় HOCl ও পরে জায়মান অক্সিজেন [O] তৈরি করে, যা জীবাণু ধ্বংস করে এবং রঙিন পদার্থকে বর্ণহীন করে।"},{"id":"ch12-mcq21","chapter":12,"num":21,"importance":2,"topic":"কৃষি ও শিল্পক্ষেত্রে রসায়ন","question":"কোনটি অনুমোদিত ফুড প্রিজারভেটিভ?","boards":"চট্টগ্রাম বোর্ড ২০২৫","options":["ইথিলিন","বেনজোয়িক এসিড","অ্যাসিটিক এসিড","কার্বাইড"],"answerIndex":1,"explanation":"সোডিয়াম বেনজোয়েট, বেনজোয়িক এসিড, ভিনেগার, লবণ ও চিনির দ্রবণ WHO অনুমোদিত ফুড প্রিজারভেটিভ । ইথিলিন ও কার্বাইড (অ্যাসিটিলিন উৎপন্ন করে) অননুমোদিত । তাই সঠিক উত্তর বেনজোয়িক এসিড ।"},{"id":"ch12-mcq22","chapter":12,"num":22,"importance":2,"topic":"কৃষি ও শিল্পক্ষেত্রে রসায়ন","question":"কোনটি অননুমোদিত ফুড প্রিজারভেটিভ?","boards":"সিলেট বোর্ড ২০২৫","options":["ইথিলিন","চিনির জলীয় দ্রবণ","সোডিয়াম বেনজোয়েট","বেনজোয়িক এসিড"],"answerIndex":0,"explanation":"ইথিলিন দিয়ে কাঁচা ফল পাকানো হয় এবং এটি শরীরের উপর বিরূপ প্রভাব ফেলে, তাই এটি অননুমোদিত ফুড প্রিজারভেটিভ । চিনির দ্রবণ, সোডিয়াম বেনজোয়েট ও বেনজোয়িক এসিড অনুমোদিত ।"},{"id":"ch12-mcq23","chapter":12,"num":23,"importance":2,"topic":"কৃষি ও শিল্পক্ষেত্রে রসায়ন","question":"ইউরিয়া পানিতে বিয়োজিত হয়ে উৎপন্ন করে—\ni. NH₄⁺ii.OH⁻iii.CO₂\nনিচের কোনটি সঠিক?","boards":"বরিশাল বোর্ড ২০২৫","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":3,"explanation":"মাটিতে ইউরিয়েজ এনজাইমের উপস্থিতিতে ইউরিয়া পানির সাথে বিক্রিয়া করে: ইউরিয়েজ এনজাইম+\nNH₂-CO-NH₂+3H₂O⟶2NH₄+2OH⁻\n+CO₂\ni. NH₄⁺ উৎপন্ন হয়— সঠিক । ii. OH⁻ উৎপন্ন হয়— সঠিক । iii. CO₂ উৎপন্ন হয়— সঠিক ।"},{"id":"ch12-mcq24","chapter":12,"num":24,"importance":2,"topic":"কৃষি ও শিল্পক্ষেত্রে রসায়ন","question":"নিচের কোনটি ইউরিয়ার সংকেত?","boards":"যশোর বোর্ড ২০২৪","options":["NH₄CNO","NH₄CN","(NH₂)₂CO","(NH₄)₂CO"],"answerIndex":2,"explanation":"ইউরিয়ার গাঠনিক সংকেত NH₂-CO-NH₂, অর্থাৎ আণবিক সংকেত (NH₂)₂CO বা CO(NH₂)₂। NH₄CNO হলো অ্যামোনিয়াম সায়ানেট (ইউরিয়ার সমাণু), NH₄CN হলো অ্যামোনিয়াম সায়ানাইড । অ্যামোনিয়াম কার্বামেটের সংকেত NH₂COONH₄, যা ইউরিয়া প্রস্তুতির মধ্যবর্তী যৌগ।"},{"id":"ch12-mcq25","chapter":12,"num":25,"importance":2,"topic":"কৃষি ও শিল্পক্ষেত্রে রসায়ন","question":"মাটিতে H⁺ এর পরিমাণ বেড়ে গেলে কোনটি প্রয়োগ করতে হবে?","boards":"চট্টগ্রাম বোর্ড ২০২৪","options":["CaCO₃","CaCl₂","NH₄Cl","(NH₄)₂SO₄"],"answerIndex":0,"explanation":"মাটিতে H⁺ বেড়ে গেলে মাটি অম্লীয় হয়। চুনাপাথর H⁺ এর সাথে বিক্রিয়া করে অম্লত্ব কমায় ।\nCaCO₃+2H⁺→Ca²⁺+CO₂+H₂O\n(NH₄)₂SO₄ ও NH₄Cl এর দ্রবণ অম্লধর্মী, এগুলো অম্লত্ব আরও বাড়াবে; CaCl₂ নিরপেক্ষ লবণ।"},{"id":"ch12-mcq26","chapter":12,"num":26,"importance":2,"topic":"কৃষি ও শিল্পক্ষেত্রে রসায়ন","question":"ইউরিয়ার গাঠনিক সংকেত কোনটি?","boards":"ময়মনসিংহ বোর্ড ২০২৪","options":["(H)₂N-C=O-N(H)₂","(H)₂N=C=O-N(H)₂","(H)₂N-C(=O)-N(H)₂","(H)₂N-C-O-N(H)₂"],"answerIndex":2,"explanation":"ইউরিয়ার সংকেত NH₂-CO-NH₂। কেন্দ্রীয় C পরমাণু O এর সাথে দ্বিবন্ধনে (C=O) এবং দুই পাশের দুটি N এর সাথে একক বন্ধনে যুক্ত; প্রতিটি N এর সাথে দুটি H থাকে। এতে C এর যোজনী 4, N এর 3 ও O এর 2 পূর্ণ হয়। অন্য অপশনগুলোতে যোজনী মেলে না।"},{"id":"ch12-mcq27","chapter":12,"num":27,"importance":2,"topic":"কৃষি ও শিল্পক্ষেত্রে রসায়ন","question":"ফল পাকাতে ব্যবহৃত হয় কোনটি?","boards":"কুমিল্লা বোর্ড ২০২০","options":["ফরমালিন","অ্যাসিটিলিন","সোডিয়াম বেনজোয়েট","কস্টিক সোডা"],"answerIndex":1,"explanation":"ক্যালসিয়াম কার্বাইডে (CaC₂) পানি যোগ করলে অ্যাসিটিলিন গ্যাস উৎপন্ন হয়, যা কাঁচা ফল পাকাতে সাহায্য করে।\nCaC₂+2H₂O→C₂H₂+Ca(OH)₂\n\"কার্বাইড দিয়ে আম পাকানো\" মানে অ্যাসিটিলিন দিয়ে পাকানো । ফরমালিন ও সোডিয়াম বেনজোয়েট সংরক্ষণে ব্যবহৃত হয়, ফল পাকাতে নয়।"}],"sqs":[{"id":"ch1-sq1","chapter":1,"num":1,"importance":3,"topic":"রসায়ন পরিচিতি","question":"রসায়ন কাকে বলে?","boards":"ঢাকা বোর্ড ২০২৫; বরিশাল বোর্ড ২০২২","answer":"বিজ্ঞানের যে শাখায় পদার্থের গঠন, পদার্থের ধর্ম এবং পদার্থের পারস্পরিক রূপান্তর ইত্যাদি নিয়ে আলোচনা করা হয় তাকে রসায়ন বলে।"},{"id":"ch1-sq2","chapter":1,"num":2,"importance":2,"topic":"রসায়ন পরিচিতি","question":"ব্রোঞ্জ কী?","boards":"চট্টগ্রাম বোর্ড ২০২৩","answer":"কপার (Cu) ও টিন (Sn) ধাতুকে গলিয়ে মিশিয়ে ঠান্ডা করে প্রাপ্ত কঠিন সংকর ধাতুকে ব্রোঞ্জ বলে। এতে সাধারণত 90% কপার ও 10% টিন থাকে।"},{"id":"ch1-sq3","chapter":1,"num":3,"importance":2,"topic":"রসায়ন পরিচিতি","question":"ব্রোঞ্জ একটি সংকর ধাতু– ব্যাখ্যা কর।","boards":"সিলেট বোর্ড ২০২২","answer":"একটি গলিত ধাতুর সাথে অন্য গলিত ধাতু মিশিয়ে মিশ্রণকে ঠান্ডা করলে যে কঠিন পদার্থ পাওয়া যায় তাকে সংকর ধাতু বলে । ব্রোঞ্জ তৈরিতে কপার ও টিনকে গলিয়ে তরলে পরিণত করে একত্রে মেশানো হয়, এরপর মিশ্রণকে ঠান্ডা করে কঠিন পদার্থ পাওয়া যায়। ব্রোঞ্জে সাধারণত 90% কপার ও 10% টিন থাকে। দুটি ধাতুর গলিত মিশ্রণ থেকে তৈরি বলে ব্রোঞ্জ একটি সংকর ধাতু।"},{"id":"ch1-sq4","chapter":1,"num":4,"importance":3,"topic":"রসায়নের পরিধি বা ক্ষেত্রসমূহ","question":"কাঁচা আম পাকলে মিষ্টি স্বাদযুক্ত হয় কেন? ব্যাখ্যা কর।","boards":"কুমিল্লা বোর্ড ২০২৫; চট্টগ্রাম বোর্ড ২০২৫; ঢাকা বোর্ড ২০২৪","answer":"কাঁচা আমে বিভিন্ন জৈব এসিড (সাক্সিনিক এসিড, ম্যালেয়িক এসিড প্রভৃতি) থাকে, তাই কাঁচা আম টক লাগে। আম পাকার সময় এই এসিডগুলোর রাসায়নিক পরিবর্তন ঘটে গ্লুকোজ ও ফ্রুক্টোজ তৈরি হয়। গ্লুকোজ ও ফ্রুক্টোজ মিষ্টি স্বাদের, তাই পাকা আম খেতে মিষ্টি লাগে।"},{"id":"ch1-sq5","chapter":1,"num":5,"importance":3,"topic":"রসায়নের পরিধি বা ক্ষেত্রসমূহ","question":"কাঁচা আম পাকলে মিষ্টি স্বাদযুক্ত হয় কেন? ব্যাখ্যা কর।","boards":"কুমিল্লা বোর্ড ২০২৫; ঢাকা বোর্ড ২০২৪","answer":"কাঁচা আমে সাক্সিনিক এসিড, ম্যালেয়িক এসিড প্রভৃতি জৈব এসিড থাকায় এটি টক। আম পাকলে এসিডগুলো রাসায়নিক পরিবর্তনের মাধ্যমে মিষ্টি স্বাদের গ্লুকোজ ও ফ্রুক্টোজে পরিণত হয়। তাই কাঁচা আম পাকলে মিষ্টি স্বাদযুক্ত হয়।"},{"id":"ch1-sq6","chapter":1,"num":6,"importance":2,"topic":"রসায়নের সাথে বিজ্ঞানের অন্যান্য শাখার সম্পর্ক","question":"সালোকসংশ্লেষণ মূলত একটি রাসায়নিক বিক্রিয়া – ব্যাখ্যা কর।","boards":"চট্টগ্রাম বোর্ড ২০২২","answer":"রাসায়নিক বিক্রিয়ায় সম্পূর্ণ নতুন ধর্মবিশিষ্ট পদার্থ তৈরি হয়। সালোকসংশ্লেষণে উদ্ভিদ বাতাসের CO₂ ও মূল দিয়ে শোষিত পানিকে সূর্যালোকের উপস্থিতিতে ক্লোরোফিলের সাহায্যে যুক্ত করে নতুন পদার্থ গ্লুকোজ ও অক্সিজেন তৈরি করে। সূর্যালোক , ক্লোরোফিল\n6CO₂+6H₂O⟶C₆H₁₂O₆+6O₂\nউৎপন্ন গ্লুকোজ ও O₂ এর ধর্ম বিক্রিয়ক CO₂ ও H₂O থেকে সম্পূর্ণ ভিন্ন। তাই সালোকসংশ্লেষণ মূলত একটি রাসায়নিক বিক্রিয়া ।"},{"id":"ch1-sq7","chapter":1,"num":7,"importance":2,"topic":"রসায়ন পাঠের গুরুত্ব","question":"চাষাবাদ কিংবা খাদ্যের জন্য আমরা রসায়নের উপর নির্ভর করি – ব্যাখ্যা কর।","boards":"চট্টগ্রাম বোর্ড ২০২৩","answer":"জমিকে উর্বর করতে রাসায়নিক সার, ফসলকে পোকামাকড় থেকে রক্ষা করতে কীটনাশক এবং খাদ্যকে দীর্ঘদিন সংরক্ষণ করতে প্রিজারভেটিভস ব্যবহার করা হয়। এসব পদার্থ রসায়নের জ্ঞান দিয়েই তৈরি । তাই চাষাবাদ ও খাদ্যের জন্য আমরা রসায়নের উপর নির্ভরশীল ।"},{"id":"ch1-sq8","chapter":1,"num":8,"importance":2,"topic":"রসায়ন পাঠের গুরুত্ব","question":"এন্টাসিড জাতীয় পদার্থ পাকস্থলীর এসিডিটি কীরূপে নিয়ন্ত্রণ করে? ব্যাখ্যা কর।","boards":"রাজশাহী বোর্ড ২০২২","answer":"পাকস্থলীতে হাইড্রোক্লোরিক এসিড (HCl) বেশি তৈরি হলে পেটে জ্বালাপোড়া ও অস্বস্তি হয়, একে এসিডিটি বলে। এন্টাসিডে Al(OH)₃ ও Mg(OH)₂ জাতীয় ক্ষারক থাকে, যা অতিরিক্ত HCl কে প্রশমিত করে লবণ ও পানিতে পরিণত করে । ফলে এসিডিটি কমে যায়।\nAl(OH)₃+3HCl→AlCl₃+3H₂O\nMg(OH)₂+2HCl→MgCl₂+2H₂O"},{"id":"ch1-sq9","chapter":1,"num":9,"importance":2,"topic":"রসায়ন পাঠের গুরুত্ব","question":"ফসল উৎপাদনে রাসায়নিক সারের প্রভাব ব্যাখ্যা কর।","boards":"যশোর বোর্ড ২০২২","answer":"রাসায়নিক সার মাটিতে উদ্ভিদের প্রয়োজনীয় পুষ্টি উপাদান (N, P, K ইত্যাদি) সরবরাহ করে জমির উর্বরতা ও ফসলের উৎপাদন বাড়ায় । যেমন— ইউরিয়া সার মাটিতে ইউরিয়েজ এনজাইমের উপস্থিতিতে পানির সাথে বিক্রিয়া করে অ্যামোনিয়াম আয়ন (NH₄+) তৈরি করে, যা উদ্ভিদ মূলের মাধ্যমে শোষণ করে নাইট্রোজেন পায়। ইউরিয়েজ\nCO(NH₂)₂+2H₂O⟶(NH₄)₂CO₃\nমাটির অম্লত্ব বাড়লে ক্ষারধর্মী সার এবং ক্ষারকত্ব বাড়লে অম্লধর্মী সার ব্যবহার করে মাটির pH ঠিক রাখা হয়।"},{"id":"ch1-sq10","chapter":1,"num":10,"importance":3,"topic":"রসায়নে অনুসন্ধান বা গবেষণা প্রক্রিয়া","question":"গবেষণা কী?","boards":"ময়মনসিংহ বোর্ড ২০২৫; চট্টগ্রাম বোর্ড ২০২৪","answer":"সঠিক পদ্ধতিতে পরীক্ষা-নিরীক্ষার মাধ্যমে অজানা কোনো কিছু জানার চেষ্টাকে গবেষণা বলে। যিনি গবেষণা করেন তিনি বিজ্ঞানী।"},{"id":"ch2-sq1","chapter":2,"num":1,"importance":3,"topic":"কণার গতিতত্ত্ব","question":"কণার গতিতত্ত্ব কী? ব্যাখ্যা কর।","boards":"যশোর বোর্ড ২০২৫; ময়মনসিংহ বোর্ড ২০২৩","answer":"আন্তঃকণা আকর্ষণ শক্তি এবং কণাগুলোর গতিশক্তি দিয়ে পদার্থের কঠিন, তরল ও গ্যাসীয় অবস্থা ব্যাখ্যা করার তত্ত্বকে কণার গতিতত্ত্ব বলে। কঠিনে আন্তঃকণা আকর্ষণ খুব বেশি, কণাগুলো খুব কাছাকাছি থাকে এবং অবস্থান বদলাতে পারে না। তাপ দিলে আকর্ষণ কমে ও কণাগুলো কিছুটা গতিশক্তি পায় — তরল অবস্থা । আরও তাপ দিলে গতিশক্তি এত বাড়ে যে কণাগুলো আকর্ষণ থেকে প্রায় মুক্ত হয়ে বিক্ষিপ্তভাবে ছোটে — গ্যাসীয় অবস্থা ।"},{"id":"ch2-sq2","chapter":2,"num":2,"importance":2,"topic":"ব্যাপন","question":"কঠিন পদার্থের ব্যাপন হার কম কেন? ব্যাখ্যা কর।","boards":"সিলেট বোর্ড ২০২৫","answer":"কঠিন, তরল ও বায়বীয় মাধ্যমে কোনো পদার্থের কণাসমূহের স্বতঃস্ফূর্ত ও সমানভাবে ছড়িয়ে পড়ার প্রক্রিয়াকে ব্যাপন বলে। যেমন: পানিতে KMnO₄ দানা দিলে গোলাপি রং পুরো পানিতে ছড়িয়ে পড়ে । কঠিন পদার্থের কণাগুলো শক্তিশালী আন্তঃআণবিক আকর্ষণ বলে নির্দিষ্ট অবস্থানে আবদ্ধ থাকে এবং এদের গতিশক্তি খুব কম। তাই কণাগুলো সহজে মুক্ত হয়ে ছড়িয়ে পড়তে পারে না; ফলে কঠিন পদার্থের ব্যাপন হার কম।"},{"id":"ch2-sq3","chapter":2,"num":3,"importance":2,"topic":"ব্যাপন","question":"ব্যাপন একটি স্বতঃস্ফূর্ত প্রক্রিয়া –ব্যাখ্যা কর।","boards":"বরিশাল বোর্ড ২০২৪","answer":"ব্যাপনে কণাগুলো উচ্চ ঘনমাত্রার স্থান থেকে নিম্ন ঘনমাত্রার স্থানের দিকে কোনো বাহ্যিক বল বা শক্তি প্রয়োগ ছাড়াই নিজে নিজে ছড়িয়ে পড়ে এবং পুরো মাধ্যমে ঘনমাত্রা সমান না হওয়া পর্যন্ত চলতে থাকে।\nযেমন: ঘরের এক কোণে সুগন্ধির শিশির মুখ খুলে রাখলে কিছুক্ষণের মধ্যে সারা ঘরে নিজে নিজেই সুগন্ধ ছড়িয়ে পড়ে । তাই ব্যাপন একটি স্বতঃস্ফূর্ত প্রক্রিয়া ।"},{"id":"ch2-sq4","chapter":2,"num":4,"importance":3,"topic":"নিঃসরণ","question":"বডি স্প্রে ব্যবহারের সময় ব্যাপন এবং নিঃসরণের মধ্যে কোনটি আগে ঘটে?","boards":"ময়মনসিংহ বোর্ড ২০২৫; সিলেট বোর্ড ২০২৩","answer":"বডি স্প্রেতে আগে নিঃসরণ ঘটে, পরে ব্যাপন ঘটে। স্প্রে করার সময় চাপের ফলে গ্যাসের কণাগুলো সরু ছিদ্রপথ দিয়ে পারস্পরিক সংঘর্ষ ছাড়াই একে একে বের হয়ে আসে — এটি নিঃসরণ । এরপর বের হয়ে আসা সুগন্ধি অণুগুলো বাতাসে স্বতঃস্ফূর্তভাবে চারদিকে ছড়িয়ে পড়ে — এটি ব্যাপন । তাই বডি স্প্রেতে আগে নিঃসরণ, পরে ব্যাপন ।"},{"id":"ch2-sq5","chapter":2,"num":5,"importance":2,"topic":"নিঃসরণ","question":"নিঃসরণ ও ব্যাপন দুটি ভিন্ন প্রক্রিয়া কেন?","boards":"ঢাকা বোর্ড ২০২৩","answer":"নিঃসরণে গ্যাসের কণা সরু ছিদ্রপথ দিয়ে পারস্পরিক সংঘর্ষ ছাড়াই একে একে বাইরে বের হয়; এর জন্য ছিদ্র আবশ্যক এবং এটি কেবল গ্যাসে ঘটে। অপরদিকে ব্যাপনে কঠিন, তরল বা বায়বীয় মাধ্যমে কোনো পদার্থের কণা অধিক ঘনমাত্রা থেকে কম ঘনমাত্রার দিকে স্বতঃস্ফূর্ত ও সমানভাবে ছড়িয়ে পড়ে; এতে কোনো ছিদ্রের প্রয়োজন হয় না। প্রক্রিয়ার ধরন, শর্ত ও মাধ্যম ভিন্ন বলে নিঃসরণ ও ব্যাপন দুটি ভিন্ন প্রক্রিয়া ।"},{"id":"ch2-sq6","chapter":2,"num":6,"importance":3,"topic":"মোমবাতির প্রজ্বলন এবং মোমের তিন অবস্থা","question":"মোমের দহনে কী ধরনের পরিবর্তন ঘটে? ব্যাখ্যা কর।","boards":"ঢাকা বোর্ড ২০২৪; বরিশাল বোর্ড ২০২২","answer":"মোমের দহনে রাসায়নিক পরিবর্তন ঘটে। মোম হাইড্রোকার্বনের মিশ্রণ; সুতার মাথায় বাষ্পীয় মোম বাতাসের অক্সিজেনের সাথে বিক্রিয়া করে নতুন পদার্থ CO₂ ও জলীয় বাষ্প এবং আলো ও তাপ উৎপন্ন করে । দহন\nমোম+O₂⟶CO₂+H₂O+তাপ+আলো\nউৎপন্ন পদার্থ থেকে মোম আর ফিরে পাওয়া যায় না, তাই এটি রাসায়নিক পরিবর্তন ।"},{"id":"ch2-sq7","chapter":2,"num":7,"importance":2,"topic":"মোমবাতির প্রজ্বলন এবং মোমের তিন অবস্থা","question":"মোমের গলন কোন ধরনের পরিবর্তন? ব্যাখ্যা কর।","boards":"সিলেট বোর্ড ২০২৪","answer":"মোমের গলন একটি ভৌত পরিবর্তন । তাপ দিলে মোমের হাইড্রোকার্বন অণুগুলো কঠিন থেকে তরল অবস্থায় পরিণত হয়, কিন্তু কোনো নতুন পদার্থ তৈরি হয় না। তরল মোম ঠান্ডা করলে আবার কঠিন মোম ফিরে পাওয়া যায় এবং এর রাসায়নিক সংযুতি অপরিবর্তিত থাকে। তাই মোমের গলন ভৌত পরিবর্তন ।"},{"id":"ch2-sq8","chapter":2,"num":8,"importance":2,"topic":"গলন ও স্ফুটন","question":"পানির গলনাংক ও স্ফুটনাঙ্ক ভিন্ন কেন?","boards":"বরিশাল বোর্ড ২০২২","answer":"1 atm চাপে বরফ 0°C এ গলে পানি হয়, তাই পানির গলনাঙ্ক 0°C; আর পানি 100°C এ ফুটে জলীয় বাষ্প হয়, তাই স্ফুটনাঙ্ক 100°C। বরফ গলাতে পানির অণুগুলোর আকর্ষণ কিছুটা কমালেই চলে, কিন্তু বাষ্প হতে অণুগুলোকে আকর্ষণ সম্পূর্ণ কাটিয়ে মুক্ত হতে হয়, যার জন্য বেশি গতিশক্তি ও বেশি তাপ লাগে। তাই পানির গলনাঙ্ক ও স্ফুটনাঙ্ক ভিন্ন।"},{"id":"ch2-sq9","chapter":2,"num":9,"importance":3,"topic":"পাতন এবং ঊর্ধ্বপাতন","question":"নিশাদল একটি উর্ধ্বপাতিত পদার্থ – ব্যাখ্যা কর।","boards":"দিনাজপুর বোর্ড ২০২৪, ২০২২; ঢাকা বোর্ড ২০২২; কুমিল্লা বোর্ড ২০২২; যশোর বোর্ড ২০২২, ২০২০","answer":"যেসব কঠিন পদার্থ তাপে তরল না হয়ে সরাসরি বাষ্পে পরিণত হয় এবং শীতল করলে বাষ্প থেকে সরাসরি কঠিনে ফিরে আসে, তাদের ঊর্ধ্বপাতিত পদার্থ বলে। কঠিন নিশাদলে (NH₄Cl) তাপ দিলে এটি তরল না হয়ে সরাসরি বাষ্পে পরিণত হয় এবং ঠান্ডা করলে বাষ্প আবার সরাসরি কঠিন নিশাদলে পরিণত হয়। তাই নিশাদল একটি ঊর্ধ্বপাতিত পদার্থ ।"},{"id":"ch2-sq10","chapter":2,"num":10,"importance":3,"topic":"পাতন এবং ঊর্ধ্বপাতন","question":"(C₁₀H₈) একটি উর্ধ্বপাতিত পদার্থ – ব্যাখ্যা কর।","boards":"কুমিল্লা বোর্ড ২০২৩; বরিশাল বোর্ড ২০২৩; সিলেট বোর্ড ২০২০; দিনাজপুর বোর্ড ২০২০","answer":"সাধারণ তাপমাত্রায় ন্যাপথলিন (C₁₀H₈) একটি কঠিন পদার্থ ।\nতাপ প্রয়োগ করলে এটি তরল না হয়ে সরাসরি বাষ্পে পরিণত হয় এবং শীতল করলে বাষ্প থেকে সরাসরি কঠিন অবস্থায় ফিরে আসে। তাই ন্যাপথলিন (C₁₀H₈) একটি ঊর্ধ্বপাতিত পদার্থ ।"},{"id":"ch2-sq11","chapter":2,"num":11,"importance":3,"topic":"পাতন এবং ঊর্ধ্বপাতন","question":"কঠিন আয়োডিন একটি উর্ধ্বপাতিত পদার্থ- ব্যাখ্যা কর।","boards":"রাজশাহী বোর্ড ২০২২; বরিশাল বোর্ড ২০২০","answer":"যেসব পদার্থ তাপে কঠিন থেকে সরাসরি বাষ্পে এবং শীতলীকরণে বাষ্প থেকে সরাসরি কঠিনে ফিরে আসে, তাদের ঊর্ধ্বপাতিত পদার্থ বলে। সাধারণ তাপমাত্রায় আয়োডিন কঠিন । তাপ প্রয়োগে এটি তরল না হয়ে সরাসরি বেগুনি বাষ্পে পরিণত হয় এবং ঠান্ডা করলে সরাসরি কঠিন আয়োডিনে ফিরে আসে। তাই কঠিন আয়োডিন একটি ঊর্ধ্বপাতিত পদার্থ ।"},{"id":"ch2-sq12","chapter":2,"num":12,"importance":3,"topic":"পাতন এবং ঊর্ধ্বপাতন","question":"আয়োডিনকে তরল অবস্থায় পাওয়া যায় না কেন? ব্যাখ্যা করো।","boards":"ঢাকা বোর্ড ২০২৫","answer":"আয়োডিন (I₂) একটি উদ্বায়ী বা ঊর্ধ্বপাতিত পদার্থ । সাধারণ তাপমাত্রায় এটি কঠিন অবস্থায় থাকে।\nতাপ দিলে কঠিন আয়োডিন তরল না হয়ে সরাসরি বাষ্পে পরিণত হয়, আবার শীতল করলে বাষ্প থেকে সরাসরি কঠিন আয়োডিনে ফিরে আসে। কোনো ধাপেই তরল অবস্থা তৈরি হয় না, তাই আয়োডিনকে তরল অবস্থায় পাওয়া যায় না।"},{"id":"ch2-sq13","chapter":2,"num":13,"importance":3,"topic":"পাতন এবং ঊর্ধ্বপাতন","question":"আয়োডিনের তরল অবস্থা নেই–ব্যাখ্যা কর।","boards":"ঢাকা বোর্ড ২০২৫","answer":"আয়োডিন (I₂) একটি ঊর্ধ্বপাতিত পদার্থ; সাধারণ তাপমাত্রায় এটি কঠিন ।\nতাপ প্রয়োগে কঠিন I₂ সরাসরি বাষ্পে পরিণত হয় এবং শীতলীকরণে বাষ্প থেকে সরাসরি কঠিনে ফিরে আসে। মাঝখানে তরল অবস্থা সৃষ্টি হয় না বলে আয়োডিনের তরল অবস্থা নেই, অর্থাৎ I₂ কে তরল অবস্থায় পাওয়া সম্ভব নয়।"},{"id":"ch2-sq14","chapter":2,"num":14,"importance":2,"topic":"পাতন এবং ঊর্ধ্বপাতন","question":"পাতন এবং ঊর্ধ্বপাতন ব্যাখ্যা কর।","boards":"যশোর বোর্ড ২০২৫","answer":"পাতন: কোনো তরলকে তাপ দিয়ে বাষ্পে পরিণত করে পুনরায় শীতল করে তরলে পরিণত করার পদ্ধতিকে পাতন বলে। পাতন = বাষ্পীভবন + ঘনীভবন । ঊর্ধ্বপাতন: যে প্রক্রিয়ায় কোনো কঠিন পদার্থে তাপ দিলে তা তরলে পরিণত না হয়ে সরাসরি বাষ্পে পরিণত হয়, তাকে ঊর্ধ্বপাতন বলে।\nযেমন– নিশাদল (NH₄Cl), কর্পূর (C₁₀H₁₆O), ন্যাপথলিন (C₁₀H₈), কঠিন CO₂, আয়োডিন (I₂) ও AlCl₃। এদের উদ্বায়ী পদার্থ বলা হয়।"},{"id":"ch3-sq1","chapter":3,"num":1,"importance":3,"topic":"সংকেত","question":"HNO₃ এর তাৎপর্য লেখ।","boards":"রাজশাহী বোর্ড ২০২৬","answer":"HNO₃ সংকেতটি দ্বারা নিচের বিষয়গুলো বোঝায়:\n১. নাইট্রিক এসিড নামক যৌগ এবং এর একটি অণু।\n২. এটি H, N ও O তিনটি মৌল দ্বারা গঠিত ।\n৩. এর একটি অণুতে 1টি H, 1টি N ও 3টি O পরমাণু আছে।\n৪. এর আণবিক ভর =1+14+(16×3)=63।\n৫. এক মোল HNO₃ এর ভর 63 g এবং এতে 6.02 × 10²³ টি অণু থাকে।"},{"id":"ch3-sq2","chapter":3,"num":2,"importance":2,"topic":"সংকেত","question":"Cl₂ এবং 2Cl এর মধ্যে পার্থক্য লেখ।","boards":"সিলেট বোর্ড ২০২৩","answer":"Cl₂ দ্বারা ক্লোরিনের একটি অণু বোঝায়; এতে দুটি Cl পরমাণু রাসায়নিক বন্ধনের মাধ্যমে যুক্ত থাকে এবং অণুটি স্বাধীনভাবে থাকতে পারে। অপরদিকে 2Cl দ্বারা ক্লোরিনের দুটি বিচ্ছিন্ন পরমাণু বোঝায়; এরা বন্ধনে যুক্ত হয়ে অণু গঠন করেনি ।"},{"id":"ch3-sq3","chapter":3,"num":3,"importance":2,"topic":"সংকেত","question":"2N ও N₂ বলতে কী বোঝায়? ব্যাখ্যা কর।","boards":"দিনাজপুর বোর্ড ২০২১","answer":"2N দ্বারা নাইট্রোজেনের দুটি বিচ্ছিন্ন পরমাণু বোঝায়, যারা পরস্পর বন্ধনে যুক্ত নয়। অপরদিকে দুটি নাইট্রোজেন পরমাণু রাসায়নিক বন্ধনের মাধ্যমে যুক্ত হয়ে নাইট্রোজেন অণু গঠন করে, যার সংকেত N₂। অর্থাৎ N₂ দ্বারা নাইট্রোজেনের 1টি অণু বোঝায়, যা স্বাধীনভাবে থাকতে পারে।"},{"id":"ch3-sq4","chapter":3,"num":4,"importance":3,"topic":"পরমাণুর সাংগঠনিক কণা","question":"সোডিয়াম এর ভরসংখ্যা 23 –ব্যাখ্যা কর।","boards":"সিলেট বোর্ড ২০২৪; যশোর বোর্ড ২০২১","answer":"কোনো পরমাণুর নিউক্লিয়াসে উপস্থিত প্রোটন ও নিউট্রন সংখ্যার যোগফলকে ভরসংখ্যা বলে। সোডিয়ামের ভরসংখ্যা 23 বলতে বোঝায়, Na পরমাণুর নিউক্লিয়াসে প্রোটন ও নিউট্রনের মোট সংখ্যা 23। Na-এর প্রোটন 11টি, তাই নিউট্রন 23-11=12টি।"},{"id":"ch3-sq5","chapter":3,"num":5,"importance":2,"topic":"পরমাণুর সাংগঠনিক কণা","question":"(16,8)O²⁻ বলতে কী বোঝায়? ব্যাখ্যা কর।","boards":"সিলেট বোর্ড ২০২৫","answer":"(16,8)O²⁻ প্রতীক দ্বারা অক্সিজেনের অক্সাইড আয়ন বোঝায় । এখানে নিচের সংখ্যা 8 পারমাণবিক সংখ্যা এবং উপরের সংখ্যা 16 ভর সংখ্যা নির্দেশ করে। এ থেকে জানা যায়—\n• এটি 2 একক ঋণাত্মক আধানযুক্ত আয়ন (অক্সাইড আয়ন)।\n• প্রোটন সংখ্যা = 8; নিউট্রন সংখ্যা = 16 – 8 = 8।\n• পরমাণুটি 2টি ইলেকট্রন গ্রহণ করেছে, তাই ইলেকট্রন সংখ্যা =8+ 2=10।"},{"id":"ch3-sq6","chapter":3,"num":6,"importance":2,"topic":"পরমাণুর সাংগঠনিক কণা","question":"অ্যালুমিনিয়ামের পারমাণবিক সংখ্যা 13 বলতে কী বোঝায়?","boards":"চট্টগ্রাম বোর্ড ২০২৫","answer":"কোনো মৌলের পরমাণুর নিউক্লিয়াসে উপস্থিত প্রোটন সংখ্যাকে ঐ মৌলের পারমাণবিক সংখ্যা (Z) বলে। অ্যালুমিনিয়ামের পারমাণবিক সংখ্যা 13 বলতে বোঝায়, Al পরমাণুর নিউক্লিয়াসে 13টি প্রোটন আছে; নিরপেক্ষ Al পরমাণুতে ইলেকট্রনও 13টি।"},{"id":"ch3-sq7","chapter":3,"num":7,"importance":2,"topic":"পরমাণুর সাংগঠনিক কণা","question":"পরমাণু সামগ্রিকভাবে চার্জ শূন্য কেন? ব্যাখ্যা কর।","boards":"কুমিল্লা বোর্ড ২০২৩","answer":"পরমাণুর নিউক্লিয়াসে ধনাত্মক আধানযুক্ত প্রোটন ও আধানহীন নিউট্রন থাকে এবং নিউক্লিয়াসের বাইরে ঋণাত্মক আধানযুক্ত ইলেকট্রন ঘোরে । প্রোটন ও ইলেকট্রনের আধান সমান কিন্তু বিপরীত (+1.60 × 10⁻¹⁹ C ও -1.60 × 10⁻¹⁹ C), এবং পরমাণুতে প্রোটন ও ইলেকট্রনের সংখ্যা সমান । ফলে এদের আধান পরস্পরকে প্রশমিত করে, তাই পরমাণু সামগ্রিকভাবে চার্জ নিরপেক্ষ।"},{"id":"ch3-sq8","chapter":3,"num":8,"importance":2,"topic":"পরমাণুর সাংগঠনিক কণা","question":"নাইট্রোজেন পরমাণুর আসল পরিচয় তার পারমাণবিক সংখ্যা— ব্যাখ্যা কর।","boards":"ঢাকা বোর্ড ২০২৩","answer":"কোনো মৌলের পরমাণুর নিউক্লিয়াসে অবস্থিত প্রোটনের সংখ্যাকে ঐ মৌলের পারমাণবিক সংখ্যা বলে। প্রতিটি মৌলের পারমাণবিক সংখ্যা নির্দিষ্ট; দুটি ভিন্ন মৌলের পারমাণবিক সংখ্যা কখনো একই হয় না। নাইট্রোজেনের পারমাণবিক সংখ্যা 7, অর্থাৎ এর নিউক্লিয়াসে 7টি প্রোটন আছে। যে পরমাণুর নিউক্লিয়াসে 7টি প্রোটন থাকবে সেটি অবশ্যই নাইট্রোজেন; নিউট্রন সংখ্যা ভিন্ন হলেও (যেমন 14N, 15N আইসোটোপ) পারমাণবিক সংখ্যা 7-ই থাকে। তাই নাইট্রোজেন পরমাণুর আসল পরিচয় তার পারমাণবিক সংখ্যা।"},{"id":"ch3-sq9","chapter":3,"num":9,"importance":2,"topic":"পরমাণুর মডেল","question":"পরমাণুতে কখন বর্ণালীর সৃষ্টি হয়– ব্যাখ্যা কর।","boards":"যশোর বোর্ড ২০২৩","answer":"কোনো পরমাণুর উপর বাইরে থেকে শক্তি (অতিবেগুনি, দৃশ্যমান বা অবলোহিত রশ্মি) পড়লে ইলেকট্রন তা শোষণ করে নিম্ন শক্তিস্তর থেকে উচ্চ শক্তিস্তরে যায়। উচ্চ শক্তিস্তরে ইলেকট্রন অস্থায়ী, তাই আবার নিজের শক্তিস্তরে ফিরে আসে এবং শোষিত শক্তির সমান শক্তি আলো হিসেবে বিকিরণ করে (E = hν)। এ বিকিরিত আলো প্রিজমের মধ্য দিয়ে পাঠালে নির্দিষ্ট রেখা পাওয়া যায়, এটিই পারমাণবিক বর্ণালি ।"},{"id":"ch3-sq10","chapter":3,"num":10,"importance":2,"topic":"পরমাণুর মডেল","question":"অরবিট কাকে বলে? ব্যাখ্যা কর।","boards":"ময়মনসিংহ বোর্ড ২০২৩","answer":"পরমাণুতে নিউক্লিয়াসের চারদিকে নির্দিষ্ট ব্যাসার্ধের যে সকল অনুমোদিত বৃত্তাকার কক্ষপথে ইলেকট্রন ঘোরে, সেগুলোকে অরবিট বা প্রধান শক্তিস্তর বলে। অরবিটে ঘোরার সময় ইলেকট্রন কোনো শক্তি শোষণ বা বিকিরণ করে না, তাই একে স্থির কক্ষপথও বলে। অরবিটকে n দ্বারা প্রকাশ করা হয়: n = 1, 2, 3, 4 হলে যথাক্রমে K, L, M, N শক্তিস্তর ।"},{"id":"ch3-sq11","chapter":3,"num":11,"importance":3,"topic":"পরমাণুর শক্তিস্তরে ইলেকট্রন বিন্যাস","question":"দ্বিতীয় প্রধান শক্তিস্তরে 'd' অরবিটাল থাকে না কেন?","boards":"কুমিল্লা বোর্ড ২০২৩, ২০২১","answer":"প্রধান শক্তিস্তর n এর জন্য উপশক্তিস্তর l এর মান 0 থেকে (n - 1) পর্যন্ত হয়। d উপশক্তিস্তরের জন্য l = 2 প্রয়োজন । দ্বিতীয় শক্তিস্তরে n = 2, তাই l = 0, 1 অর্থাৎ শুধু 2s ও 2p উপশক্তিস্তর থাকে; l = 2 সম্ভব নয়। তাই দ্বিতীয় প্রধান শক্তিস্তরে d অরবিটাল থাকে না, অর্থাৎ 2d অরবিটাল অসম্ভব ।"},{"id":"ch3-sq12","chapter":3,"num":12,"importance":3,"topic":"পরমাণুর শক্তিস্তরে ইলেকট্রন বিন্যাস","question":"Cu মৌলের ইলেকট্রন বিন্যাস ব্যতিক্রম কেন?","boards":"চট্টগ্রাম বোর্ড ২০২২; যশোর বোর্ড ২০২০","answer":"সাধারণ নিয়মে Cu(29)→1s2 2s2 2p6 3s2 3p6 3d9 4s2\nহওয়ার কথা।\nকিন্তু d উপশক্তিস্তর সম্পূর্ণ পূর্ণ (d¹⁰) হলে বিন্যাস বেশি সুস্থিত হয়। তাই অধিক সুস্থিতি অর্জনের জন্য 4s থেকে 1টি ইলেকট্রন 3d তে চলে যায়।\nফলে প্রকৃত বিন্যাস Cu(29)→1s2 2s2 2p6 3s2 3p6 3d10 4s1 ।\nএজন্য কপারের ইলেকট্রন বিন্যাস সাধারণ নিয়মের ব্যতিক্রম ।"},{"id":"ch3-sq13","chapter":3,"num":13,"importance":3,"topic":"পরমাণুর শক্তিস্তরে ইলেকট্রন বিন্যাস","question":"4s অপেক্ষা 3d অরবিটালের শক্তি বেশি– ব্যাখ্যা কর।","boards":"যশোর বোর্ড ২০২১; চট্টগ্রাম বোর্ড ২০২০","answer":"অরবিটালের শক্তি (n + l) এর মানের উপর নির্ভর করে; যার (n + l) কম, তার শক্তি কম এবং তাতে ইলেকট্রন আগে প্রবেশ করে। 3d: n+l=3+2=5; 4s: n+l=4+0=4 যেহেতু 3d এর (n + l) মান বেশি, তাই 4s অপেক্ষা 3d অরবিটালের শক্তি বেশি। এ কারণে ইলেকট্রন আগে 4s এ এবং পরে 3d তে প্রবেশ করে।"},{"id":"ch3-sq14","chapter":3,"num":14,"importance":3,"topic":"পরমাণুর শক্তিস্তরে ইলেকট্রন বিন্যাস","question":"3f অরবিটাল সম্ভব নয় কেন? ব্যাখ্যা কর।","boards":"চট্টগ্রাম বোর্ড ২০২৬","answer":"প্রধান শক্তিস্তর n হলে উপশক্তিস্তর বা অরবিটালের মান l = 0, 1, 2, …, (n-1) পর্যন্ত হতে পারে । l = 0, 1, 2, 3 হলে যথাক্রমে s, p, d, f অরবিটাল বোঝায় । n = 3 হলে l = 0, 1, 2 অর্থাৎ কেবল 3s, 3p ও 3d অরবিটাল সম্ভব । f অরবিটালের জন্য l = 3 প্রয়োজন, যা কেবল n = 4 বা তার বেশি হলে সম্ভব । তাই তৃতীয় শক্তিস্তরে f অরবিটাল থাকে না; 3f অরবিটাল সম্ভব নয়।"},{"id":"ch3-sq15","chapter":3,"num":15,"importance":3,"topic":"পরমাণুর শক্তিস্তরে ইলেকট্রন বিন্যাস","question":"K পরমাণুর সর্বশেষ ইলেকট্রনটি 3d অরবিটালে প্রবেশ না করে 4s এ গমন করে কেন?","boards":"ঢাকা বোর্ড ২০২৬","answer":"আউফবাউ নীতি অনুসারে ইলেকট্রন প্রথমে নিম্ন শক্তির অরবিটালে এবং পরে ক্রমান্বয়ে উচ্চ শক্তির অরবিটালে প্রবেশ করে। অরবিটালের শক্তি (n + l) এর মান দ্বারা নির্ধারিত হয়। 4s অরবিটালের জন্য (n+l)=4+0=4 3d অরবিটালের জন্য (n+l)=3+2=5 4s অরবিটালের (n + l) এর মান কম হওয়ায় এর শক্তি 3d অরবিটালের চেয়ে কম। তাই K (19) এর সর্বশেষ ইলেকট্রনটি 3d তে না গিয়ে 4s অরবিটালে প্রবেশ করে। K (19) : 1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹"},{"id":"ch3-sq16","chapter":3,"num":16,"importance":3,"topic":"পরমাণুর শক্তিস্তরে ইলেকট্রন বিন্যাস","question":"Fe²⁺ ও Fe³⁺ আয়ন দুটির মধ্যে কোনটি অধিক স্থিতিশীল? ব্যাখ্যা কর।","boards":"দিনাজপুর বোর্ড ২০২৬","answer":"Fe²⁺ ও Fe³⁺ আয়নের মধ্যে Fe³⁺ আয়ন অধিক স্থিতিশীল । Fe (26) : 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁶ 4s² Fe²⁺ : 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁶ Fe³⁺ : 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁵ Fe³⁺ আয়নের 3d অরবিটাল অর্ধপূর্ণ (3d5)। অর্ধপূর্ণ ও পূর্ণ অরবিটাল অধিক স্থিতিশীল হয়। অপরদিকে Fe²⁺ আয়নের 3d⁶ বিন্যাস অর্ধপূর্ণ বা পূর্ণ কোনোটিই নয়। তাই Fe³⁺ আয়ন Fe²⁺ অপেক্ষা অধিক স্থিতিশীল ।"},{"id":"ch3-sq17","chapter":3,"num":17,"importance":3,"topic":"পরমাণুর শক্তিস্তরে ইলেকট্রন বিন্যাস","question":"4f ও 6p এর মধ্যে কোন অরবিটালে ইলেকট্রন আগে প্রবেশ করবে? ব্যাখ্যা কর।","boards":"ময়মনসিংহ বোর্ড ২০২৬","answer":"(n + l) নিয়ম অনুসারে যে অরবিটালের (n + l) এর মান কম, সেই অরবিটালে ইলেকট্রন আগে প্রবেশ করে। (n + l) এর মান সমান হলে যে অরবিটালের n এর মান কম, সেটিতে ইলেকট্রন আগে প্রবেশ করে। 4f অরবিটালের জন্য, n+l=4+3=7 6p অরবিটালের জন্য, n+l=6+1=7 উভয়ের (n + l) এর মান সমান হলেও 4f এর n এর মান (4) 6p এর n এর মান (6) অপেক্ষা কম। তাই 4f অরবিটালের শক্তি কম এবং 4f অরবিটালে ইলেকট্রন আগে প্রবেশ করবে।"},{"id":"ch3-sq18","chapter":3,"num":18,"importance":2,"topic":"পরমাণুর শক্তিস্তরে ইলেকট্রন বিন্যাস","question":"ক্রোমিয়ামের ইলেকট্রন বিন্যাস ব্যতিক্রমধর্মী কেন? ব্যাখ্যা কর।","boards":"বরিশাল বোর্ড ২০২৪","answer":"সাধারণ নিয়ম (আউফবাউ নীতি) অনুসারে ক্রোমিয়ামের (Z =24) ইলেকট্রন বিন্যাস হওয়ার কথা—\nCr(24)→1s²2s²2p⁶3s²3p⁶3d⁴4s²\nকিন্তু প্রকৃত বিন্যাস হলো—\nCr(24)→1s²2s²2p⁶3s²3p⁶3d⁵4s¹\nঅর্ধপূর্ণ (d5) বা পূর্ণ (d10) উপশক্তিস্তর বেশি স্থিতিশীল । তাই অধিক স্থিতিশীলতা অর্জনের জন্য 4s অরবিটাল থেকে 1টি ইলেকট্রন 3d অরবিটালে চলে যায় এবং 3d অর্ধপূর্ণ হয়। এজন্য ক্রোমিয়ামের ইলেকট্রন বিন্যাস ব্যতিক্রমধর্মী ।"},{"id":"ch3-sq19","chapter":3,"num":19,"importance":2,"topic":"পরমাণুর শক্তিস্তরে ইলেকট্রন বিন্যাস","question":"তৃতীয় প্রধান শক্তিস্তরে f অরবিটাল থাকে না কেন?","boards":"চট্টগ্রাম বোর্ড ২০২৪","answer":"প্রধান শক্তিস্তর n এর জন্য l এর মান 0 থেকে (n - 1) পর্যন্ত হয়। f উপশক্তিস্তরের জন্য l = 3 প্রয়োজন । তৃতীয় শক্তিস্তরে n = 3, তাই l = 0, 1, 2 অর্থাৎ শুধু 3s, 3p ও 3d উপশক্তিস্তর থাকে; l = 3 সম্ভব নয়। তাই তৃতীয় প্রধান শক্তিস্তরে f অরবিটাল থাকে না, অর্থাৎ 3f অরবিটাল সম্ভব নয়।"},{"id":"ch3-sq20","chapter":3,"num":20,"importance":3,"topic":"আইসোটোপ","question":"প্রোটিয়ামের নিউট্রন সংখ্যা শূন্য—ব্যাখ্যা কর।","boards":"বরিশাল বোর্ড ২০২৬","answer":"প্রোটিয়াম হলো হাইড্রোজেনের একটি আইসোটোপ, যার প্রতীক 1H₁ (ভর সংখ্যা 1, পারমাণবিক সংখ্যা 1)। আমরা জানি, নিউট্রন সংখ্যা = ভর সংখ্যা - পারমাণবিক সংখ্যা । প্রোটিয়ামের নিউট্রন সংখ্যা =1-1=0 অর্থাৎ প্রোটিয়ামের নিউক্লিয়াসে কেবল একটি প্রোটন থাকে, কোনো নিউট্রন থাকে না। তাই প্রোটিয়ামের নিউট্রন সংখ্যা শূন্য।"},{"id":"ch3-sq21","chapter":3,"num":21,"importance":3,"topic":"আইসোটোপ","question":"16/8M ও 18/8M পরস্পর আইসোটোপ কেন?\n(Similar Questions: ✓ 2/1A ও 3/1B পরস্পরের আইসোটোপ কেন? ব্যাখ্যা কর।; ✓ 1/1H এবং 3/1H পরস্পর আইসোটোপ —ব্যাখ্যা কর।)","boards":"যশোর বোর্ড ২০২৩","answer":"যে সকল পরমাণুর প্রোটন সংখ্যা সমান কিন্তু ভরসংখ্যা ও নিউট্রন সংখ্যা ভিন্ন, তারা পরস্পরের আইসোটোপ । 16/8M ও 18/8M উভয়ের প্রোটন সংখ্যা 8 (সমান), কিন্তু ভরসংখ্যা যথাক্রমে 16 ও 18 এবং নিউট্রন সংখ্যা যথাক্রমে 16-8=8 ও 18-8=10 (ভিন্ন)। তাই 16/8M ও 18/8M পরস্পরের আইসোটোপ ।"},{"id":"ch3-sq22","chapter":3,"num":22,"importance":2,"topic":"আইসোটোপ","question":"ডিউটেরিয়াম, হাইড্রোজেনের একটি আইসোটোপ ব্যাখ্যা কর।","boards":"ঢাকা বোর্ড ২০২৩","answer":"প্রোটন সংখ্যা সমান কিন্তু ভরসংখ্যা ও নিউট্রন সংখ্যা ভিন্ন পরমাণুগুলো পরস্পরের আইসোটোপ । হাইড্রোজেন (1/1H) ও ডিউটেরিয়াম (2/1H) উভয়ের প্রোটন সংখ্যা 1, কিন্তু ভরসংখ্যা যথাক্রমে 1 ও 2 এবং নিউট্রন সংখ্যা যথাক্রমে 0 ও 1। তাই ডিউটেরিয়াম হাইড্রোজেনের একটি আইসোটোপ ।"},{"id":"ch3-sq23","chapter":3,"num":23,"importance":2,"topic":"আইসোটোপ","question":"প্রোটিয়ামের নিউট্রন সংখ্যা শূন্য — ব্যাখ্যা কর।","boards":"দিনাজপুর বোর্ড ২০২০","answer":"প্রোটিয়াম হাইড্রোজেনের একটি আইসোটোপ, প্রতীক 1/1H। এর প্রোটন সংখ্যা Z = 1 এবং ভরসংখ্যা A = 1। নিউট্রন সংখ্যা =A-Z=1-1=0 অর্থাৎ প্রোটিয়ামের নিউক্লিয়াসে শুধু একটি প্রোটন থাকে, কোনো নিউট্রন থাকে না। তাই এর নিউট্রন সংখ্যা শূন্য।"},{"id":"ch3-sq24","chapter":3,"num":24,"importance":3,"topic":"পারমাণবিক ভর বা আপেক্ষিক পারমাণবিক ভর","question":"আপেক্ষিক পারমাণবিক ভরের একক নাই কেন?","boards":"রাজশাহী বোর্ড ২০২৫; দিনাজপুর বোর্ড ২০২৫, ২০২৩; ঢাকা বোর্ড ২০২৩; কুমিল্লা বোর্ড ২০২২; সিলেট বোর্ড ২০২২; চট্টগ্রাম বোর্ড ২০২০; বরিশাল বোর্ড ২০২০","answer":"আপেক্ষিক পারমাণবিক ভর = মৌলের একটি পরমাণুর ভর / একটি কার্বন-12 আইসোটোপের ভরের 1/12 অংশ এখানে লব ও হর দুটিই ভর এবং দুটির একক একই (g)। ভাগ করলে একক কেটে যায়। আপেক্ষিক পারমাণবিক ভর দুটি ভরের অনুপাত মাত্র, তাই এর কোনো একক থাকে না।"},{"id":"ch3-sq25","chapter":3,"num":25,"importance":3,"topic":"পারমাণবিক ভর বা আপেক্ষিক পারমাণবিক ভর","question":"\"নাইট্রোজেনের আণবিক ভর 28\" – ব্যাখ্যা কর। (Similar Questions: ✓ যৌগের আপেক্ষিক আণবিক ভরের ব্যাখ্যা দাও।)","boards":"যশোর বোর্ড ২০২৪; ঢাকা বোর্ড ২০২১","answer":"অণুতে উপস্থিত পরমাণুগুলোর আপেক্ষিক পারমাণবিক ভরকে নিজ নিজ পরমাণু সংখ্যা দিয়ে গুণ করে যোগ করলে ঐ অণুর আণবিক ভর পাওয়া যায়। নাইট্রোজেন অণু (N₂) তে 2টি N পরমাণু আছে এবং N এর আপেক্ষিক পারমাণবিক ভর 14। N₂ এর আণবিক ভর =14×2=28 অর্থাৎ একটি N₂ অণু কার্বন-12 আইসোটোপের ভরের 1/12 অংশের তুলনায় 28 গুণ ভারী।"},{"id":"ch3-sq26","chapter":3,"num":26,"importance":3,"topic":"পারমাণবিক ভর বা আপেক্ষিক পারমাণবিক ভর","question":"আপেক্ষিক পারমাণবিক ভরের একক থাকে না কেন?","boards":"বরিশাল বোর্ড ২০২৬","answer":"কোনো মৌলের একটি পরমাণুর ভর একটি কার্বন-12 আইসোটোপের ভরের 1/12 অংশের তুলনায় যতগুণ ভারী, সেই সংখ্যাকে ঐ মৌলের আপেক্ষিক পারমাণবিক ভর বলে। আপেক্ষিক পারমাণবিক ভর = একটি পরমাণুর ভর / (একটি C-12 পরমাণুর ভরের 1/12 অংশ) এখানে লব ও হর উভয়ই ভর এবং একই এককে (g বা kg) প্রকাশিত হয়। ফলে একক কাটাকাটি হয়ে যায় এবং কেবল একটি অনুপাত (সংখ্যা) পাওয়া যায়। তাই আপেক্ষিক পারমাণবিক ভরের কোনো একক থাকে না।"},{"id":"ch3-sq27","chapter":3,"num":27,"importance":3,"topic":"পারমাণবিক ভর বা আপেক্ষিক পারমাণবিক ভর","question":"আপেক্ষিক পারমাণবিক ভরের একক নেই—ব্যাখ্যা কর।","boards":"রাজশাহী বোর্ড ২০২৬","answer":"কোনো মৌলের একটি পরমাণুর ভর একটি কার্বন-12 আইসোটোপের ভরের 1/12 অংশের তুলনায় যত গুণ ভারী, সেই সংখ্যাকে ঐ মৌলের আপেক্ষিক পারমাণবিক ভর বলে। আপেক্ষিক পারমাণবিক ভর = একটি পরমাণুর ভর / (একটি C-12 পরমাণুর ভরের 1/12 অংশ) এখানে লব ও হর উভয়ই ভর এবং উভয়ের একক একই (g বা kg)। ফলে ভাগ করলে একক কাটাকাটি হয়ে যায় এবং শুধু একটি সংখ্যা অবশিষ্ট থাকে।\nযেমন: অক্সিজেনের আপেক্ষিক পারমাণবিক ভর 16, এটি একটি তুলনামূলক সংখ্যা মাত্র। তাই আপেক্ষিক পারমাণবিক ভরের কোনো একক নেই।"},{"id":"ch3-sq28","chapter":3,"num":28,"importance":3,"topic":"তেজস্ক্রিয় আইসোটোপ ও তাদের ব্যবহার","question":"রোগ নির্ণয়ে আইসোটোপের ব্যবহার লিখ।","boards":"দিনাজপুর বোর্ড ২০২১; ঢাকা বোর্ড ২০২০","answer":"রোগ নির্ণয়ে টেকনিশিয়াম-99 (99Tc) ইঞ্জেকশনের মাধ্যমে শরীরে প্রবেশ করানো হয়। এটি নির্দিষ্ট স্থানে জমা হয়ে গামা রশ্মি বিকিরণ করে এবং গামা রশ্মি শনাক্তকরণ ক্যামেরা দিয়ে রোগাক্রান্ত স্থানের ছবি তোলা যায়। এর লাইফটাইম 6 ঘণ্টা বলে এটি নিরাপদ। রোগ নিরাময়ে 131I থাইরয়েড ক্যানসার কোষ, 60Co টিউমার ও ক্যানসার কোষকলা ধ্বংস করে; 32P এর ফসফেট লিউকোমিয়া এবং ইরিডিয়াম আইসোটোপ ব্রেইন ক্যানসার চিকিৎসায় ব্যবহৃত হয়। তাই চিকিৎসাক্ষেত্রে তেজস্ক্রিয় আইসোটোপ গুরুত্বপূর্ণ ।"},{"id":"ch3-sq29","chapter":3,"num":29,"importance":3,"topic":"তেজস্ক্রিয় আইসোটোপ ও তাদের ব্যবহার","question":"রোগ নির্ণয়ে তেজস্ক্রিয় আইসোটোপের ব্যবহার ব্যাখ্যা কর।","boards":"মাদ্রাসা বোর্ড ২০২৬","answer":"তেজস্ক্রিয় আইসোটোপ থেকে নির্গত রশ্মি যন্ত্রের সাহায্যে শনাক্ত করা যায় বলে একে ট্রেসার হিসেবে দেহের বিভিন্ন অঙ্গের অবস্থা জানতে ব্যবহার করা হয়।\n• থাইরয়েড গ্রন্থির রোগ ও কার্যকারিতা নির্ণয়ে আয়োডিন-131 (I-131) ব্যবহৃত হয়; রোগীকে স্বল্প মাত্রায় I-131 খাওয়ানোর পর গ্রন্থিতে এর জমা হওয়ার পরিমাণ দেখে রোগ নির্ণয় করা হয়।\n• টেকনেসিয়াম-99m (Tc-99m) ব্যবহার করে মস্তিষ্ক, হৃৎপিণ্ড, যকৃৎ, কিডনি, হাড় ইত্যাদির ছবি তোলা ও টিউমার শনাক্ত করা হয়। এভাবে দেহ না কেটেই অভ্যন্তরীণ রোগ নির্ণয়ে তেজস্ক্রিয় আইসোটোপ ব্যবহৃত হয়।"},{"id":"ch3-sq30","chapter":3,"num":30,"importance":3,"topic":"তেজস্ক্রিয় আইসোটোপ ও তাদের ব্যবহার","question":"টেকনিশিয়ামের তেজস্ক্রিয় আইসোটোপ চিকিৎসাক্ষেত্রে ব্যবহার নিরাপদ কেন? ব্যাখ্যা করো ।","boards":"সিলেট বোর্ড ২০২৬","answer":"টেকনিশিয়ামের তেজস্ক্রিয় আইসোটোপ Tc-99m এর অর্ধায়ু মাত্র প্রায় 6 ঘণ্টা, ফলে এটি খুব অল্প সময়ের মধ্যে ক্ষয় হয়ে শরীর থেকে বের হয়ে যায়। এটি কেবল কম শক্তির গামা রশ্মি নির্গত করে, ক্ষতিকর আলফা বা বিটা কণা নির্গত করে না। তাই দেহকোষের তেমন ক্ষতি হয় না। এ কারণে টিউমার, ক্যান্সার কোষ ও দেহের বিভিন্ন অঙ্গের রোগ নির্ণয়ে Tc-99m এর ব্যবহার নিরাপদ।"},{"id":"ch4-sq1","chapter":4,"num":1,"importance":2,"topic":"পর্যায় সারণির পটভূমি","question":"ডোবেরাইনারের ত্রয়ী সূত্রটি লেখ।","boards":"সিলেট বোর্ড ২০২৪","answer":"একই রকম ধর্মবিশিষ্ট তিনটি মৌলকে পারমাণবিক ভর অনুসারে সাজালে দ্বিতীয় মৌলের পারমাণবিক ভর প্রথম ও তৃতীয় মৌলের পার
