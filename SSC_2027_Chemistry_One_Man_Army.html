 ইলেকট্রন ত্যাগ করে নিয়নের (Ne) ইলেকট্রন বিন্যাস লাভ করে Mg²⁺ আয়নে পরিণত হয়। দুটি F পরমাণু প্রত্যেকে একটি করে ইলেকট্রন গ্রহণ করে নিয়নের ইলেকট্রন বিন্যাস লাভ করে F⁻ আয়নে পরিণত হয়।\nMg→Mg²⁺+2e⁻\n2F+2e⁻→2F⁻\nMg²⁺+2F⁻→MgF₂\nবিপরীত চার্জযুক্ত Mg²⁺ ও F⁻ আয়ন স্থির বৈদ্যুতিক আকর্ষণ বলের মাধ্যমে যুক্ত হয়ে MgF₂ যৌগ গঠন করে। এখানে ইলেকট্রনের সম্পূর্ণ আদান-প্রদান ঘটে। সুতরাং X ও Y দ্বারা গঠিত যৌগ MgF₂ এ আয়নিক বা তড়িৎযোজী বন্ধন বিদ্যমান ।"},{"label":"ঘ","question":"উদ্দীপকের Z মৌলটি এক পরমাণুক হলেও X মৌলটি দ্বি- পরমাণুক অণু গঠন করে —ডায়াগ্রামসহ বিশ্লেষণ কর।","answer":"Z মৌলটি 4র্থ পর্যায়ের গ্রুপ-1 এ অবস্থিত, তাই Z হলো পটাসিয়াম (K)। X হলো ফ্লোরিন (F)। Z (K) এক পরমাণুক হওয়ার কারণ K (19) : 1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹ K একটি ধাতু। এর সর্বশেষ স্তরে মাত্র একটি ইলেকট্রন থাকে, যা সহজেই ত্যাগ করে। কঠিন অবস্থায় প্রতিটি K পরমাণু তার যোজ্যতা ইলেকট্রন ত্যাগ করে K⁺ আয়নে পরিণত হয় এবং মুক্ত ইলেকট্রনগুলো সমগ্র কেলাসে ইলেকট্রন সমুদ্র গঠন করে। ধনাত্মক আয়ন ও ইলেকট্রন সমুদ্রের মধ্যকার আকর্ষণে ধাতব বন্ধন গঠিত হয়। K পরমাণুসমূহ জোড়ায় জোড়ায় ইলেকট্রন শেয়ার করে নির্দিষ্ট কোনো অণু গঠন করে না। প্রতিটি পরমাণু স্বতন্ত্র একক হিসেবে কেলাসে অবস্থান করে, তাই এর আণবিক সংকেত লেখা হয় K, অর্থাৎ K এক পরমাণুক । X (F) দ্বি-পরমাণুক হওয়ার কারণ F (9) : 1s² 2s² 2p⁵ ফ্লোরিনের সর্বশেষ স্তরে 7টি ইলেকট্রন আছে; অষ্টক পূরণের জন্য এর আরও একটি ইলেকট্রন প্রয়োজন । একটি F পরমাণু অপর একটি F পরমাণুর সাথে একটি করে ইলেকট্রন শেয়ার করে একটি ইলেকট্রন জোড় গঠন করে । ফলে উভয় পরমাণুই নিয়নের ইলেকট্রন বিন্যাস (অষ্টক) লাভ করে এবং একটি সমযোজী একক বন্ধন গঠিত হয়। F₂ অণু গঠনের ডায়াগ্রাম (ডট-ক্রস চিত্র)\nF(2,7)+F(2,7)→F·× F (প্রতিটি F এর যোজ্যতা স্তরে 8টি\nইলেকট্রন) (চিত্রে প্রতিটি F পরমাণুর চারপাশে 7টি যোজ্যতা ইলেকট্রন দেখানো হয়; একটি F এর ইলেকট্রন · ও অপরটির ইলেকট্রন × চিহ্নে, মধ্যবর্তী ·× জোড়টি শেয়ারকৃত ইলেকট্রন জোড় ।)\nF·+·F→F-F(F₂)\nএভাবে দুটি F পরমাণু সমযোজী বন্ধনে যুক্ত হয়ে স্থিতিশীল দ্বি- পরমাণুক F₂ অণু গঠন করে । একক F পরমাণু অস্থিতিশীল বলে মুক্ত অবস্থায় থাকে না। সুতরাং ধাতব বন্ধন গঠনের কারণে Z (K) এক পরমাণুক এবং সমযোজী বন্ধন গঠনের কারণে X (F) দ্বি-পরমাণুক অণু (F₂) গঠন করে।"}]},{"id":"ch5-cq8","chapter":5,"num":8,"importance":3,"topic":"সমযোজী বন্ধন","board":"সিলেট বোর্ড ২০২৫","stem":"3X 6Y 17E (X, Y, E প্রতীকী অর্থে ব্যবহৃত)","subQuestions":[{"label":"ক","question":"গাঠনিক সংকেত কাকে বলে?","answer":"কোনো অণুতে বিভিন্ন পরমাণু কীভাবে পরস্পরের সাথে বন্ধন দ্বারা যুক্ত থাকে, তা যে সংকেতের মাধ্যমে প্রকাশ করা হয় তাকে গাঠনিক সংকেত বলে। যেমন- পানির গাঠনিক সংকেত H-O-H।"},{"label":"খ","question":"নিয়নকে নিষ্ক্রিয় গ্যাস বলা হয় কেন?","answer":"নিয়নের পারমাণবিক সংখ্যা 10। Ne(10) : 1s² 2s² 2p⁶ (2, 8) নিয়নের সর্বশেষ শক্তিস্তরে 8টি ইলেকট্রন আছে, অর্থাৎ এর অষ্টক পূর্ণ। তাই এটি ইলেকট্রন গ্রহণ, ত্যাগ বা শেয়ার করার প্রবণতা দেখায় না এবং সাধারণ অবস্থায় অন্য কোনো মৌলের সাথে বিক্রিয়া করে না। এ কারণে নিয়নকে নিষ্ক্রিয় গ্যাস বলা হয়।"},{"label":"গ","question":"E2 অণুর বন্ধন গঠন প্রক্রিয়া ব্যাখ্যা কর।","answer":"E এর পারমাণবিক সংখ্যা 17, তাই E হলো ক্লোরিন (Cl) এবং E2 হলো ক্লোরিন অণু (Cl₂)। Cl(17) : 1s² 2s² 2p⁶ 3s² 3p⁵ (2, 8, 7) Cl এর সর্বশেষ শক্তিস্তরে 7টি ইলেকট্রন আছে। আর্গনের মতো স্থিতিশীল অষ্টক বিন্যাস লাভের জন্য এর আরও 1টি ইলেকট্রন প্রয়োজন । দুটি Cl পরমাণুই অধাতু এবং উভয়ের ইলেকট্রন গ্রহণের প্রবণতা সমান, তাই কেউ কাউকে ইলেকট্রন দান করে না। তাই প্রতিটি Cl পরমাণু তার 1টি করে ইলেকট্রন দিয়ে একটি ইলেকট্রন জোড় তৈরি করে এবং উভয়ে তা সমভাবে শেয়ার করে । এতে প্রতিটি Cl পরমাণুর সর্বশেষ স্তরে 8টি ইলেকট্রন হয়।\nCl·+·Cl→Cl:Cl বা Cl-Cl\nদুটি Cl পরমাণুর মধ্যে একটি ইলেকট্রন জোড় শেয়ারের মাধ্যমে একক সমযোজী বন্ধন গঠিত হয়। সুতরাং E2 বা Cl₂ অণু সমযোজী বন্ধনের মাধ্যমে গঠিত ।"},{"label":"ঘ","question":"Y ও E দ্বারা গঠিত যৌগ পানিতে অদ্রবণীয় হলেও X ও E দ্বারা গঠিত যৌগ পানিতে দ্রবণীয় —বিশ্লেষণ কর।","answer":"পারমাণবিক সংখ্যা অনুযায়ী X = লিথিয়াম (Li, 3), Y = কার্বন (C, 6), E = ক্লোরিন (Cl, 17)। Y ও E দ্বারা গঠিত যৌগ CCl₄ এবং X ও E দ্বারা গঠিত যৌগ LiCl। CCl₄: C ও Cl উভয়ই অধাতু । C এর 4টি যোজ্যতা ইলেকট্রন চারটি Cl পরমাণুর সাথে শেয়ার হয়ে চারটি সমযোজী বন্ধন গঠিত হয়। অণুটি সুষম চতুস্তলকীয় হওয়ায় বন্ধনের পোলারিটি পরস্পরকে বাতিল করে, তাই CCl₄ অপোলার । এতে কোনো আয়ন নেই, তাই পোলার পানির অণুর ধনাত্মক বা ঋণাত্মক প্রান্ত একে আকর্ষণ করতে পারে না। ফলে CCl₄ পানিতে অদ্রবণীয় । LiCl: Li ধাতু ও Cl অধাতু । Li একটি ইলেকট্রন ত্যাগ করে Li+ এবং Cl তা গ্রহণ করে Cl- আয়ন হয়; LiCl আয়নিক যৌগ।\nLiCl→Li++Cl-\nপানি পোলার দ্রাবক । পানির অণুর ঋণাত্মক প্রান্ত (O) Li+ আয়নকে এবং ধনাত্মক প্রান্ত (H) Cl- আয়নকে আকর্ষণ করে। এতে আয়নগুলোর মধ্যকার আকর্ষণ দুর্বল হয়ে কেলাস ভেঙে যায় এবং আয়নগুলো পানির অণু দ্বারা পরিবেষ্টিত হয়ে দ্রবণে ছড়িয়ে পড়ে । সুতরাং অপোলার সমযোজী যৌগ হওয়ায় CCl₄ পানিতে অদ্রবণীয়, কিন্তু আয়নিক যৌগ হওয়ায় LiCl পানিতে দ্রবণীয় ।"}]},{"id":"ch5-cq9","chapter":5,"num":9,"importance":3,"topic":"সমযোজী বন্ধন","board":"সিলেট বোর্ড ২০২০","stem":"মৌলের নাম ইলেকট্রন সংখ্যা P n Q n - 4 R n - 5 উল্লেখ্য 'P' হচ্ছে হ্যালোজেন গ্রুপের সবচেয়ে হালকা মৌল এবং P, Q, R প্রতীকী অর্থে ব্যবহৃত ।","subQuestions":[{"label":"ক","question":"মোলারিটি কাকে বলে?","answer":"নির্দিষ্ট তাপমাত্রায় প্রতি লিটার দ্রবণে দ্রবীভূত দ্রবের মোল সংখ্যাকে ঐ দ্রবণের মোলারিটি বলে। এর একক mol/L বা M।"},{"label":"খ","question":"CH₃CH₂OH একটি পোলার যৌগ—ব্যাখ্যা কর।","answer":"CH₃-CH₂-OH অণুর -OH মূলকে O ও H পরমাণু একজোড়া ইলেকট্রন শেয়ার করে সমযোজী বন্ধন গঠন করে। O এর তড়িৎ ঋণাত্মকতা (3.5) H (2.1) ও C (2.5) এর চেয়ে অনেক বেশি। তাই O-H ও C-O বন্ধনের শেয়ারকৃত ইলেকট্রন জোড় O এর দিকে বেশি আকৃষ্ট থাকে। ফলে O প্রান্তে আংশিক ঋণাত্মক (δ-) এবং H প্রান্তে আংশিক ধনাত্মক (δ+) আধান সৃষ্টি হয় (CH₃-CH₂-Oδ- - Hδ+)। তাই ইথানল একটি পোলার সমযোজী যৌগ।"},{"label":"গ","question":"'P' ও 'Q' দ্বারা গঠিত যৌগের বন্ধন প্রক্রিয়া বর্ণনা কর।","answer":"P হ্যালোজেন গ্রুপের সবচেয়ে হালকা মৌল, তাই P = ফ্লোরিন (F), n = 9। Q এর ইলেকট্রন সংখ্যা =n-4=9-4=5, তাই Q = বোরন (B)। সুতরাং P ও Q দ্বারা গঠিত যৌগ BF₃ (বোরন ট্রাইফ্লোরাইড)। B(5) : 1s² 2s² 2p¹ — সর্বশেষ স্তরে 3টি ইলেকট্রন । F(9) : 1s² 2s² 2p⁵ — সর্বশেষ স্তরে 7টি ইলেকট্রন । B ও F উভয়ই অধাতু, তাই এদের মধ্যে ইলেকট্রন শেয়ারের মাধ্যমে সমযোজী বন্ধন গঠিত হয়। B এর 3টি যোজ্যতা ইলেকট্রন তিনটি F পরমাণুর প্রত্যেকটির 1টি করে ইলেকট্রনের সাথে শেয়ার হয়ে তিনটি B-F একক সমযোজী বন্ধন গঠন করে।\n2B+3F₂→2BF₃\nডায়াগ্রাম: F-B-F (B এর সাথে তৃতীয় F একক বন্ধনে যুক্ত); B এর চারপাশে 3 জোড়া বন্ধন ইলেকট্রন, প্রতিটি F এর চারপাশে 1 জোড়া বন্ধন ও 3 জোড়া মুক্তজোড় ইলেকট্রন । বন্ধন গঠনের পর প্রতিটি F পরমাণু অষ্টক লাভ করে, কিন্তু B এর সর্বশেষ স্তরে 6টি ইলেকট্রন (3 জোড়া) থাকে। অর্থাৎ B অষ্টক পূর্ণ করে না, দুই এর নিয়ম অনুসরণ করে। সুতরাং P ও Q এর মধ্যে সমযোজী বন্ধনের মাধ্যমে BF₃ যৌগ গঠিত হয়।"},{"label":"ঘ","question":"উদ্দীপকের মৌল তিনটির পারমাণবিক ব্যাসার্ধ ও তড়িৎ ঋণাত্মকতার ক্রম একই হবে কী? বিশ্লেষণ কর।","answer":"P = ফ্লোরিন (F, 9), Q = বোরন (B, 5), R এর ইলেকট্রন সংখ্যা =9-5=4, তাই R = বেরিলিয়াম (Be)। Be(4) : 1s² 2s² — গ্রুপ-2 B(5) : 1s² 2s² 2p¹ — গ্রুপ-13 F(9) : 1s² 2s² 2p⁵ — গ্রুপ-17 তিনটি মৌলই ২য় পর্যায়ের । একই পর্যায়ে বাম থেকে ডানে প্রোটন সংখ্যা বাড়ে কিন্তু শক্তিস্তর একই থাকে। ফলে নিউক্লিয়াস কর্তৃক সর্বশেষ স্তরের ইলেকট্রনের প্রতি আকর্ষণ বাড়ে । পারমাণবিক ব্যাসার্ধ: নিউক্লিয়াসের আকর্ষণ বাড়ায় বাম থেকে ডানে পারমাণবিক ব্যাসার্ধ হ্রাস পায়। ক্রম: Be \u003e B \u003e F, অর্থাৎ R \u003e Q \u003e P। তড়িৎ ঋণাত্মকতা: পরমাণুর আকার যত ছোট, শেয়ারকৃত ইলেকট্রন জোড়কে নিজের দিকে আকর্ষণের ক্ষমতা তত বেশি। তাই বাম থেকে ডানে তড়িৎ ঋণাত্মকতা বৃদ্ধি পায়। ক্রম: F \u003e B \u003e Be, অর্থাৎ P \u003e Q \u003e R। সুতরাং মৌল তিনটির পারমাণবিক ব্যাসার্ধ ও তড়িৎ ঋণাত্মকতার ক্রম একই হবে না, বরং সম্পূর্ণ বিপরীত হবে।"}]},{"id":"ch5-cq10","chapter":5,"num":10,"importance":3,"topic":"সমযোজী বন্ধন","board":"বরিশাল বোর্ড ২০২১","stem":"W ও D দুটি মৌল। W মৌলের তিনটি আইসোটোপের শতকরা পরিমাণ যথাক্রমে ¹²W = 99%, ¹³W = 0.75% ও ¹⁴W =0.25%. D মৌলটি ৩য় পর্যায়ের হ্যালোজেন গ্রুপের মৌল।","subQuestions":[{"label":"ক","question":"ক্যাটায়ন কাকে বলে?","answer":"যে পরমাণু বা পরমাণুগুচ্ছ এক বা একাধিক ইলেকট্রন ত্যাগ করে ধনাত্মক আধানযুক্ত হয়, তাকে ক্যাটায়ন বলে। যেমন: Na⁺, Ca²⁺, NH₄⁺।"},{"label":"খ","question":"Ne নিষ্ক্রিয় কেন? ব্যাখ্যা কর।","answer":"Ne(10)→1s²2s²2p⁶(2,8)\nনিয়নের (Ne) সর্বশেষ শক্তিস্তরে 8টি ইলেকট্রন আছে, অর্থাৎ এর অষ্টক পূর্ণ এবং ইলেকট্রন বিন্যাস স্থিতিশীল । তাই Ne অন্য কোনো মৌলকে ইলেকট্রন দেয় না, অন্য মৌল থেকে ইলেকট্রন গ্রহণ করে না এবং শেয়ারও করে না। ফলে Ne রাসায়নিক বিক্রিয়ায় অংশ নেয় না, অর্থাৎ নিষ্ক্রিয় ।"},{"label":"গ","question":"W মৌলের আপেক্ষিক পারমাণবিক ভর নির্ণয় কর।","answer":"দেওয়া আছে, W মৌলের তিনটি আইসোটোপ:\nআইসোটোপ ভরসংখ্যা শতকরা পরিমাণ ¹²W 12 99% ¹³W 13 0.75% ¹⁴W 14 0.25% আপেক্ষিক পারমাণবিক ভর = (প্রথম আইসোটোপের ভর × শতকরা পরিমাণ + দ্বিতীয়টির ভর × শতকরা পরিমাণ + তৃতীয়টির ভর × শতকরা পরিমাণ) / 100 =(12×99+13×0.75+14×0.25)/100 =(1188+9.75+3.5)/100 =1201.25/100=12.0125 ≈ 12.01 সুতরাং, W মৌলের আপেক্ষিক পারমাণবিক ভর 12.01 (প্রায় 12)।"},{"label":"ঘ","question":"W ও D মৌল দ্বারা গঠিত যৌগের চিত্র এঁকে মুক্ত জোড়া ও বন্ধন জোড় ইলেকট্রন সংখ্যা হিসাব কর।","answer":"গ অংশ থেকে W এর আপেক্ষিক পারমাণবিক ভর প্রায় 12 এবং এর আইসোটোপগুলো ¹²W, ¹³W, ¹⁴W; তাই W হলো কার্বন (C)। D মৌলটি তৃতীয় পর্যায়ের হ্যালোজেন, অর্থাৎ ক্লোরিন (Cl)। W ও D মিলে কার্বন টেট্রাক্লোরাইড (CCl₄) যৌগ গঠন করে ।\nC(6)→1s²2s²2p²(2,4) ; Cl(17)→\n1s²2s²2p⁶3s²3p⁵(2,8,7) C এর সর্বশেষ স্তরে 4টি ইলেকট্রন আছে, অষ্টক পূর্ণ করতে আরও 4টি দরকার। প্রতিটি Cl এর সর্বশেষ স্তরে 7টি ইলেকট্রন, অষ্টকের জন্য 1টি দরকার। তাই C পরমাণু তার 4টি ইলেকট্রন চারটি Cl পরমাণুর একটি করে ইলেকট্রনের সাথে শেয়ার করে চারটি C-Cl সমযোজী বন্ধন গঠন করে । CCl₄ অণু: (কেন্দ্রীয় C পরমাণু চারটি C-Cl একক বন্ধনে চারটি Cl এর সাথে যুক্ত) চিত্রে কেন্দ্রের C এর চারপাশে চারটি শেয়ারকৃত ইলেকট্রন জোড় (বন্ধন জোড়) এবং প্রতিটি Cl এর চারপাশে আরও 3 জোড়া অশেয়ারকৃত ইলেকট্রন (মুক্ত জোড়) দেখাতে হয়। বন্ধন জোড় ইলেকট্রন: চারটি C-Cl বন্ধনের প্রতিটিতে 1 জোড়া ইলেকট্রন শেয়ার হয়েছে । তাই বন্ধন জোড় = 4টি, অর্থাৎ বন্ধন জোড় ইলেকট্রন =4×2=8টি। মুক্ত জোড় ইলেকট্রন: C এর 4টি ইলেকট্রনই বন্ধনে ব্যবহৃত হওয়ায় C এর কোনো মুক্ত জোড় নেই। প্রতিটি Cl এর 7টি ইলেকট্রনের 1টি বন্ধনে ব্যবহৃত হয়, বাকি 6টি অর্থাৎ 3 জোড়া মুক্ত থাকে। চারটি Cl এ মুক্ত জোড় =4×3=12টি, অর্থাৎ মুক্ত জোড় ইলেকট্রন =12×2=24টি। সুতরাং, CCl₄ অণুতে বন্ধন জোড় 4টি (8টি ইলেকট্রন) এবং মুক্ত জোড় 12টি (24টি ইলেকট্রন) বিদ্যমান ।"}]},{"id":"ch5-cq11","chapter":5,"num":11,"importance":3,"topic":"সমযোজী বন্ধন","board":"ময়মনসিংহ বোর্ড ২০২০","stem":"[Q, R এবং T কোনো মৌলের প্রতীক নয়, প্রতীকী অর্থে ব্যবহৃত হয়েছে]","diagramId":"ch5-cq11","subQuestions":[{"label":"ক","question":"সমযোজী বন্ধন কী?","answer":"দুটি অধাতব পরমাণু তাদের সর্বশেষ স্তরের সমান সংখ্যক ইলেকট্রন শেয়ার করে ইলেকট্রন জোড় সৃষ্টির মাধ্যমে যে বন্ধন গঠন করে, তাকে সমযোজী বন্ধন বলে ।"},{"label":"খ","question":"অ্যালুমিনিয়াম বিদ্যুৎ পরিবাহী কেন?","answer":"অ্যালুমিনিয়াম (Al) একটি ধাতু। Al (2, 8, 3) পরমাণু সর্বশেষ স্তরের 3টি ইলেকট্রন ত্যাগ করে Al₃+ আয়নে পরিণত হয় এবং ত্যাগ করা ইলেকট্রনগুলো ইলেকট্রন সাগর হিসেবে সমগ্র ধাতব কেলাসে মুক্তভাবে চলাচল করে (ধাতব বন্ধন)। অ্যালুমিনিয়ামের দুই প্রান্তে বিভব পার্থক্য প্রয়োগ করলে এই মুক্ত ইলেকট্রনগুলো ধনাত্মক প্রান্তের দিকে প্রবাহিত হয় এবং বিদ্যুৎ পরিবহন করে। তাই অ্যালুমিনিয়াম বিদ্যুৎ পরিবাহী।"},{"label":"গ","question":"TR₆ যৌগে কোন ধরনের বন্ধন বিদ্যমান? চিত্রসহ বর্ণনা কর।","answer":"উদ্দীপকের T এর ইলেকট্রন বিন্যাস 2, 8, 6, অর্থাৎ পারমাণবিক সংখ্যা 16, তাই T হলো সালফার (S)। R এর ইলেকট্রন বিন্যাস 2, 7, অর্থাৎ পারমাণবিক সংখ্যা 9, তাই R হলো ফ্লোরিন (F)। সুতরাং TR₆ যৌগটি হলো সালফার হেক্সাফ্লোরাইড (SF₆)। S ও F উভয়ই অধাতু, তাই এরা ইলেকট্রন শেয়ারের মাধ্যমে যুক্ত হয়। অর্থাৎ SF₆ যৌগে সমযোজী বন্ধন বিদ্যমান ।\nS(16)→1s²2s²2p⁶3s²3p⁴ (সর্বশেষ স্তরে 6টি ইলেকট্রন)\nS* (উত্তেজিত) → 1s² 2s² 2p⁶ 3s¹ 3p³ 3d² (বিজোড়\nইলেকট্রন 6টি)\nF(9)→1s²2s²2p⁵ (সর্বশেষ স্তরে 7টি ইলেকট্রন, বিজোড়\nইলেকট্রন 1টি) উত্তেজিত অবস্থায় S এর 3s এর একটি ও 3p এর একটি ইলেকট্রন খালি 3d অরবিটালে চলে যায়, ফলে S এ 6টি বিজোড় ইলেকট্রন সৃষ্টি হয়। এই 6টি ইলেকট্রন ছয়টি F পরমাণুর একটি করে বিজোড় ইলেকট্রনের সাথে শেয়ার হয়ে ছয়টি S–F সমযোজী বন্ধন গঠন করে।\nS+3F₂→SF₆\nচিত্র: কেন্দ্রে S, এর চারদিকে ছয়টি F পরমাণু; প্রতিটি S–F বন্ধনে S এর 1টি (.) ও F এর 1টি (×) ইলেকট্রন শেয়ার হয়েছে । এখানে প্রতিটি F এর চারপাশে 8টি ইলেকট্রন হয়, কিন্তু S এর চারপাশে 6×2=12টি ইলেকট্রন থাকে (অষ্টকের সম্প্রসারণ)। সুতরাং TR₆ বা SF₆ যৌগে ছয়টি S–F সমযোজী বন্ধন বিদ্যমান ।"},{"label":"ঘ","question":"QR₂ এবং 6 পারমাণবিক সংখ্যাবিশিষ্ট মৌলের সাথে R এর গঠিত যৌগ পানিতে দ্রবণীয় কিনা? বিশ্লেষণ কর।","answer":"উদ্দীপকের Q এর ইলেকট্রন বিন্যাস 2, 8, 2, অর্থাৎ পারমাণবিক সংখ্যা 12, তাই Q হলো ম্যাগনেসিয়াম (Mg); R হলো ফ্লোরিন (F)। সুতরাং QR₂ হলো ম্যাগনেসিয়াম ফ্লোরাইড (MgF₂)। 6 পারমাণবিক সংখ্যাবিশিষ্ট মৌল কার্বন (C), যা R এর সাথে কার্বন টেট্রাফ্লোরাইড (CF₄) গঠন করে। MgF₂ (আয়নিক যৌগ): Mg দুটি ইলেকট্রন ত্যাগ করে Mg₂+ এবং দুটি F একটি করে ইলেকট্রন গ্রহণ করে দুটি F- আয়নে পরিণত হয়।\nMg₂++2F-→MgF₂\nপানি একটি পোলার দ্রাবক; পানির অণুর O প্রান্তে আংশিক ঋণাত্মক (δ-) ও H প্রান্তে আংশিক ধনাত্মক (δ+) আধান থাকে। MgF₂ পানিতে দিলে পানির অণুর আংশিক ঋণাত্মক O প্রান্ত Mg₂+ আয়নকে এবং\nআংশিক ধনাত্মক H প্রান্ত F- আয়নকে আকর্ষণ করে। এভাবে আয়নগুলো কেলাস থেকে বিচ্ছিন্ন হয়ে পানির অণু দ্বারা পরিবেষ্টিত হয়ে দ্রবণে ছড়িয়ে পড়ে । তাই আয়নিক যৌগ হিসেবে MgF₂ পানিতে দ্রবণীয় । CF₄ (সমযোজী যৌগ): C এর 4টি যোজ্যতা ইলেকট্রন চারটি F এর সাথে শেয়ার হয়ে চারটি C–F সমযোজী বন্ধন গঠন করে।\nC+2F₂→CF₄\nCF₄ এ কোনো আয়ন থাকে না। প্রতিটি C–F বন্ধন পোলার হলেও অণুটি সুষম চতুস্তলকীয় আকৃতির হওয়ায় বন্ধনগুলোর পোলারিটি পরস্পরকে প্রশমিত করে; ফলে CF₄ অণু অপোলার । অপোলার অণুকে পোলার পানির অণু আকর্ষণ করতে পারে না। তাই CF₄ পানিতে অদ্রবণীয় । সুতরাং QR₂ (MgF₂) আয়নিক হওয়ায় পানিতে দ্রবণীয়, কিন্তু C ও R এর যৌগ CF₄ সমযোজী ও অপোলার হওয়ায় পানিতে অদ্রবণীয় ।"}]},{"id":"ch5-cq12","chapter":5,"num":12,"importance":3,"topic":"সমযোজী বন্ধন","board":"ময়মনসিংহ বোর্ড ২০২১","stem":"মৌল L M N পারমাণবিক 7 15 17 [এখানে L, M, N প্রচলিত কোনো মৌলের প্রতীক নয়]","subQuestions":[{"label":"ক","question":"রাসায়নিক সংকেত কাকে বলে?","answer":"কোনো মৌলিক বা যৌগিক পদার্থের একটি অণুতে উপস্থিত পরমাণুগুলোর প্রকৃতি ও সংখ্যা প্রতীক ও সংখ্যার সাহায্যে প্রকাশ করাকে রাসায়নিক সংকেত বলে । যেমন: H₂O, CO₂।"},{"label":"খ","question":"ইথেন পানিতে দ্রবীভূত হয় না— ব্যাখ্যা কর।","answer":"ইথেন (CH₃-CH₃) একটি অপোলার সমযোজী যৌগ, কারণ C ও H এর তড়িৎ ঋণাত্মকতার পার্থক্য খুব কম। পানি একটি পোলার যৌগ। অপোলার ইথেন অণু পানির অণুর δ+ বা δ- প্রান্তের সাথে কোনো আকর্ষণ সৃষ্টি করতে পারে না, তাই পানির অণুগুলোর মধ্যে ঢুকতে পারে না। \"সমধর্মী সমধর্মীকে দ্রবীভূত করে\" — এ কারণে ইথেন পানিতে দ্রবীভূত হয় না।"},{"label":"গ","question":"L2 অণুর বন্ধন গঠন ব্যাখ্যা কর।","answer":"L এর পারমাণবিক সংখ্যা 7, তাই L = নাইট্রোজেন (N) এবং L2 = N₂।\nN(7)→1s²2s²2p³ (সর্বশেষ স্তরে 5টি ইলেকট্রন)\nঅষ্টক পূরণে প্রতিটি N পরমাণুর আরও 3টি ইলেকট্রন প্রয়োজন । দুটি N পরমাণুই অধাতু, তাই ইলেকট্রন ত্যাগ-গ্রহণ না করে প্রত্যেকে 3টি করে মোট 6টি (3 জোড়া) ইলেকট্রন শেয়ার করে ।\nN+N→N≡N বা N₂\nফলে দুটি N এর মধ্যে ত্রিবন্ধন গঠিত হয় এবং প্রতিটি N এর সর্বশেষ স্তরে 8টি ইলেকট্রন (3টি বন্ধন জোড় + 1টি মুক্তজোড়) হয়ে Ne এর মতো স্থিতিশীল বিন্যাস লাভ করে । সুতরাং L2 (N₂) অণুতে ত্রিবন্ধনযুক্ত সমযোজী বন্ধন বিদ্যমান ।"},{"label":"ঘ","question":"M ও N দ্বারা গঠিত দুটি ভিন্ন যৌগের মধ্যে একটি অষ্টক নিয়ম মানলেও অপরটি মানে না— বিশ্লেষণ কর।","answer":"M এর পারমাণবিক সংখ্যা 15, তাই M = ফসফরাস (P); N এর পারমাণবিক সংখ্যা 17, তাই N = ক্লোরিন (Cl)।\nP(15)→1s²2s²2p⁶3s²3p³ (সর্বশেষ স্তরে 5টি ইলেকট্রন)\nCl(17)→1s²2s²2p⁶3s²3p⁵ (সর্বশেষ স্তরে 7টি ইলেকট্রন)\nP পরিবর্তনশীল যোজনী (3 ও 5) প্রদর্শন করে এবং Cl এর সাথে দুটি যৌগ গঠন করে: PCl₃ ও PCl₅।\n• PCl₃: P এর 3টি বিজোড় ইলেকট্রন তিনটি Cl এর একটি করে ইলেকট্রনের সাথে শেয়ার হয়ে 3টি P–Cl বন্ধন গঠন করে। P এর সর্বশেষ স্তরে 3টি বন্ধন জোড় + 1টি মুক্তজোড় = 8টি ইলেকট্রন এবং প্রতিটি Cl এ 1টি বন্ধন জোড় + 3টি মুক্তজোড় = 8টি ইলেকট্রন । তাই PCl₃ অষ্টক নিয়ম মানে।\n• PCl₅: উত্তেজিত অবস্থায় P এর 3s এর একটি ইলেকট্রন 3d তে যায় (3s1 3p³ 3d1), ফলে 5টি বিজোড় ইলেকট্রন হয়। এরা পাঁচটি Cl এর সাথে শেয়ার হয়ে 5টি P–Cl বন্ধন গঠন করে । এতে P এর সর্বশেষ স্তরে 5×2=10টি ইলেকট্রন হয়, যা 8 এর বেশি। তাই PCl₅ অষ্টক নিয়ম মানে না।\n2P+3Cl₂→2PCl₃\nPCl₃+Cl₂→PCl₅\nসুতরাং M ও N দ্বারা গঠিত PCl₃ অষ্টক নিয়ম মানে কিন্তু PCl₅ অষ্টক নিয়ম মানে না।"}]},{"id":"ch5-cq13","chapter":5,"num":13,"importance":3,"topic":"আয়নিক ও সমযোজী যৌগের বৈশিষ্ট্য","board":"ঢাকা বোর্ড ২০২৬","stem":"নিম্নোক্ত উদ্দীপকটি লক্ষ কর : A, B ও D প্রচলিত অর্থ বহন করে না।","diagramId":"ch5-cq13","subQuestions":[{"label":"ক","question":"আণবিক সংকেত কী?","answer":"যে সংকেতের মাধ্যমে কোনো পদার্থের একটি অণুতে উপস্থিত মৌলসমূহের পরমাণুর প্রকৃত সংখ্যা প্রকাশ করা হয়, তাকে আণবিক সংকেত বলে। যেমন: গ্লুকোজের আণবিক সংকেত C₆H₁₂O₆।"},{"label":"খ","question":"অ্যালকাইল মূলকসমূহ একযোজী মূলক—ব্যাখ্যা কর।","answer":"অ্যালকেন অণু থেকে একটি হাইড্রোজেন পরমাণু অপসারণ করলে যে মূলক পাওয়া যায়, তাকে অ্যালকাইল মূলক বলে। এর সাধারণ সংকেত CnH2n+₁-।\nCH₄-H→CH₃- (মিথাইল মূলক)\nCH₃-CH₃-H→CH₃-CH₂- (ইথাইল মূলক)\nএকটি H পরমাণু অপসারণের ফলে অ্যালকাইল মূলকের একটি কার্বন পরমাণুতে একটি মাত্র মুক্ত যোজনী থাকে, অর্থাৎ এটি একটি মাত্র বন্ধন গঠন করতে পারে (যেমন: CH₃-Cl, CH₃-OH)। তাই অ্যালকাইল মূলকসমূহ একযোজী মূলক।"},{"label":"গ","question":"পর্যায় সারণিতে উদ্দীপকের A মৌলের অবস্থান ব্যাখ্যা কর।","answer":"উদ্দীপকের চিত্র অনুযায়ী A পরমাণুর শক্তিস্তরসমূহে ইলেকট্রন সংখ্যা যথাক্রমে 2, 8, 7। অর্থাৎ মোট ইলেকট্রন সংখ্যা =2+8+ 7=17। সুতরাং A এর পারমাণবিক সংখ্যা 17 এবং A হলো ক্লোরিন (Cl)।\nA (17) : 1s² 2s² 2p⁶ 3s² 3p⁵ পর্যায় নির্ণয় কোনো মৌলের ইলেকট্রন বিন্যাসে সর্বোচ্চ যে শক্তিস্তরে ইলেকট্রন প্রবেশ করে, সেই শক্তিস্তরের ক্রমিক সংখ্যাই মৌলটির পর্যায় নির্দেশ করে। A এর সর্ববহিঃস্থ শক্তিস্তর তৃতীয় (n = 3)। তাই A মৌলটি পর্যায় সারণির ৩য় পর্যায়ে অবস্থিত । গ্রুপ নির্ণয় A এর সর্বশেষ ইলেকট্রন p অরবিটালে প্রবেশ করেছে, তাই এটি p- ব্লক মৌল। p-ব্লক মৌলের ক্ষেত্রে সর্ববহিঃস্থ শক্তিস্তরের s ও p অরবিটালের মোট ইলেকট্রন সংখ্যার সাথে 10 যোগ করলে গ্রুপ সংখ্যা পাওয়া যায়। গ্রুপ সংখ্যা =10+(3s এর ইলেকট্রন + 3p এর ইলেকট্রন)=10+(2+5)=17 সুতরাং, উদ্দীপকের A মৌলটি (Cl) পর্যায় সারণির ৩য় পর্যায়ের গ্রুপ-17 এ অবস্থিত । এটি একটি হ্যালোজেন ।"},{"label":"ঘ","question":"উদ্দীপকের A মৌলের সাথে B ও D দ্বারা পৃথকভাবে গঠিত যৌগদ্বয়ের উভয়টি পানিতে দ্রবণীয় কি না? বিশ্লেষণ কর।","answer":"গ অংশ থেকে, A হলো ক্লোরিন (Cl)। চিত্র অনুযায়ী B এর ইলেকট্রন সংখ্যা 2+8+2=12, অর্থাৎ B হলো ম্যাগনেসিয়াম (Mg); আর D এর ইলেকট্রন সংখ্যা 2+8+4=14, অর্থাৎ D হলো সিলিকন (Si)। A ও B দ্বারা গঠিত যৌগ: MgCl₂ Mg (2, 8, 2) সর্ববহিঃস্থ স্তরের 2টি ইলেকট্রন ত্যাগ করে Mg²⁺ আয়নে এবং দুটি Cl পরমাণু প্রত্যেকে 1টি করে ইলেকট্রন গ্রহণ করে Cl⁻ আয়নে পরিণত হয়। এরা স্থির বৈদ্যুতিক আকর্ষণে যুক্ত হয়ে আয়নিক যৌগ MgCl₂ গঠন করে ।\nMg→Mg²⁺+2e⁻\n2Cl+2e⁻→2Cl⁻\nMg²⁺+2Cl⁻→MgCl₂\nপানি একটি পোলার দ্রাবক । MgCl₂ পানিতে যোগ করলে পানির অণুর আংশিক ঋণাত্মক O প্রান্ত Mg²⁺ আয়নকে এবং আংশিক ধনাত্মক H প্রান্ত Cl⁻ আয়নকে আকর্ষণ করে ঘিরে ফেলে । ফলে আয়নগুলো কেলাস থেকে পৃথক হয়ে দ্রবণে চলে যায়। তাই MgCl₂ পানিতে দ্রবণীয় ।\nMgCl2(s) + পানি → Mg²⁺(aq)+2Cl⁻(aq)\nA ও D দ্বারা গঠিত যৌগ: SiCl₄ Si (2, 8, 4) এর সর্ববহিঃস্থ স্তরের 4টি ইলেকট্রন 4টি Cl পরমাণুর প্রত্যেকের 1টি করে ইলেকট্রনের সাথে শেয়ার করে 4টি Si-Cl সমযোজী বন্ধন গঠন করে । ফলে সমযোজী যৌগ SiCl₄ উৎপন্ন হয়।\nSi+2Cl₂→SiCl₄\nSiCl₄ অণু চতুস্তলকীয় ও প্রতিসম আকৃতির হওয়ায় Si-Cl বন্ধনগুলোর পোলারিটি পরস্পরকে প্রশমিত করে, তাই সামগ্রিকভাবে অণুটি অপোলার । এতে কোনো আয়ন থাকে না, ফলে পোলার দ্রাবক পানি এর অণুগুলোকে আয়নের মতো পৃথক করে দ্রবীভূত করতে পারে না। ‘সমধর্মী পদার্থ সমধর্মী দ্রাবকে দ্রবীভূত হয়’—এ নীতি অনুসারে SiCl₄ পানিতে দ্রবণীয় নয়; তবে এটি অপোলার জৈব দ্রাবকে (যেমন: বেনজিন, CCl₄) দ্রবীভূত হয়। প্রকৃতপক্ষে পানির সংস্পর্শে SiCl₄ দ্রবীভূত না হয়ে পানির সাথে বিক্রিয়া করে (আর্দ্রবিশ্লেষিত হয়ে) সিলিকা ও HCl উৎপন্ন করে ।\nSiCl₄+2H₂O→SiO₂+4HCl\nসুতরাং, উদ্দীপকের A এর সাথে B দ্বারা গঠিত আয়নিক যৌগ MgCl₂ পানিতে দ্রবণীয়, কিন্তু D দ্বারা গঠিত সমযোজী যৌগ SiCl₄ পানিতে দ্রবণীয় নয়। অর্থাৎ যৌগদ্বয়ের উভয়টি পানিতে দ্রবণীয় নয়।"}]},{"id":"ch5-cq14","chapter":5,"num":14,"importance":3,"topic":"আয়নিক ও সমযোজী যৌগের বৈশিষ্ট্য","board":"দিনাজপুর বোর্ড ২০২৬","stem":"মৌল X Y Z পারমাণবিক সংখ্যা 14 8 11 [এখানে X, Y, Z প্রকৃত মৌল নয়, প্রতীকী অর্থে ব্যবহৃত]","subQuestions":[{"label":"ক","question":"সমাণু কাকে বলে?","answer":"সমাণু: যেসব যৌগের আণবিক সংকেত একই কিন্তু গাঠনিক সংকেত ভিন্ন হওয়ায় ধর্মে ভিন্নতা দেখা যায়, তাদেরকে পরস্পরের সমাণু বলে।\nযেমন: CH₃-CH₂-OH ও CH₃-O-CH₃।"},{"label":"খ","question":"আয়োডিনকে হ্যালোজেন বলা হয় — ব্যাখ্যা কর।","answer":"হ্যালোজেন শব্দের অর্থ লবণ উৎপাদক । পর্যায় সারণির ১৭ নং গ্রুপের মৌলগুলোকে হ্যালোজেন বলে। I (53) : [Kr] 4d¹⁰ 5s² 5p⁵ আয়োডিনের সর্বশেষ শক্তিস্তরে 7টি ইলেকট্রন থাকায় এটি ১৭ নং গ্রুপের মৌল। এটি ধাতুর সাথে বিক্রিয়া করে লবণ উৎপন্ন করে ।\nযেমন:\n2Na+I₂→2NaI\nতাই আয়োডিনকে হ্যালোজেন বলা হয়।"},{"label":"গ","question":"Y₂ এর বন্ধন গঠন প্রক্রিয়া ডায়াগ্রামচিত্রসহ বর্ণনা কর।","answer":"উদ্দীপকের Y এর পারমাণবিক সংখ্যা 8, তাই Y হলো অক্সিজেন (O) এবং Y₂ হলো O₂। O (8) : 1s² 2s² 2p⁴ বা 2, 6 অক্সিজেন পরমাণুর সর্বশেষ শক্তিস্তরে 6টি ইলেকট্রন রয়েছে । নিকটতম নিষ্ক্রিয় গ্যাস নিয়নের (2, 8) মতো স্থিতিশীল ইলেকট্রন বিন্যাস অর্জনের জন্য প্রতিটি O পরমাণুর আরও 2টি ইলেকট্রন প্রয়োজন । তাই দুটি O পরমাণু প্রত্যেকে তাদের সর্বশেষ শক্তিস্তর থেকে 2টি করে ইলেকট্রন দিয়ে মোট দুই জোড়া ইলেকট্রন শেয়ার করে। ফলে প্রতিটি O পরমাণুর সর্বশেষ স্তরে 8টি ইলেকট্রন হয় এবং অষ্টক পূর্ণ হয়।\n:Ö: + :Ö: → :Ö::Ö:\nO+O→O=O\nএক্ষেত্রে দুটি ইলেকট্রন জোড় শেয়ার হওয়ায় O₂ অণুতে দুই পরমাণুর মধ্যে সমযোজী দ্বিবন্ধন (O=O) গঠিত হয়। এভাবে Y₂ অর্থাৎ O₂ অণু গঠিত হয়।"},{"label":"ঘ","question":"Z₂Y এবং XY₂ এর মধ্যে কোনটি পানিতে দ্রবণীয় — যৌক্তিক মতামত দাও।","answer":"উদ্দীপক অনুসারে, X এর পারমাণবিক সংখ্যা 14, তাই X হলো সিলিকন (Si); Y হলো অক্সিজেন (O) এবং Z এর পারমাণবিক সংখ্যা 11, তাই Z হলো সোডিয়াম (Na)। সুতরাং Z₂Y হলো Na₂O এবং XY₂ হলো SiO₂। Na (11) : 2, 8, 1 ; Si (14) : 2, 8, 4 ; O (8) : 2, 6 Na₂O এর বন্ধন Na ধাতু এবং O অধাতু । দুটি Na পরমাণু প্রত্যেকে একটি করে ইলেকট্রন ত্যাগ করে Na⁺ আয়নে এবং O পরমাণু দুটি ইলেকট্রন গ্রহণ করে O²⁻ আয়নে পরিণত হয়। এই বিপরীত আধানবিশিষ্ট আয়নসমূহের আকর্ষণে আয়নিক বন্ধন গঠিত হয়।\n2Na→2Na⁺+2e⁻ ; O+2e⁻→O²⁻\nNa₂O একটি আয়নিক যৌগ। পানি পোলার দ্রাবক, তাই পানির অণুর\nআংশিক ধনাত্মক ও ঋণাত্মক প্রান্ত আয়নগুলোকে আকর্ষণ করে পৃথক করে ফেলে । ফলে Na₂O পানিতে দ্রবীভূত হয় এবং ক্ষার দ্রবণ উৎপন্ন করে ।\nNa₂O+H₂O→2NaOH\nSiO₂ এর বন্ধন Si ও O উভয়ই অধাতু (Si অপধাতু)। এদের মধ্যে ইলেকট্রন শেয়ারের মাধ্যমে সমযোজী বন্ধন গঠিত হয়। SiO₂ এ প্রতিটি Si পরমাণু চারটি O পরমাণুর সাথে এবং প্রতিটি O দুটি Si এর সাথে যুক্ত হয়ে বিশাল ত্রিমাত্রিক জালক (দৈত্যাকার সমযোজী গঠন) তৈরি করে। SiO₂ এ কোনো আয়ন নেই এবং এর জালক কাঠামো অত্যন্ত দৃঢ়। পানির অণু এই শক্তিশালী সমযোজী বন্ধন ভাঙতে পারে না। তাই SiO₂ (বালি) পানিতে অদ্রবণীয় । সুতরাং, Z₂Y (Na₂O) পানিতে দ্রবণীয় এবং XY₂ (SiO₂) পানিতে অদ্রবণীয় ।"}]},{"id":"ch5-cq15","chapter":5,"num":15,"importance":3,"topic":"আয়নিক ও সমযোজী যৌগের বৈশিষ্ট্য","board":"যশোর বোর্ড ২০২৬","stem":"(i)AB₂(g)+B₂(g)⇌AB₃(g)\n[যেখানে A ও B প্রচলিত মৌলের প্রতীক নয়] (ii) একটি যৌগের 20g কে বিশ্লেষণ করে 3.24g ম্যাগনেসিয়াম, 3.783g নাইট্রোজেন এবং 12.977g অক্সিজেন পাওয়া গেল।","subQuestions":[{"label":"ক","question":"স্টয়কিওমিতি কাকে বলে?","answer":"রাসায়নিক বিক্রিয়ায় অংশগ্রহণকারী বিক্রিয়ক ও উৎপন্ন উৎপাদের মোল সংখ্যার পারস্পরিক সম্পর্ককে (মোল অনুপাতকে) স্টয়কিওমিতি বলে।"},{"label":"খ","question":"নাইট্রোজেন ও অক্সিজেনের মধ্যে কোনটির ইলেকট্রন আসক্তি বেশি? ব্যাখ্যা কর।","answer":"নাইট্রোজেন ও অক্সিজেনের মধ্যে অক্সিজেনের ইলেকট্রন আসক্তি বেশি। N (7): 1s² 2s² 2p³ এবং O (8): 1s² 2s² 2p⁴। নাইট্রোজেনের 2p অরবিটাল অর্ধপূর্ণ (2p3) হওয়ায় এটি স্থিতিশীল, তাই নাইট্রোজেন সহজে বাড়তি ইলেকট্রন গ্রহণ করতে চায় না। অপরদিকে অক্সিজেনের নিউক্লিয়ার চার্জ বেশি ও আকার ছোট এবং ইলেকট্রন গ্রহণ করে এটি নিষ্ক্রিয় গ্যাসের স্থিতিশীল বিন্যাসের দিকে এগোয় । তাই অক্সিজেন সহজে ইলেকট্রন গ্রহণ করে এবং এর ইলেকট্রন আসক্তি নাইট্রোজেনের চেয়ে বেশি।"},{"label":"গ","question":"উদ্দীপকের (i) নং বিক্রিয়ায় সাম্যাবস্থায় লা-শাতেলীয় নীতি অনুসারে চাপের প্রভাব ব্যাখ্যা কর।","answer":"উদ্দীপকের (i) নং বিক্রিয়াটির সমতাকৃত রূপ:\n2AB₂(g)+B₂(g)⇌2AB₃(g)\nলা-শাতেলীয় নীতি: সাম্যাবস্থায় থাকা কোনো বিক্রিয়ায় তাপমাত্রা,\nচাপ বা ঘনমাত্রার কোনো একটি পরিবর্তন করলে সাম্যাবস্থা এমন দিকে সরে যায় যাতে ঐ পরিবর্তনের প্রভাব প্রশমিত হয়। বিক্রিয়ক পক্ষে গ্যাসের মোল সংখ্যা =2+1=3 উৎপাদ পক্ষে গ্যাসের মোল সংখ্যা = 2 অর্থাৎ সম্মুখ বিক্রিয়ায় গ্যাসের মোল সংখ্যা তথা আয়তন হ্রাস পায়।\n• চাপ বৃদ্ধি করলে সাম্যাবস্থা যেদিকে আয়তন (মোল সংখ্যা) কম সেদিকে, অর্থাৎ ডানদিকে সরে যায়। ফলে AB₃ এর উৎপাদন বৃদ্ধি পায়।\n• চাপ হ্রাস করলে সাম্যাবস্থা যেদিকে মোল সংখ্যা বেশি সেদিকে, অর্থাৎ বামদিকে সরে যায়। ফলে AB₃ বিয়োজিত হয়ে AB₂ ও B₂ বেশি উৎপন্ন হয়। অতএব, (i) নং বিক্রিয়ায় উচ্চ চাপ AB₃ উৎপাদনের অনুকূল ।"},{"label":"ঘ","question":"উদ্দীপকের (ii) নং যৌগটির আপেক্ষিক ভর 148 হলে, যৌগটি বিদ্যুৎ পরিবাহী হবে কি? বিশ্লেষণ কর।","answer":"(ii) নং যৌগে বিদ্যমান মৌলগুলোর মোল সংখ্যা নির্ণয়: Mg=3.24/24=0.135mol N=3.783/14=0.270mol O=12.977/16=0.811mol ক্ষুদ্রতম মান 0.135 দিয়ে ভাগ করে: Mg : N : O=0.135/0.135 : 0.270/0.135 : 0.811/0.135=1 : 2 : 6 স্থূল সংকেত = MgN₂O₆ স্থূল সংকেত ভর =24+(14×2)+(16×6)=148 n = আণবিক ভর/স্থূল সংকেত ভর =148/148=1 সুতরাং যৌগটির আণবিক সংকেত MgN₂O₆ অর্থাৎ Mg(NO₃)₂ (ম্যাগনেসিয়াম নাইট্রেট)। Mg(NO₃)₂ একটি আয়নিক যৌগ। এতে ধাতু Mg (2, 8, 2) দুটি ইলেকট্রন ত্যাগ করে Mg²⁺ ক্যাটায়ন এবং নাইট্রেট মূলক NO₃⁻ অ্যানায়ন হিসেবে থাকে:\nMg(NO₃)₂→Mg²⁺+2NO₃⁻\n• কঠিন অবস্থায় আয়নগুলো কেলাস জালিতে দৃঢ়ভাবে আবদ্ধ থাকে, মুক্তভাবে চলাচল করতে পারে না। তাই কঠিন Mg(NO₃)₂ বিদ্যুৎ পরিবহন করে না।\n• গলিত অবস্থায় বা পানিতে দ্রবীভূত করলে Mg²⁺ ও NO₃⁻ আয়নগুলো মুক্ত হয়ে চলাচল করতে পারে এবং আধান বহন করে। তাই তখন এটি বিদ্যুৎ পরিবহন করে। অতএব, (ii) নং যৌগটি [Mg(NO₃)₂] কঠিন অবস্থায় বিদ্যুৎ অপরিবাহী, কিন্তু গলিত বা জলীয় দ্রবণে বিদ্যুৎ পরিবাহী হবে।"}]},{"id":"ch5-cq16","chapter":5,"num":16,"importance":3,"topic":"আয়নিক ও সমযোজী যৌগের বৈশিষ্ট্য","board":"সিলেট বোর্ড ২০২৬","stem":"মৌল পর্যায় গ্রুপ X 3 2 Y 3 17 Z 2 14 [X, Y, Z প্রতীকী অর্থে ব্যবহৃত]","subQuestions":[{"label":"ক","question":"সংকেত কাকে বলে?","answer":"সংকেত: কোনো মৌলিক বা যৌগিক পদার্থের একটি অণুতে উপস্থিত পরমাণুগুলোর প্রতীক ও সংখ্যার সংক্ষিপ্ত রূপকে ঐ পদার্থের সংকেত বলে। যেমন: পানির সংকেত H₂O।"},{"label":"খ","question":"নিয়ন যৌগ গঠন করে না কেন? ব্যাখ্যা করো।","answer":"Ne(10) : 1s² 2s² 2p⁶ নিয়নের সর্বশেষ শক্তিস্তরে 8টি ইলেকট্রন আছে, অর্থাৎ এর অষ্টক পূর্ণ এবং ইলেকট্রন বিন্যাস অত্যন্ত স্থিতিশীল । ফলে নিয়ন ইলেকট্রন গ্রহণ, ত্যাগ বা শেয়ার করে না; এর যোজনী শূন্য। তাই নিয়ন অন্য কোনো মৌলের সাথে রাসায়নিক বন্ধন গঠন করে যৌগ গঠন করে না।"},{"label":"গ","question":"উদ্দীপকের Y ও Z দ্বারা গঠিত যৌগের বন্ধন গঠন প্রক্রিয়া ব্যাখ্যা করো।","answer":"উদ্দীপকের Y মৌলটি তৃতীয় পর্যায়ের গ্রুপ 17 এ অবস্থিত, তাই Y হলো ক্লোরিন (Cl)। Z মৌলটি দ্বিতীয় পর্যায়ের গ্রুপ 14 এ অবস্থিত, তাই Z হলো কার্বন (C)। Y ও Z দ্বারা গঠিত যৌগ কার্বন টেট্রাক্লোরাইড (CCl₄)। C(6) : 1s² 2s² 2p² Cl(17) : 1s² 2s² 2p⁶ 3s² 3p⁵ কার্বনের সর্বশেষ স্তরে 4টি ইলেকট্রন আছে। অষ্টক পূর্ণ করতে তার আরও 4টি ইলেকট্রন প্রয়োজন । ক্লোরিনের সর্বশেষ স্তরে 7টি ইলেকট্রন আছে, অষ্টক পূর্ণ করতে 1টি ইলেকট্রন প্রয়োজন । কার্বন ইলেকট্রন ত্যাগ বা গ্রহণ না করে তার 4টি যোজ্যতা ইলেকট্রন চারটি Cl পরমাণুর প্রত্যেকটির 1টি করে ইলেকট্রনের সাথে শেয়ার করে। ফলে 4 জোড়া ইলেকট্রন শেয়ারের মাধ্যমে চারটি C-Cl সমযোজী একক বন্ধন গঠিত হয়।\nC+2Cl₂→CCl₄\nবন্ধন গঠনের পর C পরমাণু নিয়নের (Ne) এবং প্রতিটি Cl পরমাণু আর্গনের (Ar) ইলেকট্রন বিন্যাস অর্জন করে । গাঠনিক সংকেত: Cl - C(Cl)(Cl) - Cl, অর্থাৎ কেন্দ্রীয় C পরমাণুর সাথে চারটি Cl পরমাণু একক বন্ধনে যুক্ত সুতরাং Y ও Z ইলেকট্রন শেয়ারের মাধ্যমে সমযোজী বন্ধন গঠন করে সমযোজী যৌগ CCl₄ উৎপন্ন করে ।"},{"label":"ঘ","question":"উদ্দীপকের X ও Y দ্বারা গঠিত যৌগের জলীয় দ্রবণের তড়িৎ পরিবহনের সম্ভাব্যতা যাচাই করো।","answer":"উদ্দীপকের X মৌলটি তৃতীয় পর্যায়ের গ্রুপ 2 এ অবস্থিত, তাই X হলো ম্যাগনেসিয়াম (Mg)। Y হলো ক্লোরিন (Cl)। X ও Y দ্বারা গঠিত যৌগ ম্যাগনেসিয়াম ক্লোরাইড (MgCl₂)। Mg(12) : 1s² 2s² 2p⁶ 3s² Mg তার সর্বশেষ স্তরের 2টি ইলেকট্রন ত্যাগ করে Mg²⁺ আয়নে এবং দুটি Cl পরমাণু 1টি করে ইলেকট্রন গ্রহণ করে Cl⁻ আয়নে পরিণত হয়। এই বিপরীত চার্জযুক্ত আয়নগুলোর মধ্যে স্থির বৈদ্যুতিক আকর্ষণে আয়নিক বন্ধন গঠিত হয়।\nMg+Cl₂→MgCl₂\nঅর্থাৎ MgCl₂ একটি আয়নিক যৌগ। কঠিন অবস্থায় এর আয়নগুলো কেলাস জালিতে দৃঢ়ভাবে আবদ্ধ থাকে, তাই কঠিন MgCl₂ বিদ্যুৎ পরিবহন করে না। কিন্তু পানিতে দ্রবীভূত করলে পোলার পানির অণু আয়নগুলোকে আলাদা করে দেয় এবং এরা মুক্ত আয়ন হিসেবে দ্রবণে চলাচল করতে পারে।\nMgCl2(aq)→Mg²⁺(aq)+2Cl⁻(aq)\nএই দ্রবণে দুটি ইলেকট্রোড ডুবিয়ে বিদ্যুৎ প্রবাহ চালালে Mg²⁺ আয়ন\nক্যাথোডের দিকে এবং Cl⁻ আয়ন অ্যানোডের দিকে গমন করে ।\nঅ্যানোডে Cl⁻ আয়ন ইলেকট্রন ত্যাগ করে Cl₂ গ্যাস উৎপন্ন করে এবং ক্যাথোডে পানির বিজারণে H₂ গ্যাস উৎপন্ন হয়।\nঅ্যানোডে: 2Cl⁻→Cl₂+2e⁻\nক্যাথোডে: 2H₂O+2e⁻→H₂+2OH⁻\nমুক্ত আয়নের চলাচলের মাধ্যমে দ্রবণের মধ্য দিয়ে বিদ্যুৎ প্রবাহিত হয়। সুতরাং X ও Y দ্বারা গঠিত যৌগ MgCl₂ এর জলীয় দ্রবণ তড়িৎ পরিবহন করে; এটি একটি তড়িৎ বিশ্লেষ্য পদার্থ ।"}]},{"id":"ch5-cq17","chapter":5,"num":17,"importance":3,"topic":"ধাতব বন্ধন","board":"কুমিল্লা বোর্ড ২০২৩","stem":"মৌল বহিঃস্থ স্তরের সর্ববহিঃস্থ শক্তিস্তরের ইলেকট্রন বিন্যাস (n) মান P ns²np¹ 3 Q ns² 3 R ns¹ 1 S ns²np⁵ 3 [P, Q, R, S প্রতীকী অর্থে ব্যবহৃত]","subQuestions":[{"label":"ক","question":"পারমাণবিক শাঁস কাকে বলে?","answer":"ধাতব পরমাণু সর্বশেষ শক্তিস্তরের এক বা একাধিক ইলেকট্রন ত্যাগ করে যে ধনাত্মক আয়নে পরিণত হয়, তাকে পারমাণবিক শাঁস বলে।"},{"label":"খ","question":"Li এর যোজনী এবং যোজ্যতা ইলেকট্রন একই–ব্যাখ্যা কর।","answer":"Li (3): 1s² 2s¹। এর সর্বশেষ শক্তিস্তরে 1টি ইলেকট্রন আছে, তাই যোজ্যতা ইলেকট্রন 1। যৌগ গঠনের সময় Li এই 1টি ইলেকট্রন ত্যাগ করে Li⁺ আয়নে পরিণত হয় এবং একটি Cl পরমাণুর সাথে যুক্ত হয়ে LiCl গঠন করে। তাই Li এর যোজনীও 1।\nLi→Li⁺+e⁻\nসুতরাং Li এর যোজনী এবং যোজ্যতা ইলেকট্রন একই (1)।"},{"label":"গ","question":"উদ্দীপকের 'P' এর বিদ্যুৎ পরিবহণের কৌশল বর্ণনা কর।","answer":"P এর সর্ববহিঃস্থ স্তর n = 3 এবং বিন্যাস ns2 np1, অর্থাৎ 3s² 3p¹।\nP: 1s² 2s² 2p⁶ 3s² 3p¹ → পারমাণবিক সংখ্যা 13→P= অ্যালুমিনিয়াম (Al), একটি ধাতু।\nAl এর শেষ স্তরে 3টি ইলেকট্রন আছে এবং এগুলোর প্রতি নিউক্লিয়াসের আকর্ষণ কম। তাই ধাতব খণ্ডে প্রতিটি Al পরমাণু 3টি ইলেকট্রন ত্যাগ করে Al³⁺ আয়ন বা পারমাণবিক শাঁসে পরিণত হয়।\nAl→Al³⁺+3e⁻\nAl³⁺ শাঁসগুলো স্ফটিকে ত্রিমাত্রিকভাবে সজ্জিত থাকে, আর ত্যাগকৃত ইলেকট্রনগুলো শাঁসগুলোর মধ্যবর্তী স্থানে সঞ্চরণশীল ইলেকট্রন হিসেবে মুক্তভাবে ঘোরাফেরা করে; এরা কোনো নির্দিষ্ট পরমাণুর অধীনে থাকে না। Al খণ্ডের দুই প্রান্তে ব্যাটারির (+) ও (-) প্রান্ত যুক্ত করলে সঞ্চরণশীল ইলেকট্রনগুলো Al³⁺ আয়নের মাঝ দিয়ে ঋণাত্মক প্রান্ত থেকে ধনাত্মক প্রান্তের দিকে প্রবাহিত হয়। ফলে বিদ্যুৎ ধনাত্মক প্রান্ত থেকে ঋণাত্মক প্রান্তের দিকে প্রবাহিত হয়। সুতরাং সঞ্চরণশীল ইলেকট্রনের প্রবাহের মাধ্যমেই P (Al) বিদ্যুৎ পরিবহন করে।"},{"label":"ঘ","question":"QS₂ ও R2 এর মধ্যে কোনটি পানিতে দ্রবণীয় হবে? বিশ্লেষণ কর।","answer":"শনাক্তকরণ:\n• Q: n = 3, ns2 → 3s² → 1s² 2s² 2p⁶ 3s² → পারমাণবিক\nসংখ্যা 12→Q= ম্যাগনেসিয়াম (Mg)।\n• R: n=1,ns1→1s¹→R= হাইড্রোজেন (H)।\n• S: n = 3, ns2 np5 → 1s² 2s² 2p⁶ 3s² 3p⁵ → পারমাণবিক\nসংখ্যা 17→S= ক্লোরিন (Cl)।\nঅতএব QS₂=MgCl₂ এবং R2 = H₂।\nMgCl₂: Mg ধাতু ও Cl অধাতু । Mg দুটি ইলেকট্রন ত্যাগ করে Mg²⁺ এবং দুটি Cl প্রতিটি একটি করে ইলেকট্রন গ্রহণ করে Cl⁻ আয়নে পরিণত হয়; ফলে আয়নিক যৌগ MgCl₂ গঠিত হয়।\nMg→Mg²⁺+2e⁻\nCl₂+2e⁻→2Cl⁻\nMg²⁺+2Cl⁻→MgCl₂\nপানি একটি পোলার দ্রাবক (Oδ⁻ ও Hδ⁺)। MgCl₂ কে পানিতে নিলে পানির Oδ⁻ প্রান্ত Mg²⁺ কে এবং Hδ⁺ প্রান্ত Cl⁻ কে আকর্ষণ করে ঘিরে ফেলে । ফলে আয়নগুলো কেলাস থেকে বিচ্ছিন্ন হয়ে পানিতে ছড়িয়ে পড়ে, অর্থাৎ MgCl₂ পানিতে দ্রবীভূত হয়। H₂: দুটি H পরমাণু এক জোড়া ইলেকট্রন শেয়ার করে H-H সমযোজী বন্ধন গঠন করে । দুটি পরমাণু একই, তড়িৎ ঋণাত্মকতার পার্থক্য শূন্য, তাই H₂ অপোলার সমযোজী অণু। এতে কোনো আংশিক চার্জ নেই বলে পোলার পানির সাথে আকর্ষণ সৃষ্টি হয় না, ফলে H₂ পানিতে দ্রবীভূত হয় না। সুতরাং QS₂ (MgCl₂) পানিতে দ্রবণীয় হবে, কিন্তু R2 (H₂) পানিতে দ্রবণীয় হবে না।"}]},{"id":"ch6-cq1","chapter":6,"num":1,"importance":3,"topic":"মোল","board":"বরিশাল বোর্ড ২০২৬","stem":"নিচের উদ্দীপকটি পড়ো এবং প্রশ্নগুলোর উত্তর দাও:","diagramId":"ch6-cq1","subQuestions":[{"label":"ক","question":"মোল কাকে বলে?","answer":"কোনো পদার্থের যে পরিমাণে 6.02 × 10²³ টি অণু, পরমাণু বা আয়ন থাকে, সেই পরিমাণকে ঐ পদার্থের এক মোল বলে। অর্থাৎ পদার্থের আণবিক বা পারমাণবিক ভরকে গ্রামে প্রকাশ করলে তাকে এক মোল বলে।"},{"label":"খ","question":"ইথানল পানিতে দ্রবীভূত হয় কেন? ব্যাখ্যা কর।","answer":"ইথানলের (CH₃-CH₂-OH) অণুতে পোলার -OH মূলক আছে। ইথানলের -OH মূলকের অক্সিজেন ও হাইড্রোজেন পানির অণুর সাথে হাইড্রোজেন বন্ধন গঠন করতে পারে। তাছাড়া ইথানল ও পানি উভয়ই পোলার যৌগ, আর ‘সমধর্মী পদার্থ সমধর্মী দ্রাবকে দ্রবীভূত হয়’। এছাড়া ইথানলের অ্যালকাইল অংশটি ছোট হওয়ায় তা দ্রবণীয়তায় বাধা দিতে পারে না। তাই ইথানল পানিতে যেকোনো অনুপাতে দ্রবীভূত হয়।"},{"label":"গ","question":"উদ্দীপকের Y পাত্রের দ্রবণের মোলারিটি নির্ণয় কর।","answer":"উদ্দীপকের Y পাত্রে 200 mL পানিতে 5 g Mg(OH)₂ দ্রবীভূত আছে। Mg(OH)₂ এর আণবিক ভর =24+(16+1)×2=58 আমরা জানি, S = W/(M × V)\nএখানে, দ্রবের ভর W = 5 g, আণবিক ভর M=58g/mol, দ্রবণের আয়তন V = 200 mL = 0.2 L S=5/(58×0.2)mol/L =5/11.6mol/L = 0.431 M অতএব, Y পাত্রের দ্রবণের মোলারিটি 0.431 M।"},{"label":"ঘ","question":"উদ্দীপকের X ও Y পাত্র দুটির দ্রবণদ্বয়কে মিশ্রিত করলে কী পরিমাণ লবণ উৎপন্ন হবে? গাণিতিক যুক্তি দাও।","answer":"X পাত্রে 5 g HCl এবং Y পাত্রে 5 g Mg(OH)₂ আছে। দ্রবণদ্বয় মিশ্রিত করলে প্রশমন বিক্রিয়ায় MgCl₂ লবণ ও পানি উৎপন্ন হয়:\nMg(OH)₂+2HCl→MgCl₂+2H₂O\nমোলার ভর: Mg(OH)₂=58g/mol; HCl=1+35.5=36.5g/mol; MgCl₂ = 24 + 35.5 × 2 = 95 g/mol লিমিটিং বিক্রিয়ক নির্ণয় HCl এর মোল সংখ্যা =5/36.5=0.137mol Mg(OH)₂ এর মোল সংখ্যা =5/58=0.0862mol সমীকরণ অনুযায়ী, 1 mol Mg(OH)₂ এর সাথে 2 mol HCl বিক্রিয়া করে। 0.0862 mol Mg(OH)₂ এর জন্য প্রয়োজনীয় HCl=0.0862× 2=0.1724mol কিন্তু HCl আছে মাত্র 0.137 mol, যা প্রয়োজনের চেয়ে কম। সুতরাং HCl লিমিটিং বিক্রিয়ক এবং Mg(OH)₂ অতিরিক্ত থাকবে। উৎপন্ন লবণের পরিমাণ সমীকরণ অনুযায়ী, 2×36.5=73gHCl থেকে উৎপন্ন হয় 95 g MgCl₂ 5 g HCl থেকে উৎপন্ন MgCl₂ = (95 × 5)/73 g = 6.51 g অতএব, X ও Y পাত্রের দ্রবণদ্বয় মিশ্রিত করলে 6.51 g ম্যাগনেসিয়াম ক্লোরাইড (MgCl₂) লবণ উৎপন্ন হবে।"}]},{"id":"ch6-cq2","chapter":6,"num":2,"importance":3,"topic":"মোল","board":"কুমিল্লা বোর্ড ২০২৬","stem":"360 গ্রাম ভরের একটি X যৌগকে বিশ্লেষণ করে 144 গ্রাম কার্বন, 24 গ্রাম হাইড্রোজেন এবং 192 গ্রাম অক্সিজেন পাওয়া গেল। যৌগটির আণবিক ভর 180।","subQuestions":[{"label":"ক","question":"সেমি-মোলার দ্রবণ কাকে বলে?","answer":"সেমি-মোলার দ্রবণ: নির্দিষ্ট তাপমাত্রায় প্রতি লিটার দ্রবণে 0.5 মোল দ্রব দ্রবীভূত থাকলে, সেই দ্রবণকে সেমি-মোলার দ্রবণ (0.5 M) বলে।"},{"label":"খ","question":"ধাতুসমূহ বিদ্যুৎ পরিবহন করে কেন? ব্যাখ্যা কর।","answer":"ধাতব পরমাণুগুলো তাদের যোজ্যতা ইলেকট্রন ত্যাগ করে ধনাত্মক আয়নে পরিণত হয়। ত্যাগকৃত ইলেকট্রনগুলো কোনো নির্দিষ্ট পরমাণুর অধীনে না থেকে সমগ্র ধাতব কেলাসে মুক্তভাবে চলাচল করে, যাকে ইলেকট্রন সমুদ্র বলে । ধাতুর দুই প্রান্তে বিভব পার্থক্য প্রয়োগ করলে এই মুক্ত বা সচল ইলেকট্রনগুলো ধনাত্মক প্রান্তের দিকে প্রবাহিত হয়, ফলে বিদ্যুৎ প্রবাহিত হয়। ধাতব বন্ধনে মুক্ত ইলেকট্রন থাকার কারণেই ধাতুসমূহ বিদ্যুৎ পরিবহন করে।"},{"label":"গ","question":"X যৌগটির 250 mL ডেসিমোলার দ্রবণ কীভাবে প্রস্তুত করবে তা বর্ণনা কর।","answer":"প্রথমে X যৌগের সংকেত নির্ণয় করি:\nC এর মোল সংখ্যা =144/12=12mol H এর মোল সংখ্যা =24/1=24mol O এর মোল সংখ্যা =192/16=12mol C : H : O = 12 : 24 : 12 = 1 : 2 : 1 স্থূল সংকেত CH₂O, যার ভর =12+2+16=30 n=180/30=6; আণবিক সংকেত = (CH₂O)₆=C₆H₁₂O₆ (গ্লুকোজ) ডেসিমোলার দ্রবণ অর্থ 0.1 M দ্রবণ । প্রয়োজনীয় দ্রবের ভর, W = S × M × V\nএখানে, মোলারিটি S = 0.1 M, আণবিক ভর M=180g/mol, আয়তন V = 250 mL = 0.25 L W=0.1×180×0.25g = 4.5 g প্রস্তুত প্রণালি\n১. একটি পরিষ্কার ওয়াচ গ্লাসে ইলেকট্রনিক ব্যালেন্সের সাহায্যে সঠিকভাবে 4.5 g গ্লুকোজ (C₆H₁₂O₆) মেপে নিতে হবে।\n২. ফানেলের সাহায্যে গ্লুকোজটুকু একটি 250 mL আয়তনিক ফ্লাস্কে স্থানান্তর করতে হবে এবং ওয়াচ গ্লাস ও ফানেল পাতিত পানি দিয়ে ধুয়ে ধোয়া পানিও ফ্লাস্কে নিতে হবে।\n৩. ফ্লাস্কে কিছু পাতিত পানি যোগ করে ঝাঁকিয়ে গ্লুকোজ সম্পূর্ণ দ্রবীভূত করতে হবে।\n৪. এরপর ফ্লাস্কের দাগ পর্যন্ত পাতিত পানি যোগ করতে হবে (শেষের দিকে ড্রপার দিয়ে) এবং ছিপি লাগিয়ে উল্টে-পাল্টে দ্রবণটিকে সুষম করতে হবে। এভাবে X যৌগের (গ্লুকোজের) 250 mL ডেসিমোলার (0.1 M) দ্রবণ প্রস্তুত করা যায়।"},{"label":"ঘ","question":"X যৌগের আণবিক সংকেত ও স্থূল সংকেত একই নয়—বিশ্লেষণ কর।","answer":"উদ্দীপকের X যৌগে— C এর মোল সংখ্যা =144/12=12; H এর মোল সংখ্যা =24/1=24; O এর মোল সংখ্যা =192/16=12 C : H : O = 12 : 24 : 12 = 1 : 2 : 1 অতএব, X এর স্থূল সংকেত CH₂O। স্থূল সংকেতের ভর =12+(1×2)+16=30 n = আণবিক ভর/স্থূল সংকেতের ভর =180/30=6 আণবিক সংকেত = (CH₂O)₆=C₆H₁₂O₆ স্থূল সংকেত কেবল অণুতে উপস্থিত পরমাণুগুলোর সরলতম অনুপাত প্রকাশ করে, কিন্তু আণবিক সংকেত অণুতে প্রতিটি মৌলের পরমাণুর প্রকৃত সংখ্যা প্রকাশ করে। আণবিক সংকেত = (স্থূল সংকেত)n; যখন n = 1 তখনই কেবল দুটি সংকেত একই হয়। X যৌগের ক্ষেত্রে n = 6 (n ≠ 1)। অর্থাৎ X এর একটি অণুতে 6টি C, 12টি H ও 6টি O পরমাণু থাকে (C₆H₁₂O₆), যদিও এদের সরলতম অনুপাত 1 : 2 : 1 (CH₂O)। সুতরাং X যৌগের (গ্লুকোজের) আণবিক সংকেত C₆H₁₂O₆ ও স্থূল সংকেত CH₂O একই নয়।"}]},{"id":"ch6-cq3","chapter":6,"num":3,"importance":3,"topic":"মোল","board":"রাজশাহী বোর্ড ২০২৪","stem":"(i)C+2′R′→CS₂\n(ii)2P+3Cl₂→2PCl₃","subQuestions":[{"label":"ক","question":"প্রতীক কাকে বলে?","answer":"মৌলের পূর্ণ নাম বা ইংরেজি/ল্যাটিন নামের সংক্ষিপ্ত রূপকে প্রতীক বলে। প্রতীক দ্বারা মৌলের একটি পরমাণুকেও বোঝায় ।\nযেমন: হাইড্রোজেনের প্রতীক H, সোডিয়ামের প্রতীক Na।"},{"label":"খ","question":"Ca-একটি মৃৎক্ষার ধাতু- ব্যাখ্যা কর।","answer":"Ca পর্যায় সারণির গ্রুপ-2 এর মৌল; এর ইলেকট্রন বিন্যাস 1s² 2s² 2p⁶ 3s² 3p⁶ 4s²। গ্রুপ-2 এর মৌলগুলোর অক্সাইড ও হাইড্রক্সাইড ক্ষারধর্মী (যেমন: CaO, Ca(OH)₂) এবং এদের যৌগ মাটি বা ভূত্বকে বিভিন্ন খনিজ (যেমন: চুনাপাথর CaCO₃, জিপসাম CaSO₄.2H₂O) হিসেবে পাওয়া যায়। এজন্য গ্রুপ-2 এর মৌলগুলোকে মৃৎক্ষার ধাতু বলা হয়। তাই Ca একটি মৃৎক্ষার ধাতু।"},{"label":"গ","question":"উদ্দীপকের (i)নং এর উৎপাদ যৌগটির একটি অণুর ভর নির্ণয় কর।","answer":"(i) নং বিক্রিয়া: C+2′R′→CS₂। উৎপাদে C ছাড়া কেবল S\nআছে, তাই R হলো সালফার (S)।\nC+2S→CS₂\nউৎপাদ যৌগটি কার্বন ডাইসালফাইড (CS₂)।\nCS₂-এর আণবিক ভর =12+32×2=76 1 মোল বা 76 g CS₂ তে অণু থাকে 6.023 × 10²³ টি।\n∴ 1টি CS₂ অণুর ভর =76/(6.023×10²³)g=1.262×10⁻²²g সুতরাং উৎপাদ যৌগের একটি অণুর ভর 1.262 × 10⁻²² g।"},{"label":"ঘ","question":"উদ্দীপকের 'R' মৌলটি একাধিক যোজনী প্রদর্শনে সক্ষম- বিশ্লেষণ কর।","answer":"গ থেকে পাই, R হলো সালফার (S), পারমাণবিক সংখ্যা 16। সালফারের যোজ্যতাস্তর তৃতীয় শক্তিস্তর, যেখানে ফাঁকা 3d অরবিটাল আছে । উত্তেজিত অবস্থায় 3p ও 3s এর জোড় ইলেকট্রন 3d অরবিটালে গিয়ে বিজোড় ইলেকট্রনের সংখ্যা বাড়ায় ।\nস্বাভাবিক অবস্থা: S(16)→1s²2s²2p⁶3s²3px23py13pz1;\nবিজোড় ইলেকট্রন 2টি, যোজনী 2\nপ্রথম উত্তেজিত অবস্থা: S*(16) → 1s² 2s² 2p⁶ 3s² 3px1\n3py1 3pz1 3dxy1; বিজোড় ইলেকট্রন 4টি, যোজনী 4\nদ্বিতীয় উত্তেজিত অবস্থা: S(16)→\n1s²2s²2p⁶3s¹3px13py13pz13dxy13dyz1; বিজোড় ইলেকট্রন 6টি, যোজনী 6 উদাহরণ: H₂S ও CS₂ এ সালফারের যোজনী 2, SO₂ এ যোজনী 4 এবং SO₃ ও H₂SO₄ এ যোজনী 6। সুতরাং R (সালফার) মৌলটি 2, 4 ও 6 — একাধিক যোজনী প্রদর্শনে সক্ষম।"}]},{"id":"ch6-cq4","chapter":6,"num":4,"importance":3,"topic":"যৌগে মৌলের শতকরা সংযুতি","board":"বরিশাল বোর্ড ২০২৬","stem":"(i)MgCO₃+′X′→MgCl₂+H₂O+CO₂(g)\n(ii) একটি যৌগ বিশ্লেষণ করে Na = 42.07%, P = 18.90% এবং O = 39.02% পাওয়া গেল । যৌগটির আণবিক ভর 164।","subQuestions":[{"label":"ক","question":"স্টয়কিওমিতি কাকে বলে?","answer":"সমতাকৃত রাসায়নিক সমীকরণে বিক্রিয়ক ও উৎপাদের মোল সংখ্যার যে অনুপাত থাকে, তাকে স্টয়কিওমিতি বলে।"},{"label":"খ","question":"আর্দ্র বিশ্লেষণ বিক্রিয়া বলতে কী বোঝায়?","answer":"যে বিক্রিয়ায় কোনো যৌগ পানির সাথে বিক্রিয়া করে বিয়োজিত হয়ে দুই বা ততোধিক নতুন যৌগ উৎপন্ন করে, তাকে আর্দ্র বিশ্লেষণ বিক্রিয়া বলে।\nযেমন: অ্যালুমিনিয়াম ক্লোরাইড পানির সাথে বিক্রিয়া করে অ্যালুমিনিয়াম হাইড্রোক্সাইড ও হাইড্রোক্লোরিক এসিড উৎপন্ন করে।\nAlCl₃+3H₂O→Al(OH)₃+3HCl"},{"label":"গ","question":"উদ্দীপকের (ii) নং এ উল্লিখিত যৌগের আণবিক সংকেত নির্ণয় কর।","answer":"উদ্দীপকের (ii) নং যৌগে Na = 42.07%, P = 18.90% এবং O = 39.02%। মৌল শতকরা পরিমাণ পরমাণুর সরল অনুপাত আপেক্ষিক সংখ্যা Na 42.07 42.07/23=1.829 1.829/0.6097=3 P 18.90 18.90/310.6097/0.6097=1 =0.6097 O 39.02 39.02/16=2.439 2.439/0.6097=4 Na : P : O = 3 : 1 : 4 সুতরাং যৌগটির স্থূল সংকেত Na₃PO₄। স্থূল সংকেতের ভর =23×3+31+16×4=69+31+ 64=164\nধরি, আণবিক সংকেত = (Na₃PO₄)n n = আণবিক ভর / স্থূল সংকেতের ভর =164/164=1 আণবিক সংকেত = (Na₃PO₄)₁=Na₃PO₄ অতএব, যৌগটির আণবিক সংকেত Na₃PO₄ (সোডিয়াম ফসফেট)।"},{"label":"ঘ","question":"উদ্দীপকের 'X' যৌগ ও (i) এর উৎপাদ লবণের বন্ধন গঠন প্রক্রিয়া ভিন্ন হলেও উভয়েই পানিতে দ্রবণীয় —বিশ্লেষণ কর।","answer":"উদ্দীপকের (i) নং বিক্রিয়ায় MgCO₃ হাইড্রোক্লোরিক এসিডের সাথে বিক্রিয়া করে MgCl₂, H₂O ও CO₂ উৎপন্ন করে। সুতরাং 'X' হলো HCl এবং উৎপাদ লবণ হলো MgCl₂।\nMgCO₃+2HCl→MgCl₂+H₂O+CO₂\nHCl এর বন্ধন গঠন (সমযোজী) H (1s1) এর একটি এবং Cl (1s2 2s² 2p⁶ 3s² 3p5) এর একটি ইলেকট্রন শেয়ার করে একটি ইলেকট্রন যুগল গঠন করে । ফলে H হিলিয়ামের এবং Cl আর্গনের ইলেকট্রন বিন্যাস অর্জন করে এবং H-Cl সমযোজী বন্ধন গঠিত হয়। Cl এর তড়িৎ ঋণাত্মকতা বেশি হওয়ায় শেয়ারকৃত ইলেকট্রন যুগল Cl এর দিকে বেশি আকৃষ্ট হয়, ফলে HCl একটি পোলার সমযোজী যৌগ (Hδ⁺ - Clδ⁻)। MgCl₂ এর বন্ধন গঠন (আয়নিক) Mg (2, 8, 2) পরমাণু 2টি ইলেকট্রন ত্যাগ করে Mg²⁺ আয়নে এবং দুটি Cl (2, 8, 7) পরমাণু একটি করে ইলেকট্রন গ্রহণ করে দুটি Cl⁻ আয়নে পরিণত হয়। বিপরীত চার্জযুক্ত আয়নগুলো স্থির বৈদ্যুতিক আকর্ষণে যুক্ত হয়ে আয়নিক যৌগ MgCl₂ গঠন করে।\nMg→Mg²⁺+2e⁻\n2Cl+2e⁻→2Cl⁻\nMg²⁺+2Cl⁻→MgCl₂\nউভয়ের পানিতে দ্রবণীয়তা পানি একটি পোলার দ্রাবক, এর অক্সিজেন প্রান্তে আংশিক ঋণাত্মক (δ-) ও হাইড্রোজেন প্রান্তে আংশিক ধনাত্মক (δ+) চার্জ থাকে।\n• আয়নিক MgCl₂ পানিতে দিলে পানির অণুর δ- প্রান্ত Mg²⁺ আয়নকে এবং δ+ প্রান্ত Cl⁻ আয়নকে আকর্ষণ করে ঘিরে ফেলে । ফলে আয়নগুলোর মধ্যকার আকর্ষণ দুর্বল হয়ে কেলাস ভেঙে যায়\nএবং MgCl₂ দ্রবীভূত হয়: MgCl2(s)→Mg²⁺(aq)+2Cl⁻(aq)\n• HCl সমযোজী হলেও পোলার যৌগ। পোলার পানির অণুর সাথে আকর্ষণের ফলে HCl পানিতে আয়নিত হয়ে দ্রবীভূত হয়: HCl+\nH₂O→H₃O⁺+Cl⁻\nঅতএব, HCl সমযোজী এবং MgCl₂ আয়নিক বন্ধনের মাধ্যমে গঠিত হলেও উভয়েই পোলার প্রকৃতির হওয়ায় পোলার দ্রাবক পানিতে দ্রবণীয় ।"}]},{"id":"ch6-cq5","chapter":6,"num":5,"importance":3,"topic":"যৌগে মৌলের শতকরা সংযুতি","board":"মাদ্রাসা বোর্ড ২০২৬","stem":"নিচের উদ্দীপকটি পড়ো এবং প্রশ্নগুলোর উত্তর দাও:","diagramId":"ch6-cq5","subQuestions":[{"label":"ক","question":"রাসায়নিক বিক্রিয়া কাকে বলে?","answer":"যে প্রক্রিয়ায় এক বা একাধিক পদার্থ পরিবর্তিত হয়ে ভিন্ন ধর্মবিশিষ্ট এক বা একাধিক নতুন পদার্থ উৎপন্ন করে, তাকে\nরাসায়নিক বিক্রিয়া বলে। যেমন: C+O₂→CO₂।"},{"label":"খ","question":"H₂O একটি পোলার যৌগ— ব্যাখ্যা কর।","answer":"H₂O অণুতে O পরমাণুর তড়িৎ ঋণাত্মকতা (3.5) H পরমাণুর (2.1) চেয়ে বেশি । তাই O-H বন্ধনের শেয়ারকৃত ইলেকট্রন যুগল O এর দিকে বেশি সরে থাকে; ফলে O আংশিক ঋণাত্মক (δ-) ও H\nআংশিক ধনাত্মক (δ+) চার্জ লাভ করে।\nতাছাড়া H₂O অণু কৌণিক (বন্ধন কোণ প্রায় 104.5°), তাই বন্ধন দুটির পোলারিটি পরস্পরকে প্রশমিত করে না এবং অণুটির নিট ডাইপোল থাকে। এজন্য H₂O একটি পোলার যৌগ।"},{"label":"গ","question":"উদ্দীপকের A ও B পাত্রের দ্রবণের বিক্রিয়ায় উৎপন্ন লবণের উপাদানসমূহের শতকরা সংযুতি নির্ণয় কর।","answer":"A পাত্রে NaOH (ক্ষার) ও B পাত্রে HNO₃ (এসিড) আছে। এদের দ্রবণ মিশ্রিত করলে প্রশমন বিক্রিয়ায় সোডিয়াম নাইট্রেট লবণ ও পানি উৎপন্ন হয়।\nNaOH+HNO₃→NaNO₃+H₂O\nসুতরাং উৎপন্ন লবণ NaNO₃। এর উপাদান Na, N ও O। NaNO₃ এর আণবিক ভর =23+14+16×3=85 Na এর শতকরা পরিমাণ =(23×100)/85%=27.06% N এর শতকরা পরিমাণ =(14×100)/85%=16.47% O এর শতকরা পরিমাণ =(48×100)/85%=56.47% যাচাই: 27.06%+16.47%+56.47%=100% সুতরাং উৎপন্ন লবণ NaNO₃ এ Na 27.06%, N 16.47% এবং O 56.47%।"},{"label":"ঘ","question":"A ও B পাত্রের মধ্যে দ্রবণের মোলারিটি কোনটির বেশি? গাণিতিকভাবে বিশ্লেষণ কর।","answer":"প্রতি লিটার দ্রবণে দ্রবীভূত দ্রবের মোল সংখ্যাকে মোলারিটি বলে। মোলারিটি, S=(W×1000)/(M×V) এখানে W = দ্রবের ভর (g), M = দ্রবের আণবিক ভর, V = দ্রবণের আয়তন (mL)। A পাত্রের দ্রবণের মোলারিটি NaOH এর আণবিক ভর, M=23+16+1=40 W = 3 g, V = 250 mL S(A)=(3×1000)/(40×250)M =₁₀₀₀₀³⁰⁰⁰M = 0.3 M B পাত্রের দ্রবণের মোলারিটি HNO₃ এর আণবিক ভর, M=1+14+16×3=63 W = 1.5 g, V = 250 mL S(B)=(1.5×1000)/(63×250)M =₁₅₇₅₀¹⁵⁰⁰M = 0.095 M উভয় পাত্রে দ্রবণের আয়তন সমান (250 mL)। কিন্তু A পাত্রে দ্রবের মোল সংখ্যা 3/40=0.075mol, আর B পাত্রে 1.5/63=0.0238mol। দ্রবের ভর বেশি এবং আণবিক ভর কম হওয়ায় A পাত্রে মোল সংখ্যা বেশি। S(A) : S(B) = 0.3 : 0.095 ≈ 3.15 : 1 সুতরাং A পাত্রের দ্রবণের (0.3 M) মোলারিটি B পাত্রের দ্রবণের (0.095 M) চেয়ে বেশি; প্রায় 3.15 গুণ।"}]},{"id":"ch6-cq6","chapter":6,"num":6,"importance":3,"topic":"যৌগে মৌলের শতকরা সংযুতি","board":"দিনাজপুর বোর্ড ২০২৪","stem":"'M' একটি যৌগে C = 40%, H = 6.67% এবং অক্সিজেন বিদ্যমান। যৌগটির আণবিক ভর 180.","subQuestions":[{"label":"ক","question":"আইসোটোপ কাকে বলে?","answer":"একই মৌলের যেসব পরমাণুর প্রোটন সংখ্যা সমান কিন্তু নিউট্রন সংখ্যা ভিন্ন, ফলে ভরসংখ্যা ভিন্ন, তাদেরকে পরস্পরের আইসোটোপ বলে। যেমন: 1H₁, 1H₂, 1H₃।"},{"label":"খ","question":"সাবান ও ডিটারজেন্টের পার্থক্য লেখ।","answer":"সাবান ডিটারজেন্ট উচ্চতর ফ্যাটি এসিডের দীর্ঘ শিকলযুক্ত অ্যালকাইল বা সোডিয়াম বা পটাশিয়াম লবণ অ্যারাইল সালফোনিক এসিডের (যেমন: C₁₇H₃₅COONa)। সোডিয়াম লবণ (যেমন: C₁₂H₂₅-C₆H₄-SO₃Na)। তেল বা চর্বি থেকে তৈরি হয়। প্রধানত পেট্রোলিয়াম থেকে প্রাপ্ত দ্রব্য থেকে তৈরি হয়। খর পানিতে ফেনা তৈরি করে খর পানিতেও ভালো ফেনা তৈরি না, গাদ সৃষ্টি করে। করে। জীবাণু দ্বারা সহজে বিয়োজিত অনেক ডিটারজেন্ট সহজে হয়, পরিবেশবান্ধব । বিয়োজিত হয় না, পানি দূষণ ঘটায় ।"},{"label":"গ","question":"'M' যৌগটির আণবিক সংকেত নির্ণয় কর।","answer":"যৌগ M এ C = 40%, H = 6.67% O=100-(40+6.67)%=53.33% C-এর পরমাণুর অনুপাত =40/12=3.33 H-এর পরমাণুর অনুপাত =6.67/1=6.67 O-এর পরমাণুর অনুপাত =53.33/16=3.33 ক্ষুদ্রতম সংখ্যা 3.33 দ্বারা ভাগ করে: C = 1, H = 2, O = 1। সুতরাং স্থূল সংকেত CH₂O। স্থূল সংকেতের ভর =12+1×2+16=30 n = আণবিক ভর/স্থূল সংকেতের ভর =180/30=6 আণবিক সংকেত = (CH₂O)₆=C₆H₁₂O₆ সুতরাং M যৌগটির আণবিক সংকেত C₆H₁₂O₆ (গ্লুকোজ)।"},{"label":"ঘ","question":"'M' যৌগটির 2L 0.5 মোলার দ্রবণ প্রস্তুতি গাণিতিক বিশ্লেষণ কর।","answer":"গ থেকে, M = গ্লুকোজ (C₆H₁₂O₆), আণবিক ভর = 180। প্রয়োজনীয় দ্রবণ: মোলারিটি S = 0.5 M, আয়তন V = 2 L = 2000 mL। প্রয়োজনীয় দ্রবের ভর, W=(S×M×V)/1000 =(0.5×180×2000)/1000g=180g অর্থাৎ 2 L দ্রবণে 1 মোল (180 g) গ্লুকোজ থাকতে হবে।\n১. ইলেকট্রনিক নিক্তিতে সঠিকভাবে 180 g গ্লুকোজ ওজন করে নিতে হবে।\n২. গ্লুকোজকে একটি পরিষ্কার 2 L আয়তনিক ফ্লাস্কে ফানেলের সাহায্যে স্থানান্তর করতে হবে এবং ওয়াশ বোতলের পানি দিয়ে ফানেল ধুয়ে সব গ্লুকোজ ফ্লাস্কে নিতে হবে।\n৩. অল্প পাতিত পানি যোগ করে ঝাঁকিয়ে গ্লুকোজ সম্পূর্ণ দ্রবীভূত করতে হবে।\n৪. এরপর ফ্লাস্কের দাগ পর্যন্ত পাতিত পানি যোগ করে মুখ বন্ধ করে ভালোভাবে ঝাঁকিয়ে নিতে হবে। এভাবে 180 g গ্লুকোজ ব্যবহার করে 2 L 0.5 M গ্লুকোজ দ্রবণ প্রস্তুত করা যায়।"}]},{"id":"ch6-cq7","chapter":6,"num":7,"importance":2,"topic":"রাসায়নিক বিক্রিয়া ও রাসায়নিক সমীকরণ","board":"চট্টগ্রাম বোর্ড ২০২০","stem":"(i) Cu + H₂SO₄ (গাঢ়) → CuSO₄+x+H₂O\nতাপ\n(ii)Pb(NO₃)₂⟶PbO+y+O₂","subQuestions":[{"label":"ক","question":"ভস্মীকরণ কাকে বলে?","answer":"আকরিককে বায়ুর অনুপস্থিতিতে বা সীমিত বায়ুতে উচ্চ তাপমাত্রায় উত্তপ্ত করে এর উদ্বায়ী অপদ্রব্য (পানি, CO₂ ইত্যাদি) দূর করার প্রক্রিয়াকে ভস্মীকরণ বলে ।"},{"label":"খ","question":"3d এবং 4s অরবিটালের মধ্যে কোনটিতে ইলেকট্রন আগে প্রবেশ করে? ব্যাখ্যা কর।","answer":"(n + l) নিয়ম অনুযায়ী যে অরবিটালের (n + l) মান কম, তার শক্তি কম এবং তাতে ইলেকট্রন আগে প্রবেশ করে। 4s: n+l=4+0=4 ; 3d: n+l=3+2=5 4s অরবিটালের (n + l) মান কম, তাই এর শক্তি কম। সুতরাং 3d এর আগে 4s অরবিটালে ইলেকট্রন প্রবেশ করে।"},{"label":"গ","question":"60g বিক্রিয়ক থেকে কত আয়তনের O₂ পাওয়া যাবে উদ্দীপকের (ii) নং বিক্রিয়ার আলোকে নির্ণয় কর। [Pb এর পারমাণবিক ভর 207]","answer":"(ii) নং বিক্রিয়ার সমতাকৃত সমীকরণ:\nΔ\n2Pb(NO₃)₂⟶2PbO+4NO₂+O₂\nPb(NO₃)₂ এর আণবিক ভর =207+2(14+16×3)=331; ∴ 2 মোল = 662 g সমীকরণ অনুযায়ী STP তে, 662 g Pb(NO₃)₂ থেকে O₂ পাওয়া যায় 1 মোল = 22.4 L\n∴ 60 g Pb(NO₃)₂ থেকে O₂ পাওয়া যায় (22.4×60)/662=2.03L সুতরাং 60 g বিক্রিয়ক থেকে প্রমাণ অবস্থায় 2.03 লিটার O₂ পাওয়া যাবে ।"},{"label":"ঘ","question":"x এবং y যৌগের মধ্যে কোনটির ব্যাপন দ্রুত ঘটে? গাণিতিকভাবে বিশ্লেষণ কর।","answer":"(i) নং বিক্রিয়ার সমতাকৃত রূপ:\nCu + 2H₂SO₄(গাঢ়) → CuSO₄+SO₂+2H₂O\n(ii) নং বিক্রিয়ার সমতাকৃত রূপ:\nΔ\n2Pb(NO₃)₂⟶2PbO+4NO₂+O₂\nঅতএব x = SO₂ এবং y = NO₂।\nM(SO₂)=32+16×2=64 ; M(NO₂)=14+16×2=46 গ্রাহামের ব্যাপন সূত্র অনুযায়ী, ব্যাপনের হার আণবিক ভরের বর্গমূলের ব্যস্তানুপাতিক: r(NO2)/r(SO2) = √(M(SO₂)/M(NO₂)) = √64/46 = √1.391 = 1.18\n∴ r(NO2)=1.18×r(SO2) সুতরাং y (NO₂) এর আণবিক ভর কম হওয়ায় এর ব্যাপন x (SO₂) এর চেয়ে 1.18 গুণ দ্রুত ঘটে।"}]},{"id":"ch6-cq8","chapter":6,"num":8,"importance":3,"topic":"লিমিটিং বিক্রিয়ক","board":"চট্টগ্রাম বোর্ড ২০২৬","stem":"দৃশকল্প-১ :\nN₂+3H₂→2′X′\nদৃশকল্প-২ : 100 mL 2.0M H₂SO₄ দ্রবণে 10g ধাতব সোডিয়াম যোগ করে বিক্রিয়া সম্পন্ন করা হলো।","subQuestions":[{"label":"ক","question":"মোলার দ্রবণ কাকে বলে?","answer":"মোলার দ্রবণ: নির্দিষ্ট তাপমাত্রায় 1 লিটার দ্রবণে 1 মোল দ্রব দ্রবীভূত থাকলে সেই দ্রবণকে মোলার দ্রবণ বা 1M দ্রবণ বলে।"},{"label":"খ","question":"তামার তার খোলা বাতাসে ফেলে রাখলে ক্ষয়প্রাপ্ত হয় না কেন? ব্যাখ্যা কর।","answer":"সক্রিয়তা সিরিজে কপার হাইড্রোজেনের নিচে অবস্থিত একটি কম সক্রিয় ধাতু, তাই সাধারণ অবস্থায় বাতাসের অক্সিজেন ও জলীয় বাষ্পের সাথে সহজে বিক্রিয়া করে না। দীর্ঘ সময় খোলা বাতাসে থাকলে তামার উপর বেসিক কপার কার্বনেটের একটি পাতলা সবুজ আস্তরণ পড়ে ।\n2Cu+O₂+CO₂+H₂O→CuCO₃.Cu(OH)₂\nএ আস্তরণটি অভেদ্য ও দৃঢ়ভাবে লেগে থাকে, ফলে ভেতরের তামা বাতাসের সংস্পর্শে আসতে পারে না। তাই তামার তার খোলা বাতাসে ফেলে রাখলে ক্ষয়প্রাপ্ত হয় না।"},{"label":"গ","question":"দৃশকল্প-১ এর বিক্রিয়াটি কোন ধরনের? ব্যাখ্যা কর।","answer":"দৃশকল্প-১ এর বিক্রিয়ায় N₂ ও H₂ যুক্ত হয়ে উৎপাদ X গঠিত হয়। পরমাণু হিসাব করলে X = NH₃ (অ্যামোনিয়া)।\nN₂(g)+3H₂(g)⇌2NH₃(g); ΔH = -92 kJ\nবিক্রিয়াটিকে বিভিন্নভাবে শ্রেণিবিভাগ করা যায়:\n১. সংযোজন বিক্রিয়া: দুটি মৌল (N₂ ও H₂) যুক্ত হয়ে একটি মাত্র যৌগ NH₃ উৎপন্ন করে।\n২. জারণ-বিজারণ বিক্রিয়া: N এর জারণ সংখ্যা 0 থেকে -3 এ কমে (বিজারণ) এবং H এর জারণ সংখ্যা 0 থেকে +1 এ বাড়ে (জারণ)। এখানে N₂ জারক এবং H₂ বিজারক।\n৩. উভমুখী বিক্রিয়া: উৎপন্ন NH₃ আবার বিয়োজিত হয়ে N₂ ও H₂ তে পরিণত হয়, তাই এটি উভমুখী ।\n৪. তাপউৎপাদী বিক্রিয়া: বিক্রিয়ায় তাপ উৎপন্ন হয় (ΔH ঋণাত্মক)। সুতরাং দৃশকল্প-১ এর বিক্রিয়াটি মূলত একটি সংযোজন বিক্রিয়া, যা একই সাথে জারণ-বিজারণ, উভমুখী ও তাপউৎপাদী বিক্রিয়া ।"},{"label":"ঘ","question":"দৃশকল্প-২ এর বিক্রিয়া থেকে 30g লবণ পাওয়া সম্ভব কি? গাণিতিকভাবে বিশ্লেষণ কর।","answer":"দৃশকল্প-২ এ সোডিয়াম ও সালফিউরিক এসিডের বিক্রিয়ায় লবণ সোডিয়াম সালফেট উৎপন্ন হয়:\n2Na+H₂SO₄→Na₂SO₄+H₂\n2 mol 1 mol 1 mol H₂SO₄ এর মোল সংখ্যা:\nn=SV=2.0mol/L×100/1000L=0.2mol Na এর মোল সংখ্যা: n=10/23mol=0.4348mol সমীকরণ অনুসারে 1 mol H₂SO₄ এর সাথে বিক্রিয়া করে 2 mol Na\n∴ 0.2 mol H₂SO₄ এর সাথে বিক্রিয়া করে (2×0.2)mol=0.4molNa কিন্তু Na আছে 0.4348 mol, যা প্রয়োজনের চেয়ে বেশি। সুতরাং H₂SO₄ হলো লিমিটিং বিক্রিয়ক এবং উৎপাদের পরিমাণ H₂SO₄ দ্বারা নির্ধারিত হবে। Na₂SO₄ এর আণবিক ভর =(23×2)+32+(16×4)=142g/mol 1 mol H₂SO₄ থেকে উৎপন্ন হয় 1 mol বা 142 g Na₂SO₄\n∴ 0.2 mol H₂SO₄ থেকে উৎপন্ন Na₂SO₄ = (142 × 0.2) g =28.4 g অর্থাৎ দৃশকল্প-২ এর বিক্রিয়া থেকে সর্বোচ্চ 28.4 g লবণ (Na₂SO₄) পাওয়া যাবে, যা 30 g অপেক্ষা কম। সুতরাং দৃশকল্প-২ এর বিক্রিয়া থেকে 30 g লবণ পাওয়া সম্ভব নয়।"}]},{"id":"ch6-cq9","chapter":6,"num":9,"importance":3,"topic":"লিমিটিং বিক্রিয়ক","board":"ঢাকা বোর্ড ২০২৬","stem":"নিম্নোক্ত উদ্দীপকটি লক্ষ কর :","diagramId":"ch6-cq9","subQuestions":[{"label":"ক","question":"যৌগমূলক কাকে বলে?","answer":"একাধিক মৌলের কয়েকটি পরমাণু একত্রে গুচ্ছ আকারে থেকে একটি মাত্র পরমাণুর মতো রাসায়নিক বিক্রিয়ায় অংশ নেয় এবং এদের নির্দিষ্ট চার্জ থাকে, এরূপ পরমাণুগুচ্ছকে যৌগমূলক বলে ।\nযেমন: SO₄²⁻, NH₄⁺।"},{"label":"খ","question":"Mg একটি বিজারক —ব্যাখ্যা কর।","answer":"যে পদার্থ রাসায়নিক বিক্রিয়ায় ইলেকট্রন ত্যাগ করে অপর পদার্থকে বিজারিত করে, তাকে বিজারক বলে। Mg (12) এর ইলেকট্রন বিন্যাস 2, 8, 2। Mg এর সর্ববহিঃস্থ স্তরের 2টি ইলেকট্রন ত্যাগ করে Mg²⁺ আয়নে পরিণত হওয়ার প্রবণতা বেশি।\nMg→Mg²⁺+2e⁻\nযেমন: CuSO₄ দ্রবণে Mg যোগ করলে Mg ইলেকট্রন ত্যাগ করে Cu²⁺ কে Cu তে বিজারিত করে।\nMg+CuSO₄→MgSO₄+Cu\nতাই Mg একটি বিজারক।"},{"label":"গ","question":"উদ্দীপকের পাত্র-B এর দ্রবের অণুর সংখ্যা নির্ণয় কর।","answer":"উদ্দীপকের পাত্র-B তে দ্রব Na₂CO₃ এবং দ্রবণের ঘনমাত্রা S =0.1 M, আয়তন V = 400 mL = 0.4 L। Na₂CO₃ এর মোল সংখ্যা, n = S × V =0.1mol/L×0.4L = 0.04 mol আমরা জানি, 1 mol পদার্থে অণুর সংখ্যা =6.02×10²³ টি।\n∴ 0.04 mol Na₂CO₃ এ অণুর সংখ্যা =0.04×6.02×10²³ =2.408×10²² টি অতএব, উদ্দীপকের পাত্র-B এর দ্রবে (Na₂CO₃) অণুর সংখ্যা 2.408 × 10²² টি।"},{"label":"ঘ","question":"উদ্দীপকের উভয় পাত্রের দ্রবণদ্বয়ের মধ্যে বিক্রিয়া সম্পন্ন হলে কোনটি লিমিটিং বিক্রিয়ক হবে? বিশ্লেষণ কর।","answer":"উভয় পাত্রের দ্রবণ মেশালে Na₂CO₃ ও HCl এর মধ্যে নিম্নোক্ত বিক্রিয়া ঘটে:\nNa₂CO₃+2HCl→2NaCl+H₂O+CO₂\nসমীকরণ অনুসারে, 1 mol Na₂CO₃ এর সাথে 2 mol HCl বিক্রিয়া করে। উপস্থিত বিক্রিয়কের মোল সংখ্যা পাত্র-A তে HCl এর মোল সংখ্যা =0.2mol/L×700/1000L=0.14mol পাত্র-B তে Na₂CO₃ এর মোল সংখ্যা =0.1mol/L×400/1000L=0.04mol প্রয়োজনীয় পরিমাণ যাচাই 1 mol Na₂CO₃ এর সাথে বিক্রিয়া করে 2 mol HCl\n∴ 0.04 mol Na₂CO₃ এর সাথে বিক্রিয়া করে (2×0.04)mol=0.08molHCl কিন্তু পাত্র-A তে HCl আছে 0.14 mol, যা প্রয়োজনের (0.08 mol) চেয়ে বেশি। অবশিষ্ট HCl=(0.14-0.08)mol=0.06mol অপরদিকে, 0.14 mol HCl সম্পূর্ণ বিক্রিয়া করতে (0.14/2) mol =0.07 mol Na₂CO₃ প্রয়োজন, কিন্তু আছে মাত্র 0.04 mol। অর্থাৎ Na₂CO₃ আগে সম্পূর্ণ নিঃশেষ হয়ে যাবে এবং উৎপাদের পরিমাণ এর দ্বারাই নির্ধারিত হবে। উৎপন্ন CO₂=0.04mol(Na₂CO₃ এর মোল সংখ্যার সমান) সুতরাং, উভয় পাত্রের দ্রবণের মধ্যে বিক্রিয়ায় পাত্র-B এর Na₂CO₃ লিমিটিং বিক্রিয়ক হবে এবং পাত্র-A এর HCl 0.06 mol অতিরিক্ত থেকে যাবে।"}]},{"id":"ch6-cq10","chapter":6,"num":10,"importance":3,"topic":"লিমিটিং বিক্রিয়ক","board":"দিনাজপুর বোর্ড ২০২৬","stem":"(i)4Al+3O₂→2Al₂O₃\n5g Al প্রয়োজনীয় পরিমাণ O₂ এর সাথে বিক্রিয়া করে 6.5g Al₂O₃ উৎপাদ উৎপন্ন করে। (ii)","diagramId":"ch6-cq10","subQuestions":[{"label":"ক","question":"স্টায়কিওমিতি কাকে বলে?","answer":"স্টয়কিওমিতি: রাসায়নিক বিক্রিয়ায় অংশগ্রহণকারী বিক্রিয়ক ও উৎপন্ন উৎপাদসমূহের মোল সংখ্যার অনুপাতকে স্টয়কিওমিতি বলে।"},{"label":"খ","question":"5g CO₂ যৌগে অণুর সংখ্যা নির্ণয় কর।","answer":"CO₂ এর আণবিক ভর =12+(16×2)=44g/mol 5gCO₂=5/44mol=0.1136mol 1 mol CO₂ এ অণুর সংখ্যা 6.02 × 10²³ টি 0.1136 mol CO₂ এ অণুর সংখ্যা =0.1136×6.02×10²³ =6.84×10²² টি অতএব, 5g CO₂ এ 6.84 × 10²² টি অণু রয়েছে ।"},{"label":"গ","question":"উদ্দীপকের (i) নং বিক্রিয়ার উৎপাদটির শতকরা পরিমাণ হিসাব কর।","answer":"4Al+3O₂→2Al₂O₃\n4Al=4×27=108g 2Al₂O₃ = 2 × (27 × 2 + 16 × 3) = 2 × 102 = 204 g সমীকরণ অনুসারে, 108 g Al থেকে Al₂O₃ উৎপন্ন হয় 204 g\n∴ 5 g Al থেকে Al₂O₃ উৎপন্ন হয় =(204×5)/108g=9.44g অর্থাৎ, Al₂O₃ এর তাত্ত্বিক উৎপাদ = 9.44 g এবং প্রকৃত উৎপাদ =6.5 g উৎপাদের শতকরা পরিমাণ = (প্রকৃত উৎপাদ × 100)/তাত্ত্বিক উৎপাদ % =(6.5×100)/9.44% = 68.82% অতএব, (i) নং বিক্রিয়ায় উৎপাদের শতকরা পরিমাণ 68.82%।"},{"label":"ঘ","question":"উদ্দীপকের (ii) এর পাত্রে 5g KOH মিশ্রিত করলে কোনটি লিমিটিং বিক্রিয়ক হবে? গাণিতিক যুক্তি দাও।","answer":"উদ্দীপকের (ii) নং পাত্রে 200 mL 0.1M HNO₃ দ্রবণ আছে। এতে 5g KOH মিশ্রিত করলে প্রশমন বিক্রিয়া ঘটে:\nHNO₃+KOH→KNO₃+H₂O\nসমীকরণ অনুসারে, 1 mol HNO₃ ও 1 mol KOH পরস্পরের সাথে বিক্রিয়া করে। HNO₃ এর মোল সংখ্যা n=S×V=0.1×200/1000=0.02mol KOH এর আণবিক ভর =39+16+1=56g/mol KOH এর মোল সংখ্যা =5/56=0.0893mol 0.02 mol HNO₃ এর সাথে বিক্রিয়ার জন্য প্রয়োজন 0.02 mol KOH। কিন্তু পাত্রে KOH আছে 0.0893 mol, যা প্রয়োজনের চেয়ে বেশি। অবশিষ্ট KOH=0.0893−0.02=0.0693mol=0.0693×56g=3.88g অর্থাৎ HNO₃ সম্পূর্ণরূপে বিক্রিয়ায় নিঃশেষ হয়ে যায় এবং KOH অতিরিক্ত থেকে যায়। উৎপাদ KNO₃ এর পরিমাণ HNO₃ দ্বারা নির্ধারিত হয়। সুতরাং, (ii) নং পাত্রে 5g KOH মিশ্রিত করলে HNO₃ লিমিটিং বিক্রিয়ক হবে।"}]},{"id":"ch6-cq11","chapter":6,"num":11,"importance":3,"topic":"লিমিটিং বিক্রিয়ক","board":"ময়মনসিংহ বোর্ড ২০২৬","stem":"30.6g MgCO₃ এর সাথে 29.2g HCl এর বিক্রিয়ায় লবণ, পানি ও B(g) উৎপন্ন হলো।","subQuestions":[{"label":"ক","question":"ফরমালিন কাকে বলে?","answer":"ফরমালিন: ফরমালডিহাইড বা মিথান্যালের (HCHO) 40% জলীয় দ্রবণকে ফরমালিন বলে।"},{"label":"খ","question":"ইথিনকে অলিফিন বলা হয় কেন? সমীকরণসহ ব্যাখ্যা কর।","answer":"অলিফিন শব্দের অর্থ তেল উৎপাদনকারী । ইথিন (CH₂=CH₂) একটি অসম্পৃক্ত হাইড্রোকার্বন, যা ক্লোরিন বা ব্রোমিনের সাথে যুত বিক্রিয়া করে তৈলাক্ত পদার্থ উৎপন্ন করে ।\nCH₂=CH₂+Cl₂→CH₂Cl-CH₂Cl\nউৎপন্ন 1,2-ডাইক্লোরোইথেন একটি তৈলাক্ত তরল। ইথিন তেলের মতো পদার্থ উৎপন্ন করে বলে ইথিনকে (এবং সকল অ্যালকিনকে) অলিফিন বলা হয়।"},{"label":"গ","question":"চুনের পানিতে 'B' চালনা করলে কী ঘটে? সমীকরণসহ ব্যাখ্যা কর।","answer":"উদ্দীপকের বিক্রিয়ায় MgCO₃ ও HCl বিক্রিয়া করে ম্যাগনেসিয়াম ক্লোরাইড লবণ, পানি ও কার্বন ডাইঅক্সাইড গ্যাস উৎপন্ন করে । সুতরাং 'B' হলো CO₂।\nMgCO₃+2HCl→MgCl₂+H₂O+CO₂\nচুনের পানি হলো ক্যালসিয়াম হাইড্রক্সাইডের [Ca(OH)₂] স্বচ্ছ জলীয় দ্রবণ । এর মধ্যে CO₂ গ্যাস চালনা করলে পানিতে অদ্রবণীয় সাদা ক্যালসিয়াম কার্বনেটের অধঃক্ষেপ সৃষ্টি হয়, ফলে চুনের পানি ঘোলা হয়ে যায়:\nCa(OH)₂+CO₂→CaCO₃+H₂O\nআরও বেশি সময় ধরে অতিরিক্ত CO₂ চালনা করলে অদ্রবণীয় CaCO₃ পানিতে দ্রবণীয় ক্যালসিয়াম বাইকার্বনেটে পরিণত হয়, ফলে দ্রবণের ঘোলাটে ভাব দূর হয়ে পুনরায় স্বচ্ছ হয়:\nCaCO₃+H₂O+CO₂→Ca(HCO₃)₂\nএই পরীক্ষার মাধ্যমে CO₂ গ্যাস শনাক্ত করা হয়।"},{"label":"ঘ","question":"উদ্দীপকের বিক্রিয়ায় সর্বোচ্চ কী পরিমাণ 'B' উৎপন্ন হবে? গাণিতিকভাবে বিশ্লেষণ কর।","answer":"MgCO₃+2HCl→MgCl₂+H₂O+CO₂\nMgCO₃ এর আণবিক ভর =24+12+3×16=84g/mol HCl এর আণবিক ভর =1+35.5=36.5g/mol CO₂ এর আণবিক ভর =12+2×16=44g/mol MgCO₃ এর মোল সংখ্যা =30.6/84mol=0.3643mol HCl এর মোল সংখ্যা =29.2/36.5mol=0.8mol সমীকরণ অনুসারে, 1 mol MgCO₃ এর সাথে বিক্রিয়া করে 2 mol HCl 0.3643 mol MgCO₃ এর সাথে বিক্রিয়া করে HCl=(2× 0.3643)mol=0.7286mol কিন্তু HCl আছে 0.8 mol, যা প্রয়োজনের তুলনায় বেশি। সুতরাং HCl অতিরিক্ত এবং MgCO₃ লিমিটিং বিক্রিয়ক । উৎপন্ন CO₂ এর পরিমাণ MgCO₃ এর পরিমাণের ওপর নির্ভর করবে । সমীকরণ অনুসারে, 84 g MgCO₃ থেকে উৎপন্ন হয় 44 g CO₂ 30.6 g MgCO₃ থেকে উৎপন্ন CO₂=(44×30.6)/84g=16.03g STP তে আয়তন হিসাবে, 1 mol CO₂ এর আয়তন 22.4 L উৎপন্ন CO₂ এর আয়তন =(0.3643×22.4)L=8.16L অতএব, উদ্দীপকের বিক্রিয়ায় সর্বোচ্চ 16.03 g বা 0.3643 mol (STP তে 8.16 L) 'B' (CO₂) উৎপন্ন হবে।"}]},{"id":"ch6-cq12","chapter":6,"num":12,"importance":3,"topic":"লিমিটিং বিক্রিয়ক","board":"সিলেট বোর্ড ২০২৬","stem":"নিচের উদ্দীপকটি পড়ো এবং প্রশ্নগুলোর উত্তর দাও:","diagramId":"ch6-cq12","subQuestions":[{"label":"ক","question":"রেডক্স বিক্রিয়া কাকে বলে?","answer":"রেডক্স বিক্রিয়া: যে বিক্রিয়ায় জারণ ও বিজারণ একই সাথে ঘটে, অর্থাৎ একটি বিক্রিয়ক ইলেকট্রন ত্যাগ করে এবং অপর বিক্রিয়ক সেই ইলেকট্রন গ্রহণ করে, তাকে রেডক্স বিক্রিয়া বলে।"},{"label":"খ","question":"পটাশিয়ামের 19তম ইলেকট্রনটি কোন উপশক্তি স্তরে গমন করে? ব্যাখ্যা করো।","answer":"পটাশিয়ামের পারমাণবিক সংখ্যা 19। আউফবাউ নীতি অনুসারে ইলেকট্রন প্রথমে নিম্ন শক্তির উপস্তরে প্রবেশ করে। (n + l) এর মান: 3d এর জন্য 3+2=5 এবং 4s এর জন্য 4+ 0=4। (n + l) এর মান কম হওয়ায় 4s উপস্তরের শক্তি 3d অপেক্ষা কম। K(19) : 1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹ তাই 18টি ইলেকট্রন 3p পর্যন্ত পূর্ণ হওয়ার পর 19তম ইলেকট্রনটি 3d তে না গিয়ে 4s উপশক্তিস্তরে গমন করে।"},{"label":"গ","question":"উদ্দীপকের ১নং পাত্রে দ্রবের পরিমাণ নির্ণয় করো।","answer":"১নং পাত্রে আছে সোডিয়াম কার্বনেটের (Na₂CO₃) 25 mL ডেসিমোলার দ্রবণ । ডেসিমোলার অর্থ 0.1 M। Na₂CO₃ এর আণবিক ভর =(23×2)+12+(16×3)=106 আমরা জানি, W=(S×M×V)/1000\nএখানে, ঘনমাত্রা S = 0.1 M, আণবিক ভর M = 106, আয়তন V =25 mL W=(0.1×106×25)/1000g W = 0.265 g সুতরাং ১নং পাত্রে দ্রবের (Na₂CO₃) পরিমাণ 0.265 g।"},{"label":"ঘ","question":"উদ্দীপকের ২নং পাত্রে সংঘটিত বিক্রিয়ায় 4g লবণ উৎপাদন সম্ভব কি না? গাণিতিকভাবে বিশ্লেষণ করো।","answer":"২নং পাত্রে 3 g Mg এবং 200 mL 0.4 M HCl দ্রবণের মধ্যে বিক্রিয়া ঘটে লবণ ম্যাগনেসিয়াম ক্লোরাইড (MgCl₂) উৎপন্ন হয়।\nMg+2HCl→MgCl₂+H₂\nMg এর মোল সংখ্যা =3/24mol=0.125mol HCl এর মোল সংখ্যা =(0.4×200)/1000mol=0.08mol সমীকরণ অনুসারে, 1 mol Mg এর সাথে বিক্রিয়া করে 2 mol HCl 0.125 mol Mg এর জন্য প্রয়োজনীয় HCl=0.125×2mol=0.25mol কিন্তু পাত্রে HCl আছে মাত্র 0.08 mol, যা প্রয়োজনের চেয়ে কম। তাই HCl লিমিটিং বিক্রিয়ক এবং Mg অতিরিক্ত থেকে যায়। সমীকরণ অনুসারে, 2 mol HCl থেকে উৎপন্ন হয় 1 mol MgCl₂ 0.08 mol HCl থেকে উৎপন্ন MgCl₂ = 0.08/2 mol = 0.04 mol MgCl₂ এর আণবিক ভর =24+(35.5×2)=95 উৎপন্ন MgCl₂ এর ভর =0.04×95g=3.8g অর্থাৎ ২নং পাত্রের বিক্রিয়ায় সর্বোচ্চ 3.8 g লবণ উৎপন্ন হতে পারে, যা 4 g অপেক্ষা কম। সুতরাং উদ্দীপকের ২নং পাত্রে সংঘটিত বিক্রিয়ায় 4 g লবণ উৎপাদন সম্ভব নয়।"}]},{"id":"ch6-cq13","chapter":6,"num":13,"importance":3,"topic":"লিমিটিং বিক্রিয়ক","board":"কুমিল্লা বোর্ড ২০২৩","stem":"দৃশ্যকল্প-১ : 'X' যৌগের 24.5g কে বিশ্লেষণ করলে 0.5g হাইড্রোজেন, 8g সালফার ও 16g অক্সিজেন পাওয়া যায়। দৃশ্যকল্প-২:","diagramId":"ch6-cq13","subQuestions":[{"label":"ক","question":"অপরিশোধিত তেল কাকে বলে?","answer":"ভূগর্ভ থেকে উত্তোলিত হাইড্রোকার্বনের জটিল প্রাকৃতিক তরল মিশ্রণকে, যা পরিশোধন করা হয়নি, অপরিশোধিত তেল বা পেট্রোলিয়াম বলে ।"},{"label":"খ","question":"সাধারণত Na²⁺ আয়ন গঠন অসম্ভব —ব্যাখ্যা কর।","answer":"Na (11) এর ইলেকট্রন বিন্যাস 1s² 2s² 2p⁶ 3s¹। সর্ববহিঃস্থ স্তরের 1টি ইলেকট্রন ত্যাগ করে Na সহজেই নিয়নের মতো স্থিতিশীল বিন্যাসের Na⁺ আয়ন গঠন করে । Na²⁺ গঠনে Na⁺ থেকে আরেকটি ইলেকট্রন সরাতে হবে, যা স্থিতিশীল পূর্ণ 2p অরবিটাল থেকে এবং নিউক্লিয়াসের অনেক কাছ থেকে আসবে । এজন্য দ্বিতীয় আয়নিকরণ শক্তি অত্যন্ত বেশি। এত বেশি শক্তি সাধারণ রাসায়নিক বিক্রিয়ায় পাওয়া যায় না, তাই সাধারণত Na²⁺ আয়ন গঠন অসম্ভব ।"},{"label":"গ","question":"উদ্দীপকের 'X' এর স্থূল সংকেত নির্ণয় কর।","answer":"X যৌগের 24.5 g এ H = 0.5 g, S = 8 g, O=16g(0.5+8+ 16=24.5g) H-এর পরমাণুর অনুপাত =0.5/1=0.5 S-এর পরমাণুর অনুপাত =8/32=0.25 O-এর পরমাণুর অনুপাত =16/16=1 ক্ষুদ্রতম সংখ্যা 0.25 দ্বারা ভাগ করে: H = 2, S = 1, O = 4। সুতরাং X এর স্থূল সংকেত H₂SO₄।"},{"label":"ঘ","question":"0.3 mole 'X' উদ্দীপকের পাত্রের দ্রবণে যোগ করলে কোনটি লিমিটিং বিক্রিয়ক হবে? গাণিতিকভাবে বিশ্লেষণ কর।","answer":"গ থেকে, X = H₂SO₄ (আণবিক ভর 98)। পাত্রে আছে 20 g Ca(OH)₂ (আণবিক ভর =40+2(16+1)=74)।\nCa(OH)₂+H₂SO₄→CaSO₄+2H₂O\n1 mol (74 g) 1 mol (98 g) Ca(OH)₂-এর মোল সংখ্যা =20/74=0.27mol যোগকৃত H₂SO₄ = 0.3 mol = 0.3 × 98 g = 29.4 g সমীকরণ অনুযায়ী Ca(OH)₂ ও H₂SO₄ 1 : 1 মোল অনুপাতে বিক্রিয়া করে। 0.3 mol H₂SO₄ এর সাথে বিক্রিয়ার জন্য Ca(OH)₂ প্রয়োজন =0.3mol=0.3×74g=22.2g কিন্তু পাত্রে Ca(OH)₂ আছে মাত্র 20 g (0.27 mol), যা প্রয়োজনের চেয়ে কম। ফলে Ca(OH)₂ সম্পূর্ণ শেষ হয়ে যাবে এবং (0.3 - 0.27) = 0.03 mol H₂SO₄ অবশিষ্ট থাকবে। সুতরাং এ বিক্রিয়ায় Ca(OH)₂ লিমিটিং বিক্রিয়ক ।"}]},{"id":"ch6-cq14","chapter":6,"num":14,"importance":3,"topic":"লিমিটিং বিক্রিয়ক","board":"যশোর বোর্ড ২০২২","stem":"নিচের উদ্দীপকটি পড়ো এবং প্রশ্নগুলোর উত্তর দাও:","diagramId":"ch6-cq14","subQuestions":[{"label":"ক","question":"সেমিমোলার দ্রবণ কাকে বলে?","answer":"প্রতি লিটার দ্রবণে দ্রবের 0.5 মোল দ্রবীভূত থাকলে সেই দ্রবণকে সেমিমোলার দ্রবণ (0.5 M) বলে।"},{"label":"খ","question":"দুটি ভিন্ন যৌগের স্থূল সংকেত একই হতে পারে কি? ব্যাখ্যা কর।","answer":"হ্যাঁ, দুটি ভিন্ন যৌগের স্থূল সংকেত একই হতে পারে। স্থূল সংকেত শুধু অণুতে পরমাণুগুলোর সরলতম অনুপাত নির্দেশ করে, প্রকৃত সংখ্যা নয়। যেমন— অ্যাসিটিলিন (C₂H₂) ও বেনজিন (C₆H₆) উভয়ের স্থূল সংকেত CH; ফরমালডিহাইড (HCHO), অ্যাসিটিক এসিড (CH₃COOH) ও গ্লুকোজ (C₆H₁₂O₆) সবার স্থূল সংকেত CH₂O। এদের আণবিক সংকেত ভিন্ন বলে যৌগগুলো ভিন্ন।"},{"label":"গ","question":"উদ্দীপকের A পাত্রের দ্রবের অণুর সংখ্যা হিসাব কর।","answer":"A পাত্রের দ্রব Na₂CO₃; M=23×2+12+16×3=106 W=(S×M×V)/1000=(0.75×106×200)/1000=15.9g 106 g Na₂CO₃ এ অণু আছে 6.023×10²³ টি\n∴ 15.9 g Na₂CO₃ এ অণু =(6.023×10²³×15.9)/106=9.035×10²² টি সুতরাং A পাত্রের দ্রবের অণুর সংখ্যা 9.035×10²² টি।"},{"label":"ঘ","question":"A ও B পাত্রের দ্রবণদ্বয়ের মিশ্রণে কী পরিমাণ লবণ উৎপন্ন হবে? গাণিতিকভাবে বের কর।","answer":"Na₂CO₃+2HNO₃→2NaNO₃+CO₂+H₂O\n106 g : 2×63=126g : 2×85=170g পাত্র A তে Na₂CO₃ = 15.9 g ['গ' থেকে] পাত্র B তে HNO₃ = (0.5 × 63 × 150)/1000 = 4.725 g 126 g HNO₃ বিক্রিয়া করে 106 g Na₂CO₃ এর সাথে\n∴ 4.725 g HNO₃ বিক্রিয়া করে Na₂CO₃ = (106 × 4.725)/126 = 3.975 g\nদেওয়া আছে 15.9 g Na₂CO₃, অর্থাৎ (15.9 − 3.975) = 11.925 g Na₂CO₃ অবশিষ্ট থাকে। তাই HNO₃ লিমিটিং বিক্রিয়ক । 126 g HNO₃ থেকে উৎপন্ন হয় 170 g NaNO₃\n∴ 4.725 g HNO₃ থেকে NaNO₃ = (170 × 4.725)/126 =6.375 g সুতরাং দ্রবণদ্বয়ের মিশ্রণে 6.375 g লবণ (NaNO₃) উৎপন্ন হবে।"}]},{"id":"ch6-cq15","chapter":6,"num":15,"importance":3,"topic":"লিমিটিং বিক্রিয়ক","board":"যশোর বোর্ড ২০২৩","stem":"নিচের উদ্দীপকটি পড়ো এবং প্রশ্নগুলোর উত্তর দাও:","diagramId":"ch6-cq15","subQuestions":[{"label":"ক","question":"পানি যোজন বিক্রিয়া কাকে বলে?","answer":"যে বিক্রিয়ায় কোনো পদার্থের সাথে পানি যুক্ত হয়ে নতুন পদার্থ উৎপন্ন হয়, তাকে পানি যোজন বিক্রিয়া বলে। যেমন: CuSO₄+\n5H₂O→CuSO₄.5H₂O"},{"label":"খ","question":"প্রোপিন একটি অলিফিন কেন? ব্যাখ্যা কর।","answer":"প্রোপিন (CH₃-CH=CH₂) একটি অ্যালকিন। অ্যালকিনসমূহ হ্যালোজেনের সাথে যুত বিক্রিয়া করে তেলের মতো তরল পদার্থ উৎপন্ন করে, তাই অ্যালকিনকে অলিফিন (Olefin, অর্থাৎ তেল উৎপাদনকারী) বলা হয়।\nCH₃-CH=CH₂+Cl₂→CH₃-CHCl-CH₂Cl(1,2-\nডাইক্লোরোপ্রোপেন, তৈলাক্ত তরল) প্রোপিনও ক্লোরিনের সাথে বিক্রিয়া করে তেলসদৃশ যৌগ তৈরি করে। তাই প্রোপিন একটি অলিফিন ।"},{"label":"গ","question":"B পাত্রের দ্রবণের ঘনমাত্রা নির্ণয় কর।","answer":"B পাত্রে আছে সালফিউরিক এসিড (H₂SO₄)।\nদেওয়া আছে, H₂SO₄ এর ভর, w = 75 g; দ্রবণের আয়তন, V = 100 mL H₂SO₄ এর আণবিক ভর, M=(1×2)+32+(16×4)=98 আমরা জানি, S=(w×1000)/(M×V) =(75×1000)/(98×100) = 7.65 M সুতরাং, B পাত্রের দ্রবণের ঘনমাত্রা 7.65 M।"},{"label":"ঘ","question":"A ও B পাত্রের দ্রবণের বিক্রিয়ার লিমিটিং বিক্রিয়ক কোনটি ও কেন? গাণিতিকভাবে বিশ্লেষণ কর।","answer":"A পাত্রে NaOH এবং B পাত্রে H₂SO₄ আছে। দ্রবণদ্বয় মিশালে প্রশমন বিক্রিয়া ঘটে:\n2NaOH+H₂SO₄→Na₂SO₄+2H₂O\n2 × (23 + 16 + 1) = 80 g NaOH বিক্রিয়া করে (1×2 + 32 + 16×4) = 98 g H₂SO₄ এর সাথে\n∴ 55 g NaOH বিক্রিয়া করে (98 × 55)/80 = 67.375 g H₂SO₄ এর সাথে কিন্তু B পাত্রে H₂SO₄ আছে 75 g। অর্থাৎ বিক্রিয়া শেষে (75 -67.375) = 7.625 g H₂SO₄ অবশিষ্ট থাকবে এবং 55 g NaOH সম্পূর্ণ নিঃশেষ হবে। বিক্রিয়ায় যে বিক্রিয়ক সম্পূর্ণ নিঃশেষ হয়ে উৎপাদের পরিমাণ নির্ধারণ করে, তাকে লিমিটিং বিক্রিয়ক বলে। সুতরাং, এ বিক্রিয়ায় NaOH হলো লিমিটিং বিক্রিয়ক ।"}]},{"id":"ch6-cq16","chapter":6,"num":16,"importance":3,"topic":"লিমিটিং বিক্রিয়ক","board":"ময়মনসিংহ বোর্ড ২০২২","stem":"11.2 lit CO₂(g) উৎপাদনের জন্য 50g CaCO₃ ও 30g HCl এর মধ্যে বিক্রিয়া সংঘটিত করা হলো, কিন্তু প্রত্যাশিত উৎপাদ পাওয়া গেল না।","subQuestions":[{"label":"ক","question":"স্টয়কিওমিতি কাকে বলে?","answer":"রাসায়নিক বিক্রিয়ায় বিক্রিয়ক ও উৎপাদসমূহের মোল, ভর বা আয়তনের পরিমাণগত সম্পর্ককে স্টয়কিওমিতি বলে।"},{"label":"খ","question":"একই স্থূল সংকেত একাধিক যৌগের হতে পারে— ব্যাখ্যা কর।","answer":"স্থূল সংকেত যৌগের অণুতে পরমাণুর শুধু সরলতম অনুপাত প্রকাশ করে, প্রকৃত সংখ্যা নয়। ভিন্ন যৌগে পরমাণুর প্রকৃত সংখ্যা ভিন্ন হলেও অনুপাত একই হতে পারে। যেমন: ফরমালডিহাইড (HCHO), ইথানয়িক এসিড (C₂H₄O₂) ও গ্লুকোজ (C₆H₁₂O₆) — তিনটিতেই C : H : O = 1 : 2 : 1, তাই সবগুলোর স্থূল সংকেত CH₂O। একইভাবে ইথাইন (C₂H₂) ও বেনজিন (C₆H₆) উভয়ের স্থূল সংকেত CH। তাই একই স্থূল সংকেত একাধিক যৌগের হতে পারে।"},{"label":"গ","question":"উদ্দীপকের উৎপাদ গ্যাসীয় যৌগটির প্রতি গ্রামে অণুর সংখ্যা নির্ণয় কর।","answer":"CaCO₃+2HCl→CaCl₂+CO₂+H₂O\nউদ্দীপকের উৎপাদ গ্যাসীয় যৌগটি কার্বন ডাইঅক্সাইড (CO₂)। CO₂ এর আণবিক ভর =12+16×2=44 44 g CO₂ = 1 মোল CO₂ এ অণু আছে 6.023 × 10²³ টি 1 g CO₂ এ অণু আছে (6.023 × 10²³)/44=1.369×10²² টি সুতরাং, প্রতি গ্রাম CO₂ এ 1.369 × 10²² টি অণু বিদ্যমান ।"},{"label":"ঘ","question":"উদ্দীপকের বিক্রিয়ায় প্রত্যাশিত উৎপাদ পাওয়া গেল না কেন? গাণিতিকভাবে বিশ্লেষণ কর।","answer":"CaCO₃+2HCl→CaCl₂+CO₂+H₂O\nCaCO₃ = 40 + 12 + 48 = 100; 2HCl=2×36.5=73 100 g CaCO₃ বিক্রিয়া করে 73 g HCl এর সাথে। 50 g CaCO₃ বিক্রিয়া করে (73×50)/100=36.5gHCl এর সাথে কিন্তু HCl আছে মাত্র 30 g। তাই HCl লিমিটিং বিক্রিয়ক; CaCO₃ অতিরিক্ত থেকে যাবে। 73 g HCl থেকে প্রমাণ অবস্থায় CO₂ উৎপন্ন হয় 22.4 L 30 g HCl থেকে CO₂ উৎপন্ন হয় (22.4×30)/73=9.21L প্রত্যাশিত উৎপাদ 11.2 L CO₂ (অর্থাৎ 0.5 মোল) পেতে প্রয়োজন 36.5 g HCl, কিন্তু আছে 30 g। ফলে CO₂ পাওয়া যায় মাত্র 9.21 L। সুতরাং, HCl লিমিটিং বিক্রিয়ক হওয়ায় বিক্রিয়ায় প্রত্যাশিত পরিমাণ (11.2 L) CO₂ পাওয়া যায়নি ।"}]},{"id":"ch6-cq17","chapter":6,"num":17,"importance":3,"topic":"উৎপাদের শতকরা পরিমাণ হিসাব","board":"রাজশাহী বোর্ড ২০২৬","stem":"দৃশ্যপট-১ : 80 g CaCO₃ কে তাপ দিয়ে 42 g CaO পাওয়া গেল। দৃশ্যপট-২ :","diagramId":"ch6-cq17","subQuestions":[{"label":"ক","question":"জারক কাকে বলে?","answer":"জারক: যে পদার্থ রাসায়নিক বিক্রিয়ায় অন্য পদার্থ থেকে ইলেকট্রন গ্রহণ করে এবং নিজে বিজারিত হয়, তাকে জারক বলে। যেমন: Cl₂, O₂।"},{"label":"খ","question":"মোলার দ্রবণ একটি প্রমাণ দ্রবণ —ব্যাখ্যা কর।","answer":"যে দ্রবণের ঘনমাত্রা সঠিকভাবে জানা থাকে, তাকে প্রমাণ দ্রবণ বলে। নির্দিষ্ট তাপমাত্রায় 1 লিটার দ্রবণে 1 মোল দ্রব দ্রবীভূত থাকলে তাকে মোলার দ্রবণ (1 M) বলে। যেমন: 1 লিটার দ্রবণে 40 g NaOH দ্রবীভূত থাকলে তা 1 M NaOH দ্রবণ । মোলার দ্রবণে দ্রবের পরিমাণ ও দ্রবণের আয়তন নির্দিষ্ট থাকায় এর ঘনমাত্রা (1 mol/L) সঠিকভাবে জানা থাকে। তাই মোলার দ্রবণ একটি প্রমাণ দ্রবণ ।"},{"label":"গ","question":"দৃশ্যপট-১ এ ব্যবহৃত বিক্রিয়াটি অ্যানালার গ্রেড কি? গাণিতিকভাবে নির্ণয় কর।","answer":"যেসব রাসায়নিক পদার্থের বিশুদ্ধতা প্রায় শতভাগ (99% এর অধিক), সেগুলোকে অ্যানালার (AR) গ্রেড বলে। CaCO₃ কে তাপ দিলে বিয়োজিত হয়ে CaO ও CO₂ উৎপন্ন হয়:\nতাপ\nCaCO₃⟶CaO+CO₂\nCaCO₃ এর আণবিক ভর =40+12+(16×3)=100g/ mol CaO এর আণবিক ভর =40+16=56g/mol সমীকরণ অনুসারে, 100 g CaCO₃ থেকে CaO পাওয়া যায় = 56 g\n∴ 80 g বিশুদ্ধ CaCO₃ থেকে CaO পাওয়ার কথা =(56×80)/100g=44.8g কিন্তু পাওয়া গেছে 42 g CaO। 42 g CaO উৎপন্ন করতে প্রয়োজনীয় বিশুদ্ধ CaCO₃: 56 g CaO পাওয়া যায় 100 g CaCO₃ থেকে\n∴ 42 g CaO পাওয়া যায় = (100 × 42)/56 g = 75 g CaCO₃ থেকে\n∴ CaCO₃ এর বিশুদ্ধতা =(75×100)/80%=93.75% অ্যানালার গ্রেডের জন্য বিশুদ্ধতা 99% এর বেশি হওয়া প্রয়োজন, কিন্তু ব্যবহৃত CaCO₃ এর বিশুদ্ধতা মাত্র 93.75%। সুতরাং দৃশ্যপট-১ এ ব্যবহৃত CaCO₃ অ্যানালার গ্রেডের নয়।"},{"label":"ঘ","question":"দৃশ্যপট-২ এর আলোকে 10g অধঃক্ষেপ পাওয়া সম্ভব কি? গাণিতিকভাবে বিশ্লেষণ কর।","answer":"দৃশ্যপট-২ এ 500 mL 0.2 M FeSO₄ দ্রবণে NaOH দ্রবণ যোগ করা হয়েছে । এতে আয়রন (II) হাইড্রক্সাইডের সবুজ অধঃক্ষেপ পড়ে ।\nFeSO₄+2NaOH→Fe(OH)₂+Na₂SO₄\nFeSO₄ এর মোল সংখ্যা, n=S×V=0.2mol/L×500/1000L=0.1mol Fe(OH)₂ এর আণবিক ভর =56+(16+1)×2=90g/mol সমীকরণ অনুসারে, 1 mol FeSO₄ থেকে Fe(OH)₂ উৎপন্ন হয় = 1 mol = 90 g\n∴ 0.1 mol FeSO₄ থেকে Fe(OH)₂ উৎপন্ন হয় =90×0.1g=9g অর্থাৎ পর্যাপ্ত NaOH যোগ করলেও FeSO₄ লিমিটিং বিক্রিয়ক হিসেবে কাজ করবে এবং সর্বোচ্চ 9 g অধঃক্ষেপ পাওয়া যাবে । 10 g অধঃক্ষেপের জন্য প্রয়োজনীয় FeSO₄ = 10/90 mol =0.111 mol \u003e 0.1 mol যেহেতু দ্রবণে মাত্র 0.1 mol FeSO₄ আছে, তাই সর্বোচ্চ 9 g Fe(OH)₂ পাওয়া সম্ভব । সুতরাং দৃশ্যপট-২ এর আলোকে 10 g অধঃক্ষেপ পাওয়া সম্ভব নয়।"}]},{"id":"ch6-cq18","chapter":6,"num":18,"importance":3,"topic":"উৎপাদের শতকরা পরিমাণ হিসাব","board":"দিনাজপুর বোর্ড ২০২৫","stem":"দৃশ্য-১: একটি যৌগের 3.42g কে বিশ্লেষণ করে 0.54g Al, 0.96g S এবং যৌগটির অপর পরমাণু অক্সিজেন পাওয়া গেল । যৌগটির স্থূল সংকেত ও আণবিক সংকেত একই। (সংশোধিত)\nদৃশ্য-২: Mg(NO₃)₂→MgO+NO₂+O₂\n3.0115 x 10²³ টি অণু (Mg(NO₃)₂); 19g (MgO)","subQuestions":[{"label":"ক","question":"1 ক্যালরি কাকে বলে?","answer":"1 g বিশুদ্ধ পানির তাপমাত্রা 1°C বৃদ্ধি করতে যে পরিমাণ তাপের প্রয়োজন হয় তাকে 1 ক্যালরি বলে। 1 ক্যালরি = 4.184 জুল।"},{"label":"খ","question":"CaO এ পানি ঢাললে মিশ্রণ গরম হয় কেন? ব্যাখ্যা কর।","answer":"CaO (চুন) পানির সাথে বিক্রিয়া করে Ca(OH)₂ (কলিচুন) উৎপন্ন করে।\nCaO+H₂O→Ca(OH)₂+তাপ\nএ বিক্রিয়ায় উৎপাদের বন্ধন গঠনে নির্গত শক্তি বিক্রিয়কের বন্ধন ভাঙতে শোষিত শক্তির চেয়ে বেশি, অর্থাৎ বিক্রিয়াটি তাপোৎপাদী (ΔH ঋণাত্মক)। নির্গত তাপ মিশ্রণে জমা হয় বলে মিশ্রণ গরম হয়ে যায়।"},{"label":"গ","question":"দৃশ্য-১ এর যৌগটির আণবিক সংকেত নির্ণয় কর।","answer":"যৌগের ভর = 3.42 g; Al = 0.54 g, S = 0.96 g O-এর ভর =3.42-(0.54+0.96)g=1.92g Al-এর মোল সংখ্যা =0.54/27=0.02 S-এর মোল সংখ্যা =0.96/32=0.03 O-এর মোল সংখ্যা =1.92/16=0.12 ক্ষুদ্রতম সংখ্যা 0.02 দ্বারা ভাগ করে: Al = 1, S = 1.5, O = 6। পূর্ণসংখ্যায় আনতে 2 দ্বারা গুণ করে: Al = 2, S = 3, O = 12। স্থূল সংকেত = Al₂S₃O₁₂। যেহেতু যৌগটির স্থূল সংকেত ও আণবিক সংকেত একই, তাই আণবিক সংকেত Al₂S₃O₁₂ বা Al₂(SO₄)₃। সুতরাং যৌগটি অ্যালুমিনিয়াম সালফেট, আণবিক সংকেত Al₂(SO₄)₃।"},{"label":"ঘ","question":"দৃশ্য-২ এর বিক্রিয়ক পদার্থ অ্যানালার কিনা? গাণিতিক যুক্তি দাও।","answer":"দৃশ্য-২ এর বিক্রিয়াটির সমতাকৃত রূপ:\nΔ\n2Mg(NO₃)₂⟶2MgO+4NO₂+O₂\n2×148=296g2×40=80g Mg(NO₃)₂-এর আণবিক ভর =24+2(14+16×3)=148 MgO-এর আণবিক ভর =24+16=40 গৃহীত Mg(NO₃)₂-এর মোল সংখ্যা =(3.0115×10²³)/(6.023×10 23)=0.5mol গৃহীত Mg(NO₃)₂-এর ভর =0.5×148g=74g সমীকরণ অনুযায়ী 1 মোল Mg(NO₃)₂ থেকে 1 মোল MgO উৎপন্ন হয়।\n∴ 0.5 mol বিশুদ্ধ Mg(NO₃)₂ থেকে MgO পাওয়ার কথা =0.5×40g=20g কিন্তু প্রকৃতপক্ষে MgO পাওয়া গেছে 19 g। 19 g MgO উৎপন্ন করতে বিশুদ্ধ Mg(NO₃)₂ লাগে = (296×19)/80g=70.3g বিক্রিয়কের বিশুদ্ধতা =(70.3×100)/74%=95% অ্যানালার (AnalaR) বিকারক প্রায় শতভাগ (99.9% এর বেশি) বিশুদ্ধ হয়। এখানে বিক্রিয়কের বিশুদ্ধতা মাত্র 95%, অর্থাৎ এতে প্রায় 5% অপদ্রব্য আছে। সুতরাং দৃশ্য-২ এর বিক্রিয়ক পদার্থ Mg(NO₃)₂ অ্যানালার নয়।"}]},{"id":"ch6-cq19","chapter":6,"num":19,"importance":3,"topic":"উৎপাদের শতকরা পরিমাণ হিসাব","board":"রাজশাহী বোর্ড ২০২৫","stem":"Δ\n(i) KClO₃ (নমুনা-1)60g⟶A(s)+O₂30g\nΔ\n(ii) KClO₃ (নমুনা-2)55g⟶A(s)+O₂20g\n(iii)CuSO₄+5H₂O→′X′","subQuestions":[{"label":"ক","question":"লিমিটিং বিক্রিয়ক কাকে বলে?","answer":"কোনো রাসায়নিক বিক্রিয়ায় যে বিক্রিয়ক পরিমাণে কম থাকার কারণে আগে সম্পূর্ণরূপে নিঃশেষ হয়ে যায় এবং উৎপাদের পরিমাণ নির্ধারণ করে, তাকে লিমিটিং বিক্রিয়ক বলে।"},{"label":"খ","question":"ব্লিচিং পাউডার কীভাবে কাপড়ের রঙিন দাগ উঠায়? ব্যাখ্যা করো।","answer":"ব্লিচিং পাউডার (CaOCl₂) জলীয় বাষ্প বা পানির সংস্পর্শে ক্লোরিন গ্যাস মুক্ত করে। এই ক্লোরিন পানির সাথে বিক্রিয়া করে জায়মান অক্সিজেন [O] উৎপন্ন করে।\nCaOCl₂+H₂O→Ca(OH)₂+Cl₂\nCl₂+H₂O→2HCl+[O]\nজায়মান অক্সিজেন কাপড়ের রঙিন পদার্থকে জারিত করে বর্ণহীন যৌগে পরিণত করে। ফলে কাপড়ের রঙিন দাগ উঠে যায়।"},{"label":"গ","question":"'X' যৌগটির ৫টি অণুর ভর নির্ণয় কর।","answer":"CuSO₄+5H₂O→CuSO₄.5H₂O\n∴ 'X' হলো তুঁতে, CuSO₄.5H₂O X এর আণবিক ভর, M=63.5+32+16×4+5×(1× 2+16)=249.5g/mol 1 mol বা 6.023 × 10²³ টি অণুর ভর 249.5g\n∴ 5টি অণুর ভর =(249.5×5)/(6.023×10²³)=2.07×10⁻²¹g অতএব, 'X' যৌগটির ৫টি অণুর ভর 2.07 × 10⁻²¹ g।"},{"label":"ঘ","question":"নমুনা-1 ও নমুনা-2 এর মধ্যে কোনটি পরীক্ষাগারে ব্যবহারের জন্য অধিকতর উপযোগী? উৎপাদের শতকরা পরিমাণ নির্ণয়ের মাধ্যমে বিশ্লেষণ কর।","answer":"KClO₃ কে তাপ দিলে কঠিন KCl (A) ও O₂ গ্যাস উৎপন্ন হয়:\nΔ\n2KClO₃⟶2KCl+3O₂\n2KClO₃ = 2 × (39 + 35.5 + 48) = 245; 2KCl=2×(39+ 35.5)=149; 3O₂ = 96 60g KClO₃ থেকে সর্বোচ্চ O₂=(96×60)/245=23.51g, যা 30g এর চেয়ে কম। তাই প্রদত্ত 30g ও 20g হলো কঠিন উৎপাদ A অর্থাৎ KCl এর ভর। নমুনা-1: 60g KClO₃ থেকে তাত্ত্বিক KCl=(149×60)/245=36.49g উৎপাদের শতকরা পরিমাণ =(30×100)/36.49=82.21% নমুনা-2: 55g KClO₃ থেকে তাত্ত্বিক KCl=(149×55)/245=33.45g উৎপাদের শতকরা পরিমাণ =(20×100)/33.45=59.79% উৎপাদের শতকরা পরিমাণ যত বেশি, বিক্রিয়ক তত বেশি বিশুদ্ধ । নমুনা-1 এর উৎপাদের শতকরা পরিমাণ (82.21%) নমুনা-2 এর (59.79%) চেয়ে বেশি, অর্থাৎ নমুনা-1 বেশি বিশুদ্ধ । অতএব, নমুনা-1 পরীক্ষাগারে ব্যবহারের জন্য অধিকতর উপযোগী ।"}]},{"id":"ch7-cq1","chapter":7,"num":1,"importance":2,"topic":"পদার্থের পরিবর্তন","board":"ময়মনসিংহ বোর্ড ২০২৩","stem":"(i) I₂(s) ⇌(+তাপ / -তাপ) I₂(g)\n+ তাপ\n(ii)S(s)⟶S(l)\n(iii)N₂O₄(g)⇌2NO₂(g)","subQuestions":[{"label":"ক","question":"স্ফুটন কাকে বলে?","answer":"যে তাপমাত্রায় কোনো তরলের বাষ্পচাপ বায়ুমণ্ডলের চাপের সমান হয় এবং তরলটি সমগ্র অংশ থেকে দ্রুত বাষ্পে পরিণত হতে থাকে, সেই প্রক্রিয়াকে স্ফুটন বলে।"},{"label":"খ","question":"ব্যাপন ও নিঃসরণের মূল পার্থক্য ব্যাখ্যা কর।","answer":"ব্যাপন হলো কোনো মাধ্যমে পদার্থের অণুসমূহের উচ্চ ঘনত্বের স্থান থেকে নিম্ন ঘনত্বের স্থানে স্বতঃস্ফূর্তভাবে ছড়িয়ে পড়া । এতে কোনো সরু ছিদ্রের প্রয়োজন হয় না। নিঃসরণ হলো সরু ছিদ্রপথে গ্যাসের অণুসমূহের উচ্চ চাপ থেকে নিম্ন\nচাপের দিকে বের হয়ে আসা।\nঅর্থাৎ মূল পার্থক্য হলো — ব্যাপন ঘনত্বের পার্থক্যের কারণে মাধ্যমে ছড়িয়ে পড়া, আর নিঃসরণ চাপের পার্থক্যের কারণে সরু ছিদ্র দিয়ে বেরিয়ে আসা। ব্যাপন কঠিন, তরল ও গ্যাস সবক্ষেত্রে হতে পারে, কিন্তু নিঃসরণ মূলত গ্যাসের ধর্ম।"},{"label":"গ","question":"উদ্দীপকের কোনটি রাসায়নিক প্রক্রিয়া? ব্যাখ্যা কর।","answer":"উদ্দীপকের (iii) নং প্রক্রিয়াটি রাসায়নিক প্রক্রিয়া ।\nN₂O₄(g)⇌2NO₂(g)\nএখানে বর্ণহীন ডাইনাইট্রোজেন টেট্রোক্সাইডের (N₂O₄) N-N বন্ধন ভেঙে বাদামি বর্ণের নাইট্রোজেন ডাইঅক্সাইড (NO₂) উৎপন্ন হয়। উৎপন্ন NO₂ এর সংকেত, বর্ণ ও ধর্ম N₂O₄ থেকে সম্পূর্ণ ভিন্ন। অর্থাৎ পুরোনো বন্ধন ভেঙে নতুন পদার্থ সৃষ্টি হয়েছে । অপরদিকে, (i) নং প্রক্রিয়ায় কঠিন আয়োডিন তাপে আয়োডিন বাষ্পে এবং (ii) নং প্রক্রিয়ায় কঠিন সালফার তাপে তরল সালফারে পরিণত হয়। এ দুটিতে সংকেত (I₂, S) একই থাকে, শুধু ভৌত অবস্থা বদলায়, তাই এরা ভৌত প্রক্রিয়া । সুতরাং, উদ্দীপকের (iii) নং প্রক্রিয়াটিই রাসায়নিক প্রক্রিয়া ।"},{"label":"ঘ","question":"উদ্দীপকের (i) ও (ii) নং প্রক্রিয়ার মধ্যে তুলনা কর।","answer":"উদ্দীপকের (i) নং প্রক্রিয়াটি ঊর্ধ্বপাতন এবং (ii) নং প্রক্রিয়াটি গলন। I₂(s) \u003c=(+তাপ / -তাপ)=\u003e I₂(g) (i) নং এ কঠিন আয়োডিনকে তাপ দিলে তা তরলে পরিণত না হয়ে সরাসরি বাষ্পে পরিণত হয় এবং বাষ্পকে ঠান্ডা করলে সরাসরি কঠিনে ফিরে আসে। কঠিন পদার্থের তরল না হয়ে সরাসরি বাষ্পে পরিণত হওয়াকে ঊর্ধ্বপাতন বলে। +তাপ\nS(s)⟶S(l)\n(ii) নং এ কঠিন সালফারকে তাপ দিলে তা গলে তরল সালফারে পরিণত হয়। তাপ প্রয়োগে কঠিন থেকে তরল অবস্থায় রূপান্তরকে গলন বলে। মিল: দুটিই তাপ গ্রহণকারী ভৌত প্রক্রিয়া; কোনোটিতেই নতুন পদার্থ তৈরি হয় না, সংকেত একই থাকে । অমিল: ঊর্ধ্বপাতনে কঠিন থেকে সরাসরি গ্যাস হয়, মাঝে তরল অবস্থা থাকে না; গলনে কঠিন থেকে তরল হয়। ঊর্ধ্বপাতিত পদার্থকে ঠান্ডা করলে সরাসরি কঠিন পাওয়া যায়, আর গলিত সালফার ঠান্ডা করলে আগে তরল থেকে কঠিনে জমাট বাঁধে । সুতরাং, (i) ও (ii) উভয়ই ভৌত পরিবর্তন হলেও (i) নং প্রক্রিয়াটি ঊর্ধ্বপাতন এবং (ii) নং প্রক্রিয়াটি গলন।"}]},{"id":"ch7-cq2","chapter":7,"num":2,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","board":"বরিশাল বোর্ড ২০২৬","stem":"(i)PbCl₂+Cl₂→PbCl₄\n(ii)SO₂(g)+O₂(g)⇌SO₃(g)+তাপ","subQuestions":[{"label":"ক","question":"বিক্রিয়ার হার কাকে বলে?","answer":"একক সময়ে কোনো বিক্রিয়ার বিক্রিয়ক বা উৎপাদের ঘনমাত্রার যে পরিবর্তন ঘটে, তাকে ঐ বিক্রিয়ার হার বলে। এর একক mol L⁻¹ s⁻¹।"},{"label":"খ","question":"অ্যালুমিনিয়াম ধাতু মুক্ত বাতাসে রাখলে কী ধরনের পরিবর্তন হবে? ব্যাখ্যা কর।","answer":"অ্যালুমিনিয়াম ধাতু মুক্ত বাতাসে রাখলে বাতাসের অক্সিজেনের সাথে বিক্রিয়া করে এর পৃষ্ঠে অ্যালুমিনিয়াম অক্সাইডের (Al₂O₃) একটি পাতলা আবরণ তৈরি হয়। এটি একটি রাসায়নিক পরিবর্তন, কারণ এতে নতুন পদার্থ উৎপন্ন হয়।\n4Al+3O₂→2Al₂O₃\nএখানে Al জারিত হয়ে Al³⁺ এ পরিণত হয়। উৎপন্ন Al₂O₃ এর আবরণটি ঘন ও অভেদ্য হওয়ায় তা ভেতরের ধাতুকে বাতাস ও জলীয় বাষ্পের সংস্পর্শ থেকে রক্ষা করে, ফলে অ্যালুমিনিয়ামের আর ক্ষয় হয় না।"},{"label":"গ","question":"জারণ-বিজারণ একসাথে ঘটে তা (i) নং বিক্রিয়ার আলোকে বর্ণনা কর।","answer":"উদ্দীপকের (i) নং বিক্রিয়াটি হলো:\nPbCl₂+Cl₂→PbCl₄\nইলেকট্রন বর্জনকে জারণ এবং ইলেকট্রন গ্রহণকে বিজারণ বলে । বিক্রিয়াটিতে মৌলগুলোর জারণ সংখ্যা নির্ণয় করি: PbCl₂ এ Pb এর জারণ সংখ্যা: x+2(-1)=0, বা x=+2 PbCl₄ এ Pb এর জারণ সংখ্যা: x+4(-1)=0, বা x=+4 Cl₂ এ Cl এর জারণ সংখ্যা = 0; PbCl₄ এ Cl এর জারণ সংখ্যা = -1\nজারণ অর্ধবিক্রিয়া: Pb²⁺ আয়ন 2টি ইলেকট্রন বর্জন করে Pb⁴⁺ এ পরিণত হয়। এখানে Pb এর জারণ সংখ্যা +2 থেকে +4 এ বৃদ্ধি পায়, তাই PbCl₂ জারিত হয়।\nPb²⁺→Pb⁴⁺+2e⁻\nবিজারণ অর্ধবিক্রিয়া: Cl₂ অণু ঐ 2টি ইলেকট্রন গ্রহণ করে 2টি Cl⁻ আয়নে পরিণত হয়। এখানে Cl এর জারণ সংখ্যা 0 থেকে -1 এ হ্রাস পায়, তাই Cl₂ বিজারিত হয়।\nCl₂+2e⁻→2Cl⁻\nঅর্ধবিক্রিয়া দুটি যোগ করে পাই:\nPb²⁺+Cl₂→Pb⁴⁺+2Cl⁻\nএখানে PbCl₂ বিজারক এবং Cl₂ জারক হিসেবে কাজ করে। Pb²⁺ যে কয়টি ইলেকট্রন বর্জন করে, Cl₂ ঠিক সে কয়টি ইলেকট্রন গ্রহণ করে। ইলেকট্রন গ্রহণকারী না থাকলে কোনো পরমাণু ইলেকট্রন বর্জন করতে পারে না। তাই জারণ ও বিজারণ একই সাথে ঘটে।"},{"label":"ঘ","question":"(ii) নং বিক্রিয়ার সাম্যাবস্থায় তাপ ও চাপের প্রভাব লা- শাতেলিয়ার নীতির আলোকে বিশ্লেষণ কর।","answer":"উদ্দীপকের (ii) নং বিক্রিয়ার সমতাকৃত রূপ:\n2SO₂(g)+O₂(g)⇌2SO₃(g)+তাপ\nলা-শাতেলিয়ার নীতি অনুসারে, সাম্যাবস্থায় থাকা কোনো উভমুখী বিক্রিয়ার তাপমাত্রা, চাপ বা ঘনমাত্রার কোনো একটি পরিবর্তন করলে সাম্যাবস্থা সেই দিকে সরে যায়, যে দিকে গেলে ঐ পরিবর্তনের ফল প্রশমিত হয়।\nতাপের প্রভাব বিক্রিয়াটির সম্মুখমুখী দিক তাপোৎপাদী (তাপ উৎপন্ন হয়) এবং পশ্চাৎমুখী দিক তাপহারী ।\n• তাপমাত্রা বৃদ্ধি করলে সাম্যাবস্থা তাপ শোষণের দিকে, অর্থাৎ পশ্চাৎমুখী দিকে সরে যায়। ফলে SO₃ এর উৎপাদন হ্রাস পায়।\n• তাপমাত্রা হ্রাস করলে সাম্যাবস্থা তাপ উৎপাদনের দিকে, অর্থাৎ সম্মুখমুখী দিকে সরে যায়। ফলে SO₃ এর উৎপাদন বৃদ্ধি পায়। তবে তাপমাত্রা খুব কম হলে বিক্রিয়ার হার কমে যায়। তাই শিল্পক্ষেত্রে (স্পর্শ পদ্ধতিতে) V₂O₅ প্রভাবকের উপস্থিতিতে প্রায় 450°C তাপমাত্রা ব্যবহার করা হয়।\nচাপের প্রভাব বিক্রিয়ক পক্ষে গ্যাসের মোল সংখ্যা =2+1=3; উৎপাদ পক্ষে =2\n• চাপ বৃদ্ধি করলে সাম্যাবস্থা কম মোল সংখ্যার দিকে, অর্থাৎ সম্মুখমুখী দিকে সরে যায়। ফলে SO₃ এর উৎপাদন বৃদ্ধি পায়।\n• চাপ হ্রাস করলে সাম্যাবস্থা বেশি মোল সংখ্যার দিকে, অর্থাৎ পশ্চাৎমুখী দিকে সরে যায়। ফলে SO₃ এর উৎপাদন হ্রাস পায়। অতএব, লা-শাতেলিয়ার নীতি অনুসারে (ii) নং বিক্রিয়ায় নিম্ন তাপমাত্রা ও উচ্চ চাপ SO₃ উৎপাদনের অনুকূল ।"}]},{"id":"ch7-cq3","chapter":7,"num":3,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","board":"কুমিল্লা বোর্ড ২০২৬","stem":"দৃশ্যকল্প-১ : জনাব সৈয়দ ইব্রাহিম খলিল সাহেব ডেমরা এলাকার একজন ব্যবসায়ী । তিনি তার বাড়ি নির্মাণের জন্য লোহার রড কিনলেন। ব্যবসায়িক ব্যস্ততার কারণে দীর্ঘদিন রডগুলো খোলা আকাশের নিচে পড়ে থাকায় রডের উপর বাদামি বর্ণের আস্তরণ পড়েছে । দৃশ্যকল্প-২ :\n(i)H₂S(g)+Cl2(g)→2HCl(g)+S(s)\n(ii)2SO₂(g)+O₂(g)→2SO₃(g)","subQuestions":[{"label":"ক","question":"অ্যানালার গ্রেড পদার্থ কাকে বলে?","answer":"অ্যানালার গ্রেড পদার্থ: যেসব রাসায়নিক পদার্থের বিশুদ্ধতা অনেক বেশি (প্রায় 99.9% বা তার বেশি) এবং যেগুলো সূক্ষ্ম রাসায়নিক বিশ্লেষণ ও গবেষণায় ব্যবহৃত হয়, তাদেরকে অ্যানালার গ্রেড পদার্থ বলে।"},{"label":"খ","question":"আপেক্ষিক পারমাণবিক ভরের একক নেই কেন? ব্যাখ্যা কর।","answer":"কোনো মৌলের একটি পরমাণুর ভর একটি C-12 আইসোটোপের ভরের 1/12 অংশের তুলনায় যত গুণ ভারী, সেই সংখ্যাকে ঐ মৌলের আপেক্ষিক পারমাণবিক ভর বলে । আপেক্ষিক পারমাণবিক ভর = (মৌলের একটি পরমাণুর ভর)/(একটি C-12 পরমাণুর ভরের 1/12 অংশ) এখানে লব ও হর উভয়ই ভর এবং একই একক (g) এ প্রকাশিত । ফলে ভাগ করলে একক কেটে যায় এবং কেবল একটি অনুপাত বা সংখ্যা পাওয়া যায়। তাই আপেক্ষিক পারমাণবিক ভরের কোনো একক নেই।"},{"label":"গ","q
