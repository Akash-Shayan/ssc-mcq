ং পাউডার কীভাবে কাপজড় র রভঙন দাগ উোয? ব্যাখ্যা করো। র","answer":"কাপনড় ি দার্গি উপর ব্লিচিং পাউডার বির্খ পানি যোগ করলে এটি CaCl2 ও HOCl ততরি করে। HOCl বিনে HCl ও ৈােমান ় ় অক্সিজেন [O] দেয়। এই ৈােমান অক্সিজেন িমেে পদাথক ৈারিত করে বর্ণহীন করে, িনল দাগ উনঠ যায়। + Ca(OCl)Cl+H O→CaCl +HOCl 2 2 HOCl → HCl+[O]; িমেে পদাথড + [O] → বর্ণহীন পদাথড","boards":"রাজশাহী বোর্ড ২০২৫"},{"id":"ch12-sq8","chapter":12,"num":8,"importance":2,"question":"সাবান ও ততডটারজেথনট ্র মজধ্য পায়কয লেখো।","answer":"সাবান ততডটারজেনট ্ দীঘড কার্বন মশকলর মশটটিযাটি দীঘড কার্বন মশকলর মশটট ় ় এসিডের সোডিয়াম বা পটাশিয়াম ব েরৈে সালফিউরিক এসিডের ় ় লবণ (যেমন C H COONa) সোডিয়াম লবণ ( বা সোডিয়াম 17 35 লিাইল সালনিট, C H SO Na) 12 25 4 খি পানিনত িানলা কাৈ করে ো খি পানিনতও িানলা কাৈ করে ্ ্ ্ ্ পরিষ্ক ািকিণ ক্ষমতা কম পরিষ্ক ািকিণ ক্ষমতা বেশি ় ় গৃ হস্ালের রসায়ন ড ন ়","boards":"দিনাজপুর বোর্ড ২০২৪"}],"cqs":[{"id":"ch1-cq1","chapter":1,"num":1,"importance":2,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও:","subQuestions":[{"label":"ক","question":"তাপ উৎপাদী বিক্রিয়া কাকে বলে? িঁ ু","answer":"বে রাসায়নিক বিক্রিয়াে তাপ উৎপন্ন হয়ে পরিবেশে রেগডত হয় এবং পরিবেশেি তাপমানা ব নড় যায়, তানক তাপ উৎপাদী বিক্রিয়া বলে। যেমন: CaO +H O → Ca(OH) +তাপ। 2 2 িঁ ় ়"},{"label":"খ","question":"মপপড়াি কার্নড় ি ক্ষত থানে চে লাগানো হয় কেন?","answer":"মপপড়া কার্ড় দেওয়াি সময় ক্ষতথানে ভরমর্ক এসিড (H- ় ় COOH) প্রবেশ করিনে দেয়। এই এসিডের কারণে ক্ষতথানে ় ু জ্ালার্পাড় বা ও যথা হয়। চে (CaO) পানির সাথে বিক্রিয়া করে ক্ষারীে ় ক্যালসিয়াম হাই বিাইর্ উৎপন্ন করে, ো ভরমর্ক এসিক প্শমর্ত করে লবণ ও পানি ততরি করে। 2H-COOH+Ca(OH) →(H-COO) Ca+2H O 2 িনল এসিডের প্রবণতা েটট হয় এবং জ্ালার্পাড় বা কনর্ যায়। এজন্য িঁ ু মপপড়াি কার্নড় ি ক্ষতথানে চে লাগানো হয়। কণার গরভরতত"},{"label":"গ","question":"ল্যাবরেটরিনত A এবং B এর ব্যবহার আ শযক কেন? ব্যাখ্যা কি।","answer":"উদ্দীপকের A হলো অযানপ্রায় বা লযা বকাট এবং B হলো বসিটি ় র গগলস। ল্যাবরেটরিনত রেিাপনদ কাৈ করাি জন্য এ দুটি ব্যবহার র করা আ শযক। ় A (অ্যাপ্রোন): ল্যাবরেটরিনত র ভিন্ন এসিড, ক্ষার ও ক্ষেকািী ় ় ় ় রাসায়নিক পদাথড রেনে কাৈ কিনত হয়। কাৈ করাি সময় অসা ধােতা শত গাঢ় H SO, HNO, NaOH ইতযারদ শরীরে বা 2 4 3 থপাশানক পড় বলে চার্ড় বা পুনড় বেনত পানি, থপাশাক েটট হয়ে বেনত পানি। আ াি দাহয পদাথড থেকে আগুে লাগাি সম্া োও থাকে। অযানপ্রায় শিীি ও থপাশাকনক বঢনক িার্খ, িনল এস রাসায়নিক র পদাথড সিাসরি শিীনভর সংস্পর্শড আসনত পানি ো। ন ় B (কসফটি গগেস): বচাখ শিীনভর স নচনে সংন দেশীল অঙ্গ। ় ় ় পিীক্ষার সময় এসিড বা ক্ষানভর ছছটা, তাপ দেওয়াি সময় বটস ট টি উ থেকে ছছটনক আসা দ্রবণ, কানচি টকরা রকং বা ক্ষরতকি গ্যাস ও বাষ্প বচার্খ লেডগ বচার্খি র্ািাতমক ক্ষরত, এর্েরক অন্ধতও হনত পানি। বসিটি গগলস বচাখনক এস থেকে িক্ষা করে। সু তিাং দুঘডটো থেকে শিীি ও বচাখনক িক্ষা করে রেিাপনদ পিীক্ষা সম্পন্ করাি জন্য ল্যাবরেটরিনত A ও B এর ব্যবহার আ শযক। ্ ্"},{"label":"ঘ","question":"তড মান বপ্ক্ষাপনট C এর ব্যবহার অতযন্ গুিুতপূর্ণ– বতার্াি উকরেি সপর্ক্ষ র্তার্ত দাও।","answer":"উদ্দীপকের C হলো মাস্ক। তড মান বপ্ক্ষাপনট ল্যাবরেটরিনত এবং ় ্ ্ ত তদেক্সনদে জীবনে উভয় থক্ষতরেই মাস্কের ব্যবহার অতযন্ গুিুতপূর্ণ— ড ব আমর্ এ র্নতি সাথে একমত। কািণ: ় ় ্ • েযাবজরটররজি: অনেক রাসায়নিক পিীক্ষাে ক্ষরতকি ও র ষাকব ় গ্যাস বা বাষ্প উৎপন্ন হয়, যেমন: Cl, SO, NO, H S, NH এবং 2 2 2 2 3 গাঢ় HCl ও HNO এর বাষ্প। এগুনলা ্লানসি সাথে িু সিু নস থগনল 3 ্ ্ ্ ্ল াসকটট, কামশ, িু সিু নসি প্দাহসহ যায়া বিাগ হনত পানি। মাস্ক ় ় ় ্ এস গ্যাস, বাষ্প ও রাসায়নিক পদার্থডি সূ গু ড় বা ্লাসোললনত প্ন র্শ াধা দেয়। • বায়ু দষণ ক্ষেজক সু রো: তড র্ানে শহনি যায় াহয় ও কলকািখাোি ় ু বধ াো থেকে প্চি ধূললকণা, কার্বন র্নোিাইর্, সালিাি র্াইঅক্সাইড, নাইট্রোজেনের অক্সাইড ইতযারদ াতানস মর্র্শ াে় ় ্ ্ দরষত কিনছ। মাস্ক ব্যবহার করলে এস দরষত উপাদান থেকে ূ ূ ় রকছটা হলেও িক্ষা পাওয়া যায়। • করাগেীবাণু ক্ষেজক সু রো: করযায়া িাইিাস, ইেফ্নেঞ্জা, েা ল ু 2 2 ় ্ ্ ইতযারদ বিার্গি জীবাণু হ াচচ-কামশি মাধ্যমে াতানস ছড় াে। মাস্ক এস জীবাণুি সংেব্ র্ণ প্রতনিানধ কােডকি িমর্কা িার্খ। ় ় সু তিাং ক্ষরতকি রাসায়নিক বাষ্প, াে়ুদষণ ও সংেব্ ার্ক বিাগ থেকে রেনৈনক এবং অেযনক িক্ষা করাি জন্য তড মান বপ্ক্ষাপনট C অর্থাৎ ্ ্ ত মাস্কের ব্যবহার অতযন্ গুিুতপূর্ণ। ্ ় ্ ় গরতশক্তি এত ানড় বে কণাগুনলা আকর্ষণ থেকে প্রায় র্ুকব হয়ে র প্ক্ষপ্রবণতান বছানট — গ্যাসীে অবস্থা। ত ি বযাপন"}],"board":"বরিশাল বোর্ড ২০২২","diagramId":"ch1-cq1"},{"id":"ch2-cq1","chapter":2,"num":1,"importance":2,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও:","subQuestions":[{"label":"ক","question":"অ্যালকোহল কাকে বলে?","answer":"অ্যালকেন অণুি এক বা একারধক হাইরোজেন পরমাণু হাই ব ক্সিল (-OH) মূলক দ্বারা প্রতথামপত হলে বে তৈ যৌগ উৎপন্ন ্ ি হয় তানক অ্যালকোহল বলে। যেমন: CH -CH -OH (ইথানল)। 3 2 ় ়"},{"label":"খ","question":"িসল উৎপাদনে রাসায়নিক সানভর প্রবণতা ব্যাখ্যা কি।","answer":"িসল উৎপাদনে উলিনদি প্নোৈেীে পুটটি উপাদান (N, P, K ইতযারদ) মাটি নত যোগানেি জন্য রাসায়নিক সাি ব্যবহার করা হয়। যেমন: ইউরিয়া নাইট্রোজেন, TSP িসভরাস এবং MoP পটাশিয়াম সি িাহ করে। পরিমর্ত য হানি িসনলি বৃদ্ধি ও িলে ানড়। কিন্তু মানারতরিকব য হানি মাটি ি উ ডিতা ও গুণাগুণ েটট হয় এবং অরতরিকব সাি ৃটটি ি ﻿ ় ় পানির সাথে ৈলাশনে রগনে পানি দরষত করে ও ৈলৈ প্াণীি ক্ষরত ূ র করে।"},{"label":"গ","question":"বকাে ৈানভর গ্যাসটি আগে ছপ্ড় নে পড় ন? ব্যাখ্যা কি।","answer":"উদ্দীপকের Jar-A-বত অ্যামোনিয়া (NH ) এবং Jar-B-বত ইর্থে 3 (C H ) গ্যাস আনছ। একই অবস্থাে বে গ্যাসের আণর ক ভর কম, 2 6 ি ় ় তাি ব্যাপন হার বেশি, তাই বসটি আগে ছপ্ড় নে পনড়। NH -এর আণরবক ির = 14+1×3 = 17 3 C H -এর আণরবক ির = 12×2+1×6 = 30 2 6 NH -এর আণর ক ভর (17) C H -এর আণর ক ভর (30) অপেক্ষা 3 2 6 কম। িনল NH অণু দ্ুত গরতনত চািরদনক ছপ্ড় নে পনড়। 3 র সু তিাং, Jar-A-এর গ্যাস (NH ) আগে ছপ্ড় নে পড় ন। 3"},{"label":"ঘ","question":"'C' ৈানভর পদাথডটি কঠ ি ে কিন্তু এর ব্যাপন সম্ - উপ্কবটি বিশ্লেষণ কি।","answer":"উদ্দীপকের C ৈানভর পদাথডটি পটাশিয়াম পাির্যাঙ্গানেট (KMnO ), ো একটি কঠ ি ে পদাথড। কঠ ি ে হলেও তিল মাধ্যমে এর 4 ব্যাপন ঘনট। ্ ় কানচি পাতরে র শুদধ পানিনত কনেকটি KMnO দাো বছনড় রদনল ্ 4 ূ ় ূ দাোগুনলা ধীনি ধীনি দ্ ীিত হয়। দ্ ীিত কণাগুনলা দাোি চািপার্শ র র বেশি ঘনমাত্রায় থাকে এবং বসখাে থেকে কম ঘেমানাি রদনক ্ ় স্ব তঃস্ফতড িান ছপ্ড় নে পনড়। রকছক্ষণ পি পু নিা পানি থগালামপ ণড ধািণ করে। এটিই তিল মাধ্যমে কঠ ি ে পদার্থডি ব্যাপন। ্ ত তন কঠ ি ে পদার্থডি কণাগুনলা শক্তি শালী আন্ঃআণর ক আকষডর্ণ আ দধ থাকে বলে এর ব্যাপন হার কম; পুনিা পানি থগালামপ হনত ় ় কনেক মর্রেট থেকে প্রায় এক ঘণ ট বা লার্গ। পানি গির্ করলে কণাি ্ ় গরতশক্তি ানড়, িনল ব্যাপন দ্ুত হয়। 10 8 সু তিাং, C ৈানভর পদাথডটি কঠ ি ে হলেও তিল মাধ্যমে এর ব্যাপন ভ ্ সম্ — উপ্কবটি েথাথড। গেন ও সফটন"}],"board":"যশোর বোর্ড ২০২২","diagramId":"ch2-cq1"},{"id":"ch2-cq2","chapter":2,"num":2,"importance":2,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও:","subQuestions":[{"label":"ক","question":"ঊধ্ডপাতে কাকে বলে? [৩ বোর্ডে এনসনছ]","answer":"বে প্মে্ব যায় কোনো কঠ ি ে পদাথক তাপ রদনল তা তিনল ় ় ড পরিণত ো হয়ে সিাসরি ববাষ্প পরিণত হয় এবং ঐ বাষ্পনক ঠান্া করলে সিাসরি কঠ ি নে পরিণত হয়, তানক ঊধ্ডপাতে বলে। যেমন: ় ় কপূডি, েযাপথাললে, আনোপ্র্ে, অ্যামোনিয়ার্ ক্লোরাইড (NH Cl)। ল 4"},{"label":"খ","question":"উলিনদি খাদয উৎপাদে িসােনেি সাথে সম্পরকিতড - ব্যাখ্যা কি।","answer":"স ুৈ উলিদ সূনেডি আনলাি উপমথরতনত ব্ানিামিনলি সাহানেয ি ল াতানসি কার্বন র্াইঅক্সাইড (CO ) ও মাটি থেকে থশারষত পানি 2 টাইপ ভিততিক মাস্ট ার সাজেশন (H O) দিয়ে রেনৈি খাদয গলনকাৈ (C H O ) ততরি করে এবং ্ ু 2 6 12 6 অক্সিজেন তযাগ করে। এ প্মে্বোনক সানলাকসংন্লষণ বলে। সূ েড ানলাক, ব্ানিামিল 6CO +6H O ⟶ 2 2 ় ় এ প্মে্ব যায় CO ও H O এর ন্ধে বিনে সম্পূর্ণ েতে পদাথড গলনকাৈ র 2 2 ও অক্সিজেন ততরি হয়, অর্থাৎ এটি একটি রাসায়নিক বিক্রিয়া। তাই উলিনদি খাদয উৎপাদে িসােনেি সাথে সম্পরকিতড"},{"label":"গ","question":"উদ্দীপকের ে্বনিখাটি ি ণডো দাও। ত ্ ত","answer":"উদ্দীপকের ে্বনিখাটি একটি পদার্থডি তাপমানা োর্ সময়েি বলখচচে বা তাপীে েব্ নিখা। এখানে পদাথডটি ি গলোঙ্ক 50°C এবং স্ফটোঙ্ক 150°C। AB অংশ: শুিুনত A র নদুনত 20°C তাপর্াযায় পদাথডটি কঠ ি ে অবস্থাে থাকে। তাপ রদনল AB িা ি কঠ ি ে পদার্থডি তাপমানা াড় নত থাকে এবং B র নদুনত 50°C এ থপৌিঁছাে। BC অংশ: 50°C এ তাপ দেওয়া সনততও তাপমানা মথি থাকে, কািণ প্দক তাপ কঠ ি জনক তিনল পরিণত কিনত যে হয়। তাই BC বিখা হলো গলোঙ্ক বিখা। এ অংর্শ কঠ ি ে ও তিল উভয় অবস্থা র দযমান থাকে। CD অংশ: সম্পূর্ণ কঠ ি ে গনল োওোি পি CD িা ি তিনলি তাপমানা াড় নত থাকে এবং D র নদুনত 150°C এ থপৌিঁছাে। DE অংশ: 150°C এ তিল িু টনত থাকে এবং ববাষ্প পরিণত হয়। ় ত সম্পূর্ণ তিল ববাষ্প পরিণত ো হওো পে্ তাপমানা মথি থাকে। তাই DE বিখা হলো স্ফটোঙ্ক বিখা। এ অংর্শ তিল ও গ্যাসীে উভয় অবস্থা র দযমান থাকে। EF অংশ: সম্পূর্ণ তিল ববাষ্প পরিণত হওয়ার পি আিও তাপ রদনল EF িা ি ববাষ্পি তাপমানা াড় নত থাকে। সু তিাং, েব্ নিখাটি ি ঢালু অংর্শ পদার্থডি তাপমানা ানড় এবং অেুিমর্ক অংর্শ (BC ও DE) তাপমানা মথি থেকে অবস্থাি পরি তড ে ঘনট।"},{"label":"ঘ","question":"A ও F র নদুনত অণুসর্ূনহি আন্ঃআণর ক শক্তি ও আন্ঃকণা ্ ু গরতশক্তি ি তলোমূলক আনলাচো কি।","answer":"উদ্দীপকের বলখচচতরে A র নদুনত (20°C) পদাথডটি কঠ ি ে অবস্থাে এবং F র নদুনত (150°C এর বেশি) পদাথডটি গ্যাসীে অবস্থাে থাকে। A রবনদ (কঠ ি ন অবস্থা): কঠ ি ে অবস্থাে অণুগুনলা খু কাছাকাছছ ও ্ ু থ ি রেরদিটড ট অবস্থানে সজ্জিত থাকে। অণুগুনলাি র্ধযকাি আন্ঃআণর ক আকর্ষণ শক্তি খু বেশি, তাই অণুগুনলা থাে পরি তড ে কিনত পানি ো, শুধু রেৈ অবস্থানে ক াপনত থাকে। এ অবস্থাে আন্ঃকণা গরতশক্তি খু ই কম। ় ত F রবনদ (গ্যাসীয অবস্থা): A থেকে F পে্ পদাথডটি েব্ র্াগত তাপ ্ ু থশাষণ করেনছ। িনল অণুগুনলাি গরতশক্তি াড় নত াড় নত ত ় আন্ঃআণর ক আকর্ষণ ল ছছন্ হয়ে থগনছ। গ্যাসীে অবস্থাে অণুগুনলা পিস্পি থেকে অনেক দনি থাকে; আন্ঃআণর ক আকর্ষণ ্ ্ শক্তি বেই লনলই চনল এবং অণুগুনলা র্ুকবিান র প্ক্ষপ্রবণতান ছটাছটি ় ত ্ করে। এ অবস্থাে আন্ঃকণা গরতশক্তি স নচনে বেশি। রবষয A রবনদ (কঠ ি ন) ্ ু ত ় আন্ঃআণর ক আকর্ষণ স নচনে বেশি শক্তি ত ্ ় আন্ঃকণা গরতশক্তি স নচনে কম অণুি চলাচল শুধু রেৈ থানে কম্পে র্ুকব িান সু তিাং, A র নদু থেকে F র নদুি রদনক তাপমানা াড় াি সাথে ড ড ত ্ ্ আন্ঃআণর ক শক্তি কনর্ এবং গরতশক্তি ানড়; অর্থাৎ A ও F র নদুনত এ দুটি শক্তি সম্পূ ণড র পিীত অবস্থাে থাকে। ﻿"}],"board":"যশোর বোর্ড ২০২৩","diagramId":"ch2-cq2"},{"id":"ch2-cq3","chapter":2,"num":3,"importance":2,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: ্ একটি পদাে \"A\" এর গেনাঙ্ক 45°C ও সফটনাঙ্ক 95°C. C H O +6O ু 6 12 6 2","subQuestions":[{"label":"ক","question":"ঊধ্ডপাতে কাকে বলে? [৩ বোর্ডে এনসনছ] ্ ু","answer":"বে প্মে্ব যায় কোনো কঠ ি ে পদাথক তাপ রদনল তা তিনল ় ় ড পরিণত ো হয়ে সিাসরি ববাষ্প পরিণত হয় এবং ঐ বাষ্পনক ঠান্া ় করলে সিাসরি কঠ ি নে পরিণত হয়, তানক ঊধ্ডপাতে বলে। + ় ়"},{"label":"খ","question":"NaCl উচ্চ গলোঙ্কর মশটট হয় কেন? ব্যাখ্যা কি। ় ়","answer":"NaCl একটি আয়নিক যৌগ। এর বকলানস প্রতটি Na আয়ন − − + ় ্ ় চািরদক থেকে 6টি Cl আয়ন দ্বারা এবং প্রতটি Cl আয়ন 6টি Na ় ় র ় ্ ্ ় ় আয়ন দ্বারা পরিন টটি ত থাকে। র পিীত চার্জ েুকব আয়নগুনলা ্ ্ শক্তি শালী মথি ত দুযরতক আকর্ষণ বলে আ দধ থেকে একটি দঢ় ্ ৃ বকলাস ৈালল গঠে করে। ্ ় ্ এই শক্তিশালী আকর্ষণ ল ছছন্ করে আয়নগুনলানক র্ুকব কিনত ু ্ ় ় প্চি তাপশক্তভর প্নোৈে হয়। তাই NaCl এর গলোঙ্ক অনেক বেশি র র (801°C)। ি"},{"label":"গ","question":"A এর তাপীে ে্বনিখা অঙ্কে করে ণডো দাও।।","answer":"পদাথড A এর গলোঙ্ক 45°C ও স্ফটোঙ্ক 95°C। অর্থাৎ সাধারণ ় ় তাপর্াযায় A কঠ ি ে; তাপ রদনল 45°C এ কঠ ি ে থেকে তিনল এবং 95°C এ তিল থেকে ববাষ্প পরিণত হন। ় ় িাপীয বতর্ব জরখ্া অঙ্কন: X অর্ক্ষ সময় এবং Y অর্ক্ষ তাপমানা (°C) ় ত রেনে বলখচচেটি আ কনত হন। র্ূলর নদু O থেকে B পে্ একটি ঊধ্ডর্ু খী ঢালু বিখা (B = 45°C), B থেকে C পে্ 45°C িা ি ূ ত একটি অেুিমর্ক বিখা, C থেকে D পে্ আ াি ঊধ্ডর্ুখী ঢালু বিখা ত ূ (D = 95°C), D থেকে E পে্ 95°C িা ি অেুিমর্ক বিখা এবং E থেকে F পে্ ঊধ্ডর্ুখী ঢালু বিখা। ় ় ি অংশ িাপমাতরা অবস্থা ত ্ OB 45°C পে্ বৃদ্ধি কঠ ি ে BC 45°C এ মথি (গলোঙ্ক) কঠ ি ে + তিল CD 45°C থেকে 95°C তিল ় ত ি DE 95°C এ মথি (স্ফটোঙ্ক) তিল + গ্যাস ি ু EF 95°C এর বেশি গ্যাস ( বাষ্প) বণনা: OB িা ি তাপ থশাষণ করে কঠ ি ে A এর তাপমানা ানড়। B র নদুনত 45°C এ A গলনত শুিু করে; সম্পূর্ণ কঠ ি ে তিনল পরিণত ো ় ় ি ত হওো পে্ তাপমানা মথি থাকে, কািণ প্দক তাপ অবস্থা পরি তড নে ি ি ় ় যে হয়। তাই BC বিখা গলোঙ্ক বিখা। এরপি CD িা ি তিনলি ু ু ত তাপমানা ানড়। D র নদুনত 95°C এ তিল িু টনত শুিু করে এবং সম্পূর্ণ ববাষ্প পরিণত ো হওো পে্ তাপমানা মথি থাকে; তাই DE বিখা স্ফটোঙ্ক বিখা। এরপি EF িা ি ববাষ্পি তাপমানা াড় নত F রবনদ (গ্যাস) ু ্ ু থাকে। বেই লনলই চনল ় ্"},{"label":"ঘ","question":"উদ্দীপকে উপ্ল্মখত তাপমানা দুটি নত পদাথডটি ি অবস্থাি পরি তড ে ল ি কণাি গরততনততি আনলানক বিশ্লেষণ কি। ব ্","answer":"কণাি গরতততত অেুযায়ী, সকল পদাথড অরত ক্ষু দ্ কণা দ্বারা গঠ ি ত। ব র স নচনে বেশি ত ্ কণাগুনলাি র্ধযকাি আন্ঃকণা আকর্ষণ শক্তি এবং কণাি ্ ু ু ছটাছটি ্ ় ় গরতশক্তি ি পাথকযি কারণেই পদাথড কঠ ি ে, তিল বা গ্যাসীে অবস্থাে ্ ্ থাকে। তাপ রদনল কণাি গরতশক্তি ানড় এবং আকর্ষণ শক্তি কনর্। 45°C িাপমাতরায (গেনাঙ্ক): কঠ ি ে A এর কণাগুনলা খু কাছাকাছছ ্ ্ থেকে শক্তিশালী আকর্ষণ বলে আ দধ থাকে এবং রেৈ অবস্থানে ক াপনত থাকে। তাপ রদনল কণাগুনলা তাপশক্তি গ্রহণ করে আিও টাইপ ভিততিক মাস্ট ার সাজেশন বৈানি ক াপনত থাকে। 45°C এ কম্পে এতটা ব নড় যায় বে ত ্ আন্ঃকণা আকর্ষণ শক্তি রকছটা কনর্ যায় এবং কণাগুনলা রেৈ অবস্থাে বছনড় এনক অপনভর উপর দিয়ে চলাচল কিনত পানি। িনল ় ় A গনল তিনল পরিণত হয়। এ সময় প্দক তাপ শুধু আকর্ষণ ল ় ় কমানত যে হয়, তাই তাপমানা মথি থাকে এবং কঠ ি ে ও তিল উভয় অবস্থা র দযমান থাকে। 95°C িাপমাতরায (সফটনাঙ্ক): তিল অবস্থাে আিও তাপ রদনল ু ি কণাগুনলাি গরতশক্তি াড় নত থাকে এবং আকর্ষণ শক্তি আিও কনর্। 95°C এ কণাগুনলা এত বেশি গরতশক্তি অর্জন ে করে বে তািা ত ় আন্ঃকণা আকর্ষণ ল থেকে প্রায় সম্পূর্ণ র্ুকব হয়ে র প্ক্ষপ্রবণতান ছটনত থাকে। িনল A তিল থেকে ববাষ্প পরিণত হয়। সম্পূর্ণ তিল ় ত বাষ্প ো হওো পে্ তাপমানা মথি থাকে এবং তিল ও গ্যাসীে উভয় অবস্থা র দযমান থাকে। ় ্ ্ সু তিাং, তাপ প্নোর্গ কণাি গরতশক্তি বৃদ্ধি ও আন্ঃকণা আকর্ষণ র ্ শক্তি হ্ানসি িনল 45°C এ A কঠ ি ে থেকে তিনল এবং 95°C এ তিল ় ় ় থেকে গ্যাসীে অবস্থাে পরি রতিতড হয়।"}],"board":"রাজশাহী বোর্ড ২০২০"},{"id":"ch2-cq4","chapter":2,"num":4,"importance":2,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও:","subQuestions":[{"label":"ক","question":"উধ্ডপাতে কাকে বলে? [৩ বোর্ডে এনসনছ]","answer":"বে প্মে্ব যায় কোনো কঠ ি ে পদাথক তাপ রদনল তা তিনল ় ় পরিণত ো হয়ে সিাসরি ববাষ্প পরিণত হয় এবং ঐ বাষ্পনক ঠান্া করলে আ াি সিাসরি কঠ ি নে পরিণত হয়, তানক ঊধ্ডপাতে বলে।"},{"label":"খ","question":"প্র্ থস্প্ য হানভর সময় ব্যাপন এবং রেঃসির্ণি মধ্যে বকােটি আগে ঘনট?","answer":"প্র্ থস্প্ ব াতনলি বিতনি উচ্চ চার্প থাকে। থস্প্ করাি সময় প্রথমে সূ ছছদ্পর্থ সুগছন্ধ কণা উচ্চ চাপ থেকে রেম্ন চার্প ব ি হয়ে র র আনস; এটি নিঃসরণ। এরপি াইনি আসা সুগছন্ধ কণা াতানসি কণাি সাথে মর্র্শ চািরদনক ছপ্ড় নে পনড়; এটি ব্যাপন। সু তিাং প্র্ থস্প্ য হানভর সময় আগে নিঃসরণ, পরে ব্যাপন ঘনট।"},{"label":"গ","question":"উদ্দীপকের (i) ও (ii) েং পদার্থডি আন্ঃআণর ক আকর্ষণ শক্তি ব্যাখ্যা কি।","answer":"উদ্দীপকের (i) েং পদাথড সাধারণ লবণ (NaCl) এবং (ii) েং পদাথড ভর বা কঠ ি ে পানি (H O)। 2 NaCl একটি আয়নিক যৌগ। এর বকলানস Na+ ও Cl- আয়নগুনলা তী র মথি ত দুযরতক আকর্ষণ বলে খু দঢ় িান আ দধ থাকে। এ ্ ৃ আকর্ষণ িােনত অনেক বেশি তাপশক্তি লার্গ, তাই NaCl এর গলোঙ্ক অনেক বেশি (প্রায় 801°C)। ভর সমযোজী যৌগ H O এর অণু দিয়ে গঠ ি ত। এর অণুগুনলাি 2 ত ্ ় মধ্যে আন্ঃআণর ক আকর্ষণ শক্তি আয়নিক আকষডর্ণি তলযায় অনেক দু ডল। তাই অল্ তার্পই অর্থাৎ 0°C তাপর্াযায় ভর গনল পানি হয়। ﻿ সু তিাং, উদ্দীপকের (i) েং পদাথড NaCl এর কণাগুনলাি মধ্যে ্ ত ্ আকর্ষণ শক্তি (ii) েং পদাথড ভরের আন্ঃআণর ক আকর্ষণ শক্তভর বচনে অনেক বেশি।"},{"label":"ঘ","question":"উদ্দীপকের (i) ও (iii) েং পদার্থডি তাপ প্দানেি বলখচচে ভিন্ন– বিশ্লেষণ কি।","answer":"উদ্দীপকের (i) েং পদাথড সাধারণ লবণ (NaCl) এবং (iii) েং পদাথড কপূডি। NaCl এর লেখোচিতর: NaCl অেুদােী কঠ ি ে পদাথড। তাপ রদনল এটি ় ় প্রথমে কঠ ি ে থেকে তিনল এবং পরে তিল থেকে ববাষ্প পরিণত হয়। ্ ় তাই তাপমানা োর্ সময় বলখচচতরে— • AB অংশ: কঠ ি ে NaCl এর তাপমানা ানড়। ্ ় • BC অংশ (অেুিমর্ক): গলোনঙ্ক কঠ ি ে ও তিল একসাথে থাকে, তাপমানা মথি। ় ় • CD অংশ: তিল NaCl এর তাপমানা ানড়। • DE অংশ (অেুিমর্ক): স্ফটোনঙ্ক তিল ও বাষ্প একসাথে থাকে, তাপমানা মথি। • EF অংশ: ববাষ্পি তাপমানা ানড়। ূ ় ় অর্থাৎ NaCl এর বলখচচতরে দটি অেুিমর্ক বিখা পাওয়া যায়। কপূজরর লেখোচিতর: কপূডি ঊধ্ডপারতত পদাথড। তাপ রদনল এটি তিল ো ় ় হয়ে সিাসরি ববাষ্প পরিণত হয়। তাই বলখচচতরে— • AB অংশ: কঠ ি ে কপূভর তাপমানা ানড়। ূ ় • BC অংশ (অেুিমর্ক): ঊধ্ডপাতে তাপর্াযায় কঠ ি ে ও বাষ্প একসাথে থাকে, তাপমানা মথি। • CD অংশ: ববাষ্পি তাপমানা ানড়। ূ ় ় অর্থাৎ কপূভর বলখচচতরে মান একটি অেুিমর্ক বিখা পাওয়া যায়, কোনো তিল অবস্থা বেই। সু তিাং, NaCl গলে ও স্ফটে দুই ধার্প অবস্থা পরি তড ে করে আি ু ি কপূডি এক ধার্প ঊধ্ডপারতত হয় বলে (i) ও (iii) েং পদার্থডি তাপ প্দানেি বলখচচে ভিন্ন।"}],"board":"ময়মনসিংহ বোর্ড ২০২৫","diagramId":"ch2-cq4"},{"id":"ch2-cq5","chapter":2,"num":5,"importance":2,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: একটি পদাথের গেনাংক এবং সফটনাংক যোতরব্ জম 133°C ও 242°C, পদােটি র আণরবক ির 60।","subQuestions":[{"label":"ক","question":"র্ু কব নৈাড় ইলেকট্রন কাকে বলে?","answer":"সমযোজী অণুনত কোনো পরমাণুর স ড ছহঃথ শক্তিস্তরেি বে ্ ইলেকট্রন বৈাড় ন্ধে গঠনে অংশগ্রহণ করে ো, তানক র্ুকবনৈাড় র র ইলেকট্রন বলে। যেমন: NH অণুনত N পরমাণুর উপর একটি র 3 র্ু কব নৈাড় ইলেকট্রন থাকে। ী ়"},{"label":"খ","question":"বর্ৌর্াছছি কার্নড় ি ক্ষতথানে চে ব্যবহার করা হয় কেন?","answer":"বর্ৌর্াছছি হুনল এসিডধর্ী পদাথড (ভরমর্ক এসিড বা মর্থােরেক এসিড, HCOOH) থাকে। বর্ৌর্াছছ কার্ড় রদনল এই এসিড ক্ষতথানে প্রবেশ করে জ্ালা-েন্তণা সৃটটি করে। ব র ু ু চে [Ca(OH) ] একটি ক্ষার। ক্ষতথানে চে লাগানল তা এসিক 2 ি প্শমর্ত করে লবণ ও পানি উৎপন্ন করে, িনল জ্ালা-েন্তণা কনর্ ব র যায়। 2HCOOH+Ca(OH) →(HCOO) Ca+2H O টাইপ ভিততিক মাস্ট ার সাজেশন 2 2 2"},{"label":"গ","question":"উদ্দীপকে উপ্ল্মখত পদাথডটি ি তাপীে েব্ নিখা অঙ্কেসহ ণডো কি।","answer":"উদ্দীপকের পদাথডটি ি গলোঙ্ক 133°C ও স্ফটোঙ্ক 242°C। অর্থাৎ সাধারণ তাপর্াযায় পদাথডটি কঠ ি ে। ় ় িাপীয বতর্ব জরখ্া অঙ্কন: X অর্ক্ষ সময় ও Y অর্ক্ষ তাপমানা (°C) ় ত রেনে O থেকে B (133°C) পে্ ঊধ্ডর্ুখী ঢালু বিখা, B থেকে C ত ূ পে্ 133°C িা ি অেুিমর্ক বিখা, C থেকে D (242°C) পে্ ঊধ্ডর্ু খী ঢালু বিখা, D থেকে E পে্ 242°C িা ি অেুিমর্ক বিখা এবং E থেকে F পে্ ঊধ্ডর্ুখী ঢালু বিখা। অংশ িাপমাতরা ত ্ OB 133°C পে্ বৃদ্ধি BC 133°C এ মথি (গলোঙ্ক) কঠ ি ে + তিল CD 133°C থেকে 242°C DE 242°C এ মথি (স্ফটোঙ্ক) তিল + গ্যাস ি ু EF 242°C এর বেশি বণনা: OB িা ি তাপ থশাষণ করে কঠ ি ে পদার্থডি তাপমানা ানড়। 133°C এ পদাথডটি গলনত শুিু করে এবং সম্পূর্ণ কঠ ি ে তিনল ় ত পরিণত ো হওো পে্ তাপমানা মথি থাকে, কািণ প্দক তাপ অবস্থা ় ় পরি তড নে যে হে; তাই BC গলোঙ্ক বিখা। এরপি CD িা ি তিনলি তাপমানা ানড়। 242°C এ তিল িু টনত থাকে এবং সম্পূর্ণ ় ত ববাষ্প পরিণত ো হওো পে্ তাপমানা মথি থাকে; তাই DE স্ফটোঙ্ক বিখা। এরপি EF িা ি ববাষ্পি তাপমানা ানড়। সু তিাং, েব্ নিখাি অেুিমর্ক অংশ দুটি পদাথডটি ি গলোঙ্ক (133°C) ও স্ফটোঙ্ক (242°C) রেনদড শ করে।"},{"label":"ঘ","question":"পদাথডটি ি তাপীে ে্ব নিখাি প্থর্ এবং থশষ র নদুনত কণাসর্ূনহি র ড ্ ু র্ধযকাি গরতশক্তি ি তলোমূলক বিশ্লেষণ কি।","answer":"পদাথডটি ি তাপীে ে্ব নিখাি প্থর্ র নদু O, বেখানে পদাথডটি র ড কঠ ি ে অবস্থাে আনছ এবং থশষ র নদু F, বেখানে পদাথডটি 242°C এর ় ় ় বেশি তাপর্াযায় গ্যাসীে অবস্থাে আনছ। O রবনদ (কঠ ি ন): কঠ ি ে অবস্থাে কণাগুনলা খু কাছাকাছছ ও নির্দিষ্ট ্ ু ত ্ অবস্থানে থাকে। আন্ঃকণা আকর্ষণ শক্তি খু বেশি হওয়ায় কণাগুনলা থাে পরি তড ে কিনত পানি ো, কেবল রেৈ অবস্থানে ক াপনত থাকে। তাই এ র নদুনত কণাগুনলাি গরতশক্তি স নচনে কম। F রবনদ (গ্যাস): O থেকে F পে্ পদাথডটি েব্ র্াগত তাপ থশাষণ ্ ু করেনছ। তাপ থশাষর্ণ কণাগুনলাি গরতশক্তি াড় নত াড় নত 133°C এ পদাথড গনল তিল হয় এবং 242°C এ কণাগুনলা আকর্ষণ ল ছছন্ ় ় ় করে ববাষ্প পরিণত হয়। গ্যাসীে অবস্থাে কণাগুনলা পিস্পি থেকে ত ্ অনেক দনি থাকে, আন্ঃকণা আকর্ষণ শক্তি বেই লনলই চনল এবং ্ ু ু কণাগুনলা র্ুকব িান র প্ক্ষপ্রবণতান ছটাছটি করে। তাই এ র নদুনত ্ ় কণাগুনলাি গরতশক্তি স নচনে বেশি। রবষয প্েম রবনদ O (কঠ ি ন) র ্ ু ্ ় কণাি গরতশক্তি স নচনে কম ত ় আন্ঃকণা আকর্ষণ স নচনে বেশি শক্তি কণাি গরত শুধু রেৈ থানে কম্পে সু তিাং, তাপীে ে্ব নিখাি প্থর্ র নদু থেকে থশষ র নদুি রদনক র ড তাপমানা াড় াি সাথে সাথে কণাগুনলাি গরতশক্তি বৃদ্ধি পায়; প্থর্ র নদুনত গরতশক্তি স ডরেম্ন এবং থশষ র নদুনত সন ডাচ্চ। ড ড পািন এবং ঊধ্পািন"}],"board":"যশোর বোর্ড ২০২৪"},{"id":"ch2-cq6","chapter":2,"num":6,"importance":2,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: Ni, Δ C H +H ⟶ X(g) 2 2 2 Δ S + O ⟶Y(g) 2 ﻿ ু Δ N +H ⟶Z(g) 2 2 Z + HCl → M","subQuestions":[{"label":"ক","question":"ইলেকট্রন আসপ্কব কী?","answer":"গ্যাসীে অবস্থাে এক মোল র ক্সচ্ছন্ পরমাণুনত এক মোল ্ ় ় ় ় তিল ইলেকট্রন েুকব হয়ে এক মোল ঋণাতমক আয়নে পরিণত হওয়ার সময় ্ ় ্ বে শক্তি রেগডত হয়, তানক ইলেকট্রন আসপ্কব বলে। গ্যাস ( বাষ্প)"},{"label":"খ","question":"আগডে একটি রেরকব ে গ্যাস কেন? ব্যাখ্যা কি। র ্","answer":"আগেি (Ar, পারমাণবিক সংখ্যা 18) ইলেকট্রন বিন্যাস 1s2 2 6 2 6 2s 2p 3s 3p। ্ ত এর স ড ছহঃথ শক্তিস্তরে ৮টি ইলেকট্রন আনছ, অর্থাৎ অটট ক পূর্ণ ও ি বিভব মথরতশীল। ় ় িনল আগ তযাগ বা থশোি করাি প্ ণতা বদখাে ো। এর যোজনী শূেয। র র ় ় তাই রেরকব ে গ্যাস Ne অেয মৌলের সাথে রাসায়নিক ন্ধে গঠে করে র ্ র যৌগ ততরি করে ো।"},{"label":"গ","question":"উদ্দীপকের ‘A’ কক্ষপর্থ ঘূণডােমান ইলেকট্রনটভর গরতন গ ছহসা কি।","answer":"উদ্দীপকের চচেটি ব াি পরমাণু মডেল। চচতরে নিউক্লিয়াসেি ় ৃ ় চািরদনক রতেটি কক্ষপথ আনছ এবং A হলো রেউর্োস থেকে ততীে কক্ষপথ। সুতিাং A কক্ষপর্থি জন্য n = 3। nh ব াি র্ত াদ অনুসারে, ইনলক ট নেি বকৌরণক ভরন গ mvr = π। 2 ∴ v = nh 2πmr টাইপ ভিততিক মাস্ট ার সাজেশন এখানে, • কক্ষপর্থি েব্ মর্ক সংখ্যা, n = 3 • প্ াঙ্ক ধ্ু ক, h = 6.626 × 10−34m2kg/s −28 • ইনলক ট নেি ভর, m = 9.1 × 10 g = 9.1 ×10 −10 • কক্ষপর্থি ব্যাসার্ধ, r = 4.52 × 10 m • π = 3.1416 3 × 6.626 × 10−34 v = 2 × 3.1416 × 9.1 × 10−31 × 4.52 × 10−10 1. 9878 × 10−33 = m/s 2. 5844 × 10−39 =7.69 × 105m/s অতএ, উদ্দীপকের ‘A’ কক্ষপর্থ ঘূণডােমান ইলেকট্রনটভর গরতন গ 5 7.69 × 10 m/s।"},{"label":"ঘ","question":"“উদ্দীপকের পরমাণু মডেলটি পরমাণুর গঠে র ন্লষর্ণ আধুরেক ় ূ ্ িসােনে অরত গুিুতপূর্ণ িমর্কা পালে করে”—উপ্কবটভর েথাথডতা র োচাই কি।","answer":"উদ্দীপকের পরমাণু মডেলটি হলো েীলস ব াি প্তার ত ব াি পরমাণু মডেল (1913)। িাদািনিার্ড র্নর্নলি সীর্া দধতা দি করে এ মডেল পরমাণুর গঠে ব্যাখ্যা করে। এর র্ূল প্তা ো রেম্ন িূপ: ় ় ১. ইলেকট্রন নিউক্লিয়াসেি চািরদনক কনেকটি নির্দিষ্ট শক্তভর ৃকাকাি র ল ্ ত কক্ষপর্থ বঘানি। এ কক্ষপথগুনলানক শক্তিস্তর বা মথি কক্ষপথ বলে। মথি কক্ষপর্থ বঘািাি সময় ইলেকট্রন শক্তি থশাষণ বা ি র র রকিণ করে ো। ২. ইলেকট্রন কেবল বসস কক্ষপর্থই ঘুিনত পানি বেখানে তাি বকৌরণক ভরন গ h/2π এর পূর্ণ সংখ্যাি গুরণতক, অর্থাৎ mvr = nh π। 2 ্ ত ্ ত ৩. ইলেকট্রন উচ্চ শক্তি তি থেকে রেম্ন শক্তি তনি বেনর্ এনল দুই ত ্ ্ তনভর শক্তভর পাথকযি সমান শক্তি আনলাকিশ্মল (বিাটে) ছহনসন র রকিণ করে; আ াি শক্তি থশাষণ করে রেম্ন তি থেকে ত ় উচ্চ তনি যায়। উদ্দীপকের চচতরেও ইলেকট্রন A কক্ষপথ থেকে ় ্ রেনচি কক্ষপর্থ োর্াি সময় শক্তি র রকিণ বদখানো হয়েছে। ΔE = E2 - E1 = hν আধ্ু রনক রসাযজন গুরুত ় ় • িাদািনিার্ড মডেল অেুযায়ী ঘূণডােমান ইলেকট্রন েব্ র্াগত শক্তি ় ় ় হারিনে নিউক্লিয়াসে পরতত হওয়ার কথা; ব াি মডেল মথি ় ় কক্ষপর্থি ধািণা দিয়ে পরমাণুর থারেত ব্যাখ্যা করে। ি ব • এ মডেল হাইরোজেন পরমাণুর তিমখক ণডাললি সিল ব্যাখ্যা দেয়। ্ ত ় • শক্তি তি বা বকাোনট ার্ সংখ্যাি (n) ধািণা থেকেই শক্তিস্তরে 2 ইলেকট্রন বিন্যাস (2n রেের্), বোৈযতা ইলেকট্রন, পর্যায় সািরণনত মৌলের অবস্থাে এবং রাসায়নিক ন্ধে ব্যাখ্যা করা সম্ হয়েছে। • এ মডেল থেকে ইনলক ট নেি কক্ষপর্থি ব্যাসার্ধ, গরতন গ ও শক্তি ছহসা করা যায় (যেমন: গ অংর্শ A কক্ষপর্থ ইনলক ট নেি ব গ ় ় নির্ণয় করা হয়েছে)। ী ্ ত • এর পি তী উন্রতি মাধ্যমেই উপশক্তিস্তর ও অরবিটালমিপ্কে আধুরেক পরমাণু ততত গনড় উনঠনছ। তন ব াি মডেল একারধক ইলেকট্রনর মশটট পরমাণুর ণডালল ব্যাখ্যা কিনত পানি ো এবং এটি ইনলক ট জনক শুধু ৃকাকাি কক্ষপর্থ র ন চো করে। এ সীর্া দধতা সনততও পরমাণুর গঠে, শক্তিস্তর ও ্ ব ইলেকট্রন বিন্যাস ব াঝাি মিপ্ক এ মডেলই থাপে করেনছ। বিভব ﻿ সু তিাং, “উদ্দীপকের পরমাণু মডেলটি পরমাণুর গঠে র ন্লষর্ণ ় ূ ্ আধুরেক িসােনে অরত গুিুতপূর্ণ িমর্কা পালে করে”—উপ্কবটি েথাথড। −31 ন"}],"board":"ঢাকা বোর্ড ২০২৬","diagramId":"ch3-cq3"},{"id":"ch3-cq4","chapter":3,"num":4,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: kg র কপ্োপট-১: একটি পরমাণুর মজডে m/s র কপ্োপট-২: প্কৃ রিজি কপাজরর দটি আইজসাজটাপ আজে 63Cu র র ু এবং 65Cu। প্কৃ রিজি এজদর প্াপযিার শতকরা পরিমাণ র র র যোতরব্ জম 75% ও 25%। ্ ূ ড ়","subQuestions":[{"label":"ক","question":"বর্নন্ললনভর পর্যায় সূেটি বলখ।","answer":"বর্নন্ললনভর পর্যায় সূে: মৌলসর্ূনহি বিৌত ও রাসায়নিক ় ় ধর্মা লল তানদি পারমাণবিক ভর অনুসারে পর্যায়ে্বনর্ আ রতিড ত হয়।"},{"label":"খ","question":"Cu(29)-এর ইলেকট্রন বিন্যাস সাধারণ রেেনর্ি যরতেব্ র্— ব্যাখ্যা কি।","answer":"সাধারণ রেের্ (আউি াউ েীরত) অনুসারে Cu(29) এর ইলেকট্রন বিন্যাস হওয়ার কথা: 2 2 6 2 6 9 2 Cu(29) : 1s 2s 2p 3s 3p 3d 4s কিন্তু d অরবিটাল সম্পূর্ণ পূর্ণ (d10) হলে তা অরধক মথরতশীল হয়। তাই 4s অরবিটালেি একটি ইলেকট্রন 3d অরবিটালে চনল যায় এবং প্কৃ ত বিন্যাস হে: 2 2 6 2 6 10 1 Cu(29) : 1s 2s 2p 3s 3p 3d 4s এজন্য Cu এর ইলেকট্রন বিন্যাস সাধারণ রেেনর্ি যরতেব্ র্। ি"},{"label":"গ","question":"বপ্ক্ষাপট-২-এর মৌলটি ি আপেক্ষিক পারমাণবিক ভর নির্ণয় কি। [৩ বোর্ডে এনসনছ]","answer":"বপ্ক্ষাপট-২ এর মৌলটি কপাি (Cu)। এর দুটি আইসোটোপ: আইজসাজটাপ ির সংখ্যা প্াপযিা 63Cu 63 75% ্ ত 65Cu 65 25% র কোনো মৌলের আপেক্ষিক পারমাণবিক ভর = প্রতটি আইনসানটার্পি ্ ভ ভর × শতকরা প্াপযতাি যোগিল / 100 63×75+65×25 Cu এর আথপততেক পারমাণরবক ির = 100 4725 + 1625 র = 100 6350 = 100 = 63.5 সু তিাং বপ্ক্ষাপট-২ এর মৌলটি ি (Cu) আপেক্ষিক পারমাণবিক ভর 63.5। ্ ত ্ ়"},{"label":"ঘ","question":"বপ্ক্ষাপট-১-এর র্নর্নলি সীর্া দধতা ও সিলতা বিশ্লেষণ কি। র ্ ্","answer":"বপ্ক্ষাপট-১ এর র্নর্নল বকননড ্ ধোতমক চার্জ েুকব রেউর্োস র র ্ ত এবং তাি চািরদনক n = 1, n = 2 ইতযারদ নির্দিষ্ট শক্তি তনি ইলেকট্রন টাইপ ভিততিক মাস্ট ার সাজেশন ঘু িনছ, আি ইলেকট্রন এক কক্ষপথ থেকে অেয কক্ষপর্থ লাি দিয়ে শক্তি থশাষণ বা র রকিণ কিনছ। এটি ব াি পরমাণু মডেল। সফেিা ১. ব াি মডেল িাদািনিার্ড র্নর্নলি প্ধাে েুটি দি করে। ইলেকট্রন র ূ ্ ্ রেরদিটড ট শক্তি ি মথি কক্ষপর্থ ঘুিনল শক্তি র রকিণ করে ো, তাই ় ় ় নিউক্লিয়াসে পরতত হয় ো; এনত পরমাণুর থারেত ব্যাখ্যা করা ল ি ব যায়। ত ় ় ২. এ মডেল প্থর্ শক্তি তি বা কক্ষপর্থি বকাোনট ােে (n = 1, 2, 3 র ড ...) এর ধািণা দেয়। ্ ত ্ ত ৩. ইলেকট্রন উচ্চ শক্তি তি থেকে রেম্ন শক্তি তনি থগনল নির্দিষ্ট পরিমাণ শক্তি র রকিণ করে (ΔE = E2 - E1 = hν), ো দিয়ে হাইন বানৈনেি বিখা ণডালল সিলিান ব্যাখ্যা করা যায়। ৪. এ র্নর্নলি মাধ্যমে হাইরোজেন পরমাণুর র ভিন্ন কক্ষপর্থি ব্যাসার্ধ ও শক্তি ছহসা করা যায়। সীমাববধিা ১. ব াি মডেল কেবল এক ইলেকট্রনর মশটট পরমাণু বা আয়নেি (H, + 2+ He, Li ) ণডালল ব্যাখ্যা কিনত পানি; একারধক ইলেকট্রনর মশটট পরমাণুর ণডালল ব্যাখ্যা কিনত পানি ো। ২. শক্তি শালী বিশ্লেষণ েতরন্ত হাইরোজেন ণডাললি প্রতটি বিখা ্ র র ্ ় ় ্ ় কনেকটি সূ বিখাে বিভবকব বদখা যায়; ব াি মডেল এর কািণ ব্যাখ্যা কিনত পানি ো। ৩. বচৌম্ব ক থক্ষে ও তপ্ড় ৎ থক্ষতরেি প্রবণতান ণডালল বিখাি বিভবাৈে (রৈর্যাে ও স ট াকড প্রবণতা ) এ মডেল দ্বারা ব্যাখ্যা করা যায় ো। ৪. এ র্নর্নল ইনলক ট জনক নির্দিষ্ট ৃকাকাি পর্থ নির্দিষ্ট অবস্থানে ধিা ় ় হয়েছে, ো হাইনৈে ার্গডি অরে্চেতা েীরত ও ইনলক ট নেি তিঙ্গধনর্ডি সাথে সার্ঞ্জসযপূর্ণ েে। ় ্ ড ্ ্ ৫. অণুনত পরমাণুগুনলা কীিান রাসায়নিক বন্ধনে েুকব হয় তা এ মডেল ব্যাখ্যা কিনত পানি ো। সু তিাং ব াি মডেল পরমাণুর থারেত ও হাইরোজেনের ণডালল ি ব ব্যাখ্যাে সিল হলেও হু-ইলেকট্রনর মশটট পরমাণুর থক্ষতরে এর সীর্া দধতা িনেনছ।"}],"board":"র্াদ্াসা বোর্ড ২০২৬","diagramId":"ch3-cq4"},{"id":"ch3-cq5","chapter":3,"num":5,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: −34 2 [এখ্াজন, h = 6.626 × 10 m kg/s]","subQuestions":[{"label":"ক","question":"ওোমশং বসার্া কাকে বলে?","answer":"সোডিয়াম কার্বনেনটি দশ অণু পানিেুকব বকলাসনক ওোমশং বসার্া বলে। এর সংনকত Na CO · 10H O। 2 3 2 ় ়"},{"label":"খ","question":"Rb বক ক্ষার ধাত লা হয় কেন? [২ বোর্ডে এনসনছ] ্ ত","answer":"িুর প্র্োর্ (Rb) পর্যায় সািরণি গ্রুপ-1 এর মৌল। এর ইলেকট্রন র র ্ ত র েযানস স ড ছহঃথ শক্তিস্তরে মান 1টি ইলেকট্রন (5s1) থাকে, ো ি র + ় ় সহজে তযাগ করে Rb আয়ন গঠে করে। তাই এটি অতযন্ সমে্বে ধাত। ় ় Rb পানির সাথে তী রিান বিক্রিয়া করে তী র ক্ষাবিভবুর প্র্োর্ ্ ্ হাই ব িাইর্ (RbOH) উৎপন্ন করে। 2Rb+2H O→2RbOH+H 2 2 গ্রুপ-1 এর বেস ধাত পানির সাথে বিক্রিয়া করে ক্ষার ততরি করে, ু তানদি ক্ষার ধাত বলে। তাই Rb বক ক্ষার ধাত লা হয়।"},{"label":"গ","question":"'B' র্নর্নলি সর্বশেষ শক্তি তনি ইনলক ট নেি বকৌরণক ভরন গ নির্ণয় কি। [৫ বোর্ডে এনসনছ]","answer":"উদ্দীপকের B র্নর্নল নিউক্লিয়াসেি চািরদনক n = 1 ও n = 2 ্ ত দু টি ৃ কাকাি কক্ষপথ আনছ। সুতিাং এর সর্বশেষ শক্তিস্তর হলো ্ ় ্ ত ছদতীে প্ধাে শক্তি তি, অর্থাৎ n = 2। ব াি পরমাণু মডেল অনুসারে, কক্ষপর্থ আ তড েশীল ইনলক ট নেি nh বকৌরণক ভরন গ, mvr = π 2 −34 2 কদওযা আজে: n = 2; h = 6.626×10 m kg/s; π = 3.1416 nh ককৌরণক িরজবগ, mvr = π 2 2 × 6.626 × 10−34 = 2 × 3.1416 =2.11 × 10−34m2kg/s ্ ত সু তিাং, B র্নর্নলি সর্বশেষ শক্তি তনি ইনলক ট নেি বকৌরণক ভরন গ −34 2 2.11 × 10 m kg/s।"},{"label":"ঘ","question":"'A' ও 'B' র্নর্নলি বকােটি অরধক উপনোগী? বিশ্লেষণ কি। [২ বোর্ডে এনসনছ] ﻿","answer":"উদ্দীপকের A মডেলটি রাদারজফাজডর পরমাণু মজডে এবং B ় মডেলটি কবাজরর পরমাণু মজডে। এদের মধ্যে B মডেল (ব াি মডেল) অরধক উপনোগী। িাদািনিার্ড মডেল অনুসারে, পরমাণুর বকননড ্ ধোতমক চার্জ েুকব রেউর্োস থাকে এবং ইলেকট্রনগুনলা বসৌিৈগনতি গ্নহি র্নতা র র ় ু ্ রেউর্োসনক বকনড ্ করে বঘানি। কিন্তু এ র্নর্নলি রকছ সীর্া দধতা র ্ আনছ: • ইনলক ট নেি কক্ষপর্থি আকার ও আকৃ রত সম্পনকড কোনো ধািণা ় ় দেওয়া হেরে। ় ় ্ • র্যািওনেনলি ততত অনুসারে ঘূণডােমান চারৈিতড কণা েব্ র্াগত শক্তি র রকিণ কিন, িনল ইলেকট্রন ঘুিনত ঘুিনত একসময় ় ় নিউক্লিয়াসে পরতত হন। অর্থাৎ এ মডেল পরমাণুর থারেত ব্যাখ্যা ল ি ব কিনত পানি ো। • একারধক ইলেকট্রনর মশটট পরমাণুনত ইলেকট্রনগুনলা কীিান র র ত ় র েযত থাকে, তা লা হেরে। • পরমাণুর বিখা ণডালল ব্যাখ্যা করা যায় ো। ব াি মডেল এস সীর্া দধতা দি করে: ্ ূ ় ্ • ইলেকট্রন নিউক্লিয়াসেি চািরদনক নির্দিষ্ট শক্তিসম্পন্ কতকগুনলা র ল ় ় ় থােী ৃকাকাি কক্ষপর্থ বঘানি; থােী কক্ষপর্থ বঘািাি সময় ি ি ্ ় ইলেকট্রন শক্তি থশাষণ বা র রকিণ করে ো। িনল পরমাণুর থারেত বিভব ব ব্যাখ্যা করা যায়। • ইলেকট্রন কেবল বসস কক্ষপর্থ বঘানি বেখানে এর বকৌরণক nh ভরন গ mvr = π। এর মাধ্যমে কক্ষপর্থি আকার নির্দিষ্ট হয়। 2 টাইপ ভিততিক মাস্ট ার সাজেশন • ইলেকট্রন এক কক্ষপথ থেকে অেয কক্ষপর্থ থাোন্রিত হলে নির্দিষ্ট বিভব পরিমাণ শক্তি থশাষণ বা র রকিণ করে (ΔE = E2 - E1 = hν)। এর সাহানেয হাইরোজেনের বিখা ণডালল ব্যাখ্যা করা যায়। সু তিাং, িাদািনিার্ড র্নর্নলি সীর্া দধতাগুনলা দি করাে পরমাণুর ্ ূ গঠে ব্যাখ্যাে B মডেল (ব াি মডেল) অরধক উপনোগী।"}],"board":"দিনাজপুর বোর্ড ২০২৪","diagramId":"ch3-cq5"},{"id":"ch3-cq6","chapter":3,"num":6,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও:","subQuestions":[{"label":"ক","question":"পাতে কাকে বলে? [৩ বোর্ডে এনসনছ]","answer":"বে প্মে্ব যায় কোনো তিলনক তাপ দিয়ে ববাষ্প পরিণত করা হয় এবং বসই বাষ্পনক শীতল করে পুেিাে তিনল পরিণত করা হয়, তানক পাতে বলে।"},{"label":"খ","question":"রেশাদল একটি ঊধ্ডপারতত পদাথড- ব্যাখ্যা কি। [৪ বোর্ডে এনসনছ]","answer":"বে সকল কঠ ি ে পদাথক তাপ রদনল তিনল পরিণত ো হয়ে সিাসরি ববাষ্প পরিণত হয় এবং বাষ্পনক শীতল করলে আ াি সিাসরি কঠ ি নে পরিণত হয়, তানদিনক ঊধ্ডপারতত পদাথড বলে। রেশাদল (NH Cl) বক তাপ রদনল এটি গনল তিল হয় ো, িং 4 ় ় সিাসরি ববাষ্প পরিণত হয় ( বাষ্প অবস্থাে NH ও HCl এ র নোরৈত ি 3 ় ড হে)। এ বাষ্প ঠান্া অংর্শি সংস্পর্শড এনল আ াি সিাসরি কঠ ি ে রেশাদনল পরিণত হয়। তাপ NH4Cl(s) ⟶ NH (g)+HCl(g) 3 শীতলীকিণ NH3(g)+HCl(g) ⟶ NH4Cl(s) তাই রেশাদল একটি ঊধ্ডপারতত পদাথড।"},{"label":"গ","question":"দশযপট-১ এর 'A' ইলেকট্রনটভর গরতন গ নির্ণয় কি। [৩ বোর্ডে এনসনছ]","answer":"উদ্দীপকের দশযপট-১ এ 'A' ইলেকট্রনটি n = 4 েং কক্ষপর্থ ঘু িনছ। ব াি র্ত াদ অনুসারে, মথি কক্ষপর্থ আ তড েিত ইনলক ট নেি বকৌরণক ভরন গ, nh nh mvr = π ⇒ v = 2 2π×m×r এখানে, ্ ত • প্ধাে শক্তি তি, n = 4 • কক্ষপর্থি ব্যাসার্ধ, r = 8.5 × 10−10m • ইনলক ট নেি ভর, m = 9.11×10−31kg • প্ াংক ধ্ু ক, h = 6.626 × 10−34m2kgs−1 ﻿ • গরতন গ, v =? −34 v = 4 × 6.626 × 10 ় −31 −10 2 × 3.1416 × 9.11 × 10 ×8.5×10 −33 =2.6504 × 10 −39 4. 8655 × 10 =5.45 × 105ms−1 5 −1 অতএ, 'A' ইলেকট্রনটভর গরতন গ 5.45 × 10 m s।"},{"label":"ঘ","question":"উদ্দীপকের দশযপট-২ পদাথডটি ি শীতলীকিণ ে্বনিখা বকমে হন? চচেসহ ব্যাখ্যা কি। [২ বোর্ডে এনসনছ]","answer":"উদ্দীপকের দশযপট-২ এর বলখচচতরে -20°C তাপর্াযায় কঠ ি ে অবস্থা থেকে শুিু করে 0°C এ গলে এবং 100°C এ স্ফটে হয়েছে। ি ু অর্থাৎ পদাথডটি পানি ( ভর) এবং বলখচচেটি এর তাপীে বা উকপ্কিণ ে্বনিখা। অংশ িাপমাতরা অবস্থা MN -20°C থেকে 0°C কঠ ি ে ( ভর) NO 0°C (গলোঙ্ক) কঠ ি ে + তিল OP 0°C থেকে 100°C তিল (পানি) ় ় PQ 100°C (স্ফটোঙ্ক) তিল + াে ীে ় ় ় QR 100°C থেকে 140°C াে ীে (জলীয় বাষ্প) এখে 140°C তাপমানাি জলীয় বাষ্পনক ধীনি ধীনি শীতল করলে উনল ট বা েব্ নর্ পরি তড ে ঘটন : ১. R থেকে Q: জলীয় ববাষ্পি তাপমানা 140°C থেকে কনর্ 100°C ় ় ় হন। পদাথডটি াে ীে অবস্থাে থাকন। ় ূ ় ২. Q থেকে P: 100°C তাপর্াযায় বাষ্প ঘেীিত হয়ে পানিনত ় ় পরিণত হনত থাকন। এ সময় সুপ্তাপ রেগডত হয়, তাই সম্পূর্ণ ় ত ূ বাষ্প পানি ো হওো পে্ তাপমানা মথি থাকন (অেুিমর্ক বিখা)। ৩. P থেকে O: পানির তাপমানা 100°C থেকে কনর্ 0°C হন। পদাথডটি তিল অবস্থাে থাকন। ৪. O থেকে N: 0°C তাপর্াযায় পানি ৈনর্ িনি পরিণত হনত ় ত থাকন। সম্পূর্ণ পানি ভর ো হওো পে্ তাপমানা মথি থাকন (অেুিমর্ক বিখা)। ৫. N থেকে M: ভরের তাপমানা 0°C থেকে কনর্ -20°C হন। অর্থাৎ, তাপমানা োর্ সময় বলখচচতরে শীতলীকিণ েব্ নিখাটি হন R→Q→P→O→N→M। বিখাটি 140°C থেকে রেম্ন র্ুখী হয়ে 100°C এ একটি অেুিমর্ক অংশ (QP) এবং 0°C এ আনিকটি অেুিমর্ক অংশ (ON) ততরি করে -20°C এ থশষ হন। সু তিাং, উদ্দীপকের পদাথডটি ি শীতলীকিণ েব্ নিখা তাি উকপ্কিণ ে্ব নিখাি ঠ ি ক র পিীত (দপডণ প্রতর নম্ব ি র্নতা) হন।"}],"board":"কুমিল্লা বোর্ড ২০২২; যশোর বোর্ড ২০২২","diagramId":"ch3-cq6"},{"id":"ch3-cq7","chapter":3,"num":7,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও:","subQuestions":[{"label":"ক","question":"গাঠরেক সংনকত কাকে বলে? [২ বোর্ডে এনসনছ]","answer":"কোনো যৌগের অণুনত র দযমান পরমাণুগুনলা কীিান ্ ্ পিস্পনভর সাথে ববন্ধনের মাধ্যমে েুকব থাকে, তা বে সংনকনতি ় ় সাহানেয বিখা (-) দিয়ে বদখানো হয়, তানক গাঠরেক সংনকত বলে। যেমন: অ্যামোনিয়াি গাঠরেক সংনকনত N পরমাণু রতেটি একে ্ ববন্ধনের মাধ্যমে রতেটি H পরমাণুর সাথে েুকব থাকে। ় ়"},{"label":"খ","question":"Mg বক র্ৃৎক্ষার ধাত লা হয় কেন? [২ বোর্ডে এনসনছ] ্ ত ়","answer":"র্যাগনেমসোর্ (Mg) পর্যায় সািরণি গ্রুপ-2 এর মৌল। এর ্ ত স ড ছহঃথ শক্তিস্তরে 2টি ইলেকট্রন (3s2) থাকে, ো তযাগ করে Mg ি র আয়ন গঠে করে। Mg এর অক্সাইড ও হাই বিাইর্ ক্ষারীে প্কৃ রতি। আ াি এ মৌলটি ূ প্কৃ রতনত মাটি বা িতনক র ভিন্ন যৌগ (যেমন: র্নলার্াইট MgCO · র ব CaCO, র্যাগনেসাইট MgCO ) ছহনসন পাওয়া যায়। 3 3 2Mg+O →2MgO 2 MgO+H O→Mg(OH) 2 ় ় ী মাটি নত পাওয়া যায় এবং ক্ষারধর্মী যৌগ গঠে করে বলে গ্রুপ-2 এর মৌল Mg বক র্ৃৎক্ষার ধাত লা হয়।"},{"label":"গ","question":"B র্নর্নলি সর্বশেষ শক্তিস্তরে ঘূণডােমান ইনলক ট নেি বকৌরণক −34 2 ভরন গ নির্ণয় কি। [h = 6.626×10 m kg/s] [৪ বোর্ডে এনসনছ] টাইপ ভিততিক মাস্ট ার সাজেশন","answer":"উদ্দীপকের B র্নর্নল নিউক্লিয়াসেি চািরদনক রতেটি ৃকাকাি কক্ষপথ আনছ। সুতিাং এর সর্বশেষ শক্তিস্তর হলো ততীে প্ধাে ্ ত শক্তি তি, অর্থাৎ n = 3। ব াি পরমাণু মডেল অনুসারে, কক্ষপর্থ ঘূণডােমান ইনলক ট নেি nh বকৌরণক ভরন গ, mvr = π 2 কদওযা আজে: n = 3; h = 6.626×10 ককৌরণক িরজবগ, mvr = 3 × 6.626 × 10−34 = 2 × 3.1416 =3.16 × 10−34m2kg/s ্ ত সু তিাং, B র্নর্নলি সর্বশেষ শক্তি তনি ঘূণডােমান ইনলক ট নেি −34 2 বকৌরণক ভরন গ 3.16 × 10 m kg/s।"},{"label":"ঘ","question":"পরমাণুর গঠে ব্যাখ্যাে উদ্দীপকের বকাে মডেলটি অরধক উপনোগী? বিশ্লেষণ কি। [২ বোর্ডে এনসনছ]","answer":"উদ্দীপকের A মডেলটি রাদারজফাজডর পরমাণু মজডে এবং B মডেলটি কবাজরর পরমাণু মজডে। পরমাণুর গঠে ব্যাখ্যাে B মডেল (ব াি মডেল) অরধক উপনোগী। িাদািনিার্ড আলিা কণা র চ্ছিণ পিীক্ষার মাধ্যমে প্থর্ পরমাণুর নিউক্লিয়াসেি ধািণা দেয়। ত াি র্নত, পরমাণুর বকননড ্ ধোতমক চার্জ েু কব িািী রেউর্োস থাকে এবং ইলেকট্রনগুনলা বসৌিৈগনতি গ্নহি র্নতা রেউর্োসনক বকনড ্ করে বঘানি। তন এ র্নর্নলি র র সীর্া দধতা হলো: • ইনলক ট নেি কক্ষপর্থি আকার ও আকৃ রত সম্পনকড কোনো ধািণা ় ় দেওয়া হেরে। ় ্ • ঘূ ণড ােমান ইলেকট্রন েব্ র্াগত শক্তি র রকিণ করে নিউক্লিয়াসে পরতত হওয়ার কথা; অর্থাৎ এ মডেল পরমাণুর থারেত ব্যাখ্যা কিনত পানি ো। • একারধক ইলেকট্রনর মশটট পরমাণুনত ইনলক ট নেি বিন্যাস এবং ইনলক ট নেি এক কক্ষপথ থেকে অেয কক্ষপর্থ থাোন্ি সম্পনকড রকছ লা হেরে। • পরমাণুর বিখা ণডাললি কোনো ব্যাখ্যা বেই। ব াি র্নর্নল এস সীর্া দধতা দি করা হয়েছে: ্ ূ ﻿ ় ্ • ইলেকট্রন নিউক্লিয়াসেি চািরদনক নির্দিষ্ট শক্তিসম্পন্ কতকগুনলা র ল ় ্ ত ় থােী ৃকাকাি কক্ষপর্থ (শক্তিস্তরে) বঘানি এবং থােী কক্ষপর্থ ি ি থাকাকানল শক্তি থশাষণ বা র রকিণ করে ো। িনল পরমাণু মথরতশীল থাকে। nh • কক্ষপর্থ ইনলক ট নেি বকৌরণক ভরন গ mvr = π, ো কক্ষপর্থি 2 আকার রেধডািণ করে। ্ ত ্ ত ্ • ইলেকট্রন রেম্ন শক্তি তি থেকে উচ্চ শক্তি তনি থগনল নির্দিষ্ট শক্তি ্ ত ্ থশাষণ করে এবং উচ্চ থেকে রেম্ন শক্তিস্তরে এনল নির্দিষ্ট শক্তি র র রকিণ করে (ΔE = hν)। এর মাধ্যমে বিখা ণডালল ব্যাখ্যা করা 2+ যায়। সু তিাং, িাদািনিার্ড র্নর্নলি তলযায় ব াি মডেল পরমাণুর গঠে ও থারেত অরধকতি সঠ ি করান ব্যাখ্যা করে। তাই পরমাণুর গঠে ি ব 3 ় ব্যাখ্যাে B মডেলটি অরধক উপনোগী। ় ় ্ ত পরমাণুর শততিব স্জর ইজেক ট ন বিন্যাস"}],"board":"রাজশাহী বোর্ড ২০২৩","diagramId":"ch3-cq7"},{"id":"ch3-cq8","chapter":3,"num":8,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: 2 র 'A' ও 'B' মৌলের পারমাণরবক সংখ্যা যোতরব্ জম 20 ও 47। কযখ্াজন A ও B প্কৃ ি প্িীক নজহ। র র ্ ত ৃ ় র","subQuestions":[{"label":"ক","question":"সর্াণু কাকে বলে? [৩ বোর্ডে এনসনছ]","answer":"সমাণু : বে সকল অণুি আণর ক সংনকত একই কিন্তু গাঠরেক সংনকত ভিন্ন এবং িনল ধর্মও ভিন্ন, তানদি পিস্পিনক সর্াণু বলে। যেমন: n- র র উনটে ও আইনসা-র উনটে (C H )। 4 10"},{"label":"খ","question":"সালিাি ট াই অিাইনর্ি মোলাি আেতে ব্যাখ্যা কি। র","answer":"প্রমাণ তাপমানা ও চার্প (STP) বজনকানে  ঘটনলও ‘A’ মৌলের ইলেকট্রন বিন্যাস সাধারণ রেেনর্ ঘনট— ব্যাখ্যা কি। [২ বোর্ডে এনসনছ]","answer":"উদ্দীপকের A মৌলের পারমাণবিক সংখ্যা 8, অর্থাৎ A হলো অক্সিজেন (O)। C মৌলের পারমাণবিক সংখ্যা 29, অর্থাৎ C হলো কপাি (Cu)। C (Cu) এর ইলেকট্রন বিন্যাস আউি াউ েীরত অনুসারে (অরবিটালেি শক্তিে্বর্ 1s \u003c 2s \u003c 2p \u003c 3s \u003c 3p \u003c 4s \u003c 3d) Cu এর ইলেকট্রন বিন্যাস হওয়ার কথা: 2 2 6 2 6 9 2 Cu (29) : 1s 2s 2p 3s 3p 3d 4s কিন্তু াতন Cu এর ইলেকট্রন বিন্যাস: 2 2 6 2 6 10 1 Cu (29) : 1s 2s 2p 3s 3p 3d 4s কািণ, d অরবিটাল সম্পূর্ণ পূর্ণ (d10) বা অধডপূর্ণ (d5) থাকনল তা ় ্ অরধক মথরতশীল হয়। 3d ও 4s অরবিটালেি শক্তভর পাথডকয খু কম ় ় ত হওয়ায় 4s অরবিটালেি একটি ইলেকট্রন 3d অরবিটালে থাোন্রিত বিভব হয়ে 3d অরবিটাল পূর্ণ (3d10) করে এবং পরমাণুটি অরধক মথরতশীলতা লাি করে। তাই C মৌলের ইলেকট্রন র েযানস সাধারণ ি র রেেনর্ি যরতেব্ র্ ঘনট। A (O) এর ইলেকট্রন বিন্যাস 2 2 4 O (8) : 1s 2s 2p অক্সিজেনের ইলেকট্রনগুনলা আউি াউ েীরত অনুসারে শক্তভর রেম্ন েব্ র্ অেুযায়ী 1s, 2s ও 2p অরবিটালে প্রবেশ করে। এর ইলেকট্রন র েযানস কোনো d অরবিটাল ৈপ্ড় ত বেই এবং কাছাকাছছ ্ ত শক্তি ি কোনো অরবিটালে ইলেকট্রন থাোন্নভর মাধ্যমে অরধক বিভব মথরতশীলতা লানভর সুনোগও বেই। অর্থাৎ অধডপূর্ণ বা পূর্ণ d অরবিটাল গঠনেি সুনোগ ো থাকাে A মৌলের ইলেকট্রন বিন্যাস সাধারণ রেেনর্ই ঘনট। সু তিাং, C (Cu) মৌলের ইলেকট্রন র েযানস সাধারণ রেেনর্ি যরতেব্ র্ ঘটনলও A (O) মৌলের ইলেকট্রন বিন্যাস সাধারণ রেেনর্ ঘনট— উপ্কব টি েথাথড।"}],"board":"রাজশাহী বোর্ড ২০২৬"},{"id":"ch3-cq10","chapter":3,"num":10,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: [রব: দ্: D প্িীকী অথে; ককাজনা প্িীক নয] র র র েশন","subQuestions":[{"label":"ক","question":"পাতে কাকে বলে? [৩ বোর্ডে এনসনছ]","answer":"বে প্মে্ব যায় কোনো তিলনক তাপ দিয়ে ববাষ্প পরিণত করা হয় এবং বসই বাষ্পনক শীতল করে পুেিাে তিনল পরিণত করা হয়, তানক পাতে বলে।"},{"label":"খ","question":"CO (g) এবং CH (g) এর মধ্যে কাি ব্যাপন হার বেশি? 2 4","answer":"CO (g) এর তলযায় CH (g) এর ব্যাপন হার বেশি। 2 4 গ্যাসের ব্যাপন হার তাি আণর ক ভরের গডর্ূনলি যতােুপারতক (r ∝ 1/√M)। CO এর আণর ক ভর = 12+ য় সািরণি গ্রুপ 2 এর মৌলগুনলানক র্ৃৎক্ষার ধাত লা হয়, কািণ এদের অক্সাইডসর্ূহ মাটি নত (ি-তনক) পাওয়া যায় এবং এদের অক্সাইড ও হাইন বািাইর্ ক্ষারধর্মী। ব রিললোনর্ি (Be = 4) ইলেকট্রন বিন্যাস 1s 2s। এর সর্বশেষ ্ ত ় ় শক্তি তনি 2টি ইলেকট্রন থাকাে এটি পর্যায় সািরণি গ্রুপ 2 এ অ মথত। এটি অেযােয র্ৃৎক্ষার ধাতি র্নতা 2টি ইলেকট্রন তযাগ করে 2+ ় ় Be আয়ন গঠে করে। তাই ব রিললোর্নক র্ৃৎক্ষার ধাত লা হয়।"},{"label":"গ","question":"পর্যায় সািরণনত 'B' মৌলের অবস্থাে কীিান নির্ণয় কিন? ণডো কি। [৬ বোর্ডে এনসনছ]","answer":"উদ্দীপকের B মৌলের পারমাণবিক সংখ্যা 30; এটি রৈংক (Zn)। ইলেকট্রন র েযানসি মাধ্যমে পর্যায় সািরণনত এর অবস্থাে নির্ণয় করা যায়। 2 2 6 2 6 Zn (30): 1s 2s 2p 3s 3p 3d ় ় ক ক পর্যায় রনণয ্ ত ইলেকট্রন র েযানস সন ডাচ্চ প্ধাে শক্তিস্তর হলো 4 (4s)। মৌলের ্ ত সর্বশেষ শক্তি তনভর েব্ মর্ক সংখ্যাই তাি পর্যায় রেনদড শ করে। তাই B মৌলটি চতথড পর্যায়ের মৌল। রক রনণয ইলেকট্রন বিন্যাস অেুযায়ী Zn এর সর্বশেষ ইলেকট্রনটি 3d অরবিটালে প্রবেশ করে (4s এর পরে 3d পূর্ণ হে)। তাই B একটি d- রক মৌল। গ্রুপ রনণয d- রক মৌলের থক্ষতরে, গ্রুপ েম্ব ি = (n-1)d অরবিটালেি ইলেকট্রন সংখ্যা + ns অরবিটালেি ইলেকট্রন সংখ্যা। B মৌলের গ্রুপ নম্ব র = 3d এর ইলেকট্রন + 4s এর ইলেকট্রন = 10 + 2 = 12 ় ু অতএ, B (Zn) মৌলটি পর্যায় সািরণি চতথড পর্যায়ের গ্রুপ 12 এ অ মথত একটি d- রক মৌল। ি ল ﻿"},{"label":"ঘ","question":"উপশক্তিস্তরেি মাধ্যমে বদখাও বে, 'A' মৌলের ছহঃতনভর 2 সন ডাচ্চ ইলেকট্রন ধািণ ক্ষমতা 2n এর সমান।","answer":"উদ্দীপকের A মৌলের পারমাণবিক সংখ্যা 19; এটি পটামসোর্ (K)। 2 2 6 2 6 1 K (19): 1s 2s 2p 3s 3p 4s ত ু ্ত সু তিাং A মৌলের ছহঃতি হলো চতথড শক্তি তি, অর্থাৎ n = 4। ্ ত ্ ত কোনো প্ধাে শক্তি তনি উপশক্তিস্তরেি সংখ্যা n টি এবং উপশক্তিস্তরগুনলাি মান l = 0, 1, 2, ..., (n-1)। প্রতটি উপশক্তিস্তরেি সন ডাচ্চ ইলেকট্রন ধািণ ক্ষমতা 2(2l + 1)। ু ্ত ্ত n = 4 হলে l = 0, 1, 2, 3, অর্থাৎ চতথড শক্তিস্তরে চািটি উপশক্তি তি B আনছ: 4s, 4p, 4d ও 4f। 30 ্ ত ক উপশততিব স্র l এর মান অরবিটাল সংখ্যা সজবাচ্ি ইজেক ট ন (2l + 1) 2(2l + 1) 4s 0 1 2 4p 1 3 6 4d 2 5 10 4f 3 7 14 ্ ় ু ত কত উপশততিব স্র অনু যাযী ভরে স্জরর কমাট ইলেকট্রন ধ্ারণ েমিা = 2 + 6 + 10 + 14 = 32 2 আ াি, 2n সূে অেুযায়ী, 2 2 সজবাচ্ি ইলেকট্রন ধ্ারণ েমিা = 2n = 2 × 4 = 2 × 16 = 32 ় ় ় ্ত উভয় থক্ষতরেই মান 32 পাওয়া যায়। অতএ, উপশক্তিস্তরেি মাধ্যমে বদখা থগল বে A (K) মৌলের ছহঃতনভর (n = 4) সন ডাচ্চ ইলেকট্রন 2 ় ধািণ ক্ষমতা 2n এর সমান। ় ়"}],"board":"বরিশাল বোর্ড ২০২৬"},{"id":"ch4-cq2","chapter":4,"num":2,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: 2 2 B একটি মৌল। যার একটি পরমাণুবিভবর 1.992 × 10−23 g [B প্িলেি প্িীক নয]। B কমৌজে সম সংখ্যক কপ্াটন ও রনউট ন র র র রজযজে।","subQuestions":[{"label":"ক","question":"ইলেকট্রন বিন্যাস কাকে বলে? 4","answer":"্ত ্ ত ইলেকট্রন বিন্যাস: পরমাণুর র ভিন্ন শক্তিস্তর ও উপশক্তিস্তরেি অরবিটালসর্ূনহ নির্দিষ্ট রেের্ অনুসারে ইলেকট্রনগুনলাি সিানক র ইলেকট্রন বিন্যাস বলে। ্ ত"},{"label":"খ","question":"d হনত পানি ো কেন? ব্যাখ্যা কি। ্ ় ়","answer":"d উপশক্তিস্তরে 5টি অরবিটাল থাকে, তাই এনত সন ডাচ্চ 10টি ইলেকট্রন থাকনত পানি। অধডপূর্ণ (d5) ও পূর্ণ (d10) d অরবিটাল অরধক মথরতশীল। d4 বিন্যাসটি অধডপূর্ণ অবস্থা থেকে মান একটি ি ি র ় ় ইলেকট্রন কম হওয়ায় অমথরতশীল। বিভব তাই াইনভর s অরবিটাল থেকে একটি ইলেকট্রন d অরবিটালে ত ় থাোন্রিত হয়ে অরধক মথরতশীল d5 বিন্যাস ততরি করে। যেমন: Cr ি ি 4 2 ় ় (24) এর বিন্যাস 3d 4s ো হয়ে হয় ় 2 2 6 2 6 5 1 র Cr (24) : 1s 2s 2p 3s 3p 3d 4s এ কারণে ইলেকট্রন র েযানস d4 হনত পানি ো। টাইপ ভিততিক মাস্ট ার সাজেশন"},{"label":"গ","question":"উদ্দীপকের B মৌলটি শোকব করে পর্যায় সািরণনত অবস্থাে নির্ণয় কি। [২ বোর্ডে এনসনছ] 10 2 4s ু","answer":"উদ্দীপকের B মৌলের একটি পরমাণুর ভর 1.992 × 10−23 g। B এর পারমাণরবক ির = একটি পরমাণুবিভবর × অযাজিাথগজ বা সংখ্যা =1.992 × 10−23 × 6.02 × 1023 = 11.99 ≈ 12 B বর্ৌনল প্রোটন ও রেউ ট ে সংখ্যা সমান। সুতিাং, 12 কপ্াটন সংখ্যা = রনউট ন সংখ্যা = =6 2 অতএ B এর পারমাণবিক সংখ্যা 6, অর্থাৎ B মৌলটি কার্বন (C)। 2 2 2 C (6) : 1s 2s 2p ় ় ্ ত পর্যায় নির্ণয়: C এর ইলেকট্রন র েযানস সন ডাচ্চ প্ধাে শক্তিস্তর n = 2, ় ় তাই কার্বন ২ে পর্যায়ের মৌল। 2 2 ় ্ ত গ্রুপ নির্ণয়: C এর সর্বশেষ শক্তিস্তরে ইলেকট্রন বিন্যাস 2s 2p, র র ্ ত অর্থাৎ এটি p- কর মৌল এবং সর্বশেষ শক্তি তনি মোট ইলেকট্রন 4টি। ল র ্ ত p- রক মৌলের গ্রুপ েম্ব ি = 10 + সর্বশেষ শক্তি তনভর ইলেকট্রন র র সংখ্যা = 10+4 = 14। ় ় ় সু তিাং B মৌলটি (কার্বন) পর্যায় সািরণি ২ে পর্যায়ের ১৪ েং গ্রুপে অ মথত।"},{"label":"ঘ","question":"B মৌলটি ধাত এবং অধাত উিনেি সাথে যৌগ গঠে কিনত পানি — কথাটি বিশ্লেষণ কি।","answer":"'গ' অংশ হনত পাই, B মৌলটি কার্বন (C)। কার্বনেি বোৈযতা তনি 4টি ইলেকট্রন িনেনছ। 2 2 2 C (6) : 1s 2s 2p অটট ক পূির্ণি জন্য কার্বন 4টি ইলেকট্রন গ্রহণ বা ৈড ে উভয়ই কিনত পানি ো সহজে, তাই সাধারণত ইলেকট্রন থশোি করে। তন ় ় অরত সমে্ব ে ধাতি সাথে বিক্রিয়াে এটি ইলেকট্রন গ্রহণ করে ঋণাতমক র র আয়ন ছহনসন ও যৌগ গঠে কিনত পানি। অধ্াির সাথে যৌগ গেন কার্বন অধাত H, O, Cl ইতযারদি সাথে ইলেকট্রন থশোনভর মাধ্যমে সমযোজী যৌগ গঠে করে। যেমন: Ni, 500°C C+2H ⟶ CH 2 4 C+O →CO 2 2 CH অণুনত C এর 4টি বোৈযতা ইলেকট্রন চািটি H পরমাণুর সাথে 4 র চািটি ইলেকট্রন বৈাড় থশোি করে এবং CO অণুনত C দুটি O র 2 ় ্ ্ পরমাণুর সাথে দুটি করে ইলেকট্রন বৈাড় থশোি করে ছদ ন্ধে (O=C=O) গঠে করে। ধ্াির সাথে যৌগ গেন ় ৃ ় উচ্চ তাপর্াযায় কার্বন Ca, Al প্িরত সমে্ব ে ধাতি সাথে বিক্রিয়া করে কা ডাইর্ যৌগ গঠে করে। এর্ক্ষতরে ধাত ইলেকট্রন তযাগ করে এবং কার্বন তা গ্রহণ করে। 2000°C CaO+3C ⟶ CaC +CO 2 4Al+3C→Al C 4 3 2+ 2− 3+ 4− CaC যৌগে Ca ও C আয়ন এবং Al C যৌগে Al ও C 2 2 4 3 আয়ন র দযমান। ু ু সু তিাং, B মৌল অর্থাৎ কার্বন ধাত (Ca, Al) এবং অধাত (H, O) উিনেি সাথেই যৌগ গঠে কিনত পানি। তাই উপ্কবটি েথাথড।"}],"board":"দিনাজপুর বোর্ড ২০২৬"},{"id":"ch4-cq3","chapter":4,"num":3,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: মৌল কপ্াটন সংখ্যা টাইপ ভিততিক মাস্ট ার সাজেশন ﻿ ় A 12 B 20 C 29 [A, B ও C প্কৃ ি প্িীক নজহ] র র","subQuestions":[{"label":"ক","question":"সট েরকওমর্রত কাকে বলে? ত ূ","answer":"় ় ় ় ় সট ্যরকওভমরি: রাসায়নিক বিক্রিয়াে অংশগ্রহণকািী র মে্বেক ও ় উৎপন্ন উৎপাদসর্ূনহি মোল সংখ্যাি অেুপাতনক সট েরকওমর্রত বলে।"},{"label":"খ","question":"পরমাণুর সর্ত ভর নিউক্লিয়াসে বকনড ্ীিত— ব্যাখ্যা কি।","answer":"পরমাণু র্ূ লত রতেটি কণা দিয়ে গঠ ি ত: প্রোটন, রেউ ট ে ও ইলেকট্রন। প্রোটন ও রেউ ট ে নিউক্লিয়াসে থাকে এবং ইলেকট্রন র র ল র ্ ত নিউক্লিয়াসেি াইনি র ভিন্ন শক্তিস্তরে বঘানি। −24 −24 বপ্াটনেি ভর 1.673 × 10 g ও রেউ ট নেি ভর 1.675 × 10 −28 g, কিন্তু ইনলক ট নেি ভর মান 9.11 × 10 g, ো বপ্াটনেি ভরের প্রায় 1/1840 িাগ। ় ় ় ় ইনলক ট নেি ভর েগণয হওয়ায় পরমাণুর প্রায় সর্ত ভর নিউক্লিয়াসে র ল থাকা প্রোটন ও রেউ ট নেি ভরের সর্টিট। তাই পরমাণুর সর্ত ভর ় ূ নিউক্লিয়াসে বকনড ্ীিত।"},{"label":"গ","question":"ইলেকট্রন র েযানসি সাহানেয পর্যায় সািরণনত 'C' মৌলের অবস্থাে বিভব নির্ণয় কি। [১৪ বোর্ডে এনসনছ]","answer":"উদ্দীপকের 'C' মৌলের প্রোটন সংখ্যা তথা পারমাণবিক সংখ্যা 29। সুতিাং মৌলটি কপাি (Cu)। যরতেব্ র্ী ইলেকট্রন বিন্যাস অনুসারে: 2 2 6 2 6 10 1 Cu (29) : 1s 2s 2p 3s 3p 3d 4s 9 2 ় ় ় (3d অরবিটাল সম্পূর্ণ পূর্ণ অবস্থাে অরধক সুমথত হওয়ায় 3d 4s ো ি ি 10 1 ় ় হয়ে 3d 4s হয়।) ় ় ্ ত • পর্যায় নির্ণয়: ইলেকট্রন র েযানস সন ডাচ্চ প্ধাে শক্তিস্তর n = 4। সু তিাং মৌলটি চতথড পর্যায়ে অ মথত। ় ় • গ্রুপ নির্ণয়: সর্বশেষ ইলেকট্রন d অরবিটালে প্রবেশ করাে এটি d- র র রক মৌল। d- কর মৌলের গ্রুপ েম্ব ি = (n-1)d ও ns অরবিটালেি ল ল মোট ইলেকট্রন সংখ্যা। গ্রুপ নম্ব র = 10 + 1 = 11 ় অতএ, পর্যায় সািরণনত 'C' (Cu) মৌলের অবস্থাে চতথড পর্যায়ের গ্রুপ-11 এ; এটি একটি অবস্থান্ি মৌল।"},{"label":"ঘ","question":"'A' ও 'B' একই ধর্ম ও বিক্রিয়া প্দশডে করে—পিীক্ষার সাহানেয প্রমাণ কি।","answer":"উদ্দীপকের 'A' এর প্রোটন সংখ্যা 12, অর্থাৎ A = র্যাগনেমসোর্ (Mg); 'B' এর প্রোটন সংখ্যা 20, অর্থাৎ B = ক্যালসিয়াম (Ca)। 2 2 6 2 Mg (12) : 1s 2s 2p 3s 2 2 6 2 6 2 Ca (20) : 1s 2s 2p 3s 3p 4s ় ্ ত ় উভয় মৌলের সর্বশেষ শক্তিস্তরে 2টি করে ইলেকট্রন (ns2) থাকাে ় উভয়ই গ্রুপ-2 এর মৌল তথা র্ৃৎক্ষার ধাত। উভয়ই 2টি ইলেকট্রন র র 2+ ় ় তযাগ করে M আয়ন গঠে করে, তাই এদের রাসায়নিক ধর্ম একই িকম। রেনচি পিীক্ষাগুনলাি মাধ্যমে তা প্রমাণ করা যায়: পরীো ১: েঘু HCl এর সাথে রবভতর্ব যা দু টি বটস ট টি উন লঘু HCl রেনে একটি নত Mg ও অপিটি নত Ca এর ় টকরা যোগ করি। উভয় বটস ট টিউন ুদ ুদসহ গ্যাস রেগডত হয়। গ্যাসের র্ুর্খ জ্লন্ কাঠ ি ধিনল 'পপ' শে করে জ্নল ওনঠ, অর্থাৎ ় ় উভয় থক্ষতরে H গ্যাস উৎপন্ন হয়। 2 Mg+2HCl→MgCl +H 2 Ca+2HCl→CaCl +H 2 পরীো ২: অক্সিজেজন দহন ও উৎপন্ন অিাইজডর ধ্ম Mg মিতা ও Ca বক াতানস থপাড় ানল উভয়ই উল মশখাে জ্নল ় সাদা বর্ণি ক্ষারীে অক্সাইড উৎপন্ন করে: 2Mg+O →2MgO 2 2Ca+O →2CaO 2 ্ ় উৎপন্ন অক্সাইডদজনক পানিনত মর্প্শ্ত করে লাল ললটর্াস কাগৈ ় র্ ানল উভয় থক্ষতরে লাল ললটর্াস েীল হয়, অর্থাৎ উভয়ই ক্ষারীে হাই ব িাইর্ গঠে করে: MgO+H O→Mg(OH) 2 CaO+H O→Ca(OH) 2 পরীো ৩: পারনর সাথে রবভতর্ব যা Ca ঠান্া পানির সাথে এবং Mg গির্ পানি বা জলীয় ববাষ্পি সাথে র মে্ ব ো করে হাই ব িাইর্/অক্সাইড ও H গ্যাস উৎপন্ন করে: ্ 2 Ca+2H O→Ca(OH) +H 2 2 Mg+H O(g)→MgO+H 2 উপনভর পিীক্ষাসর্ূনহ বদখা যায় 'A' (Mg) ও 'B' (Ca) একই ধিনেি র মে্ ব ো করে একই ধিনেি যৌগ (MCl2, MO, M(OH)2) উৎপন্ন করে। সুতিাং 'A' ও 'B' একই ধর্ম ও বিক্রিয়া প্দশডে করে।"}],"board":"ময়মনসিংহ বোর্ড ২০২৬"},{"id":"ch4-cq4","chapter":4,"num":4,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: 23A, 24B, 29C [A, B, C প্িলেি প্িীক নয] র র","subQuestions":[{"label":"ক","question":"মোল কাকে বলে?","answer":"কোনো পদার্থডি বে পরিমাণ ভরনক গ্ানর্ প্কাশ করলে তা ঐ পদার্থডি আণর ক ভর বা পারমাণবিক ভরের সমান হয়, তানক ঐ পদার্থডি এক মোল বলে। এক মোল পদার্থড 6.023 × 10 টি কণা থাকে।"},{"label":"খ","question":"M/2 Na CO দ্রবণ লনত কী ব াঝাে? 2 3 র","answer":"M/2 Na CO দ্রবণ লনত 0.5 মোলাি Na CO দ্রবণ ব াঝাে। 2 3 র অর্থাৎ 1 ললটাি (1000 mL) দ্রবণে 0.5 মোল Na CO দ্ ীিত আনছ। Na CO এর আণরবক ির = 2 × 23 + 12 + 3 × 16 = 106 2 3 তাই 1 ললটাি দ্রবণে 106 × 0.5 = 53 g Na CO দ্ ীিত থাকে। র 2"},{"label":"গ","question":"পর্যায় সািরণনত A মৌলের অবস্থাে ইলেকট্রন র েযানসি সাহানেয নির্ণয় কি। [১৪ বোর্ডে এনসনছ]","answer":"উদ্দীপকের A এর পারমাণবিক সংখ্যা 23, তাই A হজো িযানাততডযাম (V)। 2 2 6 2 6 V(23) → 1s 2s 2p 3s 3p 3d 4s ় ় পর্যায়: ইলেকট্রন র েযানস স নচনে াইনভর প্ধাে শক্তিস্তর 4, তাই A ৪থড পর্যায়ের মৌল। ় ্ত গ্রুপ: স নচনে াইনভর শক্তিস্তরে s অরবিটাল এবং তাি আগেি ্ ত ় শক্তি তনি d অরবিটাল আনছ। তাই রেের্ অেুযায়ী s ও d অরবিটালেি ইলেকট্রন যোগ কিনত হন। ﻿ গ্রুপ = 4s এর ইলেকট্রন + 3d এর ইলেকট্রন = 2+3 = 5 ব র র র ় ় ক ক সু তিাং, A মৌলটি পর্যায় সািরণি ৪ে পযাজযর গ্রুপ-5 এ অ মথত। বিভব"},{"label":"ঘ","question":"B ও C মৌল দুইটভর ইলেকট্রন বিন্যাস সাধারণ রেেনর্ি যরতেব্ র্- বিশ্লেষণ কি। [৩ বোর্ডে এনসনছ]","answer":"উদ্দীপকের B এর পারমাণবিক সংখ্যা 24, তাই B হজো 2 2 ় বতর্ ব াভমযাম (Cr); C এর পারমাণবিক সংখ্যা 29, তাই C হজো কপার (Cu)। ব ় সাধারণ রেেনর্ (আউি াউ েীরত) ইলেকট্রন রেম্ন শক্তভর অরবিটাল ় ্ থেকে ে্ব র্ান্নে উচ্চ শক্তি ি অরবিটালে প্রবেশ করে: 1s \u003c 2s \u003c 2p \u003c 3s \u003c 3p \u003c 4s \u003c 3d। ় ় B (Cr): সাধারণ রেেনর্ হওয়ার কথা— 2 2 6 2 6 4 2 Cr(24) → 1s 2s 2p 3s 3p 3d 4s ় ় কিন্তু প্কৃ ত বিন্যাস— 2 2 6 2 6 5 1 Cr(24) → 1s 2s 2p 3s 3p 3d 4s 2 অধডপূর্ণ d অরবিটাল (d5) বেশি মথরতশীল। তাই 4s এর 1টি ইলেকট্রন ি র 2 5 1 3d বত চনল রগনে 3d 4s বিন্যাস গঠে করে। ় ় ় C (Cu): সাধারণ রেেনর্ হওয়ার কথা— 2 2 6 2 6 9 2 Cu(29) → 1s 2s 2p 3s 3p 3d 4s কিন্তু প্কৃ ত বিন্যাস— 2 র 2 2 2 6 2 6 10 1 Cu(29) → 1s 2s 2p 3s 3p 3d 4s পূ ণড d অরবিটাল (d10) বেশি মথরতশীল। তাই 4s এর 1টি ইলেকট্রন ি র 10 1 3d বত রগনে 3d 4s বিন্যাস গঠে করে। অর্থাৎ অরধক মথরতশীলতা লানভর জন্য B ও C উভয় মৌলের ইলেকট্রন বিন্যাস সাধারণ রেেনর্ি যরতেব্ র্। ইজেক ট ন বিন্যাসই পর্যায় সারণির মূে ভিততি"}],"board":"সিলেট বোর্ড ২০২৩"},{"id":"ch4-cq5","chapter":4,"num":5,"importance":2,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: 9A, 17B, 35C [এখ্াজন, A, B ও C প্িীকী অথে, প্িলেি ককাজনা মৌলের র র প্িীক নয।] ় র","subQuestions":[{"label":"ক","question":"কযাটােে কাকে বলে? [৪ বোর্ডে এনসনছ]","answer":"বে আয়ন ধোতমক চার্জ েুকব, অর্থাৎ পরমাণু এক বা একারধক ় ় ইলেকট্রন তযাগ করে বে আয়ন গঠে করে, তানক কযাটােে বলে। + 2+ যেমন- Na, Mg। ় ়"},{"label":"খ","question":"Mg এর পারমাণবিক সংখ্যা 12 লনত কী ুঝ?","answer":"Mg এর পারমাণবিক সংখ্যা 12 লনত ব াঝাে র্যাগনেমসোর্ 3 র পরমাণুর নিউক্লিয়াসে 12টি প্রোটন আনছ। পরমাণু রেির্পক্ষ বলে এর নিউক্লিয়াসেি াইনি 12টি ইলেকট্রনও ল র 2 2 6 2 আনছ। ইলেকট্রন বিন্যাস: 1s 2s 2p 3s। 3 2 র পারমাণবিক সংখ্যাই মৌলটভর পরিচে রেনদড শ করে; 12টি প্রোটনর মশটট বজনকানো পরমাণুই র্যাগনেমসোর্।"},{"label":"গ","question":"উদ্দীপকের মৌল রতেটি ি পারমাণবিক আকানভর পরি তড ে ় ব্ প 1 ও 2 এবং মান রকটি গ্রুপ 14 থেকে 18 রেনদড শ করে। Ar ততীে পর্যায়ের গ্রুপ 18 এ অ মথত। ্ ় ় Q ছদতীে পর্যায়ের গ্রুপ 14 এ অ মথত, তাই Q হলো কার্বন (C), 2 পারমাণবিক সংখ্যা 6, ইলেকট্রন বিন্যাস 1s 2s 2p। ্ ় ় R ছদতীে পর্যায়ের গ্রুপ 17 এ অ মথত, তাই R হলো বফ্ারিে (F), 2 পারমাণবিক সংখ্যা 9, ইলেকট্রন বিন্যাস 1s 2s 2p। ় ্ ় ় Q ও R উভয়ই ছদতীে পর্যায়ের মৌল, অর্থাৎ উিনেি ইলেকট্রন দুটি ্ ত ত ় শক্তি তনি র েযত। একই পর্যায়ে ার্ থেকে র্ানে থগনল েতে শক্তিস্তর ্ ় ্ ত ্ েু কব ো হয়ে একই শক্তি তনি ইলেকট্রন েুকব হয়, কিন্তু প্রোটন সংখ্যা (C এ 6, F এ 9) াড় নত থাকে। িনল রেউর্োস কতড ক স ড ছহঃথ ইনলক ট নেি উপর আকর্ষণ ল বৃদ্ধি পায় এবং ইলেকট্রন ি র বর্ঘ সংকু চচত হয়ে পারমাণবিক ব্যাসার্ধ হ্াস পায়। বেনহত পর্যায় সািরণনত Q (C) এর অবস্থাে R (F) এর ার্ রদনক এবং Q এর রেউর্োি চার্জ কম, তাই Q এর পারমাণবিক ব্যাসার্ধ R অপেক্ষা বেশি।"},{"label":"ঘ","question":"উদ্দীপকের M ও R এর উভয়ই উচ্চর্াযায় সমে্বে হলেও ় সমে্ব েতাি কািণ ভিন্ন—বিশ্লেষণ কি।","answer":"উদ্দীপকের M চতথড পর্যায়ের গ্রুপ 1 এ অ মথত, তাই M হলো 2 পটামসোর্ (K), োি ইলেকট্রন বিন্যাস 1s 2s 2p 3s 3p 4s। ﻿ 2 (গ) অংশ থেকে পাই, R হলো বফ্ারিে (F), োি ইলেকট্রন বিন্যাস 1s ল র 2 5 2s 2p। M (K) এর সভতর্ব যিার কারণ K এর স ড ছহঃথ তনি মান 1টি ইলেকট্রন আনছ এবং এবিভব র ় ৃ পারমাণবিক ব্যাসার্ধ অনেক ড়। িনল রেউর্োস কতড ক এই ় ্ ইনলক ট নেি উপর আকর্ষণ খু ই কম এবং K এর আয়নিকিণ শক্তি ত ় অতযন্ কম। তাই K খু সহজে ইলেকট্রন তযাগ করে রেরকবে গ্যাস Ar র র ্ এর বিন্যাস অর্জন ে করে, অর্থাৎ ইলেকট্রন তযার্গি প্ ণতাি কারণে K ত ় অতযন্ সমে্ব ে (তী র র জারক)। + − K→K +e 2K+2H O→2KOH+H 2 2 R (F) এর সভতর্ব যিার কারণ F এর স ড ছহঃথ তনি 7টি ইলেকট্রন আনছ, অটটক পূর্ণ কিনত মান ি র 1টি ইলেকট্রন প্নোৈে। F এর আকার খু বছাট এবং এর তপ্ড় ৎ ্ ত ঋণাতমকতা (4.0) ও ইলেকট্রন আসপ্কব অতযন্ বেশি। তাই F খু সহজে একটি ইলেকট্রন গ্রহণ করে রেরকবে গ্যাস Ne এর বিন্যাস র র ্ অর্জন ে করে, অর্থাৎ ইলেকট্রন গ্হর্ণি প্ ণতাি কারণে F অতযন্ র র ় ় সমে্ব ে (তী র জারক)। − − F+e →F 2K+F →2KF 2 অতএ, M (K) ইলেকট্রন তযার্গি প্ ণতাি কারণে এবং R (F) ় র ় ় ় ত ইলেকট্রন গ্হর্ণি প্ ণতাি কারণে উচ্চর্ায wer":"ততীে পর্যায়ের বে মৌলের বোৈযতা ইলেকট্রন 2, তাি ইলেকট্রন র র 2 2 6 2 বিন্যাস 1s 2s 2p 3s; অর্থাৎ B হলো র্যাগনেমসোর্ (Mg)। B এর 5টি পরমাণু বিভবর = 1.99 × 10−22g 1.99×10−22 B এর 1টি পরমাণু বিভবর = g = 3. 98 × 10−23g 5 আর্িা ৈারে, একটি C-12 পরমাণুর ভর = 1.99 × 10−23g 1.99×10−23 C-12 পরমাণুবিভবজরর 1/12 অংশ = g = 1. 66 × 12 10−24g আথপততেক পারমাণরবক ির = (একটি B পরমাণুবিভবর)/(C-12 পরমাণুবিভবজরর 1/12 অংশ) 3. 98 × 10−23g = 1. 66 × 10−24g = 23.98 ≈ 24 অতএ, B মৌলের (Mg) আপেক্ষিক পারমাণবিক ভর 24 (প্রায়)। ৃ ় ়"},{"label":"ঘ","question":"উদ্দীপকের A, B ও C এর আয়নিকিণ শক্তভর েব্ র্ বিশ্লেষণ কি। [৫ বোর্ডে এনসনছ]","answer":"উদ্দীপকের মৌলগুনলা ততীে পর্যায়ের এবং বোৈযতা ইলেকট্রন ় ় েথােব্ নর্ 1, 2 ও 4 হওয়ায়— মৌল ইজেক ট ন বিন্যাস প্কৃ ি মৌল গ্রুপ র র 2 2 6 ় A 1s 2s 2p সোডিয়াম (Na) 1 3s1 2 2 6 ় B 1s 2s 2p র্যাগনেমসোর্ (Mg) 2 3s2 C 2 2 6 মসললকে (Si) 14 1s 2s 2p 2 2 3s 3p ় ় গ্যাসীে অবস্থাে কোনো মৌলের এক মোল পরমাণু থেকে এক মোল ইলেকট্রন অপসািণ করে এক মোল একে ধোতমক আয়নে পরিণত ্ ় ় ় ্ কিনত বে শক্তি প্নোৈে হয়, তানক আয়নিকিণ শক্তি বলে। ় ় একই পর্যায়ে ার্ থেকে র্ানে থগনল প্রোটন সংখ্যা তথা নিউক্লিয়াসেি ্ ত ্ ় ধোতমক চার্জ ানড়, কিন্তু ইলেকট্রন একই শক্তিস্তরে েুকব হয়। িনল ় ৃ ত রেউর্োস কতড ক সর্বশেষ তনভর ইনলক ট নেি উপর আকর্ষণ ানড় ল র ় ্ এবং পরমাণুর আকার বছাট হয়। তাই ইলেকট্রন সিানত বেশি শক্তি ় ্ লার্গ, অর্থাৎ আয়নিকিণ শক্তি ানড়। 1 • A (Na): প্রোটন সংখ্যা 11, আকার স নচনে ড়; 3s ইলেকট্রনটি + ় ় ় ্ স নচনে সহজে তযাগ করে Na হয়। তাই আয়নিকিণ শক্তি স নচনে কম। 2 • B (Mg): প্রোটন সংখ্যা 12, আকার Na অপেক্ষা বছাট এবং 3s ় ্ অরবিটাল পূর্ণ (মথরতশীল)। তাই আয়নিকিণ শক্তি Na অপেক্ষা বেশি। ় ় • C (Si): প্রোটন সংখ্যা 14, আকার স নচনে বছাট; নিউক্লিয়াসেি র ল ় ় ্ ় আকর্ষণ স নচনে বেশি। তাই আয়নিকিণ শক্তি স নচনে বেশি। ় + − Na(g) → Na (g)+e িততিক মাস্ট ার সাজেশন + − Mg(g) → Mg (g)+e + − Si(g) → Si (g)+e ় ্ সু তিাং আয়নিকিণ শক্তভর েব্ র্: A \u003c B \u003c C, অর্থাৎ Na \u003c Mg \u003c Si।"}],"board":"কুমিল্লা বোর্ড ২০২৬"},{"id":"ch4-cq10","chapter":4,"num":10,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: ্ ় ক ক রনজ্ািব সাররণটি আধ্ু রনক পর্যায় সারণির একটি অংশ রনজদশ কজর : 1 2 14 17 কররণ→ / ক ় পর্যায়↓ 2 D X 3 A B Y A, B, D, X ও Y প্িলেি অে বহন কজর না।","subQuestions":[{"label":"ক","question":"আইসোটোপ কী?","answer":"বেস পরমাণুর প্রোটন সংখ্যা সমান কিন্তু ভরসংখ্যা ভিন্ন (অর্থাৎ রেউ ট ে সংখ্যা ভিন্ন), তানদিনক পিস্পনভর আইসোটোপ বলে। যেমন: 1 2 3 হাইরোজেনের আইসোটোপ H, H ও H।"},{"label":"খ","question":"CaCl2 একটি উচ্চ গলোঙ্কর মশটট যৌগ— ব্যাখ্যা কি।","answer":"CaCl একটি আয়নিক যৌগ। Ca পরমাণু দুটি ইলেকট্রন তযাগ 2 র 2+ করে Ca এবং দুটি Cl পরমাণু একটি করে ইলেকট্রন গ্রহণ করে Cl র র ় ় আয়নে পরিণত হয়। 2+ − Ca +2Cl →CaCl2 2+ − ় ় কঠ ি ে অবস্থাে CaCl এর বকলানস অসংখয Ca ও Cl আয়ন ি 2 ্ ্ শক্তি শালী মথি ত দুযরতক আকর্ষণ ল দ্বারা মের্ামেকরান দঢ় িান ্ ু ্ ় আ দধ থাকে। এ আকর্ষণ ল িােনত প্চি তাপশক্তভর প্নোৈে হয়। ্ র র তাই CaCl এর গলোঙ্ক উচ্চ (প্রায় 772°C)। 2 র ় ় ়"},{"label":"গ","question":"উপেুকব চচতরেি সাহানেয উদ্দীপকের DY যৌগে পরমাণুসর্ূনহি 4 ় ন্ধে গঠে প্মে্ব ো ব্যাখ্যা কি। ় ় ্","answer":"উদ্দীপকের সািরণ অেুযায়ী D মৌলটি ২ে পর্যায়ের গ্রুপ-14 এ অ মথত। সুতিাং D হলো কার্বন (C), পারমাণবিক সংখ্যা 6। আ াি Y ় ় মৌলটি ৩ে পর্যায়ের গ্রুপ-17 এ অ মথত। সুতিাং Y হলো ক্লোরিন ি ল (Cl), পারমাণবিক সংখ্যা 17। অতএ DY যৌগটি হলো কার্বন 4 বট ট ান্ািাইর্ (CCl )। র ল 4 2 2 2 C (6) : 1s 2s 2p (যোজ্যতা ইলেকট্রন 4টি ) 2 2 6 2 5 Cl (17) : 1s 2s 2p 3s 3p (যোজ্যতা ইলেকট্রন 7টি ) C পরমাণুর অটট ক পূির্ণ আিও 4টি ইলেকট্রন এবং প্রতটি Cl পরমাণুর অটটক পূির্ণ 1টি ইলেকট্রন প্নোৈে। তাই C পরমাণু তাি 4টি বোৈযতা ইনলক ট নেি প্রতটি 4টি Cl পরমাণুর প্নতযনকি 1টি র র করে ইনলক ট নেি সাথে থশোি করে 4টি ইলেকট্রন েুগল ততরি করে। র র ় িনল 4টি C-Cl একে সমযোজী ন্ধে গঠ ি ত হয়। চিতর (ডট-তরব্ স চিতরতরর বণনা; × = C এর ইলেকট্রন, • = Cl এর ইলেকট্রন) • বকনড ্ীে C পরমাণুর চািরদনক (উপরে, রেনচ, র্ানে ও ানর্) চািটি Cl পরমাণু থাকে। • প্রতটি C-Cl ববন্ধনের থানে একটি করে ×• ইলেকট্রন েুগল আ কনত বিভব র ় ় হয় (মোট 4টি থশোিকৃ ত েুগল)। টাইপ ভিততি ﻿ • প্রতটি Cl পরমাণুর চািপার্শ আিও 3 বৈাড় বা (6টি ) • ইলেকট্রন ় অ ন্ধেী েুগল ছহনসন বদখানত হয়। C (××××) + 4 Cl (•••••••) → CCl (িারটি ×• ক্ষশযারকৃ ি যু গে) 4 গাঠরেক সংনকত: বকনড ্ীে C পরমাণুর সাথে চািটি Cl পরমাণু চািটি ্ ্ ূ ় C-Cl একে ন্ধে দ্বারা েুকব, ো ঘেীিত িূর্প বলখা যায়: Cl-C(Cl) -Cl 2 ত ় ন্ধে গঠনেি পি C পরমাণুর স ড ছহঃথ তনি 8টি ইলেকট্রন (রেেনেি ি র র্নতা) এবং প্রতটি Cl পরমাণুর স ড ছহঃথ তনি 8টি ইলেকট্রন ি র ় ় (আগেি র্নতা) হয়। এরান ইলেকট্রন থশোনভর মাধ্যমে প্রতটি পরমাণু অটট ক পূর্ণ করে মথরতশীল CCl অণু গঠে করে। অতএ DY ি 4 4 একটি সমযোজী যৌগ। ় ়"},{"label":"ঘ","question":"“পর্যায় সািরণনত আয়নীকিণ শক্তি ও পারমাণবিক ব্যাসার্ধ র পিীতেব্ নর্ পরি রতিতড হে”—উদ্দীপকের A, B এবং Y মৌলের আনলানক বিশ্লেষণ কি।","answer":"উদ্দীপকের সািরণ অেুযায়ী A, B ও Y রতেটি মৌলই ৩ে ় ় ় পর্যায়ের। A গ্রুপ-1 এ থাকাে এটি সোডিয়াম (Na, 11), B গ্রুপ-2 এ র র ় ় ় থাকাে এটি র্যাগনেমসোর্ (Mg, 12) এবং Y গ্রুপ-17 এ থাকাে এটি ক্লোরিন (Cl, 17)। 2 2 6 1 Na (11) : 1s 2s 2p 3s 2 2 6 2 Mg (12) : 1s 2s 2p 3s 2 2 6 2 5 Cl (17) : 1s 2s 2p 3s 3p পারমাণরবক বযাসাধ্ ় ্ ত একই পর্যায়ে ার্ থেকে র্ানে থগনল শক্তিস্তরেি সংখ্যা একই থাকে (এখানে রতেটি ), কিন্তু প্রোটন সংখ্যা তথা নিউক্লিয়াসেি ধোতমক চার্জ ্ ় ত ় ৃ ছদধ পায়। িনল স ড ছহঃথ তনভর ইনলক ট নেি প্রত নিউক্লিয়াসেি ্ বিভব র ল আকর্ষণ ানড় এবং ইলেকট্রন বর্ঘ সংকু চচত হয়। তাই পারমাণবিক ব্যাসার্ধ কনর্। − পারমাণরবক বযাসাধ্ : A (Na) \u003e B (Mg) \u003e Y (Cl) ় ্ আযনীকরণ শততিব ় ় গ্যাসীে অবস্থাে কোনো মৌলের এক মোল র ক্সচ্ছন্ পরমাণু থেকে এক মোল ইলেকট্রন অপসািণ করে এক মোল একে ধোতমক আয়নে ় ় ্ ় ্ পরিণত কিনত প্নোৈেীে শক্তিনক আয়নীকিণ শক্তি বলে। পরমাণুর আকার েত বছাট হয়, স ড ছহঃথ ইনলক ট নেি উপবিভব র ় ় নিউক্লিয়াসেি আকর্ষণ তত বেশি হয় এবং ইলেকট্রন অপসাির্ণ তত ল র বেশি শক্তি লার্গ। ় ্ আযনীকরণ শততিব : A (Na) \u003c B (Mg) \u003c Y (Cl) ক ় ্ মৌল পারমাণরবক বযাসাধ্ ১ম আযনীকরণ শততিব (pm) (kJ/mol) A (Na) 186 496 B (Mg) 160 738 Y (Cl) 99 1251 বদখা োনচ্ছ, A থেকে Y এর রদনক পারমাণবিক ব্যাসার্ধ েব্ র্শ কনর্নছ, ় ্ অপিরদনক আয়নীকিণ শক্তি েব্ র্শ ব নড় নছ। অর্থাৎ বে মৌলের ় ় ্ পারমাণবিক ব্যাসার্ধ স নচনে বেশি (Na), তাি আয়নীকিণ শক্তি ় ় ় স নচনে কম এবং োি ব্যাসার্ধ স নচনে কম (Cl), তাি আয়নীকিণ ্ ় শক্তি স নচনে বেশি। ় ় ্ সু তিাং, পর্যায় সািরণনত আয়নীকিণ শক্তি ও পারমাণবিক ব্যাসার্ধ ় ্ র পিীতেব্ নর্ পরি রতিতড হে—উপ্কবটি উদ্দীপকের A, B ও Y মৌলের থক্ষতরে েথাথড।"}],"board":"ঢাকা বোর্ড ২০২৬"},{"id":"ch4-cq11","chapter":4,"num":11,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: কপ্োপট-১ : ক মাস্ট ার সাজেশন কপ্োপট-২ : মৌল পারমাণরবক ির X 7 Y 23 Z 39 [এখ্াজন X, Y এবং Z প্িলেি মৌলের প্িীক নয] র র","subQuestions":[{"label":"ক","question":"পারমাণবিক ণডালী কী?","answer":"কোনো মৌলের পরমাণুর ইলেকট্রন উচ্চ শক্তিস্তর থেকে রেম্ন ত ত ় শক্তি তনি থাোন্নভর সময় নির্দিষ্ট তিঙ্গদদনঘডযি বে আনলা র রকিণ করে, তা ণডালী ীক্ষণ েতরন্ত কতকগুনলা নির্দিষ্ট বিখা ছহনসন বদখা যায়; এনক পারমাণবিক ণডালী বলে।"},{"label":"খ","question":"পর্যায় সািরণনত হাইরোজেনের অবস্থাে যরতেব্ র্ কেন? ব্যাখ্যা ্ ি কি।","answer":"হাইরোজেনের (1s1) স ড ছহঃথ তনি একটি ইলেকট্রন থাকাে ্ ি + এটি ক্ষার ধাতি র্নতা একটি ইলেকট্রন তযাগ করে H আয়ন গঠে করে এবং +1 যোজনী বদখাে। তাই এনক গ্রুপ-1 এ িাখা যায়। আ াি হাইরোজেন হযানলানৈনেি র্নতা একটি ইলেকট্রন গ্রহণ করে − ় ্ H আয়ন গঠে করে, ছদপরমাণুক অণু (H ) গঠে করে এবং অধাত। 2 তাই এনক গ্রুপ-17 এও িাখা যায়। হাইরোজেন গ্রুপ-1 ও গ্রুপ-17 উভয় গ্রুপেি মৌলের সাথে রকছ ধনর্ড র র র মর্ল আ াি রকছ ধনর্ড অমর্ল বদখাে। এ কারণে পর্যায় সািরণনত হাইরোজেনের অবস্থাে যরতে্বর্ধর্ী। ্ ি ্ ত"},{"label":"গ","question":"বপ্ক্ষাপট-১ এ উপ্ল্মখত পরমাণু েরদ 700 nm তিঙ্গদদনঘডযি র ল আনলা র রকিণ করে, তাহলে র রকরিত শক্তভর পরিমাণ কত? নির্ণয় কি। ় ্","answer":"বপ্ক্ষাপট-১ এ পরমাণুর ইলেকট্রন n = 2 শক্তিস্তর থেকে n = 1 ্ ত ত ় ্ শক্তি তনি থাোন্রিত হয়ে শক্তি র রকিণ করে। র রকরিত শক্তি, E = hν = hc/λ এখানে, −34 2 6.626×10 m kg প্াজঙ্কর ধ্ুবক, h = ল ্ s(Js) 8 আজোর কবগ, c = 3 ×10 m/s −9 িরঙ্গদদঘয, λ = 700nm = 700 × 10 m = 7 × 10 −34 8 E = 6.626 × 10 ×3×10 J 7×10−7 −26 19. 878 × 10 = J −7 7 × 10 =2.84 × 10−19J −19 অতএ, র রকরিত শক্তভর পরিমাণ 2.84 × 10 J। ﻿"},{"label":"ঘ","question":"বপ্ক্ষাপট-২ এর মৌলগুনলাি আয়নিকিণ শক্তভর েব্ র্ বিশ্লেষণ কি। [৫ বোর্ডে এনসনছ]","answer":"বপ্ক্ষাপট-২ এর X, Y ও Z মৌলের পারমাণবিক ভর েথােব্ নর্ 7, ় ় 23 ও 39। সুতিাং মৌলগুনলা েথােব্ নর্ ললরথোর্ (Li), সোডিয়াম (Na) ও পটাশিয়াম (K)। ক ় মৌল পারমাণরবক ইজেক ট ন পর্যায় গ্রুপ সংখ্যা বিন্যাস X (Li) 3 1s2 2s1 2 1 2 2 6 Y (Na) 11 1s 2s 2p 3 1 3s1 Z (K) 19 2 2 6 4 1 1s 2s 2p 2 6 1 3s 3p 4s ় ু অর্থাৎ X, Y, Z রতেটি ই পর্যায় সািরণি গ্রুপ-1 এর মৌল (ক্ষার ধাত)। ় ় গ্যাসীে অবস্থাে কোনো মৌলের এক মোল পরমাণু থেকে এক মোল ইলেকট্রন অপসািণ করে এক মোল ধোতমক আয়নে পরিণত কিনত ় ় ় ্ ্ বে শক্তি প্নোৈে হয়, তানক আয়নিকিণ শক্তি বলে। + − X(g) → X (g)+e ্ ত একই গ্রুপে উপর থেকে রেনচ োর্নল শক্তিস্তরেি সংখ্যা ানড়। Li এর ় ় ্ত ্ ত বোৈযতা ইলেকট্রন ২ে শক্তিস্তরে, Na এর ৩ে শক্তিস্তরে এবং K এর ৪থড শক্তি তনি অ মথত। িনল পরমাণুর আকার Li \u003c Na \u003c K েব্ নর্ ানড় এবং স ড ছহঃথ ইলেকট্রন রেউর্োস থেকে েব্ র্শ দনি অবস্থাে ি র ল ি ্ করে। ্ ত ় তাছাড় বা বিতনভর শক্তি তিগুনলাি ইলেকট্রন নিউক্লিয়াসেি র ল আকর্ষণনক আড় াল (মথবরেং) করে। তাই রেনচি রদনক স ড ছহঃথ র ্ ি ় ় ইনলক ট নেি উপর নিউক্লিয়াসেি কােডকি আকর্ষণ কনর্ যায় এবং র ল ইলেকট্রনটি সিানত কম শক্তি লার্গ। ় ় ় Li এর বোৈযতা ইলেকট্রন নিউক্লিয়াসেি স নচনে কানছ থাকাে তা র ল সিানত স নচনে বেশি শক্তি লার্গ, আি K এর বোৈযতা ইলেকট্রন ় ় ় ় স নচনে দনি থাকাে স নচনে কম শক্তি লার্গ। র ূ সু তিাং মৌলগুনলাি আয়নিকিণ শক্তভর েব্ র্: X (Li) \u003e Y (Na) \u003e Z (K)। র র"}],"board":"যশোর বোর্ড ২০২৬"},{"id":"ch4-cq12","chapter":4,"num":12,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: মৌল পারমাণরবক সংখ্যা M 9 N 12 O 16 P 20 [এখ্াজন M, N, O এবং P প্িলেি মৌলের প্িীক নয] র র","subQuestions":[{"label":"ক","question":"ভরসংখ্যা কী? ভ ়","answer":"কোনো পরমাণুর নিউক্লিয়াসে উপমথত প্রোটন ও রেউ ট নেি মোট ল ি র সংখ্যানক ঐ পরমাণুর ভরসংখ্যা বলে। ্ ত ়"},{"label":"খ","question":"2d অরবিটাল সম্ েে কেন? ব্যাখ্যা কি।","answer":"কোনো প্ধাে শক্তি তি n এর জন্য সহকািী বকাোনট ার্ সংখ্যা l র ড ত ় এর মান 0 থেকে (n − 1) পে্ হয়। l = 0, 1, 2, 3 হলে েথােব্ নর্ s, p, d, f অরবিটাল
