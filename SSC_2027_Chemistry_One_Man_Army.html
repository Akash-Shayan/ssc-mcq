"answer":"অ্যালকেনকে প্যারাফিন বলা হয়; প্যারাফিন অর্থ স্বল্প আসক্তি । মিথেন (CH₄) অ্যালকেন শ্রেণির প্রথম সদস্য, সাধারণ সংকেত CnH2n+₂। মিথেনসহ সকল অ্যালকেনে (ইথেন C₂H₆, প্রোপেন C₃H₈, বিউটেন C₄H₁₀) কেবল C-C ও C-H একক বন্ধন থাকে, যা ভাঙা অনেক কঠিন । তাই এরা সাধারণ অবস্থায় এসিড, ক্ষার, জারক বা বিজারকের সাথে বিক্রিয়া করে না; কেবল উচ্চ তাপমাত্রা, উচ্চ চাপ বা শক্তিশালী\nপ্রভাবকের উপস্থিতিতে বিক্রিয়া করে।\nরাসায়নিকভাবে প্রায় নিষ্ক্রিয় বলে মিথেন একটি প্যারাফিন যৌগ ।"},{"id":"ch11-sq2","chapter":11,"num":2,"importance":3,"topic":"হাইড্রোকার্বন: শ্রেণিবিভাগ, সমগোত্রীয় শ্রেণি ও কার্যকরী মূলক","question":"বেনজিন অ্যারোমেটিক হাইড্রোকার্বন কেন?","boards":"বরিশাল বোর্ড ২০২৫; ঢাকা বোর্ড ২০২৪; কুমিল্লা বোর্ড ২০২৩, ২০২১; সিলেট বোর্ড ২০২৩; রাজশাহী বোর্ড ২০২১; ময়মনসিংহ বোর্ড ২০২০","answer":"অ্যারোমেটিক হাইড্রোকার্বন সাধারণত 5, 6 বা 7 সদস্যের সমতলীয় চাক্রিক যৌগ, যার বলয়ে একান্তর দ্বিবন্ধন থাকে। বেনজিনে (C₆H₆) ছয়টি CH একক একটি সমতলীয় ষড়ভুজাকার বলয় গঠন করে, যেখানে একান্তরভাবে 3টি C=C ও 3টি C-C বন্ধন আছে। এটি শুধু C ও H দিয়ে গঠিত । তাই বেনজিন একটি অ্যারোমেটিক হাইড্রোকার্বন ।"},{"id":"ch11-sq3","chapter":11,"num":3,"importance":3,"topic":"হাইড্রোকার্বন: শ্রেণিবিভাগ, সমগোত্রীয় শ্রেণি ও কার্যকরী মূলক","question":"ন্যাপথালিন একটি অ্যারোমেটিক হাইড্রোকার্বন – ব্যাখ্যা করো।","boards":"ঢাকা বোর্ড ২০২২, ২০২১, ২০২০; বরিশাল বোর্ড ২০২২","answer":"অ্যারোমেটিক (Aroma = সুগন্ধ) হাইড্রোকার্বন হলো সমতলীয় চাক্রিক হাইড্রোকার্বন, যার বলয়ে একান্তর দ্বিবন্ধন থাকে। ন্যাপথলিনে (C₁₀H₈) দুইটি ছয় সদস্যের বেনজিন বলয় একটি বাহু ভাগাভাগি করে যুক্ত। এর গঠন সমতলীয় ও চাক্রিক, এতে একান্তরভাবে 5টি C=C আছে এবং এটি সুগন্ধযুক্ত । শুধু C ও H দিয়ে গঠিত হওয়ায় ন্যাপথলিন একটি অ্যারোমেটিক হাইড্রোকার্বন ।"},{"id":"ch11-sq4","chapter":11,"num":4,"importance":3,"topic":"হাইড্রোকার্বন: শ্রেণিবিভাগ, সমগোত্রীয় শ্রেণি ও কার্যকরী মূলক","question":"সাইক্লোপ্রোপিন একটি অসম্পৃক্ত বদ্ধ শিকল হাইড্রোকার্বন — ব্যাখ্যা করো।","boards":"বরিশাল বোর্ড ২০২৫; দিনাজপুর বোর্ড ২০২২","answer":"যে হাইড্রোকার্বনে C=C বা C≡C থাকে তা অসম্পৃক্ত; আর যার দুই প্রান্তের কার্বন যুক্ত হয়ে বলয় গঠন করে তা বদ্ধ শিকল বা অ্যালিসাইক্লিক হাইড্রোকার্বন । সাইক্লোপ্রোপিনে (C₃H₄) তিনটি কার্বন (একটি CH₂ ও দুইটি CH) যুক্ত হয়ে ত্রিভুজাকার বলয় গঠন করেছে এবং দুইটি CH কার্বনের মধ্যে একটি C=C দ্বিবন্ধন আছে। বলয় থাকায় এটি বদ্ধ শিকল (অ্যালিসাইক্লিক) এবং দ্বিবন্ধন থাকায় অসম্পৃক্ত । তাই সাইক্লোপ্রোপিন একটি অসম্পৃক্ত বদ্ধ শিকল হাইড্রোকার্বন ।"},{"id":"ch11-sq5","chapter":11,"num":5,"importance":3,"topic":"হাইড্রোকার্বন: শ্রেণিবিভাগ, সমগোত্রীয় শ্রেণি ও কার্যকরী মূলক","question":"মুক্ত শিকল হাইড্রোকার্বন কাকে বলে?","boards":"রাজশাহী বোর্ড ২০২২; বরিশাল বোর্ড ২০২১","answer":"যে সকল হাইড্রোকার্বনের কার্বন শিকলের দুই প্রান্তের কার্বন দুইটি মুক্ত অবস্থায় থাকে, তাদেরকে মুক্ত শিকল হাইড্রোকার্বন বলে।\nযেমন: বিউটেন CH₃-CH₂-CH₂-CH₃, ইথিন CH₂=CH₂।"},{"id":"ch11-sq6","chapter":11,"num":6,"importance":3,"topic":"হাইড্রোকার্বন: শ্রেণিবিভাগ, সমগোত্রীয় শ্রেণি ও কার্যকরী মূলক","question":"সাইক্লোপ্রোপেন ও প্রোপিন পরস্পরের সমানু কেন? ব্যাখ্যা কর।","boards":"যশোর বোর্ড ২০২৬","answer":"যেসব যৌগের আণবিক সংকেত একই কিন্তু গাঠনিক সংকেত ভিন্ন হওয়ায় ধর্ম ভিন্ন হয়, তাদেরকে পরস্পরের সমানু বলে। সাইক্লোপ্রোপেন ও প্রোপিন উভয়ের আণবিক সংকেত C₃H₆। প্রোপিন একটি মুক্ত শিকল অ্যালকিন (CH₃-CH=CH₂), এতে একটি C=C দ্বিবন্ধন আছে । অপরদিকে সাইক্লোপ্রোপেনে তিনটি CH₂ গ্রুপ একক বন্ধনে যুক্ত হয়ে একটি বলয় বা চক্র গঠন করে । অর্থাৎ আণবিক সংকেত একই কিন্তু গঠন ভিন্ন হওয়ায় সাইক্লোপ্রোপেন ও প্রোপিন পরস্পরের সমানু ।"},{"id":"ch11-sq7","chapter":11,"num":7,"importance":3,"topic":"হাইড্রোকার্বন: শ্রেণিবিভাগ, সমগোত্রীয় শ্রেণি ও কার্যকরী মূলক","question":"ন্যাপথলিন একটি অ্যারোমেটিক হাইড্রোকার্বন — ব্যাখ্যা কর।","boards":"মাদ্রাসা বোর্ড ২০২৬","answer":"যেসব হাইড্রোকার্বনে এক বা একাধিক বেনজিন বলয় (একান্তর একক ও দ্বিবন্ধনযুক্ত ছয় কার্বনের সমতলীয় বলয়) থাকে, তাদের অ্যারোমেটিক হাইড্রোকার্বন বলে। ন্যাপথলিনের আণবিক সংকেত C₁₀H₈। এর অণুতে দুটি বেনজিন বলয় পাশাপাশি যুক্ত (দুটি কার্বন পরমাণু সাধারণ) অবস্থায় থাকে এবং এতে একান্তর একক ও দ্বিবন্ধন বিদ্যমান । এর বিশেষ গন্ধও আছে। তাই ন্যাপথলিন একটি অ্যারোমেটিক হাইড্রোকার্বন ।"},{"id":"ch11-sq8","chapter":11,"num":8,"importance":3,"topic":"হাইড্রোকার্বন: শ্রেণিবিভাগ, সমগোত্রীয় শ্রেণি ও কার্যকরী মূলক","question":"বেনজিন একটি অ্যারোমেটিক যৌগ—ব্যাখ্যা কর।","boards":"রাজশাহী বোর্ড ২০২৬","answer":"যেসব বলয়াকার জৈব যৌগে ছয় কার্বনবিশিষ্ট বলয়ে পর্যায়ক্রমে একক ও দ্বিবন্ধন থাকে এবং যারা অধিক স্থিতিশীল ও বিশেষ সুগন্ধযুক্ত, সেগুলোকে অ্যারোমেটিক যৌগ বলে। বেনজিনের (C₆H₆) অণুতে ছয়টি কার্বন পরমাণু একটি বলয় গঠন করে এবং বলয়ে পর্যায়ক্রমে তিনটি একক ও তিনটি দ্বিবন্ধন থাকে। এর একটি বিশেষ গন্ধ আছে এবং এটি অসম্পৃক্ত হলেও স্থিতিশীল । তাই বেনজিন একটি অ্যারোমেটিক যৌগ।"},{"id":"ch11-sq9","chapter":11,"num":9,"importance":3,"topic":"হাইড্রোকার্বন: শ্রেণিবিভাগ, সমগোত্রীয় শ্রেণি ও কার্যকরী মূলক","question":"C₄H₈ একটি বন্ধনশিকল হাইড্রোকার্বন — ব্যাখ্যা করো।","boards":"সিলেট বোর্ড ২০২৬","answer":"যেসব হাইড্রোকার্বনে কার্বন পরমাণুগুলো পরস্পর যুক্ত হয়ে একটি বলয় বা চক্র গঠন করে, সেগুলোকে বন্ধ শিকল বা চাক্রিক হাইড্রোকার্বন বলে । C₄H₈ সংকেতের একটি যৌগ সাইক্লোবিউটেন, যেখানে চারটি CH₂ গ্রুপ একক বন্ধনে যুক্ত হয়ে একটি চার সদস্যবিশিষ্ট বলয় গঠন করে। CH₂−CH₂ | | CH₂−CH₂ শিকলের কোনো খোলা প্রান্ত না থাকায় C₄H₈ (সাইক্লোবিউটেন) একটি বন্ধ শিকল হাইড্রোকার্বন ।"},{"id":"ch11-sq10","chapter":11,"num":10,"importance":3,"topic":"সম্পৃক্ত হাইড্রোকার্বন: অ্যালকেন","question":"-C₃H₇ মূলক এর নামকরণ ব্যাখ্যা কর।","boards":"ময়মনসিংহ বোর্ড ২০২২; বরিশাল বোর্ড ২০২১","answer":"অ্যালকেন থেকে একটি H পরমাণু অপসারণ করলে যে একযোজী মূলক তৈরি হয় তাকে অ্যালকাইল মূলক (-CnH2n+₁) বলে। মূল অ্যালকেনের নামের শেষের \"এন (ane)\" বাদ দিয়ে \"আইল (yl)\" যোগ করে এর নামকরণ করা হয়। -C₃H₇ মূলকটি প্রোপেন (C₃H₈) থেকে একটি H পরমাণু অপসারণ\nকরে তৈরি হয়। তাই প্রোপেন → প্রোপ + আইল = প্রোপাইল মূলক\n(CH₃-CH₂-CH₂-)।"},{"id":"ch11-sq11","chapter":11,"num":11,"importance":3,"topic":"সম্পৃক্ত হাইড্রোকার্বন: অ্যালকেন","question":"অ্যালকেন অপেক্ষা অ্যালকিন অধিক সক্রিয়? ব্যাখ্যা করো।","boards":"যশোর বোর্ড ২০২২; চট্টগ্রাম বোর্ড ২০২২","answer":"অ্যালকিনে কার্বন-কার্বন দ্বিবন্ধন থাকে, যার একটি বন্ধন শক্তিশালী হলেও অন্যটি তুলনামূলক দুর্বল । বিক্রিয়ার সময় এই দুর্বল বন্ধন সহজে ভেঙে যায়, তাই অ্যালকিন দহন ছাড়াও সংযোজন ও\nপলিমারকরণ বিক্রিয়া দেয়; যেমন: CH₂=CH₂+Br₂→\nCH₂Br-CH₂Br।\nঅপরদিকে অ্যালকেনে শুধু শক্তিশালী একক বন্ধন থাকায় সাধারণ অবস্থায় এটি প্রায় নিষ্ক্রিয় । তাই অ্যালকেন অপেক্ষা অ্যালকিন অধিক সক্রিয় ।"},{"id":"ch11-sq12","chapter":11,"num":12,"importance":3,"topic":"সম্পৃক্ত হাইড্রোকার্বন: অ্যালকেন","question":"C₃H₇– একটি অ্যালকাইল মূলক –ব্যাখ্যা কর।","boards":"বরিশাল বোর্ড ২০২১; চট্টগ্রাম বোর্ড ২০২০","answer":"অ্যালকেন থেকে একটি H পরমাণু অপসারণ করলে যে একযোজী মূলক পাওয়া যায় তাকে অ্যালকাইল মূলক (R = CnH2n+₁) বলে। প্রোপেন (C₃H₈, CH₃-CH₂-CH₃) থেকে একটি H সরালে C₃H₇− (CH₃-CH₂-CH₂-) পাওয়া যায়; n = 3 বসালে CnH2n+₁=C₃H₇ এবং এর যোজনী 1। প্রোপেনের এন বাদ দিয়ে আইল যোগ করে এর নাম প্রোপাইল । তাই C₃H₇- একটি অ্যালকাইল মূলক।"},{"id":"ch11-sq13","chapter":11,"num":13,"importance":3,"topic":"সম্পৃক্ত হাইড্রোকার্বন: অ্যালকেন","question":"বিউটেনকে প্যারাফিন বলা হয় কেন?","boards":"কুমিল্লা বোর্ড ২০২৬","answer":"ল্যাটিন শব্দ Parum অর্থ অল্প এবং Affinis অর্থ আসক্তি; অর্থাৎ প্যারাফিন অর্থ কম আসক্তি বা কম সক্রিয় । বিউটেন (CH₃-CH₂-CH₂-CH₃) একটি অ্যালকেন বা সম্পৃক্ত হাইড্রোকার্বন । এর সব বন্ধন শক্তিশালী C-C ও C-H একক সিগমা বন্ধন হওয়ায় সাধারণ অবস্থায় এটি এসিড, ক্ষার, জারক বা বিজারকের সাথে সহজে বিক্রিয়া করে না। রাসায়নিকভাবে কম সক্রিয় হওয়ায় বিউটেনকে প্যারাফিন বলা হয়।"},{"id":"ch11-sq14","chapter":11,"num":14,"importance":3,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকিন","question":"প্রোপিন এক ধরনের অলিফিন – ব্যাখ্যা করো ।","boards":"ঢাকা বোর্ড ২০২৫; সিলেট বোর্ড ২০২৪; যশোর বোর্ড ২০২৩; বরিশাল বোর্ড ২০২৩; কুমিল্লা বোর্ড ২০২২","answer":"অ্যালকিনের নিম্নতর সদস্যগুলো হ্যালোজেনের (Cl₂, Br₂) সাথে বিক্রিয়ায় তৈলাক্ত পদার্থ উৎপন্ন করে বলে এদের অলিফিন (তেল উৎপাদনকারী) বলে। প্রোপিন (CH₃-CH=CH₂) অ্যালকিনের একটি নিম্নতর সদস্য। এটি ক্লোরিনের সাথে যুক্ত হয়ে তৈলাক্ত তরল 1,2-ডাইক্লোরো প্রোপেন তৈরি করে:\nCH₃-CH=CH₂+Cl₂→CH₃-CHCl-CH₂Cl\nতাই প্রোপিন এক ধরনের অলিফিন ।"},{"id":"ch11-sq15","chapter":11,"num":15,"importance":3,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকিন","question":"অলিফিন কাকে বলে?","boards":"চট্টগ্রাম বোর্ড ২০২৪, ২০২২; সিলেট বোর্ড ২০২২","answer":"অ্যালকিনের নিম্নতর সদস্যগুলো (ইথিন, প্রোপিন ইত্যাদি) হ্যালোজেনের (Cl₂, Br₂) সঙ্গে বিক্রিয়ায় তৈলাক্ত পদার্থ উৎপন্ন করে বলে অ্যালকিনকে অলিফিন বলে। অলিফিন শব্দের অর্থ তেল উৎপাদনকারী ।"},{"id":"ch11-sq16","chapter":11,"num":16,"importance":3,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকিন","question":"প্রোপিনকে অসম্পৃক্ত যৌগ বলা হয় কেন?","boards":"ঢাকা বোর্ড ২০২৪, ২০২৩","answer":"যে হাইড্রোকার্বনে অন্তত একটি কার্বন-কার্বন দ্বিবন্ধন বা ত্রিবন্ধন থাকে তাকে অসম্পৃক্ত হাইড্রোকার্বন বলে । প্রোপিনের (C₃H₆) গঠন সংকেত CH₃-CH=CH₂; এতে একটি C=C দ্বিবন্ধন আছে । তাই এটি সংযোজন বিক্রিয়া দেয় এবং ব্রোমিন দ্রবণের\nলাল বর্ণ দূর করে: CH₃-CH=CH₂+Br₂→CH₃-CHBr-CH₂Br।\nএজন্য প্রোপিনকে অসম্পৃক্ত যৌগ বলা হয়।"},{"id":"ch11-sq17","chapter":11,"num":17,"importance":3,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকিন","question":"প্রোপিনকে অ্যালকিন বলা হয় কেন? ব্যাখ্যা করো ।","boards":"যশোর বোর্ড ২০২৪; ময়মনসিংহ বোর্ড ২০২৪","answer":"যে জৈব যৌগের কার্বন শিকলে অন্তত একটি কার্বন-কার্বন দ্বিবন্ধন থাকে তাকে অ্যালকিন বলে; এদের সাধারণ সংকেত CnH2n। প্রোপিনের (CH₃-CH=CH₂) কার্বন শিকলে একটি C=C দ্বিবন্ধন আছে এবং n = 3 বসালে CnH2n=C₃H₆, যা প্রোপিনের আণবিক সংকেত। অর্থাৎ প্রোপিন অ্যালকিনের সাধারণ সংকেত মেনে চলে, তাই একে অ্যালকিন বলা হয়।"},{"id":"ch11-sq18","chapter":11,"num":18,"importance":3,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকিন","question":"প্রোপিনকে অলিফিন বলা হয় কেন? ব্যাখ্যা কর।","boards":"বরিশাল বোর্ড ২০২৬","answer":"‘অলিফিন ’ শব্দের অর্থ তেল উৎপাদনকারী । অ্যালকিনসমূহ হ্যালোজেনের সাথে যুত বিক্রিয়া করে তৈলাক্ত পদার্থ উৎপন্ন করে বলে এদের অলিফিন বলে। প্রোপিন (CH₃-CH=CH₂) একটি অ্যালকিন। এটি ক্লোরিনের সাথে যুক্ত হয়ে তৈলাক্ত তরল 1,2-ডাইক্লোরোপ্রোপেন উৎপন্ন করে:\nCH₃-CH=CH₂+Cl₂→CH₃-CHCl-CH₂Cl\nতাই প্রোপিনকে অলিফিন বলা হয়।"},{"id":"ch11-sq19","chapter":11,"num":19,"importance":3,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকিন","question":"ইথেন অপেক্ষা ইথিন বেশি সক্রিয় কেন? ব্যাখ্যা কর।","boards":"চট্টগ্রাম বোর্ড ২০২৬","answer":"ইথেন (CH₃-CH₃) একটি সম্পৃক্ত হাইড্রোকার্বন; এর কার্বন- কার্বনের মধ্যে কেবল একটি শক্তিশালী সিগমা (σ) বন্ধন থাকে, তাই এটি তুলনামূলক নিষ্ক্রিয় । অপরদিকে ইথিন (CH₂=CH₂) অসম্পৃক্ত; এর দুটি কার্বনের মধ্যে একটি σ ও একটি দুর্বল পাই (π) বন্ধন থাকে। π বন্ধন সহজেই ভেঙে যায় এবং ইথিন সংযোজন বিক্রিয়ায় অংশ নেয়।\nCH₂=CH₂+Br₂→CH₂Br-CH₂Br\nদুর্বল π বন্ধনের উপস্থিতির জন্যই ইথিন ইথেন অপেক্ষা বেশি সক্রিয় ।"},{"id":"ch11-sq20","chapter":11,"num":20,"importance":3,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকিন","question":"অ্যালকেন ও অ্যালকিনের মধ্যে কোনটির সক্রিয়তা বেশি? ব্যাখ্যা কর।","boards":"যশোর বোর্ড ২০২৬","answer":"অ্যালকেন ও অ্যালকিনের মধ্যে অ্যালকিনের সক্রিয়তা বেশি। অ্যালকেন সম্পৃক্ত হাইড্রোকার্বন, এতে কার্বন পরমাণুগুলো শুধু শক্তিশালী সিগমা (σ) বন্ধনে যুক্ত থাকে, তাই এরা সহজে বিক্রিয়া করে না। অপরদিকে অ্যালকিনে কার্বন-কার্বন দ্বিবন্ধন (C=C) থাকে, যার একটি দুর্বল পাই (π) বন্ধন সহজেই ভেঙে যায়। ফলে অ্যালকিন সহজেই যুত বিক্রিয়ায় অংশ নেয়।\nCH₂=CH₂+Br₂→CH₂Br-CH₂Br\nতাই অ্যালকিন অ্যালকেনের চেয়ে বেশি সক্রিয় ।"},{"id":"ch11-sq21","chapter":11,"num":21,"importance":3,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকিন","question":"অ্যালকেন অপেক্ষা অ্যালকিন সক্রিয় — ব্যাখ্যা কর।","boards":"মাদ্রাসা বোর্ড ২০২৬","answer":"অ্যালকেনে কার্বন পরমাণুগুলো কেবল শক্তিশালী সিগমা (σ) বন্ধনে যুক্ত থাকে, তাই এটি সহজে বিক্রিয়া করে না। অ্যালকিনে কার্বন-কার্বন দ্বিবন্ধন (C=C) থাকে, যার একটি σ ও একটি দুর্বল পাই (π) বন্ধন । π বন্ধন সহজেই ভেঙে যায় বলে অ্যালকিন সহজে সংযোজন বিক্রিয়া দেয়।\nCH₂=CH₂+Br₂→CH₂Br-CH₂Br\nতাই অ্যালকেন অপেক্ষা অ্যালকিন অধিক সক্রিয় ।"},{"id":"ch11-sq22","chapter":11,"num":22,"importance":3,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকিন","question":"C₂H₆ এর তুলনায় C₂H₄ অধিক সক্রিয় কেন? ব্যাখ্যা কর।","boards":"রাজশাহী বোর্ড ২০২৬","answer":"C₂H₆ (ইথেন) একটি সম্পৃক্ত হাইড্রোকার্বন; এর কার্বন পরমাণুগুলো শুধু শক্তিশালী সিগমা (σ) বন্ধন দ্বারা যুক্ত। তাই এটি সহজে বিক্রিয়া করে না। অপরদিকে C₂H₄ (ইথিন) একটি অসম্পৃক্ত হাইড্রোকার্বন; এর দুটি কার্বনের মধ্যে দ্বিবন্ধন (C=C) আছে, যার একটি সিগমা ও একটি দুর্বল পাই (π) বন্ধন । পাই বন্ধন সহজেই ভেঙে যায় এবং ইথিন যুত বিক্রিয়ায় অংশ নেয়।\nCH₂=CH₂+Br₂→CH₂Br-CH₂Br\nতাই C₂H₆ এর তুলনায় C₂H₄ অধিক সক্রিয় ।"},{"id":"ch11-sq23","chapter":11,"num":23,"importance":3,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকাইন","question":"অ্যালকাইন কাকে বলে?","boards":"কুমিল্লা বোর্ড ২০২৪; সিলেট বোর্ড ২০২৪; দিনাজপুর বোর্ড ২০২৩; ময়মনসিংহ বোর্ড ২০২২, ২০২১; যশোর বোর্ড ২০২১","answer":"যে জৈব যৌগে কার্বন শিকলে অন্তত একটি কার্বন-কার্বন ত্রিবন্ধন (–C≡C–) থাকে তাকে অ্যালকাইন বলে । যেমন: ইথাইন (CH≡CH), প্রোপাইন (CH₃-C≡CH)। সাধারণ সংকেত CnH2n−₂।"},{"id":"ch11-sq24","chapter":11,"num":24,"importance":3,"topic":"অ্যালকোহল","question":"অ্যালকোহল কাকে বলে?","boards":"চট্টগ্রাম বোর্ড ২০২৫; কুমিল্লা বোর্ড ২০২৪; রাজশাহী বোর্ড ২০২২; যশোর বোর্ড ২০২২; ময়মনসিংহ বোর্ড ২০২২","answer":"যে জৈব যৌগে হাইড্রক্সিল মূলক (-OH) বিদ্যমান থাকে তাকে অ্যালকোহল বলে। যেমন: মিথানল (CH₃-OH), ইথানল (CH₃-CH₂-OH)।"},{"id":"ch11-sq25","chapter":11,"num":25,"importance":3,"topic":"অ্যালকোহল","question":"রেকটিফাইড স্পিরিট কী?","boards":"বরিশাল বোর্ড ২০২৫; ঢাকা বোর্ড ২০২২; কুমিল্লা বোর্ড ২০২২; দিনাজপুর বোর্ড ২০২২","answer":"ইথানলের 95.6% জলীয় দ্রবণকে রেকটিফাইড স্পিরিট বলে।"},{"id":"ch11-sq26","chapter":11,"num":26,"importance":3,"topic":"অ্যালকোহল","question":"ইথানল হাইড্রোকার্বন নয় কেন?","boards":"বরিশাল বোর্ড ২০২০; ময়মনসিংহ বোর্ড ২০২০","answer":"যেসব যৌগ শুধু কার্বন ও হাইড্রোজেন দ্বারা গঠিত তাদের হাইড্রোকার্বন বলে । ইথানলের সংকেত C₂H₅OH; এটি কার্বন ও হাইড্রোজেনের সাথে অক্সিজেন মৌল দ্বারাও গঠিত এবং এতে -OH কার্যকরী মূলক আছে। তাই ইথানল হাইড্রোকার্বন নয়, এটি হাইড্রোকার্বনের জাতক (অ্যালকোহল)।"},{"id":"ch11-sq27","chapter":11,"num":27,"importance":3,"topic":"অ্যালকোহল","question":"সকল হাইড্রোক্সাইড মূলকযুক্ত যৌগ অ্যালকোহল নয় — ব্যাখ্যা কর।","boards":"দিনাজপুর বোর্ড ২০২৬","answer":"অ্যালকেনের এক বা একাধিক হাইড্রোজেন পরমাণু –OH মূলক দ্বারা প্রতিস্থাপিত হয়ে যে জৈব যৌগ গঠিত হয়, তাকে অ্যালকোহল বলে। অ্যালকোহলে –OH মূলক অ্যালকাইল মূলকের সম্পৃক্ত কার্বনের সাথে সমযোজী বন্ধনে যুক্ত থাকে। যেমন: CH₃-OH, CH₃-CH₂-OH। অপরদিকে NaOH, KOH, Ca(OH)₂ প্রভৃতি যৌগে –OH মূলক থাকলেও এরা ধাতব হাইড্রোক্সাইড । এরা আয়নিক যৌগ এবং পানিতে OH⁻ আয়ন দেয়, অর্থাৎ এরা ক্ষার।\nNaOH(aq)→Na⁺(aq)+OH⁻(aq)\nতাই –OH মূলক থাকলেই কোনো যৌগ অ্যালকোহল হয় না, অর্থাৎ সকল হাইড্রোক্সাইড মূলকযুক্ত যৌগ অ্যালকোহল নয়।"},{"id":"ch11-sq28","chapter":11,"num":28,"importance":3,"topic":"অ্যালডিহাইড ও জৈব এসিড","question":"ফ্যাটি এসিড কাকে বলে?","boards":"সিলেট বোর্ড ২০২৫; ময়মনসিংহ বোর্ড ২০২২","answer":"যে জৈব যৌগে কার্বক্সিল মূলক (-COOH) বিদ্যমান থাকে তাকে জৈব এসিড বা ফ্যাটি এসিড বলে। এর সাধারণ সংকেত CnH2n+₁COOH বা R-COOH; যেমন: ইথানয়িক এসিড (CH₃COOH)।"},{"id":"ch11-sq29","chapter":11,"num":29,"importance":3,"topic":"অ্যালডিহাইড ও জৈব এসিড","question":"ফরমালিন কী?","boards":"ঢাকা বোর্ড ২০২৩; বরিশাল বোর্ড ২০২২","answer":"ফরমালডিহাইড বা মিথান্যালের (H-CHO) 40% জলীয় দ্রবণকে ফরমালিন বলে। এতে 40 ভাগ মিথান্যাল ও 60 ভাগ পানি থাকে।"},{"id":"ch11-sq30","chapter":11,"num":30,"importance":3,"topic":"অ্যালডিহাইড ও জৈব এসিড","question":"অ্যালডিহাইড কাকে বলে?","boards":"দিনাজপুর বোর্ড ২০২৩; ময়মনসিংহ বোর্ড ২০২৩","answer":"যে জৈব যৌগে অ্যালডিহাইড গ্রুপ (–CHO) বিদ্যমান থাকে তাকে অ্যালডিহাইড বলে। যেমন: মিথান্যাল (H-CHO), ইথান্যাল (CH₃-CHO)।"},{"id":"ch11-sq31","chapter":11,"num":31,"importance":3,"topic":"অ্যালডিহাইড ও জৈব এসিড","question":"জৈব এসিড কাকে বলে?","boards":"দিনাজপুর বোর্ড ২০২২; চট্টগ্রাম বোর্ড ২০২১","answer":"যে জৈব যৌগে কার্বক্সিল গ্রুপ (–COOH) বিদ্যমান থাকে তাকে জৈব এসিড বা ফ্যাটি এসিড বলে। যেমন: ইথানয়িক এসিড (CH₃COOH)।"},{"id":"ch11-sq32","chapter":11,"num":32,"importance":3,"topic":"পলিমার, প্লাস্টিক ও জৈব-অজৈব যৌগের পার্থক্য","question":"নাইলন 6:6 একটি ঘনীভবন পলিমার- ব্যাখ্যা কর।","boards":"ঢাকা বোর্ড ২০২৫; বরিশাল বোর্ড ২০২৫; রাজশাহী বোর্ড ২০২০","answer":"যে পলিমারকরণে মনোমারগুলো যুক্ত হওয়ার সময় H₂O, CO₂ ইত্যাদি ক্ষুদ্র অণু অপসারিত হয় তাকে ঘনীভবন পলিমারকরণ বলে। টাইটানিয়াম অক্সাইডের উপস্থিতিতে অ্যাডিপিক এসিড ও হেক্সামিথিলিন ডাইঅ্যামিন উত্তপ্ত করলে নাইলন 6:6 উৎপন্ন হয় এবং পানি অপসারিত হয়। nHOOC-(CH₂)₄-COOH TiO₂, Δ\n+nH₂N-(CH₂)₆-NH₂⟶[-OC-(CH₂)₄-CO-NH-(CH₂)₆-NH-]n+2nH₂O\nগঠনের সময় পানি অপসারিত হয় বলে নাইলন 6:6 একটি ঘনীভবন পলিমার ।"},{"id":"ch11-sq33","chapter":11,"num":33,"importance":3,"topic":"পলিমার, প্লাস্টিক ও জৈব-অজৈব যৌগের পার্থক্য","question":"মনোমার কাকে বলে?","boards":"ময়মনসিংহ বোর্ড ২০২৪; ঢাকা বোর্ড ২০২২; সিলেট বোর্ড ২০২২","answer":"পলিমারকরণ বিক্রিয়ায় যে ছোট অণুগুলো অংশগ্রহণ করে তাদের প্রত্যেকটিকে এক একটি মনোমার বলে। যেমন: পলিথিনের মনোমার ইথিন (CH₂=CH₂)।"},{"id":"ch12-sq1","chapter":12,"num":1,"importance":3,"topic":"গৃহস্থালির রসায়ন","question":"বেকিং পাউডার কিভাবে কেক/ রুটি ফোলায়? ব্যাখ্যা কর।","boards":"ঢাকা বোর্ড ২০২৪; দিনাজপুর বোর্ড ২০২৪, ২০২০","answer":"বেকিং পাউডার হলো বেকিং সোডা (NaHCO₃) ও টারটারিক এসিডের মিশ্রণ । কেক তৈরির সময় ময়দায় বেকিং পাউডার মিশিয়ে\nতাপ দিলে NaHCO₃ টারটারিক এসিডের সাথে বিক্রিয়া করে CO₂ গ্যাস উৎপন্ন করে ।\nΔ\n2NaHCO₃+C₄H₆O₆⟶C₄H₄Na₂O₆+2CO₂+2H₂O\nএই CO₂ গ্যাস ময়দার ভেতর থেকে বের হওয়ার চেষ্টা করায় কেক বা রুটি ফুলে ওঠে ও নরম হয়।"},{"id":"ch12-sq2","chapter":12,"num":2,"importance":3,"topic":"গৃহস্থালির রসায়ন","question":"ভিনেগার দ্বারা কীভাবে খাদ্য সংরক্ষণ করা হয়? ব্যাখ্যা কর।","boards":"চট্টগ্রাম বোর্ড ২০২৫; রাজশাহী বোর্ড ২০২৪","answer":"ভিনেগার হলো ইথানয়িক এসিডের 4% – 10% জলীয় দ্রবণ । খাদ্য পচে ব্যাকটেরিয়ার আক্রমণে । খাদ্যে ভিনেগার দিলে ইথানয়িক এসিড আংশিক বিয়োজিত হয়ে H⁺ আয়ন দেয়।\nআংশিক\nCH₃COOH⟶CH₃COO⁻+H⁺\nএই H⁺ আয়ন ব্যাকটেরিয়া ধ্বংস করে, ফলে খাদ্য দীর্ঘদিন পচন থেকে রক্ষা পায়। তাই খাদ্য সংরক্ষণে ভিনেগার ব্যবহার করা হয়।"},{"id":"ch12-sq3","chapter":12,"num":3,"importance":3,"topic":"গৃহস্থালির রসায়ন","question":"ভিনেগারকে খাদ্য সংরক্ষক বলা হয় কেন?","boards":"ময়মনসিংহ বোর্ড ২০২৬","answer":"ভিনেগার হলো ইথানয়িক এসিড বা অ্যাসিটিক এসিডের (CH₃COOH) লঘু জলীয় দ্রবণ । খাদ্যে ভিনেগার যোগ করলে খাদ্যের pH কমে যায় অর্থাৎ মাধ্যম অম্লীয় হয়। এরূপ অম্লীয় পরিবেশে খাদ্য পচনকারী ব্যাকটেরিয়া ও ছত্রাক জন্মাতে ও বংশবৃদ্ধি করতে পারে না। ফলে খাদ্য দীর্ঘদিন ভালো থাকে। এজন্য আচার, সস, চাটনি ইত্যাদি সংরক্ষণে ভিনেগার ব্যবহৃত হয় এবং ভিনেগারকে খাদ্য সংরক্ষক বলা হয়।"},{"id":"ch12-sq4","chapter":12,"num":4,"importance":2,"topic":"গৃহস্থালির রসায়ন","question":"ঈস্ট কীভাবে পাউরুটি ফোলায়?","boards":"যশোর বোর্ড ২০২০","answer":"ইস্ট এক ধরনের ছত্রাক । চিনির দ্রবণে ইস্ট মিশিয়ে ময়দা মেখে উষ্ণ স্থানে রাখলে ইস্টের সবাত শ্বসনে CO₂ গ্যাস উৎপন্ন হয়।\nইস্ট\nC₆H₁₂O₆+6O₂⟶6CO₂+6H₂O\nএই CO₂ ময়দার দলাকে ফুলিয়ে তোলে, ফলে পাউরুটি ফোলে। পরে ওভেনে বেকিং করলে তাপে ইস্ট মারা যায় এবং ফোলা বন্ধ হয়।"},{"id":"ch12-sq5","chapter":12,"num":5,"importance":2,"topic":"গৃহস্থালির রসায়ন","question":"আচার সংরক্ষণে ভিনেগারের ভূমিকা ব্যাখ্যা কর।","boards":"কুমিল্লা বোর্ড ২০২০","answer":"ব্যাকটেরিয়া আক্রমণ করলে আচার পচে নষ্ট হয়ে যায়। আচারে ভিনেগার দিলে এর মূল উপাদান ইথানয়িক এসিড (CH₃COOH) প্রোটন (H⁺) ত্যাগ করে। এই H⁺ আয়ন ব্যাকটেরিয়াকে ধ্বংস করে, ফলে আচার দীর্ঘদিন ব্যাকটেরিয়ার আক্রমণ থেকে রক্ষা পায় এবং সংরক্ষিত থাকে।"},{"id":"ch12-sq6","chapter":12,"num":6,"importance":3,"topic":"পরিষ্কার-পরিচ্ছন্নতায় রসায়ন","question":"জীবাণুনাশক হিসেবে ব্লিচিং পাউডার ব্যবহার করা হয় কেন? ব্যাখ্যা কর।","boards":"সিলেট বোর্ড ২০২০; দিনাজপুর বোর্ড ২০২০","answer":"ব্লিচিং পাউডার পানির সাথে বিক্রিয়া করে CaCl₂ ও HOCl তৈরি করে। HOCl ভেঙে জায়মান অক্সিজেন [O] উৎপন্ন হয়, যা অত্যন্ত সক্রিয় জারক হিসেবে জীবাণুকে জারিত করে ধ্বংস করে। তাই মেঝে, কমোড, বেসিন জীবাণুমুক্ত করতে ব্লিচিং পাউডার ব্যবহার করা হয়।\nCa(OCl)Cl+H₂O→CaCl₂+HOCl\nHOCl→HCl+[O] ; জীবাণু + [O] → মৃত জীবাণু"},{"id":"ch12-sq7","chapter":12,"num":7,"importance":2,"topic":"পরিষ্কার-পরিচ্ছন্নতায় রসায়ন","question":"ব্লিচিং পাউডার কীভাবে কাপড়ের রঙিন দাগ উঠায়? ব্যাখ্যা করো।","boards":"রাজশাহী বোর্ড ২০২৫","answer":"কাপড়ের দাগের উপর ব্লিচিং পাউডার রেখে পানি যোগ করলে এটি CaCl₂ ও HOCl তৈরি করে। HOCl ভেঙে HCl ও জায়মান অক্সিজেন [O] দেয়। এই জায়মান অক্সিজেন রঙিন পদার্থকে জারিত করে বর্ণহীন করে, ফলে দাগ উঠে যায়।\nCa(OCl)Cl+H₂O→CaCl₂+HOCl\nHOCl→HCl+[O] ; রঙিন পদার্থ + [O] → বর্ণহীন পদার্থ"},{"id":"ch12-sq8","chapter":12,"num":8,"importance":2,"topic":"পরিষ্কার-পরিচ্ছন্নতায় রসায়ন","question":"সাবান ও ডিটারজেন্টের মধ্যে পার্থক্য লেখ।","boards":"দিনাজপুর বোর্ড ২০২৪","answer":"সাবান ডিটারজেন্ট দীর্ঘ কার্বন শিকলবিশিষ্ট ফ্যাটি দীর্ঘ কার্বন শিকলবিশিষ্ট এসিডের সোডিয়াম বা পটাশিয়াম বেনজিন সালফোনিক এসিডের লবণ (যেমন C₁₇H₃₅COONa) সোডিয়াম লবণ (বা সোডিয়াম লরাইল সালফেট, C₁₂H₂₅SO₄Na) খর পানিতে ভালো কাজ করে না খর পানিতেও ভালো কাজ করে পরিষ্কারকরণ ক্ষমতা কম পরিষ্কারকরণ ক্ষমতা বেশি"}],"cqs":[{"id":"ch1-cq1","chapter":1,"num":1,"importance":2,"topic":"রসায়ন পরীক্ষাগার ব্যবহারে ও পরীক্ষাগারে ব্যবহৃত বিভিন্ন রাসায়নিক দ্রব্য ব্যবহারে সতর্কতা গ্রহণ","board":"বরিশাল বোর্ড ২০২২","stem":"নিচের উদ্দীপকটি পড়ো এবং প্রশ্নগুলোর উত্তর দাও:","diagramId":"ch1-cq1","subQuestions":[{"label":"ক","question":"তাপ উৎপাদী বিক্রিয়া কাকে বলে?","answer":"যে রাসায়নিক বিক্রিয়ায় তাপ উৎপন্ন হয়ে পরিবেশে নির্গত হয় এবং পরিবেশের তাপমাত্রা বেড়ে যায়, তাকে তাপ উৎপাদী বিক্রিয়া\nবলে। যেমন: CaO+H₂O→Ca(OH)₂+তাপ ।"},{"label":"খ","question":"পিঁপড়ার কামড়ের ক্ষত স্থানে চুন লাগানো হয় কেন?","answer":"পিঁপড়া কামড় দেওয়ার সময় ক্ষতস্থানে ফরমিক এসিড (H-COOH) প্রবেশ করিয়ে দেয়। এই এসিডের কারণে ক্ষতস্থানে জ্বালাপোড়া ও ব্যথা হয়। চুন (CaO) পানির সাথে বিক্রিয়া করে ক্ষারীয় ক্যালসিয়াম হাইড্রক্সাইড উৎপন্ন করে, যা ফরমিক এসিডকে প্রশমিত করে লবণ ও পানি তৈরি করে।\n2H-COOH+Ca(OH)₂→(H-COO)₂Ca+2H₂O\nফলে এসিডের প্রভাব নষ্ট হয় এবং জ্বালাপোড়া কমে যায়। এজন্য পিঁপড়ার কামড়ের ক্ষতস্থানে চুন লাগানো হয়।"},{"label":"গ","question":"ল্যাবরেটরিতে A এবং B এর ব্যবহার আবশ্যক কেন? ব্যাখ্যা কর।","answer":"উদ্দীপকের A হলো অ্যাপ্রোন বা ল্যাব কোট এবং B হলো সেফটি গগলস। ল্যাবরেটরিতে নিরাপদে কাজ করার জন্য এ দুটি ব্যবহার করা আবশ্যক ।\nA (অ্যাপ্রোন): ল্যাবরেটরিতে বিভিন্ন এসিড, ক্ষার ও ক্ষয়কারী রাসায়নিক পদার্থ নিয়ে কাজ করতে হয়। কাজ করার সময় অসাবধানতাবশত গাঢ় H₂SO₄, HNO₃, NaOH ইত্যাদি শরীরে বা পোশাকে পড়লে চামড়া পুড়ে যেতে পারে, পোশাক নষ্ট হয়ে যেতে পারে। আবার দাহ্য পদার্থ থেকে আগুন লাগার সম্ভাবনাও থাকে। অ্যাপ্রোন শরীর ও পোশাককে ঢেকে রাখে, ফলে এসব রাসায়নিক পদার্থ সরাসরি শরীরের সংস্পর্শে আসতে পারে না।\nB (সেফটি গগলস): চোখ শরীরের সবচেয়ে সংবেদনশীল অঙ্গ। পরীক্ষার সময় এসিড বা ক্ষারের ছিটা, তাপ দেওয়ার সময় টেস্টটিউব থেকে ছিটকে আসা দ্রবণ, কাচের টুকরা কিংবা ক্ষতিকর গ্যাস ও বাষ্প চোখে লেগে চোখের মারাত্মক ক্ষতি, এমনকি অন্ধত্বও হতে পারে। সেফটি গগলস চোখকে এসব থেকে রক্ষা করে। সুতরাং দুর্ঘটনা থেকে শরীর ও চোখকে রক্ষা করে নিরাপদে পরীক্ষা সম্পন্ন করার জন্য ল্যাবরেটরিতে A ও B এর ব্যবহার আবশ্যক।"},{"label":"ঘ","question":"বর্তমান প্রেক্ষাপটে C এর ব্যবহার অত্যন্ত গুরুত্বপূর্ণ – তোমার উত্তরের সপক্ষে মতামত দাও।","answer":"উদ্দীপকের C হলো মাস্ক। বর্তমান প্রেক্ষাপটে ল্যাবরেটরিতে এবং দৈনন্দিন জীবনে উভয় ক্ষেত্রেই মাস্কের ব্যবহার অত্যন্ত গুরুত্বপূর্ণ — আমি এ মতের সাথে একমত। কারণ:\n• ল্যাবরেটরিতে: অনেক রাসায়নিক পরীক্ষায় ক্ষতিকর ও বিষাক্ত গ্যাস বা বাষ্প উৎপন্ন হয়, যেমন: Cl₂, SO₂, NO₂, H₂S, NH₃ এবং গাঢ় HCl ও HNO₃ এর বাষ্প । এগুলো শ্বাসের সাথে ফুসফুসে গেলে শ্বাসকষ্ট, কাশি, ফুসফুসের প্রদাহসহ নানা রোগ হতে পারে। মাস্ক এসব গ্যাস, বাষ্প ও রাসায়নিক পদার্থের সূক্ষ্ম গুঁড়া শ্বাসনালিতে প্রবেশে বাধা দেয়।\n• বায়ুদূষণ থেকে সুরক্ষা: বর্তমানে শহরে যানবাহন ও কলকারখানার ধোঁয়া থেকে প্রচুর ধূলিকণা, কার্বন মনোক্সাইড, সালফার ডাইঅক্সাইড, নাইট্রোজেনের অক্সাইড ইত্যাদি বাতাসে মিশে বায়ু দূষিত করছে । মাস্ক ব্যবহার করলে এসব দূষিত উপাদান থেকে কিছুটা হলেও রক্ষা পাওয়া যায়।\n• রোগজীবাণু থেকে সুরক্ষা: করোনা ভাইরাস, ইনফ্লুয়েঞ্জা, যক্ষ্মা ইত্যাদি রোগের জীবাণু হাঁচি-কাশির মাধ্যমে বাতাসে ছড়ায় । মাস্ক এসব জীবাণুর সংক্রমণ প্রতিরোধে কার্যকর ভূমিকা রাখে। সুতরাং ক্ষতিকর রাসায়নিক বাষ্প, বায়ুদূষণ ও সংক্রামক রোগ থেকে নিজেকে এবং অন্যকে রক্ষা করার জন্য বর্তমান প্রেক্ষাপটে C অর্থাৎ মাস্কের ব্যবহার অত্যন্ত গুরুত্বপূর্ণ ।"}]},{"id":"ch2-cq1","chapter":2,"num":1,"importance":2,"topic":"ব্যাপন","board":"যশোর বোর্ড ২০২২","stem":"নিচের উদ্দীপকটি পড়ো এবং প্রশ্নগুলোর উত্তর দাও:","diagramId":"ch2-cq1","subQuestions":[{"label":"ক","question":"অ্যালকোহল কাকে বলে?","answer":"অ্যালকেন অণুর এক বা একাধিক হাইড্রোজেন পরমাণু হাইড্রক্সিল (-OH) মূলক দ্বারা প্রতিস্থাপিত হলে যে জৈব যৌগ উৎপন্ন হয় তাকে অ্যালকোহল বলে। যেমন: CH₃-CH₂-OH (ইথানল)।"},{"label":"খ","question":"ফসল উৎপাদনে রাসায়নিক সারের প্রভাব ব্যাখ্যা কর।","answer":"ফসল উৎপাদনে উদ্ভিদের প্রয়োজনীয় পুষ্টি উপাদান (N, P, K ইত্যাদি) মাটিতে যোগানের জন্য রাসায়নিক সার ব্যবহার করা হয়।\nযেমন: ইউরিয়া নাইট্রোজেন, TSP ফসফরাস এবং MoP পটাশিয়াম সরবরাহ করে । পরিমিত ব্যবহারে ফসলের বৃদ্ধি ও ফলন বাড়ে । কিন্তু মাত্রাতিরিক্ত ব্যবহারে মাটির উর্বরতা ও গুণাগুণ নষ্ট হয় এবং অতিরিক্ত সার বৃষ্টির পানির সাথে জলাশয়ে গিয়ে পানি দূষিত করে ও জলজ প্রাণীর ক্ষতি করে।"},{"label":"গ","question":"কোন জারের গ্যাসটি আগে ছড়িয়ে পড়বে? ব্যাখ্যা কর।","answer":"উদ্দীপকের Jar-A-তে অ্যামোনিয়া (NH₃) এবং Jar-B-তে ইথেন (C₂H₆) গ্যাস আছে। একই অবস্থায় যে গ্যাসের আণবিক ভর কম, তার ব্যাপন হার বেশি, তাই সেটি আগে ছড়িয়ে পড়ে । NH₃-এর আণবিক ভর =14+1×3=17 C₂H₆-এর আণবিক ভর =12×2+1×6=30 NH₃-এর আণবিক ভর (17) C₂H₆-এর আণবিক ভর (30) অপেক্ষা কম। ফলে NH₃ অণু দ্রুত গতিতে চারদিকে ছড়িয়ে পড়ে । সুতরাং, Jar-A-এর গ্যাস (NH₃) আগে ছড়িয়ে পড়বে ।"},{"label":"ঘ","question":"'C' জারের পদার্থটি কঠিন কিন্তু এর ব্যাপন সম্ভব- উক্তিটি বিশ্লেষণ কর।","answer":"উদ্দীপকের C জারের পদার্থটি পটাশিয়াম পারম্যাঙ্গানেট (KMnO₄), যা একটি কঠিন পদার্থ । কঠিন হলেও তরল মাধ্যমে এর ব্যাপন ঘটে। কাচের পাত্রে বিশুদ্ধ পানিতে কয়েকটি KMnO₄ দানা ছেড়ে দিলে দানাগুলো ধীরে ধীরে দ্রবীভূত হয়। দ্রবীভূত কণাগুলো দানার চারপাশে বেশি ঘনমাত্রায় থাকে এবং সেখান থেকে কম ঘনমাত্রার দিকে স্বতঃস্ফূর্তভাবে ছড়িয়ে পড়ে । কিছুক্ষণ পর পুরো পানি গোলাপি বর্ণ ধারণ করে। এটিই তরল মাধ্যমে কঠিন পদার্থের ব্যাপন । তবে কঠিন পদার্থের কণাগুলো শক্তিশালী আন্তঃআণবিক আকর্ষণে আবদ্ধ থাকে বলে এর ব্যাপন হার কম; পুরো পানি গোলাপি হতে কয়েক মিনিট থেকে প্রায় এক ঘণ্টা লাগে। পানি গরম করলে কণার গতিশক্তি বাড়ে, ফলে ব্যাপন দ্রুত হয়। সুতরাং, C জারের পদার্থটি কঠিন হলেও তরল মাধ্যমে এর ব্যাপন সম্ভব — উক্তিটি যথার্থ ।"}]},{"id":"ch2-cq2","chapter":2,"num":2,"importance":2,"topic":"গলন ও স্ফুটন","board":"যশোর বোর্ড ২০২৩","stem":"নিচের উদ্দীপকটি পড়ো এবং প্রশ্নগুলোর উত্তর দাও:","diagramId":"ch2-cq2","subQuestions":[{"label":"ক","question":"ঊর্ধ্বপাতন কাকে বলে?","answer":"যে প্রক্রিয়ায় কোনো কঠিন পদার্থকে তাপ দিলে তা তরলে পরিণত না হয়ে সরাসরি বাষ্পে পরিণত হয় এবং ঐ বাষ্পকে ঠান্ডা করলে সরাসরি কঠিনে পরিণত হয়, তাকে ঊর্ধ্বপাতন বলে। যেমন: কর্পূর, ন্যাপথালিন, আয়োডিন, অ্যামোনিয়াম ক্লোরাইড (NH₄Cl)।"},{"label":"খ","question":"উদ্ভিদের খাদ্য উৎপাদন রসায়নের সাথে সম্পর্কিত-ব্যাখ্যা কর।","answer":"সবুজ উদ্ভিদ সূর্যের আলোর উপস্থিতিতে ক্লোরোফিলের সাহায্যে বাতাসের কার্বন ডাইঅক্সাইড (CO₂) ও মাটি থেকে শোষিত পানি (H₂O) দিয়ে নিজের খাদ্য গ্লুকোজ (C₆H₁₂O₆) তৈরি করে এবং অক্সিজেন ত্যাগ করে। এ প্রক্রিয়াকে সালোকসংশ্লেষণ বলে। সূর্যালোক , ক্লোরোফিল\n6CO₂+6H₂O⟶C₆H₁₂O₆+6O₂\nএ প্রক্রিয়ায় CO₂ ও H₂O এর বন্ধন ভেঙে সম্পূর্ণ নতুন পদার্থ গ্লুকোজ ও অক্সিজেন তৈরি হয়, অর্থাৎ এটি একটি রাসায়নিক বিক্রিয়া । তাই উদ্ভিদের খাদ্য উৎপাদন রসায়নের সাথে সম্পর্কিত ।"},{"label":"গ","question":"উদ্দীপকের বক্ররেখাটির বর্ণনা দাও।","answer":"উদ্দীপকের বক্ররেখাটি একটি পদার্থের তাপমাত্রা বনাম সময়ের লেখচিত্র বা তাপীয় বক্ররেখা। এখানে পদার্থটির গলনাঙ্ক 50°C এবং স্ফুটনাঙ্ক 150°C। AB অংশ: শুরুতে A বিন্দুতে 20°C তাপমাত্রায় পদার্থটি কঠিন অবস্থায় থাকে। তাপ দিলে AB বরাবর কঠিন পদার্থের তাপমাত্রা বাড়তে থাকে এবং B বিন্দুতে 50°C এ পৌঁছায় । BC অংশ: 50°C এ তাপ দেওয়া সত্ত্বেও তাপমাত্রা স্থির থাকে, কারণ প্রদত্ত তাপ কঠিনকে তরলে পরিণত করতে ব্যয় হয়। তাই BC রেখা হলো গলনাঙ্ক রেখা। এ অংশে কঠিন ও তরল উভয় অবস্থা বিদ্যমান থাকে। CD অংশ: সম্পূর্ণ কঠিন গলে যাওয়ার পর CD বরাবর তরলের তাপমাত্রা বাড়তে থাকে এবং D বিন্দুতে 150°C এ পৌঁছায় । DE অংশ: 150°C এ তরল ফুটতে থাকে এবং বাষ্পে পরিণত হয়। সম্পূর্ণ তরল বাষ্পে পরিণত না হওয়া পর্যন্ত তাপমাত্রা স্থির থাকে। তাই DE রেখা হলো স্ফুটনাঙ্ক রেখা। এ অংশে তরল ও গ্যাসীয় উভয় অবস্থা বিদ্যমান থাকে। EF অংশ: সম্পূর্ণ তরল বাষ্পে পরিণত হওয়ার পর আরও তাপ দিলে EF বরাবর বাষ্পের তাপমাত্রা বাড়তে থাকে। সুতরাং, বক্ররেখাটির ঢালু অংশে পদার্থের তাপমাত্রা বাড়ে এবং অনুভূমিক অংশে (BC ও DE) তাপমাত্রা স্থির থেকে অবস্থার পরিবর্তন ঘটে।"},{"label":"ঘ","question":"A ও F বিন্দুতে অণুসমূহের আন্তঃআণবিক শক্তি ও আন্তঃকণা গতিশক্তির তুলনামূলক আলোচনা কর।","answer":"উদ্দীপকের লেখচিত্রে A বিন্দুতে (20°C) পদার্থটি কঠিন অবস্থায় এবং F বিন্দুতে (150°C এর বেশি) পদার্থটি গ্যাসীয় অবস্থায় থাকে। A বিন্দু (কঠিন অবস্থা): কঠিন অবস্থায় অণুগুলো খুব কাছাকাছি ও নির্দিষ্ট অবস্থানে সজ্জিত থাকে। অণুগুলোর মধ্যকার আন্তঃআণবিক আকর্ষণ শক্তি খুব বেশি, তাই অণুগুলো স্থান পরিবর্তন করতে পারে না, শুধু নিজ অবস্থানে কাঁপতে থাকে। এ অবস্থায় আন্তঃকণা গতিশক্তি খুবই কম। F বিন্দু (গ্যাসীয় অবস্থা): A থেকে F পর্যন্ত পদার্থটি ক্রমাগত তাপ শোষণ করেছে। ফলে অণুগুলোর গতিশক্তি বাড়তে বাড়তে আন্তঃআণবিক আকর্ষণ বল ছিন্ন হয়ে গেছে । গ্যাসীয় অবস্থায় অণুগুলো পরস্পর থেকে অনেক দূরে থাকে; আন্তঃআণবিক আকর্ষণ শক্তি নেই বললেই চলে এবং অণুগুলো মুক্তভাবে বিক্ষিপ্তভাবে ছুটাছুটি করে। এ অবস্থায় আন্তঃকণা গতিশক্তি সবচেয়ে বেশি। বিষয় A বিন্দু (কঠিন) F বিন্দু (গ্যাস) আন্তঃআণবিক আকর্ষণ সবচেয়ে বেশি নেই বললেই চলে শক্তি আন্তঃকণা গতিশক্তি সবচেয়ে কম সবচেয়ে বেশি অণুর চলাচল শুধু নিজ স্থানে কম্পন মুক্তভাবে ছুটাছুটি সুতরাং, A বিন্দু থেকে F বিন্দুর দিকে তাপমাত্রা বাড়ার সাথে আন্তঃআণবিক শক্তি কমে এবং গতিশক্তি বাড়ে; অর্থাৎ A ও F বিন্দুতে এ দুটি শক্তি সম্পূর্ণ বিপরীত অবস্থায় থাকে।"}]},{"id":"ch2-cq3","chapter":2,"num":3,"importance":2,"topic":"গলন ও স্ফুটন","board":"রাজশাহী বোর্ড ২০২০","stem":"একটি পদার্থ \"A\" এর গলনাঙ্ক 45°C ও স্ফুটনাঙ্ক 95°C.","subQuestions":[{"label":"ক","question":"ঊর্ধ্বপাতন কাকে বলে?","answer":"যে প্রক্রিয়ায় কোনো কঠিন পদার্থকে তাপ দিলে তা তরলে পরিণত না হয়ে সরাসরি বাষ্পে পরিণত হয় এবং ঐ বাষ্পকে ঠান্ডা করলে সরাসরি কঠিনে পরিণত হয়, তাকে ঊর্ধ্বপাতন বলে।"},{"label":"খ","question":"NaCl উচ্চ গলনাঙ্কবিশিষ্ট হয় কেন? ব্যাখ্যা কর।","answer":"NaCl একটি আয়নিক যৌগ । এর কেলাসে প্রতিটি Na⁺ আয়ন চারদিক থেকে 6টি Cl⁻ আয়ন দ্বারা এবং প্রতিটি Cl⁻ আয়ন 6টি Na⁺ আয়ন দ্বারা পরিবেষ্টিত থাকে। বিপরীত চার্জযুক্ত আয়নগুলো শক্তিশালী স্থির বৈদ্যুতিক আকর্ষণ বলে আবদ্ধ থেকে একটি দৃঢ় কেলাস জালি গঠন করে। এই শক্তিশালী আকর্ষণ বল ছিন্ন করে আয়নগুলোকে মুক্ত করতে প্রচুর তাপশক্তির প্রয়োজন হয়। তাই NaCl এর গলনাঙ্ক অনেক বেশি (801°C)।"},{"label":"গ","question":"A এর তাপীয় বক্ররেখা অঙ্কন করে বর্ণনা দাও।","answer":"পদার্থ A এর গলনাঙ্ক 45°C ও স্ফুটনাঙ্ক 95°C। অর্থাৎ সাধারণ তাপমাত্রায় A কঠিন; তাপ দিলে 45°C এ কঠিন থেকে তরলে এবং 95°C এ তরল থেকে বাষ্পে পরিণত হবে।\nতাপীয় বক্ররেখা অঙ্কন: X অক্ষে সময় এবং Y অক্ষে তাপমাত্রা (°C) নিয়ে লেখচিত্রটি আঁকতে হবে। মূলবিন্দু O থেকে B পর্যন্ত একটি ঊর্ধ্বমুখী ঢালু রেখা (B = 45°C), B থেকে C পর্যন্ত 45°C বরাবর একটি অনুভূমিক রেখা, C থেকে D পর্যন্ত আবার ঊর্ধ্বমুখী ঢালু রেখা (D = 95°C), D থেকে E পর্যন্ত 95°C বরাবর অনুভূমিক রেখা এবং E থেকে F পর্যন্ত ঊর্ধ্বমুখী ঢালু রেখা। অংশ তাপমাত্রা অবস্থা OB 45°C পর্যন্ত বৃদ্ধি কঠিন BC 45°C এ স্থির (গলনাঙ্ক) কঠিন + তরল CD 45°C থেকে 95°C তরল DE 95°C এ স্থির (স্ফুটনাঙ্ক) তরল + গ্যাস EF 95°C এর বেশি গ্যাস (বাষ্প) বর্ণনা: OB বরাবর তাপ শোষণ করে কঠিন A এর তাপমাত্রা বাড়ে । B বিন্দুতে 45°C এ A গলতে শুরু করে; সম্পূর্ণ কঠিন তরলে পরিণত না হওয়া পর্যন্ত তাপমাত্রা স্থির থাকে, কারণ প্রদত্ত তাপ অবস্থা পরিবর্তনে ব্যয় হয়। তাই BC রেখা গলনাঙ্ক রেখা। এরপর CD বরাবর তরলের তাপমাত্রা বাড়ে । D বিন্দুতে 95°C এ তরল ফুটতে শুরু করে এবং সম্পূর্ণ বাষ্পে পরিণত না হওয়া পর্যন্ত তাপমাত্রা স্থির থাকে; তাই DE রেখা স্ফুটনাঙ্ক রেখা। এরপর EF বরাবর বাষ্পের তাপমাত্রা বাড়তে থাকে।"},{"label":"ঘ","question":"উদ্দীপকে উল্লিখিত তাপমাত্রা দুটিতে পদার্থটির অবস্থার পরিবর্তন কণার গতিতত্ত্বের আলোকে বিশ্লেষণ কর।","answer":"কণার গতিতত্ত্ব অনুযায়ী, সকল পদার্থ অতি ক্ষুদ্র কণা দ্বারা গঠিত । কণাগুলোর মধ্যকার আন্তঃকণা আকর্ষণ শক্তি এবং কণার গতিশক্তির পার্থক্যের কারণেই পদার্থ কঠিন, তরল বা গ্যাসীয় অবস্থায় থাকে। তাপ দিলে কণার গতিশক্তি বাড়ে এবং আকর্ষণ শক্তি কমে। 45°C তাপমাত্রায় (গলনাঙ্ক): কঠিন A এর কণাগুলো খুব কাছাকাছি থেকে শক্তিশালী আকর্ষণ বলে আবদ্ধ থাকে এবং নিজ অবস্থানে কাঁপতে থাকে। তাপ দিলে কণাগুলো তাপশক্তি গ্রহণ করে আরও জোরে কাঁপতে থাকে। 45°C এ কম্পন এতটা বেড়ে যায় যে আন্তঃকণা আকর্ষণ শক্তি কিছুটা কমে যায় এবং কণাগুলো নিজ অবস্থান ছেড়ে একে অপরের উপর দিয়ে চলাচল করতে পারে। ফলে A গলে তরলে পরিণত হয়। এ সময় প্রদত্ত তাপ শুধু আকর্ষণ বল কমাতে ব্যয় হয়, তাই তাপমাত্রা স্থির থাকে এবং কঠিন ও তরল উভয় অবস্থা বিদ্যমান থাকে। 95°C তাপমাত্রায় (স্ফুটনাঙ্ক): তরল অবস্থায় আরও তাপ দিলে কণাগুলোর গতিশক্তি বাড়তে থাকে এবং আকর্ষণ শক্তি আরও কমে। 95°C এ কণাগুলো এত বেশি গতিশক্তি অর্জন করে যে তারা আন্তঃকণা আকর্ষণ বল থেকে প্রায় সম্পূর্ণ মুক্ত হয়ে বিক্ষিপ্তভাবে ছুটতে থাকে। ফলে A তরল থেকে বাষ্পে পরিণত হয়। সম্পূর্ণ তরল বাষ্প না হওয়া পর্যন্ত তাপমাত্রা স্থির থাকে এবং তরল ও গ্যাসীয় উভয় অবস্থা বিদ্যমান থাকে। সুতরাং, তাপ প্রয়োগে কণার গতিশক্তি বৃদ্ধি ও আন্তঃকণা আকর্ষণ শক্তি হ্রাসের ফলে 45°C এ A কঠিন থেকে তরলে এবং 95°C এ তরল থেকে গ্যাসীয় অবস্থায় পরিবর্তিত হয়।"}]},{"id":"ch2-cq4","chapter":2,"num":4,"importance":2,"topic":"গলন ও স্ফুটন","board":"ময়মনসিংহ বোর্ড ২০২৫","stem":"নিচের উদ্দীপকটি পড়ো এবং প্রশ্নগুলোর উত্তর দাও:","diagramId":"ch2-cq4","subQuestions":[{"label":"ক","question":"উর্ধ্বপাতন কাকে বলে?","answer":"যে প্রক্রিয়ায় কোনো কঠিন পদার্থকে তাপ দিলে তা তরলে পরিণত না হয়ে সরাসরি বাষ্পে পরিণত হয় এবং ঐ বাষ্পকে ঠান্ডা করলে আবার সরাসরি কঠিনে পরিণত হয়, তাকে ঊর্ধ্বপাতন বলে।"},{"label":"খ","question":"বডি স্প্রে ব্যবহারের সময় ব্যাপন এবং নিঃসরণের মধ্যে কোনটি আগে ঘটে?","answer":"বডি স্প্রে বোতলের ভেতরে উচ্চ চাপে থাকে। স্প্রে করার সময় প্রথমে সূক্ষ্ম ছিদ্রপথে সুগন্ধি কণা উচ্চ চাপ থেকে নিম্ন চাপে বের হয়ে আসে; এটি নিঃসরণ । এরপর বাইরে আসা সুগন্ধি কণা বাতাসের কণার সাথে মিশে চারদিকে ছড়িয়ে পড়ে; এটি ব্যাপন। সুতরাং বডি স্প্রে ব্যবহারের সময় আগে নিঃসরণ, পরে ব্যাপন ঘটে।"},{"label":"গ","question":"উদ্দীপকের (i) ও (ii) নং পদার্থের আন্তঃআণবিক আকর্ষণ শক্তি ব্যাখ্যা কর।","answer":"উদ্দীপকের (i) নং পদার্থ সাধারণ লবণ (NaCl) এবং (ii) নং পদার্থ বরফ বা কঠিন পানি (H₂O)। NaCl একটি আয়নিক যৌগ। এর কেলাসে Na+ ও Cl- আয়নগুলো তীব্র স্থির বৈদ্যুতিক আকর্ষণ বলে খুব দৃঢ়ভাবে আবদ্ধ থাকে। এ আকর্ষণ ভাঙতে অনেক বেশি তাপশক্তি লাগে, তাই NaCl এর গলনাঙ্ক অনেক বেশি (প্রায় 801°C)। বরফ সমযোজী যৌগ H₂O এর অণু দিয়ে গঠিত । এর অণুগুলোর মধ্যে আন্তঃআণবিক আকর্ষণ শক্তি আয়নিক আকর্ষণের তুলনায় অনেক দুর্বল । তাই অল্প তাপেই অর্থাৎ 0°C তাপমাত্রায় বরফ গলে পানি হয়। সুতরাং, উদ্দীপকের (i) নং পদার্থ NaCl এর কণাগুলোর মধ্যে আকর্ষণ শক্তি (ii) নং পদার্থ বরফের আন্তঃআণবিক আকর্ষণ শক্তির চেয়ে অনেক বেশি।"},{"label":"ঘ","question":"উদ্দীপকের (i) ও (iii) নং পদার্থের তাপ প্রদানের লেখচিত্র ভিন্ন– বিশ্লেষণ কর।","answer":"উদ্দীপকের (i) নং পদার্থ সাধারণ লবণ (NaCl) এবং (iii) নং পদার্থ কর্পূর । NaCl এর লেখচিত্র: NaCl অনুদ্বায়ী কঠিন পদার্থ । তাপ দিলে এটি প্রথমে কঠিন থেকে তরলে এবং পরে তরল থেকে বাষ্পে পরিণত হয়। তাই তাপমাত্রা বনাম সময় লেখচিত্রে —\n• AB অংশ: কঠিন NaCl এর তাপমাত্রা বাড়ে ।\n• BC অংশ (অনুভূমিক): গলনাঙ্কে কঠিন ও তরল একসাথে থাকে, তাপমাত্রা স্থির।\n• CD অংশ: তরল NaCl এর তাপমাত্রা বাড়ে ।\n• DE অংশ (অনুভূমিক): স্ফুটনাঙ্কে তরল ও বাষ্প একসাথে থাকে, তাপমাত্রা স্থির।\n• EF অংশ: বাষ্পের তাপমাত্রা বাড়ে ।\nঅর্থাৎ NaCl এর লেখচিত্রে দুটি অনুভূমিক রেখা পাওয়া যায়। কর্পূরের লেখচিত্র: কর্পূর ঊর্ধ্বপাতিত পদার্থ । তাপ দিলে এটি তরল না হয়ে সরাসরি বাষ্পে পরিণত হয়। তাই লেখচিত্রে —\n• AB অংশ: কঠিন কর্পূরের তাপমাত্রা বাড়ে ।\n• BC অংশ (অনুভূমিক): ঊর্ধ্বপাতন তাপমাত্রায় কঠিন ও বাষ্প একসাথে থাকে, তাপমাত্রা স্থির।\n• CD অংশ: বাষ্পের তাপমাত্রা বাড়ে ।\nঅর্থাৎ কর্পূরের লেখচিত্রে মাত্র একটি অনুভূমিক রেখা পাওয়া যায়, কোনো তরল অবস্থা নেই। সুতরাং, NaCl গলন ও স্ফুটন দুই ধাপে অবস্থা পরিবর্তন করে আর কর্পূর এক ধাপে ঊর্ধ্বপাতিত হয় বলে (i) ও (iii) নং পদার্থের তাপ প্রদানের লেখচিত্র ভিন্ন।"}]},{"id":"ch2-cq5","chapter":2,"num":5,"importance":2,"topic":"গলন ও স্ফুটন","board":"যশোর বোর্ড ২০২৪","stem":"একটি পদার্থের গলনাংক এবং স্ফুটনাংক যথাক্রমে 133°C ও 242°C, পদার্থটির আণবিক ভর 60।","subQuestions":[{"label":"ক","question":"মুক্তজোড় ইলেকট্রন কাকে বলে?","answer":"সমযোজী অণুতে কোনো পরমাণুর সর্ববহিঃস্থ শক্তিস্তরের যে ইলেকট্রন জোড় বন্ধন গঠনে অংশগ্রহণ করে না, তাকে মুক্তজোড় ইলেকট্রন বলে। যেমন: NH₃ অণুতে N পরমাণুর উপর একটি মুক্তজোড় ইলেকট্রন থাকে।"},{"label":"খ","question":"মৌমাছির কামড়ের ক্ষতস্থানে চুন ব্যবহার করা হয় কেন?","answer":"মৌমাছির হুলে এসিডধর্মী পদার্থ (ফরমিক এসিড বা মিথানয়িক এসিড, HCOOH) থাকে। মৌমাছি কামড় দিলে এই এসিড ক্ষতস্থানে প্রবেশ করে জ্বালা-যন্ত্রণা সৃষ্টি করে। চুন [Ca(OH)₂] একটি ক্ষার। ক্ষতস্থানে চুন লাগালে তা এসিডকে প্রশমিত করে লবণ ও পানি উৎপন্ন করে, ফলে জ্বালা-যন্ত্রণা কমে যায়।\n2HCOOH+Ca(OH)₂→(HCOO)₂Ca+2H₂O"},{"label":"গ","question":"উদ্দীপকে উল্লিখিত পদার্থটির তাপীয় বক্ররেখা অঙ্কনসহ বর্ণনা কর।","answer":"উদ্দীপকের পদার্থটির গলনাঙ্ক 133°C ও স্ফুটনাঙ্ক 242°C। অর্থাৎ সাধারণ তাপমাত্রায় পদার্থটি কঠিন ।\nতাপীয় বক্ররেখা অঙ্কন: X অক্ষে সময় ও Y অক্ষে তাপমাত্রা (°C) নিয়ে O থেকে B (133°C) পর্যন্ত ঊর্ধ্বমুখী ঢালু রেখা, B থেকে C পর্যন্ত 133°C বরাবর অনুভূমিক রেখা, C থেকে D (242°C) পর্যন্ত ঊর্ধ্বমুখী ঢালু রেখা, D থেকে E পর্যন্ত 242°C বরাবর অনুভূমিক রেখা এবং E থেকে F পর্যন্ত ঊর্ধ্বমুখী ঢালু রেখা। অংশ তাপমাত্রা অবস্থা OB 133°C পর্যন্ত বৃদ্ধি কঠিন BC 133°C এ স্থির (গলনাঙ্ক) কঠিন + তরল CD 133°C থেকে 242°C তরল DE 242°C এ স্থির (স্ফুটনাঙ্ক) তরল + গ্যাস EF 242°C এর বেশি গ্যাস (বাষ্প) বর্ণনা: OB বরাবর তাপ শোষণ করে কঠিন পদার্থের তাপমাত্রা বাড়ে । 133°C এ পদার্থটি গলতে শুরু করে এবং সম্পূর্ণ কঠিন তরলে পরিণত না হওয়া পর্যন্ত তাপমাত্রা স্থির থাকে, কারণ প্রদত্ত তাপ অবস্থা পরিবর্তনে ব্যয় হয়; তাই BC গলনাঙ্ক রেখা। এরপর CD বরাবর তরলের তাপমাত্রা বাড়ে । 242°C এ তরল ফুটতে থাকে এবং সম্পূর্ণ বাষ্পে পরিণত না হওয়া পর্যন্ত তাপমাত্রা স্থির থাকে; তাই DE স্ফুটনাঙ্ক রেখা। এরপর EF বরাবর বাষ্পের তাপমাত্রা বাড়ে । সুতরাং, বক্ররেখার অনুভূমিক অংশ দুটি পদার্থটির গলনাঙ্ক (133°C) ও স্ফুটনাঙ্ক (242°C) নির্দেশ করে ।"},{"label":"ঘ","question":"পদার্থটির তাপীয় বক্ররেখার প্রথম এবং শেষ বিন্দুতে কণাসমূহের মধ্যকার গতিশক্তির তুলনামূলক বিশ্লেষণ কর।","answer":"পদার্থটির তাপীয় বক্ররেখার প্রথম বিন্দু O, যেখানে পদার্থটি কঠিন অবস্থায় আছে এবং শেষ বিন্দু F, যেখানে পদার্থটি 242°C এর বেশি তাপমাত্রায় গ্যাসীয় অবস্থায় আছে। O বিন্দু (কঠিন): কঠিন অবস্থায় কণাগুলো খুব কাছাকাছি ও নির্দিষ্ট অবস্থানে থাকে। আন্তঃকণা আকর্ষণ শক্তি খুব বেশি হওয়ায় কণাগুলো স্থান পরিবর্তন করতে পারে না, কেবল নিজ অবস্থানে কাঁপতে থাকে। তাই এ বিন্দুতে কণাগুলোর গতিশক্তি সবচেয়ে কম। F বিন্দু (গ্যাস): O থেকে F পর্যন্ত পদার্থটি ক্রমাগত তাপ শোষণ করেছে। তাপ শোষণে কণাগুলোর গতিশক্তি বাড়তে বাড়তে 133°C এ পদার্থ গলে তরল হয় এবং 242°C এ কণাগুলো আকর্ষণ বল ছিন্ন করে বাষ্পে পরিণত হয়। গ্যাসীয় অবস্থায় কণাগুলো পরস্পর থেকে অনেক দূরে থাকে, আন্তঃকণা আকর্ষণ শক্তি নেই বললেই চলে এবং কণাগুলো মুক্তভাবে বিক্ষিপ্তভাবে ছুটাছুটি করে। তাই এ বিন্দুতে কণাগুলোর গতিশক্তি সবচেয়ে বেশি। বিষয় প্রথম বিন্দু O (কঠিন) শেষ বিন্দু F (গ্যাস) কণার গতিশক্তি সবচেয়ে কম সবচেয়ে বেশি আন্তঃকণা আকর্ষণ সবচেয়ে বেশি নেই বললেই চলে শক্তি কণার গতি শুধু নিজ স্থানে কম্পন মুক্তভাবে ছুটাছুটি সুতরাং, তাপীয় বক্ররেখার প্রথম বিন্দু থেকে শেষ বিন্দুর দিকে তাপমাত্রা বাড়ার সাথে সাথে কণাগুলোর গতিশক্তি বৃদ্ধি পায়; প্রথম বিন্দুতে গতিশক্তি সর্বনিম্ন এবং শেষ বিন্দুতে সর্বোচ্চ।"}]},{"id":"ch2-cq6","chapter":2,"num":6,"importance":2,"topic":"পাতন এবং ঊর্ধ্বপাতন","board":"যশোর বোর্ড ২০২৪","stem":"Ni, Δ\nC₂H₂+H₂⟶X(g)\nΔ\nS+O₂⟶Y(g)\nΔ\nN₂+H₂⟶Z(g)\nZ+HCl→M","subQuestions":[{"label":"ক","question":"ইলেকট্রন আসক্তি কী?","answer":"গ্যাসীয় অবস্থায় এক মোল বিচ্ছিন্ন পরমাণুতে এক মোল ইলেকট্রন যুক্ত হয়ে এক মোল ঋণাত্মক আয়নে পরিণত হওয়ার সময় যে শক্তি নির্গত হয়, তাকে ইলেকট্রন আসক্তি বলে।"},{"label":"খ","question":"আর্গন একটি নিষ্ক্রিয় গ্যাস কেন? ব্যাখ্যা কর।","answer":"আর্গনের (Ar, পারমাণবিক সংখ্যা 18) ইলেকট্রন বিন্যাস 1s² 2s² 2p⁶ 3s² 3p⁶। এর সর্ববহিঃস্থ শক্তিস্তরে ৮টি ইলেকট্রন আছে, অর্থাৎ অষ্টক পূর্ণ ও স্থিতিশীল । ফলে আর্গন ইলেকট্রন গ্রহণ, ত্যাগ বা শেয়ার করতে চায় না এবং সাধারণত কোনো রাসায়নিক বিক্রিয়ায় অংশ নেয় না। তাই আর্গন একটি নিষ্ক্রিয় গ্যাস ।"},{"label":"গ","question":"X, Y ও Z এর ব্যাপন হারের ক্রম ব্যাখ্যা কর।","answer":"উদ্দীপকের বিক্রিয়াগুলো —\nNi, Δ\nC₂H₂+2H₂⟶C₂H₆\nΔ\nS+O₂⟶SO₂\nΔ\nN₂+3H₂⟶2NH₃\nঅতএব X = ইথেন (C₂H₆), Y = সালফার ডাই-অক্সাইড (SO₂), Z = অ্যামোনিয়া (NH₃)। আণবিক ভর: C₂H₆ = (12 × 2) + (1 × 6) = 30 SO₂=32+(16×2)=64 NH₃=14+(1×3)=17 গ্রাহামের ব্যাপন সূত্র অনুযায়ী, একই তাপমাত্রা ও চাপে গ্যাসের ব্যাপন হার তার আণবিক ভরের বর্গমূলের ব্যস্তানুপাতিক (r ∝ 1/√M)। অর্থাৎ আণবিক ভর যত কম, ব্যাপন হার তত বেশি। আণবিক ভর: NH₃ (17) \u003c C₂H₆ (30) \u003c SO₂ (64) সুতরাং ব্যাপন হারের ক্রম: NH₃ \u003e C₂H₆ \u003e SO₂, অর্থাৎ Z \u003e X \u003e Y।"},{"label":"ঘ","question":"M যৌগের তাপীয় বক্ররেখা খাবার লবণের তাপীয় বক্ররেখা থেকে ভিন্ন-বিশ্লেষণ কর।","answer":"Z (NH₃) এর সাথে HCl বিক্রিয়া করে M উৎপন্ন করে—\nNH₃+HCl→NH₄Cl\nঅতএব M = অ্যামোনিয়াম ক্লোরাইড বা নিশাদল (NH₄Cl), যা একটি উদ্বায়ী (ঊর্ধ্বপাতিত) পদার্থ । খাবার লবণের (NaCl) তাপীয় বক্ররেখা: কঠিন NaCl এ তাপ দিলে প্রথমে তাপমাত্রা বাড়ে (OB)। গলনাঙ্কে কঠিন NaCl গলে তরল হয়, এ সময় তাপমাত্রা স্থির থাকে (BC অনুভূমিক)। এরপর তরলের তাপমাত্রা বাড়ে (CD)। স্ফুটনাঙ্কে তরল NaCl বাষ্পে পরিণত হয়, তাপমাত্রা আবার স্থির থাকে (DE অনুভূমিক)। পরে বাষ্পের তাপমাত্রা বাড়ে (EF)। ফলে দুটি অনুভূমিক রেখা (BC ও DE) পাওয়া যায়। নিশাদলের (NH₄Cl) তাপীয় বক্ররেখা: কঠিন নিশাদলে তাপ দিলে তাপমাত্রা বাড়ে (AB)। এরপর কঠিন নিশাদল তরল না হয়ে সরাসরি বাষ্পে পরিণত হয়, এ সময় তাপমাত্রা স্থির থাকে (BC অনুভূমিক)। পরে বাষ্পের তাপমাত্রা বাড়ে (CD)। কোনো তরল অবস্থা না থাকায় মাত্র একটি অনুভূমিক রেখা (BC) পাওয়া যায়। অতএব, ঊর্ধ্বপাতিত পদার্থ হওয়ায় M (NH₄Cl) এর তাপীয় বক্ররেখায় একটি এবং খাবার লবণের বক্ররেখায় দুটি অনুভূমিক রেখা থাকে; তাই M যৌগের তাপীয় বক্ররেখা খাবার লবণের তাপীয় বক্ররেখা থেকে ভিন্ন।"}]},{"id":"ch3-cq1","chapter":3,"num":1,"importance":2,"topic":"পরমাণুর সাংগঠনিক কণা","board":"চট্টগ্রাম বোর্ড ২০২৪","stem":"মৌল প্রোটন সংখ্যা নিউট্রন সংখ্যা নিউক্লিয়াসের ভর Q 9 10 – R – 16 5.1895 × 10⁻²³ g [এখানে Q ও R প্রতীকী অর্থে]","subQuestions":[{"label":"ক","question":"ত্রয়ী সূত্রটি লেখ।","answer":"তিনটি সমধর্মী মৌলকে পারমাণবিক ভরের ঊর্ধ্বক্রমে সাজালে মাঝের মৌলটির পারমাণবিক ভর অপর দুটির পারমাণবিক ভরের গড়ের প্রায় সমান হয়— এটিই ডোবেরাইনারের ত্রয়ী সূত্র।"},{"label":"খ","question":"তৃতীয় শক্তিস্তরে 'f' অরবিটাল থাকে না কেন? ব্যাখ্যা কর।","answer":"কোনো শক্তিস্তরের (n) উপস্তরের সংখ্যা n টি এবং l এর মান 0 থেকে (n - 1) পর্যন্ত হয়। তৃতীয় শক্তিস্তরে n = 3, তাই l = 0, 1, 2 অর্থাৎ কেবল s, p ও d অরবিটাল থাকে। f অরবিটালের জন্য l = 3 প্রয়োজন, যা কেবল n = 4 বা তার বেশি হলে সম্ভব । তাই তৃতীয় শক্তিস্তরে f অরবিটাল থাকে না।"},{"label":"গ","question":"প্রোটন ও নিউট্রনের প্রকৃত ভর ব্যবহার করে 'Q' মৌলটির 1টি অণুর ভর নির্ণয় কর।","answer":"উদ্দীপকের Q-এর প্রোটন সংখ্যা 9, অর্থাৎ পারমাণবিক সংখ্যা 9। তাই Q হলো ফ্লোরিন (F)। ফ্লোরিন দ্বিপরমাণুক, তাই এর 1টি অণু = F₂।\nদেওয়া আছে: প্রোটন = 9টি, নিউট্রন = 10টি; প্রোটনের ভর =1.673×10⁻²⁴g, নিউট্রনের ভর =1.675×10⁻²⁴g। 1টি Q পরমাণুর ভর =(9×1.673×10⁻²⁴+10×1.675× 10⁻²⁴)g =(15.057+16.750)×10⁻²⁴g=3.1807×10⁻²³g 1টি Q2 (F₂) অণুর ভর =2×3.1807×10⁻²³g=6.3614×10⁻²³g ইলেকট্রনের ভর (9×9.11×10⁻²⁸g=8.2×10⁻²⁷g) নগণ্য; তা যোগ করলেও পরমাণুর ভর 3.1815 × 10⁻²³ g এবং অণুর ভর প্রায় 6.363 × 10⁻²³ g হয়। সুতরাং, Q মৌলটির 1টি অণুর ভর প্রায় 6.36 × 10⁻²³ g।"},{"label":"ঘ","question":"গাণিতিক বিশ্লেষণের মাধ্যমে 'R' মৌলটি শনাক্ত করে এর সংকেত লেখ।","answer":"উদ্দীপকের R-এর নিউট্রন সংখ্যা 16 এবং নিউক্লিয়াসের ভর 5.1895 × 10⁻²³ g। নিউক্লিয়াসে প্রোটন ও নিউট্রন থাকে । 16টি নিউট্রনের মোট ভর =16×1.675×10⁻²⁴g=2.68×10⁻²³g প্রোটনগুলোর মোট ভর =(5.1895×10⁻²³-2.68× 10⁻²³)g=2.5095×10⁻²³g প্রোটন সংখ্যা =2.5095×10⁻²³÷1.673×10⁻²⁴=15 অতএব R-এর পারমাণবিক সংখ্যা Z = 15, যা ফসফরাসের (P) পারমাণবিক সংখ্যা। তাই R হলো ফসফরাস (P)। ভরসংখ্যা, A = প্রোটন + নিউট্রন =15+16=31 সুতরাং, R মৌলটি ফসফরাস এবং এর সংকেত (সংক্ষিপ্ত প্রকাশ) ³¹15P। (ফসফরাসের অণু চার পরমাণুক, আণবিক সংকেত P₄।)"}]},{"id":"ch3-cq2","chapter":3,"num":2,"importance":3,"topic":"পরমাণুর মডেল","board":"চট্টগ্রাম বোর্ড ২০২৬","stem":"[h=6.626×10⁻³⁴ m²kg/s]","diagramId":"ch3-cq2","subQuestions":[{"label":"ক","question":"আইসোটোপ কাকে বলে?","answer":"আইসোটোপ: যেসব পরমাণুর প্রোটন সংখ্যা (পারমাণবিক সংখ্যা) সমান কিন্তু ভরসংখ্যা ভিন্ন, তাদেরকে পরস্পরের আইসোটোপ বলে।\nযেমন: 1H₁, 1H₂, 1H₃।"},{"label":"খ","question":"Cr এর ইলেকট্রন বিন্যাসে ব্যতিক্রমতা পরিলক্ষিত হয় —ব্যাখ্যা কর।","answer":"আউফবাউ নীতি অনুসারে Cr (24) এর ইলেকট্রন বিন্যাস হওয়ার কথা: Cr (24) : 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁴ 4s² কিন্তু বাস্তবে Cr এর ইলেকট্রন বিন্যাস: Cr (24) : 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁵ 4s¹ d অরবিটাল অর্ধপূর্ণ (d5) বা সম্পূর্ণ পূর্ণ (d10) হলে পরমাণু বেশি স্থিতিশীল হয়। তাই 4s অরবিটাল থেকে 1টি ইলেকট্রন 3d অরবিটালে গিয়ে 3d কে অর্ধপূর্ণ করে। এজন্য Cr এর ইলেকট্রন বিন্যাসে ব্যতিক্রম দেখা যায়।"},{"label":"গ","question":"পরমাণু মডেল (ii) অনুসারে সর্বশেষ শক্তিস্তরের একটি ইলেকট্রনের কৌণিক ভরবেগ নির্ণয় কর।","answer":"উদ্দীপকের পরমাণু মডেল (ii) হলো বোর পরমাণু মডেল। এ মডেলে সর্বশেষ শক্তিস্তর n = 3। বোর মডেল অনুসারে n তম কক্ষপথে ইলেকট্রনের কৌণিক ভরবেগ, mvr=nh/2π\nএখানে, n = 3, h=6.626×10⁻³⁴ m²kg/s, π = 3.1416 mvr=(3×6.626×10⁻³⁴)/(2×3.1416) =(19.878×10⁻³⁴)/6.2832 =3.164×10⁻³⁴kg m² s⁻¹ সুতরাং মডেল (ii) এর সর্বশেষ শক্তিস্তরের একটি ইলেকট্রনের কৌণিক ভরবেগ 3.164 × 10⁻³⁴kg m² s⁻¹।"},{"label":"ঘ","question":"পরমাণুর গঠন ব্যাখ্যায় (i) নং মডেল অপেক্ষা (ii) নং মডেলটি অধিকতর গ্রহণযোগ্য —বিশ্লেষণ কর।","answer":"উদ্দীপকের মডেল (i) হলো রাদারফোর্ডের পরমাণু মডেল এবং মডেল (ii) হলো বোরের পরমাণু মডেল। পরমাণুর গঠন ব্যাখ্যায় বোর মডেল রাদারফোর্ড মডেল অপেক্ষা অধিকতর গ্রহণযোগ্য । নিচে বিশ্লেষণ করা হলো:\n১. রাদারফোর্ড মডেলে ইলেকট্রনগুলো নিউক্লিয়াসের চারদিকে ঘুরছে বলা হলেও কোন কক্ষপথে, কত শক্তি নিয়ে ঘুরছে তা বলা হয়নি । বোর মডেলে বলা হয়েছে ইলেকট্রন কেবল নির্দিষ্ট শক্তিসম্পন্ন বৃত্তাকার কক্ষপথে (শক্তিস্তর n = 1, 2, 3 …) ঘোরে।\n২. ম্যাক্সওয়েলের তত্ত্ব অনুসারে ঘূর্ণায়মান চার্জিত কণা ক্রমাগত শক্তি বিকিরণ করে । তাহলে রাদারফোর্ড মডেলের ইলেকট্রন শক্তি হারিয়ে সর্পিল পথে নিউক্লিয়াসে পতিত হতো এবং পরমাণু স্থায়ী হতো না। রাদারফোর্ড মডেল এ সমস্যার ব্যাখ্যা দিতে পারেনি।\n৩. বোর মডেল অনুসারে নির্দিষ্ট শক্তিস্তরে (স্থির কক্ষপথে) ঘোরার সময় ইলেকট্রন শক্তি শোষণ বা বিকিরণ করে না; ফলে পরমাণু স্থিতিশীল থাকে।\n৪. বোর মডেলে ইলেকট্রনের কৌণিক ভরবেগ নির্দিষ্ট, mvr=nh/2π, যা দিয়ে উপরের গ-অংশের মতো গণনা করা যায়। রাদারফোর্ড মডেলে এরূপ কোনো শর্ত নেই। ৫. বোর মডেলে ইলেকট্রন উচ্চ শক্তিস্তর থেকে নিম্ন শক্তিস্তরে নামলে শক্তির পার্থক্যের সমান শক্তি আলোকরশ্মি হিসেবে বিকিরণ করে (ΔE = E2 - E1 = hν)। উদ্দীপকের মডেল (ii) এ n = 3 থেকে n =2 এ ইলেকট্রনের অবনমন ও শক্তি বিকিরণ দেখানো হয়েছে । এ ধারণা দিয়ে হাইড্রোজেনের পারমাণবিক বর্ণালি ব্যাখ্যা করা যায়, যা রাদারফোর্ড মডেল পারেনি। সুতরাং পরমাণুর স্থিতিশীলতা, ইলেকট্রনের নির্দিষ্ট শক্তিস্তর ও বর্ণালি ব্যাখ্যা করতে পারায় পরমাণুর গঠন ব্যাখ্যায় (i) নং মডেল অপেক্ষা (ii) নং মডেলটি অধিকতর গ্রহণযোগ্য ।"}]},{"id":"ch3-cq3","chapter":3,"num":3,"importance":3,"topic":"পরমাণুর মডেল","board":"ঢাকা বোর্ড ২০২৬","stem":"নিম্নোক্ত উদ্দীপকটি লক্ষ কর : A-কক্ষপথের ব্যাসার্ধ 4.52 × 10⁻¹⁰ m, আবার ইলেকট্রনের ভর ও প্লাঙ্ক ধ্রুবকের মান যথাক্রমে 9.1 × 10⁻²⁸ g ও 6.626 × 10⁻³⁴ m²kg/s।","diagramId":"ch3-cq3","subQuestions":[{"label":"ক","question":"সমযোজী বন্ধন কী?","answer":"দুটি পরমাণু প্রত্যেকে সমান সংখ্যক ইলেকট্রন শেয়ার করে ইলেকট্রন যুগল সৃষ্টি করে এবং সেই ইলেকট্রন যুগল উভয় পরমাণু সমভাবে ব্যবহার করে যে বন্ধন গঠন করে, তাকে সমযোজী বন্ধন বলে।"},{"label":"খ","question":"Ne অন্য মৌলের সাথে যৌগ গঠন করে না কেন?","answer":"Ne (10) এর ইলেকট্রন বিন্যাস: 1s² 2s² 2p⁶। এর সর্ববহিঃস্থ শক্তিস্তরে 8টি ইলেকট্রন আছে, অর্থাৎ Ne এর অষ্টক পূর্ণ। পূর্ণ অষ্টকের কারণে Ne অত্যন্ত স্থিতিশীল । ফলে এটি ইলেকট্রন গ্রহণ, ত্যাগ বা শেয়ার করার প্রবণতা দেখায় না। এর যোজনী শূন্য। তাই নিষ্ক্রিয় গ্যাস Ne অন্য মৌলের সাথে রাসায়নিক বন্ধন গঠন করে যৌগ তৈরি করে না।"},{"label":"গ","question":"উদ্দীপকের ‘A’ কক্ষপথে ঘূর্ণায়মান ইলেকট্রনটির গতিবেগ হিসাব কর।","answer":"উদ্দীপকের চিত্রটি বোর পরমাণু মডেল। চিত্রে নিউক্লিয়াসের চারদিকে তিনটি কক্ষপথ আছে এবং A হলো নিউক্লিয়াস থেকে তৃতীয় কক্ষপথ । সুতরাং A কক্ষপথের জন্য n = 3। বোর মতবাদ অনুসারে, ইলেকট্রনের কৌণিক ভরবেগ mvr=nh/2π।\n∴ v=nh/2πmr\nএখানে,\n• কক্ষপথের ক্রমিক সংখ্যা, n = 3\n• প্লাঙ্ক ধ্রুবক, h=6.626×10⁻³⁴ m²kg/s\n• ইলেকট্রনের ভর, m=9.1×10⁻²⁸g=9.1×10⁻³¹kg\n• কক্ষপথের ব্যাসার্ধ, r=4.52×10⁻¹⁰m\n• π = 3.1416 v=(3×6.626×10⁻³⁴)/(2×3.1416×9.1×10⁻³¹×4.52×10⁻¹⁰)m/s =(1.9878×10⁻³³)/(2.5844×10⁻³⁹)m/s =7.69×105m/s অতএব, উদ্দীপকের ‘A’ কক্ষপথে ঘূর্ণায়মান ইলেকট্রনটির গতিবেগ 7.69 × 10⁵ m/s।"},{"label":"ঘ","question":"“উদ্দীপকের পরমাণু মডেলটি পরমাণুর গঠন বিশ্লেষণে আধুনিক রসায়নে অতি গুরুত্বপূর্ণ ভূমিকা পালন করে ”—উক্তিটির যথার্থতা যাচাই কর।","answer":"উদ্দীপকের পরমাণু মডেলটি হলো নীলস বোর প্রস্তাবিত বোর পরমাণু মডেল (1913)। রাদারফোর্ড মডেলের সীমাবদ্ধতা দূর করে এ মডেল পরমাণুর গঠন ব্যাখ্যা করে। এর মূল প্রস্তাবনা নিম্নরূপ:\n১. ইলেকট্রন নিউক্লিয়াসের চারদিকে কয়েকটি নির্দিষ্ট শক্তির বৃত্তাকার কক্ষপথে ঘোরে । এ কক্ষপথগুলোকে শক্তিস্তর বা স্থির কক্ষপথ বলে। স্থির কক্ষপথে ঘোরার সময় ইলেকট্রন শক্তি শোষণ বা বিকিরণ করে না।\n২. ইলেকট্রন কেবল সেসব কক্ষপথেই ঘুরতে পারে যেখানে তার কৌণিক ভরবেগ h/2π এর পূর্ণ সংখ্যার গুণিতক, অর্থাৎ mvr= nh/2π।\n৩. ইলেকট্রন উচ্চ শক্তিস্তর থেকে নিম্ন শক্তিস্তরে নেমে এলে দুই স্তরের শক্তির পার্থক্যের সমান শক্তি আলোকরশ্মি (ফোটন) হিসেবে বিকিরণ করে; আবার শক্তি শোষণ করে নিম্ন স্তর থেকে উচ্চ স্তরে যায়। উদ্দীপকের চিত্রেও ইলেকট্রন A কক্ষপথ থেকে নিচের কক্ষপথে নামার সময় শক্তি বিকিরণ দেখানো হয়েছে । ΔE = E2 - E1 = hν আধুনিক রসায়নে গুরুত্ব\n• রাদারফোর্ড মডেল অনুযায়ী ঘূর্ণায়মান ইলেকট্রন ক্রমাগত শক্তি হারিয়ে নিউক্লিয়াসে পতিত হওয়ার কথা; বোর মডেল স্থির কক্ষপথের ধারণা দিয়ে পরমাণুর স্থায়িত্ব ব্যাখ্যা করে।\n• এ মডেল হাইড্রোজেন পরমাণুর রৈখিক বর্ণালির সফল ব্যাখ্যা দেয়।\n• শক্তিস্তর বা কোয়ান্টাম সংখ্যার (n) ধারণা থেকেই শক্তিস্তরে ইলেকট্রন বিন্যাস (2n² নিয়ম), যোজ্যতা ইলেকট্রন, পর্যায় সারণিতে মৌলের অবস্থান এবং রাসায়নিক বন্ধন ব্যাখ্যা করা সম্ভব হয়েছে ।\n• এ মডেল থেকে ইলেকট্রনের কক্ষপথের ব্যাসার্ধ, গতিবেগ ও শক্তি হিসাব করা যায় (যেমন: গ অংশে A কক্ষপথে ইলেকট্রনের বেগ নির্ণয় করা হয়েছে)।\n• এর পরবর্তী উন্নতির মাধ্যমেই উপশক্তিস্তর ও অরবিটালভিত্তিক আধুনিক পরমাণু তত্ত্ব গড়ে উঠেছে । তবে বোর মডেল একাধিক ইলেকট্রনবিশিষ্ট পরমাণুর বর্ণালি ব্যাখ্যা করতে পারে না এবং এটি ইলেকট্রনকে শুধু বৃত্তাকার কক্ষপথে বিবেচনা করে। এ সীমাবদ্ধতা সত্ত্বেও পরমাণুর গঠন, শক্তিস্তর ও ইলেকট্রন বিন্যাস বোঝার ভিত্তি এ মডেলই স্থাপন করেছে । সুতরাং, “উদ্দীপকের পরমাণু মডেলটি পরমাণুর গঠন বিশ্লেষণে আধুনিক রসায়নে অতি গুরুত্বপূর্ণ ভূমিকা পালন করে ”—উক্তিটি যথার্থ ।"}]},{"id":"ch3-cq4","chapter":3,"num":4,"importance":3,"topic":"পরমাণুর মডেল","board":"মাদ্রাসা বোর্ড ২০২৬","stem":"প্রেক্ষাপট-১: একটি পরমাণুর মডেল প্রেক্ষাপট-২: প্রকৃতিতে কপারের দুটি আইসোটোপ আছে 63Cu এবং 65Cu। প্রকৃতিতে এদের প্রাপ্যতার শতকরা পরিমাণ যথাক্রমে 75% ও 25%।","diagramId":"ch3-cq4","subQuestions":[{"label":"ক","question":"মেন্ডেলিফের পর্যায় সূত্রটি লেখ।","answer":"মেন্ডেলিফের পর্যায় সূত্র: মৌলসমূহের ভৌত ও রাসায়নিক ধর্মাবলি তাদের পারমাণবিক ভর অনুসারে পর্যায়ক্রমে আবর্তিত হয়।"},{"label":"খ","question":"Cu(29)-এর ইলেকট্রন বিন্যাস সাধারণ নিয়মের ব্যতিক্রম — ব্যাখ্যা কর।","answer":"সাধারণ নিয়ম (আউফবাউ নীতি) অনুসারে Cu(29) এর ইলেকট্রন বিন্যাস হওয়ার কথা: Cu(29) : 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁹ 4s² কিন্তু d অরবিটাল সম্পূর্ণ পূর্ণ (d10) হলে তা অধিক স্থিতিশীল হয়। তাই 4s অরবিটালের একটি ইলেকট্রন 3d অরবিটালে চলে যায় এবং প্রকৃত বিন্যাস হয়: Cu(29) : 1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹⁰ 4s¹ এজন্য Cu এর ইলেকট্রন বিন্যাস সাধারণ নিয়মের ব্যতিক্রম ।"},{"label":"গ","question":"প্রেক্ষাপট-২-এর মৌলটির আপেক্ষিক পারমাণবিক ভর নির্ণয় কর।","answer":"প্রেক্ষাপট-২ এর মৌলটি কপার (Cu)। এর দুটি আইসোটোপ: আইসোটোপ ভর সংখ্যা প্রাপ্যতা 63Cu 63 75% 65Cu 65 25% কোনো মৌলের আপেক্ষিক পারমাণবিক ভর = প্রতিটি আইসোটোপের ভর × শতকরা প্রাপ্যতার যোগফল / 100 Cu এর আপেক্ষিক পারমাণবিক ভর =(63×75+65×25)/100 =(4725+1625)/100 =6350/100 = 63.5 সুতরাং প্রেক্ষাপট-২ এর মৌলটির (Cu) আপেক্ষিক পারমাণবিক ভর 63.5।"},{"label":"ঘ","question":"প্রেক্ষাপট-১-এর মডেলের সীমাবদ্ধতা ও সফলতা বিশ্লেষণ কর।","answer":"প্রেক্ষাপট-১ এর মডেলে কেন্দ্রে ধনাত্মক চার্জযুক্ত নিউক্লিয়াস এবং তার চারদিকে n = 1, n = 2 ইত্যাদি নির্দিষ্ট শক্তিস্তরে ইলেকট্রন ঘুরছে, আর ইলেকট্রন এক কক্ষপথ থেকে অন্য কক্ষপথে লাফ দিয়ে শক্তি শোষণ বা বিকিরণ করছে। এটি বোর পরমাণু মডেল। সফলতা\n১. বোর মডেল রাদারফোর্ড মডেলের প্রধান ত্রুটি দূর করে। ইলেকট্রন নির্দিষ্ট শক্তির স্থির কক্ষপথে ঘুরলে শক্তি বিকিরণ করে না, তাই নিউক্লিয়াসে পতিত হয় না; এতে পরমাণুর স্থায়িত্ব ব্যাখ্যা করা যায়।\n২. এ মডেল প্রথম শক্তিস্তর বা কক্ষপথের কোয়ান্টায়ন (n = 1, 2, 3 ...) এর ধারণা দেয়।\n৩. ইলেকট্রন উচ্চ শক্তিস্তর থেকে নিম্ন শক্তিস্তরে গেলে নির্দিষ্ট পরিমাণ শক্তি বিকিরণ করে (ΔE = E2 - E1 = hν), যা দিয়ে হাইড্রোজেনের রেখা বর্ণালি সফলভাবে ব্যাখ্যা করা যায়।\n৪. এ মডেলের মাধ্যমে হাইড্রোজেন পরমাণুর বিভিন্ন কক্ষপথের ব্যাসার্ধ ও শক্তি হিসাব করা যায়। সীমাবদ্ধতা\n১. বোর মডেল কেবল এক ইলেকট্রনবিশিষ্ট পরমাণু বা আয়নের (H, He⁺, Li²⁺) বর্ণালি ব্যাখ্যা করতে পারে; একাধিক ইলেকট্রনবিশিষ্ট পরমাণুর বর্ণালি ব্যাখ্যা করতে পারে না।\n২. শক্তিশালী বিশ্লেষণ যন্ত্রে হাইড্রোজেন বর্ণালির প্রতিটি রেখা কয়েকটি সূক্ষ্ম রেখায় বিভক্ত দেখা যায়; বোর মডেল এর কারণ ব্যাখ্যা করতে পারে না।\n৩. চৌম্বক ক্ষেত্র ও তড়িৎ ক্ষেত্রের প্রভাবে বর্ণালি রেখার বিভাজন (জিম্যান ও স্টার্ক প্রভাব) এ মডেল দ্বারা ব্যাখ্যা করা যায় না।\n৪. এ মডেলে ইলেকট্রনকে নির্দিষ্ট বৃত্তাকার পথে নির্দিষ্ট অবস্থানে ধরা হয়েছে, যা হাইজেনবার্গের অনিশ্চয়তা নীতি ও ইলেকট্রনের তরঙ্গধর্মের সাথে সামঞ্জস্যপূর্ণ নয়। ৫. অণুতে পরমাণুগুলো কীভাবে রাসায়নিক বন্ধনে যুক্ত হয় তা এ মডেল ব্যাখ্যা করতে পারে না। সুতরাং বোর মডেল পরমাণুর স্থায়িত্ব ও হাইড্রোজেনের বর্ণালি ব্যাখ্যায় সফল হলেও বহু-ইলেকট্রনবিশিষ্ট পরমাণুর ক্ষেত্রে এর সীমাবদ্ধতা রয়েছে ।"}]},{"id":"ch3-cq5","chapter":3,"num":5,"importance":3,"topic":"পরমাণুর মডেল","board":"দিনাজপুর বোর্ড ২০২৪","stem":"[এখানে, h=6.626×10⁻³⁴ m²kg/s]","diagramId":"ch3-cq5","subQuestions":[{"label":"ক","question":"ওয়াশিং সোডা কাকে বলে?","answer":"সোডিয়াম কার্বনেটের দশ অণু পানিযুক্ত কেলাসকে ওয়াশিং সোডা বলে। এর সংকেত Na₂CO₃·10H₂O।"},{"label":"খ","question":"Rb কে ক্ষার ধাতু বলা হয় কেন?","answer":"রুবিডিয়াম (Rb) পর্যায় সারণির গ্রুপ-1 এর মৌল। এর ইলেকট্রন বিন্যাসে সর্ববহিঃস্থ শক্তিস্তরে মাত্র 1টি ইলেকট্রন (5s1) থাকে, যা সহজে ত্যাগ করে Rb⁺ আয়ন গঠন করে। তাই এটি অত্যন্ত সক্রিয় ধাতু। Rb পানির সাথে তীব্রভাবে বিক্রিয়া করে তীব্র ক্ষার রুবিডিয়াম হাইড্রক্সাইড (RbOH) উৎপন্ন করে।\n2Rb+2H₂O→2RbOH+H₂\nগ্রুপ-1 এর যেসব ধাতু পানির সাথে বিক্রিয়া করে ক্ষার তৈরি করে, তাদের ক্ষার ধাতু বলে। তাই Rb কে ক্ষার ধাতু বলা হয়।"},{"label":"গ","question":"'B' মডেলের সর্বশেষ শক্তিস্তরে ইলেকট্রনের কৌণিক ভরবেগ নির্ণয় কর।","answer":"উদ্দীপকের B মডেলে নিউক্লিয়াসের চারদিকে n = 1 ও n = 2 দুটি বৃত্তাকার কক্ষপথ আছে। সুতরাং এর সর্বশেষ শক্তিস্তর হলো দ্বিতীয় প্রধান শক্তিস্তর, অর্থাৎ n = 2। বোর পরমাণু মডেল অনুসারে, কক্ষপথে আবর্তনশীল ইলেকট্রনের কৌণিক ভরবেগ, mvr=nh/2π\nদেওয়া আছে: n = 2; h=6.626×10⁻³⁴ m²kg/s; π = 3.1416 কৌণিক ভরবেগ, mvr=nh/2π =(2×6.626×10⁻³⁴)/(2×3.1416) =2.11×10⁻³⁴ m²kg/s সুতরাং, B মডেলের সর্বশেষ শক্তিস্তরে ইলেকট্রনের কৌণিক ভরবেগ 2.11 × 10⁻³⁴ m²kg/s।"},{"label":"ঘ","question":"'A' ও 'B' মডেলের কোনটি অধিক উপযোগী? বিশ্লেষণ কর।","answer":"উদ্দীপকের A মডেলটি রাদারফোর্ডের পরমাণু মডেল এবং B মডেলটি বোরের পরমাণু মডেল । এদের মধ্যে B মডেল (বোর মডেল) অধিক উপযোগী । রাদারফোর্ড মডেল অনুসারে, পরমাণুর কেন্দ্রে ধনাত্মক চার্জযুক্ত নিউক্লিয়াস থাকে এবং ইলেকট্রনগুলো সৌরজগতের গ্রহের মতো নিউক্লিয়াসকে কেন্দ্র করে ঘোরে । কিন্তু এ মডেলের কিছু সীমাবদ্ধতা আছে:\n• ইলেকট্রনের কক্ষপথের আকার ও আকৃতি সম্পর্কে কোনো ধারণা দেওয়া হয়নি ।\n• ম্যাক্সওয়েলের তত্ত্ব অনুসারে ঘূর্ণায়মান চার্জিত কণা ক্রমাগত শক্তি বিকিরণ করবে, ফলে ইলেকট্রন ঘুরতে ঘুরতে একসময় নিউক্লিয়াসে পতিত হবে। অর্থাৎ এ মডেল পরমাণুর স্থায়িত্ব ব্যাখ্যা করতে পারে না।\n• একাধিক ইলেকট্রনবিশিষ্ট পরমাণুতে ইলেকট্রনগুলো কীভাবে বিন্যস্ত থাকে, তা বলা হয়নি ।\n• পরমাণুর রেখা বর্ণালি ব্যাখ্যা করা যায় না। বোর মডেল এসব সীমাবদ্ধতা দূর করে:\n• ইলেকট্রন নিউক্লিয়াসের চারদিকে নির্দিষ্ট শক্তিসম্পন্ন কতকগুলো স্থায়ী বৃত্তাকার কক্ষপথে ঘোরে; স্থায়ী কক্ষপথে ঘোরার সময় ইলেকট্রন শক্তি শোষণ বা বিকিরণ করে না। ফলে পরমাণুর স্থায়িত্ব ব্যাখ্যা করা যায়।\n• ইলেকট্রন কেবল সেসব কক্ষপথে ঘোরে যেখানে এর কৌণিক ভরবেগ mvr=nh/2π। এর মাধ্যমে কক্ষপথের আকার নির্দিষ্ট হয়।\n• ইলেকট্রন এক কক্ষপথ থেকে অন্য কক্ষপথে স্থানান্তরিত হলে নির্দিষ্ট পরিমাণ শক্তি শোষণ বা বিকিরণ করে (ΔE = E2 - E1 = hν)। এর সাহায্যে হাইড্রোজেনের রেখা বর্ণালি ব্যাখ্যা করা যায়। সুতরাং, রাদারফোর্ড মডেলের সীমাবদ্ধতাগুলো দূর করায় পরমাণুর গঠন ব্যাখ্যায় B মডেল (বোর মডেল) অধিক উপযোগী ।"}]},{"id":"ch3-cq6","chapter":3,"num":6,"importance":3,"topic":"পরমাণুর মডেল","board":"কুমিল্লা বোর্ড ২০২২; যশোর বোর্ড ২০২২","stem":"নিচের উদ্দীপকটি পড়ো এবং প্রশ্নগুলোর উত্তর দাও:","diagramId":"ch3-cq6","subQuestions":[{"label":"ক","question":"পাতন কাকে বলে?","answer":"যে প্রক্রিয়ায় কোনো তরলকে তাপ দিয়ে বাষ্পে পরিণত করা হয় এবং সেই বাষ্পকে শীতল করে পুনরায় তরলে পরিণত করা হয়, তাকে পাতন বলে ।"},{"label":"খ","question":"নিশাদল একটি ঊর্ধ্বপাতিত পদার্থ- ব্যাখ্যা কর।","answer":"যে সকল কঠিন পদার্থকে তাপ দিলে তরলে পরিণত না হয়ে সরাসরি বাষ্পে পরিণত হয় এবং বাষ্পকে শীতল করলে আবার সরাসরি কঠিনে পরিণত হয়, তাদেরকে ঊর্ধ্বপাতিত পদার্থ বলে। নিশাদল (NH₄Cl) কে তাপ দিলে এটি গলে তরল হয় না, বরং সরাসরি বাষ্পে পরিণত হয় (বাষ্প অবস্থায় NH₃ ও HCl এ বিয়োজিত হয়)। এ বাষ্প ঠান্ডা অংশের সংস্পর্শে এলে আবার সরাসরি কঠিন নিশাদলে পরিণত হয়।\nতাপ\nNH4Cl(s)⟶NH₃(g)+HCl(g)\nশীতলীকরণ\nNH₃(g)+HCl(g)⟶NH4Cl(s)\nতাই নিশাদল একটি ঊর্ধ্বপাতিত পদার্থ ।"},{"label":"গ","question":"দৃশ্যপট-১ এর 'A' ইলেকট্রনটির গতিবেগ নির্ণয় কর।","answer":"উদ্দীপকের দৃশ্যপট-১ এ 'A' ইলেকট্রনটি n = 4 নং কক্ষপথে ঘুরছে । বোর মতবাদ অনুসারে, স্থির কক্ষপথে আবর্তনরত ইলেকট্রনের কৌণিক ভরবেগ, mvr=nh/2π ⇒ v=nh/(2π×m×r)\nএখানে,\n• প্রধান শক্তিস্তর, n = 4\n• কক্ষপথের ব্যাসার্ধ, r=8.5×10⁻¹⁰m\n• ইলেকট্রনের ভর, m=9.11×10⁻³¹kg\n• প্লাংক ধ্রুবক, h=6.626×10⁻³⁴ m²kgs⁻¹\n• গতিবেগ, v = ?\nv=(4×6.626×10⁻³⁴)/(2×3.1416×9.11×10⁻³¹×8.5×10⁻¹⁰) =(2.6504×10⁻³³)/(4.8655×10⁻³⁹) =5.45×105ms⁻¹ অতএব, 'A' ইলেকট্রনটির গতিবেগ 5.45 × 10⁵ m s⁻¹।"},{"label":"ঘ","question":"উদ্দীপকের দৃশ্যপট-২ পদার্থটির শীতলীকরণ বক্ররেখা কেমন হবে? চিত্রসহ ব্যাখ্যা কর।","answer":"উদ্দীপকের দৃশ্যপট-২ এর লেখচিত্রে -20°C তাপমাত্রায় কঠিন অবস্থা থেকে শুরু করে 0°C এ গলন এবং 100°C এ স্ফুটন হয়েছে । অর্থাৎ পদার্থটি পানি (বরফ) এবং লেখচিত্রটি এর তাপীয় বা উত্তপ্তকরণ বক্ররেখা। অংশ তাপমাত্রা অবস্থা MN -20°C থেকে 0°C কঠিন (বরফ) NO 0°C (গলনাঙ্ক) কঠিন + তরল OP 0°C থেকে 100°C তরল (পানি) PQ 100°C (স্ফুটনাঙ্ক) তরল + বায়বীয় QR 100°C থেকে 140°C বায়বীয় (জলীয় বাষ্প) এখন 140°C তাপমাত্রার জলীয় বাষ্পকে ধীরে ধীরে শীতল করলে উল্টো ক্রমে পরিবর্তন ঘটবে:\n১. R থেকে Q: জলীয় বাষ্পের তাপমাত্রা 140°C থেকে কমে 100°C হবে। পদার্থটি বায়বীয় অবস্থায় থাকবে।\n২. Q থেকে P: 100°C তাপমাত্রায় বাষ্প ঘনীভূত হয়ে পানিতে পরিণত হতে থাকবে। এ সময় সুপ্ততাপ নির্গত হয়, তাই সম্পূর্ণ বাষ্প পানি না হওয়া পর্যন্ত তাপমাত্রা স্থির থাকবে (অনুভূমিক রেখা)।\n৩. P থেকে O: পানির তাপমাত্রা 100°C থেকে কমে 0°C হবে। পদার্থটি তরল অবস্থায় থাকবে ।\n৪. O থেকে N: 0°C তাপমাত্রায় পানি জমে বরফে পরিণত হতে থাকবে। সম্পূর্ণ পানি বরফ না হওয়া পর্যন্ত তাপমাত্রা স্থির থাকবে (অনুভূমিক রেখা)। ৫. N থেকে M: বরফের তাপমাত্রা 0°C থেকে কমে -20°C হবে। অর্থাৎ, তাপমাত্রা বনাম সময় লেখচিত্রে শীতলীকরণ বক্ররেখাটি হবে\nR→Q→P→O→N→M। রেখাটি 140°C থেকে নিম্নমুখী হয়ে\n100°C এ একটি অনুভূমিক অংশ (QP) এবং 0°C এ আরেকটি অনুভূমিক অংশ (ON) তৈরি করে -20°C এ শেষ হবে। সুতরাং, উদ্দীপকের পদার্থটির শীতলীকরণ বক্ররেখা তার উত্তপ্তকরণ বক্ররেখার ঠিক বিপরীত (দর্পণ প্রতিবিম্বের মতো) হবে।"}]},{"id":"ch3-cq7","chapter":3,"num":7,"importance":3,"topic":"পরমাণুর মডেল","board":"রাজশাহী বোর্ড ২০২৩","stem":"নিচের উদ্দীপকটি পড়ো এবং প্রশ্নগুলোর উত্তর দাও:","diagramId":"ch3-cq7","subQuestions":[{"label":"ক","question":"গাঠনিক সংকেত কাকে বলে?","answer":"কোনো যৌগের অণুতে বিদ্যমান পরমাণুগুলো কীভাবে পরস্পরের সাথে বন্ধনের মাধ্যমে যুক্ত থাকে, তা যে সংকেতের সাহায্যে রেখা (-) দিয়ে দেখানো হয়, তাকে গাঠনিক সংকেত বলে ।\nযেমন: অ্যামোনিয়ার গাঠনিক সংকেতে N পরমাণু তিনটি একক বন্ধনের মাধ্যমে তিনটি H পরমাণুর সাথে যুক্ত থাকে ।"},{"label":"খ","question":"Mg কে মৃৎক্ষার ধাতু বলা হয় কেন?","answer":"ম্যাগনেসিয়াম (Mg) পর্যায় সারণির গ্রুপ-2 এর মৌল। এর সর্ববহিঃস্থ শক্তিস্তরে 2টি ইলেকট্রন (3s2) থাকে, যা ত্যাগ করে Mg²⁺ আয়ন গঠন করে । Mg এর অক্সাইড ও হাইড্রক্সাইড ক্ষারীয় প্রকৃতির । আবার এ মৌলটি প্রকৃতিতে মাটি বা ভূত্বকে বিভিন্ন যৌগ (যেমন: ডলোমাইট MgCO₃· CaCO₃, ম্যাগনেসাইট MgCO₃) হিসেবে পাওয়া যায়।\n2Mg+O₂→2MgO\nMgO+H₂O→Mg(OH)₂\nমাটিতে পাওয়া যায় এবং ক্ষারধর্মী যৌগ গঠন করে বলে গ্রুপ-2 এর মৌল Mg কে মৃৎক্ষার ধাতু বলা হয়।"},{"label":"গ","question":"B মডেলের সর্বশেষ শক্তিস্তরে ঘূর্ণায়মান ইলেকট্রনের কৌণিক ভরবেগ নির্ণয় কর। [h=6.626×10⁻³⁴ m²kg/s]","answer":"উদ্দীপকের B মডেলে নিউক্লিয়াসের চারদিকে তিনটি বৃত্তাকার কক্ষপথ আছে। সুতরাং এর সর্বশেষ শক্তিস্তর হলো তৃতীয় প্রধান শক্তিস্তর, অর্থাৎ n = 3। বোর পরমাণু মডেল অনুসারে, কক্ষপথে ঘূর্ণায়মান ইলেকট্রনের কৌণিক ভরবেগ, mvr=nh/2π\nদেওয়া আছে: n = 3; h=6.626×10⁻³⁴ m²kg/s; π = 3.1416 কৌণিক ভরবেগ, mvr=nh/2π =(3×6.626×10⁻³⁴)/(2×3.1416) =3.16×10⁻³⁴ m²kg/s সুতরাং, B মডেলের সর্বশেষ শক্তিস্তরে ঘূর্ণায়মান ইলেকট্রনের কৌণিক ভরবেগ 3.16 × 10⁻³⁴ m²kg/s।"},{"label":"ঘ","question":"পরমাণুর গঠন ব্যাখ্যায় উদ্দীপকের কোন মডেলটি অধিক উপযোগী? বিশ্লেষণ কর।","answer":"উদ্দীপকের A মডেলটি রাদারফোর্ডের পরমাণু মডেল এবং B মডেলটি বোরের পরমাণু মডেল । পরমাণুর গঠন ব্যাখ্যায় B মডেল (বোর মডেল) অধিক উপযোগী । রাদারফোর্ড আলফা কণা বিচ্ছুরণ পরীক্ষার মাধ্যমে প্রথম পরমাণুর নিউক্লিয়াসের ধারণা দেন। তাঁর মতে, পরমাণুর কেন্দ্রে ধনাত্মক চার্জযুক্ত ভারী নিউক্লিয়াস থাকে এবং ইলেকট্রনগুলো সৌরজগতের গ্রহের মতো নিউক্লিয়াসকে কেন্দ্র করে ঘোরে । তবে এ মডেলের সীমাবদ্ধতা হলো:\n• ইলেকট্রনের কক্ষপথের আকার ও আকৃতি সম্পর্কে কোনো ধারণা দেওয়া হয়নি ।\n• ঘূর্ণায়মান ইলেকট্রন ক্রমাগত শক্তি বিকিরণ করে নিউক্লিয়াসে পতিত হওয়ার কথা; অর্থাৎ এ মডেল পরমাণুর স্থায়িত্ব ব্যাখ্যা করতে পারে না।\n• একাধিক ইলেকট্রনবিশিষ্ট পরমাণুতে ইলেকট্রনের বিন্যাস এবং ইলেকট্রনের এক কক্ষপথ থেকে অন্য কক্ষপথে স্থানান্তর সম্পর্কে কিছু বলা হয়নি ।\n• পরমাণুর রেখা বর্ণালির কোনো ব্যাখ্যা নেই। বোর মডেলে এসব সীমাবদ্ধতা দূর করা হয়েছে:\n• ইলেকট্রন নিউক্লিয়াসের চারদিকে নির্দিষ্ট শক্তিসম্পন্ন কতকগুলো স্থায়ী বৃত্তাকার কক্ষপথে (শক্তিস্তরে) ঘোরে এবং স্থায়ী কক্ষপথে থাকাকালে শক্তি শোষণ বা বিকিরণ করে না। ফলে পরমাণু স্থিতিশীল থাকে।\n• কক্ষপথে ইলেকট্রনের কৌণিক ভরবেগ mvr=nh/2π, যা কক্ষপথের আকার নির্ধারণ করে।\n• ইলেকট্রন নিম্ন শক্তিস্তর থেকে উচ্চ শক্তিস্তরে গেলে নির্দিষ্ট শক্তি শোষণ করে এবং উচ্চ থেকে নিম্ন শক্তিস্তরে এলে নির্দিষ্ট শক্তি বিকিরণ করে (ΔE = hν)। এর মাধ্যমে রেখা বর্ণালি ব্যাখ্যা করা যায়। সুতরাং, রাদারফোর্ড মডেলের তুলনায় বোর মডেল পরমাণুর গঠন ও স্থায়িত্ব অধিকতর সঠিকভাবে ব্যাখ্যা করে। তাই পরমাণুর গঠন ব্যাখ্যায় B মডেলটি অধিক উপযোগী।"}]},{"id":"ch3-cq8","chapter":3,"num":8,"importance":3,"topic":"পরমাণুর শক্তিস্তরে ইলেকট্রন বিন্যাস","board":"ময়মনসিংহ বোর্ড ২০২৬","stem":"'A' ও 'B' মৌলের পারমাণবিক সংখ্যা যথাক্রমে 20 ও 47। যেখানে A ও B প্রকৃত প্রতীক নহে।","subQuestions":[{"label":"ক","question":"সমাণু কাকে বলে?","answer":"সমাণু: যে সকল অণুর আণবিক সংকেত একই কিন্তু গাঠনিক সংকেত ভিন্ন এবং ফলে ধর্মও ভিন্ন, তাদের পরস্পরকে সমাণু বলে। যেমন: n- বিউটেন ও আইসো-বিউটেন (C₄H₁₀)।"},{"label":"খ","question":"সালফার ট্রাই অক্সাইডের মোলার আয়তন ব্যাখ্যা কর।","answer":"প্রমাণ তাপমাত্রা ও চাপে (STP) যেকোনো পদার্থের এক মোল গ্যাসীয় অণুর আয়তনকে মোলার আয়তন বলে, যার মান 22.4 L। সালফার ট্রাই অক্সাইডের (SO₃) আণবিক ভর =32+3×16=80। অর্থাৎ 1 মোল SO₃=80gSO₃=6.02×10²³ টি SO₃ অণু। STP তে গ্যাসীয় অবস্থায় এই 80 g SO₃ যে আয়তন দখল করে তা হলো 22.4 L। এটিই সালফার ট্রাই অক্সাইডের মোলার আয়তন ।"},{"label":"গ","question":"'A' মৌলের 19-তম ও 20-তম ইলেকট্রন 'M' অরবিটে প্রবেশ না করে 'N' অরবিটে প্রবেশ করে কেন? ব্যাখ্যা কর।","answer":"উদ্দীপকের 'A' মৌলের পারমাণবিক সংখ্যা 20। সুতরাং মৌলটি ক্যালসিয়াম (Ca)। এর ইলেকট্রন বিন্যাস: Ca (20) : 1s² 2s² 2p⁶ 3s² 3p⁶ 4s² প্রথম 18টি ইলেকট্রন 1s, 2s, 2p, 3s ও 3p অরবিটালে প্রবেশ করে। এরপর 19-তম ইলেকট্রনের জন্য দুটি সুযোগ থাকে: M শক্তিস্তরের 3d অরবিটাল অথবা N শক্তিস্তরের 4s অরবিটাল। আউফবাউ নীতি ও (n + l) নিয়ম অনুসারে যে অরবিটালের (n + l) এর মান কম, তার শক্তি কম এবং ইলেকট্রন আগে সেখানে প্রবেশ করে। 3d অরবিটালের জন্য, n+l=3+2=5 4s অরবিটালের জন্য, n+l=4+0=4 যেহেতু 4s অরবিটালের (n + l) এর মান 3d অপেক্ষা কম, তাই 4s অরবিটালের শক্তি কম। ফলে 19-তম ও 20-তম ইলেকট্রন M শক্তিস্তরের (তৃতীয় শক্তিস্তর) 3d অরবিটালে প্রবেশ না করে N শক্তিস্তরের (চতুর্থ শক্তিস্তর) 4s অরবিটালে প্রবেশ করে ।"},{"label":"ঘ","question":"'B' মৌলের ইলেকট্রন বিন্যাস স্বাভাবিক নিয়মে সম্ভব কি? বিশ্লেষণ কর।","answer":"উদ্দীপকের 'B' মৌলের পারমাণবিক সংখ্যা 47। সুতরাং মৌলটি সিলভার (Ag)। আউফবাউ নীতি অনুসারে স্বাভাবিক নিয়মে Ag এর ইলেকট্রন বিন্যাস হওয়ার কথা: Ag (47) : 1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹⁰ 4s² 4p⁶ 4d⁹ 5s² কিন্তু বাস্তবে Ag এর ইলেকট্রন বিন্যাস হলো: Ag (47) : 1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹⁰ 4s² 4p⁶ 4d¹⁰ 5s¹ এর কারণ হলো, d অরবিটাল অর্ধপূর্ণ (d5) বা সম্পূর্ণ পূর্ণ (d10) অবস্থায় অধিক সুস্থিত হয়। 4d⁹ 5s² বিন্যাসে 4d অরবিটালে একটি ইলেকট্রন কম থাকায় তা কম সুস্থিত । তাই অধিক স্থিতিশীলতা অর্জনের জন্য 5s অরবিটাল থেকে একটি ইলেকট্রন 4d অরবিটালে চলে যায় এবং 4d¹⁰ 5s¹ বিন্যাস তৈরি হয়। অতএব, 'B' মৌলের (Ag) ইলেকট্রন বিন্যাস স্বাভাবিক নিয়মে সম্ভব নয়; এটি ইলেকট্রন বিন্যাসের একটি ব্যতিক্রম (Cr ও Cu এর মতো)।"}]},{"id":"ch3-cq9","chapter":3,"num":9,"importance":3,"topic":"পরমাণুর শক্তিস্তরে ইলেকট্রন বিন্যাস","board":"রাজশাহী বোর্ড ২০২৬","stem":"8A, 24B, 29C (A, B ও C প্রতীকী অর্থে ব্যবহৃত হয়েছে)","subQuestions":[{"label":"ক","question":"ক্যাটায়ন কাকে বলে?","answer":"ক্যাটায়ন: কোনো পরমাণু এক বা একাধিক ইলেকট্রন ত্যাগ করে যে ধনাত্মক চার্জযুক্ত আয়নে পরিণত হয়, তাকে ক্যাটায়ন বলে। যেমন: Na⁺, Ca²⁺।"},{"label":"খ","question":"SO₄²⁻ একটি যৌগমূলক —ব্যাখ্যা কর।","answer":"কতকগুলো পরমাণু একত্রে গুচ্ছ হিসেবে থেকে একটিমাত্র পরমাণুর ন্যায় রাসায়নিক বিক্রিয়ায় অংশ নিলে এবং আলাদাভাবে অস্তিত্ব না থাকলে সেই পরমাণুগুচ্ছকে যৌগমূলক বলে। SO₄²⁻ এ একটি S ও চারটি O পরমাণু একত্রে একটি গুচ্ছ গঠন করেছে এবং গুচ্ছটির মোট চার্জ -2। এটি স্বাধীনভাবে থাকতে পারে না, তবে বিক্রিয়ায় অপরিবর্তিত অবস্থায় একক হিসেবে অংশ নেয়।\nH₂SO₄+2NaOH→Na₂SO₄+2H₂O\nএ বিক্রিয়ায় SO₄ গুচ্ছটি অপরিবর্তিত থেকে H₂SO₄ থেকে Na₂SO₄ এ স্থানান্তরিত হয়েছে । তাই SO₄²⁻ একটি যৌগমূলক, এর যোজনী 2।"},{"label":"গ","question":"পর্যায় সারণিতে ‘B’ মৌলের অবস্থান ইলেকট্রন বিন্যাসের মাধ্যমে ব্যাখ্যা কর।","answer":"উদ্দীপকের B মৌলের পারমাণবিক সংখ্যা 24। অর্থাৎ মৌলটি ক্রোমিয়াম (Cr)। Cr এর ইলেকট্রন বিন্যাস: Cr (24) : 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁵ 4s¹ সাধারণ নিয়মে বিন্যাস হওয়ার কথা 3d⁴ 4s², কিন্তু অর্ধপূর্ণ d অরবিটাল (3d5) অধিক স্থিতিশীল হওয়ায় 4s থেকে একটি ইলেকট্রন 3d তে চলে যায়।\n• পর্যায় নির্ণয়: B এর সর্বশেষ প্রধান শক্তিস্তর n = 4। তাই B মৌলটি পর্যায় সারণির 4র্থ পর্যায়ে অবস্থিত ।\n• গ্রুপ নির্ণয়: সর্বশেষ ইলেকট্রন d অরবিটালে প্রবেশ করায় এটি d- ব্লক মৌল। d-ব্লক মৌলের ক্ষেত্রে গ্রুপ নম্বর = (n-1)d ও ns অরবিটালের মোট ইলেকট্রন সংখ্যা। গ্রুপ নম্বর = 3d এর ইলেকট্রন + 4s এর ইলেকট্রন =5+1=6 সুতরাং পর্যায় সারণিতে B (Cr) মৌলটির অবস্থান 4র্থ পর্যায়ের 6 নং গ্রুপে । এটি একটি অবস্থান্তর মৌল।"},{"label":"ঘ","question":"উদ্দীপকের ‘C’ মৌলের ইলেকট্রন বিন্যাসে সাধারণ নিয়মের ব্যতিক্রম ঘটলেও ‘A’ মৌলের ইলেকট্রন বিন্যাস সাধারণ নিয়মে ঘটে—ব্যাখ্যা কর।","answer":"উদ্দীপকের A মৌলের পারমাণবিক সংখ্যা 8, অর্থাৎ A হলো অক্সিজেন (O)। C মৌলের পারমাণবিক সংখ্যা 29, অর্থাৎ C হলো কপার (Cu)।\nC (Cu) এর ইলেকট্রন বিন্যাস আউফবাউ নীতি অনুসারে (অরবিটালের শক্তিক্রম 1s \u003c 2s \u003c 2p \u003c 3s \u003c 3p \u003c 4s \u003c 3d) Cu এর ইলেকট্রন বিন্যাস হওয়ার কথা: Cu (29) : 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁹ 4s² কিন্তু বাস্তবে Cu এর ইলেকট্রন বিন্যাস: Cu (29) : 1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹⁰ 4s¹ কারণ, d অরবিটাল সম্পূর্ণ পূর্ণ (d10) বা অর্ধপূর্ণ (d5) থাকলে তা অধিক স্থিতিশীল হয়। 3d ও 4s অরবিটালের শক্তির পার্থক্য খুব কম হওয়ায় 4s অরবিটালের একটি ইলেকট্রন 3d অরবিটালে স্থানান্তরিত হয়ে 3d অরবিটাল পূর্ণ (3d10) করে এবং পরমাণুটি অধিক স্থিতিশীলতা লাভ করে। তাই C মৌলের ইলেকট্রন বিন্যাসে সাধারণ নিয়মের ব্যতিক্রম ঘটে।\nA (O) এর ইলেকট্রন বিন্যাস O (8) : 1s² 2s² 2p⁴ অক্সিজেনের ইলেকট্রনগুলো আউফবাউ নীতি অনুসারে শক্তির নিম্নক্রম অনুযায়ী 1s, 2s ও 2p অরবিটালে প্রবেশ করে। এর ইলেকট্রন বিন্যাসে কোনো d অরবিটাল জড়িত নেই এবং কাছাকাছি শক্তির কোনো অরবিটালে ইলেকট্রন স্থানান্তরের মাধ্যমে অধিক স্থিতিশীলতা লাভের সুযোগও নেই। অর্থাৎ অর্ধপূর্ণ বা পূর্ণ d অরবিটাল গঠনের সুযোগ না থাকায় A মৌলের ইলেকট্রন বিন্যাস সাধারণ নিয়মেই ঘটে। সুতরাং, C (Cu) মৌলের ইলেকট্রন বিন্যাসে সাধারণ নিয়মের ব্যতিক্রম ঘটলেও A (O) মৌলের ইলেকট্রন বিন্যাস সাধারণ নিয়মে ঘটে— উক্তিটি যথার্থ ।"}]},{"id":"ch3-cq10","chapter":3,"num":10,"importance":3,"topic":"পরমাণুর শক্তিস্তরে ইলেকট্রন বিন্যাস","board":"কুমিল্লা বোর্ড ২০২২","stem":"[বি: দ্র: D প্রতীকী অর্থে; কোনো প্রতীক নয়]","diagramId":"ch3-cq10","subQuestions":[{"label":"ক","question":"পাতন কাকে বলে?","answer":"যে প্রক্রিয়ায় কোনো তরলকে তাপ দিয়ে বাষ্পে পরিণত করা হয় এবং সেই বাষ্পকে শীতল করে পুনরায় তরলে পরিণত করা হয়, তাকে পাতন বলে ।"},{"label":"খ","question":"CO₂(g) এবং CH₄(g) এর মধ্যে কার ব্যাপন হার বেশি?","answer":"CO₂(g) এর তুলনায় CH₄(g) এর ব্যাপন হার বেশি। গ্যাসের ব্যাপন হার তার আণবিক ভরের বর্গমূলের ব্যস্তানুপাতিক (r ∝ 1/√M)। CO₂ এর আণবিক ভর =12+16×2=44 এবং CH₄ এর আণবিক ভর =12+1×4=16। r(CH4)/r(CO2) = √44/16=1.66 অর্থাৎ CH₄ এর আণবিক ভর কম হওয়ায় এর ব্যাপন হার CO₂ এর চেয়ে প্রায় 1.66 গুণ বেশি।"},{"label":"গ","question":"উদ্দীপকের 'D' মৌলের শেষ কক্ষপথে ইলেকট্রনের কৌণিক ভরবেগ নির্ণয় কর।","answer":"উদ্দীপকের 'D' মৌলের নিউক্লিয়াসে 19টি প্রোটন আছে । অর্থাৎ এর পারমাণবিক সংখ্যা 19 এবং ভরসংখ্যা =19+21=40। সুতরাং 'D' মৌলটি পটাশিয়াম (K)। এর ইলেকট্রন বিন্যাস: K(2), L(8), M(8), N(1)। অর্থাৎ শেষ কক্ষপথ N, যার প্রধান শক্তিস্তর n = 4। বোর মতবাদ অনুসারে, কৌণিক ভরবেগ, mvr=nh/2π\nএখানে, n = 4; h=6.626×10⁻³⁴ m²kgs⁻¹ mvr=(4×6.626×10⁻³⁴)/(2×3.1416) =(2.6504×10⁻³³)/6.2832 =4.218×10⁻³⁴kg m² s⁻¹ অতএব, 'D' মৌলের শেষ কক্ষপথে ইলেকট্রনের কৌণিক ভরবেগ 4.218 × 10⁻³⁴kg m² s⁻¹।"},{"label":"ঘ","question":"উদ্দীপকের 'D' মৌলের ইলেকট্রন বিন্যাস 2n² সূত্র দ্বারা ব্যাখ্যা করা যায় না– বিশ্লেষণ কর।","answer":"উদ্দীপকের 'D' মৌলটি পটাশিয়াম (K), যার পারমাণবিক সংখ্যা 19। 2n² সূত্র অনুসারে কোনো শক্তিস্তরে সর্বোচ্চ 2n² সংখ্যক ইলেকট্রন থাকতে পারে। K স্তরে (n = 1) সর্বোচ্চ 2টি, L স্তরে (n = 2) সর্বোচ্চ 8টি এবং M স্তরে (n = 3) সর্বোচ্চ 18টি ইলেকট্রন থাকতে পারে । এ সূত্র অনুসারে পটাশিয়ামের 19টি ইলেকট্রনের বিন্যাস হওয়ার কথা: K(2), L(8), M(9) কিন্তু পটাশিয়ামের প্রকৃত ইলেকট্রন বিন্যাস হলো: K(2), L(8), M(8), N(1) অর্থাৎ M স্তরে 18টি ইলেকট্রন ধারণের সুযোগ থাকলেও 8টি ইলেকট্রন পূর্ণ হওয়ার পর 19তম ইলেকট্রনটি N স্তরে চলে যায়। এর কারণ:\n১. কোনো পরমাণুর সর্ববহিঃস্থ শক্তিস্তরে 8টির বেশি ইলেকট্রন থাকতে পারে না।\n২. আউফবাউ নীতি অনুসারে ইলেকট্রন প্রথমে নিম্ন শক্তির উপস্তরে প্রবেশ করে। (n + l) এর মান 3d উপস্তরের জন্য (3+2)=5 এবং 4s উপস্তরের জন্য (4+0)=4। 4s উপস্তরের শক্তি 3d এর চেয়ে কম হওয়ায় 3p পূর্ণ হওয়ার পর ইলেকট্রন 3d তে না গিয়ে 4s এ প্রবেশ করে । K(19): 1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹ সুতরাং, 2n² সূত্র শুধু একটি শক্তিস্তরের সর্বোচ্চ ধারণক্ষমতা নির্দেশ করে, প্রকৃত বিন্যাস নয়। তাই 'D' মৌলের (পটাশিয়াম) ইলেকট্রন বিন্যাস 2n² সূত্র দ্বারা ব্যাখ্যা করা যায় না; এটি আউফবাউ নীতি দ্বারা ব্যাখ্যা করতে হয়।"}]},{"id":"ch3-cq11","chapter":3,"num":11,"importance":3,"topic":"পরমাণুর শক্তিস্তরে ইলেকট্রন বিন্যাস","board":"ময়মনসিংহ বোর্ড ২০২১","stem":"D মৌলের তিনটি আইসোটোপের ক্ষেত্রে— (i) আইসোটোপ শতকরা পরিমাণ ভরসংখ্যা D1 78 44 D2 14 46 D3 08 53 (ii) 5p \u003c 6s \u003c 4f \u003c 5d","diagramId":"ch3-cq11","subQuestions":[{"label":"ক","question":"অণু কাকে বলে?","answer":"মৌলিক বা যৌগিক পদার্থের যে ক্ষুদ্রতম কণা স্বাধীনভাবে অবস্থান করতে পারে এবং ঐ পদার্থের ধর্ম বজায় রাখে, তাকে অণু বলে। যেমন: H₂, O₂, H₂O।"},{"label":"খ","question":"Na এর যোজনী 1 — ব্যাখ্যা কর।","answer":"সোডিয়ামের (Na) পারমাণবিক সংখ্যা 11; ইলেকট্রন বিন্যাস: 1s² 2s² 2p⁶ 3s¹ (K = 2, L = 8, M = 1)। এর সর্বশেষ শক্তিস্তরে মাত্র 1টি ইলেকট্রন আছে। বন্ধন গঠনের সময় Na পরমাণু এই 1টি ইলেকট্রন ত্যাগ করে নিকটতম নিষ্ক্রিয় গ্যাস নিয়নের (Ne) মতো স্থিতিশীল অষ্টক বিন্যাস অর্জন করে এবং Na+ আয়নে পরিণত হয়।\nNa→Na++e-\nযেহেতু বন্ধন গঠনে Na পরমাণু 1টি ইলেকট্রন ত্যাগ করে, তাই Na এর যোজনী 1। যেমন: NaCl, Na₂O।"},{"label":"গ","question":"(i) নং উদ্দীপক হতে D মৌলের গড় আপেক্ষিক পারমাণবিক ভর নির্ণয় কর।","answer":"উদ্দীপকের (i) নং অনুযায়ী D মৌলের আইসোটোপ D1, D2, D3 এর ভরসংখ্যা যথাক্রমে 44, 46, 53 এবং শতকরা পরিমাণ যথাক্রমে 78%, 14%, 8%। গড় আপেক্ষিক পারমাণবিক ভর =(p×a+q×b+r×c)/100 =(78×44+14×46+8×53)/100 =(3432+644+424)/100 =4500/100=45 সুতরাং, D মৌলের গড় আপেক্ষিক পারমাণবিক ভর 45।"},{"label":"ঘ","question":"(ii) এর উপস্তরগুলোর শক্তির ক্রম পরমাণুতে ইলেকট্রন বিন্যাসের নীতির প্রতিফলন — উক্তিটি মূল্যায়ন কর।","answer":"উদ্দীপকের (ii) নং এ উপস্তরগুলোর শক্তির ক্রম: 5p \u003c 6s \u003c 4f \u003c 5d। ইলেকট্রন বিন্যাসের মূল নীতি আউফবাউ নীতি অনুযায়ী ইলেকট্রন প্রথমে সর্বনিম্ন শক্তির অরবিটালে এবং পরে ক্রমান্বয়ে উচ্চ শক্তির অরবিটালে প্রবেশ করে। অরবিটালের শক্তি নির্ণয়ের নিয়ম: (n + l) এর মান যত কম, শক্তি তত কম। (n + l) এর মান সমান হলে যে অরবিটালের n এর মান কম, তার শক্তি কম। উপস্তর n l (n + l) 5p 5 1 6 6s 6 0 6 4f 4 3 7 5d 5 2 7 5p ও 6s এর (n + l) সমান (6) হলেও 5p এর n (5) কম, তাই 5p এর শক্তি 6s অপেক্ষা কম। 4f ও 5d এর (n + l) সমান (7) হলেও 4f এর n (4) কম, তাই 4f এর শক্তি 5d অপেক্ষা কম। আবার 6s এর (n+ l)=6, যা 4f এর (n+l)=7 অপেক্ষা কম; তাই 6s \u003c 4f।\nঅতএব উপস্তরগুলোতে ইলেকট্রন প্রবেশের ক্রম: 5p → 6s → 4f →\n5d; অর্থাৎ শক্তির ক্রম 5p \u003c 6s \u003c 4f \u003c 5d। সুতরাং, (ii) এর উপস্তরগুলোর শক্তির ক্রম আউফবাউ নীতি তথা পরমাণুতে ইলেকট্রন বিন্যাসের নীতির সঠিক প্রতিফলন — উক্তিটি যথার্থ ।"}]},{"id":"ch3-cq12","chapter":3,"num":12,"importance":2,"topic":"আইসোটোপ","board":"সিলেট বোর্ড ২০২১","stem":"1/1H 1T 1D Li (i) (ii) (iii) (iv)","subQuestions":[{"label":"ক","question":"যোজ্যতা ইলেকট্রন সংখ্যা কাকে বলে?","answer":"কোনো মৌলের পরমাণুর সর্বশেষ শক্তিস্তরে যে কয়টি ইলেকট্রন থাকে, তাকে ঐ মৌলের যোজ্যতা ইলেকট্রন সংখ্যা বলে।"},{"label":"খ","question":"সোডিয়াম নমনীয় কেন?— ব্যাখ্যা কর।","answer":"সোডিয়াম একটি ধাতু; এর পরমাণুগুলো ধাতব বন্ধনে আবদ্ধ থাকে। ধাতব বন্ধনে ধনাত্মক Na+ আয়নগুলো মুক্ত ইলেকট্রনের সাগরে ডুবে থাকে । বাইরে থেকে আঘাত বা চাপ দিলে Na+ আয়নের স্তরগুলো একটির উপর দিয়ে আরেকটি সরে যায়, কিন্তু মুক্ত ইলেকট্রনগুলো সব জায়গায় থাকায় বন্ধন ভাঙে না। তাই সোডিয়ামকে না ভেঙে পিটিয়ে বা চাপ দিয়ে আকৃতি পরিবর্তন করা যায়; অর্থাৎ সোডিয়াম নমনীয় ।"},{"label":"গ","question":"উদ্দীপকের (i), (ii) ও (iii) পরস্পরের আইসোটোপ — ব্যাখ্যা কর।","answer":"উদ্দীপকের (i), (ii) ও (iii) যথাক্রমে হাইড্রোজেন বা প্রোটিয়াম (1/1H), ট্রিটিয়াম (3/1T) ও ডিউটেরিয়াম (2/1D)। যে সকল পরমাণুর প্রোটন সংখ্যা সমান কিন্তু ভরসংখ্যা ও নিউট্রন সংখ্যা ভিন্ন, তাদেরকে একে অপরের আইসোটোপ বলে। নিউট্রন সংখ্যা = ভরসংখ্যা (A) - প্রোটন সংখ্যা (Z) পরমাণু প্রতীক প্রোটন ভরসংখ্যা A নিউট্রন সংখ্যা Z সংখ্যা A - Z (i) প্রোটিয়াম 1/1H 1 1 1-1=0 (ii) ট্রিটিয়াম 3/1T 1 3 3-1=2 (iii) 2/1D 1 2 2-1=1 ডিউটেরিয়াম সারণি থেকে দেখা যায়, তিনটি পরমাণুরই প্রোটন সংখ্যা 1 অর্থাৎ সমান, তাই এরা একই মৌল হাইড্রোজেনের পরমাণু । কিন্তু এদের ভরসংখ্যা (1, 3, 2) ও নিউট্রন সংখ্যা (0, 2, 1) ভিন্ন। অতএব, উদ্দীপকের (i), (ii) ও (iii) পরস্পরের আইসোটোপ ।"},{"label":"ঘ","question":"উদ্দীপকের (i) ও (iv) পরমাণুর মধ্যে কোনটির গঠন ব্যাখ্যায় বোরের পরমাণু মডেল সফল, যুক্তি দাও।","answer":"উদ্দীপকের (i) হাইড্রোজেন (H, Z = 1) এবং (iv) লিথিয়াম (Li, Z = 3)। H এর ইলেকট্রন বিন্যাস 1s¹ (একটি মাত্র ইলেকট্রন), Li এর ইলেকট্রন বিন্যাস 1s² 2s¹ (তিনটি ইলেকট্রন)। বোরের পরমাণু মডেল অনুযায়ী, ইলেকট্রন নিউক্লিয়াসের চারদিকে নির্দিষ্ট শক্তির কতগুলো বৃত্তাকার কক্ষপথে (প্রধান শক্তিস্তরে) ঘোরে; এসব কক্ষপথে ঘোরার সময় ইলেকট্রন শক্তি শোষণ বা বিকিরণ করে না। ইলেকট্রন নিম্ন শক্তিস্তর থেকে উচ্চ শক্তিস্তরে গেলে শক্তি শোষণ করে এবং উচ্চ শক্তিস্তর থেকে নিম্ন শক্তিস্তরে নেমে এলে শক্তি বিকিরণ করে। বিকিরিত শক্তির পরিমাণ দুই স্তরের শক্তির পার্থক্যের সমান: ΔE = E2 - E1 = hν = hc/λ এই বিকিরিত আলোকে প্রিজমের মধ্য দিয়ে চালনা করলে নির্দিষ্ট রেখাবিশিষ্ট পারমাণবিক বর্ণালি পাওয়া যায়। বোর মডেলের সাহায্যে এক ইলেকট্রনবিশিষ্ট হাইড্রোজেন পরমাণুর বর্ণালি সঠিকভাবে ব্যাখ্যা করা যায়। কিন্তু একাধিক ইলেকট্রনবিশিষ্ট পরমাণুর বর্ণালি বোর মডেল দিয়ে ব্যাখ্যা করা যায় না। লিথিয়ামে তিনটি ইলেকট্রন থাকায় এর বর্ণালি ও গঠন ব্যাখ্যায় বোর মডেল ব্যর্থ। অতএব, (i) হাইড্রোজেন ও (iv) লিথিয়ামের মধ্যে হাইড্রোজেন (i) এর গঠন ব্যাখ্যায় বোরের পরমাণু মডেল সফল।"}]},{"id":"ch3-cq13","chapter":3,"num":13,"importance":2,"topic":"পারমাণবিক ভর বা আপেক্ষিক পারমাণবিক ভর","board":"দিনাজপুর বোর্ড ২০২৩","stem":"মৌল পর্যায় গ্রুপ X 2 15 Y 3 17 [X, Y কোনো মৌলের প্রতীক নয়, প্রতীকী অর্থে ব্যবহৃত ।]","subQuestions":[{"label":"ক","question":"অরবিট কাকে বলে?","answer":"বোর পরমাণু মডেল অনুসারে নিউক্লিয়াসের চারদিকে ইলেকট্রন যে নির্দিষ্ট শক্তির বৃত্তাকার পথে ঘোরে, তাকে অরবিট বা শক্তিস্তর বলে।"},{"label":"খ","question":"4d এবং 6s এর মধ্যে কোন অরবিটালে ইলেকট্রন আগে প্রবেশ করবে? ব্যাখ্যা কর।","answer":"ইলেকট্রন আগে সেই অরবিটালে প্রবেশ করে যার (n + l) এর মান কম; (n + l) সমান হলে যার n এর মান কম তাতে আগে প্রবেশ করে। 4d এর জন্য n+l=4+2=6; 6s এর জন্য n+l=6+0=6। (n + l) সমান, কিন্তু 4d এর n (4) কম। তাই 4d অরবিটালে ইলেকট্রন আগে প্রবেশ করবে।"},{"label":"গ","question":"উদ্দীপকের 'Y' মৌলটির একটি পরমাণুর ভর নির্ণয় কর।","answer":"Y মৌলটি তৃতীয় পর্যায়ের 17 নং গ্রুপে অবস্থিত । তৃতীয় পর্যায়ে তিনটি শক্তিস্তর এবং 17 নং গ্রুপে সর্বশেষ স্তরে 7টি ইলেকট্রন থাকে। ইলেকট্রন বিন্যাস 2, 8, 7; পারমাণবিক সংখ্যা 17।\n∴ Y হলো ক্লোরিন (Cl), যার আপেক্ষিক পারমাণবিক ভর 35.5। আমরা জানি, একটি পরমাণুর ভর = আপেক্ষিক পারমাণবিক ভর × কার্বন-12 এর ভরের 1/12 অংশ Cl এর একটি পরমাণুর ভর =35.5×1.66×10⁻²⁴g =58.93×10⁻²⁴g=5.893×10⁻²³g\n∴ Y মৌলটির একটি পরমাণুর ভর 5.893 × 10⁻²³ g।"},{"label":"ঘ","question":"'X2' ও 'Y₂' গ্যাস দুইটির ব্যাপন হার এর তুলনা কর।","answer":"X মৌলটি দ্বিতীয় পর্যায়ের 15 নং গ্রুপে অবস্থিত; ইলেকট্রন বিন্যাস 2, 5; পারমাণবিক সংখ্যা 7। ∴ X হলো নাইট্রোজেন (N), X2 = N₂। গ অংশ অনুযায়ী Y হলো ক্লোরিন, Y₂=Cl₂। N₂ এর আণবিক ভর =14×2=28 Cl₂ এর আণবিক ভর =35.5×2=71 একই তাপমাত্রা ও চাপে যে গ্যাসের আণবিক ভর কম, তার অণুগুলো হালকা হওয়ায় দ্রুত ছুটে চলে; ফলে তার ব্যাপন হার বেশি। আণবিক ভর বেশি হলে অণু ভারী হয় এবং ব্যাপন হার কম হয়। N₂ (28) এর আণবিক ভর Cl₂ (71) এর চেয়ে অনেক কম। সুতরাং, X2 (N₂) গ্যাসের ব্যাপন হার Y₂ (Cl₂) গ্যাসের ব্যাপন হারের চেয়ে বেশি।"}]},{"id":"ch4-cq1","chapter":4,"num":1,"importance":3,"topic":"ইলেকট্রন বিন্যাস থেকে পর্যায় সারণিতে মৌলের অবস্থান নির্ণয়","board":"বরিশাল বোর্ড ২০২৬","stem":"মৌল A B পারমাণবিক সংখ্যা 19 30 [এখানে A ও B প্রতীকী অর্থে ব্যবহৃত]","subQuestions":[{"label":"ক","question":"গাঠনিক সংকেত কাকে বলে?","answer":"কোনো যৌগের অণুতে বিভিন্ন পরমাণু কোনটি কোনটির সাথে কোন ধরনের বন্ধন দ্বারা কীভাবে যুক্ত আছে, তা যে সংকেতের মাধ্যমে প্রকাশ করা হয়, তাকে গাঠনিক সংকেত বলে। যেমন: H-O-H।"},{"label":"খ","question":"বেরিলিয়ামকে মৃৎক্ষার ধাতু বলা হয় কেন?","answer":"পর্যায় সারণির গ্রুপ 2 এর মৌলগুলোকে মৃৎক্ষার ধাতু বলা হয়, কারণ এদের অক্সাইডসমূহ মাটিতে (ভূ-ত্বকে) পাওয়া যায় এবং এদের অক্সাইড ও হাইড্রোক্সাইড ক্ষারধর্মী । বেরিলিয়ামের (Be = 4) ইলেকট্রন বিন্যাস 1s² 2s²। এর সর্বশেষ শক্তিস্তরে 2টি ইলেকট্রন থাকায় এটি পর্যায় সারণির গ্রুপ 2 এ অবস্থিত । এটি অন্যান্য মৃৎক্ষার ধাতুর মতো 2টি ইলেকট্রন ত্যাগ করে Be²⁺ আয়ন গঠন করে। তাই বেরিলিয়ামকে মৃৎক্ষার ধাতু বলা হয়।"},{"label":"গ","question":"পর্যায় সারণিতে 'B' মৌলের অবস্থান কীভাবে নির্ণয় করবে? বর্ণনা কর।","answer":"উদ্দীপকের B মৌলের পারমাণবিক সংখ্যা 30; এটি জিংক (Zn)। ইলেকট্রন বিন্যাসের মাধ্যমে পর্যায় সারণিতে এর অবস্থান নির্ণয় করা যায়। Zn (30): 1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹⁰ 4s² পর্যায় নির্ণয় ইলেকট্রন বিন্যাসে সর্বোচ্চ প্রধান শক্তিস্তর হলো 4 (4s)। মৌলের সর্বশেষ শক্তিস্তরের ক্রমিক সংখ্যাই তার পর্যায় নির্দেশ করে । তাই B মৌলটি চতুর্থ পর্যায়ের মৌল। ব্লক নির্ণয় ইলেকট্রন বিন্যাস অনুযায়ী Zn এর সর্বশেষ ইলেকট্রনটি 3d অরবিটালে প্রবেশ করে (4s এর পরে 3d পূর্ণ হয়)। তাই B একটি d- ব্লক মৌল। গ্রুপ নির্ণয় d-ব্লক মৌলের ক্ষেত্রে, গ্রুপ নম্বর = (n-1)d অরবিটালের ইলেকট্রন সংখ্যা + ns অরবিটালের ইলেকট্রন সংখ্যা। B মৌলের গ্রুপ নম্বর = 3d এর ইলেকট্রন + 4s এর ইলেকট্রন =10+2=12 অতএব, B (Zn) মৌলটি পর্যায় সারণির চতুর্থ পর্যায়ের গ্রুপ 12 এ অবস্থিত একটি d-ব্লক মৌল।"},{"label":"ঘ","question":"উপশক্তিস্তরের মাধ্যমে দেখাও যে, 'A' মৌলের বহিঃস্তরের সর্বোচ্চ ইলেকট্রন ধারণ ক্ষমতা 2n² এর সমান ।","answer":"উদ্দীপকের A মৌলের পারমাণবিক সংখ্যা 19; এটি পটাসিয়াম (K)। K (19): 1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹ সুতরাং A মৌলের বহিঃস্তর হলো চতুর্থ শক্তিস্তর, অর্থাৎ n = 4। কোনো প্রধান শক্তিস্তরে উপশক্তিস্তরের সংখ্যা n টি এবং উপশক্তিস্তরগুলোর মান l = 0, 1, 2, …, (n-1)। প্রতিটি উপশক্তিস্তরের সর্বোচ্চ ইলেকট্রন ধারণ ক্ষমতা 2(2l + 1)। n = 4 হলে l = 0, 1, 2, 3, অর্থাৎ চতুর্থ শক্তিস্তরে চারটি উপশক্তিস্তর আছে: 4s, 4p, 4d ও 4f। উপশক্তিস্তর l এর মান অরবিটাল সংখ্যা সর্বোচ্চ ইলেকট্রন (2l + 1) 2(2l + 1) 4s 0 1 2 4p 1 3 6 4d 2 5 10 4f 3 7 14 উপশক্তিস্তর অনুযায়ী চতুর্থ স্তরের মোট ইলেকট্রন ধারণ ক্ষমতা =2+6+10+14=32 আবার, 2n² সূত্র অনুযায়ী, সর্বোচ্চ ইলেকট্রন ধারণ ক্ষমতা = 2n²=2×42=2×16=32 উভয় ক্ষেত্রেই মান 32 পাওয়া যায়। অতএব, উপশক্তিস্তরের মাধ্যমে দেখা গেল যে A (K) মৌলের বহিঃস্তরের (n = 4) সর্বোচ্চ ইলেকট্রন ধারণ ক্ষমতা 2n² এর সমান ।"}]},{"id":"ch4-cq2","chapter":4,"num":2,"importance":3,"topic":"ইলেকট্রন বিন্যাস থেকে পর্যায় সারণিতে মৌলের অবস্থান নির্ণয়","board":"দিনাজপুর বোর্ড ২০২৬","stem":"B একটি মৌল। যার একটি পরমাণুর ভর 1.992 × 10⁻²³ g [B প্রচলিত প্রতীক নয়]। B মৌলে সম সংখ্যক প্রোটন ও নিউট্রন রয়েছে ।","subQuestions":[{"label":"ক","question":"ইলেকট্রন বিন্যাস কাকে বলে?","answer":"ইলেকট্রন বিন্যাস: পরমাণুর বিভিন্ন শক্তিস্তর ও উপশক্তিস্তরের অরবিটালসমূহে নির্দিষ্ট নিয়ম অনুসারে ইলেকট্রনগুলোর সজ্জাকে ইলেকট্রন বিন্যাস বলে।"},{"label":"খ","question":"d⁴ হতে পারে না কেন? ব্যাখ্যা কর।","answer":"d উপশক্তিস্তরে 5টি অরবিটাল থাকে, তাই এতে সর্বোচ্চ 10টি ইলেকট্রন থাকতে পারে। অর্ধপূর্ণ (d5) ও পূর্ণ (d10) d অরবিটাল অধিক স্থিতিশীল । d4 বিন্যাসটি অর্ধপূর্ণ অবস্থা
