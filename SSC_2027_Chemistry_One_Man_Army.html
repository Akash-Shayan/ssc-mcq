 এদের দিয়ে মুদ্রা তৈরি করা হয়। তাই গ্রুপ-11 এর মৌলগুলোকে মুদ্রা ধাতু বলা হয়।"},{"label":"গ","question":"উদ্দীপকের কোন আকরিকটিকে তাপজারণ পদ্ধতিতে অক্সাইডে রূপান্তর করা হয়? ব্যাখ্যা কর।","answer":"উদ্দীপকের আকরিক তিনটি হলো—\n• (i) চালকোসাইট: Cu₂S (সালফাইড আকরিক)\n• (ii) বক্সাইট: Al₂O₃.2H₂O (পানিযুক্ত অক্সাইড আকরিক)\n• (iii) ক্যালামাইন: ZnCO₃ (কার্বনেট আকরিক) সাধারণত সালফাইড আকরিকের তাপজারণ করা হয়। তাপজারণে ঘনীকৃত আকরিককে গলনাঙ্কের চেয়ে কম তাপমাত্রায় বাতাসের উপস্থিতিতে উত্তপ্ত করা হয়। এতে সালফার, ফসফরাস, আর্সেনিক ইত্যাদি উদ্বায়ী খনিজমল অক্সাইড হিসেবে দূর হয় এবং ধাতুর সালফাইড ধাতুর অক্সাইডে পরিণত হয়। উদ্দীপকের তিনটি আকরিকের মধ্যে কেবল চালকোসাইট (Cu₂S) সালফাইড আকরিক। তাই চালকোসাইটকে তাপজারণ পদ্ধতিতে অক্সাইডে রূপান্তর করা হয়।\nΔ\n2Cu₂S+3O₂⟶2Cu₂O+2SO₂\nঅপরদিকে, বক্সাইট ও ক্যালামাইন সালফাইড আকরিক নয়। ক্যালামাইনকে বাতাসের অনুপস্থিতিতে উত্তপ্ত করে (ভস্মীকরণ) ZnO তে পরিণত করা হয়।\nΔ\nZnCO₃⟶ZnO+CO₂\nসুতরাং উদ্দীপকের (i) নং আকরিক চালকোসাইটকে তাপজারণ পদ্ধতিতে অক্সাইডে রূপান্তর করা হয়।"},{"label":"ঘ","question":"উদ্দীপকের আকরিক (ii) ও (iii) হতে ধাতু নিষ্কাশন পদ্ধতি কী একই উত্তরের সপক্ষে মতামত দাও।","answer":"উদ্দীপকের (ii) নং আকরিক বক্সাইট (Al₂O₃.2H₂O), যা থেকে অ্যালুমিনিয়াম (Al) এবং (iii) নং আকরিক ক্যালামাইন (ZnCO₃), যা থেকে জিংক (Zn) নিষ্কাশন করা হয়। ধাতুর সক্রিয়তা সিরিজে অবস্থানের উপর বিজারণ পদ্ধতি নির্ভর করে । Al বেশি সক্রিয় ধাতু, কিন্তু Zn মধ্যম সক্রিয় ধাতু। তাই এদের নিষ্কাশন পদ্ধতি একই নয়। বক্সাইট থেকে Al নিষ্কাশন (তড়িৎ বিশ্লেষণ): ঘনীকৃত বক্সাইট থেকে বিশুদ্ধ Al₂O₃ পাওয়া যায়। Al খুব সক্রিয় বলে কার্বন দিয়ে Al₂O₃ কে বিজারিত করা যায় না। Al₂O₃ এর গলনাঙ্ক 2050°C, তাই এর সাথে ক্রায়োলাইট (Na₃AlF₆) মিশিয়ে 800°C-1000°C তাপমাত্রায় গলানো হয়। গ্রাফাইটের আস্তরণযুক্ত স্টিলের পাত্র ক্যাথোড এবং কার্বন দণ্ড অ্যানোড হিসেবে কাজ করে।\nAl₂O₃(l)→2Al³⁺+3O²⁻\nক্যাথোডে: 2Al³⁺+6e⁻→2Al\nঅ্যানোডে: 3O²⁻→3/2O₂+6e⁻\nগলিত Al পাত্রের তলায় জমা হয়।\nক্যালামাইন থেকে Zn নিষ্কাশন (কার্বন বিজারণ): প্রথমে ক্যালামাইনকে ভস্মীকরণ করে ZnO তে পরিণত করা হয়। এরপর ZnO কে কার্বনসহ উত্তপ্ত করলে Zn ধাতু মুক্ত হয়।\nΔ\nZnCO₃⟶ZnO+CO₂\nΔ\nZnO+C⟶Zn+CO\nসুতরাং বক্সাইট থেকে তড়িৎ বিশ্লেষণে এবং ক্যালামাইন থেকে কার্বন বিজারণে ধাতু নিষ্কাশন করা হয়; অর্থাৎ (ii) ও (iii) নং আকরিক থেকে ধাতু নিষ্কাশন পদ্ধতি একই নয়।"}]},{"id":"ch10-cq2","chapter":10,"num":2,"importance":2,"topic":"ধাতু নিষ্কাশন","board":"যশোর বোর্ড ২০২৫","stem":"(i) Al₂O₃.2H₂O (ii) Fe₂O₃.3H₂O\n(iii)ZnS+O₂→A(s)+B(g)","subQuestions":[{"label":"ক","question":"ইলেকট্রোড কাকে বলে?","answer":"তড়িৎ বিশ্লেষ্য কোষে যে ধাতব দণ্ড বা গ্রাফাইট দণ্ডের মাধ্যমে তড়িৎ প্রবাহ তড়িৎ বিশ্লেষ্যে প্রবেশ করে বা বের হয়ে আসে, তাকে ইলেকট্রোড বলে ।"},{"label":"খ","question":"কেন বিক্রিয়ার সাম্যাবস্থা গতিশীল সাম্যাবস্থা হয়? ব্যাখ্যা কর।","answer":"উভমুখী বিক্রিয়ায় সম্মুখ বিক্রিয়ার হার ও পশ্চাৎ বিক্রিয়ার হার সমান হলে সাম্যাবস্থা সৃষ্টি হয়। এ অবস্থায় বাইরে থেকে বিক্রিয়ক ও উৎপাদের পরিমাণ স্থির মনে হলেও বিক্রিয়া থেমে যায় না। সাম্যাবস্থায় যে হারে বিক্রিয়ক থেকে উৎপাদ তৈরি হয়, ঠিক সেই হারে উৎপাদ ভেঙে আবার বিক্রিয়ক তৈরি হয়। যেমন–\nN₂+3H₂⇌2NH₃\nএখানে উভয় দিকের বিক্রিয়া একই সাথে চলতে থাকে বলে বিক্রিয়ার সাম্যাবস্থাকে গতিশীল সাম্যাবস্থা বলা হয়।"},{"label":"গ","question":"উদ্দীপকের 'B' থেকে এসিড প্রস্তুতি সমীকরণসহ বর্ণনা কর।","answer":"জিংক ব্লেন্ডকে (ZnS) বায়ুর উপস্থিতিতে উত্তপ্ত করলে (তাপজারণ) জিংক অক্সাইড ও সালফার ডাইঅক্সাইড উৎপন্ন হয়:\nΔ\n2ZnS+3O₂⟶2ZnO+2SO₂\nসুতরাং A = জিংক অক্সাইড (ZnO) এবং B = সালফার ডাইঅক্সাইড (SO₂) গ্যাস।\nB (SO₂) থেকে স্পর্শ পদ্ধতিতে সালফিউরিক এসিড (H₂SO₄) প্রস্তুত করা হয়।\n১. SO₂ গ্যাসের সাথে শুষ্ক বায়ু (O₂) মিশিয়ে 450°C-550°C তাপমাত্রায় ভ্যানাডিয়াম পেন্টাঅক্সাইড (V₂O₅) প্রভাবকের উপস্থিতিতে চুল্লিতে প্রেরণ করলে সালফার ট্রাইঅক্সাইড উৎপন্ন হয়: V₂O₅, 450°C-550°C\n2SO₂+O₂⟶2SO₃\n২. SO₃ কে সরাসরি পানিতে শোষণ করালে বাষ্পীয় H₂SO₄ ঘন কুয়াশার সৃষ্টি করে, যা ঘনীভূত করা কঠিন । তাই SO₃ কে গাঢ় H₂SO₄ এ শোষণ করে ধূমায়মান সালফিউরিক এসিড বা অলিয়াম তৈরি করা হয়:\nH₂SO₄+SO₃→H₂S₂O₇\n৩. অলিয়ামে পরিমিত পানি যোগ করলে তরল সালফিউরিক এসিড পাওয়া যায়:\nH₂S₂O₇+H₂O→2H₂SO₄\nএভাবে উদ্দীপকের B তথা SO₂ থেকে সালফিউরিক এসিড প্রস্তুত করা হয়।"},{"label":"ঘ","question":"(i) ও (ii) নং আকরিক থেকে ধাতু নিষ্কাশনের জন্য একই নিষ্কাশন পদ্ধতি ব্যবহার করা সম্ভব নয়-যুক্তিসহ বিশ্লেষণ কর।","answer":"উদ্দীপকের (i) Al₂O₃.2H₂O হলো বক্সাইট, অ্যালুমিনিয়ামের (Al) আকরিক। (ii) Fe₂O₃.3H₂O হলো লিমোনাইট, আয়রনের (Fe) আকরিক । সক্রিয়তা সিরিজে Al উপরের দিকে (অধিক সক্রিয়) এবং Fe মাঝামাঝি (মধ্যম সক্রিয়)। তাই এদের নিষ্কাশন পদ্ধতি ভিন্ন। (i) বক্সাইট থেকে Al: তড়িৎ বিশ্লেষণ Al অধিক সক্রিয় বলে Al₂O₃ কে কার্বন দ্বারা বিজারিত করা যায় না। প্রথমে রাসায়নিক পদ্ধতিতে বক্সাইট থেকে বিশুদ্ধ Al₂O₃ তৈরি করা হয়:\nΔ\nAl₂O₃.2H₂O+2NaOH⟶2NaAlO₂+3H₂O\nNaAlO₂+2H₂O→Al(OH)₃+NaOH\n1100°C\n2Al(OH)₃⟶Al₂O₃+3H₂O\nAl₂O₃ এর গলনাঙ্ক 2050°C, কিন্তু ক্রায়োলাইট (Na₃AlF₆) মিশালে 800°C-1000°C এ গলে। গ্রাফাইটের আস্তরণযুক্ত স্টিলের পাত্র ক্যাথোড এবং কার্বন দণ্ড অ্যানোড হিসেবে ব্যবহার করে তড়িৎ বিশ্লেষণ করা হয়:\nAl₂O₃→2Al³⁺+3O²⁻\n2Al³⁺+6e⁻→2Al [ক্যাথোড]\n6O²⁻→3O₂+12e⁻ [অ্যানোড]\n(ii) লিমোনাইট থেকে Fe: কার্বন বিজারণ লিমোনাইটকে ভস্মীকরণ করে Fe₂O₃ তে পরিণত করা হয় এবং বাত্যাচুল্লিতে কোক দ্বারা বিজারিত করা হয়:\nΔ\nFe₂O₃.3H₂O⟶Fe₂O₃+3H₂O\nΔ\nFe₂O₃+3C⟶2Fe+3CO\nFe₂O₃+3CO→2Fe+3CO₂\nঅতএব, অধিক সক্রিয় Al এর আকরিক বক্সাইট থেকে তড়িৎ বিশ্লেষণে এবং মধ্যম সক্রিয় Fe এর আকরিক লিমোনাইট থেকে কার্বন বিজারণে ধাতু নিষ্কাশন করতে হয়। তাই (i) ও (ii) নং আকরিক থেকে একই পদ্ধতিতে ধাতু নিষ্কাশন সম্ভব নয়।"}]},{"id":"ch10-cq3","chapter":10,"num":3,"importance":2,"topic":"ধাতু নিষ্কাশন","board":"চট্টগ্রাম বোর্ড ২০২৫","stem":"মৌল আকরিক P চালকোসাইট Q হেমাটাইট = Fe R সিন্নাবার = Hg [এখানে P, Q, R প্রতীকী অর্থে ব্যবহৃত]","subQuestions":[{"label":"ক","question":"নিরুদক কাকে বলে?","answer":"যে পদার্থ কোনো যৌগ থেকে পানি শোষণ করে নেয়, তাকে নিরুদক বলে। যেমন– গাঢ় H₂SO₄।"},{"label":"খ","question":"ভিনেগার দ্বারা কীভাবে খাদ্য সংরক্ষণ করা হয়? ব্যাখ্যা কর।","answer":"ভিনেগার হলো ইথানয়িক এসিডের (CH₃COOH) লঘু জলীয় দ্রবণ । খাদ্যদ্রব্য ভিনেগারে ডুবিয়ে রাখলে খাদ্যের pH কমে যায় অর্থাৎ পরিবেশ অম্লীয় হয়। অম্লীয় পরিবেশে খাদ্য পচনকারী ব্যাকটেরিয়া ও ছত্রাক জন্মাতে ও বংশবৃদ্ধি করতে পারে না। ফলে খাদ্য সহজে পচে না এবং দীর্ঘদিন সংরক্ষণ করা যায়। এজন্য আচার, চাটনি ইত্যাদি সংরক্ষণে ভিনেগার ব্যবহার করা হয়।"},{"label":"গ","question":"উদ্দীপকের P মৌলের বিশুদ্ধকরণ চিত্রসহ বর্ণনা কর।","answer":"উদ্দীপকের P মৌলের আকরিক চালকোসাইট (Cu₂S)। সুতরাং P = কপার (Cu)। স্ববিজারণ পদ্ধতিতে প্রাপ্ত কপার প্রায় 98% বিশুদ্ধ । তড়িৎ বিশোধন পদ্ধতিতে একে 99.9% বিশুদ্ধ করা হয়। চিত্রের বিবরণ (কপারের তড়িৎ বিশোধন)\n• একটি পাত্রে তড়িৎ বিশ্লেষ্য হিসেবে কপার সালফেট (CuSO₄) এর জলীয় দ্রবণ ।\n• অ্যানোড: মোটা অবিশুদ্ধ কপার দণ্ড, ব্যাটারির ধনাত্মক প্রান্তে যুক্ত।\n• ক্যাথোড: পাতলা বিশুদ্ধ কপার দণ্ড বা পাত, ব্যাটারির ঋণাত্মক প্রান্তে যুক্ত।\n• অ্যানোডের নিচে পাত্রের তলায় অপদ্রব্য (অ্যানোড মাড) জমা হয়। কার্যপ্রণালি দ্রবণে বিদ্যুৎ প্রবাহিত করলে অ্যানোডের অবিশুদ্ধ কপারের পরমাণু ইলেকট্রন ত্যাগ করে Cu²⁺ আয়নরূপে দ্রবণে যায় (জারণ):\nCu(s)→Cu²⁺(aq)+2e⁻ [অ্যানোড]\nদ্রবণের Cu²⁺ আয়ন ক্যাথোড থেকে ইলেকট্রন গ্রহণ করে বিশুদ্ধ কপাররূপে ক্যাথোডে জমা হয় (বিজারণ):\nCu²⁺(aq)+2e⁻→Cu(s) [ক্যাথোড]\nফলে অ্যানোড ক্রমশ ক্ষয় হয় এবং ক্যাথোড মোটা হতে থাকে। অপদ্রব্যগুলো অ্যানোডের নিচে তলানিরূপে পড়ে থাকে বা দ্রবণে থেকে যায়। এভাবে উদ্দীপকের P (Cu) ধাতুকে 99.9% বিশুদ্ধ করা হয়।"},{"label":"ঘ","question":"উদ্দীপকের Q ও R ধাতু দুইটির নিষ্কাশন প্রক্রিয়ার ভিন্নতা বিশ্লেষণ কর।","answer":"উদ্দীপকের Q এর আকরিক হেমাটাইট (Fe₂O₃), তাই Q = আয়রন (Fe)। R এর আকরিক সিন্নাবার (HgS), তাই R = মার্কারি (Hg)। সক্রিয়তা সিরিজে Fe মধ্যম সক্রিয় এবং Hg কম সক্রিয় ধাতু। তাই এদের নিষ্কাশনে ভিন্ন বিজারণ পদ্ধতি প্রয়োগ করা হয়। Q (Fe) এর নিষ্কাশন: কার্বন বিজারণ হেমাটাইটকে চূর্ণ ও ঘনীভূত করে কোক ও চুনাপাথরের সাথে বাত্যাচুল্লিতে উত্তপ্ত করা হয়। এখানে কার্বন ও CO বিজারকের কাজ করে:\nC+O₂→CO₂\nCO₂+C→2CO\nFe₂O₃+3CO→2Fe+3CO₂\nFe₂O₃+3C→2Fe+3CO\nখনিজমল দূর হয় ধাতুমল (CaSiO₃) রূপে:\nΔ\nCaCO₃⟶CaO+CO₂\nCaO+SiO₂→CaSiO₃\nR (Hg) এর নিষ্কাশন: স্ববিজারণ Hg কম সক্রিয় বলে সিন্নাবারকে কোনো বিজারক ছাড়া শুধু বায়ুতে উত্তপ্ত করলেই মার্কারি পাওয়া যায়:\nΔ\nHgS+O₂⟶Hg+SO₂\nঅথবা,\nΔ\n2HgS+3O₂⟶2HgO+2SO₂\nΔ\n2HgO+HgS⟶3Hg+SO₂\nঅতএব, Q (Fe) নিষ্কাশনে কার্বনকে বিজারক হিসেবে যোগ করতে হয়, কিন্তু R (Hg) নিষ্কাশনে কোনো বাইরের বিজারক লাগে না। তাই Q ও R এর নিষ্কাশন প্রক্রিয়া ভিন্ন।"}]},{"id":"ch10-cq4","chapter":10,"num":4,"importance":2,"topic":"কতিপয় ধাতু এবং সংকর ধাতুর ক্ষয় হওয়ার লক্ষণ, কারণ ও প্রতিকার","board":"ঢাকা বোর্ড ২০২০","stem":"P, Q ও R তিনটি ধাতব মৌল। ভূ-ত্বকে মৌলগুলোর প্রাপ্তিতার হার ক্রমবর্ধমান । P-মৌলটির পারমাণবিক সংখ্যা 19।","subQuestions":[{"label":"ক","question":"ঊর্ধ্বপাতন কাকে বলে?","answer":"যে প্রক্রিয়ায় কোনো কঠিন পদার্থকে তাপ দিলে তা তরলে পরিণত না হয়ে সরাসরি বাষ্পে পরিণত হয় এবং বাষ্পকে ঠান্ডা করলে আবার সরাসরি কঠিনে পরিণত হয়, তাকে ঊর্ধ্বপাতন বলে। যেমন: কর্পূর, ন্যাপথালিন, আয়োডিন ।"},{"label":"খ","question":"চিকিৎসা ক্ষেত্রে তেজস্ক্রিয় আইসোটোপ গুরুত্বপূর্ণ —ব্যাখ্যা কর।","answer":"তেজস্ক্রিয় আইসোটোপ থেকে নির্গত রশ্মি রোগ নির্ণয় ও চিকিৎসায় ব্যবহৃত হয়। কোবাল্ট-60 (⁶⁰Co) থেকে নির্গত গামা রশ্মি দিয়ে ক্যান্সার আক্রান্ত কোষ ধ্বংস করা হয় (রেডিওথেরাপি)। আয়োডিন-131 থাইরয়েড গ্রন্থির রোগ নির্ণয় ও চিকিৎসায় এবং টেকনেশিয়াম-99m দেহের অভ্যন্তরের অঙ্গের ছবি তুলে রোগ নির্ণয়ে ব্যবহৃত হয়। এছাড়া তেজস্ক্রিয় রশ্মি দিয়ে চিকিৎসা সরঞ্জাম জীবাণুমুক্ত করা হয়। তাই চিকিৎসা ক্ষেত্রে তেজস্ক্রিয় আইসোটোপ গুরুত্বপূর্ণ ।"},{"label":"গ","question":"সমীকরণসহ Q ধাতুটির নিষ্কাশন প্রক্রিয়া বর্ণনা কর।","answer":"P মৌলের পারমাণবিক সংখ্যা 19, তাই P হলো পটাশিয়াম (K)। ভূত্বকে প্রাপ্তিতা: K 3%, Ca 4%, Fe 5%। প্রাপ্তিতার হার ক্রমবর্ধমান বলে Q = ক্যালসিয়াম (Ca) এবং R = আয়রন (Fe)। Ca অধিক সক্রিয় ধাতু (সক্রিয়তা সিরিজের উপরের দিকে), তাই কার্বন দিয়ে এর অক্সাইড বিজারিত হয় না; তড়িৎ বিশ্লেষণের মাধ্যমে Ca নিষ্কাশন করা হয়। গলিত ক্যালসিয়াম ক্লোরাইড (CaCl₂) তড়িৎ বিশ্লেষ্য হিসেবে নিয়ে গ্রাফাইট দণ্ডকে অ্যানোড (ধনাত্মক প্রান্ত) এবং লোহার দণ্ডকে ক্যাথোড (ঋণাত্মক প্রান্ত) হিসেবে ব্যবহার করে তড়িৎ প্রবাহিত করা হয়। গলিত অবস্থায় CaCl₂ আয়নে বিয়োজিত থাকে।\nCaCl₂→Ca²⁺+2Cl⁻\n2Cl⁻→Cl₂+2e⁻ [অ্যানোডে জারণ]\nCa²⁺+2e⁻→Ca [ক্যাথোডে বিজারণ]\nক্যাথোডে ধাতব ক্যালসিয়াম জমা হয় এবং অ্যানোডে Cl₂ গ্যাস উপজাত হিসেবে পাওয়া যায়। এভাবে Q ধাতু (Ca) নিষ্কাশন করা হয়।"},{"label":"ঘ","question":"উদ্দীপকের R-ধাতুটি দ্বারা তৈরি নিত্য ব্যবহৃত যন্ত্রগুলো দীর্ঘস্থায়ী করার প্রক্রিয়া —আলোচনা কর।","answer":"উদ্দীপকের R ধাতুটি আয়রন (Fe)। লোহার তৈরি যন্ত্র বাতাসের O₂ ও পানির সংস্পর্শে মরিচা পড়ে ক্ষয়প্রাপ্ত হয়।\n4Fe+3O₂+6H₂O→4Fe(OH)₃\n2Fe(OH)₃→Fe₂O₃.3H₂O (মরিচা)\nলোহাকে O₂ ও পানির সংস্পর্শে আসতে না দিলে ক্ষয় হয় না। এজন্য নিচের প্রক্রিয়াগুলো ব্যবহার করে যন্ত্রগুলো দীর্ঘস্থায়ী করা হয়— (i) রং করা: লোহার দরজা-জানালা, গ্রিল ইত্যাদিতে রঙের আবরণ লোহাকে বাতাস ও পানি থেকে আলাদা রাখে। (ii) ইলেকট্রোপ্লেটিং: তড়িৎ বিশ্লেষণে লোহার উপর কম সক্রিয় ধাতুর প্রলেপ দেওয়া হয়। যেমন: CuSO₄ দ্রবণে Cu দণ্ডকে অ্যানোড (ধনাত্মক প্রান্ত) এবং লোহার বস্তুকে ক্যাথোড (ঋণাত্মক প্রান্ত) করে তড়িৎ প্রবাহিত করলে লোহার উপর Cu এর প্রলেপ পড়ে ।\nCu→Cu²⁺+2e⁻ [অ্যানোডে জারণ]\nCu²⁺+2e⁻→Cu [ক্যাথোডে বিজারণ]\n(iii) গ্যালভানাইজিং: লোহার উপর জিংকের প্রলেপ দেওয়া হয় (যেমন: ঢেউটিন); এতে তড়িৎ বিশ্লেষণ লাগে না। প্রলেপ লোহাকে O₂ ও পানি থেকে রক্ষা করে। সুতরাং রং করা, ইলেকট্রোপ্লেটিং ও গ্যালভানাইজিং এর মাধ্যমে লোহাকে বাতাসের O₂ ও পানির সংস্পর্শ থেকে দূরে রেখে R ধাতুর তৈরি নিত্য ব্যবহৃত যন্ত্রগুলো দীর্ঘস্থায়ী করা যায়।"}]},{"id":"ch10-cq5","chapter":10,"num":5,"importance":2,"topic":"খনিজ অধাতু","board":"দিনাজপুর বোর্ড ২০২৪","stem":"Δ\nচালকোসাইট +O₂⟶X+Y(g)","subQuestions":[{"label":"ক","question":"অপধাতু কাকে বলে?","answer":"যেসব মৌল ধাতু ও অধাতু উভয়ের কিছু কিছু ধর্ম প্রদর্শন করে, তাদেরকে অপধাতু বলে। যেমন: বোরন (B), সিলিকন (Si), জার্মেনিয়াম (Ge), আর্সেনিক (As)।"},{"label":"খ","question":"পিঁপড়ার কামড়ের ক্ষতস্থানে চুন প্রয়োগ করা হয় কেন?","answer":"পিঁপড়া কামড় দিলে ক্ষতস্থানে ফরমিক এসিড (HCOOH) প্রবেশ করায় । এই এসিডের কারণে ক্ষতস্থানে জ্বালা-যন্ত্রণা হয়। চুন (CaO) পানির সংস্পর্শে ক্ষারীয় Ca(OH)₂ তৈরি করে। ক্ষতস্থানে চুন দিলে এটি ফরমিক এসিডকে প্রশমিত করে লবণ ও পানি উৎপন্ন করে।\n2HCOOH+Ca(OH)₂→(HCOO)₂Ca+2H₂O\nফলে এসিডের ক্রিয়া নষ্ট হয় এবং জ্বালা কমে যায়। এজন্য পিঁপড়ার কামড়ের ক্ষতস্থানে চুন প্রয়োগ করা হয়।"},{"label":"গ","question":"'X' যৌগ হতে কাঙ্ক্ষিত ধাতু নিষ্কাশন ব্যাখ্যা কর।","answer":"চালকোসাইট হলো কপারের আকরিক (Cu₂S)। একে বায়ুর উপস্থিতিতে উত্তপ্ত (তাপজারণ) করলে কিউপ্রাস অক্সাইড ও সালফার ডাই-অক্সাইড উৎপন্ন হয়।\nΔ\n2Cu₂S+3O₂⟶2Cu₂O+2SO₂\nসুতরাং X হলো কিউপ্রাস অক্সাইড (Cu₂O) এবং Y হলো সালফার ডাই-অক্সাইড (SO₂)। কাঙ্ক্ষিত ধাতু কপার (Cu)। স্ববিজারণ: কপার সক্রিয়তা সিরিজের নিচের দিকের কম সক্রিয় ধাতু। তাই বাইরে থেকে কোনো বিজারক যোগ করতে হয় না। তাপজারণে উৎপন্ন Cu₂O অবশিষ্ট Cu₂S এর সাথে বায়ুর অনুপস্থিতিতে উত্তপ্ত হলে নিজেরাই বিক্রিয়া করে কপার ধাতু উৎপন্ন করে।\nΔ\nCu₂S+2Cu₂O⟶6Cu+SO₂\nএভাবে প্রাপ্ত কপার প্রায় 98% বিশুদ্ধ ।\nতড়িৎ বিশোধন: CuSO₄ এর জলীয় দ্রবণে অবিশুদ্ধ কপারের মোটা দণ্ডকে অ্যানোড এবং বিশুদ্ধ কপারের পাতলা দণ্ডকে ক্যাথোড হিসেবে ব্যবহার করে বিদ্যুৎ চালনা করা হয়।\nঅ্যানোডে: Cu(s)→Cu²⁺+2e⁻\nক্যাথোডে: Cu²⁺+2e⁻→Cu(s)\nফলে ক্যাথোডে 99.9% বিশুদ্ধ কপার জমা হয়। সুতরাং স্ববিজারণ ও তড়িৎ বিশোধনের মাধ্যমে 'X' (Cu₂O) থেকে কপার ধাতু নিষ্কাশন করা হয়।"},{"label":"ঘ","question":"'Y' যৌগ হতে জারক ও নিরুদকধর্মী এসিড প্রস্তুত সম্ভব কিনা? বিক্রিয়াসহ বিশ্লেষণ কর।","answer":"উদ্দীপকের Y যৌগ হলো সালফার ডাই-অক্সাইড (SO₂)। জারক ও নিরুদকধর্মী এসিড হলো গাঢ় সালফিউরিক এসিড (H₂SO₄)। স্পর্শ পদ্ধতিতে SO₂ থেকে H₂SO₄ প্রস্তুত করা যায়। V₂O₅, 450°C-550°C\n2SO₂+O₂⟶2SO₃\nH₂SO₄+SO₃→H₂S₂O₇\nH₂S₂O₇+H₂O→2H₂SO₄\n(SO₃ কে সরাসরি পানিতে শোষণ করালে ঘন কুয়াশা হয় বলে প্রথমে গাঢ় H₂SO₄ এ শোষণ করে অলিয়াম তৈরি করা হয়।) জারক ধর্ম: গাঢ় H₂SO₄ কপারকে জারিত করে কপার সালফেটে পরিণত করে এবং নিজে বিজারিত হয়ে SO₂ উৎপন্ন করে।\nΔ\nCu+2H₂SO₄(গাঢ়)⟶CuSO₄+SO₂+2H₂O\nনিরুদক ধর্ম: গাঢ় H₂SO₄ চিনি (C₁₂H₂₂O₁₁) থেকে পানি শোষণ করে কালো কার্বন অবশেষ রেখে দেয়।\nC₁₂H₂₂O₁₁+H₂SO₄(গাঢ়) → 12C + H₂SO₄.11H₂O\nসুতরাং 'Y' যৌগ (SO₂) থেকে জারক ও নিরুদকধর্মী এসিড গাঢ় H₂SO₄ প্রস্তুত করা সম্ভব ।"}]},{"id":"ch10-cq6","chapter":10,"num":6,"importance":2,"topic":"খনিজ অধাতু","board":"রাজশাহী বোর্ড ২০২৪","stem":"(i)2K+H₂SO₄→K₂SO₄+H₂\n(ii)H₂S₂O₇+H₂O→2′X′","subQuestions":[{"label":"ক","question":"তড়িৎ ঋণাত্মকতা কাকে বলে?","answer":"কোনো সমযোজী বন্ধনে আবদ্ধ পরমাণু বন্ধনের শেয়ারকৃত ইলেকট্রন যুগলকে নিজের দিকে আকর্ষণ করার যে ক্ষমতা দেখায়, তাকে ঐ পরমাণুর তড়িৎ ঋণাত্মকতা বলে।"},{"label":"খ","question":"গ্যালেনা লেড ধাতুর আকরিক- ব্যাখ্যা কর।","answer":"যে খনিজ থেকে লাভজনকভাবে ধাতু নিষ্কাশন করা যায়, তাকে ঐ ধাতুর আকরিক বলে। গ্যালেনা (PbS) লেডের সালফাইড খনিজ, এতে লেডের পরিমাণ বেশি এবং এ থেকে সহজে ও কম খরচে লেড পাওয়া যায়। গ্যালেনাকে তাপজারণ করে PbO তে পরিণত করে কার্বন দ্বারা বিজারিত করলে লেড পাওয়া যায়:\nΔ\n2PbS+3O₂⟶2PbO+2SO₂\nΔ\nPbO+C⟶Pb+CO\nগ্যালেনা থেকে লাভজনকভাবে লেড নিষ্কাশন করা যায় বলে গ্যালেনা লেড ধাতুর আকরিক।"},{"label":"গ","question":"(i) নং বিক্রিয়ায় উৎপন্ন গ্যাসীয় মৌলটিকে পর্যায় সারণির গ্রুপ-1 এ স্থান দেয়ার কারণ ব্যাখ্যা কর।","answer":"(i) নং বিক্রিয়ায় উৎপন্ন গ্যাসীয় মৌলটি হাইড্রোজেন (H₂)।\n2K+H₂SO₄→K₂SO₄+H₂\nহাইড্রোজেনের (H) পারমাণবিক সংখ্যা 1, ইলেকট্রন বিন্যাস 1s¹। গ্রুপ-1 এর ক্ষার ধাতুগুলোর মতো এর সর্বশেষ শক্তিস্তরে 1টি ইলেকট্রন আছে। যেমন– Li: 1s² 2s¹, Na: 1s² 2s² 2p⁶ 3s¹। হাইড্রোজেনের কিছু ধর্ম ক্ষার ধাতুর সাথে মিলে যায়:\n• ক্ষার ধাতুর মতো H একটি ইলেকট্রন ত্যাগ করে একক ধনাত্মক আয়ন (H⁺) গঠন করে।\n• ক্ষার ধাতুর মতো এর যোজনী 1।\n• ক্ষার ধাতুর মতো এটি অধাতুর সাথে যৌগ গঠন করে, যেমন – HCl ও NaCl, H₂O ও Na₂O। তবে H অধাতু এবং হ্যালোজেনের মতো একটি ইলেকট্রন গ্রহণ করে H⁻ আয়নও গঠন করতে পারে। তবু ইলেকট্রন বিন্যাস ও অধিকাংশ ধর্ম গ্রুপ-1 এর মৌলের সাথে মিলে যাওয়ায় হাইড্রোজেনকে পর্যায় সারণির গ্রুপ-1 এ স্থান দেওয়া হয়েছে ।"},{"label":"ঘ","question":"উদ্দীপকের X যৌগটির জারণ এবং নিরুদন ধর্ম বিশ্লেষণ কর।","answer":"(ii) নং বিক্রিয়ায় অলিয়াম পানির সাথে বিক্রিয়া করে সালফিউরিক এসিড উৎপন্ন করে:\nH₂S₂O₇+H₂O→2H₂SO₄\nসুতরাং X = সালফিউরিক এসিড (H₂SO₄)। লঘু H₂SO₄ এর জারণ ও নিরুদন ধর্ম নেই, কিন্তু গাঢ় H₂SO₄ এর উভয় ধর্ম আছে। জারণ ধর্ম গাঢ় H₂SO₄ উত্তপ্ত অবস্থায় কপারকে জারিত করে কপার সালফেটে পরিণত করে এবং নিজে বিজারিত হয়ে SO₂ ও পানি উৎপন্ন করে:\nΔ\nCu+2H₂SO₄(গাঢ়)⟶CuSO₄+SO₂+2H₂O\nএখানে Cu এর জারণ সংখ্যা 0 থেকে +2 হয় (জারণ) এবং S এর জারণ সংখ্যা +6 থেকে +4 হয় (বিজারণ)। তাই গাঢ় H₂SO₄ জারক। নিরুদন ধর্ম গাঢ় H₂SO₄ চিনি (C₁₂H₂₂O₁₁) থেকে পানি শোষণ করে কালো কার্বন অবশিষ্ট রাখে:\nC₁₂H₂₂O₁₁+H₂SO₄(গাঢ়) → 12C + H₂SO₄.11H₂O\nযৌগ থেকে পানি শোষণ করে বলে গাঢ় H₂SO₄ নিরুদক । অতএব, উদ্দীপকের X (গাঢ় H₂SO₄) একই সাথে জারক ও নিরুদক হিসেবে কাজ করে।"}]},{"id":"ch11-cq1","chapter":11,"num":1,"importance":2,"topic":"জীবাশ্ম জ্বালানি: প্রাকৃতিক গ্যাস ও পেট্রোলিয়াম","board":"ঢাকা বোর্ড ২০২১","stem":"পেট্রোলিয়ামের উপাদান আংশিক কলামের তাপমাত্রা X 0°C — 20°C Y 21°C — 70°C Z 121°C — 170°C P 271°C — 340°C","subQuestions":[{"label":"ক","question":"সমগোত্রীয় শ্রেণি কাকে বলে?","answer":"যেসব জৈব যৌগের সাধারণ সংকেত ও কার্যকরী মূলক একই, পরপর দুটি সদস্যের মধ্যে একটি -CH₂- মূলকের পার্থক্য থাকে, রাসায়নিক ধর্ম প্রায় একই এবং ভৌত ধর্মের ক্রমপরিবর্তন ঘটে, তাদের সমগোত্রীয় শ্রেণি বলে। যেমন: CH₄, C₂H₆, C₃H₈ …"},{"label":"খ","question":"ন্যাপথালিন একটি অ্যারোমেটিক যৌগ — ব্যাখ্যা করো।","answer":"যেসব চাক্রিক যৌগে বেনজিন বলয় থাকে এবং বলয়ে একান্তরভাবে একক ও দ্বিবন্ধন থাকে, তাদের অ্যারোমেটিক যৌগ বলে। ন্যাপথালিনের (C₁₀H₈) অণুতে দুটি বেনজিন বলয় পাশাপাশি যুক্ত (একটি C-C বন্ধন দুই বলয়ে ভাগাভাগি) এবং বলয়ে একক ও দ্বিবন্ধন পর্যায়ক্রমে সজ্জিত । এর বৈশিষ্ট্যপূর্ণ গন্ধও আছে । অর্থাৎ অ্যারোমেটিক যৌগের বৈশিষ্ট্যগুলো ন্যাপথালিনে আছে, তাই এটি একটি অ্যারোমেটিক যৌগ।"},{"label":"গ","question":"'X' এর প্রথম সদস্যের সাথে ক্লোরিন গ্যাস চালনা করলে কী ঘটবে? সমীকরণসহ লেখ।","answer":"উদ্দীপকের X পৃথক হয় 0°C – 20°C তাপমাত্রায়, তাই X হলো পেট্রোলিয়াম গ্যাস (কার্বন সংখ্যা 1 – 4)। এর প্রথম সদস্য মিথেন (CH₄)। মিথেন সম্পৃক্ত হাইড্রোকার্বন, তাই যুত বিক্রিয়া দেয় না। অতিবেগুনি (UV) আলোর উপস্থিতিতে মিথেনের সাথে ক্লোরিন গ্যাস চালনা করলে প্রতিস্থাপন বিক্রিয়া ঘটে; মিথেনের H পরমাণু চার ধাপে একে একে Cl দ্বারা প্রতিস্থাপিত হয় এবং প্রতিটি ধাপে HCl উৎপন্ন হয়:\nUV\nCH₄+Cl₂⟶CH₃Cl+HCl\nUV\nCH₃Cl+Cl₂⟶CH₂Cl₂+HCl\nUV\nCH₂Cl₂+Cl₂⟶CHCl₃+HCl\nUV\nCHCl₃+Cl₂⟶CCl₄+HCl\nউৎপাদগুলো যথাক্রমে ক্লোরোমিথেন, ডাইক্লোরোমিথেন, ট্রাইক্লোরোমিথেন (ক্লোরোফর্ম) ও টেট্রাক্লোরোমিথেন । অন্ধকারে এ বিক্রিয়া ঘটে না।\nসিদ্ধান্ত: X এর প্রথম সদস্য মিথেনের সাথে UV আলোতে ক্লোরিন চালনা করলে ক্রমান্বয়ে CH₃Cl, CH₂Cl₂, CHCl₃ ও শেষে CCl₄ উৎপন্ন হয়।"},{"label":"ঘ","question":"উদ্দীপকের Y, Z এবং P শনাক্ত করে এদের বর্ণনা দাও।","answer":"পেট্রোলিয়াম বিভিন্ন হাইড্রোকার্বনের মিশ্রণ । আংশিক পাতন কলামের নিচে তাপমাত্রা বেশি, উপরে কম; প্রতিটি উপাদান নিজ স্ফুটনাঙ্ক-সীমায় পৃথক হয়। উদ্দীপকের তাপমাত্রা-সীমা মিলিয়ে উপাদানগুলো শনাক্ত করা যায়। Y = পেট্রোল (গ্যাসোলিন): স্ফুটনাঙ্ক 21°C – 70°C; কার্বন সংখ্যা 5 – 10; পেট্রোলিয়ামে 5% থাকে; যানবাহনের ইঞ্জিনে জ্বালানি হিসেবে ব্যবহৃত হয়। Z = কেরোসিন: স্ফুটনাঙ্ক 121°C – 170°C; কার্বন সংখ্যা 11 – 16; পেট্রোলিয়ামে 13% থাকে; জেট ইঞ্জিনের জ্বালানি হিসেবে ব্যবহৃত হয়। P = প্যারাফিন মোম: স্ফুটনাঙ্ক 271°C – 340°C; কার্বন সংখ্যা 20 – 30; উচ্চ আণবিক ভরের অ্যালকেন বলে সাধারণ তাপমাত্রায় কঠিন; টয়লেট্রিজ ও ভ্যাসলিন তৈরিতে ব্যবহৃত হয়। Y থেকে P এর দিকে কার্বন সংখ্যা ও অণুর আকার বাড়ায় স্ফুটনাঙ্ক বাড়ে; তাই কলামে Y সবচেয়ে উপরে, Z মাঝে এবং P নিচের দিকে পৃথক হয়।\nসিদ্ধান্ত: Y হলো পেট্রোল (গ্যাসোলিন), Z হলো কেরোসিন এবং P হলো প্যারাফিন মোম; স্ফুটনাঙ্কের পার্থক্যের কারণেই আংশিক পাতনে এদের পৃথক করা যায়।"}]},{"id":"ch11-cq2","chapter":11,"num":2,"importance":3,"topic":"সম্পৃক্ত হাইড্রোকার্বন: অ্যালকেন","board":"যশোর বোর্ড ২০২৬","stem":"Δ\n(i)A+NaOH(aq)⟶B+NaX\nK₂Cr₂O₇ + H₂SO₄\n(ii)B+[O]⟶C\n[এখানে A যৌগটি দুই কার্বনবিশিষ্ট অ্যালকাইল হ্যালাইড]","subQuestions":[{"label":"ক","question":"সমগোত্রীয় শ্রেণি কী?","answer":"একই কার্যকরী মূলকবিশিষ্ট যেসব জৈব যৌগকে একটি সাধারণ সংকেত দ্বারা প্রকাশ করা যায় এবং যাদের পরপর দুটি সদস্যের মধ্যে CH₂ পার্থক্য থাকে, তাদেরকে একত্রে সমগোত্রীয় শ্রেণি বলে।"},{"label":"খ","question":"শক্তিশালী এসিড ও শক্তিশালী ক্ষারের প্রশমন বিক্রিয়ায় উৎপন্ন\nতাপের পরিমাণ ধ্রুব কেন? ব্যাখ্যা কর।","answer":"শক্তিশালী এসিড ও শক্তিশালী ক্ষার জলীয় দ্রবণে সম্পূর্ণরূপে আয়নিত অবস্থায় থাকে। যেমন:\nHCl+NaOH→NaCl+H₂O\nH⁺+Cl⁻+Na⁺+OH⁻→Na⁺+Cl⁻+H₂O\nএখানে Na⁺ ও Cl⁻ আয়ন বিক্রিয়ায় অংশ নেয় না। প্রকৃতপক্ষে যেকোনো শক্তিশালী এসিড ও শক্তিশালী ক্ষারের প্রশমনে একই বিক্রিয়া ঘটে:\nH⁺(aq)+OH⁻(aq)→H₂O(l); ΔH=−57.3kJ/mol\nযেহেতু সব ক্ষেত্রে মূল বিক্রিয়া একটাই, অর্থাৎ 1 mol H⁺ ও 1 mol OH⁻ মিলে 1 mol পানি তৈরি হয়, তাই উৎপন্ন তাপের পরিমাণ ধ্রুব (প্রায় 57.3 kJ) থাকে।"},{"label":"গ","question":"B যৌগটি কেন পানিতে দ্রবীভূত হয়? ব্যাখ্যা কর।","answer":"A দুই কার্বনবিশিষ্ট অ্যালকাইল হ্যালাইড, অর্থাৎ ইথাইল হ্যালাইড (C₂H₅X)। একে জলীয় NaOH এর সাথে উত্তপ্ত করলে ইথানল (B) উৎপন্ন হয়:\nΔ\nCH₃-CH₂-X+NaOH(aq)⟶CH₃-CH₂-OH+NaX\nঅতএব, B যৌগটি ইথানল (CH₃-CH₂-OH)।\nইথানলে পোলার -OH মূলক আছে। -OH মূলকের O পরমাণু তড়িৎ ঋণাত্মক হওয়ায় O-H বন্ধনে H আংশিক ধনাত্মক (δ+) এবং O\nআংশিক ঋণাত্মক (δ-) হয়। ফলে ইথানলের অণু পানির অণুর সাথে হাইড্রোজেন বন্ধন গঠন করে: CH₃-CH₂-O-H ··· O(H)-H তাছাড়া ইথানলের অপোলার অ্যালকাইল অংশ (C₂H₅-) খুব ছোট হওয়ায় তা দ্রবীভবনে বাধা দেয় না। এ কারণে ইথানল (B) যেকোনো অনুপাতে পানিতে দ্রবীভূত হয়।"},{"label":"ঘ","question":"C যৌগ হতে ইথেন এর সমগোত্রীয় যৌগ তৈরি করা সম্ভব কি? বিশ্লেষণ কর।","answer":"(ii) নং বিক্রিয়ায় B (ইথানল) কে অম্লীয় K₂Cr₂O₇ দ্বারা জারিত করলে প্রথমে ইথানাল এবং পরে ইথানয়িক এসিড (C) উৎপন্ন হয়: K₂Cr₂O₇ + H₂SO₄\nCH₃-CH₂-OH+[O]⟶CH₃-CHO+H₂O\nK₂Cr₂O₇ + H₂SO₄\nCH₃-CHO+[O]⟶CH₃-COOH\nঅতএব, C যৌগটি ইথানয়িক এসিড বা অ্যাসিটিক এসিড (CH₃COOH)। ইথেন (C₂H₆) অ্যালকেন সমগোত্রীয় শ্রেণির সদস্য (সাধারণ সংকেত CnH2n+₂)। এর সমগোত্রীয় যৌগ মিথেন (CH₄) C যৌগ থেকে তৈরি করা সম্ভব । প্রথমে ইথানয়িক এসিডকে NaOH দ্বারা প্রশমিত করে সোডিয়াম ইথানয়েট তৈরি করা হয়:\nCH₃COOH+NaOH→CH₃COONa+H₂O\nএরপর সোডিয়াম ইথানয়েটকে সোডালাইমের (NaOH + CaO) সাথে উত্তপ্ত করলে কার্বক্সিলবিহীনকরণের ফলে মিথেন গ্যাস উৎপন্ন হয়: CaO, Δ\nCH₃COONa+NaOH⟶CH₄+Na₂CO₃\nমিথেন (CH₄) ও ইথেন (C₂H₆) উভয়েই অ্যালকেন এবং এদের মধ্যে একটি CH₂ এর পার্থক্য রয়েছে, তাই মিথেন ইথেনের সমগোত্রীয় যৌগ। অতএব, C যৌগ (CH₃COOH) হতে ইথেনের সমগোত্রীয় যৌগ মিথেন তৈরি করা সম্ভব ।"}]},{"id":"ch11-cq3","chapter":11,"num":3,"importance":3,"topic":"সম্পৃক্ত হাইড্রোকার্বন: অ্যালকেন","board":"ময়মনসিংহ বোর্ড ২০২৬","stem":"CaO\nCH₃COONa(′A′)+NaOH⟶B+Na₂CO₃","subQuestions":[{"label":"ক","question":"মেথিলেটেড স্পিরিট কাকে বলে?","answer":"মেথিলেটেড স্পিরিট: রেক্টিফাইড স্পিরিটের (95.6% ইথানল) সাথে সামান্য পরিমাণ বিষাক্ত মিথানল মিশিয়ে পানের অযোগ্য করা ইথানলকে মেথিলেটেড স্পিরিট বলে।"},{"label":"খ","question":"সাইক্লোপ্রোপিন অসম্পৃক্ত বন্ধ শিকল হাইড্রোকার্বন —ব্যাখ্যা কর।","answer":"সাইক্লোপ্রোপিনের আণবিক সংকেত C₃H₄। এতে তিনটি কার্বন পরমাণু পরস্পর যুক্ত হয়ে একটি বলয় বা বন্ধ শিকল গঠন করে, তাই এটি বন্ধ শিকল (চাক্রিক) হাইড্রোকার্বন । এই বলয়ের দুটি কার্বন পরমাণুর মধ্যে একটি C=C দ্বিবন্ধন বিদ্যমান । দ্বিবন্ধন থাকায় এটি যুত বিক্রিয়ায় অংশ নিতে পারে, অর্থাৎ এটি অসম্পৃক্ত । এভাবে বন্ধ শিকল গঠন ও দ্বিবন্ধনের উপস্থিতির কারণে সাইক্লোপ্রোপিন একটি অসম্পৃক্ত বন্ধ শিকল হাইড্রোকার্বন ।"},{"label":"গ","question":"'A' যৌগের উপাদান মৌলের শতকরা সংযুতি নির্ণয় কর।","answer":"উদ্দীপকের 'A' যৌগ হলো সোডিয়াম ইথানোয়েট (CH₃COONa); এতে C, H, O ও Na মৌল আছে। CH₃COONa এর আণবিক ভর =(12×2)+(1×3)+ (16×2)+23=82 C এর শতকরা পরিমাণ =(24×100)/82%=29.27% H এর শতকরা পরিমাণ =(3×100)/82%=3.66% O এর শতকরা পরিমাণ =(32×100)/82%=39.02% Na এর শতকরা পরিমাণ =(23×100)/82%=28.05% অতএব, 'A' যৌগে C 29.27%, H 3.66%, O 39.02% এবং Na 28.05% বিদ্যমান ।"},{"label":"ঘ","question":"'B' হতে টেট্রাক্লোরো মিথেন ও মিথান্যাল প্রস্তুত সম্ভব কিনা? বিশ্লেষণ কর।","answer":"উদ্দীপকে সোডিয়াম ইথানোয়েটকে সোডালাইমসহ উত্তপ্ত করলে মিথেন উৎপন্ন হয়। সুতরাং 'B' হলো মিথেন (CH₄)। CaO, Δ\nCH₃COONa+NaOH⟶CH₄+Na₂CO₃\nমিথেন হতে টেট্রাক্লোরো মিথেন প্রস্তুতি সূর্যালোকের উপস্থিতিতে মিথেন ও অতিরিক্ত ক্লোরিনের মিশ্রণে প্রতিস্থাপন বিক্রিয়া ধাপে ধাপে ঘটে। প্রতিটি ধাপে একটি H পরমাণু Cl দ্বারা প্রতিস্থাপিত হয়ে শেষে টেট্রাক্লোরো মিথেন উৎপন্ন হয়: সূর্যালোক\nCH₄+Cl₂⟶CH₃Cl+HCl\nসূর্যালোক\nCH₃Cl+Cl₂⟶CH₂Cl₂+HCl\nসূর্যালোক\nCH₂Cl₂+Cl₂⟶CHCl₃+HCl\nসূর্যালোক\nCHCl₃+Cl₂⟶CCl₄+HCl\nসূর্যালোক\nসামগ্রিক বিক্রিয়া: CH₄+4Cl₂⟶CCl₄+4HCl\nমিথেন হতে মিথান্যাল প্রস্তুতি মিথেনকে প্রভাবকের (মলিবডেনাম অক্সাইড) উপস্থিতিতে উত্তপ্ত অবস্থায় নিয়ন্ত্রিত পরিমাণ অক্সিজেন দ্বারা আংশিক জারিত করলে মিথান্যাল উৎপন্ন হয়:\nপ্রভাবক , Δ\nCH₄+O₂⟶HCHO+H₂O\nঅথবা, ধাপে ধাপে: মিথেন থেকে উৎপন্ন ক্লোরোমিথেনকে জলীয় NaOH এর সাথে উত্তপ্ত করে মিথানল এবং মিথানলকে জারিত করে মিথান্যাল প্রস্তুত করা যায়:\nΔ\nCH₃Cl+NaOH(aq)⟶CH₃OH+NaCl\nK₂Cr₂O₇/H⁺\nCH₃OH+[O]⟶HCHO+H₂O\nঅতএব, 'B' (মিথেন) হতে টেট্রাক্লোরো মিথেন (CCl₄) ও মিথান্যাল (HCHO) উভয়ই প্রস্তুত করা সম্ভব ।"}]},{"id":"ch11-cq4","chapter":11,"num":4,"importance":3,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকিন","board":"বরিশাল বোর্ড ২০২৬","stem":"M ও N দুটি মুক্ত শিকল হাইড্রোকার্বন । এদের আণবিক ভর যথাক্রমে 44 ও 56।","subQuestions":[{"label":"ক","question":"সমগোত্রীয় শ্রেণি কাকে বলে?","answer":"একই কার্যকরী মূলকবিশিষ্ট যে জৈব যৌগসমূহের সাধারণ সংকেত একই, যাদের পরপর দুটি সদস্যের মধ্যে CH₂ এর পার্থক্য থাকে এবং যাদের রাসায়নিক ধর্ম প্রায় একই রকম, সেই যৌগসমূহকে একত্রে সমগোত্রীয় শ্রেণি বলে।"},{"label":"খ","question":"ফেনল অ্যালকোহল নয় কেন? ব্যাখ্যা কর।","answer":"অ্যালিফেটিক হাইড্রোকার্বনের (অ্যালকাইল মূলকের) কার্বনের সাথে -OH মূলক যুক্ত থাকলে তাকে অ্যালকোহল (R-OH) বলে ।\nযেমন: CH₃-CH₂-OH।\nকিন্তু ফেনলে (C₆H₅-OH) -OH মূলকটি সরাসরি অ্যারোমেটিক বেনজিন বলয়ের কার্বনের সাথে যুক্ত থাকে, কোনো অ্যালকাইল মূলকের সাথে নয়। এ কারণে ফেনলের ধর্ম অ্যালকোহল থেকে ভিন্ন; যেমন, ফেনল মৃদু অম্লধর্মী এবং NaOH এর সাথে বিক্রিয়া করে লবণ গঠন করে, যা অ্যালকোহল করে না। তাই ফেনল অ্যালকোহল নয়।"},{"label":"গ","question":"উদ্দীপকের N একটি অসম্পৃক্ত হাইড্রোকার্বন —সমীকরণসহ বর্ণনা কর।","answer":"অংশ থেকে পাই, N হলো বিউটিন (CH₃-CH₂-CH=CH₂)। বিউটানল থেকে N (বিউটিন) প্রস্তুতি 1-বিউটানলকে গাঢ় H₂SO₄ এর সাথে 170°C তাপমাত্রায় উত্তপ্ত করলে পানি অপসারিত হয়ে 1-বিউটিন উৎপন্ন হয়: গাঢ় H₂SO₄, 170°C\nCH₃-CH₂-CH₂-CH₂-OH⟶CH₃-CH₂-CH=CH₂\n+H₂O বিউটানল থেকে M (প্রোপেন) প্রস্তুতি প্রথমে 1-বিউটানলকে অম্লীয় K₂Cr₂O₇ দ্বারা জারিত করলে প্রথমে বিউটান্যাল ও পরে বিউটানোয়িক এসিড উৎপন্ন হয়: CH₃-CH₂-CH₂-CH₂-OH K₂Cr₂O₇/H₂SO₄\n+[O]⟶CH₃-CH₂-CH₂-CHO\n+H₂O CH₃-CH₂-CH₂-CHO K₂Cr₂O₇/H₂SO₄\n+[O]⟶CH₃-CH₂-CH₂-COOH\nবিউটানোয়িক এসিডকে NaOH দ্বারা প্রশমিত করলে সোডিয়াম বিউটানোয়েট লবণ উৎপন্ন হয়: CH₃-CH₂-CH₂-COOH+NaOH\n→CH₃-CH₂-CH₂-COONa+H₂O\nসোডিয়াম বিউটানোয়েটকে সোডা লাইম (NaOH + CaO) সহ উত্তপ্ত করলে ডিকার্বক্সিলেশনের মাধ্যমে প্রোপেন উৎপন্ন হয়: CaO, তাপ\nCH₃-CH₂-CH₂-COONa+NaOH⟶CH₃-CH₂-CH₃\n+Na₂CO₃ উপরের আলোচনা থেকে দেখা যায়, বিউটানল থেকে সরাসরি পানি অপসারণের মাধ্যমে N (বিউটিন) এবং জারণ, প্রশমন ও ডিকার্বক্সিলেশনের মাধ্যমে M (প্রোপেন) প্রস্তুত করা যায়। অতএব, বিউটানল থেকে উদ্দীপকের M ও N উভয়ই প্রস্তুত করা সম্ভব ।"},{"label":"ঘ","question":"বিউটানল থেকে উদ্দীপকের M ও N উভয়ই প্রস্তুত করা সম্ভব হবে কি? বিশ্লেষণ কর।","answer":"উদ্দীপকের M একটি মুক্ত শিকল হাইড্রোকার্বন, যার আণবিক ভর 44। অ্যালকেন (CnH2n+₂) ধরলে, 14n+2=44 বা n = 3। সুতরাং M হলো প্রোপেন (CH₃-CH₂-CH₃)।"}]},{"id":"ch11-cq5","chapter":11,"num":5,"importance":3,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকিন","board":"কুমিল্লা বোর্ড ২০২৬","stem":"X একটি হাইড্রোকার্বন যৌগ। এর মধ্যে 85.71% কার্বন রয়েছে । যৌগটির আণবিক ভর নাইট্রোজেন গ্যাসের সমতুল্য ।","subQuestions":[{"label":"ক","question":"অরবিটাল কাকে বলে?","answer":"অরবিটাল: পরমাণুর নিউক্লিয়াসের চারদিকে যে ত্রিমাত্রিক স্থানে কোনো নির্দিষ্ট শক্তির ইলেকট্রন পাওয়ার সম্ভাবনা সবচেয়ে বেশি, তাকে অরবিটাল বলে।"},{"label":"খ","question":"ম্যাগনেসিয়ামকে মৃৎক্ষার ধাতু বলা হয় কেন?","answer":"ম্যাগনেসিয়াম (Mg) পর্যায় সারণির গ্রুপ-2 এর মৌল। এর ইলেকট্রন বিন্যাস 1s² 2s² 2p⁶ 3s²। ম্যাগনেসিয়ামের অক্সাইড (MgO) ও অন্যান্য যৌগ ভূত্বকে বা মাটিতে (মৃৎ) প্রচুর পরিমাণে পাওয়া যায়। আবার এর অক্সাইড ও হাইড্রোক্সাইড পানিতে দ্রবীভূত হয়ে ক্ষারীয় দ্রবণ তৈরি করে।\nMgO+H₂O→Mg(OH)₂\nমাটিতে পাওয়া যায় এবং ক্ষারধর্মী হওয়ায় ম্যাগনেসিয়ামকে মৃৎক্ষার ধাতু বলা হয়।"},{"label":"গ","question":"X যৌগটির আণবিক সংকেত নির্ণয় কর।","answer":"X যৌগে কার্বনের পরিমাণ = 85.71% হাইড্রোজেনের পরিমাণ =(100-85.71)%=14.29% C এর পরমাণুর আপেক্ষিক সংখ্যা =85.71/12=7.14 H এর পরমাণুর আপেক্ষিক সংখ্যা =14.29/1=14.29 সরল অনুপাত, C : H=7.14/7.14 : 14.29/7.14=1 : 2 অতএব, X এর স্থূল সংকেত CH₂ স্থূল সংকেতের ভর =12+(1×2)=14 X এর আণবিক ভর = নাইট্রোজেন গ্যাসের (N₂) আণবিক ভর =14×2=28 n = আণবিক ভর/স্থূল সংকেতের ভর =28/14=2 আণবিক সংকেত = (CH₂)n=(CH₂)₂=C₂H₄ অতএব, X যৌগটির আণবিক সংকেত C₂H₄ (ইথিন, CH₂=CH₂)।"},{"label":"ঘ","question":"X যৌগ থেকে প্রাকৃতিক গ্যাসের মূল উপাদান তৈরি করা সম্ভব — সমীকরণসহ বিশ্লেষণ কর।","answer":"'গ' হতে পাই, X যৌগটি ইথিন (CH₂=CH₂)। প্রাকৃতিক গ্যাসের মূল উপাদান মিথেন (CH₄), যা প্রাকৃতিক গ্যাসের প্রায় 80-90%। নিচের ধাপগুলোর মাধ্যমে ইথিন থেকে মিথেন তৈরি করা যায়। ধাপ-১: ইথিন থেকে ইথানল ইথিনকে উচ্চ তাপ ও চাপে ফসফরিক এসিড প্রভাবকের উপস্থিতিতে জলীয় বাষ্পের সাথে বিক্রিয়া করালে ইথানল উৎপন্ন হয়। H₃PO₄, 300°C, 60 atm\nCH₂=CH₂+H₂O⟶CH₃-CH₂-OH\nধাপ-২: ইথানল থেকে ইথানয়িক এসিড অম্লীয় পটাসিয়াম ডাইক্রোমেট (K₂Cr₂O₇/H₂SO₄) দ্বারা ইথানলকে জারিত করলে ইথানয়িক এসিড (অ্যাসিটিক এসিড) পাওয়া যায়। K₂Cr₂O₇/H₂SO₄\nCH₃-CH₂-OH+2[O]⟶CH₃-COOH+H₂O\nধাপ-৩: ইথানয়িক এসিড থেকে সোডিয়াম ইথানয়েট\nCH₃-COOH+NaOH→CH₃-COONa+H₂O\nধাপ-৪: সোডিয়াম ইথানয়েট থেকে মিথেন সোডিয়াম ইথানয়েটকে সোডালাইম (NaOH + CaO) এর সাথে উত্তপ্ত করলে ডিকার্বক্সিলেশনের মাধ্যমে মিথেন উৎপন্ন হয়। CaO, তাপ\nCH₃-COONa+NaOH⟶CH₄+Na₂CO₃\nসুতরাং, X যৌগ (ইথিন) থেকে ধাপে ধাপে ইথানল, ইথানয়িক এসিড ও সোডিয়াম ইথানয়েটের মাধ্যমে প্রাকৃতিক গ্যাসের মূল উপাদান মিথেন (CH₄) তৈরি করা সম্ভব ।"}]},{"id":"ch11-cq6","chapter":11,"num":6,"importance":3,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকিন","board":"ঢাকা বোর্ড ২০২৬","stem":"‘A’ যৌগটি রেক্টিফাইড স্পিরিটের প্রধান উপাদান। আবার ‘A’ যৌগের জারণে প্রাপ্ত ‘B’ একটি নতুন যৌগ যার জলীয় দ্রবণ একটি উল্লেখযোগ্য খাদ্য সংরক্ষক হিসেবে পরিচিত ।","subQuestions":[{"label":"ক","question":"সমাণুকরণ বিক্রিয়া কী?","answer":"যে বিক্রিয়ায় একটি যৌগ তার আণবিক সংকেত অপরিবর্তিত রেখে গাঠনিক সংকেত পরিবর্তনের মাধ্যমে নতুন যৌগে (সমাণুতে) রূপান্তরিত হয়, তাকে সমাণুকরণ বিক্রিয়া বলে।"},{"label":"খ","question":"‘পরমাণু বৈদ্যুতিকভাবে নিরপেক্ষ’—ব্যাখ্যা কর।","answer":"পরমাণুর নিউক্লিয়াসে ধনাত্মক চার্জযুক্ত প্রোটন এবং নিউক্লিয়াসের বাইরে বিভিন্ন শক্তিস্তরে ঋণাত্মক চার্জযুক্ত ইলেকট্রন থাকে। নিউট্রন চার্জবিহীন । একটি প্রোটনের চার্জ +1 এবং একটি ইলেকট্রনের চার্জ -1, যাদের মান সমান কিন্তু প্রকৃতি বিপরীত । কোনো পরমাণুতে প্রোটন ও ইলেকট্রনের সংখ্যা সমান থাকে। যেমন: Na পরমাণুতে 11টি প্রোটন ও 11টি ইলেকট্রন থাকে, ফলে মোট চার্জ =(+11)+(-11)=0। তাই পরমাণুর মোট ধনাত্মক চার্জ ও মোট ঋণাত্মক চার্জ পরস্পরকে প্রশমিত করে এবং পরমাণু বৈদ্যুতিকভাবে নিরপেক্ষ হয়।"},{"label":"গ","question":"উপযুক্ত বিক্রিয়া সহকারে উদ্দীপকের ‘B’ যৌগ থেকে প্রাকৃতিক গ্যাসের মূল উপাদানের প্রস্তুতি ব্যাখ্যা কর।","answer":"রেক্টিফাইড স্পিরিট হলো 95.6% ইথানল ও 4.4% পানির মিশ্রণ । সুতরাং উদ্দীপকের ‘A’ যৌগটি হলো ইথানল (CH₃-CH₂-OH)। ইথানলকে জারিত করলে ইথানোয়িক এসিড বা অ্যাসিটিক এসিড (CH₃COOH) উৎপন্ন হয়, যার 4-6% জলীয় দ্রবণ ভিনেগার নামে খাদ্য সংরক্ষক হিসেবে ব্যবহৃত হয়। তাই ‘B’ যৌগটি হলো অ্যাসিটিক এসিড । K₂Cr₂O₇/H₂SO₄\nCH₃-CH₂-OH+2[O]⟶CH₃-COOH+H₂O\nপ্রাকৃতিক গ্যাসের মূল উপাদান হলো মিথেন (CH₄), যা প্রাকৃতিক গ্যাসের প্রায় 80-90% অংশ । ‘B’ যৌগ থেকে দুই ধাপে মিথেন প্রস্তুত করা যায়। ধাপ-১: সোডিয়াম ইথানোয়েট প্রস্তুতি অ্যাসিটিক এসিডকে NaOH দ্রবণ দ্বারা প্রশমিত করলে সোডিয়াম ইথানোয়েট (সোডিয়াম অ্যাসিটেট) ও পানি উৎপন্ন হয়।\nCH₃-COOH+NaOH→CH₃-COONa+H₂O\nধাপ-২: মিথেন প্রস্তুতি শুষ্ক সোডিয়াম ইথানোয়েটকে সোডালাইম (NaOH + CaO) এর সাথে মিশিয়ে উত্তপ্ত করলে ডিকার্বক্সিলেশনের মাধ্যমে মিথেন গ্যাস উৎপন্ন হয়। এখানে CaO বিক্রিয়ায় অংশ নেয় না, NaOH কে শুষ্ক রাখে । CaO, তাপ\nCH₃-COONa+NaOH⟶CH₄+Na₂CO₃\nউৎপন্ন মিথেন গ্যাস পানির নিম্নমুখী অপসারণের মাধ্যমে গ্যাসজারে সংগ্রহ করা হয়। এভাবে উদ্দীপকের ‘B’ যৌগ থেকে প্রাকৃতিক গ্যাসের মূল উপাদান মিথেন প্রস্তুত করা যায়।"},{"label":"ঘ","question":"উদ্দীপকের ‘A’ যৌগ থেকে একটি অসম্পৃক্ত হাইড্রোকার্বন প্রস্তুত করে এর অসম্পৃক্ততার পেছনে একটি পরীক্ষা উপস্থাপন কর।","answer":"উদ্দীপকের ‘A’ যৌগটি ইথানল (CH₃-CH₂-OH)। ইথানল থেকে অসম্পৃক্ত হাইড্রোকার্বন ইথিন (CH₂=CH₂) প্রস্তুত করা যায়। ইথিন প্রস্তুতি ইথানলকে অতিরিক্ত গাঢ় H₂SO₄ এর সাথে 170°C তাপমাত্রায় উত্তপ্ত করলে ইথানল থেকে এক অণু পানি অপসারিত হয়ে ইথিন উৎপন্ন হয়। গাঢ় H₂SO₄ এখানে নিরুদক হিসেবে কাজ করে। গাঢ় H₂SO₄, 170°C\nCH₃-CH₂-OH⟶CH₂=CH₂+H₂O\nইথিন অণুতে দুটি কার্বন পরমাণুর মধ্যে একটি দ্বিবন্ধন (C=C) আছে, যার একটি পাই বন্ধন দুর্বল । তাই ইথিন অসম্পৃক্ত হাইড্রোকার্বন এবং এটি সহজে যুত বিক্রিয়ায় অংশ নেয়। অসম্পৃক্ততার পরীক্ষা ১: ব্রোমিন পানি পরীক্ষা একটি টেস্টটিউবে লালচে বাদামি বর্ণের ব্রোমিন পানি নিয়ে এর মধ্যে উৎপন্ন ইথিন গ্যাস চালনা করলে ব্রোমিন পানির লালচে বাদামি বর্ণ দূরীভূত হয়ে দ্রবণ বর্ণহীন হয়ে যায়। কারণ ইথিনের দ্বিবন্ধনে ব্রোমিন যুক্ত হয়ে বর্ণহীন 1,2-ডাইব্রোমোইথেন উৎপন্ন করে।\nCH₂=CH₂+Br₂→CH₂Br-CH₂Br\nঅসম্পৃক্ততার পরীক্ষা ২: বেয়ার পরীক্ষা ইথিন গ্যাসকে লঘু ও শীতল ক্ষারীয় KMnO₄ এর গোলাপি বর্ণের দ্রবণে চালনা করলে দ্রবণের গোলাপি বর্ণ দূরীভূত হয় এবং ইথিলিন গ্লাইকল উৎপন্ন হয়। 3CH₂=CH₂+2KMnO₄+4H₂O\n→3HO-CH₂-CH₂-OH+2MnO₂+2KOH\nসম্পৃক্ত হাইড্রোকার্বন (যেমন: ইথেন) এ পরীক্ষাগুলোতে ব্রোমিন পানি বা KMnO₄ দ্রবণের বর্ণ দূর করে না। সুতরাং ব্রোমিন পানি ও KMnO₄ দ্রবণের বর্ণ দূরীভূত হওয়া প্রমাণ করে যে ‘A’ যৌগ থেকে প্রস্তুত ইথিন একটি অসম্পৃক্ত হাইড্রোকার্বন ।"}]},{"id":"ch11-cq7","chapter":11,"num":7,"importance":3,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকিন","board":"মাদ্রাসা বোর্ড ২০২৬","stem":"গাঢ় H₂SO₄\n(i)CH₃CH₂CH₂OH⟶X+H₂O\n+H₂, Ni/200°C\n(ii)X⟶Y","subQuestions":[{"label":"ক","question":"পারমাণবিক সংখ্যা কাকে বলে?","answer":"কোনো মৌলের পরমাণুর নিউক্লিয়াসে উপস্থিত প্রোটনের সংখ্যাকে ঐ মৌলের পারমাণবিক সংখ্যা বলে। যেমন: Na এর পারমাণবিক সংখ্যা 11।"},{"label":"খ","question":"Ca ও Mg এর মধ্যে কোনটির আয়নীকরণ শক্তি বেশি— ব্যাখ্যা কর।","answer":"Mg(12) : 1s² 2s² 2p⁶ 3s² এবং Ca(20) : 1s² 2s² 2p⁶ 3s² 3p⁶ 4s²। উভয়ই গ্রুপ 2 এর মৌল। Mg এর শক্তিস্তর 3টি এবং Ca এর 4টি। তাই Mg এর আকার ছোট এবং এর সর্বশেষ স্তরের ইলেকট্রন নিউক্লিয়াস দ্বারা বেশি দৃঢ়ভাবে আকৃষ্ট থাকে। ফলে Mg থেকে ইলেকট্রন সরাতে বেশি শক্তি লাগে। একই গ্রুপে উপর থেকে নিচে আয়নীকরণ শক্তি কমে, তাই Ca অপেক্ষা Mg এর আয়নীকরণ শক্তি বেশি।"},{"label":"গ","question":"ডিকার্বক্সিলেশন বিক্রিয়ায় কীভাবে উদ্দীপকের 'Y' যৌগটি প্রস্তুত করবে — সমীকরণসহ ব্যাখ্যা কর।","answer":"উদ্দীপকের (i) নং বিক্রিয়ায় প্রোপানল গাঢ় H₂SO₄ এর উপস্থিতিতে উত্তপ্ত হলে এক অণু পানি অপসারিত হয়ে প্রোপিন উৎপন্ন হয়। গাঢ় H₂SO₄, তাপ\nCH₃-CH₂-CH₂-OH⟶CH₃-CH=CH₂+H₂O\nসুতরাং X হলো প্রোপিন (CH₃-CH=CH₂)। (ii) নং বিক্রিয়ায় প্রোপিন\nNi প্রভাবকের উপস্থিতিতে 200°C তাপমাত্রায় হাইড্রোজেনের সাথে যুক্ত হয়ে প্রোপেন উৎপন্ন করে।\nNi, 200°C\nCH₃-CH=CH₂+H₂⟶CH₃-CH₂-CH₃\nসুতরাং Y যৌগটি হলো প্রোপেন (CH₃-CH₂-CH₃)। ডিকার্বক্সিলেশন বিক্রিয়ায় প্রোপেন প্রস্তুতি জৈব এসিডের সোডিয়াম লবণকে সোডালাইম (NaOH + CaO) সহ উত্তপ্ত করলে কার্বক্সিল মূলক থেকে CO₂ অপসারিত হয়ে (Na₂CO₃ রূপে) এক কার্বন কম অ্যালকেন উৎপন্ন হয়। একে ডিকার্বক্সিলেশন বিক্রিয়া বলে। প্রোপেনে 3টি কার্বন আছে, তাই 4 কার্বনবিশিষ্ট বিউটানয়িক এসিডের সোডিয়াম লবণ সোডিয়াম বিউটানয়েট (CH₃-CH₂-CH₂-COONa) কে সোডালাইমসহ উত্তপ্ত করলে প্রোপেন উৎপন্ন হয়। CaO, তাপ\nCH₃-CH₂-CH₂-COONa+NaOH⟶CH₃-CH₂-CH₃\n+Na₂CO₃ এখানে CaO প্রভাবক হিসেবে কাজ করে এবং NaOH কে শুষ্ক রাখে। এভাবে ডিকার্বক্সিলেশন বিক্রিয়ায় উদ্দীপকের Y যৌগ (প্রোপেন) প্রস্তুত করা যায়।"},{"label":"ঘ","question":"উদ্দীপকের 'X' এবং 'Y' যৌগের মধ্যে কোনটি অসম্পৃক্ত যৌগ? বিশ্লেষণ কর।","answer":"গ অংশ থেকে পাই, X হলো প্রোপিন (CH₃-CH=CH₂) এবং Y হলো প্রোপেন (CH₃-CH₂-CH₃)। যেসব হাইড্রোকার্বনে কার্বন-কার্বন দ্বিবন্ধন বা ত্রিবন্ধন থাকে তাদের অসম্পৃক্ত হাইড্রোকার্বন এবং যেসব হাইড্রোকার্বনে কার্বন পরমাণুগুলো কেবল একক বন্ধনে যুক্ত তাদের সম্পৃক্ত হাইড্রোকার্বন বলে। X (প্রোপিন) এর অণুতে একটি C=C দ্বিবন্ধন আছে। এটি অ্যালকিন শ্রেণির (CnH2n) সদস্য। দ্বিবন্ধনের দুর্বল π বন্ধন সহজে ভেঙে যায় বলে X সংযোজন বিক্রিয়ায় অংশ নেয়। যেমন: X লালচে-বাদামি ব্রোমিন দ্রবণের সাথে যুক্ত হয়ে বর্ণহীন 1,2-ডাইব্রোমোপ্রোপেন উৎপন্ন করে:\nCH₃-CH=CH₂+Br₂→CH₃-CHBr-CH₂Br\nউদ্দীপকের (ii) নং বিক্রিয়াতেও X হাইড্রোজেনের সাথে সংযোজন বিক্রিয়া দিয়ে Y এ পরিণত হয়েছে, যা X এর অসম্পৃক্ততার প্রমাণ । অপরদিকে Y (প্রোপেন) এর অণুতে সকল কার্বন পরমাণু শুধু একক বন্ধনে (σ বন্ধন) যুক্ত। এটি অ্যালকেন শ্রেণির (CnH2n+₂) সদস্য। প্রতিটি কার্বনের চারটি যোজ্যতা সম্পূর্ণভাবে পূর্ণ, তাই এটি আর H₂ বা Br₂ এর সাথে সংযোজন বিক্রিয়া দেয় না এবং ব্রোমিন দ্রবণের বর্ণ নষ্ট করে না; কেবল প্রতিস্থাপন বিক্রিয়া দেয়। সুতরাং উদ্দীপকের X (প্রোপিন) অসম্পৃক্ত যৌগ এবং Y (প্রোপেন) সম্পৃক্ত যৌগ।"}]},{"id":"ch11-cq8","chapter":11,"num":8,"importance":3,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকিন","board":"ময়মনসিংহ বোর্ড ২০২৬","stem":"Ni, 250°C\nCO₂+4H₂⟶A+2H₂O\nΔ, H₂SO₄\nCH₃CH₂OH⟶B+H₂O","subQuestions":[{"label":"ক","question":"ভরসংখ্যা কাকে বলে?","answer":"ভরসংখ্যা: কোনো পরমাণুর নিউক্লিয়াসে উপস্থিত প্রোটন ও নিউট্রনের মোট সংখ্যাকে ঐ পরমাণুর ভরসংখ্যা বলে।"},{"label":"খ","question":"ক্লোরিনকে হ্যালোজেন বলা হয় কেন? ব্যাখ্যা কর।","answer":"হ্যালোজেন শব্দের অর্থ লবণ উৎপাদনকারী । ক্লোরিন (Cl) পর্যায় সারণির গ্রুপ-17 এর মৌল; এর সর্বশেষ স্তরে 7টি ইলেকট্রন থাকে (2, 8, 7)। ক্লোরিন সহজেই একটি ইলেকট্রন গ্রহণ করে Cl⁻ আয়নে পরিণত হয় এবং ধাতুর সাথে যুক্ত হয়ে লবণ উৎপন্ন করে। যেমন:\n2Na+Cl₂→2NaCl\nক্লোরিন সোডিয়াম ক্লোরাইডের মতো সামুদ্রিক লবণের উপাদান এবং লবণ উৎপন্ন করে বলে ক্লোরিনকে হ্যালোজেন বলা হয়।"},{"label":"গ","question":"পরীক্ষার সাহায্যে প্রমাণ কর যে, 'B' যৌগে অসম্পৃক্ততা রয়েছে ।","answer":"উদ্দীপকের দ্বিতীয় বিক্রিয়ায় ইথানলকে গাঢ় H₂SO₄ এর উপস্থিতিতে উত্তপ্ত করলে এক অণু পানি অপসারিত হয়ে ইথিন উৎপন্ন হয়। সুতরাং 'B' হলো ইথিন (CH₂=CH₂)। গাঢ় H₂SO₄, 170°C\nCH₃-CH₂-OH⟶CH₂=CH₂+H₂O\nব্রোমিন পানি পরীক্ষা একটি টেস্টটিউবে লালচে-বাদামি বর্ণের ব্রোমিন পানি নিয়ে এর মধ্যে 'B' (ইথিন) গ্যাস চালনা করি। দেখা যায়, ব্রোমিন পানির লালচে- বাদামি বর্ণ দূরীভূত হয়ে দ্রবণ বর্ণহীন হয়ে যায়।\nCH₂=CH₂+Br₂→CH₂Br-CH₂Br\nইথিনের দ্বিবন্ধনের সাথে ব্রোমিন যুত বিক্রিয়ায় অংশ নিয়ে বর্ণহীন 1,2-ডাইব্রোমোইথেন উৎপন্ন করে। সম্পৃক্ত হাইড্রোকার্বন (যেমন ইথেন) এই পরীক্ষায় ব্রোমিন পানির বর্ণ দূর করে না। যেহেতু 'B' যৌগ ব্রোমিন পানির বর্ণ দূর করে, সুতরাং 'B' যৌগে C=C দ্বিবন্ধন অর্থাৎ অসম্পৃক্ততা রয়েছে ।"},{"label":"ঘ","question":"'B' থেকে 'A' তৈরি করা সম্ভব কি? সমীকরণসহ বিশ্লেষণ কর।","answer":"উদ্দীপকের প্রথম বিক্রিয়ায় CO₂ ও H₂ এর বিক্রিয়ায় মিথেন উৎপন্ন হয়। সুতরাং 'A' হলো মিথেন (CH₄)। গ অংশ থেকে 'B' হলো ইথিন (CH₂=CH₂)।\nNi, 250°C\nCO₂+4H₂⟶CH₄+2H₂O\nইথিন (দুই কার্বনবিশিষ্ট) থেকে সরাসরি একধাপে মিথেন (এক কার্বনবিশিষ্ট) তৈরি করা যায় না। তবে কয়েকটি ধাপে বিক্রিয়ার মাধ্যমে 'B' থেকে 'A' তৈরি করা সম্ভব ।\n১. ইথিনের সাথে এসিডের উপস্থিতিতে পানি যুক্ত করলে ইথানল উৎপন্ন হয়: H₂SO₄\nCH₂=CH₂+H₂O⟶CH₃-CH₂-OH\n২. ইথানলকে অম্লীয় KMnO₄ বা K₂Cr₂O₇ দ্বারা জারিত করলে ইথানয়িক এসিড উৎপন্ন হয়: KMnO₄/H⁺\nCH₃-CH₂-OH+2[O]⟶CH₃-COOH+H₂O\n৩. ইথানয়িক এসিডকে NaOH দ্বারা প্রশমিত করলে সোডিয়াম ইথানোয়েট উৎপন্ন হয়:\nCH₃-COOH+NaOH→CH₃-COONa+H₂O\n৪. সোডিয়াম ইথানোয়েটকে সোডালাইমের (NaOH + CaO) সাথে উত্তপ্ত করলে ডিকার্বক্সিলেশনের মাধ্যমে মিথেন উৎপন্ন হয়: CaO, Δ\nCH₃-COONa+NaOH⟶CH₄+Na₂CO₃\nঅতএব, সরাসরি না হলেও উপরিউক্ত ধাপসমূহের মাধ্যমে 'B' (ইথিন) থেকে 'A' (মিথেন) তৈরি করা সম্ভব ।"}]},{"id":"ch11-cq9","chapter":11,"num":9,"importance":3,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকিন","board":"সিলেট বোর্ড ২০২৬","stem":"CaO\n(i) CH₃COONa+NaOH⟶ \"Z\" + Na₂CO₃\nH₂SO₄(গাঢ়)\n(ii) CH₃-CH₂-CH₂-OH ⟶ \"Y\" + H₂O","subQuestions":[{"label":"ক","question":"অ্যালকাইন কাকে বলে?","answer":"অ্যালকাইন: যেসব অসম্পৃক্ত হাইড্রোকার্বনের অণুতে অন্তত দুটি কার্বন পরমাণুর মধ্যে ত্রিবন্ধন (C≡C) থাকে, তাদেরকে অ্যালকাইন বলে। এদের সাধারণ সংকেত CnH2n−₂; যেমন: ইথাইন (HC≡CH)।"},{"label":"খ","question":"ইথান্যাল এবং প্রোপান্যাল একই সমগোত্রীয় শ্রেণিভুক্ত কেন? ব্যাখ্যা করো।","answer":"ইথান্যাল (CH₃-CHO) ও প্রোপান্যাল (CH₃-CH₂-CHO) উভয়ই অ্যালডিহাইড ।\n• উভয়ের কার্যকরী মূলক একই, -CHO (অ্যালডিহাইড মূলক)।\n• উভয়ই একই সাধারণ সংকেত CnH2n+₁CHO মেনে চলে।\n• এদের আণবিক সংকেতের পার্থক্য একটি -CH₂- মূলক (আণবিক ভরের পার্থক্য 14)।\n• এদের রাসায়নিক ধর্ম একই রকম এবং একই পদ্ধতিতে প্রস্তুত করা যায়। তাই ইথান্যাল ও প্রোপান্যাল একই সমগোত্রীয় শ্রেণিভুক্ত ।"},{"label":"গ","question":"উদ্দীপকের 'Z' যৌগ থেকে কার্বন টেট্রা ক্লোরাইড উৎপাদন সমীকরণসহ ব্যাখ্যা করো।","answer":"উদ্দীপকের (i) নং বিক্রিয়ায় সোডিয়াম ইথানোয়েটকে সোডালাইম (NaOH + CaO) সহ উত্তপ্ত করলে মিথেন উৎপন্ন হয়। তাই Z হলো মিথেন (CH₄)। CaO, তাপ\nCH₃COONa+NaOH⟶CH₄+Na₂CO₃\nমিথেন ও ক্লোরিনের মিশ্রণকে সূর্যালোকের উপস্থিতিতে বিক্রিয়া করালে মিথেনের H পরমাণুগুলো একে একে Cl দ্বারা প্রতিস্থাপিত হয় (প্রতিস্থাপন বিক্রিয়া): সূর্যালোক\nCH₄+Cl₂⟶CH₃Cl+HCl\nসূর্যালোক\nCH₃Cl+Cl₂⟶CH₂Cl₂+HCl\nসূর্যালোক\nCH₂Cl₂+Cl₂⟶CHCl₃+HCl\nসূর্যালোক\nCHCl₃+Cl₂⟶CCl₄+HCl\nসামগ্রিক বিক্রিয়া:\nসূর্যালোক\nCH₄+4Cl₂⟶CCl₄+4HCl\nপর্যাপ্ত পরিমাণ ক্লোরিন ব্যবহার করলে শেষ পর্যন্ত Z (মিথেন) থেকে কার্বন টেট্রাক্লোরাইড (CCl₄) উৎপন্ন হয়।"},{"label":"ঘ","question":"Y-যৌগ থেকে দুই ধরনের অ্যালকোহল প্রস্তুত সম্ভব কি না? সমীকরণসহ বিশ্লেষণ করো।","answer":"উদ্দীপকের (ii) নং বিক্রিয়ায় প্রোপানলকে গাঢ় H₂SO₄ সহ উত্তপ্ত করলে এক অণু পানি অপসারিত হয়ে প্রোপিন উৎপন্ন হয়। তাই Y হলো প্রোপিন (CH₃-CH=CH₂)। গাঢ় H₂SO₄, 170°C\nCH₃-CH₂-CH₂-OH⟶CH₃-CH=CH₂+H₂O\nY একটি অসম্পৃক্ত হাইড্রোকার্বন (অ্যালকিন), তাই এটি থেকে দুই ধরনের অ্যালকোহল প্রস্তুত করা যায়:\n১. মনোহাইড্রিক অ্যালকোহল (প্রোপান-2-ল) প্রস্তুতি প্রোপিনকে গাঢ় H₂SO₄ এ শোষণ করিয়ে উৎপন্ন যৌগকে পানি দ্বারা আর্দ্রবিশ্লেষণ করলে অর্থাৎ এসিডের উপস্থিতিতে পানি যোগ করলে প্রোপান-2-ল উৎপন্ন হয়, যার অণুতে একটি -OH মূলক থাকে। H₂SO₄\nCH₃-CH=CH₂+H₂O⟶CH₃-CH(OH)-CH₃\n২. ডাইহাইড্রিক অ্যালকোহল (প্রোপেন-1,2-ডাইঅল) প্রস্তুতি প্রোপিনকে লঘু ও শীতল ক্ষারীয় KMnO₄ দ্রবণের সাথে বিক্রিয়া করালে KMnO₄ এর গোলাপি বর্ণ বিনষ্ট হয় এবং দুটি -OH মূলকযুক্ত গ্লাইকল জাতীয় অ্যালকোহল প্রোপেন-1,2-ডাইঅল উৎপন্ন হয়। 3CH₃-CH=CH₂+2KMnO₄+4H₂O\n→3CH₃-CH(OH)-CH₂(OH)+2MnO₂\n+2KOH সুতরাং Y (প্রোপিন) থেকে মনোহাইড্রিক অ্যালকোহল (প্রোপান-2-ল) এবং ডাইহাইড্রিক অ্যালকোহল (প্রোপেন-1,2-ডাইঅল) এই দুই ধরনের অ্যালকোহল প্রস্তুত করা সম্ভব ।"}]},{"id":"ch11-cq10","chapter":11,"num":10,"importance":3,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকিন","board":"দিনাজপুর বোর্ড ২০২৩","stem":"গাঢ় H₂SO₄\nR—OH (A যৌগ) ⟶D+H₂O\nR = -C₃H₇","subQuestions":[{"label":"ক","question":"অ্যালকাইন কাকে বলে?","answer":"যেসব অসম্পৃক্ত হাইড্রোকার্বনের কার্বন শিকলে অন্তত একটি কার্বন-কার্বন ত্রিবন্ধন (C≡C) থাকে, তাদের অ্যালকাইন (Alkyne) বলে। অ্যালকাইনের সাধারণ সংকেত CnH2n−₂; যেমন: ইথাইন (CH≡CH)।"},{"label":"খ","question":"প্রোপানয়িক এসিড দুর্বল এসিড —ব্যাখ্যা কর।","answer":"যে এসিড জলীয় দ্রবণে আংশিকভাবে বিয়োজিত হয়ে খুব সামান্য পরিমাণ হাইড্রোজেন আয়ন (H⁺) দেয়, তাকে দুর্বল এসিড (Weak acid) বলে। প্রোপানয়িক এসিড (CH₃-CH₂-COOH) একটি জৈব এসিড বা ফ্যাটি এসিড । একে পানিতে দ্রবীভূত করলে এর অণুগুলোর খুব অল্প অংশই বিয়োজিত হয়ে H⁺ ও প্রোপানয়েট আয়ন দেয়; বেশিরভাগ অণু অবিয়োজিত অবস্থায় থাকে। বিয়োজনটি উভমুখী, এবং সাম্যাবস্থা বাম দিকে (অবিয়োজিত অণুর দিকে) বেশি থাকে।\nCH₃-CH₂-COOH(aq)⇌CH₃-CH₂-COO⁻(aq)+H⁺(aq)\nপ্রোপানয়িক এসিড, প্রোপানয়েট আয়ন, হাইড্রোজেন আয়ন অপরদিকে HCl, H₂SO₄ এর মতো তীব্র এসিড প্রায় সম্পূর্ণ বিয়োজিত হয়। দ্রবণে H⁺ আয়নের পরিমাণ কম হওয়ায় প্রোপানয়িক এসিড একটি দুর্বল এসিড ।"},{"label":"গ","question":"উদ্দীপকের 'D' যৌগটি অসম্পৃক্ত হাইড্রোকার্বন —পরীক্ষার সাহায্যে কীভাবে প্রমাণ করা যায় ব্যাখ্যা কর।","answer":"A ও D শনাক্তকরণ উদ্দীপকে R = -C₃H₇ (প্রোপাইল মূলক)। তাই A যৌগ = C₃H₇-OH= CH₃-CH₂-CH₂-OH, অর্থাৎ প্রোপানল (Propanol)। অ্যালকোহলকে অতিরিক্ত গাঢ় H₂SO₄ সহ উত্তপ্ত করলে এক অণু পানি অপসারিত হয় (নিরুদন বা Dehydration) এবং অ্যালকিন উৎপন্ন হয়। গাঢ় H₂SO₄, 170°C\nCH₃-CH₂-CH₂-OH⟶CH₃-CH=CH₂+H₂O\nপ্রোপানল (A), প্রোপিন (D), পানি সুতরাং D যৌগটি হলো প্রোপিন (Propene), CH₃-CH=CH₂। এর অণুতে একটি কার্বন-কার্বন দ্বিবন্ধন (C=C) আছে, তাই এটি অসম্পৃক্ত হাইড্রোকার্বন । পরীক্ষা ১: ব্রোমিন দ্রবণ পরীক্ষা একটি টেস্টটিউবে কিছু লাল (লালচে-বাদামি) বর্ণের ব্রোমিন দ্রবণ (Br₂ এর CCl₄ বা পানিতে দ্রবণ) নিয়ে তার মধ্য দিয়ে D গ্যাস চালনা করলে দ্রবণের লাল বর্ণ দ্রুত বিলুপ্ত হয়ে বর্ণহীন হয়ে যায়। কারণ দ্বিবন্ধনের দুর্বল পাই বন্ধন ভেঙে ব্রোমিন যুক্ত হয় এবং বর্ণহীন 1,2- ডাইব্রোমোপ্রোপেন উৎপন্ন হয়।\nCH₃-CH=CH₂+Br₂→CH₃-CHBr-CH₂Br\nপ্রোপিন, ব্রোমিন (লাল), 1,2-ডাইব্রোমোপ্রোপেন (বর্ণহীন) পরীক্ষা ২: পটাশিয়াম পারম্যাঙ্গানেট দ্রবণ পরীক্ষা লঘু ক্ষারীয় (বা জলীয়) KMnO₄ দ্রবণের গোলাপি (বেগুনি) বর্ণ D গ্যাস চালনা করলে বিনষ্ট হয়। KMnO₄ থেকে প্রাপ্ত জায়মান অক্সিজেন [O] ও পানি দ্বিবন্ধনে যুক্ত হয়ে প্রোপিলিন গ্লাইকল (প্রোপেন-1,2-ডাইঅল) তৈরি করে। KMnO₄\nCH₃-CH=CH₂+H₂O+[O]⟶CH₃-CH(OH)-CH₂OH\nপ্রোপিন, পানি, জায়মান অক্সিজেন, প্রোপিলিন গ্লাইকল (বর্ণহীন) একই পরীক্ষায় প্রোপেনের মতো সম্পৃক্ত হাইড্রোকার্বন ব্রোমিন বা KMnO₄ এর বর্ণ নষ্ট করে না।\nসিদ্ধান্ত: D যৌগ (প্রোপিন) ব্রোমিন দ্রবণের লাল বর্ণ ও KMnO₄ দ্রবণের গোলাপি বর্ণ বিনষ্ট করে । তাই প্রমাণিত হয় যে D একটি অসম্পৃক্ত হাইড্রোকার্বন । (পরীক্ষায় যেকোনো একটি পরীক্ষা লিখলেই যথেষ্ট ।)"},{"label":"ঘ","question":"উদ্দীপকের 'A' এবং 'D' যৌগের পারস্পরিক রূপান্তর সম্ভব — বিশ্লেষণ কর।","answer":"উদ্দীপকের A যৌগ প্রোপানল (CH₃-CH₂-CH₂-OH) এবং D যৌগ প্রোপিন (CH₃-CH=CH₂)। নিচে দেখানো হলো যে A থেকে D এবং D থেকে A — দুই দিকেই রূপান্তর সম্ভব ।\nA (প্রোপানল) থেকে D (প্রোপিন) প্রোপানলকে অতিরিক্ত গাঢ় সালফিউরিক এসিডসহ প্রায় 170°C তাপমাত্রায় উত্তপ্ত করলে নিরুদন ঘটে এবং প্রোপিন উৎপন্ন হয়। এখানে গাঢ় H₂SO₄ নিরুদক (পানি শোষক) হিসেবে কাজ করে। গাঢ় H₂SO₄, 170°C\nCH₃-CH₂-CH₂-OH⟶CH₃-CH=CH₂+H₂O\nপ্রোপানল, প্রোপিন, পানি\nD (প্রোপিন) থেকে A (প্রোপানল) ধাপ ১: জৈব পারঅক্সাইড বা হাইড্রোজেন পারঅক্সাইডের (H₂O₂) উপস্থিতিতে প্রোপিন হাইড্রোজেন ব্রোমাইডের (HBr) সাথে সংযোজন বিক্রিয়া করে। পারঅক্সাইড থাকায় Br পরমাণু প্রান্তীয় কার্বনে যুক্ত হয় এবং 1-ব্রোমোপ্রোপেন (প্রোপাইল ব্রোমাইড) উৎপন্ন হয়। H₂O₂\nCH₃-CH=CH₂+HBr⟶CH₃-CH₂-CH₂Br\nপ্রোপিন, হাইড্রোজেন ব্রোমাইড, 1-ব্রোমোপ্রোপেন ধাপ ২: 1-ব্রোমোপ্রোপেনকে সোডিয়াম হাইড্রোক্সাইডের জলীয় দ্রবণসহ উত্তপ্ত করলে প্রতিস্থাপন (আর্দ্রবিশ্লেষণ) বিক্রিয়ায় Br এর স্থানে -OH যুক্ত হয়ে প্রোপানল উৎপন্ন হয়।\nΔ\nCH₃-CH₂-CH₂Br+NaOH(aq)⟶CH₃-CH₂-CH₂-OH+NaBr\n1-ব্রোমোপ্রোপেন, সোডিয়াম হাইড্রোক্সাইড, প্রোপানল (A), সোডিয়াম ব্রোমাইড\n• প্রোপিনে সরাসরি পানি সংযোজন করলে (H₃PO₄, উচ্চ তাপ ও\nচাপ) মূলত 2-প্রোপানল (CH₃-CH(OH)-CH₃) তৈরি হয়; তাই প্রান্তীয় -OH যুক্ত প্রোপানল (A) পেতে HBr/পারঅক্সাইড ও জলীয় NaOH এর দুই ধাপের পথটি ব্যবহার করা হয়।\nসিদ্ধান্ত: নিরুদনের মাধ্যমে A (প্রোপানল) থেকে D (প্রোপিন) এবং পারঅক্সাইডের উপস্থিতিতে HBr সংযোজন ও পরে জলীয় NaOH দ্বারা আর্দ্রবিশ্লেষণের মাধ্যমে D থেকে A প্রস্তুত করা যায়। অতএব A ও D যৌগের পারস্পরিক রূপান্তর সম্ভব ।"}]},{"id":"ch11-cq11","chapter":11,"num":11,"importance":3,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকিন","board":"বরিশাল বোর্ড ২০২১","stem":"Y ও Z দুটি যৌগ। Y একটি অসম্পৃক্ত হাইড্রোকার্বন, যার আণবিক ভর 42 এবং Z একটি অ্যালকোহল যার আণবিক ভর 60।","subQuestions":[{"label":"ক","question":"ডাইমার কাকে বলে?","answer":"দুটি একই মনোমার অণু পরস্পর যুক্ত হয়ে যে অণু গঠন করে\nতাকে ডাইমার (Dimer) বলে। যেমন: 2NO₂→N₂O₄।"},{"label":"খ","question":"PVC একটি যুত পলিমার —ব্যাখ্যা করো।","answer":"যে পলিমারকরণে মনোমার অণুগুলো কোনো ক্ষুদ্র অণু (যেমন H₂O) বাদ না দিয়ে সরাসরি একটির সাথে আরেকটি যুক্ত হয়ে দীর্ঘ শিকল গঠন করে, তাকে যুত পলিমার (Addition polymer) বলে। এর মনোমার সাধারণত দ্বিবন্ধনযুক্ত হয়। PVC এর মনোমার ভিনাইল ক্লোরাইড (CH₂=CHCl)। জৈব পারঅক্সাইডের উপস্থিতিতে উচ্চ তাপ ও চাপে এর দ্বিবন্ধন ভেঙে অণুগুলো সরাসরি যুক্ত হয়; কোনো উপজাত তৈরি হয় না এবং পলিমারের স্থূল সংকেত মনোমারের সমান থাকে। জৈব পারঅক্সাইড , উচ্চ তাপ ও চাপ\nnCH₂=CHCl⟶(-CH₂-CHCl-)n\nভিনাইল ক্লোরাইড → পলিভিনাইল ক্লোরাইড (PVC)\nতাই PVC একটি যুত পলিমার ।"},{"label":"গ","question":"Y যৌগের অসম্পৃক্ততা কীভাবে প্রমাণ করবে? সমীকরণসহ ব্যাখ্যা করো।","answer":"শনাক্তকরণ Y একটি অসম্পৃক্ত হাইড্রোকার্বন, আণবিক ভর 42। অ্যালকিন CnH2n ধরলে: 12n+2n=42 বা 14n = 42, ∴ n = 3। সুতরাং Y = C₃H₆, প্রোপিন (Propene), CH₃-CH=CH₂। (যাচাই: 3×12+ 6×1=42) ধারণা অসম্পৃক্ত যৌগের C=C বন্ধনে যুত বিক্রিয়া ঘটে; তাই এরা ব্রোমিন দ্রবণের লাল বর্ণ ও পটাশিয়াম পারম্যাঙ্গানেটের গোলাপি বর্ণ নষ্ট করে। পরীক্ষা-১: ব্রোমিন দ্রবণ পরীক্ষা প্রোপিন গ্যাস লাল-বাদামি ব্রোমিন দ্রবণে (CCl₄ এ) চালনা করলে দ্রবণের লাল বর্ণ অপসারিত হয় এবং বর্ণহীন 1,2-ডাইব্রোমোপ্রোপেন উৎপন্ন হয়। CCl₄\nCH₃-CH=CH₂+Br₂⟶CH₃-CHBr-CH₂Br\nপ্রোপিন + ব্রোমিন (লাল) → 1,2-ডাইব্রোমোপ্রোপেন (বর্ণহীন)\nপরীক্ষা-২: পটাশিয়াম পারম্যাঙ্গানেট পরীক্ষা ক্ষারীয় লঘু KMnO₄ এর গোলাপি দ্রবণে প্রোপিন চালনা করলে গোলাপি বর্ণ নষ্ট হয় এবং বর্ণহীন প্রোপিলিন গ্লাইকল (প্রোপেন-1,2- ডাইঅল) উৎপন্ন হয়। CH₃-CH=CH₂+H₂O KMnO₄, KOH\n+[O]⟶CH₃-CH(OH)-CH₂-OH\nপ্রোপিন → প্রোপিলিন গ্লাইকল (বর্ণহীন)\nসিদ্ধান্ত প্রোপিন (Y) উভয় দ্রবণের বর্ণ নষ্ট করে — অতএব Y একটি অসম্পৃক্ত যৌগ।"},{"label":"ঘ","question":"Y থেকে Z যৌগ এবং Z থেকে Y যৌগ প্রস্তুত করা সম্ভব কিনা? বিশ্লেষণ করো।","answer":"শনাক্তকরণ 'গ' অংশ থেকে Y = প্রোপিন (C₃H₆)। Z একটি অ্যালকোহল, আণবিক ভর 60। CnH2n+₁OH ধরলে: 14n+18=60, ∴ n = 3। সুতরাং Z = C₃H₇OH, প্রোপানল (Propanol), CH₃-CH₂-CH₂-OH। (যাচাই: 36+8+16=60) Y ও Z উভয়েরই কার্বন সংখ্যা 3, তাই একটি থেকে অন্যটিতে রূপান্তর সম্ভব । Y (প্রোপিন) থেকে Z (প্রোপানল) ধাপ-১: জৈব পারঅক্সাইড বা H₂O₂ এর উপস্থিতিতে প্রোপিন HBr এর সাথে যুত বিক্রিয়া করে 1-ব্রোমোপ্রোপেন (প্রোপাইল ব্রোমাইড) দেয় (পারঅক্সাইড প্রভাব; পারঅক্সাইড না থাকলে প্রধানত 2- ব্রোমোপ্রোপেন হয়)। H₂O₂\nCH₃-CH=CH₂+HBr⟶CH₃-CH₂-CH₂Br\nধাপ-২: প্রোপাইল ব্রোমাইডকে জলীয় NaOH দ্রবণের সাথে উত্তপ্ত করলে প্রতিস্থাপন বিক্রিয়ায় প্রোপানল উৎপন্ন হয়।\nΔ\nCH₃-CH₂-CH₂Br+NaOH(aq)⟶CH₃-CH₂-CH₂-OH+NaBr\nZ (প্রোপানল) থেকে Y (প্রোপিন) প্রোপানলকে অতিরিক্ত গাঢ় H₂SO₄ এর সাথে প্রায় 170°C তাপমাত্রায় উত্তপ্ত করলে এক অণু পানি অপসারিত হয় (নিরুদন, Dehydration) এবং প্রোপিন উৎপন্ন হয়। গাঢ় H₂SO₄, 170°C\nCH₃-CH₂-CH₂-OH⟶CH₃-CH=CH₂+H₂O\nপ্রোপানল (Z) → প্রোপিন (Y) + পানি\nসিদ্ধান্ত উপরের বিক্রিয়াগুলো থেকে দেখা যায়, যুত বিক্রিয়া ও প্রতিস্থাপনের মাধ্যমে Y থেকে Z এবং নিরুদন বিক্রিয়ার মাধ্যমে Z থেকে Y তৈরি করা যায়। অতএব Y থেকে Z এবং Z থেকে Y — উভয় রূপান্তরই সম্ভব ।"}]},{"id":"ch11-cq12","chapter":11,"num":12,"importance":3,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকিন","board":"বরিশাল বোর্ড ২০২৫","stem":"CnH2n (A), CnH2n+₁OH (B) [এখানে n = 3]","subQuestions":[{"label":"ক","question":"অ্যালকাইল মূলক কাকে বলে?","answer":"অ্যালকেন থেকে একটি হাইড্রোজেন পরমাণু অপসারণ করলে যে একযোজী মূলক পাওয়া যায় তাকে অ্যালকাইল মূলক বলে । এর সাধারণ সংকেত CnH2n+₁-; যেমন: মিথাইল (CH₃-), ইথাইল (C₂H₅-)।"},{"label":"খ","question":"সাইক্লোপ্রোপিনকে অ্যালিসাইক্লিক হাইড্রোকার্বন বলা হয় কেন? ব্যাখ্যা কর।","answer":"যেসব বদ্ধ শিকল হাইড্রোকার্বনে বেনজিন বলয় থাকে না এবং যাদের ধর্ম মুক্ত শিকল (অ্যালিফেটিক) হাইড্রোকার্বনের মতো, তাদের অ্যালিসাইক্লিক হাইড্রোকার্বন বলে । সাইক্লোপ্রোপিনের (C₃H₄) তিনটি কার্বন যুক্ত হয়ে একটি বলয় গঠন করেছে, অর্থাৎ এটি বদ্ধ শিকল যৌগ। এতে একটি C=C দ্বিবন্ধন আছে কিন্তু বেনজিন বলয় নেই, এবং এটি অ্যালিফেটিক অসম্পৃক্ত যৌগের মতো সংযোজন বিক্রিয়া দেয়। তাই সাইক্লোপ্রোপিনকে অ্যালিসাইক্লিক হাইড্রোকার্বন বলা হয়।"},{"label":"গ","question":"KMnO₄ দ্রবণ দ্বারা A যৌগটির অসম্পৃক্ততার পরীক্ষা সমীকরণসহ ব্যাখ্যা কর।","answer":"উদ্দীপকে A = CnH2n এবং n = 3, সুতরাং A = C₃H₆, অর্থাৎ প্রোপিন (CH₃-CH=CH₂)। এতে C=C দ্বিবন্ধন আছে। একটি টেস্টটিউবে প্রোপিন গ্যাস চালনা করে গোলাপি বর্ণের KMnO₄ দ্রবণ ও KOH যোগ করে ঝাঁকালে KMnO₄ ও KOH থেকে জায়মান অক্সিজেন [O] তৈরি হয়। এই [O] ও দ্রবণের পানি প্রোপিনের দ্বিবন্ধনের দুই কার্বনে যুক্ত হয়ে প্রোপিলিন গ্লাইকল তৈরি করে, ফলে গোলাপি বর্ণ দূর হয়ে দ্রবণ বর্ণহীন হয়। CH₃-CH=CH₂+H₂O KMnO₄, KOH\n+[O]⟶CH₃-CH(OH)-CH₂OH\nঅপরদিকে সম্পৃক্ত হাইড্রোকার্বন যেমন প্রোপেন (C₃H₈) নিলে কোনো বিক্রিয়া হয় না, গোলাপি বর্ণ থেকে যায়। সুতরাং A (প্রোপিন) KMnO₄-এর গোলাপি বর্ণ দূর করে বলে এটি একটি অসম্পৃক্ত হাইড্রোকার্বন ।"},{"label":"ঘ","question":"A এবং B এর পারস্পরিক রূপান্তর সম্ভব কিনা— যুক্তিসহ বিশ্লেষণ কর।","answer":"উদ্দীপকে n = 3। তাই A = C₃H₆ = প্রোপিন (CH₃-CH=CH₂) এবং B = C₃H₇OH = প্রোপানল (CH₃-CH₂-CH₂-OH)। A থেকে B: H₂O₂-এর উপস্থিতিতে প্রোপিন HBr-এর সাথে সংযোজন বিক্রিয়ায় প্রোপাইল ব্রোমাইড দেয়। প্রোপাইল ব্রোমাইডকে জলীয় NaOH-সহ উত্তপ্ত করলে -Br এর স্থানে -OH প্রতিস্থাপিত হয়ে প্রোপানল উৎপন্ন হয়। H₂O₂\nCH₃-CH=CH₂+HBr⟶CH₃-CH₂-CH₂Br\nΔ\nCH₃-CH₂-CH₂Br+NaOH(aq)⟶CH₃-CH₂-CH₂-OH+NaBr\nB থেকে A: প্রোপানলকে অতিরিক্ত গাঢ় H₂SO₄-সহ উত্তপ্ত করলে গাঢ় H₂SO₄ নিরুদক হিসেবে এক অণু পানি অপসারণ করে এবং প্রোপিন উৎপন্ন হয়। গাঢ় H₂SO₄, Δ\nCH₃-CH₂-CH₂-OH⟶CH₃-CH=CH₂+H₂O\nসুতরাং সংযোজন ও প্রতিস্থাপন বিক্রিয়ায় A থেকে B এবং নিরুদন বিক্রিয়ায় B থেকে A তৈরি করা যায়; অর্থাৎ A ও B-এর পারস্পরিক রূপান্তর সম্ভব ।"}]},{"id":"ch11-cq13","chapter":11,"num":13,"importance":3,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকাইন","board":"ঢাকা বোর্ড ২০২৬","stem":"নিচের বিক্রিয়াসমূহ লক্ষ কর : Heat\n(i)CaC₂(s)+2H₂O(l)⟶X+চুনের পানি।\nNi, Δ\n(ii)X(g)+2H₂(g)⟶Y(g)\nX ও Y প্রচলিত অর্থ বহন করে না।","subQuestions":[{"label":"ক","question":"মেন্ডেলিফের পর্যায় সূত্রটি লেখ।","answer":"মেন্ডেলিফের পর্যায় সূত্র: মৌলসমূহের ভৌত ও রাসায়নিক ধর্মাবলি তাদের পারমাণবিক ভরের পর্যায়বৃত্ত ফাংশন ।"},{"label":"খ","question":"‘প্রশমন বিক্রিয়া একটি নন-রেডক্স বিক্রিয়া ’—ব্যাখ্যা কর।","answer":"যে বিক্রিয়ায় কোনো পরমাণুর জারণ সংখ্যার পরিবর্তন ঘটে না, তাকে নন-রেডক্স বিক্রিয়া বলে।\nNaOH+HCl→NaCl+H₂O\nএ প্রশমন বিক্রিয়ায় বিক্রিয়ার আগে ও পরে Na এর জারণ সংখ্যা +1, Cl এর -1, H এর +1 এবং O এর -2 অপরিবর্তিত থাকে। এখানে কোনো ইলেকট্রন আদান-প্রদান হয় না, শুধু H⁺ ও OH⁻ আয়ন যুক্ত\nহয়ে পানি গঠন করে (H⁺+OH⁻→H₂O)। তাই প্রশমন বিক্রিয়া\nএকটি নন-রেডক্স বিক্রিয়া ।"},{"label":"গ","question":"উদ্দীপকের ‘X’ ও ‘Y’ যৌগদ্বয়ের মধ্যে কোনটি অধিক সক্রিয় তা যুক্তিসহ ব্যাখ্যা কর।","answer":"ক্যালসিয়াম কার্বাইডের সাথে পানির বিক্রিয়ায় ইথাইন (অ্যাসিটিলিন) গ্যাস ও চুনের পানি [Ca(OH)₂] উৎপন্ন হয়। সুতরাং X হলো ইথাইন (CH≡CH)।\nCaC₂+2H₂O→CH≡CH+Ca(OH)₂\nইথাইনকে Ni প্রভাবকের উপস্থিতিতে উত্তপ্ত অবস্থায় হাইড্রোজেনের সাথে বিক্রিয়া করালে ইথেন উৎপন্ন হয়। সুতরাং Y হলো ইথেন (CH₃-CH₃)।\nNi, 200°C\nCH≡CH+2H₂⟶CH₃-CH₃\nX (ইথাইন) একটি অসম্পৃক্ত হাইড্রোকার্বন (অ্যালকাইন)। এর দুটি কার্বনের মধ্যে ত্রিবন্ধন আছে, যার মধ্যে একটি সিগমা ও দুটি দুর্বল পাই বন্ধন । পাই বন্ধন সহজেই ভেঙে যায়, ফলে X সহজে যুত বিক্রিয়ায় অংশ নেয়। যেমন: ব্রোমিন পানির বর্ণ দূর করে।\nCH≡CH+2Br₂→CHBr₂-CHBr₂\nঅপরদিকে Y (ইথেন) একটি সম্পৃক্ত হাইড্রোকার্বন (অ্যালকেন)। এর সকল বন্ধন শক্তিশালী সিগমা বন্ধন হওয়ায় এটি সাধারণ অবস্থায় প্রায় নিষ্ক্রিয়; কেবল সূর্যালোকের উপস্থিতিতে প্রতিস্থাপন বিক্রিয়ায় অংশ নেয় এবং ব্রোমিন পানির বর্ণ দূর করে না। সূর্যালোক\nCH₃-CH₃+Cl₂⟶CH₃-CH₂Cl+HCl\nসুতরাং, উদ্দীপকের X (ইথাইন) যৌগটি Y (ইথেন) এর চেয়ে অধিক সক্রিয় ।"},{"label":"ঘ","question":"উদ্দীপকের ‘X’ যৌগটি থেকে কীভাবে একটি ফ্যাটি অ্যাসিড প্রস্তুত করা যায় তা উপযুক্ত বিক্রিয়াসহ বিশ্লেষণ কর।","answer":"উদ্দীপকের X যৌগটি ইথাইন (CH≡CH)। ইথাইন থেকে দুই ধাপে ফ্যাটি অ্যাসিড ইথানোয়িক এসিড বা অ্যাসিটিক এসিড (CH₃COOH) প্রস্তুত করা যায়। অ্যাসিটিক এসিড একটি মনোকার্বক্সিলিক এসিড, যা ফ্যাটি অ্যাসিড শ্রেণির অন্তর্ভুক্ত । ধাপ-১: ইথাইন থেকে ইথান্যাল প্রস্তুতি ইথাইন গ্যাসকে 1% HgSO₄ ও 40% লঘু H₂SO₄ এর মিশ্রণে 60-80°C তাপমাত্রায় চালনা করলে ইথাইন এক অণু পানির সাথে যুক্ত হয়ে প্রথমে অস্থায়ী ভিনাইল অ্যালকোহল উৎপন্ন করে, যা সাথে সাথে পুনর্বিন্যস্ত হয়ে ইথান্যাল (অ্যাসিটালডিহাইড) এ পরিণত হয়। HgSO₄, লঘু H₂SO₄, 60-80°C\nCH≡CH+H₂O⟶[CH₂=CH-OH]\n→CH₃-CHO\nধাপ-২: ইথান্যাল থেকে ইথানোয়িক এসিড প্রস্তুতি ইথান্যালকে জারক পদার্থ অম্লীয় পটাসিয়াম ডাইক্রোমেট (K₂Cr₂O₇/ H₂SO₄) দ্বারা জারিত করলে ইথানোয়িক এসিড উৎপন্ন হয়। এসময় দ্রবণের কমলা বর্ণ সবুজ বর্ণে পরিণত হয়। K₂Cr₂O₇/H₂SO₄\nCH₃-CHO+[O]⟶CH₃-COOH\n3CH₃-CHO+K₂Cr₂O₇+4H₂SO₄\n→3CH₃-COOH+K₂SO₄+Cr₂(SO₄)₃\n+4H₂O\nসামগ্রিক রূপান্তর:\nH₂O, HgSO₄/H₂SO₄[O]\nCH≡CH⟶CH₃-CHO⟶CH₃-COOH\nঅতএব, উদ্দীপকের X (ইথাইন) যৌগকে প্রথমে পানি যোগ করে ইথান্যালে এবং পরে জারণ করে ফ্যাটি অ্যাসিড ইথানোয়িক এসিডে রূপান্তর করা যায়।"}]},{"id":"ch11-cq14","chapter":11,"num":14,"importance":3,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকাইন","board":"চট্টগ্রাম বোর্ড ২০২৪","stem":"(i)CaC₂(s)+2H₂O(l)→A(g)+Ca(OH)₂(s)\n(ii)CH3CH2CH2Br(l)+NaOH(aq)\n→B(aq)+NaBr(s)","subQuestions":[{"label":"ক","question":"অলিফিন কাকে বলে?","answer":"অ্যালকিনের নিম্নতর সদস্যগুলো হ্যালোজেনের সাথে বিক্রিয়ায় তৈলাক্ত পদার্থ উৎপন্ন করে বলে অ্যালকিনকে অলিফিন (তৈল উৎপাদনকারী) বলে।"},{"label":"খ","question":"ফেনল একটি অ্যারোমেটিক যৌগ— ব্যাখ্যা কর।","answer":"যেসব জৈব যৌগ সমতলীয় চাক্রিক এবং যাদের বলয়ে পর্যায়ক্রমে একক ও দ্বিবন্ধন (একান্তর দ্বিবন্ধন) থাকে তাদের অ্যারোমেটিক যৌগ বলে। যেমন: বেনজিন (C₆H₆)। ফেনল (C₆H₅OH) হলো বেনজিন বলয়ের একটি H এর স্থানে -OH যুক্ত যৌগ। এতে 6 সদস্যবিশিষ্ট সমতলীয় বেনজিন বলয় ও তিনটি একান্তর দ্বিবন্ধন আছে। তাই ফেনল একটি অ্যারোমেটিক যৌগ।"},{"label":"গ","question":"উদ্দীপকের 'A' যৌগটির অসম্পৃক্ততা কীভাবে প্রমাণ করবে? সমীকরণসহ ব্যাখ্যা কর।","answer":"উদ্দীপকের (i) নং বিক্রিয়া থেকে A শনাক্ত করি:\nCaC₂(s)+2H₂O(l)→CH≡CH(g)+Ca(OH)₂(s)\nসুতরাং A = ইথাইন (CH≡CH), যাতে কার্বন-কার্বন ত্রিবন্ধন আছে। দুটি পরীক্ষায় এর অসম্পৃক্ততা প্রমাণ করা যায়। ব্রোমিন দ্রবণ পরীক্ষা: লাল বর্ণের ব্রোমিন দ্রবণে A গ্যাস চালনা করলে ত্রিবন্ধনের দুটি π বন্ধন ভেঙে দুই অণু ব্রোমিন যুক্ত হয় এবং দ্রবণ বর্ণহীন হয়।\nCH≡CH+2Br₂→CHBr₂-CHBr₂\nKMnO₄ পরীক্ষা: লঘু KMnO₄ এর গোলাপি দ্রবণে A চালনা করলে ইথাইন জায়মান অক্সিজেন দ্বারা জারিত হয়ে অক্সালিক এসিড তৈরি করে এবং গোলাপি বর্ণ বিনষ্ট হয়। KMnO₄\nCH≡CH+4[O]⟶HOOC-COOH\nসম্পৃক্ত অ্যালকেন এ দুটি বর্ণ নষ্ট করে না। A ব্রোমিনের লাল বর্ণ ও KMnO₄ এর গোলাপি বর্ণ বিনষ্ট করায় প্রমাণিত হয় যে A একটি অসম্পৃক্ত হাইড্রোকার্বন ।"},{"label":"ঘ","question":"'B' যৌগ থেকে ইথেন যৌগ প্রস্তুত সম্ভব কি-না? যুক্তিসহ বিশ্লেষণ কর।","answer":"উদ্দীপকের (ii) নং বিক্রিয়ায় জলীয় NaOH এর সাথে প্রতিস্থাপন বিক্রিয়ায় অ্যালকোহল উৎপন্ন হয়:\nCH₃CH₂CH₂Br+NaOH(aq)→CH₃CH₂CH₂OH+NaBr\nসুতরাং B = প্রোপানল (3টি কার্বন), আর ইথেনে 2টি কার্বন । তাই এমন পথ দরকার যেখানে একটি কার্বন কমে — সোডিয়াম লবণের ডিকার্বক্সিলেশন এ কাজ করে। ধাপ ১: অম্লীয় K₂Cr₂O₇ দ্বারা প্রোপানলকে জারিত করলে প্রথমে প্রোপান্যাল ও পরে প্রোপানয়িক এসিড উৎপন্ন হয়। K₂Cr₂O₇, H₂SO₄\nCH₃-CH₂-CH₂OH+[O]⟶CH₃-CH₂-CHO\n+H₂O K₂Cr₂O₇, H₂SO₄\nCH₃-CH₂-CHO+[O]⟶CH₃-CH₂-COOH\nধাপ ২: প্রোপানয়িক এসিডকে NaOH দ্বারা প্রশমিত করে সোডিয়াম প্রোপানয়েট তৈরি করা হয়।\nCH₃-CH₂-COOH+NaOH→CH₃-CH₂-COONa+H₂O\nধাপ ৩: সোডিয়াম প্রোপানয়েটকে সোডালাইম (NaOH + CaO) সহ উত্তপ্ত করলে Na₂CO₃ বের হয়ে যায় এবং একটি কার্বন কম ইথেন উৎপন্ন হয়। CaO, Δ\nCH₃-CH₂-COONa+NaOH⟶CH₃-CH₃+Na₂CO₃\nসুতরাং প্রোপানল (B) → প্রোপানয়িক এসিড → সোডিয়াম\nপ্রোপানয়েট → ইথেন — এ পথে B থেকে ইথেন প্রস্তুত করা সম্ভব ।"}]},{"id":"ch11-cq15","chapter":11,"num":15,"importance":3,"topic":"অসম্পৃক্ত হাইড্রোকার্বন: অ্যালকাইন","board":"রাজশাহী বোর্ড ২০২২","stem":"CH₃ - C ≡ CH","subQuestions":[{"label":"ক","question":"ভর সংখ্যা কাকে বলে?","answer":"কোনো পরমাণুর নিউক্লিয়াসে উপস্থিত প্রোটন সংখ্যা ও নিউট্রন সংখ্যার যোগফলকে ঐ পরমাণুর ভর সংখ্যা (Mass number) বলে। A = Z + N।"},{"label":"খ","question":"কঠিন আয়োডিন একটি ঊর্ধ্বপাতিত পদার্থ – ব্যাখ্যা কর।","answer":"যেসব কঠিন পদার্থ তাপ দিলে তরলে পরিণত না হয়ে সরাসরি বাষ্পে পরিণত হয় এবং বাষ্পকে শীতল করলে সরাসরি কঠিনে ফিরে আসে, তাদেরকে ঊর্ধ্বপাতিত পদার্থ বলে। কঠিন আয়োডিনের দানাকে মৃদু তাপ দিলে তা গলে তরল না হয়ে সরাসরি বেগুনি বর্ণের বাষ্পে পরিণত হয়। আবার এই বাষ্প ঠান্ডা কোনো পৃষ্ঠের সংস্পর্শে এলে সরাসরি কঠিন আয়োডিন দানায় ফিরে আসে।\nI₂(s)⇌I₂(g)\nতাই কঠিন আয়োডিন একটি ঊর্ধ্বপাতিত পদার্থ ।"},{"label":"গ","question":"উদ্দীপকের যৌগটির অসম্পৃক্ততার পরীক্ষা সমীকরণসহ লিখ।","answer":"শনাক্তকরণ উদ্দীপকের যৌগ CH₃-C≡CH হলো প্রোপাইন (Propyne), C₃H₄ — কার্বন-কার্বন ত্রিবন্ধনযুক্ত অ্যালকাইন, অর্থাৎ একটি অসম্পৃক্ত হাইড্রোকার্বন । ধারণা ত্রিবন্ধনের দুটি পাই বন্ধন ভেঙে প্রতিটি কার্বনে নতুন পরমাণু যুক্ত হতে পারে, তাই অ্যালকাইন দুই ধাপে যুত বিক্রিয়া দেয় (2 মোল Br₂ গ্রহণ করে)। এজন্য এটি ব্রোমিন ও KMnO₄ দ্রবণের বর্ণ নষ্ট করে। পরীক্ষা-১: ব্রোমিন দ্রবণ পরীক্ষা লাল-বাদামি ব্রোমিন দ্রবণে (CCl₄ এ) প্রোপাইন চালনা করলে লাল বর্ণ অপসারিত হয় এবং বর্ণহীন 1,1,2,2-টেট্রাব্রোমোপ্রোপেন উৎপন্ন হয়। CCl₄\nCH₃-C≡CH+2Br₂⟶CH₃-CBr₂-CHBr₂\nপ্রোপাইন + ব্রোমিন (লাল) → 1,1,2,2-টেট্রাব্রোমোপ্রোপেন (বর্ণহীন) পরীক্ষা-২: পটাশিয়াম পারম্যাঙ্গানেট পরীক্ষা ক্ষারীয় লঘু KMnO₄ এর গোলাপি দ্রবণে প্রোপাইন চালনা করলে গোলাপি বর্ণ নষ্ট হয় এবং বর্ণহীন 1,1,2,2-টেট্রাহাইড্রক্সিপ্রোপেন উৎপন্ন হয়।\nCH₃-C≡CH+2H₂O KMnO₄, KOH\n+2[O]⟶CH₃-C(OH)₂-CH(OH)₂\nপ্রোপাইন → 1,1,2,2-টেট্রাহাইড্রক্সিপ্রোপেন (বর্ণহীন)\nসিদ্ধান্ত প্রোপাইন উভয় দ্রবণের বর্ণ নষ্ট করে — এটিই এর অসম্পৃক্ততার প্রমাণ । (সম্পৃক্ত প্রোপেন এ দুটি দ্রবণের বর্ণ নষ্ট করে না।)"},{"label":"ঘ","question":"উদ্দীপকের যৌগটি থেকে পলিমার প্রস্তুত সম্ভব কি? সমীকরণসহ বিশ্লেষণ কর।","answer":"শনাক্তকরণ ও বিশ্লেষণ উদ্দীপকের যৌগটি প্রোপাইন, CH₃-C≡CH। প্রচলিত যুত পলিমার তৈরিতে মনোমার হিসেবে দ্বিবন্ধনযুক্ত অ্যালকিন ব্যবহৃত হয়। তাই প্রোপাইনকে প্রথমে নিয়ন্ত্রিত হাইড্রোজেনেশনে প্রোপিনে রূপান্তর করে, তারপর প্রোপিনকে পলিমারকরণ করলে পলিমার (পলিপ্রোপিন) পাওয়া যায়। ধাপ-১: প্রোপাইন থেকে প্রোপিন প্রোপাইনকে নিকেল (Ni) প্রভাবকের উপস্থিতিতে 180-200°C তাপমাত্রায় এক মোল (নিয়ন্ত্রিত পরিমাণ) H₂ এর সাথে উত্তপ্ত করলে প্রোপিন পাওয়া যায়। অতিরিক্ত H₂ দিলে বিক্রিয়া আরও এগিয়ে সম্পৃক্ত প্রোপেন তৈরি হয়, যা থেকে পলিমার হয় না — তাই H₂ নিয়ন্ত্রণ জরুরি ।\nNi, 180-200°C\nCH₃-C≡CH+H₂⟶CH₃-CH=CH₂\nপ্রোপাইন → প্রোপিন\nধাপ-২: প্রোপিন থেকে পলিপ্রোপিন প্রোপিনকে টাইটানিয়াম ক্লোরাইড (TiCl₃, জিগলার-নাট্টা প্রভাবক) এর উপস্থিতিতে প্রায় 120°C তাপমাত্রায় ও 140 atm চাপে উত্তপ্ত করলে অসংখ্য প্রোপিন অণুর দ্বিবন্ধন খুলে পরস্পর যুক্ত হয় এবং যুত পলিমার পলিপ্রোপিন উৎপন্ন হয়। TiCl₃, 120°C, 140 atm\nnCH₂=CH-CH₃⟶[-CH₂-CH(CH₃)-]n\nপ্রোপিন (মনোমার) → পলিপ্রোপিন (পলিমার)\nপলিপ্রোপিন শক্ত ও হালকা; এটি দিয়ে বালতি, পাইপ, দড়ি, প্লাস্টিকের পাত্র ও খেলনা তৈরি হয়। সিদ্ধান্ত অতএব, উদ্দীপকের যৌগ প্রোপাইন থেকে প্রথমে প্রোপিন এবং পরে পলিমারকরণের মাধ্যমে পলিপ্রোপিন তৈরি করা যায় — অর্থাৎ প্রোপাইন থেকে পলিমার প্রস্তুত করা সম্ভব ।"}]},{"id":"ch11-cq16","chapter":11,"num":16,"importance":3,"topic":"অ্যালকোহল","board":"চট্টগ্রাম বোর্ড ২০২৬","stem":"A ও B অ্যালকিন ও অ্যালকোহল । A ও B এর আণবিক ভর যথাক্রমে 42 ও 46। [A ও B প্রতীকী অর্থে ব্যবহৃত]","subQuestions":[{"label":"ক","question":"মেথিলেটেড স্পিরিট কাকে বলে?","answer":"মেথিলেটেড স্পিরিট: রেক্টিফাইড স্পিরিটের (95.6% ইথানল) সাথে সামান্য বিষাক্ত মিথানল (প্রায় 5%) মিশিয়ে যে পানের অযোগ্য মিশ্রণ তৈরি করা হয় তাকে মেথিলেটেড স্পিরিট বলে ।"},{"label":"খ","question":"ন্যাপথলিনকে অ্যারোমেটিক হাইড্রোকার্বন বলা হয় কেন?","answer":"ন্যাপথলিনের আণবিক সংকেত C₁₀H₈। এর অণুতে দুটি বেনজিন বলয় পাশাপাশি যুক্ত থাকে এবং বলয়ে পর্যায়ক্রমে একক ও দ্বিবন্ধন বিদ্যমান । বেনজিন বলয়যুক্ত যে সকল চাক্রিক হাইড্রোকার্বন বিশেষ গন্ধযুক্ত, তাদের অ্যারোমেটিক হাইড্রোকার্বন বলে। ন্যাপথলিন বেনজিন বলয়যুক্ত এবং তীব্র গন্ধযুক্ত, তাই একে অ্যারোমেটিক হাইড্রোকার্বন বলা হয়।"},{"label":"গ","question":"A যৌগকে ক্ষারীয় পটাশিয়াম পারম্যাঙ্গানেট দ্বারা জারিত করলে কী ঘটে? সমীকরণসহ ব্যাখ্যা কর।","answer":"A একটি অ্যালকিন, যার সাধারণ সংকেত CnH2n এবং আণবিক ভর 42। 12n+2n=42 14n = 42 n = 3 সুতরাং A হলো C₃H₆ অর্থাৎ প্রোপিন (CH₃-CH=CH₂)। প্রোপিনকে ঠান্ডা লঘু ক্ষারীয় পটাশিয়াম পারম্যাঙ্গানেট (KMnO₄) দ্রবণের সাথে বিক্রিয়া করালে KMnO₄ থেকে প্রাপ্ত জায়মান অক্সিজেন [O] ও পানি দ্বিবন্ধনে যুক্ত হয়ে প্রোপেন-1,2-ডাইঅল (প্রোপিলিন গ্লাইকল) উৎপন্ন হয়।\n2KMnO₄+H₂O→2KOH+2MnO₂+3[O]\nCH₃-CH=CH₂+H₂O+[O]→CH₃-CH(OH)-CH₂-OH\nসামগ্রিক বিক্রিয়া:\n3CH₃-CH=CH₂+2KMnO₄+4H₂O\n→3CH₃-CH(OH)-CH₂-OH+2MnO₂\n+2KOH এ বিক্রিয়ায় KMnO₄ এর গোলাপি বর্ণ বিলুপ্ত হয় এবং MnO₂ এর বাদামি অধঃক্ষেপ পড়ে । এ পরীক্ষার মাধ্যমে A যৌগে কার্বন-কার্বন দ্বিবন্ধনের (অসম্পৃক্ততার) উপস্থিতি শনাক্ত করা যায়।"},{"label":"ঘ","question":"উদ্দীপকের B যৌগ থেকে অ্যালকেনের প্রথম ও দ্বিতীয় সদস্য প্রস্তুতির সম্ভাব্যতা সমীকরণসহ বিশ্লেষণ কর।","answer":"B একটি অ্যালকোহল, যার সাধারণ সংকেত CnH2n+₁OH এবং আণবিক ভর 46। 12n+2n+1+16+1=46 14n = 28 n = 2 সুতরাং B হলো ইথানল (CH₃-CH₂-OH)। অ্যালকেনের প্রথম সদস্য মিথেন (CH₄) এবং দ্বিতীয় সদস্য ইথেন (CH₃-CH₃)। ইথানল থেকে উভয়ই প্রস্তুত করা সম্ভব । ইথানল থেকে ইথেন প্রস্তুতি ইথানলকে গাঢ় H₂SO₄ সহ 170°C তাপমাত্রায় উত্তপ্ত করলে পানি অপসারিত হয়ে ইথিন উৎপন্ন হয়। গাঢ় H₂SO₄, 170°C\nCH₃-CH₂-OH⟶CH₂=CH₂+H₂O\nউৎপন্ন ইথিনকে Ni প্রভাবকের উপস্থিতিতে 200°C তাপমাত্রায় হাইড্রোজেনের সাথে বিক্রিয়া করালে ইথেন পাওয়া যায়।\nNi, 200°C\nCH₂=CH₂+H₂⟶CH₃-CH₃\nইথানল থেকে মিথেন প্রস্তুতি ইথানলকে অম্লীয় KMnO₄ বা K₂Cr₂O₇ দ্বারা জারিত করলে ইথানয়িক এসিড উৎপন্ন হয়। H⁺/KMnO₄\nCH₃-CH₂-OH+2[O]⟶CH₃-COOH+H₂O\nইথানয়িক এসিডকে NaOH দ্বারা প্রশমিত করলে সোডিয়াম ইথানয়েট পাওয়া যায়।\nCH₃-COOH+NaOH→CH₃-COONa+H₂O\nসোডিয়াম ইথানয়েটকে সোডালাইম (NaOH + CaO) সহ উত্তপ্ত করলে কার্বক্সিল বিযোজন ঘটে মিথেন উৎপন্ন হয়। CaO, তাপ\nCH₃-COONa+NaOH⟶CH₄+Na₂CO₃\nসুতরাং উদ্দীপকের B যৌগ (ইথানল) থেকে পানি অপসারণ ও হাইড্রোজেন সংযোজনের মাধ্যমে অ্যালকেনের দ্বিতীয় সদস্য ইথেন এবং জারণ, প্রশমন ও কার্বক্সিল বিযোজনের মাধ্যমে প্রথম সদস্য মিথেন প্রস্তুত করা সম্ভব ।"}]},{"id":"ch11-cq17","chapter":11,"num":17,"importance":3,"topic":"অ্যালকোহল","board":"কুমিল্লা বোর্ড ২০২৬","stem":"গাঢ় H₂SO₄, -H₂O\nCnH_2n+1OH⟶B\n(A)","subQuestions":[{"label":"ক","question":"অ্যালিফ্যাটিক হাইড্রোকার্বন কাকে বলে?","answer":"অ্যালিফ্যাটিক হাইড্রোকার্বন: যেসব হাইড্রোকার্বনের কার্বন পরমাণুগুলো পরস্পর যুক্ত হয়ে মুক্ত শিকল (সরল বা শাখাযুক্ত) গঠন করে, তাদেরকে অ্যালিফ্যাটিক বা মুক্ত শিকল হাইড্রোকার্বন বলে ।\nযেমন: CH₃-CH₃, CH₂=CH₂।"},{"label":"খ","question":"কার্বন মনোক্সাইডে C এর সুপ্ত যোজনী 2—ব্যাখ্যা কর।","answer":"কোনো মৌলের সর্বোচ্চ যোজনী ও কোনো যৌগে প্রদর্শিত সক্রিয় যোজনীর পার্থক্যকে ঐ মৌলের সুপ্ত যোজনী বলে। কার্বনের (1s2 2s² 2p2) যোজ্যতা ইলেকট্রন 4, তাই এর সর্বোচ্চ যোজনী 4। কার্বন মনোক্সাইডে (CO) একটি O পরমাণুর (যোজনী 2) সাথে একটি C পরমাণু যুক্ত, তাই এখানে C এর সক্রিয় যোজনী 2। C এর সুপ্ত যোজনী = সর্বোচ্চ যোজনী - সক্রিয় যোজনী =4-2=2 তাই কার্বন মনোক্সাইডে C এর সুপ্ত যোজনী 2।"},{"label":"গ","question":"A থেকে ফ্যাটি অ্যাসিড প্রস্তুতি সমীকরণসহ বর্ণনা কর।","answer":"উদ্দীপকের A এর সাধারণ সংকেত CnH2n+₁OH, অর্থাৎ A একটি অ্যালকোহল । গাঢ় H₂SO₄ দ্বারা পানি অপসারণ করে A থেকে অ্যালকিন B উৎপন্ন হয়। n = 2 ধরলে A হলো ইথানল (CH₃-CH₂-OH)। জৈব এসিডকে (কার্বক্সিলিক এসিড) ফ্যাটি অ্যাসিড বলা হয়। অম্লীয় পটাসিয়াম ডাইক্রোমেট (K₂Cr₂O₇/H₂SO₄) বা অম্লীয় KMnO₄ এর মতো জারকের দ্বারা ইথানলকে জারিত করলে প্রথমে ইথান্যাল (অ্যাসিটালডিহাইড) এবং পরে ইথানয়িক এসিড (অ্যাসিটিক এসিড) উৎপন্ন হয়। K₂Cr₂O₇/H₂SO₄\nCH₃-CH₂-OH+[O]⟶CH₃-CHO+H₂O\nK₂Cr₂O₇/H₂SO₄\nCH₃-CHO+[O]⟶CH₃-COOH\nসামগ্রিক বিক্রিয়া:\nK₂Cr₂O₇/H₂SO₄\nCH₃-CH₂-OH+2[O]⟶CH₃-COOH+H₂O\nএই বিক্রিয়ায় দ্রবণের কমলা বর্ণ (Cr₂O₇²⁻) সবুজ বর্ণে (Cr³⁺) পরিণত হয়। এভাবে A (ইথানল) থেকে ফ্যাটি অ্যাসিড (অ্যাসিটিক এসিড) প্রস্তুত করা যায়।"},{"label":"ঘ","question":"A ও B ভিন্ন যৌগ হলেও এদের দহনে একই রকমের উৎপাদ তৈরি হয়।—সমীকরণসহ ব্যাখ্যা কর।","answer":"উদ্দীপকে A একটি অ্যালকোহল এবং B একটি অ্যালকিন। n = 2 হলে A = ইথানল (CH₃-CH₂-OH) এবং গাঢ় H₂SO₄ দ্বারা নিরুদন করে B = ইথিন (CH₂=CH₂) পাওয়া যায়। গাঢ় H₂SO₄, 170°C\nCH₃-CH₂-OH⟶CH₂=CH₂+H₂O\nA একটি অ্যালকোহল (কার্যকরী মূলক -OH) এবং B একটি অসম্পৃক্ত হাইড্রোকার্বন (C=C দ্বিবন্ধন যুক্ত); তাই এরা ভিন্ন শ্রেণির ভিন্ন যৌগ। কিন্তু উভয় যৌগেই কার্বন ও হাইড্রোজেন রয়েছে । পর্যাপ্ত অক্সিজেনে পূর্ণ দহনে কার্বন জারিত হয়ে কার্বন ডাইঅক্সাইড এবং হাইড্রোজেন জারিত হয়ে পানি উৎপন্ন করে; সাথে তাপশক্তি নির্গত হয়।\nA (ইথানল) এর দহন\nCH₃-CH₂-OH+3O₂→2CO₂+3H₂O+তাপ\nB (ইথিন) এর দহন\nCH₂=CH₂+3O₂→2CO₂+2H₂O+তাপ\nসমীকরণ দুটি থেকে দেখা যায়, উভয় ক্ষেত্রেই দহনের উৎপাদ CO₂ ও H₂O (কেবল মোল সংখ্যা ভিন্ন)। সুতরাং A ও B ভিন্ন যৌগ হলেও উভয়ে C ও H দ্বারা গঠিত হওয়ায় এদের দহনে একই রকম উৎপাদ (CO₂ ও H₂O) তৈরি হয়।"}]},{"id":"ch11-cq18","chapter":11,"num":18,"importance":3,"topic":"অ্যালকোহল","board":"যশোর বোর্ড ২০২৬","stem":"Δ\n(i)PCl₅⟶PCl₃+Cl₂\nউচ্চ তাপ ও চাপ, ফসফরিক এসিড\n(ii)CnH2n+H₂O⟶D\n[এখানে, n = 2]","subQuestions":[{"label":"ক","question":"আপেক্ষিক পারমাণবিক ভর কী?","answer":"কোনো মৌলের একটি পরমাণুর গড় ভর একটি কার্বন-12 আইসোটোপের ভরের 1/12 অংশের তুলনায় যত গুণ ভারী, সেই সংখ্যাকে ঐ মৌলের আপেক্ষিক পারমাণবিক ভর বলে।"},{"label":"খ","question":"ন্যাপথালিন একটি অ্যারোমেটিক যৌগ—ব্যাখ্যা কর।","answer":"যেসব চাক্রিক জৈব যৌগের অণুতে বেনজিন বলয় থাকে, একান্তর একক ও দ্বিবন্ধন থাকে এবং যারা সাধারণত সুগন্ধযুক্ত, তাদেরকে অ্যারোমেটিক যৌগ বলে। ন্যাপথালিনের (C₁₀H₈) অণুতে দুটি বেনজিন বলয় পাশাপাশি যুক্ত (সংযুক্ত) অবস্থায় থাকে এবং বলয়ে একান্তর একক ও দ্বিবন্ধন বিদ্যমান । তাছাড়া এর তীব্র গন্ধ আছে (পোকামাকড় তাড়াতে ব্যবহৃত হয়)। তাই ন্যাপথালিন একটি অ্যারোমেটিক যৌগ।"},{"label":"গ","question":"উদ্দীপকে (i) নং বিক্রিয়াটি একটি জারণ-বিজারণ বিক্রিয়া — ব্যাখ্যা কর।","answer":"যে বিক্রিয়ায় ইলেকট্রন আদান-প্রদান ঘটে, অর্থাৎ একই সাথে জারণ (ইলেকট্রন ত্যাগ বা জারণ সংখ্যা বৃদ্ধি) ও বিজারণ (ইলেকট্রন গ্রহণ বা জারণ সংখ্যা হ্রাস) ঘটে, তাকে জারণ-বিজারণ বিক্রিয়া বলে।\nΔ\nPCl₅⟶PCl₃+Cl₂\nজারণ সংখ্যা নির্ণয়:\nPCl₅ এ P এর জারণ সংখ্যা x হলে, x+5(−1)=0 ∴ x=+5 PCl₃ এ P এর জারণ সংখ্যা y হলে, y+3(−1)=0 ∴ y=+3 PCl₅ এ Cl এর জারণ সংখ্যা −1, Cl₂ এ Cl এর জারণ সংখ্যা 0 অর্ধবিক্রিয়া:\nজারণ: 2Cl⁻→Cl₂+2e⁻\nবিজারণ: P⁵⁺+2e⁻→P³⁺\nএখানে ক্লোরিনের জারণ সংখ্যা −1 থেকে 0 তে বৃদ্ধি পাওয়ায় ক্লোরিন জারিত হয়েছে এবং ফসফরাসের জারণ সংখ্যা +5 থেকে +3 এ হ্রাস পাওয়ায় ফসফরাস বিজারিত হয়েছে । একই বিক্রিয়ায় জারণ ও বিজারণ উভয়ই ঘটায় (i) নং বিক্রিয়াটি একটি জারণ-বিজারণ বিক্রিয়া ।"},{"label":"ঘ","question":"উদ্দীপকের 'D' যৌগটি মানব কল্যাণে ব্যবহার আলোচনা কর।","answer":"n = 2 হলে CnH2n=C₂H₄ অর্থাৎ ইথিন। ইথিনকে উচ্চ তাপ ও\nচাপে ফসফরিক এসিড প্রভাবকের উপস্থিতিতে পানির (বাষ্প) সাথে বিক্রিয়া করালে ইথানল উৎপন্ন হয়: H₃PO₄, উচ্চ তাপ ও চাপ\nCH₂=CH₂+H₂O⟶CH₃-CH₂-OH\nঅতএব, D যৌগটি ইথানল (C₂H₅OH)। মানব কল্যাণে ইথানলের ব্যবহার:\n১. দ্রাবক হিসেবে: ইথানল একটি উত্তম জৈব দ্রাবক । রং, বার্নিশ, সুগন্ধি, ঔষধ ও বিভিন্ন টিংচার তৈরিতে এটি দ্রাবক হিসেবে ব্যবহৃত হয়।\n২. জীবাণুনাশক হিসেবে: ইথানল জীবাণুনাশক; ইনজেকশন দেওয়ার আগে ত্বক জীবাণুমুক্ত করতে এবং হ্যান্ড স্যানিটাইজার তৈরিতে এটি ব্যবহৃত হয়।\n৩. রেকটিফাইড স্পিরিট: 95.6% ইথানল ও 4.4% পানির মিশ্রণ রেকটিফাইড স্পিরিট, যা ঔষধ শিল্প ও পরীক্ষাগারে ব্যবহৃত হয়।\n৪. জ্বালানি হিসেবে: ইথানল পরিষ্কার শিখায় পোড়ে; মিথানল মিশ্রিত ইথানল (মেথিলেটেড স্পিরিট) স্পিরিট ল্যাম্পের জ্বালানি এবং পেট্রোলের সাথে মিশিয়ে গ্যাসোহল হিসেবে ব্যবহৃত হয়।\nC₂H₅OH+3O₂→2CO₂+3H₂O+তাপ\n৫. সংরক্ষক হিসেবে: জীববিজ্ঞান পরীক্ষাগারে মৃত প্রাণী ও উদ্ভিদের নমুনা সংরক্ষণে ইথানল ব্যবহৃত হয়। ৬. শিল্প কাঁচামাল হিসেবে: ইথানয়িক এসিড (ভিনেগার), ইথানাল, ডাইইথাইল ইথার ইত্যাদি প্রস্তুত করতে ইথানল ব্যবহৃত হয়। এছাড়া কম হিমাঙ্কের জন্য থার্মোমিটারে তরল হিসেবেও এটি ব্যবহৃত হয়। তবে ইথানলযুক্ত মদ্যপান স্বাস্থ্যের জন্য ক্ষতিকর । সঠিকভাবে ব্যবহার করলে ইথানল (D) মানব কল্যাণে বহুবিধ গুরুত্বপূর্ণ ভূমিকা পালন করে।"}]},{"id":"ch11-cq19","chapter":11,"num":19,"importance":3,"topic":"অ্যালকোহল","board":"রাজশাহী বোর্ড ২০২৬","stem":"উচ্চ তাপ এবং উচ্চ চাপ, H₃PO₄\nCnH2n+H₂O⟶B\nn = 2 (A)","subQuestions":[{"label":"ক","question":"অ্যালকাইল মূলক কাকে বলে?","answer":"অ্যালকাইল মূলক: অ্যালকেন অণু থেকে একটি হাইড্রোজেন পরমাণু অপসারণ করলে যে একযোজী মূলক পাওয়া যায়, তাকে অ্যালকাইল মূলক বলে। যেমন: মিথাইল (CH₃-), ইথাইল (C₂H₅-)।"},{"label":"খ","question":"C₄H₁₀ একটি মুক্ত শিকল যৌগ—ব্যাখ্যা কর।","answer":"যেসব জৈব যৌগে কার্বন পরমাণুগুলো পরস্পর যুক্ত হয়ে বলয় গঠন না করে খোলা শিকল তৈরি করে, তাদের মুক্ত শিকল বা অ্যালিফেটিক যৌগ বলে। C₄H₁₀ (বিউটেন) এর গাঠনিক সংকেত: CH₃-CH₂-CH₂-CH₃ এখানে চারটি কার্বন পরমাণু একটির সাথে আরেকটি একক বন্ধনে যুক্ত হয়ে একটি খোলা শিকল গঠন করেছে; শিকলের দুই প্রান্ত যুক্ত হয়ে কোনো বলয় তৈরি হয়নি । তাই C₄H₁₀ একটি মুক্ত শিকল যৌগ।"},{"label":"গ","question":"A এর অসম্পৃক্ততার পরীক্ষা সমীকরণসহ ব্যাখ্যা কর।","answer":"উদ্দীপকে n = 2 হলে A = CnH2n=C₂H₄, অর্থাৎ A হলো ইথিন (CH₂=CH₂)। এতে কার্বন-কার্বন দ্বিবন্ধন থাকায় এটি অসম্পৃক্ত হাইড্রোকার্বন । নিচের পরীক্ষার মাধ্যমে এর অসম্পৃক্ততা প্রমাণ করা যায়।\n১. ব্রোমিন পানি পরীক্ষা একটি টেস্টটিউবে লালচে-বাদামি বর্ণের ব্রোমিন পানি নিয়ে তার মধ্যে ইথিন গ্যাস চালনা করলে ব্রোমিন দ্বিবন্ধনে যুক্ত হয়ে বর্ণহীন 1,2- ডাইব্রোমোইথেন উৎপন্ন করে । ফলে ব্রোমিন পানির লালচে-বাদামি বর্ণ দূরীভূত হয়।\nCH₂=CH₂+Br₂→CH₂Br-CH₂Br\n২. বেয়ার পরীক্ষা (KMnO₄ পরীক্ষা) লঘু ক্ষারীয় KMnO₄ এর গোলাপি বর্ণের দ্রবণে ইথিন গ্যাস চালনা করলে ইথিন জারিত হয়ে ইথেন-1,2-ডাইঅল (ইথিলিন গ্লাইকল) উৎপন্ন হয় এবং KMnO₄ এর গোলাপি বর্ণ দূরীভূত হয়। KMnO₄\nCH₂=CH₂+H₂O+[O]⟶HO-CH₂-CH₂-OH\nসম্পৃক্ত হাইড্রোকার্বন (যেমন: ইথেন) এই দুই বিকারকের বর্ণ দূর করে না। তাই বর্ণ দূরীভূত হওয়ার মাধ্যমে প্রমাণিত হয় যে A (ইথিন) একটি অসম্পৃক্ত যৌগ।"},{"label":"ঘ","question":"B থেকে খাদ্য সংরক্ষক প্রস্তুত করা সম্ভব —বিশ্লেষণ কর।","answer":"উদ্দীপকের বিক্রিয়ায় A (ইথিন) উচ্চ তাপ ও উচ্চ চাপে H₃PO₄\nপ্রভাবকের উপস্থিতিতে পানির সাথে যুত বিক্রিয়া করে ইথানল উৎপন্ন করে। অর্থাৎ B হলো ইথানল (CH₃-CH₂-OH)। H₃PO₄, 300°C, 60 atm\nCH₂=CH₂+H₂O⟶CH₃-CH₂-OH\nইথানলকে জারিত করলে প্রথমে ইথান্যাল ও পরে ইথানয়িক এসিড (অ্যাসিটিক এসিড) উৎপন্ন হয়। রাসায়নিক জারণ অম্লীয় K₂Cr₂O₇ দ্রবণ দ্বারা ইথানলকে জারিত করলে: K₂Cr₂O₇/H₂SO₄\nCH₃-CH₂-OH+[O]⟶CH₃-CHO+H₂O\nK₂Cr₂O₇/H₂SO₄\nCH₃-CHO+[O]⟶CH₃-COOH\nজৈব জারণ (গাঁজন) লঘু ইথানল দ্রবণকে বাতাসের উপস্থিতিতে অ্যাসিটোব্যাক্টর ব্যাকটেরিয়া দ্বারা জারিত করলেও ইথানয়িক এসিড উৎপন্ন হয়। অ্যাসিটোব্যাক্টর\nCH₃-CH₂-OH+O₂⟶CH₃-COOH+H₂O\nইথানয়িক এসিডের 4-10% জলীয় দ্রবণকে ভিনেগার বা সিরকা বলে। ভিনেগার একটি নিরাপদ খাদ্য সংরক্ষক। এটি খাদ্যের pH কমিয়ে অম্লীয় পরিবেশ সৃষ্টি করে, ফলে খাদ্য পচনকারী ব্যাকটেরিয়া ও ছত্রাক জন্মাতে ও বংশবৃদ্ধি করতে পারে না। এজন্য আচার, চাটনি, সস ইত্যাদি খাদ্য সংরক্ষণে ভিনেগার ব্যবহৃত হয়। সুতরাং B (ইথানল) কে জারিত করে ভিনেগার তথা খাদ্য সংরক্ষক প্রস্তুত করা সম্ভব ।"}]},{"id":"ch11-cq20","chapter":11,"num":20,"importance":3,"topic":"অ্যালকোহল","board":"বরিশাল বোর্ড ২০২৫","stem":"(i)CH₃-CH₂-CH₂Cl+NaOH(alc)→A+NaCl+H₂O\n(ii)CH₃COOH+NaOH→B+H₂O","subQuestions":[{"label":"ক","question":"রেকটিফাইড স্পিরিট কী?","answer":"ইথানলের 95.6% জলীয় দ্রবণকে রেকটিফাইড স্পিরিট (Rectified spirit) বলে।"},{"label":"খ","question":"বেনজিনকে অ্যারোমেটিক হাইড্রোকার্বন বলা হয় কেন? ব্যাখ্যা কর।","answer":"5, 6 বা 7 সদস্যবিশিষ্ট যে সমতলীয় চাক্রিক (বলয়) হাইড্রোকার্বনে কার্বন-কার্বন একক ও দ্বিবন্ধন পর্যায়ক্রমে (একান্তরভাবে) থাকে তাকে অ্যারোমেটিক হাইড্রোকার্বন (Aromatic hydrocarbon) বলে। বেনজিনের আণবিক সংকেত C₆H₆। এর ছয়টি কার্বন পরমাণু একটি সমতলীয় ষড়ভুজ বলয় গঠন করে এবং বলয়ে তিনটি একক বন্ধন ও তিনটি দ্বিবন্ধন একান্তরভাবে সাজানো থাকে। এর একটি বিশেষ সুগন্ধ আছে (Aroma অর্থ সুগন্ধ)। তাই বেনজিন একটি অ্যারোমেটিক হাইড্রোকার্বন ।"},{"label":"গ","question":"'A' যৌগটির অসম্পৃক্ততা কীভাবে প্রমাণ করবে? সমীকরণসহ ব্যাখ্যা কর।","answer":"A শনাক্তকরণ প্রোপাইল ক্লোরাইডকে (1-ক্লোরোপ্রোপেন) NaOH এর অ্যালকোহলীয় দ্রবণসহ উত্তপ্ত করলে পাশাপাশি দুই কার্বন থেকে H ও Cl অপসারিত হয়ে (অপসারণ বিক্রিয়া) অ্যালকিন উৎপন্ন হয়।\nΔ\nCH₃-CH₂-CH₂Cl+NaOH(alc)⟶CH₃-CH=CH₂+NaCl\n+H₂O প্রোপাইল ক্লোরাইড + অ্যালকোহলীয় সোডিয়াম হাইড্রোক্সাইড → প্রোপিন (A) + সোডিয়াম ক্লোরাইড + পানি সুতরাং, A = প্রোপিন (C₃H₆), CH₃-CH=CH₂। এতে C=C দ্বিবন্ধন আছে।\nঅসম্পৃক্ততা প্রমাণ (১) ব্রোমিন দ্রবণ পরীক্ষা প্রোপিনকে লাল বর্ণের ব্রোমিন দ্রবণে চালনা করলে দ্বিবন্ধনে ব্রোমিন যুক্ত হয়ে বর্ণহীন 1,2-ডাইব্রোমোপ্রোপেন উৎপন্ন হয়; ফলে ব্রোমিনের লাল বর্ণ বিনষ্ট হয়।\nCH₃-CH=CH₂+Br₂→CH₃-CHBr-CH₂Br\nপ্রোপিন + ব্রোমিন (লাল) → 1,2-ডাইব্রোমোপ্রোপেন (বর্ণহীন)\n(২) পটাশিয়াম পারম্যাঙ্গানেট (বেয়ার) পরীক্ষা প্রোপিনকে KOH মিশ্রিত গোলাপি বা বেগুনি বর্ণের KMnO₄ দ্রবণে চালনা করলে প্রোপিলিন গ্লাইকল (প্রোপেন-1,2-ডাইওল) উৎপন্ন হয় এবং দ্রবণের গোলাপি বর্ণ বিনষ্ট হয়। CH₃-CH=CH₂+H₂O KMnO₄, KOH\n+[O]⟶CH₃-CH(OH)-CH₂OH\nপ্রোপিন → প্রোপিলিন গ্লাইকল (বর্ণহীন)\n✓ যেকোনো একটি পরীক্ষা লিখলেই অসম্পৃক্ততা প্রমাণ হয়; তবে দুটি লিখলে উত্তর বেশি পূর্ণাঙ্গ হয়। সম্পৃক্ত অ্যালকেন এ দুটি দ্রবণের বর্ণ নষ্ট করে না।\nসিদ্ধান্ত: A যৌগ প্রোপিন ব্রোমিন দ্রবণের লাল বর্ণ ও KMnO₄ দ্রবণের গোলাপি বর্ণ বিনষ্ট করে বলে এটি একটি অসম্পৃক্ত যৌগ।"},{"label":"ঘ","question":"'B' হতে একটি যৌগ তৈরি করা যায় যা মৃত প্রাণিদেহ সংরক্ষণে ব্যবহৃত হয় — রাসায়নিক সমীকরণসহ মূল্যায়ন কর।","answer":"B শনাক্তকরণ উদ্দীপকের (ii) নং বিক্রিয়াটি প্রশমন বিক্রিয়া ।\nCH₃COOH+NaOH→CH₃COONa+H₂O\nইথানয়িক এসিড + সোডিয়াম হাইড্রোক্সাইড → সোডিয়াম ইথানয়েট (B) + পানি সুতরাং, B = সোডিয়াম ইথানয়েট (CH₃COONa)।\nমৃত প্রাণিদেহ সংরক্ষণে ফরমালিন ব্যবহৃত হয়। মিথান্যাল বা ফরমালডিহাইডের (HCHO) 40% জলীয় দ্রবণকে ফরমালিন বলে। তাই B থেকে মিথান্যাল তৈরি করা যায় কি না তা দেখতে হবে। B থেকে মিথান্যাল প্রস্তুতি\n১. ডিকার্বক্সিলেশন: CaO এর উপস্থিতিতে সোডিয়াম ইথানয়েটকে NaOH সহ উত্তপ্ত করলে মিথেন পাওয়া যায়। CaO, Δ\nCH₃COONa+NaOH⟶CH₄+Na₂CO₃\nসোডিয়াম ইথানয়েট → মিথেন + সোডিয়াম কার্বনেট\n২. হ্যালোজিনেশন: মৃদু সূর্যালোকে মিথেন ব্রোমিনের সাথে বিক্রিয়া করে মিথাইল ব্রোমাইড দেয়। মৃদু সূর্যালোক\nCH₄+Br₂⟶CH₃Br+HBr\nমিথেন → মিথাইল ব্রোমাইড\n৩. আর্দ্রবিশ্লেষণ: মিথাইল ব্রোমাইডকে জলীয় NaOH সহ উত্তপ্ত করলে মিথানল উৎপন্ন হয়।\nΔ\nCH₃Br+NaOH(aq)⟶CH₃-OH+NaBr\nমিথাইল ব্রোমাইড → মিথানল\n৪. জারণ: K₂Cr₂O₇ ও গাঢ় H₂SO₄ থেকে প্রাপ্ত জায়মান অক্সিজেন [O] দ্বারা মিথানলকে মৃদু জারিত করলে মিথান্যাল উৎপন্ন হয়। K₂Cr₂O₇, গাঢ় H₂SO₄\nCH₃-OH+[O]⟶HCHO+H₂O\nমিথানল → মিথান্যাল (ফরমালডিহাইড)\nউৎপন্ন মিথান্যালকে পানিতে দ্রবীভূত করে 40% দ্রবণ তৈরি করলে ফরমালিন পাওয়া যায়।\n• মিথান্যাল তৈরির পর জারণ বেশি হলে মিথানয়িক এসিড (HCOOH) তৈরি হতে পারে; তাই উৎপন্ন মিথান্যালকে দ্রুত সরিয়ে নিতে হয়।\nসিদ্ধান্ত: B (সোডিয়াম ইথানয়েট) → মিথেন → মিথাইল ব্রোমাইড →\nমিথানল → মিথান্যাল ধাপে ফরমালিন প্রস্তুত করা যায়, যা মৃত\nপ্রাণিদেহ সংরক্ষণে ব্যবহৃত হয়। সুতরাং উক্তিটি যথার্থ ।"}]},{"id":"ch11-cq21","chapter":11,"num":21,"importance":3,"topic":"অ্যালডিহাইড ও জৈব এসিড","board":"দিনাজপুর বোর্ড ২০২৬","stem":"(i) প্রাকৃতিক গ্যাসের প্রধান উপাদান। (ii) মৌমাছির কামড়ে শরীরে এক ধরনের জৈব এসিড প্রবেশ করে ।","subQuestions":[{"label":"ক","question":"রেকটিফাইড স্পিরিট কাকে বলে?","answer":"রেকটিফাইড স্পিরিট: 95.6% ইথানল ও 4.4% পানির মিশ্রণকে রেকটিফাইড স্পিরিট বলে।"},{"label":"খ","question":"C₃H₆ যৌগকে অলিফিন বলা হয় — ব্যাখ্যা কর।","answer":"অলিফিন শব্দের অর্থ তেল উৎপাদনকারী । অ্যালকিনসমূহ হ্যালোজেনের সাথে যুত বিক্রিয়ায় তৈলাক্ত পদার্থ উৎপন্ন করে বলে এদেরকে অলিফিন বলে। C₃H₆ (CH₃-CH=CH₂) হলো প্রোপিন, যা CnH2n সাধারণ সংকেতবিশিষ্ট অ্যালকিন শ্রেণির সদস্য। এটি ক্লোরিনের সাথে যুত বিক্রিয়ায় তেলের মতো তরল 1,2-ডাইক্লোরোপ্রোপেন উৎপন্ন করে।\nCH₃-CH=CH₂+Cl₂→CH₃-CHCl-CH₂Cl\nতাই C₃H₆ যৌগকে অলিফিন বলা হয়।"},{"label":"গ","question":"উদ্দীপকের (i) নং যৌগের সাথে সূর্যের আলোর উপস্থিতিতে Cl₂ এর বিক্রিয়ার ধাপগুলো সমীকরণসহ বর্ণনা কর।","answer":"প্রাকৃতিক গ্যাসের প্রধান উপাদান মিথেন (CH₄)। সূর্যের আলোর উপস্থিতিতে মিথেন ক্লোরিনের সাথে প্রতিস্থাপন বিক্রিয়া করে। এতে মিথেনের H পরমাণুগুলো একটি একটি করে Cl দ্বারা প্রতিস্থাপিত হয়। বিক্রিয়াটি চারটি ধাপে সম্পন্ন হয়:\n১. প্রথম ধাপে মিথেনের একটি H প্রতিস্থাপিত হয়ে ক্লোরোমিথেন উৎপন্ন হয়। সূর্যালোক\nCH₄+Cl₂⟶CH₃Cl+HCl\n২. দ্বিতীয় ধাপে ক্লোরোমিথেন থেকে ডাইক্লোরোমিথেন উৎপন্ন হয়। সূর্যালোক\nCH₃Cl+Cl₂⟶CH₂Cl₂+HCl\n৩. তৃতীয় ধাপে ডাইক্লোরোমিথেন থেকে ট্রাইক্লোরোমিথেন (ক্লোরোফর্ম) উৎপন্ন হয়। সূর্যালোক\nCH₂Cl₂+Cl₂⟶CHCl₃+HCl\n৪. চতুর্থ ধাপে ক্লোরোফর্ম থেকে টেট্রাক্লোরোমিথেন (কার্বন টেট্রাক্লোরাইড) উৎপন্ন হয়। সূর্যালোক\nCHCl₃+Cl₂⟶CCl₄+HCl\nপ্রতিটি ধাপে উপজাত হিসেবে HCl উৎপন্ন হয়। পর্যাপ্ত ক্লোরিনের উপস্থিতিতে বিক্রিয়ার শেষ উৎপাদ হয় CCl₄।"},{"label":"ঘ","question":"উদ্দীপকের (i) নং যৌগ থেকে (ii) নং এর জৈব এসিডটি প্রস্তুতি সমীকরণসহ বর্ণনা কর।","answer":"(i) নং যৌগ মিথেন (CH₄) এবং মৌমাছির কামড়ে শরীরে প্রবেশকারী জৈব এসিড হলো ফরমিক এসিড বা মিথানোয়িক এসিড (HCOOH)। মিথেন থেকে নিম্নোক্ত ধাপে ফরমিক এসিড প্রস্তুত করা যায়: ধাপ-১: মিথেন থেকে মিথান্যাল মিথেন ও অক্সিজেনের মিশ্রণকে 100 atm চাপে ও 300°C তাপমাত্রায় Mo₂O₃ প্রভাবকের উপস্থিতিতে উত্তপ্ত করলে মিথান্যাল (ফরমালডিহাইড) উৎপন্ন হয়। Mo₂O₃, 300°C, 100 atm\nCH₄+O₂⟶HCHO+H₂O\nধাপ-২: মিথান্যাল থেকে মিথানোয়িক এসিড মিথান্যালকে গাঢ় H₂SO₄ মিশ্রিত K₂Cr₂O₇ এর মতো জারকের উপস্থিতিতে জারিত করলে মিথানোয়িক এসিড (ফরমিক এসিড) উৎপন্ন হয়। K₂Cr₂O₇/H₂SO₄\nHCHO+[O]⟶HCOOH\nবিকল্পভাবে, মিথেনকে প্রথমে সূর্যালোকে Cl₂ দ্বারা ক্লোরোমিথেনে পরিণত করে জলীয় KOH দ্বারা মিথানলে রূপান্তর করা যায়। মিথানলকে জারিত করে মিথান্যাল এবং মিথান্যালকে পুনরায় জারিত করে মিথানোয়িক এসিড পাওয়া যায়। সূর্যালোক\nCH₄+Cl₂⟶CH₃Cl+HCl\nCH₃Cl+KOH(aq)→CH₃OH+KCl\nK₂Cr₂O₇/H₂SO₄\nCH₃OH+[O]⟶HCHO+H₂O\nK₂Cr₂O₇/H₂SO₄\nHCHO+[O]⟶HCOOH\nসুতরাং, (i) নং যৌগ মিথেন থেকে জারণের মাধ্যমে (ii) নং এর জৈব এসিড অর্থাৎ ফরমিক এসিড (HCOOH) প্রস্তুত করা সম্ভব ।"}]},{"id":"ch11-cq22","chapter":11,"num":22,"importance":3,"topic":"অ্যালডিহাইড ও জৈব এসিড","board":"দিনাজপুর বোর্ড ২০২৬","stem":"একটি যৌগে Ca = 62.5%, C = 37.5%, দেওয়া আছে। ঐ যৌগের আণবিক ভর = 64 অপর একটি যৌগের সাধারণ সংকেত CnH2n−₂; এখানে n = 2","subQuestions":[{"label":"ক","question":"শক্তিস্তর কাকে বলে?","answer":"শক্তিস্তর: পরমাণুর নিউক্লিয়াসের চারদিকে ইলেকট্রনসমূহ যে নির্দিষ্ট শক্তিসম্পন্ন বৃত্তাকার কক্ষপথে আবর্তন করে, সেগুলোকে শক্তিস্তর বলে।"},{"label":"খ","question":"কপারকে মুদ্রাধাতু বলার কারণ ব্যাখ্যা কর।","answer":"প্রাচীনকাল থেকে মুদ্রা তৈরিতে যেসব ধাতু ব্যবহৃত হয়ে আসছে, তাদেরকে মুদ্রাধাতু বলে। পর্যায় সারণির ১১ নং গ্রুপের মৌল Cu, Ag ও Au মুদ্রাধাতু । কপার একটি কম সক্রিয় ধাতু। এটি বাতাস ও পানির সাথে সহজে বিক্রিয়া করে না এবং সহজে ক্ষয়প্রাপ্ত হয় না। তাছাড়া কপার নমনীয়, ঘাতসহ এবং আকর্ষণীয় বর্ণের । এসব বৈশিষ্ট্যের কারণে কপার দিয়ে মুদ্রা তৈরি করা হয়। তাই কপারকে মুদ্রাধাতু বলা হয়।"},{"label":"গ","question":"উদ্দীপকের প্রথম যৌগটির আণবিক সংকেত নির্ণয় কর।","answer":"মৌল শতকরা পারমাণবিক পরমাণুর সরল পরিমাণ ভর আপেক্ষিক অনুপাত সংখ্যা Ca 62.5 40 62.5/401.5625/1.5625 =1.5625 =1 C 37.5 12 37.5/123.125/1.5625 =3.125 =2 সুতরাং যৌগটির স্থূল সংকেত CaC₂ স্থূল সংকেত ভর =40+(12×2)=64\nধরি, আণবিক সংকেত = (CaC₂)n n = আণবিক ভর/স্থূল সংকেত ভর =64/64=1 আণবিক সংকেত = (CaC₂)₁=CaC₂ অতএব, প্রথম যৌগটির আণবিক সংকেত CaC₂ (ক্যালসিয়াম কার্বাইড)।"},{"label":"ঘ","question":"উদ্দীপকের শেষোক্ত যৌগ থেকে জৈব এসিড প্রস্তুতি সম্ভব — সমীকরণসহ বর্ণনা কর।","answer":"শেষোক্ত যৌগের সাধারণ সংকেত CnH2n−₂, যেখানে n = 2। আণবিক সংকেত = C₂H(2×2−2)=C₂H₂ সুতরাং যৌগটি ইথাইন (অ্যাসিটিলিন), HC≡CH। ইথাইন থেকে ইথানোয়িক এসিড (অ্যাসিটিক এসিড) প্রস্তুত করা যায়। ধাপ-১: ইথাইন থেকে ইথান্যাল 80°C তাপমাত্রায় 1% HgSO₄ ও 40% H₂SO₄ এর উপস্থিতিতে ইথাইনের সাথে পানি যুক্ত হয়ে ইথান্যাল (অ্যাসিটালডিহাইড) উৎপন্ন হয়। 1% HgSO₄, 40% H₂SO₄, 80°C\nHC≡CH+H₂O⟶CH₃-CHO\nধাপ-২: ইথান্যাল থেকে ইথানোয়িক এসিড উৎপন্ন ইথান্যালকে গাঢ় H₂SO₄ মিশ্রিত K₂Cr₂O₇ এর মতো জারক দ্বারা জারিত করলে ইথানোয়ি
