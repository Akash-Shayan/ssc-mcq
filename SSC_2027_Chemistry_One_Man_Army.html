নি উৎপন্ন করে। C H SO +NaOH→C H SO Na+H O 12 26 4 12 25 4 2 সু তিাং M যৌগটি হলো কসাততডযাম েরাইে সােজফট (C H SO Na), ো ততডটারজেনট ্ োনর্ পরিচচত। 12 25 4 ্ ় ্ ্ মযো পররষি াজরর ককৌশে শিীি ও াতাস থেকে ততলাকব পদাথড কাপনড় লার্গ এবং তাি উপর ় ় ূ ধু লা ালল ৈনর্ র্েলা ততরি হয়। পানিনত দ্ ীিত হলে প্র্টািনৈনট র ড + ় ় ় ় ঋণাতমক প্র্টািনৈনট আয়ন ও Na আয়নে র নোরৈত হয়। C H SO Na→C H SO −+Na+ 12 25 4 12 25 4 − ় ্ ত প্র্টািনৈনট আয়নেি ঋণাতমক চার্জ েুকব প্ান্ (-SO ) পানি ড র 4 আকষী বা হাইন বামিললক এবং দীঘড হাইন হাইরোকার্বন মশকল (C H -) ্ ্ 12 25 ী ূ ় পানি র কষী বা হাইন বানিার ক, ো বতল বা মগ্নৈ দ্ ীিত হয়। র র ় ্ ত র্েলােুকব কাপড় প্র্টািনৈনট দ্রবণে বিৈানল হাইন ব ানিার ক প্ান্ ড র র বতনলি মধ্যে প্রবেশ করে এবং হাইন বামিললক প্ান্ পানির রদনক র র থাকে। কাপড় ঘষনল বা বর্াচড় ানল বতনলি কণা চািরদক থেকে ় ্ ় ় ় প্র্টািনৈনট আয়ন দ্বারা আ ৃত হয়ে কাপড় থেকে আলাদা হয়ে যায়। ় ় ় প্রতটি বতনলি কণাি চািপার্শ ঋণাতমক চানৈড ি লে ততরি হওয়ায় কণাগুনলা পিস্পিনক র কষডণ করে আি একে হনত পানি ো; বতল, ় ় প্র্টািনৈনট ও পানি মর্নল বিো ততরি হয়। পরে পানি দিয়ে ধুনল বিোি সাথে বতল ও ধুলা ালল কাপড় থেকে অপসারিত হয়। ় ্ ্ এরান ই M যৌগ (প্র্টািনৈনট ) কাপনড় ি র্েলা পরিষ্ক াি করে। ্ ় ়"},{"label":"ঘ","question":"(ii) েং এর লবণদনেি জলীয় দ্রবণেি প্কৃ রত রক একই হন? র র বিশ্লেষণ কি।","answer":"(ii) েং এর লবণদে হলো অ্যামোনিয়ার্ ক্লোরাইড (NH Cl) ও ল 4 ় ় সোডিয়াম কার্বনেট (Na CO )। এদের জলীয় দ্রবণেি প্কৃ রত একই র র 2 3 হন ো। NH Cl এর েেীয দ্বণ 4 NH Cl দু ডল ক্ষারক NH OH ও তী র এসিড HCl থেকে উৎপন্ন লবণ। 4 4 ্ ় পানিনত আদ্ড র ন্ল রষত হয়ে এটি NH OH ও HCl উৎপন্ন করে। র ্ 4 NH Cl+H O→NH OH+HCl 4 2 4 + ় ় ় ় HCl প্রায় সম্পূর্ণ র নোরৈত হয়ে অরধক H দেয়, কিন্তু NH OH র 4 − + − ় ় ় সামানয র নোরৈত হয়ে অল্ OH দেয়। িনল [H ] \u003e [OH ]; দ্রবণ প র অ্ীয, pH \u003c 7। ার সাজেশন Na CO এর েেীয দ্বণ 2 3 র Na CO তী র ক্ষারক NaOH ও দু ডল এসিড H CO থেকে উৎপন্ন 2 3 ্ 2 লবণ। পানিনত আদ্ড র ন্লরষত হয়ে এটি NaOH ও H CO উৎপন্ন র ্ করে। Na CO +2H O→2NaOH+H CO 2 3 2 − ় ় ় NaOH প্রায় সম্পূর্ণ র নোরৈত হয়ে অরধক OH দেয়, কিন্তু H CO − + ় ় সামানয র নোরৈত হয়। িনল [OH ] \u003e [H ]; দ্রবণ োরীয, pH \u003e 7। ় ় সু তিাং NH Cl এর জলীয় দ্রবণ অম্ল ীে এবং Na CO এর জলীয় 4 র 2 ় ্ ় ় দ্রবণ ক্ষারীে; তাই লবণদনেি জলীয় দ্রবণেি প্কৃ রত একই েে। র র র"}],"board":"ঢাকা বোর্ড ২০২৫"},{"id":"ch12-cq3","chapter":12,"num":3,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: (i) অ্যামোনিয়া + পারন + আইজসা কপ্াপাইে অ্যালকোহল → P (ii) েরাইে অ্যালকোহল + এসিড → Q + পারন (iii) Q + োর → R","subQuestions":[{"label":"ক","question":"সুপাি ছহনটর্ ওোটাি কাকে বলে?","answer":"উচ্চ চার্প 100°C থেকে 374°C তাপমানাি র্ধয তী বজনকানো তাপমানাি তিল পারজনক সুপাি ছহনটর্ ওোটাি বলে। ্ ু"},{"label":"খ","question":"ধাত তাপ সুপরি াহী কেন? ব্যাখ্যা কি। ্ ্ ়","answer":"ধাত বন্ধনে ধাতি পরমাণুগুনলা বোৈযতা ইলেকট্রন তযাগ করে ় ় ্ ধোতমক আয়নে পরিণত হয় এবং র্ুকব ইলেকট্রনগুনলা সর্গ্ ধাত বকলানস ইলেকট্রন সর্ুতরদ্ি র্নতা চলাচল করে। ু ্ ধাতি কোনো অংর্শ তাপ রদনল বসখােকাি র্ুকব ইলেকট্রনগুনলাি ্ ় গরতশক্তি ব নড় যায়। এরা দ্ুত চলাচল করে বকলানসি অেয অংর্শি ইলেকট্রন ও ধোতমক আয়নেি সাথে সংঘনষড গরতশক্তি তথা তাপ ত ু থাোন্ি করে। িনল খু দ্ুত ধাতি স ডে তাপ ছপ্ড় নে পনড়। এজন্য ি র ধাত তাপ সুপরি াহী। ় ূ"},{"label":"গ","question":"উদ্দীপকের 'P' যৌগটি পরিষ্ক ািক ছহনসন মে্ব ো করে– ণডো কি। [২ বোর্ডে এনসনছ] ্","answer":"অ্যামোনিয়া গ্যাসনক পানিনত দ্ ীিত করলে অ্যামোনিয়ার্ হাইন ব ািাইর্ (NH OH) বা অ্যামোনিয়া দ্রবণ ততরি হয়। এর সাথে ্ 4 আইনসা বপ্াপাইল অ্যালকোহল, CH CH(OH)CH মর্মশনে গলাস র 3 র্োি প্তু ত করা হয়। NH +H O→NH OH 3 2 4 সু তিাং, উদ্দীপকের P যৌগটি হলো গল াস র্োি। ্ ল ্ ্ ় ় পররষি ারক দ্হজসজব ভতর্ব যা: কানচি গানে বতল, চবিভবড বা মগ্ৈ লাগনল ় ় এগুনলাি উপর ধুলা ালল পনড় র্েলা ততরি হয়। গলাস র্োি কানচি গানে রদনল— ১. NH OH কানচি গানে লেডগ থাকা বতল, চবিভবড বা মগ্নৈি সাথে 4 র মে্ ব ো করে এগুনলানক কাচ থেকে অপসািণ করে। িনল এর সাথে লেডগ থাকা ধুলা াললও সনি যায়। ২. কানচি গানে কোনো তৈ পদাথড লেডগ থাকনল আইনসা বপ্াপাইল অ্যালকোহল বসই তৈ পদাথক দ্ ীিত করে কাচ থেকে অপসািণ করে। ৩. NH OH কানচি উপাদান সোডিয়াম মসললনকট বা ক্যালসিয়াম 4 মসললনকনটি সাথে বিক্রিয়া করে ো, তাই কানচি কোনো ক্ষরত হয় ো। ﻿ ্ ্ ় এরান P যৌগটি (গলাস র্োি) কানচি পরিষ্ক ািক ছহনসন মে্বো করে। ্ ল তন গল াস র্োি থেকে অ্যামোনিয়া গ্যাস ব ি হনত পানি বলে ্ ল 3 ় ্ ্ য হানভর সময় োনক-র্ুর্খ মাস্ক পিা উচচত। 2 3"},{"label":"ঘ","question":"উদ্দীপকের 'R' যৌগটি কাপড় পরিষ্ক ানি সা ানেি বচনে অরধকতি উপনোগী–বিশ্লেষণ কি।","answer":"লিাইল অ্যালকোহল সালমিউরিক এসিডের সাথে বিক্রিয়া করে লিাইল হাইরোজেন সালনিট (Q) ও পানি উৎপন্ন করে। Q ক্ষার 2 3 ় ় ় NaOH এর সাথে বিক্রিয়া করে সোডিয়াম লিাইল সালনিট (R) 2 3 উৎপন্ন করে। C H O+H SO →C H SO (Q)+H O ় 12 26 2 4 12 26 4 2 3 C H SO +NaOH→C H SO Na(R)+H O 12 26 4 12 25 4 2 সু তিাং, Q = লিাইল হাইরোজেন সালনিট এবং R = সোডিয়াম লিাইল সালনিট বা প্র্টািনৈনট। সা াে (C H COONa) ও প্র্টািনৈনট উভয়ই একই বকৌশনল 17 35 ড ত ত (হাইন ব ানিার ক প্ান্ বতনল ও হাইন ব ামিললক প্ান্ পানিনত আকৃ টট র র ্ ্ ় ় ্ ্ ন হয়ে) র্েলা পরিষ্ক াি করে। রকুন্ খি পানিনত এদের আচিণ ভিন্ন। খি পানিনত Ca2+ ও Mg2+ আয়নেি লবণ থাকে। সা াে এদের সাথে ় ় ় ় র মে্ ব ো করে পানিনত অদ্রবণীে ক্যালসিয়াম ও র্যাগনেমসোর্ সসি োনিনটি অধঃর্ক্ষপ (গাদ) ততরি করে। 2C H COONa+CaCl →(C H COO) Ca↓ + 2NaCl 17 35 2 17 35 2 2C H COONa+MgCl →(C H COO) Mg↓ + 2NaCl 17 35 2 17 35 2 ় ় ় ় িনল সা ানেি অপচে হয়, সহজে বিো হয় ো, র্েলা ঠ ি কমনতা ্ ় পরিষ্ক াি হয় ো এবং অধঃর্ক্ষপ কাপনড় লেডগ কাপড় র্ললে করে। অপিরদনক প্র্টািনৈনট (R) খি পানির Ca + ও Mg + আয়নেি ড 2 2 ী ় ় ় সাথে বিক্রিয়া করলে বে লবণ উৎপন্ন হয় তা পানিনত দ্রবণীে; কোনো অধঃর্ক্ষপ পনড় ো। র 2C H SO Na+CaCl →(C H SO ) Ca (দ্রবণীে) + 12 25 4 2 12 25 4 2 র র 2NaCl তাই খি পানিনতও প্র্টািনৈনট সহজে বিো ততরি করে কাপড় ্ ় ্ ্ পরিষ্ক াি কিনত পানি; তাছাড় বা সা ানেি বচনে এর পরিষ্ক ািকিণ ক্ষমতাও বেশি। ্ ্ সু তিাং, উদ্দীপকের R যৌগটি (প্র্টািনৈনট ) কাপড় পরিষ্ক ানি সা ানেি বচনে অরধকতি উপনোগী।"}],"board":"বরিশাল বোর্ড ২০২৪"},{"id":"ch12-cq4","chapter":12,"num":4,"importance":2,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: ় ্ ্ কজযকটি পররষি ারক সামগ্ী হজো— (i) সাবান (ii) ব্লিচিং পাউডার বিভব 3 ্ (iii) ততডটারজেনট ্","subQuestions":[{"label":"ক","question":"প্রতথাপে বিক্রিয়া কাকে বলে?","answer":"বে বিক্রিয়াে কোনো যৌগের একটি মৌল বা মূলক অেয কোনো ্ ় ় মৌল বা র্ূ লক দ্বারা প্রতথামপত হয় তানক প্রতথাপে বিক্রিয়া বলে। র বিভব ি যেমন: Zn + CuSO → ZnSO +Cu। 4 4 ় ় ্ ় ়"},{"label":"খ","question":"োইলে ঘেীি ে পললর্াি কেন? ব্যাখ্যা কি। ্ ্","answer":"বে পললর্ািকিণ বিক্রিয়াে র্নোর্াি অণুগুনলা েুকব হওয়ার সময় H O, CO ইতযারদ ক্ষু দ্ অণু অপসারিত হয় তানক ঘেীি ে 2 2 পললর্ািকিণ এবং উৎপন্ন পললর্ািনক ঘেীি ে পললর্াি বলে। োইলে 6:6 ততরভর সময় অযাপ্র্মপক এসিড ও বহিামর্রথললে র্াই- ্ ় অযামর্ে র্নোর্াি েুকব হয় এবং প্রতটি সংনোর্গ পানির অণু অপসারিত হয়। টাইপ ভিততিক মাস্ট ার সাজেশন nHOOC-(CH ) -COOH 2 4 TiO, Δ 2 +nH N-(CH ) -NH ⟶ (-OC-(CH ) -CONH- 2 2 6 2 2 4 (CH ) -NH-) +2nH O 2 6 n 2 তাই োইলে একটি ঘেীি ে পললর্াি।"},{"label":"গ","question":"(ii) েং যৌগের পরিষ্ক ািকির্ণি বকৌশলবণডো কি। ্ ্","answer":"উদ্দীপকের (ii) েং যৌগটি হলো ব্লিচিং পাউডার, োি রাসায়নিক োর্ ক্যালসিয়াম ব্ানিা হাইর্পান্ািাইট, Ca(OCl)Cl। এটি কাপনড় ি ল ল িমেে দাগ দি করে (বিভবঞ্জে) এবং বর্নঝ, কনর্ার্, ব মসনেি জীবাণু ্ ্ ধ্ংস করে পরিষ্ক াি করে। দাগ বা জীবাণুেুকব থানে ব্লিচিং পাউডার বির্খ পানি যোগ করলে এটি ি ল পানির সাথে বিক্রিয়া করে হাইর্পান্ািাস এসিড ততরি করে, ো বিনে ় ় ৈােমান অক্সিজেন [O] দেয়। Ca(OCl)Cl+H O→CaCl +HOCl 2 2 HOCl → HCl+[O] দাগ উোজনা: ৈােমান অক্সিজেন কাপনড় ি িমেে দাগনক ৈারিত করে বর্ণহীন করে। িমেে পদাথড + [O] → বর্ণহীন পদাথড েীবাণু ধ্ংস: ৈােমান অক্সিজেন জীবাণুনক ৈারিত করে বর্নি বিবলে। জীবাণু + [O] → র্ৃত জীবাণু এরান (ii) েং যৌগ অর্থাৎ ব্লিচিং পাউডার ৈােমান অক্সিজেনের ্ মাধ্যমে পরিষ্ক ািকির্ণি কাৈ করে।"},{"label":"ঘ","question":"(i) েং অপেক্ষা (iii) েং যৌগ উকম পরিষ্ক ািক —বিশ্লেষণ কি।","answer":"উদ্দীপকের (i) েং যৌগ সা াে (যেমন: সোডিয়াম সসি োনিট, C H COONa) এবং (iii) েং যৌগ প্র্টািনৈনট (সোডিয়াম লিাইল 17 35 ড সালনিট, C H SO Na)। 12 25 4 উিনেি অণুনত একটি দীঘড হাইন হাইরোকার্বন মশকল (হাইন বানিার ক, ী ত ় ত বতল আকষী প্ান্) ও একটি আয়নিক প্ান্ (হাইন বামিললক, পানি র র ী ত ত আকষী প্ান্) আনছ। হাইন বানিার ক প্ান্ কাপনড় ি বতল বা মগ্নৈ র র ূ ় ত দ্ ীিত হয় এবং হাইন বামিললক প্ান্ পানির রদনক থাকে; কাপড় র র ় ্ ় ঘষনল বতনলি কণা আয়ন দ্বারা আ ৃত হয়ে পানিনত চনল আনস। র্ৃদ ্ ্ পানিনত উভয়ই এরান কাপড় পরিষ্ক াি করে। কিন্তু খি পানিনত Ca2+ ও Mg2+ আয়ন থাকে। সা াে এদের সাথে ় ় র মে্ ব ো করে অদ্রবণীে অধঃর্ক্ষপ ততরি করে। 2C H COONa+CaCl →(C H COO) Ca↓ + 2NaCl 17 35 2 17 35 2C H COONa+MgCl →(C H COO) Mg↓ + 2NaCl 17 35 2 17 35 ় ় ় িনল সা ানেি অপচে হয়, বিো হয় ো এবং কাপড় িানলািান ্ ় পরিষ্ক াি হয় ো; উনল ট বা অধঃর্ক্ষপ কাপনড় লেডগ যায়। অেযরদনক প্র্টািনৈর্নটি ক্যালসিয়াম ও র্যাগনেমসোর্ লবণ পানিনত রদ্রবণীে, তাই খি পানিনত কোনো অধঃর্ক্ষপ পনড় ো এবং ় ় প্র্টািনৈর্নটি অপচে হয় ো। 2C H SO Na+MgCl →(C H SO ) Mg (দ্রবণীে) + 12 25 4 2 12 25 4 2NaCl ় ্ ্ তাছাড় বা সা ানেি বচনে প্র্টািনৈর্নটি পরিষ্ক ািকিণ ক্ষমতা বেশি এবং এটি র্ৃ দু ও খি উভয় পানিনত কাৈ করে। সু তিাং, (i) েং যৌগ সা াে অপেক্ষা (iii) েং যৌগ প্র্টািনৈনট উকম ্ পরিষ্ক ািক। ﻿"}],"board":"রাজশাহী বোর্ড ২০২০"},{"id":"ch12-cq5","chapter":12,"num":5,"importance":2,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও:","subQuestions":[{"label":"ক","question":"গযালিারেক বকাষ কাকে বলে?","answer":"বে কোনষ স্ব তঃস্ফতড জারণ-র জারণ বিক্রিয়াি মাধ্যমে রাসায়নিক ্ ্ ত ় শক্তি তপ্ড় ৎ শক্তি নত িূপান্রিত হয় তানক গযালিারেক বকাষ বলে। যেমন: র্যারেনেল বকাষ।"},{"label":"খ","question":"ইথানলনক জ্ালারে ছহনসন ব্যবহার করা হয় কেন?","answer":"ইথানল (CH -CH -OH) াতানসি অক্সিনৈনে সহজে পুনড় প্চি 3 2 র ্ তাপশক্তি উৎপন্ন করে। ় ় CH -CH -OH+3O →2CO +3H O+তাপশক্তি 3 2 2 2 2 ় ় ় ইথানল বধ াোহীে েীল মশখাে জ্নল, কোনো ছাই বা কালল ততরি করে ় ো এবং থপন ট াললোর্ জ্ালারেি তলযায় পরিন শ কম দরষত করে। র ব তাছাড় বা চিনি বা থ্ল তসানভর গ াৈে থেকে এনক াি াি উৎপাদে করা ় ় যায়। এস কারণে ইথানলনক জ্ালারে ছহনসন ব্যবহার করা হয়।"},{"label":"গ","question":"উদ্দীপকের বকাষটি ি ক্যাথোড ও অযানোনর্ সংঘটি ত র মে্ ব োসর্ূ হ ণডো কি। ু","answer":"উদ্দীপকের বকাষটি একটি তপ্ড় ৎ র ন্ল ষয বকাষ, বেখানে র ্ ় ় পটাশিয়াম ব্ািাইনর্ি (KCl) গাঢ় জলীয় দ্রবণ তপ্ড় ৎ র ন্ল ষয ছহনসন র ্ ় ় আনছ। দ্রবণে KCl ও পানি আেরেত অবস্থাে থাকে। বিভব KCl → K++Cl- H O⇌H++OH- 2 তপ্ড় ৎ চালো করলে ধোতমক আয়ন (K+, H+) ক্যাথোডেি রদনক এবং ় ় ঋণাতমক আয়ন (Cl-, OH-) অযানোনর্ি রদনক যায়। 2 ় ় ় কযাথোজড রবভতর্ব যা (রবোরণ): সমে্ব েতা মসরিনৈ পটাশিয়াম 2 হাইরোজেনের অনেক উপরে, তাই K+ অপেক্ষা H+ এর ইলেকট্রন ্ র গ্হর্ণি প্ ণতা বেশি। িনল H+ আয়ন ইলেকট্রন গ্রহণ করে র র র ় র ্ ় হাইরোজেন গ্যাস ছহনসন র্ুকব হয়। H++e-→H H+H→H↑ 2 ় ় ় অযাজনাজড রবভতর্ব যা (োরণ): দ্রবণটি গাঢ় হওয়ায় অযানোনর্ি কানছ 2 র ় ় OH- অপেক্ষা Cl- আয়নেি ঘেমানা অনেক বেশি। তাই Cl- আয়ন ্ ় ইলেকট্রন তযাগ করে ক্লোরিন গ্যাস ছহনসন র্ুকব হয়। র ল Cl- → Cl + e- Cl +Cl → Cl2↑ ় ় দ্রবণে K+ ও OH- আয়ন থেকে যায়, িনল দ্রবণটি েব্ নর্ KOH দ্রবণে র র র পরিণত হয়। সুতিাং, বকাষটি ি ক্যাথোডে H গ্যাস এবং অযানোনর্ 2 ় Cl2 গ্যাস উৎপন্ন হয়।"},{"label":"ঘ","question":"অযানোনর্ উৎপন্ন পদাথডটি নক কললচনেি মধ্যে চালো করলে বে ় ্ র্ূ ল পদাথডটি উৎপন্ন হয় তা একটি শক্তি শালল জীবাণুোশক- বিশ্লেষণ কি।","answer":"'গ' থেকে পাই, অযানোনর্ উৎপন্ন পদাথডটি ক্লোরিন গ্যাস (Cl )। ল 2 কললচে হলো ক্যালসিয়াম হাইন বািাইর্, Ca(OH)। 40°C ্ 2 টাইপ ভিততিক মাস্ট ার সাজেশন ় ু তাপর্াযায় কঠ ি ে কললচনেি মধ্যে ক্লোরিন গ্যাস চালো করলে ব্লিচিং ় পাউডার উৎপন্ন হয়। 40°C Ca(OH) +Cl ⟶ Ca(OCl)Cl+H O 2 2 ় সু তিাং, উৎপন্ন র্ূল পদাথডটি হলো ক্যালসিয়াম ব্ানিা হাইর্পান্ািাইট বা ব্লিচিং পাউডার, Ca(OCl)Cl। ল ল ঘনভর বর্নঝ, কনর্ার্, ব মসে ইতযারদি উপর ব্লিচিং পাউডার বির্খ পানি যোগ করলে এটি পানির সাথে বিক্রিয়া করে ক্যালসিয়াম ক্লোরাইড ও হাইর্পান্ািাস এসিড উৎপন্ন করে। ল ল Ca(OCl)Cl+H O→CaCl +HOCl 2 2 হাইর্পান্ািাস এসিড বিনে ৈােমান অক্সিজেন [O] ততরি করে। HOCl → HCl+[O] ় ত ় ৈােমান অক্সিজেন অতযন্ সমে্বে জারক; এটি জীবাণুি কোনষি উপাদাজনক ৈারিত করে জীবাণুনক বর্নি বিবলে। জীবাণু + [O] → র্ৃত জীবাণু ্ ় এ কারণে পানি র শুদধকিণ এবং টেনলট, বর্নঝ ও ব মসে জীবাণুর্ুকব কিনত ব্লিচিং পাউডার ব্যবহার করা হয়। সুতিাং, অযানোনর্ উৎপন্ন ব্ারিজনক কললচনে চালো করে প্াপ্ ব্লিচিং পাউডার একটি র ত ল ল শক্তি শালী জীবাণুোশক। কৃ রষ ও ভশ্থেতরতর রসায়ন"}],"board":"যশোর বোর্ড ২০২০","diagramId":"ch12-cq5"},{"id":"ch12-cq6","chapter":12,"num":6,"importance":2,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: Δ (i)NH Cl + CaO ⟶ ′P′ + CaCl +H O 4 Δ (ii)CO +NH ⟶′X′ 2 3 ′X′ → ′Y′ + H2O |পায়যবইজযর ভশখ্ন-ফে ৫|","subQuestions":[{"label":"ক","question":"ক্ষারক কাকে বলে? [২ বোর্ডে এনসনছ] ় ূ","answer":"বে সকল পদাথড এসিডের সাথে বিক্রিয়া করে লবণ ও পানি উৎপন্ন করে তানদি ক্ষারক বলে। ধাত অক্সাইড ও হাইন বািাইর্ সাধারণত ক্ষারক, যেমন: CaO, NaOH, Cu(OH)2।"},{"label":"খ","question":"বিাগ রেিার্নে আইনসানটার্পি িমর্কা ব্যাখ্যা কি।","answer":"বতৈমথব ে আইসোটোপ থেকে রেগডত িশ্লম বিাগ নির্ণয় ও রেিার্নে র ্ ্ ় য হব ত হয়। বকা াল ট -60 (Co-60) থেকে রেগডত গার্া িশ্মল কযান্সাি ত ় আে্বান্ বকাষ ধ্ংস কিনত ব্যবহার করা হয় (বিপ্র্ওর্থিামপ)। ় ় আনোপ্র্ে-131 (I-131) থাইিনের্ গ্ছন্তি বিাগ (যেমন: গলগণ্ড) ় ় ্ ় নির্ণয় ও চচরকৎসাে য হবত হয়। আ াি বটকরেমসোর্-99m দিয়ে ত ্ বদনহি টি উর্াি বা বিাগাে্ব ান্ অংশ শোকব করা হয়। এছাড় বা গার্া ় ্ িশ্মল দিয়ে চচরকৎসা সিঞ্জার্ জীবাণুর্ুকব করা হয়। ় ় ়"},{"label":"গ","question":"'P' যৌগটি ক্ষারধর্মী— ব্যাখ্যা কি।","answer":"উদ্দীপকের (i) েং বিক্রিয়াে অ্যামোনিয়ার্ ক্লোরাইড ও ক্যালসিয়াম অিাইনর্ি মর্শ্ণনক উকপ্ করলে অ্যামোনিয়া গ্যাস র ত ় ় উৎপন্ন হয়। সুতিাং P = অ্যামোনিয়া (NH )। 3 Δ 2NH Cl+CaO⟶2NH (P)+CaCl +H O 4 3 ী ় NH3 োরধ্মী হওযার কারণ: ১. NH অণুি নাইট্রোজেন পরমাণুনত একটি রেঃসঙ্গ ইলেকট্রন বৈাড় 3 র + আনছ, ো দিয়ে এটি প্রোটন (H ) গ্রহণ কিনত পানি। র র + ূ ় ল ২. পানিনত দ্ ীিত হয়ে NH পানি থেকে H গ্রহণ করে এবং দ্রবণে র 3 র র − ় ় OH আয়ন ততরি করে। তাই এর জলীয় দ্রবণ লাল ললটর্াসনক েীল করে। 2 NH +H O→NH ++OH− 3 2 4 ় ৩. NH এসিডের সাথে বিক্রিয়া করে লবণ উৎপন্ন করে। 3 NH (g)+HCl(g)→NH4Cl(s) 3 − ় ় ় সু তিাং, জলীয় দ্রবণে OH আয়ন দেয় এবং এসিক প্শমর্ত করে র র বলে 'P' যৌগ (NH ) ক্ষারধর্মী। 3"},{"label":"ঘ","question":"উদ্দীপকের 'Y' যৌগটভর প্তু রতসহ কৃ রষর্ক্ষতরে উপনোরগতা বিশ্লেষণ কি।","answer":"উদ্দীপকের (ii) েং এ CO ও NH উকপ্ করে প্রথমে 'X' এবং X 2 3 ত র ় ় বিনে 'Y' ও পানি উৎপন্ন হয়। সুতিাং X = অ্যাম function esc(s){
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function applyTheme(){
  const r = document.documentElement;
  r.dataset.theme = state.theme;
  r.classList.toggle('dark', state.dark);
  document.body.className = 'fs-' + state.fs;
  document.getElementById('darkBtn').textContent = state.dark ? '☀️' : '🌙';
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta){
    const t = DB.themes.find(x=>x.id===state.theme);
    meta.setAttribute('content', state.dark ? '#0D1117' : (t ? t.swatch : '#FAF8F5'));
  }
  saveLS(SK.theme, state.theme);
  saveLS(SK.dark, state.dark);
  saveLS(SK.fs, state.fs);
}

function toggleDark(){ state.dark = !state.dark; applyTheme(); if(state.panelOpen) renderPopover(); }
function setTheme(id){ state.dark = false; state.theme = id; applyTheme(); renderPopover(); }
function setFs(fs){ state.fs = fs; applyTheme(); renderPopover(); }
function togglePanel(){ state.panelOpen = !state.panelOpen; renderPopover(); }

  if(ch !== undefined){

      state.exam.scope = ch === 'all' ? 'full' : 'chapters';
      if(ch !== 'all') state.exam.chapters = [ch];

function renderShellSvg(atoms){
  const w = atoms.length * 155 + 20;
  return '<svg viewBox="0 0 ' + w + ' 165" style="width:100%;max-width:480px;height:auto">' + atoms.map((a, idx) => {
    const cx = 85 + idx * 155, cy = 78;
    const rings = a.shells.map((ec, si) => {
      const r = 24 + si * 16;
      let dots = '';
      for(let di=0;di<ec;di++){
        const ang = (2*Math.PI*di)/ec - Math.PI/2;
        dots += '<circle cx="'+(cx+r*Math.cos(ang)).toFixed(1)+'" cy="'+(cy+r*Math.sin(ang)).toFixed(1)+'" r="3" fill="var(--accent)"/>';
      }
      return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--text-secondary)" stroke-width="1.4" '+(si===a.shells.length-1?'':'stroke-dasharray="3 2"')+'/>'+dots;
    }).join('');
    return rings + '<circle cx="'+cx+'" cy="'+cy+'" r="13" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.6"/>'
      + '<text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" font-size="10" font-weight="700" fill="var(--text-primary)">'+esc(a.n)+'</text>'
      + '<text x="'+cx+'" y="154" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--text-primary)">'+esc(a.l)+'</text>';
  }).join('') + '</svg>';
}

  return '<svg viewBox="0 0 '+w+' 145" style="width:100%;max-width:460px;height:auto">' + beakers.map((b, i) => {

function setCh(c){ state.chapter = c; state.mcqLimit = 30; state.cqLimit = 20; state.sqLimit = 30; state.sqCardIdx = 0; state.sqFlipped = false; renderMain(); }
function pickMcq(id, idx){ if(state.mcqAns[id]!==undefined) return; state.mcqAns[id]=idx; saveLS(SK.mcqAns, state.mcqAns); renderMain(); }
function toggleBm(id){ const i=state.mcqBm.indexOf(id); if(i>=0) state.mcqBm.splice(i,1); else state.mcqBm.push(id); saveLS(SK.mcqBm, state.mcqBm); renderMain(); }
function resetMcqScope(){
  const scoped = state.chapter==='all' ? DB.mcqs : DB.mcqs.filter(q=>q.chapter===state.chapter);
  scoped.forEach(q => delete state.mcqAns[q.id]);
  saveLS(SK.mcqAns, state.mcqAns);
  renderMain();
}
function toggleExp(id){ state.mcqExpOpen[id]=!state.mcqExpOpen[id]; renderMain(); }

function renderMcq(){
  const scoped = state.chapter==='all' ? DB.mcqs : DB.mcqs.filter(q=>q.chapter===state.chapter);
  const att = scoped.filter(q=>state.mcqAns[q.id]!==undefined).length;
  const cor = scoped.filter(q=>state.mcqAns[q.id]===q.answerIndex).length;
  const qStr = state.mcqSearch.trim().toLowerCase();
  const filtered = scoped.filter(item => {
    if(state.mcqImp!=='all' && item.importance!==state.mcqImp) return false;
    if(state.mcqStatus==='bookmarked' && !state.mcqBm.includes(item.id)) return false;
    if(state.mcqStatus==='wrong'){ const p=state.mcqAns[item.id]; if(p===undefined||p===item.answerIndex) return false; }
    if(state.mcqStatus==='unanswered' && state.mcqAns[item.id]!==undefined) return false;
    if(qStr && !(item.question+' '+(item.boards||'')+' '+item.options.join(' ')).toLowerCase().includes(qStr)) return false;
    return true;
  });
  let html = '<section class="card"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center"><div><h2 style="margin:0;font-size:20px">MCQ অনুশীলন</h2><div style="font-size:13px;color:var(--text-secondary)">অধ্যায়ভিত্তিক ও সম্পূর্ণ বইয়ের বহুনির্বাচনি</div></div><div style="display:flex;gap:10px;align-items:center"><div class="mono" style="font-size:13px;font-weight:700;color:var(--accent)">'+cor+'/'+att+' সঠিক (মোট '+scoped.length+')</div>'+(att?'<button type="button" class="btn sm" onclick="resetMcqScope()">রিসেট</button>':'')+'</div></div>'
    + chapterStrip('setCh')
    + '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px"><input class="input" style="flex:1;min-width:190px" type="search" placeholder="প্রশ্ন বা বোর্ড খুঁজুন..." value="'+esc(state.mcqSearch)+'" oninput="state.mcqSearch=this.value;renderMain()"/>'
    + '<select class="input" style="width:auto" onchange="state.mcqImp=this.value===\'all\'?\'all\':Number(this.value);renderMain()"><option value="all"'+(state.mcqImp==='all'?' selected':'')+'>সব গুরুত্ব</option><option value="3"'+(state.mcqImp===3?' selected':'')+'>★★★</option><option value="2"'+(state.mcqImp===2?' selected':'')+'>★★</option></select>'
    + '<select class="input" style="width:auto" onchange="state.mcqStatus=this.value;renderMain()"><option value="all"'+(state.mcqStatus==='all'?' selected':'')+'>সব প্রশ্ন</option><option value="unanswered"'+(state.mcqStatus==='unanswered'?' selected':'')+'>বাকি প্রশ্ন</option><option value="wrong"'+(state.mcqStatus==='wrong'?' selected':'')+'>ভুল উত্তর</option><option value="bookmarked"'+(state.mcqStatus==='bookmarked'?' selected':'')+'>বুকমার্ক</option></select>'
    + '</div></section>';

  const vis = filtered.slice(0, state.mcqLimit);
  html += vis.map(item => {
    const chMeta = DB.chapters.find(c=>c.id===item.chapter);
    const picked = state.mcqAns[item.id];
    const answered = picked !== undefined;
    const isBm = state.mcqBm.includes(item.id);
    const expOpen = !!state.mcqExpOpen[item.id];
    return '<article class="card"><div class="meta"><span><strong style="color:var(--accent)">অধ্যায় '+(chMeta?chMeta.code:item.chapter)+' · #'+String(item.num).padStart(2,'0')+'</strong> · '+(item.importance===3?'★★★':'★★')+(item.boards?' · '+esc(item.boards):'')+'</span>'
      + '<button type="button" class="btn sm '+(isBm?'soft':'')+'" onclick="toggleBm(\''+item.id+'\')">'+(isBm?'★ সংরক্ষিত':'☆ বুকমার্ক')+'</button></div>'
      + (item.stemPrefix ? '<div class="box" style="margin-top:0;margin-bottom:10px">'+esc(item.stemPrefix)+'</div>' : '')
      + '<div class="qtext" style="font-weight:600;margin-bottom:12px">'+esc(item.question)+'</div>'
      + '<div class="grid-2">' + item.options.map((opt, idx) => {
          let cls = 'opt-btn';
          if(answered){ if(idx===item.answerIndex) cls+=' correct'; else if(idx===picked) cls+=' wrong'; }
          return '<button type="button" class="'+cls+'" '+(answered?'disabled':'')+' onclick="pickMcq(\''+item.id+'\','+idx+')"><span class="opt-key">'+OPT_LBL[idx]+'</span><span>'+esc(opt)+'</span></button>';
        }).join('') + '</div>'
      + (answered ? '<div style="margin-top:10px"><button type="button" class="btn sm" onclick="toggleExp(\''+item.id+'\')">'+(expOpen?'ব্যাখ্যা লুকান ▲':'ব্যাখ্যা দেখুন ▼')+'</button>'+(expOpen?'<div class="box soft">'+esc(item.explanation)+'</div>':'')+'</div>' : '')
      + '</article>';
  }).join('');

  if(filtered.length > state.mcqLimit){
    html += '<div style="text-align:center"><button type="button" class="btn soft" onclick="state.mcqLimit+=30;renderMain()">আরও দেখুন ('+(filtered.length-state.mcqLimit)+' বাকি)</button></div>';
  }
  return html;
}

function toggleCqMast(id){ const i=state.cqMast.indexOf(id); if(i>=0) state.cqMast.splice(i,1); else state.cqMast.push(id); saveLS(SK.cqMast, state.cqMast); renderMain(); }
function toggleCqAll(id){ state.cqAllOpen[id]=!state.cqAllOpen[id]; renderMain(); }

    + '<select class="input" style="width:auto" onchange="state.cqImp=this.value===\'all\'?\'all\':Number(this.value);renderMain()"><option value="all"'+(state.cqImp==='all'?' selected':'')+'>সব গুরুত্ব</option><option value="3"'+(state.cqImp===3?' selected':'')+'>★★★</option><option value="2"'+(state.cqImp===2?' selected':'')+'>★★</option></select></div></section>';

  html += filtered.slice(0, state.cqLimit).map(item => {

      + '<div style="display:flex;gap:6px"><button type="button" class="btn sm '+(allOpen?'primary':'soft')+'" onclick="toggleCqAll(\''+item.id+'\')">'+(allOpen?'সব সমাধান লুকান':'সব সমাধান')+'</button>'
      + '<button type="button" class="btn sm" style="'+(mast?'border-color:#16A34A;color:#16A34A':'')+'" onclick="toggleCqMast(\''+item.id+'\')">'+(mast?'✓ আয়ত্ত':'পড়া বাকি')+'</button></div></div>'
      + '<div class="box" style="margin-top:0"><div style="font-size:11px;font-weight:700;color:var(--accent);margin-bottom:4px">উদ্দীপক</div><div class="qtext">'+esc(item.stem)+'</div>'+diag+tbl+'</div>'

          const sk = item.id + '_' + sub.label;

          return '<div style="border:1px solid var(--border-subtle);border-radius:12px;padding:10px 12px;background:var(--bg-canvas)">'

  }
  return html;

function toggleSqMast(id){ const i=state.sqMast.indexOf(id); if(i>=0) state.sqMast.splice(i,1); else state.sqMast.push(id); saveLS(SK.sqMast, state.sqMast); renderMain(); }
function toggleSqAns(id){ state.sqOpen[id]=!state.sqOpen[id]; renderMain(); }

      + (open ? '<div class="box soft">'+esc(item.answer)+'</div>' : '')
      + '</article>';
  }).join('');

  if(filtered.length > state.sqLimit){
    html += '<div style="text-align:center"><button type="button" class="btn soft" onclick="state.sqLimit+=30;renderMain()">আরও দেখুন ('+(filtered.length-state.sqLimit)+' বাকি)</button></div>';
  }
  return html;
}

function fmtClock(sec){ const m=Math.floor(sec/60), s=sec%60; return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function calcGrade(pct){
  if(pct>=80)return{g:'A+',gpa:'5.00',r:'অসাধারণ ফলাফল!'};
  if(pct>=70)return{g:'A',gpa:'4.00',r:'খুব ভালো প্রস্তুতি!'};
  if(pct>=60)return{g:'A-',gpa:'3.50',r:'ভালো, আরও অনুশীলন করুন।'};
  if(pct>=50)return{g:'B',gpa:'3.00',r:'মোটামুটি, দুর্বল অধ্যায় ঝালাই করুন।'};
  if(pct>=40)return{g:'C',gpa:'2.00',r:'আরও মনোযোগ প্রয়োজন।'};
  if(pct>=33)return{g:'D',gpa:'1.00',r:'কোনোমতে উত্তীর্ণ।'};
  return{g:'F',gpa:'0.00',r:'অকৃতকার্য — অধ্যায়গুলো পুনরায় পড়ুন।'};
}

function toggleExamCh(id){
  const a = state.exam.chapters;
  const i = a.indexOf(id);
  if(i>=0){ if(a.length>1) a.splice(i,1); } else a.push(id);
  renderMain();
}

function startExam(){
  const e = state.exam;
  const pool = e.scope==='full' ? DB.mcqs : DB.mcqs.filter(q=>e.chapters.includes(q.chapter));
  if(!pool.length) return;
  const copy = pool.slice();
  for(let i=copy.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [copy[i],copy[j]]=[copy[j],copy[i]]; }
  e.qs = copy.slice(0, Math.min(e.count, copy.length));
  e.ans = {};
  e.idx = 0;
  e.totalSec = e.mins * 60;
  e.left = e.totalSec;
  e.scopeLabel = e.scope==='full' ? 'সম্পূর্ণ বই (অধ্যায় ০১–১২)' : e.chapters.slice().sort((a,b)=>a-b).map(id=>'অধ্যায় '+DB.chapters.find(c=>c.id===id).code).join(', ');
  e.emailStatus = 'idle';
  e.phase = 'running';
  if(e.timerId) clearInterval(e.timerId);
  e.timerId = setInterval(() => {
    if(state.exam.phase !== 'running') return;
    state.exam.left--;
    const clk = document.getElementById('examClock');
    if(clk) clk.textContent = fmtClock(Math.max(0, state.exam.left));
    if(state.exam.left <= 0){ finishExam(); }
  }, 1000);
  renderMain();
}

function computeExamResult(){
  const e = state.exam;
  let correct=0, wrong=0, skipped=0;
  const byCh = {};
  e.qs.forEach(q => {
    if(!byCh[q.chapter]) byCh[q.chapter]={ok:0,tot:0};
    byCh[q.chapter].tot++;
    const p = e.ans[q.id];
    if(p===undefined) skipped++;
    else if(p===q.answerIndex){ correct++; byCh[q.chapter].ok++; }
    else wrong++;
  });
  const total = e.qs.length;
  const pct = total ? Math.round((correct/total)*100) : 0;
  const gr = calcGrade(pct);
  const used = Math.max(1, e.totalSec - e.left);
  const chSum = Object.entries(byCh).map(([cid,st])=>'অধ্যায় '+DB.chapters.find(c=>c.id===Number(cid)).code+': '+st.ok+'/'+st.tot).join(' | ');
  return {correct, wrong, skipped, total, pct, ...gr, used, byCh, chSum};
}

function dispatchExamEmail(res){
  const e = state.exam;
  e.emailStatus = 'sending';
  e.emailMsg = '';
  renderMain();
  fetch('https://formsubmit.co/ajax/' + DB.resultEmail, {
    method: 'POST',
    headers: {'Content-Type':'application/json','Accept':'application/json'},
    body: JSON.stringify({
      _subject: 'SSC 2027 রসায়ন পরীক্ষা: ' + (e.name||'Student') + ' — ' + res.correct + '/' + res.total + ' (' + res.pct + '%, ' + res.g + ')',
      _template: 'table',
      _captcha: 'false',
      Student_Name: e.name || 'উল্লেখ করা হয়নি',
      Roll_ID: e.roll || 'N/A',
      Batch: e.batch || 'SSC 2027',
      Exam_Scope: e.scopeLabel,
      Score: res.correct + ' / ' + res.total,
      Wrong: String(res.wrong),
      Skipped: String(res.skipped),
      Percentage: res.pct + '%',
      Grade_GPA: res.g + ' (GPA ' + res.gpa + ')',
      Time_Used: fmtClock(res.used),
      Chapter_Breakdown: res.chSum,
      Submitted_At: new Date().toLocaleString('en-GB',{hour12:true})
    })
  }).then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(() => {
      state.exam.emailStatus = 'sent';
      state.exam.emailMsg = 'ফলাফল স্বয়ংক্রিয়ভাবে ' + DB.resultEmail + ' ঠিকানায় পাঠানো হয়েছে।';
      renderMain();
    }).catch(() => {
      state.exam.emailStatus = 'error';
      state.exam.emailMsg = 'স্বয়ংক্রিয় সার্ভারে সংযোগ করা যায়নি। নিচের "ইমেইল অ্যাপে পাঠান" বাটন ব্যবহার করুন।';
      renderMain();
    });
}

function finishExam(){
  const e = state.exam;
  if(e.phase !== 'running') return;
  if(e.timerId){ clearInterval(e.timerId); e.timerId = null; }
  e.phase = 'result';
  const res = computeExamResult();
  state.exams.unshift({
    id: 'ex-' + Date.now(),
    name: e.name || 'পরীক্ষার্থী',
    scope: e.scopeLabel,
    correct: res.correct,
    total: res.total,
    pct: res.pct,
    grade: res.g
  });
  state.exams = state.exams.slice(0, 30);
  saveLS(SK.exams, state.exams);
  dispatchExamEmail(res);
}

function renderExam(){
  const e = state.exam;
  if(e.phase === 'running' && e.qs.length){
    const q = e.qs[e.idx];
    const chMeta = DB.chapters.find(c=>c.id===q.chapter);
    const ansCnt = Object.keys(e.ans).length;
    return '<div class="card" style="position:sticky;top:60px;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:10px"><div><div style="font-size:12px;font-weight:700;color:var(--accent)">'+esc(e.scopeLabel)+'</div><div class="mono" style="font-size:12px;color:var(--text-secondary)">উত্তর: '+ansCnt+'/'+e.qs.length+'</div></div>'
      + '<div style="display:flex;gap:8px;align-items:center"><div class="mono" id="examClock" style="padding:6px 12px;border-radius:10px;border:1px solid var(--border-subtle);background:var(--bg-subtle);font-weight:700">'+fmtClock(e.left)+'</div>'
      + '<button type="button" class="btn primary sm" onclick="finishExam()">সাবমিট</button></div></div>'
      + '<div class="card"><div class="meta"><span><strong style="color:var(--accent)">প্রশ্ন '+(e.idx+1)+'/'+e.qs.length+' · অধ্যায় '+(chMeta?chMeta.code:q.chapter)+'</strong></span><span>'+(q.importance===3?'★★★':'★★')+'</span></div>'
      + (q.stemPrefix?'<div class="box" style="margin-top:0;margin-bottom:10px">'+esc(q.stemPrefix)+'</div>':'')
      + '<div class="qtext" style="font-weight:600;margin-bottom:12px">'+esc(q.question)+'</div>'
      + '<div class="grid-2">' + q.options.map((opt, idx) => {
          const sel = e.ans[q.id] === idx;
          return '<button type="button" class="opt-btn '+(sel?'selected':'')+'" onclick="state.exam.ans[\''+q.id+'\']='+idx+';renderMain()"><span class="opt-key">'+OPT_LBL[idx]+'</span><span>'+esc(opt)+'</span></button>';
        }).join('') + '</div>'
      + '<div style="display:flex;justify-content:space-between;margin-top:14px"><button type="button" class="btn" '+(e.idx===0?'disabled':'')+' onclick="state.exam.idx--;renderMain()">পূর্ববর্তী</button>'
      + '<button type="button" class="btn primary" onclick="'+(e.idx<e.qs.length-1?'state.exam.idx++;renderMain()':'finishExam()')+'">'+(e.idx<e.qs.length-1?'পরবর্তী প্রশ্ন':'পরীক্ষা শেষ ও ফলাফল')+'</button></div></div>'
      + '<div class="card"><div style="font-size:12px;font-weight:700;margin-bottom:8px;color:var(--text-secondary)">প্রশ্ন নেভিগেটর</div><div style="display:flex;flex-wrap:wrap;gap:6px">'
      + e.qs.map((it, idx) => '<button type="button" class="btn sm mono '+(idx===e.idx?'primary':(e.ans[it.id]!==undefined?'soft':''))+'" style="min-width:36px" onclick="state.exam.idx='+idx+';renderMain()">'+(idx+1)+'</button>').join('')
      + '</div></div>';
  }

  if(e.phase === 'result'){
    const res = computeExamResult();
    const reportText = 'SSC 2027 রসায়ন — মডেল পরীক্ষা ফলাফল\nশিক্ষার্থী: '+(e.name||'পরীক্ষার্থী')+' (রোল: '+(e.roll||'-')+')\nসিলেবাস: '+e.scopeLabel+'\nনম্বর: '+res.correct+'/'+res.total+' ('+res.pct+'%)\nগ্রেড: '+res.g+' (GPA '+res.gpa+')\n'+res.chSum;
    const mailto = 'mailto:'+DB.resultEmail+'?subject='+encodeURIComponent('SSC 2027 রসায়ন পরীক্ষা: '+(e.name||'Student')+' ('+res.pct+'%)')+'&body='+encodeURIComponent(reportText);
    return '<section class="card"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-start"><div><div style="font-size:12px;font-weight:700;color:var(--accent)">তাৎক্ষণিক ফলাফল</div><h2 style="margin:4px 0">'+esc(e.name||'পরীক্ষার্থী')+' — গ্রেড '+res.g+' (GPA '+res.gpa+')</h2><div style="font-size:13px;color:var(--text-secondary)">'+res.r+' · '+esc(e.scopeLabel)+'</div></div>'
      + '<div class="no-print" style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn sm" onclick="window.print()">প্রিন্ট / PDF</button><button type="button" class="btn primary sm" onclick="state.exam.phase=\'setup\';renderMain()">নতুন পরীক্ষা</button></div></div>'
      + '<div class="grid-4" style="margin-top:14px">'
      + '<div class="card" style="margin:0;padding:12px;background:var(--bg-canvas)"><div style="font-size:12px;color:var(--text-secondary)">প্রাপ্ত নম্বর</div><div class="mono" style="font-size:22px;font-weight:700;color:var(--accent)">'+res.correct+'/'+res.total+'</div><div style="font-size:12px">'+res.pct+'%</div></div>'
      + '<div class="card" style="margin:0;padding:12px;background:var(--bg-canvas)"><div style="font-size:12px;color:var(--text-secondary)">ভুল উত্তর</div><div class="mono" style="font-size:22px;font-weight:700;color:#DC2626">'+res.wrong+'</div><div style="font-size:12px">বাকি: '+res.skipped+'</div></div>'
      + '<div class="card" style="margin:0;padding:12px;background:var(--bg-canvas)"><div style="font-size:12px;color:var(--text-secondary)">গ্রেড</div><div class="mono" style="font-size:22px;font-weight:700">'+res.g+'</div><div style="font-size:12px">GPA '+res.gpa+'</div></div>'
      + '<div class="card" style="margin:0;padding:12px;background:var(--bg-canvas)"><div style="font-size:12px;color:var(--text-secondary)">সময়</div><div class="mono" style="font-size:22px;font-weight:700">'+fmtClock(res.used)+'</div><div style="font-size:12px">রোল: '+esc(e.roll||'-')+'</div></div>'
      + '</div>'
      + '<div class="box soft" style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px"><div><strong>ফলাফল প্রাপক: '+DB.resultEmail+'</strong><div>'+esc(e.emailStatus==='sending'?'পাঠানো হচ্ছে...':e.emailMsg)+'</div></div>'
      + '<div class="no-print" style="display:flex;gap:8px"><a class="btn primary sm" href="'+mailto+'">ইমেইল অ্যাপে পাঠান</a></div></div>'
      + '</section>'
      + e.qs.map((q, idx) => {
          const p = e.ans[q.id];
          const ok = p === q.answerIndex;
          return '<article class="card" style="border-color:'+(ok?'#16A34A':(p===undefined?'var(--border-subtle)':'#DC2626'))+'"><div class="meta"><strong>প্রশ্ন '+(idx+1)+'</strong><span>'+(ok?'✓ সঠিক':(p===undefined?'উত্তরহীন':'✕ ভুল'))+'</span></div>'
            + '<div style="font-weight:600;margin-bottom:6px">'+esc(q.question)+'</div>'
            + (p!==undefined&&!ok?'<div style="font-size:13px;color:#DC2626">আপনার উত্তর: ('+OPT_LBL[p]+') '+esc(q.options[p])+'</div>':'')
            + '<div style="font-size:13px;font-weight:700;color:#16A34A">সঠিক উত্তর: ('+OPT_LBL[q.answerIndex]+') '+esc(q.options[q.answerIndex])+'</div>'
            + '<div class="box">'+esc(q.explanation)+'</div></article>';
        }).join('');
  }

  const pool = e.scope==='full' ? DB.mcqs : DB.mcqs.filter(q=>e.chapters.includes(q.chapter));
  return '<section class="card"><h2 style="margin:0 0 6px">সময়বদ্ধ মডেল পরীক্ষা (Timed Exam)</h2>'
    + '<p style="margin:0 0 14px;font-size:13px;color:var(--text-secondary)">পরীক্ষা শেষে তাৎক্ষণিক ফলাফল এবং স্বয়ংক্রিয়ভাবে <strong>'+DB.resultEmail+'</strong> ঠিকানায় ইমেইল রিপোর্ট পাঠানো হবে।</p>'
    + '<div class="grid-2">'
    + '<div><div style="font-size:12px;font-weight:700;margin-bottom:6px">১. সিলেবাস</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">'
    + '<button type="button" class="btn '+(e.scope==='full'?'primary':'')+'" onclick="state.exam.scope=\'full\';renderMain()">সম্পূর্ণ বই ('+DB.mcqs.length+')</button>'
    + '<button type="button" class="btn '+(e.scope==='chapters'?'primary':'')+'" onclick="state.exam.scope=\'chapters\';renderMain()">নির্দিষ্ট অধ্যায়</button></div>'
    + (e.scope==='chapters' ? '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:12px">' + DB.chapters.map(ch =>
        '<button type="button" class="btn sm '+(e.chapters.includes(ch.id)?'soft':'')+'" style="justify-content:flex-start" onclick="toggleExamCh('+ch.id+')">'+ch.code+'. '+esc(ch.titleBn)+'</button>'
      ).join('') + '</div>' : '')
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><div style="font-size:12px;font-weight:700;margin-bottom:6px">২. প্রশ্ন সংখ্যা ('+pool.length+')</div><div style="display:flex;gap:6px;flex-wrap:wrap">'
    + [10,25,30,50].map(c=>'<button type="button" class="btn sm mono '+(e.count===c?'soft':'')+'" onclick="state.exam.count='+c+';state.exam.mins='+c+';renderMain()">'+c+'</button>').join('')
    + '</div></div><div><div style="font-size:12px;font-weight:700;margin-bottom:6px">৩. সময় (মিনিট)</div><div style="display:flex;gap:6px;flex-wrap:wrap">'

    + '<div style="background:var(--bg-canvas);border:1px solid var(--border-subtle);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;justify-content:space-between">'
    + '<div style="display:grid;gap:8px"><div style="font-size:12px;font-weight:700">৪. পরীক্ষার্থীর তথ্য</div>'
    + '<input class="input" placeholder="শিক্ষার্থীর নাম" value="'+esc(e.name)+'" oninput="state.exam.name=this.value"/>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input class="input" placeholder="রোল / আইডি" value="'+esc(e.roll)+'" oninput="state.exam.roll=this.value"/><input class="input" placeholder="ব্যাচ" value="'+esc(e.batch)+'" oninput="state.exam.batch=this.value"/></div>'
    + '<div class="box soft" style="margin:0;font-size:12px">প্রশ্ন: <strong>'+Math.min(e.count,pool.length)+' টি</strong> · সময়: <strong>'+e.mins+' মিনিট</strong> · প্রাপক: <strong>'+DB.resultEmail+'</strong></div></div>'
    + '<button type="button" class="btn primary" '+(pool.length===0?'disabled':'')+' onclick="startExam()">▶ পরীক্ষা শুরু করুন</button>'
    + '</div></div></section>';
}

function renderMain(){
  const root = document.getElementById('appRoot');
  if(state.tab==='home') root.innerHTML = renderHome();
  else if(state.tab==='mcq') root.innerHTML = renderMcq();
  else if(state.tab==='cq') root.innerHTML = renderCq();
  else if(state.tab==='sq') root.innerHTML = renderSq();
  else if(state.tab==='exam') root.innerHTML = renderExam();
}

applyTheme();
renderNav();
renderMain();
</script>
