মাণবিক ভরের যোগফলের অর্ধেক বা তার কাছাকাছি হয়— একে ডোবেরাইনারের ত্রয়ী সূত্র বলে।\nযেমন: Li (7), Na (23), K (39) এর ক্ষেত্রে (7+39)/2=23=Na এর পারমাণবিক ভর।"},{"id":"ch4-sq2","chapter":4,"num":2,"importance":3,"topic":"ইলেকট্রন বিন্যাসই পর্যায় সারণির মূল ভিত্তি","question":"ভর সংখ্যা পর্যায় সারণির মূল ভিত্তি নয়—ব্যাখ্যা কর।","boards":"ময়মনসিংহ বোর্ড ২০২৬","answer":"মৌলের রাসায়নিক ধর্ম নির্ভর করে তার ইলেকট্রন বিন্যাস তথা পারমাণবিক সংখ্যার ওপর, ভর সংখ্যার ওপর নয়। একই মৌলের আইসোটোপসমূহের (যেমন: ¹²C ও ¹⁴C) ভর সংখ্যা ভিন্ন হলেও তাদের ইলেকট্রন বিন্যাস ও রাসায়নিক ধর্ম একই। ভর সংখ্যা ভিত্তি হলে এদের ভিন্ন ভিন্ন ঘরে বসাতে হতো। আবার ভর সংখ্যা অনুসারে সাজালে আর্গন (Ar, 40) কে পটাসিয়ামের (K, 39) পরে বসাতে হয়, যা তাদের ধর্মের সাথে সামঞ্জস্যপূর্ণ নয়। তাই আধুনিক পর্যায় সারণির মূল ভিত্তি হলো পারমাণবিক সংখ্যা ও ইলেকট্রন বিন্যাস; ভর সংখ্যা পর্যায় সারণির মূল ভিত্তি নয়।"},{"id":"ch4-sq3","chapter":4,"num":3,"importance":2,"topic":"ইলেকট্রন বিন্যাসই পর্যায় সারণির মূল ভিত্তি","question":"ইলেকট্রন বিন্যাসই পর্যায় সারণীর মূল ভিত্তি-ব্যাখ্যা কর।","boards":"যশোর বোর্ড ২০২৪","answer":"ইলেকট্রন বিন্যাস থেকে কোনো মৌল কত নম্বর পর্যায় ও গ্রুপে আছে তা নির্ণয় করা যায়। সর্বশেষ শক্তিস্তরের নম্বর পর্যায় নির্দেশ করে, আর বাইরের স্তরের বিন্যাস গ্রুপ নির্দেশ করে। যেমন- Li (1s² 2s¹), Na (1s² 2s² 2p⁶ 3s¹) ও K (...3p⁶ 4s¹) এর বাইরের বিন্যাস ns¹ বলে সবাই গ্রুপ-1 এ, কিন্তু সর্বশেষ স্তর 2, 3, 4 বলে ভিন্ন পর্যায়ে । তাছাড়া বাইরের স্তরে 1টি ইলেকট্রন থাকলে মৌল + আয়ন (Na⁺) এবং 7টি থাকলে - আয়ন (Cl⁻) গঠন করে — এভাবে ধর্মও ব্যাখ্যা করা যায়। তাই ইলেকট্রন বিন্যাসই পর্যায় সারণির মূল ভিত্তি ।"},{"id":"ch4-sq4","chapter":4,"num":4,"importance":3,"topic":"পর্যায় সারণির কিছু ব্যতিক্রম","question":"He কে গ্রুপ-II এ রাখা হয় না কেন?","boards":"দিনাজপুর বোর্ড ২০২৪; চট্টগ্রাম বোর্ড ২০২০","answer":"He(2)→1s² হওয়ায় বিন্যাস অনুসারে গ্রুপ-2 এ যাওয়ার\nকথা, তবুও রাখা হয় না, কারণ —\n১. গ্রুপ-2 এর মৌলসমূহ তীব্র তড়িৎ ধনাত্মক ও রাসায়নিকভাবে সক্রিয়, কিন্তু He নিষ্ক্রিয় ।\n২. গ্রুপ-2 এর মৌলের সর্বশেষ শক্তিস্তরে ns2 থাকলেও স্তরটি অপূর্ণ (Mg: 1s² 2s² 2p⁶ 3s² 3p0), কিন্তু He এর একমাত্র শক্তিস্তর 1s² দ্বারা পূর্ণ। তাই He কে গ্রুপ-2 এ না রেখে নিষ্ক্রিয় গ্যাসের সাথে গ্রুপ-18 এ রাখা হয়েছে ।"},{"id":"ch4-sq5","chapter":4,"num":5,"importance":3,"topic":"পর্যায় সারণির কিছু ব্যতিক্রম","question":"He কে গ্রুপ 18 এ রাখা হয় কেন? ব্যাখ্যা কর।","boards":"রাজশাহী বোর্ড ২০২২; যশোর বোর্ড ২০২২","answer":"পর্যায় সারণিতে He গ্রুপ-18 এ অবস্থিত । He(2)→1s²;\nইলেকট্রন বিন্যাস অনুসারে একে গ্রুপ-2 এ রাখা উচিত ছিল। কিন্তু গ্রুপ-2 এর মৌলগুলো তীব্র তড়িৎ ধনাত্মক মৃৎক্ষার ধাতু, আর He একটি নিষ্ক্রিয় গ্যাস যার একমাত্র শক্তিস্তর পূর্ণ। এর ধর্ম নিয়ন, আর্গন, ক্রিপ্টন, জেনন, রেডনের সাথে মিলে যায়। তাই He কে নিষ্ক্রিয় গ্যাসের সাথে গ্রুপ-18 এ রাখা হয়েছে ।"},{"id":"ch4-sq6","chapter":4,"num":6,"importance":3,"topic":"পর্যায় সারণির কিছু ব্যতিক্রম","question":"হাইড্রোজেনকে পর্যায় সারণিতে ক্ষার ধাতুর সাথে স্থান দেওয়া হয় কেন? ব্যাখ্যা কর।","boards":"চট্টগ্রাম বোর্ড ২০২৬","answer":"হাইড্রোজেনের ইলেকট্রন বিন্যাস 1s¹; ক্ষার ধাতুগুলোর (Li, Na, K …) মতো এর সর্ববহিঃস্থ স্তরেও 1টি ইলেকট্রন থাকে এবং যোজনী 1। ক্ষার ধাতুর মতো হাইড্রোজেনও 1টি ইলেকট্রন ত্যাগ করে ধনাত্মক আয়ন (H⁺) গঠন করে এবং বিজারক হিসেবে কাজ করে।\nH→H⁺+e⁻ ; Na→Na⁺+e⁻\nইলেকট্রন বিন্যাস ও ধর্মে এই মিলের কারণে হাইড্রোজেনকে পর্যায় সারণির গ্রুপ-1 এ ক্ষার ধাতুর সাথে স্থান দেওয়া হয়েছে ।"},{"id":"ch4-sq7","chapter":4,"num":7,"importance":3,"topic":"পর্যায় সারণির কিছু ব্যতিক্রম","question":"পর্যায় সারণিতে হাইড্রোজেনের অবস্থান ব্যাখ্যা কর।","boards":"কুমিল্লা বোর্ড ২০২৬","answer":"হাইড্রোজেনের (H, পারমাণবিক সংখ্যা 1) ইলেকট্রন বিন্যাস 1s¹।\n• গ্রুপ-1 এর ক্ষার ধাতুর মতো এর সর্বশেষ শক্তিস্তরে 1টি ইলেকট্রন আছে এবং এটি 1টি ইলেকট্রন ত্যাগ করে H⁺ আয়ন গঠন করে । তাই একে গ্রুপ-1 এ রাখা হয়।\n• আবার গ্রুপ-17 এর হ্যালোজেনের মতো এটি 1টি ইলেকট্রন গ্রহণ করে নিকটতম নিষ্ক্রিয় গ্যাস He এর ইলেকট্রন বিন্যাস অর্জন করে H⁻ আয়ন গঠন করে এবং হ্যালোজেনের মতো দ্বিপরমাণুক অণু (H₂) গঠন করে। উভয় গ্রুপের সাথে মিল থাকায় পর্যায় সারণিতে হাইড্রোজেনের অবস্থান বিতর্কিত; তবে ইলেকট্রন বিন্যাস অনুযায়ী একে গ্রুপ-1 এর শীর্ষে, প্রথম পর্যায়ে রাখা হয়েছে ।"},{"id":"ch4-sq8","chapter":4,"num":8,"importance":2,"topic":"পর্যায় সারণির কিছু ব্যতিক্রম","question":"H কে গ্রুপ-1 স্থান দেয়া হয়েছে কেন?","boards":"সিলেট বোর্ড ২০২২","answer":"H(1)→1s¹। হাইড্রোজেন অধাতু হলেও ক্ষার ধাতুর (Na, K,\nRb, Cs, Fr) মতো এর বাইরের প্রধান শক্তিস্তরে একটিমাত্র ইলেকট্রন রয়েছে । ক্ষার ধাতুর মতো H+ আয়ন গঠন করে এবং অক্সাইড ও হ্যালাইড তৈরি করে। যদিও হ্যালোজেনের মতো একটি ইলেকট্রন গ্রহণ করতে পারে, তবুও বেশির ভাগ ধর্ম ক্ষার ধাতুর সাথে মিলে যায়। তাই H কে গ্রুপ-1 এ স্থান দেওয়া হয়েছে ।"},{"id":"ch4-sq9","chapter":4,"num":9,"importance":3,"topic":"মৌলের পর্যায়বৃত্ত ধর্ম","question":"ক্যালসিয়াম ও ম্যাগনেশিয়ামের মধ্যে কোনটি আকারে বড়? ব্যাখ্যা কর।","boards":"চট্টগ্রাম বোর্ড ২০২৬","answer":"ক্যালসিয়াম আকারে বড়।\nMg (12) : 1s² 2s² 2p⁶ 3s² (শক্তিস্তর 3টি) Ca (20) : 1s² 2s² 2p⁶ 3s² 3p⁶ 4s² (শক্তিস্তর 4টি) Mg ও Ca উভয়ই গ্রুপ-2 এর মৌল । গ্রুপের উপর থেকে নিচে শক্তিস্তরের সংখ্যা বাড়ে । Mg এর শক্তিস্তর 3টি কিন্তু Ca এর 4টি, তাই নিউক্লিয়াস থেকে Ca এর সর্ববহিঃস্থ ইলেকট্রনের দূরত্ব বেশি। ফলে Ca এর পারমাণবিক ব্যাসার্ধ Mg অপেক্ষা বড়।"},{"id":"ch4-sq10","chapter":4,"num":10,"importance":3,"topic":"মৌলের পর্যায়বৃত্ত ধর্ম","question":"Li⁺ এর আকার Li থেকে ছোট কেন? ব্যাখ্যা কর।","boards":"যশোর বোর্ড ২০২৬","answer":"Li এর ইলেকট্রন বিন্যাস 1s² 2s¹, অর্থাৎ এর দুটি শক্তিস্তর আছে। Li পরমাণু সর্ববহিঃস্থ 2s অরবিটালের একটি ইলেকট্রন ত্যাগ করে Li⁺ আয়নে পরিণত হয়।\nLi→Li⁺+e⁻\nফলে Li⁺ আয়নে (1s2) মাত্র একটি শক্তিস্তর থাকে। তাছাড়া Li⁺ আয়নে নিউক্লিয়াসের প্রোটন সংখ্যা 3 অপরিবর্তিত থাকলেও ইলেকট্রন সংখ্যা কমে 2 হয়, তাই অবশিষ্ট ইলেকট্রনগুলোর উপর নিউক্লিয়াসের আকর্ষণ বেড়ে যায়। এ কারণে Li⁺ এর আকার Li থেকে ছোট।"},{"id":"ch4-sq11","chapter":4,"num":11,"importance":3,"topic":"মৌলের পর্যায়বৃত্ত ধর্ম","question":"Na পরমাণুর তড়িৎ ঋণাত্মকতার মান Cl এর চেয়ে কম কেন? ব্যাখ্যা কর।","boards":"মাদ্রাসা বোর্ড ২০২৬","answer":"Na(11) : 1s² 2s² 2p⁶ 3s¹ এবং Cl(17) : 1s² 2s² 2p⁶ 3s² 3p⁵। উভয়ই তৃতীয় পর্যায়ের মৌল। একই পর্যায়ে বাম থেকে ডানে নিউক্লিয়াসের ধনাত্মক চার্জ বাড়ে কিন্তু শক্তিস্তর একই থাকে, ফলে পরমাণুর আকার কমে। Cl এর নিউক্লিয়ার চার্জ (+17) বেশি ও আকার ছোট হওয়ায় বন্ধনের শেয়ারকৃত ইলেকট্রনকে এটি বেশি জোরে আকর্ষণ করে । অপরদিকে Na এর নিউক্লিয়ার চার্জ (+11) কম ও আকার বড়। তাই Na এর তড়িৎ ঋণাত্মকতা (0.9) Cl এর (3.0) চেয়ে কম।"},{"id":"ch4-sq12","chapter":4,"num":12,"importance":2,"topic":"মৌলের পর্যায়বৃত্ত ধর্ম","question":"অক্সিজেন ও ফ্লোরিনের মধ্যে কোনটির আকার বড়? ব্যাখ্যা কর।","boards":"কুমিল্লা বোর্ড ২০২৫","answer":"অক্সিজেন (O) এর আকার ফ্লোরিন (F) এর চেয়ে বড়। O (8) ও F (9) উভয়ই পর্যায় 2 এর মৌল, উভয়ের শক্তিস্তর 2টি। F এ প্রোটন সংখ্যা বেশি হওয়ায় বাইরের ইলেকট্রনের উপর নিউক্লিয়াসের আকর্ষণ বেশি, ফলে এর আকার ছোট। একই পর্যায়ে বাম থেকে ডানে আকার কমে, তাই O এর আকার বড়।"},{"id":"ch4-sq13","chapter":4,"num":13,"importance":2,"topic":"মৌলের পর্যায়বৃত্ত ধর্ম","question":"Ca ও Ca²⁺ এর মধ্যে কোনটি আকারে বড়? ব্যাখ্যা কর।","boards":"রাজশাহী বোর্ড ২০২৪","answer":"Ca পরমাণু Ca²⁺ আয়নের চেয়ে আকারে বড়।\nCa(20)→1s²2s²2p⁶3s²3p⁶4s²; Ca²⁺(18e)→\n1s²2s²2p⁶3s²3p⁶ Ca পরমাণুর প্রধান শক্তিস্তর 4টি, কিন্তু 2টি ইলেকট্রন ত্যাগ করায় Ca²⁺ আয়নের শক্তিস্তর 3টি। তাছাড়া প্রোটন সংখ্যা (20) একই থাকায় Ca²⁺ এর কম ইলেকট্রনের উপর নিউক্লিয়াসের আকর্ষণ বেশি। তাই Ca পরমাণুর আকার বড়।"},{"id":"ch4-sq14","chapter":4,"num":14,"importance":2,"topic":"মৌলের পর্যায়বৃত্ত ধর্ম","question":"F⁻ ও Ne এর মধ্যে কোনটির আকার বড়? ব্যাখ্যা কর।","boards":"চট্টগ্রাম বোর্ড ২০২২","answer":"F⁻ আয়নের আকার Ne পরমাণুর চেয়ে বড়।\nF⁻ আয়নে 9টি প্রোটন ও 10টি ইলেকট্রন এবং Ne পরমাণুতে 10টি প্রোটন ও 10টি ইলেকট্রন থাকে। ইলেকট্রন সংখ্যা ও শক্তিস্তর সমান হলেও Ne এ একটি প্রোটন বেশি থাকায় ইলেকট্রনগুলোর উপর নিউক্লিয়াসের আকর্ষণ বেশি, তাই Ne ছোট। ফলে F⁻ আকারে বড়।"},{"id":"ch4-sq15","chapter":4,"num":15,"importance":2,"topic":"মৌলের পর্যায়বৃত্ত ধর্ম","question":"ফ্লোরিন অপেক্ষা ক্লোরিন এর ইলেকট্রন আসক্তি বেশি — ব্যাখ্যা কর।","boards":"দিনাজপুর বোর্ড ২০২২","answer":"সাধারণ নিয়মে গ্রুপে উপর থেকে নিচে আকার বাড়ায় ইলেকট্রন আসক্তি কমে, কিন্তু F ও Cl এর ক্ষেত্রে এটি ব্যতিক্রম । F পরমাণু খুব ছোট; এর দ্বিতীয় শক্তিস্তরটি ক্ষুদ্র হওয়ায় সেখানে 7টি ইলেকট্রনের ঘনত্ব বেশি। ফলে আগত ইলেকট্রন তীব্র বিকর্ষণ পায়। Cl এর তৃতীয় শক্তিস্তর বড় হওয়ায় ইলেকট্রন ঘনত্ব ও বিকর্ষণ কম, তাই আগত ইলেকট্রন সহজে প্রবেশ করে। এজন্য ফ্লোরিন অপেক্ষা ক্লোরিনের ইলেকট্রন আসক্তি বেশি।"},{"id":"ch4-sq16","chapter":4,"num":16,"importance":2,"topic":"মৌলের পর্যায়বৃত্ত ধর্ম","question":"Cl অপেক্ষা P এর তড়িৎ ঋণাত্মকতা কম-ব্যাখ্যা কর।","boards":"দিনাজপুর বোর্ড ২০২০","answer":"P (15) ও Cl (17) উভয়ই তৃতীয় পর্যায়ের মৌল; P গ্রুপ 15 এ এবং Cl গ্রুপ 17 এ, অর্থাৎ Cl ডানে অবস্থিত । একই পর্যায়ে বাম থেকে ডানে পারমাণবিক আকার কমে, আর আকার যত ছোট তড়িৎ ঋণাত্মকতা তত বেশি। Cl এর আকার P এর চেয়ে ছোট হওয়ায় বন্ধনের ইলেকট্রনকে Cl বেশি আকর্ষণ করে । তাই Cl অপেক্ষা P এর তড়িৎ ঋণাত্মকতা কম।"},{"id":"ch4-sq17","chapter":4,"num":17,"importance":3,"topic":"বিভিন্ন গ্রুপে উপস্থিত মৌলগুলোর বিশেষ নাম","question":"আর্গন মৌলটি নিষ্ক্রিয় কেন? এর কারণ ব্যাখ্যা কর।","boards":"সিলেট বোর্ড ২০২৫, ২০২১; যশোর বোর্ড ২০২৪; কুমিল্লা বোর্ড ২০২৩; চট্টগ্রাম বোর্ড ২০২৩, ২০২১; রাজশাহী বোর্ড ২০২২; ঢাকা বোর্ড ২০২০","answer":"আর্গন (Ar) গ্রুপ-18 এর মৌল। Ar(18): 1s² 2s² 2p⁶ 3s² 3p⁶। এর সর্ববহিঃস্থ শক্তিস্তরে 8টি ইলেকট্রন থাকায় অষ্টক পূর্ণ, ফলে এটি সুস্থিত । তাই আর্গন ইলেকট্রন আদান-প্রদান বা শেয়ার করে কোনো যৌগ গঠন করে না, রাসায়নিক বিক্রিয়ায় নিষ্ক্রিয় থাকে এবং সাধারণ তাপমাত্রায় গ্যাস হিসেবে থাকে। এজন্য আর্গনকে নিষ্ক্রিয় গ্যাস বলা হয়।"},{"id":"ch4-sq18","chapter":4,"num":18,"importance":3,"topic":"বিভিন্ন গ্রুপে উপস্থিত মৌলগুলোর বিশেষ নাম","question":"ক্লোরিন একটি হ্যালোজেন মৌল— ব্যাখ্যা কর।","boards":"যশোর বোর্ড ২০২৪; ঢাকা বোর্ড ২০২২; দিনাজপুর বোর্ড ২০২১","answer":"ক্লোরিন (Cl) পর্যায় সারণির গ্রুপ-17 এর মৌল; Cl(17): 1s² 2s² 2p⁶ 3s² 3p⁵। হ্যালোজেন অর্থ লবণ উৎপাদনকারী। ক্লোরিন ধাতুর সাথে যুক্ত হয়ে লবণ গঠন করে, যেমন– সোডিয়ামের সাথে খাদ্যলবণ NaCl:\n2Na+Cl₂→2NaCl\nএর মূল উৎস সামুদ্রিক লবণ। তাই ক্লোরিন একটি হ্যালোজেন মৌল ।"},{"id":"ch4-sq19","chapter":4,"num":19,"importance":3,"topic":"বিভিন্ন গ্রুপে উপস্থিত মৌলগুলোর বিশেষ নাম","question":"Cu কে মুদ্রা ধাতু বলা হয় কেন?","boards":"সিলেট বোর্ড ২০২২; দিনাজপুর বোর্ড ২০২০","answer":"কপার (Cu) পর্যায় সারণির গ্রুপ-11 এর মৌল। প্রাচীনকালে কপার (এবং একই গ্রুপের সিলভার ও গোল্ড) দিয়ে মুদ্রা তৈরি হতো এবং ব্যবসা-বাণিজ্য ও বিনিময়ের মাধ্যম হিসেবে ব্যবহার করা হতো। তাই Cu কে মুদ্রা ধাতু বলা হয়।"},{"id":"ch4-sq20","chapter":4,"num":20,"importance":3,"topic":"বিভিন্ন গ্রুপে উপস্থিত মৌলগুলোর বিশেষ নাম","question":"Na ধাতুকে ক্ষারধাতু বলা হয় কেন?","boards":"ঢাকা বোর্ড ২০২৬","answer":"Na পর্যায় সারণির গ্রুপ-1 এর মৌল। Na পানির সাথে বিক্রিয়া করে তীব্র ক্ষার NaOH উৎপন্ন করে এবং H₂ গ্যাস নির্গত করে।\n2Na+2H₂O→2NaOH+H₂\nউৎপন্ন NaOH পানিতে দ্রবণীয় তীব্র ক্ষার। এভাবে পানির সাথে বিক্রিয়ায় ক্ষার উৎপন্ন করে বলে Na কে ক্ষারধাতু বলা হয়।"},{"id":"ch4-sq21","chapter":4,"num":21,"importance":3,"topic":"বিভিন্ন গ্রুপে উপস্থিত মৌলগুলোর বিশেষ নাম","question":"Mn কে অবস্থান্তর মৌল বলা হয় —ব্যাখ্যা কর।","boards":"দিনাজপুর বোর্ড ২০২৬","answer":"যেসব d-ব্লক মৌলের পরমাণু বা স্থিতিশীল আয়নের d অরবিটাল ইলেকট্রন দ্বারা আংশিক পূর্ণ থাকে, তাদেরকে অবস্থান্তর মৌল বলে। Mn (25) : 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁵ 4s² Mn²⁺ : 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁵ Mn পরমাণু এবং এর স্থিতিশীল আয়ন Mn²⁺ উভয়ের 3d অরবিটালে 5টি ইলেকট্রন থাকে, অর্থাৎ d অরবিটাল আংশিক পূর্ণ। তাই Mn একটি অবস্থান্তর মৌল।"},{"id":"ch4-sq22","chapter":4,"num":22,"importance":3,"topic":"বিভিন্ন গ্রুপে উপস্থিত মৌলগুলোর বিশেষ নাম","question":"ক্লোরিনকে হ্যালোজেন বলার কারণ ব্যাখ্যা করো ।","boards":"সিলেট বোর্ড ২০২৬","answer":"হ্যালোজেন শব্দের অর্থ লবণ উৎপাদনকারী (halo = লবণ, gen = উৎপাদক)। ক্লোরিন পর্যায় সারণির গ্রুপ 17 এর মৌল এবং এটি বিভিন্ন ধাতুর সাথে বিক্রিয়া করে লবণ উৎপন্ন করে।\n2Na+Cl₂→2NaCl\nএজন্য ক্লোরিনকে হ্যালোজেন বলা হয়।"},{"id":"ch4-sq23","chapter":4,"num":23,"importance":2,"topic":"বিভিন্ন গ্রুপে উপস্থিত মৌলগুলোর বিশেষ নাম","question":"Na একটি ক্ষার ধাতু – ব্যাখ্যা কর।\nSimilar Questions: রুবিডিয়ামকে ক্ষার ধাতু বলা হয় কেন? (সংশোধিত)","boards":"কুমিল্লা বোর্ড ২০২৫","answer":"সোডিয়াম (Na) গ্রুপ-1 এর মৌল; Na(11): 1s² 2s² 2p⁶ 3s¹, অর্থাৎ সর্ববহিঃস্থ স্তরে 1টি ইলেকট্রন । Na পানির সাথে বিক্রিয়া করে হাইড্রোজেন গ্যাস ও তীব্র ক্ষার NaOH উৎপন্ন করে:\n2Na+2H₂O→2NaOH+H₂\nতাই Na একটি ক্ষার ধাতু।"},{"id":"ch4-sq24","chapter":4,"num":24,"importance":2,"topic":"বিভিন্ন গ্রুপে উপস্থিত মৌলগুলোর বিশেষ নাম","question":"আয়রন একটি অবস্থান্তর মৌল ব্যাখ্যা কর।","boards":"কুমিল্লা বোর্ড ২০২৫","answer":"যে d-ব্লক মৌলের সুস্থিত আয়নে d-অরবিটাল আংশিক পূর্ণ (d1–d9) থাকে, তাকে অবস্থান্তর মৌল বলে। আয়রনের (Z = 26) ইলেকট্রন বিন্যাস —\nFe(26)→1s²2s²2p⁶3s²3p⁶3d⁶4s²\nআয়ন গঠনের সময় প্রথমে 4s থেকে ইলেকট্রন বের হয়। ফলে এর সুস্থিত আয়ন দুটির বিন্যাস —\nFe²⁺→1s²2s²2p⁶3s²3p⁶3d⁶ ; Fe³⁺→\n1s²2s²2p⁶3s²3p⁶3d⁵ উভয় আয়নেই 3d অরবিটাল আংশিক পূর্ণ। তাই আয়রন একটি অবস্থান্তর মৌল।"},{"id":"ch4-sq25","chapter":4,"num":25,"importance":2,"topic":"বিভিন্ন গ্রুপে উপস্থিত মৌলগুলোর বিশেষ নাম","question":"স্ট্রনসিয়ামকে মৃৎক্ষার ধাতু বলা হয় কেন? ব্যাখ্যা কর। Similar Questions: Mg কে মৃৎক্ষার ধাতু বলা হয় কেন?","boards":"সিলেট বোর্ড ২০২৫","answer":"স্ট্রনসিয়াম (Sr) পর্যায় সারণির গ্রুপ-2 এর মৌল; এর বিভিন্ন যৌগ মাটিতে (মৃত্তিকায়) পাওয়া যায়। Sr পানির সাথে বিক্রিয়া করে ক্ষার Sr(OH)₂ উৎপন্ন করে:\nSr+2H₂O→Sr(OH)₂+H₂\nমাটিতে পাওয়া যায় এবং ক্ষার তৈরি করে বলে স্ট্রনসিয়ামকে মৃৎক্ষার ধাতু বলা হয়।"},{"id":"ch4-sq26","chapter":4,"num":26,"importance":2,"topic":"পর্যায় সারণির একই গ্রুপের মৌলগুলো একই রকম রাসায়নিক ধর্ম প্রদর্শন করে","question":"F₂ ও Cl₂ একই ধরনের বিক্রিয়া প্রদর্শন করে– ব্যাখ্যা কর।","boards":"চট্টগ্রাম বোর্ড ২০২২","answer":"F ও Cl উভয়ই 17 নং গ্রুপের হ্যালোজেন; F (9): 2, 7 এবং Cl (17): 2, 8, 7। উভয়ের সর্বশেষ শক্তিস্তরে 7টি ইলেকট্রন, তাই উভয়ই একটি ইলেকট্রন গ্রহণ বা শেয়ার করে অষ্টক পূর্ণ করে। ফলে এরা একই ধরনের বিক্রিয়া করে। যেমন: উভয়ই H₂ এর সাথে বিক্রিয়া করে হাইড্রোজেন হ্যালাইড দেয়, যা পানিতে দ্রবীভূত হয়ে এসিড তৈরি করে।\nH₂(g)+F₂(g)→2HF(g)\nH₂(g)+Cl2(g)→2HCl(g)"},{"id":"ch5-sq1","chapter":5,"num":1,"importance":3,"topic":"যোজনী বা যোজ্যতা","question":"N-এর যোজ্যতা ইলেকট্রন ও যোজনী ভিন্নতার কারণ কী?","boards":"যশোর বোর্ড ২০২৪; ময়মনসিংহ বোর্ড ২০২৪, ২০২০; দিনাজপুর বোর্ড ২০২৩","answer":"N (7): 1s² 2s² 2p³ — যোজ্যতাস্তরে (দ্বিতীয় স্তরে) মোট 5টি ইলেকট্রন থাকায় নাইট্রোজেনের যোজ্যতা ইলেকট্রন 5। কিন্তু অষ্টক পূর্ণ করতে N মাত্র 3টি ইলেকট্রন গ্রহণ বা শেয়ার করে (যেমন: NH₃), তাই এর যোজনী 3। যোজনী নির্ভর করে বন্ধনে অংশ নেওয়া ইলেকট্রন সংখ্যার উপর, মোট যোজ্যতা ইলেকট্রনের উপর নয়। তাই নাইট্রোজেনের যোজনী ও যোজ্যতা ইলেকট্রন ভিন্ন।"},{"id":"ch5-sq2","chapter":5,"num":2,"importance":3,"topic":"যোজনী বা যোজ্যতা","question":"CO যৌগে কার্বনের সুপ্ত যোজনী ব্যাখ্যা কর।","boards":"কুমিল্লা বোর্ড ২০২৫; ময়মনসিংহ বোর্ড ২০২৩","answer":"কোনো মৌলের সর্বোচ্চ যোজনী ও সক্রিয় যোজনীর পার্থক্যকে সুপ্ত যোজনী বলে । CO যৌগে একটি C এর সাথে একটি O (যোজনী 2) যুক্ত, তাই C এর সক্রিয় যোজনী 2; কিন্তু কার্বনের সর্বোচ্চ যোজনী 4। CO যৌগে C এর সুপ্ত যোজনী = 4 – 2 = 2"},{"id":"ch5-sq3","chapter":5,"num":3,"importance":3,"topic":"যোজনী বা যোজ্যতা","question":"SO₃ এ সালফারের সুপ্ত যোজনী শূন্য– ব্যাখ্যা কর।","boards":"ময়মনসিংহ বোর্ড ২০২৪; ঢাকা বোর্ড ২০২২","answer":"কোনো মৌলের সর্বোচ্চ যোজনী ও সক্রিয় যোজনীর পার্থক্যকে সুপ্ত যোজনী বলে । SO₃ যৌগে S এর সাথে 3টি O যুক্ত, তাই S এর সক্রিয় যোজনী =3×2=6; সালফারের সর্বোচ্চ যোজনীও 6। SO₃ যৌগে S এর সুপ্ত যোজনী = 6 – 6 = 0 এখানে সালফার তার সর্বোচ্চ যোজনী প্রদর্শন করছে বলে সুপ্ত যোজনী শূন্য।"},{"id":"ch5-sq4","chapter":5,"num":4,"importance":3,"topic":"যোজনী বা যোজ্যতা","question":"সালফার ডাইঅক্সাইডে সালফার এর সুপ্ত যোজনী ২— ব্যাখ্যা কর।","boards":"বরিশাল বোর্ড ২০২৬","answer":"কোনো মৌলের সর্বোচ্চ যোজনী ও কোনো যৌগে প্রদর্শিত যোজনীর পার্থক্যকে ঐ মৌলের সুপ্ত যোজনী বলে। সালফারের (S = 16) ইলেকট্রন বিন্যাস 2, 8, 6; এর সর্বশেষ স্তরে 6টি ইলেকট্রন থাকায় সালফারের সর্বোচ্চ যোজনী 6। SO₂ যৌগে সালফার দুটি অক্সিজেন পরমাণুর সাথে দুটি দ্বিবন্ধন (O=S=O) গঠন করে, অর্থাৎ এখানে সালফারের প্রদর্শিত যোজনী 4। সালফারের সুপ্ত যোজনী = সর্বোচ্চ যোজনী - প্রদর্শিত যোজনী =6-4=2 তাই সালফার ডাইঅক্সাইডে সালফারের সুপ্ত যোজনী 2।"},{"id":"ch5-sq5","chapter":5,"num":5,"importance":3,"topic":"যোজনী বা যোজ্যতা","question":"সোডিয়ামের যোজনী ও যোজ্যতা ইলেকট্রন একই কেন? ব্যাখ্যা কর।","boards":"কুমিল্লা বোর্ড ২০২৬","answer":"সোডিয়ামের (Na, পারমাণবিক সংখ্যা 11) ইলেকট্রন বিন্যাস: 1s² 2s² 2p⁶ 3s¹। এর সর্বশেষ শক্তিস্তরে 1টি ইলেকট্রন আছে, তাই সোডিয়ামের যোজ্যতা ইলেকট্রন 1। বন্ধন গঠনের সময় সোডিয়াম এই 1টি ইলেকট্রন ত্যাগ করে নিষ্ক্রিয় গ্যাস Ne এর স্থিতিশীল ইলেকট্রন বিন্যাস অর্জন করে Na⁺ আয়ন গঠন করে । অর্থাৎ বন্ধন গঠনে এর 1টি ইলেকট্রন অংশ নেয়, তাই এর যোজনীও 1। এজন্য সোডিয়ামের যোজনী ও যোজ্যতা ইলেকট্রন সংখ্যা একই (1)।"},{"id":"ch5-sq6","chapter":5,"num":6,"importance":3,"topic":"যোজনী বা যোজ্যতা","question":"PCl₃ যৌগে P এর সুপ্ত যোজনী নির্ণয় কর।","boards":"দিনাজপুর বোর্ড ২০২৬","answer":"কোনো মৌলের সর্বোচ্চ যোজনী ও সক্রিয় যোজনীর পার্থক্যকে সুপ্ত যোজনী বলে । P (15) : 1s² 2s² 2p⁶ 3s² 3p³ P এর সর্বোচ্চ যোজনী 5 (যেমন PCl₅ এ)। PCl₃ যৌগে P তিনটি Cl পরমাণুর সাথে যুক্ত, তাই এখানে P এর সক্রিয় যোজনী 3। P এর সুপ্ত যোজনী = সর্বোচ্চ যোজনী − সক্রিয় যোজনী =5− 3=2 অতএব, PCl₃ যৌগে P এর সুপ্ত যোজনী 2।"},{"id":"ch5-sq7","chapter":5,"num":7,"importance":3,"topic":"যোজনী বা যোজ্যতা","question":"ক্লোরিন এর যোজনী ও যোজ্যতা ইলেকট্রন ভিন্ন — ব্যাখ্যা কর।","boards":"দিনাজপুর বোর্ড ২০২৬","answer":"পরমাণুর সর্বশেষ শক্তিস্তরে অবস্থিত ইলেকট্রনগুলোকে যোজ্যতা ইলেকট্রন বলে। আর অণু গঠনকালে কোনো মৌলের একটি পরমাণু যতগুলো ইলেকট্রন গ্রহণ, বর্জন বা শেয়ার করে, সেই সংখ্যাকে ঐ মৌলের যোজনী বলে। Cl (17) : 1s² 2s² 2p⁶ 3s² 3p⁵ Cl এর সর্বশেষ শক্তিস্তরে 7টি ইলেকট্রন আছে, তাই এর যোজ্যতা ইলেকট্রন 7। কিন্তু নিকটতম নিষ্ক্রিয় গ্যাস Ar এর ইলেকট্রন বিন্যাস অর্জনের জন্য Cl মাত্র 1টি ইলেকট্রন গ্রহণ বা শেয়ার করে, তাই এর যোজনী 1। এজন্য ক্লোরিনের যোজনী ও যোজ্যতা ইলেকট্রন ভিন্ন।"},{"id":"ch5-sq8","chapter":5,"num":8,"importance":3,"topic":"যোজনী বা যোজ্যতা","question":"যোজনী ও যোজ্যতা ইলেকট্রন একই নয়।—ব্যাখ্যা কর।","boards":"যশোর বোর্ড ২০২৬","answer":"কোনো মৌলের পরমাণুর সর্ববহিঃস্থ শক্তিস্তরে উপস্থিত ইলেকট্রনগুলোকে যোজ্যতা ইলেকট্রন বলে। আর কোনো মৌলের একটি পরমাণু অন্য মৌলের পরমাণুর সাথে যুক্ত হওয়ার ক্ষমতাকে যোজনী বলে; বন্ধন গঠনে পরমাণু যতটি ইলেকট্রন ত্যাগ, গ্রহণ বা শেয়ার করে, সেটিই তার যোজনী।\nযেমন: ক্লোরিনের (2, 8, 7) যোজ্যতা ইলেকট্রন 7, কিন্তু একটি ইলেকট্রন গ্রহণ করে স্থিতিশীল হয় বলে এর যোজনী 1। আবার অক্সিজেনের (2, 6) যোজ্যতা ইলেকট্রন 6 কিন্তু যোজনী 2। তাই যোজনী ও যোজ্যতা ইলেকট্রন একই নয়।"},{"id":"ch5-sq9","chapter":5,"num":9,"importance":3,"topic":"যোজনী বা যোজ্যতা","question":"ফ্লোরিনের যোজনী ও যোজনী ইলেকট্রন ভিন্ন কেন? ব্যাখ্যা করো।","boards":"সিলেট বোর্ড ২০২৬","answer":"F(9) : 1s² 2s² 2p⁵ ফ্লোরিনের সর্বশেষ শক্তিস্তরে 7টি ইলেকট্রন আছে, তাই এর যোজনী ইলেকট্রন 7। কিন্তু নিকটতম নিষ্ক্রিয় গ্যাস নিয়নের ইলেকট্রন বিন্যাস অর্জনের জন্য ফ্লোরিন মাত্র 1টি ইলেকট্রন গ্রহণ করে বা 1টি ইলেকট্রন শেয়ার করে, তাই এর যোজনী 1। এজন্য ফ্লোরিনের যোজনী (1) ও যোজনী ইলেকট্রন (7) ভিন্ন।"},{"id":"ch5-sq10","chapter":5,"num":10,"importance":2,"topic":"যোজনী বা যোজ্যতা","question":"দস্তার যোজনী ও যোজ্যতা ইলেকট্রন সমান হবে কি? ব্যাখ্যা কর।","boards":"চট্টগ্রাম বোর্ড ২০২৪","answer":"দস্তা (Zn, 30): 1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹⁰ 4s² — সর্বশেষ স্তরে (4s) 2টি ইলেকট্রন, তাই যোজ্যতা ইলেকট্রন 2। বন্ধন গঠনকালে Zn এই 2টি ইলেকট্রন ত্যাগ করে Zn²⁺ আয়নে পরিণত হয় (যেমন: ZnCl₂), তাই এর যোজনীও 2। সুতরাং দস্তার যোজনী ও যোজ্যতা ইলেকট্রন সমান ।"},{"id":"ch5-sq11","chapter":5,"num":11,"importance":2,"topic":"যৌগমূলক ও তাদের যোজনী","question":"NH₄⁺ একটি যৌগমূলক –ব্যাখ্যা কর।","boards":"বরিশাল বোর্ড ২০২৩","answer":"একাধিক মৌলের কতিপয় পরমাণু বা আয়ন মিলিত হয়ে আধানবিশিষ্ট যে পরমাণুগুচ্ছ তৈরি করে এবং একটি মৌলের আয়নের ন্যায় আচরণ করে, তাকে যৌগমূলক বলে। NH₄⁺ আয়নে একটি N পরমাণুর সাথে তিনটি H পরমাণু ও একটি H⁺ যুক্ত থাকে, ফলে এটি +1 আধানবিশিষ্ট পরমাণুগুচ্ছ ।\nNH₃+H⁺→NH₄⁺\nরাসায়নিক বিক্রিয়ায় এটি একটি একক ধনাত্মক আয়নের মতো আচরণ করে (যেমন NH₄Cl, (NH₄)₂SO₄)। তাই NH₄⁺ একটি যৌগমূলক ।"},{"id":"ch5-sq12","chapter":5,"num":12,"importance":2,"topic":"যৌগমূলক ও তাদের যোজনী","question":"CO₃²⁻ কে যৌগমূলক বলা হয় কেন? ব্যাখ্যা কর।","boards":"ময়মনসিংহ বোর্ড ২০২২","answer":"একাধিক মৌলের পরমাণু মিলিত হয়ে গঠিত যে আধানযুক্ত পরমাণুগুচ্ছ একটি মৌলের আয়নের ন্যায় আচরণ করে, তাকে যৌগমূলক বলে। কার্বনেট (CO₃²⁻) একটি C ও তিনটি O পরমাণু নিয়ে গঠিত এবং এর আধান –2। রাসায়নিক বিক্রিয়ায় এটি একটি একক ঋণাত্মক আয়নের মতো আচরণ করে (যেমন CaCO₃, Na₂CO₃)। তাই CO₃²⁻ কে যৌগমূলক বলা হয়।"},{"id":"ch5-sq13","chapter":5,"num":13,"importance":2,"topic":"যৌগমূলক ও তাদের যোজনী","question":"NH₃ ও NH₄⁺ আয়নের মধ্যে পার্থক্য লেখ।","boards":"বরিশাল বোর্ড ২০২২","answer":"NH₃ NH₄⁺\n১. এটি নিরপেক্ষ অণু বা যৌগ। ১. এটি যৌগমূলক বা আধানযুক্ত আয়ন ।\n২. মোট আধান শূন্য। ২. মোট আধান +1।\n৩. N পরমাণুতে এক জোড়া ৩. কোনো মুক্তজোড় ইলেকট্রন মুক্তজোড় ইলেকট্রন থাকে। নেই।\n৪. স্বাধীনভাবে অবস্থান করতে ৪. স্বাধীনভাবে থাকে না, অন্য পারে। আয়নের সাথে যুক্ত হয়ে যৌগ গঠন করে ।"},{"id":"ch5-sq14","chapter":5,"num":14,"importance":3,"topic":"অষ্টক ও দুই-এর নিয়ম","question":"‘দুই’-এর নিয়ম বলতে কী বোঝায়? ব্যাখ্যা কর।","boards":"বরিশাল বোর্ড ২০২৬","answer":"রাসায়নিক বন্ধন গঠনের সময় H, Li, Be ইত্যাদি মৌলের পরমাণু ইলেকট্রন গ্রহণ, বর্জন বা শেয়ারের মাধ্যমে সর্বশেষ শক্তিস্তরে নিকটতম নিষ্ক্রিয় গ্যাস হিলিয়ামের (He: 1s2) মতো 2টি ইলেকট্রন অর্জন করে স্থিতিশীল হয়। একে ‘দুই’-এর নিয়ম বা ডুপ্লেট নিয়ম বলে।\nযেমন: H₂ অণুতে দুটি H পরমাণু একটি করে ইলেকট্রন শেয়ার করে প্রত্যেকে He এর মতো 2টি ইলেকট্রন লাভ করে । আবার Li পরমাণু (2, 1) একটি ইলেকট্রন ত্যাগ করে Li⁺ (2) আয়নে পরিণত হয় এবং দুই-এর নিয়ম পূরণ করে।\nLi→Li⁺+e⁻"},{"id":"ch5-sq15","chapter":5,"num":15,"importance":3,"topic":"অষ্টক ও দুই-এর নিয়ম","question":"CH₄ অণু অষ্টক ও দুই-এর নিয়ম মেনে চলে— ব্যাখ্যা কর।","boards":"মাদ্রাসা বোর্ড ২০২৬","answer":"C(6) : 1s² 2s² 2p², যোজ্যতা ইলেকট্রন 4; H(1) : 1s¹। CH₄ অণুতে C পরমাণু তার 4টি যোজ্যতা ইলেকট্রন 4টি H পরমাণুর 1টি করে ইলেকট্রনের সাথে শেয়ার করে 4টি C-H সমযোজী বন্ধন গঠন করে । ফলে C এর সর্বশেষ শক্তিস্তরে 8টি ইলেকট্রন হয় (নিয়নের মতো, অষ্টক নিয়ম) এবং প্রতিটি H এর শক্তিস্তরে 2টি ইলেকট্রন হয় (হিলিয়ামের মতো, দুই-এর নিয়ম)। তাই CH₄ অণু অষ্টক ও দুই-এর নিয়ম মেনে চলে।"},{"id":"ch5-sq16","chapter":5,"num":16,"importance":2,"topic":"অষ্টক ও দুই-এর নিয়ম","question":"দুই-এর নিয়ম ব্যাখ্যা কর।","boards":"বরিশাল বোর্ড ২০২৫","answer":"অণু গঠনকালে কোনো পরমাণুর সর্বশেষ শক্তিস্তরে এক বা একাধিক জোড়া ইলেকট্রন বিদ্যমান থাকবে— এটিই দুই-এর নিয়ম ।\nযেমন: BeCl₂ অণুতে Be এর সর্বশেষ স্তরে 2 জোড়া (4টি), BF₃ অণুতে B এর 3 জোড়া (6টি) এবং Cl, F এর 4 জোড়া (8টি) ইলেকট্রন থাকে। CH₄ এ H এর 1 জোড়া (2টি) ইলেকট্রন থাকে । এসব অণু অষ্টক নিয়ম না মানলেও দুই-এর নিয়ম মানে, তাই দুই-এর নিয়ম অষ্টক নিয়ম অপেক্ষা অধিক উপযোগী ।"},{"id":"ch5-sq17","chapter":5,"num":17,"importance":2,"topic":"নিষ্ক্রিয় গ্যাস এবং এর স্থিতিশীলতা","question":"Ne নিষ্ক্রিয় কেন? ব্যাখ্যা কর।","boards":"বরিশাল বোর্ড ২০২১","answer":"Ne(10) : 1s² 2s² 2p⁶ অর্থাৎ 2, 8।\nএর সর্বশেষ শক্তিস্তরে (2s2 2p6) 8টি ইলেকট্রন অর্থাৎ অষ্টক পূর্ণ, যা সর্বাধিক স্থিতিশীল বিন্যাস । তাই Ne ইলেকট্রন আদান-প্রদান বা শেয়ার করে কোনো বন্ধন গঠন করে না; এজন্য Ne নিষ্ক্রিয় ।"},{"id":"ch5-sq18","chapter":5,"num":18,"importance":3,"topic":"রাসায়নিক বন্ধন ও রাসায়নিক বন্ধন গঠনের কারণ","question":"রাসায়নিক বন্ধন গঠনের কারণ ব্যাখ্যা কর।","boards":"রাজশাহী বোর্ড ২০২৬","answer":"নিষ্ক্রিয় গ্যাসসমূহের সর্বশেষ শক্তিস্তরে অষ্টক (He এর ক্ষেত্রে দুই) ইলেকট্রন থাকায় এরা স্থিতিশীল । অন্যান্য মৌলের পরমাণুর সর্বশেষ শক্তিস্তরে অষ্টক পূর্ণ থাকে না বলে এরা অস্থিতিশীল । স্থিতিশীলতা অর্জনের জন্য পরমাণুগুলো ইলেকট্রন গ্রহণ, বর্জন অথবা শেয়ারের মাধ্যমে নিকটতম নিষ্ক্রিয় গ্যাসের ইলেকট্রন বিন্যাস অর্জন করে । এর ফলে পরমাণুগুলোর মধ্যে রাসায়নিক বন্ধন গঠিত হয়।\nযেমন: Na একটি ইলেকট্রন ত্যাগ করে Ne এর এবং Cl একটি ইলেকট্রন গ্রহণ করে Ar এর ইলেকট্রন বিন্যাস লাভ করে NaCl গঠন করে।\nNa→Na⁺+e⁻ ; Cl+e⁻→Cl⁻"},{"id":"ch5-sq19","chapter":5,"num":19,"importance":3,"topic":"ক্যাটায়ন ও অ্যানায়ন","question":"সাধারণত Na²⁺ আয়ন গঠন অসম্ভব — ব্যাখ্যা কর।","boards":"কুমিল্লা বোর্ড ২০২৩; বরিশাল বোর্ড ২০২৩","answer":"Na (11) : 1s² 2s² 2p⁶ 3s¹। একটি ইলেকট্রন ত্যাগ করে Na⁺ : 1s² 2s² 2p⁶ গঠন করে, যা নিয়নের মতো সুস্থিত অষ্টক বিন্যাস । এই স্থিতিশীল অষ্টক থেকে আরও একটি ইলেকট্রন সরাতে হলে নিউক্লিয়াসের নিকটবর্তী স্তর থেকে ইলেকট্রন সরাতে হয়, যার জন্য অনেক বেশি শক্তি লাগে। এই শক্তি সাধারণ রাসায়নিক বিক্রিয়া থেকে পাওয়া যায় না। তাই সাধারণত Na²⁺ আয়ন গঠন অসম্ভব ।"},{"id":"ch5-sq20","chapter":5,"num":20,"importance":3,"topic":"ক্যাটায়ন ও অ্যানায়ন","question":"Na⁺ গঠিত হলেও Na²⁺ গঠিত হয় না কেন? ব্যাখ্যা কর।","boards":"কুমিল্লা বোর্ড ২০২৬","answer":"Na এর ইলেকট্রন বিন্যাস 1s² 2s² 2p⁶ 3s¹। সর্বশেষ স্তরের 1টি ইলেকট্রন ত্যাগ করলে Na⁺ আয়নের ইলেকট্রন বিন্যাস হয় 1s² 2s² 2p⁶, যা নিষ্ক্রিয় গ্যাস Ne এর মতো স্থিতিশীল অষ্টক বিন্যাস ।\nNa→Na⁺+e⁻\nNa⁺ থেকে আরও একটি ইলেকট্রন সরাতে হলে স্থিতিশীল পূর্ণ 2p অরবিটাল (নিউক্লিয়াসের অনেক কাছের স্তর) থেকে ইলেকট্রন সরাতে হয়, যার জন্য দ্বিতীয় আয়নিকরণ শক্তি অনেক বেশি প্রয়োজন । তাছাড়া এতে স্থিতিশীল অষ্টক ভেঙে যায়। তাই Na⁺ গঠিত হলেও Na²⁺ গঠিত হয় না।"},{"id":"ch5-sq21","chapter":5,"num":21,"importance":2,"topic":"আয়নিক বন্ধন বা তড়িৎযোজী বন্ধন","question":"Na-সমযোজী যৌগ গঠন করে না কেন? ব্যাখ্যা কর।","boards":"বরিশাল বোর্ড ২০২০","answer":"Na(11) : 1s² 2s² 2p⁶ 3s¹ — সর্বশেষ শক্তিস্তরে মাত্র 1টি ইলেকট্রন থাকায় Na একটি সক্রিয় ধাতু এবং এর আয়নিকরণ শক্তি খুব কম। অষ্টক পূরণে 7টি ইলেকট্রন শেয়ার করার চেয়ে 1টি ইলেকট্রন ত্যাগ করা অনেক সহজ, তাই Na ইলেকট্রন ত্যাগ করে Na+ আয়নে\nপরিণত হয়: Na→Na++e-।\nসমযোজী বন্ধনে ইলেকট্রন শেয়ার করতে হয়, কিন্তু Na ইলেকট্রন শেয়ার না করে ত্যাগ করে। তাই Na সমযোজী যৌগ গঠন করে না, আয়নিক যৌগ গঠন করে ।"},{"id":"ch5-sq22","chapter":5,"num":22,"importance":3,"topic":"সমযোজী বন্ধন","question":"HCl একটি পোলার যৌগ — ব্যাখ্যা কর।","boards":"সিলেট বোর্ড ২০২৩; রাজশাহী বোর্ড ২০২০","answer":"HCl এ H ও Cl এক জোড়া ইলেকট্রন শেয়ার করে সমযোজী বন্ধন গঠন করে । Cl এর তড়িৎ ঋণাত্মকতা H অপেক্ষা অনেক বেশি, তাই শেয়ারকৃত ইলেকট্রন জোড় Cl এর দিকে সরে যায়। ফলে Cl পরমাণুতে আংশিক ঋণাত্মক (δ-) ও H পরমাণুতে আংশিক ধনাত্মক (δ+) চার্জ সৃষ্টি হয় (Hδ+–Clδ-)। তাই HCl একটি পোলার যৌগ।"},{"id":"ch5-sq23","chapter":5,"num":23,"importance":3,"topic":"সমযোজী বন্ধন","question":"CH₃CH₂OH একটি পোলার যৌগ– ব্যাখ্যা কর।","boards":"রাজশাহী বোর্ড ২০২১; সিলেট বোর্ড ২০২০","answer":"যে সমযোজী যৌগের অণুতে আংশিক ধনাত্মক ও আংশিক ঋণাত্মক প্রান্ত সৃষ্টি হয়, তাকে পোলার যৌগ বলে । ইথানলের গঠন CH₃-CH₂-O-H। এখানে O এর তড়িৎ ঋণাত্মকতা C ও H অপেক্ষা অনেক বেশি, তাই C–O ও O–H বন্ধনের শেয়ারকৃত ইলেকট্রন জোড় O এর দিকে সরে যায়। ফলে O পরমাণুতে আংশিক ঋণাত্মক (δ-) এবং সংলগ্ন C ও H পরমাণুতে আংশিক ধনাত্মক (δ+) চার্জ সৃষ্টি হয়। তাই ইথানল একটি পোলার যৌগ।"},{"id":"ch5-sq24","chapter":5,"num":24,"importance":3,"topic":"সমযোজী বন্ধন","question":"ইথানল পোলার যৌগ কেন? ব্যাখ্যা কর।","boards":"চট্টগ্রাম বোর্ড ২০২৬","answer":"ইথানলের (CH₃-CH₂-OH) অণুতে O-H ও C-O সমযোজী বন্ধন রয়েছে । O এর তড়িৎ ঋণাত্মকতা (3.5), H (2.1) ও C (2.5) অপেক্ষা অনেক বেশি। ফলে বন্ধনের শেয়ারকৃত ইলেকট্রন যুগল O পরমাণুর দিকে বেশি আকৃষ্ট হয়; O পরমাণু আংশিক ঋণাত্মক (δ-) এবং H পরমাণু\nআংশিক ধনাত্মক (δ+) চার্জ লাভ করে।\nCH₃-CH₂-Oδ⁻−Hδ⁺ অণুতে এরূপ আংশিক ধনাত্মক ও ঋণাত্মক প্রান্ত সৃষ্টি হওয়ায় ইথানল একটি পোলার যৌগ। এ কারণেই ইথানল পানির সাথে হাইড্রোজেন বন্ধন গঠন করে যেকোনো অনুপাতে মিশে যায়।"},{"id":"ch5-sq25","chapter":5,"num":25,"importance":3,"topic":"সমযোজী বন্ধন","question":"H₂O যৌগকে পোলার সমযোজী যৌগ বলা হয়—ব্যাখ্যা কর।","boards":"ঢাকা বোর্ড ২০২৬","answer":"H₂O অণুতে O পরমাণু দুটি H পরমাণুর সাথে ইলেকট্রন শেয়ারের মাধ্যমে দুটি সমযোজী বন্ধন গঠন করে । O এর তড়িৎ ঋণাত্মকতা (3.5) H এর তড়িৎ ঋণাত্মকতার (2.1) চেয়ে বেশি হওয়ায় শেয়ারকৃত ইলেকট্রন যুগল O পরমাণুর দিকে বেশি আকৃষ্ট থাকে। ফলে O পরমাণুতে আংশিক ঋণাত্মক (δ-) এবং H পরমাণুতে আংশিক ধনাত্মক (δ+) চার্জের সৃষ্টি হয়। এভাবে অণুটিতে আংশিক ধনাত্মক ও আংশিক ঋণাত্মক প্রান্তের সৃষ্টি হয় বলে H₂O কে পোলার সমযোজী যৌগ বলা হয়।"},{"id":"ch5-sq26","chapter":5,"num":26,"importance":3,"topic":"সমযোজী বন্ধন","question":"HF একটি পোলার যৌগ — ব্যাখ্যা কর।","boards":"দিনাজপুর বোর্ড ২০২৬","answer":"যে সমযোজী যৌগে বন্ধনে যুক্ত পরমাণুদ্বয়ের তড়িৎঋণাত্মকতার পার্থক্যের কারণে আংশিক ধনাত্মক ও আংশিক ঋণাত্মক প্রান্তের সৃষ্টি হয়, তাকে পোলার যৌগ বলে। HF অণুতে H (তড়িৎঋণাত্মকতা 2.1) ও F (তড়িৎঋণাত্মকতা 4.0) এর মধ্যে একটি ইলেকট্রন জোড় শেয়ারের মাধ্যমে সমযোজী বন্ধন গঠিত হয়। F অধিক তড়িৎঋণাত্মক হওয়ায় শেয়ারকৃত ইলেকট্রন জোড়কে নিজের দিকে বেশি আকর্ষণ করে। Hδ⁺ − Fδ⁻ ফলে F প্রান্তে আংশিক ঋণাত্মক ও H প্রান্তে আংশিক ধনাত্মক চার্জের সৃষ্টি হয়। তাই HF একটি পোলার যৌগ।"},{"id":"ch5-sq27","chapter":5,"num":27,"importance":3,"topic":"সমযোজী বন্ধন","question":"পানি কেন পোলার দ্রাবক? ব্যাখ্যা কর।","boards":"যশোর বোর্ড ২০২৬","answer":"পানির (H₂O) অণুতে অক্সিজেন ও হাইড্রোজেন পোলার সমযোজী বন্ধনে যুক্ত। অক্সিজেনের তড়িৎ ঋণাত্মকতা হাইড্রোজেনের চেয়ে বেশি হওয়ায় শেয়ারকৃত ইলেকট্রন যুগল অক্সিজেনের দিকে বেশি আকৃষ্ট থাকে। ফলে অক্সিজেন প্রান্তে আংশিক ঋণাত্মক (δ-) এবং হাইড্রোজেন প্রান্তে আংশিক ধনাত্মক (δ+) চার্জের সৃষ্টি হয়। তাছাড়া পানির অণু কৌণিক আকৃতির হওয়ায় এই চার্জ পৃথকীকরণ প্রশমিত হয় না। তাই পানি একটি পোলার দ্রাবক, যা NaCl এর মতো আয়নিক যৌগ ও পোলার যৌগকে সহজে দ্রবীভূত করে।"},{"id":"ch5-sq28","chapter":5,"num":28,"importance":3,"topic":"সমযোজী বন্ধন","question":"হাইড্রোজেন ক্লোরাইড একটি পোলার সমযোজী যৌগ— ব্যাখ্যা কর।","boards":"ময়মনসিংহ বোর্ড ২০২৬","answer":"HCl অণুতে H ও Cl পরমাণু একজোড়া ইলেকট্রন শেয়ার করে সমযোজী বন্ধন গঠন করে । তাই HCl একটি সমযোজী যৌগ। কিন্তু Cl এর তড়িৎ ঋণাত্মকতা (3.0) H এর তড়িৎ ঋণাত্মকতা (2.1) অপেক্ষা বেশি হওয়ায় শেয়ারকৃত ইলেকট্রন যুগল Cl পরমাণুর দিকে বেশি আকৃষ্ট থাকে। ফলে Cl প্রান্তে আংশিক ঋণাত্মক (δ-) এবং H প্রান্তে আংশিক ধনাত্মক (δ+) চার্জের সৃষ্টি হয়: Hδ⁺ — Clδ⁻ এভাবে অণুতে দুটি পোল সৃষ্টি হয় বলে হাইড্রোজেন ক্লোরাইড একটি পোলার সমযোজী যৌগ।"},{"id":"ch5-sq29","chapter":5,"num":29,"importance":2,"topic":"সমযোজী বন্ধন","question":"পানি পোলার যৌগ ব্যাখ্যা কর।","boards":"সিলেট বোর্ড ২০২৫","answer":"পানিতে (H–O–H) O পরমাণু দুটি H পরমাণুর সাথে একটি করে ইলেকট্রন জোড় শেয়ার করে। O এর তড়িৎ ঋণাত্মকতা H অপেক্ষা অনেক বেশি, তাই উভয় O–H বন্ধনের ইলেকট্রন জোড় O এর দিকে বেশি আকৃষ্ট হয়। ফলে O পরমাণুতে আংশিক ঋণাত্মক (2δ-) এবং প্রতিটি H পরমাণুতে আংশিক ধনাত্মক (δ+) চার্জ সৃষ্টি হয়। অণুটি বাঁকা হওয়ায় এই চার্জ প্রশমিত হয় না, তাই পানি একটি পোলার যৌগ।"},{"id":"ch5-sq30","chapter":5,"num":30,"importance":2,"topic":"আয়নিক ও সমযোজী যৌগের বৈশিষ্ট্য","question":"\"ইথানল পানিতে দ্রবণীয়\"– ব্যাখ্যা কর।","boards":"কুমিল্লা বোর্ড ২০২৪","answer":"ইথানলের গঠন CH₃-CH₂-O-H। এর -OH মূলকে O এর তড়িৎ ঋণাত্মকতা H অপেক্ষা অনেক বেশি, তাই O–H বন্ধন পোলার; O এ আংশিক ঋণাত্মক (δ-) ও H এ আংশিক ধনাত্মক (δ+) চার্জ সৃষ্টি হয়। পানিও পোলার যৌগ। ইথানল পানিতে মেশালে ইথানলের Hδ+ প্রান্ত পানির Oδ- প্রান্ত দ্বারা এবং ইথানলের Oδ- প্রান্ত পানির Hδ+ প্রান্ত দ্বারা আকৃষ্ট হয় (হাইড্রোজেন বন্ধন গঠিত হয়)। এই আকর্ষণের ফলে ইথানলের অণুগুলো পানির অণুর সাথে মিশে যায়। তাই ইথানল পানিতে দ্রবণীয় ।"},{"id":"ch5-sq31","chapter":5,"num":31,"importance":2,"topic":"আয়নিক ও সমযোজী যৌগের বৈশিষ্ট্য","question":"আয়নিক যৌগে আন্তঃআণবিক আকর্ষণ বল বেশি কেন? ব্যাখ্যা কর।","boards":"বরিশাল বোর্ড ২০২৪","answer":"আয়নিক যৌগে ধনাত্মক ও ঋণাত্মক আয়ন স্থির বৈদ্যুতিক আকর্ষণ বলে দৃঢ়ভাবে আবদ্ধ থাকে । প্রতিটি আয়ন চারদিক থেকে বিপরীত আধানের আয়ন দ্বারা পরিবেষ্টিত থাকে এবং অসংখ্য আয়ন ত্রিমাত্রিকভাবে সুবিন্যস্ত হয়ে স্ফটিক (কেলাস) গঠন করে। ফলে আয়নগুলোর মধ্যে আকর্ষণ বল সব দিক থেকে কাজ করে; তাই আয়নিক যৌগে আন্তঃআণবিক আকর্ষণ বল অনেক বেশি ।"},{"id":"ch5-sq32","chapter":5,"num":32,"importance":2,"topic":"আয়নিক ও সমযোজী যৌগের বৈশিষ্ট্য","question":"C₁₂H₂₂O₁₁ জলীয় দ্রবণে বিদ্যুৎ পরিবহণ করে না কেন?","boards":"রাজশাহী বোর্ড ২০২৩","answer":"বিদ্যুৎ পরিবহণের জন্য দ্রবণে বিচ্ছিন্ন (মুক্ত) ধনাত্মক ও ঋণাত্মক আয়ন থাকা প্রয়োজন । C₁₂H₂₂O₁₁ (চিনি) একটি সমযোজী যৌগ। পানিতে দ্রবীভূত হলেও এটি অণু হিসেবেই থাকে, কোনো আয়নে বিভক্ত হয় না। দ্রবণে মুক্ত আয়ন না থাকায় C₁₂H₂₂O₁₁ এর জলীয় দ্রবণ বিদ্যুৎ পরিবহণ করে না।"},{"id":"ch5-sq33","chapter":5,"num":33,"importance":2,"topic":"ধাতব বন্ধন","question":"সঞ্চরণশীল ইলেকট্রন বলতে কী বুঝায়?","boards":"কুমিল্লা বোর্ড ২০২৪","answer":"ধাতব পরমাণু কর্তৃক ত্যাগকৃত যে ইলেকট্রনগুলো কোনো নির্দিষ্ট পরমাণুর অধীনে না থেকে ধাতব স্ফটিকের পারমাণবিক শাঁসগুলোর মধ্যবর্তী স্থানে মুক্তভাবে ঘোরাফেরা করে, তাদেরকে সঞ্চরণশীল ইলেকট্রন বলে। এরা পুরো ধাতব খণ্ডের সব আয়নের ইলেকট্রন হয়ে যায়। ধাতুর তাপ ও বিদ্যুৎ পরিবাহিতা, নমনীয়তা, ঘাতসহতা ও ধাতব ঔজ্জ্বল্য এই সঞ্চরণশীল ইলেকট্রনের কারণেই হয়।"},{"id":"ch5-sq34","chapter":5,"num":34,"importance":2,"topic":"ধাতব বন্ধন","question":"ধাতু তাপ সুপরিবাহী কেন? ব্যাখ্যা কর।","boards":"বরিশাল বোর্ড ২০২৪","answer":"ধাতুতে প্রচুর সঞ্চরণশীল ইলেকট্রন থাকে । ধাতব পাতের এক প্রান্ত উত্তপ্ত করলে সেখানকার সঞ্চরণশীল ইলেকট্রনগুলো তাপশক্তি গ্রহণ করে এবং এদের গতিবেগ বেড়ে যায়। এই দ্রুতগতির ইলেকট্রনগুলো অধিক তাপমাত্রার প্রান্ত থেকে কম তাপমাত্রার প্রান্তের দিকে স্থানান্তরিত হয়ে শক্তি বহন করে নিয়ে যায়। ফলে অপর প্রান্তও দ্রুত গরম হয়, তাই ধাতু তাপ সুপরিবাহী।"},{"id":"ch5-sq35","chapter":5,"num":35,"importance":2,"topic":"ধাতব বন্ধন","question":"ধাতু বিদ্যুৎ পরিবাহী— ব্যাখ্যা কর।","boards":"ঢাকা বোর্ড ২০২১","answer":"বিদ্যুৎ পরিবহনের জন্য মুক্তভাবে চলাচলকারী চার্জিত কণা প্রয়োজন । ধাতব পরমাণু সর্বশেষ স্তরের ইলেকট্রন ত্যাগ করে পারমাণবিক শাঁসে পরিণত হয় এবং ত্যাগকৃত ইলেকট্রনগুলো সঞ্চরণশীল ইলেকট্রন হিসেবে সমগ্র ধাতব খণ্ডে মুক্তভাবে চলাচল করে। ধাতুর দুই প্রান্তে বিভব পার্থক্য প্রয়োগ করলে এই ইলেকট্রনগুলো ঋণাত্মক প্রান্ত থেকে ধনাত্মক প্রান্তের দিকে প্রবাহিত হয়ে বিদ্যুৎ পরিবহন করে। প্রচুর সঞ্চরণশীল ইলেকট্রন থাকায় ধাতু বিদ্যুৎ সুপরিবাহী।"},{"id":"ch6-sq1","chapter":6,"num":1,"importance":3,"topic":"মোল","question":"অ্যানালার গ্রেড পদার্থ বলতে কী বোঝায়? ব্যাখ্যা কর।","boards":"বরিশাল বোর্ড ২০২৬","answer":"যেসব রাসায়নিক পদার্থের বিশুদ্ধতা অত্যন্ত বেশি (প্রায় 99.9% বা তার বেশি) এবং যেগুলো রাসায়নিক বিশ্লেষণ ও গবেষণাগারে সূক্ষ্ম পরিমাপের কাজে ব্যবহার করা হয়, তাদের অ্যানালার গ্রেড (Analytical Reagent বা AR grade) পদার্থ বলে। এসব পদার্থে ভেজালের পরিমাণ খুবই নগণ্য এবং বোতলের লেবেলে উপস্থিত অপদ্রব্যের পরিমাণ উল্লেখ থাকে। যেমন: অ্যানালার গ্রেড Na₂CO₃, K₂Cr₂O₇ ইত্যাদি । এদের দিয়ে প্রমাণ দ্রবণ প্রস্তুত করলে ঘনমাত্রা সঠিক পাওয়া যায়।"},{"id":"ch6-sq2","chapter":6,"num":2,"importance":3,"topic":"মোল","question":"প্রমাণ অবস্থায় 10টি অ্যামোনিয়া অণুর আয়তন কত? নির্ণয় কর।","boards":"চট্টগ্রাম বোর্ড ২০২৬","answer":"প্রমাণ অবস্থায় 1 mol বা 6.02 × 10²³ টি NH₃ অণুর আয়তন 22.4 L। 6.02 × 10²³ টি NH₃ অণুর আয়তন = 22.4 L\n∴ 10টি NH₃ অণুর আয়তন =(22.4×10)/(6.02×10²³)L =3.72×10⁻²²L সুতরাং প্রমাণ অবস্থায় 10টি অ্যামোনিয়া অণুর আয়তন 3.72 × 10⁻²² L।"},{"id":"ch6-sq3","chapter":6,"num":3,"importance":3,"topic":"মোল","question":"STP তে অক্সিজেনের মোলার আয়তন ব্যাখ্যা কর।","boards":"কুমিল্লা বোর্ড ২০২৬","answer":"STP তে (0°C বা 273 K তাপমাত্রা ও 1 atm চাপে) যেকোনো গ্যাসের 1 মোলের আয়তনকে মোলার আয়তন বলে, যার মান 22.4 L। অক্সিজেনের আণবিক ভর 32, তাই 1 mol O₂ = 32 g। অর্থাৎ STP তে 32 g অক্সিজেন গ্যাস 22.4 L আয়তন দখল করে এবং এতে 6.02 × 10²³ টি O₂ অণু থাকে। STP তে 1 mol O₂=32gO₂=22.4LO₂"},{"id":"ch6-sq4","chapter":6,"num":4,"importance":3,"topic":"মোল","question":"সোডিয়াম সালফেটের সেমিমোলার দ্রবণ বলতে কী বোঝায়?","boards":"ঢাকা বোর্ড ২০২৬","answer":"সেমিমোলার দ্রবণ অর্থ 0.5 M দ্রবণ । অর্থাৎ নির্দিষ্ট তাপমাত্রায় প্রতি লিটার দ্রবণে 0.5 মোল দ্রব দ্রবীভূত থাকলে তাকে সেমিমোলার দ্রবণ বলে। Na₂SO₄ এর আণবিক ভর =23×2+32+16×4=142 0.5 মোল Na₂SO₄ = 142 × 0.5 g = 71 g সুতরাং, সোডিয়াম সালফেটের সেমিমোলার দ্রবণ বলতে বোঝায়, নির্দিষ্ট তাপমাত্রায় 1 লিটার দ্রবণে 71 g Na₂SO₄ দ্রবীভূত আছে।"},{"id":"ch6-sq5","chapter":6,"num":5,"importance":3,"topic":"মোল","question":"2.65g ডেসিমোলার Na₂CO₃ দ্রবণের আয়তন নির্ণয় কর।","boards":"দিনাজপুর বোর্ড ২০২৬","answer":"ডেসিমোলার দ্রবণের ঘনমাত্রা S=0.1mol/L Na₂CO₃ এর আণবিক ভর =(23×2)+12+(16×3)=106g/mol আমরা জানি, W = S × M × V বা, V=W/(S×M)=2.65/(0.1×106)L = 0.25 L = 250 mL অতএব, দ্রবণের আয়তন 250 mL।"},{"id":"ch6-sq6","chapter":6,"num":6,"importance":3,"topic":"মোল","question":"প্রমাণ অবস্থায় 2 লিটার SO₃ গ্যাসে কতটি অণু আছে?","boards":"যশোর বোর্ড ২০২৬","answer":"প্রমাণ অবস্থায় যেকোনো গ্যাসের 1 মোলের আয়তন 22.4 L এবং 1 মোলে অণুর সংখ্যা 6.02 × 10²³ টি। 22.4 L SO₃ গ্যাসে অণু থাকে 6.02 × 10²³ টি\n∴ 2 L SO₃ গ্যাসে অণু থাকে =(6.02×10²³ × 2)/22.4 টি =5.375×10²² টি অতএব, প্রমাণ অবস্থায় 2 লিটার SO₃ গ্যাসে 5.375 × 10²² টি অণু আছে।"},{"id":"ch6-sq7","chapter":6,"num":7,"importance":3,"topic":"মোল","question":"সেমিমোলার দ্রবণ একটি প্রমাণ দ্রবণ — ব্যাখ্যা কর।","boards":"মাদ্রাসা বোর্ড ২০২৬","answer":"নির্দিষ্ট তাপমাত্রায় যে দ্রবণের ঘনমাত্রা সঠিকভাবে জানা থাকে তাকে প্রমাণ দ্রবণ বলে। সেমিমোলার দ্রবণ হলো 0.5 M দ্রবণ, অর্থাৎ নির্দিষ্ট তাপমাত্রায় এক লিটার দ্রবণে 0.5 মোল দ্রব দ্রবীভূত থাকে। যেমন: 1 L দ্রবণে 0.5 × 40 = 20 g NaOH দ্রবীভূত থাকলে তা সেমিমোলার NaOH দ্রবণ । যেহেতু সেমিমোলার দ্রবণের ঘনমাত্রা (0.5 mol/L) সুনির্দিষ্টভাবে জানা, তাই এটি একটি প্রমাণ দ্রবণ ।"},{"id":"ch6-sq8","chapter":6,"num":8,"importance":3,"topic":"মোল","question":"দ্রবণের মোলারিটি তাপমাত্রার উপর নির্ভর করে — ব্যাখ্যা কর।","boards":"রাজশাহী বোর্ড ২০২৬","answer":"নির্দিষ্ট তাপমাত্রায় প্রতি লিটার দ্রবণে দ্রবীভূত দ্রবের মোল সংখ্যাকে মোলারিটি বলে। মোলারিটি, S = দ্রবের মোল সংখ্যা / দ্রবণের আয়তন (L) তাপমাত্রা বাড়লে তরল দ্রবণ প্রসারিত হয়ে আয়তন বাড়ে, আবার তাপমাত্রা কমলে আয়তন কমে। কিন্তু দ্রবের মোল সংখ্যা অপরিবর্তিত থাকে। ফলে তাপমাত্রা বাড়লে মোলারিটি কমে এবং তাপমাত্রা কমলে মোলারিটি বাড়ে । তাই দ্রবণের মোলারিটি তাপমাত্রার উপর নির্ভর করে।"},{"id":"ch6-sq9","chapter":6,"num":9,"importance":2,"topic":"মোল","question":"প্রমাণ অবস্থায় Cl₂ গ্যাসের মোলার আয়তন 22.4 লিটার—ব্যাখ্যা কর।","boards":"ময়মনসিংহ বোর্ড ২০২৫","answer":"প্রমাণ তাপমাত্রা (0°C) ও চাপে (1 atm) 1 মোল কোনো গ্যাস যে আয়তন দখল করে তাকে ঐ গ্যাসের মোলার আয়তন বলে; যেকোনো গ্যাসের ক্ষেত্রে এর মান 22.4 লিটার। Cl₂ এর আণবিক ভর =35.5×2=71। অর্থাৎ 71 g বা 1 মোল Cl₂ গ্যাস প্রমাণ অবস্থায় 22.4 লিটার আয়তন দখল করে। তাই প্রমাণ অবস্থায় Cl₂ গ্যাসের মোলার আয়তন 22.4 লিটার।"},{"id":"ch6-sq10","chapter":6,"num":10,"importance":2,"topic":"মোল","question":"অ্যামোনিয়া গ্যাসের মোলার আয়তন ব্যাখ্যা করো।","boards":"ঢাকা বোর্ড ২০২৫","answer":"প্রমাণ তাপমাত্রা ও চাপে 1 মোল কোনো গ্যাস যে আয়তন দখল করে তাকে ঐ গ্যাসের মোলার আয়তন বলে। NH₃ এর আণবিক ভর =14+1×3=17। অর্থাৎ 17 g বা 1 মোল NH₃ গ্যাসে 6.023 × 10²³ টি অণু থাকে এবং প্রমাণ অবস্থায় এটি 22.4 লিটার আয়তন দখল করে। এটিই অ্যামোনিয়ার মোলার আয়তন ।"},{"id":"ch6-sq11","chapter":6,"num":11,"importance":2,"topic":"মোল","question":"0.01M HCl দ্রবণ বলতে কী বোঝায়? ব্যাখ্যা কর।","boards":"সিলেট বোর্ড ২০২৪","answer":"নির্দিষ্ট তাপমাত্রায় 1 লিটার দ্রবণে 1 মোল দ্রব দ্রবীভূত থাকলে তাকে মোলার (1 M) দ্রবণ বলে। 0.01 M HCl দ্রবণ বলতে বোঝায়, নির্দিষ্ট তাপমাত্রায় 1 লিটার HCl দ্রবণে 0.01 মোল HCl দ্রবীভূত আছে। HCl এর আণবিক ভর =1+35.5=36.5, তাই 1 লিটার এ দ্রবণে 36.5×0.01=0.365gHCl থাকে।"},{"id":"ch6-sq12","chapter":6,"num":12,"importance":2,"topic":"মোল","question":"STP-তে মিথেনের মোলার আয়তন ব্যাখ্যা কর।","boards":"যশোর বোর্ড ২০২৪","answer":"STP তে মিথেনের মোলার আয়তন বলতে 1 মোল CH₄ গ্যাস প্রমাণ তাপমাত্রা ও চাপে যে আয়তন দখল করে তাকে বোঝায় । CH₄ এর আণবিক ভর =12+1×4=16। অর্থাৎ 16 g বা 1 মোল CH₄ গ্যাসের STP তে আয়তন 22.4 লিটার। তাই মিথেনের মোলার আয়তন 22.4 লিটার।"},{"id":"ch6-sq13","chapter":6,"num":13,"importance":2,"topic":"মোল","question":"M/2 Na₂CO₃ দ্রবণ বলতে কী বোঝায়?","boards":"সিলেট বোর্ড ২০২৩","answer":"নির্দিষ্ট তাপমাত্রায় 1 লিটার দ্রবণে 1 মোল দ্রব দ্রবীভূত থাকলে তাকে মোলার (M) দ্রবণ বলে। M/2 Na₂CO₃ বা সেমিমোলার (0.5 M) Na₂CO₃ দ্রবণ বলতে বোঝায়, নির্দিষ্ট তাপমাত্রায় 1 লিটার দ্রবণে 0.5 মোল Na₂CO₃ দ্রবীভূত আছে । Na₂CO₃ এর আণবিক ভর 106, তাই 1 লিটার এ দ্রবণে 106 × 0.5 = 53 g Na₂CO₃ থাকে।"},{"id":"ch6-sq14","chapter":6,"num":14,"importance":2,"topic":"মোল","question":"SO₂ এর মোলার আয়তন ব্যাখ্যা কর।","boards":"বরিশাল বোর্ড ২০২২","answer":"প্রমাণ তাপমাত্রা (0°C) ও চাপে (1 atm) 1 মোল কোনো গ্যাস যে আয়তন দখল করে তাকে ঐ গ্যাসের মোলার আয়তন বলে । SO₂ এর আণবিক ভর =32+16×2=64। অর্থাৎ 64 g বা 1 মোল SO₂ গ্যাসে 6.023 × 10²³ টি অণু থাকে এবং প্রমাণ অবস্থায় এটি 22.4 লিটার আয়তন দখল করে। তাই SO₂ এর মোলার আয়তন 22.4 লিটার।"},{"id":"ch6-sq15","chapter":6,"num":15,"importance":2,"topic":"মোল","question":"দ্রবণের ঘনমাত্রা তাপমাত্রার উপর নির্ভর করে কেন? ব্যাখ্যা কর।","boards":"ময়মনসিংহ বোর্ড ২০২২","answer":"দ্রবণের ঘনমাত্রা হলো নির্দিষ্ট আয়তনের দ্রবণে দ্রবীভূত দ্রবের পরিমাণ। তাপমাত্রা বাড়লে দ্রবণের কণাগুলোর গতিশক্তি বাড়ে ও আন্তঃআণবিক আকর্ষণ কমে, ফলে দ্রবণ প্রসারিত হয়ে আয়তন বেড়ে যায়। কিন্তু দ্রবের পরিমাণ একই থাকে, তাই একক আয়তনে দ্রবের পরিমাণ অর্থাৎ ঘনমাত্রা কমে যায়। আবার তাপমাত্রা কমালে আয়তন কমে ঘনমাত্রা বাড়ে । এজন্য দ্রবণের ঘনমাত্রা তাপমাত্রার উপর নির্ভর করে।"},{"id":"ch6-sq16","chapter":6,"num":16,"importance":2,"topic":"মোল","question":"মোলারিটি তাপমাত্রার উপর নির্ভর করে কেন? ব্যাখ্যা কর।","boards":"কুমিল্লা বোর্ড ২০২২","answer":"নির্দিষ্ট তাপমাত্রায় 1 লিটার দ্রবণে দ্রবীভূত দ্রবের মোল সংখ্যাকে ঐ দ্রবণের মোলারিটি বলে। মোলারিটি S = দ্রবের মোল সংখ্যা / দ্রবণের আয়তন (L) অর্থাৎ মোলারিটি দ্রবণের আয়তনের উপর নির্ভর করে । তাপমাত্রা বাড়লে দ্রবণের আয়তন বাড়ে কিন্তু দ্রবের মোল সংখ্যা একই থাকে, ফলে মোলারিটি কমে যায়। তাই মোলারিটি তাপমাত্রার উপর নির্ভরশীল ।"},{"id":"ch6-sq17","chapter":6,"num":17,"importance":2,"topic":"মোল","question":"0.25 M NaOH দ্রবণ বলতে কী বুঝায়? ব্যাখ্যা কর।","boards":"দিনাজপুর বোর্ড ২০২২","answer":"নির্দিষ্ট তাপমাত্রায় 1 লিটার দ্রবণে 1 মোল দ্রব দ্রবীভূত থাকলে তাকে মোলার (1 M) দ্রবণ বলে। 0.25 M NaOH দ্রবণ বলতে বোঝায়, নির্দিষ্ট তাপমাত্রায় 1 লিটার NaOH দ্রবণে 0.25 মোল NaOH দ্রবীভূত আছে। NaOH এর আণবিক ভর =23+16+1=40, তাই 1 লিটার এ দ্রবণে 40 × 0.25 = 10 g NaOH থাকে।"},{"id":"ch6-sq18","chapter":6,"num":18,"importance":3,"topic":"যৌগে মৌলের শতকরা সংযুতি","question":"একাধিক যৌগের স্থূল সংকেত একই হতে পারে –ব্যাখ্যা কর।","boards":"কুমিল্লা বোর্ড ২০২৪; রাজশাহী বোর্ড ২০২৩; যশোর বোর্ড ২০২২","answer":"স্থূল সংকেত অণুতে পরমাণুগুলোর প্রকৃত সংখ্যা নয়, কেবল তাদের সরল অনুপাত প্রকাশ করে। তাই একই মৌল দিয়ে গঠিত ভিন্ন ভিন্ন যৌগে পরমাণুর অনুপাত একই হলে তাদের স্থূল সংকেত একই হয়।\nযেমন: বেনজিন (C₆H₆) ও অ্যাসিটিলিন (C₂H₂) উভয়ই C ও H দিয়ে গঠিত এবং C : H = 1 : 1; তাই উভয়ের স্থূল সংকেত CH। আবার গ্লুকোজ (C₆H₁₂O₆) ও এসিটিক এসিডের (C₂H₄O₂) স্থূল সংকেত CH₂O। সুতরাং একই স্থূল সংকেত একাধিক যৌগের হতে পারে।"},{"id":"ch6-sq19","chapter":6,"num":19,"importance":3,"topic":"যৌগে মৌলের শতকরা সংযুতি","question":"পানির অণুতে উপস্থিত হাইড্রোজেন ও অক্সিজেনের শতকরা সংযুতি নির্ণয় করো।","boards":"সিলেট বোর্ড ২০২৬","answer":"পানির সংকেত H₂O।\nH₂O এর আণবিক ভর =(1×2)+16=18 H এর শতকরা পরিমাণ =(2×100)/18%=11.11% O এর শতকরা পরিমাণ =(16×100)/18%=88.89% সুতরাং পানিতে হাইড্রোজেন 11.11% এবং অক্সিজেন 88.89%।"},{"id":"ch6-sq20","chapter":6,"num":20,"importance":2,"topic":"যৌগে মৌলের শতকরা সংযুতি","question":"ইথিন ও বিউটিন এর স্থূল সংকেত একই–ব্যাখ্যা কর।","boards":"ঢাকা বোর্ড ২০২৪","answer":"ইথিনের আণবিক সংকেত C₂H₄ এবং বিউটিনের আণবিক সংকেত C₄H₈। উভয় যৌগ C ও H দিয়ে গঠিত । ইথিনে C : H = 2 : 4 = 1 : 2 এবং বিউটিনে C : H = 4 : 8 = 1 : 2। পরমাণুর সরল অনুপাত একই হওয়ায় উভয়ের স্থূল সংকেত CH₂। তাই ইথিন ও বিউটিনের স্থূল সংকেত একই।"},{"id":"ch6-sq21","chapter":6,"num":21,"importance":2,"topic":"যৌগে মৌলের শতকরা সংযুতি","question":"ইথাইন এবং বেনজিনের স্থূল সংকেত একই– ব্যাখ্যা কর।","boards":"ময়মনসিংহ বোর্ড ২০২৪","answer":"ইথাইনের আণবিক সংকেত C₂H₂ এবং বেনজিনের আণবিক সংকেত C₆H₆। উভয় যৌগ C ও H দিয়ে গঠিত । ইথাইনে C : H = 2 : 2 = 1 : 1 এবং বেনজিনে C : H = 6 : 6 = 1 : 1। পরমাণুর সরল অনুপাত একই হওয়ায় উভয়ের স্থূল সংকেত CH। তাই ইথাইন ও বেনজিনের স্থূল সংকেত একই।"},{"id":"ch6-sq22","chapter":6,"num":22,"importance":2,"topic":"যৌগে মৌলের শতকরা সংযুতি","question":"কোনো যৌগের আণবিক সংকেত ও স্থূল সংকেত একই হতে পারে কি? ব্যাখ্যা কর।","boards":"চট্টগ্রাম বোর্ড ২০২৪","answer":"হ্যাঁ, একই হতে পারে। স্থূল সংকেত পরমাণুর সরল অনুপাত এবং আণবিক সংকেত পরমাণুর প্রকৃত সংখ্যা নির্দেশ করে। আণবিক সংকেতের পরমাণু সংখ্যাগুলোকে 1 ছাড়া কোনো সাধারণ সংখ্যা দিয়ে ভাগ করা না গেলে দুটি সংকেত একই হয়।\nযেমন: সালফিউরিক এসিড H₂SO₄-এ H : S : O = 2 : 1 : 4, যা আর সরল করা যায় না; তাই এর স্থূল সংকেতও H₂SO₄। একইভাবে পানির (H₂O) আণবিক ও স্থূল সংকেত একই ।"},{"id":"ch6-sq23","chapter":6,"num":23,"importance":2,"topic":"যৌগে মৌলের শতকরা সংযুতি","question":"খাদ্য লবণে ক্লোরিনের শতকরা সংযুতি নির্ণয় কর।","boards":"চট্টগ্রাম বোর্ড ২০২৩","answer":"খাদ্য লবণ = NaCl; আণবিক ভর =23+35.5=58.5 Cl-এর শতকরা সংযুতি =(35.5×1×100)/58.5%=60.68% সুতরাং, খাদ্য লবণে ক্লোরিনের শতকরা সংযুতি 60.68%।"},{"id":"ch6-sq24","chapter":6,"num":24,"importance":2,"topic":"যৌগে মৌলের শতকরা সংযুতি","question":"আণবিক সংকেত স্থূল সংকেতের সমান বা এর গুণিতক- ব্যাখ্যা কর।","boards":"চট্টগ্রাম বোর্ড ২০২২","answer":"আণবিক সংকেত = (স্থূল সংকেত)n, যেখানে n = আণবিক ভর / স্থূল সংকেতের ভর, এবং n একটি পূর্ণসংখ্যা (1, 2, 3 …)। n = 1 হলে আণবিক সংকেত স্থূল সংকেতের সমান, যেমন: H₂O, H₂SO₄। n \u003e 1 হলে আণবিক সংকেত স্থূল সংকেতের গুণিতক,\nযেমন: বেনজিনের স্থূল সংকেত CH-কে 6 দিয়ে গুণ করলে আণবিক সংকেত C₆H₆ পাওয়া যায়। তাই আণবিক সংকেত স্থূল সংকেতের সমান বা এর গুণিতক।"},{"id":"ch6-sq25","chapter":6,"num":25,"importance":3,"topic":"রাসায়নিক বিক্রিয়া ও রাসায়নিক সমীকরণ","question":"C₂H₆+O₂⟶CO₂+H₂O; সমীকরণটির সমতাকরণ\nব্যাখ্যা কর।","boards":"ময়মনসিংহ বোর্ড ২০২৬","answer":"বাম পাশে C পরমাণু 2টি, তাই ডান পাশে CO₂ এর আগে 2 বসাই; বাম পাশে H পরমাণু 6টি, তাই H₂O এর আগে 3 বসাই:\nC₂H₆+O₂→2CO₂+3H₂O\nএখন ডান পাশে O পরমাণু =4+3=7টি। বাম পাশে 7টি O পেতে O₂ এর আগে 7/2 বসাই এবং ভগ্নাংশ দূর করতে সমগ্র সমীকরণকে 2 দ্বারা গুণ করি:\nΔ\n2C₂H₆+7O₂⟶4CO₂+6H₂O\nএখন উভয় পাশে C = 4, H = 12 এবং O = 14টি; অর্থাৎ সমীকরণটি সমতাকৃত ।"},{"id":"ch6-sq26","chapter":6,"num":26,"importance":3,"topic":"লিমিটিং বিক্রিয়ক","question":"লিমিটিং বিক্রিয়কই উৎপাদনের পরিমাণ নির্ধারণ করে —ব্যাখ্যা কর।","boards":"কুমিল্লা বোর্ড ২০২৬","answer":"কোনো রাসায়নিক বিক্রিয়ায় যে বিক্রিয়ক সবচেয়ে কম পরিমাণে (সমীকরণের মোল অনুপাতের তুলনায়) উপস্থিত থাকে এবং সম্পূর্ণরূপে খরচ হয়ে যায়, তাকে লিমিটিং বিক্রিয়ক বলে। লিমিটিং বিক্রিয়ক শেষ হয়ে গেলে অপর বিক্রিয়ক অবশিষ্ট থাকলেও বিক্রিয়া আর চলতে পারে না। তাই উৎপাদের পরিমাণ লিমিটিং বিক্রিয়কের পরিমাণের উপর নির্ভর করে।\n2H₂+O₂→2H₂O\nযেমন: 2 mol H₂ ও 2 mol O₂ নিলে 2 mol H₂ কেবল 1 mol O₂ এর সাথে বিক্রিয়া করে 2 mol H₂O উৎপন্ন করে; 1 mol O₂ অবশিষ্ট থাকে। এখানে H₂ লিমিটিং বিক্রিয়ক এবং এটিই উৎপাদের (H₂O) পরিমাণ নির্ধারণ করে।"},{"id":"ch6-sq27","chapter":6,"num":27,"importance":2,"topic":"লিমিটিং বিক্রিয়ক","question":"লিমিটিং বিক্রিয়ক থেকে উৎপাদের পরিমাণ হিসাব করা হয় কেন? ব্যাখ্যা কর।","boards":"কুমিল্লা বোর্ড ২০২২","answer":"একাধিক বিক্রিয়কের মধ্যে যে বিক্রিয়কের পরিমাণ স্টয়কিওমিতি পরিমাণ থেকে কম থাকে তা লিমিটিং বিক্রিয়ক । বিক্রিয়ায় এটি সম্পূর্ণ নিঃশেষ হয়ে যায়। লিমিটিং বিক্রিয়ক শেষ হলে অন্য বিক্রিয়ক উদ্বৃত্ত থাকলেও আর কোনো উৎপাদ তৈরি হয় না। অর্থাৎ উৎপাদের পরিমাণ লিমিটিং বিক্রিয়কের পরিমাণের উপর নির্ভরশীল । উদ্বৃত্ত বিক্রিয়ক থেকে হিসাব করলে উৎপাদ প্রকৃতের চেয়ে বেশি আসবে, তাই উৎপাদের পরিমাণ লিমিটিং বিক্রিয়ক থেকে হিসাব করা হয়।"},{"id":"ch6-sq28","chapter":6,"num":28,"importance":2,"topic":"উৎপাদের শতকরা পরিমাণ হিসাব","question":"উৎপাদের শতকরা পরিমাণ বলতে কী বুঝায়? ব্যাখ্যা কর।","boards":"যশোর বোর্ড ২০২৫","answer":"কোনো বিক্রিয়ায় সমীকরণ থেকে হিসাবকৃত (তাত্ত্বিক) উৎপাদের তুলনায় প্রকৃতপক্ষে যে পরিমাণ উৎপাদ পাওয়া যায় তার শতকরা হারকে উৎপাদের শতকরা পরিমাণ বলে। উৎপাদের শতকরা পরিমাণ = (প্রাপ্ত প্রকৃত উৎপাদ × 100)/(সমীকরণ থেকে হিসাবকৃত উৎপাদ) বিক্রিয়ক 100% বিশুদ্ধ না হওয়ায় প্রকৃত উৎপাদ তাত্ত্বিক উৎপাদের চেয়ে কম হয়। যেমন: 2g Mg থেকে 3.33g MgO পাওয়ার কথা, কিন্তু পাওয়া গেল 3.25g; তাই উৎপাদের শতকরা পরিমাণ = (3.25×100)/3.33=97.6%।"},{"id":"ch7-sq1","chapter":7,"num":1,"importance":3,"topic":"পদার্থের পরিবর্তন","question":"কেরোসিনের দহন একটি রাসায়নিক পরিবর্তন —ব্যাখ্যা কর।","boards":"বরিশাল বোর্ড ২০২৫; রাজশাহী বোর্ড ২০২৩","answer":"কেরোসিন বিভিন্ন হাইড্রোকার্বনের মিশ্রণ । দহনের সময় কেরোসিন বায়ুর অক্সিজেনের সাথে বিক্রিয়া করে কার্বন ডাইঅক্সাইড, জলীয় বাষ্প ও তাপ উৎপন্ন করে।\n2CnH₂n+2+(3n+1)O₂→2nCO₂+2(n+1)H₂O+তাপ\nউৎপন্ন CO₂ ও H₂O এর ধর্ম কেরোসিন থেকে সম্পূর্ণ ভিন্ন এবং এদের থেকে কেরোসিন আর ফিরে পাওয়া যায় না। নতুন পদার্থ সৃষ্টি হয় বলে কেরোসিনের দহন একটি রাসায়নিক পরিবর্তন ।"},{"id":"ch7-sq2","chapter":7,"num":2,"importance":2,"topic":"পদার্থের পরিবর্তন","question":"লোহায় মরিচা পড়া একটি রাসায়নিক পরিবর্তন – ব্যাখ্যা কর।","boards":"ঢাকা বোর্ড ২০২৩","answer":"জলীয় বাষ্পের উপস্থিতিতে লোহা বায়ুর অক্সিজেনের সাথে বিক্রিয়া করে আর্দ্র ফেরিক অক্সাইড বা মরিচা উৎপন্ন করে ।\n4Fe+3O₂+2nH₂O→2Fe₂O₃.nH₂O\nউৎপন্ন মরিচার ধর্ম লোহা, অক্সিজেন ও পানি থেকে সম্পূর্ণ ভিন্ন এবং সহজে মরিচা থেকে লোহা ফেরানো যায় না। নতুন ধর্মের পদার্থ সৃষ্টি হয় বলে লোহায় মরিচা পড়া রাসায়নিক পরিবর্তন ।"},{"id":"ch7-sq3","chapter":7,"num":3,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"উভমুখী বিক্রিয়াকে তুমি কীভাবে একমুখী বিক্রিয়ায় রূপান্তর করবে?","boards":"দিনাজপুর বোর্ড ২০২৫; ময়মনসিংহ বোর্ড ২০২২; বরিশাল বোর্ড ২০২০","answer":"উভমুখী বিক্রিয়ায় উৎপাদগুলো পরস্পর বিক্রিয়া করে আবার বিক্রিয়কে পরিণত হয়। যদি উৎপন্ন উৎপাদগুলোর যেকোনো একটিকে বিক্রিয়া মাধ্যম থেকে সরিয়ে নেওয়া হয়, তবে উৎপাদগুলো আর বিক্রিয়া করে বিক্রিয়ক তৈরি করতে পারে না; ফলে বিক্রিয়াটি একমুখী হয়ে যায়। যেমন, খোলা পাত্রে CaCO₃ কে তাপ দিলে উৎপন্ন CO₂ গ্যাস বের হয়ে যায়, তাই CaO আর CaCO₃ এ পরিণত হয় না।\nতাপ\nCaCO₃(s)⟶CaO(s)+CO₂(g)"},{"id":"ch7-sq4","chapter":7,"num":4,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"প্রশমন বিক্রিয়া নন রেডক্স কেন? ব্যাখ্যা কর।","boards":"যশোর বোর্ড ২০২৪; ময়মনসিংহ বোর্ড ২০২৪; রাজশাহী বোর্ড ২০২০","answer":"যে বিক্রিয়ায় ইলেকট্রনের আদান-প্রদান ঘটে (জারণ সংখ্যার পরিবর্তন হয়) তাকে রেডক্স বিক্রিয়া বলে। প্রশমন বিক্রিয়ায় এসিডের H⁺ ও ক্ষারের OH⁻ যুক্ত হয়ে পানি তৈরি করে; বাকি আয়নগুলো (যেমন Na⁺, Cl⁻) দ্রবণে দর্শক আয়ন হিসেবে থাকে।\nH⁺+OH⁻→H₂O\nএখানে কোনো পরমাণুর জারণ সংখ্যা পরিবর্তিত হয় না (H=+1, O = -2 অপরিবর্তিত), অর্থাৎ ইলেকট্রন স্থানান্তর ঘটে না। তাই প্রশমন বিক্রিয়া নন-রেডক্স বিক্রিয়া ।"},{"id":"ch7-sq5","chapter":7,"num":5,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"যোজনী ও জারণ সংখ্যা এক নয় কেন? ব্যাখ্যা কর।","boards":"চট্টগ্রাম বোর্ড ২০২৪; যশোর বোর্ড ২০২০","answer":"যোজনী হলো একটি মৌল অন্য মৌলের সাথে যুক্ত হওয়ার সামর্থ্য; এটি সর্বদা পূর্ণসংখ্যা এবং ধনাত্মক বা ঋণাত্মক হয় না। অন্যদিকে জারণ সংখ্যা হলো পরমাণু বা আয়নে উপস্থিত চিহ্নসহ চার্জ সংখ্যা; এটি ধনাত্মক, ঋণাত্মক, শূন্য এমনকি ভগ্নাংশও হতে পারে (যেমন KO₂ এ O=-1/2)। তাছাড়া একই মৌলের জারণ সংখ্যা বিভিন্ন যৌগে বিভিন্ন হয় (Fe এ 0, FeSO₄ এ +2)। তাই যোজনী ও জারণ সংখ্যা এক নয়।"},{"id":"ch7-sq6","chapter":7,"num":6,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"অ্যামোনিয়াম সায়ানেট থেকে ইউরিয়া উৎপাদন সমানুকরণ বিক্রিয়া —ব্যাখ্যা কর।","boards":"বরিশাল বোর্ড ২০২৬","answer":"যে বিক্রিয়ায় কোনো যৌগের আণবিক সংকেত অপরিবর্তিত থেকে কেবল পরমাণুগুলোর বিন্যাস পরিবর্তিত হয়ে নতুন গাঠনিক সংকেতবিশিষ্ট যৌগ উৎপন্ন হয়, তাকে সমানুকরণ বিক্রিয়া বলে । অ্যামোনিয়াম সায়ানেটকে তাপ দিলে ইউরিয়া উৎপন্ন হয়:\nতাপ\nNH₄CNO⟶(NH₂)₂CO\nএখানে বিক্রিয়ক অ্যামোনিয়াম সায়ানেট (অজৈব) ও উৎপাদ ইউরিয়া (জৈব) উভয়ের আণবিক সংকেত CH₄N₂O, কিন্তু তাদের গঠন ও ধর্ম ভিন্ন। তাই এটি একটি সমানুকরণ বিক্রিয়া ।"},{"id":"ch7-sq7","chapter":7,"num":7,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"রাসায়নিক সাম্যাবস্থা একটি গতিময় অবস্থা —ব্যাখ্যা কর।","boards":"কুমিল্লা বোর্ড ২০২৬","answer":"উভমুখী বিক্রিয়ায় যে অবস্থায় সম্মুখমুখী বিক্রিয়ার হার ও পশ্চাৎমুখী বিক্রিয়ার হার সমান হয়, তাকে রাসায়নিক সাম্যাবস্থা বলে।\nN₂(g)+3H₂(g)⇌2NH₃(g)\nসাম্যাবস্থায় বিক্রিয়ক ও উৎপাদের পরিমাণ স্থির মনে হলেও বিক্রিয়া থেমে যায় না; সম্মুখ দিকে যে হারে NH₃ উৎপন্ন হয়, ঠিক একই হারে পশ্চাৎ দিকে NH₃ বিযোজিত হয়ে N₂ ও H₂ উৎপন্ন হয়। উভয় দিকে বিক্রিয়া সমান হারে অবিরাম চলতে থাকে বলে রাসায়নিক সাম্যাবস্থা একটি গতিময় অবস্থা ।"},{"id":"ch7-sq8","chapter":7,"num":8,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"K₂Cr₂O₇ যৌগে Cr পরমাণুর জারণ সংখ্যা হিসাব কর।","boards":"ঢাকা বোর্ড ২০২৬","answer":"ধরি, K₂Cr₂O₇ যৌগে Cr এর জারণ সংখ্যা x। K এর জারণ সংখ্যা +1 এবং O এর জারণ সংখ্যা -2। নিরপেক্ষ যৌগে সকল পরমাণুর জারণ সংখ্যার যোগফল শূন্য। 2×(+1)+2x+7×(-2)=0 বা, 2+2x-14=0 বা, 2x = 12\n∴ x=+6 অতএব, K₂Cr₂O₇ যৌগে Cr পরমাণুর জারণ সংখ্যা +6।"},{"id":"ch7-sq9","chapter":7,"num":9,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"‘সাম্যাবস্থায় সকল উভমুখী বিক্রিয়াই চলমান থাকে ’— ব্যাখ্যা কর।","boards":"ঢাকা বোর্ড ২০২৬","answer":"কোনো উভমুখী বিক্রিয়ায় যখন সম্মুখমুখী বিক্রিয়ার হার ও পশ্চাৎমুখী বিক্রিয়ার হার সমান হয়, তখন সেই অবস্থাকে রাসায়নিক সাম্যাবস্থা বলে। সাম্যাবস্থায় বিক্রিয়া থেমে যায় না; বিক্রিয়ক থেকে উৎপাদ এবং উৎপাদ থেকে বিক্রিয়ক একই হারে উৎপন্ন হতে থাকে। তাই বাহ্যিকভাবে বিক্রিয়ক ও উৎপাদের ঘনমাত্রা স্থির মনে হলেও উভয়মুখী বিক্রিয়া চলমান থাকে ।\nN₂(g)+3H₂(g)⇌2NH₃(g)\nএজন্য রাসায়নিক সাম্যাবস্থাকে গতিশীল সাম্যাবস্থা বলা হয়।"},{"id":"ch7-sq10","chapter":7,"num":10,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"অক্সিজেনের জারণসংখ্যা একাধিক হতে পারে —ব্যাখ্যা কর।","boards":"ময়মনসিংহ বোর্ড ২০২৬","answer":"যৌগে অক্সিজেন কোন মৌলের সাথে যুক্ত আছে তার ওপর অক্সিজেনের জারণসংখ্যা নির্ভর করে।\n• সাধারণ অক্সাইডে (যেমন H₂O, MgO) অক্সিজেনের জারণসংখ্যা -2।\n• পার-অক্সাইডে (যেমন H₂O₂, Na₂O₂) অক্সিজেনের জারণসংখ্যা -1।\n• OF₂ যৌগে অধিক তড়িৎ ঋণাত্মক F এর সাথে যুক্ত থাকায় অক্সিজেনের জারণসংখ্যা +2; মুক্ত অবস্থায় (O₂) জারণসংখ্যা 0। তাই অক্সিজেনের জারণসংখ্যা একাধিক হতে পারে।"},{"id":"ch7-sq11","chapter":7,"num":11,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"উভয়মুখী বিক্রিয়াকে কীভাবে একমুখী করা যায়?","boards":"ময়মনসিংহ বোর্ড ২০২৬","answer":"উভমুখী বিক্রিয়ায় উৎপন্ন উৎপাদকে বিক্রিয়ার মাধ্যম থেকে ক্রমাগত সরিয়ে নিলে পশ্চাৎমুখী বিক্রিয়া ঘটতে পারে না, ফলে বিক্রিয়াটি একমুখী হয়ে যায়।\nযেমন: বদ্ধ পাত্রে CaCO₃ কে তাপ দিলে বিক্রিয়াটি উভমুখী হয়:\nCaCO₃(s)⇌CaO(s)+CO₂(g)\nকিন্তু খোলা পাত্রে তাপ দিলে উৎপন্ন CO₂ গ্যাস বাতাসে বেরিয়ে যায় এবং CaO এর সাথে পুনরায় বিক্রিয়া করতে পারে না। ফলে\nΔ\nবিক্রিয়াটি একমুখী হয়: CaCO₃⟶CaO+CO₂"},{"id":"ch7-sq12","chapter":7,"num":12,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"H₂+Cl₂→2HCl, বিক্রিয়াটি সংশ্লেষণ — ব্যাখ্যা\nকরো।","boards":"সিলেট বোর্ড ২০২৬","answer":"যে বিক্রিয়ায় দুই বা ততোধিক মৌল বা যৌগ পরস্পরের সাথে যুক্ত হয়ে একটি নতুন যৌগ উৎপন্ন করে, তাকে সংশ্লেষণ বিক্রিয়া বলে।\nH₂+Cl₂→2HCl\nএখানে দুটি মৌল হাইড্রোজেন ও ক্লোরিন সরাসরি যুক্ত হয়ে একটিমাত্র নতুন যৌগ হাইড্রোজেন ক্লোরাইড উৎপন্ন করেছে । তাই বিক্রিয়াটি সংশ্লেষণ বিক্রিয়া ।"},{"id":"ch7-sq13","chapter":7,"num":13,"importance":2,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"ধাতব হাইড্রাইডে হাইড্রোজেনের জারণ সংখ্যা –1 ব্যাখ্যা কর।","boards":"ঢাকা বোর্ড ২০২৫","answer":"অধিকাংশ যৌগে হাইড্রোজেন অধিক তড়িৎ ঋণাত্মক মৌলের সাথে যুক্ত থাকে বলে এর জারণ সংখ্যা +1 হয়। কিন্তু ধাতব হাইড্রাইডে (যেমন NaH, LiH, CaH₂) হাইড্রোজেন ধাতুর চেয়ে বেশি তড়িৎ ঋণাত্মক । এখানে ধাতু ইলেকট্রন ত্যাগ করে ধনাত্মক আয়ন হয় এবং হাইড্রোজেন সেই ইলেকট্রন গ্রহণ করে হাইড্রাইড আয়ন (H⁻) গঠন করে।\n2Na+H₂→2Na⁺H⁻\nতাই ধাতব হাইড্রাইডে হাইড্রোজেনের জারণ সংখ্যা -1।"},{"id":"ch7-sq14","chapter":7,"num":14,"importance":2,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"KMnO₄ যৌগে Mn এর জারণ সংখ্যা নির্ণয় কর।","boards":"রাজশাহী বোর্ড ২০২৫","answer":"ধরি, KMnO₄ যৌগে Mn এর জারণ সংখ্যা x; K এর জারণ সংখ্যা +1 এবং O এর জারণ সংখ্যা -2। নিরপেক্ষ যৌগে মোট জারণ সংখ্যা শূন্য। (+1)+x+4×(-2)=0 বা, x - 7 = 0 বা, x=+7 সুতরাং, KMnO₄ যৌগে Mn এর জারণ সংখ্যা +7।"},{"id":"ch7-sq15","chapter":7,"num":15,"importance":2,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"\"Na⁺\" একটি জারক – ব্যাখ্যা কর।","boards":"সিলেট বোর্ড ২০২৪","answer":"যে পদার্থ ইলেকট্রন গ্রহণ করে (নিজে বিজারিত হয়) তাকে জারক বলে। Na⁺ আয়ন একটি ইলেকট্রন গ্রহণ করে Na পরমাণুতে পরিণত হতে পারে।\nNa⁺+e⁻→Na\nএতে Na এর জারণ সংখ্যা +1 থেকে 0 তে হ্রাস পায়, অর্থাৎ Na⁺ বিজারিত হয়। ইলেকট্রন গ্রহণ করতে পারে বলে Na⁺ একটি জারক।"},{"id":"ch7-sq16","chapter":7,"num":16,"importance":2,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"যোজনী এবং জারণ সংখ্যার মধ্যে পার্থক্য লিখ।","boards":"রাজশাহী বোর্ড ২০২৪","answer":"যোজনী জারণ সংখ্যা\n১. একটি মৌল অন্য মৌলের ১. পরমাণু বা আয়নে উপস্থিত সাথে যুক্ত হওয়ার সামর্থ্য । চিহ্নসহ চার্জ সংখ্যা।\n২. যোজনী ধনাত্মক বা ঋণাত্মক ২. জারণ সংখ্যা ধনাত্মক বা হয় না। ঋণাত্মক হতে পারে।\n৩. যোজনী সর্বদা পূর্ণসংখ্যা । ৩. জারণ সংখ্যা ভগ্নাংশও হতে পারে।\n৪. শুধু নিষ্ক্রিয় গ্যাসের যোজনী ৪. যেকোনো মুক্ত মৌলের জারণ শূন্য। সংখ্যা শূন্য।"},{"id":"ch7-sq17","chapter":7,"num":17,"importance":2,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"যৌগে ক্ষার ধাতুসমূহের জারণ সংখ্যা +1 ব্যাখ্যা কর।","boards":"সিলেট বোর্ড ২০২৪","answer":"ক্ষার ধাতুসমূহ (Li, Na, K, Rb, Cs) গ্রুপ-1 এর মৌল; এদের সর্বশেষ শক্তিস্তরে মাত্র 1টি ইলেকট্রন থাকে। যৌগ গঠনের সময় এরা এই একটি ইলেকট্রন ত্যাগ করে নিকটতম নিষ্ক্রিয় গ্যাসের ইলেকট্রন বিন্যাস অর্জন করে এবং +1 চার্জযুক্ত আয়নে পরিণত হয়।\nNa→Na⁺+e⁻\nএজন্য যৌগে (যেমন NaCl, KOH) ক্ষার ধাতুর জারণ সংখ্যা সর্বদা +1।"},{"id":"ch7-sq18","chapter":7,"num":18,"importance":2,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"প্রশমন বিক্রিয়ায় তাপশক্তি ধ্রুব থাকে কেন? ব্যাখ্যা কর।","boards":"যশোর বোর্ড ২০২৪","answer":"1 মোল পানি উৎপন্ন হতে যে তাপ উৎপন্ন হয় তাকে প্রশমন\nতাপ বলে। যেকোনো তীব্র এসিড জলীয় দ্রবণে সম্পূর্ণ আয়নিত হয়ে H⁺ এবং যেকোনো তীব্র ক্ষার OH⁻ সরবরাহ করে; লবণের আয়নগুলো দ্রবণে আয়ন হিসেবেই থাকে।\nH⁺(aq)+OH⁻(aq)→H₂O(l)+57.34kJ\nফলে এসিড বা ক্ষার যা-ই নেওয়া হোক, প্রকৃত বিক্রিয়া সবসময় একই এবং প্রতি মোল পানি উৎপন্ন হতে একই পরিমাণ (57.34 kJ) তাপ উৎপন্ন হয়। তাই তীব্র এসিড ও তীব্র ক্ষারের প্রশমন তাপ ধ্রুব থাকে।"},{"id":"ch7-sq19","chapter":7,"num":19,"importance":2,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"Fe²⁺ জারক ও বিজারক হিসাবে কাজ করে-ব্যাখ্যা কর।","boards":"চট্টগ্রাম বোর্ড ২০২৩","answer":"Fe²⁺ আয়নে Fe এর জারণ সংখ্যা +2, যা Fe এর সর্বনিম্ন (0) ও সর্বোচ্চ (+3) জারণ অবস্থার মাঝামাঝি । তাই এটি ইলেকট্রন ত্যাগ ও গ্রহণ দুটোই করতে পারে।\nFe²⁺→Fe³⁺+e⁻\nএখানে Fe²⁺ ইলেকট্রন ত্যাগ করে জারিত হয়, অর্থাৎ বিজারক হিসেবে কাজ করে।\nFe²⁺+2e⁻→Fe\nএখানে Fe²⁺ ইলেকট্রন গ্রহণ করে বিজারিত হয়, অর্থাৎ জারক হিসেবে কাজ করে। তাই Fe²⁺ জারক ও বিজারক উভয় হিসেবেই কাজ করে।"},{"id":"ch7-sq20","chapter":7,"num":20,"importance":2,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"'সকল সংশ্লেষণ বিক্রিয়া সংযোজন বিক্রিয়া নয়' -ব্যাখ্যা কর?","boards":"দিনাজপুর বোর্ড ২০২৩","answer":"দুই বা ততোধিক রাসায়নিক পদার্থ (মৌল বা যৌগ) যুক্ত হয়ে একটিমাত্র উৎপাদ তৈরি হলে তা সংযোজন বিক্রিয়া । আর যেসব সংযোজন বিক্রিয়ায় শুধু মৌলিক পদার্থ যুক্ত হয়ে যৌগ গঠন করে সেগুলোকে সংশ্লেষণ বিক্রিয়া বলে। যেমন:\nN₂+3H₂→2NH₃ (সংশ্লেষণ ও সংযোজন উভয়ই)\n2FeCl₂+Cl₂→2FeCl₃ (শুধু সংযোজন)\nদ্বিতীয় বিক্রিয়ায় যৌগ (FeCl₂) অংশ নিয়েছে বলে এটি সংশ্লেষণ নয়। অর্থাৎ প্রত্যেক সংশ্লেষণ বিক্রিয়াই সংযোজন বিক্রিয়া, কিন্তু সকল সংযোজন বিক্রিয়া সংশ্লেষণ বিক্রিয়া নয়; সংশ্লেষণ হলো সংযোজন বিক্রিয়ার একটি বিশেষ রূপ।"},{"id":"ch7-sq21","chapter":7,"num":21,"importance":2,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"Mg+CuSO₄→MgSO₄+Cu; বিক্রিয়াটিতে সালফেট\nআয়ন দর্শক আয়ন – ব্যাখ্যা কর।","boards":"ঢাকা বোর্ড ২০২২","answer":"Mg+CuSO₄→MgSO₄+Cu\nআয়নিত রূপে: Mg+Cu²⁺+SO₄²⁻→Mg²⁺+SO₄²⁻+\nCu এখানে Mg এর জারণ সংখ্যা 0 থেকে +2 হয়েছে (জারণ, Mg বিজারক) এবং Cu এর জারণ সংখ্যা +2 থেকে 0 হয়েছে (বিজারণ, Cu²⁺ জারক)। কিন্তু SO₄²⁻ আয়ন বিক্রিয়ার আগে ও পরে একই রূপে থাকে এবং এর চার্জ -2 অপরিবর্তিত থাকে; এটি ইলেকট্রন আদান-প্রদানে অংশ নেয় না। তাই এ বিক্রিয়ায় সালফেট আয়ন দর্শক আয়ন ।"},{"id":"ch7-sq22","chapter":7,"num":22,"importance":2,"topic":"বিশেষ ধরনের রাসায়নিক বিক্রিয়া","question":"সমাণুকরণ বিক্রিয়া বলতে কী বুঝ? ব্যাখ্যা করো।","boards":"বরিশাল বোর্ড ২০২৫","answer":"দুটি যৌগের আণবিক সংকেত একই কিন্তু গাঠনিক সংকেত ভিন্ন হলে তারা পরস্পরের সমাণু । একটি সমাণু থেকে পরমাণুর পুনর্বিন্যাসের মাধ্যমে অপর একটি সমাণু তৈরির প্রক্রিয়াকে সমাণুকরণ বিক্রিয়া বলে। যেমন, অ্যামোনিয়াম সায়ানেটকে তাপ দিলে তার সমাণু ইউরিয়া উৎপন্ন হয়:\nতাপ\nNH₄CNO⟶H₂N-CO-NH₂"},{"id":"ch7-sq23","chapter":7,"num":23,"importance":2,"topic":"বিশেষ ধরনের রাসায়নিক বিক্রিয়া","question":"সমাণুকরণ বিক্রিয়ায় পরমাণুর পুনর্বিন্যাস ঘটে- ব্যাখ্যা কর।","boards":"চট্টগ্রাম বোর্ড ২০২২","answer":"তাপ\nNH₄CNO⟶H₂N-CO-NH₂\nঅ্যামোনিয়াম সায়ানেট ও ইউরিয়া উভয়ের আণবিক সংকেত CH₄N₂O। বিক্রিয়ায় কোনো পরমাণু যোগ হয় না বা বাদ যায় না;\nতাপের প্রভাবে একই পরমাণুগুলো শুধু ভিন্নভাবে সজ্জিত হয়ে নতুন গাঠনিক সংকেতের যৌগ ইউরিয়া তৈরি করে। তাই সমাণুকরণ বিক্রিয়ায় পরমাণুর পুনর্বিন্যাস ঘটে মাত্র।"},{"id":"ch7-sq24","chapter":7,"num":24,"importance":3,"topic":"বাস্তব ক্ষেত্রে সংঘটিত কয়েকটি রাসায়নিক বিক্রিয়ার উদাহরণ","question":"পিঁপড়া কামড়ালে চুন ব্যবহার করা হয় কেন? ব্যাখ্যা কর।","boards":"যশোর বোর্ড ২০২৫; বরিশাল বোর্ড ২০২২; সিলেট বোর্ড ২০২০","answer":"পিঁপড়ার মুখে ফরমিক এসিড (HCOOH) থাকে, যা কামড়ের স্থানে জ্বালা-যন্ত্রণা সৃষ্টি করে। চুন ক্ষারধর্মী পদার্থ । ক্ষতস্থানে চুন লাগালে তা এসিডকে প্রশমিত করে লবণ ও পানি উৎপন্ন করে, ফলে জ্বালা-যন্ত্রণা দূর হয়।\nCa(OH)₂+2HCOOH→(HCOO)₂Ca+2H₂O"},{"id":"ch7-sq25","chapter":7,"num":25,"importance":3,"topic":"বাস্তব ক্ষেত্রে সংঘটিত কয়েকটি রাসায়নিক বিক্রিয়ার উদাহরণ","question":"মৌমাছির কামড়ের ক্ষতস্থানে চুন ব্যবহার করা হয় কেন?","boards":"যশোর বোর্ড ২০২৪; চট্টগ্রাম বোর্ড ২০২৩","answer":"মৌমাছির হুলে এক ধরনের এসিড থাকে, যা হুল ফোটানোর স্থানে জ্বালা-যন্ত্রণা সৃষ্টি করে। চুন একটি ক্ষারক । ক্ষতস্থানে চুন লাগালে এসিড-ক্ষারক প্রশমন বিক্রিয়ায় লবণ ও পানি তৈরি হয় এবং এসিডের ক্রিয়া নষ্ট হয়। ফলে জ্বালা-যন্ত্রণা বন্ধ হয়ে যায়।"},{"id":"ch7-sq26","chapter":7,"num":26,"importance":2,"topic":"বাস্তব ক্ষেত্রে সংঘটিত কয়েকটি রাসায়নিক বিক্রিয়ার উদাহরণ","question":"Cu এর দ্রব্যাদির ক্ষয় হয় না কেন? ব্যাখ্যা কর।","boards":"ঢাকা বোর্ড ২০২২","answer":"Cu এর দ্রব্যাদি বাতাসের অক্সিজেনের সংস্পর্শে এলে এর পৃষ্ঠে CuO এর একটি পাতলা আস্তরণ পড়ে ।\n2Cu+O₂→2CuO\nএ আস্তরণ ভেদ করে অক্সিজেন আর ভেতরের Cu এর সংস্পর্শে আসতে পারে না, ফলে আর বিক্রিয়া ঘটে না। এভাবে CuO আস্তরণ Cu কে রক্ষা করে, তাই Cu এর দ্রব্যাদির ক্ষয় হয় না।"},{"id":"ch7-sq27","chapter":7,"num":27,"importance":3,"topic":"বিক্রিয়ার গতিবেগ বা বিক্রিয়ার হার","question":"কেন বিক্রিয়ার সাম্যাবস্থা গতিশীল সাম্যাবস্থা হয়? ব্যাখ্যা কর।","boards":"যশোর বোর্ড ২০২৫, ২০২৩; বরিশাল বোর্ড ২০২৩; সিলেট বোর্ড ২০২২","answer":"উভমুখী বিক্রিয়ায় সম্মুখ ও পশ্চাৎ বিক্রিয়ার হার সমান হলে সেই অবস্থাকে রাসায়নিক সাম্যাবস্থা বলে। সাম্যাবস্থায় সম্মুখ ও পশ্চাৎ উভয় বিক্রিয়া একই হারে চলতে থাকে — যে পরিমাণ বিক্রিয়ক উৎপাদে পরিণত হয়, ঠিক সেই পরিমাণ উৎপাদ ভেঙে বিক্রিয়ক তৈরি হয়। তাই ঘনমাত্রা স্থির থাকায় বিক্রিয়া থেমে গেছে মনে হলেও প্রকৃতপক্ষে তা চলমান । এজন্য রাসায়নিক সাম্যাবস্থা একটি গতিশীল অবস্থা ।"},{"id":"ch7-sq28","chapter":7,"num":28,"importance":3,"topic":"বিক্রিয়ার গতিবেগ বা বিক্রিয়ার হার","question":"সাম্যাবস্থা একটি গতিময় অবস্থা — ব্যাখ্যা কর।","boards":"চট্টগ্রাম বোর্ড ২০২৬","answer":"উভমুখী বিক্রিয়ায় যে অবস্থায় সম্মুখমুখী ও পশ্চাৎমুখী বিক্রিয়ার হার সমান হয় তাকে রাসায়নিক সাম্যাবস্থা বলে।\nN₂+3H₂⇌2NH₃\nসাম্যাবস্থায় বিক্রিয়ক ও উৎপাদের ঘনমাত্রা স্থির মনে হলেও বিক্রিয়া থেমে যায় না; বিক্রিয়ক থেকে উৎপাদ এবং উৎপাদ থেকে বিক্রিয়ক অবিরত একই হারে তৈরি হতে থাকে। অর্থাৎ উভয় দিকের বিক্রিয়া সমান হারে চলমান থাকে বলে সাম্যাবস্থা একটি গতিময় (dynamic) অবস্থা ।"},{"id":"ch8-sq1","chapter":8,"num":1,"importance":2,"topic":"রাসায়নিক শক্তি","question":"CaCO₃ এর তাপীয় বিয়োজন একটি তাপহারী বিক্রিয়া- ব্যাখ্যা কর।","boards":"দিনাজপুর বোর্ড ২০২৫","answer":"যে বিক্রিয়ায় তাপ শোষিত হয় এবং তাপ না দিলে বিক্রিয়া ঘটে না, তাকে তাপহারী বিক্রিয়া বলে । CaCO₃ কে উত্তপ্ত করলে 176.8 kJ/mol তাপ শোষণ করে এটি CaO ও CO₂ তে বিয়োজিত হয়।\nCaCO₃(s)→CaO(s)+CO₂(g) ; ΔH=+176.8kJ/mol\nএখানে উৎপাদের অভ্যন্তরীণ শক্তি বিক্রিয়কের চেয়ে বেশি, তাই ΔH ধনাত্মক । এজন্য CaCO₃ এর তাপীয় বিয়োজন একটি তাপহারী বিক্রিয়া ।"},{"id":"ch8-sq2","chapter":8,"num":2,"importance":2,"topic":"রাসায়নিক শক্তির ব্যবহার","question":"ইথানলকে জ্বালানি হিসেবে ব্যবহার করা হয় কেন?","boards":"যশোর বোর্ড ২০২০","answer":"ইথানল (CH₃-CH₂-OH) একটি দাহ্য তরল। কেরোসিন, ডিজেল, পেট্রলের মতো ইথানল পোড়ালেও তাপ উৎপন্ন হয়:\nCH₃-CH₂-OH+3O₂→2CO₂+3H₂O+তাপ\nতাই ইথানলকে তাপ ইঞ্জিনে জ্বালানি হিসেবে ব্যবহার করে কলকারখানা, গাড়ি, বিমান, জাহাজ চালানো যায়। এতে জীবাশ্ম জ্বালানির উপর চাপও কমে।"},{"id":"ch8-sq3","chapter":8,"num":3,"importance":2,"topic":"তড়িৎ-রাসায়নিক প্রক্রিয়া","question":"KCl তীব্র তড়িৎ বিশ্লেষ্য —ব্যাখ্যা কর।","boards":"বরিশাল বোর্ড ২০২৫","answer":"যেসব তড়িৎ বিশ্লেষ্য দ্রবণে বা গলিত অবস্থায় সম্পূর্ণরূপে আয়নিত হয় সেগুলো তীব্র তড়িৎ বিশ্লেষ্য । KCl একটি আয়নিক যৌগ, যা জলীয় দ্রবণে বা গলিত অবস্থায় সম্পূর্ণভাবে K⁺ ও Cl⁻ আয়নে বিয়োজিত হয় এবং এই আয়নের মাধ্যমে বিদ্যুৎ পরিবহণ করে ।\nKCl(aq)→K⁺(aq)+Cl⁻(aq)\nতাই KCl তীব্র তড়িৎ বিশ্লেষ্য ।"},{"id":"ch8-sq4","chapter":8,"num":4,"importance":2,"topic":"তড়িৎ-রাসায়নিক প্রক্রিয়া","question":"খাবার লবণ তীব্র তড়িৎ বিশ্লেষ্য পদার্থ- ব্যাখ্যা কর।","boards":"রাজশাহী বোর্ড ২০২৪","answer":"খাবার লবণ (NaCl) কঠিন অবস্থায় বিদ্যুৎ পরিবহণ করে না, কারণ তখন আয়নগুলো কেলাসে আবদ্ধ থাকে। কিন্তু গলিত বা দ্রবীভূত অবস্থায় এটি সম্পূর্ণরূপে Na⁺ ও Cl⁻ আয়নে বিয়োজিত হয় এবং আয়নের চলাচলের মাধ্যমে বিদ্যুৎ পরিবহণ করে। H₂O\nNaCl(s)⟶Na⁺(aq)+Cl⁻(aq)\nসম্পূর্ণ আয়নিত হয় বলে খাবার লবণ তীব্র তড়িৎ বিশ্লেষ্য ।"},{"id":"ch8-sq5","chapter":8,"num":5,"importance":2,"topic":"তড়িৎ-রাসায়নিক প্রক্রিয়া","question":"অ্যানোডকে জারণ তড়িৎদ্বার বলা হয় কেন —ব্যাখ্যা কর।","boards":"ময়মনসিংহ বোর্ড ২০২০","answer":"ইলেকট্রন ত্যাগ করাকে জারণ বলে। তড়িৎ রাসায়নিক কোষে\nঅ্যানোডে ধাতব পরমাণু (বা তড়িৎ বিশ্লেষ্য কোষে অ্যানায়ন) ইলেকট্রন ত্যাগ করে।\nZn→Zn²⁺+2e⁻ (জারণ)\nযেহেতু অ্যানোডে সর্বদা ইলেকট্রন বর্জন অর্থাৎ জারণ বিক্রিয়া ঘটে, তাই অ্যানোডকে জারণ তড়িৎদ্বার বলা হয়।"},{"id":"ch8-sq6","chapter":8,"num":6,"importance":2,"topic":"তড়িৎ-রাসায়নিক প্রক্রিয়া","question":"\"NaOH একটি তীব্র তড়িৎ বিশ্লেষ্য\"— ব্যাখ্যা কর।","boards":"কুমিল্লা বোর্ড ২০২০","answer":"NaOH একটি তীব্র ক্ষার ও আয়নিক যৌগ। দ্রবণে বা গলিত অবস্থায় এটি সম্পূর্ণরূপে Na⁺ ও OH⁻ আয়নে বিয়োজিত হয় এবং আয়নের মাধ্যমে বিদ্যুৎ পরিবহণ করে।\nNaOH(aq)→Na⁺(aq)+OH⁻(aq)\nযেহেতু NaOH সম্পূর্ণ আয়নিত হয়, তাই এটি একটি তীব্র তড়িৎ বিশ্লেষ্য ।"},{"id":"ch8-sq7","chapter":8,"num":7,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার মাধ্যমে বিদ্যুৎ উৎপাদন","question":"শুষ্ক কোষে MnO₂ এর কাজ কী? ব্যাখ্যা কর।","boards":"রাজশাহী বোর্ড ২০২৫","answer":"শুষ্ক কোষে MnO₂ জারক হিসেবে কাজ করে । অ্যানোডে Zn দুটি ইলেকট্রন ত্যাগ করে Zn²⁺ হয়; এই ইলেকট্রন তার দিয়ে কার্বন দণ্ডে (ক্যাথোড) আসে।\nক্যাথোডে কাইয়ের MnO₂ ও NH₄⁺ ঐ ইলেকট্রন গ্রহণ করে:\n2NH₄⁺+2MnO₂+2e⁻→2NH₃+Mn₂O₃+H₂O।\nMnO₂ ইলেকট্রন গ্রহণ করে নিজে বিজারিত হয় এবং Zn-কে জারিত হতে সাহায্য করে, ফলে ইলেকট্রন প্রবাহ তথা বিদ্যুৎ উৎপন্ন হয়।"},{"id":"ch8-sq8","chapter":8,"num":8,"importance":2,"topic":"রাসায়নিক বিক্রিয়ার মাধ্যমে বিদ্যুৎ উৎপাদন","question":"হাইড্রোজেন ফুয়েল সেলে কীভাবে বিদ্যুৎ উৎপন্ন হয়? ব্যাখ্যা কর।","boards":"বরিশাল বোর্ড ২০২৪","answer":"হাইড্রোজেন ফুয়েল সেলের অ্যানোডে হাইড্রোজেন অণু জারিত হয় এবং ক্যাথোডে অক্সিজেন অণু বিজারিত হয়ে পানি উৎপন্ন করে।\n2H₂→4H⁺+4e⁻ (অ্যানোডে)\nO₂+4H⁺+4e⁻→2H₂O (ক্যাথোডে)\nঅ্যানোডে উৎপন্ন ইলেকট্রন বাইরের তারের মধ্য দিয়ে ক্যাথোডে প্রবাহিত হয়; এই ইলেকট্রন প্রবাহই বিদ্যুৎ। এ বিদ্যুতে গাড়ি পর্যন্ত চালানো যায়।"},{"id":"ch8-sq9","chapter":8,"num":9,"importance":2,"topic":"রাসায়নিক বিক্রিয়ার মাধ্যমে বিদ্যুৎ উৎপাদন","question":"গ্যালভানিক কোষে লবণ সেতু ব্যবহার করা হয় কেন? ব্যাখ্যা কর।","boards":"যশোর বোর্ড ২০২৪","answer":"গ্যালভানিক কোষে অ্যানোডে জারণের ফলে অ্যানোড দ্রবণে ধনাত্মক আয়ন বেড়ে যায় এবং ক্যাথোডে ধাতব আয়ন বিজারিত হওয়ায় ক্যাথোড দ্রবণে ঋণাত্মক আয়ন (SO₄²⁻) বেশি হয়ে যায়। এতে দ্রবণের আধান নিরপেক্ষতা নষ্ট হয়ে কিছুক্ষণের মধ্যে বিদ্যুৎ প্রবাহ বন্ধ হয়ে যেত। লবণ সেতু থেকে Cl⁻ আয়ন অ্যানোড দ্রবণে এবং K⁺ আয়ন ক্যাথোড দ্রবণে গিয়ে আধান নিরপেক্ষতা বজায় রাখে এবং দুই দ্রবণের মধ্যে সংযোগ রক্ষা করে। তাই বিদ্যুৎ প্রবাহ চালু রাখতে লবণ সেতু ব্যবহার করা হয়।"},{"id":"ch8-sq10","chapter":8,"num":10,"importance":2,"topic":"রাসায়নিক বিক্রিয়ার মাধ্যমে বিদ্যুৎ উৎপাদন","question":"গ্যালভানিক কোষে অ্যানোড ঋণাত্মক কেন? ব্যাখ্যা কর।","boards":"বরিশাল বোর্ড ২০২০","answer":"গ্যালভানিক কোষে অধিক সক্রিয় ধাতুর তড়িৎদ্বার অ্যানোড হিসেবে কাজ করে এবং সেখানে জারণ ঘটে। যেমন ডেনিয়েল কোষে:\nZn→Zn²⁺+2e⁻।\nধাতব পরমাণু আয়ন হয়ে দ্রবণে চলে যায়, কিন্তু ত্যাগকৃত ইলেকট্রনগুলো তড়িৎদ্বারে জমা থাকে। ফলে অ্যানোডে ইলেকট্রনের আধিক্য হয় এবং এটি ঋণাত্মক চার্জযুক্ত হয়। এই ইলেকট্রনই তার দিয়ে ক্যাথোডে প্রবাহিত হয়।"},{"id":"ch8-sq11","chapter":8,"num":11,"importance":3,"topic":"নিউক্লিয়ার বিক্রিয়া ও বিদ্যুৎ শক্তি উৎপাদন","question":"নিউক্লিয়ার ফিশন বিক্রিয়া বলতে কী বুঝায়?","boards":"যশোর বোর্ড ২০২৫; কুমিল্লা বোর্ড ২০২৪, ২০২০","answer":"যে নিউক্লিয়ার বিক্রিয়ায় কোনো বড় ও ভারী মৌলের নিউক্লিয়াস ভেঙে ছোট ছোট মৌলের নিউক্লিয়াসে পরিণত হয় এবং সাথে নিউট্রন ও প্রচুর শক্তি উৎপন্ন হয়, তাকে নিউক্লিয়ার ফিশন বিক্রিয়া বলে। যেমন—\n²³⁵₉₂U+₀¹n→¹⁴¹₅₆Ba+₃₆⁹²Kr+3₀¹n+প্রচুরশক্তি"},{"id":"ch9-sq1","chapter":9,"num":1,"importance":3,"topic":"এসিড","question":"CO₂ যৌগটি অম্লীয় কেন?","boards":"চট্টগ্রাম বোর্ড ২০২৫","answer":"CO₂ পানির সাথে বিক্রিয়া করে কার্বনিক এসিড উৎপন্ন করে:\nCO₂+H₂O⇌H₂CO₃। কার্বনিক এসিড জলীয় দ্রবণে বিয়োজিত\nহয়ে H⁺ আয়ন দেয়: H₂CO₃⇌2H⁺+CO₃²⁻। এছাড়া CO₂\nক্ষারের সাথে বিক্রিয়ায় লবণ ও পানি দেয়: CO₂+2NaOH→\nNa₂CO₃+H₂O। তাই CO₂ অম্লীয় ।"},{"id":"ch9-sq2","chapter":9,"num":2,"importance":2,"topic":"এসিড","question":"SiO₂ অম্লধর্মী কেন? ব্যাখ্যা কর।","boards":"বরিশাল বোর্ড ২০২৫","answer":"SiO₂ একটি অধাতব অক্সাইড । এটি ক্ষারের সাথে বিক্রিয়া করে লবণ (সোডিয়াম সিলিকেট) ও পানি উৎপন্ন করে: SiO₂+\n2NaOH→Na₂SiO₃+H₂O। ক্ষারকে প্রশমিত করে লবণ ও পানি\nদেয় বলে SiO₂ অম্লধর্মী অক্সাইড ।"},{"id":"ch9-sq3","chapter":9,"num":3,"importance":2,"topic":"এসিড","question":"ইথানয়িক এসিড একটি দুর্বল এসিড- ব্যাখ্যা কর।","boards":"কুমিল্লা বোর্ড ২০২৪","answer":"ইথানয়িক এসিড (CH₃COOH) জলীয় দ্রবণে আংশিক বিয়োজিত হয়ে অল্প পরিমাণ H⁺ ও ইথানয়েট আয়ন (CH₃COO⁻)\nদেয়: CH3COOH(aq)⇌CH₃COO⁻(aq)+H⁺(aq)। 25°C এ\n1000টি CH₃COOH অণুর মাত্র 4টি বিয়োজিত হয়। তাই ইথানয়িক এসিড একটি দুর্বল এসিড ।"},{"id":"ch9-sq4","chapter":9,"num":4,"importance":2,"topic":"এসিড","question":"বিশুদ্ধ H₂SO₄ এসিড হিসেবে ক্রিয়া করে না- ব্যাখ্যা কর।","boards":"বরিশাল বোর্ড ২০২৪","answer":"জলীয় দ্রবণে H⁺ আয়নের উপস্থিতির কারণে কোনো পদার্থ এসিডের ধর্ম দেখায় । বিশুদ্ধ H₂SO₄ বর্ণহীন তরল, এতে H₂SO₄ আণবিক অবস্থায় থাকে, আয়নিত হয় না; তাই H⁺ আয়ন থাকে না। ফলে বিশুদ্ধ H₂SO₄ এসিড হিসেবে ক্রিয়া করে না এবং বিদ্যুৎ\nপরিবহণও করে না। পানিতে দ্রবীভূত করলেই H2SO4(aq)→\n2H⁺(aq)+SO₄²⁻(aq) হয় এবং এসিডের ধর্ম দেখায় ।"},{"id":"ch9-sq5","chapter":9,"num":5,"importance":2,"topic":"ক্ষারক এবং ক্ষার","question":"বর্ষাকালে পিচ্ছিল রাস্তায় বালু যোগ করা হয় কেন? ব্যাখ্যা কর।","boards":"কুমিল্লা বোর্ড ২০২৫","answer":"বর্ষাকালে রাস্তায় শ্যাওলা ও জৈব পদার্থ পচে যে পিচ্ছিল স্তর তৈরি হয় তা ক্ষারধর্মী । বালুর প্রধান উপাদান SiO₂, যা অম্লধর্মী অক্সাইড । রাস্তায় বালু দিলে SiO₂ ক্ষারকে প্রশমিত করে লবণ ও\nপানি উৎপন্ন করে: SiO₂+2NaOH→Na₂SiO₃+H₂O। এতে\nপিচ্ছিলতা দূর হয় এবং বালুকণা ঘর্ষণ বাড়িয়ে পা পিছলে যাওয়া রোধ করে । তাই পিচ্ছিল রাস্তায় বালু যোগ করা হয়।"},{"id":"ch9-sq6","chapter":9,"num":6,"importance":2,"topic":"ক্ষারক এবং ক্ষার","question":"Fe(OH)₂ ক্ষারক, ক্ষার নয়-ব্যাখ্যা কর।","boards":"ঢাকা বোর্ড ২০২৫","answer":"ক্ষার হওয়ার জন্য দুটি শর্ত: (i) OH⁻ মূলক থাকতে হবে, (ii) পানিতে দ্রবণীয় হতে হবে। Fe(OH)₂ আয়রনের হাইড্রোক্সাইড, এতে OH⁻ মূলক আছে এবং এসিডের সাথে বিক্রিয়ায় লবণ ও পানি দেয়, তাই এটি ক্ষারক। কিন্তু Fe(OH)₂ পানিতে অদ্রবণীয়, দ্বিতীয় শর্ত পূরণ করে না। তাই Fe(OH)₂ ক্ষারক, কিন্তু ক্ষার নয়।"},{"id":"ch9-sq7","chapter":9,"num":7,"importance":2,"topic":"ক্ষারক এবং ক্ষার","question":"Fe(OH)₂ কে ক্ষারক বলা হয় কেন? ব্যাখ্যা কর।","boards":"বরিশাল বোর্ড ২০২৫","answer":"ধাতুর অক্সাইড বা হাইড্রোক্সাইড যা এসিডের সাথে বিক্রিয়া করে লবণ ও পানি উৎপন্ন করে তাকে ক্ষারক বলে। Fe(OH)₂ আয়রন ধাতুর হাইড্রোক্সাইড এবং এটি এসিডের সাথে বিক্রিয়া করে লবণ ও পানি দেয়:\nFe(OH)₂+2HCl→FeCl₂+2H₂O\nতাই Fe(OH)₂ একটি ক্ষারক ।"},{"id":"ch9-sq8","chapter":9,"num":8,"importance":3,"topic":"গাঢ় এসিড ও গাঢ় ক্ষারের ক্ষয়কারী ধর্ম","question":"গাঢ় নাইট্রিক এসিডকে রঙিন বোতলে রাখা হয় কেন?","boards":"রাজশাহী বোর্ড ২০২৫; দিনাজপুর বোর্ড ২০২৪","answer":"গাঢ় HNO₃ আলোর উপস্থিতিতে বিয়োজিত হয়ে বাদামি বর্ণের নাইট্রোজেন ডাইঅক্সাইড (NO₂) গ্যাস, অক্সিজেন ও পানি উৎপন্ন করে। আলো\n4HNO₃⟶4NO₂+O₂+2H₂O\nবাদামি বা রঙিন বোতলে আলো প্রবেশ করতে পারে না। তাই HNO₃ যেন আলোতে বিয়োজিত না হয়, সেজন্য একে বাদামি বর্ণের বোতলে সংরক্ষণ করা হয়।"},{"id":"ch9-sq9","chapter":9,"num":9,"importance":2,"topic":"pH এর ধারণা","question":"কৃষিক্ষেত্রে pH এর গুরুত্ব ব্যাখ্যা কর।","boards":"কুমিল্লা বোর্ড ২০২৪","answer":"উদ্ভিদ পুষ্টির জন্য মাটি থেকে বিভিন্ন আয়ন ও পানি শোষণ করে; এর জন্য মাটির pH 6.0 থেকে 8.0 এর মধ্যে হলে সবচেয়ে ভালো। মাটির pH 3.0 এর কম বা 10 এর বেশি হলে মাটির উপকারী অণুজীব মারা যায়। তাই মাটির pH কমে গেলে পরিমাণমতো চুন (CaO) এবং বেড়ে গেলে অ্যামোনিয়াম সালফেট (NH₄)₂SO₄, অ্যামোনিয়াম ফসফেট (NH₄)₃PO₄ সার প্রয়োগ করে pH নিয়ন্ত্রণ করা হয়। এভাবে কৃষিক্ষেত্রে pH ফসল উৎপাদনে গুরুত্বপূর্ণ ভূমিকা রাখে।"},{"id":"ch9-sq10","chapter":9,"num":10,"importance":3,"topic":"প্রশমন বিক্রিয়া","question":"পিঁপড়ার কামড়ের ক্ষত স্থানে চুন লাগানো হয় কেন?","boards":"ময়মনসিংহ বোর্ড ২০২৫; দিনাজপুর বোর্ড ২০২৪; রাজশাহী বোর্ড ২০২৩","answer":"পিঁপড়ার কামড়ে ফরমিক এসিড (HCOOH) ক্ষতস্থানে প্রবেশ করে, ফলে জ্বালা-যন্ত্রণা হয়। চুন ক্ষারধর্মী পদার্থ । ক্ষতস্থানে চুন লাগালে তা ফরমিক এসিডকে প্রশমিত করে লবণ ও পানি উৎপন্ন করে, ফলে জ্বালা কমে যায়। তাই পিঁপড়ার কামড়ের ক্ষতস্থানে চুন লাগানো হয়।"},{"id":"ch9-sq11","chapter":9,"num":11,"importance":3,"topic":"প্রশমন বিক্রিয়া","question":"Na₂CO₃ এর জলীয় দ্রবণ ক্ষারীয়, ব্যাখ্যা কর।","boards":"চট্টগ্রাম বোর্ড ২০২৫; বরিশাল বোর্ড ২০২০","answer":"মৃদু এসিড ও তীব্র ক্ষারের বিক্রিয়ায় উৎপন্ন লবণের জলীয় দ্রবণ ক্ষারীয় হয়।\n2NaOH+H₂CO₃→Na₂CO₃+2H₂O\nNa₂CO₃ তীব্র ক্ষার NaOH ও মৃদু এসিড H₂CO₃ এর লবণ । পানিতে দ্রবীভূত করলে তীব্র ক্ষারের ধর্ম প্রাধান্য পায় এবং দ্রবণে OH⁻ আয়নের আধিক্য ঘটে। তাই Na₂CO₃ এর জলীয় দ্রবণ ক্ষারীয় (pH \u003e 7)।"},{"id":"ch9-sq12","chapter":9,"num":12,"importance":3,"topic":"প্রশমন বিক্রিয়া","question":"মৌমাছি কামড়ালে ক্ষত স্থানে চুন ব্যবহার করা হয় কেন?","boards":"ঢাকা বোর্ড ২০২৬","answer":"মৌমাছি কামড়ালে হুলের মাধ্যমে ক্ষত স্থানে ফরমিক এসিড (HCOOH) প্রবেশ করে, ফলে জ্বালাপোড়া হয়। চুন বা চুনের পানি [Ca(OH)₂] ক্ষারীয় প্রকৃতির । ক্ষত স্থানে চুন লাগালে তা এসিডকে প্রশমিত করে লবণ ও পানি উৎপন্ন করে, ফলে জ্বালাপোড়া কমে যায়।\n2HCOOH+Ca(OH)₂→(HCOO)₂Ca+2H₂O"},{"id":"ch9-sq13","chapter":9,"num":13,"importance":3,"topic":"প্রশমন বিক্রিয়া","question":"মৌমাছি কামড়ালে চুন ব্যবহার করা হয় কেন? ব্যাখ্যা কর।","boards":"যশোর বোর্ড ২০২৬","answer":"মৌমাছি কামড়ালে হুলের মাধ্যমে ত্বকে ফরমিক এসিড (HCOOH) জাতীয় অম্লীয় পদার্থ প্রবেশ করে, ফলে জ্বালাপোড়া ও ব্যথা হয়। চুন বা কলিচুন [Ca(OH)₂] একটি ক্ষার, যা এসিডকে প্রশমিত করে লবণ ও পানি উৎপন্ন করে ।\n2HCOOH+Ca(OH)₂→(HCOO)₂Ca+2H₂O\nএই প্রশমন বিক্রিয়ার ফলে এসিডের ক্রিয়া নষ্ট হয় এবং জ্বালাপোড়া কমে যায়। তাই মৌমাছি কামড়ালে চুন ব্যবহার করা হয়।"},{"id":"ch9-sq14","chapter":9,"num":14,"importance":3,"topic":"প্রশমন বিক্রিয়া","question":"মৌমাছি কামড়ালে ক্ষতস্থানে চুন ব্যবহার হয় কেন? ব্যাখ্যা কর।","boards":"মাদ্রাসা বোর্ড ২০২৬","answer":"মৌমাছি কামড়ালে ক্ষতস্থানে ফরমিক এসিড (মিথানয়িক এসিড, HCOOH) প্রবেশ করে, ফলে জ্বালাপোড়া ও ব্যথা হয়। চুন পানির সংস্পর্শে ক্ষারীয় Ca(OH)₂ তৈরি করে, যা ফরমিক এসিডকে প্রশমিত করে লবণ ও পানি উৎপন্ন করে।\n2HCOOH+Ca(OH)₂→(HCOO)₂Ca+2H₂O\nএসিড প্রশমিত হওয়ায় জ্বালা কমে যায়। তাই মৌমাছি কামড়ালে ক্ষতস্থানে চুন ব্যবহার করা হয়।"},{"id":"ch9-sq15","chapter":9,"num":15,"importance":3,"topic":"প্রশমন বিক্রিয়া","question":"প্রশমন বিক্রিয়ায় একটি সাধারণ উৎপাদ পানি—ব্যাখ্যা কর।","boards":"রাজশাহী বোর্ড ২০২৬","answer":"এসিড ও ক্ষারকের বিক্রিয়ায় লবণ ও পানি উৎপন্ন হওয়ার বিক্রিয়াকে প্রশমন বিক্রিয়া বলে । এসিড জলীয় দ্রবণে H⁺ আয়ন এবং ক্ষার OH⁻ আয়ন দেয়। প্রশমনের সময় এই H⁺ ও OH⁻ আয়ন যুক্ত হয়ে পানি উৎপন্ন করে ।\nHCl+NaOH→NaCl+H₂O\nH⁺+OH⁻→H₂O\nএসিড বা ক্ষার যাই হোক না কেন, প্রতিটি প্রশমন বিক্রিয়ায় পানি উৎপন্ন হয়। তাই পানি প্রশমন বিক্রিয়ার একটি সাধারণ উৎপাদ।"},{"id":"ch9-sq16","chapter":9,"num":16,"importance":3,"topic":"প্রশমন বিক্রিয়া","question":"পাকস্থলীর অ্যাসিডিটি দূর করতে অ্যান্টাসিড সেবন করা হয় কেন? ব্যাখ্যা করো।","boards":"সিলেট বোর্ড ২০২৬","answer":"পাকস্থলীতে অতিরিক্ত HCl নিঃসৃত হলে অ্যাসিডিটি বা এসিডিটির সমস্যা দেখা দেয়। অ্যান্টাসিডে Mg(OH)₂, Al(OH)₃ এর মতো মৃদু ক্ষারক থাকে, যা অতিরিক্ত HCl কে প্রশমিত করে লবণ ও পানি উৎপন্ন করে ।\nMg(OH)₂+2HCl→MgCl₂+2H₂O\nফলে পাকস্থলীর এসিডের পরিমাণ কমে যায় এবং অ্যাসিডিটি দূর হয়। এজন্য অ্যান্টাসিড সেবন করা হয়।"},{"id":"ch9-sq17","chapter":9,"num":17,"importance":2,"topic":"প্রশমন বিক্রিয়া","question":"কৃষিক্ষেত্রে প্রশমন বিক্রিয়ার গুরুত্ব ব্যাখ্যা কর।","boards":"কুমিল্লা বোর্ড ২০২৫","answer":"গাছ মাটি থেকে Fe²⁺, Mg²⁺, Ca²⁺, K⁺ ইত্যাদি ধাতব আয়ন শোষণ করলে মাটি অম্লীয় হয়ে পড়ে এবং মাটির উর্বরতা কমে যায়। মাটিতে চুন (CaO) প্রয়োগ করলে তা মাটির অতিরিক্ত এসিডকে প্রশমিত করে, ফলে মাটির উর্বরতা বৃদ্ধি পায়। তাই কৃষিক্ষেত্রে প্রশমন বিক্রিয়া গুরুত্বপূর্ণ ।"},{"id":"ch9-sq18","chapter":9,"num":18,"importance":3,"topic":"পানি","question":"খর পানিতে সাবানের ফেনা হয় না কেন? ব্যাখ্যা কর।","boards":"যশোর বোর্ড ২০২৫; চট্টগ্রাম বোর্ড ২০২০","answer":"সাবান উচ্চতর জৈব এসিডের সোডিয়াম বা পটাশিয়াম লবণ, যেমন সোডিয়াম স্টিয়ারেট (C₁₇H₃₅COONa)। খর পানিতে Ca বা Mg লবণ থাকে; এরা সাবানের সাথে বিক্রিয়া করে অদ্রবণীয় ক্যালসিয়াম বা ম্যাগনেসিয়াম স্টিয়ারেট তৈরি করে।\n2C₁₇H₃₅COONa+CaCl₂→(C₁₇H₃₅COO)₂Ca↓ + 2NaCl\nযতক্ষণ এসব লবণ পানিতে থাকে ততক্ষণ সাবান ক্ষয় হয় কিন্তু ফেনা হয় না।"},{"id":"ch9-sq19","chapter":9,"num":19,"importance":3,"topic":"পানি","question":"পানির খরতার কারণ ব্যাখ্যা কর।","boards":"রাজশাহী বোর্ড ২০২৪","answer":"পানিতে Ca, Mg, Fe প্রভৃতি ধাতুর লবণ দ্রবীভূত থাকলে পানি খর হয়। এসব ধাতুর বাইকার্বনেট লবণ [যেমন Ca(HCO₃)₂, Mg(HCO₃)₂] দ্রবীভূত থাকলে অস্থায়ী খরতা এবং ক্লোরাইড বা সালফেট লবণ (যেমন CaCl₂, MgSO₄) দ্রবীভূত থাকলে স্থায়ী খরতা সৃষ্টি হয়। এসব আয়ন সাবানের সাথে অদ্রবণীয় যৌগ তৈরি করায় পানিতে সাবানের ফেনা হয় না।"},{"id":"ch10-sq1","chapter":10,"num":1,"importance":3,"topic":"খনিজ সম্পদ","question":"সকল খনিজ আকরিক নয়-ব্যাখ্যা কর।","boards":"রাজশাহী বোর্ড ২০২৫, ২০২০; সিলেট বোর্ড ২০২৪; যশোর বোর্ড ২০২০; দিনাজপুর বোর্ড ২০২০","answer":"যেসব খনিজ থেকে লাভজনক ও সহজ উপায়ে ধাতু বা অধাতু নিষ্কাশন করা যায়, শুধু সেগুলোকেই আকরিক বলে। অনেক খনিজে ধাতু থাকলেও তা থেকে লাভজনকভাবে ধাতু নিষ্কাশন করা যায় না। যেমন– কাদামাটিতে অ্যালুমিনিয়াম থাকলেও লাভজনকভাবে Al নিষ্কাশন করা যায় না, তাই কাদামাটি খনিজ কিন্তু আকরিক নয়। অতএব, সকল আকরিকই খনিজ, কিন্তু সকল খনিজ আকরিক নয়।"},{"id":"ch10-sq2","chapter":10,"num":2,"importance":2,"topic":"খনিজ সম্পদ","question":"লিমোনাইটকে খনিজ এবং আকরিক উভয় বলা হয় কেন? ব্যাখ্যা কর।","boards":"রাজশাহী বোর্ড ২০২৫","answer":"লিমোনাইট (Fe₂O₃.3H₂O) প্রাকৃতিকভাবে খনি থেকে উত্তোলন করা হয় এবং এতে আয়রন ধাতু থাকে, তাই এটি খনিজ। আবার লিমোনাইট থেকে ভস্মীকরণের মাধ্যমে অপদ্রব্য দূর করে বাত্যাচুল্লিতে বিজারণ করে লাভজনকভাবে আয়রন নিষ্কাশন করা যায়, তাই এটি আয়রনের আকরিক। এজন্য লিমোনাইটকে খনিজ ও আকরিক উভয়ই বলা হয়।"},{"id":"ch10-sq3","chapter":10,"num":3,"importance":2,"topic":"খনিজ সম্পদ","question":"গ্যালেনা লেড ধাতুর আকরিক- ব্যাখ্যা কর।","boards":"রাজশাহী বোর্ড ২০২৪","answer":"যেসব খনিজ থেকে লাভজনকভাবে ধাতু নিষ্কাশন করা যায় তাদের আকরিক বলে। গ্যালেনা (PbS) লেডের একটি খনিজ, যাতে লেডের পরিমাণ বেশি এবং এ থেকে সহজ ও লাভজনক উপায়ে লেড ধাতু নিষ্কাশন করা যায়। তাই গ্যালেনাকে লেড ধাতুর আকরিক বলা হয়।"},{"id":"ch10-sq4","chapter":10,"num":4,"importance":3,"topic":"ধাতু নিষ্কাশন","question":"ধাতু নিষ্কাশন একটি বিজারণ প্রক্রিয়া- ব্যাখ্যা কর।","boards":"কুমিল্লা বোর্ড ২০২৪","answer":"প্রকৃতিতে সক্রিয় ধাতু মুক্ত অবস্থায় না থেকে অক্সাইড, সালফাইড, কার্বনেট ইত্যাদি যৌগে ধনাত্মক আয়ন হিসেবে থাকে। এসব যৌগ থেকে ধাতু পেতে ধাতব আয়নকে ইলেকট্রন দিয়ে বা অক্সিজেন অপসারণ করে মুক্ত ধাতুতে পরিণত করতে হয়, যা\nΔ\nবিজারণ । যেমন: ZnO+C⟶Zn+CO।\nবেশি সক্রিয় ধাতু তড়িৎ বিশ্লেষণে, মধ্যম সক্রিয় ধাতু কার্বন বিজারণে এবং কম সক্রিয় ধাতু স্ববিজারণে নিষ্কাশিত হয়। তাই ধাতু নিষ্কাশন একটি বিজারণ প্রক্রিয়া ।"},{"id":"ch10-sq5","chapter":10,"num":5,"importance":3,"topic":"নির্বাচিত সংকর ধাতু","question":"ব্রোঞ্জ একটি মিশ্রণ —ব্যাখ্যা কর।","boards":"যশোর বোর্ড ২০২৫; চট্টগ্রাম বোর্ড ২০২৫","answer":"কোনো গরম গলিত ধাতুর মধ্যে অন্য গলিত ধাতু বা অধাতু মিশিয়ে ঠান্ডা করলে প্রাপ্ত কঠিন পদার্থকে সংকর ধাতু বলে। 90% কপার ও 10% টিনকে গলিত অবস্থায় মিশিয়ে ঠান্ডা করে ব্রোঞ্জ বা কাঁসা তৈরি করা হয়। এতে কপার ও টিন রাসায়নিকভাবে যুক্ত হয় না এবং এর কোনো নির্দিষ্ট সংকেত নেই। তাই ব্রোঞ্জ (কাঁসা) একটি মিশ্রণ তথা সংকর ধাতু।"},{"id":"ch10-sq6","chapter":10,"num":6,"importance":3,"topic":"খনিজ অধাতু","question":"গাঢ় H₂SO₄ নিরুদক পদার্থ —ব্যাখ্যা কর।","boards":"দিনাজপুর বোর্ড ২০২৫","answer":"যে পদার্থ কোনো যৌগ থেকে পানি শোষণ করে তাকে নিরুদক বলে। গাঢ় H₂SO₄ চিনি (C₁₂H₂₂O₁₁) থেকে পানি শোষণ করে চিনিকে কালো কার্বনে পরিণত করে।\nC₁₂H₂₂O₁₁+H₂SO₄→12C+H₂SO₄.11H₂O\nতাই গাঢ় H₂SO₄ নিরুদক । লঘু H₂SO₄ এর নিরুদন ধর্ম নেই।"},{"id":"ch11-sq1","chapter":11,"num":1,"importance":3,"topic":"জীবাশ্ম জ্বালানি: প্রাকৃতিক গ্যাস ও পেট্রোলিয়াম","question":"মিথেন একটি প্যারাফিন যৌগ– ব্যাখ্যা করো ।","boards":"যশোর বোর্ড ২০২১; ময়মনসিংহ বোর্ড ২০২১",
