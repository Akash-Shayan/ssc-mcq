েশ করেনছ, তাই এটি d- রক মৌল (অবস্থান্ি মৌল)। d- কর মৌলের গ্রুপ েম্ব ি = (n-1)d ও ল ি ল ns অরবিটালেি মোট ইলেকট্রন সংখ্যা। গ্রুপ নম্ব র = 3d এর ইলেকট্রন + 4s এর ইলেকট্রন = 5 + 1 = 6 র র ় ় সু তিাং Y মৌলটি (Cr) পর্যায় সািরণি 4থড পর্যায়ের 6 েং গ্রুপে অ মথত একটি d- রক মৌল। ি ল টাইপ ভিততিক মাস্ট ার সাজেশন"},{"label":"ঘ","question":"উদ্দীপকের X, Y ও Z মৌল রতেটি ি পারমাণবিক আকানভর েব্ র্ বিশ্লেষণ কি। [৪ বোর্ডে এনসনছ]","answer":"উদ্দীপকের X, Y ও Z মৌল েথােব্ নর্ িসভরাস (P), বে্বামর্োর্ (Cr) ও ক্যালসিয়াম (Ca)। এদের ইলেকট্রন বিন্যাস: 2 2 6 2 3 X(15) : 1s 2s 2p 3s 3p 2 2 6 2 6 5 1 Y(24) : 1s 2s 2p 3s 3p 3d 4s 2 2 6 2 6 2 Z(20) : 1s 2s 2p 3s 3p 4s ় ৃ ় ় ইলেকট্রন বিন্যাস অেুযায়ী X ততীে পর্যায়ের 15 েং গ্রুপে, Y চতথড র র ় পর্যায়ের 6 েং গ্রুপে এবং Z চতথড পর্যায়ের 2 েং গ্রুপে অ মথত। র র ় ্ ত পর্যায় সািরণি একই গ্রুপে উপর থেকে রেনচ শক্তিস্তরেি সংখ্যা াড় াে পরমাণুর আকার ানড়। আ াি একই পর্যায়ে ার্ থেকে র্ানে ্ ত ় শক্তি তি একই থাকনলও নিউক্লিয়াসেি ধোতমক চার্জ ানড়, িনল ় ় ইলেকট্রনগুনলা নিউক্লিয়াসেি রদনক বেশি আকৃ টট হয় এবং পরমাণুর র ল আকার কনর্। ় ় ্ত Y ও Z উভয়ই 4থড পর্যায়ের মৌল, অর্থাৎ এদের 4টি শক্তিস্তর আনছ। Z (Ca) পর্যায়ের ার্ রদনক (গ্রুপ 2) এবং Y (Cr) তাি মান রদনক (গ্রুপ ় ় 6) অ মথত। Y এর রেউর্োি চার্জ (+24) Z এর (+20) বচনে বেশি, ি ল তাই Y এর আকার Z এর বচনে বছাট। অর্থাৎ Z \u003e Y। ্ত ্ত ় ় অপিরদনক X (P) এর শক্তিস্তর মান 3টি। শক্তিস্তর কম হওয়ায় X এর ্ত ় ় আকার 4টি শক্তিস্তরর মশটট Y ও Z উিনেি বচনে বছাট। অর্থাৎ Y \u003e X। ় ় প্কৃ ত র্ানেও বদখা যায়, Ca এর পারমাণবিক ব্যাসার্ধ প্রায় 197 pm, র র ় ় Cr এর প্রায় 128 pm এবং P এর প্রায় 110 pm। র র পারমাণরবক আকাজরর তরব্ ম : Z \u003e Y \u003e X সু তিাং উদ্দীপকের মৌল রতেটি ি পারমাণবিক আকানভর েব্ র্ হলো Z (Ca) \u003e Y (Cr) \u003e X (P)।"}],"board":"র্াদ্াসা বোর্ড ২০২৬"},{"id":"ch4-cq14","chapter":4,"num":14,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: পর্যায় সারণির একটি খ্লভর অংশ রন্রূপ : X Q R Ca T Zn [ X, Q, R ও T প্িীকী অথে বযবহবি। ]","subQuestions":[{"label":"ক","question":"ইলেকট্রন আসপ্কব কাকে বলে? [৪ বোর্ডে এনসনছ]","answer":"্ ় ় ইলেকট্রন আসততিব : গ্যাসীে অবস্থাে কোনো মৌলের এক মোল বিভব ন ্ ় র ক্সচ্ছন্ পরমাণু নত এক মোল ইলেকট্রন েুকব হয়ে এক মোল ঋণাতমক ় ় ় ় আয়নে পরিণত হওয়ার সময় বে শক্তি রেগডত হয়, তানক ঐ মৌলের ইলেকট্রন আসপ্কব বলে।"},{"label":"খ","question":"ক্লোরিন একটি হযানলানৈে— ব্যাখ্যা কি। [৩ বোর্ডে এনসনছ]","answer":"হযানলানৈে শর্েি অথড লবণ উৎপাদেকািী। পর্যায় সািরণি গ্রুপ- 17 এর মৌলগুনলানক হযানলানৈে বলে। 2 2 6 2 5 Cl (17) : 1s 2s 2p 3s 3p ্ ত ব্ারিনেি সর্বশেষ শক্তিস্তরে 7টি ইলেকট্রন আনছ, তাই এটি গ্রুপ-17 র র − এর মৌল। এটি সহজেই একটি ইলেকট্রন গ্রহণ করে Cl আয়ন গঠে র র ু ্ ় করে এবং ধাতি সাথে েুকব হয়ে লবণ উৎপন্ন করে। 2Na+Cl2 →2NaCl টাইপ ভি ﻿ তাই ক্লোরিন একটি হযানলানৈে।"},{"label":"গ","question":"উদ্দীপকে T মৌলটি একারধক যোজনী প্দশডে করে— ব্যাখ্যা কি। ় ্","answer":"উদ্দীপকের সািরণনত T মৌলটি Ca ও Zn এর র্ধয তী 4থড ় ত ু পর্যায়ে অ মথত, অর্থাৎ T একটি d- কর মৌল বা অবস্থান্ি ধাত। ি ল ি ধরি, T হলো আেিে (Fe)। 2 2 6 2 6 6 2 Fe (26) : 1s 2s 2p 3s 3p 3d 4s ত ্ অবস্থান্ি বর্ৌনল 4s ও 3d অরবিটালেি শক্তভর পাথডকয খু কম ় ় হওয়ায় ন্ধে গঠনে 4s এর পাশাপামশ 3d অরবিটালেি ইলেকট্রনও অংশ রেনত পানি। 2+ • Fe পরমাণু 4s অরবিটালেি দুটি ইলেকট্রন তযাগ করলে Fe ় ় আয়ন গঠ ি ত হে; এর্ক্ষতরে যোজনী 2। 2+ − Fe → Fe +2e 2+ 2 2 6 2 6 6 Fe : 1s 2s 2p 3s 3p 3d 2+ • Fe আয়ন 3d থেকে আিও একটি ইলেকট্রন তযাগ করলে 3d 3+ অরবিটাল অধডপূর্ণ (3d5) হয়, ো অরধক মথরতশীল। এরান Fe বিভব ় ় আয়ন গঠ ি ত হে; এর্ক্ষতরে যোজনী 3। 3+ − Fe → Fe +3e 3+ 2 2 6 2 6 5 Fe : 1s 2s 2p 3s 3p 3d যেমন: FeCl2 যৌগে আেিনেি যোজনী 2 এবং FeCl3 যৌগে যোজনী 3। ত ় ় সু তিাং T মৌলটি অবস্থান্ি মৌল হওয়ায় পরি তড েশীল তথা একারধক যোজনী প্দশডে করে।"},{"label":"ঘ","question":"X, Q ও R মৌলের আয়নিকিণ শক্তি ও ধাত ধনর্ডি েব্ র্ র পিীত—েুপ্কবসহ বিশ্লেষণ কি।","answer":"উদ্দীপকের সািরণনত X, Q ও R একই গ্রুপে (গ্রুপ-1) েথােব্ নর্ র র ় ় ় ় 2ে, 3ে ও 4থড পর্যায়ে অ মথত (কািণ R একই পর্যায়ে Ca এর আগে ় ় অ মথত)। সুতিাং X = ললরথোর্ (Li), Q = সোডিয়াম (Na) এবং R = পটামসোর্ (K)। Li (3) : 1s2 2s1 2 2 6 1 Na (11) : 1s 2s 2p 3s 2 2 6 2 6 1 K (19) : 1s 2s 2p 3s 3p 4s ় ্ আযরনকরণ শততিবর তরব্ ম ় ় গ্যাসীে অবস্থাে এক মোল পরমাণু থেকে এক মোল ইলেকট্রন ি র ় ় ় অপসািণ করে এক মোল ধোতমক আয়ন গঠে কিনত প্নোৈেীে ্ ় ্ শক্তি নক আয়নিকিণ শক্তি বলে। ্ ত একই গ্রুপে উপর থেকে রেনচ শক্তিস্তরেি সংখ্যা ানড়, িনল পরমাণুর ত ় আকার ানড়। এনত সর্বশেষ তনভর ইনলক ট নেি ওপি নিউক্লিয়াসেি র ল ় ় আকর্ষণ কনর্ যায় এবং ইলেকট্রন অপসািণ সহৈ হয়। তাই Li থেকে ় ্ ় K এর রদনক আয়নিকিণ শক্তি হ্াস পায়। ় ্ আযরনকরণ শততিবর তরব্ ম : X (Li) \u003e Q (Na) \u003e R (K) ধ্ািব ধ্জমর তরব্ ম বে মৌল েত সহজে ইলেকট্রন তযাগ করে ধোতমক আয়নে পরিণত ় ্ হনত পানি, তাি ধাত ধর্ম তত বেশি। আয়নিকিণ শক্তি েত কম, ইলেকট্রন তযাগ তত সহৈ। ় ্ ় ় ় ় K এর আয়নিকিণ শক্তি স নচনে কম হওয়ায় এটি স নচনে সহজে ় ্ ় ইলেকট্রন তযাগ করে, আি Li এর আয়নিকিণ শক্তি স নচনে বেশি ় ় হওয়ায় এটি অপেক্ষাকৃ ত কঠ ি েিান ইলেকট্রন তযাগ করে। ধ্ািব ধ্জমর তরব্ ম : R (K) \u003e Q (Na) \u003e X (Li) ় ় এজন্য পানির সাথে K স নচনে তী রিান এবং Li স নচনে ধীনি র মে্ ব ো করে। 2K+2H O→2KOH+H 2 2 ততিক মাস্ট ার সাজেশন ় ্ সু তিাং X, Q ও R মৌলের আয়নিকিণ শক্তভর েব্ র্ (X \u003e Q \u003e R) এবং ধাত ধনর্ডি েব্ র্ (R \u003e Q \u003e X) পিস্পি র পিীত।"}],"board":"রাজশাহী বোর্ড ২০২৬"},{"id":"ch4-cq15","chapter":4,"num":15,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: 12A, 19B, 20C [A, B, C প্িীকী অথে বযবহবি]","subQuestions":[{"label":"ক","question":"বর্নন্ললনভর পর্যায় সূেটি বলখ। [৩ বোর্ডে এনসনছ]","answer":"বর্নন্ললনভর পর্যায় সূে: মৌলসর্ূনহি বিৌত ও রাসায়নিক ্ ় ধর্মা লল তানদি পারমাণবিক ভর বৃদ্ধিি সাথে পর্যায়ে্ব নর্ আ রতিতড হয়। 2 ় ত"},{"label":"খ","question":"He বক গ্রুপ 18 এ িাখা হয় কেন? ব্যাখ্যা কি। ় ়","answer":"ছহললোনর্ি ইলেকট্রন বিন্যাস He(2) → 1s। াইনভর তনি 2টি ইলেকট্রন থাকাে এনক গ্রুপ-2 এ িাখা উচচত ছছল। কিন্তু গ্রুপ-2 এর র র র মৌলগুনলা তী র তপ্ড় ৎ ধোতমক র্ৃ ৎক্ষার ধাত। অপিরদনক He এর ্ ত ত একমাে শক্তিস্তর (K তি, ধািণক্ষমতা 2) সম্পূর্ণ পূর্ণ, তাই এটি ইলেকট্রন গ্রহণ, ৈড ে বা িাগািারগ করে ো এবং রেরকবে থাকে। এর র র ্ ় ় ধর্ম Ne, Ar, Kr ইতযারদ রেরকব ে গ্যাসের সাথে মর্নল যায়। তাই He বক র ্ গ্রুপ-18 এ িাখা হয়।"},{"label":"গ","question":"পর্যায় সািরণনত C মৌলের অবস্থাে নির্ণয় কি। [১৫ বোর্ডে এনসনছ]","answer":"উদ্দীপকের C মৌলের পারমাণবিক সংখ্যা 20, অর্থাৎ C হলো ক্যালসিয়াম (Ca)। 2 2 6 2 6 2 Ca(20) → 1s 2s 2p 3s 3p 4s ় ্ ত ১. ইলেকট্রন র েযানস স নচনে াইনভর প্ধাে শক্তিস্তর n = 4। তাই C ক ক মৌলটি ৪ে পযাজয অ মথত। ২. স ড ছহঃথ তনি কেবল s অরবিটালে 2টি ইলেকট্রন আনছ (s- কবিভব র ল মৌল)। তাই এর গ্রুপ েম্ব ি = 2, অর্থাৎ C মৌলটি গ্রুপ-2 এ র র অ মথত। ় ় সু তিাং, C (Ca) মৌলটি পর্যায় সািরণি ৪থড পর্যায়ের গ্রুপ-2 এর মৌল; এটি একটি র্ৃ ৎক্ষার ধাত। ় ়"},{"label":"ঘ","question":"উদ্দীপকে উপ্ল্মখত A, B, C মৌলেনেি পারমাণবিক যাসানধডি েব্ র্ বিশ্লেষণ কি। [৩ বোর্ডে এনসনছ]","answer":"উদ্দীপকের A (12) = র্যাগনেমসোর্ (Mg), B (19) = পটাশিয়াম (K), C (20) = ক্যালসিয়াম (Ca)। 2 2 6 2 Mg(12) → 1s 2s 2p 3s (পর্যায়-3, গ্রুপ-2) 2 2 6 2 6 1 K(19) → 1s 2s 2p 3s 3p 4s (পর্যায়-4, গ্রুপ-1) 2 2 6 2 6 2 Ca(20) → 1s 2s 2p 3s 3p 4s (পর্যায়-4, গ্রুপ-2) A ও C এবিভবেনা: Mg ও Ca একই গ্রুপ (গ্রুপ-2) এর মৌল। গ্রুপেি র র র ু ্ ত ্ ় উপর থেকে রেনচ একটি করে েতে শক্তিস্তর েুকব হয়, িনল আকার ্ ত ানড়। Mg এর শক্তি তি 3টি, Ca এর 4টি। তাই Ca \u003e Mg। ় B ও C এবিভবেনা: K ও Ca একই পর্যায় (৪থড পর্যায়) এর মৌল। পর্যায়ের ার্ থেকে র্ানে প্রোটন সংখ্যা ও ইলেকট্রন সংখ্যা ানড় ্ ত ় কিন্তু শক্তি তি ানড় ো, িনল নিউক্লিয়াসেি আকর্ষণ ব নড় আকার কনর্। K ানর্ এবং Ca র্ানে, তাই K \u003e Ca। সু তিাং, পারমাণবিক যাসানধডি েব্ র্: B \u003e C \u003e A অর্থাৎ K \u003e Ca \u003e Mg। টাইপ ভিততিক মাস্ট ﻿"}],"board":"রাজশাহী বোর্ড ২০২২"},{"id":"ch4-cq16","chapter":4,"num":16,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: মৌল মৌল চিদ্হি িকরণ ় ় A ৩ে পর্যায়ের গ্রুপ-17 এ অ মথত B 1 থশষ তনভর ইলেকট্রন বিন্যাস 4s C Ca এর ৪ঘি র্ানে অ মথত D Zn এর ১ ঘি ানর্ অ মথত [A, B, C, D প্িীকী অথে বযবহবি]","subQuestions":[{"label":"ক","question":"অটট ক সূেটি র ৃত কি। [২ বোর্ডে এনসনছ]","answer":"মৌলসর্ূহনক তানদি পারমাণবিক ভরের ঊধ্ডেব্ র্ অনুসারে সাৈানল বজনকানো একটি মৌলের ধর্ম তাি অটটর্ মৌলের ধনর্ডি সাথে ় ড মর্নল যায়— এটি ই রেউলযান্নসি অটট ক সূে।"},{"label":"খ","question":"C H বক পযািামিে লা হয় কেন? ব্যাখ্যা কি। [৩ বোর্ডে এনসনছ] 4 10","answer":"C H (র উনটে) একটি অ্যালকেন; এর সাধারণ সংনকত 4 10 C H। এর অণুনত কার্বন-কার্বন ও কার্বন-হাইরোজেন এর মধ্যে n 2n+2 ্ ্ শুধু একে ন্ধে থাকে, ো িাো অনেক কঠ ি ে। ় ় িনল র উনটে রাসায়নিকরান অনেকটা রেরকবে; কেবল উচ্চ র ্ ্ ় তাপমানা, উচ্চ চাপ বা শক্তি শালী প্রবণতা নকি উপমথরতনত বিক্রিয়া করে। পযািামিে অথড স্বল্ আসপ্কব। তাই C H বক পযািামিে লা প 4 10 হয়।"},{"label":"গ","question":"C ও D মৌলের ইলেকট্রন বিন্যাস সাধারণ রেেনর্ি যরতেব্ র্- ব্যাখ্যা কি। [৩ বোর্ডে এনসনছ]","answer":"Ca (20) এর ৪ ঘি র্ানেি মৌল হলো 24 েং মৌল বে্বামর্োর্, তাই C = Cr। Zn (30) এর ১ ঘি ানর্ি মৌল হলো 29 েং মৌল কপাি, তাই D = Cu। আউি াউ েীরত অনুসারে ইলেকট্রন আগে কম শক্তভর 4s এবং পরে 5 10 3d অরবিটালে প্রবেশ করে। রকুন্ অধডপূর্ণ (d ) ও সম্পূর্ণ পূর্ণ (d ) অরবিটাল বেশি সুমথত। 2 2 6 2 ় ় • C (Cr, 24): সাধারণ রেেনর্ বিন্যাস হওয়ার কথা 1s 2s 2p 3s 6 4 2 3p 3d 4s। কিন্তু 3d অরবিটাল অধডপূর্ণ করে অরধক সুমথরত লানভর জন্য 4s থেকে 1টি ইলেকট্রন 3d বত চনল যায়। প্কৃ ত বিন্যাস: 2 2 6 2 6 5 1 24Cr → 1s 2s 2p 3s 3p 3d 4s 2 2 6 2 ় ় • D (Cu, 29): সাধারণ রেেনর্ বিন্যাস হওয়ার কথা 1s 2s 2p 3s 6 9 2 3p 3d 4s। কিন্তু 3d অরবিটাল সম্পূর্ণ পূর্ণ করে অরধক সুমথরত লানভর জন্য 4s থেকে 1টি ইলেকট্রন 3d বত চনল যায়। প্কৃ ত বিন্যাস: 2 2 6 2 6 10 1 29Cu → 1s 2s 2p 3s 3p 3d 4s তাই C (Cr) ও D (Cu) মৌলের ইলেকট্রন বিন্যাস সাধারণ রেেনর্ি যরতেব্ র্। ় ়"},{"label":"ঘ","question":"উদ্দীপকের A, B ও C মৌলসর্ূনহি ইলেকট্রন আসপ্কবি েব্ র্ বিশ্লেষণ কি। [৩ বোর্ডে এনসনছ]","answer":"A মৌলটি ৩ে পর্যায়ের গ্রুপ-17 এ অ মথত, তাই A = ক্লোরিন ি ল 1 ত ় (Cl, 17)। B এর থশষ তনভর বিন্যাস 4s, তাই B = পটাশিয়াম (K, 19)। C = বে্ব ামর্োর্ (Cr, 24)। 2 2 6 2 5 ় ় 17A(Cl) → 1s 2s 2p 3s 3p (৩য পর্যায়, গ্রুপ-17) 2 2 6 2 6 1 ক ক 19B(K) → 1s 2s 2p 3s 3p 4s (৪ে পর্যায়, গ্রুপ-1) 2 2 6 2 6 5 1 ক ক 24C(Cr) → 1s 2s 2p 3s 3p 3d 4s (৪ে পর্যায়, গ্রুপ-6) ার সাজেশন ় ় গ্যাসীে অবস্থাে কোনো মৌলের এক মোল র ক্সচ্ছন্ পরমাণুনত এক ্ ় ় মোল ইলেকট্রন েুকব হয়ে এক মোল ঋণাতমক আয়নে পরিণত হনত বে ্ ় ্ শক্তি রেগডত হয় তানক ইলেকট্রন আসপ্কব বলে। পারমাণবিক আকার ় ্ েত বছাট এবং রেউর্োি চার্জ েত বেশি, ইলেকট্রন আসপ্কব তত ল র বেশি। A (Cl) এর থশষ তনি 7টি ইলেকট্রন; মান 1টি ইলেকট্রন গ্রহণ করে র র র ় ্ত রেরকব ে গ্যাসের (Ar) বিন্যাস লাি করে। তাছাড় বা এর শক্তি তি মান র ্ ্ ় রতেটি, আকার বছাট। তাই এর ইলেকট্রন আসপ্কব স নচনে বেশি। ় ় ় B (K) ও C (Cr) উভয়ই ৪থড পর্যায়ের মৌল। একই পর্যায়ে ার্ থেকে র্ানে রেউর্োি চার্জ ানড় ও আকার কনর্, িনল ইলেকট্রন আসপ্কব ল র ানড়। K গ্রুপ-1 এ ( ানর্) এবং Cr গ্রুপ-6 এ (র্ানে) অ মথত। তাই Cr র র এর ইলেকট্রন আসপ্কব K অপেক্ষা বেশি। K সহজে ইলেকট্রন তযাগ র র করে, গ্হর্ণি প্ ণতা খু ই কম। র র সু তিাং ইলেকট্রন আসপ্কবি েব্ র্: A (Cl) \u003e C (Cr) \u003e B (K)।"}],"board":"বরিশাল বোর্ড ২০২১"},{"id":"ch4-cq17","chapter":4,"num":17,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: [A, Y এবং Z প্িীকী অথে বযবহবি]","subQuestions":[{"label":"ক","question":"ধাত কাকে বলে? [৬ বোর্ডে এনসনছ]","answer":"বে সকল মৌল এক বা একারধক ইলেকট্রন তযাগ করে ধোতমক ় ় ু আয়নে পরিণত হয়, তানদিনক ধাত বলে। 2+ ় ্ ়"},{"label":"খ","question":"Mg2+ লনত কী ুঝ? ব্যাখ্যা কি।","answer":"Mg হলো র্যাগনেমসোনর্ি ছদধোতমক আয়ন। Mg পরমাণ ্ ত (পারমাণবিক সংখ্যা 12) এর স নচনে াইনভর শক্তিস্তরেি 2টি 2+ ় ় ইলেকট্রন তযাগ করে Mg আয়নে পরিণত হয়। Mg→Mg2++2e 2+ Mg আয়নে প্রোটন 12টি কিন্তু ইলেকট্রন 10টি, তাই এর চার্জ +2। 2 2 6 ় ় এর ইলেকট্রন বিন্যাস 1s 2s 2p, ো রেরকবে গ্যাস রেেনেি র্নতা র র ্ মথরতশীল। ় ়"},{"label":"গ","question":"'A' এবং 'X' এর ইলেকট্রন আসপ্কবি েব্ র্ ব্যাখ্যা কি। [২ বোর্ডে এনসনছ] ় ্","answer":"উদ্দীপকের পর্যায় সািরণি ১র্ সারি বা ১র্ পর্যায়ে মান দুটি মৌল থাকে। তাই ানর্ি A হজো হাইরোজেন (H, 1) এবং র্ানেি থশষ ঘনভর X হজো দ্হলেযাম (He, 2)। 1 H(1) → 1s 2 He(2) → 1s সাধারণত একই পর্যায়ে ার্ থেকে র্ানে পারমাণবিক ব্যাসার্ধ কনর্ এবং ইলেকট্রন আসপ্কব ানড়। বস ছহনসন He এর আকার H এর বচনে বছাট। কিন্তু H এর 1s অরবিটালে 1টি ইলেকট্রন আনছ, অরবিটালটি অপূর্ণ। তাই H সহজেই একটি ইলেকট্রন গ্রহণ করে মথরতশীল H- আয়ন র র (1s2) গঠে কিনত পানি এবং শক্তি রেগডত করে। H(g)+e→H-(g) টাইপ ভ ﻿ অেযরদনক He এর 1s অরবিটাল দুটি ইলেকট্রন দিয়ে পূর্ণ (মথরতশীল বিভব ু ী দু ই-এর বিন্যাস)। েতে ইলেকট্রন গ্রহণ কিনত হলে তানক পি তী উচ্চ র র শক্তি তনি (2s) বেনত হন, ো মথরতশীলতা েটট করে। তাই He কোনো ় ্ ় ইলেকট্রন গ্রহণ কিনত চাে ো এবং এর ইলেকট্রন আসপ্কব প্রায় শূেয। র র র র ্ ক অতএ ইলেকট্রন আসপ্কবি েব্ র্: H \u003e He, অোৎ A \u003e X। ় ় ়"},{"label":"ঘ","question":"'Y' এবং 'Z' এর আয়নিকিণ শক্তি এবং পারমাণবিক ব্যাসার্ধ ় ্ পিস্পি র পিীতেব্ নর্ পরি রতিড ত হে-েুপ্কব সহ ব্যাখ্যা কি।","answer":"উদ্দীপকের ২ে সারি অর্থাৎ ২ে পর্যায়ে Ne এর ঠ ি ক আগেি দুটি ঘনি Y ও Z আনছ। তাই Y হজো অক্সিজেন (O, 8) এবং Z হজো ক্াররন (F, 9)। 2 2 4 O(8) → 1s 2s 2p (পর্যায় 2, গ্রুপ 16) 2 2 5 F(9) → 1s 2s 2p (পর্যায় 2, গ্রুপ 17) ক ় পারমাণরবক বযাসাধ্: O ও F একই পর্যায়ের মৌল এবং F, O এর র্ানে অ মথত। F এ প্রোটন ও ইলেকট্রন একটি করে বেশি, রকুন্ ি র ্ ত ় প্ধাে শক্তি তি একই (n = 2)। িনল F এর রেউর্োস াইনভর ্ত ় ইনলক ট জনক বেশি আকর্ষণ করে এবং শক্তিস্তর নিউক্লিয়াসেি কানছ র ল চনল আনস। তাই ব্যাসার্ধ: O \u003e F, অর্থাৎ Y \u003e Z। ় ্ আযরনকরণ শততিব: পরমাণু েত বছাট, াইনভর ইলেকট্রন ় ় নিউক্লিয়াসেি তত কানছ থাকে এবং তত বেশি আকরষিতড হয়। িনল ্ ় বসই ইলেকট্রন সিানত বেশি শক্তি লার্গ। F এর আকার O এর বচনে ় ্ বছাট, তাই আয়নিকিণ শক্তি: F \u003e O, অর্থাৎ Z \u003e Y। বদখা োনচ্ছ, Y থেকে Z এর রদনক থগনল ব্যাসার্ধ কনর্ কিন্ত ় ্ ্ আয়নিকিণ শক্তি ানড়। অতএ, Y ও Z এর আযরনকরণ শততিব ক ক এবং পারমাণরবক বযাসাধ্ পরসপর রবপরীিতরব্ জম পররবরভরি হয।"}],"board":"ঢাকা বোর্ড ২০২৩","diagramId":"ch4-cq17"},{"id":"ch4-cq18","chapter":4,"num":18,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: ক ় পর্যায় \\ P Q R S T গ্রুপ W Li F Ne X A C D Cl Ar Y B E Z Rb G ় ় চিতরতর একটি পর্যায় সারণির খ্িাংশ কদখ্াজনা হজযজে। [কযখ্াজন A, B, C, D, E এবং G প্িলেি ককাজনা মৌল নয।]","subQuestions":[{"label":"ক","question":"বর্নন্ললনভর পর্যায় সূেটি ললখ। [৪ বোর্ডে এনসনছ]","answer":"বর্নন্ললনভর পর্যায় সূে: মৌলসর্ূনহি বিৌত ও রাসায়নিক ্ ় ধর্মা লল তানদি পারমাণবিক ভর বৃদ্ধিি সাথে পর্যায়ে্ব নর্ আ রতিতড হয়।"},{"label":"খ","question":"'K' বক ক্ষার ধাত লা হয় কেন? [৫ বোর্ডে এনসনছ] ্ ্","answer":"পটাশিয়াম (K) গ্রুপ-1 এর মৌল; K(19) → 2 2 6 2 6 1 1s 2s 2p 3s 3p 4s। াইনভর তনভর 1টি ইলেকট্রন সহজে তযাগ ় ত ় করাে এটি অতযন্ সমে্ব ে ধাত। K পানির সাথে বিক্রিয়া করে ় হাইরোজেন গ্যাস ও তী র ক্ষার পটাশিয়াম হাইন ব ািাইর্ উৎপন্ন করে। ্ ্ ্ 2K+2H O→2KOH+H 2 2 ূ ় পানিনত দ্ ীিত হয়ে ক্ষার ততরি করে বলে K বক ক্ষার ধাত লা হয়। িততিক মাস্ট ার সাজেশন ় ় ়"},{"label":"গ","question":"উদ্দীপকের C ও D মৌলদনেি মধ্যে বকােটভর ইলেকট্রন আসপ্কব বেশি? ব্যাখ্যা কি। [২ বোর্ডে এনসনছ] ় ু","answer":"উদ্দীপকে পর্যায় W, X, Y, Z েথােব্ নর্ ২ে, ৩ে, ৪থড ও ৫র্ পর্যায় এবং গ্রুপ P, Q, R, S, T েথােব্ নর্ গ্রুপ-1, 2, 16, 17, 18 রেনদড শ করে র র (কািণ Li গ্রুপ-1, F গ্রুপ-17, Ne গ্রুপ-18)। সুতিাং C হলো ৩ে র র র ় ় পর্যায়ের গ্রুপ-2 এর মৌল র্যাগনেমসোর্ (Mg) এবং D হলো ৩ে পর্যায়ের গ্রুপ-16 এর মৌল সালিাি (S)। 2 2 6 2 Mg(12) → 1s 2s 2p 3s 2 2 6 2 4 S(16) → 1s 2s 2p 3s 3p ় ় C ও D একই পর্যায়ের মৌল। পর্যায়ের ার্ থেকে র্ানে প্রোটন সংখ্যা ানড় কিন্তু শক্তি তি ানড় ো, িনল পারমাণবিক ব্যাসার্ধ কনর্। ব্যাসার্ধ কম হলে রেউর্োস াইনভর ইনলক ট জনক বেশি আকর্ষণ ল র করে, তাই ইলেকট্রন আসপ্কব ানড়। তাছাড় বা S এর াইনভর তনি 6টি ইলেকট্রন থাকাে এটি 2টি ইলেকট্রন গ্রহণ করে অটট ক পূর্ণ কিনত র র র আগ্হী; কিন্তু Mg ইলেকট্রন তযাগ কিনত আগ্হী। র র র − 2− S+2e →S সু তিাং, C (Mg) অপেক্ষা D (S) মৌলের ইলেকট্রন আসপ্কব বেশি। ় ় ় ়"},{"label":"ঘ","question":"'X' পর্যায় এবং 'S' গ্রুপে মৌলগুনলাি আকানভর তলোমূলক বিশ্লেষণ কি। [২ বোর্ডে এনসনছ]","answer":"উদ্দীপক অেুযায়ী X পর্যায় হলো ৩ে পর্যায়; এর মৌলগুনলা A = Na (গ্রুপ-1), C = Mg (গ্রুপ-2), D = S (গ্রুপ-16), Cl (গ্রুপ-17) ও Ar র র র (গ্রুপ-18)। S গ্রুপ হলো গ্রুপ-17 (হযানলানৈে); এর মৌলগুনলা F র র র ় ় ় (পর্যায়-2), Cl (পর্যায়-3), E = Br (পর্যায়-4) ও G = I (পর্যায়-5)। ় ় X পযাজয আকার: একই পর্যায়ে ার্ থেকে র্ানে পারমাণবিক সংখ্যা ় ় াড় াে নিউক্লিয়াসে প্রোটন ও াইনি ইলেকট্রন সংখ্যা ানড়, কিন্তু ল র ু ্ ত ্ ় ় েতে শক্তি তি েুকব হয় ো। িনল নিউক্লিয়াসেি আকর্ষণ ব নড় ্ ত ় শক্তি তিগুনলা নিউক্লিয়াসেি কানছ চনল আনস এবং আকার বছাট হয়। আকানভর েব্ র্: A \u003e C \u003e D \u003e Cl অর্থাৎ Na \u003e Mg \u003e S \u003e Cl। Ar ় রেরকব ে গ্যাস; এটি অেয পরমাণুর সাথে ন্ধে গঠে করে ো বলে এর র ্ ্ ড ় ব্যাসার্ধ ভিন্ন পদধরতনত (িযান্ািওোলস ব্যাসার্ধ ছহনসন ) র্াপা হয়, তাই এই েব্ নর্ এর তলো করা হয় ো। S গ্ুথপ আকার: একই গ্রুপে উপর থেকে রেনচ প্রতটি বর্ৌনল একটি র র র ু ্ত ্ ্ করে েতে শক্তিস্তর েুকব হয়। প্রোটন সংখ্যা বৃদ্ধিি কারণে আকার র ্ ় ় ু ু ্ত ্ েতটকু কনর্, েতে শক্তি তি েুকব হওয়ায় আকার তাি বচনে বেশি ানড়। F(9) → 2টি শততিব স্র; Cl(17) → 3টি; Br(35) → 4টি; I 5টি আকানভর েব্ র্: G \u003e E \u003e Cl \u003e F অর্থাৎ I \u003e Br \u003e Cl \u003e F। সু তিাং, X পর্যায়ে ার্ থেকে র্ানে পরমাণুর আকার কনর্ এবং S গ্রুপে উপর থেকে রেনচ পরমাণুর আকার ানড়।"}],"board":"কুমিল্লা বোর্ড ২০২১"},{"id":"ch4-cq19","chapter":4,"num":19,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: 12A 19M (A, M, E প্িীকী অথে বযবহবি)","subQuestions":[{"label":"ক","question":"ভরসংখ্যা কাকে বলে? [৪ বোর্ডে এনসনছ] 2−","answer":"কোনো পরমাণুর নিউক্লিয়াসে উপমথত প্রোটন ও রেউ ট নেি মোট ল ি সংখ্যানক ঐ পরমাণুর ভরসংখ্যা বলে। ﻿ ় 2− ় ়"},{"label":"খ","question":"16/8 O লনত কী ব াঝাে? ব্যাখ্যা কি।","answer":"16/8 O দ্বারা অক্সিজেনের অক্সাইড আয়ন ব াঝাে, োি পারমাণবিক সংখ্যা 8 এবং ভরসংখ্যা 16। এনত প্রোটন সংখ্যা = 8, রেউ ট ে সংখ্যা = 16-8 = 8। 2− ় ় অক্সিজেন পরমাণু 2টি ইলেকট্রন গ্রহণ করে O আয়নে পরিণত হয়, র র তাই এনত ইলেকট্রন সংখ্যা = 8 + 2 = 10 এবং আয়নটভর চার্জ -2। 2− O+2e→O 2− 2 2 6 ় ় O আয়নেি ইলেকট্রন বিন্যাস 1s 2s 2p, ো রেেনেি র্নতা র মথরতশীল।"},{"label":"গ","question":"উদ্দীপকে উপ্ল্মখত E মৌলটি ি ইলেকট্রন বিন্যাস ললর্খ পর্যায় ল র সািরণনত অবস্থাে ব্যাখ্যা কি।","answer":"উদ্দীপকের E এর পারমাণবিক সংখ্যা 29, তাই E হজো কপার (Cu)। 2 2 6 2 6 9 2 ় ় সাধারণ রেেনর্ বিন্যাস 1s 2s 2p 3s 3p 3d 4s হওয়ার কথা। কিন্তু d অরবিটাল পূর্ণ (d10) হলে বেশি মথরতশীল হয়, তাই 4s থেকে 1টি ইলেকট্রন 3d বত চনল যায়। কপানভর প্কৃ ত ইলেকট্রন র র বিন্যাস: 2 2 6 2 6 10 1 Cu(29) → 1s 2s 2p 3s 3p 3d 4s ় ় ্ত ় পর্যায়: স নচনে াইনভর প্ধাে শক্তিস্তর n = 4, তাই Cu ৪থড পর্যায়ের মৌল। ় ় ত ত ্ ্ গ্রুপ: স নচনে াইনভর শক্তিস্তরে s অরবিটাল এবং আগেি শক্তিস্তরে d অরবিটাল আনছ। তাই s ও d অরবিটালেি ইলেকট্রন যোগ করে গ্রুপ েম্ব ি = 1 + 10 = 11। ় ় ক ক অতএ, E (Cu) পর্যায় সািরণি ৪ে পযাজযর 11 নং গ্ুথপ অ মথত। বিভব ় ়"},{"label":"ঘ","question":"উদ্দীপকে উপ্ল্মখত মৌল রতেটি ি থক্ষতরে ইলেকট্রন আসপ্কব ি েব্ র্ ল র বিশ্লেষণ কি। [২ বোর্ডে এনসনছ]","answer":"উদ্দীপকের A = র্যাগনেমসোর্ (Mg, 12), M = পটাশিয়াম (K, 19) এবং E = কপাি (Cu, 29)। 2 2 6 2 Mg(12) → 1s 2s 2p 3s (পর্যায় 3, গ্রুপ 2) 2 2 6 2 6 1 K(19) → 1s 2s 2p 3s 3p 4s (পর্যায় 4, গ্রুপ 1) 2 2 6 2 6 10 1 Cu(29) → 1s 2s 2p 3s 3p 3d 4s (পর্যায় 4, গ্রুপ 11) পারমাণবিক ব্যাসার্ধ কমনল ইলেকট্রন আসপ্কব ানড় এবং ব্যাসার্ধ াড় বলে ইলেকট্রন আসপ্কব কনর্। ় র K ও Cu একই (৪থড) পর্যায়ের মৌল। K গ্রুপ-1 এ এবং Cu গ্রুপ-11 এ, র র অর্থাৎ Cu র্ানে। Cu এর প্রোটন সংখ্যা (29) K এর (19) বচনে অনেক (53) → ় ় ় বেশি হওয়ায় াইনভর ইলেকট্রন বেশি আকৃ টট হয়, তাই আকার K \u003e Cu। Mg ও K এর মধ্যে K এ একটি বেশি শক্তিস্তর আনছ এবং K গ্রুপ-1 এর মৌল, তাই K এর আকার Mg এর বচনে ড় : K \u003e Mg। ্ ত Mg ও Cu এর মধ্যে Cu এ একটি শক্তিস্তর বেশি থাকনলও এর প্রোটন সংখ্যা Mg এর বচনে 17টি বেশি এবং 3d অরবিটাল পূর্ণ ় ় ় হওয়ায় নিউক্লিয়াসেি আকর্ষণ অনেক বেশি। িনল Cu এর 29E ় পারমাণবিক ব্যাসার্ধ (128 pm) Mg এর যাসানধডি (160 pm) বচনে কম। K এর ব্যাসার্ধ 227 pm। তাই পারমাণবিক যাসানধডি েব্ র্: K \u003e Mg \u003e Cu। ্ ক অতএ ইলেকট্রন আসপ্কবি েব্ র্: Cu \u003e Mg \u003e K, অোৎ E \u003e A \u003e ় M। রবভিন্ন গ্ুথপ উপভস্ি মৌলগুজোর রবথশষ নাম"}],"board":"সিলেট বোর্ড ২০২৫"},{"id":"ch4-cq20","chapter":4,"num":20,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: গ্রুপ-K পর্যায়-1 A গ্রুপ-L He টাইপ ভিততিক মাস্ট ার সাজেশন পর্যায় -2 B Be পর্যায় -3 C Mg [চিতরতর পর্যায় সারণির খ্িাংশ এবং A, B, C, D এবং E মৌলের প্িলেি প্িীক নয।] র র","subQuestions":[{"label":"ক","question":"অধডধাত কাকে বলে? [২ বোর্ডে এনসনছ] ্ ়","answer":"ক ু ু অধ্ধ্াি: বেস মৌল ধাত ও অধাত উিনেি রকছ রকছ ধর্ম প্দশডে ু ু করে, তানদিনক অধডধাত বা ধাতকল্ বলে। যেমন: ব ািে (B), মসললকে (Si), ৈানর্ডরেোর্ (Ge)। ্ ় ়"},{"label":"খ","question":"Fe এর ছদনোৈী আয়ন জারক এবং র জারক উভয়িূর্প মে্বো করে— ব্যাখ্যা কি।","answer":"Fe এর ছদনোৈী আয়ন হলো বভরাস আয়ন (Fe এর জারণ সংখ্যা +2। বলাহার জারণ সংখ্যা 0, +2 ও +3 হনত পানি; +2 র্ধয তী অবস্থা। 2+ 3+ Fe আয়ন একটি ইলেকট্রন তযাগ করে Fe পানি; এর্ক্ষতরে এটি রেনৈ ৈারিত হয়ে অেযনক র ৈারিত করে, অর্থাৎ র জারক ছহনসন কাৈ করে। 2+ 3+ − Fe →Fe +e 2+ আ াি Fe আয়ন দুটি ইলেকট্রন গ্রহণ করে Fe পরমাণুনত পরিণত র র ় ় হনত পানি (যেমন: Zn এর সাথে বিক্রিয়াে); এর্ক্ষতরে এটি রেনৈ র ৈারিত হয়ে অেযনক ৈারিত করে, অর্থাৎ জারক ছহনসন কাৈ করে। 2+ − Fe +2e →Fe ্ ় তাই Fe এর ছদনোৈী আয়ন জারক ও র জারক উভয়িূর্প মে্বো করে।"},{"label":"গ","question":"C ধাত হয়েও A এর সাথে কীিান যৌগ গঠে করে তা ব্যাখ্যা কি।","answer":"উদ্দীপকের গ্রুপ-K হলো গ্রুপ-1 (কািণ পর্যায়-2 এ Be এর র র আগেি মৌল)। তাই A = হাইরোজেন (H), B = ললরথোর্ (Li), C = সোডিয়াম (Na)। ু সাধারণত ধাত অধাতি সাথে আয়নিক যৌগ গঠে করে। হাইরোজেন গ্রুপ-1 এ থাকনলও এটি একটি অধাত, ো হযানলানৈনেি র্নতা একটি ইলেকট্রন গ্রহণ করে He এর র্নতা মথরতশীল ইলেকট্রন বিন্যাস অর্জন ে র র কিনত পানি। 2 2 6 1 • C (Na): 1s 2s 2p 3s — সর্বশেষ তনভর 1টি ইলেকট্রন তযাগ করে Ne এর বিন্যাস অর্জন ে করে। + − Na→Na +e • A (H): 1s1 — একটি ইলেকট্রন গ্রহণ করে He এর বিন্যাস (1s2) র র অর্জন ে করে হাই বাইর্ আয়ন গঠে করে। − − H+e →H + − ় উৎপন্ন Na ও H আয়ন পিস্পি মথি ত দুযরতক আকষডর্ণ আ দধ ় ় ় হয়ে আয়নিক যৌগ সোডিয়াম হাই বাইর্ (NaH) গঠে করে। Na++H−→NaH তাপ 2Na+H ⟶ 2NaH 2 অতএ, C ধাত হয়েও A (হাইরোজেন) এর সাথে ইলেকট্রন আদাে- ় ্ ় প্দানেি মাধ্যমে আয়নিক বন্ধনে আ দধ হয়ে যৌগ (NaH) গঠে করে। র ্ ﻿"},{"label":"ঘ","question":"উচ্চ তাপর্াযায় গ্রুপ K এবং গ্রুপ L এর মৌলসর্ূহ অতযন্ সমে্ব ে র র ় ্ হলেও সমে্বেতাি কািণ ভিন্ন—উপ্কবটি বিশ্লেষণ কি।","answer":"উদ্দীপক অনুসারে গ্রুপ-K হলো গ্রুপ-1 এবং গ্রুপ-L হলো গ্রুপ-17 র র র র D Ne ় ু (রেরকব ে গ্যাসের আগেি গ্রুপ)। তাই B = Li, C = Na (ক্ষার ধাত) এবং ্ র E Ar D = F (বফ্ারিে), E = Cl (ক্লোরিন) (হযানলানৈে)। ল ল মৌল ইজেক ট ন বিন্যাস যোজ্যতা ইজেক ট ন র র Li (B) 1s2 2s1 1 Na (C) 2 2 6 1 1 1s 2s 2p 3s ় ় F (D) 2 2 5 7 1s 2s 2p Cl (E) 2 2 6 2 7 1s 2s 2p 3s 5 3p গ্রুপ-K (োর ধ্াি) এর সভতর্ব যিার কারণ ত ় এদের সর্বশেষ তনি মান 1টি ইলেকট্রন থাকে, পরমাণুর আকার ড় ় ্ এবং আয়নিকিণ শক্তি খু ই কম। তাই এরা সহজে ইলেকট্রন তযাগ ় ় করে রেরকবে গ্যাসের মথরতশীল বিন্যাস অর্জন ে করে ধোতমক আয়ন র ্ ি গঠে করে। অর্থাৎ ইলেকট্রন তযার্গি প্ ণতাি কারণে এরা অতযন্ ু ু সমে্ব ে। 2Na+Cl →2NaCl 2 + − Na→Na +e 2+ ), বেখানে Fe ় গ্রুপ-L (হযাজোজেন) এর সভতর্ব যিার কারণ এদের সর্বশেষ তনি 7টি ইলেকট্রন থাকে; অটটক পূির্ণ মান 1টি ইলেকট্রন প্নোৈে। এদের তপ্ড় ৎ ঋণাতমকতা ও ইলেকট্রন আসপ্কব র র ় ় আয়নে পরিণত হনত অনেক বেশি। তাই এরা সহজে ইলেকট্রন গ্রহণ করে ঋণাতমক আয়ন র র গঠে করে। অর্থাৎ ইলেকট্রন গ্হর্ণি প্ ণতাি কারণে এরা অতযন্ র র সমে্ব ে। − − Cl +e →Cl H +Cl →2HCl 2 2 ় ্ ় উচ্চ তাপর্াযায় পরমাণুগুনলাি গরতশক্তি ানড়, িনল উভয় গ্রুপেি ় ় মৌলই আিও দ্ুত বিক্রিয়া করে। তন গ্রুপ-K এর মৌলের সমে্বেতা র র ় ্ রেম্ন আয়নিকিণ শক্তভর কারণে ইলেকট্রন তযার্গি উপর রেিড িশীল, ় ্ আি গ্রুপ-L এর মৌলের সমে্বেতা উচ্চ ইলেকট্রন আসপ্কবি কারণে র র ইলেকট্রন গ্হর্ণি উপর রেিড িশীল। এজন্য গ্রুপ-K এ উপর থেকে র র র ় ় রেনচ সমে্ব েতা ানড় (Li \u003c Na), কিন্তু গ্রুপ-L এ উপর থেকে রেনচ সমে্ব েতা কনর্ (F \u003e Cl)। ত ় সু তিাং গ্রুপ K এবং গ্রুপ L এর মৌলসর্ূহ অতযন্ সমে্ব ে হলেও র র ় ্ সমে্ব েতাি কািণ ভিন্ন—উপ্কবটি েথাথড। ্ ক পর্যায় সারণির একই গ্ুথপর মৌলগুজো একই রকম ক ক রাসায়নিক ধ্ম প্দশন কজর"}],"board":"কুমিল্লা বোর্ড ২০২৬"},{"id":"ch4-cq21","chapter":4,"num":21,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: [এখ্াজন Q, R, Y ও Z প্িীকী অথে বযবহবি।]","subQuestions":[{"label":"ক","question":"ভরসংখ্যা কাকে বলে? [৪ বোর্ডে এনসনছ] ়","answer":"িরসংখ্যা: কোনো পরমাণুর নিউক্লিয়াসে উপমথত প্রোটন ও রেউ ট ে ল ি সংখ্যাি যোগিলনক ঐ পরমাণুর ভরসংখ্যা বলে। ় ত"},{"label":"খ","question":"পটাশিয়ামনক ক্ষারধাত লা হয় কেন? ব্যাখ্যা কি। [৫ বোর্ডে এনসনছ] ্ ়","answer":"পটাশিয়াম (K) গ্রুপ-1 এর মৌল; এর স ড ছহঃথ তনি 1টি ইলেকট্রন থাকে (2, 8, 8, 1)। এটি পানির সাথে তী রিান বিক্রিয়া করে তী র ক্ষার KOH উৎপন্ন করে। 2K+2H O→2KOH+H 2 2 ূ ় এর অক্সাইডও পানিনত দ্ ীিত হয়ে ক্ষার ততরি করে (K O + ় ় H O→2KOH)। পানির সাথে বিক্রিয়াে ক্ষার উৎপন্ন করে বলে 2 ় পটাশিয়ামনক ক্ষার ধাত লা হয়।"},{"label":"গ","question":"Q ও R মৌলদে পিস্পি বকাে ধিনেি ন্ধে গঠে করে? ব্যাখ্যা র কি। টাইপ ভিততিক মাস্ট ার সাজেশন","answer":"উদ্দীপকে Q ও Mg একই পর্যায়ে পাশাপামশ অ মথত এবং Q, ৃ ় ় Mg এর আগে। Mg ততীে পর্যায়ের গ্রুপ-2 এর মৌল। তাই Q হলো ৃ ় ় ় ততীে পর্যায়ের গ্রুপ-1 এর মৌল সোডিয়াম (Na)। ৃ ় ় R একই (ততীে) পর্যায়ে F এর গ্রুপেি (গ্রুপ-17) ঠ ি ক ানর্ অ মথত, র র ৃ ় ় অর্থাৎ R ততীে পর্যায়ের গ্রুপ-16 এর মৌল সালিাি (S)। 2 2 6 1 Na (11) : 1s 2s 2p 3s 2 2 6 2 4 S (16) : 1s 2s 2p 3s 3p ু ত Na ধাত; এর স ড ছহঃথ তনভর 1টি ইলেকট্রন তযাগ করে রেেে (Ne) ি র এর র্নতা মথরতশীল ইলেকট্রন বিন্যাস অর্জন ে করে। S অধাত; এটি 2টি ি র ইলেকট্রন গ্রহণ করে আগডে (Ar) এর র্নতা মথরতশীল ইলেকট্রন র র বিন্যাস অর্জন ে করে। + − 2Na→2Na +2e − 2− S+2e →S 2Na++S2− →Na S 2 অর্থাৎ 2টি Na পরমাণু থেকে 2টি ইলেকট্রন সম্পূর্ণিূর্প S পরমাণুনত + ত ় ্ থাোন্রিত হয় এবং উৎপন্ন র পিীত চার্জ েুকব Na ও S ্ ় মথি ত দুযরতক আকর্ষণ বলে েুকব হয়। ্ ় ় সু তিাং Q (Na) ও R (S) মৌলদে পিস্পি আয়নিক ন্ধে গঠে করে ় সোডিয়াম সালফাইড (Na2S) উৎপন্ন করে।"},{"label":"ঘ","question":"উদ্দীপকের গ্রুপেি মৌলগুনলা একই ধর্ম সম্পন্ —সর্ীকিণসহ বিশ্লেষণ কি।","answer":"উদ্দীপকের গ্রুপে F এর রেনচ Y ও Z অ মথত। F গ্রুপ-17 এর র র ৃ ় ় ় ় মৌল; Y ততীে পর্যায়ে হওয়ায় Y হলো ক্লোরিন (Cl) এবং Z চতথড ় ় ় পর্যায়ে হওয়ায় Z হলো ব রামর্ে (Br)। এরা হযানলানৈে। 2 2 5 F (9) : 1s 2s 2p 2 2 6 2 5 Cl (17) : 1s 2s 2p 3s 3p 2 2 6 2 6 10 2 Br (35) : 1s 2s 2p 3s 3p 3d 4s 4p প্রতটভর স ড ছহঃথ তনি 7টি ইলেকট্রন (ns2 np5) থাকে। রাসায়নিক ি র ধর্ম র্ূ লত স ড ছহঃথ তনভর ইনলক ট নেি উপর রেিড ি করে, তাই এরা ি র একই িকম ধর্ম প্দশডে করে। ১. প্নতযনক 1টি ইলেকট্রন গ্রহণ করে রেরকব ে গ্যাসের ইলেকট্রন র র র র ্ ্ ় বিন্যাস অর্জন ে করে এবং -1 চার্জ েুকব অযাযায়ে গঠে করে; এদের যোজনী 1। − − − − − F+e →F; Cl+e →Cl; Br+e →Br ২. প্নতযনক ছদপরমাণুক অণু (F, Cl, Br ) গঠে করে। র 2 2 2 ৩. হাইরোজেনের সাথে বিক্রিয়া করে হাইরোজেন হযালাইর্ গঠে ্ ্ করে, োনদি জলীয় দ্রবণ এসিড। H +F →2HF 2 2 ﻿ H +Cl →2HCl H2+Br2→2HBr 2 2 ় ় ৪. সোডিয়াম ধাতি সাথে বিক্রিয়া করে একই ধিনেি আয়নিক লবণ (হযালাইর্) গঠে করে। 2Na+F →2NaF 2 র 2Na+Cl →2NaCl 2 2Na+Br →2NaBr 2 সু তিাং স ড ছহঃথ তনি একই সংখযক (7টি ) ইলেকট্রন থাকাে ি র উদ্দীপকের গ্রুপেি মৌলগুনলা (F, Y, Z) একই ধর্ম সম্পন্।"}],"board":"চট্টগ্রাম বোর্ড ২০২৬","diagramId":"ch4-cq21"},{"id":"ch4-cq22","chapter":4,"num":22,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: 2 [এখ্াজন X, Q, R, Y ও Z প্িীকী অথে বযবহবি]","subQuestions":[{"label":"ক","question":"ইলেকট্রন আসপ্কব কাকে বলে? [৪ বোর্ডে এনসনছ]","answer":"্ ় ় ইলেকট্রন আসততিব: গ্যাসীে অবস্থাে কোনো মৌলের এক মোল বিভব ্ ় র ক্সচ্ছন্ পরমাণু নত এক মোল ইলেকট্রন েুকব হয়ে এক মোল একে ় ় ঋণাতমক আয়নে পরিণত হনত বে শক্তি রেগডত হয়, তানক ঐ মৌলের ইলেকট্রন আসপ্কব বলে। ় ়"},{"label":"খ","question":"ছহললোর্ আকানি হাইরোজেন অপেক্ষা বছাট কেন? ব্যাখ্যা করো। ি","answer":"হাইরোজেন (H) ও ছহললোর্ (He) উিনেি ইলেকট্রন একই ্ র শক্তি তি 1s এ অবস্থাে করে। 2− ি আয়ন H(1) : 1s1 He(2) : 1s2 ় ় H এর নিউক্লিয়াসে 1টি প্রোটন কিন্তু He এর নিউক্লিয়াসে 2টি প্রোটন র র ল ল ় ় থাকে। িনল He এর রেউর্োি চার্জ বেশি এবং রেউর্োস একই ল ল ্ত ্ শক্তি তনভর ইলেকট্রনগুনলানক অরধক শক্তিনত বকননড ্ি রদনক আকর্ষণ র র করে। ় ় এনত ইলেকট্রন বর্ঘ সংকু চচত হয় এবং পরমাণুর ব্যাসার্ধ কনর্ যায়। তাই ছহললোর্ আকানি হাইরোজেন অপেক্ষা বছাট।"},{"label":"গ","question":"উদ্দীপকের X, R ও Y মৌলের তপ্ড় ৎ ঋণাতমকতাি েব্ র্ ব্যাখ্যা করো।","answer":"উদ্দীপকের সারিনত Mg অ মথত, তাই সারিটি পর্যায় সািরণি ৃ ় ় ৃ ় ় ততীে পর্যায়। F এর রেনচ অ মথত Y হলো ততীে পর্যায়ের গ্রুপ 17 5 এর মৌল ক্লোরিন (Cl)। Y এর ঠ ি ক ানর্ R গ্রুপ 16 এর সালিাি (S) ় এবং তাি ানর্ X গ্রুপ 15 এবিভবসভরাস (P)। 2 2 6 2 3 X = P(15) : 1s 2s 2p 3s 3p 2 2 6 2 4 R = S(16) : 1s 2s 2p 3s 3p র 2 2 6 2 5 Y = Cl(17) : 1s 2s 2p 3s 3p একই পর্যায়ে ার্ থেকে র্ানে থগনল পারমাণবিক সংখ্যা তথা ় ্ ় নিউক্লিয়াসেি ধোতমক চার্জ বৃদ্ধি পায়, কিন্তু ইলেকট্রন একই ল র − ্ত ্ ় ় ৃ ত শক্তি তনি েুকব হয়। িনল রেউর্োস কতড ক সর্বশেষ তনভর ইনলক ট নেি প্রত আকর্ষণ ানড় এবং পরমাণুর আকার বছাট হয়। ় পরমাণুর আকার েত বছাট হয়, ববন্ধনের ইলেকট্রন বৈাড় ানক রেনৈি রদনক আকষডর্ণি ক্ষমতা অর্থাৎ তপ্ড় ৎ ঋণাতমকতা তত বেশি হয়। টাইপ ভিততিক মাস্ট ার সাজেশন পরমাণুর আকার: P \u003e S \u003e Cl; তাই তপ্ড় ৎ ঋণাতমকতা: P \u003c S \u003c Cl িততড় ৎ ঋণাতমকরার তরব্ ম: X \u003c R \u003c Y"},{"label":"ঘ","question":"\"একই গ্রুপেি মৌলগুনলা একই ধর্ম প্দশডে করে\"—উদ্দীপকের র র F, Y এবং Z মৌলের ধনর্ডি আনলানক বিশ্লেষণ করো।","answer":"উদ্দীপকের F, Y ও Z মৌল রতেটি পর্যায় সািরণি গ্রুপ 17 এ উপর থেকে রেনচ অ মথত। তাই F = বফ্ারিে, Y = ক্লোরিন (Cl) এবং ি ল ল Z = ব রামর্ে (Br)। এরা হযানলানৈে। 2 2 5 F(9) : 1s 2s 2p 2 2 6 2 5 Cl(17) : 1s 2s 2p 3s 3p 2 2 6 2 6 10 2 5 Br(35) : 1s 2s 2p 3s 3p 3d 4s 4p ্ ত রতেটি মৌলেরই সর্বশেষ শক্তি তনি 7টি ইলেকট্রন (ns2 np5) আনছ। িনল এরা প্নতযনক 1টি ইলেকট্রন গ্রহণ করে রেকটতর্ রেরকবে র র গ্যাসের ইলেকট্রন বিন্যাস অর্জন ে করে এবং একই িকম রাসায়নিক ধর্ম প্দশডে করে: ১. এদের যোজনী 1 এবং এরা ইলেকট্রন গ্রহণ করে একে ঋণাতমক র র − − − আয়ন (F, Cl, Br ) গঠে করে। ২. এরা ছদপরমাণুক অণু (F, Cl, Br ) ছহনসন অবস্থাে করে। 2 2 2 ি ৩. হাইরোজেনের সাথে বিক্রিয়া করে হাইরোজেন হযালাইর্ উৎপন্ন ্ ্ করে: H +F →2HF 2 2 H +Cl →2HCl 2 2 H +Br →2HBr 2 2 ৪. ধাতি সাথে বিক্রিয়া করে লবণ উৎপন্ন করে: 2Na+F →2NaF 2 2Na+Cl →2NaCl 2 2Na+Br →2NaBr 2 ৫. এরা স াই জারক ছহনসন কাৈ করে এবং অধাত। ্ ় ় ় তন উপর থেকে রেনচ আকার বৃদ্ধি পাওয়ায় সমে্বেতা ও জারণ ক্ষমতা কনর্ (F \u003e Cl \u003e Br); তাই উপনভর হযানলানৈে রেনচি হযানলানৈজনক তাি লবণ থেকে প্রতথামপত কিনত পানি: Cl +2NaBr→2NaCl+Br 2 2 সু তিাং F, Y ও Z মৌলগুনলাি বোৈযতা তনভর ইলেকট্রন বিন্যাস ় ় ় একই হওয়ায় এরা একই িকম রাসায়নিক ধর্ম প্দশডে করে, ো প্রমাণ করে বে একই গ্রুপেি মৌলগুনলা একই ধর্ম প্দশডে করে। র র"}],"board":"সিলেট বোর্ড ২০২৬","diagramId":"ch4-cq22"},{"id":"ch4-cq23","chapter":4,"num":23,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও:","subQuestions":[{"label":"ক","question":"বর্ান িাইোনভর েেী সূেটি বলখ। [৪ বোর্ডে এনসনছ]","answer":"সদশ ধর্মর মশটট রতেটি মৌলনক তানদি পারমাণবিক ভরের বছাট থেকে ড় েব্ মানু সানি সাৈানল র্ানঝি মৌলটি ি পারমাণবিক ভর ﻿ ় ় অপি দুটি মৌলের পারমাণবিক ভরের গনড় ি প্রায় সমান হয়। এনক বর্ান িাইোনভর েেী সূে বলে। 2 2 4"},{"label":"খ","question":"অক্সিজেনের যোজনী ও বোৈযতা ইলেকট্রন সমান েে– ব্যাখ্যা কি।","answer":"অক্সিজেনের (8O) ইলেকট্রন বিন্যাস: 1s 2s 2p। এর ্ ত স ড ছহঃথ শক্তিস্তরে 6টি ইলেকট্রন আনছ, তাই বোৈযতা ইলেকট্রন 6। ি র র কিন্তু অটট ক পূর্ণ করে রেেনেি র্নতা মথরতশীল বিন্যাস থপনত ় ় অক্সিনৈজনক মান 2টি ইলেকট্রন গ্রহণ বা থশোি কিনত হয়। তাই র র অক্সিজেনের যোজনী 2। যেমন: H O বত O দুটি H এর সাথে েুকব। 2 ় অর্থাৎ যোজনী রেিড ি করে ন্ধে গঠনে অংশ বেওো ইনলক ট নেি ত ় সংখ্যাি উপর, াইনভর তনভর মোট ইনলক ট নেি উপর েে। তাই অক্সিজেনের যোজনী (2) ও বোৈযতা ইলেকট্রন (6) সমান েে। ় ়"},{"label":"গ","question":"(i)েং এর মৌলসর্ূনহি ধাত ধর্ম ব্যাখ্যা কি। [২ বোর্ডে এনসনছ] ত ু ্","answer":"উদ্দীপকের (i)েং এর মৌলসর্ূহ ব রিললোর্ (Be), র্যাগনেমসোর্ ় ু (Mg) ও ক্যালসিয়াম (Ca); এরা গ্রুপ-2 এর র্ৃৎক্ষার ধাত। 2 2 4Be → 1s 2s 2 2 6 2 12Mg → 1s 2s 2p 3s 2 2 6 2 6 2 20Ca → 1s 2s 2p 3s 3p 4s ় ় ইলেকট্রন তযাগ করে ধোতমক আয়নে পরিণত হওয়ার প্ ণতানক ধাত ধর্ম বলে। এ মৌলগুনলা স ড ছহঃথ তনভর 2টি ইলেকট্রন তযাগ ি র করে ধোতমক আয়ন গঠে করে: 2+ − Be → Be +2e 2+ − Mg→Mg +2e 2+ − Ca → Ca +2e ্ত ় গ্রুপে উপর থেকে রেনচ শক্তিস্তর সংখ্যা াড় াে পরমাণুর আকার ানড়, াইনভর ইনলক ট নেি উপর নিউক্লিয়াসেি আকর্ষণ কনর্ এবং র ল ় ্ ় আয়নিকিণ শক্তি কনর্। িনল ইলেকট্রন তযাগ সহৈ হয় এবং ধাত ্ ত ধর্ম ানড়। Be এর শক্তি তি 2টি, Mg এর 3টি এবং Ca এর 4টি। ধ্ািব ধ্জমর তরব্ ম: Be \u003c Mg \u003c Ca সু তিাং, (i)েং এর মৌলগুনলাি মধ্যে Ca এর ধাত ধর্ম স নচনে বেশি এবং Be এর স নচনে কম।"},{"label":"ঘ","question":"(ii)েং এর মৌলসর্ূহ একই গ্রুপেি অন্িড কব রক-ো? বিক্রিয়াসহ বিশ্লেষণ কি। [২ বোর্ডে এনসনছ]","answer":"উদ্দীপকের (ii)েং এর মৌলসর্ূহ: 9X = বফ্ারিে (F), 17Y = ক্লোরিন (Cl) এবং 35Z = ব রামর্ে (Br)। ল ্ 2 2 5 র 9F → 1s 2s 2p 2 2 6 2 5 17Cl → 1s 2s 2p 3s 3p 2 2 6 2 6 10 2 5 35Br → 1s 2s 2p 3s 3p 3d 4s 4p 2 5 রতেটি মৌলেরই স ড ছহঃথ শক্তিস্তরেি ইলেকট্রন বিন্যাস ns np, ি র ত ্ অর্থাৎ াইনভর তনি 7টি ইলেকট্রন। গ্রুপ েম্ব ি = 10 + (2 + 5) = র র 17। একই িকম ছহঃথ ইলেকট্রন র েযানসি কারণে এদের রাসায়নিক ি র ধর্মও একই িকম। ্ ্ (১) দ্বপরমাণু ক অণু গেন: রতেটি মৌলই ছদপরমাণুক অণু F2, Cl2 ও Br ছহনসন থাকে। 2 (২) হাইজ ব াজেজনর সাথে রবভতর্ব যা: রতেটি ই হাইরোজেনের সাথে ্ ্ র মে্ ব ো করে হাইরোজেন হযালাইর্ ততরি করে: অন্ধকানিও H +F ⟶ 2HF 2 2 সূ েড ানলাক ় H +Cl ⟶ 2HCl 2 2 তাপ H +Br ⟶ 2HBr 2 2 ় ী ় এদের জলীয় দ্রবণ এসিডধর্ী, ো কার্বনেনটি সাথে বিক্রিয়া করে CO র 2 উৎপন্ন করে: CaCO +2HCl→CaCl +CO +H O 3 2 2 2 টাইপ ভিততিক মাস্ট ার সাজেশন ় (৩) ধ্াির সাথে রবভতর্ব যা: রতেটি ই বসাপ্র্োনর্ি সাথে বিক্রিয়া করে লবণ ততরি করে: 2Na+F →2NaF 2 2Na+Cl →2NaCl 2 যোজনী বা যোজ্যতা"}],"board":"যশোর বোর্ড ২০২২","diagramId":"ch4-cq23"},{"id":"ch5-cq1","chapter":5,"num":1,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: ্ ত মৌল ইজেক ট ন প্রধান শততিব স্র পারমাণরবক সংখ্যা বিন্যাস A — — 30 B ns2 np5 3 — C (n − 1)d6 ns2 4 — [এখ্াজন A, B এবং C ককাজনা প্িলেি মৌলের প্িীক নয] র র","subQuestions":[{"label":"ক","question":"েেী সূে কী? ু ্ ত ্ ত","answer":"একই িকম ধর্মর মশটট রতেটি মৌলনক তানদি পারমাণবিক ভরের ঊধ্ডেব্ মানু সানি সাৈানল র্ানঝি মৌলটি ি পারমাণবিক ভর অপি ় ় দু টি মৌলের পারমাণবিক ভরের গনড় ি প্রায় সমান হে; এনক বর্ান িাইোনভর েেী সূে বলে। ্ ত ্ ত"},{"label":"খ","question":"চতথড শক্তি তনি কতটি উপশক্তি তি থাকনত পানি? ব্যাখ্যা কি। ় ়","answer":"কোনো প্ধাে শক্তি তি n এ উপশক্তিস্তর থাকে l = 0 থেকে (n − ত ত 1) পে্, অর্থাৎ মোট n সংখযক উপশক্তিস্তর। ু ্ ত চতথড শক্তি তনভর জন্য n = 4, তাই l = 0, 1, 2, 3। l এর এই চািটি ্ ত ় ় র্ানেি জন্য েথােব্ নর্ s, p, d ও f উপশক্তি তি পাওয়া যায়। ু ্ ত ্ ত অতএ চতথড শক্তিস্তরে 4টি উপশক্তিস্তর থাকনত পানি: 4s, 4p, 4d ও 4f।"},{"label":"গ","question":"A মৌলটি ি পর্যায় সািরণনত অবস্থাে নির্ণয় কি।","answer":"A মৌলটি ি পারমাণবিক সংখ্যা 30। এর ইলেকট্রন বিন্যাস: 2 2 6 2 6 10 2 A (30) : 1s 2s 2p 3s 3p 3d 4s ্ ত ইলেকট্রন র েযানস সন ডাচ্চ প্ধাে শক্তিস্তর n = 4। তাই A মৌলটি ় ় পর্যায় সািরণি ৪থড পর্যায়ে অ মথত। A এর থশষ ইলেকট্রন d অরবিটালে প্রবেশ করেনছ, তাই এটি d- রক র ল মৌল। d- রক মৌলের গ্রুপ েম্ব ি = স ড ছহঃথ s অরবিটালেি ল ি ইলেকট্রন + তাি আগেি d অরবিটালেি ইলেকট্রন। র র গ্রুপ নম্ব র = 2 + 10 = 12 ় ় অতএ A মৌলটি (রৈংক, Zn) পর্যায় সািরণি ৪থড পর্যায়ের গ্রুপ-12 এ অ মথত। ্ ত"},{"label":"ঘ","question":"‘B’ এর সাথে যৌগ গঠনেি মাধ্যমে ‘C’ মৌলটি পরি তড েশীল যোজনী বদখাে— বিশ্লেষণ কি।","answer":"B এর ইলেকট্রন বিন্যাস ns2 np5 এবং প্ধাে শক্তিস্তর 3, অর্থাৎ 2 2 6 2 5 n = 3। সুতিাং B এর বিন্যাস 1s 2s 2p 3s 3p; পারমাণবিক সংখ্যা 17। তাই B হলো ক্লোরিন (Cl)। C এর ইলেকট্রন বিন্যাস (n − 1)d6 ns2 এবং n = 4। সুতিাং C এর 2 2 6 2 6 6 2 বিন্যাস 1s 2s 2p 3s 3p 3d 4s; পারমাণবিক সংখ্যা 26। তাই C হলো আেিে (Fe)। টাইপ ভিততিক মাস্ট ার সা ﻿ ্ ত ্ Fe এর 4s ও 3d উপশক্তিস্তরেি শক্তভর পাথডকয খু কম। তাই র মে্ ব োি শতড নিনদ Fe কেবল 4s এর দুটি ইলেকট্রন অথ বা 4s এর দু টি ও 3d এর একটি ইলেকট্রন তযাগ কিনত পানি। 2+ − 2+ 2 2 6 2 6 Fe → Fe +2e [Fe : 1s 2s 2p 3s 3p 3d6] 3+ − 3+ 2 2 6 2 6 Fe → Fe +3e [Fe : 1s 2s 2p 3s 3p 3d5] 3+ ় ় ় Fe আয়নে 3d অরবিটাল অধডপূর্ণ (3d5) হওয়ায় এটি ব শ ় ় মথরতশীল। িনল ব্ারিনেি সাথে বিক্রিয়াে Fe দুই ধিনেি ক্লোরাইড ি ল ল গঠে করে: Fe+2HCl→FeCl +H 2 2 Δ 2Fe+3Cl ⟶2FeCl 2 3 2FeCl2 +Cl2 → 2FeCl3 FeCl [বভরাস ক্লোরাইড] যৌগে Fe এর যোজনী 2 এবং FeCl 2 ল 3 [বিরিক ক্লোরাইড] যৌগে Fe এর যোজনী 3। অতএ, B (Cl) এর সাথে যৌগ গঠনেি মাধ্যমে C (Fe) মৌলটি 2 ও 3 — এই দুই িকম অর্থাৎ পরি তড েশীল যোজনী প্দশডে করে। অটট ক ও দুই-এর রনযম"}],"board":"যশোর বোর্ড ২০২৬"},{"id":"ch5-cq2","chapter":5,"num":2,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: A8 একটি পদাথের আণরবক সংকেত। যার একটি অণুবিভবর 4.2496 × 10−22 g। আবার 'B' ও 'C' মৌলের পারমাণরবক সংখ্যা যোতরব্ জম 8 ও 12।","subQuestions":[{"label":"ক","question":"অরবিট কাকে বলে?","answer":"অরবিট: পরমাণুর রেউর্োসনক বকনড ্ করে ইলেকট্রন বে নির্দিষ্ট র র ্ ্ ত শক্তি সম্পন্ ৃ কাকাি পর্থ বঘানি, তানক অরবিট বা শক্তি তি বলে। 2 2 6 2"},{"label":"খ","question":"Mg এর যোজনী ও বোৈযতা ইলেকট্রন একই কেন? ব্যাখ্যা কি। [৫ বোর্ডে এনসনছ]","answer":"Mg (12) এর ইলেকট্রন বিন্যাস: 1s 2s 2p 3s। এর সর্বশেষ ্ ত শক্তি তনি 2টি ইলেকট্রন আনছ, তাই Mg এর বোৈযতা ইলেকট্রন 2টি। র র ় ় ় ত রাসায়নিক বিক্রিয়াে Mg সর্বশেষ তনভর এই 2টি ইলেকট্রন তযাগ ী ় ় করে রেকট তী রেরকবে গ্যাস রেেনেি কাঠানর্া অর্জন ে করে: Mg → র ্ 2+ − Mg +2e ্ কোনো মৌলের একটি পরমাণু ন্ধে গঠনে েতটি ইলেকট্রন তযাগ, গ্রহণ বা থশোি করে, বসটিই তাি যোজনী। তাই Mg এর যোজনী 2। এরান Mg এর যোজনী ও বোৈযতা ইলেকট্রন সংখ্যা একই (2)। −22"},{"label":"গ","question":"'A' মৌলের আপেক্ষিক পারমাণবিক ভর নির্ণয় কি। [৫ বোর্ডে এনসনছ] ্ ় ়","answer":"দেওয়া আনছ, A8 এর একটি অণুি ভর = 4.2496×10 g 23 আর্িা ৈারে, 1 মোল A8 এ অণু থাকে 6.02 × 10 টি। A8 এর আণরবক ির =4.2496×10−22 × 6.02 × 1023g/ mol =255.83g/mol ≈ 256 g/mol A8 অণুনত A এর পরমাণু 8টি। 256 A এর আথপততেক পারমাণরবক ির = =32 8 জেশন সু তিাং 'A' মৌলের আপেক্ষিক পারমাণবিক ভর 32; অর্থাৎ মৌলটি সালিাি (S) এবং A8 হলো S। 8"},{"label":"ঘ","question":"'CA' ও 'AB ' যৌগদনেি মধ্যে বকােটি নত অটট ক রেেনর্ি 2 যরতেব্ র্ ঘনট? বিশ্লেষণ কি। [২ বোর্ডে এনসনছ]","answer":"গ অংশ থেকে, A = সালিাি (S)। আ াি পারমাণবিক সংখ্যা 8 ় ় ় ় ় হওয়ায় B = অক্সিজেন (O) এবং 12 হওয়ায় C = র্যাগনেমসোর্ (Mg)। সুতিাং CA = MgS এবং AB = SO। 2 2 2 2 6 2 Mg (12) : 1s 2s 2p 3s 2 2 6 2 4 S (16) : 1s 2s 2p 3s 3p 2 2 4 O (8) : 1s 2s 2p MgS যৌগ 2+ ত ় Mg পরমাণু সর্বশেষ তনভর 2টি ইলেকট্রন তযাগ করে Mg আয়নে 2− ় ় এবং S পরমাণু 2টি ইলেকট্রন গ্রহণ করে S আয়নে পরিণত হে: র র 2+ − Mg→Mg +2e − 2− S+2e →S 2+ 2− Mg +S →MgS 2+ 2− ় ় ় Mg আয়ন রেেনেি (2, 8) এবং S আয়ন আগেি (2, 8, 8) ় ত ইলেকট্রন কাঠানর্া অর্জন ে করে। অর্থাৎ উিনেি সর্বশেষ তনি 8টি ় ় ইলেকট্রন থাকে; MgS যৌগে অটট ক রেের্ মানা হয়। SO যৌগ 2 SO অণুনত S পরমাণু প্রতটি O পরমাণুর সাথে দুই বৈাড় বা করে 2 র ্ ইলেকট্রন থশোি করে দুটি ছদ ন্ধে গঠে করে: O=S=O। এনত প্রতটি O এর চািপার্শ 8টি ইলেকট্রন থাকে। ্ ় কিন্তু S পরমাণুর 6টি বোৈযতা ইনলক ট নেি 4টি বন্ধনে অংশ বেে এবং 2টি রেঃসঙ্গ বৈাড় ছহনসন থাকে। িনল S এর চািপার্শ ইলেকট্রন সংখ্যা = 4 বৈাড় বা ন্ধে ইলেকট্রন (8টি) + 1 বৈাড় বা রেঃসঙ্গ র র ইলেকট্রন (2টি ) = 10টি। ় ত অর্থাৎ SO অণুনত বকনড ্ীে S পরমাণুর সর্বশেষ তনি 8টি ি বেশি 2 র (10টি ) ইলেকট্রন থাকে। সু তিাং CA (MgS) যৌগে অটট ক রেের্ মানা হলেও AB2 (SO2) যৌগে অটট ক রেেনর্ি যরতেব্ র্ ঘনট।"}],"board":"ময়মনসিংহ বোর্ড ২০২৬"},{"id":"ch5-cq3","chapter":5,"num":3,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: A, D এবং E রিনটি মৌলের পারমাণরবক সংখ্যা যোতরব্ জম 15, 17 এবং 29। [এখ্াজন A, D, E প্িীকী অথে বযবহবি]","subQuestions":[{"label":"ক","question":"ভরসংখ্যা কাকে বলে? [২ বোর্ডে এনসনছ] ়","answer":"িরসংখ্যা: কোনো মৌলের পরমাণুর নিউক্লিয়াসে উপমথত প্রোটন ও ল ি রেউ ট নেি মোট সংখ্যানক ঐ মৌলের ভরসংখ্যা বলে। ় ়"},{"label":"খ","question":"ক্যালসিয়ামনক র্ৃৎক্ষার ধাত লা হয় কেন? ব্যাখ্যা করো।","answer":"ক্যালসিয়াম (Ca) পর্যায় সািরণি গ্রুপ 2 এর মৌল। এর অক্সাইড ও হাই বিাইর্ ক্ষারধর্মী। 2Ca+O →2CaO 2 CaO+H O→Ca(OH) 2 2 টাইপ ভিততিক মাস্ট ﻿ ় ু তাছাড় বা ক্যালসিয়াম প্কৃ রতনত মাটি ি র ভিন্ন খনিজ যেমন চোপাথি ় ় (CaCO ), রৈপসার্ (CaSO .2H O) ইতযারদ িূর্প র্ৃপ্ককাে পাওয়া 3 4 2 যায়। ় ় ় মাটি নত পাওয়া যায় এবং অক্সাইড ও হাই বিাইর্ ক্ষারীে, তাই ় ক্যালসিয়ামনক র্ৃৎক্ষার ধাত লা হয়।"},{"label":"গ","question":"E-মৌলের ইলেকট্রন বিন্যাস সাধারণ রেেনর্ি যরতেব্ র্ কেন? ব্যাখ্যা করো।","answer":"উদ্দীপকের E মৌলের পারমাণবিক সংখ্যা 29, অর্থাৎ E হলো কপাি (Cu)। আউি াউ েীরত অনুসারে সাধারণ রেেনর্ Cu এর ইলেকট্রন বিন্যাস হওয়ার কথা: 2 2 6 2 6 9 2 Cu(29) : 1s 2s 2p 3s 3p 3d 4s কিন্তু Cu এর প্কৃ ত ইলেকট্রন বিন্যাস হলো: 2 2 6 2 6 10 1 Cu(29) : 1s 2s 2p 3s 3p 3d 4s d অরবিটাল অধডপূর্ণ (d5) বা সম্পূর্ণ পূর্ণ (d10) হলে পরমাণু অরধক 9 10 ় ় মথরতশীল হয়। 3d অবস্থাি বচনে 3d অবস্থা বেশি মথরতশীল। তাই ি ি ি ি 4s অরবিটাল থেকে একটি ইলেকট্রন 3d অরবিটালে চনল রগনে 3d অরবিটাল পূর্ণ করে। অরধক মথরতশীলতা অর্জন নেি জন্যই E (Cu) মৌলের ইলেকট্রন বিন্যাস ি র সাধারণ রেেনর্ি যরতেব্ র্।"},{"label":"ঘ","question":"AD3 এবং AD5 যৌগ গঠনে অটট ক রেের্ বর্নে চলাি সম্া যতা োচাই করো।","answer":"উদ্দীপকের A এর পারমাণবিক সংখ্যা 15, তাই A হলো িসভরাস (P); D এর পারমাণবিক সংখ্যা 17, তাই D হলো ক্লোরিন (Cl)। সুতিাং AD3 = PCl3 এবং AD5 = PCl5। 2 2 6 2 3 P(15) : 1s 2s 2p 3s 3p 2 2 6 2 5 Cl(17) : 1s 2s 2p 3s 3p ় অটট ক রেের্ অনুসারে ন্ধে গঠনেি পি প্রতটি পরমাণুর সর্বশেষ ্ ত শক্তি তনি 8টি ইলেকট্রন থাকে। PCl গেন 3 P এর সর্বশেষ তনি 5টি ইলেকট্রন। P তাি 3টি ইলেকট্রন রতেটি Cl র র পরমাণুর প্নতযকটভর 1টি করে ইনলক ট নেি সাথে থশোি করে রতেটি P-Cl সমযোজী ন্ধে গঠে করে। ত ন্ধে গঠনেি পি P এর সর্বশেষ তনি ইলেকট্রন = 5 + 3 = 8টি (3 ্ বৈাড় বা ন্ধে ইলেকট্রন + 1 বৈাড় বা র্ুকব ইলেকট্রন) এবং প্রতটি Cl এর র র ত ় সর্বশেষ তনিও 8টি ইলেকট্রন থাকে। অর্থাৎ PCl গঠনে অটট ক রেের্ র 3 বর্নে চবলে। PCl গেন 5 PCl গঠনে P তাি 5টি ইলেকট্রনই প াচটি Cl পরমাণুর সাথে থশোি 5 র করে প াচটি P-Cl সমযোজী ন্ধে গঠে করে। ত ন্ধে গঠনেি পি P এর সর্বশেষ তনি ইলেকট্রন = 5 × 2 = 10টি, ো 8 এর বেশি। েরদও প্রতটি Cl অটট ক পূর্ণ করে, বকনড ্ীে পরমাণু P র র অটট ক রেের্ র্ানে ো। সু তিাং AD3 (PCl3) গঠনে অটট ক রেের্ বর্নে চলা সম্ হলেও AD5 ় ভ ় ় (PCl5) গঠনে অটট ক রেের্ বর্নে চলা সম্ েে; এটি অটট ক রেেনর্ি একটি যরতেব্ র্। ় ্ ় ্ ্ ্ রাসায়নিক বন্ ধন ও রাসায়নিক বন্ ধন গেজনর কারণ"}],"board":"সিলেট বোর্ড ২০২৬"},{"id":"ch5-cq4","chapter":5,"num":4,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: 39 40 A, A, Q, R. 12 8 ার সাজেশন 39 40 [A, Q, R প্িীকী অথে বযবহবি এবং A এবং A প্কৃ রিজি র র প্াততপ্র পরিমাণ যোতরব্ জম 90% এবং 10%] র ত","subQuestions":[{"label":"ক","question":"অণু কাকে বলে? [২ বোর্ডে এনসনছ] ় ় ়","answer":"অণু: মৌললক বা বেৌরগক পদার্থডি ক্ষু দ্তর্ কণা, ো ঐ পদার্থডি ধর্ম ় ্ ৈাে বির্খ স্ব াধীেিান অবস্থাে কিনত পানি, তানক অণু বলে। ় ় ়"},{"label":"খ","question":"ললরথোর্ অপেক্ষা পটাশিয়াম অরধক সমে্বে কেন? ব্যাখ্যা করো।","answer":"ললরথোর্ (Li) ও পটাশিয়াম (K) উভয়ই গ্রুপ 1 এর ক্ষার ধাত। ত ় এরা সর্বশেষ তনভর 1টি ইলেকট্রন তযাগ করে বিক্রিয়া করে। 2 1 Li(3) : 1s 2s 2 2 6 2 6 1 K(19) : 1s 2s 2p 3s 3p 4s ্ ় ্ত Li এর বোৈযতা ইলেকট্রন ছদতীে শক্তিস্তরে রকুন্ K এর বোৈযতা ু ্ ত ইলেকট্রন চতথড শক্তি তনি থাকে। িনল K এর আকার ড় এবং রেউর্োস থেকে সর্বশেষ ইনলক ট নেি দিত বেশি, তাই আকর্ষণ কম। ূ ব ল র ় ্ এজন্য K এর আয়নিকিণ শক্তি Li অপেক্ষা কম এবং K সহজে ় ় ইলেকট্রন তযাগ কিনত পানি। তাই ললরথোর্ অপেক্ষা পটাশিয়াম অরধক সমে্বে। 39 40"},{"label":"গ","question":"A-মৌলটি ি গড় আপেক্ষিক পারমাণবিক ভর নির্ণয় করো। [৫ বোর্ডে এনসনছ]","answer":"উদ্দীপকের A মৌলের দুটি আইসোটোপ A ও A, োনদি প্াপ্প্ি পরিমাণ েথােব্ নর্ 90% ও 10%। র ত আর্িা ৈারে, গড় আপেক্ষিক পারমাণবিক ভর = (প্থর্ ্ ় আইনসানটার্পি ভর × শতকরা পরিমাণ + ছদতীে আইনসানটার্পি ভর × শতকরা পরিমাণ)/100 39×90+40×10 A এর গড় আথপততেক পারমাণরবক ির = 100 3510 + 400 = 100 3910 = 100 = 39.1 সু তিাং A মৌলটি ি গড় আপেক্ষিক পারমাণবিক ভর 39.1।"},{"label":"ঘ","question":"উদ্দীপকের Q ও R মৌলের মথরতশীলতা অর্জন নেি প্মে্বো ভিন্ন কেন? বিশ্লেষণ করো।","answer":"উদ্দীপকের Q এর পারমাণবিক সংখ্যা 12, তাই Q হলো র্যাগনেমসোর্ (Mg); R এর পারমাণবিক সংখ্যা 8, তাই R হলো অক্সিজেন (O)। 2 2 6 2 Mg(12) : 1s 2s 2p 3s 2 2 4 O(8) : 1s 2s 2p পরমাণুগুনলা রেকটতর্ রেরকবে গ্যাসের ইলেকট্রন বিন্যাস অর্জন ে করে র ্ র মথরতশীল হনত চাে। Q (Mg) এর স্থিতিশীলিা অেন Mg এর সর্বশেষ তনি মান 2টি ইলেকট্রন। 6টি ইলেকট্রন গ্হর্ণি র র র ় ু বচনে 2টি ইলেকট্রন তযাগ করা সহৈ। তাই Mg ধাত ছহনসন 2টি 2+ ় ় ইলেকট্রন তযাগ করে Mg কযাটােে গঠে করে এবং রেেনেি (Ne) র্নতা মথরতশীল ইলেকট্রন বিন্যাস অর্জন ে করে। ি র 2+ − Mg→Mg +2e 2+ 2 2 6 Mg : 1s 2s 2p টাইপ ভ ﻿ R (O) এর স্থিতিশীলিা অেন ত ় O এর সর্বশেষ তনি 6টি ইলেকট্রন। 6টি ইলেকট্রন তযার্গি বচনে 2টি র র ইলেকট্রন গ্রহণ করা সহৈ। তাই O অধাত ছহনসন 2টি ইলেকট্রন গ্রহণ র র র র 2− ় ় করে O অযাযায়ে গঠে করে রেেনেি ইলেকট্রন বিন্যাস অর্জন ে করে। − 2− O+2e →O 2− 2 2 6 O : 1s 2s 2p ু ্ ় অধাতি সাথে েুকব হলে O ইলেকট্রন থশোি করেও অটট ক পূর্ণ করে, যেমন O অণুনত দুটি O পরমাণু 2 বৈাড় বা ইলেকট্রন থশোি করে 2 র ্ ছদ ন্ধে গঠে করে। Mg ও O পিস্পনভর সাথে বিক্রিয়া করলে Mg এর তযাগকৃ ত 2টি ় ় ইলেকট্রন O গ্রহণ করে এবং আয়নিক যৌগ MgO গঠ ি ত হয়। র র 2Mg+O →2MgO 2 সু তিাং Q (Mg) ইলেকট্রন তযার্গি মাধ্যমে এবং R (O) ইলেকট্রন র র গ্হর্ণি ( বা থশোনভর) মাধ্যমে মথরতশীলতা অর্জন ে করে। বোৈযতা ত তনি ইলেকট্রন সংখ্যাি ভিন্নতাি কারণেই এদের মথরতশীলতা অর্জন নেি বিভব ় প্মে্ ব ো ভিন্ন। ় ্ ্ ্ ট্রন আদাে-প্দাে হয় ো, অর্থাৎ র মে্ব েক ও উৎপানদ মৌলসর্ূনহি জারণ সংখ্যাি কোনো পরি তড ে ঘনট ো, তানক েেরির্ি বিক্রিয়া বলে। যেমন: NaOH+HCl→NaCl+H O 2 এখানে বিক্রিয়াি আগে ও পরে Na এর জারণ সংখ্যা +1, O এর −2, H এর +1 এবং Cl এর −1 অপরি রতিতড থাকে। কোনো মৌলের জারণ বা র জারণ ঘনট ো। তাই এটি একটি েেরির্ি বিক্রিয়া। প্শর্ে ও ় ় অধঃর্ক্ষপণ বিক্রিয়া সাধারণত েেরির্ি বিক্রিয়া।"},{"label":"গ","question":"উদ্দীপকের A মৌলটি ি গড় আপেক্ষিক পারমাণবিক ভর নির্ণয় কি। [৫ বোর্ডে এনসনছ] ় ়","answer":"উদ্দীপক অনুসারে A মৌলের আইসোটোপগুনলাি ভরসংখ্যা ও শতকরা পরিমাণ: িরসংখ্যা শতকরা পরিমাণ 32 94.99% 33 0.75% 34 4.25% 36 0.01% গড় আথপততেক পারমাণরবক ির = 32×94.99+33×0.75+34×4.25+36×0.01 100 3039.68 + 24.75 + 144.5 + 0.36 = 100 3209.29 = 100 = 32.09 অতএ, A মৌলটি ি গড় আপেক্ষিক পারমাণবিক ভর 32.09।"},{"label":"ঘ","question":"বদখাও বে, A মৌলটি আয়নিক ও সমযোজী উভয় ধির্ণি যৌগ গঠে করে — বিশ্লেষণ কি।","answer":"A মৌলের প্ধাে আইনসানটার্পি ভরসংখ্যা 32 এবং এনত প্রোটন র র ও রেউ ট ে সংখ্যা সমান। কপ্াটন সংখ্যা = 32 = 16 2 সু তিাং A মৌলের পারমাণবিক সংখ্যা 16, অর্থাৎ A হলো সালিাি (S)। 2 2 6 2 4 S (16) : 1s 2s 2p 3s 3p বা 2, 8, 6 সালিানভর সর্বশেষ শক্তিস্তরে 6টি ইলেকট্রন আনছ। অটট ক পূির্ণি জন্য এর আিও 2টি ইলেকট্রন প্নোৈে, ো এটি ইলেকট্রন গ্রহণ র র র র ় ় ় অথ বা থশোি উভয় উপানেই অর্জন ে কিনত পানি। মাস্ট ার সাজেশন আযরনক যৌগ গেন ় ় সমে্ব ে ধাত Na এর সাথে বিক্রিয়াকানল দুটি Na পরমাণু প্নতযনক 1টি + করে ইলেকট্রন তযাগ করে Na আয়ন ততরি করে এবং S পরমাণু ঐ 2− 2টি ইলেকট্রন গ্রহণ করে S আয়ন ততরি করে। র র + − 2Na → 2Na +2e; S + 2e →S 2Na+S→Na S 2 + 2− Na ও S আয়নেি মধ্যে মথি ত দুযরতক আকষডর্ণ আয়নিক ন্ধে ় ় গঠ ি ত হয়। অর্থাৎ Na2S একটি আয়নিক যৌগ। সমজযােী যৌগ গেন অধাত H এর সাথে বিক্রিয়াকানল S পরমাণু দুটি H পরমাণুর প্নতযনকি সাথে একটি করে ইলেকট্রন বৈাড় থশোি করে। িনল S এর সর্বশেষ তনি 8টি এবং প্রতটি H এর 2টি ইলেকট্রন হয়। H +S→H S 2 2 H − S − H এরান H S অণুনত দুটি S−H সমযোজী ন্ধে গঠ ি ত হয়। একইিান 2 অক্সিজেনের সাথে S ইলেকট্রন থশোি করে সমযোজী যৌগ SO গঠে করে। S+O →SO 2 2 সু তিাং A মৌল অর্থাৎ সালিাি ধাতি সাথে ইলেকট্রন গ্রহণ করে ় ু আয়নিক যৌগ (Na S) এবং অধাতি সাথে ইলেকট্রন থশোি করে 2 সমযোজী যৌগ (H S, SO ) গঠে করে। 2 2 ্ ্ সমজযােী বন্ ধন"}],"board":"দিনাজপুর বোর্ড ২০২৬"},{"id":"ch5-cq7","chapter":5,"num":7,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: মৌল পর্যায় X 2 Y 3 Z 4 [X, Y এবং Z প্িীকী অথে বযবহবি।]","subQuestions":[{"label":"ক","question":"বিক্রিয়াি হার কাকে বলে? [২ বোর্ডে এনসনছ]","answer":"় ় ় রবভতর্ ব যার হার: একে সময়ে কোনো র মে্ব জনকি ঘেমানা হ্াস বা ্ ় উৎপানদি ঘেমানা বৃদ্ধিি পরিমাণনক বিক্রিয়াি হার বলে। ূ ়"},{"label":"খ","question":"ষডাকানল ছানদ পানি ব্যবহার করা হয় কেন? ব্যাখ্যা কি। ্","answer":"ছানদ পানি রদনল বসই পানি বাষ্পীিত হয়। পানি তিল থেকে ় ় ববাষ্প পরিণত হওয়ার সময় সুপ্তাপ থশাষণ করে, ো একটি তাপহারী প্মে্ ব ো। H O(l) → H O(g); ΔH = (+) 2 2 ় ় বাষ্পীি নেি এই প্নোৈেীে তাপ পানি ছাদ ও আশপাশ থেকে গ্রহণ করে, িনল ছানদি তাপমানা কনর্ যায় এবং ঘি ঠান্া থাকে। ষডাকানলি িযাপসা গিনর্ ঘি শীতল িাখনত তাই ছানদ পানি ব্যবহার করা হয়। ﻿ ় ়"},{"label":"গ","question":"X ও Y মৌল দ্বারা গঠ ি ত যৌগের ন্ধে প্কৃ রত ব্যাখ্যা কি। [৩ বোর্ডে এনসনছ]","answer":"X মৌলটি 2ে পর্যায়ের গ্রুপ-17 এ অ মথত, তাই X হলো বফ্ারিে ি ল ় ় (F)। Y মৌলটি 3ে পর্যায়ের গ্রুপ-2 এ অ মথত, তাই Y হলো বিভব র্যাগনেমসোর্ (Mg)। 2 2 6 2 Mg (12) : 1s 2s 2p 3s − 2− 2 2 5 F (9) : 1s 2s 2p ত ় Mg তাি সর্বশেষ তনভর 2টি ইলেকট্রন তযাগ করে রেেনেি (Ne) 2+ ় ় ় ্ ইলেকট্রন বিন্যাস লাি করে Mg আয়নে পরিণত হয়। দুটি F র পরমাণু প্নতযনক একটি করে ইলেকট্রন গ্রহণ করে রেেনেি ইলেকট্রন র র র র − ় ় বিন্যাস লাি করে F আয়নে পরিণত হয়। 2+ − Mg→Mg +2e − − 2F+2e →2F Mg2++2F−→MgF 2 র 2+ − ্ ় র পিীত চার্জ েুকব Mg ও F আয়ন মথি ত দুযরতক আকর্ষণ বলেি ্ ় মাধ্যমে েু কব হয়ে MgF যৌগ গঠে করে। এখানে ইনলক ট নেি সম্পূর্ণ 2 র আদাে-প্দাে ঘনট। ্ ় সু তিাং X ও Y দ্বারা গঠ ি ত যৌগ MgF2 এ আয়নিক বা তপ্ড় ৎনোৈী 2 ন্ধে র দযমান। ় ়"},{"label":"ঘ","question":"উদ্দীপকের Z মৌলটি এক পরমাণুক হলেও X মৌলটি ছদ- পরমাণুক অণু গঠে করে—মানাগ্ার্সহ বিশ্লেষণ কি।","answer":"Z মৌলটি 4থড পর্যায়ের গ্রুপ-1 এ অ মথত, তাই Z হলো পটামসোর্ (K)। ্ ন্ধে ও 3 বৈাড় বা র্ু কব নৈাড় ইলেকট্রন। ্ ন্ধে গঠনেি পি প্রতটি F পরমাণু অটট ক লাি করে, কিন্তু B এর সর্বশেষ তনি 6টি ইলেকট্রন (3 বৈাড় া) থাকে। অর্থাৎ B অটটক পূর্ণ করে ো, দুই এর রেের্ অেুসিণ করে। টাইপ ভিততিক মাস্ট ার সাজেশন সু তিাং P ও Q এর মধ্যে সমযোজী ববন্ধনের মাধ্যমে BF3 যৌগ গঠ ি ত হয়।"},{"label":"ঘ","question":"উদ্দীপকের মৌল রতেটি ি পারমাণবিক ব্যাসার্ধ ও তপ্ড় ৎ ঋণাতমকতাি েব্ র্ একই হন কী? বিশ্লেষণ কি। [২ বোর্ডে এনসনছ]","answer":"P = বফ্ারিে (F, 9), Q = ব ািে (B, 5), R এর ইলেকট্রন সংখ্যা = 9-5 = 4, তাই R = ব রিললোর্ (Be)। Be(4) : 1s2 2s2 — গ্রুপ-2 2 2 1 B(5) : 1s 2s 2p — গ্রুপ-13 2 2 5 F(9) : 1s 2s 2p — গ্রুপ-17 ় ় ় রতেটি মৌলই ২ে পর্যায়ের। একই পর্যায়ে ার্ থেকে র্ানে প্রোটন ্ ত সংখ্যা ানড় কিন্তু শক্তি তি একই থাকে। িনল রেউর্োস কতড ক সর্বশেষ তনভর ইনলক ট নেি প্রত আকর্ষণ ানড়। ক ় পারমাণরবক বযাসাধ্: নিউক্লিয়াসেি আকর্ষণ াড় াে ার্ থেকে র্ানে পারমাণবিক ব্যাসার্ধ হ্াস পায়। েব্ র্: Be \u003e B \u003e F, অর্থাৎ R \u003e Q \u003e P। িততড় ৎ ঋণাতমকরা: পরমাণুর আকার েত বছাট, থশোিকৃ ত ইলেকট্রন বৈাড় নক রেনৈি রদনক আকষডর্ণি ক্ষমতা তত বেশি। তাই ার্ থেকে ্ ় র্ানে তপ্ড় ৎ ঋণাতমকতা বৃদ্ধি পায়। েব্ র্: F \u003e B \u003e Be, অর্থাৎ P \u003e Q \u003e R। সু তিাং মৌল রতেটি ি পারমাণবিক ব্যাসার্ধ ও তপ্ড় ৎ ঋণাতমকতাি েব্ র্ একই হন ো, িং সম্পূর্ণ র পিীত হন।"}],"board":"সিলেট বোর্ড ২০২০"},{"id":"ch5-cq10","chapter":5,"num":10,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: W ও D দটি মৌল। W মৌলের রিনটি আইজসাজটাথপর শতকরা 12 13 পরিমাণ যোতরব্ জম W = 99%, W = 0.75% ও W = ় ় 0.25%. D মৌলটি ৩য পযাজযর হযাজোজেন গ্ুথপর মৌল।","subQuestions":[{"label":"ক","question":"কযাটােে কাকে বলে? [২ বোর্ডে এনসনছ]","answer":"বে পরমাণু বা পরমাণুগুচ্ছ এক বা একারধক ইলেকট্রন তযাগ করে ্ ় ় ধোতমক আধােেুকব হয়, তানক কযাটােে বলে। যেমন: Na, Ca NH +। 4"},{"label":"খ","question":"Ne রেরকব ে কেন? ব্যাখ্যা কি। [২ বোর্ডে এনসনছ] র ্","answer":"2 2 6 Ne(10) → 1s 2s 2p (2,8) ় ্ ত রেেনেি (Ne) সর্বশেষ শক্তিস্তরে 8টি ইলেকট্রন আনছ, অর্থাৎ এর অটট ক পূর্ণ এবং ইলেকট্রন বিন্যাস মথরতশীল। তাই Ne অেয  ইলেকট্রন = 12×2=24টি। ্ ্ সু তিাং, CCl অণুনত ন্ধে বৈাড় 4টি (8টি ইলেকট্রন) এবং র্ুকব 4 র র বৈাড় 12টি (24টি ইলেকট্রন) র দযমান। + 2+,"}],"board":"বরিশাল বোর্ড ২০২১"},{"id":"ch5-cq11","chapter":5,"num":11,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: র র ় ় ় [Q, R এবং T ককাজনা মৌলের প্িীক নয, প্িীকী অথে বযবহবি র র হজযজে]","subQuestions":[{"label":"ক","question":"সমযোজী ন্ধে কী? [২ বোর্ডে এনসনছ] শতকরা পরিমাণ","answer":"দুটি অধাত পরমাণু তানদি সর্বশেষ তনভর সমান সংখযক ্ ইলেকট্রন থশোি করে ইলেকট্রন বৈাড় সৃটটি ি মাধ্যমে বে ন্ধে গঠে র র ্ ্ করে, তানক সমযোজী ন্ধে বলে।"},{"label":"খ","question":"অযালুমর্রেোর্ র দুযৎ পরি াহী কেন? 99% ্","answer":"অযালুমর্রেোর্ (Al) একটি ধাত। Al (2, 8, 3) পরমাণু সর্বশেষ ত ় ় তনভর 3টি ইলেকট্রন তযাগ করে Al + আয়নে পরিণত হয় এবং তযাগ র 3 করা ইলেকট্রনগুনলা ইলেকট্রন সাগি ছহনসন সর্গ্ ধাত বকলানস র র ্ ্ র্ু কব িান চলাচল করে (ধাত ন্ধে)। ় ত ় ্ অযালুমর্রেোনর্ি দুই প্ানন্ বিভব পাথডকয প্নোগ করলে এই র্ুকব র র ত ় ইলেকট্রনগুনলা ধোতমক প্ানন্ি রদনক প্ াছহত হয় এবং র দুযৎ র র পরি হয় করে। তাই অযালুমর্রেোর্ র দুযৎ পরি াহী।"},{"label":"গ","question":"TR6 যৌগে বকাে ধিনেি ন্ধে র দযমান? চচেসহ ণডো কি। [২ 0.75% বোর্ডে এনসনছ] 0.25%","answer":"উদ্দীপকের T এর ইলেকট্রন বিন্যাস 2, 8, 6, অর্থাৎ পারমাণবিক সংখ্যা 16, তাই T হলো সালিাি (S)। R এর ইলেকট্রন বিন্যাস 2, 7, অর্থাৎ পারমাণবিক সংখ্যা 9, তাই R হলো বফ্ারিে (F)। সুতিাং TR ল 6 যৌগটি হলো সালিাি বহিানফ্ািাইর্ (SF )। ল 6 ় ্ ় S ও F উভয়ই অধাত, তাই এরা ইলেকট্রন থশোনভর মাধ্যমে েুকব হয়। ্ অর্থাৎ SF6 যৌগে সমযোজী ন্ধে র দযমান। 2 2 6 2 4 ক ত S(16) → 1s 2s 2p 3s 3p (সবথশষ স্জর 6টি ইলেকট্রন) 2 2 6 1 3 2 S* (উজিরেি) → 1s 2s 2p 3s 3p 3d (রবলোড় ইলেকট্রন 6টি ) 2 2 5 ক ত F(9) → 1s 2s 2p (সবথশষ স্জর 7টি ইলেকট্রন, রবলোড় ইলেকট্রন 1টি ) উনকরৈত অবস্থাে S এর 3s এর একটি ও 3p এর একটি ইলেকট্রন ি র খালল 3d অরবিটালে চনল যায়, িনল S এ 6টি র নৈাড় ইলেকট্রন সৃটটি ় ় হয়। এই 6টি ইলেকট্রন ছেটি F পরমাণুর একটি করে র নৈাড় ় ় ় ্ ইনলক ট নেি সাথে থশোি হয়ে ছেটি S–F সমযোজী ন্ধে গঠে করে। S+3F2→SF6 ় ্ ্ চিতর: ককজন্ দ S, এবিভবাররদজক েযটি F পরমাণু; প্রিটি S–F বন্ ধজন S র র ় ় এর 1টি (.) ও F এর 1টি (×) ইলেকট্রন ক্ষশযার হজযজে। এখানে প্রতটি F এর চািপার্শ 8টি ইলেকট্রন হয়, কিন্তু S এর চািপার্শ 6 × 2 = 12টি ইলেকট্রন থাকে (অটট নকি সম্প্সািণ)। ় ্ সু তিাং TR6 বা SF6 যৌগে ছেটি S–F সমযোজী ন্ধে র দযমান।"},{"label":"ঘ","question":"QR এবং 6 পারমাণবিক সংখ্যার মশটট মৌলের সাথে R এর গঠ ি ত 2 যৌগ পানিনত দ্রবণীে রকো? বিশ্লেষণ কি। র ্ ৃ ় টাইপ ভিততিক মাস্ট ার সাজেশন","answer":"উদ্দীপকের Q এর ইলেকট্রন বিন্যাস 2, 8, 2, অর্থাৎ পারমাণবিক সংখ্যা 12, তাই Q হলো র্যাগনেমসোর্ (Mg); R হলো বফ্ারিে (F)। সু তিাং QR হলো র্যাগনেমসোর্ বফ্ািাইর্ (MgF )। 6 পারমাণবিক 2 ল 2 সংখ্যার মশটট মৌল কার্বন (C), ো R এর সাথে কার্বন বট ট ানফ্ািাইর্ র ল (CF ) গঠে করে। 4 MgF (আযরনক যৌগ): Mg দুটি ইলেকট্রন তযাগ করে Mg + এবং 2 র 2 ় ় দু টি F একটি করে ইলেকট্রন গ্রহণ করে দুটি F- আয়নে পরিণত হয়। র র Mg ++2F-→MgF 2 2 পানি একটি থপালাি দ্া ক; পানির অণুি O প্ানন্ আংমশক ঋণাতমক র র (δ-) ও H প্ানন্ আংমশক ধোতমক (δ+) আধাে থাকে। MgF পানিনত র 2 ত ় রদনল পানির অণুি আংমশক ঋণাতমক O প্ান্ Mg + আেজনক এবং র 2 আংমশক ধোতমক H প্ান্ F- আেজনক আকর্ষণ করে। এরান ় ন ় ড ্ আয়নগুনলা বকলাস থেকে র ক্সচ্ছন্ হয়ে পানির অণু দ্বারা পরিন টটি ত ় ় ় হয়ে দ্রবণে ছপ্ড় নে পনড়। তাই আয়নিক যৌগ ছহনসন MgF পানিনত 2 রদ্রবণীে। CF (সমজযােী যৌগ): C এর 4টি বোৈযতা ইলেকট্রন চািটি F এর 4 র ় ় ্ সাথে থশোি হয়ে চািটি C–F সমযোজী ন্ধে গঠে করে। টাইপ ভিততিক মাস্ট ার সাজেশন ﻿ ় C+2F2→CF4 ় ্ CF এ কোনো আয়ন থাকে ো। প্রতটি C–F ন্ধে থপালাি হলেও 4 ু ত ় ় ় ্ অণুটি সু ষর্ চততলকীে আকৃ রতি হওয়ায় ন্ধেগুনলাি থপালারিটি পিস্পিনক প্শমর্ত করে; িনল CF অণু অর্পালাি। অর্পালাি 4 অণুনক থপালাি পানির অণু আকর্ষণ কিনত পানি ো। তাই CF 4 পানিনত অদ্রবণীে। ় ় ় ় সু তিাং QR (MgF ) আয়নিক হওয়ায় পানিনত দ্রবণীে, রকুন্ C ও R 2 2 র ় ় ় এর যৌগ CF সমযোজী ও অর্পালাি হওয়ায় পানিনত অদ্রবণীে। 4 র"}],"board":"ময়মনসিংহ বোর্ড ২০২০","diagramId":"ch5-cq11"},{"id":"ch5-cq12","chapter":5,"num":12,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: মৌল L M N পারমাণবিক 7 15 17 [এখ্াজন L, M, N প্িলেি ককাজনা মৌলের প্িীক নয] র র","subQuestions":[{"label":"ক","question":"রাসায়নিক সংনকত কাকে বলে? [৪ বোর্ডে এনসনছ] ূ ়","answer":"কোনো মৌললক বা বেৌরগক পদার্থডি একটি অণুনত উপমথত পরমাণুগুনলাি প্কৃ রত ও সংখ্যা প্তীক ও সংখ্যাি সাহানেয প্কাশ র র র করানক রাসায়নিক সংনকত বলে। যেমন: H O, CO। 2 2"},{"label":"খ","question":"ইর্থে পানিনত দ্ ীিত হয় ো— ব্যাখ্যা কি। ্","answer":"ইর্থে (CH -CH ) একটি অর্পালাি সমযোজী যৌগ, কািণ C ও 3 3 H এর তপ্ড় ৎ ঋণাতমকতাি পাথডকয খু কম। পানি একটি থপালাি যৌগ। অর্পালাি ইর্থে অণু পানির অণুি δ+ বা δ- প্ানন্ি সাথে কোনো আকর্ষণ সৃটটি কিনত পানি ো, তাই পানির অণুগুনলাি মধ্যে ঢকনত পানি ো। ী ী ূ \"সর্ধর্ী সর্ধর্ীনক দ্ ীিত করে\" — এ কারণে ইর্থে পানিনত ূ ় রদ্ ীিত হয় ো।"},{"label":"গ","question":"L2 অণুি ন্ধে গঠে ব্যাখ্যা কি। [৩ বোর্ডে এনসনছ] ্ ়","answer":"L এর পারমাণবিক সংখ্যা 7, তাই L = নাইট্রোজেন (N) এবং L2 = N। 2 2 2 3 ক ত N(7) → 1s 2s 2p (সবথশষ স্জর 5টি ইলেকট্রন) অটট ক পূির্ণ প্রতটি N পরমাণুর আিও 3টি ইলেকট্রন প্নোৈে। দুটি র র N পরমাণুই অধাত, তাই ইলেকট্রন তযাগ-গ্রহণ ো করে প্নতযনক 3টি র র করে মোট 6টি (3 বৈাড় া) ইলেকট্রন থশোি করে। N+N→N≡N বা N 2 ্ ় িনল দুটি N এর মধ্যে মে ন্ধে গঠ ি ত হয় এবং প্রতটি N এর সর্বশেষ ত ্ ্ ় তনি 8টি ইলেকট্রন (3টি ন্ধে বৈাড় + 1টি র্ু কব নৈাড় ) হয়ে Ne এর র্নতা মথরতশীল বিন্যাস লাি করে। ্ ্ ্ সু তিাং L2 (N ) অণুনত মে ন্ধেেুকব সমযোজী ন্ধে র দযমান। 2"},{"label":"ঘ","question":"M ও N দ্বারা গঠ ি ত দুটি ভিন্ন যৌগের মধ্যে একটি অটট ক রেের্ মাননলও অপিটি র্ানে ো— বিশ্লেষণ কি। [২ বোর্ডে এনসনছ]","answer":"M এর পারমাণবিক সংখ্যা 15, তাই M = িসভরাস (P); N এর পারমাণবিক সংখ্যা 17, তাই N = ক্লোরিন (Cl)। 2 2 6 2 3 ক ত P(15) → 1s 2s 2p 3s 3p (সবথশষ স্জর 5টি ইলেকট্রন) 2 2 6 2 5 ক ত Cl(17) → 1s 2s 2p 3s 3p (সবথশষ স্জর 7টি ইলেকট্রন) P পরি তড েশীল যোজনী (3 ও 5) প্দশডে করে এবং Cl এর সাথে দুটি যৌগ গঠে করে: PCl ও PCl। 3 5 • PCl : P এর 3টি র নৈাড় ইলেকট্রন রতেটি Cl এর একটি করে 3 র ় ় ্ ড ্ ইনলক ট নেি সাথে থশোি হয়ে 3টি P–Cl ন্ধে গঠে করে। P এর ত ্ সর্বশেষ তনি 3টি ন্ধে বৈাড় + 1টি র্ু কব নৈাড় = 8টি ইলেকট্রন ্ এবং প্রতটি Cl এ 1টি ন্ধে বৈাড় + 3টি র্ু কব নৈাড় = 8টি ইলেকট্রন। তাই PCl অটট ক রেের্ র্ানে। র 3 • PCl : উনকরৈত অবস্থাে P এর 3s এর একটি ইলেকট্রন 3d বত 5 ি র 3 ় ় যায় (3s1 3p 3d1), িনল 5টি র নৈাড় ইলেকট্রন হয়। এরা ় ় প াচটি Cl এর সাথে থশোি হয়ে 5টি P–Cl ন্ধে গঠে করে। এনত P এর সর্বশেষ তনি 5 ×2 = 10টি ইলেকট্রন হয়, ো 8 এর বেশি। তাই PCl অটট ক রেের্ র্ানে ো। 5 2P+3Cl2 →2PCl3 PCl +Cl →PCl 3 2 5 ্ ় সু তিাং M ও N দ্বারা গঠ ি ত PCl3 অটট ক রেের্ র্ানে কিন্তু PCl5 অটট ক রেের্ র্ানে ো। আযরনক ও সমজযােী যৌগের ববভশটট য"}],"board":"ময়মনসিংহ বোর্ড ২০২১"},{"id":"ch5-cq13","chapter":5,"num":13,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: রনজ্ািব উদ্দীপকটি েে কর : A, B ও D প্িলেি অে বহন কজর না।","subQuestions":[{"label":"ক","question":"আণর ক সংনকত কী?","answer":"বে সংনকনতি মাধ্যমে কোনো পদার্থডি একটি অণুনত উপমথত মৌলসর্ূনহি পরমাণুর প্কৃ ত সংখ্যা প্কাশ করা হয়, তানক আণর ক র র সংনকত বলে। যেমন: গলনকানৈি আণর ক সংনকত C H O। ্ ু 6 12 6"},{"label":"খ","question":"অযালকাইল মূলকসর্ূহ একনোৈী মূলক— ব্যাখ্যা কি।","answer":"অ্যালকেন অণু থেকে একটি হাইরোজেন পরমাণু অপসািণ ় ় করলে বে মূলক পাওয়া যায়, তানক অযালকাইল মূলক বলে। এর সাধারণ সংনকত C H -। n 2n+1 CH -H → CH - (ভমোইে মূ েক) 4 3 CH -CH -H → CH -CH - (ইোইে মূ েক) 3 3 3 2 একটি H পরমাণু অপসাির্ণি িনল অযালকাইল র্ূলনকি একটি কার্বন পরমাণুনত একটি মান র্ুকব যোজনী থাকে, অর্থাৎ এটি একটি মান ন্ধে গঠে কিনত পানি (যেমন: CH -Cl, CH -OH)। তাই 3 3 অযালকাইল মূলকসর্ূহ একনোৈী মূলক। ় ্ ত"},{"label":"গ","question":"পর্যায় সািরণনত উদ্দীপকের A মৌলের অবস্থাে ব্যাখ্যা কি।","answer":"উদ্দীপকের চচে অেুযায়ী A পরমাণুর শক্তিস্তরসর্ূনহ ইলেকট্রন সংখ্যা েথােব্ নর্ 2, 8, 7। অর্থাৎ মোট ইলেকট্রন সংখ্যা = 2 + 8 + 7 = 17। সুতিাং A এর পারমাণবিক সংখ্যা 17 এবং A হলো ক্লোরিন (Cl)। 2 2 6 2 5 A (17) : 1s 2s 2p 3s 3p ় ় ক ক পর্যায় রনণয ্ ত কোনো মৌলের ইলেকট্রন র েযানস সন ডাচ্চ বে শক্তি তনি ইলেকট্রন র র ্ ত ় প্রবেশ করে, বসই শক্তিস্তরেি েব্ মর্ক সংখ্যাই মৌলটভর পর্যায় রেনদড শ টাইপ ভিততিক ﻿ ্ত ৃ ় ় করে। A এর স ড ছহঃথ শক্তিস্তর ততীে (n = 3)। তাই A মৌলটি পর্যায় ় ় সািরণি ৩ে পর্যায়ে অ মথত। গ্রুপ রনণয A এর সর্বশেষ ইলেকট্রন p অরবিটালে প্রবেশ করেনছ, তাই এটি p- ্ ত রক মৌল। p- কর মৌলের থক্ষতরে স ড ছহঃথ শক্তি তনভর s ও p ল ল ি অরবিটালেি মোট ইলেকট্রন সংখ্যাি সাথে 10 যোগ করলে গ্রুপ র র ় ় সংখ্যা পাওয়া যায়। গ্রুপ সংখ্যা = 10 + (3s এর ইলেকট্রন + 3p এর ইলেকট্রন) = র র 10 + (2 + 5) = 17 ় ় ় সু তিাং, উদ্দীপকের A মৌলটি (Cl) পর্যায় সািরণি ৩ে পর্যায়ের গ্রুপ- 17 এ অ মথত। এটি একটি হযানলানৈে।"},{"label":"ঘ","question":"উদ্দীপকের A মৌলের সাথে B ও D দ্বারা পৃথকরান গঠ ি ত ্ ় ় ় যৌগদনেি উভয়টি পানিনত দ্রবণীে রক ো? বিশ্লেষণ কি। র ্","answer":"গ অংশ থেকে, A হলো ক্লোরিন (Cl)। চচে অেুযায়ী B এর ইলেকট্রন সংখ্যা 2 + 8 + 2 = 12, অর্থাৎ B হলো র্যাগনেমসোর্ (Mg); আি D এর ইলেকট্রন সংখ্যা 2+8+4 = 14, অর্থাৎ D হলো মসললকে (Si)। A ও B বারা গঠ ি ি যৌগ: MgCl 2 2+ Mg (2, 8, 2) স ড ছহঃথ তনভর 2টি ইলেকট্রন তযাগ করে Mg ি র আয়নে এবং দুটি Cl পরমাণু প্নতযনক 1টি করে ইলেকট্রন গ্রহণ করে র র − ় ় ্ ় Cl আয়নে পরিণত হয়। এরা মথি ত দুযরতক আকষডর্ণ েুকব হয়ে আয়নিক যৌগ MgCl2 গঠে করে। 2+ − Mg → Mg +2e − − 2Cl + 2e →2Cl Mg2++2Cl− →MgCl 2 পানি একটি থপালাি দ্া ক। MgCl পানিনত যোগ করলে পানির র 2 2+ ত ় অণুি আংমশক ঋণাতমক O প্ান্ Mg আেজনক এবং আংমশক − ত ় ধোতমক H প্ান্ Cl আেজনক আকর্ষণ করে মঘনি বিবলে। িনল ় ় ় আয়নগুনলা বকলাস থেকে পৃথক হয়ে দ্রবণে চনল যায়। তাই MgCl র 2 পানিনত দ্রবণীে। MgCl2(s) + পানি → Mg2+(aq)+2Cl−(aq) A ও D বারা গঠ ি ি যৌগ: SiCl 4 Si (2, 8, 4) এর স ড ছহঃথ তনভর 4টি ইলেকট্রন 4টি Cl পরমাণুবিভব র প্নতযনকি 1টি করে ইনলক ট নেি সাথে থশোি করে 4টি Si-Cl ় সমযোজী ন্ধে গঠে করে। িনল সমযোজী যৌগ SiCl4 উৎপন্ন হয়। Si + 2Cl2 → SiCl4 ুত ় ় ় SiCl অণু চততলকীে ও প্রতসর্ আকৃ রতি হওয়ায় Si-Cl 4 র ন্ধেগুনলাি থপালারিটি পিস্পিনক প্শমর্ত করে, তাই সার্মগ্করান র র অণুটি অর্পালাি। এনত কোনো আয়ন থাকে ো, িনল থপালাি দ্া ক ় ূ পানি এর অণুগুনলানক আয়নেি র্নতা পৃথক করে দ্ ীিত কিনত ী ী ূ ় পানি ো। ‘সর্ধর্ী পদাথড সর্ধর্ী দ্া নক দ্ ীিত হে’—এ েীরত র র ় ় অনুসারে SiCl পানিনত দ্রবণীে েে; তন এটি অর্পালাি তৈ 4 র ূ ় দ্া নক (যেমন: ব েরৈে, CCl ) দ্ ীিত হয়। প্কৃ তপর্ক্ষ পানির র 4 র র ় ় সংস্পর্শড SiCl দ্ ীিত ো হয়ে পানির সাথে বিক্রিয়া করে 4 র (আদ্ড র ন্ল রষত হয়ে) মসললকা ও HCl উৎপন্ন করে। র ্ SiCl +2H O→SiO +4HCl 4 2 2 ্ ় সু তিাং, উদ্দীপকের A এর সাথে B দ্বারা গঠ ি ত আয়নিক যৌগ MgCl2 ় ্ পানিনত দ্রবণীে, কিন্তু D দ্বারা গঠ ি ত সমযোজী যৌগ SiCl পানিনত র 4 ় ় ্ ় ় ় ় দ্রবণীে েে। অর্থাৎ যৌগদনেি উভয়টি পানিনত দ্রবণীে েে। র র মাস্ট ার সাজেশন"}],"board":"ঢাকা বোর্ড ২০২৬","diagramId":"ch5-cq13"},{"id":"ch5-cq14","chapter":5,"num":14,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: মৌল X Y পারমাণবিক সংখ্যা 14 8 [এখ্াজন X, Y, Z প্কৃ ি মৌল নয, প্িীকী অথে বযবহব ি] র র","subQuestions":[{"label":"ক","question":"সর্াণু কাকে বলে? [২ বোর্ডে এনসনছ] ় ়","answer":"সমাণু : বেস যৌগের আণর ক সংনকত একই কিন্তু গাঠরেক সংনকত ় ় ় ভিন্ন হওয়ায় ধনর্ড ভিন্নতা বদখা যায়, তানদিনক পিস্পনভর সর্াণু বলে। যেমন: CH -CH -OH ও CH -O-CH। 3 2 3 3"},{"label":"খ","question":"আনোপ্র্জনক হযানলানৈে লা হয় — ব্যাখ্যা কি। ় ়","answer":"হযানলানৈে শর্েি অথড লবণ উৎপাদক। পর্যায় সািরণি ১৭ েং গ্রুপেি মৌলগুনলানক হযানলানৈে বলে। 10 2 5 I (53) : [Kr] 4d 5s 5p ় ্ত আনোপ্র্নেি সর্বশেষ শক্তিস্তরে 7টি ইলেকট্রন থাকাে এটি ১৭ েং গ্রুপেি মৌল। এটি ধাতি সাথে বিক্রিয়া করে লবণ উৎপন্ন করে। যেমন: 2Na+I →2NaI 2 ় ় তাই আনোপ্র্জনক হযানলানৈে লা হয়।"},{"label":"গ","question":"Y এর ন্ধে গঠে প্মে্বো মানাগ্ার্চচেসহ ণডো কি। [৫ বোর্ডে 2 র র এনসনছ]","answer":"উদ্দীপকের Y এর পারমাণবিক সংখ্যা 8, তাই Y হলো অক্সিজেন (O) এবং Y হলো O। 2 2 2 2 4 O (8) : 1s 2s 2p বা 2, 6 ্ ত অক্সিজেন পরমাণুর সর্বশেষ শক্তিস্তরে 6টি ইলেকট্রন িনেনছ। ় ় রেকটতর্ রেরকবে গ্যাস রেেনেি (2, 8) র্নতা মথরতশীল ইলেকট্রন র্ ি বিন্যাস অর্জন নেি জন্য প্রতটি O পরমাণুর আিও 2টি ইলেকট্রন প্নোৈে। তাই দুটি O পরমাণু প্নতযনক তানদি সর্বশেষ শক্তি তি থেকে 2টি করে ় ় ইলেকট্রন দিয়ে মোট দুই বৈাড় বা ইলেকট্রন থশোি করে। িনল প্রতটি র র ত ় O পরমাণুর সর্বশেষ তনি 8টি ইলেকট্রন হয় এবং অটট ক পূর্ণ হয়। :Ö: + :Ö: → :Ö::Ö: O + O → O=O ় ় ় এর্ক্ষতরে দুটি ইলেকট্রন বৈাড় থশোি হওয়ায় O অণুনত দুই পরমাণুর র 2 ্ ় মধ্যে সমযোজী ছদ ন্ধে (O=O) গঠ ি ত হয়। এরান Y অর্থাৎ O অণু গঠ ি ত হয়।"},{"label":"ঘ","question":"Z Y এবং XY এর মধ্যে বকােটি পানিনত দ্রবণীে — বেৌপ্কবক 2 2 র র্তার্ত দাও।","answer":"উদ্দীপক অনুসারে, X এর পারমাণবিক সংখ্যা 14, তাই X হলো মসললকে (Si); Y হলো অক্সিজেন (O) এবং Z এর পারমাণবিক সংখ্যা 11, তাই Z হলো সোডিয়াম (Na)। সু তিাং Z Y হলো Na O এবং XY হলো SiO। 2 2 2 2 Na (11) : 2, 8, 1; Si (14) : 2, 8, 4; O (8) : 2, 6 ্ Na O এর বন্ ধন 2 ু ু Na ধাত এবং O অধাত। দুটি Na পরমাণু প্নতযনক একটি করে + ইলেকট্রন তযাগ করে Na আয়নে এবং O পরমাণু দুটি ইলেকট্রন ﻿ 2− ় ় গ্রহণ করে O আয়নে পরিণত হয়। এই র পিীত আধাের মশটট ় ় ় আয়নসর্ূনহি আকষডর্ণ আয়নিক ন্ধে গঠ ি ত হয়। Z + − − 2− 2Na → 2Na +2e; O + 2e →O 11 Na O একটি আয়নিক যৌগ। পানি থপালাি দ্া ক, তাই পানির অণুি 2 র ত ় আংমশক ধোতমক ও ঋণাতমক প্ান্ আয়নগুনলানক আকর্ষণ করে ূ ় পৃ থক করে বিবলে। িনল Na O পানিনত দ্ ীিত হয় এবং ক্ষার দ্রবণ 2 র র উৎপন্ন করে। Na O+H O→2NaOH 2 2 ্ SiO এর বন্ ধ ন 2 ় ্ ় ু Si ও O উভয়ই অধাত (Si অপধাত)। এদের মধ্যে ইলেকট্রন থশোনভর ় মাধ্যমে সমযোজী ন্ধে গঠ ি ত হয়। SiO এ প্রতটি Si পরমাণু চািটি 2 র ্ ় O পরমাণুর সাথে এবং প্রতটি O দুটি Si এর সাথে েুকব হয়ে র শাল মের্ামেক ৈালক (তদতযাকাি সমযোজী গঠে) ততরি করে। ় ত SiO এ কোনো আয়ন বেই এবং এর ৈালক কাঠানর্া অতযন্ দঢ়। 2 ৃ ্ পানির অণু এই শক্তিশালী সমযোজী ন্ধে িােনত পানি ো। তাই SiO ( ালল) পানিনত অদ্রবণীে। 2 র সু তিাং, Z Y (Na O) পানিনত দ্রবণীে এবং XY (SiO ) পানিনত 2 2 র 2 2 অদ্রবণীে।"}],"board":"দিনাজপুর বোর্ড ২০২৬"},{"id":"ch5-cq15","chapter":5,"num":15,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: (i)AB (g) + B (g) ⇌ AB (g) 2 2 3 [কযখ্াজন A ও B প্িলেি মৌলের প্িীক নয] র র (ii) একটি যৌগের 20g কে রবজ্ল ে ষণ কজর 3.24g মযাগজনভসযাম, 3.783g নাইজট াজেন এবং 12.977g অক্সিজেন পাওয়া ক্ষগে।","subQuestions":[{"label":"ক","question":"সট েরকওমর্রত কাকে বলে?","answer":"রাসায়নিক বিক্রিয়াে অংশগ্রহণকািী র মে্বেক ও উৎপন্ন উৎপানদি মোল সংখ্যাি পািস্পরিক সম্পকড নক (মোল অেুপাতনক) সট েরকওমর্রত বলে।"},{"label":"খ","question":"নাইট্রোজেন ও অক্সিজেনের মধ্যে বকােটি ি ইলেকট্রন আসপ্কব র র বেশি? ব্যাখ্যা কি। ় ় ় ়","answer":"নাইট্রোজেন ও অক্সিজেনের মধ্যে অক্সিজেনের ইলেকট্রন আসপ্কব র র বেশি। 2 2 2 2 3 2 2 4 N (7): 1s 2s 2p এবং O (8): 1s 2s 2p। নাইট্রোজেনের 2p ় ় অরবিটাল অধডপূর্ণ (2p3) হওয়ায় এটি মথরতশীল, তাই নাইট্রোজেন ি র সহজে াড় রত ইলেকট্রন গ্রহণ কিনত চাে ো। র র অপিরদনক অক্সিজেনের রেউর্োি চার্জ বেশি ও আকার বছাট এবং ইলেকট্রন গ্রহণ করে এটি রেরকবে গ্যাসের মথরতশীল র েযানসি রদনক র র ্ বিভব এর্গাে। তাই অক্সিজেন সহজে ইলেকট্রন গ্রহণ করে এবং এর র র ্ ় ইলেকট্রন আসপ্কব নাইট্রোজেনের বচনে বেশি। র র"},{"label":"গ","question":"উদ্দীপকের (i) েং বিক্রিয়াে সার্যা থাে লা-শানতলীে েীরত র অনুসারে চার্পি প্রবণতা ব্যাখ্যা কি। র","answer":"উদ্দীপকের (i) েং বিক্রিয়াটভর সর্তাকৃ ত িূপ: 2AB (g)+B (g) ⇌ 2AB (g) 2 2 3 ় ় ় ় লা-শানতলীে েীরত: সার্যা থাে থাকা কোনো বিক্রিয়াে তাপমানা, বিভব চাপ বা ঘেমানাি কোনো একটি পরি তড ে করলে সার্যা থা এর্ে ় ় রদনক সনি যায় োনত ঐ পরি তড নেি প্রবণতা প্শমর্ত হয়। র র টাইপ ভিততিক মাস্ট ার সাজেশন রবভতর্ ব যক পথে গযাজসর কমাে সংখ্যা = 2 + 1 = 3 উৎপাদ পথে গযাজসর কমাে সংখ্যা = 2 ় ় ় অর্থাৎ সম্মখ বিক্রিয়াে গ্যাসের মোল সংখ্যা তথা আেতে হ্াস পায়। ্ ় • চাপ বৃদ্ধি করলে সার্যা থা বেরদনক আেতে (মোল সংখ্যা) কম বসরদনক, অর্থাৎ মানরদনক সনি যায়। িনল AB এর উৎপাদে বৃদ্ধি 3 পায়। • চাপ হ্াস করলে সার্যা থা বেরদনক মোল সংখ্যা বেশি বসরদনক, বিভব ় ় অর্থাৎ ার্রদনক সনি যায়। িনল AB3 র নোরৈত হয়ে AB2 ও B2 ় বেশি উৎপন্ন হয়। ় ় অতএ, (i) েং বিক্রিয়াে উচ্চ চাপ AB3 উৎপাদনেি অেুকূ ল।"},{"label":"ঘ","question":"উদ্দীপকের (ii) েং যৌগটভর আপেক্ষিক ভর 148 হলে, যৌগটি র দুযৎ পরি াহী হন রক? বিশ্লেষণ কি।","answer":"(ii) েং যৌগে র দযমান মৌলগুনলাি মোল সংখ্যা নির্ণয়: 3. 24 Mg = =0.135mol 24 N = 3.783 = 0.270mol 14 12.977 O = =0.811mol 16 ক্ষু দ্তর্ মান 0.135 দিয়ে িাগ করে: 0.135 0.811 Mg : N : O = : 0.270/0.135 : = 0.135 0.135 স্ে সংকেত = MgN O থূ 2 6 স্ে সংকেত ির = 24+(14×2)+(16×6) = 148 থূ 148 n = আণরবক ির/স্ে সংকেত ির = থূ 148 সু তিাং যৌগটভর আণর ক সংনকত MgN O অর্থাৎ Mg(NO ) 2 6 (র্যাগনেমসোর্ োইন ট ট)। ় ু Mg(NO ) একটি আয়নিক যৌগ। এনত ধাত Mg (2, 8, 2) দুটি 3 2 2+ ইলেকট্রন তযাগ করে Mg কযাটােে এবং োইন ট ট মূল {"label":"খ","question":"H O একটি থপালাি যৌগ— ব্যাখ্যা কি। 2 ় ়","answer":"H O অণুনত O পরমাণুর তপ্ড় ৎ ঋণাতমকতা (3.5) H পরমাণুর 2 ় ্ ় (2.1) বচনে বেশি। তাই O-H ববন্ধনের থশোিকৃ ত ইলেকট্রন েুগল O এর রদনক বেশি সনি থাকে; িনল O আংমশক ঋণাতমক (δ-) ও H আংমশক ধোতমক (δ+) চার্জ লাি করে। ্ ় ্ তাছাড় বা H O অণু বকৌরণক ( ন্ধে বকাণ প্রায় 104.5°), তাই ন্ধে 2 র দু টি ি থপালারিটি পিস্পিনক প্শমর্ত করে ো এবং অণুটি ি রেট র্াইর্পাল থাকে। এজন্য H O একটি থপালাি যৌগ। 2 ় ়"},{"label":"গ","question":"উদ্দীপকের A ও B পাতরেি দ্রবণেি বিক্রিয়াে উৎপন্ন ল র্ণি উপাদানসর্ূনহি শতকরা সংেুরত নির্ণয় কি।","answer":"A পাতরে NaOH (ক্ষার) ও B পাতরে HNO (এসিড) আনছ। এদের 3 ় ় ় দ্রবণ মর্প্শ্ত করলে প্শর্ে বিক্রিয়াে সোডিয়াম োইন ট ট লবণ ও র র র ় পানি উৎপন্ন হয়। NaOH+HNO →NaNO +H O 3 3 2 সু তিাং উৎপন্ন লবণ NaNO। এর উপাদান Na, N ও O। 3 − NaNO এর আণরবক ির = 23+14+16×3 = 85 3 23×100 Na এর শতকরা পরিমাণ = %=27.06% 85 N এর শতকরা পরিমাণ = 14×100% = 16.47% 85 48×100 O এর শতকরা পরিমাণ = %=56.47% 85 যািাই: 27.06% + 16.47% + 56.47% = 100% সু তিাং উৎপন্ন লবণ NaNO এ Na 27.06%, N 16.47% এবং O 3 56.47%।"},{"label":"ঘ","question":"A ও B পাতরেি মধ্যে দ্রবণেি মোলারিটি বকােটি ি বেশি? গারণরতকরান বিশ্লেষণ কি।","answer":"প্রত ললটাি দ্রবণে দ্ ীিত দ্ন ি মোল সংখ্যানক মোলারিটি বলে। র র র র W×1000 কমাোররটি, S = M×V এখানে W = দ্ন ি ভর (g), M = দ্ন ি আণর ক ভর, V = দ্রবণেি র র র − আেতে (mL)। A পাতরতরর দ্বর্ণের কমাোররটি NaOH এর আণরবক ির, M = 23+16+1 = 40 W = 3 g, V = 250 mL S(A) = 3 × 1000M 40 × 250 3000 = M 10000 = 0.3 M B পাতরতরর দ্বর্ণের কমাোররটি HNO এর আণরবক ির, M = 1+14+16×3 = 63 3 W = 1.5 g, V = 250 mL S(B) = 1.5 × 1000M 63 × 250 1500 = M 15750 = 0.095 M িততিক মাস্ট ার সাজেশন ় ় উভয় পাতরে দ্রবণেি আেতে সমান (250 mL)। কিন্তু A পাতরে দ্ন ি র র 3 1.5 মোল সংখ্যা =0.075mol, আি B পাতরে =0.0238mol। 40 63 ় ় রদ্ন ি ভর বেশি এবং আণর ক ভর কম হওয়ায় A পাতরে মোল সংখ্যা বেশি। S(A) : S(B) = 0.3 : 0.095 ≈ 3.15 : 1 সু তিাং A পাতরেি দ্রবণেি (0.3 M) মোলারিটি B পাতরেি দ্রবণেি র র ় ় (0.095 M) বচনে বেশি; প্রায় 3.15 গুণ।"}],"board":"র্া াৈনক একটি পরিষ্ক াি 2 L আেতরেক ফ্ার্স্ক িানেনলি ্ ু ল ত ় ় সাহানেয থাোন্ি কিনত হন এবং ওোশ ব াতনলি পানি দিয়ে ় ্ ্ িানেল ধুনে স গলনকাৈ ফ্ার্স্ক রেনত হন। ্ ু ল ় ূ ৩. অল্ পারতত পানি যোগ করে ঝ ারকনে গলনকাৈ সম্পূর্ণ দ্ ীিত প ্ ু র কিনত হন। ্ ্ ত ্ ্ ৪. এরপি ফ্ার্স্ক ি দাগ পে্ পারতত পানি যোগ করে র্ুখ ন্ধ করে িানলািান ঝ ারকনে রেনত হন। এরান 180 g গলনকাৈ ব্যবহার করে 2 L 0.5 M গলনকাৈ দ্রবণ প্তু ত ্ ু ্ ু র র করা যায়। ় ় ় রাসায়নিক রবভতর্ব যা ও রাসায়নিক সমীকরণ"}],"board":"দিনাজপুর বোর্ড ২০২৪"},{"id":"ch6-cq7","chapter":6,"num":7,"importance":2,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: (i) Cu + H SO (গা ় ) → CuSO + x + H O 2 4 4 2 তাপ (ii)Pb(NO ) ⟶PbO+y+O 3 2 2","subQuestions":[{"label":"ক","question":"িস্মীকিণ কাকে বলে?","answer":"আকরিকনক াে়ুি অেুপমথরতনত বা সীমর্ত াে়ুনত উচ্চ ় ্ ় তাপর্াযায় উকপ্ করে এর উদােী অপদ্ য (পানি, CO ইতযারদ) দি ত র 2 ূ করাি প্মে্ব োনক িস্মীকিণ বলে। ় ়"},{"label":"খ","question":"3d এবং 4s অরবিটালেি মধ্যে বকােটি নত ইলেকট্রন আগে প্রবেশ করে? ব্যাখ্যা কি। ় ় ়","answer":"(n + l) রেের্ অেুযায়ী বে অরবিটালেি (n + l) মান কম, তাি শক্তি কম এবং তানত ইলেকট্রন আগে প্রবেশ করে। 4s: n + l = 4 + 0 = 4; 3d: n + l = 3 + 2 = 5 4s অরবিটালেি (n + l) মান কম, তাই এর শক্তি কম। সুতিাং 3d এর আগে 4s অরবিটালে ইলেকট্রন প্রবেশ করে।"},{"label":"গ","question":"60g র মে্বেক থেকে কত আেতনেি O পাওয়া োন উদ্দীপকের 2 ় ় (ii) েং র মে্ ব োি আনলানক নির্ণয় কি। [Pb এর পারমাণবিক ভর 207]","answer":"(ii) েং বিক্রিয়াি সর্তাকৃ ত সর্ীকিণ: Δ 2Pb(NO ) ⟶2PbO+4NO +O 3 2 2 2 Pb(NO ) এর আণরবক ির = 207 + 2(14 + 16 × 3) = 3 2 331; ∴ 2 কমাে = 662 g সর্ীকিণ অেুযায়ী STP বত, ় ় 662 g Pb(NO ) ক্ষেজক O পাওয়া যায 1 কমাে = 22.4 L 3 2 2 22.4×60 ় ় ∴ 60 g Pb(NO ) ক্ষেজক O পাওয়া যায =2.03L 3 2 2 662 ় ় সু িরাং 60 g রবভতর্ব যক ক্ষেজক প্রমাণ অবস্থায় 2.03 লেটার O পাওয়া যাজব।"},{"label":"ঘ","question":"x এবং y যৌগের মধ্যে বকােটি ি ব্যাপন দ্ুত ঘনট? গারণরতকরান বিশ্লেষণ কি।","answer":"(i) েং বিক্রিয়াি সর্তাকৃ ত িূপ: Cu + 2H SO (গাঢ় ) → CuSO +SO +2H O 2 4 4 2 (ii) েং র মে্ ব োি সর্তা হয়ে N ও H 2 3 2 2 বত পরিণত হয়, তাই এটি উির্ুখী। ় ় ় ় ৪. তাপউৎপাদী বিক্রিয়া: বিক্রিয়াে তাপ উৎপন্ন হয় (ΔH ঋণাতমক)। 2 ় ় সু তিাং দশকল্-১ এর বিক্রিয়াটি র্ূলত একটি সংনোৈে বিক্রিয়া, ো ৃ প একই সাথে জারণ-র জারণ, উির্ুখী ও তাপউৎপাদী বিক্রিয়া। ় ় ়"},{"label":"ঘ","question":"দশকল্-২ এর বিক্রিয়া থেকে 30g লবণ পাওয়া সম্ রক? ৃ প গারণরতকরান বিশ্লেষণ কি।","answer":"দশকল্-২ এ সোডিয়াম ও সালমিউরিক এসিডের বিক্রিয়াে লবণ ৃ প ় ় সোডিয়াম সালনিট উৎপন্ন হে: 2Na+H SO →Na SO +H 2 4 2 4 2 2 mol 1 mol 1 mol 18 H SO এর মোল সংখ্যা: 2 4 n = SV = 2.0mol/L × 100 L = 0.2mol 1000 Na এর মোল সংখ্যা: 10 n = mol = 0. 4348mol 23 সর্ীকিণ অনুসারে 1 mol H SO এর সাথে বিক্রিয়া করে 2 mol Na 2 4 ∴ 0.2 mol H SO এর সাথে রবভতর্ব যা কজর (2 × 0.2)mol = 2 4 0. 4molNa ় ় কিন্তু Na আনছ 0.4348 mol, ো প্নোৈনেি বচনে বেশি। সুতিাং ় ্ ় H SO হলো ললমর্টি ং র মে্ব েক এবং উৎপানদি পরিমাণ H SO দ্বারা 2 4 2 4 রেধডারিত হন। Na SO এর আণরবক ির = (23 × 2) + 32 + (16 × 4) = 2 4 ় 142g/mol ় 1 mol H SO থেকে উৎপন্ন হয় 1 mol বা 142 g Na SO 2 4 2 4 ∴ 0.2 mol H SO ক্ষেজক উৎপন্ন Na SO = (142 × 0.2) g = 2 4 2 4 28.4 g অর্থাৎ দশকল্-২ এর বিক্রিয়া থেকে সন ডাচ্চ 28.4 g লবণ (Na SO ) ৃ প 2 4 পাওয়া োন, ো 30 g অপেক্ষা কম। ় ় ় সু তিাং দশকল্-২ এর বিক্রিয়া থেকে 30 g লবণ পাওয়া সম্ েে। ৃ প র র"}],"board":"চট্টগ্রাম বোর্ড ২০২৬"},{"id":"ch6-cq9","chapter":6,"num":9,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: রনজ্ািব উদ্দীপকটি েে কর : 2","subQuestions":[{"label":"ক","question":"যৌগমূলক কাকে বলে?","answer":"একারধক মৌলের কনেকটি পরমাণু একতরে গুচ্ছ আকানি থেকে ় ় ় ় একটি মান পরমাণুর র্নতা রাসায়নিক বিক্রিয়াে অংশ বেে এবং টাইপ ভিততিক মাস্ট ার সাজেশন এদের নির্দিষ্ট চার্জ থাকে, এরূপ পরমাণুগুচ্ছনক যৌগমূলক বলে। যেমন: SO 2−, NH +। 4 4 ় ় ়"},{"label":"খ","question":"Mg একটি র জারক— ব্যাখ্যা কি।","answer":"বে পদাথড রাসায়নিক বিক্রিয়াে ইলেকট্রন তযাগ করে অপি পদাথক র ৈারিত করে, তানক র জারক বলে। Mg (12) এর ইলেকট্রন বিন্যাস 2, 8, 2। Mg এর স ড ছহঃথ তনভর বিভব 2+ ় ় 2টি ইলেকট্রন তযাগ করে Mg আয়নে পরিণত হওয়ার প্ ণতা বেশি। 2+ − Mg → Mg +2e যেমন: CuSO দ্রবণে Mg যোগ করলে Mg ইলেকট্রন তযাগ করে 4 র র Cu2+ বক Cu বত র ৈারিত করে। Mg+CuSO →MgSO +Cu 4 4 তাই Mg একটি র জারক।"},{"label":"গ","question":"উদ্দীপকের পায়-B এর দ্ন ি অণুি সংখ্যা নির্ণয় কি। [২ বোর্ডে এনসনছ] ় ্ ় ়","answer":"উদ্দীপকের পায়-B বত দ্ Na CO এবং দ্রবণেি ঘেমানা S = র 2 3 র 0.1 M, আেতে V = 400 mL = 0.4 L। Na CO এর কমাে সংখ্যা, n = S × V 2 3 =0.1mol/L × 0.4L = 0.04 mol আর্িা ৈারে, 1 mol পদার্থড অণুি সংখ্যা = 6.02 × 1023 টি। ∴ 0.04 mol Na CO এ অণুর সংখ্যা = 0.04 × 6.02 × 1023 2 3 22 =2.408 × 10 টি অতএ, উদ্দীপকের পায়-B এর দ্ন (Na CO ) অণুি সংখ্যা 2.408 র 2 3 22 × 10 টি। ় ্"},{"label":"ঘ","question":"উদ্দীপকের উভয় পাতরেি দ্রবণদনেি মধ্যে বিক্রিয়া সম্পন্ হলে বকােটি ললমর্টিং র মে্ ব েক হন? বিশ্লেষণ কি।","answer":"উভয় পাতরেি দ্রবণ বর্শানল Na CO ও HCl এর মধ্যে রেনম্ন াকব র 2 3 র মে্ ব ো ঘনট: Na CO +2HCl→2NaCl+H O+CO 2 3 2 2 সর্ীকিণ অনুসারে, 1 mol Na CO এর সাথে 2 mol HCl বিক্রিয়া 2 3 করে। উপভস্ি রবভতর্ব যজকর কমাে সংখ্যা পাতর-A কি HCl এর কমাে সংখ্যা = 0.2mol/L × 700 L = 1000 0. 14mol পাতর-B কি Na CO এর কমাে সংখ্যা = 0.1mol/L × 400 L = 2 3 1000 0. 04mol ় ় প্জযােনীয পরিমাণ যািাই 1 mol Na CO এর সাথে রবভতর্ব যা কজর 2 mol HCl 2 3 ∴ 0.04 mol Na CO এর সাথে রবভতর্ব যা কজর (2 × 0.04)mol = 2 3 0. 08molHCl কিন্তু পায়-A বত HCl আনছ 0.14 mol, ো প্নোৈনেি (0.08 mol) বচনে বেশি। অবভশটট HCl = (0.14-0.08)mol = 0.06mol অপিরদনক, 0.14 mol HCl সম্পূর্ণ বিক্রিয়া কিনত (0.14/2) mol = 0.07 mol Na CO প্নোৈে, কিন্তু আনছ মান 0.04 mol। অর্থাৎ 2 3 র Na CO আগে সম্পূর্ণ রেঃর্শষ হয়ে োন এবং উৎপানদি পরিমাণ 2 3 এর দ্বারাই রেধডারিত হন। উৎপন্ন CO =0.04mol(Na CO এর কমাে সংখ্যার সমান) 2 2 3 ় ় ় সু তিাং, উভয় পাতরেি দ্রবণেি মধ্যে বিক্রিয়াে পায়-B এর Na CO র 2 3 ় ্ ললমর্টিং র মে্ ব েক হন এবং পায়-A এর HCl 0.06 mol অরতরিকব থেকে োন। টাইপ ভিততিক মাস্ট ার সাজেশন ﻿ ়"}],"board":"ঢাকা বোর্ড ২০২৬","diagramId":"ch6-cq9"},{"id":"ch6-cq10","chapter":6,"num":10,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: (i)4Al + 3O →2Al O 2 2 3 ় ় ় 5g rd":"দিনাজপুর বোর্ড ২০২৬","diagramId":"ch6-cq10"},{"id":"ch6-cq11","chapter":6,"num":11,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: 30.6g MgCO3 এর সাথে 29.2g HCl এর রবভতর্ব যায েবণ, পারন ও B(g) উৎপন্ন হজো।","subQuestions":[{"label":"ক","question":"ভরর্াললে কাকে বলে? [২ বোর্ডে এনসনছ]","answer":"ফরমালেন: ভরর্ালপ্র্হাইর্ বা মর্থােযানলি (HCHO) 40% জলীয় রদ্রবণনক ভরর্াললে বলে।"},{"label":"খ","question":"ইরথজনক অললমিে লা হয় কেন? সর্ীকিণসহ ব্যাখ্যা কি।","answer":"অললমিে শর্েি অথড বতল উৎপাদেকািী। ইরথে (CH =CH ) একটি অসম্পৃকব হাইন ব াকার্বন, ো ক্লোরিন বা ব রামর্নেি সাথে েু ্ ল ় ্ র মে্ ব ো করে ততলাকব পদাথড উৎপন্ন করে। CH =CH +Cl →CH Cl-CH Cl 2 2 2 উৎপন্ন 1,2-র্াইন্ানিাইর্থে একটি ততলাকব তিল। ইরথে বতনলি র্নতা পদাথড উৎপন্ন করে বলে ইরথজনক (এবং সকল অযালরকজনক) অললমিে লা হয়। ় ়"},{"label":"গ","question":"চনেি পানিনত 'B' চালো করলে কী ঘনট? সর্ীকিণসহ ব্যাখ্যা কি। ় ়","answer":"উদ্দীপকের বিক্রিয়াে MgCO ও HCl বিক্রিয়া করে 3 র্যাগনেমসোর্ ক্লোরাইড লবণ, পানি ও কার্বন র্াইঅক্সাইড গ্যাস উৎপন্ন করে। সুতিাং 'B' হলো CO। 2 MgCO +2HCl→MgCl +H O+CO 3 2 চনেি পানি হলো ক্যালসিয়াম হাই বিাইনর্ি [Ca(OH) ] স্বচ্ছ জলীয় দ্রবণ। এর মধ্যে CO গ্যাস চালো করলে পানিনত অদ্রবণীে সাদা র 2 ক্যালসিয়াম কার্বনেনটি অধঃর্ক্ষপ সৃটটি হয়, িনল চনেি পানি বঘালা ় ় হয়ে যায়: Ca(OH) +CO →CaCO +H O 2 2 ় ্ আিও বেশি সময় ধনি অরতরিকব CO চালো করলে অদ্রবণীে 2 ় ় CaCO পানিনত দ্রবণীে ক্যালসিয়াম াইকার্বনেনট পরিণত হয়, িনল 3 র ় ় ্ দ্রবণেি বঘালানটিা দি হয়ে পুেিাে স্বচ্ছ হে: র ূ CaCO +H O+CO →Ca(HCO ) 3 2 2 এই পিীক্ষার মাধ্যমে CO গ্যাস শোকব করা হয়। 2 ﻿"},{"label":"ঘ","question":"উদ্দীপকের বিক্রিয়াে সন ডাচ্চ কী পরিমাণ 'B' উৎপন্ন হন? গারণরতকরান বিশ্লেষণ কি। [২ বোর্ডে এনসনছ]","answer":"1000 MgCO +2HCl→MgCl +H O+CO 3 2 2 2 MgCO এর আণর ক ভর = 24+12+3×16=84g/mol 3 HCl এর আণর ক ভর = 1+35.5 = 36.5g/mol র CO এর আণর ক ভর = 12+2×16=44g/mol 2 ় ় MgCO এর কমাে সংখ্যা = 30.6mol = 0.3643mol 3 84 HCl এর কমাে সংখ্যা = 29.2mol = 0.8mol 36.5 সর্ীকিণ অনুসারে, 1 mol MgCO এর সাথে বিক্রিয়া করে 2 mol 3 ় ় HCl 3 ় 0.3643 mol MgCO এর সাথে রবভতর্ব যা কজর HCl = (2 × 3 0. 3643)mol = 0. 7286mol ় কিন্তু HCl আনছ 0.8 mol, ো প্নোৈনেি তলযায় বেশি। সুতিাং 3 র ্ HCl অরতরিকব এবং MgCO ললমর্টি ং র মে্বেক। উৎপন্ন CO এর 3 2 পরিমাণ MgCO এর পরির্ার্ণি ওপি রেিড ি কিন। ন 3 ন ় সর্ীকিণ অনুসারে, 84 g MgCO থেকে উৎপন্ন হয় 44 g CO 3 2 ় ় 44×30.6 30.6 g MgCO ক্ষেজক উৎপন্ন CO = g = 16.03g 3 2 84 ় ় STP বত আেতে ছহসান, 1 mol CO এর আেতে 22.4 L 2 ন ় উৎপন্ন CO এর আয়তন = (0.3643 × 22.4)L = 8.16L 2 ় ় অতএ, উদ্দীপকের বিক্রিয়াে সন ডাচ্চ 16.03 g বা 0.3643 mol (STP বত 8.16 L) 'B' (CO ) উৎপন্ন হন। 2 ন"}],"board":"ময়মনসিংহ বোর্ড ২০২৬"},{"id":"ch6-cq12","chapter":6,"num":12,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: ড র 2 2","subQuestions":[{"label":"ক","question":"বির্ি বিক্রিয়া কাকে বলে? [২ বোর্ডে এনসনছ] 2 2 ্ ত","answer":"2 2 ় ় ় করডি রবভতর্ব যা: বে বিক্রিয়াে জারণ ও র জারণ একই সাথে ঘনট, ্ ় 2 ় ় অর্থাৎ একটি র মে্ব েক ইলেকট্রন তযাগ করে এবং অপি র মে্বেক বসই ইলেকট্রন গ্রহণ করে, তানক বির্ি বিক্রিয়া বলে। র র ় ু"},{"label":"খ","question":"পটামশোনর্ি 19তর্ ইলেকট্রনটি বকাে উপশক্তি তনি গর্ে করে? ব্যাখ্যা করো।","answer":"পটামশোনর্ি পারমাণবিক সংখ্যা 19। আউি াউ েীরত অনুসারে ্ ত ইলেকট্রন প্রথমে রেম্ন শক্তি ি উপতনি প্রবেশ করে। র র 3 2 (n + l) এর মান: 3d এর জন্য 3 + 2 = 5 এবং 4s এর জন্য 4 + ় ় ত ্ 0 = 4। (n + l) এর মান কম হওয়ায় 4s উপতনভর শক্তি 3d অপেক্ষা কম। 2 2 6 2 6 1 K(19) : 1s 2s 2p 3s 3p 4s 3 2 টাইপ ভিততিক মাস্ট ার সাজেশন ত ় তাই 18টি ইলেকট্রন 3p পে্ পূর্ণ হওয়ার পি 19তর্ ইলেকট্রনটি 3d ় ্ ত বত ো রগনে 4s উপশক্তিস্তরে গর্ে করে।"},{"label":"গ","question":"উদ্দীপকের ১েং পাতরে দ্ন ি পরিমাণ নির্ণয় করো। ় ়","answer":"১েং পাতরে আনছ সোডিয়াম কার্বনেনটি (Na CO ) 25 mL 2 3 বর্মসনর্ালাি দ্রবণ। বর্মসনর্ালাি অথড 0.1 M। Na CO এর আণরবক ির = (23 × 2) + 12 + (16 × 3) = 2 3 106 আর্িা ৈারে, W = S×M×V 1000 এখানে, ঘেমানা S = 0.1 M, আণর ক ভর M = 106, আেতে V = 25 mL 0. 1 × 106 × 25 W = g 1000 W = 0.265 g সু তিাং ১েং পাতরে দ্ন ি (Na CO ) পরিমাণ 0.265 g। র 2 3"},{"label":"ঘ","question":"  ় দেওয়া আনছ, H SO এর ভর, w = 75 g; দ্রবণেি আেতে, V = 100 2 4 র mL H SO এর আণর ক ভর, M = (1×2)+32+(16×4)=98 2 4 22 w×1000 আমরা োরন, S = M×V 75 × 1000 = 98 × 100 = 7.65 M সু তিাং, B পাতরেি দ্রবণেি ঘেমানা 7.65 M। 2 ্ ়"},{"label":"ঘ","question":"A ও B পাতরেি দ্রবণেি বিক্রিয়াি ললমর্টিং র মে্ব েক বকােটি ও কেন? গারণরতকরান বিশ্লেষণ কি। [৩ বোর্ডে এনসনছ]","answer":"A পাতরে NaOH এবং B পাতরে H SO আনছ। দ্রবণদে মর্শানল 2 4 র প্শর্ে বিক্রিয়া ঘনট: 2NaOH+H SO →Na SO +2H O 2 4 2 4 2 2 × (23 + 16 + 1) = 80 g NaOH বিক্রিয়া করে (1×2 + 32 + 16×4) = 98 g H SO এর সাথে 2 4 ∴ 55 g NaOH রবভতর্ব যা কজর (98 × 55)/80 = 67.375 g H SO 2 4 এর সাথে কিন্তু B পাতরে H SO আনছ 75 g। অর্থাৎ বিক্রিয়া থশনষ (75 - 2 4 67.375) = 7.625 g H SO অ মশটট থাকন এবং 55 g NaOH 2 4 সম্পূর্ণ রেঃর্শষ হন। ় ় ় ় র মে্ ব যায় বে র মে্ ব েক সম্পূর্ণ রেঃর্শষ হয়ে উৎপানদি পরিমাণ ় ় ় রেধডািণ করে, তানক ললমর্টিং র মে্ব েক বলে। সুতিাং, এ বিক্রিয়াে ় NaOH হলো ললমর্টিং র মে্বেক।"}],"board":"যশোর বোর্ড ২০২৩","diagramId":"ch6-cq15"},{"id":"ch6-cq16","chapter":6,"num":16,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: 11.2 lit CO (g) উৎপাদজনর েনয 50g CaCO ও 30g HCl 2 3 এর মজধ্য রবভতর্ব যা সংঘটি ি করা হজো, কিন্তু প্িযাভশি উৎপাদ পাওয়া ক্ষগে না।","subQuestions":[{"label":"ক","question":"সট েরকওমর্রত কাকে বলে? [৩ বোর্ডে এনসনছ]","answer":"রাসায়নিক বিক্রিয়াে র মে্বেক ও উৎপাদসর্ূনহি মোল, ভর বা ় ় আেতনেি পরিমাণগত সম্পকড নক সট েরকওমর্রত বলে।"},{"label":"খ","question":"একই থল সংনকত একারধক যৌগের হনত পানি— ব্যাখ্যা কি। [২ ি ূ বোর্ডে এনসনছ]","answer":"থল সংনকত যৌগের অণুনত পরমাণুর শুধু সিলতর্ অেুপাত িূ প্কাশ করে, প্কৃ ত সংখ্যা েে। র র ভিন্ন যৌগে পরমাণুর প্কৃ ত সংখ্যা ভিন্ন হলেও অেুপাত একই হনত পানি। যেমন: ভরর্ালপ্র্হাইর্ (HCHO), ইথানয়িক এসিড (C H O ) ও গলনকাৈ (C H O ) — রতেটি নতই C : H : O = 1 : 2 ্ ু 2 4 2 6 12 6 : 1, তাই স গুনলাি থল সংনকত CH O। িূ 2 একইিান ইথাইন (C H ) ও ব েরৈে (C H ) উিনেি থল সংনকত 2 2 6 6 CH। তাই একই থল সংনকত একারধক যৌগের হনত পানি। িূ"},{"label":"গ","question":"উদ্দীপকের উৎপাদ গ্যাসীে যৌগটভ
