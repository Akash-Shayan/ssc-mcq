:19,"importance":2,"question":"কোন কমৌল্টি ব্ায়ু দেথণর েনয দাযী?","options":["Pb","Fe","He","Au"],"answerIndex":0,"explanation":"লেড (Pb) একটি ভোরী ধোত; রোসোযদনক যজড য থ্োকো Hg, Pb, ় ় ় As, Co োয়ুর সাথে স শ োয়ুিেণ ঘটোয। ় ় ় Fe ও Au সোধোরণত োয়ুিেণকোরী নয, আর He দনদকরয গযোস। তোই বিভব সঠ ি ক উততর Pb। 2 টাইপ ভিততিক মাস্ট ার সাজেশন রসাযজন অনুসন্ ধান ব্া গজব্েণা প্ভতর্ৃ যা ় ়","boards":"রাজশাহী বোর্ড ২০২২"},{"id":"ch1-mcq20","chapter":1,"num":20,"importance":3,"question":"রসাযজন অনুসন্ ধান ও গজব্েণা প্ভতর্ৃ যার ৩য ধ্াপ কোনটি? ় ু","options":["দ েয স্তু সম্পযকড দকে ধোরণো অ্জড ন","পরীক্ষো প্ণোলল দনধডোরণ","তথ্য উপোতত সিংগ্হ ও দ যশল েণ র ্","ফলোফল দনযয আযলোচনো"],"answerIndex":1,"explanation":"গয েণো প্স্ির যোর ৬টি ধোশপর ্রি : ১. দ েয স্ত ় ় ় দ েয স্তু সম্পযকড ধোরণো বনওযো, ৩. প্যযোজনীয স্তু ও য পরীক্ষো প্ণোলল দনধডোরণ, ৪. পরীক্ষণ, ৫. তথ্য সিংগ্হ ও দ যশলেণ, ৬. র র ফলোফল ও আযলোচনো। তোই ৩য ধোপ হলো পরীক্ষো প্ণোলল দনধডোরণ। ় ু","boards":"বরিশাল বোর্ড ২০২৩; রাজশাহী বোর্ড ২০২২"},{"id":"ch1-mcq21","chapter":1,"num":21,"importance":2,"question":"অনুসন্ ধান ও গজব্েণা প্ভতর্ৃ যার ভরথ ধ্াপ কোনটি?","options":["দ েয স্তু দনধডোরণ","স যক জ্ঞোন অ্জড ন","পরীক্ষণ","ফলোফল অ্জড ন"],"answerIndex":2,"explanation":"ধোশপর ্রি : দ েয স্তু দনধডোরণ → ধোরণো অ্জড ন → স্তু যন্তপোদত ও প্ণোলল দনধডোরণ → পরীেণ → তথ্য সিংগ্হ ও দ যশলেণ → র র ফলোফল। অ্তএ চতথ্ড ধোপ পরীক্ষণ। রসায়ন পরীোগার ব্যব্হাজর ও পরীোগাজর ব্যব্হৃ ি ন য রব্ভিন্ন রাসায়নিক দ্ব্য ব্যব্হাজর সিকরা গ্রহণ","boards":"যশোর বোর্ড ২০২৪"},{"id":"ch1-mcq22","chapter":1,"num":22,"importance":3,"question":"কোনটি দাহয পদাথ?","options":["ব নদজন","ইথ্োর","বরততর্যো","জোইললন"],"answerIndex":1,"explanation":"ইথ্োর ও অ্যোলযকোহল িোহয পিোথ্ড — দ্ুত আগুন ধযর যোয, তোই আগুন ও তোপ থেকে িযর রোখযত হয। ব নদজন ও জোইললন সরোথয ঝু দকপূর্ণ পিোথ্ড, বরততর্যো বতজসথর য পিোথ্ড। তোই সঠ ি ক উততর খ) ইথ্োর।","boards":"দিনাজপুর বোর্ড ২০২৫; রাজশাহী বোর্ড ২০২৩; বরিশাল বোর্ড ২০২২;ময়মনসিংহ বোর্ড ২০২২, ২০২০"},{"id":"ch1-mcq23","chapter":1,"num":23,"importance":3,"question":"কোনটি র ন","ব্োদরন","ব রোস ন ল র"],"answerIndex":1,"explanation":"আযযোততর্ন (I ) কঠ ি ন অ্ থোয থাকে এ িং তোপ দিযল তরল 2 ি 3 ় ় নো হযয সরোসদর ব গুদন োশষপ পদরণত হয, তোই এটি ঊধ্ডপোতনযযোগয। বফ্োদরন ও ব্োদরন সোধোরণ তোপ ো্োয গযোস এ িং ব রোস ন তরল — ল ল র এযির ঊধ্ডপোতন হয নো। 3 টাইপ ভিততিক মাস্ট ার সাজেশন কমৌলল্ক ও কযৌরগক পদাথ","boards":"সিলেট বোর্ড ২০২৪"},{"id":"ch3-mcq1","chapter":3,"num":1,"importance":3,"question":"আমাজদর শরীজর কি ধ্রজনর কমৌল্ আজে?","options":["১৫","১৮","২৬","৩২"],"answerIndex":2,"explanation":"োন যিযহ ব োট 26 ধরযনর সভন্ সভন্ ব ৌল আযে। বয ন— O, C, H, N, Ca, P, Fe ইতযোদি। তোই সঠ ি ক উততর গ) ২৬।","boards":"দিনাজপুর বোর্ড ২০২৪, ২০২১; চট্টগ্রাম বোর্ড ২০২২, ২০২১; সিলেট বোর্ড ২০২২; যশোর বোর্ড ২০২১; বরিশাল বোর্ড ২০২১"},{"id":"ch3-mcq2","chapter":3,"num":2,"importance":2,"question":"কোনটি কমৌলল্ক পদাথ?","options":["ক োসো","সপতল","ইসপোত","বলোহো"],"answerIndex":3,"explanation":"বলোহো (Fe) একটি ব ৌল; এযক ভোেযল বলোহো েোড় ো অ্নয দকে ় ় পোওযো যোয নো। ক োসো (Cu + Sn), সপতল (Cu + Zn) ও ইসপোত (Fe + C) একোদধক উপোিোযনর সিংকর, তোই এরো ব ৌললক পিোথ্ড নয।","boards":"চট্টগ্রাম বোর্ড ২০২৫"},{"id":"ch3-mcq3","chapter":3,"num":3,"importance":2,"question":"কোনটি কযৌরগক পদাথ?","options":["বলোহো","রুপো","ব ো","সালফার"],"answerIndex":2,"explanation":"ব োয র ূল উপোিোন হোইয রোকার্বন, যো কার্বন ও হোইয রোযজন স যল জতদর। ্ন ় ব ো যক ভোেযল িুটি সভন্ ব ৌল (C ও H) পোওযো যোয, তোই এটি বযৌদগক পিোথ্ড। বলোহো, রুপো ও সালফার — দতনটি ই ব ৌল। য ত","boards":"সিলেট বোর্ড ২০২৩"},{"id":"ch3-mcq4","chapter":3,"num":4,"importance":2,"question":"2016 সাল্ পযন্ আরব্ষক ি কমাট কমৌজল্র কিটি গজব্েণাগাজর জিরর?","options":["১৪","২০","২৬","৯৮"],"answerIndex":1,"explanation":"2016 সোল পয্ আদ ষৃক ত ব ৌল 118টি। ় ় ় এর যধয 98টি প্কৃ দতযত পোওযো যোয (বস স যযর দহসো )। গজব্েণাগাজর জিরর কমৌল্ = 118-98 = 20টি পরমাণু ও অণু","boards":"বরিশাল বোর্ড ২০২২"},{"id":"ch3-mcq5","chapter":3,"num":5,"importance":2,"question":"কমৌলল্ক পদাথথর েু দ্িম করণকার নাম কী?","options":["অ্ণু","পর োণু","বপ্োটন","ইলেকট্রন"],"answerIndex":1,"explanatio ্রন = 5 + 1 = 6। 2 2 6 2 6 5 1","boards":"কুমিল্লা বোর্ড ২০২৪"},{"id":"ch4-mcq22","chapter":4,"num":22,"importance":2,"question":"X → 1s 2s 2p 3s 3p 3d 4s কমৌল্টি পর্যায় সারণির কোন গ্ুথপ অব্ভথি? র ল","options":["গ্রুপ-14","গ্রুপ-6 র র","গ্রুপ-5","গ্রুপ-1 র র"],"answerIndex":1,"explanation":"বিন্যাসটি যত ব োট ইলেকট্রন 24, তোই X হলো ব্ির োস যো (Cr)। োইযরর 4s এ 1টি এ িং আশগর 3d বত 5টি ইলেকট্রন (দনয 3)। গ্রুপ = 1 + 5 = 6 ইজল্ক ট ন রব্নযাসই পর্যায় সারণির মূ ল্ ভিততি","boards":"কুমিল্লা বোর্ড ২০২২"},{"id":"ch4-mcq23","chapter":4,"num":23,"importance":2,"question":"পর্যায় সারণির মূল্ ভিততি কী?","options":["ইলেকট্রন সংখ্যা","ইলেকট্রন বিন্যাস ি ি","পোর োণদ ক সংখ্যা","পোর োণদ ক ভরসংখ্যা"],"answerIndex":1,"explanation":"ইলেকট্রন বিন্যাস থেকে ব ৌযলর পর্যায় ও গ্রুপ দনণডয করো ি র ় ় যোয এ িং ব ৌযলর অ্যনক ধ ড যোখযো করো যোয। শুধু ইলেকট্রন সংখ্যা ো পোর োণদ ক সংখ্যা দিযয সরোসদর পর্যায়-গ্রুপ ় ় ় ব োঝো যোয নো, বিন্যাস করযত হয। তোই পর্যায় সোরদণর ূল সভতততত ইলেকট্রন বিন্যাস। য ু পর্যায় সারণির রকে ব্যরিতর্ৃ ম","boards":"যশোর বোর্ড ২০২২"},{"id":"ch4-mcq24","chapter":4,"num":24,"importance":2,"question":"কোনটি অধ্াি?","options":["হোইয র োযজন","ললদথ্যো","দজঙ্ক","সসলভোর"],"answerIndex":0,"explanation":"হোইয র োযজন একটি অ্ধোত; ললদথ্যো, দজঙ্ক ও সসলভোর ধোত। অ্ধোত হযলও ns1 বিন্যাস (1s1), H+ আযন গঠন এ িং ক্ষোর ধোতর যতো অ্িোইর্ (H O) ও হযোলোইর্ (HCl) গঠযনর কোরশণ H বক গ্রুপ- 2 1 এ রোখো হযযযে।","boards":"বরিশাল বোর্ড ২০২৪"},{"id":"ch4-mcq25","chapter":4,"num":25,"importance":2,"question":"ইলেকট্রন রব্নযাজসর রনযম অনুসাজর গ্রুপ রনণজয কোন কমৌল্টি ব্যরিতর্ ৃ ম?","options":["He","Al","K","Cu"],"answerIndex":0,"explanation":"He(2) → 1s2। সর্বশেষ s অ্রদ টোযল 2টি ইলেকট্রন, তোই ় ় দনয অ্নুসোযর গ্রুপ-2 হওযোর কথ্ো। ় ় ় দকন্ু He দনদকর য গযোস হওযোয এযক গ্রুপ-18 এ রোখো হযযযে। ি র অ্নযদিযক Al (গ্রুপ-13), K (গ্রুপ-1) ও Cu (গ্রুপ-11) এর গ্রুপ দনয র র র ় ় ব যনই দনণডয করো যোয। ﻿ ় ় য য ি কমৌজল্র পর্যায়ব্ৃ ি ধ্ম ় ্","boards":"বরিশাল বোর্ড ২০২২"},{"id":"ch4-mcq26","chapter":4,"num":26,"importance":3,"question":"নিচের কোন কমৌল্টি র আযরনকরণ শততিৃ কব্ভশ?","options":["K","Na","Ca","Mg 2 6 5"],"answerIndex":3,"explanation":"Na ও Mg পর্যায় 3 এর এ িং K ও Ca পর্যায় 4 এর ব ৌল। ় ় ি পর্যায়য ো থেকে র্োযন আযদনকরণ ততততর োযড়, গ্ুশপ উপর থেকে ি দনযচ কয। তোই Mg \u003e Na এ িং Ca \u003e K; আ োর Mg \u003e Ca (একই গ্ুশপ Mg উপযর)। ্রি : Mg \u003e Na \u003e Ca \u003e K; স যচযয ব স Mg। ় ্","boards":"যশোর বোর্ড ২০২৩; সিলেট বোর্ড ২০২০"},{"id":"ch4-mcq27","chapter":4,"num":27,"importance":3,"question":"নিচের কোন কমৌল্টি র আযরনকরণ শততিৃ কব্ভশ?","options":["Ca","K","Cl","F"],"answerIndex":3,"explanation":"F ও Cl গ্রুপ 17 এর ব ৌল; F উপযর থ্োকোয এর আকোর ় ় স যচযয বেোট। K ও Ca পর্যায় 4 এর ো দিযকর ব ৌল, এযির আকোর ড়। আকোর যত বেোট আযদনকরণ ততততর তত ব স, তোই F এর ় ় আযদনকরণ ততততর স যচযয ব স। ্ ়","boards":"দিনাজপুর বোর্ড ২০২৩; বরিশাল বোর্ড ২০২২"},{"id":"ch4-mcq28","chapter":4,"num":28,"importance":3,"question":"নিচের কোন কমৌজল্র ইজল্কট জনর আসততিৃ সব্জিজয কম?","options":["Be","Ra","Sr","Mg র"],"answerIndex":1,"explanation":"Be, Mg, Sr, Ra স োই গ্রুপ 2 এর ব ৌল। গ্ুশপ উপর থেকে র বিভব ত ি দনযচ ততততর স্তর োযড়, আকোর োযড়, ফযল ইলেকট্রন আসততততর কয। ্রি : Be \u003e Mg \u003e Sr \u003e Ra; স যচযয দনযচ থ্োকো Ra এর ইলেকট্রন ি ় আসততততর স যচযয ক। ় ়","boards":"ঢাকা বোর্ড ২০২২; বরিশাল বোর্ড ২০২১"},{"id":"ch4-mcq29","chapter":4,"num":29,"importance":3,"question":"নিচের কোন কমৌজল্র আযরনকরণ শততিৃ সব্জিজয কম?","options":["Na","Mg","F","Ar"],"answerIndex":0,"explanation":"একই পর্যায়য ো থেকে র্োযন আযদনকরণ ততততর োযড়। Na ৃ ় ় ় ় ি ততীয পর্যায়যর স যচযয োয র ব ৌল, তোই এর আযদনকরণ ততততর স যচযয ক। ় ্ ়","boards":"ঢাকা বোর্ড ২০২৬"},{"id":"ch4-mcq30","chapter":4,"num":30,"importance":2,"question":"নিচের কোন কমৌল্টি র আযরনকরণ শততিৃ সব্জিজয কব্ভশ?","options":["B","Al","O","Sc"],"answerIndex":2,"explanation":"পর্যায়য ো থেকে র্োযন আযদনকরণ ততততর োযড় এ িং গ্ুশপ ় উপর থেকে দনযচ কয। ় ় ় ় O দ তীয পর্যায়যর গ্রুপ-16 এর ব ৌল; B একই পর্যায়য O এর োয (গ্রুপ-13)। টাইপ ভিততিক মাস্ট ার সাজেশন ় ় ় Al (৩য পর্যায়) ও Sc (৪ ,"question":"P এব্ং Q দ্ারা গঠ ি ি যৌগের অণুজি ব্ন্ ধনজোড় ইলেকট্রন কিটি?","options":["1","2 ে","3","4"],"answerIndex":2,"explanation":"P এর পোর োণদ ক সংখ্যা 1, তোই P = H; Q এর পোর োণদ ক সংখ্যা 7, তোই Q = N। গঠ ি ত যৌগ NH। 3 N এর 3টি ইলেকট্রন দতনটি H এর 1টি কযর ইলেকট্র যনর সাথে থ যোবিভব ি ় ্ হযয 3টি N-H ন্িন জতদর কযর। ্ ি তোই NH অ্ণুযত ন্িনযজোড় ইলেকট্রন 3টি ( ুততর যজোড় 1টি )। 3 ি দনযচর উদ্দীপকটি পযড় প্যশল র উততবিভবোও: 1P, 7Q [P ও Q প্িীকী কমৌল্","boards":"ঢাকা বোর্ড ২০২১; চট্টগ্রাম বোর্ড ২০২১"},{"id":"ch5-mcq44","chapter":5,"num":44,"importance":3,"question":"P ও Q দ্ারা গঠ ি ি যৌগ— i. িু ই এর দনয পোলন কযর ii. স যযোজী ন্িন গঠন কযর iii. দনম্ন গলনোঙ্কদ স টট দনযচর বকোনটি সঠ ি ক?","options":["ii","i ও ii","ii ও iii","i, ii ও iii"],"answerIndex":3,"explanation":"1P = H (হোইয র োযজন) এ িং 7Q = N (নোইয্ট োযজন); গঠ ি ত ্ ি যৌগ NH (অ্যোয োদনযো)। 3 ্ ় ় i. সঠ ি ক — ন্িযনর পর H দহললযোয র যতো 2টি ইলেকট্রন পোয, তোই িু ই এর দনয পোলন কযর। ় ্ ii. সঠ ি ক — N ও H ইলেকট্রন থ যোর কযর 3টি স যযোজী ন্িন গঠন কযর। iii. সঠ ি ক — অ্ণুগুযলোর যধয আকেডণ ল িু ডল, তোই NH দনম্ন 3 গলনোঙ্কদ স টট (সোধোরণ তোপ ো্োয গযোস)। টাইপ ভিততিক মাস্ট ার সাজেশন","boards":"ঢাকা বোর্ড ২০২১; চট্টগ্রাম বোর্ড ২০২১"},{"id":"ch5-mcq45","chapter":5,"num":45,"importance":3,"question":"N অণুজি কিটি ব্ন্ ধন আজে? 2","options":["1","2","3","4"],"answerIndex":2,"explanation":"িুটি N পর োণু দতন বজোড় ো ইলেকট্রন থ যোর কযর স্- ন্িন (N≡N) গঠন কযর। আযরনক ও সমজযােী যৌগের জব্ভশটট য","boards":"ঢাকা বোর্ড ২০২৬"},{"id":"ch5-mcq46","chapter":5,"num":46,"importance":3,"question":"নিচের কোন যৌগটি পারনজি অদ্ব্ণীয?","options":["AgCl","NaCl","CaCl","KCl 2"],"answerIndex":0,"explanation":"সোধোরণত আযদনক যৌগ পোদনযত দ্রবণীয; NaCl, CaCl, ূ ় KCl সহযজই পোদনযত দ্ ীভত হয। দকন্ু সসলভোর ব্োরোইর্ (AgCl) আযদনক যৌগ হযলও এর আযনগুযলোর ধযকোর আকেডণ ল পোদনর অ্ণুর আকেডশণর বচযয ব স, তোই AgCl পোদনযত অ্দ্রবণীয।","boards":"যশোর বোর্ড ২০২২;ঢাকা বোর্ড ২০২১; চট্টগ্রাম বোর্ড ২০২১"},{"id":"ch5-mcq47","chapter":5,"num":47,"importance":3,"question":"কোনটি র েল্ীয দ্ব 9-mcq10","chapter":9,"num":10,"importance":2,"question":"উপজরর রব্ভতর্ৃ যাটি জি— i. জোরণ-দ জোরণ ঘযট ii. অ্ধিঃশক্ষপণ ঘযট ্ন iii. উৎপন্ন লবণটি CCl -এ অ্দ্রবণীয 4 দনযচর বকোনটি সঠ ি ক?","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":2,"explanation":"FeCl3 + 3NaOH → Fe(OH)3↓ + 3NaCl i. ভল — Fe এর জোরণ সংখ্যা উভয পোশ +3; বকোযনো ব ৌযলর জোরণ ় ় সংখ্যা িলোযদন, তোই জোরণ-দ জোরণ নয। টাইপ ভিতত ﻿ ় ় ii. সঠ ি ক — অ্দ্রবণীয Fe(OH) অ্ধিঃশক্ষপ দহযসয জ ো হয। র 3 ন ় iii. সঠ ি ক — উৎপন্ন লবণ NaCl আযদনক যৌগ, তোই জজ দ্ো ক CCl এ অ্দ্রবণীয। 4 র গা ় এসিড ও গা ় োজরর েযকারী ধ্ম","boards":"যশোর বোর্ড ২০২৫"},{"id":"ch9-mcq11","chapter":9,"num":11,"importance":2,"question":"গা ় নাইটি ক এভসজডর কব্ািজল্র– ় ় ় i. ু খ থখোলো হযল হলুি কু যো োর ত বধ োযো ব র হয ্ ় ় ii. ু খ খু লযল তী র ঝ োজোযলো গন্ি পোওযো যোয iii. ণড োিোস হয দনযচর বকোনটি সঠ ি ক?","options":["i ও ii","ii ও iii","i ও iii","i, ii ও iii"],"answerIndex":3,"explanation":"i. সঠ ি ক — ব োতযলর ুখ খুলযল HNO এর োষপ োতোযসর 3 ় ় ় ় জলীয োশষপর সাথে স শ হলুিোভ কু যো োর যতো বধ োযো বিয। ় ় ii. সঠ ি ক — HNO োশষপর তী র ঝ োজোযলো গন্ি পোওযো যোয। 3 র ় ় ় iii. সঠ ি ক — আযলোযত HNO দ যযোদজত হযয NO বিয যল এযক 3 2 োিোস শণডর ব োতযল রোখো হয। আযলো 4HNO ⟶ 4NO +O +2H O 3 2 2 2 pH এর ধ্ারণা","boards":"ঢাকা বোর্ড ২০২৫"},{"id":"ch9-mcq12","chapter":9,"num":12,"importance":3,"question":"কোনটি অরধ্ক োরীয?","options":["রততর","ূ ্","অ্গন ল যো য রস","ৃ টটি র পোদন"],"answerIndex":2,"explanation":"pH যত ব স, দ্রবণ তত ব স ক্ষোরীয। ি ় ় ় রততর 7.43 – 7.45, ূ্ 6, ৃটটি র পোদন প্োয 5.6 (অ্ম্ল ীয), অ্গন ল যো য রস 8.1। ় ় ় অ্গন ল যো য রযসর pH স যচযয ব স, তোই এটি অ্দধক ক্ষোরীয।","boards":"যশোর বোর্ড ২০২৫; বরিশাল বোর্ড ২০২৫; কুমিল্লা বোর্ড ২০২৪"},{"id":"ch9-mcq13","chapter":9,"num":13,"importance":3,"question":"কোনটি মানুজের তজকর pH মান?","options":["4.8 – 5.5","7.43 – 7.45","6.0 – 8.1","1.0 – 7.0"],"answerIndex":0,"explanation":"োনু যের তযকর pH 4.8 – 5.5। 7.43 – 7.45 হলো রযততরর pH। তোই সঠ ি ক উততর 4.8 – 5.5।","boards":"রাজশাহী বোর্ড ২০২৪;ময়মনসিংহ বোর্ড ২০২০"},{"id":"ch9-mcq14","chapter":9,"num":14,"importance":3,"question":"রব্শুদ্ধ পারনর pH কি?","options":["4","7","10","14"],"answerIndex":1,"explanation":"দ শু ি পোদনযত [H+] = 10 mol/L। pH = -log(10−7) = 7 তোই দ শু ি পোদন দনরশপক্ষ, এর pH 7। িক মাস্ট ার সাজেশন +","boards":"কুমিল্লা বোর্ড ২০২৫"},{"id":"ch9-mcq15","chapter":9,"num":15,"importance":2,"question":"রব্শুদ্ধ পারনজি এসিড কযাথগর কারথণ যরদ H আযন 100 ় ্ গুণ কব্জড় যায, িজব্ উিৃ দ্রবণের pH কি হজব্?","options":["3","4","5","6"],"answerIndex":2,"explanation":"দ শু ি পোদনযত [H ] = 10 M (pH = 7)। + + −7 −5 H আযন 100 গুণ োড় যল [H ] = 100×10 =10 M। + −5 pH = -log[H ] = −log(10 ) = 5।","boards":"দিনাজপুর বোর্ড ২০২৫"},{"id":"ch9-mcq16","chapter":9,"num":16,"importance":2,"question":"কোনটি র pH সব্জিজয কম?","options":["োনুযের তক","অ্গন ল যো য রস","ূ ্","রততর"],"answerIndex":0,"explanation":"পোঠয ই অ্নুযোযী োনুযের তযকর pH 4.8-5.5, ূতর্র pH 6, ি ় রযততর র pH 7.43-7.45 এ িং অ্গন ল যো য রযসর pH 8.1। প্িততগুযলোর যধয োনুযের তযকর pH স যচযয ক। র ব","boards":"চট্টগ্রাম বোর্ড ২০২৫"},{"id":"ch9-mcq17","chapter":9,"num":17,"importance":2,"question":"মাটি র pH এর মান ব্ৃছদ্ধ করজি কোন পদাথটি ব্যব্হার করা হয? ় ়","options":["অ্যোয োদনযো সোলযফট","যোগযনসসযো ফসযফট ় ়","কযোলসসযো অ্িোইর্","ইউদরযো"],"answerIndex":2,"explanation":"োটি র pH কয থগযল ( োটি অ্ম্ল ীয হযল) pH োড় োযত পদর োণ যতো চন (CaO) য হোর করো হয। CaO+H O→Ca(OH) 2 2 ্ন ় উৎপন্ন ক্ষোর োটি র এসিডযক প্ স ত কযর pH োড় োয। অ্যোয োদনযো ় ় সোলযফট ও অ্যোয োদনযো ফসযফট সোর োটি র pH ক োয।","boards":"চট্টগ্রাম বোর্ড ২০২৫"},{"id":"ch9-mcq18","chapter":9,"num":18,"importance":2,"question":"মাটি র pH এর মান কি এর মজধ্য হজল্ সব্জিজয িাজল্া?","options":["3.0 – 5.0","5.0 – 7.0","6.0 – 8.0","7.0 – 10"],"answerIndex":2,"explanation":"উলভর পুটটি র জনয োটি থেকে দ সভন্ আযন ও পোদন থ োেণ কযর। এর জনয োটি র pH 6.0 থেকে 8.0 এর যধয হযল স যচযয ভোযলো। োটি র pH 3.0 এর ক ো 10 এর ব স হযল োটি র উপকোরী অ্ণুজী োরো যোয।","boards":"ময়মনসিংহ বোর্ড ২০২৫"},{"id":"ch9-mcq19","chapter":9,"num":19,"importance":2,"question":"মূতরতরর pH কি?","options":["1","4.8","6","8.1"],"answerIndex":2,"explanation":"রীযরর দ সভন্ অ্যঙ্গর pH: পোকথলী 1, তক 4.8 – 5.5, ূ্ ি ব 6, অ্গন ল যো য রস 8.1। সু তরোিং ূ তর্র pH 6 ( ৃ িু অ্ম্ল ীয)। টাইপ ভিত ﻿ ় ় ়","boards":"ঢাকা বোর্ড ২০২৪"},{"id":"ch9-mcq20","chapter":9,"num":20,"importance":2,"question":"কোনটি র প্জযাথগ মাটি র অিযরধ্ক ক্ষারকত রনযছন্ি হয? র ব","options":["NH OH","NaHCO 4 3","Ca(OH)","(NH ) SO 2 4 2 4"],"answerIndex":3,"explanation":"োটি অ্দতদরততর ক্ষোরীয হযল অ্ম্ল ধ ী লবণ বযোগ কযর pH ক োযত হয। (NH ) SO স ল এসিড (H SO ) ও িু ডল ক্ষোরক (NH OH) 4 2 4 2 4 4 থেকে জতদর অ্ম্ল ধ ী লবণ, তোই এটি োটি র ক্ষোরকত প্ স ত কযর। ব র NH OH, NaHCO ও Ca(OH) ক্ষোরধ ী, এগুযলো দিযল ক্ষোরকত 4 3 2 ব আরও োড় য। প্শমন রব্ভতর্ ৃ যা","boards":"দিনাজপুর বোর্ড ২০২৪"},{"id":"ch9-mcq21","chapter":9,"num":21,"importance":2,"question":"এনট ্াভসজড কোন যৌগটি থাজক? ্ ল","options":["Mg(OH)","Ca(OH) 2 2","NaOH","KOH"],"answerIndex":0,"explanation":"এনট োসসযর্ ক্ষোরজোতীয Al(OH) ও Mg(OH) থাকে, যো ্ 3 2 পোকথলীর অ্দতদরততর HCl বক প্ স ত কযর। Mg(OH) +2HCl→MgCl +2H O 2 2 2 Ca(OH), NaOH, KOH এনট োসসযর্র উপোিোন নয; NaOH ও KOH 2 ্ তী র ক্ষোর, রীযরর জনয ক্ষদতকর। ি ়","boards":"কুমিল্লা বোর্ড ২০২৫"},{"id":"ch9-mcq22","chapter":9,"num":22,"importance":2,"question":"কোনটি অনীয মূল্ক?","options":["OH− 2+","Fe 3− 2− ়","O","PO 4 3−"],"answerIndex":3,"explanation":"ল শণর বয ঋণোতমক আযনটি এসিড থেকে আযস তোযক অ্ম্ল ীয ূ লক যল। H3PO4(aq) → 3H+(aq)+PO 3−(aq) 4 3− 2+ ় ় ় তোই PO অ্ম্ল ীয ূ লক। Fe ধনোতমক আযন (ক্ষোরীয ূলক); 4 − 2− OH ও O এসিড থেকে আযস নো।","boards":"সিলেট বোর্ড ২০২৫"},{"id":"ch9-mcq23","chapter":9,"num":23,"importance":2,"question":"কোনটি থপজট এভসততডটি র সমসযা দর কজর?","options":["Ca(OH) ও Al(OH)","Ca(OH) ও Mg(OH) 2 3 2 2","Mg(OH)2 ও Al(OH)3","Mg(OH)2 ও NaOH"],"answerIndex":2,"explanation":"থপযট এসসততর্টি হয পোকথলীযত অ্দতদরততর HCl এর কোরশণ। এনট োসসযর্র Mg(OH) ও Al(OH) এই অ্দতদরততর HCl প্ স ত কযর ্ 2 3 র এসসততর্টি ির কযর। Al(OH) +3HCl →AlCl +3H O 3 3 2 তিক মাস্ট ার সাজেশন এসিড ব্ৃ টটি","boards":"ঢাকা বোর্ড ২০২৪"},{"id":"ch9-mcq24","chapter":9,"num":24,"importance":2,"question":"ব্জ্রপাজির কারথণ ব্ৃটিটর পারনজি কোন এসিডটি র আরধ্কয সৃ টটি হয?","options":["H CO","HNO 2 3 3","H PO","H SO 3 4 2 4"],"answerIndex":1,"explanation":"জ্রপোযতর স য োয়ুর তোপ ো্ো প্োয 3000°C হয, তখন N ও O দ স্ির যো কযর NO জতদর কযর। 2 ় ় ূ NO জোদরত হযয NO হয এ িং ৃটটি র পোদনযত দ্ ীভত হযয HNO 2 র বিয: 2NO +H O→HNO +HNO। 2 2 2 3 তোই জ্রপোযতর ফযল ৃটটি র পোদনযত নোইটি্ক এসসযর্র আদধকয হয।","boards":"যশোর বোর্ড ২০২৫"},{"id":"ch9-mcq25","chapter":9,"num":25,"importance":2,"question":"ব্ৃ টটি র পারনর pH কি?","options":["4.8–5.5","5.5–6.0","6.0–8.0","7.4–7.5"],"answerIndex":1,"explanation":"োয়ু র CO ও নোইয্ট োযজযনর অ্িোইর্ দ্ ীভত থ্োকোয 2 ি র সর োভোদ ক ৃটটি র পোদন সো োনয অ্ম্ল ীয। এর pH 5 থেকে 6 এর যধয থাকে; অ্প নগুযলোর যধয 5.5–6.0 এই সী োর যধয পযড়। pH 4 ো তোর ক হযল তো এসিড ৃটটি। দনযচর উদ্দীপকটি পযড় প্যশল র উততবিভবোও: S + O →A; A +O → B 2 2","boards":"সিলেট বোর্ড ২০২৫"},{"id":"ch9-mcq26","chapter":9,"num":26,"importance":2,"question":"উদ্দীপজকর B যৌগটি র— ় ী i. জলীয দ্রবণ অ্ম্ল ধ ী ii. বকন্ দীয পর োণুর জোরণ সংখ্যা +4 iii. থক্ষতর্ অ্টট ক দনযয র যদতরি ঘযট দনযচর বকোনটি সঠ ি ক?","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":1,"explanation":"S + O → SO (A); 2SO +O → 2SO (B)। সুতরোিং B = 2 2 2 2 3 SO। 3 i. সঠ ি ক — SO + H O → H SO, তোই জলীয দ্রবণ অ্ম্ল ধ ী। 3 2 2 4 র ii. ভল — SO এ S এর জোরণ সংখ্যা x + 3(-2) = 0, x = +6। 3 iii. সঠ ি ক — SO এ S এর বযোজযতোস্তযর 12টি ইলেকট্রন থাকে, তোই 3 ি অ্টট ক দনযয র যদতরি। পারন","boards":"চট্টগ্রাম বোর্ড ২০২৫"},{"id":"ch9-mcq27","chapter":9,"num":27,"importance":3,"question":"নিচের কোন যৌগটি র কারথণ পারনর থাযী খরিা সৃটটি হয?","options":["MgSO","K SO 4 2 4","Na SO","ZnSO 2 4 4"],"answerIndex":0,"explanation":"Ca, Mg, Fe এর ব্োরোইর্ ো সোলযফট লবণ পোদনযত ূ ় ় রদ্ ীভত থ্োকযল থোযী খরতো হয। ় ় MgSO যোগযনসসযোয র সোলযফট, তোই থোযী খরতো সৃটটি কযর। 4 ি K SO ও Na SO খরতো সৃটটি কযর নো (Na, K এর লবণ); ZnSO 2 4 2 4 ় ় খরতোর জনয িোযী লবণ a","Pb","Cu"],"answerIndex":1,"explanation":"সস্ির যতো সসদরযজর উপযরর দিযকর ব স সস্িরয ধোত (K, Na, ় ় Ca, Mg, Al) কার্বন দিযয দ জোদরত হয নো, তোই এযির গললত যৌগের তততড় ৎ দ যশল েশণ দ জোরণ ঘটোযনো হয। Zn ও Pb কার্বন দ জোরশণ এ িং Cu সরদ জোরশণ দনষক োস ত হয। তোই উততর খ) Ca।","boards":"ময়মনসিংহ বোর্ড ২০২৫"},{"id":"ch10-mcq10","chapter":10,"num":10,"importance":2,"question":"কসাততডযাম ক্ারাইড 40-42% এব্ং কযাল্ভসযাম ক্ারাইড 58-60% ভমরথণর গল্নাঙ্ক কি?","options":["801° C","600°C","400°C","363°C"],"answerIndex":1,"explanation":"দ শু ি NaCl এর গলনোঙ্ক 801°C, এত উচ্চ তোপ ো্োয গলোযত খরচ ব স। তোই 40-42% NaCl এর সাথে 58-60% CaCl2 স স যয বনওযো হয; এ ় ় স শ্শণর গলনোঙ্ক কয প্োয 600°C হয, ফযল ক খরযচ তততড় ৎ র র ় ্ ় দ যশল েশণ বসোততর্যো দনষক ো ন করো যোয। উততর খ) 600°C। দনযচর উদ্দীপকটি পযড় প্যশল র উততবিভবোও: একটি সংকর ধ্াি অল্ংকার, কল্কব্জার রব্যাররং, জব্দযরিক সুইি, দরোর হারল্, কডকচি পারিল্ ইিযারদ জিররজি ব্যব্হার করা হয।","boards":"ঢাকা বোর্ড ২০২৫"},{"id":"ch10-mcq11","chapter":10,"num":11,"importance":2,"question":"উদ্দীপজকর সংকর ধ্াির প্রধান উপাদান রনষক াশজনর সময উপোি গ্যাস কোনটি?","options":["CO","SO 2 2","NO","Cl 2 2"],"answerIndex":1,"explanation":"উদ্দীপযকর সিংকর ধোত সপতল, এর প্ধোন উপোিোন কপোর ় ু (65%)। কপোর ক সস্িরয ধোত যল চোলযকোসোইট (Cu2S) থেকে ্ ় সর দ জোরণ প িদতযত দনষক োস ত হয। তোপ 2Cu S+3O ⟶ 2Cu O+2SO 2 2 2 তোপ 2Cu O+Cu S ⟶ 6Cu+SO 2 2 ় ় উভয ধোশপ উপজোত দহযসয SO গযোস জতদর হয। তোই উততর খ) 2 SO। 2","boards":"ময়মনসিংহ বোর্ড ২০২৫"},{"id":"ch10-mcq12","chapter":10,"num":12,"importance":2,"question":"িাল্জকাসাইট কোন ধ্াির আকররক?","options":["কযোলসসযো","কপোর","আযরন","দজিংক"],"answerIndex":1,"explanation":"চোলযকোসোইট (Cu2S) কপোর ধোতর আকদরক। ় ু কযোলসসযোয র আকদরক চনোপোথ্র (CaCO ), আযরযনর 3 বহ োটোইট/ যোগযনটোইট, দজিংযকর কযোলো োইন (ZnCO )। ﻿","boards":"ঢাকা বোর্ড ২০২৫"},{"id":"ch10-mcq13","chapter":10,"num":13,"importance":2,"question":"কোনটি কল্াহার আকররক? ্ন","options":["বহ োটোইট","সসন্ো োর","কযোলো োইন","চোলযকোসোইট"],"answerIndex":0,"explanation":"বহ োটোইট (Fe O ) বলোহোর প্ধোন আক ম কী?","options":["ক োসো","সপতল","স্ ি ল","র্রোলুস ন"],"answerIndex":1,"explanation":"অ্লিংকোর, কলকব্জোর দ যোদরিং, জ িুযদতক সুইচ, িরজোর হোতল, বর্কচচ পোদতল ইতযোদি জতদরযত সপতল ( রোস) য হরত হয। সপতযল কপোর 65% ও দজিংক 35% থাকে। ় ় ক োসো দিযয থ্োলো, গল োস; স্ ি ল দিযয বরললোইন, েদর; র্রোলস ন উযড় োজোহোযজর ততর্ জতদর হয। তোই উততর খ) ভপিল্।","boards":"ময়মনসিংহ বোর্ড ২০২৫"},{"id":"ch10-mcq19","chapter":10,"num":19,"importance":2,"question":"কোনটি দ্ারা জব্দযরিক িার জিরর করা হয?","options":["Na","Cu","Mg","Ca"],"answerIndex":1,"explanation":"কপোর (Cu) দ িুযযতর অ্তযন্ ভোযলো পদর োহী, ন নীয ও প্সোরণ ীল — সহযজ সরু তোযর পদরণত করো যোয। ় ় তোই জ িুযদতক তোর কপোর দিযয জতদর হয। Na ও Ca পোদনর সাথে তী রভোয দ স্ির যো কযর, আর Mg তোযরর জনয উপযযোগী নয।","boards":"বরিশাল বোর্ড ২০২৫"},{"id":"ch10-mcq20","chapter":10,"num":20,"importance":2,"question":"মররিাহীন ই্পাজি বতর্ৃ াভমযাজমর শতকরা পরিমাণ কি?","options":["8%","8.33%","18%","74%"],"answerIndex":2,"explanation":"দরচোহীন ইসপোত (ব্ ট ইনযলস স্ ি ল) এর উপোিোন: বলোহো 74%, ব্ির োস যো 18%, দনযকল 8%। তোই এযত ব্িরোস যোয র তকরো পদর োণ 18%। ব্িরোস যো ই ইসপোতযক দরচো থেকে রক্ষো কযর।","boards":"বরিশাল বোর্ড ২০২৪"},{"id":"ch10-mcq21","chapter":10,"num":21,"importance":2,"question":"ভপিজল্ কপাজরর সংযুততিৃ কি?","options":["35%","65%","74%","90%"],"answerIndex":1,"explanation":"সপতল ( রোস) কপোর ও দজিংযকর সিংকর ধোত। এযত কপোর 65% ও দজিংক 35% থাকে; কপোর প্ধোন ধোত, তোই সপতল কপোযরর সিংকর ধোত। য য","boards":"ঢাকা বোর্ড ২০২৪"},{"id":"ch10-mcq22","chapter":10,"num":22,"importance":2,"question":"21 কযাজরট ্ৃথণ কি িাগ ্ৃণ থাজক?","options":["83.33%","87.5%","91.67%","95.13%"],"answerIndex":1,"explanation":"সর শণডর তকরো পদর োণ = (কযোযরট ÷ 24) × 100% 21 কযোযরট সরশণড সর ণড = (21 ÷ 24) × 100% = 87.5%; োদক 12.5% কপোর ও অ্নযোনয ধোত। ﻿ ় ় ় ু ু করিপয ধ্াি এব্ং সংকর ধ্াির েয হওযার ল্েণ, ু কারণ ও প্রিকার","boards":"ময়মনসিংহ বোর্ড ২০২৪"},{"id":"ch10-mcq23","chapter":10,"num":23,"importance":2,"question":"কোনটি দ্ারা গযাল্িানাইরেং করা হয?","options":["Cu","Zn","Hg","Ag"],"answerIndex":1,"explanation":"বকোযনো ধোতর (সোধোরণত বলোহোর) উপর দজিংক (Zn) এর প্যলপ বিওযোযক গযোলভোনোইদজিং যল। ় ় এযত তততড় ৎ দ যশল েশণর প্যযোজন হয নো। Cu, Ag ইতযোদির প্যলপ ্ র র ় ় বিওযো হয ইযলকয্ট োযপ্ টি িং প িদতযত। ু দিযয","boards":"দিনাজপুর বোর্ড ২০২৫"},{"id":"ch10-mcq24","chapter":10,"num":24,"importance":2,"question":"মররিার সংকেত কোনটি?","options":["Fe O.nH O","Fe O .H O 2 2 2 3 2","Fe O .nH O","FeO .nH O 2 3 2 3 2"],"answerIndex":2,"explanation":"বলোহো োয়ুর O ও পোদনর সাথে দ স্ির যো কযর আদ্ড বফদরক 2 র অ্িোইর্ জতদর কযর, এটি ই দরচো। 4Fe+3O +6H O→4Fe(OH) ় 2 2 3 2Fe(OH) →Fe O .3H O 3 2 3 2 পোদনর অ্ণুর সংখ্যা দনদভরটডট নয যল দরচোর সিংযকত Fe O .nH O 2 3 2 বলখো হয।","boards":"ঢাকা বোর্ড ২০২০"},{"id":"ch10-mcq25","chapter":10,"num":25,"importance":2,"question":"ইউজরাথপ ব্যব্হৃি অযাল্ুভমরনযাজমর শতকরা কি িাগ পু নঃপ্ভতর্ ৃ যাোিকৃ ি?","options":["21%","28%","60%","74%"],"answerIndex":2,"explanation":"ইউযরোশপ বয অ্যোলুস দনযো য হরত হয তোর 60% ় ় পু নিঃপ্স্ি র যোজোতকরশণর োধযয জতদর হয। ় ় ় আর আয দরকোয য হরত কপোযরর প্োয 21% পুনিঃপ্স্িরযোজোত। র র খনিজ অধ্াি","boards":"রাজশাহী বোর্ড ২০২০"},{"id":"ch10-mcq26","chapter":10,"num":26,"importance":3,"question":"অলল্যাজমর সংকেত কোনটি?","options":["Na AlF","H S O 3 6 2 2 7","Ca(OCl)Cl","CaCO 3"],"answerIndex":1,"explanation":"ধূ োয োন সোলসফউদরক এসিডযক অ্ললযো যল, এর সিংযকত H S O। 2 2 7 সপ ড প িদতযত SO বক গো ় H SO এ থ োেণ করোযল অ্ললযো জতদর 3 2 4 হয: H SO +SO →H S O। 2 4 3 2 2 7 Na AlF ্িরোযযোলোইট, Ca(OCl)Cl দ রচচিং পোউর্োর, CaCO 3 6 ল 3 চনোপোথ্র। টাইপ ভিততিক মাস্ট ার সাজেশন","boards":"কুমিল্লা বোর্ড ২০২৪; চট্টগ্রাম বোর্ড ২০২৪"},{"id":"ch10-mcq27","chapter":10,"num":27,"importance":2,"question":"'সুপার ছহজটড ওযাটার' এর সজব্াচ্ি িাপমাতরা কি?","options":["100°C","270°C","340°C","374°C"],"answerIndex":3,"explanation":"অ্দতদরততর চোশপ 100°C থেকে 374°C তোপ ো্োর ধয তী পোদনযক সুপোর দহযটর্ ওযোটোর যল। তোই সুপোর দহযটর্ ওযোটোযরর সয ডোচ্চ তোপ ো্ো 374°C।","boards":"রাজশাহী বোর্ড ২০২৫"},{"id":"ch10-mcq28","chapter":10,"num":28,"importance":2,"ques  জন্য আর্িা িসােনেি উপর রেিড িশীল।","boards":"চট্টগ্রাম বোর্ড ২০২৩"},{"id":"ch1-sq8","chapter":1,"num":8,"importance":2,"question":"এনট ্াভসড োিীয পদাে পাকস্েীর এভসততডটি কীরূথপ রনযন্তণ কজর? ব্যাখ্যা কর।","answer":"পাকথলীনত হাইন বান্ারিক এসিড (HCl) বেশি ততরি হলে ি ্ ল ় ় ্ ত ় থপনট জ্ালার্পাড় বা ও অস্ব লত হয়, এনক এমসপ্র্টি বলে। এনট ামসনর্ Al(OH) ও Mg(OH) ৈাতীে ক্ষারক থাকে, ো ড 3 2 অরতরিকব HCl বক প্শমর্ত করে লবণ ও পানিনত পরিণত করে। িনল এমসপ্র্টি কনর্ যায়। Al(OH) +3HCl →AlCl +3H O 3 3 2 Mg(OH) +2HCl→MgCl +2H O 2 2 2","boards":"রাজশাহী বোর্ড ২০২২"},{"id":"ch1-sq9","chapter":1,"num":9,"importance":2,"question":"ফসে উৎপাদজন রাসায়নিক সাজরর প্রবণতাব ব্যাখ্যা কর। ় ় ়","answer":"রাসায়নিক সাি মাটি নত উলিনদি প্নোৈেীে পুটটি উপাদান (N, P, K ইতযারদ) সি িাহ করে ৈমর্ি উ ডিতা ও িসনলি উৎপাদে াড় াে। ় ় যেমন— ইউরিয়া সাি মাটি নত ইউরিনেৈ এেৈাইনর্ি উপমথরতনত ় ় ় পানির সাথে বিক্রিয়া করে অ্যামোনিয়ার্ আয়ন (NH +) ততরি করে, 4 ো উলিদ র্ূনলি মাধ্যমে থশাষণ করে নাইট্রোজেন পায়। ইউরিনেৈ CO(NH ) +2H O ⟶ (NH ) CO 2 2 2 4 2 3 ী ী ্ মাটি ি অম্ল ত াড় বলে ক্ষারধর্মী সাি এবং ক্ষারকত াড় বলে অম্ল ধর্ী সাি ব ব ব্যবহার করে মাটি ি pH ঠ ি ক িাখা হয়। টাইপ ভিততিক মাস্ট ার সাজেশন ্ ্ রসাযজন অনুসন্ ধান বা গজবষণা প্ভতর্ব যা","boards":"যশোর বোর্ড ২০২২"},{"id":"ch1-sq10","chapter":1,"num":10,"importance":3,"question":"গজবষণা কী?","answer":"সঠ ি ক পদধরতনত পিীক্ষা-রেিীক্ষার মাধ্যমে অৈাো কোনো রকছ ৈাোি বচটট ানক গন ষণা বলে। রেরে গন ষণা করেে রতরে র জ্ঞােী। রসায়ন পরীোগার বযবহাজর ও পরীোগাজর বযবহবি রবভিন্ন রাসায়নিক দ্বয বযবহাজর সিকরা গ্রহণ","boards":"ময়মনসিংহ বোর্ড ২০২৫; চট্টগ্রাম বোর্ড ২০২৪"},{"id":"ch2-sq1","chapter":2,"num":1,"importance":3,"question":"কণার গরভরতত কী? ব্যাখ্যা কর।","answer":"আন্ঃকণা আকর্ষণ শক্তি এবং কণাগুনলাি গরতশক্তি দিয়ে পদার্থডি কঠ ি ে, তিল ও গ্যাসীে অবস্থা ব্যাখ্যা করাি তততনক কণাি গরতততত বলে। কঠ ি নে আন্ঃকণা আকর্ষণ খু বেশি, কণাগুনলা খু কাছাকাছছ থাকে এবং অবস্থাে দলানত পানি ো। তাপ রদনল আকর্ষণ কনর্ ও ু ্ কণাগুনলা রকছটা গরতশক্তি পায় — তিল অবস্থা। আিও তাপ রদনল ﻿","boards":"যশোর বোর্ড ২০২৫; ময়মনসিংহ বোর্ড ২০২৩"},{"id":"ch2-sq2","chapter":2,"num":2,"importance":2,"question":"কঠ ি ন পদাথের বযাপন হার কম কেন? ব্যাখ্যা কর। ় ় ়","answer":"কঠ ি ে, তিল ও াে ীে মাধ্যমে কোনো পদার্থডি কণাসর্ূনহি ্ ় ় স্ব তঃস্ফতড ও সমানিান ছপ্ড় নে পড়াি প্মে্ ব োনক ব্যাপন বলে। যেমন: ূ র পানিনত KMnO দাো রদনল থগালামপ িং পুনিা পানিনত ছপ্ড় নে পনড়। 4 ্ ত কঠ ি ে পদার্থডি কণাগুনলা শক্তি শালী আন্ঃআণর ক আকর্ষণ বলে ্ ্ রেরদিটড ট অবস্থানে আ দধ থাকে এবং এদের গরতশক্তি খু কম। তাই টাইপ ভিততিক মাস্ট ার সাজেশন ্ ় ় কণাগুনলা সহজে র্ুকব হয়ে ছপ্ড় নে পড় নত পানি ো; িনল কঠ ি ে পদার্থডি ব্যাপন হার কম। ্ ়","boards":"সিলেট বোর্ড ২০২৫"},{"id":"ch2-sq3","chapter":2,"num":3,"importance":2,"question":"বযাপন একটি সবিঃসফি প্ভতর্ব যা–ব্যাখ্যা কর।","answer":"যাপনে কণাগুনলা উচ্চ ঘেমানাি থাে থেকে রেম্ন ঘেমানাি ্ ় থানেি রদনক কোনো াছহযক ল বা শক্তি প্নোগ ছাড় াই রেনৈ রেনৈ ছপ্ড় নে পনড় এবং পু নিা মাধ্যমে ঘেমানা সমান ো হওো পে্ চলনত থাকে। যেমন: ঘনভর এক বকার্ণ সুগছন্ধি মশমশি র্ুখ খুনল িাখনল রকছক্ষর্ণি ় মধ্যে সািা ঘনি রেনৈ রেনৈই সুগন্ধ ছপ্ড় নে পনড়। তাই ব্যাপন একটি ্ ় স্ব তঃস্ফতড প্মে্ ব ো। ূ র রনঃসরণ","boards":"বরিশাল ূ র বোর্ড ২০২৪"},{"id":"ch2-sq4","chapter":2,"num":4,"importance":3,"question":"বততড ক্ষসপ্ বযবহাজরর সময বযাপন এবং রনঃসরথণর মজধ্য কোনটি আথগ ঘজট?","answer":"প্র্ থস্প্নত আগে নিঃসরণ ঘনট, পরে ব্যাপন ঘনট। থস্প্ করাি সময় চার্পি িনল গ্যাসের কণাগুনলা সিু ছছদ্পথ দিয়ে পািস্পরিক সংঘষড ছাড় াই এনক এনক ব ি হয়ে আনস — এটি নিঃসরণ। ় ্ ্ এরপি ব ি হয়ে আসা সুগছন্ধ অণুগুনলা াতানস স্বতঃস্ফতড িান চািরদনক ছপ্ড় নে পনড় — এটি ব্যাপন। তাই প্র্ থস্প্নত আগে নিঃসরণ, পরে ব্যাপন। ন ়","boards":"ময়মনসিংহ বোর্ড ২০২৫; সিলেট বোর্ড ২০২৩"},{"id":"ch2-sq5","chapter":2,"num":5,"importance":2,"question":"রনঃসরণ ও বযাপন দটি ভিন্ন প্ভতর্ব যা কেন?","answer":"রেঃসির্ণ গ্যাসের কণা সিু ছছদ্পথ দিয়ে পািস্পরিক সংঘষড ছাড় াই এনক এনক াইনি ব ি হে; এর জন্য ছছদ্ আ শযক এবং এটি কেবল গযানস ঘনট। ় ় অপিরদনক যাপনে কঠ ি ে, তিল বা াে ীে মাধ্যমে কোনো পদার্থডি কণা অরধক ঘেমানা থেকে কম ঘেমানাি রদনক স্বতঃস্ফতড ও ় ় সমানিান ছপ্ড় নে পনড়; এনত কোনো ছছতরদ্ি প্নোৈে হয় ো। র র ় প্মে্ ব োি ধিে, শতড ও র্াধযর্ ভিন্ন বলে নিঃসরণ ও ব্যাপন দুটি ভিন্ন প্মে্ ব ো। কমামবারির প্জ্েন এবং কমাজমর রিন অবস্থা র ব","boards":"ঢাকা বোর্ড ু র ২০২৩"},{"id":"ch2-sq6","chapter":2,"num":6,"importance":3,"question":"কমাজমর দহজন কী ধ্রজনর পরিবর্তন ঘজট? ব্যাখ্যা কর।","answer":"বর্ানর্ি দহয়ে রাসায়নিক পরি তড ে ঘনট। বর্ার্ হাইন হাইরোকার্বনেি ় ় মর্শ্ণ; সু তাি র্াথাে বাষ্পীে বর্ার্ াতানসি অক্সিজেনের সাথে ় র মে্ ব ো করে েতে পদাথড CO ও জলীয় বাষ্প এবং আনলা ও তাপ 2 উৎপন্ন করে। দহয় বর্ার্ + O ⟶CO +H O+তাপ+আনলা 2 2 2 ় ় উৎপন্ন পদাথড থেকে বর্ার্ আি মিনি পাওয়া যায় ো, তাই এটি রাসায়নিক পরি তড ে। ﻿","boards":"ঢাকা বোর্ড ২০২৪;বরিশাল বোর্ড ২০২২"},{"id":"ch2-sq7","chapter":2,"num":7,"importance":2,"question":"কমাজমর গেন কোন ধ্রজনর পরিবর্তন? ব্যাখ্যা কর।","answer":"বর্ানর্ি গলে একটি বিৌত পরি তড ে। তাপ রদনল বর্ানর্ি ় ় হাইন ব াকার্বন অণুগুনলা কঠ ি ে থেকে তিল অবস্থাে পরিণত হয়, কিন্তু ্ ি কোনো েতে পদাথড ততরি হয় ো। ড ় ় তিল বর্ার্ ঠান্া করলে আ াি কঠ ি ে বর্ার্ মিনি পাওয়া যায় এবং এর রাসায়নিক সংেুরত অপরি রতিতড থাকে। তাই বর্ানর্ি গলে বিৌত ় ত পরি তড ে। গেন ও সফটন","boards":"সিলেট বোর্ড ২০২৪"},{"id":"ch2-sq8","chapter":2,"num":8,"importance":2,"question":"পারনর গেনাংক ও সফটনাঙ্ক ভিন্ন কেন?","answer":"1 atm চার্প ভর 0°C এ গনল পানি হয়, তাই পানির গলোঙ্ক ় ় 0°C; আি পানি 100°C এ িু নট জলীয় বাষ্প হয়, তাই স্ফটোঙ্ক 100°C। ভর গলানত পানির অণুগুনলাি আকর্ষণ রকছটা কমানলই চনল, কিন্ত ্ ় বাষ্প হনত অণুগুনলানক আকর্ষণ সম্পূর্ণ কাটিনে র্ুকব হনত হয়, োি জন্য বেশি গরতশক্তি ও বেশি তাপ লার্গ। তাই পানির গলোঙ্ক ও স্ফটোঙ্ক ভিন্ন। পািন এবং ঊধ্পািন ক ক","boards":"বরিশাল বোর্ড ২০২২"},{"id":"ch2-sq9","chapter":2,"num":9,"importance":3,"question":"রনশাদে একটি উধ্পারভর পদাে– ব্যাখ্যা কর।","answer":"বেস কঠ ি ে পদাথড তার্প তিল ো হয়ে সিাসরি ববাষ্প পরিণত হয় এবং শীতল করলে বাষ্প থেকে সিাসরি কঠ ি নে মিনি আনস, তানদি ঊধ্ডপারতত পদাথড বলে। কঠ ি ে রেশাদনল (NH Cl) তাপ রদনল এটি তিল ো হয়ে সিাসরি 4 ় ড ববাষ্প পরিণত হয় এবং ঠান্া করলে বাষ্প আ াি সিাসরি কঠ ি ে রেশাদনল পরিণত হয়। তাই রেশাদল একটি ঊধ্ডপারতত পদাথড। ক ক","boards":"দিনাজপুর বোর্ড ২০২৪, ২০২২; ঢাকা বোর্ড ২০২২; কুমিল্লা বোর্ড ২০২২; যশোর বোর্ড ২০২২, ২০২০"},{"id":"ch2-sq10","chapter":2,"num":10,"importance":3,"question":"(C10H8) একটি উধ্পারভর পদাে– ব্যাখ্যা কর।","answer":"সাধারণ তাপর্াযায় েযাপথললে (C H ) একটি কঠ ি ে পদাথড। 10 8 ় ় ় তাপ প্নোগ করলে এটি তিল ো হয়ে সিাসরি ববাষ্প পরিণত হয় এবং শীতল করলে বাষ্প থেকে সিাসরি কঠ ি ে অবস্থাে মিনি আনস। তাই েযাপথললে (C H ) একটি ঊধ্ডপারতত পদাথড। 10 8 ক ক","boards":"কুমিল্লা বোর্ড ২০২৩;বরিশাল বোর্ড ২০২৩; সিলেট বোর্ড ২০২০; দিনাজপুর বোর্ড ২০২০"},{"id":"ch2-sq11","chapter":2,"num":11,"importance":3,"question":"কঠ ি ন আজযাতত একটি উধ্পারভর পদাে- ব্যাখ্যা কর।","answer":"বেস পদাথড তার্প কঠ ি ে থেকে সিাসরি ববাষ্প এবং শীতলীকির্ণ বাষ্প থেকে সিাসরি কঠ ি নে মিনি আনস, তানদি ঊধ্ডপারতত পদাথড বলে। ় ় ় সাধারণ তাপর্াযায় আনোপ্র্ে কঠ ি ে। তাপ প্নোর্গ এটি তিল ো ় ় ড হয়ে সিাসরি ব গুরে ববাষ্প পরিণত হয় এবং ঠান্া করলে সিাসরি ় ় কঠ ি ে আনোপ্র্নে মিনি আনস। তাই কঠ ি ে আনোপ্র্ে একটি ঊধ্ডপারতত পদাথড। টাইপ ভিততিক মাস্ট ার সাজেশন ় ় ় ়","boards":"রাজশাহী বোর্ড ২০২২;বরিশাল বোর্ড ২০২০"},{"id":"ch2-sq12","chapter":2,"num":12,"importance":3,"question":"আজযাততজক িরে অবস্থায় পাওয়া যায না কেন? ব্যাখ্যা করো। ় ্ ়","answer":"আনোপ্র্ে (I2) একটি উদােী বা ঊধ্ডপারতত পদাথড। সাধারণ ় ় তাপর্াযায় এটি কঠ ি ে অবস্থাে থাকে। ় ় তাপ রদনল কঠ ি ে আনোপ্র্ে তিল ো হয়ে সিাসরি ববাষ্প পরিণত হয়, আ াি শীতল করলে বাষ্প থেকে সিাসরি কঠ ি ে আনোপ্র্নে মিনি আনস। কোনো ধার্পই তিল অবস্থা ততরি হয় ো, তাই আনোপ্র্জনক ় ় ় তিল অবস্থাে পাওয়া যায় ো।","boards":"ঢাকা বোর্ড ২০২৫"},{"id":"ch2-sq13","chapter":2,"num":13,"importance":3,"question":"আজযাততডজনবিভবরে অবস্থা কনই–ব্যাখ্যা কর।","answer":"আনোপ্র্ে (I2) একটি ঊধ্ডপারতত পদাথড; সাধারণ তাপর্াযায় এটি কঠ ি ে। ় ় তাপ প্নোর্গ কঠ ি ে I সিাসরি ববাষ্প পরিণত হয় এবং শীতলীকির্ণ র 2 বাষ্প থেকে সিাসরি কঠ ি নে মিনি আনস। র্াঝখানে তিল অবস্থা সৃটটি ় ় হয় ো বলে আনোপ্র্নেি তিল অবস্থা বেই, অর্থাৎ I বক তিল ি 2 ় ় ভ ় অবস্থাে পাওয়া সম্ েে।","boards":"ঢাকা বোর্ড ২০২৫"},{"id":"ch2-sq14","chapter":2,"num":14,"importance":2,"question":"পািন এবং ঊধ্পািন ব্যাখ্যা কর।","answer":"পািন: কোনো তিলনক তাপ দিয়ে ববাষ্প পরিণত করে পুেিাে শীতল করে তিনল পরিণত করাি পদধরতনক পাতে বলে। পাতে = বাষ্পীি ে + ঘেীি ে। ক ় ় ঊধ্পািন: বে প্মে্বযায় কোনো কঠ ি ে পদার্থড তাপ রদনল তা তিনল ় ় পরিণত ো হয়ে সিাসরি ববাষ্প পরিণত হয়, তানক ঊধ্ডপাতে বলে। যেমন– রেশাদল (NH Cl), কপূডি (C H O), েযাপথললে (C H ), 4 10 16 ় ্ ় কঠ ি ে CO, আনোপ্র্ে (I ) ও AlCl। এদের উদােী পদাথড লা হয়। 2 2 3 বযাপন","boards":"যশোর বোর্ড ২০২৫"},{"id":"ch3-sq1","chapter":3,"num":1,"importance":3,"question":"HNO এবিভবাৎপয লেখো। 3 ্ ়","answer":"HNO সংনকতটি দ্বারা রেনচি র ষেগুনলা ব াঝাে: 3 ১. োইটি ক এসিড োর্ক যৌগ এবং এর একটি অণু। ২. এটি H, N ও O রতেটি মৌল দ্বারা গঠ ি ত। ৩. এর একটি অণুনত 1টি H, 1টি N ও 3টি O পরমাণু আনছ। ৪. এর আণর ক ভর = 1+14+(16×3)=63। ৫. এক মোল HNO এর ভর 63 g এবং এনত 6.02 × 10 টি অণু 3 থাকে।","boards":"রাজশাহী বোর্ড ২০২৬"},{"id":"ch3-sq2","chapter":3,"num":2,"importance":2,"question":"Cl এবং 2Cl এর মজধ্য পায়কয লেখো। ্ ়","answer":"Cl দ্বারা ব্ারিনেি একটি অণু ব াঝাে; এনত দুটি Cl পরমাণু 2 ল ় ্ রাসায়নিক ববন্ধনের মাধ্যমে েুকব থাকে এবং অণুটি স্ব াধীেিান থাকনত পানি। ্ অপিরদনক 2Cl দ্বারা ব্ারিনেি দুটি র ক্সচ্ছন্ পরমাণু ব াঝাে; এরা ্ ় বন্ধনে েু কব হয়ে অণু গঠে করেরে।","boards":"সিলেট বোর্ড 2 ২০২৩"},{"id":"ch3-sq3","chapter":3,"num":3,"importance":2,"question":"2N ও N বলতে কী বোঝায়? ব্যাখ্যা কর। ্","answer":"2N দ্বারা নাইট্রোজেনের দুটি র ক্সচ্ছন্ পরমাণু ব াঝাে, োিা ্ পিস্পি বন্ধনে েুকব েে। অপিরদনক দুটি নাইট্রোজেন পরমাণু রাসায়নিক ববন্ধনের মাধ্যমে েুকব হয়ে নাইট্রোজেন অণু গঠে করে, োি সংনকত N। র 2 ্ ় ্ অর্থাৎ N দ্বারা নাইট্রোজেনের 1টি অণু ব াঝাে, ো স্ব াধীেিান 2 র থাকনত পানি। পরমাণুর সাংগেরনক কণা","boards":"রদোৈপুি 2 বোর্ড ২০২১"},{"id":"ch3-sq4","chapter":3,"num":4,"importance":3,"question":"কসাততডযাম এবিভবরসংখ্যা 23 –ব্যাখ্যা কর।","answer":"কোনো পরমাণুর নিউক্লিয়াসে উপমথত প্রোটন ও রেউ ট ে ল ি সংখ্যাি যোগিলনক ভরসংখ্যা বলে। ় ় বসাপ্র্োনর্ি ভ  দুটি ভিন্ন মৌলের পারমাণবিক সংখ্যা কখনো একই হয় ো। নাইট্রোজেনের পারমাণবিক সংখ্যা 7, অর্থাৎ এর ় ় নিউক্লিয়াসে 7টি প্রোটন আনছ। বে পরমাণুর নিউক্লিয়াসে 7টি প্রোটন র র ল ল থাকন বসটি অ শযই নাইট্রোজেন; রেউ ট ে সংখ্যা ভিন্ন হলেও (যেমন র র 14N, 15N আইসোটোপ) পারমাণবিক সংখ্যা 7-ই থাকে। তাই নাইট্রোজেন পরমাণুর আসল পরিচে তাি পারমাণবিক সংখ্যা। পরমাণুর মজডে","boards":"ঢাকা বোর্ড ২০২৩"},{"id":"ch3-sq9","chapter":3,"num":9,"importance":2,"question":"পরমাণুজি কখ্ন বণােীর সৃটটি হয– ব্যাখ্যা কর।","answer":"কোনো পরমাণুর উপর াইনি থেকে শক্তি (অরতন গুরে, র দশযমান বা অ বলোছহত িশ্মল ) পড় বলে ইলেকট্রন তা থশাষণ করে রেম্ন ্ ত ্ ত ় শক্তি তি থেকে উচ্চ শক্তিস্তরে যায়। ্ত ় ্ ত উচ্চ শক্তি তনি ইলেকট্রন অথােী, তাই আ াি রেনৈি শক্তিস্তরে মিনি বিভব ্ ্ আনস এবং থশারষত শক্তভর সমান শক্তি আনলা ছহনসন র রকিণ করে (E = hν)। ় ় এ র রকরিত আনলা প্প্ৈনর্ি র্ধয দিয়ে পাঠানল নির্দিষ্ট বিখা পাওয়া যায়, এটি ই পারমাণবিক ণডালল। টাইপ ভিততিক মাস্ট ার সাজেশন","boards":"যশোর বোর্ড ২০২৩"},{"id":"ch3-sq10","chapter":3,"num":10,"importance":2,"question":"অরবিট কাকে বলে? ব্যাখ্যা কর।","answer":"পরমাণুনত নিউক্লিয়াসেি চািরদনক নির্দিষ্ট যাসানধডি বে সকল অেুনর্ারদত ৃকাকাি কক্ষপর্থ ইলেকট্রন বঘানি, বসগুনলানক অরবিট ্ ত বা প্ধাে শক্তি তি বলে। ় ্ অরবিটে বঘািাি সময় ইলেকট্রন কোনো শক্তি থশাষণ বা র রকিণ করে ো, তাই এনক মথি কক্ষপথও বলে। ্ ় অরবিটনক n দ্বারা প্কাশ করা হে: n = 1, 2, 3, 4 হলে েথােব্ নর্ K, L, M, N শক্তিস্তর। পরমাণুর শততিব স্জর ইজেক ট ন বিন্যাস ় ্ ্ ত","boards":"ময়মনসিংহ বোর্ড ২০২৩"},{"id":"ch3-sq11","chapter":3,"num":11,"importance":3,"question":"দ্বিীয প্রধান শততিব স্জর 'd' অরবিটাল োজক না কেন? ্ত ্ত","answer":"প্ধাে শক্তিস্তর n এর জন্য উপশক্তিস্তর l এর মান 0 থেকে (n ় ় ত ্ ত - 1) পে্ হয়। d উপশক্তিস্তরেি জন্য l = 2 প্নোৈে। ্ ় ্ ত ছদতীে শক্তি তনি n = 2, তাই l = 0, 1 অর্থাৎ শুধু 2s ও 2p ্ ত ভ ় উপশক্তিস্তর থাকে; l = 2 সম্ েে। ্ ় ্ ত তাই ছদতীে প্ধাে শক্তি তনি d অরবিটাল থাকে ো, অর্থাৎ 2d অরবিটাল অসম্।","boards":"কুমিল্লা বোর্ড ২০২৩, ২০২১"},{"id":"ch3-sq12","chapter":3,"num":12,"importance":3,"question":"Cu মৌলের ইলেকট্রন বিন্যাস বযরিতর্ব ম কেন? 2 2 6 2 6 9 2","answer":"সাধারণ রেেনর্ Cu(29) → 1s 2s 2p 3s 3p 3d 4s হওয়ার কথা। 10 ্ত ় কিন্তু d উপশক্তিস্তর সম্পূর্ণ পূর্ণ (d ) হলে বিন্যাস বেশি সুমথত হয়। তাই অরধক সুমথরত অর্জন নেি জন্য 4s থেকে 1টি ইলেকট্রন 3d বত ি র চনল যায়। 2 2 6 2 6 10 1 িনল প্কৃ ত বিন্যাস Cu(29) → 1s 2s 2p 3s 3p 3d 4s। এজন্য কপানভর ইলেকট্রন বিন্যাস সাধারণ রেেনর্ি যরতেব্ র্।","boards":"চট্টগ্রাম বোর্ড ২০২২; যশোর বোর্ড ২০২০"},{"id":"ch3-sq13","chapter":3,"num":13,"importance":3,"question":"4s অথপো 3d অরবিটাজের শততিব কবভশ– ব্যাখ্যা কর।","answer":"অরবিটালেি শক্তি (n + l) এর র্ানেি উপর রেিড ি করে; োি (n + l) কম, তাি শক্তি কম এবং তানত ইলেকট্রন আগে প্রবেশ করে। 3d: n + l = 3 + 2 = 5; 4s: n + l = 4 + 0 = 4 বেনহত 3d এর (n + l) মান বেশি, তাই 4s অপেক্ষা 3d অরবিটালেি শক্তি বেশি। এ কারণে ইলেকট্রন আগে 4s এ এবং পরে 3d বত প্রবেশ করে।","boards":"যশোর বোর্ড ২০২১; চট্টগ্রাম বোর্ড ২০২০"},{"id":"ch3-sq14","chapter":3,"num":14,"importance":3,"question":"3f অরবিটাল সম্ভ ব নয কেন? ব্যাখ্যা কর। ্ত ্ত","answer":"প্ধাে শক্তিস্তর n হলে উপশক্তিস্তর বা অরবিটালেি মান l = 0, 1, 2, ..., (n-1) পে্ হনত পানি। l = 0, 1, 2, 3 হলে েথােব্ নর্ s, p, d, f অরবিটাল ব াঝাে। n = 3 হলে l = 0, 1, 2 অর্থাৎ কেবল 3s, 3p ও 3d অরবিটাল সম্। f অরবিটালেি জন্য l = 3 প্নোৈে, ো কেবল n = 4 বা তাি বেশি ভ ৃ ় ্ ত হলে সম্। তাই ততীে শক্তি তনি f অরবিটাল থাকে ো; 3f অরবিটাল ভ ় সম্ েে। টাইপ ভিততিক ম ﻿","boards":"চট্টগ্রাম বোর্ড ২০২৬"},{"id":"ch3-sq15","chapter":3,"num":15,"importance":3,"question":"K পরমাণুর সবথশষ ইলেকট্রনটি 3d অরবিটাজে প্জবশ না কজর 4s এ গমন কজর কেন?","answer":"আউি াউ েীরত অনুসারে ইলেকট্রন প্রথমে রেম্ন শক্তভর ় ্ অরবিটালে এবং পরে ে্বর্ান্নে উচ্চ শক্তভর অরবিটালে প্রবেশ করে। ্ ্ ় অরবিটালেি শক্তি (n + l) এর মান দ্বারা রেধডারিত হয়। 4s অরবিটাজের েনয (n+l) = 4+0 = 4 3d অরবিটাজের েনয (n+l) = 3+2 = 5 ় ় ্ 4s অরবিটালেি (n + l) এর মান কম হওয়ায় এর শক্তি 3d অরবিটালেি বচনে কম। তাই K (19) এর সর্বশেষ ইলেকট্রনটি 3d বত ো রগনে 4s অরবিটালে প্রবেশ করে। 2 2 6 2 6 1 K (19) : 1s 2s 2p 3s 3p 4s 2+ 3+","boards":"ঢাকা বোর্ড ২০২৬"},{"id":"ch3-sq16","chapter":3,"num":16,"importance":3,"question":"Fe ও Fe আযন দটি র মজধ্য কোনটি অরধ্ক স্থিতিশীল? ব্যাখ্যা কর। 2+ 3+ 3+ ় ়","answer":"Fe ও Fe আয়নেি মধ্যে Fe আয়ন অরধক মথরতশীল। 2 2 6 2 6 6 2 Fe (26) : 1s 2s 2p 3s 3p 3d 4s 2+ 2 2 6 2 6 6 Fe : 1s 2s 2p 3s 3p 3d 3+ 2 2 6 2 6 5 Fe : 1s 2s 2p 3s 3p 3d 3+ Fe আয়নেি 3d অরবিটাল অধডপূর্ণ (3d5)। অধডপূর্ণ ও পূর্ণ 2+ 6 ় ় অরবিটাল অরধক মথরতশীল হয়। অপিরদনক Fe আয়নেি 3d 3+ 2+ ় ় বিন্যাস অধডপূর্ণ বা পূর্ণ কোনোটি ই েে। তাই Fe আয়ন Fe অপেক্ষা অরধক মথরতশীল।","boards":"দিনাজপুর বোর্ড ২০২৬"},{"id":"ch3-sq17","chapter":3,"num":17,"importance":3,"question":"4f ও 6p এর মজধ্য কোন অরবিটাজে ইলেকট্রন আথগ প্জবশ করজব? ব্যাখ্যা কর।","answer":"(n + l) রেের্ অনুসারে বে অরবিটালেি (n + l) এর মান কম, বসই অরবিটালে ইলেকট্রন আগে প্রবেশ করে। (n + l) এর মান সমান হলে বে অরবিটালেি n এর মান কম, বসটিনত ইলেকট্রন আগে প্রবেশ করে। 4f অরবিটাজের েনয, n+l = 4+3 = 7 6p অরবিটাজের েনয, n+l = 6+1 = 7 উিনেি (n + l) এর মান সমান হলেও 4f এর n এর মান (4) 6p এর n এর মান (6) অপেক্ষা কম। তাই 4f অরবিটালেি শক্তি কম এবং 4f অরবিটালে ইলেকট্রন আগে প্রবেশ কিন। ় ী","boards":"ময়মনসিংহ বোর্ড ২০২৬"},{"id":"ch3-sq18","chapter":3,"num":18,"importance":2,"question":"বতর্ব াভমযাজমর ইলেকট্রন বিন্যাস বযরিতর্ব মধ্মী কেন? ব্যাখ্যা কর। ় ়","answer":"সাধারণ রেের্ (আউি াউ েীরত) অনুসারে বে্বামর্োনর্ি (Z = 24) ইলেকট্রন বিন্যাস হওয়ার কথা— 2 2 6 2 6 4 2 Cr(24) → 1s 2s 2p 3s 3p 3d 4s কিন্তু প্কৃ ত বিন্যাস হলো— 2 2 6 2 6 5 1 Cr(24) → 1s 2s 2p 3s 3p 3d 4s অধডপূর্ণ (d5) বা পূর্ণ (d10) উপশক্তিস্তর বেশি মথরতশীল। তাই অরধক মথরতশীলতা অর্জন নেি জন্য 4s অরবিটাল থেকে 1টি ইলেকট্রন 3d ি র ় ় ় অরবিটালে চনল যায় এবং 3d অধডপূর্ণ হয়। এজন্য বে্বামর্োনর্ি ইলেকট্রন বিন্যাস যরতে্ব র্ধর্ী। াস্ট ার সাজেশন ় ্ ৃ ত","boards":"বরিশাল বোর্ড ২০২৪"},{"id":"ch3-sq19","chapter":3,"num":19,"importance":2,"question":"ভরীয প্রধান শততিব স্জর f অরবিটাল োজক না কেন? ্ ত","answer":"প্ধাে শক্তিস্তর n এর জন্য l এর মান 0 থেকে (n - 1) পে্ ় ্ ত ় হয়। f উপশক্তিস্তরেি জন্য l = 3 প্নোৈে। ৃ ় ্ত ততীে শক্তি তনি n = 3, তাই l = 0, 1, 2 অর্থাৎ শুধু 3s, 3p ও 3d ্ ত ভ ় উপশক্তিস্তর থাকে; l = 3 সম্ েে। ৃ ় ্ ত তাই ততীে প্ধাে শক্তি তনি f অরবিটাল থাকে ো, অর্থাৎ 3f ভ ় অরবিটাল সম্ েে। আইজসাজটাপ","boards":"চট্টগ্রাম বোর্ড ২০২৪"},{"id":"ch3-sq20","chapter":3,"num":20,"importance":3,"question":"কপ্াটি যাজমর রনউট ন সংখ্যা শূনয—ব্যাখ্যা কর।","answer":"বপ্াটিোর্ হলো হাইরোজেনের একটি আইসোটোপ, োি প্তীক 1H (ভর সংখ্যা 1, পারমাণবিক সংখ্যা 1)। র 1 আর্িা ৈারে, রেউ ট ে সংখ্যা = ভর সংখ্যা - পারমাণবিক সংখ্যা। কপ্াটি যাজমর রনউট ন সংখ্যা = 1-1 = 0 ় ় অর্থাৎ বপ্াটিোনর্ি নিউক্লিয়াসে কেবল একটি প্রোটন থাকে, কোনো রেউ ট ে থাকে ো। তাই বপ্াটিোনর্ি রেউ ট ে সংখ্যা শূেয। র র","boards":"বরিশাল বোর্ড ২০২৬"},{"id":"ch3-sq21","chapter":3,"num":21,"importance":3,"question":"16/8M ও 18/8M পরসপর আইজসাজটাপ কেন? (Similar Questions: ✓ 2/1A ও 3/1B পরসপজরর আইজসাজটাপ কেন? ব্যাখ্যা কর।; ✓ 1/1H এবং 3/1H পরসপর আইজসাজটাপ—ব্যাখ্যা কর।)","answer":"বে সকল পরমাণুর প্রোটন সংখ্যা সমান কিন্তু ভরসংখ্যা ও রেউ ট ে সংখ্যা ভিন্ন, তািা পিস্পনভর আইসোটোপ। 16/8M ও 18/8M উিনেি প্রোটন সংখ্যা 8 (সমান), কিন্তু ভরসংখ্যা েথােব্ নর্ 16 ও 18 এবং রেউ ট ে সংখ্যা েথােব্ নর্ 16-8 = 8 ও 18-8 = 10 (ভিন্ন)। তাই 16/8M ও 18/8M পিস্পনভর আইসোটোপ।","boards":"যশোর বোর্ড ২০২৩"},{"id":"ch3-sq22","chapter":3,"num":22,"importance":2,"question":"ততডউজটররযাম, হাইজ বাজেজনর একটি আইজসাজটাপ ব্যাখ্যা কর।","answer":"প্রোটন সংখ্যা সমান কিন্তু ভরসংখ্যা ও রেউ ট ে সংখ্যা ভিন্ন পরমাণুগুনলা পিস্পনভর আইসোটোপ। হাইরোজেন (1/1H) ও প্র্উনটরিোর্ (2/1H) উিনেি প্রোটন সংখ্যা 1, কিন্তু ভরসংখ্যা েথােব্ নর্ 1 ও 2 এবং রেউ ট ে সংখ্যা েথােব্ নর্ 0 ও 1। তাই প্র্উনটরিোর্ হাইরোজেনের একটি আইসোটোপ।","boards":"ঢাকা বোর্ড ২০২৩"},{"id":"ch3-sq23","chapter":3,"num":23,"importance":2,"question":"কপ্াটি যাজমর রনউট ন সংখ্যা শূ নয — ব্যাখ্যা কর।","answer":"বপ্াটিোর্ হাইরোজেনের একটি আইসোটোপ, প্তীক 1/1H। এর প্রোটন সংখ্যা Z = 1 এবং ভরসংখ্যা A = 1। রনউট ন সংখ্যা = A-Z = 1-1 = 0 ় ় অর্থাৎ বপ্াটিোনর্ি নিউক্লিয়াসে শুধু একটি প্রোটন থাকে, কোনো র র রেউ ট ে থাকে ো। তাই এর রেউ ট ে সংখ্যা শূেয। র র পারমাণরবক ির বা আথপততেক পারমাণরবক ির","boards":"দিনাজপুর বোর্ড ২০২০"},{"id":"ch3-sq24","chapter":3,"num":24,"importance":3,"question":"আথপততেক পারমাণরবক িজরর একে নাই কেন? ত","answer":"আথপততেক পারমাণরবক ির = মৌলের একটি পরমাণুবিভবর / একটি কাবন-12 আইজসাজটাথপবিভবজরর 1/12 অংশ এখানে ল ও হি দুটি ই ভর এবং দুটি ি একে একই (g)। িাগ করলে একে বকনট যায়। আপেক্ষিক পারমাণবিক ভর দুটি ভরের অেুপাত মান, তাই এর কোনো একে থাকে ো।","boards":"রাজশাহী বোর্ড ২০২৫; দিনাজপুর বোর্ড ২০২৫, ২০২৩; ঢাকা ﻿ বোর্ড ২০২৩; কুমিল্লা বোর্ড ২০২২; সিলেট বোর্ড ২০২২; চট্টগ্রাম ল র বোর্ড ২০২০;বরিশাল বোর্ড ২০২০"},{"id":"ch3-sq25","chapter":3,"num":25,"importance":3,"question":"\"নাইজট াজেজনর আণরবক ির 28\" – ব্যাখ্যা কর। (Similar Questions: ✓ যৌগের আথপততেক আণরবক িজরর বযাখ্যা দাও।)","answer":"অণুনত উপমথত পরমাণুগুনলাি আপেক্ষিক পারমাণবিক ভরনক রেৈ রেৈ পরমাণু সংখ্যা দিয়ে গুণ করে যোগ করলে ঐ অণুি ় ় আণর ক ভর পাওয়া যায়। নাইট্রোজেন অণু (N ) বত 2টি N পরমাণু আনছ এবং N এর র 2 আপেক্ষিক পারমাণবিক ভর 14। N এর আণরবক ির = 14×2 = 28 2 অর্থাৎ একটি N অণু কার্বন-12 আইনসানটার্পি ভরের 1/12 অংর্শি 2 তলযায় 28 গুণ িািী।","boards":"যশোর বোর্ড ২০২৪; ঢাকা বোর্ড ২০২১"},{"id":"ch3-sq26","chapter":3,"num":26,"importance":3,"question":"আথপততেক পারমাণরবক িজরর একে োজক না কেন?","answer":"কোনো মৌলের একটি পরমাণুর ভর একটি কার্বন-12 আইনসানটার্পি ভরের 1/12 অংর্শি তলযায় েতগুণ িািী, বসই সংখ্যানক ঐ মৌলের আপেক্ষিক পারমাণবিক ভর বলে। আথপততেক পারমাণরবক ির = একটি পরমাণুবিভবর / (একটি C-12 পরমাণুবিভবজরর 1/12 অংশ) এখানে ল ও হি উভয়ই ভর এবং একই একনক (g বা kg) প্কামশত ় ় ় হয়। িনল একে কাটাকাটি হয়ে যায় এবং কেবল একটি অেুপাত ় ় (সংখ্যা) পাওয়া যায়। তাই আপেক্ষিক পারমাণবিক ভরের কোনো একে থাকে ো।","boards":"বরিশাল বোর্ড ২০২৬"},{"id":"ch3-sq27","chapter":3,"num":27,"importance":3,"question":"আথপততেক পারমাণরবক িজরর একে কনই—ব্যাখ্যা কর।","answer":"কোনো মৌলের একটি পরমাণুর ভর একটি কার্বন-12 আইনসানটার্পি ভরের 1/12 অংর্শি তলযায় েত গুণ িািী, বসই সংখ্যানক ঐ মৌলের আপেক্ষিক পারমাণবিক ভর বলে। আথপততেক পারমাণরবক ির = একটি পরমাণুবিভবর / (একটি C-12 পরমাণুবিভবজরর 1/12 অংশ) ় ় এখানে ল ও হি উভয়ই ভর এবং উিনেি একে একই (g বা kg)। ় ় িনল িাগ করলে একে কাটাকাটি হয়ে যায় এবং শুধু একটি সংখ্যা অ মশটট থাকে। যেমন: অক্সিজেনের আপেক্ষিক পারমাণবিক ভর 16, এটি একটি তলোমূলক সংখ্যা মান। তাই আপেক্ষিক পারমাণবিক ভরের কোনো একে বেই। টাইপ ভিততিক মাস্ট ার সাজেশন কিেভস্ব য আইজসাজটাপ ও িাজদর বযবহার র ্","boards":"রাজশাহী বোর্ড ২০২৬"},{"id":"ch3-sq28","chapter":3,"num":28,"importance":3,"question":"করাগ রনণজয আইজসাজটাথপর বযবহার লেখ্। ় ়","answer":"বিাগ রেণে বটকরেমশোর্-99 (99Tc) ইনঞ্জকশনেি মাধ্যমে শরীরে প্রবেশ করানো হয়। এটি নির্দিষ্ট থানে ৈর্া হয়ে গার্া িশ্মল র রকিণ করে এবং গার্া িশ্মল শোকবকিণ কযানর্িা দিয়ে বিাগাে্বান্ থানেি ছর বতালা যায়। এর লাইিটাইর্ 6 ঘণ ট বা বলে এটি রেিাপদ। ় ় বিাগ রেিার্নে 131I থাইিনের্ কযােসাি বকাষ, 60Co টি উর্াি ও কযােসাি বকাষকলা ধ্ংস করে; 32P এবিভবসনিট ললউনকামর্ো এবং ইরিপ্র্োর্ আইসোটোপ ব রইে কযােসাি চচরকৎসাে য হবত হয়। তাই চচরকৎসার্ক্ষতরে বতৈমথব ে আইসোটোপ গুিুতপূর্ণ। র ্ ব ় ়","boards":"দিনাজপুর বোর্ড ২০২১; ঢাকা বোর্ড ২০২০"},{"id":"ch3-sq29","chapter":3,"num":29,"importance":3,"question":"করাগ রনণজয কিেভস্বয আইজসাজটাথপর বযবহার বযাখ্যা র ্ কর।","answer":"বতৈমথবে আইসোটোপ থেকে রেগডত িশ্মল েতরন্তি সাহানেয র ্ ্ ় শোকব করা যায় বলে এনক ব ট সাি ছহনসন বদনহি র ভিন্ন অনঙ্গি অবস্থা ৈােনত ব্যবহার করা হয়। ় ় • থাইিনের্ গ্ছন্তি বিাগ ও কােডকারিতা রেণে আনোপ্র্ে-131 (I- ্ ় ্ ় 131) য হবত হে; বিাগীনক স্ব ল্ র্াযায় I-131 খাওোনোি পি গ্ছন্তনত এর ৈর্া হওয়ার পরিমাণ বদর্খ বিাগ নির্ণয় করা হয়। • বটকনেমসোর্-99m (Tc-99m) ব্যবহার করে র্লতষ্ক, হবৎমপণ্ড, েকৃ ৎ, রকমরে, হাড় ইতযারদি ছর বতালা ও টি উর্াি শোকব করা হয়। ত ় এরান বদহ ো বকনটই অিযন্িীণ বিাগ রেণে বতৈমথবে ্ ় আইসোটোপ য হবত হয়। ় ়","boards":"র্াদ্াসা বোর্ড ২০২৬"},{"id":"ch3-sq30","chapter":3,"num":30,"importance":3,"question":"কটকরনভশযাজমর কিেভস্বয আইজসাজটাপ চিরকৎসাথেতরতর র ্ বযবহার রনরাপদ কেন? ব্যাখ্যা করো। ় ়","answer":"বটকরেমশোনর্ি বতৈমথবে আইসোটোপ Tc-99m এর অধডাে়ু র ্ ় ় মান প্রায় 6 ঘণ ট া, িনল এটি খু অল্ সময়েি মধ্যে ক্ষে হয়ে শিীি র প ় ় থেকে ব ি হয়ে যায়। এটি কেবল কম শক্তভর গার্া িশ্মল রেগডত করে, ক্ষরতকি আলিা বা র টা কণা রেগডত করে ো। তাই বদহনকানষি বতর্ে ক্ষরত হয় ো। এ কারণে টি উর্াি, কযান্সাি বকাষ ও বদনহি র ভিন্ন অনঙ্গি বিাগ রেণে Tc-99m এর ব্যবহার রেিাপদ। পরমাণুর সাংগেরনক কণা","boards":"সিলেট বোর্ড ২০২৬"},{"id":"ch4-sq1","chapter":4,"num":1,"importance":2,"question":"কডাজবরাইনাজরর তরযী সূতরটি লেখো।","answer":"একই িকম ধর্মর মশটট রতেটি মৌলনক পারমাণবিক ভর ্ ় ৃ অনুসারে সাৈানল ছদতীে মৌলের পারমাণবিক ভর প্থর্ ও ততীে মৌলের পারমাণবিক ভরের যোগিনলি অনধডক বা তাি কাছাকাছছ ় ় হে— এনক বর্ান িাইোনভর েেী সূে বলে। 7+39 যেমন: Li (7), Na (23), K (39) এর থক্ষতরে =23=Na এর 2 পারমাণবিক ভর। ইজেক ট ন বিন্যাসই পর্যায় সারণির মূে ভিততি ় ়","boards":"সিলেট বোর্ড ২০২৪"},{"id":"ch4-sq2","chapter":4,"num":2,"importance":3,"question":"ির সংখ্যা পর্যায় সারণির মূে ভিততি নয—ব্যাখ্যা কর।","answer":"মৌলের রাসায়নিক ধর্ম রেিড ি করে তাি ইলেকট্রন বিন্যাস তথা পারমাণবিক সংখ্যাি ওপি, ভর সংখ্যাি ওপি েে। 12 14 একই মৌলের আইসোটোপসর্ূনহি (যেমন: C ও C) ভর সংখ্যা ভিন্ন হলেও তানদি ইলেকট্রন বিন্যাস ও রাসায়নিক ধর্ম একই। ভর সংখ্যা মিপ্ক হলে এদের ভিন্ন ভিন্ন ঘনি সানত হনতা। আ াি ভর সংখ্যা অনুসারে সাৈানল আগডে (Ar, 40) বক ় ় পটামসোনর্ি (K, 39) পরে সানত হয়, ো তানদি ধনর্ডি সাথে সার্ঞ্জসযপূর্ণ েে। তাই আধুরেক পর্যায় সািরণি র্ূল মিপ্ক হলো পারমাণবিক সংখ্যা ও ় ় ইলেকট্রন বিন্যাস; ভর সংখ্যা পর্যায় সািরণি র্ূল মিপ্ক েে।","boards":"ময়মনসিংহ বোর্ড ২০২৬"},{"id":"ch4-sq3","chapter":4,"num":3,"importance":2,"question":"ইলেকট্রন বিন্যাসই পর্যায় সারণীর মূে ভিততি-ব্যাখ্যা কর। ্ ়","answer":"ইলেকট্রন বিন্যাস থেকে কোনো মৌল কত েম্বি পর্যায় ও গ্রুপে ় ় ত ্ ় আনছ তা নির্ণয় করা যায়। সর্বশেষ শক্তিস্তরেি েম্বি পর্যায় রেনদড শ করে, আি াইনভর তনভর বিন্যাস গ্রুপ রেনদড শ করে। 2 1 2 2 6 1 6 1 যেমন- Li (1s 2s ), Na (1s 2s 2p 3s ) ও K (...3p 4s ) এর 1 াইনভর বিন্যাস ns বলে স াই গ্রুপ-1 এ, কিন্তু সর্বশেষ তি 2, 3, 4 ় বলে ভিন্ন পর্যায়ে। ত ় তাছাড় বা াইনভর তনি 1টি ইলেকট্রন থাকনল মৌল + আয়ন (Na ) − এবং 7টি থাকনল - আয়ন (Cl ) গঠে করে — এরান ধর্মও ব্যাখ্যা ় ় করা যায়। তাই ইলেকট্রন বিন্যাসই পর্যায় সািরণি র্ূল মিপ্ যা কর। 2 2 6 1","answer":"Na (11) : 1s 2s 2p 3s। একটি ইলেকট্রন তযাগ করে + 2 2 6 Na : 1s 2s 2p গঠে করে, ো রেেনেি র্নতা সুমথত অটট ক বিন্যাস। এই মথরতশীল অটট ক থেকে আিও একটি ইলেকট্রন সিানত হলে ় ত নিউক্লিয়াসেি রেকট তী তি থেকে ইলেকট্রন সিানত হয়, োি জন্য ল র ্ ্ অনেক বেশি শক্তি লার্গ। এই শক্তি সাধারণ রাসায়নিক বিক্রিয়া থেকে ় ় পাওয়া যায় ো। 2+ ় ভ তাই সাধারণত Na আয়ন গঠে অসম্। + 2+","boards":"কুমিল্লা বোর্ড ২০২৩;বরিশাল বোর্ড ২০২৩"},{"id":"ch5-sq20","chapter":5,"num":20,"importance":3,"question":"Na গঠ ি ি হজেও Na গঠ ি ি হয না কেন? ব কর। 2 2 6","answer":"Na এর ইলেকট্রন বিন্যাস 1s 2s 2p 3s। সর্বশেষ তনভর + 1টি ইলেকট্রন তযাগ করলে Na আয়নেি ইলেকট্রন বিন্যাস হয় 1s 2 6 2s 2p, ো রেরকবে গ্যাস Ne এর র্নতা মথরতশীল অটট ক বিন্যাস। র ্ ি + − Na→Na +e + Na থেকে আিও একটি ইলেকট্রন সিানত হলে মথরতশীল পূর্ণ 2p অরবিটাল (নিউক্লিয়াসেি অনেক কানছি তি) থেকে ইলেকট্রন সিানত ় ় ় ্ ্ হয়, োি জন্য ছদতীে আয়নিকিণ শক্তি অনেক বেশি প্নোৈে। তাছাড় বা এনত মথরতশীল অটট ক বিনে যায়। + 2+ তাই Na গঠ ি ত হলেও Na গঠ ি ত হয় ো। ় ্ আযরনক বন্ ধন বা িততড় ৎজযােী বন্ ধন","boards":"কুমিল্লা বোর্ড ২০২৬"},{"id":"ch5-sq21","chapter":5,"num":21,"importance":2,"question":"Na-সমজযােী যৌগ গেন কজর না কেন? ব্যাখ্যা কর। 2 2 6 1","answer":"Na(11) : 1s 2s 2p 3s — সর্বশেষ শক্তিস্তরে মান 1টি ় ় ু ইলেকট্রন থাকাে Na একটি সমে্বে ধাত এবং এর আয়নিকিণ শক্তি খু কম। ় ় অটট ক পূির্ণ 7টি ইলেকট্রন থশোি করাি বচনে 1টি ইলেকট্রন তযাগ করা অনেক সহৈ, তাই Na ইলেকট্রন তযাগ করে Na+ আয়নে পরিণত হে: Na → Na++e-। ﻿ ় ় সমযোজী বন্ধনে ইলেকট্রন থশোি কিনত হয়, কিন্তু Na ইলেকট্রন র র থশোি ো করে তযাগ করে। তাই Na সমযোজী যৌগ গঠে করে ো, আয়নিক যৌগ গঠে করে। ্ ্ সমজযােী বন্ ধন","boards":"বরিশাল বোর্ড ২০২০"},{"id":"ch5-sq22","chapter":5,"num":22,"importance":3,"question":"HCl একটি ক্ষপায়ার যৌগ — ব্যাখ্যা কর। র র","answer":"HCl এ H ও Cl এক বৈাড় বা ইলেকট্রন থশোি করে সমযোজী ন্ধে গঠে করে। ় Cl এর তপ্ড় ৎ ঋণাতমকতা H অপেক্ষা অনেক বেশি, তাই থশোিকৃ ত ইলেকট্রন বৈাড় Cl এর রদনক সনি যায়। িনল Cl পরমাণুনত আংমশক ঋণাতমক (δ-) ও H পরমাণুনত আংমশক ধোতমক (δ+) চার্জ সৃটটি হয় (Hδ+–Clδ-)। তাই HCl একটি থপালাি যৌগ। −","boards":"সিলেট বোর্ড ি ২০২৩; রাজশাহী বোর্ড ২০২০"},{"id":"ch5-sq23","chapter":5,"num":23,"importance":3,"question":"CH CH OH একটি ক্ষপায়ার যৌগ– ব্যাখ্যা কর। 3 2","answer":"বে সমযোজী যৌগের অণুনত আংমশক ধোতমক ও আংমশক ত ় ঋণাতমক প্ান্ সৃটটি হয়, তানক থপালাি যৌগ বলে। ইথােনলি গঠে CH -CH -O-H। এখানে O এর তপ্ড় ৎ ঋণাতমকতা C 3 2 ় ও H অপেক্ষা অনেক বেশি, তাই C–O ও O–H ববন্ধনের থশোিকৃ ত ইলেকট্রন বৈাড় O এর রদনক সনি যায়। িনল O পরমাণুনত আংমশক ঋণাতমক (δ-) এবং সংলগন ল C ও H ় পরমাণুনত আংমশক ধোতমক (δ+) চার্জ সৃটটি হয়। তাই ইথানল একটি ় ় থপালাি যৌগ।","boards":"রাজশাহী বোর্ড ২০২১; সিলেট বোর্ড ২০২০"},{"id":"ch5-sq24","chapter":5,"num":24,"importance":3,"question":"ইোনে ক্ষপায়ার যৌগ কেন? ব্যাখ্যা কর।","answer":"ইথােনলি (CH -CH -OH) অণুনত O-H ও C-O সমযোজী 3 2 যাখ্যা ় ন্ধে িনেনছ। O এর তপ্ড় ৎ ঋণাতমকতা (3.5), H (2.1) ও C (2.5) অপেক্ষা অনেক বেশি। 1 ় িনল ববন্ধনের থশোিকৃ ত ইলেকট্রন েুগল O পরমাণুর রদনক বেশি 2 র আকৃ টট হে; O পরমাণু আংমশক ঋণাতমক (δ-) এবং H পরমাণু আংমশক ধোতমক (δ+) চার্জ লাি করে। CH -CH -Oδ− − Hδ+ 3 2 ত ় ় অণুনত এরূপ আংমশক ধোতমক ও ঋণাতমক প্ান্ সৃটটি হওয়ায় ় ইথানল একটি থপালাি যৌগ। এ কারণেই ইথানল পানির সাথে ় হাইরোজেন ন্ধে গঠে করে বজনকানো অেুপানত মর্র্শ যায়।","boards":"চট্টগ্রাম বোর্ড ২০২৬"},{"id":"ch5-sq25","chapter":5,"num":25,"importance":3,"question":"H2O যৌগজক ক্ষপায়ার সমজযােী যৌগ বো হয—ব্যাখ্যা কর।","answer":"H O অণুনত O পরমাণু দুটি H পরমাণুর সাথে ইলেকট্রন 2 র থশোনভর মাধ্যমে দুটি সমযোজী ন্ধে গঠে করে। O এর তপ্ড় ৎ ঋণাতমকতা (3.5) H এর তপ্ড় ৎ ঋণাতমকতাি (2.1) ্ ত ় ় ় ় বচনে বেশি হওয়ায় থশোিকৃ ত ইলেকট্রন েুগল O পরমাণুর রদনক ় ্ বেশি আকৃ টট থাকে। িনল O পরমাণুনত আংমশক ঋণাতমক (δ-) এবং H পরমাণুনত আংমশক ধোতমক (δ+) চানৈড ি সৃটটি হয়। এরান অণুটি নত আংমশক ধোতমক ও আংমশক ঋণাতমক প্ানন্ি সৃটটি ় ় হয় বলে H O বক থপালাি সমযোজী যৌগ লা হয়। 2 টাইপ ভিততিক মাস্ট ার সাজেশন","boards":"ঢাকা বোর্ড ২০২৬"},{"id":"ch5-sq26","chapter":5,"num":26,"importance":3,"question":"HF একটি ক্ষপায়ার যৌগ — ব্যাখ্যা কর। ্ ্","answer":"বে সমযোজী যৌগে বন্ধনে েুকব পরমাণুদনেি তপ্ড় ৎঋণাতমকতাি পাথকযি কারণে আংমশক ধোতমক ও আংমশক ঋণাতমক প্ানন্ি সৃটটি হয়, তানক থপালাি যৌগ বলে। HF অণুনত H (তপ্ড় ৎঋণাতমকতা 2.1) ও F (তপ্ড় ৎঋণাতমকতা 4.0) এর মধ্যে একটি ইলেকট্রন বৈাড় থশোনভর মাধ্যমে সমযোজী ন্ধে ় ় ় ় গঠ ি ত হয়। F অরধক তপ্ড় ৎঋণাতমক হওয়ায় থশোিকৃ ত ইলেকট্রন বৈাড় নক রেনৈি রদনক বেশি আকর্ষণ করে। δ+ δ- H − F ত ত িনল F প্ানন্ আংমশক ঋণাতমক ও H প্ানন্ আংমশক ধোতমক র র চানৈড ি সৃ টটি হয়। তাই HF একটি থপালাি যৌগ।","boards":"দিনাজপুর বোর্ড ২০২৬"},{"id":"ch5-sq27","chapter":5,"num":27,"importance":3,"question":"পারন কেন ক্ষপায়ার দ্াবক? ব্যাখ্যা কর।","answer":"পানির (H O) অণুনত অক্সিজেন ও হাইরোজেন থপালাি 2 ্ ্ সমযোজী বন্ধনে েুকব। অক্সিজেনের তপ্ড় ৎ ঋণাতমকতা হাইরোজেনের ় ় ় ় বচনে বেশি হওয়ায় থশোিকৃ ত ইলেকট্রন েুগল অক্সিজেনের রদনক বেশি আকৃ টট থাকে। িনল অক্সিজেন প্ানন্ আংমশক ঋণাতমক (δ-) এবং হাইরোজেন ত ় প্ানন্ আংমশক ধোতমক (δ+) চানৈড ি সৃটটি হয়। তাছাড় বা পানির অণ ় বকৌরণক আকৃ রতি হওয়ায় এই চার্জ পৃথকীকিণ প্শমর্ত হয় ো। তাই পানি একটি থপালাি দ্া ক, ো NaCl এর র্নতা আয়নিক যৌগ ও থপালাি যৌগনক সহজে দ্ ীিত করে।","boards":"যশোর বোর্ড ২০২৬"},{"id":"ch5-sq28","chapter":5,"num":28,"importance":3,"question":"হাইজ বাজেন কলারাইড একটি ক্ষপায়ার সমজযােী যৌগ— ্ ি ব্যাখ্যা কর।","answer":"HCl অণুনত H ও Cl পরমাণু একনৈাড় বা ইলেকট্রন থশোি করে ্ সমযোজী ন্ধে গঠে করে। তাই HCl একটি সমযোজী যৌগ। কিন্তু Cl এর তপ্ড় ৎ ঋণাতমকতা (3.0) H এর তপ্ড় ৎ ঋণাতমকতা (2.1) ় ় ় অপেক্ষা বেশি হওয়ায় থশোিকৃ ত ইলেকট্রন েুগল Cl পরমাণুর রদনক বেশি আকৃ টট থাকে। ত ত িনল Cl প্ানন্ আংমশক ঋণাতমক (δ-) এবং H প্ানন্ আংমশক র র δ+ δ- ধোতমক (δ+) চানৈড ি সৃটটি হে: H — Cl এরান অণুনত দুটি থপাল সৃটটি হয় বলে হাইরোজেন ক্লোরাইড একটি ্ ল থপালাি সমযোজী যৌগ।","boards":"ময়মনসিংহ বোর্ড ২০২৬"},{"id":"ch5-sq29","chapter":5,"num":29,"importance":2,"question":"পারন ক্ষপায়ার যৌগ ব্যাখ্যা কর।","answer":"পানিনত (H–O–H) O পরমাণু দুটি H পরমাণুর সাথে একটি করে ইলেকট্রন বৈাড় থশোি করে। O এর তপ্ড় ৎ ঋণাতমকতা H অপেক্ষা অনেক বেশি, তাই উভয় O–H ় ববন্ধনের ইলেকট্রন বৈাড় O এর রদনক বেশি আকৃ টট হয়। িনল O পরমাণুনত আংমশক ঋণাতমক (2δ-) এবং প্রতটি H পরমাণুনত আংমশক ধোতমক (δ+) চার্জ সৃটটি হয়। অণুটি াকা হওয়ায় এই চার্জ প্শমর্ত হয় ো, তাই পানি একটি থপালাি যৌগ। আযরনক ও সমজযােী যৌগের ববভশটট য","boards":"সিলেট বোর্ড ২০২৫"},{"id":"ch5-sq30","chapter":5,"num":30,"importance":2,"question":"\"ইোনে পারনজি দ্বণীয\"– ব্যাখ্যা কর।","answer":"ইথােনলি গঠে CH -CH -O-H। এর -OH র্ূলনক O এর 3 2 তপ্ড় ৎ ঋণাতমকতা H অপেক্ষা অনেক বেশি, তাই O–H ন্ধে থপালাি; ﻿ O এ আংমশক ঋণাতমক (δ-) ও H এ আংমশক ধোতমক (δ+) চার্জ সৃটটি হয়। পানিও থপালাি যৌগ। ইথানল পানিনত বর্শানল ইথােনলি Hδ+ প্ান্ ত ্ ত ত পানির Oδ- প্ান্ দ্বারা এবং ইথােনলি Oδ- প্ান্ পানির Hδ+ প্ান্ র র র ্ ় ় দ্বারা আকৃ টট হয় (হাইরোজেন ন্ধে গঠ ি ত হে)। এই আকষডর্ণি িনল ইথােনলি অণুগুনলা পানির অণুি সাথে মর্র্শ ় ় যায়। তাই ইথানল পানিনত দ্রবণীে। ত ক","boards":"কুমিল্লা বোর্ড ২০২৪"},{"id":"ch5-sq31","chapter":5,"num":31,"importance":2,"question":"আযরনক যৌগে আন্ঃআণরবক আকষণ বে কবভশ কেন? ব্যাখ্যা কর। ় ়","answer":"আয়নিক যৌগে ধোতমক ও ঋণাতমক আয়ন মথি ত দুযরতক আকর্ষণ বলে দঢ় িান আ দধ থাকে। ৃ ্ ় ় ্ প্রতটি আয়ন চািরদক থেকে র পিীত আধানেি আয়ন দ্বারা ় ত ় পরিন টটি ত থাকে এবং অসংখয আয়ন মের্ামেকরান সুর েযত হয়ে স্ফটি ক (বকলাস) গঠে করে। িনল আয়নগুনলাি মধ্যে আকর্ষণ ল স রদক থেকে কাৈ করে; তাই ় ত আয়নিক যৌগে আন্ঃআণর ক আকর্ষণ ল অনেক বেশি।","boards":"বরিশাল বোর্ড ২০২৪"},{"id":"ch5-sq32","chapter":5,"num":32,"importance":2,"question":"C H O েেীয দ্বথণ রবদযৎ পররবহণ কজর না কেন? 12 22 11 র ু ্","answer":"র দুযৎ পরি হর্ণি জন্য দ্রবণে র ক্সচ্ছন্ (র্ুকব ) ধোতমক ও ় ় ঋণাতমক আয়ন থাকা প্নোৈে। C H O (চিনি) একটি সমযোজী যৌগ। পানিনত দ্ ীিত হলেও 12 22 11 র ় ্ ় এটি অণু ছহনসন ই থাকে, কোনো আয়নে বিভবকব হয় ো। ্ ় ় ় দ্রবণে র্ু কব আয়ন ো থাকাে C H O এর জলীয় দ্রবণ র দুযৎ র 12 22 11 র পরি হণ করে ো। ্ ্ ধ্ািব বন্ ধ ন","boards":"রাজশাহী বোর্ড ২০২৩"},{"id":"ch5-sq33","chapter":5,"num":33,"importance":2,"question":"সঞ্চরণশীে ইলেকট্রন বলতে কী বুঝায?","answer":"ধাত পরমাণু কতড ক তযাগকৃ ত বে ইলেকট্রনগুনলা কোনো রেরদিটড ট পরমাণুর অধীনে ো থেকে ধাত স্ফটি নকি পারমাণবিক ী ্ শ াসগুনলাি র্ধয তী থানে র্ুকব িান বঘািানভরা করে, তানদিনক সঞ্চিণশীল ইলেকট্রন বলে। ় ় ় ু এরা পুনিা ধাত খনণ্ডি স আয়নেি ইলেকট্রন হয়ে যায়। ধাতি তাপ ও র দুযৎ পরি াছহতা, ের্েীেতা, ঘাতসহতা ও ধাত ঔলয এই সঞ্চিণশীল ইনলক ট নেি কারণেই হয়।","boards":"কুমিল্লা বোর্ড ২০২৪"},{"id":"ch5-sq34","chapter":5,"num":34,"importance":2,"question":"ধ্াি িাপ সুপররবাহী কেন? ব্যাখ্যা কর। ু ু","answer":"ধাতনত প্চি সঞ্চিণশীল ইলেকট্রন থাকে। ধাত পানতি এক ত ্ প্ান্ উকপ্ করলে বসখােকাি সঞ্চিণশীল ইলেকট্রনগুনলা তাপশক্তি র ত গ্রহণ করে এবং এদের গরতন গ ব নড় যায়। এই দ্ুতগরতি ইলেকট্রনগুনলা অরধক তাপমানাি প্ান্ থেকে কম র র ় ় ত ত ় ্ ় ় তাপমানাি প্ানন্ি রদনক থাোন্রিত হয়ে শক্তি হয় করে রেনে যায়। ত ় ু িনল অপি প্ান্ও দ্ুত গির্ হয়, তাই ধাত তাপ সুপরি াহী। র র","boards":"বরিশাল বোর্ড ২০২৪"},{"id":"ch5-sq35","chapter":5,"num":35,"importance":2,"question":"ধ্াি রবদযৎ পররবাহী— ব্যাখ্যা কর।","answer":"র দুযৎ পরি হয়েি জন্য র্ুকবিান চলাচলকািী চারৈিতড কণা ় ত প্নোৈে। ধাত পরমাণু সর্বশেষ তনভর ইলেকট্রন তযাগ করে পারমাণবিক শ ানস পরিণত হয় এবং তযাগকৃ ত ইলেকট্রনগুনলা ্ টাইপ ভিততিক মাস্ট ার সাজেশন সঞ্চিণশীল ইলেকট্রন ছহনসন সর্গ্ ধাত খনণ্ড র্ুকবিান চলাচল র র করে। ু ত ় ধাতি দুই প্ানন্ বিভব পাথডকয প্নোগ করলে এই ইলেকট্রনগুনলা র র ত ত ় ঋণাতমক প্ান্ থেকে ধোতমক প্ানন্ি রদনক প্ াছহত হয়ে র দুযৎ র র র ু পরি হয় করে। প্চি সঞ্চিণশীল ইলেকট্রন থাকাে ধাত র দুযৎ সু পরি াহী। যোজনী বা যোজ্যতা","boards":"ঢাকা বোর্ড ২০২১"},{"id":"ch6-sq1","chapter":6,"num":1,"importance":3,"question":"অযানাোর বগ্ড পদাে বলতে কী বোঝায়? ব্যাখ্যা কর। ় ্ ত","answer":"বেস রাসায়নিক পদার্থডি র শুদধতা অতযন্ বেশি (প্রায় 99.9% বা তাি বেশি) এবং বেগুনলা রাসায়নিক বিশ্লেষণ ও গন ষণাগানি সূ পরির্ার্পি কানৈ ব্যবহার করা হয়, তানদি অযাোলাি বগ্র্ (Analytical Reagent বা AR grade) পদাথড বলে। এস পদার্থড বিৈানলি পরিমাণ খু ই েগণয এবং ব াতনলি বলন বলে উপমথত অপদ্ন যি পরিমাণ উনল্খ থাকে। যেমন: অযাোলাি বগ্র্ র ল Na CO, K Cr O ইতযারদ। এদের দিয়ে প্রমাণ দ্রবণ প্তু ত করলে 2 3 2 2 7 র র ় ় ঘেমানা সঠ ি ক পাওয়া যায়। ় ়","boards":"বরিশাল বোর্ড ২০২৬"},{"id":"ch দ্রবণে দ্ ীিত দ্ন ি পরিমাণ। তাপমানা াড় বলে দ্রবণেি কণাগুনলাি গরতশক্তি ানড় ও আন্ঃআণর ক আকর্ষণ কনর্, িনল দ্রবণ প্সারিত হয়ে আেতে র র ব নড় যায়। কিন্তু দ্ন ি পরিমাণ একই থাকে, তাই একে আেতনে দ্ন ি পরিমাণ অর্থাৎ ঘেমানা কনর্ যায়। আ াি তাপমানা কমানল আেতে কনর্ ঘেমানা ানড়। এজন্য দ্রবণেি ঘেমানা তাপমানাি উপর রেিড ি করে।","boards":"ময়মনসিংহ বোর্ড ২০২২"},{"id":"ch6-sq16","chapter":6,"num":16,"importance":2,"question":"কমাোররটি িাপমাতরার উপর রনির কজর কেন? ব্যাখ্যা কর।","answer":"নির্দিষ্ট তাপর্াযায় 1 ললটাি দ্রবণে দ্ ীিত দ্ন ি মোল র র সংখ্যানক ঐ দ্রবণেি মোলারিটি বলে। কমাোররটি S = দ্জবর কমাে সংখ্যা / দ্বর্ণের আয়তন (L) র র অর্থাৎ মোলারিটি দ্রবণেি আেতনেি উপর রেিড ি করে। তাপমানা াড় বলে দ্রবণেি আেতে ানড় কিন্তু দ্ন ি মোল সং র র ﻿ ় িনল মোলারিটি কনর্ যায়। তাই মোলারিটি তাপমানাি উপর রেিড িশীল। র র","boards":"কুমিল্লা বোর্ড ২০২২"},{"id":"ch6-sq17","chapter":6,"num":17,"importance":2,"question":"0.25 M NaOH দ্বণ বলতে কী বুঝায? ব্যাখ্যা কর। ় ূ","answer":"নির্দিষ্ট তাপর্াযায় 1 ললটাি দ্রবণে 1 মোল দ্ দ্ ীিত থাকনল র র র তানক মোলাি (1 M) দ্রবণ বলে। ় ় র 0.25 M NaOH দ্রবণ লনত ব াঝাে, নির্দিষ্ট তাপর্াযায় 1 ললটাি NaOH দ্রবণে 0.25 মোল NaOH দ্ ীিত আনছ। র র NaOH এর আণর ক ভর =23+16+1=40, তাই 1 ললটাি এ রদ্রবণে 40 × 0.25 = 10 g NaOH থাকে। যৌগে মৌলের শতকরা সংযুরি","boards":"দিনাজপুর বোর্ড ২০২২"},{"id":"ch6-sq18","chapter":6,"num":18,"importance":3,"question":"একারধ্ক যৌগের স্ে সংকেত একই হজি পাজর–বযাখ্যা থূ কর।","answer":"থল সংনকত অণুনত পরমাণুগুনলাি প্কৃ ত সংখ্যা েে, কেবল ূ র তানদি সিল অেুপাত প্কাশ করে। তাই একই মৌল দিয়ে গঠ ি ত ভিন্ন ভিন্ন যৌগে পরমাণুর অেুপাত একই হলে তানদি থল সংনকত একই িূ র র ় হয়। যেমন: ব েরৈে (C H ) ও অযামসটি ললে (C H ) উভয়ই C ও H 6 6 2 2 র ় ় 3 দিয়ে গঠ ি ত এবং C : H = 1 : 1; তাই উিনেি থল সংনকত CH। িূ 2 3 আ াি গলনকাৈ (C H O ) ও এমসটি ক এসিডের (C H O ) থল ্ ু 6 12 6 2 4 2 িূ সংনকত CH O। সুতিাং একই থল সংনকত একারধক যৌগের হনত 2 িূ পানি।","boards":"কুমিল্লা বোর্ড ২০২৪; রাজশাহী বোর্ড ২০২৩; যশোর বোর্ড ২০২২"},{"id":"ch6-sq19","chapter":6,"num":19,"importance":3,"question":"পারন গ্রাম বোর্ড ২০২৩"},{"id":"ch6-sq24","chapter":6,"num":24,"importance":2,"question":"আণরবক সংকেত স্ে সংজকজির সমান বা এর গুরণিক- থূ ব্যাখ্যা কর।","answer":"আণর ক সংনকত = (থল সংনকত), বেখানে n = আণর ক িূ n ভর / থল সংনকনতি ভর, এবং n একটি পূর্ণসংখ্যা (1, 2, 3 ...)। িূ n = 1 হলে আণর ক সংনকত থল সংনকনতি সমান, যেমন: H O, িূ 2 H SO। n \u003e 1 হলে আণর ক সংনকত থল সংনকনতি গুরণতক, 2 4 িূ যেমন: ব েরৈনেি থল সংনকত CH-বক 6 দিয়ে গুণ করলে আণর ক িূ ় ় সংনকত C H পাওয়া যায়। তাই আণর ক সংনকত থল সংনকনতি 6 6 িূ সমান বা এর গুরণতক। ় ় ় রাসায়নিক রবভতর্ব যা ও রাসায়নিক সমীকরণ Δ","boards":"চট্টগ্রাম বোর্ড ২০২২"},{"id":"ch6-sq25","chapter":6,"num":25,"importance":3,"question":"C H +O ⟶CO +H O; সমীকরণটি র সমিাকরণ 2 6 2 2 2 ব্যাখ্যা কর।","answer":"ার্ পার্শ C পরমাণু 2টি, তাই মান পার্শ CO এর আগে 2 2 সাই; ার্ পার্শ H পরমাণু 6টি, তাই H O এর আগে 3 সাই: 2 C H +O →2CO +3H O 2 6 2 2 2 এখে মান পার্শ O পরমাণু = 4 + 3 = 7টি। ার্ পার্শ 7টি O থপনত O এর আগে 7/2 সাই এবং িগন লাংশ দি কিনত সর্গ্ সর্ীকিণনক 2 2 ূ র দ্বারা গুণ করি: Δ 2C H +7O ⟶4CO +6H O 2 6 2 2 2 এখে উভয় পার্শ C = 4, H = 12 এবং O = 14টি; অর্থাৎ সর্ীকিণটি সর্তাকৃ ত। লেভমটি ং রবভতর্ ব যক","boards":"ময়মনসিংহ বোর্ড ২০২৬"},{"id":"ch6-sq26","chapter":6,"num":26,"importance":3,"question":"লেভমটি ং রবভতর্ব যকই উৎপাদজনর পরিমাণ রনধ্ারণ কজর—ব্যাখ্যা কর। ় ় ় ় ়","answer":"কোনো রাসায়নিক বিক্রিয়াে বে র মে্বেক স নচনে কম পরির্ার্ণ (সর্ীকির্ণি মোল অেুপানতি তলযায়) উপমথত থাকে এবং ় ় ় সম্পূর্ণিূর্প খিচ হয়ে যায়, তানক ললমর্টিং র মে্ব েক বলে। ় ় ় ললমর্টিং র মে্ ব েক থশষ হয়ে থগনল অপি র মে্বেক অ মশটট থাকনলও র মে্ ব ো আি চলনত পানি ো। তাই উৎপানদি পরিমাণ ললমর্টিং র মে্ ব জনকি পরির্ার্ণি উপর রেিড ি করে। 2H +O →2H O 2 2 2 যেমন: 2 mol H ও 2 mol O রেনল 2 mol H কেবল 1 mol O 2 2 2 ় এর সাথে বিক্রিয়া করে 2 mol H O উৎপন্ন করে; 1 mol O অ মশটট 2 2 টাইপ ভিত ﻿ থাকে। এখানে H ললমর্টি ং র মে্ব েক এবং এটি ই উৎপানদি (H O) 2 2 পরিমাণ রেধডািণ করে।","boards":"কুমিল্লা বোর্ড ২০২৬"},{"id":"ch6-sq27","chapter":6,"num":27,"importance":2,"question":"লেভমটি ং রবভতর্ব যক ক্ষেজক উৎপাজদর পরিমাণ দ্হসাব করা হয কেন? ব্যাখ্যা কর। ় ়","answer":"একারধক র মে্বজনকি মধ্যে বে র মে্বজনকি পরিমাণ ় ় সট েরকওমর্রত পরিমাণ থেকে কম থাকে তা ললমর্টিং র মে্ব েক। ় ় ় ় র মে্ ব যায় এটি সম্পূ ণড রেঃর্শষ হয়ে যায়। ় ় ্ ললমর্টিং র মে্ ব েক থশষ হলে অেয র মে্ব েক উদক থাকনলও আি কোনো উৎপাদ ততরি হয় ো। অর্থাৎ উৎপানদি পরিমাণ ললমর্টিং ় ্ ় র মে্ ব জনকি পরির্ার্ণি উপর রেিড িশীল। উদক র মে্বেক থেকে ছহসা করলে উৎপাদ প্কৃ নতি বচনে বেশি আসন, তাই উৎপানদি পরিমাণ ় ় ললমর্টিং র মে্ ব েক থেকে ছহসা করা হয়। উৎপাজদর শতকরা পরিমাণ দ্হসাব","boards":"কুমিল্লা বোর্ড ২০২২"},{"id":"ch6-sq28","chapter":6,"num":28,"importance":2,"question":"উৎপাজদর শতকরা পরিমাণ বলতে কী বুঝায? ব্যাখ্যা কর। ় ়","answer":"কোনো বিক্রিয়াে সর্ীকিণ থেকে ছহসা কৃ ত (তাপ্ততক) ় ় উৎপানদি তলযায় প্কৃ তপর্ক্ষ বে পরিমাণ উৎপাদ পাওয়া যায় তাি শতকরা হারনক উৎপানদি শতকরা পরিমাণ বলে। উৎপাজদর শতকরা পরিমাণ = (প্াপ্ প্কৃ ি উৎপাদ × র ত র 100)/(সমীকরণ ক্ষেজক দ্হসাবকৃ ি উৎপাদ) ় ্ ় ় র মে্ ব েক 100% র শুদধ ো হওয়ায় প্কৃ ত উৎপাদ তাপ্ততক উৎপানদি ্ র ব ় ় ় বচনে কম হয়। যেমন: 2g Mg থেকে 3.33g MgO পাওয়াি কথা, কিন্তু পাওয়া থগল 3.25g; তাই উৎপানদি শতকরা পরিমাণ = 3.25×100 = 97.6%। 3.33 কমাে","boards":"যশোর বোর্ড ২০২৫"},{"id":"ch7-sq1","chapter":7,"num":1,"importance":3,"question":"ককজরাভসজনর দহন একটি রাসায়নিক পরিবর্তন—ব্যাখ্যা কর।","answer":"বকরোমসে র ভিন্ন হাইন হাইরোকার্বনেি মর্শ্ণ। দহয়েি সময় ় ় বকরোমসে াে়ুি অক্সিজেনের সাথে বিক্রিয়া করে কার্বন ় র্াইঅক্সাইড, জলীয় বাষ্প ও তাপ উৎপন্ন করে। 2CnH n+2+(3n+1)O →2nCO +2(n+1)H O+তাপ 2 2 2 উৎপন্ন CO ও H O এর ধর্ম বকরোমসে থেকে সম্পূর্ণ ভিন্ন এবং এদের 2 2 ় ় ু থেকে বকরোমসে আি মিনি পাওয়া যায় ো। েতে পদাথড সৃটটি হয় বলে বকরোমসনেি দহয় একটি রাসায়নিক পরি তড ে। ় ়","boards":"বরিশাল বোর্ড ২০২৫; রাজশাহী বোর্ড ২০২৩"},{"id":"ch7-sq2","chapter":7,"num":2,"importance":2,"question":"কোহায মররিা পড়া একটি রাসায়নিক পরিবর্তন – ব্যাখ্যা কর। ় ়","answer":"জলীয় ববাষ্পি উপমথরতনত বলাহা াে়ুি অক্সিজেনের সাথে র মে্ ব ো করে আদ্ড বিরিক অক্সাইড বা র্রিচা উৎপন্ন করে। 4Fe+3O +2nH O→2Fe O .nH O 2 থড েুকব হয়ে যৌগ গঠে করে বসগুনলানক সংন্লষণ বিক্রিয়া বলে। যেমন: N +3H →2NH (সংন্লষণ ও সংনোৈে উভয়ই) 2 2 3 ্ 2FeCl +Cl →2FeCl (শুধু সংনোৈে) 2 2 3 ্ ় ় ় ় ছদতীে বিক্রিয়াে যৌগ (FeCl ) অংশ রেনেনছ বলে এটি সংন্লষণ 2 ় ় েে। অর্থাৎ প্নতযক সংন্লষণ বিক্রিয়াই সংনোৈে বিক্রিয়া, কিন্তু র ্ ় ় ় সকল সংনোৈে বিক্রিয়া সংন্লষণ বিক্রিয়া েে; সংন্লষণ হলো সংনোৈে বিক্রিয়াি একটি র র্শষ িূপ।","boards":"দিনাজপুর বোর্ড ২০২৩"},{"id":"ch7-sq21","chapter":7,"num":21,"importance":2,"question":"Mg+CuSO → MgSO + Cu; রবভতর্ব যাটি জি সােজফট 4 4 ় ় আযন দশক আযন– ব্যাখ্যা কর।","answer":"Mg+CuSO →MgSO +Cu 4 4 2+ 2− 2 আেরেত িূর্প: Mg +Cu +SO →Mg +SO 4 Cu এখানে Mg এর জারণ সংখ্যা 0 থেকে +2 হয়েছে (জারণ, Mg র জারক) এবং Cu এর জারণ সংখ্যা +2 থেকে 0 হয়েছে (র জারণ, Cu2+ জারক)। 2− ় ় কিন্তু SO আয়ন বিক্রিয়াি আগে ও পরে একই িূর্প থাকে এবং 4 এর চার্জ -2 অপরি রতিতড থাকে; এটি ইলেকট্রন আদাে-প্দানে অংশ ় ় ় ় বেে ো। তাই এ বিক্রিয়াে সালনিট আয়ন দশডক আয়ন। ﻿ ় ় রবথশষ ধ্রজনর রাসায়নিক রবভতর্ব যা","boards":"ঢাকা বোর্ড ২০২২"},{"id":"ch7-sq22","chapter":7,"num":22,"importance":2,"question":"সমাণুকরণ রবভতর্ব যা বলতে কী বুঝ? ব্যাখ্যা করো।","answer":"দুটি যৌগের আণর ক সংনকত একই রকুন্ গাঠরেক সংনকত ভিন্ন হলে তািা পিস্পনভর সর্াণু। একটি সর্াণু থেকে পরমাণুর ় ় পু েবিভবেড যানসি মাধ্যমে অপি একটি সর্াণু ততরভর প্মে্ব োনক ় ় ় সর্াণু কিণ বিক্রিয়া বলে। যেমন, অ্যামোনিয়ার্ সাোনেটনক তাপ ় ় রদনল তাি সর্াণু ইউরিয়া উৎপন্ন হে: তাপ NH CNO ⟶ H N-CO-NH 4 2 2 ় ় ় ়","boards":"বরিশাল বোর্ড ২০২৫"},{"id":"ch7-sq23","chapter":7,"num":23,"importance":2,"question":"সমাণুকরণ রবভতর্ব যায পরমাণুর পু নরবিনযাস ঘজট- ব্যাখ্যা কর।","answer":"তাপ NH CNO ⟶ H N-CO-NH 4 2 2 ় ় ় ় অ্যামোনিয়ার্ সাোনেট ও ইউরিয়া উিনেি আণর ক সংনকত ় ় ় ় র CH N O। বিক্রিয়াে কোনো পরমাণু যোগ হয় ো বা াদ যায় ো; 4 2 ় ু তার্পি প্রবণতান একই পরমাণুগুনলা শুধু ভিন্নিান সজ্জিত হয়ে েতে গাঠরেক সংনকনতি যৌগ ইউরিয়া ততরি করে। তাই সর্াণুকিণ ় ় র মে্ ব যায় পরমাণুর পুেবিভবেড যাস ঘনট মান। ় ় ় বাস্ব ক্ষেতরতর সংঘটি ি কজযকটি রাসায়নিক রবভতর্ব যার উদাহরণ িঁ ়","boards":"চট্টগ্রাম বোর্ড ২০২২"},{"id":"ch7-sq24","chapter":7,"num":24,"importance":3,"question":"ভপপড়া কামড় াজে িন বযবহার করা হয কেন? ব্যাখ্যা কর। ় ় িঁ","answer":"মপপড়াি র্ুর্খ ভরমর্ক এসিড (HCOOH) থাকে, ো কার্নড় ি ু ী ু থানে জ্ালা-েন্তণা সৃটটি করে। চে ক্ষারধর্মী পদাথড। ক্ষতথানে চে ি ব বিভব ্ ় লাগানল তা এসিক প্শমর্ত করে লবণ ও পানি উৎপন্ন করে, িনল জ্ালা-েন্তণা দি হয়। ব র Ca(OH) +2HCOOH→(HCOO) Ca+2H O 2 2 2","boards":"যশোর বোর্ড ২০২৫;বরিশাল বোর্ড ২০২২; সিলেট বোর্ড ২০২০"},{"id":"ch7-sq25","chapter":7,"num":25,"importance":3,"question":"কমৌমাদ্ের কামজড় র েিস্াজন িন বযবহার করা হয কেন?","answer":"বর্ৌর্াছছি হুনল এক ধিনেি এসিড থাকে, ো হুল বিাটানোি ু ু থানে জ্ালা-েন্তণা সৃটটি করে। চে একটি ক্ষারক। ক্ষতথানে চে লাগানল ি ব বিভব ় ় ় এসিড-ক্ষারক প্শর্ে বিক্রিয়াে লবণ ও পানি ততরি হয় এবং এসিডের ় ় ় ় মে্ ব ো েটট হয়। িনল জ্ালা-েন্তণা ন্ধ হয়ে যায়। ব র ় ়","boards":"যশোর বোর্ড ২০২৪; চট্টগ্রাম বোর্ড ২০২৩"},{"id":"ch7-sq26","chapter":7,"num":26,"importance":2,"question":"Cu এর দ্বযারদর েয হয না কেন? ব্যাখ্যা কর।","answer":"Cu এর দ্ যারদ াতানসি অক্সিজেনের সংস্পর্শড এনল এর পৃনঠে CuO এর একটি পাতলা আতিণ পনড়। + 2− 2Cu+O →2CuO 2 + 4 এ আতিণ বিদ করে অক্সিজেন আি বিতনভর Cu এর সংস্পর্শড ় ত আসনত পানি ো, িনল আি বিক্রিয়া ঘনট ো। এরান CuO আতিণ ় ় Cu বক িক্ষা করে, তাই Cu এর দ্ যারদি ক্ষে হয় ো। টাইপ ভিততিক মাস্ট ার সাজেশন ় ় রবভতর্ ব যার গরিজবগ বা রবভতর্ ব যার হার","boards":"ঢাকা বোর্ড ২০২২"},{"id":"ch7-sq27","chapter":7,"num":27,"importance":3,"question":"কেন রবভতর্ব যার সামযাবস্া গরিশীে সামযাবস্া হয? ব্যাখ্যা কর। ় ় ়","answer":"উির্ুখী বিক্রিয়াে সম্মখ ও প্চাৎ বিক্রিয়াি হার সমান হলে বসই অবস্থাকে রাসায়নিক সার্যা থা বলে। ি ি ় ় ় সার্যা থাে সম্মখ ও প্চাৎ উভয় বিক্রিয়া একই হানি চলনত থাকে — ি ় বে পরিমাণ র মে্ব েক উৎপানদ পরিণত হয়, ঠ ি ক বসই পরিমাণ উৎপাদ ় ় বিনে র মে্ব েক ততরি হয়। তাই ঘেমানা মথি থাকাে বিক্রিয়া থথনর্ থগনছ র্নে হলেও প্কৃ তপর্ক্ষ তা চলমান। এজন্য রাসায়নিক সার্যা থা একটি গরতশীল অবস্থা।","boards":"যশোর বোর্ড ২০২৫, ২০২৩;বরিশাল বোর্ড ২০২৩; সিলেট বোর্ড ২০২২"},{"id":"ch7-sq28","chapter":7,"num":28,"importance":3,"question":"সামযাবস্া একটি গরিময অবস্থা— ব্যাখ্যা কর। ় ় ়","answer":"উির্ুখী বিক্রিয়াে বে অবস্থাে সম্মখর্ুখী ও প্চাৎর্ুখী ি ় ় র মে্ ব োি হার সমান হয় তানক রাসায়নিক সার্যা থা বলে। N +3H ⇌2NH 2 2 3 ় ় সার্যা থাে র মে্ব েক ও উৎপানদি ঘেমানা মথি র্নে হলেও বিক্রিয়া ি ি ় ় থথনর্ যায় ো; র মে্ব েক থেকে উৎপাদ এবং উৎপাদ থেকে র মে্বেক অবিভবত একই হানি ততরি হনত থাকে। ় ় অর্থাৎ উভয় রদনকি বিক্রিয়া সমান হানি চলমান থাকে বলে সার্যা থা একটি গরতর্ে (dynamic) অবস্থা। ক ক পদাথের পরিবর্তন","boards":"চটট্গ্ার্ থ থ বোর্ড ২০২৬"},{"id":"ch8-sq1","chapter":8,"num":1,"importance":2,"question":"CaCO3 এবিভবাপীয রবজযােন একটি িাপহারী রবভতর্ব যা- ব্যাখ্যা কর। ় ় ় ়","answer":"বে বিক্রিয়াে তাপ থশারষত হয় এবং তাপ ো রদনল বিক্রিয়া ঘনট ো, তানক তাপহারী বিক্রিয়া বলে। CaCO বক উকপ্ করলে 176.8 kJ/mol তাপ থশাষণ করে এটি CaO 3 ত ় ় ও CO বত র নোরৈত হয়। 2 CaCO (s) → CaO(s)+CO (g); ΔH = +176.8kJ/mol 3 2 ত ্ ় ় এখানে উৎপানদি অিযন্িীণ শক্তি র মে্বজনকি বচনে বেশি, তাই ΔH ় ় ধোতমক। এজন্য CaCO এর তাপীে র নোৈে একটি তাপহারী 3 র মে্ ব ো। ় ্ রাসায়নিক শততিব র বযবহার","boards":"দিনাজপুর বোর্ড ২০২৫"},{"id":"ch8-sq2","chapter":8,"num":2,"importance":2,"question":"ইোনেজক জ্বালানি দ্হজসজব বযবহার করা হয কেন?","answer":"ইথানল (CH -CH -OH) একটি দাহয তিল। বকরোমসে, 3 2 ় প্র্নৈল, থপ ট বলেি র্নতা ইথানল থপাড় ানলও তাপ উৎপন্ন হে: CH -CH -OH+3O →2CO +3H O+তাপ 3 2 2 2 2 তাই ইথানলনক তাপ ইমঞ্জনে জ্ালারে ছহনসন ব্যবহার করে কলকািখাো, গাপ্ড়, র মান, ৈাহাৈ চালানো যায়। এনত ৈী া্মল জ্ালারেি উপর চাপও কনর্। টাইপ ভিততিক মাস্ট বা ﻿ 2+ এখানে Fe র জারক এবং Cu জারক। একই সাথে জারণ ও র জারণ ঘনট এবং ইনলক ট নেি আদাে-প্দাে হয়। ় ় সু তিাং (i) েং র মে্ ব োটি একটি জারণ-র জারণ (বির্ি) বিক্রিয়া।","boards":"যশোর বোর্ড ২০২০"},{"id":"ch8-sq3","chapter":8,"num":3,"importance":2,"question":"KCl িী বিভবততড় ৎ রবজ্ল ে ষয—ব্যাখ্যা কর।","answer":"বেস তপ্ড় ৎ র ন্ল ষয দ্রবণে বা গললত অবস্থাে সম্পূর্ণিূর্প ্ র ় ় ় আেরেত হয় বসগুনলা তী র তপ্ড় ৎ র ন্ল ষয। KCl একটি আয়নিক যৌগ, ্ ্ + − ় ় ় ো জলীয় দ্রবণে বা গললত অবস্থাে সম্পূর্ণিান K ও Cl আয়নে বিভব ় ় ় র নোরৈত হয় এবং এই আয়নেি মাধ্যমে র দুযৎ পরি হণ করে। KCl(aq) → K+(aq) + Cl−(aq) তাই KCl তী র তপ্ড় ৎ র ন্ল ষয। ্ ্","boards":"বরিশাল বোর্ড ২০২৫"},{"id":"ch8-sq4","chapter":8,"num":4,"importance":2,"question":"খ্াবার েবণ িী বিভবততড় ৎ রবজ্ল ে ষয পদাে- ব্যাখ্যা কর।","answer":"খা াি লবণ (NaCl) কঠ ি ে অবস্থাে র দুযৎ পরি হণ করে ো, ় ্ কািণ তখে আয়নগুনলা বকলানস আ দধ থাকে। কিন্তু গললত বা + − ূ ় ় ় ় রদ্ ীিত অবস্থাে এটি সম্পূর্ণিূর্প Na ও Cl আয়নে র নোরৈত হয় এবং আয়নেি চলাচনলি মাধ্যমে র দুযৎ পরি হণ করে। H O 2 + − NaCl(s) ⟶ Na (aq) + Cl (aq) ় ় সম্পূর্ণ আেরেত হয় বলে খা াি লবণ তী র তপ্ড় ৎ র ন্লষয। ্ ্","boards":"রাজশাহী বোর্ড ২০২৪"},{"id":"ch8-sq5","chapter":8,"num":5,"importance":2,"question":"অযাজনাডজক োরণ িততড় ৎবার বো হয কেন—ব্যাখ্যা কর।","answer":"ইলেকট্রন তযাগ করানক জারণ বলে। তপ্ড় ৎ রাসায়নিক কোনষ অযানোনর্ ধাত পরমাণু ( বা তপ্ড় ৎ র ন্ল ষয কোনষ অযাযায়ে) ইলেকট্রন তযাগ করে। Zn → Zn2+ +2e− (জারণ) বেনহত অযানোনর্ স ডদা ইলেকট্রন ৈড ে অর্থাৎ জারণ বিক্রিয়া ঘনট, ্ ় তাই অযানোর্নক জারণ তপ্ড় ৎদাি লা হয়। র সাজেশন","boards":"ময়মনসিংহ বোর্ড ২০২০"},{"id":"ch8-sq6","chapter":8,"num":6,"importance":2,"question":"\"NaOH একটি িী বিভবততড় ৎ রবজ্ল ে ষয\"— ব্যাখ্যা কর।","answer":"NaOH একটি তী র ক্ষার ও আয়নিক যৌগ। দ্রবণে বা গললত + − অবস্থাে এটি সম্পূর্ণিূর্প Na ও OH আয়নে র নোরৈত হয় এবং আয়নেি মাধ্যমে র দুযৎ পরি হণ করে। NaOH(aq) → Na+(aq) + OH−(aq) ় বেনহত NaOH সম্পূর্ণ আেরেত হয়, তাই এটি একটি তী র তপ্ড় ৎ র ন্ল ষয। ় ় রাসায়নিক রবভতর্ব যার মাধ্যজম রবদযৎ উৎপাদন ্ ্","boards":"কুমিল্লা বোর্ড ২০২০"},{"id":"ch8-sq7","chapter":8,"num":7,"importance":3,"question":"শুষি ককাজষ MnO এর কাে কী? ব্যাখ্যা কর। 2 ্ ্","answer":"শুষ্ক কোনষ MnO জারক ছহনসন কাৈ করে। অযানোনর্ Zn 2 2+ দু টি ইলেকট্রন তযাগ করে Zn হে; এই ইলেকট্রন তাি দিয়ে কার্বন দনণ্ড (ক্যাথোড) আনস। + ক্যাথোডে কাইনেি MnO ও NH ঐ ইলেকট্রন গ্রহণ করে: 2 4 + − 2NH +2MnO +2e →2NH +Mn O +H O। 4 2 3 MnO ইলেকট্রন গ্রহণ করে রেনৈ র ৈারিত হয় এবং Zn-বক ৈারিত 2 র র হনত সাহােয করে, িনল ইলেকট্রন প্ াহ তথা র দুযৎ উৎপন্ন হয়।","boards":"রাজশাহী বোর্ড ২০২৫"},{"id":"ch8-sq8","chapter":8,"num":8,"importance":2,"question":"হাইজ বাজেন ফু জযে কসজে কীভাবে রবদযৎ উৎপন্ন হয? ব্যাখ্যা কর।","answer":"হাইরোজেন িু নেল বসনলি অযানোনর্ হাইরোজেন অণু ৈারিত হয় এবং ক্যাথোডে অক্সিজেন অণু র ৈারিত হয়ে পানি উৎপন্ন করে। + − 2H →4H +4e (অযানোনর্) 2 + − O +4H +4e →2H O (ক্যাথোডে) 2 2 অযানোনর্ উৎপন্ন ইলেকট্রন াইনভর তানভর র্ধয দিয়ে ক্যাথোডে প্ াছহত হে; এই ইলেকট্রন প্ াহই র দুযৎ। এ র দুযনত গাপ্ড় পে্ র র চালানো যায়।","boards":"বরিশাল বোর্ড ২০২৪"},{"id":"ch8-sq9","chapter":8,"num":9,"importance":2,"question":"গযােিারনক ককাজষ েবণ কসি বযবহার করা হয কেন? ব্যাখ্যা কর।","answer":"গযালিারেক কোনষ অযানোনর্ ৈাির্ণি িনল অযানোর্ দ্রবণে ় ় ধোতমক আয়ন ব নড় যায় এবং ক্যাথোডে ধাত আয়ন র ৈারিত ় ় ় হওয়ায় ক্যাথোড দ্রবণে ঋণাতমক আয়ন (SO এনত দ্রবণেি আধাে রেির্পক্ষতা েটট হয়ে রকছক্ষর্ণি মধ্যে র দুযৎ − ্ ় ু প্ াহ ন্ধ হয়ে বেত। লবণ বসত থেকে Cl আয়ন অযানোর্ দ্রবণে + ় ় এবং K আয়ন ক্যাথোড দ্রবণে রগনে আধাে রেির্পক্ষতা ৈাে িার্খ এবং দুই দ্রবণেি মধ্যে সংনোগ িক্ষা করে। তাই র দুযৎ প্ াহ চালু িাখনত লবণ বসত ব্যবহার করা হয়।","boards":"যশোর বোর্ড ২০২৪"},{"id":"ch8-sq10","chapter":8,"num":10,"importance":2,"question":"গযােিারনক ককাজষ অযাজনাড ঋণাতমক কেন? ব্যাখ্যা কর।","answer":"গযালিারেক কোনষ অরধক সমে্বে ধাতি তপ্ড় ৎদাি অযানোর্ ছহনসন কাৈ করে এবং বসখানে জারণ ঘনট। যেমন বর্রেনেল কোনষ: 2+ − Zn → Zn +2e। ় ় ় ধাত পরমাণু আয়ন হয়ে দ্রবণে চনল যায়, রকুন্ তযাগকৃ ত ইলেকট্রনগুনলা তপ্ড় ৎদানি ৈর্া থাকে। িনল অযানোনর্ ইনলক ট নেি ় ্ আরধকয হয় এবং এটি ঋণাতমক চার্জ েুকব হয়। এই ইলেকট্রনই তাি ় ় দিয়ে ক্যাথোডে প্ াছহত হয়। ﻿ ় ় ় ্ রনউরলযার রবভতর্ব যা ও রবদযৎ শততিব উৎপাদন ় ় ়","boards":"বরিশাল বোর্ড ২০২০"},{"id":"ch8-sq11","chapter":8,"num":11,"importance":3,"question":"রনউরলযার ভফশন রবভতর্ব যা বলতে কী বুঝায? ় ় ় ় ় ়","answer":"বে রেউর্োি বিক্রিয়াে কোনো ড় ও িািী মৌলের ় ় ় রেউর্োস বিনে বছাট বছাট মৌলের নিউক্লিয়াসে পরিণত হয় এবং ল ল ু ্ ় ় সাথে রেউ ট ে ও প্চি শক্তি উৎপন্ন হয়, রি হয় তা ক্ষারধর্মী। ালুি প্ধাে উপাদান SiO, ো অম্ল ধর্ী ত ় অক্সাইড। িাতাে ালু রদনল SiO ক্ষারনক প্শমর্ত করে লবণ ও 2 পানি উৎপন্ন করে: SiO +2NaOH → Na SiO +H O। এনত 2 ﻿ অযানোনর্ জারণ: 2+ − Mg→Mg +2e ্ ় ক্যাথোডে র জারণ: 2+ − Fe +2e →Fe + ় ় Mg দনণ্ড উৎপন্ন ইলেকট্রন তানভর র্ধয দিয়ে Fe দনণ্ড যায়, িনল তানি ় ্ ু র দুযৎ প্ াহ সৃটটি হয় এবং াল্ জ্নল ওনঠ। লবণ বসত দুই দ্রবণেি র র তপ্ড় ৎ রেির্পক্ষতা ৈাে বির্খ র দুযৎ প্ াহ চালু িার্খ। ় ভ সু তিাং উদ্দীপকের বিক্রিয়াি মাধ্যমে র দুযৎ উৎপাদে সম্। ় ় ় মপক্সচ্ছলতা দি হয় এবং ালুকণা ঘষডণ াপ্ড় নে পা মপছনল োওো ত ় ় বিাধ করে। তাই মপক্সচ্ছল িাতাে ালু যোগ করা হয়।","boards":"কুমিল্লা বোর্ড ২০২৫"},{"id":"ch9-sq6","chapter":9,"num":6,"importance":2,"question":"Fe(OH)2 ক্ষারক, োর নয-ব্যাখ্যা কর। −","answer":"ক্ষার হওয়ার জন্য দুটি শতড : (i) OH মূলক থাকনত হন, (ii) ় ় পানিনত দ্রবণীে হনত হন। 2−। এছাড় বা CO − 3 2 ় Fe(OH) আেিনেি হাইন বািাইর্, এনত OH মূলক আনছ এবং 2 ্ 2 ় ় ় এসিডের সাথে বিক্রিয়াে লবণ ও পানি দেয়, তাই এটি ক্ষারক। ় ্ ় কিন্তু Fe(OH) পানিনত অদ্রবণীে, ছদতীে শতড পূিণ করে ো। তাই 2 র Fe(OH)2 ক্ষারক, কিন্তু ক্ষার েে।","boards":"ঢাকা বোর্ড র ২০২৫"},{"id":"ch9-sq7","chapter":9,"num":7,"importance":2,"question":"Fe(OH)2 কে ক্ষারক বো হয কেন? ব্যাখ্যা কর। 2","answer":"ধাতি অক্সাইড বা হাইন বািাইর্ ো এসিডের সাথে বিক্রিয়া করে লবণ ও পানি উৎপন্ন করে তানক ক্ষারক বলে। ় ু Fe(OH) আেিে ধাতি হাইন বািাইর্ এবং এটি এসিডের সাথে ল 2 ্ ় ় র মে্ ব ো করে লবণ ও পানি দেয়: র Fe(OH) +2HCl→FeCl +2H O 2 2 2 − তাই Fe(OH) একটি ক্ষারক। ় ় 2 3 + ় ক গা ় এসিড ও গা ় োজরর েযকারী ধ্ম ় ় ়","boards":"বরিশাল বোর্ড ২০২৫"},{"id":"ch9-sq8","chapter":9,"num":8,"importance":3,"question":"গা ় নাইটি ক এসিডজক রভঙন কবািজে রাখ্া হয কেন? ় ়","answer":"গাঢ় HNO আনলাি উপমথরতনত র নোরৈত হয়ে াদামর্ বর্ণি 3 ি নাইট্রোজেন র্াইঅক্সাইড (NO ) গ্যাস, অক্সিজেন ও পানি উৎপন্ন র 2 ি করে। 2 4 আনলা + 4HNO ⟶ 4NO +O +2H O ় 3 2 2 2 াদামর্ বা িমেে ব াতনল আনলা প্রবেশ কিনত পানি ো। তাই HNO র 3 ় ় বেে আনলানত র নোরৈত ো হয়, বসজন্য এনক াদামর্ বর্ণি ব াতনল সংিক্ষণ করা হয়। pH এর ধ্ারণা","boards":"রাজশাহী বোর্ড ২০২৫; দিনাজপুর বোর্ড ২০২৪"},{"id":"ch9-sq9","chapter":9,"num":9,"importance":2,"question":"কৃ রষথেতরতর pH এর গুরুত ব্যাখ্যা কর। ়","answer":"উলিদ পুটটি ি জন্য মাটি থেকে র ভিন্ন আয়ন ও পানি থশাষণ করে; এর জন্য মাটি ি pH 6.0 থেকে 8.0 এর মধ্যে হলে স নচনে 2 িানলা। র মাটি ি pH 3.0 এর কম বা 10 এর বেশি হলে মাটি ি উপকািী 2 3 2 ় অণুৈী র্ািা যায়। তাই মাটি ি pH কনর্ থগনল পরিমাণর্নতা চে (CaO) এবং ব নড় থগনল ় ় অ্যামোনিয়ার্ সালনিট (NH ) SO, অ্যামোনিয়ার্ িসনিট 4 2 4 টাইপ ভিততিক মাস্ট ার সাজেশন ় ় (NH ) PO সাি প্নোগ করে pH রেেন্তণ করা হয়। এরান 4 3 4 র কৃ রষর্ক্ষতরে pH িসল উৎপাদনে গুিুতপূর্ণ িমর্কা িার্খ। প্শমন রবভতর্ব যা িঁ ু","boards":"কুমিল্লা বোর্ড ব ল ২০২৪"},{"id":"ch9-sq10","chapter":9,"num":10,"importance":3,"question":"ভপপড়ার কামজড় র েি স্াজন িন োগাজনা হয কেন? িঁ","answer":"মপপড়াি কার্নড় ভরমর্ক এসিড (HCOOH) ক্ষতথানে প্রবেশ করে, িনল জ্ালা-েন্তণা হয়। ব র ু ী ু চে ক্ষারধর্মী পদাথড। ক্ষতথানে চে লাগানল তা ভরমর্ক এসিক প্শমর্ত করে লবণ ও পানি উৎপন্ন করে, িনল জ্ালা কনর্ যায়। তাই িঁ ু মপপড়াি কার্নড় ি ক্ষতথানে চে লাগানো হয়।","boards":"ময়মনসিংহ বোর্ড ২০২৫; দিনাজপুর বোর্ড ২০২৪; রাজশাহী বোর্ড ২০২৩"},{"id":"ch9-sq11","chapter":9,"num":11,"importance":3,"question":"Na CO এর েেীয দ্বণ োরীয, ব্যাখ্যা কর। ় ়","answer":"র্ৃদু এসিড ও তী র ক্ষানভর বিক্রিয়াে উৎপন্ন ল র্ণি জলীয় ় ় রদ্রবণ ক্ষারীে হয়। 2NaOH+H CO →Na CO +2H O 2 3 2 3 Na CO তী র ক্ষার NaOH ও র্ৃদু এসিড H CO এর লবণ। পানিনত 2 3 ্ 2 ূ ় দ্ ীিত করলে তী র ক্ষানভর ধর্ম প্াধােয পায় এবং দ্রবণে OH র ্ র আয়নেি আরধকয ঘনট। তাই Na CO এর জলীয় দ্রবণ ক্ষারীে (pH \u003e 2 3 7)।","boards":"চটট্গ্ার্ 2 3 র বোর্ড ২০২৫;বরিশাল বোর্ড ২০২০"},{"id":"ch9-sq12","chapter":9,"num":12,"importance":3,"question":"কমৌমাদ্ে কামড় াজে েি স্াজন িন বযবহার করা হয কেন?","answer":"বর্ৌর্াছছ কার্ড় ানল হুনলি মাধ্যমে ক্ষত থানে ভরমর্ক এসিড (HCOOH) প্রবেশ করে, িনল জ্ালার্পাড় বা হয়। ু চে বা চনেি পানি [Ca(OH) ] ক্ষারীে প্কৃ রতি। ক্ষত থানে চে 2 লাগানল তা এসিক প্শমর্ত করে লবণ ও পানি উৎপন্ন করে, িনল জ্ালার্পাড় বা কনর্ যায়। 2HCOOH+Ca(OH) →(HCOO) Ca+2H O 2","boards":"ঢাকা বোর্ড ২০২৬"},{"id":"ch9-sq13","chapter":9,"num":13,"importance":3,"question":"কমৌমাদ্ে কামড় াজে িন বযবহার করা হয কেন? ব্যাখ্যা কর।","answer":"বর্ৌর্াছছ কার্ড় ানল হুনলি মাধ্যমে তনক ভরমর্ক এসিড ় ় (HCOOH) ৈাতীে অম্ল ীে পদাথড প্রবেশ করে, িনল জ্ালার্পাড় বা ও ় ু ু যথা হয়। চে বা কললচে [Ca(OH) ] একটি ক্ষার, ো এসিক 2 প্শমর্ত করে লবণ ও পানি উৎপন্ন করে। 2HCOOH+Ca(OH) →(HCOO) Ca+2H O 2 ় ় এই প্শর্ে বিক্রিয়াি িনল এসিডের মে্বো েটট হয় এবং জ্ালার্পাড় বা ় ু কনর্ যায়। তাই বর্ৌর্াছছ কার্ড় ানল চে ব্যবহার করা হয়।","boards":"যশোর বোর্ড ২০২৬"},{"id":"ch9-sq14","chapter":9,"num":14,"importance":3,"question":"কমৌমাদ্ে কামড় াজে েিস্াজন িন বযবহার হয কেন? ব্যাখ্যা কর।","answer":"বর্ৌর্াছছ কার্ড় ানল ক্ষতথানে ভরমর্ক এসিড (মর্থােরেক এসিড, HCOOH) প্রবেশ করে, িনল জ্ালার্পাড় বা ও যথা হয়। চে পানির সংস্পর্শড ক্ষারীে Ca(OH)2 ততরি করে, ো ভরমর্ক এসিক প্শমর্ত করে লবণ ও পানি উৎপন্ন করে। 2HCOOH+Ca(OH) →(HCOO) Ca+2H O 2 ় ় ় এসিড প্শমর্ত হওয়ায় জ্ালা কনর্ যায়। তাই বর্ৌর্াছছ কার্ড় ানল ক্ষতথানে চে ব্যবহার করা হয়। ﻿ ় ় ়","boards":"র্াদ্াসা বোর্ড ২০২৬"},{"id":"ch9-sq15","chapter":9,"num":15,"importance":3,"question":"প্শমন রবভতর্ব যায একটি সাধ্ারণ উৎপাদ পারন—ব্যাখ্যা কর। ় ় ়","answer":"এসিড ও ক্ষারনকি বিক্রিয়াে লবণ ও পানি উৎপন্ন হওয়ার ় ় র মে্ ব োনক প্শর্ে বিক্রিয়া বলে। ় + − ় ় ় ় এসিড জলীয় দ্রবণে H আয়ন এবং ক্ষার OH আয়ন দেয়। + − ় ় ্ ় প্শর্নেি সময় এই H ও OH আয়ন েুকব হয়ে পানি উৎপন্ন করে। HCl+NaOH→NaCl+H O 2 ি + − H +OH →H O 2 ় ় এসিড বা ক্ষার োই বহাক ো কেন, প্রতটি প্শর্ে বিক্রিয়াে পানি র র ় ় উৎপন্ন হয়। তাই পানি প্শর্ে বিক্রিয়াি একটি সাধারণ উৎপাদ। ব","boards":"রাজশাহী বোর্ড ২০২৬"},{"id":"ch9-sq16","chapter":9,"num":16,"importance":3,"question":"পাকস্েীর অযাভসততডটি দর করজি অযানট ্াভসড কসবন ূ ্ করা হয কেন? ব্যাখ্যা করো।","answer":"পাকথলীনত অরতরিকব HCl রেঃসৃত হলে অযামসপ্র্টি বা এমসপ্র্টভর সর্সযা বদখা দেয়। ় অযানট ামসনর্ Mg(OH), Al(OH) এর র্নতা র্ৃদু ক্ষারক থাকে, ো ড 2 3 ্ অরতরিকব HCl বক প্শমর্ত করে লবণ ও
