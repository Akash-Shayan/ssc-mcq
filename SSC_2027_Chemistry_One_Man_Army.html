থেকে মাত্র একটি ইলেকট্রন কম হওয়ায় অস্থিতিশীল । তাই বাইরের s অরবিটাল থেকে একটি ইলেকট্রন d অরবিটালে স্থানান্তরিত হয়ে অধিক স্থিতিশীল d5 বিন্যাস তৈরি করে। যেমন: Cr (24) এর বিন্যাস 3d⁴ 4s² না হয়ে হয় Cr (24) : 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁵ 4s¹ এ কারণে ইলেকট্রন বিন্যাসে d4 হতে পারে না।"},{"label":"গ","question":"উদ্দীপকের B মৌলটি শনাক্ত করে পর্যায় সারণিতে অবস্থান নির্ণয় কর।","answer":"উদ্দীপকের B মৌলের একটি পরমাণুর ভর 1.992 × 10⁻²³ g। B এর পারমাণবিক ভর = একটি পরমাণুর ভর × অ্যাভোগেড্রো সংখ্যা =1.992×10⁻²³×6.02×10²³ = 11.99 ≈ 12 B মৌলে প্রোটন ও নিউট্রন সংখ্যা সমান । সুতরাং, প্রোটন সংখ্যা = নিউট্রন সংখ্যা =12/2=6 অতএব B এর পারমাণবিক সংখ্যা 6, অর্থাৎ B মৌলটি কার্বন (C)।\nC (6) : 1s² 2s² 2p² পর্যায় নির্ণয়: C এর ইলেকট্রন বিন্যাসে সর্বোচ্চ প্রধান শক্তিস্তর n = 2, তাই কার্বন ২য় পর্যায়ের মৌল। গ্রুপ নির্ণয়: C এর সর্বশেষ শক্তিস্তরে ইলেকট্রন বিন্যাস 2s² 2p², অর্থাৎ এটি p-ব্লক মৌল এবং সর্বশেষ শক্তিস্তরে মোট ইলেকট্রন 4টি। p-ব্লক মৌলের গ্রুপ নম্বর =10 + সর্বশেষ শক্তিস্তরের ইলেকট্রন সংখ্যা =10+4=14। সুতরাং B মৌলটি (কার্বন) পর্যায় সারণির ২য় পর্যায়ের ১৪ নং গ্রুপে অবস্থিত ।"},{"label":"ঘ","question":"B মৌলটি ধাতু এবং অধাতু উভয়ের সাথে যৌগ গঠন করতে পারে — কথাটি বিশ্লেষণ কর।","answer":"'গ' অংশ হতে পাই, B মৌলটি কার্বন (C)। কার্বনের যোজ্যতা স্তরে 4টি ইলেকট্রন রয়েছে ।\nC (6) : 1s² 2s² 2p² অষ্টক পূরণের জন্য কার্বন 4টি ইলেকট্রন গ্রহণ বা বর্জন উভয়ই করতে পারে না সহজে, তাই সাধারণত ইলেকট্রন শেয়ার করে। তবে অতি সক্রিয় ধাতুর সাথে বিক্রিয়ায় এটি ইলেকট্রন গ্রহণ করে ঋণাত্মক আয়ন হিসেবেও যৌগ গঠন করতে পারে। অধাতুর সাথে যৌগ গঠন কার্বন অধাতু H, O, Cl ইত্যাদির সাথে ইলেকট্রন শেয়ারের মাধ্যমে সমযোজী যৌগ গঠন করে । যেমন:\nNi, 500°C\nC+2H₂⟶CH₄\nC+O₂→CO₂\nCH₄ অণুতে C এর 4টি যোজ্যতা ইলেকট্রন চারটি H পরমাণুর সাথে চারটি ইলেকট্রন জোড় শেয়ার করে এবং CO₂ অণুতে C দুটি O পরমাণুর সাথে দুটি করে ইলেকট্রন জোড় শেয়ার করে দ্বিবন্ধন (O=C=O) গঠন করে। ধাতুর সাথে যৌগ গঠন উচ্চ তাপমাত্রায় কার্বন Ca, Al প্রভৃতি সক্রিয় ধাতুর সাথে বিক্রিয়া করে কার্বাইড যৌগ গঠন করে । এক্ষেত্রে ধাতু ইলেকট্রন ত্যাগ করে এবং কার্বন তা গ্রহণ করে। 2000°C\nCaO+3C⟶CaC₂+CO\n4Al+3C→Al₄C₃\nCaC₂ যৌগে Ca²⁺ ও C₂²⁻ আয়ন এবং Al₄C₃ যৌগে Al³⁺ ও C⁴⁻ আয়ন বিদ্যমান । সুতরাং, B মৌল অর্থাৎ কার্বন ধাতু (Ca, Al) এবং অধাতু (H, O) উভয়ের সাথেই যৌগ গঠন করতে পারে। তাই উক্তিটি যথার্থ ।"}]},{"id":"ch4-cq3","chapter":4,"num":3,"importance":3,"topic":"ইলেকট্রন বিন্যাস থেকে পর্যায় সারণিতে মৌলের অবস্থান নির্ণয়","board":"ময়মনসিংহ বোর্ড ২০২৬","stem":"মৌল প্রোটন সংখ্যা A 12 B 20 C 29 [A, B ও C প্রকৃত প্রতীক নহে]","subQuestions":[{"label":"ক","question":"স্টয়কিওমিতি কাকে বলে?","answer":"স্টয়কিওমিতি: রাসায়নিক বিক্রিয়ায় অংশগ্রহণকারী বিক্রিয়ক ও উৎপন্ন উৎপাদসমূহের মোল সংখ্যার অনুপাতকে স্টয়কিওমিতি বলে।"},{"label":"খ","question":"পরমাণুর সমস্ত ভর নিউক্লিয়াসে কেন্দ্রীভূত —ব্যাখ্যা কর।","answer":"পরমাণু মূলত তিনটি কণা দিয়ে গঠিত: প্রোটন, নিউট্রন ও ইলেকট্রন । প্রোটন ও নিউট্রন নিউক্লিয়াসে থাকে এবং ইলেকট্রন নিউক্লিয়াসের বাইরে বিভিন্ন শক্তিস্তরে ঘোরে । প্রোটনের ভর 1.673 × 10⁻²⁴ g ও নিউট্রনের ভর 1.675 × 10⁻²⁴ g, কিন্তু ইলেকট্রনের ভর মাত্র 9.11 × 10⁻²⁸ g, যা প্রোটনের ভরের প্রায় 1/1840 ভাগ। ইলেকট্রনের ভর নগণ্য হওয়ায় পরমাণুর প্রায় সমস্ত ভর নিউক্লিয়াসে থাকা প্রোটন ও নিউট্রনের ভরের সমষ্টি । তাই পরমাণুর সমস্ত ভর নিউক্লিয়াসে কেন্দ্রীভূত ।"},{"label":"গ","question":"ইলেকট্রন বিন্যাসের সাহায্যে পর্যায় সারণিতে 'C' মৌলের অবস্থান নির্ণয় কর।","answer":"উদ্দীপকের 'C' মৌলের প্রোটন সংখ্যা তথা পারমাণবিক সংখ্যা 29। সুতরাং মৌলটি কপার (Cu)। ব্যতিক্রমী ইলেকট্রন বিন্যাস অনুসারে: Cu (29) : 1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹⁰ 4s¹ (3d অরবিটাল সম্পূর্ণ পূর্ণ অবস্থায় অধিক সুস্থিত হওয়ায় 3d⁹ 4s² না হয়ে 3d¹⁰ 4s¹ হয়।)\n• পর্যায় নির্ণয়: ইলেকট্রন বিন্যাসে সর্বোচ্চ প্রধান শক্তিস্তর n = 4। সুতরাং মৌলটি চতুর্থ পর্যায়ে অবস্থিত ।\n• গ্রুপ নির্ণয়: সর্বশেষ ইলেকট্রন d অরবিটালে প্রবেশ করায় এটি d- ব্লক মৌল। d-ব্লক মৌলের গ্রুপ নম্বর = (n-1)d ও ns অরবিটালের মোট ইলেকট্রন সংখ্যা। গ্রুপ নম্বর =10+1=11 অতএব, পর্যায় সারণিতে 'C' (Cu) মৌলের অবস্থান চতুর্থ পর্যায়ের গ্রুপ-11 এ; এটি একটি অবস্থান্তর মৌল।"},{"label":"ঘ","question":"'A' ও 'B' একই ধর্ম ও বিক্রিয়া প্রদর্শন করে—পরীক্ষার সাহায্যে প্রমাণ কর।","answer":"উদ্দীপকের 'A' এর প্রোটন সংখ্যা 12, অর্থাৎ A = ম্যাগনেসিয়াম (Mg); 'B' এর প্রোটন সংখ্যা 20, অর্থাৎ B = ক্যালসিয়াম (Ca)। Mg (12) : 1s² 2s² 2p⁶ 3s² Ca (20) : 1s² 2s² 2p⁶ 3s² 3p⁶ 4s² উভয় মৌলের সর্বশেষ শক্তিস্তরে 2টি করে ইলেকট্রন (ns2) থাকায় উভয়ই গ্রুপ-2 এর মৌল তথা মৃৎক্ষার ধাতু। উভয়ই 2টি ইলেকট্রন ত্যাগ করে M²⁺ আয়ন গঠন করে, তাই এদের রাসায়নিক ধর্ম একই রকম । নিচের পরীক্ষাগুলোর মাধ্যমে তা প্রমাণ করা যায়: পরীক্ষা ১: লঘু HCl এর সাথে বিক্রিয়া দুটি টেস্টটিউবে লঘু HCl নিয়ে একটিতে Mg ও অপরটিতে Ca এর টুকরা যোগ করি । উভয় টেস্টটিউবে বুদবুদসহ গ্যাস নির্গত হয়। গ্যাসের মুখে জ্বলন্ত কাঠি ধরলে 'পপ' শব্দ করে জ্বলে ওঠে, অর্থাৎ উভয় ক্ষেত্রে H₂ গ্যাস উৎপন্ন হয়।\nMg+2HCl→MgCl₂+H₂\nCa+2HCl→CaCl₂+H₂\nপরীক্ষা ২: অক্সিজেনে দহন ও উৎপন্ন অক্সাইডের ধর্ম Mg ফিতা ও Ca কে বাতাসে পোড়ালে উভয়ই উজ্জ্বল শিখায় জ্বলে সাদা বর্ণের ক্ষারীয় অক্সাইড উৎপন্ন করে:\n2Mg+O₂→2MgO\n2Ca+O₂→2CaO\nউৎপন্ন অক্সাইডদ্বয়কে পানিতে মিশ্রিত করে লাল লিটমাস কাগজ ডুবালে উভয় ক্ষেত্রে লাল লিটমাস নীল হয়, অর্থাৎ উভয়ই ক্ষারীয় হাইড্রক্সাইড গঠন করে:\nMgO+H₂O→Mg(OH)₂\nCaO+H₂O→Ca(OH)₂\nপরীক্ষা ৩: পানির সাথে বিক্রিয়া Ca ঠান্ডা পানির সাথে এবং Mg গরম পানি বা জলীয় বাষ্পের সাথে বিক্রিয়া করে হাইড্রক্সাইড/অক্সাইড ও H₂ গ্যাস উৎপন্ন করে:\nCa+2H₂O→Ca(OH)₂+H₂\nMg+H₂O(g)→MgO+H₂\nউপরের পরীক্ষাসমূহে দেখা যায় 'A' (Mg) ও 'B' (Ca) একই ধরনের বিক্রিয়া করে একই ধরনের যৌগ (MCl₂, MO, M(OH)₂) উৎপন্ন করে। সুতরাং 'A' ও 'B' একই ধর্ম ও বিক্রিয়া প্রদর্শন করে।"}]},{"id":"ch4-cq4","chapter":4,"num":4,"importance":3,"topic":"ইলেকট্রন বিন্যাস থেকে পর্যায় সারণিতে মৌলের অবস্থান নির্ণয়","board":"সিলেট বোর্ড ২০২৩","stem":"23A, 24B, 29C [A, B, C প্রচলিত প্রতীক নয়]","subQuestions":[{"label":"ক","question":"মোল কাকে বলে?","answer":"কোনো পদার্থের যে পরিমাণ ভরকে গ্রামে প্রকাশ করলে তা ঐ পদার্থের আণবিক ভর বা পারমাণবিক ভরের সমান হয়, তাকে ঐ পদার্থের এক মোল বলে। এক মোল পদার্থে 6.023 × 10²³ টি কণা থাকে।"},{"label":"খ","question":"M/2 Na₂CO₃ দ্রবণ বলতে কী বোঝায়?","answer":"M/2 Na₂CO₃ দ্রবণ বলতে 0.5 মোলার Na₂CO₃ দ্রবণ বোঝায় । অর্থাৎ 1 লিটার (1000 mL) দ্রবণে 0.5 মোল Na₂CO₃ দ্রবীভূত আছে। Na₂CO₃ এর আণবিক ভর =2×23+12+3×16=106 তাই 1 লিটার দ্রবণে 106 × 0.5 = 53 g Na₂CO₃ দ্রবীভূত থাকে।"},{"label":"গ","question":"পর্যায় সারণিতে A মৌলের অবস্থান ইলেকট্রন বিন্যাসের সাহায্যে নির্ণয় কর।","answer":"উদ্দীপকের A এর পারমাণবিক সংখ্যা 23, তাই A হলো ভ্যানাডিয়াম (V)।\nV(23)→1s²2s²2p⁶3s²3p⁶3d³4s²\nপর্যায়: ইলেকট্রন বিন্যাসে সবচেয়ে বাইরের প্রধান শক্তিস্তর 4, তাই A ৪র্থ পর্যায়ের মৌল। গ্রুপ: সবচেয়ে বাইরের শক্তিস্তরে s অরবিটাল এবং তার আগের শক্তিস্তরে d অরবিটাল আছে । তাই নিয়ম অনুযায়ী s ও d অরবিটালের ইলেকট্রন যোগ করতে হবে। গ্রুপ = 4s এর ইলেকট্রন + 3d এর ইলেকট্রন =2+3=5 সুতরাং, A মৌলটি পর্যায় সারণির ৪র্থ পর্যায়ের গ্রুপ-5 এ অবস্থিত ।"},{"label":"ঘ","question":"B ও C মৌল দুইটির ইলেকট্রন বিন্যাস সাধারণ নিয়মের ব্যতিক্রম- বিশ্লেষণ কর।","answer":"উদ্দীপকের B এর পারমাণবিক সংখ্যা 24, তাই B হলো ক্রোমিয়াম (Cr); C এর পারমাণবিক সংখ্যা 29, তাই C হলো কপার (Cu)। সাধারণ নিয়মে (আউফবাউ নীতি) ইলেকট্রন নিম্ন শক্তির অরবিটাল থেকে ক্রমান্বয়ে উচ্চ শক্তির অরবিটালে প্রবেশ করে: 1s \u003c 2s \u003c 2p \u003c 3s \u003c 3p \u003c 4s \u003c 3d।\nB (Cr): সাধারণ নিয়মে হওয়ার কথা—\nCr(24)→1s²2s²2p⁶3s²3p⁶3d⁴4s²\nকিন্তু প্রকৃত বিন্যাস —\nCr(24)→1s²2s²2p⁶3s²3p⁶3d⁵4s¹\nঅর্ধপূর্ণ d অরবিটাল (d5) বেশি স্থিতিশীল । তাই 4s এর 1টি ইলেকট্রন 3d তে চলে গিয়ে 3d⁵ 4s¹ বিন্যাস গঠন করে।\nC (Cu): সাধারণ নিয়মে হওয়ার কথা—\nCu(29)→1s²2s²2p⁶3s²3p⁶3d⁹4s²\nকিন্তু প্রকৃত বিন্যাস —\nCu(29)→1s²2s²2p⁶3s²3p⁶3d¹⁰4s¹\nপূর্ণ d অরবিটাল (d10) বেশি স্থিতিশীল । তাই 4s এর 1টি ইলেকট্রন 3d তে গিয়ে 3d¹⁰ 4s¹ বিন্যাস গঠন করে । অর্থাৎ অধিক স্থিতিশীলতা লাভের জন্য B ও C উভয় মৌলের ইলেকট্রন বিন্যাস সাধারণ নিয়মের ব্যতিক্রম ।"}]},{"id":"ch4-cq5","chapter":4,"num":5,"importance":2,"topic":"ইলেকট্রন বিন্যাসই পর্যায় সারণির মূল ভিত্তি","board":"বরিশাল বোর্ড ২০২২","stem":"9A, 17B, 35C [এখানে, A, B ও C প্রতীকী অর্থে, প্রচলিত কোনো মৌলের প্রতীক নয়।]","subQuestions":[{"label":"ক","question":"ক্যাটায়ন কাকে বলে?","answer":"যে আয়ন ধনাত্মক চার্জযুক্ত, অর্থাৎ পরমাণু এক বা একাধিক ইলেকট্রন ত্যাগ করে যে আয়ন গঠন করে, তাকে ক্যাটায়ন বলে। যেমন- Na⁺, Mg²⁺।"},{"label":"খ","question":"Mg এর পারমাণবিক সংখ্যা 12 বলতে কী বুঝ?","answer":"Mg এর পারমাণবিক সংখ্যা 12 বলতে বোঝায় ম্যাগনেসিয়াম পরমাণুর নিউক্লিয়াসে 12টি প্রোটন আছে । পরমাণু নিরপেক্ষ বলে এর নিউক্লিয়াসের বাইরে 12টি ইলেকট্রনও আছে। ইলেকট্রন বিন্যাস: 1s² 2s² 2p⁶ 3s²। পারমাণবিক সংখ্যাই মৌলটির পরিচয় নির্দেশ করে; 12টি প্রোটনবিশিষ্ট যেকোনো পরমাণুই ম্যাগনেসিয়াম ।"},{"label":"গ","question":"উদ্দীপকের মৌল তিনটির পারমাণবিক আকারের পরিবর্তন ব্যাখ্যা কর।","answer":"উদ্দীপকের A, B ও C এর পারমাণবিক সংখ্যা যথাক্রমে 9, 17 ও 35। অর্থাৎ A = ফ্লোরিন (F), B = ক্লোরিন (Cl), C = ব্রোমিন (Br)।\nA(9): 1s² 2s² 2p⁵ → পর্যায় 2, গ্রুপ 17\nB(17): 1s² 2s² 2p⁶ 3s² 3p⁵ → পর্যায় 3, গ্রুপ 17\nC(35): 1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹⁰ 4s² 4p⁵ → পর্যায় 4, গ্রুপ 17 তিনটি মৌলই গ্রুপ-17 এর এবং উপর থেকে নিচে A, B, C ক্রমে অবস্থিত । গ্রুপে উপর থেকে নিচে নামলে প্রতি পর্যায়ে একটি করে নতুন শক্তিস্তর যুক্ত হয়। A তে 2টি, B তে 3টি এবং C তে 4টি শক্তিস্তর আছে।\nশক্তিস্তর বাড়ায় বাইরের ইলেকট্রনগুলো নিউক্লিয়াস থেকে ক্রমশ দূরে অবস্থান করে, ফলে পরমাণুর আকার বৃদ্ধি পায়। নিউক্লিয়াসের চার্জ বাড়লেও নতুন শক্তিস্তর যোগ হওয়ার প্রভাব বেশি হয়। সুতরাং পারমাণবিক আকারের ক্রম: C \u003e B \u003e A, অর্থাৎ Br \u003e Cl \u003e F।"},{"label":"ঘ","question":"\"ইলেকট্রন বিন্যাসই পর্যায় সারণির মূল ভিত্তি ।\"– উদ্দীপকের মৌলগুলোর সাহায্যে বিশ্লেষণ কর।","answer":"উদ্দীপকের মৌল তিনটি A = F(9), B = Cl(17), C = Br(35)। এদের ইলেকট্রন বিন্যাস থেকে পর্যায় সারণিতে অবস্থান নির্ণয় করা যায়: মৌল ইলেকট্রন বিন্যাস সর্বশেষ স্তর গ্রুপ (10 + s + (পর্যায়) p)\nA (F, 9) 1s² 2s² 2p⁵ 2 10+2+5 =17\nB (Cl, 17) 1s² 2s² 2p⁶ 3s² 3 10+2+5 3p⁵ =17\nC (Br, 35) 1s² 2s² 2p⁶ 3s² 4 10+2+5 3p⁶ 3d¹⁰ 4s² 4p⁵ =17 দেখা যাচ্ছে, তিনটি মৌলেরই বাইরের প্রধান শক্তিস্তরের বিন্যাস একই রকম (ns² np⁵), তাই তারা একই গ্রুপ-17 এ অবস্থান করে । আবার সর্বশেষ শক্তিস্তরের নম্বর ভিন্ন (2, 3, 4) হওয়ায় তারা ভিন্ন ভিন্ন পর্যায়ে (২য়, ৩য়, ৪র্থ) অবস্থান করে । বাইরের স্তরে 7টি ইলেকট্রন থাকায় তিনটি মৌলই 1টি ইলেকট্রন গ্রহণ করে -1 আয়ন গঠন করে এবং একই রকম রাসায়নিক ধর্ম দেখায়:\nF+e⁻→F⁻\nCl+e⁻→Cl⁻\nBr+e⁻→Br⁻\nঅর্থাৎ শুধু ইলেকট্রন বিন্যাস দেখেই মৌল তিনটির পর্যায়, গ্রুপ ও ধর্ম নির্ণয় করা যায়। সুতরাং \"ইলেকট্রন বিন্যাসই পর্যায় সারণির মূল ভিত্তি\" — উক্তিটি যথার্থ ।"}]},{"id":"ch4-cq6","chapter":4,"num":6,"importance":3,"topic":"পর্যায় সারণির কিছু ব্যতিক্রম","board":"রাজশাহী বোর্ড ২০২৫","stem":"কিছু মৌলের পারমাণবিক সংখ্যা দেয়া আছে: 4X, 22Y, 24Z, 29R [X, Y, Z, R মৌলের প্রতীক নয়। প্রতীকী অর্থে ব্যবহৃত]","subQuestions":[{"label":"ক","question":"যৌগমূলক কাকে বলে?","answer":"একাধিক মৌলের কয়েকটি পরমাণু একত্রে যুক্ত হয়ে একটি একক আয়নের মতো আচরণ করে এবং রাসায়নিক বিক্রিয়ায় অবিকৃত থেকে একটি মৌলের ন্যায় অংশগ্রহণ করে, এরূপ পরমাণুগুচ্ছকে যৌগমূলক বলে। যেমন: NH₄⁺, SO₄²⁻, NO₃⁻।"},{"label":"খ","question":"ইথিনকে অলিফিন বলা হয় কেন? ব্যাখ্যা কর।","answer":"ইথিন (CH₂=CH₂) একটি অ্যালকিন। এটি হ্যালোজেন (Cl₂, Br₂) এর সাথে যুত বিক্রিয়া করে তৈলাক্ত পদার্থ উৎপন্ন করে:\nCH₂=CH₂+Cl₂→CH₂Cl-CH₂Cl\nউৎপন্ন 1,2-ডাইক্লোরোইথেন একটি তৈলাক্ত তরল। গ্রিক শব্দ Olefiant অর্থ তেল উৎপাদনকারী (oil forming)। হ্যালোজেনের সাথে বিক্রিয়ায় তৈলাক্ত পদার্থ উৎপন্ন করে বলে ইথিনকে অলিফিন বলা হয়।"},{"label":"গ","question":"উদ্দীপকের 'X' ও 'Y' মৌলের ইলেকট্রন বিন্যাস দেখিয়ে পর্যায় সারণিতে এদের অবস্থান নির্ণয় কর।","answer":"উদ্দীপকের X (4) হলো বেরিলিয়াম (Be) এবং Y (22) হলো টাইটানিয়াম (Ti)। X (Be) এর অবস্থান\n4X(Be)→1s2 2s2\n• সর্বশেষ প্রধান শক্তিস্তর n = 2, তাই X মৌলটি ২য় পর্যায়ের মৌল।\n• সর্বশেষ ইলেকট্রন s অরবিটালে প্রবেশ করেছে, তাই এটি s-ব্লক মৌল। s-ব্লক মৌলের গ্রুপ = সর্বশেষ s অরবিটালের ইলেকট্রন সংখ্যা = 2। অতএব, X (Be) মৌলটি ২য় পর্যায়ের 2 নং গ্রুপে অবস্থিত । Y (Ti) এর অবস্থান\n22Y(Ti)→1s2 2s2 2p6 3s2 3p6 3d2 4s2\n• সর্বশেষ প্রধান শক্তিস্তর n = 4, তাই Y মৌলটি ৪র্থ পর্যায়ের মৌল ।\n• সর্বশেষ ইলেকট্রন 3d অরবিটালে প্রবেশ করেছে, তাই এটি d-ব্লক মৌল। d-ব্লক মৌলের গ্রুপ = (n-1)d এর ইলেকট্রন + ns এর ইলেকট্রন =2+2=4। অতএব, Y (Ti) মৌলটি ৪র্থ পর্যায়ের 4 নং গ্রুপে অবস্থিত ।"},{"label":"ঘ","question":"উদ্দীপকের কোন মৌল দুটি ব্যতিক্রমধর্মী ইলেকট্রনবিন্যাস প্রদর্শন করে–উত্তরের সপক্ষে যুক্তি দাও।","answer":"উদ্দীপকের Z (24) হলো ক্রোমিয়াম (Cr) এবং R (29) হলো কপার (Cu)। এ দুটি মৌল ব্যতিক্রমধর্মী ইলেকট্রন বিন্যাস প্রদর্শন করে। আউফবাউ নীতি অনুসারে ইলেকট্রন প্রথমে কম শক্তির 4s এবং পরে 3d অরবিটালে প্রবেশ করে। কিন্তু অর্ধপূর্ণ (d⁵) ও সম্পূর্ণ পূর্ণ (d¹⁰) উপশক্তিস্তর অধিক সুস্থিত; তাই 4s ও 3d এর শক্তির পার্থক্য কম হওয়ায় এই সুস্থিতি লাভের জন্য 4s থেকে 1টি ইলেকট্রন 3d তে চলে যায়।\n• Z (Cr, 24): নিয়ম অনুসারে হওয়ার কথা 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁴ 4s²; কিন্তু 3d অর্ধপূর্ণ হওয়ার জন্য প্রকৃত বিন্যাস:\n24Z(Cr)→1s2 2s2 2p6 3s2 3p6 3d5 4s1\n• R (Cu, 29): নিয়ম অনুসারে হওয়ার কথা 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁹ 4s²; কিন্তু 3d সম্পূর্ণ পূর্ণ হওয়ার জন্য প্রকৃত বিন্যাস:\n29R(Cu)→1s2 2s2 2p6 3s2 3p6 3d10 4s1\nঅপরদিকে X (Be: 1s² 2s²) ও Y (Ti: [Ar] 3d² 4s²) এর বিন্যাস সাধারণ নিয়ম মেনে চলে। সুতরাং উদ্দীপকের Z (Cr) ও R (Cu) মৌল দুটি ব্যতিক্রমধর্মী ইলেকট্রন বিন্যাস প্রদর্শন করে।"}]},{"id":"ch4-cq7","chapter":4,"num":7,"importance":3,"topic":"মৌলের পর্যায়বৃত্ত ধর্ম","board":"বরিশাল বোর্ড ২০২৬","stem":"[পর্যায় সারণির একটি খণ্ডিত অংশ। এখানে M, Q এবং R প্রতীকী অর্থে ব্যবহৃত]","diagramId":"ch4-cq7","subQuestions":[{"label":"ক","question":"তড়িৎ ঋণাত্মকতা কাকে বলে?","answer":"সমযোজী বন্ধনে আবদ্ধ দুটি পরমাণুর মধ্যে শেয়ারকৃত ইলেকট্রন যুগলকে কোনো পরমাণু নিজের দিকে আকর্ষণ করার যে ক্ষমতা, তাকে ঐ পরমাণুর তড়িৎ ঋণাত্মকতা বলে।"},{"label":"খ","question":"Mg অপেক্ষা Na এর ধাতব ধর্ম বেশি—ব্যাখ্যা কর।","answer":"Na (11) এর ইলেকট্রন বিন্যাস 2, 8, 1 এবং Mg (12) এর ইলেকট্রন বিন্যাস 2, 8, 2। উভয়ই তৃতীয় পর্যায়ের মৌল। একই পর্যায়ে বাম থেকে ডানে নিউক্লিয়াসের ধনাত্মক চার্জ বৃদ্ধি পায় এবং পারমাণবিক ব্যাসার্ধ হ্রাস পায়। Na এর ব্যাসার্ধ Mg এর চেয়ে বড় এবং এর সর্ববহিঃস্থ স্তরে মাত্র 1টি ইলেকট্রন থাকে, যার উপর নিউক্লিয়াসের আকর্ষণ কম। ফলে Na এর আয়নিকরণ শক্তি কম এবং এটি Mg এর চেয়ে সহজে ইলেকট্রন ত্যাগ করতে পারে। ইলেকট্রন ত্যাগের প্রবণতাই ধাতব ধর্ম, তাই Mg অপেক্ষা Na এর ধাতব ধর্ম বেশি।"},{"label":"গ","question":"উদ্দীপকের Q ও R এর মধ্যে কোনটির পারমাণবিক ব্যাসার্ধ বেশি? বর্ণনা কর।","answer":"অংশ থেকে পাই, R হলো ফ্লোরিন (F), যার ইলেকট্রন বিন্যাস 1s² 2s² 2p⁵। M (K) এর সক্রিয়তার কারণ K এর সর্ববহিঃস্থ স্তরে মাত্র 1টি ইলেকট্রন আছে এবং এর পারমাণবিক ব্যাসার্ধ অনেক বড়। ফলে নিউক্লিয়াস কর্তৃক এই ইলেকট্রনের উপর আকর্ষণ খুবই কম এবং K এর আয়নিকরণ শক্তি অত্যন্ত কম। তাই K খুব সহজে ইলেকট্রন ত্যাগ করে নিষ্ক্রিয় গ্যাস Ar এর বিন্যাস অর্জন করে, অর্থাৎ ইলেকট্রন ত্যাগের প্রবণতার কারণে K অত্যন্ত সক্রিয় (তীব্র বিজারক)।\nK→K⁺+e⁻\n2K+2H₂O→2KOH+H₂\nR (F) এর সক্রিয়তার কারণ F এর সর্ববহিঃস্থ স্তরে 7টি ইলেকট্রন আছে, অষ্টক পূর্ণ করতে মাত্র 1টি ইলেকট্রন প্রয়োজন । F এর আকার খুব ছোট এবং এর তড়িৎ ঋণাত্মকতা (4.0) ও ইলেকট্রন আসক্তি অত্যন্ত বেশি। তাই F খুব সহজে একটি ইলেকট্রন গ্রহণ করে নিষ্ক্রিয় গ্যাস Ne এর বিন্যাস অর্জন করে, অর্থাৎ ইলেকট্রন গ্রহণের প্রবণতার কারণে F অত্যন্ত সক্রিয় (তীব্র জারক)।\nF+e⁻→F⁻\n2K+F₂→2KF\nঅতএব, M (K) ইলেকট্রন ত্যাগের প্রবণতার কারণে এবং R (F) ইলেকট্রন গ্রহণের প্রবণতার কারণে উচ্চমাত্রায় সক্রিয় । উভয়ই অত্যন্ত সক্রিয় হলেও তাদের সক্রিয়তার কারণ ভিন্ন।"},{"label":"ঘ","question":"উদ্দীপকের M ও R এর উভয়ই উচ্চমাত্রায় সক্রিয় হলেও সক্রিয়তার কারণ ভিন্ন—বিশ্লেষণ কর।","answer":"উদ্দীপকের M চতুর্থ পর্যায়ের গ্রুপ 1 এ অবস্থিত, তাই M হলো পটাসিয়াম (K), যার ইলেকট্রন বিন্যাস 1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹।"}]},{"id":"ch4-cq8","chapter":4,"num":8,"importance":3,"topic":"মৌলের পর্যায়বৃত্ত ধর্ম","board":"চট্টগ্রাম বোর্ড ২০২৬","stem":"মৌল পর্যায় গ্রুপ X 2 2 Q 2 14 Y 3 2 Z 4 2 [এখানে X, Q, Y ও Z প্রতীকী অর্থে ব্যবহৃত ।]","subQuestions":[{"label":"ক","question":"মুদ্রাধাতু কাকে বলে?","answer":"মুদ্রাধাতু: পর্যায় সারণির গ্রুপ-11 এর মৌল কপার (Cu), সিলভার (Ag) ও গোল্ড (Au) প্রাচীনকাল থেকে মুদ্রা তৈরিতে ব্যবহৃত হতো বলে এদেরকে মুদ্রাধাতু বলে।"},{"label":"খ","question":"ইথেন অণুর গঠন ব্যাখ্যা কর।","answer":"ইথেনের আণবিক সংকেত C₂H₆ এবং গাঠনিক সংকেত CH₃-CH₃।\nC (6) : 2, 4 ; H (1) : 1 প্রতিটি C পরমাণুর সর্ববহিঃস্থ স্তরে 4টি ইলেকট্রন থাকে। প্রতিটি C পরমাণু 3টি H পরমাণুর সাথে 1টি করে ইলেকট্রন শেয়ার করে 3টি C-H বন্ধন এবং অপর C পরমাণুর সাথে 1 জোড়া ইলেকট্রন শেয়ার করে 1টি C-C বন্ধন গঠন করে । ফলে প্রতিটি C অষ্টক এবং প্রতিটি H দুই-এর নিয়ম পূর্ণ করে। ইথেন অণুতে মোট 7টি সমযোজী একক বন্ধন (6টি C-H ও 1টি C-C) থাকে।"},{"label":"গ","question":"'Q' মৌলটির 1টি পরমাণুর ভর নির্ণয় কর।","answer":"উদ্দীপকের Q মৌলটি দ্বিতীয় পর্যায়ের গ্রুপ-14 এ অবস্থিত । সুতরাং এর ইলেকট্রন বিন্যাস 1s² 2s² 2p² এবং পারমাণবিক সংখ্যা 6; অর্থাৎ Q হলো কার্বন (C)। কার্বনের পারমাণবিক ভর 12। 1 mol কার্বন অর্থাৎ 6.02 × 10²³ টি C পরমাণুর ভর = 12 g\n∴ 1টি C পরমাণুর ভর =12/(6.02×10²³)g =1.993×10⁻²³g সুতরাং Q মৌলটির 1টি পরমাণুর ভর 1.993 × 10⁻²³ g।"},{"label":"ঘ","question":"X, Y এবং Z মৌল তিনটির আয়নিকরণ শক্তির তুলনা কর।","answer":"উদ্দীপকের X, Y ও Z তিনটি মৌলই গ্রুপ-2 এর মৌল এবং যথাক্রমে দ্বিতীয়, তৃতীয় ও চতুর্থ পর্যায়ে অবস্থিত । সুতরাং X হলো বেরিলিয়াম (Be), Y হলো ম্যাগনেসিয়াম (Mg) এবং Z হলো ক্যালসিয়াম (Ca)। Be (4) : 1s² 2s² Mg (12) : 1s² 2s² 2p⁶ 3s² Ca (20) : 1s² 2s² 2p⁶ 3s² 3p⁶ 4s² গ্যাসীয় অবস্থায় কোনো মৌলের 1 mol পরমাণু থেকে 1 mol ইলেকট্রন অপসারণ করে 1 mol ধনাত্মক আয়নে পরিণত করতে যে শক্তির প্রয়োজন তাকে আয়নিকরণ শক্তি বলে। একই গ্রুপে উপর থেকে নিচে শক্তিস্তরের সংখ্যা বাড়ে । Be এর শক্তিস্তর 2টি, Mg এর 3টি এবং Ca এর 4টি। শক্তিস্তর বাড়ার ফলে পরমাণুর আকার বাড়ে এবং সর্ববহিঃস্থ ইলেকট্রনের উপর নিউক্লিয়াসের আকর্ষণ কমে যায়; তাছাড়া অভ্যন্তরীণ স্তরের ইলেকট্রনগুলোর আবরণী প্রভাবও বাড়ে । ফলে সর্ববহিঃস্থ স্তর থেকে ইলেকট্রন সরাতে Be এর ক্ষেত্রে সবচেয়ে বেশি এবং Ca এর ক্ষেত্রে সবচেয়ে কম শক্তি লাগে। মৌল শক্তিস্তর সংখ্যা প্রথম আয়নিকরণ শক্তি (kJ/mol) X (Be) 2 899 Y (Mg) 3 738 Z (Ca) 4 590 সুতরাং মৌল তিনটির আয়নিকরণ শক্তির ক্রম: X \u003e Y \u003e Z অর্থাৎ Be \u003e Mg \u003e Ca।"}]},{"id":"ch4-cq9","chapter":4,"num":9,"importance":3,"topic":"মৌলের পর্যায়বৃত্ত ধর্ম","board":"কুমিল্লা বোর্ড ২০২৬","stem":"A, B ও C তিনটি মৌল যারা পর্যায় সারণির তৃতীয় পর্যায়ে অবস্থিত এবং যাদের যোজ্যতা ইলেকট্রন সংখ্যা যথাক্রমে 1, 2 ও 4। [এখানে A, B এবং C প্রতীকী অর্থে, প্রচলিত কোনো মৌলের প্রতীক নয়।]","subQuestions":[{"label":"ক","question":"স্থূল সংকেত কাকে বলে?","answer":"স্থূল সংকেত: যে সংকেত দ্বারা কোনো যৌগের অণুতে উপস্থিত বিভিন্ন মৌলের পরমাণুগুলোর সংখ্যার সরলতম অনুপাত প্রকাশ করা হয়, তাকে স্থূল সংকেত বলে। যেমন: গ্লুকোজের (C₆H₁₂O₆) স্থূল সংকেত CH₂O।"},{"label":"খ","question":"কোন মডেলকে নিউক্লিয়ার মডেল বলা হয় এবং কেন? ব্যাখ্যা কর।","answer":"রাদারফোর্ডের পরমাণু মডেলকে নিউক্লিয়ার মডেল বলা হয়। আলফা কণা বিচ্ছুরণ পরীক্ষার ভিত্তিতে রাদারফোর্ড প্রস্তাব করেন যে পরমাণুর কেন্দ্রে অতি ক্ষুদ্র ধনাত্মক চার্জযুক্ত একটি ভারী অংশ (নিউক্লিয়াস) আছে, যেখানে পরমাণুর প্রায় সমস্ত ভর কেন্দ্রীভূত থাকে; আর ইলেকট্রনগুলো নিউক্লিয়াসকে কেন্দ্র করে ঘুরতে থাকে। এই মডেলে প্রথম নিউক্লিয়াসের ধারণা দেওয়া হয় এবং পরমাণুর গঠন নিউক্লিয়াসকে কেন্দ্র করে ব্যাখ্যা করা হয়, তাই একে নিউক্লিয়ার মডেল বলা হয়।"},{"label":"গ","question":"B মৌলের পাঁচটি পরমাণুর ভর 1.99 × 10⁻²² g হলে এর আপেক্ষিক পারমাণবিক ভর নির্ণয় কর।","answer":"তৃতীয় পর্যায়ের যে মৌলের যোজ্যতা ইলেকট্রন 2, তার ইলেকট্রন বিন্যাস 1s² 2s² 2p⁶ 3s²; অর্থাৎ B হলো ম্যাগনেসিয়াম (Mg)। B এর 5টি পরমাণুর ভর =1.99×10⁻²²g B এর 1টি পরমাণুর ভর =(1.99×10⁻²²)/5g=3.98×10⁻²³g আমরা জানি, একটি C-12 পরমাণুর ভর =1.99×10⁻²³g C-12 পরমাণুর ভরের 1/12 অংশ =(1.99×10⁻²³)/12g=1.66× 10⁻²⁴g আপেক্ষিক পারমাণবিক ভর = (একটি B পরমাণুর ভর)/(C-12 পরমাণুর ভরের 1/12 অংশ) =(3.98×10⁻²³g)/(1.66×10⁻²⁴g) = 23.98 ≈ 24 অতএব, B মৌলের (Mg) আপেক্ষিক পারমাণবিক ভর 24 (প্রায়)।"},{"label":"ঘ","question":"উদ্দীপকের A, B ও C এর আয়নিকরণ শক্তির ক্রম বিশ্লেষণ কর।","answer":"উদ্দীপকের মৌলগুলো তৃতীয় পর্যায়ের এবং যোজ্যতা ইলেকট্রন যথাক্রমে 1, 2 ও 4 হওয়ায় — মৌল ইলেকট্রন বিন্যাস প্রকৃত মৌল গ্রুপ A 1s² 2s² 2p⁶ সোডিয়াম (Na) 1 3s¹ B 1s² 2s² 2p⁶ ম্যাগনেসিয়াম (Mg) 2 3s² C 1s² 2s² 2p⁶ সিলিকন (Si) 14 3s² 3p² গ্যাসীয় অবস্থায় কোনো মৌলের এক মোল পরমাণু থেকে এক মোল ইলেকট্রন অপসারণ করে এক মোল একক ধনাত্মক আয়নে পরিণত করতে যে শক্তি প্রয়োজন হয়, তাকে আয়নিকরণ শক্তি বলে। একই পর্যায়ে বাম থেকে ডানে গেলে প্রোটন সংখ্যা তথা নিউক্লিয়াসের ধনাত্মক চার্জ বাড়ে, কিন্তু ইলেকট্রন একই শক্তিস্তরে যুক্ত হয়। ফলে নিউক্লিয়াস কর্তৃক সর্বশেষ স্তরের ইলেকট্রনের উপর আকর্ষণ বাড়ে এবং পরমাণুর আকার ছোট হয়। তাই ইলেকট্রন সরাতে বেশি শক্তি লাগে, অর্থাৎ আয়নিকরণ শক্তি বাড়ে ।\n• A (Na): প্রোটন সংখ্যা 11, আকার সবচেয়ে বড়; 3s¹ ইলেকট্রনটি সবচেয়ে সহজে ত্যাগ করে Na⁺ হয়। তাই আয়নিকরণ শক্তি সবচেয়ে কম।\n• B (Mg): প্রোটন সংখ্যা 12, আকার Na অপেক্ষা ছোট এবং 3s² অরবিটাল পূর্ণ (স্থিতিশীল)। তাই আয়নিকরণ শক্তি Na অপেক্ষা বেশি।\n• C (Si): প্রোটন সংখ্যা 14, আকার সবচেয়ে ছোট; নিউক্লিয়াসের আকর্ষণ সবচেয়ে বেশি। তাই আয়নিকরণ শক্তি সবচেয়ে বেশি।\nNa(g)→Na⁺(g)+e⁻\nMg(g)→Mg⁺(g)+e⁻\nSi(g)→Si⁺(g)+e⁻\nসুতরাং আয়নিকরণ শক্তির ক্রম: A \u003c B \u003c C, অর্থাৎ Na \u003c Mg \u003c Si।"}]},{"id":"ch4-cq10","chapter":4,"num":10,"importance":3,"topic":"মৌলের পর্যায়বৃত্ত ধর্ম","board":"ঢাকা বোর্ড ২০২৬","stem":"নিম্নোক্ত সারণিটি আধুনিক পর্যায় সারণির একটি অংশ নির্দেশ করে :\nশ্রেণি→ / 1 2 14 17\nপর্যায়↓ 2 D X 3 A B Y A, B, D, X ও Y প্রচলিত অর্থ বহন করে না।","subQuestions":[{"label":"ক","question":"আইসোটোপ কী?","answer":"যেসব পরমাণুর প্রোটন সংখ্যা সমান কিন্তু ভরসংখ্যা ভিন্ন (অর্থাৎ নিউট্রন সংখ্যা ভিন্ন), তাদেরকে পরস্পরের আইসোটোপ বলে। যেমন: হাইড্রোজেনের আইসোটোপ ¹H, ²H ও ³H।"},{"label":"খ","question":"CaCl₂ একটি উচ্চ গলনাঙ্কবিশিষ্ট যৌগ—ব্যাখ্যা কর।","answer":"CaCl₂ একটি আয়নিক যৌগ। Ca পরমাণু দুটি ইলেকট্রন ত্যাগ করে Ca²⁺ এবং দুটি Cl পরমাণু একটি করে ইলেকট্রন গ্রহণ করে Cl⁻ আয়নে পরিণত হয়।\nCa²⁺+2Cl⁻→CaCl₂\nকঠিন অবস্থায় CaCl₂ এর কেলাসে অসংখ্য Ca²⁺ ও Cl⁻ আয়ন শক্তিশালী স্থির বৈদ্যুতিক আকর্ষণ বল দ্বারা ত্রিমাত্রিকভাবে দৃঢ়ভাবে আবদ্ধ থাকে। এ আকর্ষণ বল ভাঙতে প্রচুর তাপশক্তির প্রয়োজন হয়। তাই CaCl₂ এর গলনাঙ্ক উচ্চ (প্রায় 772°C)।"},{"label":"গ","question":"উপযুক্ত চিত্রের সাহায্যে উদ্দীপকের DY₄ যৌগে পরমাণুসমূহের বন্ধন গঠন প্রক্রিয়া ব্যাখ্যা কর।","answer":"উদ্দীপকের সারণি অনুযায়ী D মৌলটি ২য় পর্যায়ের গ্রুপ-14 এ অবস্থিত । সুতরাং D হলো কার্বন (C), পারমাণবিক সংখ্যা 6। আবার Y মৌলটি ৩য় পর্যায়ের গ্রুপ-17 এ অবস্থিত । সুতরাং Y হলো ক্লোরিন (Cl), পারমাণবিক সংখ্যা 17। অতএব DY₄ যৌগটি হলো কার্বন টেট্রাক্লোরাইড (CCl₄)।\nC (6) : 1s² 2s² 2p² (যোজ্যতা ইলেকট্রন 4টি) Cl (17) : 1s² 2s² 2p⁶ 3s² 3p⁵ (যোজ্যতা ইলেকট্রন 7টি) C পরমাণুর অষ্টক পূরণে আরও 4টি ইলেকট্রন এবং প্রতিটি Cl পরমাণুর অষ্টক পূরণে 1টি ইলেকট্রন প্রয়োজন । তাই C পরমাণু তার 4টি যোজ্যতা ইলেকট্রনের প্রতিটি 4টি Cl পরমাণুর প্রত্যেকের 1টি করে ইলেকট্রনের সাথে শেয়ার করে 4টি ইলেকট্রন যুগল তৈরি করে। ফলে 4টি C-Cl একক সমযোজী বন্ধন গঠিত হয়। চিত্র (ডট-ক্রস চিত্রের বর্ণনা; × = C এর ইলেকট্রন , • = Cl এর ইলেকট্রন)\n• কেন্দ্রীয় C পরমাণুর চারদিকে (উপরে, নিচে, ডানে ও বামে) চারটি Cl পরমাণু থাকে ।\n• প্রতিটি C-Cl বন্ধনের স্থানে একটি করে ×• ইলেকট্রন যুগল আঁকতে হয় (মোট 4টি শেয়ারকৃত যুগল)।\n• প্রতিটি Cl পরমাণুর চারপাশে আরও 3 জোড়া (6টি) • ইলেকট্রন অবন্ধনী যুগল হিসেবে দেখাতে হয়।\nC (××××) + 4 Cl (•••••••) → CCl₄ (চারটি ×• শেয়ারকৃত যুগল)\nগাঠনিক সংকেত: কেন্দ্রীয় C পরমাণুর সাথে চারটি Cl পরমাণু চারটি C-Cl একক বন্ধন দ্বারা যুক্ত, যা ঘনীভূত রূপে লেখা যায়: Cl-C(Cl)₂-Cl বন্ধন গঠনের পর C পরমাণুর সর্ববহিঃস্থ স্তরে 8টি ইলেকট্রন (নিয়নের মতো) এবং প্রতিটি Cl পরমাণুর সর্ববহিঃস্থ স্তরে 8টি ইলেকট্রন (আর্গনের মতো) হয়। এভাবে ইলেকট্রন শেয়ারের মাধ্যমে প্রতিটি পরমাণু অষ্টক পূর্ণ করে স্থিতিশীল CCl₄ অণু গঠন করে। অতএব DY₄ একটি সমযোজী যৌগ।"},{"label":"ঘ","question":"“পর্যায় সারণিতে আয়নীকরণ শক্তি ও পারমাণবিক ব্যাসার্ধ বিপরীতক্রমে পরিবর্তিত হয়”—উদ্দীপকের A, B এবং Y মৌলের আলোকে বিশ্লেষণ কর।","answer":"উদ্দীপকের সারণি অনুযায়ী A, B ও Y তিনটি মৌলই ৩য় পর্যায়ের । A গ্রুপ-1 এ থাকায় এটি সোডিয়াম (Na, 11), B গ্রুপ-2 এ থাকায় এটি ম্যাগনেসিয়াম (Mg, 12) এবং Y গ্রুপ-17 এ থাকায় এটি ক্লোরিন (Cl, 17)। Na (11) : 1s² 2s² 2p⁶ 3s¹ Mg (12) : 1s² 2s² 2p⁶ 3s² Cl (17) : 1s² 2s² 2p⁶ 3s² 3p⁵ পারমাণবিক ব্যাসার্ধ একই পর্যায়ে বাম থেকে ডানে গেলে শক্তিস্তরের সংখ্যা একই থাকে (এখানে তিনটি), কিন্তু প্রোটন সংখ্যা তথা নিউক্লিয়াসের ধনাত্মক চার্জ বৃদ্ধি পায়। ফলে সর্ববহিঃস্থ স্তরের ইলেকট্রনের প্রতি নিউক্লিয়াসের আকর্ষণ বাড়ে এবং ইলেকট্রন মেঘ সংকুচিত হয়। তাই পারমাণবিক ব্যাসার্ধ কমে। পারমাণবিক ব্যাসার্ধ : A (Na) \u003e B (Mg) \u003e Y (Cl) আয়নীকরণ শক্তি গ্যাসীয় অবস্থায় কোনো মৌলের এক মোল বিচ্ছিন্ন পরমাণু থেকে এক মোল ইলেকট্রন অপসারণ করে এক মোল একক ধনাত্মক আয়নে পরিণত করতে প্রয়োজনীয় শক্তিকে আয়নীকরণ শক্তি বলে। পরমাণুর আকার যত ছোট হয়, সর্ববহিঃস্থ ইলেকট্রনের উপর নিউক্লিয়াসের আকর্ষণ তত বেশি হয় এবং ইলেকট্রন অপসারণে তত বেশি শক্তি লাগে । আয়নীকরণ শক্তি : A (Na) \u003c B (Mg) \u003c Y (Cl) মৌল পারমাণবিক ব্যাসার্ধ ১ম আয়নীকরণ শক্তি (pm) (kJ/mol)\nA (Na) 186 496\nB (Mg) 160 738 Y (Cl) 99 1251 দেখা যাচ্ছে, A থেকে Y এর দিকে পারমাণবিক ব্যাসার্ধ ক্রমশ কমেছে, অপরদিকে আয়নীকরণ শক্তি ক্রমশ বেড়েছে । অর্থাৎ যে মৌলের পারমাণবিক ব্যাসার্ধ সবচেয়ে বেশি (Na), তার আয়নীকরণ শক্তি সবচেয়ে কম এবং যার ব্যাসার্ধ সবচেয়ে কম (Cl), তার আয়নীকরণ শক্তি সবচেয়ে বেশি। সুতরাং, পর্যায় সারণিতে আয়নীকরণ শক্তি ও পারমাণবিক ব্যাসার্ধ বিপরীতক্রমে পরিবর্তিত হয়—উক্তিটি উদ্দীপকের A, B ও Y মৌলের ক্ষেত্রে যথার্থ ।"}]},{"id":"ch4-cq11","chapter":4,"num":11,"importance":3,"topic":"মৌলের পর্যায়বৃত্ত ধর্ম","board":"যশোর বোর্ড ২০২৬","stem":"প্রেক্ষাপট-১ :\nপ্রেক্ষাপট-২ :\nমৌল পারমাণবিক ভর X 7 Y 23 Z 39 [এখানে X, Y এবং Z প্রচলিত মৌলের প্রতীক নয়]","subQuestions":[{"label":"ক","question":"পারমাণবিক বর্ণালী কী?","answer":"কোনো মৌলের পরমাণুর ইলেকট্রন উচ্চ শক্তিস্তর থেকে নিম্ন শক্তিস্তরে স্থানান্তরের সময় নির্দিষ্ট তরঙ্গদৈর্ঘ্যের যে আলো বিকিরণ করে, তা বর্ণালীবীক্ষণ যন্ত্রে কতকগুলো নির্দিষ্ট রেখা হিসেবে দেখা যায়; একে পারমাণবিক বর্ণালী বলে।"},{"label":"খ","question":"পর্যায় সারণিতে হাইড্রোজেনের অবস্থান ব্যতিক্রম কেন? ব্যাখ্যা কর।","answer":"হাইড্রোজেনের (1s1) সর্ববহিঃস্থ স্তরে একটি ইলেকট্রন থাকায় এটি ক্ষার ধাতুর মতো একটি ইলেকট্রন ত্যাগ করে H⁺ আয়ন গঠন করে এবং +1 যোজনী দেখায় । তাই একে গ্রুপ-1 এ রাখা যায়। আবার হাইড্রোজেন হ্যালোজেনের মতো একটি ইলেকট্রন গ্রহণ করে H⁻ আয়ন গঠন করে, দ্বিপরমাণুক অণু (H₂) গঠন করে এবং অধাতু । তাই একে গ্রুপ-17 এও রাখা যায়। হাইড্রোজেন গ্রুপ-1 ও গ্রুপ-17 উভয় গ্রুপের মৌলের সাথে কিছু ধর্মে মিল আবার কিছু ধর্মে অমিল দেখায় । এ কারণে পর্যায় সারণিতে হাইড্রোজেনের অবস্থান ব্যতিক্রমধর্মী ।"},{"label":"গ","question":"প্রেক্ষাপট-১ এ উল্লিখিত পরমাণু যদি 700 nm তরঙ্গদৈর্ঘ্যের আলো বিকিরণ করে, তাহলে বিকিরিত শক্তির পরিমাণ কত? নির্ণয় কর।","answer":"প্রেক্ষাপট-১ এ পরমাণুর ইলেকট্রন n = 2 শক্তিস্তর থেকে n = 1 শক্তিস্তরে স্থানান্তরিত হয়ে শক্তি বিকিরণ করে । বিকিরিত শক্তি, E = hν = hc/λ\nএখানে, প্লাঙ্কের ধ্রুবক, h=(6.626×10⁻³⁴ m²kg)/s(Js) আলোর বেগ, c=3×108m/s তরঙ্গদৈর্ঘ্য, λ =700nm=700×10⁻⁹m=7×10⁻⁷m E=(6.626×10⁻³⁴×3×108)/(7×10⁻⁷)J =(19.878×10⁻²⁶)/(7×10⁻⁷)J =2.84×10⁻¹⁹J অতএব, বিকিরিত শক্তির পরিমাণ 2.84 × 10⁻¹⁹ J।"},{"label":"ঘ","question":"প্রেক্ষাপট-২ এর মৌলগুলোর আয়নিকরণ শক্তির ক্রম বিশ্লেষণ কর।","answer":"প্রেক্ষাপট-২ এর X, Y ও Z মৌলের পারমাণবিক ভর যথাক্রমে 7, 23 ও 39। সুতরাং মৌলগুলো যথাক্রমে লিথিয়াম (Li), সোডিয়াম (Na) ও পটাশিয়াম (K)। মৌল পারমাণবিক ইলেকট্রন পর্যায় গ্রুপ সংখ্যা বিন্যাস X (Li) 3 1s² 2s¹ 2 1 Y (Na) 11 1s² 2s² 2p⁶ 3 1 3s¹ Z (K) 19 1s² 2s² 2p⁶ 4 1 3s² 3p⁶ 4s¹ অর্থাৎ X, Y, Z তিনটিই পর্যায় সারণির গ্রুপ-1 এর মৌল (ক্ষার ধাতু)। গ্যাসীয় অবস্থায় কোনো মৌলের এক মোল পরমাণু থেকে এক মোল ইলেকট্রন অপসারণ করে এক মোল ধনাত্মক আয়নে পরিণত করতে যে শক্তি প্রয়োজন হয়, তাকে আয়নিকরণ শক্তি বলে।\nX(g)→X⁺(g)+e⁻\nএকই গ্রুপে উপর থেকে নিচে নামলে শক্তিস্তরের সংখ্যা বাড়ে । Li এর যোজ্যতা ইলেকট্রন ২য় শক্তিস্তরে, Na এর ৩য় শক্তিস্তরে এবং K এর ৪র্থ শক্তিস্তরে অবস্থিত । ফলে পরমাণুর আকার Li \u003c Na \u003c K ক্রমে বাড়ে এবং সর্ববহিঃস্থ ইলেকট্রন নিউক্লিয়াস থেকে ক্রমশ দূরে অবস্থান করে। তাছাড়া ভেতরের শক্তিস্তরগুলোর ইলেকট্রন নিউক্লিয়াসের আকর্ষণকে আড়াল (স্ক্রিনিং) করে। তাই নিচের দিকে সর্ববহিঃস্থ ইলেকট্রনের উপর নিউক্লিয়াসের কার্যকর আকর্ষণ কমে যায় এবং ইলেকট্রনটি সরাতে কম শক্তি লাগে। Li এর যোজ্যতা ইলেকট্রন নিউক্লিয়াসের সবচেয়ে কাছে থাকায় তা সরাতে সবচেয়ে বেশি শক্তি লাগে, আর K এর যোজ্যতা ইলেকট্রন সবচেয়ে দূরে থাকায় সবচেয়ে কম শক্তি লাগে। সুতরাং মৌলগুলোর আয়নিকরণ শক্তির ক্রম: X (Li) \u003e Y (Na) \u003e Z (K)।"}]},{"id":"ch4-cq12","chapter":4,"num":12,"importance":3,"topic":"মৌলের পর্যায়বৃত্ত ধর্ম","board":"যশোর বোর্ড ২০২৬","stem":"মৌল পারমাণবিক সংখ্যা M 9 N 12 O 16 P 20 [এখানে M, N, O এবং P প্রচলিত মৌলের প্রতীক নয়]","subQuestions":[{"label":"ক","question":"ভরসংখ্যা কী?","answer":"কোনো পরমাণুর নিউক্লিয়াসে উপস্থিত প্রোটন ও নিউট্রনের মোট সংখ্যাকে ঐ পরমাণুর ভরসংখ্যা বলে।"},{"label":"খ","question":"2d অরবিটাল সম্ভব নয় কেন? ব্যাখ্যা কর।","answer":"কোনো প্রধান শক্তিস্তর n এর জন্য সহকারী কোয়ান্টাম সংখ্যা l এর মান 0 থেকে (n − 1) পর্যন্ত হয়। l = 0, 1, 2, 3 হলে যথাক্রমে s, p, d, f অরবিটাল হয়। দ্বিতীয় শক্তিস্তরে n = 2, তাই l = 0 ও 1, অর্থাৎ শুধু 2s ও 2p অরবিটাল থাকে । d অরবিটালের জন্য l = 2 প্রয়োজন, যা n = 2 এর ক্ষেত্রে সম্ভব নয় (l সর্বোচ্চ 1)। তাই 2d অরবিটাল সম্ভব নয়; d অরবিটাল তৃতীয় শক্তিস্তর থেকে শুরু হয়।"},{"label":"গ","question":"PM₂ যৌগের গঠন প্রক্রিয়া চিত্রসহ ব্যাখ্যা কর।","answer":"P এর পারমাণবিক সংখ্যা 20, তাই P হলো ক্যালসিয়াম (Ca); M এর পারমাণবিক সংখ্যা 9, তাই M হলো ফ্লোরিন (F)। সুতরাং PM₂ যৌগটি হলো ক্যালসিয়াম ফ্লোরাইড (CaF₂)। Ca (20) : 1s² 2s² 2p⁶ 3s² 3p⁶ 4s² (2, 8, 8, 2) F (9) : 1s² 2s² 2p⁵ (2, 7) Ca এর সর্ববহিঃস্থ স্তরে 2টি ইলেকট্রন থাকায় এটি 2টি ইলেকট্রন ত্যাগ করে আর্গনের (2, 8, 8) মতো স্থিতিশীল বিন্যাস অর্জন করে এবং Ca²⁺ ক্যাটায়নে পরিণত হয়। অপরদিকে প্রতিটি F পরমাণুর সর্ববহিঃস্থ স্তরে 7টি ইলেকট্রন থাকায় এটি 1টি ইলেকট্রন গ্রহণ করে নিয়নের (2, 8) মতো স্থিতিশীল বিন্যাস অর্জন করে এবং F⁻ অ্যানায়নে পরিণত হয়।\nCa→Ca²⁺+2e⁻\n2F+2e⁻→2F⁻\nএকটি Ca পরমাণুর ত্যাগ করা 2টি ইলেকট্রন দুটি F পরমাণু গ্রহণ করে। এরপর বিপরীত চার্জযুক্ত Ca²⁺ ও F⁻ আয়ন স্থির বৈদ্যুতিক আকর্ষণ বলে যুক্ত হয়ে আয়নিক বন্ধনের মাধ্যমে CaF₂ গঠন করে:\nCa²⁺+2F⁻→CaF₂\nচিত্র (ইলেকট্রন স্থানান্তর)\nF (2, 7) ← e⁻ ← Ca(2,8,8,2)→e⁻→F(2,7)\n[F]⁻ (2, 8) [Ca]²⁺ (2, 8, 8) [F]⁻ (2, 8) এভাবে আয়নিক বন্ধনের মাধ্যমে PM₂ বা CaF₂ যৌগটি গঠিত হয়।"},{"label":"ঘ","question":"উদ্দীপকের মৌলগুলোর তড়িৎঋণাত্মকতার ক্রম বিশ্লেষণ কর।","answer":"উদ্দীপকের মৌলগুলো শনাক্তকরণ:\nমৌল পারমাণবিক ইলেকট্রন পর্যায় গ্রুপ সংখ্যা বিন্যাস M (F) 9 1s2 2s2 2p5 2 17 N (Mg) 12 1s² 2s² 2p⁶ 3 2 3s² O (S) 16 1s² 2s² 2p⁶ 3 16 3s² 3p⁴ P (Ca) 20 1s² 2s² 2p⁶ 4 2 3s² 3p⁶ 4s² সমযোজী বন্ধনে আবদ্ধ দুটি পরমাণুর মধ্যে শেয়ারকৃত ইলেকট্রন যুগলকে কোনো পরমাণুর নিজের দিকে আকর্ষণ করার ক্ষমতাকে তড়িৎঋণাত্মকতা বলে।\n• একই পর্যায়ে বাম থেকে ডানে পারমাণবিক সংখ্যা বাড়ার সাথে নিউক্লিয়ার চার্জ বাড়ে এবং পরমাণুর আকার কমে, তাই তড়িৎঋণাত্মকতা বাড়ে । N (Mg) ও O (S) উভয়ই ৩য় পর্যায়ের; S গ্রুপ-16 এ এবং Mg গ্রুপ-2 এ, তাই S এর তড়িৎঋণাত্মকতা Mg এর চেয়ে বেশি ।\n• একই গ্রুপে উপর থেকে নিচে শক্তিস্তর বাড়ায় পরমাণুর আকার বাড়ে, তাই তড়িৎঋণাত্মকতা কমে। N (Mg) ও P (Ca) উভয়ই গ্রুপ-2 এর; Ca নিচে অবস্থিত, তাই Mg এর তড়িৎঋণাত্মকতা Ca এর চেয়ে বেশি ।\n• M (F) ২য় পর্যায়ের গ্রুপ-17 এর মৌল; এর আকার অত্যন্ত ছোট ও সর্ববহিঃস্থ স্তর প্রায় পূর্ণ (2, 7)। F পর্যায় সারণির সবচেয়ে তড়িৎঋণাত্মক মৌল, তাই এর তড়িৎঋণাত্মকতা S এর চেয়েও বেশি। পলিং স্কেলে আনুমানিক মান: F = 4.0, S = 2.6, Mg = 1.3, Ca =1.0। অতএব, উদ্দীপকের মৌলগুলোর তড়িৎঋণাত্মকতার ক্রম: M (F) \u003e O (S) \u003e N (Mg) \u003e P (Ca)।"}]},{"id":"ch4-cq13","chapter":4,"num":13,"importance":3,"topic":"মৌলের পর্যায়বৃত্ত ধর্ম","board":"মাদ্রাসা বোর্ড ২০২৬","stem":"মৌল পারমাণবিক সংখ্যা X 15 Y 24 Z 20 [এখানে X, Y ও Z প্রচলিত অর্থে কোনো মৌলের প্রতীক নয়।]","subQuestions":[{"label":"ক","question":"তাপোৎপাদী বিক্রিয়া কাকে বলে?","answer":"যে রাসায়নিক বিক্রিয়ায় তাপ উৎপন্ন হয় বা পরিবেশে তাপ নির্গত\nহয়, তাকে তাপোৎপাদী বিক্রিয়া বলে। যেমন: C+O₂→\nCO₂,ΔH=-393.5kJ/mol।"},{"label":"খ","question":"KMnO₄-এর কেন্দ্রীয় পরমাণুর জারণ সংখ্যা নির্ণয় কর।","answer":"KMnO₄ এর কেন্দ্রীয় পরমাণু Mn। ধরি, Mn এর জারণ সংখ্যা x। K এর জারণ সংখ্যা +1 এবং O এর -2। যৌগে মোট জারণ সংখ্যা শূন্য। (+1)+x+4×(-2)=0 বা, 1+x-8=0 বা, x=+7 সুতরাং KMnO₄ এর কেন্দ্রীয় পরমাণু Mn এর জারণ সংখ্যা +7।"},{"label":"গ","question":"ইলেকট্রন বিন্যাসের মাধ্যমে পর্যায় সারণিতে Y-মৌলের অবস্থান নির্ণয় কর।","answer":"উদ্দীপকের Y মৌলের পারমাণবিক সংখ্যা 24, অর্থাৎ এটি ক্রোমিয়াম (Cr)। সাধারণ নিয়মে এর ইলেকট্রন বিন্যাস হওয়ার কথা 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁴ 4s²। কিন্তু অর্ধপূর্ণ d অরবিটাল (d5) অধিক স্থিতিশীল বলে 4s এর একটি ইলেকট্রন 3d তে চলে যায়। তাই Y এর প্রকৃত ইলেকট্রন বিন্যাস: Y(24) : 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁵ 4s¹ পর্যায় নির্ণয় ইলেকট্রন বিন্যাসে সর্বোচ্চ প্রধান শক্তিস্তর n = 4। তাই Y মৌলটি পর্যায় সারণির 4র্থ পর্যায়ে অবস্থিত । গ্রুপ নির্ণয় Y এর সর্বশেষ ইলেকট্রন d অরবিটালে প্রবেশ করেছে, তাই এটি d- ব্লক মৌল (অবস্থান্তর মৌল)। d-ব্লক মৌলের গ্রুপ নম্বর = (n-1)d ও ns অরবিটালের মোট ইলেকট্রন সংখ্যা। গ্রুপ নম্বর = 3d এর ইলেকট্রন + 4s এর ইলেকট্রন =5+1=6 সুতরাং Y মৌলটি (Cr) পর্যায় সারণির 4র্থ পর্যায়ের 6 নং গ্রুপে অবস্থিত একটি d-ব্লক মৌল।"},{"label":"ঘ","question":"উদ্দীপকের X, Y ও Z মৌল তিনটির পারমাণবিক আকারের ক্রম বিশ্লেষণ কর।","answer":"উদ্দীপকের X, Y ও Z মৌল যথাক্রমে ফসফরাস (P), ক্রোমিয়াম (Cr) ও ক্যালসিয়াম (Ca)। এদের ইলেকট্রন বিন্যাস: X(15) : 1s² 2s² 2p⁶ 3s² 3p³ Y(24) : 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁵ 4s¹ Z(20) : 1s² 2s² 2p⁶ 3s² 3p⁶ 4s² ইলেকট্রন বিন্যাস অনুযায়ী X তৃতীয় পর্যায়ের 15 নং গ্রুপে, Y চতুর্থ পর্যায়ের 6 নং গ্রুপে এবং Z চতুর্থ পর্যায়ের 2 নং গ্রুপে অবস্থিত । পর্যায় সারণির একই গ্রুপে উপর থেকে নিচে শক্তিস্তরের সংখ্যা বাড়ায় পরমাণুর আকার বাড়ে । আবার একই পর্যায়ে বাম থেকে ডানে শক্তিস্তর একই থাকলেও নিউক্লিয়াসের ধনাত্মক চার্জ বাড়ে, ফলে ইলেকট্রনগুলো নিউক্লিয়াসের দিকে বেশি আকৃষ্ট হয় এবং পরমাণুর আকার কমে। Y ও Z উভয়ই 4র্থ পর্যায়ের মৌল, অর্থাৎ এদের 4টি শক্তিস্তর আছে। Z (Ca) পর্যায়ের বাম দিকে (গ্রুপ 2) এবং Y (Cr) তার ডান দিকে (গ্রুপ 6) অবস্থিত । Y এর নিউক্লিয়ার চার্জ (+24) Z এর (+20) চেয়ে বেশি, তাই Y এর আকার Z এর চেয়ে ছোট। অর্থাৎ Z \u003e Y। অপরদিকে X (P) এর শক্তিস্তর মাত্র 3টি। শক্তিস্তর কম হওয়ায় X এর আকার 4টি শক্তিস্তরবিশিষ্ট Y ও Z উভয়ের চেয়ে ছোট। অর্থাৎ Y \u003e X। প্রকৃত মানেও দেখা যায়, Ca এর পারমাণবিক ব্যাসার্ধ প্রায় 197 pm, Cr এর প্রায় 128 pm এবং P এর প্রায় 110 pm। পারমাণবিক আকারের ক্রম : Z \u003e Y \u003e X সুতরাং উদ্দীপকের মৌল তিনটির পারমাণবিক আকারের ক্রম হলো Z (Ca) \u003e Y (Cr) \u003e X (P)।"}]},{"id":"ch4-cq14","chapter":4,"num":14,"importance":3,"topic":"মৌলের পর্যায়বৃত্ত ধর্ম","board":"রাজশাহী বোর্ড ২০২৬","stem":"পর্যায় সারণির একটি খণ্ডিত অংশ নিম্নরূপ : X Q R Ca T Zn [ X, Q, R ও T প্রতীকী অর্থে ব্যবহৃত । ]","subQuestions":[{"label":"ক","question":"ইলেকট্রন আসক্তি কাকে বলে?","answer":"ইলেকট্রন আসক্তি: গ্যাসীয় অবস্থায় কোনো মৌলের এক মোল বিচ্ছিন্ন পরমাণুতে এক মোল ইলেকট্রন যুক্ত হয়ে এক মোল ঋণাত্মক আয়নে পরিণত হওয়ার সময় যে শক্তি নির্গত হয়, তাকে ঐ মৌলের ইলেকট্রন আসক্তি বলে।"},{"label":"খ","question":"ক্লোরিন একটি হ্যালোজেন —ব্যাখ্যা কর।","answer":"হ্যালোজেন শব্দের অর্থ লবণ উৎপাদনকারী । পর্যায় সারণির গ্রুপ-17 এর মৌলগুলোকে হ্যালোজেন বলে। Cl (17) : 1s² 2s² 2p⁶ 3s² 3p⁵ ক্লোরিনের সর্বশেষ শক্তিস্তরে 7টি ইলেকট্রন আছে, তাই এটি গ্রুপ-17 এর মৌল। এটি সহজেই একটি ইলেকট্রন গ্রহণ করে Cl⁻ আয়ন গঠন করে এবং ধাতুর সাথে যুক্ত হয়ে লবণ উৎপন্ন করে।\n2Na+Cl₂→2NaCl\nতাই ক্লোরিন একটি হ্যালোজেন ।"},{"label":"গ","question":"উদ্দীপকে T মৌলটি একাধিক যোজনী প্রদর্শন করে —ব্যাখ্যা কর।","answer":"উদ্দীপকের সারণিতে T মৌলটি Ca ও Zn এর মধ্যবর্তী 4র্থ পর্যায়ে অবস্থিত, অর্থাৎ T একটি d-ব্লক মৌল বা অবস্থান্তর ধাতু।\nধরি, T হলো আয়রন (Fe)।\nFe (26) : 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁶ 4s² অবস্থান্তর মৌলে 4s ও 3d অরবিটালের শক্তির পার্থক্য খুব কম হওয়ায় বন্ধন গঠনে 4s এর পাশাপাশি 3d অরবিটালের ইলেকট্রনও অংশ নিতে পারে ।\n• Fe পরমাণু 4s অরবিটালের দুটি ইলেকট্রন ত্যাগ করলে Fe²⁺ আয়ন গঠিত হয়; এক্ষেত্রে যোজনী 2।\nFe→Fe²⁺+2e⁻\nFe²⁺ : 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁶\n• Fe²⁺ আয়ন 3d থেকে আরও একটি ইলেকট্রন ত্যাগ করলে 3d অরবিটাল অর্ধপূর্ণ (3d5) হয়, যা অধিক স্থিতিশীল । এভাবে Fe³⁺ আয়ন গঠিত হয়; এক্ষেত্রে যোজনী 3।\nFe→Fe³⁺+3e⁻\nFe³⁺ : 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁵\nযেমন: FeCl₂ যৌগে আয়রনের যোজনী 2 এবং FeCl₃ যৌগে যোজনী 3। সুতরাং T মৌলটি অবস্থান্তর মৌল হওয়ায় পরিবর্তনশীল তথা একাধিক যোজনী প্রদর্শন করে।"},{"label":"ঘ","question":"X, Q ও R মৌলের আয়নিকরণ শক্তি ও ধাতব ধর্মের ক্রম বিপরীত—যুক্তিসহ বিশ্লেষণ কর।","answer":"উদ্দীপকের সারণিতে X, Q ও R একই গ্রুপে (গ্রুপ-1) যথাক্রমে 2য়, 3য় ও 4র্থ পর্যায়ে অবস্থিত (কারণ R একই পর্যায়ে Ca এর আগে অবস্থিত)। সুতরাং X = লিথিয়াম (Li), Q = সোডিয়াম (Na) এবং R = পটাসিয়াম (K)। Li (3) : 1s² 2s¹ Na (11) : 1s² 2s² 2p⁶ 3s¹ K (19) : 1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹ আয়নিকরণ শক্তির ক্রম গ্যাসীয় অবস্থায় এক মোল পরমাণু থেকে এক মোল ইলেকট্রন অপসারণ করে এক মোল ধনাত্মক আয়ন গঠন করতে প্রয়োজনীয় শক্তিকে আয়নিকরণ শক্তি বলে। একই গ্রুপে উপর থেকে নিচে শক্তিস্তরের সংখ্যা বাড়ে, ফলে পরমাণুর আকার বাড়ে । এতে সর্বশেষ স্তরের ইলেকট্রনের ওপর নিউক্লিয়াসের আকর্ষণ কমে যায় এবং ইলেকট্রন অপসারণ সহজ হয়। তাই Li থেকে K এর দিকে আয়নিকরণ শক্তি হ্রাস পায়। আয়নিকরণ শক্তির ক্রম : X (Li) \u003e Q (Na) \u003e R (K) ধাতব ধর্মের ক্রম যে মৌল যত সহজে ইলেকট্রন ত্যাগ করে ধনাত্মক আয়নে পরিণত হতে পারে, তার ধাতব ধর্ম তত বেশি। আয়নিকরণ শক্তি যত কম, ইলেকট্রন ত্যাগ তত সহজ। K এর আয়নিকরণ শক্তি সবচেয়ে কম হওয়ায় এটি সবচেয়ে সহজে ইলেকট্রন ত্যাগ করে, আর Li এর আয়নিকরণ শক্তি সবচেয়ে বেশি হওয়ায় এটি অপেক্ষাকৃত কঠিনভাবে ইলেকট্রন ত্যাগ করে। ধাতব ধর্মের ক্রম : R (K) \u003e Q (Na) \u003e X (Li) এজন্য পানির সাথে K সবচেয়ে তীব্রভাবে এবং Li সবচেয়ে ধীরে বিক্রিয়া করে।\n2K+2H₂O→2KOH+H₂\nসুতরাং X, Q ও R মৌলের আয়নিকরণ শক্তির ক্রম (X \u003e Q \u003e R) এবং ধাতব ধর্মের ক্রম (R \u003e Q \u003e X) পরস্পর বিপরীত ।"}]},{"id":"ch4-cq15","chapter":4,"num":15,"importance":3,"topic":"মৌলের পর্যায়বৃত্ত ধর্ম","board":"রাজশাহী বোর্ড ২০২২","stem":"12A, 19B, 20C [A, B, C প্রতীকী অর্থে ব্যবহৃত]","subQuestions":[{"label":"ক","question":"মেন্ডেলিফের পর্যায় সূত্রটি লেখ।","answer":"মেন্ডেলিফের পর্যায় সূত্র: মৌলসমূহের ভৌত ও রাসায়নিক ধর্মাবলি তাদের পারমাণবিক ভর বৃদ্ধির সাথে পর্যায়ক্রমে আবর্তিত হয়।"},{"label":"খ","question":"He কে গ্রুপ 18 এ রাখা হয় কেন? ব্যাখ্যা কর।","answer":"হিলিয়ামের ইলেকট্রন বিন্যাস He(2)→1s²। বাইরের স্তরে 2টি\nইলেকট্রন থাকায় একে গ্রুপ-2 এ রাখা উচিত ছিল। কিন্তু গ্রুপ-2 এর মৌলগুলো তীব্র তড়িৎ ধনাত্মক মৃৎক্ষার ধাতু। অপরদিকে He এর একমাত্র শক্তিস্তর (K স্তর, ধারণক্ষমতা 2) সম্পূর্ণ পূর্ণ, তাই এটি ইলেকট্রন গ্রহণ, বর্জন বা ভাগাভাগি করে না এবং নিষ্ক্রিয় থাকে। এর ধর্ম Ne, Ar, Kr ইত্যাদি নিষ্ক্রিয় গ্যাসের সাথে মিলে যায়। তাই He কে গ্রুপ-18 এ রাখা হয়।"},{"label":"গ","question":"পর্যায় সারণিতে C মৌলের অবস্থান নির্ণয় কর।","answer":"উদ্দীপকের C মৌলের পারমাণবিক সংখ্যা 20, অর্থাৎ C হলো ক্যালসিয়াম (Ca)।\nCa(20)→1s²2s²2p⁶3s²3p⁶4s²\n১. ইলেকট্রন বিন্যাসে সবচেয়ে বাইরের প্রধান শক্তিস্তর n = 4। তাই C মৌলটি ৪র্থ পর্যায়ে অবস্থিত ।\n২. সর্ববহিঃস্থ স্তরে কেবল s অরবিটালে 2টি ইলেকট্রন আছে (s-ব্লক মৌল)। তাই এর গ্রুপ নম্বর = 2, অর্থাৎ C মৌলটি গ্রুপ-2 এ অবস্থিত । সুতরাং, C (Ca) মৌলটি পর্যায় সারণির ৪র্থ পর্যায়ের গ্রুপ-2 এর মৌল; এটি একটি মৃৎক্ষার ধাতু।"},{"label":"ঘ","question":"উদ্দীপকে উল্লিখিত A, B, C মৌলত্রয়ের পারমাণবিক ব্যাসার্ধের ক্রম বিশ্লেষণ কর।","answer":"উদ্দীপকের A (12) = ম্যাগনেসিয়াম (Mg), B (19) = পটাশিয়াম (K), C (20) = ক্যালসিয়াম (Ca)।\nMg(12)→1s²2s²2p⁶3s² (পর্যায়-3, গ্রুপ-2)\nK(19)→1s²2s²2p⁶3s²3p⁶4s¹ (পর্যায়-4, গ্রুপ-1)\nCa(20)→1s²2s²2p⁶3s²3p⁶4s² (পর্যায়-4, গ্রুপ-2)\nA ও C এর তুলনা: Mg ও Ca একই গ্রুপ (গ্রুপ-2) এর মৌল। গ্রুপের উপর থেকে নিচে একটি করে নতুন শক্তিস্তর যুক্ত হয়, ফলে আকার বাড়ে । Mg এর শক্তিস্তর 3টি, Ca এর 4টি। তাই Ca \u003e Mg। B ও C এর তুলনা: K ও Ca একই পর্যায় (৪র্থ পর্যায়) এর মৌল। পর্যায়ের বাম থেকে ডানে প্রোটন সংখ্যা ও ইলেকট্রন সংখ্যা বাড়ে কিন্তু শক্তিস্তর বাড়ে না, ফলে নিউক্লিয়াসের আকর্ষণ বেড়ে আকার কমে। K বামে এবং Ca ডানে, তাই K \u003e Ca। সুতরাং, পারমাণবিক ব্যাসার্ধের ক্রম: B \u003e C \u003e A অর্থাৎ K \u003e Ca \u003e Mg।"}]},{"id":"ch4-cq16","chapter":4,"num":16,"importance":3,"topic":"মৌলের পর্যায়বৃত্ত ধর্ম","board":"বরিশাল বোর্ড ২০২১","stem":"মৌল মৌল চিহ্নিতকরণ A ৩য় পর্যায়ের গ্রুপ-17 এ অবস্থিত B শেষ স্তরের ইলেকট্রন বিন্যাস 4s¹ C Ca এর ৪ঘর ডানে অবস্থিত D Zn এর ১ ঘর বামে অবস্থিত [A, B, C, D প্রতীকী অর্থে ব্যবহৃত]","subQuestions":[{"label":"ক","question":"অষ্টক সূত্রটি বিবৃত কর।","answer":"মৌলসমূহকে তাদের পারমাণবিক ভরের ঊর্ধ্বক্রম অনুসারে সাজালে যেকোনো একটি মৌলের ধর্ম তার অষ্টম মৌলের ধর্মের সাথে মিলে যায়— এটিই নিউল্যান্ডসের অষ্টক সূত্র।"},{"label":"খ","question":"C₄H₁₀ কে প্যারাফিন বলা হয় কেন? ব্যাখ্যা কর।","answer":"C₄H₁₀ (বিউটেন) একটি অ্যালকেন; এর সাধারণ সংকেত CnH2n+₂। এর অণুতে কার্বন-কার্বন ও কার্বন-হাইড্রোজেন এর মধ্যে শুধু একক বন্ধন থাকে, যা ভাঙা অনেক কঠিন । ফলে বিউটেন রাসায়নিকভাবে অনেকটা নিষ্ক্রিয়; কেবল উচ্চ তাপমাত্রা, উচ্চ চাপ বা শক্তিশালী প্রভাবকের উপস্থিতিতে বিক্রিয়া করে। প্যারাফিন অর্থ স্বল্প আসক্তি । তাই C₄H₁₀ কে প্যারাফিন বলা হয়।"},{"label":"গ","question":"C ও D মৌলের ইলেকট্রন বিন্যাস সাধারণ নিয়মের ব্যতিক্রম- ব্যাখ্যা কর।","answer":"Ca (20) এর ৪ ঘর ডানের মৌল হলো 24 নং মৌল ক্রোমিয়াম, তাই C = Cr। Zn (30) এর ১ ঘর বামের মৌল হলো 29 নং মৌল কপার, তাই D = Cu। আউফবাউ নীতি অনুসারে ইলেকট্রন আগে কম শক্তির 4s এবং পরে 3d অরবিটালে প্রবেশ করে। কিন্তু অর্ধপূর্ণ (d⁵) ও সম্পূর্ণ পূর্ণ (d¹⁰) অরবিটাল বেশি সুস্থিত ।\n• C (Cr, 24): সাধারণ নিয়মে বিন্যাস হওয়ার কথা 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁴ 4s²। কিন্তু 3d অরবিটাল অর্ধপূর্ণ করে অধিক সুস্থিতি লাভের জন্য 4s থেকে 1টি ইলেকট্রন 3d তে চলে যায়। প্রকৃত বিন্যাস:\n24Cr→1s2 2s2 2p6 3s2 3p6 3d5 4s1\n• D (Cu, 29): সাধারণ নিয়মে বিন্যাস হওয়ার কথা 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁹ 4s²। কিন্তু 3d অরবিটাল সম্পূর্ণ পূর্ণ করে অধিক সুস্থিতি লাভের জন্য 4s থেকে 1টি ইলেকট্রন 3d তে চলে যায়। প্রকৃত বিন্যাস:\n29Cu→1s2 2s2 2p6 3s2 3p6 3d10 4s1\nতাই C (Cr) ও D (Cu) মৌলের ইলেকট্রন বিন্যাস সাধারণ নিয়মের ব্যতিক্রম ।"},{"label":"ঘ","question":"উদ্দীপকের A, B ও C মৌলসমূহের ইলেকট্রন আসক্তির ক্রম বিশ্লেষণ কর।","answer":"A মৌলটি ৩য় পর্যায়ের গ্রুপ-17 এ অবস্থিত, তাই A = ক্লোরিন (Cl, 17)। B এর শেষ স্তরের বিন্যাস 4s¹, তাই B = পটাশিয়াম (K, 19)। C = ক্রোমিয়াম (Cr, 24)।\n17A(Cl)→1s2 2s2 2p6 3s2 3p5 (৩য় পর্যায়, গ্রুপ-17)\n19B(K)→1s2 2s2 2p6 3s2 3p6 4s1 (৪র্থ পর্যায়, গ্রুপ-1)\n24C(Cr)→1s2 2s2 2p6 3s2 3p6 3d5 4s1 (৪র্থ পর্যায়, গ্রুপ-6)\nগ্যাসীয় অবস্থায় কোনো মৌলের এক মোল বিচ্ছিন্ন পরমাণুতে এক মোল ইলেকট্রন যুক্ত হয়ে এক মোল ঋণাত্মক আয়নে পরিণত হতে যে শক্তি নির্গত হয় তাকে ইলেকট্রন আসক্তি বলে। পারমাণবিক আকার যত ছোট এবং নিউক্লিয়ার চার্জ যত বেশি, ইলেকট্রন আসক্তি তত বেশি।\nA (Cl) এর শেষ স্তরে 7টি ইলেকট্রন; মাত্র 1টি ইলেকট্রন গ্রহণ করে নিষ্ক্রিয় গ্যাসের (Ar) বিন্যাস লাভ করে। তাছাড়া এর শক্তিস্তর মাত্র তিনটি, আকার ছোট। তাই এর ইলেকট্রন আসক্তি সবচেয়ে বেশি।\nB (K) ও C (Cr) উভয়ই ৪র্থ পর্যায়ের মৌল। একই পর্যায়ে বাম থেকে ডানে নিউক্লিয়ার চার্জ বাড়ে ও আকার কমে, ফলে ইলেকট্রন আসক্তি বাড়ে । K গ্রুপ-1 এ (বামে) এবং Cr গ্রুপ-6 এ (ডানে) অবস্থিত । তাই Cr এর ইলেকট্রন আসক্তি K অপেক্ষা বেশি। K সহজে ইলেকট্রন ত্যাগ করে, গ্রহণের প্রবণতা খুবই কম। সুতরাং ইলেকট্রন আসক্তির ক্রম: A (Cl) \u003e C (Cr) \u003e B (K)।"}]},{"id":"ch4-cq17","chapter":4,"num":17,"importance":3,"topic":"মৌলের পর্যায়বৃত্ত ধর্ম","board":"ঢাকা বোর্ড ২০২৩","stem":"[A, Y এবং Z প্রতীকী অর্থে ব্যবহৃত]","diagramId":"ch4-cq17","subQuestions":[{"label":"ক","question":"ধাতু কাকে বলে?","answer":"যে সকল মৌল এক বা একাধিক ইলেকট্রন ত্যাগ করে ধনাত্মক আয়নে পরিণত হয়, তাদেরকে ধাতু বলে।"},{"label":"খ","question":"Mg²⁺ বলতে কী বুঝ? ব্যাখ্যা কর।","answer":"Mg²⁺ হলো ম্যাগনেসিয়ামের দ্বিধনাত্মক আয়ন । Mg পরমাণু (পারমাণবিক সংখ্যা 12) এর সবচেয়ে বাইরের শক্তিস্তরের 2টি ইলেকট্রন ত্যাগ করে Mg²⁺ আয়নে পরিণত হয়।\nMg→Mg²⁺+2e\nMg²⁺ আয়নে প্রোটন 12টি কিন্তু ইলেকট্রন 10টি, তাই এর চার্জ +2। এর ইলেকট্রন বিন্যাস 1s² 2s² 2p⁶, যা নিষ্ক্রিয় গ্যাস নিয়নের মতো স্থিতিশীল ।"},{"label":"গ","question":"'A' এবং 'X' এর ইলেকট্রন আসক্তির ক্রম ব্যাখ্যা কর।","answer":"উদ্দীপকের পর্যায় সারণির ১ম সারি বা ১ম পর্যায়ে মাত্র দুটি মৌল থাকে। তাই বামের A হলো হাইড্রোজেন (H, 1) এবং ডানের শেষ ঘরের X হলো হিলিয়াম (He, 2)।\nH(1)→1s¹\nHe(2)→1s²\nসাধারণত একই পর্যায়ে বাম থেকে ডানে পারমাণবিক ব্যাসার্ধ কমে এবং ইলেকট্রন আসক্তি বাড়ে । সে হিসেবে He এর আকার H এর চেয়ে ছোট। কিন্তু H এর 1s অরবিটালে 1টি ইলেকট্রন আছে, অরবিটালটি অপূর্ণ । তাই H সহজেই একটি ইলেকট্রন গ্রহণ করে স্থিতিশীল H- আয়ন (1s2) গঠন করতে পারে এবং শক্তি নির্গত করে ।\nH(g)+e→H-(g)\nঅন্যদিকে He এর 1s অরবিটাল দুটি ইলেকট্রন দিয়ে পূর্ণ (স্থিতিশীল দুই-এর বিন্যাস)। নতুন ইলেকট্রন গ্রহণ করতে হলে তাকে পরবর্তী উচ্চ শক্তিস্তরে (2s) যেতে হবে, যা স্থিতিশীলতা নষ্ট করে। তাই He কোনো ইলেকট্রন গ্রহণ করতে চায় না এবং এর ইলেকট্রন আসক্তি প্রায় শূন্য। অতএব ইলেকট্রন আসক্তির ক্রম: H \u003e He, অর্থাৎ A \u003e X।"},{"label":"ঘ","question":"'Y' এবং 'Z' এর আয়নিকরণ শক্তি এবং পারমাণবিক ব্যাসার্ধ পরস্পর বিপরীতক্রমে পরিবর্তিত হয়-যুক্তিসহ ব্যাখ্যা কর।","answer":"উদ্দীপকের ২য় সারি অর্থাৎ ২য় পর্যায়ে Ne এর ঠিক আগের দুটি ঘরে Y ও Z আছে । তাই Y হলো অক্সিজেন (O, 8) এবং Z হলো ফ্লোরিন (F, 9)।\nO(8)→1s²2s²2p⁴ (পর্যায় 2, গ্রুপ 16)\nF(9)→1s²2s²2p⁵ (পর্যায় 2, গ্রুপ 17)\nপারমাণবিক ব্যাসার্ধ: O ও F একই পর্যায়ের মৌল এবং F, O এর ডানে অবস্থিত । F এ প্রোটন ও ইলেকট্রন একটি করে বেশি, কিন্তু প্রধান শক্তিস্তর একই (n = 2)। ফলে F এর নিউক্লিয়াস বাইরের ইলেকট্রনকে বেশি আকর্ষণ করে এবং শক্তিস্তর নিউক্লিয়াসের কাছে চলে আসে। তাই ব্যাসার্ধ: O \u003e F, অর্থাৎ Y \u003e Z। আয়নিকরণ শক্তি: পরমাণু যত ছোট, বাইরের ইলেকট্রন নিউক্লিয়াসের তত কাছে থাকে এবং তত বেশি আকর্ষিত হয়। ফলে সেই ইলেকট্রন সরাতে বেশি শক্তি লাগে। F এর আকার O এর চেয়ে ছোট, তাই আয়নিকরণ শক্তি: F \u003e O, অর্থাৎ Z \u003e Y। দেখা যাচ্ছে, Y থেকে Z এর দিকে গেলে ব্যাসার্ধ কমে কিন্তু আয়নিকরণ শক্তি বাড়ে । অতএব, Y ও Z এর আয়নিকরণ শক্তি এবং পারমাণবিক ব্যাসার্ধ পরস্পর বিপরীতক্রমে পরিবর্তিত হয়।"}]},{"id":"ch4-cq18","chapter":4,"num":18,"importance":3,"topic":"মৌলের পর্যায়বৃত্ত ধর্ম","board":"কুমিল্লা বোর্ড ২০২১","stem":"পর্যায় \\ P Q R S T গ্রুপ W Li F Ne X A C D Cl Ar Y B E Z Rb G চিত্রে একটি পর্যায় সারণির খণ্ডাংশ দেখানো হয়েছে । [যেখানে A, B, C, D, E এবং G প্রচলিত কোনো মৌল নয়।]","subQuestions":[{"label":"ক","question":"মেন্ডেলিফের পর্যায় সূত্রটি লিখ।","answer":"মেন্ডেলিফের পর্যায় সূত্র: মৌলসমূহের ভৌত ও রাসায়নিক ধর্মাবলি তাদের পারমাণবিক ভর বৃদ্ধির সাথে পর্যায়ক্রমে আবর্তিত হয়।"},{"label":"খ","question":"'K' কে ক্ষার ধাতু বলা হয় কেন?","answer":"পটাশিয়াম (K) গ্রুপ-1 এর মৌল; K(19)→\n1s²2s²2p⁶3s²3p⁶4s¹। বাইরের স্তরের 1টি ইলেকট্রন সহজে ত্যাগ করায় এটি অত্যন্ত সক্রিয় ধাতু। K পানির সাথে বিক্রিয়া করে হাইড্রোজেন গ্যাস ও তীব্র ক্ষার পটাশিয়াম হাইড্রোক্সাইড উৎপন্ন করে।\n2K+2H₂O→2KOH+H₂\nপানিতে দ্রবীভূত হয়ে ক্ষার তৈরি করে বলে K কে ক্ষার ধাতু বলা হয়।"},{"label":"গ","question":"উদ্দীপকের C ও D মৌলদ্বয়ের মধ্যে কোনটির ইলেকট্রন আসক্তি বেশি? ব্যাখ্যা কর।","answer":"উদ্দীপকে পর্যায় W, X, Y, Z যথাক্রমে ২য়, ৩য়, ৪র্থ ও ৫ম পর্যায় এবং গ্রুপ P, Q, R, S, T যথাক্রমে গ্রুপ-1, 2, 16, 17, 18 নির্দেশ করে (কারণ Li গ্রুপ-1, F গ্রুপ-17, Ne গ্রুপ-18)। সুতরাং C হলো ৩য় পর্যায়ের গ্রুপ-2 এর মৌল ম্যাগনেসিয়াম (Mg) এবং D হলো ৩য় পর্যায়ের গ্রুপ-16 এর মৌল সালফার (S)।\nMg(12)→1s²2s²2p⁶3s²\nS(16)→1s²2s²2p⁶3s²3p⁴\nC ও D একই পর্যায়ের মৌল। পর্যায়ের বাম থেকে ডানে প্রোটন সংখ্যা বাড়ে কিন্তু শক্তিস্তর বাড়ে না, ফলে পারমাণবিক ব্যাসার্ধ কমে। ব্যাসার্ধ কম হলে নিউক্লিয়াস বাইরের ইলেকট্রনকে বেশি আকর্ষণ করে, তাই ইলেকট্রন আসক্তি বাড়ে । তাছাড়া S এর বাইরের স্তরে 6টি ইলেকট্রন থাকায় এটি 2টি ইলেকট্রন গ্রহণ করে অষ্টক পূর্ণ করতে আগ্রহী; কিন্তু Mg ইলেকট্রন ত্যাগ করতে আগ্রহী ।\nS+2e⁻→S²⁻\nসুতরাং, C (Mg) অপেক্ষা D (S) মৌলের ইলেকট্রন আসক্তি বেশি।"},{"label":"ঘ","question":"'X' পর্যায় এবং 'S' গ্রুপে মৌলগুলোর আকারের তুলনামূলক বিশ্লেষণ কর।","answer":"উদ্দীপক অনুযায়ী X পর্যায় হলো ৩য় পর্যায়; এর মৌলগুলো A = Na (গ্রুপ-1), C = Mg (গ্রুপ-2), D = S (গ্রুপ-16), Cl (গ্রুপ-17) ও Ar (গ্রুপ-18)। S গ্রুপ হলো গ্রুপ-17 (হ্যালোজেন); এর মৌলগুলো F (পর্যায়-2), Cl (পর্যায়-3), E = Br (পর্যায়-4) ও G = I (পর্যায়-5)। X পর্যায়ে আকার: একই পর্যায়ে বাম থেকে ডানে পারমাণবিক সংখ্যা বাড়ায় নিউক্লিয়াসে প্রোটন ও বাইরে ইলেকট্রন সংখ্যা বাড়ে, কিন্তু নতুন শক্তিস্তর যুক্ত হয় না। ফলে নিউক্লিয়াসের আকর্ষণ বেড়ে শক্তিস্তরগুলো নিউক্লিয়াসের কাছে চলে আসে এবং আকার ছোট হয়। আকারের ক্রম: A \u003e C \u003e D \u003e Cl অর্থাৎ Na \u003e Mg \u003e S \u003e Cl। Ar নিষ্ক্রিয় গ্যাস; এটি অন্য পরমাণুর সাথে বন্ধন গঠন করে না বলে এর ব্যাসার্ধ ভিন্ন পদ্ধতিতে (ভ্যান্ডারওয়ালস ব্যাসার্ধ হিসেবে) মাপা হয়, তাই এই ক্রমে এর তুলনা করা হয় না। S গ্রুপে আকার: একই গ্রুপে উপর থেকে নিচে প্রতিটি মৌলে একটি করে নতুন শক্তিস্তর যুক্ত হয়। প্রোটন সংখ্যা বৃদ্ধির কারণে আকার যতটুকু কমে, নতুন শক্তিস্তর যুক্ত হওয়ায় আকার তার চেয়ে বেশি বাড়ে ।\nF(9)→2টি শক্তিস্তর; Cl(17)→3টি; Br(35)→4টি; I(53)→\n5টি আকারের ক্রম: G \u003e E \u003e Cl \u003e F অর্থাৎ I \u003e Br \u003e Cl \u003e F। সুতরাং, X পর্যায়ে বাম থেকে ডানে পরমাণুর আকার কমে এবং S গ্রুপে উপর থেকে নিচে পরমাণুর আকার বাড়ে ।"}]},{"id":"ch4-cq19","chapter":4,"num":19,"importance":3,"topic":"মৌলের পর্যায়বৃত্ত ধর্ম","board":"সিলেট বোর্ড ২০২৫","stem":"12A 19M 29E (A, M, E প্রতীকী অর্থে ব্যবহৃত)","subQuestions":[{"label":"ক","question":"ভরসংখ্যা কাকে বলে?","answer":"কোনো পরমাণুর নিউক্লিয়াসে উপস্থিত প্রোটন ও নিউট্রনের মোট সংখ্যাকে ঐ পরমাণুর ভরসংখ্যা বলে।"},{"label":"খ","question":"16/8 O²⁻ বলতে কী বোঝায়? ব্যাখ্যা কর।","answer":"16/8 O²⁻ দ্বারা অক্সিজেনের অক্সাইড আয়ন বোঝায়, যার পারমাণবিক সংখ্যা 8 এবং ভরসংখ্যা 16। এতে প্রোটন সংখ্যা = 8, নিউট্রন সংখ্যা =16-8=8। অক্সিজেন পরমাণু 2টি ইলেকট্রন গ্রহণ করে O²⁻ আয়নে পরিণত হয়, তাই এতে ইলেকট্রন সংখ্যা =8+2=10 এবং আয়নটির চার্জ -2।\nO+2e→O²⁻\nO²⁻ আয়নের ইলেকট্রন বিন্যাস 1s² 2s² 2p⁶, যা নিয়নের মতো স্থিতিশীল ।"},{"label":"গ","question":"উদ্দীপকে উল্লিখিত E মৌলটির ইলেকট্রন বিন্যাস লিখে পর্যায় সারণিতে অবস্থান ব্যাখ্যা কর।","answer":"উদ্দীপকের E এর পারমাণবিক সংখ্যা 29, তাই E হলো কপার (Cu)। সাধারণ নিয়মে বিন্যাস 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁹ 4s² হওয়ার কথা। কিন্তু d অরবিটাল পূর্ণ (d10) হলে বেশি স্থিতিশীল হয়, তাই 4s থেকে 1টি ইলেকট্রন 3d তে চলে যায়। কপারের প্রকৃত ইলেকট্রন বিন্যাস:\nCu(29)→1s²2s²2p⁶3s²3p⁶3d¹⁰4s¹\nপর্যায়: সবচেয়ে বাইরের প্রধান শক্তিস্তর n = 4, তাই Cu ৪র্থ পর্যায়ের মৌল। গ্রুপ: সবচেয়ে বাইরের শক্তিস্তরে s অরবিটাল এবং আগের শক্তিস্তরে d অরবিটাল আছে। তাই s ও d অরবিটালের ইলেকট্রন যোগ করে গ্রুপ নম্বর =1+10=11। অতএব, E (Cu) পর্যায় সারণির ৪র্থ পর্যায়ের 11 নং গ্রুপে অবস্থিত ।"},{"label":"ঘ","question":"উদ্দীপকে উল্লিখিত মৌল তিনটির ক্ষেত্রে ইলেকট্রন আসক্তির ক্রম বিশ্লেষণ কর।","answer":"উদ্দীপকের A = ম্যাগনেসিয়াম (Mg, 12), M = পটাশিয়াম (K, 19) এবং E = কপার (Cu, 29)।\nMg(12)→1s²2s²2p⁶3s² (পর্যায় 3, গ্রুপ 2)\nK(19)→1s²2s²2p⁶3s²3p⁶4s¹ (পর্যায় 4, গ্রুপ 1)\nCu(29)→1s²2s²2p⁶3s²3p⁶3d¹⁰4s¹ (পর্যায় 4, গ্রুপ 11)\nপারমাণবিক ব্যাসার্ধ কমলে ইলেকট্রন আসক্তি বাড়ে এবং ব্যাসার্ধ বাড়লে ইলেকট্রন আসক্তি কমে। K ও Cu একই (৪র্থ) পর্যায়ের মৌল। K গ্রুপ-1 এ এবং Cu গ্রুপ-11 এ, অর্থাৎ Cu ডানে । Cu এর প্রোটন সংখ্যা (29) K এর (19) চেয়ে অনেক বেশি হওয়ায় বাইরের ইলেকট্রন বেশি আকৃষ্ট হয়, তাই আকার K \u003e Cu। Mg ও K এর মধ্যে K এ একটি বেশি শক্তিস্তর আছে এবং K গ্রুপ-1 এর মৌল, তাই K এর আকার Mg এর চেয়ে বড়: K \u003e Mg। Mg ও Cu এর মধ্যে Cu এ একটি শক্তিস্তর বেশি থাকলেও এর প্রোটন সংখ্যা Mg এর চেয়ে 17টি বেশি এবং 3d অরবিটাল পূর্ণ হওয়ায় নিউক্লিয়াসের আকর্ষণ অনেক বেশি। ফলে Cu এর পারমাণবিক ব্যাসার্ধ (128 pm) Mg এর ব্যাসার্ধের (160 pm) চেয়ে কম। K এর ব্যাসার্ধ 227 pm। তাই পারমাণবিক ব্যাসার্ধের ক্রম: K \u003e Mg \u003e Cu। অতএব ইলেকট্রন আসক্তির ক্রম: Cu \u003e Mg \u003e K, অর্থাৎ E \u003e A \u003e M।"}]},{"id":"ch4-cq20","chapter":4,"num":20,"importance":3,"topic":"বিভিন্ন গ্রুপে উপস্থিত মৌলগুলোর বিশেষ নাম","board":"কুমিল্লা বোর্ড ২০২৬","stem":"গ্রুপ-K পর্যায়-1 A গ্রুপ-L He পর্যায় -2 B Be D Ne পর্যায় -3 C Mg E Ar [চিত্রে পর্যায় সারণির খণ্ডাংশ এবং A, B, C, D এবং E মৌলের প্রচলিত প্রতীক নয়।]","subQuestions":[{"label":"ক","question":"অর্ধধাতু কাকে বলে?","answer":"অর্ধধাতু: যেসব মৌল ধাতু ও অধাতু উভয়ের কিছু কিছু ধর্ম প্রদর্শন করে, তাদেরকে অর্ধধাতু বা ধাতুকল্প বলে। যেমন: বোরন (B), সিলিকন (Si), জার্মেনিয়াম (Ge)।"},{"label":"খ","question":"Fe এর দ্বিযোজী আয়ন জারক এবং বিজারক উভয়রূপে ক্রিয়া করে—ব্যাখ্যা কর।","answer":"Fe এর দ্বিযোজী আয়ন হলো ফেরাস আয়ন (Fe²⁺), যেখানে Fe এর জারণ সংখ্যা +2। লোহার জারণ সংখ্যা 0, +2 ও +3 হতে পারে; +2 মধ্যবর্তী অবস্থা । Fe²⁺ আয়ন একটি ইলেকট্রন ত্যাগ করে Fe³⁺ আয়নে পরিণত হতে পারে; এক্ষেত্রে এটি নিজে জারিত হয়ে অন্যকে বিজারিত করে, অর্থাৎ বিজারক হিসেবে কাজ করে ।\nFe²⁺→Fe³⁺+e⁻\nআবার Fe²⁺ আয়ন দুটি ইলেকট্রন গ্রহণ করে Fe পরমাণুতে পরিণত হতে পারে (যেমন: Zn এর সাথে বিক্রিয়ায়); এক্ষেত্রে এটি নিজে বিজারিত হয়ে অন্যকে জারিত করে, অর্থাৎ জারক হিসেবে কাজ করে।\nFe²⁺+2e⁻→Fe\nতাই Fe এর দ্বিযোজী আয়ন জারক ও বিজারক উভয়রূপে ক্রিয়া করে।"},{"label":"গ","question":"C ধাতু হয়েও A এর সাথে কীভাবে যৌগ গঠন করে তা ব্যাখ্যা কর।","answer":"উদ্দীপকের গ্রুপ-K হলো গ্রুপ-1 (কারণ পর্যায়-2 এ Be এর আগের মৌল)। তাই A = হাইড্রোজেন (H), B = লিথিয়াম (Li), C = সোডিয়াম (Na)। সাধারণত ধাতু অধাতুর সাথে আয়নিক যৌগ গঠন করে । হাইড্রোজেন গ্রুপ-1 এ থাকলেও এটি একটি অধাতু, যা হ্যালোজেনের মতো একটি ইলেকট্রন গ্রহণ করে He এর মতো স্থিতিশীল ইলেকট্রন বিন্যাস অর্জন করতে পারে।\n• C (Na): 1s² 2s² 2p⁶ 3s¹ — সর্বশেষ স্তরের 1টি ইলেকট্রন ত্যাগ করে Ne এর বিন্যাস অর্জন করে।\nNa→Na⁺+e⁻\n• A (H): 1s¹ — একটি ইলেকট্রন গ্রহণ করে He এর বিন্যাস (1s2) অর্জন করে হাইড্রাইড আয়ন গঠন করে।\nH+e⁻→H⁻\nউৎপন্ন Na⁺ ও H⁻ আয়ন পরস্পর স্থির বৈদ্যুতিক আকর্ষণে আবদ্ধ হয়ে আয়নিক যৌগ সোডিয়াম হাইড্রাইড (NaH) গঠন করে ।\nNa⁺+H⁻→NaH\nতাপ\n2Na+H₂⟶2NaH\nঅতএব, C ধাতু হয়েও A (হাইড্রোজেন) এর সাথে ইলেকট্রন আদান- প্রদানের মাধ্যমে আয়নিক বন্ধনে আবদ্ধ হয়ে যৌগ (NaH) গঠন করে।"},{"label":"ঘ","question":"উচ্চ তাপমাত্রায় গ্রুপ K এবং গ্রুপ L এর মৌলসমূহ অত্যন্ত সক্রিয় হলেও সক্রিয়তার কারণ ভিন্ন—উক্তিটি বিশ্লেষণ কর।","answer":"উদ্দীপক অনুসারে গ্রুপ-K হলো গ্রুপ-1 এবং গ্রুপ-L হলো গ্রুপ-17 (নিষ্ক্রিয় গ্যাসের আগের গ্রুপ)। তাই B = Li, C = Na (ক্ষার ধাতু) এবং D = F (ফ্লোরিন), E = Cl (ক্লোরিন) (হ্যালোজেন)। মৌল ইলেকট্রন বিন্যাস যোজ্যতা ইলেকট্রন Li (B) 1s² 2s¹ 1 Na (C) 1s² 2s² 2p⁶ 3s¹ 1 F (D) 1s² 2s² 2p⁵ 7 Cl (E) 1s² 2s² 2p⁶ 3s² 7 3p⁵ গ্রুপ-K (ক্ষার ধাতু) এর সক্রিয়তার কারণ এদের সর্বশেষ স্তরে মাত্র 1টি ইলেকট্রন থাকে, পরমাণুর আকার বড় এবং আয়নিকরণ শক্তি খুবই কম। তাই এরা সহজে ইলেকট্রন ত্যাগ করে নিষ্ক্রিয় গ্যাসের স্থিতিশীল বিন্যাস অর্জন করে ধনাত্মক আয়ন গঠন করে । অর্থাৎ ইলেকট্রন ত্যাগের প্রবণতার কারণে এরা অত্যন্ত সক্রিয় ।\n2Na+Cl₂→2NaCl\nNa→Na⁺+e⁻\nগ্রুপ-L (হ্যালোজেন) এর সক্রিয়তার কারণ এদের সর্বশেষ স্তরে 7টি ইলেকট্রন থাকে; অষ্টক পূরণে মাত্র 1টি ইলেকট্রন প্রয়োজন । এদের তড়িৎ ঋণাত্মকতা ও ইলেকট্রন আসক্তি অনেক বেশি । তাই এরা সহজে ইলেকট্রন গ্রহণ করে ঋণাত্মক আয়ন গঠন করে । অর্থাৎ ইলেকট্রন গ্রহণের প্রবণতার কারণে এরা অত্যন্ত সক্রিয় ।\nCl+e⁻→Cl⁻\nH₂+Cl₂→2HCl\nউচ্চ তাপমাত্রায় পরমাণুগুলোর গতিশক্তি বাড়ে, ফলে উভয় গ্রুপের মৌলই আরও দ্রুত বিক্রিয়া করে। তবে গ্রুপ-K এর মৌলের সক্রিয়তা নিম্ন আয়নিকরণ শক্তির কারণে ইলেকট্রন ত্যাগের উপর নির্ভরশীল, আর গ্রুপ-L এর মৌলের সক্রিয়তা উচ্চ ইলেকট্রন আসক্তির কারণে ইলেকট্রন গ্রহণের উপর নির্ভরশীল । এজন্য গ্রুপ-K এ উপর থেকে নিচে সক্রিয়তা বাড়ে (Li \u003c Na), কিন্তু গ্রুপ-L এ উপর থেকে নিচে সক্রিয়তা কমে (F \u003e Cl)। সুতরাং গ্রুপ K এবং গ্রুপ L এর মৌলসমূহ অত্যন্ত সক্রিয় হলেও সক্রিয়তার কারণ ভিন্ন—উক্তিটি যথার্থ ।"}]},{"id":"ch4-cq21","chapter":4,"num":21,"importance":3,"topic":"পর্যায় সারণির একই গ্রুপের মৌলগুলো একই রকম রাসায়নিক ধর্ম প্রদর্শন করে","board":"চট্টগ্রাম বোর্ড ২০২৬","stem":"[এখানে Q, R, Y ও Z প্রতীকী অর্থে ব্যবহৃত ।]","diagramId":"ch4-cq21","subQuestions":[{"label":"ক","question":"ভরসংখ্যা কাকে বলে?","answer":"ভরসংখ্যা: কোনো পরমাণুর নিউক্লিয়াসে উপস্থিত প্রোটন ও নিউট্রন সংখ্যার যোগফলকে ঐ পরমাণুর ভরসংখ্যা বলে ।"},{"label":"খ","question":"পটাশিয়ামকে ক্ষারধাতু বলা হয় কেন? ব্যাখ্যা কর।","answer":"পটাশিয়াম (K) গ্রুপ-1 এর মৌল; এর সর্ববহিঃস্থ স্তরে 1টি ইলেকট্রন থাকে (2, 8, 8, 1)। এটি পানির সাথে তীব্রভাবে বিক্রিয়া করে তীব্র ক্ষার KOH উৎপন্ন করে।\n2K+2H₂O→2KOH+H₂\nএর অক্সাইডও পানিতে দ্রবীভূত হয়ে ক্ষার তৈরি করে (K₂O+\nH₂O→2KOH)। পানির সাথে বিক্রিয়ায় ক্ষার উৎপন্ন করে বলে\nপটাশিয়ামকে ক্ষার ধাতু বলা হয়।"},{"label":"গ","question":"Q ও R মৌলদ্বয় পরস্পর কোন ধরনের বন্ধন গঠন করে? ব্যাখ্যা কর।","answer":"উদ্দীপকে Q ও Mg একই পর্যায়ে পাশাপাশি অবস্থিত এবং Q, Mg এর আগে। Mg তৃতীয় পর্যায়ের গ্রুপ-2 এর মৌল। তাই Q হলো তৃতীয় পর্যায়ের গ্রুপ-1 এর মৌল সোডিয়াম (Na)। R একই (তৃতীয়) পর্যায়ে F এর গ্রুপের (গ্রুপ-17) ঠিক বামে অবস্থিত, অর্থাৎ R তৃতীয় পর্যায়ের গ্রুপ-16 এর মৌল সালফার (S)। Na (11) : 1s² 2s² 2p⁶ 3s¹ S (16) : 1s² 2s² 2p⁶ 3s² 3p⁴ Na ধাতু; এর সর্ববহিঃস্থ স্তরের 1টি ইলেকট্রন ত্যাগ করে নিয়ন (Ne) এর মতো স্থিতিশীল ইলেকট্রন বিন্যাস অর্জন করে। S অধাতু; এটি 2টি ইলেকট্রন গ্রহণ করে আর্গন (Ar) এর মতো স্থিতিশীল ইলেকট্রন বিন্যাস অর্জন করে।\n2Na→2Na⁺+2e⁻\nS+2e⁻→S²⁻\n2Na⁺+S²⁻→Na₂S\nঅর্থাৎ 2টি Na পরমাণু থেকে 2টি ইলেকট্রন সম্পূর্ণরূপে S পরমাণুতে স্থানান্তরিত হয় এবং উৎপন্ন বিপরীত চার্জযুক্ত Na⁺ ও S²⁻ আয়ন স্থির বৈদ্যুতিক আকর্ষণ বলে যুক্ত হয়। সুতরাং Q (Na) ও R (S) মৌলদ্বয় পরস্পর আয়নিক বন্ধন গঠন করে সোডিয়াম সালফাইড (Na₂S) উৎপন্ন করে।"},{"label":"ঘ","question":"উদ্দীপকের গ্রুপের মৌলগুলো একই ধর্ম সম্পন্ন —সমীকরণসহ বিশ্লেষণ কর।","answer":"উদ্দীপকের গ্রুপে F এর নিচে Y ও Z অবস্থিত । F গ্রুপ-17 এর মৌল; Y তৃতীয় পর্যায়ে হওয়ায় Y হলো ক্লোরিন (Cl) এবং Z চতুর্থ পর্যায়ে হওয়ায় Z হলো ব্রোমিন (Br)। এরা হ্যালোজেন । F (9) : 1s² 2s² 2p⁵ Cl (17) : 1s² 2s² 2p⁶ 3s² 3p⁵ Br (35) : 1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹⁰ 4s² 4p⁵ প্রতিটির সর্ববহিঃস্থ স্তরে 7টি ইলেকট্রন (ns2 np5) থাকে। রাসায়নিক ধর্ম মূলত সর্ববহিঃস্থ স্তরের ইলেকট্রনের উপর নির্ভর করে, তাই এরা একই রকম ধর্ম প্রদর্শন করে।\n১. প্রত্যেকে 1টি ইলেকট্রন গ্রহণ করে নিষ্ক্রিয় গ্যাসের ইলেকট্রন বিন্যাস অর্জন করে এবং -1 চার্জযুক্ত অ্যানায়ন গঠন করে; এদের যোজনী 1।\nF+e⁻→F⁻ ; Cl+e⁻→Cl⁻ ; Br+e⁻→Br⁻\n২. প্রত্যেকে দ্বিপরমাণুক অণু (F₂, Cl₂, Br₂) গঠন করে।\n৩. হাইড্রোজেনের সাথে বিক্রিয়া করে হাইড্রোজেন হ্যালাইড গঠন করে, যাদের জলীয় দ্রবণ এসিড ।\nH₂+F₂→2HF\nH₂+Cl₂→2HCl\nH₂+Br₂→2HBr\n৪. সোডিয়াম ধাতুর সাথে বিক্রিয়া করে একই ধরনের আয়নিক লবণ (হ্যালাইড) গঠন করে।\n2Na+F₂→2NaF\n2Na+Cl₂→2NaCl\n2Na+Br₂→2NaBr\nসুতরাং সর্ববহিঃস্থ স্তরে একই সংখ্যক (7টি) ইলেকট্রন থাকায় উদ্দীপকের গ্রুপের মৌলগুলো (F, Y, Z) একই ধর্ম সম্পন্ন ।"}]},{"id":"ch4-cq22","chapter":4,"num":22,"importance":3,"topic":"পর্যায় সারণির একই গ্রুপের মৌলগুলো একই রকম রাসায়নিক ধর্ম প্রদর্শন করে","board":"সিলেট বোর্ড ২০২৬","stem":"[এখানে X, Q, R, Y ও Z প্রতীকী অর্থে ব্যবহৃত]","diagramId":"ch4-cq22","subQuestions":[{"label":"ক","question":"ইলেকট্রন আসক্তি কাকে বলে?","answer":"ইলেকট্রন আসক্তি: গ্যাসীয় অবস্থায় কোনো মৌলের এক মোল বিচ্ছিন্ন পরমাণুতে এক মোল ইলেকট্রন যুক্ত হয়ে এক মোল একক ঋণাত্মক আয়নে পরিণত হতে যে শক্তি নির্গত হয়, তাকে ঐ মৌলের ইলেকট্রন আসক্তি বলে।"},{"label":"খ","question":"হিলিয়াম আকারে হাইড্রোজেন অপেক্ষা ছোট কেন? ব্যাখ্যা করো।","answer":"হাইড্রোজেন (H) ও হিলিয়াম (He) উভয়ের ইলেকট্রন একই শক্তিস্তর 1s এ অবস্থান করে । H(1) : 1s¹ He(2) : 1s² H এর নিউক্লিয়াসে 1টি প্রোটন কিন্তু He এর নিউক্লিয়াসে 2টি প্রোটন থাকে। ফলে He এর নিউক্লিয়ার চার্জ বেশি এবং নিউক্লিয়াস একই শক্তিস্তরের ইলেকট্রনগুলোকে অধিক শক্তিতে কেন্দ্রের দিকে আকর্ষণ করে। এতে ইলেকট্রন মেঘ সংকুচিত হয় এবং পরমাণুর ব্যাসার্ধ কমে যায়। তাই হিলিয়াম আকারে হাইড্রোজেন অপেক্ষা ছোট।"},{"label":"গ","question":"উদ্দীপকের X, R ও Y মৌলের তড়িৎ ঋণাত্মকতার ক্রম ব্যাখ্যা করো।","answer":"উদ্দীপকের সারিতে Mg অবস্থিত, তাই সারিটি পর্যায় সারণির তৃতীয় পর্যায় । F এর নিচে অবস্থিত Y হলো তৃতীয় পর্যায়ের গ্রুপ 17 এর মৌল ক্লোরিন (Cl)। Y এর ঠিক বামে R গ্রুপ 16 এর সালফার (S) এবং তার বামে X গ্রুপ 15 এর ফসফরাস (P)। X = P(15) : 1s² 2s² 2p⁶ 3s² 3p³ R = S(16) : 1s² 2s² 2p⁶ 3s² 3p⁴ Y = Cl(17) : 1s² 2s² 2p⁶ 3s² 3p⁵ একই পর্যায়ে বাম থেকে ডানে গেলে পারমাণবিক সংখ্যা তথা নিউক্লিয়াসের ধনাত্মক চার্জ বৃদ্ধি পায়, কিন্তু ইলেকট্রন একই শক্তিস্তরে যুক্ত হয়। ফলে নিউক্লিয়াস কর্তৃক সর্বশেষ স্তরের ইলেকট্রনের প্রতি আকর্ষণ বাড়ে এবং পরমাণুর আকার ছোট হয়। পরমাণুর আকার যত ছোট হয়, বন্ধনের ইলেকট্রন জোড়াকে নিজের দিকে আকর্ষণের ক্ষমতা অর্থাৎ তড়িৎ ঋণাত্মকতা তত বেশি হয়। পরমাণুর আকার: P \u003e S \u003e Cl; তাই তড়িৎ ঋণাত্মকতা: P \u003c S \u003c Cl তড়িৎ ঋণাত্মকতার ক্রম: X \u003c R \u003c Y"},{"label":"ঘ","question":"\"একই গ্রুপের মৌলগুলো একই ধর্ম প্রদর্শন করে\"—উদ্দীপকের F, Y এবং Z মৌলের ধর্মের আলোকে বিশ্লেষণ করো।","answer":"উদ্দীপকের F, Y ও Z মৌল তিনটি পর্যায় সারণির গ্রুপ 17 এ উপর থেকে নিচে অবস্থিত । তাই F = ফ্লোরিন, Y = ক্লোরিন (Cl) এবং Z = ব্রোমিন (Br)। এরা হ্যালোজেন । F(9) : 1s² 2s² 2p⁵ Cl(17) : 1s² 2s² 2p⁶ 3s² 3p⁵ Br(35) : 1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹⁰ 4s² 4p⁵ তিনটি মৌলেরই সর্বশেষ শক্তিস্তরে 7টি ইলেকট্রন (ns2 np5) আছে। ফলে এরা প্রত্যেকে 1টি ইলেকট্রন গ্রহণ করে নিকটতম নিষ্ক্রিয় গ্যাসের ইলেকট্রন বিন্যাস অর্জন করে এবং একই রকম রাসায়নিক ধর্ম প্রদর্শন করে:\n১. এদের যোজনী 1 এবং এরা ইলেকট্রন গ্রহণ করে একক ঋণাত্মক আয়ন (F⁻, Cl⁻, Br⁻) গঠন করে।\n২. এরা দ্বিপরমাণুক অণু (F₂, Cl₂, Br₂) হিসেবে অবস্থান করে।\n৩. হাইড্রোজেনের সাথে বিক্রিয়া করে হাইড্রোজেন হ্যালাইড উৎপন্ন করে:\nH₂+F₂→2HF\nH₂+Cl₂→2HCl\nH₂+Br₂→2HBr\n৪. ধাতুর সাথে বিক্রিয়া করে লবণ উৎপন্ন করে:\n2Na+F₂→2NaF\n2Na+Cl₂→2NaCl\n2Na+Br₂→2NaBr\n৫. এরা সবাই জারক হিসেবে কাজ করে এবং অধাতু । তবে উপর থেকে নিচে আকার বৃদ্ধি পাওয়ায় সক্রিয়তা ও জারণ ক্ষমতা কমে (F \u003e Cl \u003e Br); তাই উপরের হ্যালোজেন নিচের হ্যালোজেনকে তার লবণ থেকে প্রতিস্থাপিত করতে পারে:\nCl₂+2NaBr→2NaCl+Br₂\nসুতরাং F, Y ও Z মৌলগুলোর যোজ্যতা স্তরের ইলেকট্রন বিন্যাস একই হওয়ায় এরা একই রকম রাসায়নিক ধর্ম প্রদর্শন করে, যা প্রমাণ করে যে একই গ্রুপের মৌলগুলো একই ধর্ম প্রদর্শন করে ।"}]},{"id":"ch4-cq23","chapter":4,"num":23,"importance":3,"topic":"পর্যায় সারণির একই গ্রুপের মৌলগুলো একই রকম রাসায়নিক ধর্ম প্রদর্শন করে","board":"যশোর বোর্ড ২০২২","stem":"নিচের উদ্দীপকটি পড়ো এবং প্রশ্নগুলোর উত্তর দাও:","diagramId":"ch4-cq23","subQuestions":[{"label":"ক","question":"ডোবেরাইনারের ত্রয়ী সূত্রটি লেখ।","answer":"সদৃশ ধর্মবিশিষ্ট তিনটি মৌলকে তাদের পারমাণবিক ভরের ছোট থেকে বড় ক্রমানুসারে সাজালে মাঝের মৌলটির পারমাণবিক ভর অপর দুটি মৌলের পারমাণবিক ভরের গড়ের প্রায় সমান হয়। একে ডোবেরাইনারের ত্রয়ী সূত্র বলে।"},{"label":"খ","question":"অক্সিজেনের যোজনী ও যোজ্যতা ইলেকট্রন সমান নয়– ব্যাখ্যা কর।","answer":"অক্সিজেনের (8O) ইলেকট্রন বিন্যাস: 1s² 2s² 2p⁴। এর সর্ববহিঃস্থ শক্তিস্তরে 6টি ইলেকট্রন আছে, তাই যোজ্যতা ইলেকট্রন 6। কিন্তু অষ্টক পূর্ণ করে নিয়নের মতো স্থিতিশীল বিন্যাস পেতে অক্সিজেনকে মাত্র 2টি ইলেকট্রন গ্রহণ বা শেয়ার করতে হয়। তাই অক্সিজেনের যোজনী 2। যেমন: H₂O তে O দুটি H এর সাথে যুক্ত। অর্থাৎ যোজনী নির্ভর করে বন্ধন গঠনে অংশ নেওয়া ইলেকট্রনের সংখ্যার উপর, বাইরের স্তরের মোট ইলেকট্রনের উপর নয়। তাই অক্সিজেনের যোজনী (2) ও যোজ্যতা ইলেকট্রন (6) সমান নয়।"},{"label":"গ","question":"(i)নং এর মৌলসমূহের ধাতব ধর্ম ব্যাখ্যা কর।","answer":"উদ্দীপকের (i)নং এর মৌলসমূহ বেরিলিয়াম (Be), ম্যাগনেসিয়াম (Mg) ও ক্যালসিয়াম (Ca); এরা গ্রুপ-2 এর মৃৎক্ষার ধাতু।\n4Be→1s2 2s2\n12Mg→1s2 2s2 2p6 3s2\n20Ca→1s2 2s2 2p6 3s2 3p6 4s2\nইলেকট্রন ত্যাগ করে ধনাত্মক আয়নে পরিণত হওয়ার প্রবণতাকে ধাতব ধর্ম বলে। এ মৌলগুলো সর্ববহিঃস্থ স্তরের 2টি ইলেকট্রন ত্যাগ করে ধনাত্মক আয়ন গঠন করে:\nBe→Be²⁺+2e⁻\nMg→Mg²⁺+2e⁻\nCa→Ca²⁺+2e⁻\nগ্রুপে উপর থেকে নিচে শক্তিস্তর সংখ্যা বাড়ায় পরমাণুর আকার বাড়ে, বাইরের ইলেকট্রনের উপর নিউক্লিয়াসের আকর্ষণ কমে এবং আয়নিকরণ শক্তি কমে। ফলে ইলেকট্রন ত্যাগ সহজ হয় এবং ধাতব ধর্ম বাড়ে । Be এর শক্তিস্তর 2টি, Mg এর 3টি এবং Ca এর 4টি। ধাতব ধর্মের ক্রম: Be \u003c Mg \u003c Ca সুতরাং, (i)নং এর মৌলগুলোর মধ্যে Ca এর ধাতব ধর্ম সবচেয়ে বেশি এবং Be এর সবচেয়ে কম।"},{"label":"ঘ","question":"(ii)নং এর মৌলসমূহ একই গ্রুপের অন্তর্ভুক্ত কি-না? বিক্রিয়াসহ বিশ্লেষণ কর।","answer":"উদ্দীপকের (ii)নং এর মৌলসমূহ: 9X = ফ্লোরিন (F), 17Y = ক্লোরিন (Cl) এবং 35Z = ব্রোমিন (Br)।\n9F→1s2 2s2 2p5\n17Cl→1s2 2s2 2p6 3s2 3p5\n35Br→1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p5\nতিনটি মৌলেরই সর্ববহিঃস্থ শক্তিস্তরের ইলেকট্রন বিন্যাস ns² np⁵, অর্থাৎ বাইরের স্তরে 7টি ইলেকট্রন । গ্রুপ নম্বর =10+(2+5)=17। একই রকম বহিঃস্থ ইলেকট্রন বিন্যাসের কারণে এদের রাসায়নিক ধর্মও একই রকম । (১) দ্বিপরমাণুক অণু গঠন: তিনটি মৌলই দ্বিপরমাণুক অণু F₂, Cl₂ ও Br₂ হিসেবে থাকে। (২) হাইড্রোজেনের সাথে বিক্রিয়া: তিনটিই হাইড্রোজেনের সাথে বিক্রিয়া করে হাইড্রোজেন হ্যালাইড তৈরি করে: অন্ধকারেও\nH₂+F₂⟶2HF\nসূর্যালোক\nH₂+Cl₂⟶2HCl\nতাপ\nH₂+Br₂⟶2HBr\nএদের জলীয় দ্রবণ এসিডধর্মী, যা কার্বনেটের সাথে বিক্রিয়া করে CO₂ উৎপন্ন করে:\nCaCO₃+2HCl→CaCl₂+CO₂+H₂O\n(৩) ধাতুর সাথে বিক্রিয়া: তিনটিই সোডিয়ামের সাথে বিক্রিয়া করে লবণ তৈরি করে:\n2Na+F₂→2NaF\n2Na+Cl₂→2NaCl\n2Na+Br₂→2NaBr\nসুতরাং, একই বহিঃস্থ ইলেকট্রন বিন্যাস (ns² np⁵) এবং একই রকম রাসায়নিক বিক্রিয়ার কারণে (ii)নং এর মৌলসমূহ একই গ্রুপের (গ্রুপ-17, হ্যালোজেন) অন্তর্ভুক্ত ।"}]},{"id":"ch5-cq1","chapter":5,"num":1,"importance":3,"topic":"যোজনী বা যোজ্যতা","board":"যশোর বোর্ড ২০২৬","stem":"মৌল ইলেকট্রন প্রধান শক্তিস্তর পারমাণবিক সংখ্যা বিন্যাস A — — 30 B ns2 np5 3 —\nC (n − 1)d6 ns2 4 — [এখানে A, B এবং C কোনো প্রচলিত মৌলের প্রতীক নয়]","subQuestions":[{"label":"ক","question":"ত্রয়ী সূত্র কী?","answer":"একই রকম ধর্মবিশিষ্ট তিনটি মৌলকে তাদের পারমাণবিক ভরের ঊর্ধ্বক্রমানুসারে সাজালে মাঝের মৌলটির পারমাণবিক ভর অপর দুটি মৌলের পারমাণবিক ভরের গড়ের প্রায় সমান হয়; একে ডোবেরাইনারের ত্রয়ী সূত্র বলে।"},{"label":"খ","question":"চতুর্থ শক্তিস্তরে কতটি উপশক্তিস্তর থাকতে পারে? ব্যাখ্যা কর।","answer":"কোনো প্রধান শক্তিস্তর n এ উপশক্তিস্তর থাকে l = 0 থেকে (n − 1) পর্যন্ত, অর্থাৎ মোট n সংখ্যক উপশক্তিস্তর । চতুর্থ শক্তিস্তরের জন্য n = 4, তাই l = 0, 1, 2, 3। l এর এই চারটি মানের জন্য যথাক্রমে s, p, d ও f উপশক্তিস্তর পাওয়া যায়। অতএব চতুর্থ শক্তিস্তরে 4টি উপশক্তিস্তর থাকতে পারে: 4s, 4p, 4d ও 4f।"},{"label":"গ","question":"A মৌলটির পর্যায় সারণিতে অবস্থান নির্ণয় কর।","answer":"A মৌলটির পারমাণবিক সংখ্যা 30। এর ইলেকট্রন বিন্যাস:\nA (30) : 1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹⁰ 4s² ইলেকট্রন বিন্যাসে সর্বোচ্চ প্রধান শক্তিস্তর n = 4। তাই A মৌলটি পর্যায় সারণির ৪র্থ পর্যায়ে অবস্থিত । A এর শেষ ইলেকট্রন d অরবিটালে প্রবেশ করেছে, তাই এটি d-ব্লক মৌল। d-ব্লক মৌলের গ্রুপ নম্বর = সর্ববহিঃস্থ s অরবিটালের ইলেকট্রন + তার আগের d অরবিটালের ইলেকট্রন । গ্রুপ নম্বর =2+10=12 অতএব A মৌলটি (জিংক, Zn) পর্যায় সারণির ৪র্থ পর্যায়ের গ্রুপ-12 এ অবস্থিত ।"},{"label":"ঘ","question":"‘B’ এর সাথে যৌগ গঠনের মাধ্যমে ‘C’ মৌলটি পরিবর্তনশীল যোজনী দেখায় — বিশ্লেষণ কর।","answer":"B এর ইলেকট্রন বিন্যাস ns2 np5 এবং প্রধান শক্তিস্তর 3, অর্থাৎ n = 3। সুতরাং B এর বিন্যাস 1s² 2s² 2p⁶ 3s² 3p⁵; পারমাণবিক সংখ্যা 17। তাই B হলো ক্লোরিন (Cl)। C এর ইলেকট্রন বিন্যাস (n − 1)d6 ns2 এবং n = 4। সুতরাং C এর বিন্যাস 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁶ 4s²; পারমাণবিক সংখ্যা 26। তাই C হলো আয়রন (Fe)। Fe এর 4s ও 3d উপশক্তিস্তরের শক্তির পার্থক্য খুব কম। তাই বিক্রিয়ার শর্তভেদে Fe কেবল 4s এর দুটি ইলেকট্রন অথবা 4s এর দুটি ও 3d এর একটি ইলেকট্রন ত্যাগ করতে পারে।\nFe→Fe²⁺+2e⁻[Fe²⁺ : 1s² 2s² 2p⁶ 3s² 3p⁶ 3d6]\nFe→Fe³⁺+3e⁻[Fe³⁺ : 1s² 2s² 2p⁶ 3s² 3p⁶ 3d5]\nFe³⁺ আয়নে 3d অরবিটাল অর্ধপূর্ণ (3d5) হওয়ায় এটি বেশ স্থিতিশীল । ফলে ক্লোরিনের সাথে বিক্রিয়ায় Fe দুই ধরনের ক্লোরাইড গঠন করে:\nFe+2HCl→FeCl₂+H₂\nΔ\n2Fe+3Cl₂⟶2FeCl₃\n2FeCl₂+Cl₂→2FeCl₃\nFeCl₂ [ফেরাস ক্লোরাইড] যৌগে Fe এর যোজনী 2 এবং FeCl₃ [ফেরিক ক্লোরাইড] যৌগে Fe এর যোজনী 3। অতএব, B (Cl) এর সাথে যৌগ গঠনের মাধ্যমে C (Fe) মৌলটি 2 ও 3 — এই দুই রকম অর্থাৎ পরিবর্তনশীল যোজনী প্রদর্শন করে ।"}]},{"id":"ch5-cq2","chapter":5,"num":2,"importance":3,"topic":"অষ্টক ও দুই-এর নিয়ম","board":"ময়মনসিংহ বোর্ড ২০২৬","stem":"A8 একটি পদার্থের আণবিক সংকেত । যার একটি অণুর ভর 4.2496 × 10⁻²² g। আবার 'B' ও 'C' মৌলের পারমাণবিক সংখ্যা যথাক্রমে 8 ও 12।","subQuestions":[{"label":"ক","question":"অরবিট কাকে বলে?","answer":"অরবিট: পরমাণুর নিউক্লিয়াসকে কেন্দ্র করে ইলেকট্রন যে নির্দিষ্ট শক্তিসম্পন্ন বৃত্তাকার পথে ঘোরে, তাকে অরবিট বা শক্তিস্তর বলে ।"},{"label":"খ","question":"Mg এর যোজনী ও যোজ্যতা ইলেকট্রন একই কেন? ব্যাখ্যা কর।","answer":"Mg (12) এর ইলেকট্রন বিন্যাস: 1s² 2s² 2p⁶ 3s²। এর সর্বশেষ শক্তিস্তরে 2টি ইলেকট্রন আছে, তাই Mg এর যোজ্যতা ইলেকট্রন 2টি। রাসায়নিক বিক্রিয়ায় Mg সর্বশেষ স্তরের এই 2টি ইলেকট্রন ত্যাগ করে নিকটবর্তী নিষ্ক্রিয় গ্যাস নিয়নের কাঠামো অর্জন করে: Mg→ Mg²⁺+2e⁻ কোনো মৌলের একটি পরমাণু বন্ধন গঠনে যতটি ইলেকট্রন ত্যাগ, গ্রহণ বা শেয়ার করে, সেটিই তার যোজনী । তাই Mg এর যোজনী 2।\nএভাবে Mg এর যোজনী ও যোজ্যতা ইলেকট্রন সংখ্যা একই (2)।"},{"label":"গ","question":"'A' মৌলের আপেক্ষিক পারমাণবিক ভর নির্ণয় কর।","answer":"দেওয়া আছে, A8 এর একটি অণুর ভর =4.2496×10⁻²²g আমরা জানি, 1 মোল A8 এ অণু থাকে 6.02 × 10²³ টি। A8 এর আণবিক ভর =4.2496×10⁻²²×6.02×10²³g/ mol =255.83g/mol ≈ 256 g/mol A8 অণুতে A এর পরমাণু 8টি। A এর আপেক্ষিক পারমাণবিক ভর =256/8=32 সুতরাং 'A' মৌলের আপেক্ষিক পারমাণবিক ভর 32; অর্থাৎ মৌলটি সালফার (S) এবং A8 হলো S₈।"},{"label":"ঘ","question":"'CA' ও 'AB₂' যৌগদ্বয়ের মধ্যে কোনটিতে অষ্টক নিয়মের ব্যতিক্রম ঘটে? বিশ্লেষণ কর।","answer":"গ অংশ থেকে, A = সালফার (S)। আবার পারমাণবিক সংখ্যা 8 হওয়ায় B = অক্সিজেন (O) এবং 12 হওয়ায় C = ম্যাগনেসিয়াম (Mg)। সুতরাং CA = MgS এবং AB₂=SO₂। Mg (12) : 1s² 2s² 2p⁶ 3s² S (16) : 1s² 2s² 2p⁶ 3s² 3p⁴ O (8) : 1s² 2s² 2p⁴ MgS যৌগ Mg পরমাণু সর্বশেষ স্তরের 2টি ইলেকট্রন ত্যাগ করে Mg²⁺ আয়নে এবং S পরমাণু 2টি ইলেকট্রন গ্রহণ করে S²⁻ আয়নে পরিণত হয়:\nMg→Mg²⁺+2e⁻\nS+2e⁻→S²⁻\nMg²⁺+S²⁻→MgS\nMg²⁺ আয়ন নিয়নের (2, 8) এবং S²⁻ আয়ন আর্গনের (2, 8, 8) ইলেকট্রন কাঠামো অর্জন করে। অর্থাৎ উভয়ের সর্বশেষ স্তরে 8টি ইলেকট্রন থাকে; MgS যৌগে অষ্টক নিয়ম মানা হয়। SO₂ যৌগ SO₂ অণুতে S পরমাণু প্রতিটি O পরমাণুর সাথে দুই জোড়া করে ইলেকট্রন শেয়ার করে দুটি দ্বিবন্ধন গঠন করে: O=S=O। এতে প্রতিটি O এর চারপাশে 8টি ইলেকট্রন থাকে। কিন্তু S পরমাণুর 6টি যোজ্যতা ইলেকট্রনের 4টি বন্ধনে অংশ নেয় এবং 2টি নিঃসঙ্গ জোড় হিসেবে থাকে। ফলে S এর চারপাশে ইলেকট্রন সংখ্যা = 4 জোড়া বন্ধন ইলেকট্রন (8টি) + 1 জোড়া নিঃসঙ্গ ইলেকট্রন (2টি) = 10টি। অর্থাৎ SO₂ অণুতে কেন্দ্রীয় S পরমাণুর সর্বশেষ স্তরে 8টির বেশি (10টি) ইলেকট্রন থাকে। সুতরাং CA (MgS) যৌগে অষ্টক নিয়ম মানা হলেও AB₂ (SO₂) যৌগে অষ্টক নিয়মের ব্যতিক্রম ঘটে।"}]},{"id":"ch5-cq3","chapter":5,"num":3,"importance":3,"topic":"অষ্টক ও দুই-এর নিয়ম","board":"সিলেট বোর্ড ২০২৬","stem":"A, D এবং E তিনটি মৌলের পারমাণবিক সংখ্যা যথাক্রমে 15, 17 এবং 29। [এখানে A, D, E প্রতীকী অর্থে ব্যবহৃত]","subQuestions":[{"label":"ক","question":"ভরসংখ্যা কাকে বলে?","answer":"ভরসংখ্যা: কোনো মৌলের পরমাণুর নিউক্লিয়াসে উপস্থিত প্রোটন ও নিউট্রনের মোট সংখ্যাকে ঐ মৌলের ভরসংখ্যা বলে।"},{"label":"খ","question":"ক্যালসিয়ামকে মৃৎক্ষার ধাতু বলা হয় কেন? ব্যাখ্যা করো।","answer":"ক্যালসিয়াম (Ca) পর্যায় সারণির গ্রুপ 2 এর মৌল। এর অক্সাইড ও হাইড্রক্সাইড ক্ষারধর্মী ।\n2Ca+O₂→2CaO\nCaO+H₂O→Ca(OH)₂\nতাছাড়া ক্যালসিয়াম প্রকৃতিতে মাটির বিভিন্ন খনিজ যেমন চুনাপাথর (CaCO₃), জিপসাম (CaSO₄.2H₂O) ইত্যাদি রূপে মৃত্তিকায় পাওয়া যায়। মাটিতে পাওয়া যায় এবং অক্সাইড ও হাইড্রক্সাইড ক্ষারীয়, তাই ক্যালসিয়ামকে মৃৎক্ষার ধাতু বলা হয়।"},{"label":"গ","question":"E-মৌলের ইলেকট্রন বিন্যাস সাধারণ নিয়মের ব্যতিক্রম কেন? ব্যাখ্যা করো।","answer":"উদ্দীপকের E মৌলের পারমাণবিক সংখ্যা 29, অর্থাৎ E হলো কপার (Cu)। আউফবাউ নীতি অনুসারে সাধারণ নিয়মে Cu এর ইলেকট্রন বিন্যাস হওয়ার কথা: Cu(29) : 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁹ 4s² কিন্তু Cu এর প্রকৃত ইলেকট্রন বিন্যাস হলো: Cu(29) : 1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹⁰ 4s¹ d অরবিটাল অর্ধপূর্ণ (d5) বা সম্পূর্ণ পূর্ণ (d10) হলে পরমাণু অধিক স্থিতিশীল হয়। 3d⁹ অবস্থার চেয়ে 3d¹⁰ অবস্থা বেশি স্থিতিশীল । তাই 4s অরবিটাল থেকে একটি ইলেকট্রন 3d অরবিটালে চলে গিয়ে 3d অরবিটাল পূর্ণ করে। অধিক স্থিতিশীলতা অর্জনের জন্যই E (Cu) মৌলের ইলেকট্রন বিন্যাস সাধারণ নিয়মের ব্যতিক্রম ।"},{"label":"ঘ","question":"AD₃ এবং AD₅ যৌগ গঠনে অষ্টক নিয়ম মেনে চলার সম্ভাব্যতা যাচাই করো।","answer":"উদ্দীপকের A এর পারমাণবিক সংখ্যা 15, তাই A হলো ফসফরাস (P); D এর পারমাণবিক সংখ্যা 17, তাই D হলো ক্লোরিন (Cl)। সুতরাং AD₃=PCl₃ এবং AD₅=PCl₅। P(15) : 1s² 2s² 2p⁶ 3s² 3p³ Cl(17) : 1s² 2s² 2p⁶ 3s² 3p⁵ অষ্টক নিয়ম অনুসারে বন্ধন গঠনের পর প্রতিটি পরমাণুর সর্বশেষ শক্তিস্তরে 8টি ইলেকট্রন থাকে। PCl₃ গঠন P এর সর্বশেষ স্তরে 5টি ইলেকট্রন । P তার 3টি ইলেকট্রন তিনটি Cl পরমাণুর প্রত্যেকটির 1টি করে ইলেকট্রনের সাথে শেয়ার করে তিনটি P-Cl সমযোজী বন্ধন গঠন করে । বন্ধন গঠনের পর P এর সর্বশেষ স্তরে ইলেকট্রন =5+3=8টি (3 জোড়া বন্ধন ইলেকট্রন + 1 জোড়া মুক্ত ইলেকট্রন) এবং প্রতিটি Cl এর সর্বশেষ স্তরেও 8টি ইলেকট্রন থাকে । অর্থাৎ PCl₃ গঠনে অষ্টক নিয়ম মেনে চলে। PCl₅ গঠন PCl₅ গঠনে P তার 5টি ইলেকট্রনই পাঁচটি Cl পরমাণুর সাথে শেয়ার করে পাঁচটি P-Cl সমযোজী বন্ধন গঠন করে । বন্ধন গঠনের পর P এর সর্বশেষ স্তরে ইলেকট্রন =5×2=10টি, যা 8 এর বেশি । যদিও প্রতিটি Cl অষ্টক পূর্ণ করে, কেন্দ্রীয় পরমাণু P অষ্টক নিয়ম মানে না। সুতরাং AD₃ (PCl₃) গঠনে অষ্টক নিয়ম মেনে চলা সম্ভব হলেও AD₅ (PCl₅) গঠনে অষ্টক নিয়ম মেনে চলা সম্ভব নয়; এটি অষ্টক নিয়মের একটি ব্যতিক্রম ।"}]},{"id":"ch5-cq4","chapter":5,"num":4,"importance":3,"topic":"রাসায়নিক বন্ধন ও রাসায়নিক বন্ধন গঠনের কারণ","board":"সিলেট বোর্ড ২০২৬","stem":"³⁹A, ⁴⁰A, 12Q, 8R. [A, Q, R প্রতীকী অর্থে ব্যবহৃত এবং ³⁹A এবং ⁴⁰A প্রকৃতিতে প্রাপ্তির পরিমাণ যথাক্রমে 90% এবং 10%]","subQuestions":[{"label":"ক","question":"অণু কাকে বলে?","answer":"অণু: মৌলিক বা যৌগিক পদার্থের ক্ষুদ্রতম কণা, যা ঐ পদার্থের ধর্ম বজায় রেখে স্বাধীনভাবে অবস্থান করতে পারে, তাকে অণু বলে।"},{"label":"খ","question":"লিথিয়াম অপেক্ষা পটাশিয়াম অধিক সক্রিয় কেন? ব্যাখ্যা করো।","answer":"লিথিয়াম (Li) ও পটাশিয়াম (K) উভয়ই গ্রুপ 1 এর ক্ষার ধাতু। এরা সর্বশেষ স্তরের 1টি ইলেকট্রন ত্যাগ করে বিক্রিয়া করে। Li(3) : 1s² 2s¹ K(19) : 1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹ Li এর যোজ্যতা ইলেকট্রন দ্বিতীয় শক্তিস্তরে কিন্তু K এর যোজ্যতা ইলেকট্রন চতুর্থ শক্তিস্তরে থাকে। ফলে K এর আকার বড় এবং নিউক্লিয়াস থেকে সর্বশেষ ইলেকট্রনের দূরত্ব বেশি, তাই আকর্ষণ কম। এজন্য K এর আয়নিকরণ শক্তি Li অপেক্ষা কম এবং K সহজে ইলেকট্রন ত্যাগ করতে পারে। তাই লিথিয়াম অপেক্ষা পটাশিয়াম অধিক সক্রিয় ।"},{"label":"গ","question":"A-মৌলটির গড় আপেক্ষিক পারমাণবিক ভর নির্ণয় করো।","answer":"উদ্দীপকের A মৌলের দুটি আইসোটোপ ³⁹A ও ⁴⁰A, যাদের প্রাপ্তির পরিমাণ যথাক্রমে 90% ও 10%। আমরা জানি, গড় আপেক্ষিক পারমাণবিক ভর = (প্রথম আইসোটোপের ভর × শতকরা পরিমাণ + দ্বিতীয় আইসোটোপের ভর × শতকরা পরিমাণ)/100 A এর গড় আপেক্ষিক পারমাণবিক ভর =(39×90+40×10)/100 =(3510+400)/100 =3910/100 = 39.1 সুতরাং A মৌলটির গড় আপেক্ষিক পারমাণবিক ভর 39.1।"},{"label":"ঘ","question":"উদ্দীপকের Q ও R মৌলের স্থিতিশীলতা অর্জনের প্রক্রিয়া ভিন্ন কেন? বিশ্লেষণ করো।","answer":"উদ্দীপকের Q এর পারমাণবিক সংখ্যা 12, তাই Q হলো ম্যাগনেসিয়াম (Mg); R এর পারমাণবিক সংখ্যা 8, তাই R হলো অক্সিজেন (O)। Mg(12) : 1s² 2s² 2p⁶ 3s² O(8) : 1s² 2s² 2p⁴ পরমাণুগুলো নিকটতম নিষ্ক্রিয় গ্যাসের ইলেকট্রন বিন্যাস অর্জন করে স্থিতিশীল হতে চায়। Q (Mg) এর স্থিতিশীলতা অর্জন Mg এর সর্বশেষ স্তরে মাত্র 2টি ইলেকট্রন । 6টি ইলেকট্রন গ্রহণের চেয়ে 2টি ইলেকট্রন ত্যাগ করা সহজ। তাই Mg ধাতু হিসেবে 2টি ইলেকট্রন ত্যাগ করে Mg²⁺ ক্যাটায়ন গঠন করে এবং নিয়নের (Ne) মতো স্থিতিশীল ইলেকট্রন বিন্যাস অর্জন করে ।\nMg→Mg²⁺+2e⁻\nMg²⁺ : 1s² 2s² 2p⁶ R (O) এর স্থিতিশীলতা অর্জন O এর সর্বশেষ স্তরে 6টি ইলেকট্রন । 6টি ইলেকট্রন ত্যাগের চেয়ে 2টি ইলেকট্রন গ্রহণ করা সহজ। তাই O অধাতু হিসেবে 2টি ইলেকট্রন গ্রহণ করে O²⁻ অ্যানায়ন গঠন করে নিয়নের ইলেকট্রন বিন্যাস অর্জন করে।\nO+2e⁻→O²⁻\nO²⁻ : 1s² 2s² 2p⁶ অধাতুর সাথে যুক্ত হলে O ইলেকট্রন শেয়ার করেও অষ্টক পূর্ণ করে, যেমন O₂ অণুতে দুটি O পরমাণু 2 জোড়া ইলেকট্রন শেয়ার করে দ্বিবন্ধন গঠন করে। Mg ও O পরস্পরের সাথে বিক্রিয়া করলে Mg এর ত্যাগকৃত 2টি ইলেকট্রন O গ্রহণ করে এবং আয়নিক যৌগ MgO গঠিত হয়।\n2Mg+O₂→2MgO\nসুতরাং Q (Mg) ইলেকট্রন ত্যাগের মাধ্যমে এবং R (O) ইলেকট্রন গ্রহণের (বা শেয়ারের) মাধ্যমে স্থিতিশীলতা অর্জন করে । যোজ্যতা স্তরে ইলেকট্রন সংখ্যার ভিন্নতার কারণেই এদের স্থিতিশীলতা অর্জনের প্রক্রিয়া ভিন্ন।"}]},{"id":"ch5-cq5","chapter":5,"num":5,"importance":3,"topic":"আয়নিক বন্ধন বা তড়িৎযোজী বন্ধন","board":"বরিশাল বোর্ড ২০২৬","stem":"মৌল সর্ববহিঃস্থ স্তরের ইলেকট্রন বিন্যাস A 3s² 3p⁴ B 3s² C 2s² 2p⁵ [এখানে A, B এবং C প্রতীকী অর্থে ব্যবহৃত]","subQuestions":[{"label":"ক","question":"যৌগমূলক কাকে বলে?","answer":"একাধিক মৌলের কয়েকটি পরমাণু একত্রে গুচ্ছ আকারে থেকে কোনো রাসায়নিক বিক্রিয়ায় একটি একক আয়নের মতো আচরণ করে এবং একটি নির্দিষ্ট যোজনী প্রদর্শন করে, এরূপ পরমাণুগুচ্ছকে যৌগমূলক বলে। যেমন: SO₄²⁻, NH₄⁺।"},{"label":"খ","question":"প্রাইমারি স্ট্যান্ডার্ড পদার্থ বলতে কী বোঝায়?","answer":"যেসব পদার্থ অত্যন্ত বিশুদ্ধ অবস্থায় পাওয়া যায়, বায়ুর উপাদান (O₂, CO₂, জলীয় বাষ্প) দ্বারা পরিবর্তিত হয় না, আর্দ্রতা শোষণ করে না, দীর্ঘদিন সংরক্ষণে ঘনমাত্রা অপরিবর্তিত থাকে এবং যাদের সঠিক ভর মেপে সরাসরি নির্দিষ্ট ঘনমাত্রার প্রমাণ দ্রবণ তৈরি করা যায়, তাদের প্রাইমারি স্ট্যান্ডার্ড পদার্থ বলে।\nযেমন: অনার্দ্র Na₂CO₃, K₂Cr₂O₇, অক্সালিক এসিড ইত্যাদি । অপরদিকে NaOH বায়ু থেকে আর্দ্রতা ও CO₂ শোষণ করে বলে এটি প্রাইমারি স্ট্যান্ডার্ড পদার্থ নয়।"},{"label":"গ","question":"উদ্দীপকের A ও B মৌলের বন্ধন গঠন প্রক্রিয়া বর্ণনা কর।","answer":"উদ্দীপকের A মৌলের সর্ববহিঃস্থ স্তরের ইলেকট্রন বিন্যাস 3s² 3p⁴। সুতরাং A এর পূর্ণ ইলেকট্রন বিন্যাস 1s² 2s² 2p⁶ 3s² 3p⁴, মোট ইলেকট্রন 16। অতএব A হলো সালফার (S)। B মৌলের সর্ববহিঃস্থ স্তরের ইলেকট্রন বিন্যাস 3s²। সুতরাং B এর পূর্ণ ইলেকট্রন বিন্যাস 1s² 2s² 2p⁶ 3s², মোট ইলেকট্রন 12। অতএব B হলো ম্যাগনেসিয়াম (Mg)। Mg একটি ধাতু এবং S একটি অধাতু । তাই এরা আয়নিক বন্ধনের মাধ্যমে MgS যৌগ গঠন করে । Mg পরমাণু তার সর্ববহিঃস্থ 3s অরবিটালের 2টি ইলেকট্রন ত্যাগ করে নিকটতম নিষ্ক্রিয় গ্যাস নিয়নের (Ne) ইলেকট্রন বিন্যাস অর্জন করে এবং Mg²⁺ আয়নে পরিণত হয়:\nMg(1s22s²2p⁶3s2)→Mg²⁺(1s22s²2p6)+2e⁻\nঅপরদিকে S পরমাণু Mg কর্তৃক ত্যাগকৃত 2টি ইলেকট্রন গ্রহণ করে নিকটতম নিষ্ক্রিয় গ্যাস আর্গনের (Ar) ইলেকট্রন বিন্যাস অর্জন করে এবং S²⁻ আয়নে পরিণত হয়:\nS(1s22s²2p⁶3s²3p4)+2e⁻→S²⁻(1s22s²2p⁶3s²3p6)\nউৎপন্ন বিপরীত চার্জযুক্ত Mg²⁺ ও S²⁻ আয়ন স্থির বৈদ্যুতিক আকর্ষণ বলের মাধ্যমে পরস্পরের সাথে যুক্ত হয়ে আয়নিক যৌগ ম্যাগনেসিয়াম সালফাইড গঠন করে:\nMg²⁺+S²⁻→MgS\nঅতএব A (S) ও B (Mg) মৌলের মধ্যে আয়নিক বন্ধন গঠিত হয়।"},{"label":"ঘ","question":"উদ্দীপকের B ও C মৌল দুটির সর্বশেষ শক্তিস্তরের একটি ইলেকট্রনের কৌণিক ভরবেগ সমান হবে কি? গাণিতিক বিশ্লেষণ কর।","answer":"উদ্দীপকের B মৌলের ইলেকট্রন বিন্যাস 1s² 2s² 2p⁶ 3s²; এটি ম্যাগনেসিয়াম (Mg)। এর সর্বশেষ শক্তিস্তর n = 3। C মৌলের ইলেকট্রন বিন্যাস 1s² 2s² 2p⁵; এটি ফ্লোরিন (F)। এর সর্বশেষ শক্তিস্তর n = 2। বোর পরমাণু মডেল অনুসারে, n তম শক্তিস্তরে আবর্তনরত একটি ইলেকট্রনের কৌণিক ভরবেগ, mvr=nh/2π\nএখানে, প্ল্যাংক ধ্রুবক h=6.626×10⁻³⁴Js।\nB (Mg) মৌলের ক্ষেত্রে (n = 3) mvr=(3×6.626×10⁻³⁴)/(2×3.1416)Js =3.164×10⁻³⁴Js\nC (F) মৌলের ক্ষেত্রে (n = 2) mvr=(2×6.626×10⁻³⁴)/(2×3.1416)Js =2.109×10⁻³⁴Js অনুপাত =3.164×10⁻³⁴ : 2.109×10⁻³⁴=3 : 2 দেখা যাচ্ছে, B মৌলের সর্বশেষ শক্তিস্তরের ইলেকট্রনের কৌণিক ভরবেগ C মৌলের তুলনায় বেশি (1.5 গুণ)। কৌণিক ভরবেগ শক্তিস্তরের ক্রমিক সংখ্যা n এর সমানুপাতিক এবং B ও C এর সর্বশেষ শক্তিস্তর ভিন্ন (3 ও 2)। অতএব, B ও C মৌল দুটির সর্বশেষ শক্তিস্তরের একটি ইলেকট্রনের কৌণিক ভরবেগ সমান হবে না।"}]},{"id":"ch5-cq6","chapter":5,"num":6,"importance":3,"topic":"আয়নিক বন্ধন বা তড়িৎযোজী বন্ধন","board":"দিনাজপুর বোর্ড ২০২৬","stem":"প্রকৃতিতে প্রাপ্ত একটি মৌলের চারটি আইসোটোপ, তাদের শতকরা পরিমাণ ও ভরসংখ্যা প্রদত্ত হলো : মৌল শতকরা পরিমাণ ভর সংখ্যা (আইসোটোপসমূহ) A 94.99% 32 0.75% 33 4.25% 34 0.01% 36 A মৌলটিতে সমসংখ্যক প্রোটন ও নিউট্রন রয়েছে ।","subQuestions":[{"label":"ক","question":"আইসোটোপ কাকে বলে?","answer":"আইসোটোপ: যেসব পরমাণুর প্রোটন সংখ্যা সমান কিন্তু ভরসংখ্যা ভিন্ন, তাদেরকে পরস্পরের আইসোটোপ বলে। যেমন: ¹H, ²H, ³H।"},{"label":"খ","question":"ননরিডক্স বিক্রিয়া কী? উদাহরণসহ ব্যাখ্যা কর।","answer":"যে রাসায়নিক বিক্রিয়ায় কোনো ইলেকট্রন আদান-প্রদান হয় না, অর্থাৎ বিক্রিয়ক ও উৎপাদে মৌলসমূহের জারণ সংখ্যার কোনো পরিবর্তন ঘটে না, তাকে ননরিডক্স বিক্রিয়া বলে। যেমন:\nNaOH+HCl→NaCl+H₂O\nএখানে বিক্রিয়ার আগে ও পরে Na এর জারণ সংখ্যা +1, O এর −2, H এর +1 এবং Cl এর −1 অপরিবর্তিত থাকে। কোনো মৌলের জারণ বা বিজারণ ঘটে না। তাই এটি একটি ননরিডক্স বিক্রিয়া । প্রশমন ও অধঃক্ষেপণ বিক্রিয়া সাধারণত ননরিডক্স বিক্রিয়া ।"},{"label":"গ","question":"উদ্দীপকের A মৌলটির গড় আপেক্ষিক পারমাণবিক ভর নির্ণয় কর।","answer":"উদ্দীপক অনুসারে A মৌলের আইসোটোপগুলোর ভরসংখ্যা ও শতকরা পরিমাণ: ভরসংখ্যা শতকরা পরিমাণ 32 94.99% 33 0.75% 34 4.25% 36 0.01% গড় আপেক্ষিক পারমাণবিক ভর = (32×94.99+33×0.75+34×4.25+36×0.01)/100 =(3039.68+24.75+144.5+0.36)/100 =3209.29/100 = 32.09 অতএব, A মৌলটির গড় আপেক্ষিক পারমাণবিক ভর 32.09।"},{"label":"ঘ","question":"দেখাও যে, A মৌলটি আয়নিক ও সমযোজী উভয় ধরণের যৌগ গঠন করে — বিশ্লেষণ কর।","answer":"A মৌলের প্রধান আইসোটোপের ভরসংখ্যা 32 এবং এতে প্রোটন ও নিউট্রন সংখ্যা সমান । প্রোটন সংখ্যা =32/2=16 সুতরাং A মৌলের পারমাণবিক সংখ্যা 16, অর্থাৎ A হলো সালফার (S)। S (16) : 1s² 2s² 2p⁶ 3s² 3p⁴ বা 2, 8, 6 সালফারের সর্বশেষ শক্তিস্তরে 6টি ইলেকট্রন আছে। অষ্টক পূরণের জন্য এর আরও 2টি ইলেকট্রন প্রয়োজন, যা এটি ইলেকট্রন গ্রহণ অথবা শেয়ার উভয় উপায়েই অর্জন করতে পারে । আয়নিক যৌগ গঠন সক্রিয় ধাতু Na এর সাথে বিক্রিয়াকালে দুটি Na পরমাণু প্রত্যেকে 1টি করে ইলেকট্রন ত্যাগ করে Na⁺ আয়ন তৈরি করে এবং S পরমাণু ঐ 2টি ইলেকট্রন গ্রহণ করে S²⁻ আয়ন তৈরি করে।\n2Na→2Na⁺+2e⁻ ; S+2e⁻→S²⁻\n2Na+S→Na₂S\nNa⁺ ও S²⁻ আয়নের মধ্যে স্থির বৈদ্যুতিক আকর্ষণে আয়নিক বন্ধন গঠিত হয়। অর্থাৎ Na₂S একটি আয়নিক যৌগ। সমযোজী যৌগ গঠন অধাতু H এর সাথে বিক্রিয়াকালে S পরমাণু দুটি H পরমাণুর প্রত্যেকের সাথে একটি করে ইলেকট্রন জোড় শেয়ার করে। ফলে S এর সর্বশেষ স্তরে 8টি এবং প্রতিটি H এর 2টি ইলেকট্রন হয়।\nH₂+S→H₂S\nH − S − H এভাবে H₂S অণুতে দুটি S−H সমযোজী বন্ধন গঠিত হয়। একইভাবে অক্সিজেনের সাথে S ইলেকট্রন শেয়ার করে সমযোজী যৌগ SO₂ গঠন করে।\nS+O₂→SO₂\nসুতরাং A মৌল অর্থাৎ সালফার ধাতুর সাথে ইলেকট্রন গ্রহণ করে আয়নিক যৌগ (Na₂S) এবং অধাতুর সাথে ইলেকট্রন শেয়ার করে সমযোজী যৌগ (H₂S, SO₂) গঠন করে।"}]},{"id":"ch5-cq7","chapter":5,"num":7,"importance":3,"topic":"সমযোজী বন্ধন","board":"রাজশাহী বোর্ড ২০২৬","stem":"মৌল পর্যায় গ্রুপ X 2 17 Y 3 2 Z 4 1 [X, Y এবং Z প্রতীকী অর্থে ব্যবহৃত ।]","subQuestions":[{"label":"ক","question":"বিক্রিয়ার হার কাকে বলে?","answer":"বিক্রিয়ার হার: একক সময়ে কোনো বিক্রিয়কের ঘনমাত্রা হ্রাস বা উৎপাদের ঘনমাত্রা বৃদ্ধির পরিমাণকে বিক্রিয়ার হার বলে।"},{"label":"খ","question":"বর্ষাকালে ছাদে পানি ব্যবহার করা হয় কেন? ব্যাখ্যা কর।","answer":"ছাদে পানি দিলে সেই পানি বাষ্পীভূত হয়। পানি তরল থেকে বাষ্পে পরিণত হওয়ার সময় সুপ্ততাপ শোষণ করে, যা একটি তাপহারী প্রক্রিয়া ।\nH₂O(l)→H₂O(g) ; ΔH = (+)\nবাষ্পীভবনের এই প্রয়োজনীয় তাপ পানি ছাদ ও আশপাশ থেকে গ্রহণ করে, ফলে ছাদের তাপমাত্রা কমে যায় এবং ঘর ঠান্ডা থাকে। বর্ষাকালের ভ্যাপসা গরমে ঘর শীতল রাখতে তাই ছাদে পানি ব্যবহার করা হয়।"},{"label":"গ","question":"X ও Y মৌল দ্বারা গঠিত যৌগের বন্ধন প্রকৃতি ব্যাখ্যা কর।","answer":"X মৌলটি 2য় পর্যায়ের গ্রুপ-17 এ অবস্থিত, তাই X হলো ফ্লোরিন (F)। Y মৌলটি 3য় পর্যায়ের গ্রুপ-2 এ অবস্থিত, তাই Y হলো ম্যাগনেসিয়াম (Mg)। Mg (12) : 1s² 2s² 2p⁶ 3s² F (9) : 1s² 2s² 2p⁵ Mg তার সর্বশেষ স্তরের 2টি
