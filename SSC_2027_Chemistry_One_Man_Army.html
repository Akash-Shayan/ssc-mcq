কাঁচা আম টক।"},{"id":"ch1-mcq5","chapter":1,"num":5,"importance":2,"topic":"রসায়ন পরিচিতি","question":"মোমে কোন উপাদান মৌলটি উপস্থিত –","boards":"কুমিল্লা বোর্ড ২০২৪","options":["ক্লোরিন","হাইড্রোজেন","অক্সিজেন","নাইট্রোজেন"],"answerIndex":1,"explanation":"মোম একটি হাইড্রোকার্বন, অর্থাৎ কার্বন ও হাইড্রোজেনের যৌগ। তাই মোমে কার্বনের সাথে হাইড্রোজেন মৌল থাকে ।"},{"id":"ch1-mcq6","chapter":1,"num":6,"importance":2,"topic":"রসায়ন পরিচিতি","question":"কেরোসিনে কোন মৌলটি উপস্থিত?","boards":"বরিশাল বোর্ড ২০২৪","options":["কার্বন","ক্লোরিন","অক্সিজেন","নাইট্রোজেন"],"answerIndex":0,"explanation":"কেরোসিনের মূল উপাদান হাইড্রোকার্বন, যা কার্বন (C) ও হাইড্রোজেন (H) দিয়ে গঠিত । অপশনগুলোর মধ্যে কেবল কার্বনই কেরোসিনে উপস্থিত ।"},{"id":"ch1-mcq7","chapter":1,"num":7,"importance":2,"topic":"রসায়ন পরিচিতি","question":"কাঁচা আমে বিভিন্ন ধরনের জৈব এসিড থাকে। যখন আম পাকে তখন এই এসিডগুলো থেকে কী সৃষ্টি হয়?","boards":"ময়মনসিংহ বোর্ড ২০২৪","options":["গ্লুকোজ ও ফ্রুক্টোজ","চিনি","কার্বোহাইড্রেট","সেলুলোজ"],"answerIndex":0,"explanation":"কাঁচা আমের জৈব এসিডগুলো (সাক্সিনিক, ম্যালেয়িক) আম পাকার সময় রাসায়নিক পরিবর্তনে গ্লুকোজ ও ফ্রুক্টোজে পরিণত হয়। তাই পাকা আম মিষ্টি ।"},{"id":"ch1-mcq8","chapter":1,"num":8,"importance":2,"topic":"রসায়ন পরিচিতি","question":"কপার ও টিন গলিয়ে তৈরি সংকর ধাতু কোনটি?","boards":"ঢাকা বোর্ড ২০২৩","options":["স্টিল","পিতল","ডুরালমিন","ব্রোঞ্জ"],"answerIndex":3,"explanation":"খ্রিষ্টপূর্ব 3500 অব্দের দিকে কপার (Cu) ও টিন (Sn) গলিয়ে তরলে পরিণত করে একত্রে মেশানো হয়, পরে ঠান্ডা করে যে কঠিন সংকর ধাতু পাওয়া যায় তা-ই ব্রোঞ্জ (কাঁসা)। পিতল হলো কপার ও জিংকের সংকর, স্টিল আয়রন ও কার্বনের সংকর, ডুরালমিন অ্যালুমিনিয়ামের সংকর। তাই উত্তর ঘ) ব্রোঞ্জ ।"},{"id":"ch1-mcq9","chapter":1,"num":9,"importance":2,"topic":"রসায়ন পরিচিতি","question":"কপারের সাথে অন্য কোন ধাতুকে মিশিয়ে ব্রোঞ্জ তৈরি করা হয়?","boards":"বরিশাল বোর্ড ২০২৩","options":["Fe","Zn","Sn","Pb"],"answerIndex":2,"explanation":"ব্রোঞ্জ হলো কপার (Cu) ও টিন (Sn) এর সংকর ধাতু। কপার ও টিন গলিয়ে মিশিয়ে ঠান্ডা করলে ব্রোঞ্জ পাওয়া যায়। Zn মেশালে হয় পিতল; Fe বা Pb দিয়ে ব্রোঞ্জ হয় না। তাই উত্তর গ) Sn।"},{"id":"ch1-mcq10","chapter":1,"num":10,"importance":2,"topic":"রসায়ন পরিচিতি","question":"কোনটির আবিষ্কার মানব সভ্যতাকে অনেক দূর এগিয়ে নিয়ে যায়?","boards":"কুমিল্লা বোর্ড ২০২৩","options":["সোনা","রুপা","ব্রোঞ্জ","তামা"],"answerIndex":2,"explanation":"ব্রোঞ্জ দিয়ে মানুষ অস্ত্র তৈরি করত এবং পশু শিকার, কৃষিকাজ, জ্বালানির কাঠ সংগ্রহ ইত্যাদি কাজে তা ব্যবহার করত । এভাবে ব্রোঞ্জের আবিষ্কার মানব সভ্যতাকে অনেক দূর এগিয়ে নিয়ে গেছে। উত্তর গ) ব্রোঞ্জ ।"},{"id":"ch1-mcq11","chapter":1,"num":11,"importance":2,"topic":"রসায়ন পরিচিতি","question":"কোন ভাষার শব্দ হতে Chemistry শব্দের উৎপত্তি হয়েছে?","boards":"ঢাকা বোর্ড ২০২৩","options":["ইংরেজি","আরবি","ফারসি","গ্রিক"],"answerIndex":1,"explanation":"মধ্যযুগীয় আরবের রসায়ন চর্চার নাম আলকেমি, যা এসেছে আরবি শব্দ 'আল-কিমিয়া' থেকে । 'আল-কিমিয়া' এসেছে 'কিমি' (Chemi) শব্দ থেকে, আর এই Chemi শব্দ থেকেই Chemistry শব্দের উৎপত্তি। অর্থাৎ Chemistry শব্দটি আরবি আল-কিমিয়ার মাধ্যমেই এসেছে — উত্তর খ) আরবি ।"},{"id":"ch1-mcq12","chapter":1,"num":12,"importance":2,"topic":"রসায়ন পরিচিতি","question":"ব্রোঞ্জ কোন দুটি ধাতুর সংকর?","boards":"বরিশাল বোর্ড ২০২২","options":["আয়রন, কপার","আয়রন, জিংক","কপার, টিন","জিংক, টিন"],"answerIndex":2,"explanation":"কপার ও টিন গলিয়ে মিশিয়ে ব্রোঞ্জ (কাঁসা) তৈরি হয়; এতে সাধারণত প্রায় 90% কপার ও 10% টিন থাকে। কপার ও জিংক মেশালে হয় পিতল। তাই উত্তর গ) কপার, টিন।"},{"id":"ch1-mcq13","chapter":1,"num":13,"importance":2,"topic":"রসায়ন পরিচিতি","question":"কাঁচা আমে কোন এসিড বিদ্যমান?","boards":"দিনাজপুর বোর্ড ২০২২","options":["সাইট্রিক এসিড","ম্যালেয়িক এসিড","অক্সালিক এসিড","এসিটিক এসিড"],"answerIndex":1,"explanation":"কাঁচা আমে সাক্সিনিক এসিড, ম্যালেয়িক এসিড প্রভৃতি জৈব এসিড থাকে, তাই কাঁচা আম টক। আম পাকলে এসব এসিড রাসায়নিক পরিবর্তনে গ্লুকোজ ও ফ্রুক্টোজে পরিণত হয়, তাই পাকা আম মিষ্টি । উত্তর খ) ম্যালেয়িক এসিড।"},{"id":"ch1-mcq14","chapter":1,"num":14,"importance":2,"topic":"রসায়ন পরিচিতি","question":"পাকস্থলীতে কোনটি জমা হলে পেটে এসিডিটি সমস্যা হয়?","boards":"ময়মনসিংহ বোর্ড ২০২২","options":["অতিরিক্ত সালফিউরিক এসিড","অতিরিক্ত হাইড্রোক্লোরিক এসিড","অতিরিক্ত অ্যালুমিনিয়াম হাইড্রোক্সাইড","অতিরিক্ত ম্যাগনেসিয়াম হাইড্রোক্সাইড"],"answerIndex":1,"explanation":"পাকস্থলীতে অতিরিক্ত হাইড্রোক্লোরিক এসিড (HCl) নিঃসরিত হলে পেটে এসিডিটির সমস্যা হয়। এন্টাসিডে থাকা Al(OH)₃ ও Mg(OH)₂ ক্ষারকীয় পদার্থ, এরা এসিডকে প্রশমিত করে:\nMg(OH)₂+2HCl→MgCl₂+2H₂O\nতাই উত্তর খ) অতিরিক্ত হাইড্রোক্লোরিক এসিড ।"},{"id":"ch1-mcq15","chapter":1,"num":15,"importance":2,"topic":"রসায়ন পরিচিতি","question":"কেরোসিন ও মোমের মূল উপাদান কোনটি?","boards":"ঢাকা বোর্ড ২০২০","options":["সালফার","হাইড্রোকার্বন","কার্বোহাইড্রেট","কার্বন"],"answerIndex":1,"explanation":"কেরোসিন, প্রাকৃতিক গ্যাস ও মোমের মূল উপাদান হাইড্রোকার্বন, অর্থাৎ কার্বন ও হাইড্রোজেনের যৌগ। এগুলোর দহনে বাতাসের অক্সিজেনের সাথে বিক্রিয়ায় CO₂, জলীয় বাষ্প, আলো ও তাপ উৎপন্ন হয়। উত্তর খ) হাইড্রোকার্বন ।"},{"id":"ch1-mcq16","chapter":1,"num":16,"importance":2,"topic":"রসায়নের পরিধি বা ক্ষেত্রসমূহ","question":"কোন উপাদানটিতে সেলুলোজ থাকে?","boards":"কুমিল্লা বোর্ড ২০২৩","options":["পলিথিন","খাবার লবণ","ইউরিয়া","বাঁশ"],"answerIndex":3,"explanation":"বাঁশ, আখের ছোবড়া ইত্যাদিতে প্রচুর পরিমাণে সেলুলোজ থাকে; এগুলো থেকেই কাগজ তৈরি হয়। পলিথিন একটি পলিমার (ইথিলিন থেকে), খাবার লবণ NaCl, ইউরিয়া একটি সার — এগুলোতে সেলুলোজ নেই।"},{"id":"ch1-mcq17","chapter":1,"num":17,"importance":2,"topic":"রসায়নের পরিধি বা ক্ষেত্রসমূহ","question":"কাগজে কী থাকে?","boards":"দিনাজপুর বোর্ড ২০২৩","options":["ফ্রুক্টোজ","গ্লুকোজ","স্টার্চ","সেলুলোজ"],"answerIndex":3,"explanation":"কাগজের প্রধান উপাদান সেলুলোজ । বাঁশ, আখের ছোবড়ার সেলুলোজকে রাসায়নিক প্রক্রিয়াকরণ করে কাগজ তৈরি করা হয়। গ্লুকোজ, ফ্রুক্টোজ, স্টার্চ কাগজের উপাদান নয়।"},{"id":"ch1-mcq18","chapter":1,"num":18,"importance":2,"topic":"রসায়নের সাথে বিজ্ঞানের অন্যান্য শাখার সম্পর্ক","question":"উদ্ভিদ কোন প্রক্রিয়ায় গ্লুকোজ তৈরি করে?","boards":"যশোর বোর্ড ২০২২","options":["দহন","শ্বসন","পানি বিশ্লেষণ","সালোক-সংশ্লেষণ"],"answerIndex":3,"explanation":"উদ্ভিদ সালোকসংশ্লেষণ প্রক্রিয়ায় সবুজ অংশে গ্লুকোজ তৈরি করে। সূর্যালোক , ক্লোরোফিল\n6CO₂+6H₂O⟶C₆H₁₂O₆+6O₂\nদহন ও শ্বসনে গ্লুকোজ তৈরি হয় না, বরং জ্বালানি বা খাদ্য ভেঙে শক্তি উৎপন্ন হয়।"},{"id":"ch1-mcq19","chapter":1,"num":19,"importance":2,"topic":"রসায়ন পাঠের গুরুত্ব","question":"কোন মৌলটি বায়ু দূষণের জন্য দায়ী?","boards":"রাজশাহী বোর্ড ২০২২","options":["Pb","Fe","He","Au"],"answerIndex":0,"explanation":"লেড (Pb) একটি ভারী ধাতু; রাসায়নিক বর্জ্যে থাকা Hg, Pb, As, Co বায়ুর সাথে মিশে বায়ুদূষণ ঘটায় । Fe ও Au সাধারণত বায়ুদূষণকারী নয়, আর He নিষ্ক্রিয় গ্যাস । তাই সঠিক উত্তর Pb।"},{"id":"ch1-mcq20","chapter":1,"num":20,"importance":3,"topic":"রসায়নে অনুসন্ধান বা গবেষণা প্রক্রিয়া","question":"রসায়নে অনুসন্ধান ও গবেষণা প্রক্রিয়ার ৩য় ধাপ কোনটি?","boards":"বরিশাল বোর্ড ২০২৩; রাজশাহী বোর্ড ২০২২","options":["বিষয় বস্তু সম্পর্কে কিছু ধারণা অর্জন","পরীক্ষা প্রণালি নির্ধারণ","তথ্য উপাত্ত সংগ্রহ ও বিশ্লেষণ","ফলাফল নিয়ে আলোচনা"],"answerIndex":1,"explanation":"গবেষণা প্রক্রিয়ার ৬টি ধাপের ক্রম: ১. বিষয়বস্তু নির্ধারণ, ২. বিষয়বস্তু সম্পর্কে ধারণা নেওয়া, ৩. প্রয়োজনীয় বস্তু ও যন্ত্রপাতি এবং পরীক্ষা প্রণালি নির্ধারণ, ৪. পরীক্ষণ, ৫. তথ্য সংগ্রহ ও বিশ্লেষণ, ৬. ফলাফল ও আলোচনা । তাই ৩য় ধাপ হলো পরীক্ষা প্রণালি নির্ধারণ ।"},{"id":"ch1-mcq21","chapter":1,"num":21,"importance":2,"topic":"রসায়নে অনুসন্ধান বা গবেষণা প্রক্রিয়া","question":"অনুসন্ধান ও গবেষণা প্রক্রিয়ার চতুর্থ ধাপ কোনটি?","boards":"যশোর বোর্ড ২০২৪","options":["বিষয়বস্তু নির্ধারণ","সম্যক জ্ঞান অর্জন","পরীক্ষণ","ফলাফল অর্জন"],"answerIndex":2,"explanation":"ধাপের ক্রম: বিষয়বস্তু নির্ধারণ → ধারণা অর্জন → বস্তু,\nযন্ত্রপাতি ও প্রণালি নির্ধারণ → পরীক্ষণ → তথ্য সংগ্রহ ও বিশ্লেষণ → ফলাফল ।\nঅতএব চতুর্থ ধাপ পরীক্ষণ ।"},{"id":"ch1-mcq22","chapter":1,"num":22,"importance":3,"topic":"রসায়ন পরীক্ষাগার ব্যবহারে ও পরীক্ষাগারে ব্যবহৃত বিভিন্ন রাসায়নিক দ্রব্য ব্যবহারে সতর্কতা গ্রহণ","question":"কোনটি দাহ্য পদার্থ?","boards":"দিনাজপুর বোর্ড ২০২৫; রাজশাহী বোর্ড ২০২৩; বরিশাল বোর্ড ২০২২; ময়মনসিংহ বোর্ড ২০২২, ২০২০","options":["বেনজিন","ইথার","রেডিয়াম","জাইলিন"],"answerIndex":1,"explanation":"ইথার ও অ্যালকোহল দাহ্য পদার্থ — দ্রুত আগুন ধরে যায়, তাই আগুন ও তাপ থেকে দূরে রাখতে হয়। বেনজিন ও জাইলিন স্বাস্থ্য ঝুঁকিপূর্ণ পদার্থ, রেডিয়াম তেজস্ক্রিয় পদার্থ । তাই সঠিক উত্তর খ) ইথার।"},{"id":"ch1-mcq23","chapter":1,"num":23,"importance":3,"topic":"রসায়ন পরীক্ষাগার ব্যবহারে ও পরীক্ষাগারে ব্যবহৃত বিভিন্ন রাসায়নিক দ্রব্য ব্যবহারে সতর্কতা গ্রহণ","question":"কোনটি বিস্ফোরক পদার্থ?","boards":"সিলেট বোর্ড ২০২৫; চট্টগ্রাম বোর্ড ২০২০; বরিশাল বোর্ড ২০২০","options":["ইথার","বেনজিন","জাইলিন","জৈব পার-অক্সাইড"],"answerIndex":3,"explanation":"পাঠ্যবই অনুযায়ী টিএনটি, পার-অক্সাইড ও নাইট্রোগ্লিসারিন বিস্ফোরক পদার্থ; আগুন লাগলে প্রচণ্ড বিস্ফোরণ ঘটে। ইথার দাহ্য, বেনজিন ও জাইলিন স্বাস্থ্য ঝুঁকিপূর্ণ পদার্থ । তাই জৈব পার-অক্সাইড বিস্ফোরক ।"},{"id":"ch1-mcq24","chapter":1,"num":24,"importance":3,"topic":"রসায়ন পরীক্ষাগার ব্যবহারে ও পরীক্ষাগারে ব্যবহৃত বিভিন্ন রাসায়নিক দ্রব্য ব্যবহারে সতর্কতা গ্রহণ","question":"নিচের কোনটি বিস্ফোরক পদার্থ?","boards":"দিনাজপুর বোর্ড ২০২৪; যশোর বোর্ড ২০২৩; সিলেট বোর্ড ২০২২","options":["বেনজিন","টলুইন","নাইট্রোগ্লিসারিন","সালফিউরিক এসিড"],"answerIndex":2,"explanation":"নাইট্রোগ্লিসারিন একটি বিস্ফোরক পদার্থ (টিএনটি ও পার- অক্সাইডের মতো)। বেনজিন ও টলুইন স্বাস্থ্য ঝুঁকিপূর্ণ, সালফিউরিক এসিড ক্ষত সৃষ্টিকারী। তাই সঠিক উত্তর গ)।"},{"id":"ch1-mcq25","chapter":1,"num":25,"importance":3,"topic":"রসায়ন পরীক্ষাগার ব্যবহারে ও পরীক্ষাগারে ব্যবহৃত বিভিন্ন রাসায়নিক দ্রব্য ব্যবহারে সতর্কতা গ্রহণ","question":"কোনটি উত্তেজক পদার্থ?","boards":"ঢাকা বোর্ড ২০২৪; চট্টগ্রাম বোর্ড ২০২৪; সিলেট বোর্ড ২০২২","options":["বেনজিন","মিথানল","নাইট্রাস অক্সাইড","নাইট্রোগ্লিসারিন"],"answerIndex":2,"explanation":"ডাস্ট, লঘু এসিড, ক্ষার ও নাইট্রাস অক্সাইড উত্তেজক পদার্থ — ত্বক, চোখ ও শ্বাসতন্ত্রের ক্ষতি করে; চিহ্ন ক্রস (X)। বেনজিন ও মিথানল বিষাক্ত, নাইট্রোগ্লিসারিন বিস্ফোরক । তাই সঠিক উত্তর গ) নাইট্রাস অক্সাইড ।"},{"id":"ch1-mcq26","chapter":1,"num":26,"importance":3,"topic":"রসায়ন পরীক্ষাগার ব্যবহারে ও পরীক্ষাগারে ব্যবহৃত বিভিন্ন রাসায়নিক দ্রব্য ব্যবহারে সতর্কতা গ্রহণ","question":"কোনটি পরিবেশের জন্য ক্ষতিকারক?","boards":"সিলেট বোর্ড ২০২৩; চট্টগ্রাম বোর্ড ২০২২","options":["টিন","লেড","দস্তা","তামা"],"answerIndex":1,"explanation":"লেড ও মার্কারি পরিবেশের জন্য ক্ষতিকর পদার্থ; তাই ব্যবহারের পর যেখানে-সেখানে না ফেলে নির্দিষ্ট স্থানে রাখতে হয়। টিন, দস্তা ও তামা এই তালিকায় নেই। তাই সঠিক উত্তর খ) লেড।"},{"id":"ch1-mcq27","chapter":1,"num":27,"importance":2,"topic":"রসায়ন পরীক্ষাগার ব্যবহারে ও পরীক্ষাগারে ব্যবহৃত বিভিন্ন রাসায়নিক দ্রব্য ব্যবহারে সতর্কতা গ্রহণ","question":"ক্ষত সৃষ্টিকারী উপাদান কোনটি?","boards":"ঢাকা বোর্ড ২০২৫","options":["NaCl","NaOH","K₂SO₄","Na₂CO₃"],"answerIndex":1,"explanation":"HCl, H₂SO₄ এবং NaOH-এর ঘন দ্রবণ ক্ষত সৃষ্টিকারী (Corrosive) — শরীরে লাগলে ক্ষত সৃষ্টি করে। NaCl, K₂SO₄ ও Na₂CO₃ সাধারণ লবণ, ক্ষত সৃষ্টি করে না। তাই সঠিক উত্তর খ) NaOH।"},{"id":"ch1-mcq28","chapter":1,"num":28,"importance":2,"topic":"রসায়ন পরীক্ষাগার ব্যবহারে ও পরীক্ষাগারে ব্যবহৃত বিভিন্ন রাসায়নিক দ্রব্য ব্যবহারে সতর্কতা গ্রহণ","question":"মোমের গঠনে থাকে—\ni. কার্বন\nii. হাইড্রোজেন\niii. ক্রোমিয়াম\nনিচের কোনটি সঠিক?","boards":"যশোর বোর্ড ২০২৫","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":0,"explanation":"মোম একটি হাইড্রোকার্বন, অর্থাৎ কার্বন ও হাইড্রোজেনের যৌগ।\ni. কার্বন আছে — সঠিক । ii. হাইড্রোজেন আছে — সঠিক । iii. ক্রোমিয়াম একটি ধাতু, মোমে নেই — ভুল। তাই সঠিক উত্তর ক) i ও ii।"},{"id":"ch1-mcq29","chapter":1,"num":29,"importance":2,"topic":"রসায়ন পরীক্ষাগার ব্যবহারে ও পরীক্ষাগারে ব্যবহৃত বিভিন্ন রাসায়নিক দ্রব্য ব্যবহারে সতর্কতা গ্রহণ","question":"রসায়নের সাথে সম্পর্ক আছে–\ni. পদার্থবিজ্ঞান\nii. জীববিজ্ঞান\niii. গণিত\nনিচের কোনটি সঠিক?","boards":"যশোর বোর্ড ২০২৪","options":["i","i ও ii","i ও iii","i, ii ও iii"],"answerIndex":3,"explanation":"i. পদার্থবিজ্ঞান: ব্যাটারি রসায়নের অবদান; ভৌত রসায়নের তত্ত্বগুলো পদার্থবিজ্ঞানের সূত্রের উপর প্রতিষ্ঠিত — সঠিক ।\nii. জীববিজ্ঞান: সালোকসংশ্লেষণসহ জীবদেহের সব প্রক্রিয়াই রাসায়নিক বিক্রিয়া — সঠিক ।\niii. গণিত: দ্রবণের ঘনমাত্রা, যৌগের সংযুক্তি, বিক্রিয়ার হার নির্ণয়ে গণিত লাগে — সঠিক । তাই উত্তর ঘ) i, ii ও iii।"},{"id":"ch1-mcq30","chapter":1,"num":30,"importance":2,"topic":"রসায়ন পরীক্ষাগার ব্যবহারে ও পরীক্ষাগারে ব্যবহৃত বিভিন্ন রাসায়নিক দ্রব্য ব্যবহারে সতর্কতা গ্রহণ","question":"জৈব পার-অক্সাইড এক ধরনের —","boards":"ময়মনসিংহ বোর্ড ২০২৩","options":["বিষাক্ত পদার্থ","বিস্ফোরক পদার্থ","উত্তেজক পদার্থ","ক্ষত সৃষ্টিকারী পদার্থ"],"answerIndex":1,"explanation":"রসায়ন পরীক্ষাগারে বিস্ফোরক পদার্থে আগুন লাগলে প্রচণ্ড বিস্ফোরণ হতে পারে। টিএনটি, পার-অক্সাইড, নাইট্রোগ্লিসারিন এ ধরনের পদার্থ । তাই জৈব পার-অক্সাইড এক ধরনের খ) বিস্ফোরক পদার্থ ।"},{"id":"ch2-mcq1","chapter":2,"num":1,"importance":3,"topic":"পদার্থ ও পদার্থের অবস্থা","question":"সাধারণ তাপমাত্রায় কঠিন অবস্থায় থাকে–\ni. C₁₀H₈\nii. S₈\niii. I₂\nনিচের কোনটি সঠিক?","boards":"বরিশাল বোর্ড ২০২৫; দিনাজপুর বোর্ড ২০২৩; যশোর বোর্ড ২০২২","options":["i ও ii","ii ও iii","i ও iii","i, ii ও iii"],"answerIndex":3,"explanation":"ন্যাপথলিন (C₁₀H₈), সালফার (S₈) ও আয়োডিন (I₂) — তিনটিরই গলনাঙ্ক কক্ষ তাপমাত্রার চেয়ে অনেক বেশি।\ni. C₁₀H₈ কঠিন — সঠিক । ii. S₈ হলুদ কঠিন — সঠিক । iii. I₂ কালচে-বেগুনি কঠিন — সঠিক । তাই তিনটিই সাধারণ তাপমাত্রায় কঠিন ।"},{"id":"ch2-mcq2","chapter":2,"num":2,"importance":2,"topic":"কণার গতিতত্ত্ব","question":"কোন পদার্থের কণাগুলোর মধ্যে গতিশক্তি বেশি?","boards":"কুমিল্লা বোর্ড ২০২৫","options":["চিনি","লবণ","সয়াবিন","মিথেন"],"answerIndex":3,"explanation":"গ্যাসীয় পদার্থের কণাগুলোর গতিশক্তি সবচেয়ে বেশি। চিনি ও লবণ কঠিন, সয়াবিন তেল তরল, কিন্তু মিথেন (CH₄) সাধারণ তাপমাত্রায় গ্যাস । তাই মিথেনের কণার গতিশক্তি সবচেয়ে বেশি ।"},{"id":"ch2-mcq3","chapter":2,"num":3,"importance":2,"topic":"কণার গতিতত্ত্ব","question":"ঘনীভবনের ক্ষেত্রে –\ni. পদার্থ তাপশক্তি নির্গত করে\nii. কণার গতিশক্তি বৃদ্ধি পায়\niii. আয়তন হ্রাস পায়\nনিচের কোনটি সঠিক?","boards":"বরিশাল বোর্ড ২০২২","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":1,"explanation":"ঘনীভবন হলো বাষ্প বা গ্যাস শীতল হয়ে তরলে পরিণত হওয়া ।\ni. সঠিক — ঘনীভবনে পদার্থ সুপ্ততাপ পরিবেশে নির্গত করে ।\nii. ভুল — তাপ হারানোয় কণার গতিশক্তি কমে যায়, বাড়ে না।\niii. সঠিক — কণাগুলো কাছাকাছি আসে, তাই আয়তন হ্রাস পায়।"},{"id":"ch2-mcq4","chapter":2,"num":4,"importance":2,"topic":"কণার গতিতত্ত্ব","question":"কোনটির আন্তঃকণা আকর্ষণ শক্তি বেশি?","boards":"রাজশাহী বোর্ড ২০২০","options":["মিথেন","চুনাপাথর","সয়াবিন তেল","কেরোসিন"],"answerIndex":1,"explanation":"আন্তঃকণা আকর্ষণ শক্তি: কঠিন \u003e তরল \u003e গ্যাস। মিথেন গ্যাস, সয়াবিন তেল ও কেরোসিন তরল, চুনাপাথর (CaCO₃) কঠিন । তাই চুনাপাথরের আন্তঃকণা আকর্ষণ শক্তি বেশি।"},{"id":"ch2-mcq5","chapter":2,"num":5,"importance":2,"topic":"ব্যাপন","question":"নিচের কোনটির ব্যাপন হার বেশি?","boards":"বরিশাল বোর্ড ২০২৫","options":["N₂","O₂","NH₃","CO₂"],"answerIndex":2,"explanation":"আণবিক ভর কম হলে ব্যাপন দ্রুত ঘটে।\nN₂ = 28; O₂ = 32; NH₃=14+1×3=17; CO₂=12+ 16×2=44। NH₃-এর আণবিক ভর সবচেয়ে কম, তাই NH₃-এর ব্যাপন হার সবচেয়ে বেশি।"},{"id":"ch2-mcq6","chapter":2,"num":6,"importance":2,"topic":"ব্যাপন","question":"কোন গ্যাসটির ব্যাপন আগে ঘটবে?","boards":"রাজশাহী বোর্ড ২০২৫","options":["NO₂","SO₂","CO₂","CH₄"],"answerIndex":3,"explanation":"একই তাপমাত্রা ও চাপে যে গ্যাসের আণবিক ভর যত কম, তার ব্যাপন হার তত বেশি, অর্থাৎ তার ব্যাপন আগে ঘটে। NO₂=14+16×2=46; SO₂=32+16×2=64; CO₂=12+16×2=44; CH₄=12+1×4=16। CH₄ এর আণবিক ভর সবচেয়ে কম। তাই উত্তর ঘ) CH₄।"},{"id":"ch2-mcq7","chapter":2,"num":7,"importance":2,"topic":"ব্যাপন","question":"কোন গ্যাসটির ব্যাপন সময় বেশি?","boards":"বরিশাল বোর্ড ২০২৫","options":["N₂","CO₂","SO₂","Cl₂"],"answerIndex":3,"explanation":"আণবিক ভর যত বেশি, ব্যাপন সময় তত বেশি।\nN₂ = 28; CO₂ = 44; SO₂ = 64; Cl₂=35.5×2=71। Cl₂-এর আণবিক ভর সবচেয়ে বেশি, তাই Cl₂-এর ব্যাপন সময় সবচেয়ে বেশি।"},{"id":"ch2-mcq8","chapter":2,"num":8,"importance":2,"topic":"ব্যাপন","question":"নিচের কোনটির ব্যাপন হার বেশি?","boards":"ঢাকা বোর্ড ২০২৫","options":["NH₃","CH₄","CO₂","PH₃"],"answerIndex":1,"explanation":"আণবিক ভর কম হলে ব্যাপন হার বেশি।\nNH₃ = 17; CH₄=12+1×4=16; CO₂ = 44; PH₃=31+ 1×3=34। CH₄-এর আণবিক ভর (16) সবচেয়ে কম, তাই CH₄-এর ব্যাপন হার সবচেয়ে বেশি।"},{"id":"ch2-mcq9","chapter":2,"num":9,"importance":2,"topic":"ব্যাপন","question":"কোনটির ব্যাপন সময় সবচেয়ে বেশি?","boards":"সিলেট বোর্ড ২০২৪","options":["H₂","He","N₂","O₂"],"answerIndex":3,"explanation":"আণবিক ভর যত বেশি, ব্যাপন হার তত কম, অর্থাৎ ব্যাপন সময় তত বেশি। H₂ = 2; He = 4; N₂ = 28; O₂=16×2=32। O₂-এর আণবিক ভর সবচেয়ে বেশি, তাই O₂-এর ব্যাপন সময় সবচেয়ে বেশি।"},{"id":"ch2-mcq10","chapter":2,"num":10,"importance":2,"topic":"ব্যাপন","question":"নিচের কোনটি পটাশিয়াম পারম্যাঙ্গানেটের সংকেত?","boards":"ময়মনসিংহ বোর্ড ২০২৪","options":["KMn₂O₄","KMnO₄","K₂MnO₄","KMnO₂"],"answerIndex":1,"explanation":"পটাশিয়াম পারম্যাঙ্গানেটে K+ আয়ন ও পারম্যাঙ্গানেট (MnO₄-) আয়ন থাকে। উভয়ের যোজনী 1 হওয়ায় সংকেত KMnO₄। K₂MnO₄ হলো পটাশিয়াম ম্যাঙ্গানেট । তাই উত্তর খ) KMnO₄।"},{"id":"ch2-mcq11","chapter":2,"num":11,"importance":2,"topic":"ব্যাপন","question":"কোন গ্যাসটির ব্যাপনের হার বেশি?","boards":"কুমিল্লা বোর্ড ২০২৪","options":["ইথিলিন","অ্যামোনিয়া","নাইট্রোজেন","ফ্লোরিন"],"answerIndex":1,"explanation":"আণবিক ভর যত কম, ব্যাপন হার তত বেশি।\nইথিলিন C₂H₄ = 28; অ্যামোনিয়া NH₃=14+3=17; নাইট্রোজেন N₂ = 28; ফ্লোরিন F₂ = 38। NH₃ এর আণবিক ভর সবচেয়ে কম। তাই উত্তর খ) অ্যামোনিয়া ।"},{"id":"ch2-mcq12","chapter":2,"num":12,"importance":2,"topic":"ব্যাপন","question":"নিচের কোনটির ব্যাপন সময় বেশি?","boards":"যশোর বোর্ড ২০২৪","options":["NH₃","CO₂","SO₂","Cl₂"],"answerIndex":3,"explanation":"একই অবস্থায় আণবিক ভর যত বেশি, ব্যাপন হার তত কম, অর্থাৎ ব্যাপনে সময় তত বেশি লাগে। NH₃ = 17; CO₂ = 44; SO₂ = 64; Cl₂=35.5×2=71। Cl₂ এর আণবিক ভর সবচেয়ে বেশি। তাই উত্তর ঘ) Cl₂।"},{"id":"ch2-mcq13","chapter":2,"num":13,"importance":2,"topic":"ব্যাপন","question":"কোন গ্যাসদ্বয়ের ব্যাপন হার সমান?","boards":"যশোর বোর্ড ২০২৩","options":["CO, NO","CO₂, N₂O","N₂O, NO₂","CO₂, NO₂"],"answerIndex":1,"explanation":"একই অবস্থায় দুটি গ্যাসের আণবিক ভর সমান হলে ব্যাপন হারও সমান । CO₂=12+16×2=44 এবং N₂O=14×2+16=44 — সমান । অন্যগুলো: CO = 28, NO = 30; NO₂ = 46 — কোনো জোড়ায় ভর সমান নয়।"},{"id":"ch2-mcq14","chapter":2,"num":14,"importance":2,"topic":"নিঃসরণ","question":"পারফিউম স্প্রে করার সময় কোনটি আগে ঘটে?","boards":"ময়মনসিংহ বোর্ড ২০২৫","options":["গলন","ঊর্ধ্বপাতন","ব্যাপন","নিঃসরণ"],"answerIndex":3,"explanation":"স্প্রে করার সময় চাপ দিলে পারফিউমের গ্যাস কণা প্রথমে সরু ছিদ্রপথ দিয়ে একে একে বের হয় — এটি নিঃসরণ । বের হওয়ার পর কণাগুলো বাতাসে চারদিকে ছড়িয়ে পড়ে — এটি ব্যাপন । তাই আগে ঘটে নিঃসরণ ।"},{"id":"ch2-mcq15","chapter":2,"num":15,"importance":2,"topic":"নিঃসরণ","question":"নিচের কোনটির নিঃসরণের হার বেশি?","boards":"দিনাজপুর বোর্ড ২০২৩","options":["H₂O","CO₂","NH₃","CH₄"],"answerIndex":3,"explanation":"নিঃসরণ হার ∝ 1/√M; আণবিক ভর যত কম, হার তত বেশি। H₂O = 18, CO₂ = 44, NH₃ = 17, CH₄ = 16। CH₄ এর আণবিক ভর সবচেয়ে কম, তাই এর নিঃসরণ হার সবচেয়ে বেশি।"},{"id":"ch2-mcq16","chapter":2,"num":16,"importance":2,"topic":"নিঃসরণ","question":"নিচের কোন গ্যাসটির নিঃসরণ হার বেশি?","boards":"দিনাজপুর বোর্ড ২০২২","options":["Cl₂","NO₂","O₂","CO"],"answerIndex":3,"explanation":"আণবিক ভর: Cl₂ = 71, NO₂ = 46, O₂ = 32, CO = 28। CO এর আণবিক ভর সবচেয়ে কম, তাই এর নিঃসরণ হার সবচেয়ে বেশি।"},{"id":"ch2-mcq17","chapter":2,"num":17,"importance":2,"topic":"মোমবাতির প্রজ্বলন এবং মোমের তিন অবস্থা","question":"মোমের দহনে উৎপন্ন হয়—\ni. কার্বন ডাইঅক্সাইড\nii. হাইড্রোজেন\niii. জলীয় বাষ্প নিচের কোনটি সঠিক?","boards":"রাজশাহী বোর্ড ২০২০","options":["ii","iii","i ও iii","ii ও iii"],"answerIndex":2,"explanation":"মোম হলো হাইড্রোকার্বন (C ও H)। দহনে C থেকে CO₂ এবং H থেকে H₂O তৈরি হয়। দহন\nমোম+O₂⟶CO₂+H₂O+তাপ+আলো\ni. সঠিক — কার্বন ডাইঅক্সাইড উৎপন্ন হয়।\nii. ভুল — হাইড্রোজেন মুক্ত অবস্থায় উৎপন্ন হয় না, অক্সিজেনের সাথে যুক্ত হয়ে পানি হয়।\niii. সঠিক — জলীয় বাষ্প উৎপন্ন হয়। তাই উত্তর i ও iii।"},{"id":"ch2-mcq18","chapter":2,"num":18,"importance":3,"topic":"গলন ও স্ফুটন","question":"বিশুদ্ধ সালফারের গলনাঙ্ক কত?","boards":"রাজশাহী বোর্ড ২০২৪; ময়মনসিংহ বোর্ড ২০২৪; চট্টগ্রাম বোর্ড ২০২৩","options":["0°C","100°C","115°C","133°C"],"answerIndex":2,"explanation":"1.0 বায়ুমণ্ডলীয় চাপে বিশুদ্ধ সালফার 115°C তাপমাত্রায় গলে। অন্য অপশন: 0°C বরফের গলনাঙ্ক, 100°C পানির স্ফুটনাঙ্ক, 133°C ইউরিয়ার গলনাঙ্ক।"},{"id":"ch2-mcq19","chapter":2,"num":19,"importance":3,"topic":"গলন ও স্ফুটন","question":"স্ফুটনের বিপরীত প্রক্রিয়া কোনটি?","boards":"কুমিল্লা বোর্ড ২০২৩; চট্টগ্রাম বোর্ড ২০২৩","options":["পাতন","ঊর্ধ্বপাতন","ঘনীভবন","গলন"],"answerIndex":2,"explanation":"স্ফুটনে তাপ দিয়ে তরলকে বাষ্পে পরিণত করা হয়। ঘনীভবনে তাপ সরিয়ে বাষ্পকে আবার তরলে পরিণত করা হয়; তাই ঘনীভবন স্ফুটনের বিপরীত প্রক্রিয়া ।"},{"id":"ch2-mcq20","chapter":2,"num":20,"importance":2,"topic":"গলন ও স্ফুটন","question":"বিশুদ্ধ সালফারের গলনাঙ্ক কত?","boards":"ঢাকা বোর্ড ২০২৩","options":["100°C","119°C","133°C","340°C"],"answerIndex":1,"explanation":"পুরাতন পাঠ্যবই অনুসারে বিশুদ্ধ সালফারের গলনাঙ্ক 119°C ধরা হতো, তাই এখানে উত্তর খ। বর্তমান পাঠ্যবই অনুসারে 1 atm চাপে বিশুদ্ধ সালফারের গলনাঙ্ক 115°C; অপশনে 115°C থাকলে সেটিই দাগাবে ।"},{"id":"ch2-mcq21","chapter":2,"num":21,"importance":3,"topic":"পাতন এবং ঊর্ধ্বপাতন","question":"নিচের কোনটি ঊর্ধ্বপাতিত পদার্থ?","boards":"ঢাকা বোর্ড ২০২৫; যশোর বোর্ড ২০২৪","options":["আয়োডিন","পটাসিয়াম সালফেট","ক্যালসিয়াম সালফেট","সোডিয়াম কার্বনেট"],"answerIndex":0,"explanation":"আয়োডিন তাপে কঠিন থেকে সরাসরি বাষ্প হয়, তাই ঊর্ধ্বপাতিত পদার্থ । পটাসিয়াম সালফেট, ক্যালসিয়াম সালফেট ও সোডিয়াম কার্বনেট উদ্বায়ী নয়; এরা ঊর্ধ্বপাতিত হয় না।"},{"id":"ch2-mcq22","chapter":2,"num":22,"importance":3,"topic":"পাতন এবং ঊর্ধ্বপাতন","question":"নিচের কোনটি কর্পূরের সংকেত?","boards":"দিনাজপুর বোর্ড ২০২৩; সিলেট বোর্ড ২০২০","options":["C₆H₆","C₁₀H₈","C₁₀H₁₆O","C₁₂H₂₂O₁₁"],"answerIndex":2,"explanation":"কর্পূরের সংকেত C₁₀H₁₆O।\nC₆H₆ = বেনজিন, C₁₀H₈ = ন্যাপথলিন, C₁₂H₂₂O₁₁ = সুক্রোজ (চিনি)।"},{"id":"ch2-mcq23","chapter":2,"num":23,"importance":3,"topic":"পাতন এবং ঊর্ধ্বপাতন","question":"নিচের কোনটি ঊর্ধ্বপাতিত হয়?","boards":"ঢাকা বোর্ড ২০২২; বরিশাল বোর্ড ২০২০","options":["C₁₀H₈","C₆H₆O","C₆H₆","C₆H₁₂"],"answerIndex":0,"explanation":"C₁₀H₈ হলো ন্যাপথলিন — একটি উদ্বায়ী পদার্থ, তাপে সরাসরি বাষ্প হয়। C₆H₆O (ফেনল), C₆H₆ (বেনজিন) ও C₆H₁₂ উদ্বায়ী (ঊর্ধ্বপাতিত) পদার্থের তালিকায় নেই।"},{"id":"ch2-mcq24","chapter":2,"num":24,"importance":3,"topic":"পাতন এবং ঊর্ধ্বপাতন","question":"কোনটি ঊর্ধ্বপাতিত পদার্থ?","boards":"চট্টগ্রাম বোর্ড ২০২২, ২০২০","options":["তুঁতে","খাদ্য লবণ","সোডা অ্যাশ","নিশাদল"],"answerIndex":3,"explanation":"নিশাদল (NH₄Cl) তাপে তরল না হয়ে সরাসরি বাষ্প হয়, তাই ঊর্ধ্বপাতিত পদার্থ । তুঁতে (CuSO₄.5H₂O), খাদ্য লবণ (NaCl) ও সোডা অ্যাশ (Na₂CO₃) উদ্বায়ী নয়।"},{"id":"ch2-mcq25","chapter":2,"num":25,"importance":3,"topic":"পাতন এবং ঊর্ধ্বপাতন","question":"কোনটি ন্যাপথালিনের সংকেত?","boards":"কুমিল্লা বোর্ড ২০২৬","options":["C₁₀H₂₂","C₁₀H₈","C₆H₆","C₃H₄"],"answerIndex":1,"explanation":"ন্যাপথালিনের আণবিক সংকেত C₁₀H₈; এটি একটি ঊর্ধ্বপাতিত পদার্থ ।"},{"id":"ch2-mcq26","chapter":2,"num":26,"importance":2,"topic":"পাতন এবং ঊর্ধ্বপাতন","question":"কোনটি ঊর্ধ্বপাতিত পদার্থ?","boards":"রাজশাহী বোর্ড ২০২৫","options":["C₂H₄O₂","C₄H₁₀O","C₁₀H₁₆O","C₁₂H₂₆O"],"answerIndex":2,"explanation":"C₁₀H₁₆O হলো কর্পূরের সংকেত । কর্পূরে তাপ দিলে তা তরল না হয়ে সরাসরি বাষ্পে পরিণত হয়, তাই এটি ঊর্ধ্বপাতিত পদার্থ । C₂H₄O₂ (ইথানয়িক এসিড), C₄H₁₀O (বিউটানল/ইথার) ও C₁₂H₂₆O ঊর্ধ্বপাতিত হয় না। তাই উত্তর গ) C₁₀H₁₆O।"},{"id":"ch2-mcq27","chapter":2,"num":27,"importance":2,"topic":"পাতন এবং ঊর্ধ্বপাতন","question":"কোনটির তাপীয় বক্ররেখার লেখচিত্র ভিন্ন হবে?","boards":"দিনাজপুর বোর্ড ২০২৫","options":["CaCl₂","Al₂O₃","MgO","AlCl₃"],"answerIndex":3,"explanation":"সাধারণ পদার্থে তাপ দিলে কঠিন → তরল → বাষ্প হয়, তাই\nতাপীয় বক্ররেখায় গলনাঙ্ক ও স্ফুটনাঙ্কে দুটি সমতল অংশ থাকে। AlCl₃ ঊর্ধ্বপাতিত পদার্থ; তাপ দিলে তরল না হয়ে কঠিন থেকে সরাসরি বাষ্প হয়, তাই এর বক্ররেখায় একটি মাত্র সমতল অংশ থাকে। CaCl₂, Al₂O₃ ও MgO ঊর্ধ্বপাতিত হয় না। তাই উত্তর ঘ) AlCl₃।"},{"id":"ch2-mcq28","chapter":2,"num":28,"importance":2,"topic":"পাতন এবং ঊর্ধ্বপাতন","question":"কোনটি সাধারণ তাপমাত্রায় তরল?","boards":"কুমিল্লা বোর্ড ২০২৫","options":["ন্যাপথলিন","অ্যামোনিয়া","ইথানল","ইথেন"],"answerIndex":2,"explanation":"সাধারণ তাপমাত্রায় ন্যাপথলিন কঠিন, অ্যামোনিয়া (NH₃) ও ইথেন (C₂H₆) গ্যাস। ইথানল (C₂H₅OH) সাধারণ তাপমাত্রায় তরল (স্ফুটনাঙ্ক প্রায় 78°C)। তাই উত্তর গ) ইথানল।"},{"id":"ch2-mcq29","chapter":2,"num":29,"importance":2,"topic":"পাতন এবং ঊর্ধ্বপাতন","question":"কোনটিকে তাপ প্রয়োগ করে তরলে পরিণত করা যায়?","boards":"চট্টগ্রাম বোর্ড ২০২৫","options":["NH₄Cl","AlCl₃","C₁₀H₈","NaCl"],"answerIndex":3,"explanation":"NH₄Cl (নিশাদল), AlCl₃ ও C₁₀H₈ (ন্যাপথলিন) ঊর্ধ্বপাতিত পদার্থ; তাপ দিলে এরা তরল না হয়ে সরাসরি বাষ্পে পরিণত হয়। NaCl ঊর্ধ্বপাতিত পদার্থ নয়; যথেষ্ট তাপ দিলে (গলনাঙ্ক 801°C) এটি গলে তরলে পরিণত হয়। তাই উত্তর ঘ) NaCl।"},{"id":"ch2-mcq30","chapter":2,"num":30,"importance":2,"topic":"পাতন এবং ঊর্ধ্বপাতন","question":"নিচের কোন পদার্থকে তাপ প্রদান করে তরল করা সম্ভব?","boards":"সিলেট বোর্ড ২০২৫","options":["C₁₀H₁₆O","CuSO₄","C₁₀H₈","AlCl₃"],"answerIndex":1,"explanation":"C₁₀H₁₆O (কর্পূর), C₁₀H₈ (ন্যাপথলিন) ও AlCl₃ ঊর্ধ্বপাতিত পদার্থ — তাপ দিলে তরল না হয়ে সরাসরি বাষ্প হয়, তাই এদের তাপ দিয়ে তরল করা যায় না। CuSO₄ উদ্বায়ী নয়; তাই অপশনগুলোর মধ্যে কেবল এটিকেই তাপ দিয়ে তরল অবস্থায় আনা সম্ভব ধরা হয়।"},{"id":"ch2-mcq31","chapter":2,"num":31,"importance":3,"topic":"পাতন এবং ঊর্ধ্বপাতন","question":"নিচের কোনটি ঊর্ধ্বপাতনযোগ্য পদার্থ?","boards":"সিলেট বোর্ড ২০২৪","options":["ফ্লোরিন","আয়োডিন","ক্লোরিন","ব্রোমিন"],"answerIndex":1,"explanation":"আয়োডিন (I₂) কঠিন অবস্থায় থাকে এবং তাপ দিলে তরল না হয়ে সরাসরি বেগুনি বাষ্পে পরিণত হয়, তাই এটি ঊর্ধ্বপাতনযোগ্য । ফ্লোরিন ও ক্লোরিন সাধারণ তাপমাত্রায় গ্যাস এবং ব্রোমিন তরল — এদের ঊর্ধ্বপাতন হয় না।"},{"id":"ch3-mcq1","chapter":3,"num":1,"importance":3,"topic":"মৌলিক ও যৌগিক পদার্থ","question":"আমাদের শরীরে কত ধরনের মৌল আছে?","boards":"দিনাজপুর বোর্ড ২০২৪, ২০২১; চট্টগ্রাম বোর্ড ২০২২, ২০২১; সিলেট বোর্ড ২০২২; যশোর বোর্ড ২০২১; বরিশাল বোর্ড ২০২১","options":["১৫","১৮","২৬","৩২"],"answerIndex":2,"explanation":"মানবদেহে মোট 26 ধরনের ভিন্ন ভিন্ন মৌল আছে। যেমন— O, C, H, N, Ca, P, Fe ইত্যাদি । তাই সঠিক উত্তর গ) ২৬।"},{"id":"ch3-mcq2","chapter":3,"num":2,"importance":2,"topic":"মৌলিক ও যৌগিক পদার্থ","question":"কোনটি মৌলিক পদার্থ?","boards":"চট্টগ্রাম বোর্ড ২০২৫","options":["কাঁসা","পিতল","ইস্পাত","লোহা"],"answerIndex":3,"explanation":"লোহা (Fe) একটি মৌল; একে ভাঙলে লোহা ছাড়া অন্য কিছু পাওয়া যায় না। কাঁসা (Cu + Sn), পিতল (Cu + Zn) ও ইস্পাত (Fe + C) একাধিক উপাদানের সংকর, তাই এরা মৌলিক পদার্থ নয়।"},{"id":"ch3-mcq3","chapter":3,"num":3,"importance":2,"topic":"মৌলিক ও যৌগিক পদার্থ","question":"কোনটি যৌগিক পদার্থ?","boards":"সিলেট বোর্ড ২০২৩","options":["লোহা","রুপা","মোম","সালফার"],"answerIndex":2,"explanation":"মোমের মূল উপাদান হাইড্রোকার্বন, যা কার্বন ও হাইড্রোজেন মিলে তৈরি । মোমকে ভাঙলে দুটি ভিন্ন মৌল (C ও H) পাওয়া যায়, তাই এটি যৌগিক পদার্থ । লোহা, রুপা ও সালফার — তিনটিই মৌল।"},{"id":"ch3-mcq4","chapter":3,"num":4,"importance":2,"topic":"মৌলিক ও যৌগিক পদার্থ","question":"2016 সাল পর্যন্ত আবিষ্কৃত মোট মৌলের কতটি গবেষণাগারে তৈরি?","boards":"বরিশাল বোর্ড ২০২২","options":["১৪","২০","২৬","৯৮"],"answerIndex":1,"explanation":"2016 সাল পর্যন্ত আবিষ্কৃত মৌল 118টি।\nএর মধ্যে 98টি প্রকৃতিতে পাওয়া যায় (সে সময়ের হিসাব)। গবেষণাগারে তৈরি মৌল =118-98=20টি"},{"id":"ch3-mcq5","chapter":3,"num":5,"importance":2,"topic":"পরমাণু ও অণু","question":"মৌলিক পদার্থের ক্ষুদ্রতম কণিকার নাম কী?","boards":"চট্টগ্রাম বোর্ড ২০২১","options":["অণু","পরমাণু","প্রোটন","ইলেকট্রন"],"answerIndex":1,"explanation":"পরমাণু হলো মৌলিক পদার্থের ক্ষুদ্রতম কণা, যার মধ্যে ঐ মৌলের গুণাগুণ বজায় থাকে। অণু দুই বা ততোধিক পরমাণুর সমষ্টি; প্রোটন ও ইলেকট্রন পরমাণুর মৌলিক কণা, এদের মধ্যে মৌলের ধর্ম থাকে না। তাই সঠিক উত্তর খ) পরমাণু ।"},{"id":"ch3-mcq6","chapter":3,"num":6,"importance":2,"topic":"পরমাণু ও অণু","question":"নাইট্রোজেন অণুতে কতটি পরমাণু বিদ্যমান?","boards":"চট্টগ্রাম বোর্ড ২০২১","options":["1","2","3","4"],"answerIndex":1,"explanation":"দুটি নাইট্রোজেন পরমাণু (N) পরস্পর যুক্ত হয়ে একটি নাইট্রোজেন অণু (N₂) গঠন করে ।\nN+N→N₂\nN₂-এর নিচের 2 নির্দেশ করে অণুতে 2টি পরমাণু আছে। তাই উত্তর খ) 2।"},{"id":"ch3-mcq7","chapter":3,"num":7,"importance":3,"topic":"মৌলের প্রতীক","question":"টাংস্টেন এর ল্যাটিন নাম কী?","boards":"যশোর বোর্ড ২০২৫; ঢাকা বোর্ড ২০২৪; রাজশাহী বোর্ড ২০২৪; সিলেট বোর্ড ২০২১; বরিশাল বোর্ড ২০২০","options":["Stannum","Stibium","Wolfram","Natrium"],"answerIndex":2,"explanation":"টাংস্টেনের ল্যাটিন নাম Wolfram, তাই এর প্রতীক W। Stannum টিনের, Stibium এন্টিমনির এবং Natrium সোডিয়ামের ল্যাটিন নাম।"},{"id":"ch3-mcq8","chapter":3,"num":8,"importance":3,"topic":"মৌলের প্রতীক","question":"কোনটি অ্যান্টিমনির ল্যাটিন নাম?","boards":"ময়মনসিংহ বোর্ড ২০২৫, ২০২৪; রাজশাহী বোর্ড ২০২৩; দিনাজপুর বোর্ড ২০২৩","options":["Argentum","Aurum","Stibium","Stannum"],"answerIndex":2,"explanation":"অ্যান্টিমনির ল্যাটিন নাম Stibium, প্রতীক Sb। Argentum সিলভারের (Ag), Aurum গোল্ডের (Au), Stannum টিনের (Sn) ল্যাটিন নাম।"},{"id":"ch3-mcq9","chapter":3,"num":9,"importance":3,"topic":"মৌলের প্রতীক","question":"ল্যাটিন ভাষা থেকে গৃহীত প্রতীক কোনটি?","boards":"সিলেট বোর্ড ২০২৪; ঢাকা বোর্ড ২০২১","options":["N","K","Co","Ca"],"answerIndex":1,"explanation":"পটাশিয়ামের প্রতীক K নেওয়া হয়েছে ল্যাটিন নাম Kalium থেকে। N (Nitrogen), Co (Cobalt), Ca (Calcium) — এগুলো ইংরেজি নাম থেকে নেওয়া ।"},{"id":"ch3-mcq10","chapter":3,"num":10,"importance":3,"topic":"মৌলের প্রতীক","question":"টিনের প্রতীক কোনটি?","boards":"ময়মনসিংহ বোর্ড ২০২৩; দিনাজপুর বোর্ড ২০২২","options":["Sb","Pb","Sn","Ti"],"answerIndex":2,"explanation":"টিনের ল্যাটিন নাম Stannum, তাই প্রতীক Sn। Sb এন্টিমনির, Pb লেডের এবং Ti টাইটেনিয়ামের প্রতীক ।"},{"id":"ch3-mcq11","chapter":3,"num":11,"importance":3,"topic":"মৌলের প্রতীক","question":"এন্টিমনি মৌলটির প্রতীক কোনটি?","boards":"রাজশাহী বোর্ড ২০২২; কুমিল্লা বোর্ড ২০২২","options":["At","Au","Sb","Sn"],"answerIndex":2,"explanation":"এন্টিমনির ল্যাটিন নাম Stibium, তাই প্রতীক Sb। At অ্যাস্টাটিন, Au গোল্ড এবং Sn টিনের প্রতীক ।"},{"id":"ch3-mcq12","chapter":3,"num":12,"importance":3,"topic":"মৌলের প্রতীক","question":"টিনের প্রতীক কোনটি?","boards":"দিনাজপুর বোর্ড ২০২৬","options":["Sn","Sb","Ti","Te"],"answerIndex":0,"explanation":"টিনের ল্যাটিন নাম Stannum, তাই প্রতীক Sn।"},{"id":"ch3-mcq13","chapter":3,"num":13,"importance":3,"topic":"মৌলের প্রতীক","question":"মারকারি মৌলের ল্যাটিন নাম কোনটি?","boards":"যশোর বোর্ড ২০২৬","options":["Kalium","Wolfram","Argentum","Hydrargyrum"],"answerIndex":3,"explanation":"মারকারির ল্যাটিন নাম Hydrargyrum, তাই প্রতীক Hg।"},{"id":"ch3-mcq14","chapter":3,"num":14,"importance":3,"topic":"পরমাণুর সাংগঠনিক কণা","question":"নিউট্রনের প্রকৃত ভর কত?","boards":"চট্টগ্রাম বোর্ড ২০২৫, ২০২৩; যশোর বোর্ড ২০২২","options":["9.11 × 10⁻²⁸g","1.675 × 10⁻²⁴g","1.673 × 10⁻²⁴g","1.60 × 10⁻¹⁹g"],"answerIndex":1,"explanation":"নিউট্রনের ভর প্রোটনের চেয়ে সামান্য বেশি— নিউট্রন 1.675 × 10⁻²⁴ g, প্রোটন 1.673 × 10⁻²⁴ g। 9.11 × 10⁻²⁸ g ইলেকট্রনের ভর।"},{"id":"ch3-mcq15","chapter":3,"num":15,"importance":3,"topic":"পরমাণুর সাংগঠনিক কণা","question":"²⁷_13Al³⁺ আয়নে কতটি ইলেকট্রন আছে?","boards":"ঢাকা বোর্ড ২০২৫; দিনাজপুর বোর্ড ২০২৫; রাজশাহী বোর্ড ২০২৩","options":["10","13","14","27"],"answerIndex":0,"explanation":"Al-এর Z = 13, তাই নিরপেক্ষ পরমাণুতে 13টি ইলেকট্রন । Al³⁺ আয়ন গঠনে 3টি ইলেকট্রন ত্যাগ করে: ইলেকট্রন সংখ্যা =13-3=10। 27 হলো ভরসংখ্যা, 14 হলো নিউট্রন সংখ্যা (27 - 13)।"},{"id":"ch3-mcq16","chapter":3,"num":16,"importance":3,"topic":"পরমাণুর সাংগঠনিক কণা","question":"১টি ইলেকট্রনের ভর কত?","boards":"কুমিল্লা বোর্ড ২০২৪; যশোর বোর্ড ২০২১; সিলেট বোর্ড ২০২১","options":["1.673 × 10⁻²⁴g","1.60 × 10⁻¹⁹g","1.675 × 10⁻²⁴g","9.11 × 10⁻²⁸g"],"answerIndex":3,"explanation":"একটি ইলেকট্রনের প্রকৃত ভর 9.11 × 10⁻²⁸ g। 1.673 × 10⁻²⁴ g প্রোটনের, 1.675 × 10⁻²⁴ g নিউট্রনের ভর; 1.60 × 10⁻¹⁹ আধানের মান (কুলম্ব), ভর নয়।"},{"id":"ch3-mcq17","chapter":3,"num":17,"importance":3,"topic":"পরমাণুর সাংগঠনিক কণা","question":"ইলেকট্রনের প্রকৃত আধান কোনটি?","boards":"ঢাকা বোর্ড ২০২২; কুমিল্লা বোর্ড ২০২২, ২০২১","options":["+1 কুলম্ব","+1.6×10⁻¹⁹ কুলম্ব","-1.6×10⁻¹⁹ কুলম্ব","-1 কুলম্ব"],"answerIndex":2,"explanation":"ইলেকট্রন ঋণাত্মক আধানযুক্ত; এর প্রকৃত আধান -1.60 × 10⁻¹⁹ কুলম্ব । -1 হলো আপেক্ষিক আধান (একক নেই), প্রকৃত আধান নয়; +1.6 × 10⁻¹⁹ কুলম্ব প্রোটনের আধান।"},{"id":"ch3-mcq18","chapter":3,"num":18,"importance":3,"topic":"পরমাণুর সাংগঠনিক কণা","question":"কোন মৌলের ইলেকট্রন, প্রোটন ও নিউট্রন সংখ্যা সমান?","boards":"যশোর বোর্ড ২০২৩; দিনাজপুর বোর্ড ২০২১","options":["P","Na","F","O"],"answerIndex":3,"explanation":"নিরপেক্ষ পরমাণুতে প্রোটন = ইলেকট্রন = Z; নিউট্রন = A - Z। O (¹⁶8O): p = e = 8, n=16-8=8 — তিনটিই সমান । P (15, 16), Na (11, 12), F (9, 10)— এদের নিউট্রন সংখ্যা প্রোটনের চেয়ে বেশি।"},{"id":"ch3-mcq19","chapter":3,"num":19,"importance":3,"topic":"পরমাণুর সাংগঠনিক কণা","question":"Al³⁺ আয়নে কতটি প্রোটন রয়েছে?","boards":"সিলেট বোর্ড ২০২২; চট্টগ্রাম বোর্ড ২০২১","options":["10","13","16","27"],"answerIndex":1,"explanation":"আয়ন গঠনে শুধু ইলেকট্রনের আদান-প্রদান হয়, প্রোটন সংখ্যা বদলায় না। Al-এর পারমাণবিক সংখ্যা 13, তাই Al³⁺ আয়নেও প্রোটন 13টি (ইলেকট্রন 10টি)।"},{"id":"ch3-mcq20","chapter":3,"num":20,"importance":3,"topic":"পরমাণুর সাংগঠনিক কণা","question":"আধান শূন্য কণিকা — (i) ইলেকট্রন (ii) প্রোটন (iii) নিউট্রন নিচের কোনটি সঠিক?","boards":"ঢাকা বোর্ড ২০২১; চট্টগ্রাম বোর্ড ২০২১","options":["iii","i ও ii","i ও iii","ii ও iii"],"answerIndex":0,"explanation":"ইলেকট্রনের আধান -1 (ঋণাত্মক), প্রোটনের আধান +1 (ধনাত্মক)। নিউট্রনের কোনো আধান নেই, অর্থাৎ আধান শূন্য। তাই শুধু iii সঠিক ।"},{"id":"ch3-mcq21","chapter":3,"num":21,"importance":3,"topic":"পরমাণুর সাংগঠনিক কণা","question":"কোনটি মৌলের আসল পরিচয় প্রকাশ করে?","boards":"চট্টগ্রাম বোর্ড ২০২৬","options":["ভরসংখ্যা","নিউট্রন সংখ্যা","ইলেকট্রন সংখ্যা","পারমাণবিক সংখ্যা"],"answerIndex":3,"explanation":"প্রতিটি মৌলের পারমাণবিক সংখ্যা (প্রোটন সংখ্যা) নির্দিষ্ট ও ভিন্ন, তাই এটিই মৌলের আসল পরিচয় ।"},{"id":"ch3-mcq22","chapter":3,"num":22,"importance":3,"topic":"পরমাণুর সাংগঠনিক কণা","question":"প্রোটনের প্রকৃত ভর কত?","boards":"রাজশাহী বোর্ড ২০২৬","options":["1.673 × 10⁻²⁴ g","1.675 × 10⁻²⁴ g","1.60 × 10⁻¹⁹ g","9.11 × 10⁻²⁸ g"],"answerIndex":0,"explanation":"প্রোটনের ভর 1.673 × 10⁻²⁴ g; নিউট্রনের ভর 1.675 × 10⁻²⁴ g।"},{"id":"ch3-mcq23","chapter":3,"num":23,"importance":3,"topic":"পরমাণুর সাংগঠনিক কণা","question":"Cu⁺ আয়নে কতটি ইলেকট্রন আছে?","boards":"সিলেট বোর্ড ২০২৬","options":["27","28","29","63"],"answerIndex":1,"explanation":"Cu এর পারমাণবিক সংখ্যা 29; একটি ইলেকট্রন ত্যাগ করে Cu⁺ হলে ইলেকট্রন থাকে 29 – 1 = 28টি।"},{"id":"ch3-mcq24","chapter":3,"num":24,"importance":3,"topic":"পরমাণুর সাংগঠনিক কণা","question":"প্রোটনের আপেক্ষিক আধান কত?","boards":"যশোর বোর্ড ২০২৬","options":["-1.60 × 10⁻¹⁹ কুলম্ব","+1.60 × 10¹⁹ কুলম্ব","+1.60 × 10⁻¹⁹ কুলম্ব","+1"],"answerIndex":3,"explanation":"প্রোটনের প্রকৃত আধান +1.60 × 10⁻¹⁹ কুলম্ব, আপেক্ষিক আধান +1।"},{"id":"ch3-mcq25","chapter":3,"num":25,"importance":2,"topic":"পরমাণুর সাংগঠনিক কণা","question":"⁵⁶26 Fe পরমাণুর নিউট্রন সংখ্যা কত?","boards":"বরিশাল বোর্ড ২০২৫","options":["26","28","30","56"],"answerIndex":2,"explanation":"⁵⁶26Fe-এ ভরসংখ্যা A = 56, পারমাণবিক সংখ্যা Z = 26। নিউট্রন সংখ্যা =A-Z=56-26=30"},{"id":"ch3-mcq26","chapter":3,"num":26,"importance":3,"topic":"পরমাণুর মডেল","question":"প্লাংক ধ্রুবকের মান—","boards":"বরিশাল বোর্ড ২০২৩; ঢাকা বোর্ড ২০২২; সিলেট বোর্ড ২০২০","options":["4.482 × 10⁻²³ m² kg/s","1.66 × 10⁻²⁴ m² kg/s","9.11 × 10⁻³¹ m² kg/s","6.626 × 10⁻³⁴ m² kg/s"],"answerIndex":3,"explanation":"বোর মডেলের কৌণিক ভরবেগের সূত্র mvr=nh/2π এ ব্যবহৃত প্লাংক ধ্রুবক h=6.626×10⁻³⁴ m² kg/s। অন্য মানগুলো চিনে রাখো: 9.11 × 10⁻³¹ kg হলো ইলেকট্রনের ভর, 1.66 × 10⁻²⁴ g হলো 1 amu এর মান।"},{"id":"ch3-mcq27","chapter":3,"num":27,"importance":2,"topic":"পরমাণুর মডেল","question":"পারমাণবিক বর্ণালির সর্বপ্রথম ধারণা পাওয়া যায় কোন বিজ্ঞানীর পরমাণু মডেল থেকে?","boards":"যশোর বোর্ড ২০২৫","options":["রাদারফোর্ড","নীলস্ বোর","মেন্ডেলিফ","মোসলে"],"answerIndex":1,"explanation":"বোর মডেলে বলা হয়েছে, ইলেকট্রন উচ্চ শক্তিস্তর থেকে নিম্ন শক্তিস্তরে নামার সময় শক্তি বিকিরণ করে এবং এ আলো থেকেই পারমাণবিক বর্ণালি সৃষ্টি হয়। রাদারফোর্ড মডেল কোনো মৌলের বর্ণালি ব্যাখ্যা করতে পারে না। তাই বর্ণালির প্রথম ধারণা নীলস্ বোরের মডেল থেকে।"},{"id":"ch3-mcq28","chapter":3,"num":28,"importance":2,"topic":"পরমাণুর মডেল","question":"বোর মডেল অনুসারে mvr=nh/2π। এখানে 'n' দ্বারা নিচের কোনটি বুঝায়?","boards":"ময়মনসিংহ বোর্ড ২০২৫","options":["অরবিটাল","সহকারী কোয়ান্টাম সংখ্যা","প্রধান কোয়ান্টাম সংখ্যা","উপশক্তিস্তর"],"answerIndex":2,"explanation":"mvr=nh/2π সূত্রে n হলো প্রধান শক্তিস্তর বা প্রধান কোয়ান্টাম সংখ্যা (n = 1, 2, 3 ...)। m = ইলেকট্রনের ভর, v = বেগ, r = কক্ষপথের ব্যাসার্ধ, h = প্লাংক ধ্রুবক ।"},{"id":"ch3-mcq29","chapter":3,"num":29,"importance":2,"topic":"পরমাণুর মডেল","question":"ক্যালসিয়ামের 3p অরবিটালে অবস্থানরত একটি ইলেকট্রনের কৌণিক ভরবেগ কত?","boards":"সিলেট বোর্ড ২০২৫","options":["3.16 × 10⁻³⁴ m²kg/s","4.22 × 10⁻³⁴ m²kg/s","5.27 × 10⁻³⁴ m²kg/s","6.33 × 10⁻³⁴ m²kg/s"],"answerIndex":0,"explanation":"3p অরবিটাল তৃতীয় প্রধান শক্তিস্তরে (M স্তর) অবস্থিত, তাই n = 3। mvr=nh/2π=(3×6.626×10⁻³⁴)/(2×3.1416) =3.16×10⁻³⁴ m²kg/s কৌণিক ভরবেগ শুধু n এর উপর নির্ভর করে; মৌলটি ক্যালসিয়াম হওয়ায় হিসাবে কোনো পরিবর্তন হয় না।"},{"id":"ch3-mcq30","chapter":3,"num":30,"importance":3,"topic":"পরমাণুর শক্তিস্তরে ইলেকট্রন বিন্যাস","question":"প্রধান শক্তিস্তর n = 3 এবং উপশক্তি স্তর l = 2 এর জন্য কোন অরবিটালটি পাওয়া যাবে?","boards":"কুমিল্লা বোর্ড ২০২৫; যশোর বোর্ড ২০২৩","options":["3s","3p","3d","3f"],"answerIndex":2,"explanation":"l এর মান 0, 1, 2, 3 হলে উপশক্তিস্তর যথাক্রমে s, p, d, f। n = 3 ও l = 2 হলে অরবিটালটি হলো 3d। (n = 3 এ l = 3 সম্ভব নয়, তাই 3f হয় না।)"},{"id":"ch3-mcq31","chapter":3,"num":31,"importance":3,"topic":"পরমাণুর শক্তিস্তরে ইলেকট্রন বিন্যাস","question":"n = 4 এবং l = 2 এর জন্য কোন উপশক্তিস্তরটি সম্ভব?","boards":"চট্টগ্রাম বোর্ড ২০২৫; সিলেট বোর্ড ২০২৩","options":["4s","4p","4d","4f"],"answerIndex":2,"explanation":"n = 4 হলে l = 0, 1, 2, 3 অর্থাৎ 4s, 4p, 4d, 4f। এর মধ্যে l = 2 মানে d উপশক্তিস্তর, তাই উত্তর 4d।"},{"id":"ch3-mcq32","chapter":3,"num":32,"importance":3,"topic":"পরমাণুর শক্তিস্তরে ইলেকট্রন বিন্যাস","question":"1s² 2s² 2p⁶ 3s² 3p⁶ ইলেকট্রন বিন্যাস দেখা যায়— (i) S²⁻ এ (ii) Fe²⁺ এ (iii) Sc³⁺ এ নিচের কোনটি সঠিক?","boards":"বরিশাল বোর্ড ২০২৩; দিনাজপুর বোর্ড ২০২১","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":1,"explanation":"1s² 2s² 2p⁶ 3s² 3p⁶ বিন্যাসে মোট ইলেকট্রন = 18।\n(i)S²⁻→16+2=18টি ইলেকট্রন — সঠিক ।\n(ii)Fe²⁺→26-2=24টি ইলেকট্রন; বিন্যাস 1s² 2s² 2p⁶ 3s² 3p⁶\n3d⁶ — সঠিক নয়।\n(iii)Sc³⁺→21-3=18টি ইলেকট্রন — সঠিক ।"},{"id":"ch3-mcq33","chapter":3,"num":33,"importance":3,"topic":"পরমাণুর শক্তিস্তরে ইলেকট্রন বিন্যাস","question":"কপার এর M শেলে কতটি ইলেকট্রন থাকে?","boards":"কুমিল্লা বোর্ড ২০২১; দিনাজপুর বোর্ড ২০২১","options":["9","10","17","18"],"answerIndex":3,"explanation":"Cu(29)→1s2 2s2 2p6 3s2 3p6 3d10 4s1\nM শেলে (n = 3) আছে 3s² 3p⁶ 3d¹⁰=2+6+10=18টি ইলেকট্রন ।"},{"id":"ch3-mcq34","chapter":3,"num":34,"importance":3,"topic":"পরমাণুর শক্তিস্তরে ইলেকট্রন বিন্যাস","question":"Fe²⁺ আয়নের d অরবিটালে কতটি ইলেকট্রন আছে?","boards":"চট্টগ্রাম বোর্ড ২০২৬","options":["4টি","5টি","6টি","7টি"],"answerIndex":2,"explanation":"Fe (26): [Ar] 3d⁶ 4s²; Fe²⁺ এ 4s এর 2টি ইলেকট্রন চলে\nযায় → [Ar] 3d⁶। তাই d অরবিটালে 6টি ইলেকট্রন ।"},{"id":"ch3-mcq35","chapter":3,"num":35,"importance":3,"topic":"পরমাণুর শক্তিস্তরে ইলেকট্রন বিন্যাস","question":"Cr এর পারমাণবিক সংখ্যা 24। এর সঠিক ইলেকট্রন বিন্যাস কোনটি?","boards":"সিলেট বোর্ড ২০২৬","options":["1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹ 3d⁵","1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁶","1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d⁴","1s² 2s² 2p⁶ 3s² 3p³ 4s¹ 3d⁸"],"answerIndex":0,"explanation":"অর্ধপূর্ণ d অরবিটাল (3d5) বেশি স্থিতিশীল, তাই 4s এর একটি ইলেকট্রন 3d তে চলে যায়: 4s¹ 3d⁵।"},{"id":"ch3-mcq36","chapter":3,"num":36,"importance":3,"topic":"পরমাণুর শক্তিস্তরে ইলেকট্রন বিন্যাস","question":"3d অরবিটালের ক্ষেত্রে কোনটি সঠিক?","boards":"দিনাজপুর বোর্ড ২০২৬","options":["n = 3 এবং l = 0","n = 3 এবং l = 1","n = 3 এবং l = 2","n = 3 এবং l = 3"],"answerIndex":2,"explanation":"s, p, d, f এর জন্য l = 0, 1, 2, 3; তাই 3d এর ক্ষেত্রে n = 3, l = 2।"},{"id":"ch3-mcq37","chapter":3,"num":37,"importance":3,"topic":"পরমাণুর শক্তিস্তরে ইলেকট্রন বিন্যাস","question":"কোন উপশক্তিস্তরে ইলেকট্রন সবার শেষে প্রবেশ করে?","boards":"যশোর বোর্ড ২০২৬","options":["5d","6p","7s","5f"],"answerIndex":3,"explanation":"(n + l) মান: 5d = 7, 6p = 7, 7s = 7, 5f = 8; যার (n + l) মান বেশি তাতে ইলেকট্রন পরে প্রবেশ করে, তাই 5f।"},{"id":"ch3-mcq38","chapter":3,"num":38,"importance":3,"topic":"পরমাণুর শক্তিস্তরে ইলেকট্রন বিন্যাস","question":"d উপশক্তিস্তরে ইলেকট্রন ধারণক্ষমতা কত?","boards":"বরিশাল বোর্ড ২০২৬","options":["2","6","10","14"],"answerIndex":2,"explanation":"d উপস্তরে 5টি অরবিটাল, প্রতিটিতে 2টি করে → 10টি\nইলেকট্রন ।"},{"id":"ch3-mcq39","chapter":3,"num":39,"importance":3,"topic":"পরমাণুর শক্তিস্তরে ইলেকট্রন বিন্যাস","question":"M শেলে সর্বোচ্চ ইলেকট্রন ধারণক্ষমতা কত?","boards":"ময়মনসিংহ বোর্ড ২০২৬","options":["8","18","32","50"],"answerIndex":1,"explanation":"M শেলে n = 3; সর্বোচ্চ ইলেকট্রন = 2n² =2×3² = 18"},{"id":"ch3-mcq40","chapter":3,"num":40,"importance":2,"topic":"পরমাণুর শক্তিস্তরে ইলেকট্রন বিন্যাস","question":"পরমাণুর M শেলে কয়টি উপশক্তিস্তর থাকে?","boards":"সিলেট বোর্ড ২০২৪","options":["1","2","3","4"],"answerIndex":2,"explanation":"M শেলের জন্য n = 3, তাই l = 0, 1, 2।\nঅর্থাৎ উপশক্তিস্তর তিনটি — 3s, 3p ও 3d।"},{"id":"ch3-mcq41","chapter":3,"num":41,"importance":3,"topic":"আইসোটোপ","question":"ট্রিটিয়ামে নিউট্রন সংখ্যা কত?","boards":"রাজশাহী বোর্ড ২০২৫; সিলেট বোর্ড ২০২৫","options":["0","1","2","3"],"answerIndex":2,"explanation":"ট্রিটিয়ামের প্রতীক 3/1T, অর্থাৎ A = 3, Z = 1। নিউট্রন সংখ্যা =A-Z=3-1=2"},{"id":"ch3-mcq42","chapter":3,"num":42,"importance":3,"topic":"আইসোটোপ","question":"হাইড্রোজেনের আইসোটোপ কতটি?","boards":"ঢাকা বোর্ড ২০২২; বরিশাল বোর্ড ২০২১","options":["1","3","4","7"],"answerIndex":3,"explanation":"হাইড্রোজেনের মোট সাতটি আইসোটোপ আছে: 1H, 2H, 3H, 4H, 5H, 6H ও 7H। এর মধ্যে 3টি প্রকৃতিতে পাওয়া যায়, বাকি 4টি ল্যাবরেটরিতে তৈরি। তাই উত্তর 7।"},{"id":"ch3-mcq43","chapter":3,"num":43,"importance":2,"topic":"আইসোটোপ","question":"65/29 A কোন মৌলের আইসোটোপ?","boards":"দিনাজপুর বোর্ড ২০২৩","options":["Si","Zn","P","Cu"],"answerIndex":3,"explanation":"65/29A এর পারমাণবিক সংখ্যা 29। পারমাণবিক সংখ্যা 29 হলো কপার (Cu) এর। কপারের পরিচিত পরমাণু 63/29Cu; 65/29A ও 63/29Cu এর প্রোটন সংখ্যা সমান (29) কিন্তু ভরসংখ্যা ভিন্ন। তাই A হলো Cu এর আইসোটোপ । (Si = 14, P = 15, Zn = 30 — কোনোটির Z = 29 নয়।)"},{"id":"ch3-mcq44","chapter":3,"num":44,"importance":2,"topic":"আইসোটোপ","question":"হাইড্রোজেনের কয়টি আইসোটোপ ল্যাবরেটরীতে প্রস্তুত করা হয়?","boards":"কুমিল্লা বোর্ড ২০২৩","options":["3","4","5","7"],"answerIndex":1,"explanation":"হাইড্রোজেনের মোট আইসোটোপ 7টি, প্রকৃতিতে পাওয়া যায় 3টি। ল্যাবরেটরিতে প্রস্তুত =7-3=4টি (4H, 5H, 6H, 7H)"},{"id":"ch3-mcq45","chapter":3,"num":45,"importance":3,"topic":"পারমাণবিক ভর বা আপেক্ষিক পারমাণবিক ভর","question":"কোনো মৌলের একটি পরমাণুর ভর 3.16 × 10⁻²³ g। এর আপেক্ষিক পারমাণবিক ভর কত?","boards":"যশোর বোর্ড ২০২৪; বরিশাল বোর্ড ২০২১; সিলেট বোর্ড ২০২১","options":["9","19","27","32"],"answerIndex":1,"explanation":"আপেক্ষিক পারমাণবিক ভর = একটি পরমাণুর ভর / 1.66 × 10⁻²⁴ g =(3.16×10⁻²³)/(1.66×10⁻²⁴)=19। মৌলটি ফ্লোরিন (F)।"},{"id":"ch3-mcq46","chapter":3,"num":46,"importance":3,"topic":"পারমাণবিক ভর বা আপেক্ষিক পারমাণবিক ভর","question":"Al এর একটি পরমাণুর ভর কত গ্রাম?","boards":"চট্টগ্রাম বোর্ড ২০২৫; ময়মনসিংহ বোর্ড ২০২৩","options":["27","4.482 × 10⁻²³","1.66 × 10⁻²⁴","3.16 × 10⁻²³"],"answerIndex":1,"explanation":"Al এর আপেক্ষিক পারমাণবিক ভর 27।\nএকটি পরমাণুর ভর =27×1.66×10⁻²⁴g=4.482×10⁻²³g। 27 হলো আপেক্ষিক ভর (একক নেই), গ্রাম নয়।"},{"id":"ch3-mcq47","chapter":3,"num":47,"importance":3,"topic":"পারমাণবিক ভর বা আপেক্ষিক পারমাণবিক ভর","question":"একটি মৌলের পরমাণুর প্রকৃত ভর যদি 4.482 × 10⁻²³ গ্রাম হয় তবে এর আপেক্ষিক পারমাণবিক ভর কত?","boards":"কুমিল্লা বোর্ড ২০২৫; যশোর বোর্ড ২০২১","options":["25","27","29","40"],"answerIndex":1,"explanation":"আপেক্ষিক পারমাণবিক ভর =(4.482×10⁻²³g)/(1.66×10⁻²⁴g)=27। মৌলটি অ্যালুমিনিয়াম (Al)।"},{"id":"ch3-mcq48","chapter":3,"num":48,"importance":3,"topic":"পারমাণবিক ভর বা আপেক্ষিক পারমাণবিক ভর","question":"প্রকৃতিতে প্রাপ্ত ³⁵Cl এর শতকরা পরিমাণ কত?","boards":"বরিশাল বোর্ড ২০২৩; ঢাকা বোর্ড ২০২১","options":["15%","35%","75%","99%"],"answerIndex":2,"explanation":"ধরি, ³⁵Cl = x%, ³⁷Cl = (100 - x)%; ক্লোরিনের গড় পারমাণবিক ভর 35.5। ([35x+37(100-x)])/100=35.5 =\u003e -2x = -150 =\u003e x = 75। তাই ³⁵Cl = 75% এবং ³⁷Cl = 25%।"},{"id":"ch3-mcq49","chapter":3,"num":49,"importance":3,"topic":"পারমাণবিক ভর বা আপেক্ষিক পারমাণবিক ভর","question":"কোনো মৌলের একটি পরমাণুর ভর 3.16 × 10⁻²³ g হলে, মৌলটির আপেক্ষিক পারমাণবিক ভর কত?","boards":"চট্টগ্রাম বোর্ড ২০২৬","options":["19","20","21","22"],"answerIndex":0,"explanation":"আপেক্ষিক পারমাণবিক ভর =(3.16×10⁻²³)/(1.66×10⁻²⁴)=19"},{"id":"ch3-mcq50","chapter":3,"num":50,"importance":3,"topic":"তেজস্ক্রিয় আইসোটোপ ও তাদের ব্যবহার","question":"মানবদেহে টিউমারের উপস্থিতি নির্ণয়ে নিচের কোন আইসোটোপ ব্যবহৃত হয়?","boards":"বরিশাল বোর্ড ২০২১; সিলেট বোর্ড ২০২১; ময়মনসিংহ বোর্ড ২০২০","options":["¹³¹I","⁹⁹Tc","⁶⁰Co","³²P"],"answerIndex":2,"explanation":"টিউমারের উপস্থিতি নির্ণয় ও নিরাময়ে কোবাল্ট-60 (60Co) ব্যবহৃত হয়। 60Co থেকে নির্গত গামা রশ্মি ক্যানসারের কোষকলাকে ধ্বংস করে। তাই সঠিক উত্তর গ।"},{"id":"ch3-mcq51","chapter":3,"num":51,"importance":3,"topic":"তেজস্ক্রিয় আইসোটোপ ও তাদের ব্যবহার","question":"নিচের কোন আইসোটোপটি রক্তের লিউকোমিয়া রোগের চিকিৎসায় ব্যবহার করা হয়?","boards":"চট্টগ্রাম বোর্ড ২০২৪; কুমিল্লা বোর্ড ২০২৩","options":["⁶⁰Co","³²P","⁹⁹Tc","¹³¹I"],"answerIndex":1,"explanation":"রক্তের লিউকোমিয়া রোগের চিকিৎসায় ফসফরাস-32 (32P) এর ফসফেট ব্যবহার করা হয়। 60Co টিউমারে, 99Tc রোগ নির্ণয়ে (ছবি তোলায়) এবং 131I থাইরয়েড ক্যানসারে ব্যবহৃত হয়। তাই সঠিক উত্তর খ।"},{"id":"ch3-mcq52","chapter":3,"num":52,"importance":3,"topic":"তেজস্ক্রিয় আইসোটোপ ও তাদের ব্যবহার","question":"টেকনিশিয়াম-99 এর লাইফ টাইম কত?","boards":"যশোর বোর্ড ২০২১; ময়মনসিংহ বোর্ড ২০২১","options":["2 ঘণ্টা","4 ঘণ্টা","6 ঘণ্টা","8 ঘণ্টা"],"answerIndex":2,"explanation":"টেকনিশিয়াম-99 (99Tc) এর লাইফটাইম 6 ঘণ্টা । অল্প সময়ে তেজস্ক্রিয়তা শেষ হয়ে যায় বলে রোগ নির্ণয়ে এটি নিরাপদ। তাই সঠিক উত্তর গ।"},{"id":"ch3-mcq53","chapter":3,"num":53,"importance":3,"topic":"তেজস্ক্রিয় আইসোটোপ ও তাদের ব্যবহার","question":"থাইরয়েড ক্যানসার নিরাময়ে কোনটি ব্যবহার করা হয়?","boards":"চট্টগ্রাম বোর্ড ২০২৬","options":["Tc-99","I-131","Co-60","P-32"],"answerIndex":1,"explanation":"তেজস্ক্রিয় I-131 থাইরয়েড গ্রন্থির ক্যানসার নির্ণয় ও নিরাময়ে ব্যবহৃত হয়।"},{"id":"ch3-mcq54","chapter":3,"num":54,"importance":3,"topic":"তেজস্ক্রিয় আইসোটোপ ও তাদের ব্যবহার","question":"টেকনেসিয়াম-99 আইসোটোপ থেকে কোন রশ্মি নির্গত হয়?","boards":"সিলেট বোর্ড ২০২৬","options":["আলফা রশ্মি","গামা রশ্মি","বিটা রশ্মি","রঞ্জন রশ্মি"],"answerIndex":1,"explanation":"Tc-99 থেকে নির্গত গামা রশ্মি ব্যবহার করে দেহের অভ্যন্তরের ছবি (স্ক্যান) নেওয়া হয়।"},{"id":"ch3-mcq55","chapter":3,"num":55,"importance":3,"topic":"তেজস্ক্রিয় আইসোটোপ ও তাদের ব্যবহার","question":"Co-60 আইসোটোপ —\ni. ক্যানসার কোষ ধ্বংস করে\nii. থাইরয়েড চিকিৎসায় ব্যবহৃত হয়\niii. গামা রশ্মি বিকিরণ করে;\nনিচের কোনটি সঠিক?","boards":"দিনাজপুর বোর্ড ২০২৬","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":1,"explanation":"Co-60 থেকে নির্গত গামা রশ্মি ক্যানসার কোষ ধ্বংস করে। থাইরয়েড চিকিৎসায় ব্যবহৃত হয় I-131।"},{"id":"ch3-mcq56","chapter":3,"num":56,"importance":3,"topic":"তেজস্ক্রিয় আইসোটোপ ও তাদের ব্যবহার","question":"কোন আইসোটোপ রক্তের লিউকেমিয়া রোগের চিকিৎসায় ব্যবহৃত হয়?","boards":"বরিশাল বোর্ড ২০২৬","options":["I-131","Tc-99","Co-60","P-32"],"answerIndex":3,"explanation":"তেজস্ক্রিয় P-32 লিউকেমিয়া (ব্লাড ক্যানসার) চিকিৎসায় ব্যবহৃত হয়।"},{"id":"ch3-mcq57","chapter":3,"num":57,"importance":2,"topic":"তেজস্ক্রিয় আইসোটোপ ও তাদের ব্যবহার","question":"থাইরয়েড ক্যান্সার কোষ ধ্বংস করার জন্য নিম্নের কোন আইসোটোপ ব্যবহার করা হয়?","boards":"রাজশাহী বোর্ড ২০২১","options":["⁶⁰Co","³²P","¹³¹I","⁹⁹Tc"],"answerIndex":2,"explanation":"থাইরয়েড ক্যানসারে রোগীকে আয়োডিন-131 (131I) সমৃদ্ধ দ্রবণ পান করানো হয়। 131I থাইরয়েডে পৌঁছে ব ূমি","question":"২য় পর্যায়ের সর্বশেষ মৌল কোনটি?","boards":"ময়মনসিংহ বোর্ড ২০২৪; চট্টগ্রাম বোর্ড ২০২১","options":["He","Ne","Ar","Kr"],"answerIndex":1,"explanation":"২য় পর্যায়ে 8টি মৌল: Li, Be, B, C, N, O, F, Ne। প্রথম মৌল Li (3) এবং সর্বশেষ মৌল নিষ্ক্রিয় গ্যাস Ne (10)। He প্রথম পর্যায়ের, Ar তৃতীয় পর্যায়ের এবং Kr চতুর্থ পর্যায়ের শেষ মৌল।"},{"id":"ch4-mcq6","chapter":4,"num":6,"importance":3,"topic":"পর্যায় সারণির পটভূমি","question":"ল্যান্থানাইড সারির মৌল কয়টি?","boards":"বরিশাল বোর্ড ২০২৩; দিনাজপুর বোর্ড ২০২২","options":["14","15","17","18"],"answerIndex":1,"explanation":"যে সকল মৌলের পারমাণবিক সংখ্যা 57 থেকে 71 পর্যন্ত, তাদের ল্যান্থানাইড সারির মৌল বলে। মৌলের সংখ্যা =71-57+1=15টি। এরা পর্যায় সারণির নিচে আলাদাভাবে দেখানো হলেও আসলে ৬ষ্ঠ পর্যায়ের গ্রুপ-3 এর অন্তর্গত ।"},{"id":"ch4-mcq7","chapter":4,"num":7,"importance":3,"topic":"পর্যায় সারণির পটভূমি","question":"পর্যায় সারণিতে খাড়া স্তম্ভ কতটি?","boards":"ঢাকা বোর্ড ২০২৩; ময়মনসিংহ বোর্ড ২০২০","options":["2","8","18","32"],"answerIndex":2,"explanation":"আধুনিক পর্যায় সারণিতে খাড়া স্তম্ভ বা গ্রুপ 18টি (গ্রুপ 1 থেকে 18) এবং আনুভূমিক সারি বা পর্যায় 7টি।"},{"id":"ch4-mcq8","chapter":4,"num":8,"importance":3,"topic":"পর্যায় সারণির পটভূমি","question":"ল্যাভয়সিয়ে মোট কতটি মৌল নিয়ে পর্যায় সারণি তৈরির কাজ শুরু করেন?","boards":"রাজশাহী বোর্ড ২০২৬","options":["67","63","36","33"],"answerIndex":3,"explanation":"1789 সালে ল্যাভয়সিয়ে তখন জানা 33টি মৌলকে ধাতু ও অধাতুতে ভাগ করেন ।"},{"id":"ch4-mcq9","chapter":4,"num":9,"importance":2,"topic":"পর্যায় সারণির পটভূমি","question":"অ্যাকটিনাইড সারির মৌলগুলো কোন পর্যায়ে অবস্থিত?","boards":"বরিশাল বোর্ড ২০২৫","options":["৪র্থ","৫ম","৬ষ্ঠ","৭ম"],"answerIndex":3,"explanation":"পর্যায় সারণির 7ম পর্যায়ে অ্যাকটিনিয়াম (89) থেকে লরেনসিয়াম (103) পর্যন্ত 15টি মৌলকে অ্যাকটিনাইড সারি বলে। এদের ধর্ম কাছাকাছি হওয়ায় মূল সারণির নিচে আলাদা সারিতে রাখা হয়েছে । তাই উত্তর ঘ) ৭ম।"},{"id":"ch4-mcq10","chapter":4,"num":10,"importance":2,"topic":"পর্যায় সারণির পটভূমি","questio ions":["1টি","2টি","3টি","4টি"],"answerIndex":2,"explanation":"Sc (21): [Ar] 3d¹ 4s² → যোজ্যতা ইলেকট্রন 2+1=3টি।"},{"id":"ch4-mcq20","chapter":4,"num":20,"importance":2,"topic":"ইলেকট্রন বিন্যাস থেকে পর্যায় সারণিতে মৌলের অবস্থান নির্ণয়","stemPrefix":"P = .........(n – 1) s²(n–1)p⁶ns² ; Q = .........(n – 1) s²(n– 1)p⁶ns²np⁵ [এখানে, n = 3; P, Q মৌলের প্রকৃত প্রতীক নয়","question":"P মৌলটি কত নং গ্রুপে অবস্থিত?","boards":"ময়মনসিংহ বোর্ড ২০২৫","options":["গ্রুপ-2","গ্রুপ-8","গ্রুপ-10","গ্রুপ-14"],"answerIndex":0,"explanation":"n = 3 বসালে P→1s²2s²2p⁶3s²(Z=12, ম্যাগনেসিয়াম)।\nবাইরের শক্তিস্তরে শুধু s অরবিটাল, তাতে 2টি ইলেকট্রন (নিয়ম 1)। তাই P এর গ্রুপ 2, পর্যায় 3।\nতুলনা: Q→1s²2s²2p⁶3s²3p⁵, গ্রুপ =2+5+10=17।"},{"id":"ch4-mcq21","chapter":4,"num":21,"importance":2,"topic":"ইলেকট্রন বিন্যাস থেকে পর্যায় সারণিতে মৌলের অবস্থান নির্ণয়","question":"24 পারমাণবিক সংখ্যা বিশিষ্ট মৌলটির অবস্থান পর্যায় সারণির কোন গ্রুপে?","boards":"কুমিল্লা বোর্ড ২০২৪","options":["6","8","10","12"],"answerIndex":0,"explanation":"Cr(24) এর ইলেকট্রন বিন্যাস: 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁵ 4s¹। সর্বশেষ শক্তিস্তর 4, তাই পর্যায় 4। শেষ ইলেকট্রন d অরবিটালে যায়, তাই গ্রুপ = (n-1)d ইলেকট্রন + ns ইলেকট্রন =5+1=6।"},{"id":"ch4-mcq22","chapter":4,"num":22,"importance":2,"topic":"ইলেকট্রন বিন্যাস থেকে পর্যায় সারণিতে মৌলের অবস্থান নির্ণয়","question":"X→1s²2s²2p⁶3s²3p⁶3d⁵4s¹ মৌলটি পর্যায়\nসারণির কোন গ্রুপে অবস্থিত?","boards":"কুমিল্লা বোর্ড ২০২২","options":["গ্রুপ-14","গ্রুপ-6","গ্রুপ-5","গ্রুপ-1"],"answerIndex":1,"explanation":"বিন্যাসটিতে মোট ইলেকট্রন 24, তাই X হলো ক্রোমিয়াম (Cr)। বাইরের 4s এ 1টি এবং আগের 3d তে 5টি ইলেকট্রন (নিয়ম 3)। গ্রুপ =1+5=6"},{"id":"ch4-mcq23","chapter":4,"num":23,"importance":2,"topic":"ইলেকট্রন বিন্যাসই পর্যায় সারণির মূল ভিত্তি","question":"পর্যায় সারণির মূল ভিত্তি কী?","boards":"যশোর বোর্ড ২০২২","options":["ইলেকট্রন সংখ্যা","ইলেকট্রন বিন্যাস","পারমাণবিক সংখ্যা","পারমাণবিক ভরসংখ্যা"],"answerIndex":1,"explanation":"ইলেকট্রন বিন্যাস থেকে মৌলের পর্যায় ও গ্রুপ নির্ণয় করা যায় এবং মৌলের অনেক ধর্ম ব্যাখ্যা করা যায়। শুধু ইলেকট্রন সংখ্যা বা পারমাণবিক সংখ্যা দিয়ে সরাসরি পর্যায়-গ্রুপ বোঝা যায় না, বিন্যাস করতে হয়। তাই পর্যায় সারণির মূল ভিত্তি ইলেকট্রন বিন্যাস ।"},{"id":"ch4-mcq24","chapter":4,"num":24,"importance":2,"topic":"পর্যায় সারণির কিছু ব্যতিক্রম","question":"কোনটি অধাতু?","boards":"বরিশাল বোর্ড ২০২৪","options":["হাইড্রোজেন","লিথিয়াম","জিঙ্ক","সিলভার"],"answerIndex":0,"explanation":"হাইড্রোজেন একটি অধাতু; লিথিয়াম, জিঙ্ক ও সিলভার ধাতু। অধাতু হলেও ns1 বিন্যাস (1s1), H+ আয়ন গঠন এবং ক্ষার ধাতুর মতো অক্সাইড (H₂O) ও হ্যালাইড (HCl) গঠনের কারণে H কে গ্রুপ-1 এ রাখা হয়েছে ।"},{"id":"ch4-mcq25","chapter":4,"num":25,"importance":2,"topic":"পর্যায় সারণির কিছু ব্যতিক্রম","question":"ইলেকট্রন বিন্যাসের নিয়ম অনুসারে গ্রুপ নির্ণয়ে কোন মৌলটি ব্যতিক্রম?","boards":"বরিশাল বোর্ড ২০২২","options":["He","Al","K","Cu"],"answerIndex":0,"explanation":"He(2)→1s²। সর্বশেষ s অরবিটালে 2টি ইলেকট্রন, তাই\nনিয়ম অনুসারে গ্রুপ-2 হওয়ার কথা।\nকিন্তু He নিষ্ক্রিয় গ্যাস হওয়ায় একে গ্রুপ-18 এ রাখা হয়েছে । অন্যদিকে Al (গ্রুপ-13), K (গ্রুপ-1) ও Cu (গ্রুপ-11) এর গ্রুপ নিয়ম মেনেই নির্ণয় করা যায়।"},{"id":"ch4-mcq26","chapter":4,"num":26,"importance":3,"topic":"মৌলের পর্যায়বৃত্ত ধর্ম","question":"নিচের কোন মৌলটির আয়নিকরণ শক্তি বেশি?","boards":"যশোর বোর্ড ২০২৩; সিলেট বোর্ড ২০২০","options":["K","Na","Ca","Mg"],"answerIndex":3,"explanation":"Na ও Mg পর্যায় 3 এর এবং K ও Ca পর্যায় 4 এর মৌল । পর্যায়ে বাম থেকে ডানে আয়নিকরণ শক্তি বাড়ে, গ্রুপে উপর থেকে নিচে কমে। তাই Mg \u003e Na এবং Ca \u003e K; আবার Mg \u003e Ca (একই গ্রুপে Mg উপরে)। ক্রম: Mg \u003e Na \u003e Ca \u003e K; সবচেয়ে বেশি Mg।"},{"id":"ch4-mcq27","chapter":4,"num":27,"importance":3,"topic":"মৌলের পর্যায়বৃত্ত ধর্ম","question":"নিচের কোন মৌলটির আয়নিকরণ শক্তি বেশি?","boards":"দিনাজপুর বোর্ড ২০২৩; বরিশাল বোর্ড ২০২২","options":["Ca","K","Cl","F"],"answerIndex":3,"explanation":"F ও Cl গ্রুপ 17 এর মৌল; F উপরে থাকায় এর আকার সবচেয়ে ছোট। K ও Ca পর্যায় 4 এর বামদিকের মৌল, এদের আকার বড়। আকার যত ছোট আয়নিকরণ শক্তি তত বেশি, তাই F এর আয়নিকরণ শক্তি সবচেয়ে বেশি।"},{"id":"ch4-mcq28","chapter":4,"num":28,"importance":3,"topic":"মৌলের পর্যায়বৃত্ত ধর্ম","question":"নিচের কোন মৌলের ইলেকট্রনের আসক্তি সবচেয়ে কম?","boards":"ঢাকা বোর্ড ২০২২; বরিশাল বোর্ড ২০২১","options":["Be","Ra","Sr","Mg"],"answerIndex":1,"explanation":"Be, Mg, Sr, Ra সবাই গ্রুপ 2 এর মৌল। গ্রুপে উপর থেকে নিচে শক্তিস্তর বাড়ে, আকার বাড়ে, ফলে ইলেকট্রন আসক্তি কমে। ক্রম: Be \u003e Mg \u003e Sr \u003e Ra; সবচেয়ে নিচে থাকা Ra এর ইলেকট্রন আসক্তি সবচেয়ে কম।"},{"id":"ch4-mcq29","chapter":4,"num":29,"importance":3,"topic":"মৌলের পর্যায়বৃত্ত ধর্ম","question":"নিচের কোন মৌলের আয়নিকরণ শক্তি সবচেয়ে কম?","boards":"ঢাকা বোর্ড ২০২৬","options":["Na","Mg","F","Ar"],"answerIndex":0,"explanation":"একই পর্যায়ে বাম থেকে ডানে আয়নিকরণ শক্তি বাড়ে । Na তৃতীয় পর্যায়ের সবচেয়ে বামের মৌল, তাই এর আয়নিকরণ শক্তি সবচেয়ে কম।"},{"id":"ch4-mcq30","chapter":4,"num":30,"importance":2,"topic":"মৌলের পর্যায়বৃত্ত ধর্ম","question":"নিচের কোন মৌলটির আয়নিকরণ শক্তি সবচেয়ে বেশি?","boards":"সিলেট বোর্ড ২০২৫","options":["B","Al","O","Sc"],"answerIndex":2,"explanation":"পর্যায়ে বাম থেকে ডানে আয়নিকরণ শক্তি বাড়ে এবং গ্রুপে উপর থেকে নিচে কমে। O দ্বিতীয় পর্যায়ের গ্রুপ-16 এর মৌল; B একই পর্যায়ে O এর বামে (গ্রুপ-13)। Al (৩য় পর্যায়) ও Sc (৪র্থ পর্যায়) আরও নিচের পর্যায়ে, তাই এদের পারমাণবিক আকার বড় এবং আয়নিকরণ শক্তি কম। তাই প্রদত্ত মৌলগুলোর মধ্যে O এর আয়নিকরণ শক্তি সবচেয়ে বেশি।"},{"id":"ch4-mcq31","chapter":4,"num":31,"importance":2,"topic":"মৌলের পর্যায়বৃত্ত ধর্ম","question":"ইলেকট্রন আসক্তির মানের ক্ষেত্রে নিচের কোন ক্রমটি সঠিক?","boards":"রাজশাহী বোর্ড ২০২৫","options":["B \u003e C \u003e Si \u003e P","P \u003e Si \u003e C \u003e B","Si \u003e P \u003e B \u003e C","C \u003e B \u003e P \u003e Si"],"answerIndex":3,"explanation":"পর্যায়ে বাম থেকে ডানে ইলেকট্রন আসক্তি বাড়ে, গ্রুপে উপর থেকে নিচে কমে । একই পর্যায়ে: C \u003e B (২য় পর্যায়) এবং P \u003e Si (৩য় পর্যায়)। একই গ্রুপে: C \u003e Si (গ্রুপ-14), কারণ C উপরে। (ক) এ B \u003e C, (খ) এ Si \u003e C এবং (গ) এ Si \u003e P দেখানো হয়েছে, যা নিয়মের বিপরীত । তাই সঠিক ক্রম C \u003e B \u003e P \u003e Si।"},{"id":"ch4-mcq32","chapter":4,"num":32,"importance":2,"topic":"মৌলের পর্যায়বৃত্ত ধর্ম","stemPrefix":"P = .........(n – 1) s²(n–1)p⁶ns² ; Q = .........(n – 1) s²(n– 1)p⁶ns²np⁵ [এখানে, n = 3; P, Q মৌলের প্রকৃত প্রতীক নয়","question":"P ও Q মৌলদ্বয়ের ক্ষেত্রে প্রযোজ্য —\ni. পারমাণবিক ব্যাসার্ধ – P \u003c Q\nii. আয়নিকরণ শক্তি – P \u003c Q\niii. ইলেকট্রন আসক্তি – P \u003c Q\nনিচের কোনটি সঠিক?","boards":"ময়মনসিংহ বোর্ড ২০২৫","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":2,"explanation":"n = 3 বসালে P = 1s² 2s² 2p⁶ 3s² অর্থাৎ Mg(12) এবং Q = 1s² 2s² 2p⁶ 3s² 3p⁵ অর্থাৎ Cl(17)। উভয়ই ৩য় পর্যায়ে; P (গ্রুপ-2) বামে, Q (গ্রুপ-17) ডানে ।\ni. ডানে আকার কমে, তাই ব্যাসার্ধ P \u003e Q; P \u003c Q বলা ভুল।\nii. ডানে আয়নিকরণ শক্তি বাড়ে, তাই P \u003c Q — সঠিক ।\niii. ডানে ইলেকট্রন আসক্তি বাড়ে, তাই P \u003c Q — সঠিক ।"},{"id":"ch4-mcq33","chapter":4,"num":33,"importance":2,"topic":"মৌলের পর্যায়বৃত্ত ধর্ম","question":"নিচের কোন মৌলটির আকার সবচেয়ে ছোট?","boards":"ঢাকা বোর্ড ২০২৫","options":["Mg","Al","Ca","K"],"answerIndex":1,"explanation":"Mg (গ্রুপ 2) ও Al (গ্রুপ 13) পর্যায় 3 এর; K ও Ca পর্যায় 4 এর মৌল, তাই K ও Ca এর একটি শক্তিস্তর বেশি, আকার বড়। পর্যায় 3 এ Al, Mg এর ডানে থাকায় Al এর আকার Mg এর চেয়ে ছোট। ক্রম: K \u003e Ca \u003e Mg \u003e Al; সবচেয়ে ছোট Al।"},{"id":"ch4-mcq34","chapter":4,"num":34,"importance":2,"topic":"মৌলের পর্যায়বৃত্ত ধর্ম","question":"নিচের কোন মৌলটির আয়নিকরণ শক্তি সবচেয়ে কম?","boards":"ঢাকা বোর্ড ২০২৫","options":["Li","F","Na","Cl"],"answerIndex":2,"explanation":"Li ও Na গ্রুপ 1 এর; Na নিচে থাকায় এর আকার বড়, আয়নিকরণ শক্তি কম। F ও Cl গ্রুপ 17 এর ডানদিকের মৌল, এদের আকার ছোট, আয়নিকরণ শক্তি অনেক বেশি । ক্রম: F \u003e Cl \u003e Li \u003e Na; সবচেয়ে কম Na এর।"},{"id":"ch4-mcq35","chapter":4,"num":35,"importance":2,"topic":"মৌলের পর্যায়বৃত্ত ধর্ম","question":"কোনটির আয়নিকরণ শক্তি বেশি?","boards":"চট্টগ্রাম বোর্ড ২০২৫","options":["Mg","P","Si","Cl"],"answerIndex":3,"explanation":"Mg, Si, P, Cl সবাই পর্যায় 3 এর মৌল। বাম থেকে ডানে আকার কমে, তাই আয়নিকরণ শক্তি বাড়ে । ক্রম: Mg \u003c Si \u003c P \u003c Cl; সবচেয়ে ডানে থাকা Cl এর আয়নিকরণ শক্তি সবচেয়ে বেশি।"},{"id":"ch4-mcq36","chapter":4,"num":36,"importance":3,"topic":"বিভিন্ন গ্রুপে উপস্থিত মৌলগুলোর বিশেষ নাম","question":"অবস্থান্তর মৌল কোনটি?","boards":"বরিশাল বোর্ড ২০২৫; কুমিল্লা বোর্ড ২০২১","options":["Cs","Fe","Ba","Li"],"answerIndex":1,"explanation":"Fe (26): 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁶ 4s² — এর 3d অরবিটাল আংশিক পূর্ণ, তাই Fe অবস্থান্তর মৌল। Cs ও Li গ্রুপ-1 (s-ব্লক) এবং Ba গ্রুপ-2 (s-ব্লক) এর মৌল; এরা d- ব্লক মৌল নয়।"},{"id":"ch4-mcq37","chapter":4,"num":37,"importance":3,"topic":"বিভিন্ন গ্রুপে উপস্থিত মৌলগুলোর বিশেষ নাম","question":"মৃৎক্ষার ধাতু কোনটি?","boards":"সিলেট বোর্ড ২০২৫; যশোর বোর্ড ২০২০","options":["Rb","Ag","Sr","Zn"],"answerIndex":2,"explanation":"Sr (স্ট্রনসিয়াম) গ্রুপ-2 এর মৌল, তাই মৃৎক্ষার ধাতু। Rb গ্রুপ-1 এর ক্ষার ধাতু, Ag গ্রুপ-11 এর মুদ্রা ধাতু এবং Zn গ্রুপ-12 এর d-ব্লক মৌল।"},{"id":"ch4-mcq38","chapter":4,"num":38,"importance":3,"topic":"বিভিন্ন গ্রুপে উপস্থিত মৌলগুলোর বিশেষ নাম","question":"কোনটি মৃৎক্ষার ধাতু?","boards":"যশোর বোর্ড ২০২৫, ২০২৪","options":["Ca","Na","Cu","Ag"],"answerIndex":0,"explanation":"Ca গ্রুপ-2 এর মৌল; এর যৌগ মাটিতে পাওয়া যায় এবং Ca(OH)₂ ক্ষার, তাই Ca মৃৎক্ষার ধাতু। Na ক্ষার ধাতু (গ্রুপ-1); Cu ও Ag মুদ্রা ধাতু (গ্রুপ-11)।"},{"id":"ch4-mcq39","chapter":4,"num":39,"importance":3,"topic":"বিভিন্ন গ্রুপে উপস্থিত মৌলগুলোর বিশেষ নাম","question":"কোন মৌলটি হ্যালোজেন গ্রুপের অন্তর্ভুক্ত?","boards":"যশোর বোর্ড ২০২১; ময়মনসিংহ বোর্ড ২০২১","options":["এ্যাস্টাটিন","সিজিয়াম","সিলভার","স্ট্রনসিয়াম"],"answerIndex":0,"explanation":"অ্যাস্টাটিন (At) গ্রুপ-17 এর মৌল, তাই হ্যালোজেন । সিজিয়াম ক্ষার ধাতু, সিলভার মুদ্রা ধাতু এবং স্ট্রনসিয়াম মৃৎক্ষার ধাতু।"},{"id":"ch4-mcq40","chapter":4,"num":40,"importance":3,"topic":"বিভিন্ন গ্রুপে উপস্থিত মৌলগুলোর বিশেষ নাম","question":"মুদ্রা ধাতুর অবস্থান কত নম্বর গ্রুপে?","boards":"ঢাকা বোর্ড ২০২৬","options":["2","8","10","11"],"answerIndex":3,"explanation":"মুদ্রা ধাতু Cu, Ag ও Au পর্যায় সারণির 11 নম্বর গ্রুপে অবস্থিত ।"},{"id":"ch4-mcq41","chapter":4,"num":41,"importance":3,"topic":"বিভিন্ন গ্রুপে উপস্থিত মৌলগুলোর বিশেষ নাম","question":"কোনটি ক্ষার ধাতু?","boards":"চট্টগ্রাম বোর্ড ২০২৬","options":["Ba","Ca","Mg","K"],"answerIndex":3,"explanation":"গ্রুপ-1 এর মৌল (Li, Na, K…) ক্ষার ধাতু; Ba, Ca, Mg গ্রুপ-2 এর মৃৎক্ষার ধাতু।"},{"id":"ch4-mcq42","chapter":4,"num":42,"importance":3,"topic":"বিভিন্ন গ্রুপে উপস্থিত মৌলগুলোর বিশেষ নাম","question":"ফ্লোরিন —\ni. সর্বাধিক তড়িৎ ঋণাত্মক মৌল\nii. ধাতুর সাথে যুক্ত হয়ে লবণ উৎপন্ন করে\niii. দ্বিপরমাণুক অণু গঠন করে;\nনিচের কোনটি সঠিক?","boards":"চট্টগ্রাম বোর্ড ২০২৬","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":3,"explanation":"F সবচেয়ে তড়িৎ ঋণাত্মক মৌল, হ্যালোজেন হিসেবে ধাতুর সাথে লবণ (যেমন NaF) গঠন করে এবং F₂ দ্বিপরমাণুক অণু হিসেবে থাকে।"},{"id":"ch4-mcq43","chapter":4,"num":43,"importance":3,"topic":"বিভিন্ন গ্রুপে উপস্থিত মৌলগুলোর বিশেষ নাম","question":"নিচের কোনটি হ্যালোজেন মৌল?","boards":"সিলেট বোর্ড ২০২৬","options":["Ag","As","Tl","At"],"answerIndex":3,"explanation":"গ্রুপ-17 এর মৌল F, Cl, Br, I, At হ্যালোজেন ।"},{"id":"ch4-mcq44","chapter":4,"num":44,"importance":3,"topic":"বিভিন্ন গ্রুপে উপস্থিত মৌলগুলোর বিশেষ নাম","question":"মুদ্রা ধাতু কয়টি?","boards":"দিনাজপুর বোর্ড ২০২৬","options":["2টি","3টি","4টি","5টি"],"answerIndex":1,"explanation":"কপার (Cu), সিলভার (Ag) ও গোল্ড (Au) — এই 3টি মুদ্রা ধাতু।"},{"id":"ch4-mcq45","chapter":4,"num":45,"importance":3,"topic":"বিভিন্ন গ্রুপে উপস্থিত মৌলগুলোর বিশেষ নাম","question":"অবস্থান্তর মৌলগুলো —\ni. 3 নং গ্রুপ থেকে 12 নং গ্রুপে অবস্থিত\nii. প্রভাবক হিসেবে কাজ করে\niii. রঙিন যৌগ গঠন করে না;\nনিচের কোনটি সঠিক?","boards":"দিনাজপুর বোর্ড ২০২৬","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":0,"explanation":"অবস্থান্তর মৌল গ্রুপ 3–12 এ অবস্থিত ও প্রভাবক হিসেবে কাজ করে; এরা সাধারণত রঙিন যৌগ গঠন করে, তাই iii ভুল।"},{"id":"ch4-mcq46","chapter":4,"num":46,"importance":3,"topic":"বিভিন্ন গ্রুপে উপস্থিত মৌলগুলোর বিশেষ নাম","question":"নিচের কোনটি স্থিতিশীল মৌল?","boards":"যশোর বোর্ড ২০২৬","options":["Kr","Br","Sr","Fr"],"answerIndex":0,"explanation":"Kr নিষ্ক্রিয় গ্যাস; যোজ্যতাস্তর অষ্টক পূর্ণ বলে স্থিতিশীল ।"},{"id":"ch4-mcq47","chapter":4,"num":47,"importance":3,"topic":"বিভিন্ন গ্রুপে উপস্থিত মৌলগুলোর বিশেষ নাম","question":"কোনটি রঙিন যৌগ গঠন করে?","boards":"বরিশাল বোর্ড ২০২৬","options":["Ca","Br","Al","Mn"],"answerIndex":3,"explanation":"Mn অবস্থান্তর মৌল; অবস্থান্তর মৌলগুলো রঙিন যৌগ গঠন করে (যেমন KMnO₄)।"},{"id":"ch4-mcq48","chapter":4,"num":48,"importance":2,"topic":"বিভিন্ন গ্রুপে উপস্থিত মৌলগুলোর বিশেষ নাম","question":"কোনটি মৃৎক্ষার ধাতু?","boards":"কুমিল্লা বোর্ড ২০২৫","options":["বেরিলিয়াম","সোডিয়াম","রুবিডিয়াম","গ্যালিয়াম"],"answerIndex":0,"explanation":"পর্যায় সারণির গ্রুপ-2 এর মৌলগুলোকে মৃৎক্ষার ধাতু বলে: Be, Mg, Ca, Sr, Ba, Ra। বেরিলিয়াম (Be) গ্রুপ-2 এর মৌল, তাই এটি মৃৎক্ষার ধাতু। Na ও Rb গ্রুপ-1 এর ক্ষার ধাতু এবং Ga গ্রুপ-13 এর মৌল।"},{"id":"ch4-mcq49","chapter":4,"num":49,"importance":2,"topic":"বিভিন্ন গ্রুপে উপস্থিত মৌলগুলোর বিশেষ নাম","question":"কোনটি অবস্থান্তর মৌল?","boards":"রাজশাহী বোর্ড ২০২৫","options":["Mn","K","Ca","Al"],"answerIndex":0,"explanation":"যে সকল d-ব্লক মৌলের অথবা তাদের স্থিতিশীল আয়নের d অরবিটাল আংশিক পূর্ণ থাকে, তাদের অবস্থান্তর মৌল বলে। Mn(25): 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁵ 4s²; Mn₂+: ...3d⁵। উভয় ক্ষেত্রে 3d অরবিটাল আংশিক পূর্ণ, তাই Mn অবস্থান্তর মৌল। K ও Ca s-ব্লকের এবং Al p-ব্লকের মৌল।"},{"id":"ch4-mcq50","chapter":4,"num":50,"importance":3,"topic":"পর্যায় সারণির একই গ্রুপের মৌলগুলো একই রকম রাসায়নিক ধর্ম প্রদর্শন করে","question":"সোডিয়ামের সাথে কোন মৌলের ধর্মের মিল বেশি?","boards":"বরিশাল বোর্ড ২০২৬","options":["আয়রন","পটাশিয়াম","অক্সিজেন","সালফার"],"answerIndex":1,"explanation":"Na ও K একই গ্রুপের (গ্রুপ-1) মৌল, তাই এদের রাসায়নিক ধর্ম একই রকম।"},{"id":"ch4-mcq51","chapter":4,"num":51,"importance":2,"topic":"পর্যায় সারণির একই গ্রুপের মৌলগুলো একই রকম রাসায়নিক ধর্ম প্রদর্শন করে","question":"ত্রয়ী সূত্রকে সমর্থন করে —\ni. Li, Na, K\nii. Be, Mg, Ca\niii. C, N, O\nনিচের কোনটি সঠিক?","boards":"দিনাজপুর বোর্ড ২০২৩","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":0,"explanation":"ত্রয়ী সূত্র: তিনটি সদৃশ মৌলের মাঝেরটির পারমাণবিক ভর অপর দুটির গড়ের প্রায় সমান ।\ni. Li, Na, K: (7+39)/2=23=Na এর ভর; সঠিক ।\nii. Be, Mg, Ca: (9+40)/2=24.5 ≈ Mg এর ভর 24; সঠিক ।\niii. C, N, O সদৃশ ধর্মের মৌল নয় (একই পর্যায়ের, একই গ্রুপের নয়); ভুল। তাই উত্তর i ও ii।"},{"id":"ch4-mcq52","chapter":4,"num":52,"importance":2,"topic":"পর্যায় সারণির একই গ্রুপের মৌলগুলো একই রকম রাসায়নিক ধর্ম প্রদর্শন করে","question":"পর্যায় সারণির বাম হতে ডানে—\ni. ধাতব ধর্ম হ্রাস পায়\nii. ইলেকট্রন আসক্তি বাড়ে\niii. পারমাণবিক ব্যাসার্ধ বাড়ে\nনিচের কোনটি সঠিক?","boards":"চট্টগ্রাম বোর্ড ২০২২","options":["i ও ii","ii ও iii","i ও iii","i, ii ও iii"],"answerIndex":0,"explanation":"i. পর্যায়ে বাম থেকে ডানে ইলেকট্রন ত্যাগের প্রবণতা কমে, তাই ধাতব ধর্ম হ্রাস পায় — সঠিক ।\nii. ডানে নিউক্লিয়াসের আকর্ষণ বাড়ে, তাই ইলেকট্রন আসক্তি বাড়ে — সঠিক ।\niii. ডানে নিউক্লিয়াসের আকর্ষণ বাড়ায় পারমাণবিক ব্যাসার্ধ কমে, বাড়ে না — সঠিক নয়। তাই উত্তর ক) i ও ii।"},{"id":"ch4-mcq53","chapter":4,"num":53,"importance":2,"topic":"পর্যায় সারণির একই গ্রুপের মৌলগুলো একই রকম রাসায়নিক ধর্ম প্রদর্শন করে","question":"Ca ও Zn এর ক্ষেত্রে-\ni. যোজনী একই\nii. গ্রুপ একই\niii. পর্যায় একই\nনিচের কোনটি সঠিক?","boards":"ময়মনসিংহ বোর্ড ২০২২","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":1,"explanation":"Ca (20): 2, 8, 8, 2 এবং Zn (30): 2, 8, 18, 2।\ni. উভয়ের যোজনী 2; সঠিক ।\nii. Ca গ্রুপ 2 এর, Zn গ্রুপ 12 এর মৌল; ভুল।\niii. উভয়ের সর্বশেষ শক্তিস্তর 4, তাই উভয়ই ৪র্থ পর্যায়ের; সঠিক ।"},{"id":"ch4-mcq54","chapter":4,"num":54,"importance":2,"topic":"পর্যায় সারণির একই গ্রুপের মৌলগুলো একই রকম রাসায়নিক ধর্ম প্রদর্শন করে","stemPrefix":"29X মৌলটির 1টি পরমাণুর ভর 1.054 × 10⁻²² g [X প্রচলিত কোনো মৌলের প্রতীক নয়","question":"মৌলটির ইলেকট্রন বিন্যাসে সর্বশেষ উপশক্তিস্তরে কতটি ইলেকট্রন থাকে?","boards":"যশোর বোর্ড ২০২২","options":["4","3","2","1"],"answerIndex":3,"explanation":"পারমাণবিক সংখ্যা 29 এর মৌল কপার (Cu)। (ভর পরীক্ষা: 63.5 ÷ 6.022 × 10²³=1.054×10⁻²²g) 3d¹⁰ পূর্ণ অবস্থা বেশি সুস্থিত, তাই 4s থেকে একটি ইলেকট্রন 3d তে যায়: 1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹⁰ 4s¹। সর্বশেষ উপশক্তিস্তর 4s এ ইলেকট্রন 1টি।"},{"id":"ch5-mcq1","chapter":5,"num":1,"importance":3,"topic":"যোজ্যতা ইলেকট্রন","question":"S এর যোজ্যতা ইলেকট্রন কত?","boards":"ঢাকা বোর্ড ২০২৬","options":["2","4","6","8"],"answerIndex":2,"explanation":"S (16): 1s² 2s² 2p⁶ 3s² 3p⁴ → সর্বশেষ স্তরে 2+4=6টি ইলেকট্রন ।"},{"id":"ch5-mcq2","chapter":5,"num":2,"importance":2,"topic":"যোজ্যতা ইলেকট্রন","question":"Xe-এর যোজ্যতা শক্তিস্তরে ইলেকট্রন সংখ্যা কয়টি?","boards":"সিলেট বোর্ড ২০২৩","options":["2","4","6","8"],"answerIndex":3,"explanation":"Xe(54) : 1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹⁰ 4s² 4p⁶ 4d¹⁰ 5s² 5p⁶। যোজ্যতা শক্তিস্তর n = 5; এতে 5s²5p⁶=2+6=8টি ইলেকট্রন । Xe নিষ্ক্রিয় গ্যাস (গ্রুপ 18), তাই যোজ্যতা ইলেকট্রন 8।"},{"id":"ch5-mcq3","chapter":5,"num":3,"importance":2,"topic":"যোজ্যতা ইলেকট্রন","question":"হ্যালোজেন গ্রুপের মৌলগুলোর যোজ্যতা ইলেকট্রন কয়টি?","boards":"রাজশাহী বোর্ড ২০২২","options":["1","7","8","17"],"answerIndex":1,"explanation":"হ্যালোজেন (F, Cl, Br, I) গ্রুপ 17 এর মৌল । যেমন F(9) : 2, 7 এবং Cl(17) : 2, 8, 7 — সর্বশেষ কক্ষপথে 7টি ইলেকট্রন । তাই হ্যালোজেনের যোজ্যতা ইলেকট্রন 7টি।"},{"id":"ch5-mcq4","chapter":5,"num":4,"importance":2,"topic":"যোজ্যতা ইলেকট্রন","question":"Cu এর যোজ্যতা ইলেকট্রন কত?","boards":"যশোর বোর্ড ২০২১","options":["1","2","9","10"],"answerIndex":0,"explanation":"Cu(29) : 1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹⁰ 4s¹ অর্থাৎ 2, 8, 18, 1। সর্বশেষ কক্ষপথ N (n = 4) এ মাত্র 1টি ইলেকট্রন (4s1)। 3d¹⁰ ভেতরের স্তরের, তা যোজ্যতা ইলেকট্রন নয়। তাই Cu এর যোজ্যতা ইলেকট্রন 1।"},{"id":"ch5-mcq5","chapter":5,"num":5,"importance":2,"topic":"যোজ্যতা ইলেকট্রন","stemPrefix":"6X, 17Y, 12Z","question":"Y মৌলের যোজ্যতা ইলেকট্রন কতটি?","boards":"কুমিল্লা বোর্ড ২০২১","options":["1","5","7","17"],"answerIndex":2,"explanation":"17Y : 1s² 2s² 2p⁶ 3s² 3p⁵ অর্থাৎ 2, 8, 7; Y হলো Cl। সর্বশেষ কক্ষপথ M (n = 3) এ 3s² 3p⁵ = 7টি ইলেকট্রন । তাই Y এর যোজ্যতা ইলেকট্রন 7টি।"},{"id":"ch5-mcq6","chapter":5,"num":6,"importance":3,"topic":"যোজনী বা যোজ্যতা","question":"সালফার ডাইঅক্সাইড যৌগে S এর সুপ্ত যোজনী কত?","boards":"চট্টগ্রাম বোর্ড ২০২৪; যশোর বোর্ড ২০২২; ময়মনসিংহ বোর্ড ২০২২; সিলেট বোর্ড ২০২১","options":["0","2","4","6"],"answerIndex":1,"explanation":"সুপ্ত যোজনী = সর্বোচ্চ যোজনী – সক্রিয় যোজনী । SO₂ যৌগে 2টি O (যোজনী 2) যুক্ত, তাই S এর সক্রিয় যোজনী =2×2=4। S এর সর্বোচ্চ যোজনী 6, তাই সুপ্ত যোজনী = 6 – 4 = 2।"},{"id":"ch5-mcq7","chapter":5,"num":7,"importance":3,"topic":"যোজনী বা যোজ্যতা","question":"FeCl₂ যৌগে Fe এর সুপ্ত যোজনী কত?","boards":"সিলেট বোর্ড ২০২৬","options":["1","2","3","4"],"answerIndex":0,"explanation":"FeCl₂ এ Fe এর সক্রিয় যোজনী 2; Fe এর সর্বোচ্চ যোজনী 3। সুপ্ত যোজনী = 3 – 2 = 1"},{"id":"ch5-mcq8","chapter":5,"num":8,"importance":2,"topic":"যোজনী বা যোজ্যতা","question":"নিচের কোন মৌল পরিবর্তনশীল যোজনী প্রদর্শন করে?","boards":"যশোর বোর্ড ২০২৫","options":["O","Fe","Al","Mg"],"answerIndex":1,"explanation":"কোনো মৌলের একাধিক যোজনী থাকলে তাকে পরিবর্তনশীল যোজনী বলে। Fe ক্লোরিনের সাথে FeCl₂ ও FeCl₃ গঠন করে, তাই Fe এর যোজনী 2 ও 3। O (2), Al (3) ও Mg (2) এর যোজনী একটিই ।"},{"id":"ch5-mcq9","chapter":5,"num":9,"importance":2,"topic":"যোজনী বা যোজ্যতা","question":"নিচের কোন মৌলটির যোজনী ইলেকট্রন ও যোজনী একই?","boards":"ঢাকা বোর্ড ২০২৫","options":["Ca","Cl","S","Ar"],"answerIndex":0,"explanation":"Ca (20): 1s² 2s² 2p⁶ 3s² 3p⁶ 4s² → যোজ্যতা ইলেকট্রন\n2; 2টি ইলেকট্রন ত্যাগ করে বলে যোজনীও 2।\nCl: যোজ্যতা ইলেকট্রন 7, যোজনী 1; S: যোজ্যতা ইলেকট্রন 6, যোজনী 2; Ar: যোজ্যতা ইলেকট্রন 8, যোজনী 0। তাই কেবল Ca এর যোজ্যতা ইলেকট্রন ও যোজনী সমান ।"},{"id":"ch5-mcq10","chapter":5,"num":10,"importance":2,"topic":"যোজনী বা যোজ্যতা","question":"N₂O₅ যৌগে N এর সুপ্ত যোজনী কত?","boards":"রাজশাহী বোর্ড ২০২৫","options":["0","2","3","5"],"answerIndex":0,"explanation":"N₂O₅ যৌগে N এর সক্রিয় যোজনী =(5×2)÷2=5। N এর সর্বোচ্চ যোজনী 5, তাই সুপ্ত যোজনী = 5 – 5 = 0।"},{"id":"ch5-mcq11","chapter":5,"num":11,"importance":3,"topic":"যৌগমূলক ও তাদের যোজনী","question":"নিচের কোনটি ধনাত্মক যৌগমূলক?","boards":"ঢাকা বোর্ড ২০২২; বরিশাল বোর্ড ২০২১","options":["ফসফেট","কার্বনেট","ফসফোনিয়াম","নাইট্রেট"],"answerIndex":2,"explanation":"যে যৌগমূলকে ধনাত্মক আধান থাকে তা ধনাত্মক যৌগমূলক । ফসফোনিয়াম PH₄⁺ এর আধান +1, তাই এটি ধনাত্মক যৌগমূলক । ফসফেট PO₄³⁻, কার্বনেট CO₃²⁻ ও নাইট্রেট NO₃⁻ — তিনটিই ঋণাত্মক যৌগমূলক ।"},{"id":"ch5-mcq12","chapter":5,"num":12,"importance":3,"topic":"যৌগমূলক ও তাদের যোজনী","question":"নিচের কোনটি যৌগমূলক?","boards":"বরিশাল বোর্ড ২০২১; কুমিল্লা বোর্ড ২০২০","options":["NO₂⁻","SO₂","SiO₂","P₂O₃"],"answerIndex":0,"explanation":"যৌগমূলক হতে হলে একাধিক মৌলের পরমাণুগুচ্ছে আধান থাকতে হবে। NO₂⁻ (নাইট্রাইট) এর আধান –1, তাই এটি যৌগমূলক । SO₂, SiO₂ ও P₂O₃ আধানহীন নিরপেক্ষ অণু, তাই এরা যৌগমূলক নয়।"},{"id":"ch5-mcq13","chapter":5,"num":13,"importance":3,"topic":"যৌগমূলক ও তাদের যোজনী","question":"কোনটি দ্বিযোজী যৌগমূলক?","boards":"ঢাকা বোর্ড ২০২৬","options":["নাইট্রেট","সালফাইট","হাইড্রোজেন কার্বোনেট","ফসফেট"],"answerIndex":1,"explanation":"সালফাইট (SO₃²⁻) এর যোজনী 2। নাইট্রেট (NO₃⁻) ও হাইড্রোজেন কার্বোনেট (HCO₃⁻) একযোজী, ফসফেট (PO₄³⁻) ত্রিযোজী।"},{"id":"ch5-mcq14","chapter":5,"num":14,"importance":2,"topic":"যৌগমূলক ও তাদের যোজনী","question":"ফসফেট যৌগমূলকের আধান কোনটি?","boards":"রাজশাহী বোর্ড ২০২৫","options":["-2","-3","+2","+3"],"answerIndex":1,"explanation":"ফসফেট যৌগমূলকের সংকেত PO₄³⁻।\nঅর্থাৎ এর আধান –3 (এবং যোজনী 3)।"},{"id":"ch5-mcq15","chapter":5,"num":15,"importance":2,"topic":"যৌগমূলক ও তাদের যোজনী","question":"ফসফেট আয়নের/মূলকের যোজ্যতা কত?","boards":"রাজশাহী বোর্ড ২০২১","options":["4","3","2","1"],"answerIndex":1,"explanation":"যৌগমূলকের আধান সংখ্যাই এর যোজনী।\nফসফেট PO₄³⁻ এর আধান –3, তাই এর যোজনী 3 (যোজনীতে কোনো চিহ্ন থাকে না)।"},{"id":"ch5-mcq16","chapter":5,"num":16,"importance":3,"topic":"যৌগের রাসায়নিক সংকেত","question":"অ্যামোনিয়াম ফসফেটের সংকেত কোনটি?","boards":"সিলেট বোর্ড ২০২৬","options":["(NH₄)₃PO₄","(NH₃)₃PO₄","NH₃PO₄","NH₄(PO₄)₃"],"answerIndex":0,"explanation":"NH₄⁺ একযোজী ও PO₄³⁻ ত্রিযোজী; তাই সংকেত (NH₄)₃PO₄।"},{"id":"ch5-mcq17","chapter":5,"num":17,"importance":3,"topic":"যৌগের রাসায়নিক সংকেত","question":"অ্যামোনিয়াম ফসফেট যৌগে পরমাণু সংখ্যা কয়টি?","boards":"দিনাজপুর বোর্ড ২০২৬","options":["4টি","8টি","16টি","20টি"],"answerIndex":3,"explanation":"(NH₄)₃PO₄→N=3,H=12,P=1,O=4; মোট = 20টি\nপরমাণু ।"},{"id":"ch5-mcq18","chapter":5,"num":18,"importance":3,"topic":"যৌগের রাসায়নিক সংকেত","question":"কোনটি বোরন নাইট্রাইডের সংকেত?","boards":"ময়মনসিংহ বোর্ড ২০২৬","options":["BN₃","B₃N","B₅N₃","BN"],"answerIndex":3,"explanation":"B ও N উভয়ের যোজনী 3, তাই বোরন নাইট্রাইডের সংকেত BN।"},{"id":"ch5-mcq19","chapter":5,"num":19,"importance":3,"topic":"যৌগের রাসায়নিক সংকেত","question":"ব্লু ভিট্রিয়লে কত অণু পানি থাকে?","boards":"ময়মনসিংহ বোর্ড ২০২৬","options":["5","7","10","24"],"answerIndex":0,"explanation":"ব্লু ভিট্রিয়লের সংকেত CuSO₄·5H₂O।"},{"id":"ch5-mcq20","chapter":5,"num":20,"importance":2,"topic":"যৌগের রাসায়নিক সংকেত","question":"ক্যালসিয়াম ফসফেট যৌগের অণুতে কতটি পরমাণু বিদ্যমান?","boards":"যশোর বোর্ড ২০২৫","options":["8","11","13","17"],"answerIndex":2,"explanation":"ক্যালসিয়াম ফসফেটের সংকেত Ca₃(PO₄)₂ (Ca = 2, PO₄ = 3)। Ca = 3, P=1×2=2, O=4×2=8 মোট পরমাণু =3+2+8=13টি।"},{"id":"ch5-mcq21","chapter":5,"num":21,"importance":2,"topic":"যৌগের রাসায়নিক সংকেত","question":"আয়রন (III) নাইট্রেট যৌগে কতটি পরমাণু আছে?","boards":"ময়মনসিংহ বোর্ড ২০২৫","options":["20টি","18টি","15টি","13টি"],"answerIndex":3,"explanation":"আয়রন (III) এর যোজনী 3, নাইট্রেট (NO₃⁻) এর যোজনী 1; সংকেত Fe(NO₃)₃। মোট পরমাণু =1+(1+3)×3=1+12=13 তাই উত্তর 13টি।"},{"id":"ch5-mcq22","chapter":5,"num":22,"importance":2,"topic":"যৌগের রাসায়নিক সংকেত","question":"অ্যালুমিনিয়াম নাইট্রেট এর একটি অণুতে কতটি পরমাণু থাকে?","boards":"যশোর বোর্ড ২০২৪","options":["5","9","13","15"],"answerIndex":2,"explanation":"Al এর যোজনী 3, NO₃ এর যোজনী 1; সংকেত Al(NO₃)₃।\nAl = 1, N = 3, O=3×3=9 → মোট =1+3+9=13\nতাই অণুতে 13টি পরমাণু থাকে।"},{"id":"ch5-mcq23","chapter":5,"num":23,"importance":2,"topic":"যৌগের রাসায়নিক সংকেত","question":"অ্যামোনিয়াম ফসফেট-এর অণুতে কতটি পরমাণু বিদ্যমান?","boards":"ময়মনসিংহ বোর্ড ২০২৪","options":["17","18","19","20"],"answerIndex":3,"explanation":"NH₄ এর যোজনী 1, PO₄ এর যোজনী 3; সংকেত (NH₄)₃PO₄। N = 3, H=4×3=12, P = 1, O = 4 মোট =3+12+1+4=20টি।"},{"id":"ch5-mcq24","chapter":5,"num":24,"importance":3,"topic":"আণবিক সংকেত ও গাঠনিক সংকেত","question":"নিচের কোনটির স্থূল সংকেত ও আণবিক সংকেত অভিন্ন?","boards":"রাজশাহী বোর্ড ২০২৬","options":["গ্লুকোজ","ইথিন","অ্যামোনিয়া","বিউটেন"],"answerIndex":2,"explanation":"NH₃ এর পরমাণুর অনুপাত আর সরল করা যায় না, তাই স্থূল ও আণবিক সংকেত একই। গ্লুকোজ (CH₂O), ইথিন (CH₂), বিউটেন (C₂H₅) এর স্থূল সংকেত ভিন্ন।"},{"id":"ch5-mcq25","chapter":5,"num":25,"importance":3,"topic":"আণবিক সংকেত ও গাঠনিক সংকেত","question":"সালফারের আণবিক সংকেত কোনটি?","boards":"দিনাজপুর বোর্ড ২০২৬","options":["S₈","S₄","S₂","S"],"answerIndex":0,"explanation":"সালফারের অণু আটটি S পরমাণু দিয়ে গঠিত, তাই সংকেত S₈।"},{"id":"ch5-mcq26","chapter":5,"num":26,"importance":3,"topic":"অষ্টক ও দুই-এর নিয়ম","question":"নিচের কোন যৌগে অষ্টক নিয়মের ব্যতিক্রম ঘটেছে?","boards":"সিলেট বোর্ড ২০২৬","options":["BF₃","MgCl₂","NaCl","NaCl₃"],"answerIndex":0,"explanation":"BF₃ যৌগে B এর যোজ্যতাস্তরে মাত্র 6টি ইলেকট্রন থাকে, তাই অষ্টক পূর্ণ হয় না।"},{"id":"ch5-mcq27","chapter":5,"num":27,"importance":3,"topic":"অষ্টক ও দুই-এর নিয়ম","question":"কোনটি একটি ইলেকট্রন গ্রহণ করে অষ্টক পূরণ করবে?","boards":"কুমিল্লা বোর্ড ২০২৬","options":["Q (14)","R (15)","X (16)","Y (17)"],"answerIndex":3,"explanation":"Y (17): 2, 8, 7 → একটি ইলেকট্রন গ্রহণ করলে সর্বশেষ\nস্তরে 8টি ইলেকট্রন হয়।"},{"id":"ch5-mcq28","chapter":5,"num":28,"importance":2,"topic":"অষ্টক ও দুই-এর নিয়ম","question":"কোন যৌগটি গঠনের সময় অষ্টক নিয়ম মেনে চলে?","boards":"রাজশাহী বোর্ড ২০২২","options":["CaF₂","BF₃","PCl₅","BeCl₂"],"answerIndex":0,"explanation":"CaF₂ আয়নিক যৌগ: Ca (2,8,8,2) দুটি ইলেকট্রন ত্যাগ করে Ca₂+ (2,8,8) এবং প্রতিটি F (2,7) একটি করে ইলেকট্রন গ্রহণ করে F- (2,8) হয়— উভয়ের অষ্টক পূর্ণ। BF₃ এ B এর 6টি, PCl₅ এ P এর 10টি, BeCl₂ এ Be এর 4টি ইলেকট্রন — তাই এরা অষ্টক নিয়ম মানে না।"},{"id":"ch5-mcq29","chapter":5,"num":29,"importance":2,"topic":"অষ্টক ও দুই-এর নিয়ম","question":"কোন যৌগের বন্ধন গঠনে অষ্টক নিয়ম অপেক্ষা দুই এর নিয়ম অধিক কার্যকরী?","boards":"বরিশাল বোর্ড ২০২২","options":["PCl₃","AlCl₃","NH₃","NCl₃"],"answerIndex":2,"explanation":"NH₃ অণুতে N এর সর্বশেষ স্তরে 8টি ইলেকট্রন (অষ্টক পূর্ণ), কিন্তু প্রতিটি H এর সর্বশেষ স্তরে মাত্র 2টি ইলেকট্রন — অষ্টক নিয়ম দিয়ে H এর অবস্থা ব্যাখ্যা করা যায় না। দুই-এর নিয়মে N (4 জোড়া) ও H (1 জোড়া) উভয়ই ব্যাখ্যা হয়, তাই NH₃ এর বন্ধন গঠনে দুই-এর নিয়ম অধিক কার্যকরী ।"},{"id":"ch5-mcq30","chapter":5,"num":30,"importance":2,"topic":"অষ্টক ও দুই-এর নিয়ম","question":"CCl₄ এ কেন্দ্রীয় পরমাণুর সর্বশেষ শক্তিস্তরে ইলেকট্রন সংখ্যা কত?","boards":"রাজশাহী বোর্ড ২০২১","options":["4","8","16","32"],"answerIndex":1,"explanation":"CCl₄ এর কেন্দ্রীয় পরমাণু C (2,4)। এর নিজস্ব 4টি ইলেকট্রন এবং চারটি Cl পরমাণুর প্রত্যেকের 1টি করে মোট 4টি ইলেকট্রন শেয়ার হয়। C এর সর্বশেষ স্তরে ইলেকট্রন =4+4=8"},{"id":"ch5-mcq31","chapter":5,"num":31,"importance":2,"topic":"নিষ্ক্রিয় গ্যাস এবং এর স্থিতিশীলতা","question":"কোন নিষ্ক্রিয় গ্যাসের N শেলে 8টি ইলেকট্রন বিদ্যমান?","boards":"দিনাজপুর বোর্ড ২০২৩","options":["Ne","Ar","Kr","Xe"],"answerIndex":2,"explanation":"N শেল হলো চতুর্থ শক্তিস্তর (n = 4)।\nKr(36) : 1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹⁰ 4s² 4p⁶; N শেলে 4s² 4p⁶ = 8টি ইলেকট্রন । Ne ও Ar এর N শেলই নেই; Xe এর N শেলে 4s² 4p⁶ 4d¹⁰ = 18টি ইলেকট্রন ।"},{"id":"ch5-mcq32","chapter":5,"num":32,"importance":2,"topic":"নিষ্ক্রিয় গ্যাস এবং এর স্থিতিশীলতা","question":"যৌগ গঠনের সময় কোন মৌলদ্বয় একই নিষ্ক্রিয় মৌলের ইলেকট্রন বিন্যাস লাভ করে?","boards":"সিলেট বোর্ড ২০২৩","options":["K, F","Ca, S","Mg, Cl","Al, S"],"answerIndex":1,"explanation":"Ca→Ca₂+(18টি ইলেকট্রন) এবং S(16) দুটি ইলেকট্রন\nগ্রহণ করে S₂- (18টি ইলেকট্রন)।\nউভয়ের বিন্যাস 1s² 2s² 2p⁶ 3s² 3p⁶, অর্থাৎ একই নিষ্ক্রিয় মৌল আর্গনের বিন্যাস । অন্য জোড়ায় একটি Ne ও অপরটি Ar এর বিন্যাস পায় (যেমন\nK+→Ar,F-→Ne)।"},{"id":"ch5-mcq33","chapter":5,"num":33,"importance":2,"topic":"নিষ্ক্রিয় গ্যাস এবং এর স্থিতিশীলতা","question":"নিচের কোন যৌগটি গঠন করলে প্রতিটি পরমাণুই আর্গনের বিন্যাস লাভ করে?","boards":"কুমিল্লা বোর্ড ২০২২","options":["CaCl₂","CaO","KF","MgF₂"],"answerIndex":0,"explanation":"Ca(20) দুটি ইলেকট্রন ত্যাগ করে Ca₂+ হয়: মোট 18টি\nইলেকট্রন → 1s² 2s² 2p⁶ 3s² 3p⁶।\nCl(17) একটি ইলেকট্রন গ্রহণ করে Cl- হয়: মোট 18টি ইলেকট্রন →\n1s² 2s² 2p⁶ 3s² 3p⁶।\nদুটিই আর্গনের (18) বিন্যাস। CaO তে O₂-, KF এ F- এবং MgF₂ তে Mg₂+ ও F- নিয়নের বিন্যাস পায়।"},{"id":"ch5-mcq34","chapter":5,"num":34,"importance":3,"topic":"আয়নিক বন্ধন বা তড়িৎযোজী বন্ধন","question":"CaH₂ এর কোন ধরনের বন্ধন বিদ্যমান?","boards":"সিলেট বোর্ড ২০২৪; যশোর বোর্ড ২০২১","options":["আয়নিক","সমযোজী","সন্নিবেশ","ধাতব"],"answerIndex":0,"explanation":"Ca একটি ধাতু, H এখানে অধাতু হিসেবে ইলেকট্রন গ্রহণ করে।\nCa→Ca₂++2e-H₂+2e-→2H-Ca₂+ ও H- আয়নের মধ্যে স্থির বৈদ্যুতিক আকর্ষণে আয়নিক যৌগ CaH₂ গঠিত হয়।"},{"id":"ch5-mcq35","chapter":5,"num":35,"importance":3,"topic":"আয়নিক বন্ধন বা তড়িৎযোজী বন্ধন","question":"বন্ধন গঠনকালে নিচের কোন যৌগে উভয় আয়ন আর্গনের ইলেকট্রন বিন্যাস পায়?","boards":"ঢাকা বোর্ড ২০২৬","options":["KF","KCl","NaBr","CaF₂"],"answerIndex":1,"explanation":"K⁺ (19 – 1 = 18টি ইলেকট্রন) ও Cl⁻(17+1=18টি ইলেকট্রন) — উভয়ই Ar (18) এর বিন্যাস পায়।"},{"id":"ch5-mcq36","chapter":5,"num":36,"importance":2,"topic":"আয়নিক বন্ধন বা তড়িৎযোজী বন্ধন","question":"কোন দুটি মৌল আয়নিক যৌগ গঠন করতে পারে?","boards":"যশোর বোর্ড ২০২৩","options":["C, Cl","H, Si","Ca, O","N, Cl"],"answerIndex":2,"explanation":"আয়নিক যৌগ গঠনে একটি ধাতু ও একটি অধাতু প্রয়োজন ।\nCa ধাতু ও O অধাতু: Ca→Ca₂++2e-,O+2e-→O₂-; ফলে\nআয়নিক যৌগ CaO।\nবাকি জোড়াগুলো (C-Cl, H-Si, N-Cl) সবই অধাতু-অধাতু,
