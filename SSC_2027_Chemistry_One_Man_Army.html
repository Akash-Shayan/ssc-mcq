তাই সমযোজী।"},{"id":"ch5-mcq37","chapter":5,"num":37,"importance":2,"topic":"আয়নিক বন্ধন বা তড়িৎযোজী বন্ধন","question":"MgH₂ কোন ধরনের যৌগ?","boards":"বরিশাল বোর্ড ২০২৩","options":["উদ্বায়ী","আয়নিক","সমযোজী","জৈব"],"answerIndex":1,"explanation":"Mg একটি ধাতু এবং H অধাতু হিসেবে ইলেকট্রন গ্রহণ করে।\nMg→Mg₂++2e-H₂+2e-→2H-Mg₂+ ও H- এর মধ্যে আয়নিক বন্ধন থাকায় MgH₂ একটি আয়নিক যৌগ।"},{"id":"ch5-mcq38","chapter":5,"num":38,"importance":2,"topic":"আয়নিক বন্ধন বা তড়িৎযোজী বন্ধন","question":"নিচের কোন যৌগটি গঠনকালে প্রতিটি পরমাণুই নিয়নের ইলেকট্রন বিন্যাস অর্জন করে?","boards":"যশোর বোর্ড ২০২২","options":["KF","CaS","MgO","NaCl"],"answerIndex":2,"explanation":"MgO তে Mg(12) 2টি ইলেকট্রন ত্যাগ করে Mg₂+ (10টি ইলেকট্রন) এবং O(8) 2টি গ্রহণ করে O₂- (10টি ইলেকট্রন) হয় — দুটিই নিয়নের (1s2 2s² 2p6) বিন্যাস । KF এ K+ পায় আর্গনের বিন্যাস; CaS এ Ca₂+ ও S₂- দুটিই আর্গনের; NaCl এ Cl- পায় আর্গনের বিন্যাস ।"},{"id":"ch5-mcq39","chapter":5,"num":39,"importance":3,"topic":"সমযোজী বন্ধন","question":"কোনটিতে ভ্যানডার ওয়ালস্ আকর্ষণ বল সর্বনিম্ন?","boards":"বরিশাল বোর্ড ২০২৫; দিনাজপুর বোর্ড ২০২২","options":["S₈","I₂","O₂","C₁₀H₈"],"answerIndex":2,"explanation":"S₈, I₂ ও C₁₀H₈ (ন্যাপথালিন) স্বাভাবিক অবস্থায় কঠিন, তাই এদের অণুগুলোর মধ্যে ভ্যান্ডারওয়ালস বল বেশি । O₂ গ্যাসীয় সমযোজী অণু; এতে ভ্যান্ডারওয়ালস বল নেই বললেই চলে। তাই সর্বনিম্ন O₂ তে।"},{"id":"ch5-mcq40","chapter":5,"num":40,"importance":3,"topic":"সমযোজী বন্ধন","question":"কোনটিতে ত্রিবন্ধন বিদ্যমান?","boards":"রাজশাহী বোর্ড ২০২৪; ঢাকা বোর্ড ২০২৩","options":["H₂","O₂","Cl₂","N₂"],"answerIndex":3,"explanation":"গাঠনিক সংকেত: H–H, O=O, Cl–Cl, N≡N।\nN(7) : 2, 5 — অষ্টক পূরণে 3টি ইলেকট্রন দরকার, তাই দুটি N পরমাণু 3 জোড়া ইলেকট্রন শেয়ার করে ত্রিবন্ধন গঠন করে।"},{"id":"ch5-mcq41","chapter":5,"num":41,"importance":3,"topic":"সমযোজী বন্ধন","question":"কোন যৌগে ভ্যান্ডারওয়ালস শক্তি সবচেয়ে কম?","boards":"রাজশাহী বোর্ড ২০২৪; ঢাকা বোর্ড ২০২৩","options":["ইথানল","কর্পূর","ন্যাপথলিন","কার্বন ডাইঅক্সাইড"],"answerIndex":3,"explanation":"ইথানল তরল, কর্পূর ও ন্যাপথলিন কঠিন সমযোজী যৌগ — এদের অণুর মধ্যে ভ্যান্ডারওয়ালস বল তুলনামূলক বেশি। কার্বন ডাইঅক্সাইড (CO₂) গ্যাসীয়, এর অণুগুলোর মধ্যে ভ্যান্ডারওয়ালস বল নেই বললেই চলে। তাই CO₂ তে সবচেয়ে কম।"},{"id":"ch5-mcq42","chapter":5,"num":42,"importance":3,"topic":"সমযোজী বন্ধন","question":"কোনটি সমযোজী যৌগ?","boards":"কুমিল্লা বোর্ড ২০২২; ঢাকা বোর্ড ২০২০","options":["HCl","CaCl₂","Al₂O₃","MgO"],"answerIndex":0,"explanation":"HCl গঠিত হয় দুটি অধাতু (H ও Cl) দিয়ে; এরা এক জোড়া ইলেকট্রন শেয়ার করে H–Cl সমযোজী বন্ধন গঠন করে। CaCl₂, Al₂O₃ ও MgO ধাতু ও অধাতু দিয়ে গঠিত আয়নিক যৌগ। তাই সমযোজী যৌগ HCl।"},{"id":"ch5-mcq43","chapter":5,"num":43,"importance":3,"topic":"সমযোজী বন্ধন","stemPrefix":"1P, 7Q [P ও Q প্রতীকী মৌল","question":"P এবং Q দ্বারা গঠিত যৌগের অণুতে বন্ধনজোড় ইলেকট্রন কতটি?","boards":"ঢাকা বোর্ড ২০২১; চট্টগ্রাম বোর্ড ২০২১","options":["1","2","3","4"],"answerIndex":2,"explanation":"P এর পারমাণবিক সংখ্যা 1, তাই P = H; Q এর পারমাণবিক সংখ্যা 7, তাই Q = N। গঠিত যৌগ NH₃। N এর 3টি ইলেকট্রন তিনটি H এর 1টি করে ইলেকট্রনের সাথে শেয়ার হয়ে 3টি N-H বন্ধন তৈরি করে । তাই NH₃ অণুতে বন্ধনজোড় ইলেকট্রন 3টি (মুক্তজোড় 1টি)।"},{"id":"ch5-mcq44","chapter":5,"num":44,"importance":3,"topic":"সমযোজী বন্ধন","stemPrefix":"1P, 7Q [P ও Q প্রতীকী মৌল","question":"P ও Q দ্বারা গঠিত যৌগ—\ni. দুই এর নিয়ম পালন করে\nii. সমযোজী বন্ধন গঠন করে\niii. নিম্ন গলনাঙ্কবিশিষ্ট\nনিচের কোনটি সঠিক?","boards":"ঢাকা বোর্ড ২০২১; চট্টগ্রাম বোর্ড ২০২১","options":["ii","i ও ii","ii ও iii","i, ii ও iii"],"answerIndex":3,"explanation":"1P = H (হাইড্রোজেন) এবং 7Q = N (নাইট্রোজেন); গঠিত যৌগ NH₃ (অ্যামোনিয়া)।\ni. সঠিক — বন্ধনের পর H হিলিয়ামের মতো 2টি ইলেকট্রন পায়, তাই দুই এর নিয়ম পালন করে।\nii. সঠিক — N ও H ইলেকট্রন শেয়ার করে 3টি সমযোজী বন্ধন গঠন করে।\niii. সঠিক — অণুগুলোর মধ্যে আকর্ষণ বল দুর্বল, তাই NH₃ নিম্ন গলনাঙ্কবিশিষ্ট (সাধারণ তাপমাত্রায় গ্যাস)।"},{"id":"ch5-mcq45","chapter":5,"num":45,"importance":3,"topic":"সমযোজী বন্ধন","question":"N₂ অণুতে কতটি বন্ধন আছে?","boards":"ঢাকা বোর্ড ২০২৬","options":["1","2","3","4"],"answerIndex":2,"explanation":"দুটি N পরমাণু তিন জোড়া ইলেকট্রন শেয়ার করে ত্রি-বন্ধন (N≡N) গঠন করে।"},{"id":"ch5-mcq46","chapter":5,"num":46,"importance":3,"topic":"আয়নিক ও সমযোজী যৌগের বৈশিষ্ট্য","question":"নিচের কোন যৌগটি পানিতে অদ্রবণীয়?","boards":"যশোর বোর্ড ২০২২; ঢাকা বোর্ড ২০২১; চট্টগ্রাম বোর্ড ২০২১","options":["AgCl","NaCl","CaCl₂","KCl"],"answerIndex":0,"explanation":"সাধারণত আয়নিক যৌগ পানিতে দ্রবণীয়; NaCl, CaCl₂, KCl সহজেই পানিতে দ্রবীভূত হয়। কিন্তু সিলভার ক্লোরাইড (AgCl) আয়নিক যৌগ হলেও এর আয়নগুলোর মধ্যকার আকর্ষণ বল পানির অণুর আকর্ষণের চেয়ে বেশি, তাই AgCl পানিতে অদ্রবণীয় ।"},{"id":"ch5-mcq47","chapter":5,"num":47,"importance":3,"topic":"আয়নিক ও সমযোজী যৌগের বৈশিষ্ট্য","question":"কোনটির জলীয় দ্রবণ বিদ্যুৎ অপরিবাহী?","boards":"বরিশাল বোর্ড ২০২৫; দিনাজপুর বোর্ড ২০২০","options":["তুঁতে","চিনি","অ্যামোনিয়া","ভিনেগার"],"answerIndex":1,"explanation":"জলীয় দ্রবণে বিদ্যুৎ পরিবহণের জন্য মুক্ত আয়ন প্রয়োজন । তুঁতে (CuSO₄.5H₂O) দ্রবণে Cu²⁺ ও SO₄²⁻, অ্যামোনিয়া দ্রবণে NH₄⁺ ও OH⁻, ভিনেগারে (CH₃COOH) H⁺ ও CH₃COO⁻ আয়ন থাকে; তাই এরা পরিবাহী । চিনি (C₁₂H₂₂O₁₁) সমযোজী যৌগ, পানিতে আয়ন তৈরি করে না; তাই এর জলীয় দ্রবণ বিদ্যুৎ অপরিবাহী।"},{"id":"ch5-mcq48","chapter":5,"num":48,"importance":3,"topic":"আয়নিক ও সমযোজী যৌগের বৈশিষ্ট্য","question":"পানিতে অদ্রবণীয় যৌগ কোনটি?","boards":"যশোর বোর্ড ২০২১; রাজশাহী বোর্ড ২০২০","options":["NaCl","MgCl₂","AlCl₃","CCl₄"],"answerIndex":3,"explanation":"NaCl, MgCl₂, AlCl₃ পানিতে দ্রবীভূত হয়ে আয়ন তৈরি করে। CCl₄ অপোলার সমযোজী যৌগ; এতে ধনাত্মক-ঋণাত্মক প্রান্ত নেই, তাই পোলার দ্রাবক পানির অণুর সাথে আকর্ষণ হয় না। ফলে CCl₄ পানিতে অদ্রবণীয় ।"},{"id":"ch5-mcq49","chapter":5,"num":49,"importance":3,"topic":"আয়নিক ও সমযোজী যৌগের বৈশিষ্ট্য","question":"নিচের কোন যৌগটি পানিতে অদ্রবণীয়?","boards":"ঢাকা বোর্ড ২০২৬","options":["NaCl","MgCl₂","CaCl₂","AgCl"],"answerIndex":3,"explanation":"AgCl আয়নিক যৌগ হলেও পানিতে অদ্রবণীয় (সাদা অধঃক্ষেপ)।"},{"id":"ch5-mcq50","chapter":5,"num":50,"importance":3,"topic":"আয়নিক ও সমযোজী যৌগের বৈশিষ্ট্য","question":"কোনটিতে ভ্যান্ডারওয়ালস আকর্ষণ বল নেই বললেই চলে?","boards":"চট্টগ্রাম বোর্ড ২০২৬","options":["H₂O","CO₂","CH₃OH","C₁₀H₈"],"answerIndex":1,"explanation":"CO₂ সাধারণ তাপমাত্রায় গ্যাস; এর অণুগুলোর মধ্যে আকর্ষণ বল নেই বললেই চলে।"},{"id":"ch5-mcq51","chapter":5,"num":51,"importance":3,"topic":"আয়নিক ও সমযোজী যৌগের বৈশিষ্ট্য","question":"HCl—\ni. জলীয় দ্রবণে বিদ্যুৎ পরিবাহী\nii. সমযোজী যৌগ\niii. নিম্ন গলনাঙ্ক বিশিষ্ট;\nনিচের কোনটি সঠিক?","boards":"চট্টগ্রাম বোর্ড ২০২৬","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":3,"explanation":"HCl সমযোজী যৌগ, তাই গলনাঙ্ক কম; কিন্তু পানিতে H⁺ ও Cl⁻ আয়নে বিয়োজিত হয় বলে জলীয় দ্রবণ বিদ্যুৎ পরিবহন করে।"},{"id":"ch5-mcq52","chapter":5,"num":52,"importance":3,"topic":"আয়নিক ও সমযোজী যৌগের বৈশিষ্ট্য","question":"নিচের কোনটি পানিতে অদ্রবণীয়?","boards":"যশোর বোর্ড ২০২৬","options":["AgNO₃","AgCl","Na₂SO₄","CH₃COOH"],"answerIndex":1,"explanation":"AgCl পানিতে অদ্রবণীয়; বাকিগুলো পানিতে দ্রবণীয় ।"},{"id":"ch5-mcq53","chapter":5,"num":53,"importance":3,"topic":"আয়নিক ও সমযোজী যৌগের বৈশিষ্ট্য","question":"কোনটির গলনাঙ্ক বেশি?","boards":"ময়মনসিংহ বোর্ড ২০২৬","options":["PCl₃","NH₃","CaCl₂","SO₂"],"answerIndex":2,"explanation":"CaCl₂ আয়নিক যৌগ; আয়নগুলোর মধ্যে তীব্র আকর্ষণ থাকায় গলনাঙ্ক অনেক বেশি ।"},{"id":"ch5-mcq54","chapter":5,"num":54,"importance":2,"topic":"আয়নিক ও সমযোজী যৌগের বৈশিষ্ট্য","question":"নিচের কোন যৌগটি পানিতে অদ্রবণীয়?","boards":"ঢাকা বোর্ড ২০২৫","options":["NaOH","Ca(OH)₂","Al(OH)₃","KOH"],"answerIndex":2,"explanation":"NaOH ও KOH পানিতে অত্যন্ত দ্রবণীয়, Ca(OH)₂ অল্প পরিমাণে দ্রবণীয় (চুনের পানি)। Al(OH)₃ পানিতে দ্রবীভূত হয় না; এটি আয়নিক যৌগের দ্রাব্যতার ব্যতিক্রম (AgCl, AgI, BaSO₄ এর মতো)।"},{"id":"ch5-mcq55","chapter":5,"num":55,"importance":2,"topic":"ধাতব বন্ধন","stemPrefix":"Cu + H₂SO₄ (গাঢ়) → A (লবণ) + B(g) + H₂O","question":"A লবণের ধাতব আয়নের সর্বশেষ কক্ষপথে কতটি ইলেকট্রন আছে?","boards":"দিনাজপুর বোর্ড ২০২৫","options":["16","17","18","19"],"answerIndex":1,"explanation":"A = CuSO₄, ধাতব আয়ন Cu²⁺।\nCu + 2H₂SO₄ (গাঢ়) → CuSO₄+SO₂+2H₂O\nCu (29): 1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹⁰ 4s¹; Cu²⁺ (27টি ইলেকট্রন): 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁹। সর্বশেষ (তৃতীয়) কক্ষপথে ইলেকট্রন =3s²+3p⁶+3d⁹=2+ 6+9=17টি।"},{"id":"ch5-mcq56","chapter":5,"num":56,"importance":2,"topic":"ধাতব বন্ধন","stemPrefix":"Cu + H₂SO₄ (গাঢ়) → A (লবণ) + B(g) + H₂O","question":"B যৌগটিতে —\ni. মুক্তজোড় ইলেকট্রন সংখ্যা 3টি\nii. বন্ধন জোড় ইলেকট্রন সংখ্যা 4টি\niii. দ্বিতীয় মৌলটি অধিক তড়িৎ ঋণাত্মক নিচের কোনটি সঠিক?","boards":"দিনাজপুর বোর্ড ২০২৫","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":2,"explanation":"B = SO₂ (O=S=O)।\n• i. ভুল — S এ 1টি এবং দুটি O এর প্রতিটিতে 2টি করে মুক্তজোড়, মোট 5টি মুক্তজোড় ইলেকট্রন ।\n• ii. সঠিক — দুটি দ্বিবন্ধনে মোট 4টি বন্ধন জোড় ইলেকট্রন ।\n• iii. সঠিক — দ্বিতীয় মৌল O এর তড়িৎ ঋণাত্মকতা S এর চেয়ে বেশি।"},{"id":"ch5-mcq57","chapter":5,"num":57,"importance":2,"topic":"ধাতব বন্ধন","question":"যৌগের বন্ধন গঠনের ক্ষেত্রে কেন্দ্রীয় পরমাণু অষ্টক এর নিয়ম মেনে চলে–\ni. CCl₄\nii. BCl₃\niii. H₂S\nনিচের কোনটি সঠিক?","boards":"ঢাকা বোর্ড ২০২৪","options":["i ও ii","ii ও iii","i ও iii","i, ii ও iii"],"answerIndex":2,"explanation":"• i. সঠিক — CCl₄ এ C চারটি Cl এর সাথে 4 জোড়া ইলেকট্রন শেয়ার করে, C এর চারপাশে 8টি ইলেকট্রন ।\n• ii. ভুল — BCl₃ এ B এর চারপাশে মাত্র 6টি ইলেকট্রন, অষ্টক অপূর্ণ ।\n• iii. সঠিক — H₂S এ S এর 2টি বন্ধন জোড় ও 2টি মুক্তজোড় মিলে 8টি ইলেকট্রন ।"},{"id":"ch5-mcq58","chapter":5,"num":58,"importance":2,"topic":"ধাতব বন্ধন","question":"ক্যালসিয়াম ধাতুর –\ni. ইলেকট্রন বিন্যাস 1s² 2s² 2p⁶ 3s² 3p⁶ 3d²\nii. যোজ্যতা ইলেকট্রন 2\niii. যোজনী 2\nনিচের কোনটি সঠিক?","boards":"সিলেট বোর্ড ২০২৪","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":2,"explanation":"• i. ভুল — Ca (20): 1s² 2s² 2p⁶ 3s² 3p⁶ 4s²; 3d এর আগে 4s পূর্ণ হয়।\n• ii. সঠিক — সর্বশেষ স্তরে (4s) 2টি ইলেকট্রন, তাই যোজ্যতা ইলেকট্রন 2।\n• iii. সঠিক — Ca দুটি ইলেকট্রন ত্যাগ করে Ca²⁺ হয়, যোজনী 2 (যেমন CaO, CaCl₂)।"},{"id":"ch6-mcq1","chapter":6,"num":1,"importance":3,"topic":"মোল","question":"100 mL দ্রবণে 5g NaOH দ্রবীভূত থাকলে দ্রবণের ঘনমাত্রা কত?","boards":"বরিশাল বোর্ড ২০২৫; চট্টগ্রাম বোর্ড ২০২৩","options":["0.05 M","0.125 M","1.25 M","1.28 M"],"answerIndex":2,"explanation":"NaOH এর আণবিক ভর =23+16+1=40।\nS=1000w/VM=(1000×5)/(100×40)=1.25M।\nঅর্থাৎ 5 g NaOH = 0.125 মোল, যা 0.1 L দ্রবণে আছে; তাই ঘনমাত্রা 1.25 M।"},{"id":"ch6-mcq2","chapter":6,"num":2,"importance":3,"topic":"মোল","question":"22 g CO₂ তে অণুর সংখ্যা কতটি?","boards":"ঢাকা বোর্ড ২০২৬","options":["6.023 × 10²³","6.02 × 10⁻²³","3.01 × 10²³","1.2 × 10²²"],"answerIndex":2,"explanation":"CO₂ এর মোল সংখ্যা =22/44=0.5mol অণুর সংখ্যা =0.5×6.02×10²³=3.01×10²³"},{"id":"ch6-mcq3","chapter":6,"num":3,"importance":3,"topic":"মোল","question":"10 g CaCO₃ এ কত মোল?","boards":"ঢাকা বোর্ড ২০২৬","options":["10","1","0.1","0.01"],"answerIndex":2,"explanation":"CaCO₃ এর আণবিক ভর =40+12+48=100 মোল সংখ্যা =10/100=0.1mol"},{"id":"ch6-mcq4","chapter":6,"num":4,"importance":3,"topic":"মোল","question":"প্রমাণ অবস্থায় 8 L অ্যামোনিয়া গ্যাসের ভর কত?","boards":"রাজশাহী বোর্ড ২০২৬","options":["5.08 g","6.07 g","9.6 g","12.72 g"],"answerIndex":1,"explanation":"প্রমাণ অবস্থায় 22.4 L NH₃ এর ভর 17 g 8 L NH₃ এর ভর =(17×8)/22.4=6.07g"},{"id":"ch6-mcq5","chapter":6,"num":5,"importance":3,"topic":"মোল","question":"প্রমাণ অবস্থায় 20 g সালফার ডাইঅক্সাইড গ্যাসের আয়তন কত?","boards":"সিলেট বোর্ড ২০২৬","options":["2.24 লিটার","5.6 লিটার","7.0 লিটার","71.68 লিটার"],"answerIndex":2,"explanation":"SO₂ এর আণবিক ভর 64 আয়তন =(22.4×20)/64=7.0L"},{"id":"ch6-mcq6","chapter":6,"num":6,"importance":3,"topic":"মোল","question":"1 mol পানিতে কত মোল হাইড্রোজেন পরমাণু আছে?","boards":"যশোর বোর্ড ২০২৬","options":["0.5","0.75","1","2"],"answerIndex":3,"explanation":"প্রতিটি H₂O অণুতে 2টি H পরমাণু, তাই 1 mol H₂O তে 2 mol H পরমাণু ।"},{"id":"ch6-mcq7","chapter":6,"num":7,"importance":3,"topic":"মোল","question":"মিথেন +2O₂→Y+2H₂O+শক্তি; 3 mol Y = কত?","boards":"যশোর বোর্ড ২০২৬","options":["36 গ্রাম","44 গ্রাম","64 গ্রাম","132 গ্রাম"],"answerIndex":3,"explanation":"Y = CO₂, আণবিক ভর 44 3molCO₂=3×44=132g"},{"id":"ch6-mcq8","chapter":6,"num":8,"importance":2,"topic":"মোল","question":"দ্রবণে দ্রবের অণুর সংখ্যা কত?","boards":"রাজশাহী বোর্ড ২০২৫","options":["2.4 × 10²²","3.4 × 10²²","1.5 × 10²³","1.06 × 10²³"],"answerIndex":2,"explanation":"উদ্দীপকের দ্রবণটি 500 mL, 0.5 M K₂CO₃ দ্রবণ । দ্রবের মোল সংখ্যা n=SV/1000=(0.5×500)/1000=0.25 মোল অণুর সংখ্যা =0.25×6.023×10²³=1.5×10²³ টি তাই উত্তর গ) 1.5 × 10²³।"},{"id":"ch6-mcq9","chapter":6,"num":9,"importance":2,"topic":"মোল","question":"100g পটাশিয়াম ডাইক্রোমেট সমান কত মোল?","boards":"যশোর বোর্ড ২০২৫","options":["100 M","0.940 M","0.333 M","0.340 M"],"answerIndex":3,"explanation":"পটাশিয়াম ডাইক্রোমেট K₂Cr₂O₇ এর আণবিক ভর =39×2+52×2+16×7=294। n=w/M=100/294=0.340 মোল।"},{"id":"ch6-mcq10","chapter":6,"num":10,"importance":2,"topic":"মোল","question":"প্রমাণ অবস্থায় 5 mole CO₂ গ্যাসের আয়তন কত?","boards":"কুমিল্লা বোর্ড ২০২৫","options":["0.22 Litre","2.55 Litre","4.48 Litre","112 Litre"],"answerIndex":3,"explanation":"প্রমাণ অবস্থায় 1 মোল যেকোনো গ্যাসের আয়তন 22.4 লিটার। V=n×22.4=5×22.4=112 লিটার।"},{"id":"ch6-mcq11","chapter":6,"num":11,"importance":2,"topic":"মোল","question":"0.5 লিটার দ্রবণে 20g NaOH দ্রবীভূত থাকলে ঐ দ্রবণের ঘনমাত্রা কত?","boards":"চট্টগ্রাম বোর্ড ২০২৫","options":["0.1 M","0.5 M","1.0 M","2.0 M"],"answerIndex":2,"explanation":"NaOH এর আণবিক ভর 40; V = 0.5 L = 500 mL। S=1000w/VM=(1000×20)/(500×40)=1.0M। অর্থাৎ 20 g NaOH = 0.5 মোল, 0.5 L এ আছে; তাই 1 M।"},{"id":"ch6-mcq12","chapter":6,"num":12,"importance":2,"topic":"মোল","question":"0.75 মোলার Na₂CO₃ দ্রবণের মধ্যে 10g Na₂CO₃ দ্রবীভূত থাকলে ঐ দ্রবণের আয়তন কত?","boards":"ঢাকা বোর্ড ২০২৫","options":["250 mL","200 mL","125.78 mL","100.78 mL"],"answerIndex":2,"explanation":"Na₂CO₃ এর আণবিক ভর =23×2+12+16×3=106।\nV=1000w/SM=(1000×10)/(0.75×106)=10000/79.5=125.78mL।"},{"id":"ch6-mcq13","chapter":6,"num":13,"importance":2,"topic":"মোল","question":"1 মোল পানির অণুতে হাইড্রোজেন পরমাণুর সংখ্যা কতটি?","boards":"বরিশাল বোর্ড ২০২৪","options":["2টি","18টি","6.023 × 10²³টি","1.2046 × 10²⁴টি"],"answerIndex":3,"explanation":"1 মোল H₂O তে অণুর সংখ্যা 6.023 × 10²³ টি, আর প্রতিটি H₂O অণুতে H পরমাণু 2টি। H পরমাণুর সংখ্যা =2×6.023×10²³=1.2046×10²⁴ টি তাই উত্তর ঘ) 1.2046 × 10²⁴টি।"},{"id":"ch6-mcq14","chapter":6,"num":14,"importance":2,"topic":"মোল","question":"27gm পানিতে কত মোল পানি বিদ্যমান?","boards":"ঢাকা বোর্ড ২০২৪","options":["0.5","1","1.5","2"],"answerIndex":2,"explanation":"H₂O এর আণবিক ভর =1×2+16=18।\nমোল সংখ্যা = ভর/আণবিক ভর =27/18=1.5 মোল তাই উত্তর গ) 1.5।"},{"id":"ch6-mcq15","chapter":6,"num":15,"importance":2,"topic":"মোল","question":"750 mL 0.1 M সোডিয়াম কার্বোনেট দ্রবণে কত গ্রাম দ্রব রয়েছে?","boards":"যশোর বোর্ড ২০২৪","options":["3","6.30","7.25","7.95"],"answerIndex":3,"explanation":"সোডিয়াম কার্বোনেট Na₂CO₃ এর আণবিক ভর M=23×2+12+16×3=106। w=SVM/1000=(0.1×750×106)/1000=7.95g তাই উত্তর ঘ) 7.95।"},{"id":"ch6-mcq16","chapter":6,"num":16,"importance":2,"topic":"মোল","question":"100 mL ডেসিমোলার কস্টিক সোডার দ্রবণ প্রস্তুত করতে কী পরিমাণ দ্রব প্রয়োজন?","boards":"বরিশাল বোর্ড ২০২৪","options":["0.4","0.2","2","4"],"answerIndex":0,"explanation":"কস্টিক সোডা = NaOH, আণবিক ভর M=23+16+ 1=40 ; ডেসিমোলার অর্থ 0.1 M। w=SVM/1000=(0.1×100×40)/1000=0.4g তাই উত্তর ক) 0.4।"},{"id":"ch6-mcq17","chapter":6,"num":17,"importance":2,"topic":"মোল","question":"500 mL পানিতে 111 gm CaCl₂ দ্রবীভূত থাকলে দ্রবণের ঘনমাত্রা কত?","boards":"যশোর বোর্ড ২০২৪","options":["0.5 M","1 M","2 M","3 M"],"answerIndex":2,"explanation":"CaCl₂ এর আণবিক ভর =40+35.5×2=111।\nমোলারিটি S=(w×1000)/(M×V)=(111×1000)/(111×500)=2M তাই উত্তর গ) 2 M।"},{"id":"ch6-mcq18","chapter":6,"num":18,"importance":2,"topic":"মোল","stemPrefix":"250 mL পানিতে 4.9 g NaCl দ্রবীভূত আছে।","question":"দ্রবণটির মোলারিটি কত?","boards":"কুমিল্লা বোর্ড ২০২৪","options":["1.78M","0.49 M","0.33 M","0.21 M"],"answerIndex":2,"explanation":"দ্রবণে 250 mL পানিতে 4.9 g NaCl আছে; NaCl এর আণবিক ভর =23+35.5=58.5। S=(w×1000)/(M×V)=(4.9×1000)/(58.5×250)=0.33M তাই উত্তর গ) 0.33 M।"},{"id":"ch6-mcq19","chapter":6,"num":19,"importance":2,"topic":"মোল","stemPrefix":"250 mL পানিতে 4.9 g NaCl দ্রবীভূত আছে।","question":"দ্রবণটিতে আরও কত গ্রাম লবণ যোগ করলে তা-সেমি মোলার দ্রবণে পরিণত হবে?","boards":"কুমিল্লা বোর্ড ২০২৪","options":["2.41","3.43","4.9","7.3"],"answerIndex":0,"explanation":"সেমিমোলার দ্রবণ মানে 0.5 M দ্রবণ । 250 mL 0.5 M NaCl দ্রবণে প্রয়োজনীয় NaCl: w=(S×V×M)/1000=(0.5×250×58.5)/1000=7.31g দ্রবণে আছে 4.9 g, তাই আরও যোগ করতে হবে (7.31−4.9)=2.41g। উত্তর ক) 2.41।"},{"id":"ch6-mcq20","chapter":6,"num":20,"importance":2,"topic":"মোল","question":"12g কার্বনে পরমাণুর সংখ্যা কত?","boards":"দিনাজপুর বোর্ড ২০২৩","options":["6.023 × 10²³","6.023 × 10²²","3.011 × 10²³","3.011 × 10²²"],"answerIndex":0,"explanation":"কার্বনের পারমাণবিক ভর 12, তাই 12 g C = 1 মোল C। 1 মোল পরমাণুতে পরমাণু থাকে 6.023 × 10²³ টি।"},{"id":"ch6-mcq21","chapter":6,"num":21,"importance":3,"topic":"যৌগে মৌলের শতকরা সংযুতি","question":"Al₂(SO₄)₃ এ অক্সিজেনের শতকরা সংযুতি কত?","boards":"কুমিল্লা বোর্ড ২০২৬","options":["56.14%","28.07%","16.67%","9.35%"],"answerIndex":0,"explanation":"Al₂(SO₄)₃ এর আণবিক ভর =54+96+192=342 O এর শতকরা পরিমাণ =(192×100)/342%=56.14%"},{"id":"ch6-mcq22","chapter":6,"num":22,"importance":2,"topic":"যৌগে মৌলের শতকরা সংযুতি","question":"গ্লুকোজের স্থূল সংকেত কোনটি?","boards":"চট্টগ্রাম বোর্ড ২০২৫","options":["CH₂O","CHO₂","C₂HO","CHO"],"answerIndex":0,"explanation":"গ্লুকোজের আণবিক সংকেত C₆H₁₂O₆।\nC : H : O = 6 : 12 : 6 = 1 : 2 : 1, তাই স্থূল সংকেত CH₂O।"},{"id":"ch6-mcq23","chapter":6,"num":23,"importance":2,"topic":"যৌগে মৌলের শতকরা সংযুতি","question":"প্রোপেনে কার্বনের শতকরা সংযুক্তি কত?","boards":"সিলেট বোর্ড ২০২৫","options":["90%","85.71%","81.82%","18.19%"],"answerIndex":2,"explanation":"প্রোপেন C₃H₈; আণবিক ভর =12×3+1×8=44।\nC-এর শতকরা সংযুতি =(12×3×100)/44%=81.82% 18.18% হলো H-এর সংযুতি, C-এর নয়।"},{"id":"ch6-mcq24","chapter":6,"num":24,"importance":2,"topic":"যৌগে মৌলের শতকরা সংযুতি","question":"কোন দুটি যৌগের স্থূল সংকেত একই?","boards":"যশোর বোর্ড ২০২৫","options":["ইথেন ও বেনজিন","ইথেন ও ইথিন","গ্লুকোজ ও এসিটিক এসিড","বেনজিন ও হেক্সেন"],"answerIndex":2,"explanation":"গ্লুকোজ C₆H₁₂O₆→1 : 2 : 1 = CH₂O; এসিটিক এসিড\nCH₃COOH বা C₂H₄O₂→2 : 4 : 2 = 1 : 2 : 1 = CH₂O।\nঅন্যগুলো: ইথেন CH₃, বেনজিন CH, ইথিন CH₂, হেক্সেন (C₆H₁₄) C₃H₇ — মেলে না।"},{"id":"ch6-mcq25","chapter":6,"num":25,"importance":2,"topic":"যৌগে মৌলের শতকরা সংযুতি","question":"6 গ্রাম কার্বন পরমাণু 16 গ্রাম অক্সিজেন পরমাণুর সাথে যুক্ত হয়ে যৌগ গঠন করেছে । যৌগটির স্থূল সংকেত কোনটি?","boards":"ময়মনসিংহ বোর্ড ২০২৫","options":["CO","C₂O","CO₂","CO₃"],"answerIndex":2,"explanation":"C-এর পরমাণু অনুপাত =6/12=0.5 ; O-এর পরমাণু অনুপাত =16/16=1 ক্ষুদ্রতম 0.5 দিয়ে ভাগ করলে C : O = 1 : 2।\n∴ স্থূল সংকেত CO₂।"},{"id":"ch6-mcq26","chapter":6,"num":26,"importance":2,"topic":"যৌগে মৌলের শতকরা সংযুতি","question":"H, C ও O পরমাণুসমূহের অনুপাত 1 : 1 : 2 এবং আণবিক ভর 90 হলে যৌগটির আণবিক সংকেত কোনটি?","boards":"বরিশাল বোর্ড ২০২৪","options":["HCO₂","CH₂O","H₂C₂O₄","C₆H₁₂O₆"],"answerIndex":2,"explanation":"অনুপাত 1 : 1 : 2 থেকে স্থূল সংকেত HCO₂; এর ভর =1+ 12+16×2=45। n=90/45=2\n∴ আণবিক সংকেত (HCO₂)₂=H₂C₂O₄ (অক্সালিক এসিড)।"},{"id":"ch6-mcq27","chapter":6,"num":27,"importance":3,"topic":"যৌগে মৌলের শতকরা সংযুতি","question":"ব্লু ভিট্রিওলে (তুঁতে) কেলাস পানির শতকরা পরিমাণ কত?","boards":"সিলেট বোর্ড ২০২০","options":["34.07%","27.07%","36.07%","47.26%"],"answerIndex":2,"explanation":"ব্লু ভিট্রিয়ল বা তুঁতে = CuSO₄.5H₂O।\nআণবিক ভর =63.5+32+16×4+5×18=249.5 কেলাস পানির শতকরা পরিমাণ =(18×5×100)/249.5%=36.07%"},{"id":"ch6-mcq28","chapter":6,"num":28,"importance":3,"topic":"রাসায়নিক বিক্রিয়া ও রাসায়নিক সমীকরণ","question":"50gm CaCO₃ কে উত্তপ্ত করলে কী পরিমাণ গ্যাস উৎপন্ন হয়?","boards":"বরিশাল বোর্ড ২০২৫; সিলেট বোর্ড ২০২৩","options":["22g","28g","44g","56g"],"answerIndex":0,"explanation":"CaCO₃ উত্তপ্ত করলে CO₂ গ্যাস উৎপন্ন হয়।\nΔ\nCaCO₃⟶CaO+CO₂\n100 g CaCO₃ থেকে 44 g CO₂\n∴ 50 g CaCO₃ থেকে (44×50)/100=22gCO₂"},{"id":"ch6-mcq29","chapter":6,"num":29,"importance":3,"topic":"রাসায়নিক বিক্রিয়া ও রাসায়নিক সমীকরণ","question":"10 মোল অ্যামোনিয়া তৈরিতে কত মোল হাইড্রোজেন গ্যাসের প্রয়োজন হয়?","boards":"বরিশাল বোর্ড ২০২৬","options":["5 মোল","10 মোল","15 মোল","30 মোল"],"answerIndex":2,"explanation":"N₂+3H₂→2NH₃; 2 mol NH₃ এর জন্য 3 mol H₂\n10 mol NH₃ এর জন্য H₂=(3×10)/2=15mol"},{"id":"ch6-mcq30","chapter":6,"num":30,"importance":2,"topic":"রাসায়নিক বিক্রিয়া ও রাসায়নিক সমীকরণ","question":"5g CaCO₃ হতে—\ni. 1.12 L CO₂ পাওয়া যায়\nii. 2.8g CaO উৎপন্ন হয়\niii. 0.5 mole CO₂ পাওয়া যায়\nনিচের কোনটি সঠিক?","boards":"যশোর বোর্ড ২০২৫","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":0,"explanation":"Δ\nCaCO₃⟶CaO+CO₂; 100 g থেকে 56 g CaO ও 1 মোল\n(22.4 L) CO₂\ni. সঠিক — 5 g থেকে (22.4×5)/100=1.12LCO₂।\nii. সঠিক — 5 g থেকে (56×5)/100=2.8gCaO।\niii. ভুল — CO₂ পাওয়া যায় 5/100=0.05 মোল, 0.5 মোল নয়।"},{"id":"ch6-mcq31","chapter":6,"num":31,"importance":2,"topic":"রাসায়নিক বিক্রিয়া ও রাসায়নিক সমীকরণ","question":"24 গ্রাম Mg কত গ্রাম O₂ এর সাথে বিক্রিয়া করবে?","boards":"সিলেট বোর্ড ২০২৪","options":["8 g","12 g","16 g","32 g"],"answerIndex":2,"explanation":"2Mg+O₂→2MgO\n2×24=48gMg বিক্রিয়া করে 32 g O₂ এর সাথে\n∴ 24 g Mg বিক্রিয়া করে (32×24)/48=16gO₂ এর সাথে"},{"id":"ch6-mcq32","chapter":6,"num":32,"importance":2,"topic":"রাসায়নিক বিক্রিয়া ও রাসায়নিক সমীকরণ","question":"10g ক্যালসিয়াম কত গ্রাম অক্সিজেনের সাথে বিক্রিয়া সম্পন্ন করে?","boards":"ঢাকা বোর্ড ২০২৪","options":["32","16","8","4"],"answerIndex":3,"explanation":"2Ca+O₂→2CaO\n2×40=80gCa বিক্রিয়া করে 32 g O₂ এর সাথে\n∴ 10 g Ca বিক্রিয়া করে (32×10)/80=4gO₂ এর সাথে"},{"id":"ch6-mcq33","chapter":6,"num":33,"importance":2,"topic":"রাসায়নিক বিক্রিয়া ও রাসায়নিক সমীকরণ","question":"2 মোল Al₂O₃ কে সম্পূর্ণরূপে প্রশমিত করতে কত মোল HCl প্রয়োজন?","boards":"চট্টগ্রাম বোর্ড ২০২৪","options":["3","6","8","12"],"answerIndex":3,"explanation":"Al₂O₃+6HCl→2AlCl₃+3H₂O\nসমতাকৃত সমীকরণ অনুযায়ী 1 মোল Al₂O₃ কে প্রশমিত করতে 6 মোল HCl লাগে।\n∴ 2 মোল Al₂O₃ এর জন্য 6×2=12 মোল HCl"},{"id":"ch6-mcq34","chapter":6,"num":34,"importance":2,"topic":"রাসায়নিক বিক্রিয়া ও রাসায়নিক সমীকরণ","stemPrefix":"H₂+O₂→H₂O","question":"বিক্রিয়ায় 72g পানি পেতে কত গ্রাম হাইড্রোজেন প্রয়োজন?","boards":"সিলেট বোর্ড ২০২৪","options":["2 g","4 g","8 g","16 g"],"answerIndex":2,"explanation":"2H₂+O₂→2H₂O\n2×2=4gH₂ থেকে 2×18=36gH₂O\n∴ 72 g H₂O পেতে (4×72)/36=8gH₂ প্রয়োজন"},{"id":"ch6-mcq35","chapter":6,"num":35,"importance":2,"topic":"রাসায়নিক বিক্রিয়া ও রাসায়নিক সমীকরণ","question":"5 গ্রাম CaCO₃—\ni. হলো 0.05 মোল CaCO₃\nii. কে উত্তপ্ত করলে CO₂ উৎপন্ন হয় 1.12 L\niii. কে উত্তপ্ত করলে CaO উৎপন্ন হয় 2.8 g\nনিচের কোনটি সঠিক?","boards":"কুমিল্লা বোর্ড ২০২৩","options":["i ও ii","ii ও iii","i ও iii","i, ii ও iii"],"answerIndex":3,"explanation":"CaCO₃ এর আণবিক ভর =40+12+48=100, তাই 5 g CaCO₃ = 5/100 = 0.05 মোল — i সঠিক ।\nΔ\nCaCO₃⟶CaO+CO₂\nii. 1 মোল CaCO₃ থেকে 22.4 L CO₂, তাই 0.05 মোল থেকে 0.05×22.4=1.12LCO₂ — সঠিক ।\niii. CaO এর আণবিক ভর 56, তাই 0.05 মোল CaO=0.05×56=2.8g — সঠিক । তাই উত্তর ঘ) i, ii ও iii।"},{"id":"ch6-mcq36","chapter":6,"num":36,"importance":2,"topic":"রাসায়নিক বিক্রিয়া ও রাসায়নিক সমীকরণ","stemPrefix":"Δ\nCaCO₃(25g)⟶′X′+CO₂","question":"প্রমাণ অবস্থায় উৎপন্ন গ্যাসটির পরিমাণ কত লিটার?","boards":"চট্টগ্রাম বোর্ড ২০২৩","options":["22.4","11.2","5.6","2.8"],"answerIndex":2,"explanation":"Δ\nCaCO₃⟶CaO+CO₂\n100 g (1 মোল) CaCO₃ থেকে প্রমাণ অবস্থায় 22.4 L CO₂ উৎপন্ন হয়। 25 g CaCO₃ থেকে CO₂=(22.4×25)/100=5.6L তাই উত্তর গ) 5.6।"},{"id":"ch6-mcq37","chapter":6,"num":37,"importance":2,"topic":"রাসায়নিক বিক্রিয়া ও রাসায়নিক সমীকরণ","stemPrefix":"Δ\nCaCO₃(25g)⟶′X′+CO₂","question":"উদ্দীপকের বিক্রিয়ায় উৎপন্ন 'X' যৌগে পরমাণুর সংখ্যা কত?","boards":"চট্টগ্রাম বোর্ড ২০২৩","options":["1.50 × 10²³","3.01 × 10²³","4.5 × 10²³","6.02 × 10²³"],"answerIndex":1,"explanation":"Δ\nCaCO₃⟶CaO+CO₂\nX হলো CaO। 100 g CaCO₃ থেকে 56 g CaO, তাই 25 g থেকে 14gCaO=14/56=0.25 মোল। CaO এর অণু =0.25×6.02×10²³=1.505×10²³ টি প্রতিটি CaO তে পরমাণু 2টি (Ca ও O), তাই মোট পরমাণু =2×1.505×10²³=3.01×10²³ টি। উত্তর খ) 3.01 × 10²³।"},{"id":"ch6-mcq38","chapter":6,"num":38,"importance":2,"topic":"রাসায়নিক বিক্রিয়া ও রাসায়নিক সমীকরণ","stemPrefix":"2Mg(s)+O₂(g)→2MgO(s).","question":"5 মোল MgO পেতে হলে কী পরিমাণ Mg লাগবে?","boards":"দিনাজপুর বোর্ড ২০২৩","options":["2 মোল","5/2 মোল","5 মোল","10 মোল"],"answerIndex":2,"explanation":"2Mg(s)+O₂(g)→2MgO(s)\nসমীকরণ অনুযায়ী Mg ও MgO এর মোল অনুপাত 2 : 2 = 1 : 1। তাই 5 মোল MgO পেতে Mg লাগবে 5 মোল। উত্তর গ) 5 মোল।"},{"id":"ch6-mcq39","chapter":6,"num":39,"importance":2,"topic":"লিমিটিং বিক্রিয়ক","question":"Ca + S = CaS বিক্রিয়াটিতে কী পরিমাণ উৎপাদ তৈরি হয়? (10g 10g)","boards":"সিলেট বোর্ড ২০২৩","options":["14","18","20","22.5"],"answerIndex":1,"explanation":"Ca+S→CaS(40g : 32 g : 72 g)\n10 g Ca এর জন্য S লাগে (32×10)/40=8g; দেওয়া 10 g, তাই S উদ্বৃত্ত, Ca লিমিটিং । CaS=(72×10)/40=18g"},{"id":"ch6-mcq40","chapter":6,"num":40,"importance":2,"topic":"লিমিটিং বিক্রিয়ক","stemPrefix":"20g Al₂O₃ এবং 20g HCl এর মধ্যে বিক্রিয়া ঘটানো হলো।","question":"উদ্দীপকের বিক্রিয়ার ক্ষেত্রে—\ni. HCl লিমিটিং বিক্রিয়ক\nii. 9.315 g Al₂O₃ অবশিষ্ট থাকবে\niii. 24.38 g AlCl₃ উৎপন্ন হবে\nনিচের কোনটি সঠিক?","boards":"চট্টগ্রাম বোর্ড ২০২৩","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":1,"explanation":"Al₂O₃+6HCl→2AlCl₃+3H₂O(102g : 219 g : 267 g)\n20 g HCl বিক্রিয়া করে (102 × 20)/219 = 9.315 g Al₂O₃ এর সাথে; Al₂O₃ বেশি আছে, তাই HCl লিমিটিং — i সঠিক । অবশিষ্ট Al₂O₃ = 20 − 9.315 = 10.685 g; 9.315 g হলো বিক্রিয়াকৃত পরিমাণ — ii ভুল। AlCl₃ = (267 × 20)/219 = 24.38 g — iii সঠিক ।"},{"id":"ch6-mcq41","chapter":6,"num":41,"importance":2,"topic":"লিমিটিং বিক্রিয়ক","stemPrefix":"নাইট্রোজেনের অক্সাইডে 21 গ্রাম নাইট্রোজেন ও 36 গ্রাম অক্সিজেন বিদ্যমান। উক্ত ভরের নাইট্রোজেনকে 4 গ্রাম হাইড্রোজেনের সাথে বিক্রিয়া করালে NH₃ উৎপন্ন হয়।","question":"উদ্দীপকের বিক্রিয়ায় কত গ্রাম NH₃ উৎপন্ন হবে?","boards":"বরিশাল বোর্ড ২০২২","options":["12.75 গ্রাম","18 গ্রাম","22.67 গ্রাম","34 গ্রাম"],"answerIndex":2,"explanation":"N₂+3H₂→2NH₃(28g : 6 g : 34 g)\n4 g H₂ এর জন্য N₂ লাগে (28×4)/6=18.67g; দেওয়া 21 g, তাই H₂ লিমিটিং । NH₃=(34×4)/6=22.67g"},{"id":"ch6-mcq42","chapter":6,"num":42,"importance":2,"topic":"লিমিটিং বিক্রিয়ক","stemPrefix":"10gm N₂ গ্যাসকে 3gm H₂ গ্যাসে চালনা করে অ্যামোনিয়া উৎপন্ন করা হলো ।","question":"বিক্রিয়ার পর কোন বিক্রিয়ক কতটুকু অবশিষ্ট থাকবে?","boards":"দিনাজপুর বোর্ড ২০২২","options":["2.143 gm H₂","0.857 gm H₂","4gm N₂","14gm N₂"],"answerIndex":1,"explanation":"N₂+3H₂→2NH₃(28g : 6 g : 34 g)\n10 g N₂ এর জন্য H₂ লাগে (6×10)/28=2.143g; দেওয়া 3 g, তাই N₂ লিমিটিং, H₂ উদ্বৃত্ত । অবশিষ্ট H₂=3−2.143=0.857g"},{"id":"ch6-mcq43","chapter":6,"num":43,"importance":3,"topic":"উৎপাদের শতকরা পরিমাণ হিসাব","question":"আর্দ্র CuSO₄ এর বর্ণ কী?","boards":"চট্টগ্রাম বোর্ড ২০২৫; ঢাকা বোর্ড ২০২৩","options":["নীল","সাদা","সবুজ","লাল"],"answerIndex":0,"explanation":"আর্দ্র কপার সালফেট হলো তুঁতে বা ব্লু ভিট্রিয়ল, CuSO₄.5H₂O। কেলাস পানিযুক্ত অবস্থায় এর বর্ণ নীল; পানি অপসারিত হলে সাদা হয়। তাই সঠিক উত্তর ক।"},{"id":"ch6-mcq44","chapter":6,"num":44,"importance":3,"topic":"উৎপাদের শতকরা পরিমাণ হিসাব","question":"তুঁতের রাসায়নিক সংকেত কোনটি?","boards":"চট্টগ্রাম বোর্ড ২০২২; ঢাকা বোর্ড ২০২০","options":["FeSO₄.7H₂O","ZnSO₄.7H₂O","MgCl₂.7H₂O","CuSO₄.5H₂O"],"answerIndex":3,"explanation":"তুঁতের রাসায়নিক নাম কপার সালফেট পেন্টাহাইড্রেট; এতে 1 অণু CuSO₄ ও 5 অণু কেলাস পানি থাকে । সংকেত: CuSO₄.5H₂O। (FeSO₄.7H₂O হলো হীরাকস, ZnSO₄.7H₂O হলো সাদা ভিট্রিয়ল ।)"},{"id":"ch6-mcq45","chapter":6,"num":45,"importance":2,"topic":"উৎপাদের শতকরা পরিমাণ হিসাব","question":"50g PCl₅ কে তাপ দিয়ে 31g PCl₃ পাওয়া গেল। উৎপাদের শতকরা পরিমাণ কত?","boards":"রাজশাহী বোর্ড ২০২৫","options":["54.94%","90.32%","94.02%","95.72%"],"answerIndex":2,"explanation":"Δ\nPCl₅⟶PCl₃+Cl₂\nPCl₅ = 31 + 5×35.5 = 208.5; PCl₃ = 31 + 3×35.5 = 137.5 50g PCl₅ থেকে তাত্ত্বিক PCl₃ = (137.5 × 50)/208.5 = 32.97g উৎপাদের শতকরা পরিমাণ =(31×100)/32.97=94.02%"},{"id":"ch6-mcq46","chapter":6,"num":46,"importance":2,"topic":"উৎপাদের শতকরা পরিমাণ হিসাব","question":"অ্যানালারে সর্বোচ্চ কত ভাগ ভেজাল থাকে?","boards":"যশোর বোর্ড ২০২৪","options":["1","5","40","99"],"answerIndex":0,"explanation":"অ্যানালার পদার্থ 99% বিশুদ্ধ ।\nসুতরাং এতে সর্বোচ্চ 100-99=1 ভাগ ভেজাল থাকে।"},{"id":"ch6-mcq47","chapter":6,"num":47,"importance":3,"topic":"উৎপাদের শতকরা পরিমাণ হিসাব","question":"পানিশূন্য CuSO₄ এর বর্ণ কোনটি?","boards":"যশোর বোর্ড ২০২৩","options":["নীল","সাদা","সবুজ","বাদামি"],"answerIndex":1,"explanation":"তুঁতে (CuSO₄.5H₂O) কে তাপ দিলে 5 অণু কেলাস পানি উড়ে যায়।\nΔ\nCuSO₄.5H₂O(নীল)⟶CuSO₄(সাদা)+5H₂O\nপানিশূন্য বা অনার্দ্র CuSO₄ এর বর্ণ সাদা । তাই সঠিক উত্তর খ।"},{"id":"ch6-mcq48","chapter":6,"num":48,"importance":2,"topic":"উৎপাদের শতকরা পরিমাণ হিসাব","question":"'CH' স্থূল সংকেতবিশিষ্ট যৌগ —\ni. ইথাইন\nii. বেনজিন\niii. ন্যাপথলিন\nনিচের কোনটি সঠিক?","boards":"সিলেট বোর্ড ২০২৩","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":0,"explanation":"i. ইথাইন C₂H₂→C : H = 2 : 2 = 1 : 1, স্থূল সংকেত CH —\nসঠিক ।\nii. বেনজিন C₆H₆→C : H = 6 : 6 = 1 : 1, স্থূল সংকেত CH —\nসঠিক ।\niii. ন্যাপথলিন C₁₀H₈→C : H = 10 : 8 = 5 : 4, স্থূল সংকেত C₅H₄ — সঠিক নয়।\nতাই উত্তর ক) i ও ii।"},{"id":"ch7-mcq1","chapter":7,"num":1,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"Na₂S₂O₃ যৌগে সালফারের জারণ সংখ্যা কত?","boards":"ঢাকা বোর্ড ২০২৫; কুমিল্লা বোর্ড ২০২২; চট্টগ্রাম বোর্ড ২০২২; সিলেট বোর্ড ২০২২; দিনাজপুর বোর্ড ২০২২","options":["+4","+3","+2","+1"],"answerIndex":2,"explanation":"Na₂S₂O₃ এ Na=+1, O = -2 এবং দুটি S পরমাণু আছে; S এর জারণ সংখ্যা x ধরি। (+1)×2+2x+(-2)×3=0 বা, 2x = 4 ∴ x=+2 তাই সালফারের জারণ সংখ্যা +2।"},{"id":"ch7-mcq2","chapter":7,"num":2,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"HClO₄ এ Cl এর জারণ সংখ্যা কত?","boards":"বরিশাল বোর্ড ২০২৫; যশোর বোর্ড ২০২৩; দিনাজপুর বোর্ড ২০২৩; ময়মনসিংহ বোর্ড ২০২২","options":["+1","+3","+5","+7"],"answerIndex":3,"explanation":"ধরি, HClO₄ এ Cl এর জারণ সংখ্যা x; H=+1, O = -2। (+1)×1+x+(-2)×4=0 বা, x - 7 = 0 ∴ x=+7 তাই সঠিক উত্তর +7।"},{"id":"ch7-mcq3","chapter":7,"num":3,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"Na₂O₂ এ অক্সিজেনের জারণ সংখ্যা কত?","boards":"সিলেট বোর্ড ২০২৩; রাজশাহী বোর্ড ২০২২; ঢাকা বোর্ড ২০২০","options":["-2","-1","-1/2","+1/2"],"answerIndex":1,"explanation":"Na₂O₂ একটি পার-অক্সাইড; পার-অক্সাইডে অক্সিজেনের জারণ সংখ্যা -1। (+1)×2+2x=0 ∴ x = -1"},{"id":"ch7-mcq4","chapter":7,"num":4,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"HNO3(aq)+KOH(aq)→KNO3(aq)+H₂O\nবিক্রিয়াটিতে দর্শক আয়ন কোনগুলো?","boards":"বরিশাল বোর্ড ২০২৫; যশোর বোর্ড ২০২৩","options":["K⁺, NO₃⁻","K⁺, OH⁻","H⁺, NO₃⁻","H⁺, OH⁻"],"answerIndex":0,"explanation":"আয়নিত রূপে লিখলে: H⁺+NO₃⁻+K⁺+OH⁻→\nK⁺+NO₃⁻+H₂O\nপ্রকৃত বিক্রিয়া কেবল H⁺+OH⁻→H₂O। K⁺ ও NO₃⁻\nবিক্রিয়ার আগে ও পরে অপরিবর্তিত থাকে, বিক্রিয়ায় অংশ নেয় না। তাই দর্শক আয়ন K⁺ ও NO₃⁻।"},{"id":"ch7-mcq5","chapter":7,"num":5,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"Sn⁴⁺+Fe²⁺→Sn²⁺+\nFe³⁺বিক্রিয়াটিতে কোনটির বিজারণ ঘটেছে?","boards":"বরিশাল বোর্ড ২০২৫, ২০২৩","options":["Fe²⁺","Fe³⁺","Sn²⁺","Sn⁴⁺"],"answerIndex":3,"explanation":"Sn⁴⁺ 2টি ইলেকট্রন গ্রহণ করে Sn²⁺ এ পরিণত হয়েছে:\nSn⁴⁺+2e⁻→Sn²⁺\nইলেকট্রন গ্রহণ ও জারণ সংখ্যা হ্রাস (+4 থেকে +2) মানেই বিজারণ।\nঅপরদিকে Fe²⁺→Fe³⁺+e⁻ অর্থাৎ Fe²⁺ এর জারণ ঘটেছে ।\nতাই বিজারণ ঘটেছে ঘ) Sn⁴⁺ এর।"},{"id":"ch7-mcq6","chapter":7,"num":6,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"ওলিয়ামে সালফারের জারণ সংখ্যা কত?","boards":"রাজশাহী বোর্ড ২০২৪; ঢাকা বোর্ড ২০২২","options":["6","4","2","8"],"answerIndex":0,"explanation":"ওলিয়ামের সংকেত H₂S₂O₇; H=+1, O = -2, দুটি S এর প্রতিটির জারণ সংখ্যা x। (+1)×2+2x+(-2)×7=0 বা, 2x = 12 ∴ x=+6 তাই সালফারের জারণ সংখ্যা 6 (+6)।"},{"id":"ch7-mcq7","chapter":7,"num":7,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"KMnO₄ যৌগে Mn এর জারণ সংখ্যা কত?","boards":"রাজশাহী বোর্ড ২০২৩; বরিশাল বোর্ড ২০২৩","options":["0","+ 1","+ 3","+ 7"],"answerIndex":3,"explanation":"KMnO₄ এ K=+1, O = -2; Mn এর জারণ সংখ্যা x। (+1)+x+(-2)×4=0 বা, x - 7 = 0 ∴ x=+7"},{"id":"ch7-mcq8","chapter":7,"num":8,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"LiAlH₄ যৌগে হাইড্রোজেনের জারণ মান কত?","boards":"ঢাকা বোর্ড ২০২৩; চট্টগ্রাম বোর্ড ২০২৩","options":["+1","-1","+1/2","-1/2"],"answerIndex":1,"explanation":"LiAlH₄ একটি ধাতব হাইড্রাইড । Li এর জারণ সংখ্যা +1, Al এর +3, H এর জারণ সংখ্যা x হলে, (+1)+(+3)+4x=0 বা, 4x = -4 ∴ x = -1 ধাতব হাইড্রাইডে হাইড্রোজেনের জারণ সংখ্যা -1। উত্তর খ) -1।"},{"id":"ch7-mcq9","chapter":7,"num":9,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"2FeCl₂+Cl₂→2FeCl₃ বিক্রিয়াটি কোন ধরনের?","boards":"রাজশাহী বোর্ড ২০২৬","options":["রেডক্স বিক্রিয়া","বিয়োজন বিক্রিয়া","প্রতিস্থাপন বিক্রিয়া","প্রশমন বিক্রিয়া"],"answerIndex":0,"explanation":"Fe এর জারণ সংখ্যা +2 থেকে +3 (জারণ) এবং Cl এর 0 থেকে -1 (বিজারণ) হয়, তাই এটি রেডক্স বিক্রিয়া ।"},{"id":"ch7-mcq10","chapter":7,"num":10,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"Mg+2HCl→MgCl₂+H₂ বিক্রিয়ায় জারণ ঘটেছে\nকোনটির?","boards":"রাজশাহী বোর্ড ২০২৬","options":["ম্যাগনেসিয়ামের","ক্লোরিনের","হাইড্রোজেনের","ম্যাগনেসিয়াম আয়নের"],"answerIndex":0,"explanation":"Mg ইলেকট্রন ত্যাগ করে Mg²⁺ হয় (জারণ সংখ্যা 0 → +2),\nতাই Mg এর জারণ ঘটেছে ।"},{"id":"ch7-mcq11","chapter":7,"num":11,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"নিচের কোনটি সংযোজন বিক্রিয়া?","boards":"রাজশাহী বোর্ড ২০২৬","options":["প্রতিস্থাপন","সংশ্লেষণ","আর্দ্র-বিশ্লেষণ","জারণ-বিজারণ"],"answerIndex":1,"explanation":"দুই বা ততোধিক পদার্থ যুক্ত হয়ে একটি নতুন যৌগ গঠন করলে তাকে সংশ্লেষণ বা সংযোজন বিক্রিয়া বলে।"},{"id":"ch7-mcq12","chapter":7,"num":12,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"কোনটির জারণ সম্ভব?","boards":"যশোর বোর্ড ২০২৬","options":["Sn⁴⁺","Fe³⁺","Pb⁴⁺","Cu⁺"],"answerIndex":3,"explanation":"Cu⁺ আরও একটি ইলেকট্রন ত্যাগ করে Cu²⁺ এ জারিত হতে পারে; অন্যগুলো সর্বোচ্চ জারণ অবস্থায় আছে।"},{"id":"ch7-mcq13","chapter":7,"num":13,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"মিথেন +2O₂→Y+2H₂O+শক্তি; যৌগ Y—\ni. এর কেন্দ্রীয় পরমাণুর জারণ সংখ্যা +4\nii. গ্লুকোজ অক্সিজেন দ্বারা জারিত হয়ে উৎপন্ন হয়\niii. এর অণুগুলোর মধ্যে ভ্যান্ডারওয়ালস আকর্ষণ বল নেই বললেই চলে;\nনিচের কোনটি সঠিক?","boards":"যশোর বোর্ড ২০২৬","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":3,"explanation":"Y = CO₂; C এর জারণ সংখ্যা +4, শ্বসনে গ্লুকোজ জারিত হয়ে CO₂ উৎপন্ন হয় এবং CO₂ গ্যাস বলে অণুগুলোর মধ্যে আকর্ষণ বল নগণ্য।"},{"id":"ch7-mcq14","chapter":7,"num":14,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"Sn+Cl₂→SnCl₂ বিক্রিয়াটিতে —\ni. Sn জারিত হয়েছে\nii. Cl₂ একটি জারক\niii. Cl₂ জারিত হয়েছে;\nনিচের কোনটি সঠিক?","boards":"কুমিল্লা বোর্ড\n২০২৬","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":0,"explanation":"Sn ইলেকট্রন ত্যাগ করে জারিত হয়; Cl₂ ইলেকট্রন গ্রহণ করে বিজারিত হয়, তাই Cl₂ জারক।"},{"id":"ch7-mcq15","chapter":7,"num":15,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"H₂S+Cl₂→S+2HCl বিক্রিয়াটিতে —\ni. H এর জারণ সংখ্যা অপরিবর্তিত থাকে\nii. Cl₂ বিজারক হিসেবে কাজ করে\niii. H₂S এর জারণ ঘটে;\nনিচের কোনটি সঠিক?","boards":"বরিশাল\nবোর্ড ২০২৬","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":1,"explanation":"S এর জারণ সংখ্যা -2 → 0 (জারণ), Cl এর 0 → -1\n(বিজারণ), H এর +1 অপরিবর্তিত । Cl₂ জারক, বিজারক নয়।"},{"id":"ch7-mcq16","chapter":7,"num":16,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"Ca + ½O₂→CaO বিক্রিয়াটিতে —\ni. Ca ইলেকট্রন ত্যাগ করেছে\nii. Ca জারক হিসেবে কাজ করছে\niii. O₂ বিজারিত হয়েছে;\nনিচের কোনটি সঠিক?","boards":"ময়মনসিংহ বোর্ড\n২০২৬","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":1,"explanation":"Ca ইলেকট্রন ত্যাগ করে জারিত হয় (বিজারক), O₂ ইলেকট্রন গ্রহণ করে বিজারিত হয়।"},{"id":"ch7-mcq17","chapter":7,"num":17,"importance":2,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"সালফিউরিক এসিডে কেন্দ্রীয় মৌলের জারণ মান কত?","boards":"দিনাজপুর বোর্ড ২০২৫","options":["+6","+5","+4","+2"],"answerIndex":0,"explanation":"সালফিউরিক এসিড H₂SO₄ এর কেন্দ্রীয় মৌল S। H এর জারণ সংখ্যা +1, O এর -2। S এর জারণ সংখ্যা x হলে, (+1)×2+x+4×(-2)=0 বা, x - 6 = 0 ∴ x=+6 উত্তর ক) +6।"},{"id":"ch7-mcq18","chapter":7,"num":18,"importance":2,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"K₂Cr₂O₇ এ কেন্দ্রীয় পরমাণুর জারণসংখ্যা কত?","boards":"চট্টগ্রাম বোর্ড ২০২৫","options":["-6","+3","+5","+6"],"answerIndex":3,"explanation":"K₂Cr₂O₇ এর কেন্দ্রীয় পরমাণু Cr; এর জারণ সংখ্যা x ধরি। K=+1, O = -2। (+1)×2+2x+(-2)×7=0, বা 2x = 12, ∴ x=+6 তাই উত্তর ঘ) +6।"},{"id":"ch7-mcq19","chapter":7,"num":19,"importance":2,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"নিচের কোন যৌগে S এর জারণ মান +4?","boards":"রাজশাহী বোর্ড ২০২৫","options":["H₂SO₄","H₂SO₃","CuSO₄","Na₂S₂O₃"],"answerIndex":1,"explanation":"H₂SO₃ এ S এর জারণ সংখ্যা x ধরি: 2×(+1)+x+ 3×(-2)=0, ∴ x=+4। H₂SO₄ ও CuSO₄ এ S এর জারণ সংখ্যা +6 এবং Na₂S₂O₃ এ +2। তাই উত্তর খ) H₂SO₃।"},{"id":"ch7-mcq20","chapter":7,"num":20,"importance":2,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"H₂S+Cl₂→S+2HCl\nবিক্রিয়াটি কোন ধরনের?","boards":"ময়মনসিংহ বোর্ড ২০২৫","options":["রেডক্স বিক্রিয়া","প্রশমন বিক্রিয়া","আর্দ্র বিশ্লেষণ বিক্রিয়া","বিয়োজন বিক্রিয়া"],"answerIndex":0,"explanation":"H₂S এ S এর জারণ সংখ্যা -2 থেকে বেড়ে 0 হয়: S²⁻→S+\n2e⁻ (জারণ)।\nCl₂ এর জারণ সংখ্যা 0 থেকে কমে -1 হয়: Cl₂+2e⁻→2Cl⁻\n(বিজারণ)।\nএকই সাথে জারণ ও বিজারণ ঘটে বলে এটি ক) রেডক্স বিক্রিয়া ।"},{"id":"ch7-mcq21","chapter":7,"num":21,"importance":2,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"Fe2(SO4)3(aq)+6NaOH(aq)→2Fe(OH)₃+\n3Na₂SO₄; এটি কোন ধরনের বিক্রিয়া?","boards":"সিলেট বোর্ড ২০২৫","options":["রেডক্স","প্রতিস্থাপন","অধঃক্ষেপণ","সমাণুকরণ"],"answerIndex":2,"explanation":"দ্রবণীয় Fe₂(SO₄)₃ ও NaOH এর দ্রবণ মেশালে পানিতে অদ্রবণীয় Fe(OH)₃ এর লালচে বাদামি অধঃক্ষেপ পড়ে । এখানে কোনো মৌলের জারণ সংখ্যার পরিবর্তন হয় না (Fe সবসময় +3), তাই রেডক্স নয়। দুটি দ্রবণ মেশানোর ফলে অদ্রবণীয় কঠিন পদার্থ উৎপন্ন হয় বলে এটি গ) অধঃক্ষেপণ বিক্রিয়া ।"},{"id":"ch7-mcq22","chapter":7,"num":22,"importance":2,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","stemPrefix":"Ca+O₂→A","question":"উল্লিখিত বিক্রিয়াটি —\ni. সংযোজন বিক্রিয়া\nii. জারণ-বিজারণ বিক্রিয়া\niii. দহন বিক্রিয়া\nনিচের কোনটি সঠিক?","boards":"ঢাকা বোর্ড ২০২৫","options":["i ও ii","ii ও iii","i ও iii","i, ii ও iii"],"answerIndex":3,"explanation":"Δ\n2Ca+O₂⟶2CaO\ni. দুটি মৌল যুক্ত হয়ে একটিমাত্র যৌগ CaO তৈরি হয় — সংযোজন, সঠিক ।\nii. Ca এর জারণ সংখ্যা 0 → +2 ও O এর 0 → -2 হয় — জারণ-\nবিজারণ, সঠিক ।\niii. Ca অক্সিজেনে পুড়ে তাপ ও আলো উৎপন্ন করে অক্সাইড তৈরি করে — দহন, সঠিক । তাই উত্তর ঘ) i, ii ও iii।"},{"id":"ch7-mcq23","chapter":7,"num":23,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"K₂Cr₂O₇ এ Cr এর জারণ সংখ্যা কত?","boards":"ময়মনসিংহ বোর্ড ২০২৪","options":["+ 6","+ 7","+ 5","+ 4"],"answerIndex":0,"explanation":"K₂Cr₂O₇ এ K=+1, O = -2; দুটি Cr পরমাণু, প্রতিটির জারণ সংখ্যা x। (+1)×2+2x+(-2)×7=0 বা, 2x = 12 ∴ x=+6 তাই Cr এর জারণ সংখ্যা +6।"},{"id":"ch7-mcq24","chapter":7,"num":24,"importance":2,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"নিচের কোনটি জারক পদার্থ?","boards":"সিলেট বোর্ড ২০২৪","options":["O₂","H₂","H₂S","CO"],"answerIndex":0,"explanation":"যে পদার্থ ইলেকট্রন গ্রহণ করে (অন্যকে জারিত করে) তাকে জারক বলে।\nO₂+4e⁻→2O²⁻\nO₂ ইলেকট্রন গ্রহণ করে তাই জারক । H₂, H₂S ও CO ইলেকট্রন ত্যাগ করে, এরা বিজারক । উত্তর ক) O₂।"},{"id":"ch7-mcq25","chapter":7,"num":25,"importance":2,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"কোনটি বিজারক?","boards":"চট্টগ্রাম বোর্ড ২০২৪","options":["Fe³⁺","Cu²⁺","Zn²⁺","Pb²⁺"],"answerIndex":3,"explanation":"যে পদার্থ ইলেকট্রন ত্যাগ করে তাকে বিজারক বলে।\nPb²⁺→Pb⁴⁺+2e⁻\nPb²⁺ দুটি ইলেকট্রন ত্যাগ করে Pb⁴⁺ হতে পারে, তাই এটি বিজারক। Fe³⁺, Cu²⁺ ও Zn²⁺ এদের সাধারণ সর্বোচ্চ জারণ অবস্থায় আছে, এরা আর ইলেকট্রন ত্যাগ করে না। উত্তর ঘ) Pb²⁺।"},{"id":"ch7-mcq26","chapter":7,"num":26,"importance":2,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"পার-অক্সাইড যৌগে অক্সিজেন এর জারণ সংখ্যা কত?","boards":"চট্টগ্রাম বোর্ড ২০২৪","options":["-2","-1","-1/2","0"],"answerIndex":1,"explanation":"পার-অক্সাইড যৌগে (H₂O₂, Na₂O₂, K₂O₂) দুটি O পরমাণু পরস্পর যুক্ত (-O-O-) থাকে। H₂O₂ এ: 2×(+1)+2x=0, ∴ x = -1 তাই পার-অক্সাইডে অক্সিজেনের জারণ সংখ্যা খ) -1।"},{"id":"ch7-mcq27","chapter":7,"num":27,"importance":2,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"NO₃⁻ আয়নে N এর জারণ সংখ্যা কত?","boards":"সিলেট বোর্ড ২০২৪","options":["+5","+6","-5","-6"],"answerIndex":0,"explanation":"NO₃⁻ আয়নে N এর জারণ সংখ্যা x ধরি; আয়নের মোট চার্জ -1। x+(-2)×3=-1, বা x - 6 = -1, ∴ x=+5 তাই উত্তর ক) +5।"},{"id":"ch7-mcq28","chapter":7,"num":28,"importance":2,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"নিচের কোন আয়নটির জারণ ও বিজারণ উভয় সম্ভব?","boards":"ময়মনসিংহ বোর্ড ২০২৪","options":["Na⁺","Cl⁻","Fe²⁺","Fe³⁺"],"answerIndex":2,"explanation":"Fe²⁺ মধ্যবর্তী জারণ অবস্থায় আছে, তাই এটি ইলেকট্রন ত্যাগও করতে পারে, গ্রহণও করতে পারে।\nFe²⁺→Fe³⁺+e⁻ (জারণ)\nFe²⁺+2e⁻→Fe (বিজারণ)\nNa⁺ ও Fe³⁺ শুধু বিজারিত হতে পারে, Cl⁻ শুধু জারিত হতে পারে। উত্তর গ) Fe²⁺।"},{"id":"ch7-mcq29","chapter":7,"num":29,"importance":2,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"কোনটি রেডক্স বিক্রিয়া?","boards":"যশোর বোর্ড ২০২৪","options":["প্রশমন","সমাণুকরণ","পলিমারকরণ","দহন"],"answerIndex":3,"explanation":"দহন বিক্রিয়ায় কোনো পদার্থ অক্সিজেনের সাথে যুক্ত হয়; এতে জারণ সংখ্যার পরিবর্তন তথা ইলেকট্রন স্থানান্তর ঘটে।\nC+O₂→CO₂\nপ্রশমন, সমাণুকরণ ও পলিমারকরণে জারণ সংখ্যার পরিবর্তন হয় না, এগুলো নন-রেডক্স । উত্তর ঘ) দহন।"},{"id":"ch7-mcq30","chapter":7,"num":30,"importance":2,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"Cu₂Cl₂+Cl₂→2CuCl₂; এটি কোন ধরনের বিক্রিয়া?","boards":"ঢাকা বোর্ড ২০২৪","options":["সংযোজন","সংশ্লেষণ","বিয়োজন","নন-রেডক্স"],"answerIndex":0,"explanation":"Cu₂Cl₂ এর সাথে Cl₂ যুক্ত হয়ে একটিমাত্র নতুন যৌগ CuCl₂ উৎপন্ন হয়। দুই বা ততোধিক পদার্থ যুক্ত হয়ে একটি যৌগ তৈরি হলে তাকে সংযোজন বিক্রিয়া বলে। এখানে Cu এর জারণ সংখ্যা +1 থেকে +2 হয় বলে এটি রেডক্সও, নন-রেডক্স নয়। তাই উত্তর ক) সংযোজন ।"},{"id":"ch7-mcq31","chapter":7,"num":31,"importance":2,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"কোনটি নন রেডক্স বিক্রিয়া?","boards":"কুমিল্লা বোর্ড ২০২৪","options":["Zn(s)+H₂SO₄(l)→ZnSO4(aq)+H₂(g)","2FeCl2(aq)+Cl2(g)→2FeCl3(aq)","Mg(s)+2O₂(g)→2MgO(g)","NaCl(aq)+AgNO3(aq)→AgCl(s)+NaNO3(aq)"],"answerIndex":3,"explanation":"NaCl(aq)+AgNO3(aq)→AgCl(s)+NaNO3(aq)\nএখানে Na (+1), Cl (-1), Ag (+1), N (+5), O (-2) — কোনো মৌলের জারণ সংখ্যা বদলায় না; শুধু আয়ন বিনিময়ে AgCl এর সাদা অধঃক্ষেপ পড়ে । বাকি তিনটিতে (Zn, Fe²⁺, Mg) জারণ সংখ্যার পরিবর্তন হয়, তাই সেগুলো রেডক্স। উত্তর ঘ)।"},{"id":"ch7-mcq32","chapter":7,"num":32,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"কোন আয়নটির জারণ সম্ভব?","boards":"দিনাজপুর বোর্ড ২০২৩","options":["Na⁺","K⁺","Cu²⁺","Fe²⁺"],"answerIndex":3,"explanation":"জারণ মানে ইলেকট্রন ত্যাগ করে জারণ সংখ্যা বৃদ্ধি। Na⁺ ও K⁺ এর আর কোনো উচ্চতর জারণ অবস্থা নেই, এরা নিষ্ক্রিয় গ্যাসের মতো সুস্থিত বিন্যাস পেয়েছে । কিন্তু Fe²⁺ আরও একটি ইলেকট্রন ত্যাগ করে Fe³⁺ এ পরিণত হতে\nপারে: Fe²⁺→Fe³⁺+e⁻\nতাই জারণ সম্ভব ঘ) Fe²⁺ আয়নের ।"},{"id":"ch7-mcq33","chapter":7,"num":33,"importance":2,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"CaH₂ যৌগে হাইড্রোজেনের জারণ সংখ্যা কত?","boards":"কুমিল্লা বোর্ড ২০২৩","options":["0","+1","-1","+2"],"answerIndex":2,"explanation":"CaH₂ একটি ধাতব হাইড্রাইড । Ca এর জারণ সংখ্যা +2, H এর জারণ সংখ্যা x হলে, (+2)+2x=0 বা, 2x = -2 ∴ x = -1 উত্তর গ) -1।"},{"id":"ch7-mcq34","chapter":7,"num":34,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"কপার সালফেট (CuSO₄) যৌগে সালফারের জারণ সংখ্যা কত?","boards":"যশোর বোর্ড ২০২২","options":["+2","+4","+6","+8"],"answerIndex":2,"explanation":"CuSO₄ এ Cu এর জারণ সংখ্যা +2, O এর -2। S এর জারণ সংখ্যা x ধরলে, (+2)+x+4×(-2)=0 বা, x - 6 = 0 ∴ x=+6 তাই উত্তর গ) +6।"},{"id":"ch7-mcq35","chapter":7,"num":35,"importance":2,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","stemPrefix":"Al+O₂→Y","question":"বিক্রিয়াটি —\ni. দহন বিক্রিয়া\nii. সংশ্লেষণ বিক্রিয়া\niii. জারণ-বিজারণ বিক্রিয়া\nনিচের কোনটি সঠিক?","boards":"দিনাজপুর বোর্ড ২০২২","options":["i ও ii","ii ও iii","i ও iii","i, ii ও iii"],"answerIndex":3,"explanation":"4Al+3O₂→2Al₂O₃\ni. Al অক্সিজেনের উপস্থিতিতে পুড়ে অক্সাইড তৈরি করে ও তাপ উৎপন্ন করে — দহন বিক্রিয়া, সঠিক ।\nii. দুটি মৌল যুক্ত হয়ে একটি যৌগ তৈরি করে — সংশ্লেষণ বিক্রিয়া, সঠিক ।\niii.Al→Al³⁺+3e⁻ (জারণ) এবং O+2e⁻→O²⁻ (বিজারণ) —\nজারণ-বিজারণ বিক্রিয়া, সঠিক ।\nউত্তর ঘ) i, ii ও iii।"},{"id":"ch7-mcq36","chapter":7,"num":36,"importance":3,"topic":"রাসায়নিক বিক্রিয়ার শ্রেণিবিভাগ","question":"K₂O₂ এ অক্সিজেনের জারণ সংখ্যা কত?","boards":"সিলেট বোর্ড ২০২০","options":["0","-1/2","-1","-2"],"answerIndex":2,"explanation":"K₂O₂ একটি পার-অক্সাইড । K এর জারণ সংখ্যা +1, O এর জারণ সংখ্যা x ধরলে, (+1)×2+2x=0 বা, 2x = -2 ∴ x = -1 পার-অক্সাইডে অক্সিজেনের জারণ সংখ্যা সবসময় -1। উত্তর গ) -1।"},{"id":"ch7-mcq37","chapter":7,"num":37,"importance":3,"topic":"বিশেষ ধরনের রাসায়নিক বিক্রিয়া","question":"কেলাস গঠনে CaCl₂ কতটি পানির অণুর সাথে যুক্ত হয়?","boards":"সিলেট বোর্ড ২০২৫; রাজশাহী বোর্ড ২০২৩; কুমিল্লা বোর্ড ২০২৩; যশোর বোর্ড ২০২০","options":["2","5","6","7"],"answerIndex":2,"explanation":"কেলাস গঠনের সময় ক্যালসিয়াম ক্লোরাইড 6 অণু পানির সাথে যুক্ত হয়:\nCaCl₂+6H₂O→CaCl₂.6H₂O\nএটি হেক্সা হাইড্রেট ক্যালসিয়াম ক্লোরাইড; অর্থাৎ কেলাস পানি 6 অণু।"},{"id":"ch7-mcq38","chapter":7,"num":38,"importance":3,"topic":"বিশেষ ধরনের রাসায়নিক বিক্রিয়া","question":"N₂(g)+3H₂(g)⇌2NH₃(g) — এ ক্ষেত্রে কোনটি\nসঠিক?","boards":"রাজশাহী বোর্ড ২০২৬","options":["তাপ বাড়লে উৎপাদন বাড়ে","চাপ বাড়লে উৎপাদন কমে","চাপ বাড়লে উৎপাদন বাড়ে","সকল তাপ ও চাপে উৎপাদন অপরিবর্তিত থাকে"],"answerIndex":2,"explanation":"বিক্রিয়ক পক্ষে 4 mol ও উৎপাদ পক্ষে 2 mol গ্যাস; চাপ বাড়ালে সাম্যাবস্থা কম অণুর দিকে (ডানে) সরে, ফলে NH₃ উৎপাদন বাড়ে ।"},{"id":"ch7-mcq39","chapter":7,"num":39,"importance":3,"topic":"বিশেষ ধরনের রাসায়নিক বিক্রিয়া","question":"কোনটিতে চাপের প্রভাব বিদ্যমান?","boards":"কুমিল্লা বোর্ড ২০২৬","options":["N₂(g)+O₂(g)⇌2NO(g)","H₂(g)+Cl2(g)⇌2HCl(g)","3NO₂(g)+H₂O(g)⇌2HNO₃(g)+NO(g)","NH₄CNO⇌H₂N-CO-NH₂"],"answerIndex":2,"explanation":"এ বিক্রিয়ায় বিক্রিয়ক পক্ষে 4 mol ও উৎপাদ পক্ষে 3 mol গ্যাস — মোল সংখ্যা অসমান বলে চাপের প্রভাব আছে।"},{"id":"ch7-mcq40","chapter":7,"num":40,"importance":3,"topic":"বিশেষ ধরনের রাসায়নিক বিক্রিয়া","question":"কোনটি সমানুকরণ বিক্রিয়া প্রদর্শন করে?","boards":"ময়মনসিংহ বোর্ড ২০২৬","options":["NH₄NO₃","NH₄CNO","NH₄OH","NH₄Cl"],"answerIndex":1,"explanation":"তাপে অ্যামোনিয়াম সায়ানেট (NH₄CNO) তার সমাণু ইউরিয়ায় (H₂N-CO-NH₂) পরিণত হয়।"},{"id":"ch7-mcq41","chapter":7,"num":41,"importance":3,"topic":"বিশেষ ধরনের রাসায়নিক বিক্রিয়া","question":"কোনটিতে চাপের প্রভাব নেই?","boards":"ময়মনসিংহ বোর্ড ২০২৬","options":["2H₂(g)+O₂(g)⇌2H₂O(g)","H₂(g)+I₂(g)⇌2HI(g)","N₂(g)+3H₂(g)⇌2NH₃(g)","N₂(g)+2O₂(g)⇌2NO₂(g)"],"answerIndex":1,"explanation":"H₂+I₂⇌2HI বিক্রিয়ায় উভয় পক্ষে 2 mol গ্যাস, তাই\nচাপের প্রভাব নেই।"},{"id":"ch7-mcq42","chapter":7,"num":42,"importance":2,"topic":"বিশেষ ধরনের রাসায়নিক বিক্রিয়া","question":"কোনটি একই সাথে পানি বিশ্লেষণ ও অধঃক্ষেপণ বিক্রিয়া?","boards":"দিনাজপুর বোর্ড ২০২৫","options":["SiCl₄+H₂O→Si(OH)₄+HCl","AlCl₃+H₂O→Al(OH)₃+HCl","CaCl₂+6H₂O→CaCl₂.6H₂O","FeSO₄+7H₂O→FeSO₄.7H₂O"],"answerIndex":1,"explanation":"AlCl3(s)+3H₂O(l)→Al(OH)₃(s)+3HCl(aq)\nপানি AlCl₃ এর সাথে বিক্রিয়া করে নতুন উৎপাদ দেয়, তাই এটি আর্দ্র বিশ্লেষণ । উৎপন্ন Al(OH)₃ পানিতে অদ্রবণীয় হওয়ায় অধঃক্ষেপ পড়ে, তাই এটি অধঃক্ষেপণও । SiCl₄ এর বিক্রিয়ায় অধঃক্ষেপের কথা বলা হয়নি; (গ) ও (ঘ) পানিযোজন বিক্রিয়া ।"},{"id":"ch7-mcq43","chapter":7,"num":43,"importance":2,"topic":"বিশেষ ধরনের রাসায়নিক বিক্রিয়া","question":"এক অণু ফেরাস সালফেট কত অণু পানির সাথে যুক্ত হয়?","boards":"সিলেট বোর্ড ২০২৩","options":["2","5","6","7"],"answerIndex":3,"explanation":"ফেরাস সালফেটের কেলাসে 7 অণু পানি যুক্ত থাকে:\nFeSO₄+7H₂O→FeSO₄.7H₂O (হেপ্টা হাইড্রেট ফেরাস\nসালফেট)।"},{"id":"ch7-mcq44","chapter":7,"num":44,"importance":2,"topic":"বিশেষ ধরনের রাসায়নিক বিক্রিয়া","question":"MgCl₂ এর সাথে কত অণু পানি যুক্ত থাকে?","boards":"চট্টগ্রাম বোর্ড ২০২৩","options":["2","5","7","10"],"answerIndex":2,"explanation":"ম্যাগনেসিয়াম ক্লোরাইড 7 অণু পানির সাথে যুক্ত হয়ে কেলাস\nগঠন করে: MgCl₂+7H₂O→MgCl₂.7H₂O (হেপ্টা হাইড্রেট\nম্যাগনেসিয়াম ক্লোরাইড)।"},{"id":"ch7-mcq45","chapter":7,"num":45,"importance":2,"topic":"বাস্তব ক্ষেত্রে সংঘটিত কয়েকটি রাসায়নিক বিক্রিয়ার উদাহরণ","question":"পানিযুক্ত ফেরিক অক্সাইডকে কী বলে?","boards":"দিনাজপুর বোর্ড ২০২৩","options":["প্যারাফিন","মোম","লবণ","মরিচা"],"answerIndex":3,"explanation":"লোহা O₂ ও জলীয় বাষ্পের সাথে বিক্রিয়া করে আর্দ্র বা পানিযুক্ত ফেরিক অক্সাইড (Fe₂O₃.nH₂O) তৈরি করে। একেই মরিচা বলে।"},{"id":"ch7-mcq46","chapter":7,"num":46,"importance":2,"topic":"বাস্তব ক্ষেত্রে সংঘটিত কয়েকটি রাসায়নিক বিক্রিয়ার উদাহরণ","question":"এন্টাসিডে কোনটি বিদ্যমান?","boards":"ময়মনসিংহ বোর্ড ২০২৩","options":["Mg(OH)₂","HCl","Ca(OH)₂","NaOH"],"answerIndex":0,"explanation":"এন্টাসিড হলো Mg(OH)₂ ও Al(OH)₃ এর মিশ্রণ । তাই অপশনের মধ্যে Mg(OH)₂ এন্টাসিডে বিদ্যমান । HCl হলো পাকস্থলীর এসিড যা প্রশমিত করা হয়; NaOH তীব্র ক্ষার বলে ওষুধে ব্যবহৃত হয় না।"},{"id":"ch7-mcq47","chapter":7,"num":47,"importance":2,"topic":"বাস্তব ক্ষেত্রে সংঘটিত কয়েকটি রাসায়নিক বিক্রিয়ার উদাহরণ","question":"কোনটি দ্বারা গ্যালভানাইজিং করা হয়?","boards":"ময়মনসিংহ বোর্ড ২০২৩","options":["Zn","Cr","Ag","Sn"],"answerIndex":0,"explanation":"কোনো ধাতুর উপর জিংক (Zn) এর প্রলেপ দেওয়াকে গ্যালভানাইজিং বলে। টিন (Sn) এর প্রলেপ দেওয়াকে বলে টিন প্লেটিং ।"},{"id":"ch7-mcq48","chapter":7,"num":48,"importance":3,"topic":"বাস্তব ক্ষেত্রে সংঘটিত কয়েকটি রাসায়নিক বিক্রিয়ার উদাহরণ","question":"নিচের কোনটি মরিচার রাসায়নিক সংকেত?","boards":"ঢাকা বোর্ড ২০২২","options":["FeO.3H₂O","Fe₂O₃.H₂O","Fe₂O₃.2H₂O","Fe₂O₃.nH₂O"],"answerIndex":3,"explanation":"মরিচা হলো পানিযুক্ত ফেরিক অক্সাইড । Fe বাতাসের O₂ ও জলীয় বাষ্পের সাথে বিক্রিয়া করে Fe(OH)₃ তৈরি করে, যা থেকে মরিচা হয়। মরিচায় পানির অণুর সংখ্যা নির্দিষ্ট নয়, তাই এর সংকেত Fe₂O₃.nH₂O (n = 1, 2, 3 …) । নির্দিষ্ট সংখ্যার পানি দেওয়া অপশনগুলো সঠিক নয়।"},{"id":"ch7-mcq49","chapter":7,"num":49,"importance":3,"topic":"বিক্রিয়ার গতিবেগ বা বিক্রিয়ার হার","question":"কোনটিতে চাপের প্রভাব বিদ্যমান?\nΔ","boards":"রাজশাহী বোর্ড ২০২৪; ঢাকা বোর্ড ২০২৩; ময়মনসিংহ বোর্ড ২০২০","options":["NH₄CNO⟶H₂N-CO-NH₂","N₂(g)+O₂(g)⇌2NO(g)","3NO₂(g)+H₂O(g)⇌2HNO₃(g)+NO(g)","H₂(g)+Cl2(g)⇌2HCl(g)"],"answerIndex":2,"explanation":"চাপের প্রভাব থাকে যখন গ্যাসীয় বিক্রিয়ক ও উৎপাদের মোল সংখ্যা অসমান । (গ) বিক্রিয়ক মোল 3+1=4, উৎপাদ মোল 2+1=3; Δn ≠ 0, তাই চাপের প্রভাব আছে। (খ) ও (ঘ) তে উভয় পাশে 2 মোল করে, তাই চাপের প্রভাব নেই। (ক) উভমুখী সাম্য বিক্রিয়া নয় এবং গ্যাসীয়ও নয়।"},{"id":"ch7-mcq50","chapter":7,"num":50,"importance":2,"topic":"বিক্রিয়ার গতিবেগ বা বিক্রিয়ার হার","question":"2NO(g)+O₂(g)⇌2NO₂(g); বিক্রিয়াটির ক্ষেত্রে —\ni. জারণ-বিজারণ ঘটে\nii. সাম্যাবস্থার উপর চাপের প্রভাব নাই\niii. বিক্রিয়কের ঘনমাত্রা বৃদ্ধি করলে সাম্যাবস্থা ডানদিকে সরে যাবে\nনিচের কোনটি সঠিক?","boards":"কুমিল্লা বোর্ড ২০২৫","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":1,"explanation":"i. সঠিক — N এর জারণ সংখ্যা +2 (NO) থেকে +4 (NO₂) হয় (জারণ), O এর 0 থেকে -2 হয় (বিজারণ)।\nii. ভুল — গ্যাসীয় মোল বামে 2+1=3, ডানে 2; মোল বদলায় বলে\nচাপের প্রভাব আছে।\niii. সঠিক — বিক্রিয়কের ঘনমাত্রা বাড়ালে তা কমাতে বেশি NO₂ তৈরি হয়, সাম্য ডানে সরে।"},{"id":"ch7-mcq51","chapter":7,"num":51,"importance":2,"topic":"বিক্রিয়ার গতিবেগ বা বিক্রিয়ার হার","question":"N₂(g)+3H₂(g)⇌2NH₃(g)+92kJ বিক্রিয়াটিতে\nতাপ প্রয়োগ করলে কী হবে?","boards":"দিনাজপুর বোর্ড ২০২৪","options":["উৎপাদ হ্রাস পাবে","উৎপাদ বৃদ্ধি পাবে","বিক্রিয়াটি সামনের দিকে অগ্রসর হয়","উৎপন্ন তাপের পরিমাণ বৃদ্ধি পাবে"],"answerIndex":0,"explanation":"বিক্রিয়াটি তাপোৎপাদী (তাপ উৎপাদের দিকে লেখা)। লা- শাতেলিয়ার নীতি অনুসারে তাপ দিলে তাপহারী পশ্চাৎ বিক্রিয়া বাড়ে, সাম্য বামে সরে, NH₃ ভেঙে N₂ ও H₂ হয়। ফলে উৎপাদ হ্রাস পায়।"},{"id":"ch7-mcq52","chapter":7,"num":52,"importance":2,"topic":"বিক্রিয়ার গতিবেগ বা বিক্রিয়ার হার","question":"কোন বিক্রিয়ার উপর চাপের প্রভাব নেই?","boards":"যশোর বোর্ড ২০২৪","options":["2NO₂(g)⇌N₂O₄(g)","H₂(g)+I₂(g)⇌2HI(g)","CaO(s)+CO₂(g)⇌CaCO₃(s)","N₂(g)+3H₂(g)⇌2NH₃(g)"],"answerIndex":1,"explanation":"H₂(g)+I₂(g)⇌2HI(g) এ বিক্রিয়ক মোল 1+1=2,\nউৎপাদ মোল 2; Δn = 0, তাই চাপের প্রভাব নেই।\n(ক) 2 → 1, (গ) 1 → 0 (কঠিন পদার্থ গোনা হয় না), (ঘ) 4 → 2 —\nএগুলোতে মোল বদলায়, তাই চাপের প্রভাব আছে।"},{"id":"ch8-mcq1","chapter":8,"num":1,"importance":3,"topic":"রাসায়নিক শক্তি","question":"O₂ এর বন্ধন শক্তি কত কিলোজুল/ মোল?","boards":"রাজশাহী বোর্ড ২০২০; বরিশাল বোর্ড ২০২০; সিলেট বোর্ড ২০২০","options":["151","244","464","498"],"answerIndex":3,"explanation":"O₂ অণুতে দুইটি O পরমাণু দ্বিবন্ধন (O=O) দিয়ে যুক্ত। O=O এর বন্ধন শক্তি 498 kJ/mol। অন্য অপশনগুলো: 151 হলো I-I, 244 হলো Cl-Cl এবং 464 হলো O-H এর বন্ধন শক্তি ।"},{"id":"ch8-mcq2","chapter":8,"num":2,"importance":3,"topic":"রাসায়নিক শক্তি","question":"C–H এর বন্ধন শক্তি কত কিলোজুল/মোল (KJ/mole)?","boards":"ঢাকা বোর্ড ২০২৪; দিনাজপুর বোর্ড ২০২০","options":["414","436","464","498"],"answerIndex":0,"explanation":"C-H বন্ধনের বন্ধন শক্তি 414 kJ/mol। অর্থাৎ 1 মোল C-H বন্ধন ভাঙতে 414 kJ শক্তি লাগে । অন্য অপশনগুলো: 436 হলো H-H, 464 হলো O-H এবং 498 হলো O=O এর বন্ধন শক্তি ।"},{"id":"ch8-mcq3","chapter":8,"num":3,"importance":3,"topic":"রাসায়নিক শক্তি","question":"কোনটির বন্ধন শক্তি সর্বাধিক?","boards":"কুমিল্লা বোর্ড ২০২৪; চট্টগ্রাম বোর্ড ২০২৪","options":["H₂","N₂","O₂","Cl₂"],"answerIndex":1,"explanation":"N₂ অণুতে দুইটি N পরমাণু ত্রিবন্ধন (N≡N) দিয়ে যুক্ত, তাই এর বন্ধন শক্তি সর্বাধিক । N≡N = 946 \u003e O=O = 498 \u003e H-H = 436 \u003e Cl-Cl=244kJ/ mol।"},{"id":"ch8-mcq4","chapter":8,"num":4,"importance":2,"topic":"রাসায়নিক শক্তি","question":"Cl–Cl এর বন্ধন শক্তি কত kJ/mol?","boards":"কুমিল্লা বোর্ড ২০২৫","options":["244","193","151","143"],"answerIndex":0,"explanation":"Cl-Cl এর বন্ধন শক্তি 244 kJ/mol।\nঅন্য অপশনগুলো: 193 হলো Br-Br, 151 হলো I-I এবং 143 হলো O-O এর বন্ধন শক্তি ।"},{"id":"ch8-mcq5","chapter":8,"num":5,"importance":2,"topic":"রাসায়নিক শক্তি","question":"শামুকের খোলসে কোনটি থাকে?","boards":"দিনাজপুর বোর্ড ২০২৫","options":["MgCO₃","CaCO₃","Na₂CO₃","K₂CO₃"],"answerIndex":1,"explanation":"শামুক ও ঝিনুকের খোলসের প্রধান উপাদান ক্যালসিয়াম কার্বনেট (CaCO₃); এতে প্রায় 98% CaCO₃ থাকে। চুনাপাথর, মার্বেল পাথর, ডিমের খোসাও মূলত CaCO₃। উত্তর খ) CaCO₃।"},{"id":"ch8-mcq6","chapter":8,"num":6,"importance":2,"topic":"রাসায়নিক শক্তি","question":"H – H এর বন্ধন শক্তি কত কিলোজুল/মোল?","boards":"যশোর বোর্ড ২০২৫","options":["436","464","498","488"],"answerIndex":0,"explanation":"বন্ধন শক্তির তালিকা অনুযায়ী H-H বন্ধন শক্তি 436 কিলোজুল/মোল। অর্থাৎ 1 মোল H-H বন্ধন ভাঙতে 436 kJ তাপ শোষিত হয় এবং গঠনে সমপরিমাণ তাপ নির্গত হয়। (O-H = 464, O=O=498kJ/mol।) উত্তর ক) 436।"},{"id":"ch8-mcq7","chapter":8,"num":7,"importance":2,"topic":"রাসায়নিক শক্তি","question":"H-F এর বন্ধনশক্তি কত?","boards":"সিলেট বোর্ড ২০২৫","options":["464 কিলোজুল/মোল","498 কিলোজুল/মোল","563 কিলোজুল/মোল","615 কিলোজুল/মোল"],"answerIndex":2,"explanation":"বন্ধন শক্তির তালিকা অনুযায়ী H-F বন্ধন শক্তি 563 কিলোজুল/মোল। (O-H = 464, O=O = 498, C=C=615kJ/mol।) উত্তর গ) 563 কিলোজুল/মোল ।"},{"id":"ch8-mcq8","chapter":8,"num":8,"importance":2,"topic":"রাসায়নিক শক্তি","question":"C–O এর বন্ধন শক্তি কত kj/mol?","boards":"ময়মনসিংহ বোর্ড ২০২৫","options":["350 kj/mole","615 kj/mole","724 kj/mole","812 kj/mole"],"answerIndex":0,"explanation":"বন্ধন শক্তির তালিকা অনুযায়ী C-O (একক বন্ধন) বন্ধন শক্তি 350 কিলোজুল/মোল। দ্বিবন্ধন C=O এর মান 724 এবং C≡C এর মান 812 kJ/mol — এদের সাথে গুলিয়ে ফেলবে না। উত্তর ক) 350 kj/mole।"},{"id":"ch8-mcq9","chapter":8,"num":9,"importance":2,"topic":"রাসায়নিক শক্তি","question":"N₂(g)+O₂(g)→2NO(g) বিক্রিয়াটিতে ΔH এর মান\nকত (kJ/mole)?","boards":"যশোর বোর্ড ২০২৫","options":["180","– 192","– 176.8","92"],"answerIndex":0,"explanation":"বিক্রিয়ায় ভাঙে 1টি N≡N (946) ও 1টি O=O (498); গঠিত হয় 2টি N=O (প্রতিটি 632 kJ/mol)। বন্ধন ভাঙতে শোষিত শক্তি =946+498=1444kJ বন্ধন গঠনে নির্গত শক্তি =2×632=1264kJ ΔH=1444-1264=+180kJ/mol ধনাত্মক মান বলে বিক্রিয়াটি তাপহারী । উত্তর ক) 180।"},{"id":"ch8-mcq10","chapter":8,"num":10,"importance":2,"topic":"রাসায়নিক শক্তি","question":"নিচের কোনটির আন্তঃআণবিক শক্তি বেশি?","boards":"ময়মনসিংহ বোর্ড ২০২৫","options":["H₂","HCl","I₂","Br₂"],"answerIndex":1,"explanation":"একই মৌলের পরমাণু দিয়ে গঠিত অণুর (H₂, I₂, Br₂) চেয়ে দুইটি ভিন্ন মৌলের পরমাণু দিয়ে গঠিত অণুর আন্তঃআণবিক শক্তি বেশি হয়। অপশনগুলোর মধ্যে কেবল HCl দুইটি ভিন্ন মৌলের (H ও Cl) পরমাণু দিয়ে গঠিত, তাই এর আন্তঃআণবিক শক্তি বেশি ।"},{"id":"ch8-mcq11","chapter":8,"num":11,"importance":2,"topic":"রাসায়নিক শক্তি","question":"কোনটির আন্তঃআণবিক শক্তি বেশি?","boards":"দিনাজপুর বোর্ড ২০২৫","options":["N₂","NH₃","Cl₂","O₂"],"answerIndex":1,"explanation":"N₂, Cl₂ ও O₂ একই মৌলের পরমাণু দিয়ে গঠিত অণু। NH₃ দুইটি ভিন্ন মৌলের (N ও H) পরমাণু দিয়ে গঠিত, তাই এর আন্তঃআণবিক শক্তি বেশি।"},{"id":"ch8-mcq12","chapter":8,"num":12,"importance":2,"topic":"রাসায়নিক শক্তি","question":"কোন অণুটি ভাঙতে অধিক শক্তির প্রয়োজন?","boards":"সিলেট বোর্ড ২০২৪","options":["HCl","Cl₂","H₂","O₂"],"answerIndex":3,"explanation":"যে অণুর বন্ধন শক্তি বেশি, সেটি ভাঙতে বেশি শক্তি লাগে। O=O (O₂) = 498 \u003e H-H (H₂) = 436 \u003e H-Cl (HCl) = 431 \u003e Cl-Cl(Cl₂)=244kJ/mol। তাই O₂ অণু ভাঙতে সবচেয়ে বেশি শক্তি প্রয়োজন ।"},{"id":"ch8-mcq13","chapter":8,"num":13,"importance":3,"topic":"রাসায়নিক শক্তির ব্যবহার","question":"প্রতি বছর জীবাশ্ম জ্বালানি পুড়িয়ে কত টন CO₂ তৈরি হচ্ছে?","boards":"যশোর বোর্ড ২০২০; চট্টগ্রাম বোর্ড ২০২০; ময়মনসিংহ বোর্ড ২০২০","options":["22.3 মিলিয়ন","22.3 বিলিয়ন","21.3 মিলিয়ন","21.3 বিলিয়ন"],"answerIndex":3,"explanation":"পাঠ্যবই অনুযায়ী জীবাশ্ম জ্বালানি (কয়লা, পেট্রোলিয়াম, প্রাকৃতিক গ্যাস) পোড়ানোর ফলে প্রতিবছর 21.3 বিলিয়ন টন CO₂ উৎপন্ন হয়। এই CO₂ গ্রিনহাউস গ্যাস হিসেবে বৈশ্বিক উষ্ণায়ন ঘটায় । তাই সঠিক উত্তর ঘ।"},{"id":"ch8-mcq14","chapter":8,"num":14,"importance":2,"topic":"রাসায়নিক শক্তির ব্যবহার","question":"ফটোকেমিক্যাল ধোঁয়া তৈরিতে নিচের কোন উপাদানটি দায়ী নয়?","boards":"রাজশাহী বোর্ড ২০২৫","options":["SO₂","CO","N₂O","CH₄"],"answerIndex":0,"explanation":"যানবাহনের ধোঁয়ায় থাকা CO, N₂O ও অব্যবহৃত মিথেন (CH₄) সূর্যালোকে বিক্রিয়া করে ফটোকেমিক্যাল ধোঁয়া তৈরি করে। SO₂ এর উৎস জ্বালানিতে থাকা সালফার; এটি এসিড বৃষ্টি (H₂SO₄) তৈরি করে, ফটোকেমিক্যাল ধোঁয়ার উপাদান হিসেবে উল্লেখ নেই। তাই উত্তর ক।"},{"id":"ch8-mcq15","chapter":8,"num":15,"importance":2,"topic":"রাসায়নিক শক্তির ব্যবহার","question":"পেট্রোলের সাথে জ্বালানি হিসাবে কোন পদার্থটি মিশানো হয়?","boards":"রাজশাহী বোর্ড ২০২০","options":["মিথ্যান্যাল","অকটেন","হেপ্টেন","ইথানল"],"answerIndex":3,"explanation":"ইথানল (CH₃-CH₂-OH) পোড়ালে পেট্রলের মতোই তাপ উৎপন্ন হয়। তাই জীবাশ্ম জ্বালানির উপর চাপ কমাতে পেট্রলের সাথে ইথানল মিশিয়ে ব্যবহার করা হয়; যুক্তরাষ্ট্রে মেশানো হয় শতকরা 10 ভাগ।"},{"id":"ch8-mcq16","chapter":8,"num":16,"importance":3,"topic":"তড়িৎ-রাসায়নিক প্রক্রিয়া","question":"কোনটি মৃদু তড়িৎ বিশ্লেষ্য পদার্থ?","boards":"চট্টগ্রাম বোর্ড ২০২৫; ঢাকা বোর্ড ২০২০","options":["H₂O","NaCl","CuSO₄","H₂SO₄"],"answerIndex":0,"explanation":"তড়িৎ বিশ্লেষ্য দ্রবণে খুব অল্প আয়নিত হলে তা মৃদু তড়িৎ বিশ্লেষ্য ।\nপানি খুব সামান্য আয়নিত হয়: H₂O⇌H⁺+OH⁻; তাই H₂O মৃদু\nতড়িৎ বিশ্লেষ্য ।\nNaCl, CuSO₄, H₂SO₄ দ্রবণে সম্পূর্ণ আয়নিত হয়, তাই এগুলো তীব্র তড়িৎ বিশ্লেষ্য ।"},{"id":"ch8-mcq17","chapter":8,"num":17,"importance":3,"topic":"তড়িৎ-রাসায়নিক প্রক্রিয়া","question":"কোনটি আগে জারিত হবে?","boards":"রাজশাহী বোর্ড ২০২৫; চট্টগ্রাম বোর্ড ২০২৫","options":["OH⁻","Br⁻","NO₃⁻","SO₄²⁻"],"answerIndex":0,"explanation":"অ্যানায়ন সারি (উপর থেকে নিচে): NO₃⁻, SO₄²⁻, Cl⁻, Br⁻, I⁻, OH⁻। যে অ্যানায়ন সারির নিচে থাকে সে আগে ইলেকট্রন ত্যাগ করে জারিত হয়। প্রদত্ত আয়নগুলোর মধ্যে OH⁻ সবার নিচে, তাই OH⁻ আগে জারিত হবে।"},{"id":"ch8-mcq18","chapter":8,"num":18,"importance":3,"topic":"তড়িৎ-রাসায়নিক প্রক্রিয়া","question":"কোনটি ইলেকট্রনীয় পরিবাহী?","boards":"রাজশাহী বোর্ড ২০২৪; চট্টগ্রাম বোর্ড ২০২০","options":["কপার সালফেট","গ্রাফাইট","ইথানয়িক এসিড","ক্ষারের দ্রবণ"],"answerIndex":1,"explanation":"যে পদার্থে মুক্ত ইলেকট্রনের মাধ্যমে বিদ্যুৎ পরিবাহিত হয় তা ইলেকট্রনীয় পরিবাহী । গ্রাফাইটের প্রতিটি কার্বনে একটি মুক্ত ইলেকট্রন থাকে, তাই গ্রাফাইট ইলেকট্রনীয় পরিবাহী । কপার সালফেট, ইথানয়িক এসিড ও ক্ষারের দ্রবণ আয়নের মাধ্যমে বিদ্যুৎ পরিবহণ করে, তাই এগুলো তড়িৎ বিশ্লেষ্য পরিবাহী।"},{"id":"ch8-mcq19","chapter":8,"num":19,"importance":2,"topic":"তড়িৎ-রাসায়নিক প্রক্রিয়া","question":"কক্ষ তাপমাত্রায় 0.1 মোলার NaCl এর জলীয় দ্রবণে Cl⁻ আয়নের ঘনমাত্রা OH⁻ এর ঘনমাত্রার কতগুণ?","boards":"কুমিল্লা বোর্ড ২০২৫","options":["10⁻⁷","10⁻⁶","10³","10⁶"],"answerIndex":3,"explanation":"NaCl সবল তড়িৎ বিশ্লেষ্য, তাই 0.1 M দ্রবণে [Cl⁻]=0.1M=10⁻¹ M। কক্ষ তাপমাত্রায় পানির আয়নিকরণে [OH⁻]=10⁻⁷ M (NaCl নিরপেক্ষ লবণ, তাই এটি বদলায় না)। [Cl⁻]/[OH⁻]=10⁻¹/10⁻⁷=10⁶ তাই Cl⁻ এর ঘনমাত্রা OH⁻ এর 10⁶ গুণ — উত্তর ঘ) 10⁶।"},{"id":"ch8-mcq20","chapter":8,"num":20,"importance":2,"topic":"তড়িৎ-রাসায়নিক প্রক্রিয়া","question":"পানির তড়িৎ বিশ্লেষণে অ্যানোডে 16g অক্সিজেন প্রস্তুতিতে কত মোল OH⁻ আয়ন প্রয়োজন?","boards":"সিলেট বোর্ড ২০২৫","options":["1","2","3","4"],"answerIndex":1,"explanation":"পানির তড়িৎ বিশ্লেষণে অ্যানোডে OH⁻ আয়ন ইলেকট্রন ত্যাগ করে অক্সিজেন উৎপন্ন করে:\n4OH⁻-4e⁻→O₂+2H₂O\n4 মোল OH⁻ থেকে 1 মোল (32 g) O₂ পাওয়া যায়। 16 g O₂ এর জন্য OH⁻=(4×16)/32=2 মোল উত্তর খ) 2।"},{"id":"ch8-mcq21","chapter":8,"num":21,"importance":2,"topic":"তড়িৎ-রাসায়নিক প্রক্রিয়া","question":"কোনটি ক্যাথোড তড়িৎদ্বারে আগে চার্জমুক্ত হবে?","boards":"ঢাকা বোর্ড ২০২৫","options":["Mg²⁺","Fe²⁺","Sn²⁺","Pb²⁺"],"answerIndex":3,"explanation":"ক্যাটায়ন সারিতে যে আয়ন নিচে থাকে সে আগে ক্যাথোড থেকে ইলেকট্রন গ্রহণ করে চার্জমুক্ত হয়। ক্রম: Mg²⁺ … Fe²⁺ … Sn²⁺ … Pb²⁺; এদের মধ্যে Pb²⁺ সবার নিচে। তাই Pb²⁺ আগে চার্জমুক্ত হবে।"},{"id":"ch8-mcq22","chapter":8,"num":22,"importance":2,"topic":"তড়িৎ-রাসায়নিক প্রক্রিয়া","question":"কোন আয়নটি আগে ক্যাথোডে যাবে?","boards":"দিনাজপুর বোর্ড ২০২৫","options":["Mg²⁺","Zn²⁺","Cu²⁺","Sn²⁺"],"answerIndex":2,"explanation":"তড়িৎ বিশ্লেষণে সারির নিচের ক্যাটায়ন আগে ক্যাথোডে চার্জমুক্ত হয়। ক্রম (উপর থেকে নিচে): Mg²⁺ … Zn²⁺ … Sn²⁺ … Cu²⁺; Cu²⁺ সবার নিচে।\nতাই Cu²⁺ আগে ক্যাথোডে গিয়ে চার্জমুক্ত হবে (Cu²⁺+2e⁻→\nCu)।"},{"id":"ch8-mcq23","chapter":8,"num":23,"importance":2,"topic":"তড়িৎ-রাসায়নিক প্রক্রিয়া","question":"কোনটি আগে বিজারিত হবে?","boards":"কুমিল্লা বোর্ড ২০২৫","options":["Al³⁺","Pb²⁺","Cu²⁺","Au³⁺"],"answerIndex":3,"explanation":"বিজারণ মানে ইলেকট্রন গ্রহণ; সারির নিচের ক্যাটায়ন আগে ইলেকট্রন গ্রহণ করে। ক্রম: Al³⁺ … Pb²⁺ … Cu²⁺ … Au³⁺; Au³⁺ সারির সবার নিচে।\nতাই Au³⁺ আগে বিজারিত হবে: Au³⁺+3e⁻→Au।"},{"id":"ch8-mcq24","chapter":8,"num":24,"importance":2,"topic":"তড়িৎ-রাসায়নিক প্রক্রিয়া","question":"কোনটি ইলেকট্রনীয় পরিবাহী?","boards":"সিলেট বোর্ড ২০২৪","options":["এসিড দ্রবণ","ক্ষার দ্রবণ","লবণ দ্রবণ","গ্রাফাইট"],"answerIndex":3,"explanation":"এসিড, ক্ষার ও লবণের দ্রবণে আয়নের মাধ্যমে বিদ্যুৎ পরিবাহিত হয়, তাই এগুলো তড়িৎ বিশ্লেষ্য পরিবাহী । গ্রাফাইটে মুক্ত ইলেকট্রনের মাধ্যমে বিদ্যুৎ পরিবাহিত হয়, তাই গ্রাফাইট ইলেকট্রনীয় পরিবাহী ।"},{"id":"ch8-mcq25","chapter":8,"num":25,"importance":2,"topic":"রাসায়নিক বিক্রিয়ার মাধ্যমে বিদ্যুৎ উৎপাদন","question":"ড্রাইসেলে নিচের কোনটি জারক হিসেবে কাজ করে?","boards":"যশোর বোর্ড ২০২৫","options":["Zn দণ্ড","MnO₂","কার্বন দণ্ড","NH₄⁺"],"answerIndex":1,"explanation":"ড্রাই সেলের ক্যাথোডে বিক্রিয়া: 2NH₄⁺+2MnO₂+\n2e⁻→2NH₃+Mn₂O₃+H₂O।\nএখানে MnO₂ ইলেকট্রন গ্রহণ করে Mn₂O₃-তে পরিণত হয় (Mn- এর জারণ সংখ্যা +4 থেকে +3)। যে নিজে বিজারিত হয়ে অন্যকে জারিত করে সে-ই জারক, তাই MnO₂ জারক। Zn দণ্ড ইলেকট্রন দেয় বলে বিজারক ।"},{"id":"ch8-mcq26","chapter":8,"num":26,"importance":2,"topic":"রাসায়নিক বিক্রিয়ার মাধ্যমে বিদ্যুৎ উৎপাদন","question":"সঠিক তড়িৎদ্বার কোনটি?","boards":"সিলেট বোর্ড ২০২৫","options":["Au|Au³⁺","Sn|Sn³⁺","Ag|Ag²⁺","Pb|Pb⁺"],"answerIndex":0,"explanation":"তড়িৎদ্বারে আয়নের চার্জ ধাতুর যোজনীর সমান হতে হয়। সঠিক রূপ: Sn|Sn²⁺, Ag|Ag⁺, Pb|Pb²⁺ এবং Au|Au³⁺। তাই প্রদত্ত বিকল্পগুলোর মধ্যে কেবল Au|Au³⁺ সঠিক ।"},{"id":"ch8-mcq27","chapter":8,"num":27,"importance":2,"topic":"রাসায়নিক বিক্রিয়ার মাধ্যমে বিদ্যুৎ উৎপাদন","question":"Zn/Zn²⁺ তড়িৎদ্বার দ্বারা নিচের কোনটি বুঝায়?\ni. এটি একটি নন-রেডক্স বিক্রিয়া\nii. এটি একটি উভমুখী বিক্রিয়া\niii. Zn ধাতুর দণ্ডকে ZnSO₄ দ্রবণে রাখা হয়\nনিচের কোনটি সঠিক?","boards":"ময়মনসিংহ বোর্ড ২০২৫","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":2,"explanation":"Zn|Zn²⁺ তড়িৎদ্বারের বিক্রিয়া: Zn(s)⇌Zn²⁺(aq)+\n2e⁻।\ni. ভুল — এতে ইলেকট্রন আদান-প্রদান হয়, তাই এটি রেডক্স বিক্রিয়া ।\nii. সঠিক — বিক্রিয়াটি উভমুখী; তড়িৎদ্বারটি অ্যানোড বা ক্যাথোড দুটোই হতে পারে ।\niii. সঠিক — Zn দণ্ডকে ZnSO₄ দ্রবণে রেখে এ তড়িৎদ্বার তৈরি হয়।"},{"id":"ch8-mcq28","chapter":8,"num":28,"importance":2,"topic":"নিউক্লিয়ার বিক্রিয়া ও বিদ্যুৎ শক্তি উৎপাদন","question":"অ্যামোনিয়াম ক্লোরাইডকে পানিতে দ্রবীভূত করলে নিচের কোনটি ঘটে?","boards":"যশোর বোর্ড ২০২৫","options":["তাপের সৃষ্টি হয়","তাপের শোষণ ঘটে","তাপ অপরিবর্তিত থাকে","ΔH এর মান ঋণাত্মক হয়"],"answerIndex":1,"explanation":"NH₄Cl পানিতে দ্রবীভূত হলে NH₄Cl→NH₄⁺+Cl⁻\nআয়নিত হয়।\nকেলাস ভাঙতে ও আয়নিত হতে যে শক্তি লাগে তা পানি থেকে শোষিত হয়, ফলে পানির তাপমাত্রা কমে। তাই এটি তাপহারী প্রক্রিয়া — তাপের শোষণ ঘটে (ΔH ধনাত্মক, ঋণাত্মক নয়)।"},{"id":"ch8-mcq29","chapter":8,"num":29,"importance":2,"topic":"নিউক্লিয়ার বিক্রিয়া ও বিদ্যুৎ শক্তি উৎপাদন","question":"CO₂ যৌগটি –\ni. অম্লধর্মী\nii. কঠিন অবস্থায় ঊর্ধ্বপাতিত হয়\niii. বৈশ্বিক উষ্ণতার জন্য দায়ী\nনিচের কোনটি সঠিক?","boards":"চট্টগ্রাম বোর্ড ২০২৫","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":3,"explanation":"i. সঠিক — CO₂ পানিতে দ্রবীভূত হয়ে কার্বনিক এসিড তৈরি\nকরে: CO₂+H₂O→H₂CO₃, তাই এটি অম্লধর্মী অক্সাইড ।\nii. সঠিক — কঠিন CO₂ (শুষ্ক বরফ) তাপে তরল না হয়ে সরাসরি গ্যাসে পরিণত হয়, অর্থাৎ ঊর্ধ্বপাতিত হয়।\niii. সঠিক — CO₂ গ্রিনহাউস গ্যাস; ভূপৃষ্ঠের বিকীর্ণ তাপ আটকে রেখে বৈশ্বিক উষ্ণতা বাড়ায় ।"},{"id":"ch8-mcq30","chapter":8,"num":30,"importance":2,"topic":"নিউক্লিয়ার বিক্রিয়া ও বিদ্যুৎ শক্তি উৎপাদন","question":"ইলেকট্রনের মাধ্যমে তড়িৎ পরিবহণ করে –\ni. গ্রাফাইট\nii. কয়লা\niii. নিকেল\nনিচের কোনটি সঠিক?","boards":"কুমিল্লা বোর্ড ২০২৫","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":1,"explanation":"ধাতু ও গ্রাফাইটে মুক্ত (সঞ্চরণশীল) ইলেকট্রন থাকে, এরাই তড়িৎ পরিবহন করে।\ni. সঠিক — গ্রাফাইটের প্রতিটি কার্বনের একটি করে মুক্ত ইলেকট্রন থাকে, তাই এটি ইলেকট্রনীয় পরিবাহী ।\nii. সঠিক নয় — কয়লা সাধারণত তড়িৎ অপরিবাহী।\niii. সঠিক — নিকেল (Ni) ধাতু, তাই এটি ইলেকট্রনের মাধ্যমে তড়িৎ পরিবহন করে।"},{"id":"ch9-mcq1","chapter":9,"num":1,"importance":3,"topic":"এসিড","question":"দুর্বল অম্ল কোনটি?","boards":"বরিশাল বোর্ড ২০২৪; সিলেট বোর্ড ২০২৪; রাজশাহী বোর্ড ২০২০","options":["HCl","HNO₃","H₂CO₃","H₂SO₄"],"answerIndex":2,"explanation":"H₂CO₃ জলীয় দ্রবণে আংশিক বিয়োজিত হয়ে খুব সামান্য H⁺ দেয়, তাই এটি দুর্বল অম্ল।\nH2CO3(aq)⇌2H⁺(aq)+CO₃²⁻(aq)\nHCl, HNO₃, H₂SO₄ পানিতে সম্পূর্ণ বিয়োজিত হয়, তাই এরা সবল অম্ল।"},{"id":"ch9-mcq2","chapter":9,"num":2,"importance":3,"topic":"এসিড","question":"কোনটি অম্লধর্মী অক্সাইড?","boards":"কুমিল্লা বোর্ড ২০২৬","options":["Na₂O","SiO₂","CaO","CuO"],"answerIndex":1,"explanation":"অধাতুর অক্সাইড সাধারণত অম্লধর্মী; SiO₂ অধাতু Si এর অক্সাইড । বাকিগুলো ধাতব (ক্ষারীয়) অক্সাইড ।"},{"id":"ch9-mcq3","chapter":9,"num":3,"importance":3,"topic":"এসিড","question":"দধিতে কোন জৈব এসিড উপস্থিত থাকে?","boards":"বরিশাল বোর্ড ২০২৬","options":["অ্যাসিটিক এসিড","টারটারিক এসিড","ল্যাকটিক এসিড","সাইট্রিক এসিড"],"answerIndex":2,"explanation":"দুধ থেকে দই তৈরির সময় ল্যাকটিক এসিড উৎপন্ন হয়।"},{"id":"ch9-mcq4","chapter":9,"num":4,"importance":2,"topic":"এসিড","question":"কোনটি মৃদু এসিড?","boards":"দিনাজপুর বোর্ড ২০২৫","options":["HCl","HNO₃","H₂SO₄","CH₃ - COOH"],"answerIndex":3,"explanation":"CH₃COOH (এসিটিক এসিড) জলীয় দ্রবণে আংশিক বিয়োজিত হয় (25°C এ 1000টি অণুর মাত্র 4টি), তাই এটি মৃদু এসিড ।\nCH3COOH(aq)⇌H⁺(aq)+CH₃COO⁻(aq)\nHCl, HNO₃, H₂SO₄ সম্পূর্ণ বিয়োজিত সবল এসিড ।"},{"id":"ch9-mcq5","chapter":9,"num":5,"importance":2,"topic":"এসিড","stemPrefix":"পরীক্ষাগারে 60g MgCO₃ কে তাপ দিয়ে 25g MgO এবং 'X' গ্যাস উৎপন্ন হল।","question":"উৎপন্ন 'X' গ্যাসটির —\ni. চুনের পানিকে ঘোলা করার ক্ষমতা রয়েছে\nii. জলীয় দ্রবণ টক স্বাদযুক্ত\niii. কেন্দ্রীয় পরমাণুর সুপ্ত যোজনী ২\nনিচের কোনটি সঠিক?","boards":"দিনাজপুর বোর্ড ২০২৫","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":0,"explanation":"MgCO₃ কে তাপ দিলে MgO ও CO₂ উৎপন্ন হয়: MgCO₃→\nMgO+CO₂। অতএব X = CO₂।\ni. সঠিক – Ca(OH)₂+CO₂→CaCO₃↓ + H₂O, অদ্রবণীয় CaCO₃\nএর জন্য চুনের পানি ঘোলা হয়।\nii. সঠিক – CO₂+H₂O⇌H₂CO₃, কার্বনিক এসিড থাকায় দ্রবণ\nটক।\niii. ভুল– কেন্দ্রীয় পরমাণু C এর 4টি যোজ্যতা ইলেকট্রনই বন্ধনে যুক্ত (O=C=O), তাই সুপ্ত যোজনী 4-4=0।"},{"id":"ch9-mcq6","chapter":9,"num":6,"importance":2,"topic":"এসিড","question":"25°C তাপমাত্রায় 1000টি CH₃COOH অণুর মধ্যে পানিতে কতটি অণু বিয়োজিত হয়?","boards":"ময়মনসিংহ বোর্ড ২০২৪","options":["4","6","8","10"],"answerIndex":0,"explanation":"25°C তাপমাত্রায় পানিতে 1000টি CH₃COOH অণুর মধ্যে মাত্র 4টি বিয়োজিত হয়, বাকি 996টি অবিয়োজিত থাকে। এজন্যই CH₃COOH দুর্বল এসিড ।"},{"id":"ch9-mcq7","chapter":9,"num":7,"importance":3,"topic":"ক্ষারক এবং ক্ষার","question":"নিচের কোন অধঃক্ষেপের বর্ণ লালচে বাদামী?","boards":"বরিশাল বোর্ড ২০২০; দিনাজপুর বোর্ড ২০২০","options":["Fe(OH)₃","Cu(OH)₂","Fe(OH)₂","Al(OH)₃"],"answerIndex":0,"explanation":"Fe(NO₃)₃ বা FeCl₃ দ্রবণে লঘু NaOH যোগ করলে Fe(OH)₃ এর লালচে বাদামি অধঃক্ষেপ পড়ে । Cu(OH)₂ হালকা নীল, Fe(OH)₂ সবুজ এবং Al(OH)₃ সাদা ।"},{"id":"ch9-mcq8","chapter":9,"num":8,"importance":2,"topic":"ক্ষারক এবং ক্ষার","question":"কোনটি ক্ষার?","boards":"রাজশাহী বোর্ড ২০২৫","options":["Fe(OH)₂","NaOH","CaO","Cu(OH)₂"],"answerIndex":1,"explanation":"ক্ষার হতে হলে OH⁻ মূলক থাকতে হবে এবং পানিতে দ্রবণীয় হতে হবে। NaOH এ OH⁻ আছে এবং এটি পানিতে দ্রবণীয়, তাই এটি ক্ষার। Fe(OH)₂ ও Cu(OH)₂ পানিতে অদ্রবণীয় এবং CaO তে OH⁻ নেই — এরা শুধু ক্ষারক ।"},{"id":"ch9-mcq9","chapter":9,"num":9,"importance":2,"topic":"ক্ষারক এবং ক্ষার","stemPrefix":"FeCl3(aq)+NaOH(aq)→X+লবণ(aq)","question":"উদ্দীপকের 'X' যৌগটি কীরূপ বর্ণ প্রদর্শন করে?","boards":"যশোর বোর্ড ২০২৫","options":["নীল","লাল","লালচে বাদামি","সবুজ"],"answerIndex":2,"explanation":"FeCl3(aq)+3NaOH(aq)→Fe(OH)₃(s)+3NaCl(aq)\nএখানে X = Fe(OH)₃, যা লালচে বাদামি বর্ণের অধঃক্ষেপ ।"},{"id":"ch9-mcq10","chapter":9,"num":10,"importance":2,"topic":"ক্ষারক এবং ক্ষার","stemPrefix":"FeCl3(aq)+NaOH(aq)→X+লবণ(aq)","question":"উপরের বিক্রিয়াটিতে —\ni. জারণ-বিজারণ ঘটে\nii. অধঃক্ষেপণ ঘটে\niii. উৎপন্ন লবণটি CCl₄-এ অদ্রবণীয়\nনিচের কোনটি সঠিক?","boards":"যশোর বোর্ড ২০২৫","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":2,"explanation":"FeCl₃+3NaOH→Fe(OH)₃↓ + 3NaCl\ni. ভুল — Fe এর জারণ সংখ্যা উভয় পাশে +3; কোনো মৌলের জারণ সংখ্যা বদলায়নি, তাই জারণ-বিজারণ নয়।\nii. সঠিক — অদ্রবণীয় Fe(OH)₃ অধঃক্ষেপ হিসেবে জমা হয়।\niii. সঠিক — উৎপন্ন লবণ NaCl আয়নিক যৌগ, তাই জৈব দ্রাবক CCl₄ এ অদ্রবণীয় ।"},{"id":"ch9-mcq11","chapter":9,"num":11,"importance":2,"topic":"গাঢ় এসিড ও গাঢ় ক্ষারের ক্ষয়কারী ধর্ম","question":"গাঢ় নাইট্রিক এসিডের বোতলের –\ni. মুখ খোলা হলে হলুদ কুয়াশার মত ধোঁয়া বের হয়\nii. মুখ খুললে তীব্র ঝাঁজালো গন্ধ পাওয়া যায়\niii. বর্ণ বাদামি হয়\nনিচের কোনটি সঠিক?","boards":"ঢাকা বোর্ড ২০২৫","options":["i ও ii","ii ও iii","i ও iii","i, ii ও iii"],"answerIndex":3,"explanation":"i. সঠিক — বোতলের মুখ খুললে HNO₃ এর বাষ্প বাতাসের জলীয় বাষ্পের সাথে মিশে হলুদাভ কুয়াশার মতো ধোঁয়া দেয়।\nii. সঠিক — HNO₃ বাষ্পের তীব্র ঝাঁজালো গন্ধ পাওয়া যায়।\niii. সঠিক — আলোতে HNO₃ বিয়োজিত হয়ে NO₂ দেয় বলে একে বাদামি বর্ণের বোতলে রাখা হয়। আলো\n4HNO₃⟶4NO₂+O₂+2H₂O"},{"id":"ch9-mcq12","chapter":9,"num":12,"importance":3,"topic":"pH এর ধারণা","question":"কোনটি অধিক ক্ষারীয়?","boards":"যশোর বোর্ড ২০২৫; বরিশাল বোর্ড ২০২৫; কুমিল্লা বোর্ড ২০২৪","options":["রক্ত","মূত্র","অগ্ন্যাশয় রস","বৃষ্টির পানি"],"answerIndex":2,"explanation":"pH যত বেশি, দ্রবণ তত বেশি ক্ষারীয় ।\nরক্ত 7.43 – 7.45, মূত্র 6, বৃষ্টির পানি প্রায় 5.6 (অম্লীয়), অগ্ন্যাশয় রস 8.1। অগ্ন্যাশয় রসের pH সবচেয়ে বেশি, তাই এটি অধিক ক্ষারীয় ।"},{"id":"ch9-mcq13","chapter":9,"num":13,"importance":3,"topic":"pH এর ধারণা","question":"কোনটি মানুষের ত্বকের pH মান?","boards":"রাজশাহী বোর্ড ২০২৪; ময়মনসিংহ বোর্ড ২০২০","options":["4.8 – 5.5","7.43 – 7.45","6.0 – 8.1","1.0 – 7.0"],"answerIndex":0,"explanation":"মানুষের ত্বকের pH 4.8 – 5.5। 7.43 – 7.45 হলো রক্তের pH। তাই সঠিক উত্তর 4.8 – 5.5।"},{"id":"ch9-mcq14","chapter":9,"num":14,"importance":3,"topic":"pH এর ধারণা","question":"বিশুদ্ধ পানির pH কত?","boards":"কুমিল্লা বোর্ড ২০২৫","options":["4","7","10","14"],"answerIndex":1,"explanation":"বিশুদ্ধ পানিতে [H+]=10⁻⁷mol/L।\npH = -log(10⁻⁷) = 7 তাই বিশুদ্ধ পানি নিরপেক্ষ, এর pH 7।"},{"id":"ch9-mcq15","chapter":9,"num":15,"importance":2,"topic":"pH এর ধারণা","question":"বিশুদ্ধ পানিতে এসিড যোগের কারণে যদি H⁺ আয়ন 100 গুণ বেড়ে যায়, তবে উক্ত দ্রবণের pH কত হবে?","boards":"দিনাজপুর বোর্ড ২০২৫","options":["3","4","5","6"],"answerIndex":2,"explanation":"বিশুদ্ধ পানিতে [H⁺]=10⁻⁷ M (pH = 7)।\nH⁺ আয়ন 100 গুণ বাড়লে [H⁺]=100×10⁻⁷=10⁻⁵M। pH = -log[H⁺]=−log(10⁻⁵) = 5।"},{"id":"ch9-mcq16","chapter":9,"num":16,"importance":2,"topic":"pH এর ধারণা","question":"কোনটির pH সবচেয়ে কম?","boards":"চট্টগ্রাম বোর্ড ২০২৫","options":["মানুষের ত্বক","অগ্ন্যাশয় রস","মূত্র","রক্ত"],"answerIndex":0,"explanation":"পাঠ্যবই অনুযায়ী মানুষের ত্বকের pH 4.8-5.5, মূত্রের pH 6, রক্তের pH 7.43-7.45 এবং অগ্ন্যাশয় রসের pH 8.1। প্রদত্তগুলোর মধ্যে মানুষের ত্বকের pH সবচেয়ে কম।"},{"id":"ch9-mcq17","chapter":9,"num":17,"importance":2,"topic":"pH এর ধারণা","question":"মাটির pH এর মান বৃদ্ধি করতে কোন পদার্থটি ব্যবহার করা হয়?","boards":"চট্টগ্রাম বোর্ড ২০২৫","options":["অ্যামোনিয়াম সালফেট","ম্যাগনেসিয়াম ফসফেট","ক্যালসিয়াম অক্সাইড","ইউরিয়া"],"answerIndex":2,"explanation":"মাটির pH কমে গেলে (মাটি অম্লীয় হলে) pH বাড়াতে পরিমাণমতো চুন (CaO) ব্যবহার করা হয়।\nCaO+H₂O→Ca(OH)₂\nউৎপন্ন ক্ষার মাটির এসিডকে প্রশমিত করে pH বাড়ায় । অ্যামোনিয়াম সালফেট ও অ্যামোনিয়াম ফসফেট সার মাটির pH কমায় ।"},{"id":"ch9-mcq18","chapter":9,"num":18,"importance":2,"topic":"pH এর ধারণা","question":"মাটির pH এর মান কত এর মধ্যে হলে সবচেয়ে ভালো?","boards":"ময়মনসিংহ বোর্ড ২০২৫","options":["3.0 – 5.0","5.0 – 7.0","6.0 – 8.0","7.0 – 10"],"answerIndex":2,"explanation":"উদ্ভিদ পুষ্টির জন্য মাটি থেকে বিভিন্ন আয়ন ও পানি শোষণ করে। এর জন্য মাটির pH 6.0 থেকে 8.0 এর মধ্যে হলে সবচেয়ে ভালো। মাটির pH 3.0 এর কম বা 10 এর বেশি হলে মাটির উপকারী অণুজীব মারা যায়।"},{"id":"ch9-mcq19","chapter":9,"num":19,"importance":2,"topic":"pH এর ধারণা","question":"মূত্রের pH কত?","boards":"ঢাকা বোর্ড ২০২৪","options":["1","4.8","6","8.1"],"answerIndex":2,"explanation":"শরীরের বিভিন্ন অঙ্গের pH: পাকস্থলী 1, ত্বক 4.8 – 5.5, মূত্র 6, অগ্ন্যাশয় রস 8.1। সুতরাং মূত্রের pH 6 (মৃদু অম্লীয়)।"},{"id":"ch9-mcq20","chapter":9,"num":20,"importance":2,"topic":"pH এর ধারণা","question":"কোনটির প্রয়োগে মাটির অত্যধিক ক্ষারকত্ব নিয়ন্ত্রিত হয়?","boards":"দিনাজপুর বোর্ড ২০২৪","options":["NH₄OH","NaHCO₃","Ca(OH)₂","(NH₄)₂SO₄"],"answerIndex":3,"explanation":"মাটি অতিরিক্ত ক্ষারীয় হলে অম্লধর্মী লবণ যোগ করে pH কমাতে হয়। (NH₄)₂SO₄ সবল এসিড (H₂SO₄) ও দুর্বল ক্ষারক (NH₄OH) থেকে তৈরি অম্লধর্মী লবণ, তাই এটি মাটির ক্ষারকত্ব প্রশমিত করে। NH₄OH, NaHCO₃ ও Ca(OH)₂ ক্ষারধর্মী, এগুলো দিলে ক্ষারকত্ব আরও বাড়বে ।"},{"id":"ch9-mcq21","chapter":9,"num":21,"importance":2,"topic":"প্রশমন বিক্রিয়া","question":"এন্টাসিডে কোন যৌগটি থাকে?","boards":"কুমিল্লা বোর্ড ২০২৫","options":["Mg(OH)₂","Ca(OH)₂","NaOH","KOH"],"answerIndex":0,"explanation":"এন্টাসিডে ক্ষারজাতীয় Al(OH)₃ ও Mg(OH)₂ থাকে, যা পাকস্থলীর অতিরিক্ত HCl কে প্রশমিত করে ।\nMg(OH)₂+2HCl→MgCl₂+2H₂O\nCa(OH)₂, NaOH, KOH এন্টাসিডের উপাদান নয়; NaOH ও KOH তীব্র ক্ষার, শরীরের জন্য ক্ষতিকর ।"},{"id":"ch9-mcq22","chapter":9,"num":22,"importance":2,"topic":"প্রশমন বিক্রিয়া","question":"কোনটি অম্লীয় মূলক?","boards":"সিলেট বোর্ড ২০২৫","options":["OH⁻","Fe²⁺","O²⁻","PO₄³⁻"],"answerIndex":3,"explanation":"লবণের যে ঋণাত্মক আয়নটি এসিড থেকে আসে তাকে অম্লীয় মূলক বলে।\nH3PO4(aq)→3H⁺(aq)+PO₄³⁻(aq)\nতাই PO₄³⁻ অম্লীয় মূলক। Fe²⁺ ধনাত্মক আয়ন (ক্ষারীয় মূলক); OH⁻ ও O²⁻ এসিড থেকে আসে না।"},{"id":"ch9-mcq23","chapter":9,"num":23,"importance":2,"topic":"প্রশমন বিক্রিয়া","question":"কোনটি পেটে এসিডিটির সমস্যা দূর করে?","boards":"ঢাকা বোর্ড ২০২৪","options":["Ca(OH)₂ ও Al(OH)₃","Ca(OH)₂ ও Mg(OH)₂","Mg(OH)₂ ও Al(OH)₃","Mg(OH)₂ ও NaOH"],"answerIndex":2,"explanation":"পেটে এসিডিটি হয় পাকস্থলীতে অতিরিক্ত HCl এর কারণে । এন্টাসিডের Mg(OH)₂ ও Al(OH)₃ এই অতিরিক্ত HCl প্রশমিত করে এসিডিটি দূর করে।\nAl(OH)₃+3HCl→AlCl₃+3H₂O"},{"id":"ch9-mcq24","chapter":9,"num":24,"importance":2,"topic":"এসিড বৃষ্টি","question":"বজ্রপাতের কারণে বৃষ্টির পানিতে কোন এসিডটির আধিক্য সৃষ্টি হয়?","boards":"যশোর বোর্ড ২০২৫","options":["H₂CO₃","HNO₃","H₃PO₄","H₂SO₄"],"answerIndex":1,"explanation":"বজ্রপাতের সময় বায়ুর তাপমাত্রা প্রায় 3000°C হয়, তখন N₂ ও O₂ বিক্রিয়া করে NO তৈরি করে । NO জারিত হয়ে NO₂ হয় এবং বৃষ্টির পানিতে দ্রবীভূত হয়ে HNO₃\nদেয়: 2NO₂+H₂O→HNO₂+HNO₃।\nতাই বজ্রপাতের ফলে বৃষ্টির পানিতে নাইট্রিক এসিডের আধিক্য হয়।"},{"id":"ch9-mcq25","chapter":9,"num":25,"importance":2,"topic":"এসিড বৃষ্টি","question":"বৃষ্টির পানির pH কত?","boards":"সিলেট বোর্ড ২০২৫","options":["4.8–5.5","5.5–6.0","6.0–8.0","7.4–7.5"],"answerIndex":1,"explanation":"বায়ুর CO₂ ও নাইট্রোজেনের অক্সাইড দ্রবীভূত থাকায় স্বাভাবিক বৃষ্টির পানি সামান্য অম্লীয় । এর pH 5 থেকে 6 এর মধ্যে থাকে; অপশনগুলোর মধ্যে 5.5–6.0 এই সীমার মধ্যে পড়ে । pH 4 বা তার কম হলে তা এসিড বৃষ্টি।"},{"id":"ch9-mcq26","chapter":9,"num":26,"importance":2,"topic":"এসিড বৃষ্টি","stemPrefix":"S+O₂→A; A+O₂→B","question":"উদ্দীপকের B যৌগটির —\ni. জলীয় দ্রবণ অম্লধর্মী\nii. কেন্দ্রীয় পরমাণুর জারণ সংখ্যা +4\niii. ক্ষেত্রে অষ্টক নিয়মের ব্যতিক্রম ঘটে\nনিচের কোনটি সঠিক?","boards":"চট্টগ্রাম বোর্ড ২০২৫","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":1,"explanation":"S+O₂→SO₂(A); 2SO₂+O₂→2SO₃(B)। সুতরাং B = SO₃।\ni. সঠিক — SO₃+H₂O→H₂SO₄, তাই জলীয় দ্রবণ অম্লধর্মী ।\nii. ভুল — SO₃ এ S এর জারণ সংখ্যা x+3(-2)=0, x=+6।\niii. সঠিক — SO₃ এ S এর যোজ্যতাস্তরে 12টি ইলেকট্রন থাকে, তাই অষ্টক নিয়মের ব্যতিক্রম ।"},{"id":"ch9-mcq27","chapter":9,"num":27,"importance":3,"topic":"পানি","question":"নিচের কোন যৌগটির কারণে পানির স্থায়ী খরতা সৃষ্টি হয়?","boards":"ঢাকা বোর্ড ২০২৫; দিনাজপুর বোর্ড ২০২০","options":["MgSO₄","K₂SO₄","Na₂SO₄","ZnSO₄"],"answerIndex":0,"explanation":"Ca, Mg, Fe এর ক্লোরাইড বা সালফেট লবণ পানিতে দ্রবীভূত থাকলে স্থায়ী খরতা হয়। MgSO₄ ম্যাগনেসিয়ামের সালফেট, তাই স্থায়ী খরতা সৃষ্টি করে। K₂SO₄ ও Na₂SO₄ খরতা সৃষ্টি করে না (Na, K এর লবণ); ZnSO₄ খরতার জন্য দায়ী লবণ হিসেবে ধরা হয় না।"},{"id":"ch9-mcq28","chapter":9,"num":28,"importance":3,"topic":"পানি","question":"ভারী ধাতু কোনটি?","boards":"চট্টগ্রাম বোর্ড ২০২৪; রাজশাহী বোর্ড ২০২০","options":["Fe","Mo","Rb","Cd"],"answerIndex":3,"explanation":"লেড (Pb), ক্যাডমিয়াম (Cd), মার্কারি (Hg), ক্রোমিয়াম (Cr) পানিদূষণকারী ভারী ধাতু। অপশনের মধ্যে Cd (ক্যাডমিয়াম) ভারী ধাতু, যা পানিতে মিশে ক্যানসারের মতো রোগ সৃষ্টি করে।"},{"id":"ch9-mcq29","chapter":9,"num":29,"importance":2,"topic":"পানি","question":"কোন যৌগের সাহায্যে পানির স্থায়ী খরতা দূর করা যায়?","boards":"রাজশাহী বোর্ড ২০২৫","options":["CaCO₃","Na₂CO₃","NaCl","CaCl₂"],"answerIndex":1,"explanation":"স্থায়ী খর পানিতে Na₂CO₃ যোগ করলে Ca²⁺ ও Mg²⁺ কার্বনেট রূপে অধঃক্ষিপ্ত হয়।\nCaCl₂+Na₂CO₃→CaCO₃↓ + 2NaCl\nফলে খরতা সৃষ্টিকারী আয়ন অপসারিত হয় এবং পানি মৃদু হয়।"},{"id":"ch9-mcq30","chapter":9,"num":30,"importance":2,"topic":"পানি","question":"নিচের কোনটি ভারী ধাতু?","boards":"বরিশাল বোর্ড ২০২৫","options":["Na","K","Pb","Zn"],"answerIndex":2,"explanation":"পাঠ্যবইয়ে পানিদূষণকারী ভারী ধাতু হিসেবে লেড (Pb), ক্যাডমিয়াম (Cd), মার্কারি (Hg) ও ক্রোমিয়াম (Cr) এর নাম আছে। অপশনের মধ্যে Pb এই তালিকায় আছে; এটি পানিতে মিশে ক্যানসারসহ কঠিন রোগ সৃষ্টি করে। Na ও K হালকা ক্ষার ধাতু।"},{"id":"ch9-mcq31","chapter":9,"num":31,"importance":2,"topic":"পানি","question":"2NH₃+H₂SO₄→A+H₂O; A যৌগ- (i) এর\nআণবিক ভর 132 (ii) হতে উদ্ভিদ নাইট্রোজেন ও সালফার গ্রহণ করে (iii) মাটিতে ব্যবহৃত হয় যখন মাটির pH \u003e 7 নিচের কোনটি সঠিক?","boards":"রাজশাহী বোর্ড ২০২৫","options":["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],"answerIndex":3,"explanation":"2NH₃+H₂
