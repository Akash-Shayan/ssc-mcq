মে্ব োি মধ্যে তলো কি।","answer":"উদ্দীপকের (i) েং প্মে্ব োটি ঊধ্ডপাতে এবং (ii) েং প্মে্ব োটি ি র র গলে। I2(s) \u003c=(+তাপ / -তাপ)=\u003e I2(g) ় ় (i) েং এ কঠ ি ে আনোপ্র্জনক তাপ রদনল তা তিনল পরিণত ো হয়ে ় ড সিাসরি ববাষ্প পরিণত হয় এবং বাষ্পনক ঠান্া করলে সিাসরি কঠ ি নে মিনি আনস। কঠ ি ে পদার্থডি তিল ো হয়ে সিাসরি ববাষ্প পরিণত হওোনক ঊধ্ডপাতে বলে। +তাপ S(s) ⟶ S(l) (ii) েং এ কঠ ি ে সালিািনক তাপ রদনল তা গনল তিল সালিানি ় ় ় ত পরিণত হয়। তাপ প্নোর্গ কঠ ি ে থেকে তিল অবস্থাে িূপান্িনক ি গলে বলে। ় ু মর্ল: দুটি ই তাপ গ্রহণকািী বিৌত প্মে্ব ো; কোনোটি নতই েতে পদাথড র র ততরি হয় ো, সংনকত একই থাকে। অমর্ল: ঊধ্ডপাতনে কঠ ি ে থেকে সিাসরি গ্যাস হয়, র্ানঝ তিল অবস্থা থাকে ো; গলনে কঠ ি ে থেকে তিল হয়। ঊধ্ডপারতত পদাথক ় ় ড ড ঠান্া করলে সিাসরি কঠ ি ে পাওয়া যায়, আি গললত সালিাি ঠান্া করলে আগে তিল থেকে কঠ ি নে ৈর্াট ানধ। ় ় সু তিাং, (i) ও (ii) উভয়ই বিৌত পরি তড ে হলেও (i) েং প্মে্ব োটি ঊধ্ডপাতে এবং (ii) েং প্মে্ব োটি গলে। ় ় রাসায়নিক রবভতর্ব যার কররণরবিাগ"}],"board":"ময়মনসিংহ বোর্ড ২০২৩"},{"id":"ch7-cq2","chapter":7,"num":2,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: (i)PbCl +Cl → PbCl 2 2 4 (ii)SO (g) + O (g) ⇌ SO (g) + িাপ 2 2 3","subQuestions":[{"label":"ক","question":"বিক্রিয়াি হার কাকে বলে? [৪ বোর্ডে এনসনছ] ় ু ্","answer":"একে সময়ে কোনো বিক্রিয়াি র মে্বেক বা উৎপানদি ঘেমানাি −1 বে পরি তড ে ঘনট, তানক ঐ বিক্রিয়াি হার বলে। এর একে mol L −1 s। ় ু ্"},{"label":"খ","question":"অযালুমর্রেোর্ ধাত র্ুকব াতানস িাখনল কী ধিনেি পরি তড ে হন? ব্যাখ্যা কি।","answer":"অযালুমর্রেোর্ ধাত র্ুকব াতানস িাখনল াতানসি অক্সিজেনের ় ় সাথে বিক্রিয়া করে এর পৃনঠে অযালুমর্রেোর্ অিাইনর্ি (Al O ) 2 3 টাইপ ভিততিক মাস্ট ার সাজেশন একটি পাতলা আ িণ ততরি হয়। এটি একটি রাসায়নিক পরি তড ে, ু ় কািণ এনত েতে পদাথড উৎপন্ন হয়। 4Al+3O →2Al O 2 2 3 3+ ় ় এখানে Al ৈারিত হয়ে Al এ পরিণত হয়। উৎপন্ন Al O এর ় ় আ িণটি ঘে ও অনিদয হওয়ায় তা বিতনভর ধাতনক াতাস ও জলীয় ববাষ্পি সংস্পশড থেকে িক্ষা করে, িনল অযালুমর্রেোনর্ি আি ় ় ক্ষে হয় ো।"},{"label":"গ","question":"জারণ-র জারণ এ ন ় ় েু কব হয়ে HCl উৎপন্ন করে। পানির সাথে ল র্ণি বিক্রিয়াে পানি ় র র্ল টট হয়ে েতে যৌগ গঠে করাে এটি আদ্ড বিশ্লেষণ (Hydrolysis) ্ র ্ ় ় ় র মে্ ব ো। (অরধক পানি ও তার্প বিক্রিয়াটি সম্পূর্ণ হয়ে Mg(OH)2 গঠে করে: MgCl +2H O → Mg(OH) +2HCl) 2 2 2 রবভতর্ ব যা (iii): পারনজযােন MgCl2(s)+7H O(l) → MgCl .7H O(s) 2 2 2 ় ় এখানে পানির অণু বিভবকব হয় ো; অর কৃ ত অবস্থাে নির্দিষ্ট সংখযক পানির অণু বকলাস পানি ছহনসন MgCl এর সাথে েুকব হয়ে আদ্ড 2 র লবণ C = MgCl .7H O গঠে করে। এজন্য এটি পানিনোৈে 2 2 ় ় (Hydration) বিক্রিয়া। ় ় ় রবষয রবভতর্ ব যা (ii) রবভতর্ ব যা (iii) র মে্ ব োি ধিে আদ্ড বিশ্লেষণ পানিনোৈে র ্ + − পানির অণু অবিভবকব থাকে H ও OH এ বিভবকব হয় উৎপাদ Mg(OH)Cl ও HCl MgCl .7H O (বকলাস 2 2 (েতে যৌগ) ্ পানিেুকব লবণ) টাইপ ভিততিক মাস্ট ার সাজেশন ় ় ় সু তিাং (ii) ও (iii) েং র মে্ ব যায় র মে্ ব েক একই হলেও পানির ় ় ় অংশগ্হর্ণি প্কৃ রত ভিন্ন হওয়ায় বিক্রিয়াি ধিে ভিন্ন—একটি র র আদ্ড বিশ্লেষণ, অপিটি পানিনোৈে। র ্"}],"board":"কুমিল্লা বোর্ড ২০২৬"},{"id":"ch7-cq5","chapter":7,"num":5,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: উদ্দীপজকর রবভতর্ব যাসমূ হ েেয কর : (i)A(s) + O (g) → AO (g) 2 2 (ii)2AO (g) + O (g) ⇌ 2AO (g); ΔH = -197kJ 2 2 3 ‘A’ একটি অধ্ািব মৌল যার পরমাণুর রনউরলযাজস ১৬টি কপ্াটন রবদযমান।","subQuestions":[{"label":"ক","question":"মোলাি আেতে কী?","answer":"একই তাপমানা ও চার্প বজনকানো গ্যাসীে পদার্থডি এক মোল বে ় ় আেতে দখল করে, তানক মোলাি আেতে বলে। STP বত বজনকানো গ্যাসের মোলাি আেতে 22.4 L।"},{"label":"খ","question":"‘আপেক্ষিক পারমাণবিক ভর এককর হীে িামশ’— ব্যাখ্যা কি।","answer":"কোনো মৌলের একটি পরমাণুর ভর একটি কার্বন-12 আইনসানটার্পি ভরের 1/12 অংর্শি তলযায় েতগুণ িািী, বসই সংখ্যানক ঐ মৌলের আপেক্ষিক পারমাণবিক ভর বলে। আথপততেক পারমাণরবক ির = একটি পরমাণুবিভবর / (একটি C-12 পরমাণুবিভবজরর 1/12 অংশ) এখানে ল ও হি উভয়ই ভর এবং একই একনক প্কামশত হয়। িনল ় ় িাগ করলে একে কাটাকাটি হয়ে যায় এবং শুধু একটি সংখ্যা পাওয়া যায়। যেমন: অক্সিজেনের আপেক্ষিক পারমাণবিক ভর 16, এর কোনো একে বেই। তাই আপেক্ষিক পারমাণবিক ভর এককর হীে িামশ।"},{"label":"গ","question":"উদ্দীপকের (i) েং বিক্রিয়াটি বকাে বকাে ধিনেি বিক্রিয়াি প্রতরেরধত করে েুপ্কব সহ ব্যাখ্যা কি। র ব","answer":"উদ্দীপকের ‘A’ মৌলের নিউক্লিয়াসে 16টি প্রোটন আনছ, অর্থাৎ এর পারমাণবিক সংখ্যা 16। সুতিাং A হলো অধাত সালিাি (S)। অতএ (i) েং বিক্রিয়াটি হলো: S(s)+O (g) → SO (g) 2 2 ় ্ ় এ বিক্রিয়াটি রেনম্ন াকব ধিনেি বিক্রিয়াি প্রতরেরধত করে: র ব ১. সংনোৈে বিক্রিয়া: দুটি মৌললক পদাথড S ও O পিস্পি েুকব হয়ে 2 ু একটি মান েতে যৌগ SO উৎপন্ন করেনছ। তাই এটি সংনোৈে 2 র মে্ ব ো। ২. দহয় বিক্রিয়া: সালিাি াতানসি অক্সিনৈনে পুনড় েীল মশখাসহ ় জ্নল SO উৎপন্ন করে এবং তাপ উৎপন্ন হয়। তাই এটি একটি ব 2 দহয় বিক্রিয়া। ় ় ় ৩. জারণ-র জারণ (বির্ি) বিক্রিয়া: বিক্রিয়াে S এর জারণ সংখ্যা 0 ্ ় ় ় থেকে বৃদ্ধি থপনে +4 হয়েছে, অর্থাৎ S ৈারিত হয়েছে; আ াি O ় ় এর জারণ সংখ্যা 0 থেকে হ্াস থপনে -2 হয়েছে, অর্থাৎ O র ৈারিত হয়েছে। 4+ − োরণ অধ্রবভতর্ব যা : S → S +4e − রবোরণ অধ্রবভতর্ব যা : O + 4e →2O 2 ় ় ় ় ৪. তার্পাৎপাদী বিক্রিয়া: বিক্রিয়াে তাপ রেগডত হয়, তাই এটি তার্পাৎপাদী বিক্রিয়া। ﻿ সু তিাং উদ্দীপকের (i) েং বিক্রিয়াটি একই সাথে সংনোৈে, দহয়, জারণ-র জারণ ও তার্পাৎপাদী বিক্রিয়া।"},{"label":"ঘ","question":"উদ্দীপকের (ii) েং বিক্রিয়াি সার্যা থাি উপর তাপ ও চার্পি প্রবণতা বিশ্লেষণ কি। [৯ বোর্ডে এনসনছ] র ্","answer":"উদ্দীপকের A হলো সালিাি। সুতিাং (ii) েং বিক্রিয়াটি হলো: 2SO (g)+O (g) ⇌ 2SO (g); ΔH = -197 kJ 2 2 3 এটি একটি উির্ুখী ও তার্পাৎপাদী বিক্রিয়া (ΔH ঋণাতমক)। লা- ় ় ় শানতললনেি েীরত অনুসারে, সার্যা থাে থাকা কোনো বিক্রিয়াি তাপমানা, চাপ বা ঘেমানা পরি তড ে করলে সার্যা থা এর্ে রদনক ় ় সনি যায় োনত ঐ পরি তড নেি িল প্শমর্ত হয়। িাথপর প্রবণতাব ় ় সম্মখর্ু খী র মে্ ব োটি তার্পাৎপাদী, তাই প্চাৎর্ু খী র মে্ ব োটি তাপহারী। তাপমানা াড় ানল সার্যা থা তাপ থশাষর্ণি রদনক অর্থাৎ ় ় ার্ রদনক সনি যায়, িনল SO3 এর উৎপাদে কনর্ যায়। আ াি তাপমানা কমানল সার্যা থা মানরদনক সনি যায় এবং SO এবিভব 3 ় ত উৎপাদে ানড়। তন তাপমানা খু কম হলে বিক্রিয়াি হার অতযন্ ় ্ কনর্ যায়। তাই মশল্র্ক্ষতরে (স্পশড পদধরতনত) V O প্রবণতা নকি প ্ 2 5 র ় ় উপমথরতনত প্রায় 450°C তাপমানা ব্যবহার করা হয়। িাথপর প্রবণতাব র মে্ ব জনকি রদনক গ্যাসের মোট মোল সংখ্যা = 2 + 1 = 3 এবং ় ় উৎপানদি রদনক গ্যাসের মোল সংখ্যা = 2। অর্থাৎ সম্মখর্ুখী বিক্রিয়াে ় ় গ্যাসের মোল সংখ্যা তথা আেতে হ্াস পায়। ় ় ় আয়তন হ্াস : 3 আয়তন → 2 আয়তন তাই চাপ াড় ানল সার্যা থা কম আেতনেি রদনক অর্থাৎ মানরদনক ় ্ ় সনি যায় এবং SO এর উৎপাদে বৃদ্ধি পায়। আ াি চাপ কমানল 3 ্ ় ় সার্যা থা ার্ রদনক সনি যায় এবং SO এর উৎপাদে হ্াস পায়। ি 3 র মশল্র্ক্ষতরে সাধারণত 1-2 atm চার্পই ের্থটট পরিমাণ SO পাওয়া প 3 যায়। ় ় ় সু তিাং, (ii) েং র মে্ ব যায় রেম্ন তাপমানা ও উচ্চ চাপ SO উৎপাদনেি 3 অেুকূ ল, আি উচ্চ তাপমানা ও রেম্ন চাপ সার্যা থাকে র মে্ব জনকি ় ় রদনক সরিনে দেয়।"}],"board":"ঢাকা বোর্ড ২০২৬"},{"id":"ch7-cq6","chapter":7,"num":6,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: (i)CaCO (s) → X(s) + Y(g) 3 (ii)CH (g) + 2O (g) ⇌ CO (g) + 2H O(g); ΔH = −ve 4 2 2 2","subQuestions":[{"label":"ক","question":"ভরর্াললে কাকে বলে? ় ়","answer":"ফরমালেন: ভরর্ালপ্র্হাইর্ (HCHO) এর 40% জলীয় দ্রবণনক 2 ভরর্াললে বলে। ় ়"},{"label":"খ","question":"সকল এসিড ও স ল ক্ষানভর প্শর্ে বিক্রিয়াে তার্পি মান ্ ় ΔH=−57.34kJ — ব্যাখ্যা কি। ় ় ্","answer":"স ল এসিড ও স ল ক্ষার জলীয় দ্রবণে সম্পূর্ণিূর্প র নোরৈত + − ় ় ় 2− হয়ে H ও OH আয়ন দেয়। যেমন: HCl(aq)+NaOH(aq)→NaCl(aq)+H O(l); ΔH = 2 −57.34kJ টাইপ ভিততিক মাস্ট ার সাজেশন + − ় ় ় ় এখানে Na ও Cl আয়ন বিক্রিয়াে অংশ বেে ো, শুধু দশডক আয়ন ছহনসন থাকে। প্কৃ তপর্ক্ষ প্রতটি স ল এসিড–স ল ক্ষানভর প্শর্নে র র কেবল রেনচি বিক্রিয়াটিই ঘনট: + − H (aq)+OH (aq)→H O(l); ΔH=−57.34kJ 2 + − বেনহত প্রত থক্ষতরে 1 mol H ও 1 mol OH মর্নল 1 mol পানি ় উৎপন্ন হয়, তাই স ল এসিড ও স ল ক্ষানভর প্শর্ে তার্পি মান স ডদা ΔH = −57.34kJ হয়। ় ়"},{"label":"গ","question":"উদ্দীপকের (i) েং বিক্রিয়াে উৎপন্ন গ্যাসটভর শোকবকিণ পিীক্ষা সর্ীকিণসহ বলখ।","answer":"উদ্দীপকের (i) েং বিক্রিয়াে CaCO বক তাপ রদনল র নোরৈত 3 ় ় হয়ে CaO (X) ও CO (Y) গ্যাস উৎপন্ন হয়। 2 Δ CaCO (s) ⟶ CaO(s)+CO (g) 3 2 সু তিাং উৎপন্ন গ্যাসটি হলো কার্বন র্াইঅক্সাইড (CO )। শনািবকরণ পরীো ু ্ ু ১. একটি বটস ট টি উন রকছ পরিমাণ স্বচ্ছ চনেি পানি [Ca(OH)2] ় ় রেনে তাি মধ্যে উৎপন্ন গ্যাসটি চালো করা হয়। ় ্ ় ২. বদখা যায় বে, স্ব চ্ছ চনেি পানি বঘালা হয়ে যায়। কািণ CO2, Ca(OH) এর সাথে বিক্রিয়া করে পানিনত অদ্রবণীে সাদা CaCO 2 র এর অধঃর্ক্ষপ ততরি করে। Ca(OH)2(aq)+CO (g) → CaCO (s)+H O(l) 2 3 ৩. বঘালা দ্রবণে আিও বেশি সময় ধনি CO চালো করলে দ্রবণটি র 2 ় ্ ় ় ় পু েিাে স্ব চ্ছ হয়ে যায়। কািণ পানিনত দ্রবণীে ক্যালসিয়াম ় াইকার্বনেট উৎপন্ন হয়। CaCO (s)+H O(l)+CO (g)→Ca(HCO3)2(aq) 3 2 2 ু ্ ় চনেি পানি প্রথমে বঘালা এবং পরে আ াি স্বচ্ছ হওয়ার মাধ্যমে ় প্র্ারণত হয় বে উৎপন্ন গ্যাসটি CO। 2"},{"label":"ঘ","question":"উদ্দীপকের (ii) েং বিক্রিয়াটভর উপর তাপ, চাপ ও ঘেমানাি প্রবণতা আনলাচো কি।","answer":"উদ্দীপকের (ii) েং বিক্রিয়াটি একটি উির্ুখী বিক্রিয়া, ো সার্যা থাে থাকে: CH (g)+2O (g) ⇌CO (g)+2H O(g); ΔH = −ve 4 2 2 2 ় ় লা-শানতললনেি েীরত অনুসারে, সার্যা থাে থাকা কোনো বিক্রিয়াে তাপমানা, চাপ বা ঘেমানাি কোনো একটি পরি তড ে করলে সার্যা থা বসই রদনক সনি যায় বেরদনক ঐ পরি তড নেি িল প্শমর্ত হয়। িাথপর প্রবণতাব র মে্ ব োটভর সম্মখর্ু খী রদক তার্পাৎপাদী (ΔH ঋণাতমক) এবং প্চাৎর্ুখী রদক তাপহারী। তাপমানা াড় ানল সার্যা থা তাপ থশাষর্ণি রদনক অর্থাৎ ার্ রদনক সনি যায়, িনল CO ও H O এর পরিমাণ 2 2 কনর্। আি তাপমানা কমানল সার্যা থা মান রদনক সনি যায়, িনল উৎপানদি পরিমাণ ানড়। িাথপর প্রবণতাব রবভতর্ ব যজকর কমাট কমাে সংখ্যা = 1 + 2 = 3mol (গ্যাস) উৎপাজদর কমাট কমাে সংখ্যা = 1 + 2 = 3mol (গ্যাস) ় ় ় র মে্ ব েক ও উৎপাদ উভয় পর্ক্ষ গ্যাসীে অণুি মোল সংখ্যা সমান ় ় ় হওয়ায় চাপ াড় ানল বা কমানল আেতনেি কোনো পরি তড ে হয় ো। তাই এ বিক্রিয়াি সার্যা থাি উপর চার্পি কোনো প্রবণতা বেই। ঘনমাতরার প্রবণতাব র মে্ ব েক CH বা O এর ঘেমানা াড় ানল সার্যা থা মান রদনক সনি 4 2 ি ় ় যায় এবং বেশি পরির্ার্ণ CO ও H O উৎপন্ন হয়। আ াি উৎপাদ 2 2 CO বা H O এর ঘেমানা াড় ানল সার্যা থা ার্ রদনক সনি যায়। 2 2 ি অপিরদনক উৎপাদ সরিনে রেনল সার্যা থা মান রদনক সনি যায়। ﻿ ় ় ় ় সু তিাং, (ii) েং র মে্ ব যায় তাপমানা কমানল ও র মে্ব জনকি ঘেমানা ্ ় াড় ানল উৎপাদ বৃদ্ধি পায়, কিন্তু চার্পি পরি তড নে সার্যা থাি কোনো বিভব পরি তড ে হয় ো।"}],"board":"দিনাজপুর বোর্ড ২০২৬"},{"id":"ch7-cq7","chapter":7,"num":7,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: (i)Zn + H SO →ZnSO +X (g) 2 4 4 2 (ii)HCl(aq) + NaOH(aq) → NaCl(aq) + H O(l) 2 ় (iii)FeSO +NaOH → Fe(OH) ↓ + Na SO 4 2 2 4","subQuestions":[{"label":"ক","question":"দহয় বিক্রিয়া কাকে বলে? [৮ বোর্ডে এনসনছ] ় ়","answer":"কোনো মৌল বা যৌগনক াতানসি অক্সিজেনের উপমথরতনত 3 ় ু ় পু প্ড় নে তাপ ও আনলাসহ েতে পদাথড উৎপন্ন করাি বিক্রিয়ানক দহয় র মে্ ব ো বলে। যেমন: CH + 2O → CO + 2H O+তাপ। 4 2 2 2 2"},{"label":"খ","question":"Ca-এর সর্বশেষ ইলেকট্রন দুটি 3d বত ো রগনে 4s এ যায় কেন? ব্যাখ্যা কি। 2 ় ়","answer":"ইলেকট্রন স ডদা রেম্ন শক্তি ি অরবিটালে আগে প্রবেশ করে (আউি াউ েীরত)। (n + l) মান োি কম তাি শক্তি কম। 4s অরবিটাজের (n+l) = 4 +0 = 4 3d অরবিটাজের (n+l) = 3+2 = 5 ় ় ় ় 4s এর শক্তি 3d এর বচনে কম হওয়ায় Ca(20) এর 3p পূর্ণ হওয়ার 2 2 ় ় পি থশষ দুটি ইলেকট্রন 3d বত ো রগনে 4s এ যায়: Ca(20) : 1s 2s 6 2 6 2 ় 2p 3s 3p 4s। ় ়"},{"label":"গ","question":"প্রমাণ অবস্থাে 5g X2 গ্যাসের অণুি সংখ্যা নির্ণয় কি। ় ় ়","answer":"উদ্দীপকের (i) েং বিক্রিয়াে রৈংক লঘু সালমিউরিক এসিডের ় সাথে বিক্রিয়া করে রৈংক সালনিট ও হাইরোজেন গ্যাস উৎপন্ন করে। ় ় Zn+H SO →ZnSO +H (g) 2 4 4 2 ি সু তিাং X2 গ্যাসটি হলো হাইরোজেন (H )। ্ 2 H এর আণরবক ির = 1×2 = 2 2 অর্থাৎ 2 g H = 1molH, এবং 1 mol H বত অণুি সংখ্যা 6.02 × 2 2 2 23 10 টি। 5 g H এর কমাে সংখ্যা = 5mol = 2.5mol 2 2 অণুর সংখ্যা = কমাে সংখ্যা × অযাজিাথগজ ব বা সংখ্যা ় ্ =2.5 × 6.02 × 1023 =1.505 × 1024 টি 24 সু তিাং প্রমাণ অবস্থাে 5 g X2 (H ) গযানস 1.505 × 10 টি অণু ি 2 আনছ। ় ় ় ়"},{"label":"ঘ","question":"উদ্দীপকের (ii) ও (iii) বিক্রিয়াে সাধারণ র মে্ব েক NaOH থাকা সনততও র মে্ ব োি ধিে একই হন রক? বিশ্লেষণ কি। ব ্","answer":"উদ্দীপকের (ii) ও (iii) উভয় বিক্রিয়াে NaOH র মে্বেক ছহনসন ় ় আনছ, ত ুও বিক্রিয়াি ধিে একই েে। ় ় (ii) নং রবভতর্ ব যা: প্শমন রবভতর্ ব যা HCl(aq)+NaOH(aq)→NaCl(aq)+H O(l) 2 এখানে এসিড (HCl) ও ক্ষার (NaOH) পিস্পি বিক্রিয়া করে লবণ + − ় (NaCl) ও পানি উৎপন্ন করেনছ। এসিডের H আয়ন ও ক্ষানভর OH ় ্ ় আয়ন েুকব হয়ে পানি ততরি করে: + − ় H (aq)+OH (aq)→H O(l) 2 টাইপ ভিততিক মাস্ট ার সাজেশন ় ় িনল এসিড ও ক্ষার উিনেি ধর্ম বলাপ পায় এবং দ্রবণ রেির্পক্ষ হয় (pH = 7)। তাই এটি একটি প্শর্ে বিক্রিয়া (এসিড-ক্ষারক বিক্রিয়া)। ় এনত তাপ উৎপন্ন হয়, অর্থাৎ এটি তার্পাৎপাদী। ় ় (iii) নং রবভতর্ ব যা: অধ্ঃথেপণ রবভতর্ব যা সর্তাকৃ ত সর্ীকিণ: FeSO +2NaOH→Fe(OH) ↓ + Na SO 4 2 এখানে FeSO লবণ ও NaOH ক্ষানভর দ্রবণ মর্প্শ্ত করলে উিনেি 4 র র ় ় ্ আয়ন পিস্পি থাে র রের্ে করে (ছদ-প্রতথাপে) এবং পানিনত ি ি অদ্রবণীে স ুৈ বর্ণি Fe(OH) অধঃর্ক্ষপ সৃটটি হে: র 2 2+ − Fe (aq)+2OH (aq)→Fe(OH) (s) ় ় ় এ বিক্রিয়াে কোনো এসিড অংশ বেেরে এবং পানিও উৎপন্ন হেরে, ় িং অদ্রবণীে কঠ ি ে পদাথড (অধঃর্ক্ষপ) উৎপন্ন হয়েছে। তাই এটি ় ় ় প্শর্ে বিক্রিয়া েে, এটি অধঃর্ক্ষপণ বিক্রিয়া। ় ় উভয় বিক্রিয়ানতই কোনো মৌলের জারণ সংখ্যাি পরি তড ে হেরে (Fe ় ় ় +2 ই িনেনছ), তাই কোনোটি ই বির্ি বিক্রিয়া েে; কিন্তু প্কৃ রত ভিন্ন। সু তিাং সাধারণ র মে্ব েক NaOH থাকা সনততও (ii) েং বিক্রিয়াটি ় ় প্শর্ে বিক্রিয়া এবং (iii) েং বিক্রিয়াটি অধঃর্ক্ষপণ বিক্রিয়া; অর্থাৎ র মে্ ব োি ধিে একই হন ো।"}],"board":"র্াদ্াসা বোর্ড ২০২৬"},{"id":"ch7-cq8","chapter":7,"num":8,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: (i)N (g) + O (g) ⇌ 2NO; ΔH = +180KJ 2 2 (ii)FeCl +Cl → FeCl 2 2 3","subQuestions":[{"label":"ক","question":"ইলেকট্রন আসপ্কব কাকে বলে? ় ়","answer":"গ্যাসীে অবস্থাে কোনো মৌলের এক মোল র ক্সচ্ছন্ পরমাণুনত ্ ় এক মোল ইলেকট্রন েুকব হয়ে এক মোল ঋণাতমক আয়নে পরিণত ্ ় হনত বে শক্তি রেগডত হয়, তানক ঐ মৌলের ইলেকট্রন আসপ্কব বলে।"},{"label":"খ","question":"রেেে একটি রেরকব ে গ্যাস— ব্যাখ্যা কি। র ্","answer":"রেেনেি (Ne) পারমাণবিক সংখ্যা 10। এর ইলেকট্রন বিন্যাস: 2 2 6 1s 2s 2p। ় ্ত রেেনেি সর্বশেষ শক্তিস্তরে 8টি ইলেকট্রন আনছ, অর্থাৎ অটট ক পূর্ণ। িনল এর ইলেকট্রন গ্রহণ, তযাগ বা থশোি করাি প্ ণতা বেই এবং র র এটি সাধারণত অেয মৌলের সাথে বিক্রিয়া করে ো, এক পরমাণুক অবস্থাে থাকে। ় ় তাই রেেে একটি রেরকব ে গ্যাস (গ্রুপ 18)। ্ র"},{"label":"গ","question":"বির্ি বিক্রিয়াি ধািণাি আনলানক (ii)েং বিক্রিয়াটি ব্যাখ্যা কি। ় ়","answer":"উদ্দীপকের (ii) েং বিক্রিয়াি সর্তাকৃ ত সর্ীকিণ: 2FeCl2 +Cl2 → 2FeCl3 ় ় বে বিক্রিয়াে একই সাথে জারণ (ইলেকট্রন তযাগ) ও র জারণ (ইলেকট্রন গ্রহণ) ঘনট, তানক বির্ি বিক্রিয়া বলে। র র FeCl2 বত Fe এর জারণ সংখ্যা +2 এবং FeCl3 বত Fe এর জারণ সংখ্যা +3। আ াি Cl2 বত Cl এর জারণ সংখ্যা 0 এবং FeCl3 বত -1। োরণ অধ্রবভতর্ব যা 2+ 3+ − 2Fe →2Fe +2e ﻿ ় 2+ 3+ ় ় ় Fe আয়ন ইলেকট্রন তযাগ করে Fe আয়নে পরিণত হয়েছে, ় 2+ জারণ সংখ্যা +2 থেকে +3 এ বৃদ্ধি থপনেনছ। তাই Fe ৈারিত হয়েছে। রবোরণ অধ্রবভতর্ব যা Cl +2e− →2Cl− 2 − ় ় Cl ইলেকট্রন গ্রহণ করে Cl আয়নে পরিণত হয়েছে, জারণ সংখ্যা 0 2 র র 2 4 ় ় ় থেকে -1 এ হ্াস থপনেনছ। তাই Cl র ৈারিত হয়েছে। 2 সামভগ্ক রবভতর্ব যা ় 2+ 3+ − 2Fe +Cl →2Fe +2Cl 2 এখানে FeCl ইলেকট্রন দাে করাে র জারক এবং Cl ইলেকট্রন 2 র 2 র 2 ন ় ় ড গ্রহণ করাে জারক ছহনসন কাৈ করেনছ। একই সাথে জারণ ও ় ় ় ় র জারণ ঘটাে (ii) েং বিক্রিয়াটি একটি বির্ি বিক্রিয়া। ় ় ়"},{"label":"ঘ","question":"লা-শানতললোি েীরতি আনলানক (i)েং বিক্রিয়াটভর সন ডাচ্চ পরিমাণ উৎপাদ ততরিনত তাপমানা ও চার্পি প্রবণতা বিশ্লেষণ কি।","answer":"লা-শানতললোি েীরত: কোনো উির্ুখী বিক্রিয়া সার্যা থাে ় থাকাকানল তাপমানা, চাপ বা ঘেমানাি কোনো একটি পরি তড ে উৎপানদি করলে সার্যা থা এর্ে রদনক সনি যায় োনত ঐ পরি তড নেি িল প্শমর্ত হয়। ় N (g)+O (g)⇌2NO(g); ΔH=+180kJ 2 2 িাপমাতরার প্রবণতাব ় ় র মে্ ব োটভর ΔH ধোতমক, অর্থাৎ সম্মখর্ুখী বিক্রিয়া তাপহারী এবং প্চাৎর্ুখী বিক্রিয়া তার্পাৎপাদী। তাপমানা াড় ানল সার্যা থা অরতরিকব তাপ থশাষর্ণি জন্য তাপহারী রদনক, অর্থাৎ সম্মখ রদনক সনি ় ় যায়। িনল বেশি NO উৎপন্ন হয়। তাপমানা কমানল সার্যা থা প্চাৎ রদনক সনি যায় এবং NO এর পরিমাণ কনর্। তাই সন ডাচ্চ পরিমাণ NO থপনত উচ্চ তাপমানা ় ় প্নোৈে। (এজন্যই জ্রপানতি সময় উচ্চ তার্প াতানসি N ও O র 2 2 ্ ় ় েু কব হয়ে NO ততরি হয়।) িাথপর প্রবণতাব ় ় ় গ্যাসীে বিক্রিয়াে চাপ াড় ানল সার্যা থা কম মোল গ্যাসের রদনক ্ এবং চাপ কমানল বেশি মোল গ্যাসের রদনক সনি। রবভতর্ ব যক পথে গযাজসর কমাে সংখ্যা = 1 + 1 = 2 উৎপাদ পথে গযাজসর কমাে সংখ্যা = 2 ় ় ় উভয় পর্ক্ষ গ্যাসের মোল সংখ্যা সমান হওয়ায় চাপ াড় ানল বা কমানল কোনো পর্ক্ষই আেতে হ্ানসি সুনোগ বেই। তাই চার্পি ় ় পরি তড নে এ বিক্রিয়াি সার্যা থাি কোনো পরি তড ে হয় ো, উৎপানদি পরিমাণও পরি রতিড ত হয় ো। ় ় সু তিাং (i) েং র মে্ ব যায় সন ডাচ্চ পরিমাণ NO উৎপাদনেি জন্য উচ্চ তাপমানা প্নোৈে, কিন্তু চার্পি কোনো প্রবণতা বেই। র র"}],"board":"র্াদ্াসা বোর্ড ২০২৬"},{"id":"ch7-cq9","chapter":7,"num":9,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: (i)N (g) + 3H (g) ⇌ 2NH (g); ΔH = (-) 2 2 3 (ii)HgCl +Hg → Hg Cl 2 2 2","subQuestions":[{"label":"ক","question":"মোলারিটি কাকে বলে? [২ বোর্ডে এনসনছ]","answer":"় ূ কমাোররটি : নির্দিষ্ট তাপর্াযায় প্রত ললটাি দ্রবণে দ্ ীিত দ্ন ি মোল র র র র সংখ্যানক ঐ দ্রবণেি মোলারিটি বলে। ় ় ় ়"},{"label":"খ","question":"রাসায়নিক সার্যা থা একটি গরতশীল অবস্থা— ব্যাখ্যা কি। [৪ ি ি বোর্ডে এনসনছ] ় ়","answer":"উির্ুখী বিক্রিয়াে বে অবস্থাে সম্মখর্ুখী বিক্রিয়াি হার ও ি ় ় প্চাৎর্ুখী বিক্রিয়াি হার সমান হয়, বসই অবস্থাকে রাসায়নিক সার্যা থা বলে। H (g)+I (g) ⇌ 2HI(g) 2 2 ় ় ় ় সার্যা থাে বিক্রিয়া থথনর্ যায় ো; সম্মখ রদনক র মে্ব েক থেকে উৎপাদ ি ু এবং একই হানি প্চাৎ রদনক উৎপাদ থেকে র মে্বেক অবিভবত উৎপন্ন হনত থাকে। িনল র মে্বেক ও উৎপানদি ঘেমানা মথি র্নে হলেও ় ় উভয় রদনকি বিক্রিয়া চলমান থাকে। তাই রাসায়নিক সার্যা থা একটি গরতশীল অবস্থা। ি ি ় ়"},{"label":"গ","question":"(ii) েং বিক্রিয়াে জারণ-র জারণ েুগপৎ ঘনট— ব্যাখ্যা কি। [৪ বোর্ডে এনসনছ] ় ় ়","answer":"বে বিক্রিয়াে ইলেকট্রন ৈড ে (জারণ) ও ইলেকট্রন গ্রহণ র র র (র জারণ) একই সাথে ঘনট, তানক জারণ-র জারণ বিক্রিয়া বলে। HgCl +Hg→Hg Cl 2 2 2 জারণ সংখ্যা নির্ণয়: • HgCl2 এ Hg এর জারণ সংখ্যা = +2 • র্ু কব Hg এর জারণ সংখ্যা = 0 • Hg Cl এ Hg এর জারণ সংখ্যা = +1 (কািণ 2x+2(-1) = 0, 2 2 x = +1) োরণ অধ্রবভতর্ব যা + − Hg→Hg +e ্ ্ র্ু কব Hg ইলেকট্রন তযাগ করে জারণ সংখ্যা 0 থেকে +1 এ বৃদ্ধি ় ় থপনেনছ, অর্থাৎ Hg ৈারিত হয়েছে (র জারক)। রবোরণ অধ্রবভতর্ব যা 2+ − + Hg +e →Hg HgCl এর Hg2+ ইলেকট্রন গ্রহণ করে জারণ সংখ্যা +2 থেকে +1 এ 2 র র ় ় হ্াস থপনেনছ, অর্থাৎ HgCl র ৈারিত হয়েছে (জারক)। র 2 সামভগ্ক রবভতর্ব যা Hg+Hg2+→2Hg+ HgCl +Hg→Hg Cl 2 2 2 2+ এখানে Hg বে ইলেকট্রন তযাগ করে, Hg ঠ ি ক বসই ইলেকট্রনটিই র র গ্রহণ করে। ইলেকট্রন ৈড ে ও গ্রহণ একই সাথে ঘটাে (ii) েং র র র ় ় র মে্ ব যায় জারণ-র জারণ েুগপৎ ঘনট। ় ্ ়"},{"label":"ঘ","question":"(i) েং বিক্রিয়াে সন ডাচ্চ উৎপাদ থপনত সার্যা থাে লা- ় ় শানতললোনেি েীরতি প্নোগ বিশ্লেষণ কি। র ্ টাইপ ভিততিক মাস্ট ার সাজেশন","answer":"(i) েং বিক্রিয়াটি বহ াি পদধরতনত অ্যামোনিয়া উৎপাদনেি উির্ুখী বিক্রিয়া: N (g)+3H (g)⇌2NH (g); ΔH = (-) 2 2 3 ় ় ় লা-শানতললোনভর েীরত: সার্যা থাে থাকা কোনো বিক্রিয়াি তাপমানা, চাপ বা ঘেমানাি কোনো একটি পরি তড ে করলে সার্যা থা ় ় এর্ে রদনক সনি যায় োনত ঐ পরি তড নেি িল প্শমর্ত হয়। ১. িাথপর প্রবণতাব র মে্ ব েক পর্ক্ষ মোট গ্যাসের মোল সংখ্যা 1 + 3 = 4 এবং উৎপাদ ় ় ় ় পর্ক্ষ 2। অর্থাৎ সম্মখর্ুখী বিক্রিয়াে আেতে হ্াস পায়। চাপ বৃদ্ধি ু র ্ করলে সার্যা থা কম বর্ানলি রদনক অর্থাৎ মান রদনক সনি যায় এবং ় ় NH এর উৎপাদে ানড়। তাই উচ্চ চাপ (প্রায় 200 atm) প্নোগ 3 র র করা হয়। টাইপ ভিততিক মাস্ট ﻿ ২. িাপমাতরার প্রবণতাব সম্মখর্ু খী র মে্ ব োটি তাপউৎপাদী (ΔH ঋণাতমক)। তাপমানা কমানল ন ় সার্যা থা তাপ উৎপন্ন হওয়ার রদনক অর্থাৎ মান রদনক সনি এবং NH ি 3 ় ় ত এর পরিমাণ ানড়। তন খু রেম্ন তাপর্াযায় বিক্রিয়াি হার অতযন্ ় ় কনর্ যায়। তাই অেুকূ ল তাপমানা প্রায় 450°C - 500°C এবং ় ূ ় র মে্ ব োি হার াড় ানত বলাহার চণড প্রবণতা ক ব্যবহার করা হয়। ৩. ঘনমাতরার প্রবণতাব ় র মে্ ব েক N ও H এর ঘেমানা াড় ানল অথ বা উৎপন্ন NH বক 2 2 3 ় ় শীতলীকির্ণি মাধ্যমে তিল করে বিক্রিয়া মর্শ্ণ থেকে সরিনে রেনল ় ় সার্যা থা মান রদনক সনি যায় এবং অরধক NH উৎপন্ন হয়। ি 3 Fe, 450°C, 200 atm N (g)+3H (g) ⟶ 2NH (g) 2 2 3 সু তিাং লা-শানতললোনভর েীরত অনুসারে উচ্চ চাপ, অেুকূ ল রেম্ন তাপমানা, র মে্ব জনকি উচ্চ ঘেমানা ও উৎপাদ অপসাির্ণি মাধ্যমে ় ় ় ় (i) েং বিক্রিয়াে সন ডাচ্চ পরিমাণ NH পাওয়া যায়। 3"}],"board":"রাজশাহী বোর্ড ২০২৬"},{"id":"ch7-cq10","chapter":7,"num":10,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: (i)N (g) + O (g) ⇌ 2NO(g); ΔH = +180kJ 2 2 (ii)Na + HNO →NaNO + 1 3 3 2H 2","subQuestions":[{"label":"ক","question":"পললর্ািকিণ বিক্রিয়া কাকে বলে? [৪ বোর্ডে এনসনছ]","answer":"় ় ় পলেমারকরণ রবভতর্ব যা: বে বিক্রিয়াে উচ্চ চার্প ও তার্প প্রবণতা নকি ় উপমথরতনত একই বা ভিন্ন ৈাতীে অসংখয বছাট অণু (র্নোর্াি) ্ ় পিস্পি েুকব হয়ে একটি ৃহৎ অণু (পললর্াি) গঠে করে, তানক পললর্ািকিণ বিক্রিয়া বলে। ় ্"},{"label":"খ","question":"পরমাণু তপ্ড় ৎ রেির্পক্ষ কেন? ব্যাখ্যা করো। ় ়","answer":"পরমাণুর নিউক্লিয়াসে ধোতমক চার্জ েুকব প্রোটন এবং ় ্ ত ্ নিউক্লিয়াসেি াইনি র ভিন্ন শক্তিস্তরে ঋণাতমক চার্জ েুকব ইলেকট্রন ল র থাকে। রেউ ট ে চার্জ র হীে। একটি বপ্াটনেি চার্জ +1 এবং একটি ইনলক ট নেি চার্জ -1, অর্থাৎ পরির্ার্ণ সমান কিন্তু র পিীত। পরমাণুনত প্রোটন ও ইনলক ট নেি সংখ্যা সমান থাকে, িনল মোট ধোতমক ও ঋণাতমক চার্জ পিস্পিনক প্শমর্ত করে। উদাহিণ: Na পরমাণুনত 11টি প্রোটন ও 11টি ইলেকট্রন থাকে। এজন্য পরমাণু তপ্ড় ৎ রেির্পক্ষ। ় ়"},{"label":"গ","question":"সার্যা থাে (i) েং বিক্রিয়াি উপর তার্পি প্রবণতা ব্যাখ্যা করো। [৫ বোর্ডে এনসনছ]","answer":"উদ্দীপকের (i) েং বিক্রিয়াটি একটি উির্ুখী বিক্রিয়া: N (g)+O (g)⇌2NO(g); ΔH=+180kJ 2 2 ় ় ় ΔH ধোতমক হওয়ায় সম্মখ বিক্রিয়াটি তাপহারী এবং প্চাৎর্ুখী র মে্ ব োটি তার্পাৎপাদী। ় ় লা-শানতললনেি েীরত অনুসারে, সার্যা থাে থাকা কোনো য থাি ি ি তাপমানা পরি তড ে করলে সার্যা থা এর্ে রদনক সনি যায় োনত ঐ পরি তড নেি িল প্শমর্ত হয়। ার সাজেশন ্ ্ • তাপমানা বৃদ্ধি করলে: অরতরিকব তাপ থশাষর্ণি জন্য সার্যা থা তাপহারী রদনক অর্থাৎ মান রদনক সনি যায়। িনল NO এর ্ ় উৎপাদে বৃদ্ধি পায়। • তাপমানা হ্াস করলে: তাপ উৎপাদনেি জন্য সার্যা থা তার্পাৎপাদী ় ় রদনক অর্থাৎ ার্ রদনক সনি যায়। িনল NO র নোরৈত হয়ে N ও ্ ় O এর পরিমাণ বৃদ্ধি পায়। 2 ্ ় ় সু তিাং (i) েং র মে্ ব যায় অরধক NO উৎপাদনেি জন্য উচ্চ তাপমানা ় ় অেুকূ ল। এজন্য জ্রপানতি সময় উচ্চ তাপর্াযায় াে়ুি N ও O ্ ় ় েু কব হয়ে NO উৎপন্ন হয়।"},{"label":"ঘ","question":"উদ্দীপকের (ii) েং বিক্রিয়াটিনত জারণ-র জারণ একই সাথে ঘনট— বিশ্লেষণ করো।","answer":"উদ্দীপকের (ii) েং বিক্রিয়াটভর সর্তাকৃ ত িূপ: 2Na+2HNO →2NaNO +H 3 3 2 ইলেকট্রন তযাগ জারণ এবং ইলেকট্রন গ্রহণ র জারণ। বিক্রিয়াটিনক র র র আয়নিক িূর্প ললর্খ পাই: 2Na+2H++2NO −→2Na++2NO −+H 3 3 − ় ় NO আয়ন অপরি রতিতড থাকে। তাই রেট বিক্রিয়ানক দুটি 3 ় ় ় অধডবিক্রিয়াে বলখা যায়: োরণ অধ্রবভতর্ব যা + − 2Na→2Na +2e + এখানে Na ইলেকট্রন তযাগ করে Na আয়নে পরিণত হয়েছে; Na ্ ় এর জারণ সংখ্যা 0 থেকে +1 এ বৃদ্ধি থপনেনছ। তাই Na ৈারিত হয়েছে এবং এটি র জারক। রবোরণ অধ্রবভতর্ব যা + − 2H +2e →H 2 + এখানে H আয়ন ইলেকট্রন গ্রহণ করে H অণুনত পরিণত হয়েছে; H র র 2 এর জারণ সংখ্যা +1 থেকে 0 বত হ্াস থপনেনছ। তাই H র ৈারিত হয়েছে এবং HNO জারক। 3 কমাট করডি রবভতর্ব যা + + 2Na+2H →2Na +H 2 Na বে 2টি ইলেকট্রন তযাগ করে, বসই 2টি ইলেকট্রনই H আয়ন র র গ্রহণ করে। ইলেকট্রন তযাগ ও গ্রহণ একই সাথে ো ঘটনল বিক্রিয়াটি র র র সম্পন্ হনত পািত ো। ় ় সু তিাং উদ্দীপকের (ii) েং বিক্রিয়াে জারণ ও র জারণ একই সাথে ঘনট, অর্থাৎ এটি একটি বির্ি বিক্রিয়া।"}],"board":"সিলেট বোর্ড ২০২৬"},{"id":"ch7-cq11","chapter":7,"num":11,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: (ii)Mg + H SO →MgSO +Y 2 4 4","subQuestions":[{"label":"ক","question":"নিঃসরণ কাকে বলে? [২ বোর্ডে এনসনছ]","answer":"সিু ছছদ্পর্থ কোনো গ্যাসের অণুসর্ূহ উচ্চ চাপ থেকে রেম্ন চাপ ় ় 2 অঞ্চনল ব রিনে আসাি প্মে্বোনক নিঃসরণ বলে। ্ ্"},{"label":"খ","question":"পরমাণু সার্মগ্করান চার্জ শূেয কেন? ব্যাখ্যা কি।","answer":"পরমাণুনত ধোতমক চার্জ েুকব প্রোটন এবং ঋণাতমক চার্জ েুকব ইলেকট্রন থাকে; রেউ ট ে চার্জ র হীে। একটি বপ্াটনেি চার্জ +1 এবং র র একটি ইনলক ট নেি চার্জ -1, অর্থাৎ মান সমান কিন্তু র পিীত। 2 2 র প্রতটি পরমাণুনত প্রোটন সংখ্যা ও ইলেকট্রন সংখ্যা সমান থাকে। র বিভবনল মোট ধোতমক চার্জ ও মোট ঋণাতমক চার্জ পিস্পিনক রেরকবে র ্ করে। যেমন: Na পরমাণুনত 11টি প্রোটন (+11) ও 11টি ইলেকট্রন (- 11)। তাই পরমাণু সার্মগ্করান চার্জ শূেয।"},{"label":"গ","question":"উদ্দীপকের (ii) েং বিক্রিয়াটি েুগপৎিান সংঘটি ত হে– ব্যাখ্যা কি। [৩ বোর্ডে এনসনছ] ﻿","answer":"উদ্দীপকের (ii) েং বিক্রিয়া: Mg+H SO →MgSO +H 2 2 4 4 2 অর্থাৎ Y হলো হাইরোজেন (H ) গ্যাস। আয়নিক িূর্প ললখনল: ্ 2 Mg+(2H++SO 2−)→(Mg2++SO 2−)+H 4 4 2 2+ োরণ অধ্-রবভতর্ব যা: Mg পরমাণু 2টি ইলেকট্রন তযাগ করে Mg ় ় আয়ন হয় (জারণ সংখ্যা 0 থেকে +2)। 2+ − Mg→Mg +2e + ় ় রবোরণ অধ্-রবভতর্ব যা: 2টি H আয়ন ঐ 2টি ইলেকট্রন গ্রহণ করে র র H অণু হয় (জারণ সংখ্যা +1 থেকে 0)। 2 + − 2H +2e →H 2 + Mg বে ইলেকট্রন তযাগ করে, H আয়ন ঠ ি ক বসই ইলেকট্রনই গ্রহণ র র র করে। ইলেকট্রন তযাগ (জারণ) ও ইলেকট্রন গ্রহণ (র জারণ) একটি র র র + ছাড় বা অেযটি ঘটনত পানি ো। ় ় সু তিাং (ii) েং র মে্ ব োটি একটি জারণ-র জারণ বিক্রিয়া, বেখানে জারণ ও র জারণ েুগপৎিান সংঘটি ত হয়। ্ ়"},{"label":"ঘ","question":"'X' ও 'Y' গ্যাস দুটি ি মধ্যে বকােটি দ্ুত ছপ্ড় নে পড় ন? গারণরতকরান বিশ্লেষণ কি।","answer":"X গ্যাস শনািব করণ: কাপড় কাচা বসার্া হলো সোডিয়াম + কার্বনেট (Na CO ) এবং ভিনেগার হলো ইথানয়িক এসিড 2 3 ় ় (CH COOH) এর লঘু জলীয় দ্রবণ। এরা বিক্রিয়া করে CO গ্যাস 3 র 2 উৎপন্ন করে। Na CO +2CH COOH→2CH COONa+CO +H O 2 3 3 3 2 2 সু তিাং X = কার্বন র্াইঅক্সাইড (CO )। 2 ্ ় ় Y গ্যাস শনািবকরণ: (ii) েং বিক্রিয়া অেুযায়ী Mg + H SO → 2 4 MgSO +H, সুতিাং Y = হাইরোজেন (H )। 4 2 ্ 2 গারণরিক রবজ্ল ে ষণ: একই তাপমানা ও চার্প গ্যাসের ব্যাপন হার আণর ক ভরের গডর্ূনলি যতােুপারতক। r ∝ 1/√M, অিএব r(H2) = √(M(CO )/M(H )) r(CO2) 2 2 আর্িা ৈারে, C = 12, O = 16, H = 1 M(CO ) = 12 + 16 × 2 = 44 2 M(H2) = 1 × 2 = 2 r(H2) 44 = √ = √22 ≈ 4.69 r(CO2) 2 বা, r(H2) ≈ 4.69 × r(CO2) ় ় অর্থাৎ H গ্যাসের আণর ক ভর CO অপেক্ষা অনেক কম হওয়ায় 2 2 H এর ব্যাপন হার CO এর প্রায় 4.69 গুণ। 2 2 র সু তিাং X (CO ) ও Y (H ) গ্যাসের মধ্যে Y অর্থাৎ H গ্যাস দ্ুত ় 2 2 2 ছপ্ড় নে পড় ন। টাইপ ভিততিক মাস্ট ার সাজেশন"}],"board":"কুমিল্লা বোর্ড ২০২৩","diagramId":"ch7-cq11"},{"id":"ch7-cq12","chapter":7,"num":12,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: (i)Na + O →Na O 2 2 (ii) HNO +Mg(OH) → 3 2 (iii) FeSO + NaOH → 4","subQuestions":[{"label":"ক","question":"মিটরকরভর সংনকত বলখ।","answer":"মিটরকরভর সংনকত: K SO ·Al (SO ) ·24H O 2 4 2 4 3 2 ় ়"},{"label":"খ","question":"কপূডি ঊধ্ডপারতত পদাথড— ব্যাখ্যা কি।","answer":"বে প্মে্ব যায় কোনো কঠ ি ে পদাথক তাপ রদনল তা তিনল ় ় ড পরিণত ো হয়ে সিাসরি ববাষ্প পরিণত হয় এবং বাষ্পনক ঠান্া করলে আ াি সিাসরি কঠ ি নে পরিণত হয়, তানক ঊধ্ডপাতে বলে। কপূডিনক ় ড তাপ রদনল তা ো গনল সিাসরি ববাষ্প পরিণত হয় এবং ঠান্া করলে ় ় আ াি কঠ ি ে কপূডি পাওয়া যায়। কপূডি (কঠ ি ে) \u003c=(তাপ / ঠান্া)=\u003e কপূডি ( বাষ্প) তাই কপূডি একটি ঊধ্ডপারতত পদাথড।"},{"label":"গ","question":"(i) েং সর্ীকিণটি বির্ি বিক্রিয়া—সর্ীকিণসহ ব্যাখ্যা কি। [২ বোর্ডে এনসনছ]","answer":"উদ্দীপকের (i) েং সর্ীকির্ণি সর্তাকৃ ত িূপ: 4Na+O →2Na O 2 2 + 2− ় ় Na2O একটি আয়নিক যৌগ (2Na +O )। আয়নিক িূর্প ললখনল: + 2− 4Na+O →2(2Na +O ) 2 োরণ অধ্-রবভতর্ব যা: প্রতটি Na পরমাণু 1টি ইলেকট্রন তযাগ করে + ় ় Na আয়ন হয় (জারণ সংখ্যা 0 থেকে +1)। + − 4Na→4Na +4e রবোরণ অধ্-রবভতর্ব যা: O অণুি প্রতটি O পরমাণু 2টি করে মোট 2 র 2− ় ় 4টি ইলেকট্রন গ্রহণ করে 2টি O আয়ন হয় (জারণ সংখ্যা 0 থেকে - র র 2)। − 2− O +4e →2O 2 এখানে Na র জারক ছহনসন ৈারিত হয় এবং O জারক ছহনসন 2 র ৈারিত হয়। ইনলক ট নেি আদাে-প্দানেি মাধ্যমে জারণ ও র জারণ একই সাথে ঘনট। ় ় সু তিাং (i) েং র মে্ ব োটি একটি বির্ি বিক্রিয়া (সংনোৈে বিক্রিয়াও নট)।"},{"label":"ঘ","question":"(ii) ও (iii) র মে্ ব ো একই ধিনেি রকো? সর্ীকিণ সম্পূর্ণকিণসহ ব্যাখ্যা কি।","answer":"(ii) নং রবভতর্ ব যা সম্পূ ণ কজর: 2HNO +Mg(OH) →Mg(NO ) +2H O 3 2 3 2 2 এখানে এসিড (HNO ) ও ক্ষার (Mg(OH) ) বিক্রিয়া করে লবণ ও 3 2 + ন ় পানি উৎপন্ন করে। এটি একটি প্শমন রবভতর্ব যা। এসিডের H ও − ক্ষানভর OH েুকব হয়ে পানি ততরি করে। + − H +OH →H O 2 (iii) নং রবভতর্ ব যা সম্পূ ণ কজর: FeSO4(aq)+2NaOH(aq)→Fe(OH) (s)+Na2SO4(aq) 2 ় ় ় এখানে দুটি দ্রবণীে লবণ ও ক্ষার বিক্রিয়া করে অদ্রবণীে সবু ে বর্ণের র র Fe(OH)2 অধ্ঃথেপ ততরি করে। এটি একটি অধ্ঃথেপণ রবভতর্ব যা। 2+ − Fe +2OH →Fe(OH)2(s) টাইপ ভ ﻿ ় ় ় ় ় ় ভমে: উভয় বিক্রিয়াে র মে্বজনকি আয়নগুনলা পিস্পি থাে র রের্ে করে এবং কোনো মৌলের জারণ সংখ্যাি পরি তড ে হয় ো (Mg +2, N +5, Fe +2, S +6, Na +1 অপরি রতিতড )। অর্থাৎ উভয়ই েে-বির্ি র মে্ ব ো। ় ় ় অভমে: (ii) েং বিক্রিয়াে এসিড ও ক্ষার প্শমর্ত হয়ে লবণ ও পানি ় ় ততরি হয় এবং তাপ উৎপন্ন হয়, কোনো অধঃর্ক্ষপ পনড় ো। কিন্তু (iii) ় ় ় ় েং বিক্রিয়াে এসিড-ক্ষার প্শর্ে েে, িং দ্রবণ থেকে অদ্রবণীে র র র অধঃর্ক্ষপ সৃটটি হয়। ় ় ় সু তিাং (ii) ও (iii) উভয়ই েে-বির্ি বিক্রিয়া হলেও একই ধিনেি েে ় ় — (ii) েং প্শর্ে বিক্রিয়া এবং (iii) েং অধঃর্ক্ষপণ বিক্রিয়া।"}],"board":"ঢাকা বোর্ড ২০২৪"},{"id":"ch7-cq13","chapter":7,"num":13,"importance":2,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: Na + H SO →X+H 2 4 2","subQuestions":[{"label":"ক","question":"উির্ুখী বিক্রিয়া কাকে বলে? [৫ বোর্ডে এনসনছ]","answer":"বে বিক্রিয়া একই সময়ে একই শনতড সম্মখ ও র পিীত উভয় রদনক ঘনট, অর্থাৎ র মে্ব েক থেকে উৎপাদ এবং উৎপাদ থেকে আ াি ় ় ় র মে্ ব েক ততরি হয়, তানক উির্ুখী বিক্রিয়া বলে। যেমন: N + 2 3H ⇌2NH 2 3"},{"label":"খ","question":"\"নাইট্রোজেনের আণর ক ভর 28\" - ব্যাখ্যা কি।","answer":"কোনো পদার্থডি একটি অণুনত উপমথত সকল পরমাণুর পারমাণবিক ভরের যোগিলনক ঐ পদার্থডি আণর ক ভর বলে। নাইট্রোজেনের পারমাণবিক ভর 14 এবং একটি নাইট্রোজেন অণুনত র র (N ) দুটি পরমাণু থাকে। 2 N এর আণরবক ির = 14×2 = 28 2 অর্থাৎ একটি নাইট্রোজেন অণুি ভর একটি C-12 আইনসানটার্পি ভরের 1/12 অংর্শি 28 গুণ। তাই নাইট্রোজেনের আণর ক ভর 28।"},{"label":"গ","question":"উদ্দীপকের X-যৌগে সালিানভর জারণ মান নির্ণয় কি।","answer":"উদ্দীপকের বিক্রিয়াটি সম্পূর্ণ করে ললখনল: 2Na+H SO →Na SO +H 2 4 2 4 2 অতএ, X হলো সোডিয়াম সালনিট (Na SO )। 2 4 ধরি, Na SO যৌগে S এর জারণ মান = x। Na এর জারণ মান = 2 4 +1 এবং O এর জারণ মান = -2। রেির্পক্ষ যৌগে সকল পরমাণুর জারণ র্ানেি যোগিল শূেয। (+1) × 2 + x + (-2) × 4 = 0 বা, 2 + x-8 = 0 বা, x = +6 সু তিাং X যৌগে (Na SO ) সালিানভর জারণ মান +6। 2 4"},{"label":"ঘ","question":"উদ্দীপকের বিক্রিয়াটিনত সর্ীকিণসহ বিশ্লেষণ কি- \"জারণ ছাড় বা ় ় র জারণ বিক্রিয়া সংঘটি ত হেরে\"।","answer":"উদ্দীপকের বিক্রিয়াটি: 2Na+H SO →Na SO +H 2 4 2 4 2 আয়নিক িূর্প ললখনল: 2Na+2H++SO 2−→2Na++SO 2−+H 4 4 2 2− ় ় ় SO আয়ন উভয় পার্শ অপরি রতিড ত থাকে। তাই প্কৃ ত বিক্রিয়া: 4 র ় + + 2Na+2H →2Na +H 2 + − জারণ অধড-বিক্রিয়া: 2Na → 2Na +2e (Na এর জারণ সংখ্যা 0 থেকে +1) িততিক মাস্ট ার সাজেশন + − র জারণ অধড-বিক্রিয়া: 2H + 2e → H (H এর জারণ সংখ্যা +1 2 থেকে 0) এখানে সোডিয়াম পরমাণু বে দুটি ইলেকট্রন তযাগ করেনছ, বসই দুটি + ইলেকট্রনই H আয়ন গ্রহণ করে H গযানস র ৈারিত হয়েছে। Na র র 2 + ইলেকট্রন তযাগ ো করলে H আয়ন ইলেকট্রন থপত ো, িনল র র ় ় র জারণ ঘটত ো। এ বিক্রিয়াে Na র জারক এবং H SO (H ) জারক। ় ় সু তিাং উদ্দীপকের বিক্রিয়াে জারণ ও র জারণ একই সাথে ঘনটনছ; ় ় জারণ ছাড় বা র জারণ বিক্রিয়া সংঘটি ত হেরে। রবথশষ ধ্রজনর রাসায়নিক রবভতর্ব যা"}],"board":"ময়মনসিংহ বোর্ড ২০২৪"},{"id":"ch7-cq14","chapter":7,"num":14,"importance":2,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: (i)FeCl +H S → FeCl + HCl + S 3 2 2 (ii)","subQuestions":[{"label":"ক","question":"প্শর্ে তাপ কাকে বলে?","answer":"ক্ষার ও এসিডের লঘু দ্রবণেি প্শর্নে 1 মোল পানি উৎপন্ন হলে র র ় বে পরিমাণ তাপ উৎপন্ন হয় তানক প্শর্ে তাপ বলে।"},{"label":"খ","question":"বর্ৌর্াছছি কার্নড় ক্ষতথানে চে লাগানো হয় কেন?","answer":"বর্ৌর্াছছি হুনল এসিডধর্ী পদাথড (ভরমর্ক এসিড) থাকে, ো ক্ষতথানে জ্ালার্পাড় বা সৃ টটি করে। চে (CaO) একটি ক্ষারক; এটি ি ব পানির সাথে Ca(OH)2 ততরি করে। এই ক্ষারক এসিক প্শমর্ত করে লবণ ও পানি উৎপন্ন করে, িনল জ্ালার্পাড় বা কনর্ যায়। তাই বর্ৌর্াছছি কার্নড় ক্ষতথানে চে লাগানো হয়।"},{"label":"গ","question":"উদ্দীপকের (i) েং বিক্রিয়াটি ইলেকট্রন থাোন্নভর মাধ্যমে ব্যাখ্যা বিভব দাও।","answer":"উদ্দীপকের (i) েং বিক্রিয়াি সর্তাকৃ ত িূপ: 2FeCl +H S→2FeCl +2HCl+S 3 2 2 আয়নিক িূপ: 3+ − + 2− (2Fe +6Cl ) + (2H +S ) 2+ − →(2Fe +4Cl ) + (2H জারণ অধড-বিক্রিয়া: 2− − S →S+2e র জারণ অধড-বিক্রিয়া: 3+ − 2 2Fe +2e → 2Fe 2− এখানে S আয়ন দুটি ইলেকট্রন তযাগ করে S এ ৈারিত হয় এবং 3+ বসই দুটি ইলেকট্রন 2টি Fe আয়ন গ্রহণ করে 2Fe র র + − ় ় হয়। H ও Cl আয়ন অপরি রতিতড থাকে। 2− 3+ ় ় সু তিাং (i) েং র মে্ ব যায় S থেকে Fe এ ইনলক H S র জারক ও FeCl জারক ছহনসন কাৈ করে। 2 3 ﻿"},{"label":"ঘ","question":"উদ্দীপকের (ii) েং এর বিক্রিয়াটি বকাে বকাে রাসায়নিক র মে্ ব োনক সর্থডে করে? বিশ্লেষণ কি।","answer":"উদ্দীপকের (ii) েং এ পানিনত AlCl যোগ করা হলে রেনচি 3 র মে্ ব ো ঘনট: AlCl3(s)+3H O(l) → Al(OH) (s)+3HCl(aq) 2 3 ক ় আদ্ রবজ্ল ে ষণ: এখানে পানি র মে্ব েক ছহনসন AlCl এর সাথে র 3 ় ু র মে্ ব ো করে দুটি েতে উৎপাদ Al(OH)3 ও HCl উৎপন্ন করেনছ। পানি অেয যৌগের সাথে বিক্রিয়া করে উৎপাদ ততরি করলে তা আদ্ড + র 2 4 বিশ্লেষণ বা পানি বিশ্লেষণ বিক্রিয়া। ্ ্ ূ অধ্ঃথেপণ: উৎপন্ন HCl পানিনত দ্ ীিত থাকে, কিন্তু Al(OH) র 3 ় ় ় ় পানিনত অদ্রবণীে হওয়ায় সাদা অধঃর্ক্ষপ ছহনসন পাতরেি তলাে ৈর্া ় ় হয়। তাই এটি অধঃর্ক্ষপণ বিক্রিয়াও। নন-করডি: বিক্রিয়াি আগে ও পরে Al এর জারণ সংখ্যা +3 এবং Cl এর −1 অপরি রতিতড থাকে, তাই এটি জারণ-র জারণ েে। সু তিাং (ii) েং র মে্ ব োটি একই সাথে আদ্ড বিশ্লেষণ (পানি বিশ্লেষণ) ও র ্ ্ অধঃর্ক্ষপণ বিক্রিয়ানক সর্থডে করে। ় ় রবভতর্ ব যার গরিজবগ বা রবভতর্ ব যার হার"}],"board":"চট্টগ্রাম বোর্ড ২০২৩","diagramId":"ch7-cq14"},{"id":"ch7-cq15","chapter":7,"num":15,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: (i)4Al(s) + 3O (g) → 2Al O (s) 2 2 3 (ii)CH (g) + 2O (g) → CO (g) + 2H O(g); ΔH = -890 4 2 2 2 kJ","subQuestions":[{"label":"ক","question":"তাপহারি বিক্রিয়া কাকে বলে? [৫ বোর্ডে এনসনছ]","answer":"় ় ় ় ় িাপহারর রবভতর্ব যা: বে রাসায়নিক বিক্রিয়াে তাপ থশারষত হয় অর্থাৎ ় ় ΔH ধোতমক হয়, তানক তাপহারি বিক্রিয়া বলে। যেমন: N + O → 2 2 2NO; ΔH = +180kJ।"},{"label":"খ","question":"পললরথে হলো ইরথললনেি পললর্াি— ব্যাখ্যা কি। ় ত","answer":"উচ্চ চার্প (1000 atm) ও উচ্চ তাপর্াযায় (200°C) সামানয অক্সিজেন বা প্রবণতা নকি উপমথরতনত অসংখয ইরথললে (CH =CH ) ি 2 2 ্ ় অণু পিস্পি েুকব হয়ে ৃহৎ অণু পললরথে গঠে করে। 1000 atm, 200°C nCH =CH ⟶ -(CH -CH ) - 2 2 2 2 n এখানে ইরথললে হলো র্নোর্াি এবং এর পুেিা ৃপ্কে একে - + − CH -CH - দ্বারা পললরথে গঠ ি ত। তাই পললরথে হলো ইরথললনেি +2Cl ) + S 2 2 পললর্াি। ় ় ু"},{"label":"গ","question":"(i) েং বিক্রিয়াটিনত কীিান ইনলক ট নেি থাোন্ি ঘনট — ব্যাখ্যা বিভব কি। ় ়","answer":"(i) েং বিক্রিয়াটি একটি জারণ-র জারণ বিক্রিয়া। এনত Al ধাত ইলেকট্রন তযাগ করে এবং O বসই ইলেকট্রন গ্রহণ করে। র 2 র র 2 2 6 2 1 Al (13) : 1s 2s 2p 3s 3p + 2 2 4 O (8) : 1s 2s 2p 3+ জারণ অধডবিক্রিয়া: প্রতটি Al পরমাণু 3টি ইলেকট্রন তযাগ করে Al 2+ র এ র ৈারিত ় ় আয়নে পরিণত হয়। 3+ − 4Al → 4Al +12e ট ে থাোন্ি ঘনট; বিভব র জারণ অধডবিক্রিয়া: প্রতটি O পরমাণু 2টি ইলেকট্রন গ্রহণ করে র র 2− ় ় O আয়নে পরিণত হয়। − 2− 3O +12e →6O টাইপ ভিততিক মাস্ট ার সাজেশন 2 ় ় উভয় অধডবিক্রিয়া যোগ করে, 3+ 2− 4Al +6O →2Al O 2 3 4Al(s)+3O (g) → 2Al O (s) 2 2 3 অর্থাৎ 4টি Al পরমাণু থেকে মোট 12টি ইলেকট্রন 6টি O পরমাণুনত ত ় থাোন্রিত হয়। Al এর জারণ সংখ্যা 0 থেকে +3 (ৈারিত, র জারক) এবং O এর জারণ সংখ্যা 0 থেকে -2 (র ৈারিত, জারক) হয়। এরান ় ় ত (i) েং বিক্রিয়াে Al থেকে O বত ইলেকট্রন থাোন্ি ঘনট। বিভব"},{"label":"ঘ","question":"(ii) েং বিক্রিয়াি সার্যা থাে তাপ ও চার্পি প্রবণতা বিশ্লেষণ কি। র ্ [৯ বোর্ডে এনসনছ]","answer":"(ii) েং বিক্রিয়া: CH (g) + 2O (g) ⇌ CO (g) + 2H O(g); 4 2 2 ΔH = -890 kJ ় ় লা-শানতললোনভর েীরত অনুসারে সার্যা থাে থাকা কোনো য থাি তাপমানা, চাপ বা ঘেমানা পরি তড ে করলে সার্যা থা এর্ে রদনক ় ় সনি যায় োনত ঐ পরি তড নেি িল প্শমর্ত হয়। িাথপর প্রবণতাব ় ় র মে্ ব োটভর ΔH ঋণাতমক, অর্থাৎ সম্মখর্ুখী বিক্রিয়া তাপউৎপাদী এবং প্চাৎর্ুখী বিক্রিয়া তাপহারি। • তাপমানা বৃদ্ধি করলে সার্যা থা তাপ থশাষর্ণি রদনক অর্থাৎ ার্ রদনক (প্চাৎর্ুখী) সনি যায়; িনল CO ও H O এর পরিমাণ 2 2 কনর্। • তাপমানা হ্াস করলে সার্যা থা তাপ উৎপাদনেি রদনক অর্থাৎ মান বিভব রদনক (সম্মখর্ুখী) সনি যায়; িনল উৎপানদি পরিমাণ ানড়। িাথপর প্রবণতাব ় ় রবভতর্ ব যজকর গ্যাসীয কমাে সংখ্যা = 1 + 2 = 3 উৎপাজদর গ্যাসীয কমাে সংখ্যা = 1 + 2 = 3 ় ় উভয় রদনক গ্যাসীে অণুি মোল সংখ্যা সমান (Δn = 0) হওয়ায় চাপ াড় ানল বা কমানল কোনো রদনকই আেতে কনর্ বা ানড় ো। তাই এ র মে্ ব োি সার্যা থাি উপর চার্পি কোনো প্রবণতা বেই। ় ় সু তিাং (ii) েং র মে্ ব োি সার্যা থাে রেম্ন তাপমানা উৎপাদ গঠনেি অেুকূ ল এবং উচ্চ তাপমানা প্রতকূ ল; কিন্তু চার্পি পরি তড নে সার্যা থাি কোনো পরি তড ে হয় ো।"}],"board":"চট্টগ্রাম বোর্ড ২০২৬"},{"id":"ch7-cq16","chapter":7,"num":16,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: (i) N O (g) + িাপ ⇌ 2NO (g) 2 4 2 (ii)2FeCl +H S → 2FeCl + 2HCl + S 3 2 2 ড ়","subQuestions":[{"label":"ক","question":"িযান্াি ওোলস আকর্ষণ ল কাকে বলে?","answer":"্ ় িযান্ার ওযােস আকষণ বে: সমযোজী অণুসর্ূনহি মধ্যে র দযমান ত ড ় দু ড ল আন্ঃআণর ক আকর্ষণ লনক িযান্াি ওোলস আকর্ষণ ল বলে। ় ় ়"},{"label":"খ","question":"আদ্ড বিশ্লেষণ বিক্রিয়া লনত কী ব াঝ? ব্যাখ্যা কি। র ্ ় ়","answer":"বে বিক্রিয়াে কোনো যৌগ পানির সাথে বিক্রিয়া করে র নোরৈত ় ু ন হয়ে দুই বা তনতারধক েতে যৌগ উৎপন্ন করে, তানক আদ্ড বিশ্লেষণ বা পানি বিশ্লেষণ বিক্রিয়া বলে। + − ় ় এ বিক্রিয়াে পানির অণু H ও OH এ বিনে যৌগের র ভিন্ন অংর্শি ্ ় ় সাথে েু কব হয়। যেমন: অযালুমর্রেোর্ ক্লোরাইক পানিনত যোগ ﻿ ় করলে অযালুমর্রেোর্ হাই বিাইর্ ও হাইন বান্ারিক এসিড উৎপন্ন ্ ্ ল হে: AlCl +3H O→Al(OH) +3HCl 3 2 3"},{"label":"গ","question":"(ii) র মে্ ব যায় বকােটি র জারক পদাথড? ব্যাখ্যা কি। ় ় ্ ়","answer":"বে পদাথড ইলেকট্রন তযাগ করে রেনৈ ৈারিত হয় এবং অপি পদাথক র ৈারিত করে, তানক র জারক বলে। 2FeCl +H S→2FeCl +2HCl+S 3 2 2 জারণসংখ্যা বিশ্লেষণ: FeCl এ Fe এর জারণসংখ্যা +3 এবং FeCl ্ 3 2 3+ এ +2; অর্থাৎ Fe ইলেকট্রন গ্রহণ করে র ৈারিত হয়েছে। আ াি 2 র র H S এ S এর জারণসংখ্যা -2 এবং র্ুকব S এ 0; অর্থাৎ S এর 2 ্ ় জারণসংখ্যা বৃদ্ধি থপনেনছ। 2− − জারণ: S →S+2e 3+ − 2+ র জারণ: 2Fe +2e →2Fe এখানে H S ইলেকট্রন তযাগ করে রেনৈ ৈারিত হয়েছে এবং FeCl 2 র 3 ় ় বক র ৈারিত করে FeCl2 এ পরিণত করেনছ। সুতিাং (ii) বিক্রিয়াে H S র জারক পদাথড (এবং FeCl জারক পদাথড)। 2 3 ় ় ়"},{"label":"ঘ","question":"(i) েং বিক্রিয়াে কীিান উৎপাদ বৃদ্ধি করা যায় তা লা- শানতললোি েীরতি আনলানক বিশ্লেষণ কি।","answer":"লা-শানতললোি েীরত: সার্যা থাে থাকা কোনো উির্ুখী বিক্রিয়াি তাপমানা, চাপ বা ঘেমানাি কোনো একটি ি পরি তড ে ঘটানল সার্যা থা এর্ে রদনক সনি যায় োনত ঐ পরি তড নেি িল প্শমর্ত হয়। N O (g) + তাপ ⇌ 2NO (g) 2 4 2 িাপমাতরার প্রবণতাব ় ় র মে্ ব োটভর সম্মখর্ু খী রদক তাপহারী (তাপ থশারষত হে)। তাপমানা ্ ় ৃ ছদধ করলে সার্যা থা বসই রদনক সনি োন বেরদনক তাপ থশারষত হয়, অর্থাৎ সম্মখ রদনক। িনল NO এর উৎপাদে বৃদ্ধি পান। ু 2 ্ ় ় িাথপর প্রবণতাব র মে্ ব েক রদনক গ্যাসের মোল সংখ্যা 1 এবং উৎপাদ রদনক 2। চাপ কমানল সার্যা থা বসই রদনক সনি যায় বেরদনক মোল সংখ্যা তথা আেতে বেশি, অর্থাৎ সম্মখ রদনক। িনল চাপ হ্াস করলে NO এর ু র 2 উৎপাদে বৃদ্ধি পান। ঘনমাতরার প্রবণতাব ় ্ র মে্ ব েক N O এর ঘেমানা বৃদ্ধি করলে অথ বা উৎপন্ন NO বক 2 4 ্ 2 ় ় ় র মে্ ব ো মর্শ্ণ থেকে সরিনে রেনল সার্যা থা সম্মখ রদনক সনি যায় র ু ্ ় এবং NO এর উৎপাদে বৃদ্ধি পায়। 2 ্ ় ্ অতএ, লা-শানতললোি েীরত অনুসারে তাপমানা বৃদ্ধি, চাপ হ্াস, ্ র ্ N O এর ঘেমানা ব 414, 326, 244, 431 kJ/mol] (ii)N (g) + O (g) + 180kJ ⇌ 2NO(g). 2 2 ্","subQuestions":[{"label":"ক","question":"ন্ধে শক্তি কাকে বলে? ় ়","answer":"দুইটি পরমাণুর র্ধযকাি ন্ধে বিনে পরমাণু দুটি নক আলাদা ্ ় কিনত বে শক্তি রদনত হয় বা দুইটি পরমাণুর মধ্যে ন্ধে ততরি হলে বে ় ্ ্ ্ শক্তি রেগডত হয়, তানক ন্ধে শক্তি বলে।"},{"label":"খ","question":"Na CO এর জলীয় দ্রবণ ক্ষারীে— ব্যাখ্যা কি। 2 3 র","answer":"Na CO পানিনত আদ্ড র ন্লরষত হয়ে NaOH ও H CO উৎপন্ন 2 3 র ্ করে। Na CO +2H O→2NaOH+H CO 2 3 2 NaOH একটি তী র ক্ষার, ো পানিনত সম্পূর্ণ র নোরৈত হয়ে প্চি ় ় OH- আয়ন দেয়; কিন্তু H CO একটি দু ডল এসিড, ো খু সামানয 2 3 ় ় H+ আয়ন দেয়। ় ় িনল দ্রবণে OH- আয়নেি ঘেমানা H+ আয়নেি বচনে বেশি হয় (pH ় ় \u003e 7)। তাই Na CO এর জলীয় দ্রবণ ক্ষারীে। 2 3 র ﻿"},{"label":"গ","question":"উদ্দীপকের (i) েং বিক্রিয়াটভর ΔH এর মান নির্ণয় কি। [৩ বোর্ডে এনসনছ]","answer":"উদ্দীপকের (i) েং বিক্রিয়া: C H +Cl →C H Cl+HCl 2 6 2 2 5 ় ় এ বিক্রিয়াে C H এর 1 মোল C-H ন্ধে ও Cl এর 1 মোল Cl-Cl 2 6 2 ় ন্ধে িানে এবং 1 মোল C-Cl ও 1 মোল H-Cl ন্ধে ততরি হয় (C-C ও ারক C-H ন্ধে অপরি রতিতড থাকে)। ় ্ ় ় ্ রবভতর্ ব যজকর বন্ ধ ন িাঙজি প্জযােনীয শততিব, B =(414 + র 1 244)kJ = 658kJ ্ ক ্ উৎপাজদর বন্ ধন গেজন রনগি শততিব, B2 = (326 + 431)kJ = 757kJ ΔH = B -B = (658-757)kJ = -99kJ 1 2 ় ় ় অতএ, (i) েং বিক্রিয়াি ΔH = -99kJ/mol; ΔH ঋণাতমক হওয়ায় র মে্ ব োটি তার্পাৎপাদী। 2"},{"label":"ঘ","question":"উদ্দীপকের (ii) েং বিক্রিয়াটভর সার্যা থাি উপর তাপ ও চার্পি প্রবণতা —বিশ্লেষণ কি। [৪ বোর্ডে এনসনছ] র ্","answer":"উদ্দীপকের (ii) েং বিক্রিয়াটি উির্ুখী ও তাপহারী (সম্মখ রদনক 180 kJ তাপ থশারষত হে): N (g)+O (g)⇌2NO(g); ΔH = +180kJ 2 2 ় ় ় িাথপর প্রবণতাব: লা-শানতললোি েীরত অনুসারে তাপহারী বিক্রিয়াে তাপমানা াড় ানল মসনস ট র্ অরতরিকব তাপ থশাষণ কিনত সম্মখ ় ় র মে্ ব ো বেশি ঘটাে। িনল সার্যা থা র্ানে সনি এবং NO এর উৎপাদে ানড়। তাপমানা কমানল সার্যা থা ানর্ সনি এবং NO সংখ্যা ় বিনে N ও O উৎপন্ন হয়। 2 2 ় ় িাথপর প্রবণতাব: র মে্ব েক পর্ক্ষ মোট গ্যাসীে মোল = 1 + 1 = 2 এবং (ii) েং এর ় ় ় উৎপাদ পর্ক্ষ = 2। উভয় পর্ক্ষ মোল সংখ্যা সমান হওয়ায় চাপ ় ় াড় ানল বা কমানল আেতনেি কোনো পরি তড ে হয় ো। তাই চার্পি কোনো প্রবণতা বেই। ় ় ় সু তিাং, (ii) েং র মে্ ব যায় উচ্চ তাপর্াযায় NO এর উৎপাদে ানড়, কিন্তু চাপ পরি তড ে সার্যা থাকে প্রবণতার ত করে ো।"}],"board":"চট্টগ্রাম বোর্ড ২০২৫"},{"id":"ch8-cq3","chapter":8,"num":3,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: (i)C2H6(g) + Cl2(g) → C2H5Cl(g) + HCl(g) + 481kJ [এখ্াজন, C-H = 414kJ/mol, Cl-Cl = 244kJ/mol, H-Cl = 431kJ/mol] (ii)N (g) + 3H (g) ⇌ 2NH (g); ΔH = -92kJ/mol. 2 2 3","subQuestions":[{"label":"ক","question":"সুপ্ যোজনী কাকে বলে? [২ বোর্ডে এনসনছ]","answer":"কোনো মৌলের সন ডাচ্চ যোজনী ও কোনো যৌগে তাি সমে্ব ে যোজনীি পাথডকযনক ঐ মৌলের সুপ্ যোজনী বলে। যেমন: FeCl 2 যৌগে Fe এর সমে্ব ে যোজনী 2, সন ডাচ্চ যোজনী 3; তাই সুপ্ যোজনী 2 3 1। 2"},{"label":"খ","question":"He বক গ্রুপ-২ এ িাখা হেরে কেন? ব্যাখ্যা কি। ় ্ ়","answer":"ছহললোনর্ি (He) পারমাণবিক সংখ্যা 2; ইলেকট্রন বিন্যাস 1s। 2 3 ত ় ় ় ইলেকট্রন বিন্যাস অনুসারে এর সর্বশেষ তনি 2টি ইলেকট্রন থাকাে ু র র এনক গ্রুপ-২ এ িাখাি কথা। ্ ত ্ত কিন্তু He এর একমাে শক্তিস্তর (প্থর্ শক্তিস্তর) 2টি ইনলক ট নে সম্পূর্ণ পূ ণড, তাই এটি মথরতশীল ও রেরকবে; কোনো ইলেকট্রন তযাগ, ি র ্ র ় ় গ্রহণ বা থশোি করে ো। অপিরদনক গ্রুপ-২ এর মৌলগুনলা (Be, র র টাইপ ভিততিক মাস্ট ার সাজেশন ় ু Mg, Ca) সমে্বে ধাত, োিা 2টি ইলেকট্রন তযাগ করে ধোতমক আয়ন গঠে করে। ় ় ় He এর ধর্ম রেরকবে গ্যাস Ne, Ar এর র্নতা হওয়ায় এনক গ্রুপ-২ এ ো ্ র বির্খ গ্রুপ-১৮ এ িাখা হয়েছে।"},{"label":"গ","question":"(i) েং বিক্রিয়া C-Cl এর ন্ধে শক্তি নির্ণয় কি। [৩ বোর্ডে এনসনছ]","answer":"উদ্দীপকের (i) েং বিক্রিয়া: C H (g)+Cl2(g) → C2H5Cl(g)+HCl(g)+481kJ 2 6 ় ় ় র মে্ ব যায় 481 kJ তাপ উৎপন্ন হয়, তাই ΔH = -481 kJ। এ বিক্রিয়াে ইর্থনেি 1টি C-H ন্ধে ও 1টি Cl-Cl ন্ধে িানে এবং 1টি C-Cl ও ় 1টি H-Cl ন্ধে গঠ ি ত হয়। ইর্থনেি C-C ন্ধে ও ারক 5টি C-H ন্ধে অপরি রতিতড থাকে। ্ ধরি, C-Cl ন্ধে শক্তি = x kJ/mol ় ় ় ্ ্ ্ রবভতর্ ব যজকর বন্ ধ ন িাঙজি প্জযােনীয শততিব, B =(414 + র 1 244)kJ = 658kJ ্ ্ ক ্ উৎপাজদর বন্ ধন গেজন রনগি শততিব, B2 = (x + 431)kJ ΔH = B1 − B2 বা, -481 = 658-(x + 431) বা, -481 = 227 - x ∴ x = 708kJ/mol ় ্ সু তিাং, উদ্দীপকের তথয অেুযায়ী C-Cl ববন্ধনের ন্ধে শক্তি 708 kJ/mol। ় ্ ়"},{"label":"ঘ","question":"(ii) েং বিক্রিয়াটভর সার্যা থাি উপর তাপ ও চার্পি প্রবণতা বিশ্লেষণ কি। [৩ বোর্ডে এনসনছ]","answer":"উদ্দীপকের (ii) েং বিক্রিয়াটি বহ াি পদধরতনত অ্যামোনিয়া উৎপাদনেি উির্ুখী বিক্রিয়া: N (g)+3H (g)⇌2NH (g); ΔH=-92kJ/mol 2 2 3 ় ় ় লা-শানতললোি েীরত অনুসারে, সার্যা থাে থাকা বিক্রিয়াি তাপমানা বা চাপ পরি তড ে করলে সার্যা থা এর্ে রদনক সনি যায় োনত ঐ পরি তড নেি প্রবণতা প্শমর্ত হয়। র বিভবাথপর প্রবণতাব: ΔH ঋণাতমক, তাই সম্মখ বিক্রিয়াটি তার্পাৎপাদী এবং র ু প্চাৎর্ুখী বিক্রিয়াটি তাপহারী। তাপমানা াড় ানল মসনস ট র্ অরতরিকব তাপ থশাষণ কিনত চাে, িনল সার্যা থা ানর্ সনি এবং NH বিনে ি 3 ় N ও H উৎপন্ন হয়। তাপমানা কমানল সার্যা থা র্ানে সনি এবং 2 2 ি ় ় NH এর পরিমাণ ানড়। তন খু কম তাপর্াযায় বিক্রিয়াি হার 3 ত ় অতযন্ কনর্ যায়; তাই Fe প্রবণতা নকি উপমথরতনত 450°C-550°C তাপমানা ব্যবহার করা হয়। িাথপর প্রবণতাব: র মে্ব জনকি মোট মোল সংখ্যা (1 + 3) = 4 এবং উৎপানদি মোল সংখ্যা 2। চাপ াড় ানল সার্যা থা কম বর্ানলি রদনক অর্থাৎ র্ানে সনি এবং NH এর পরিমাণ ানড়। চাপ কমানল 3 ় সার্যা থা ানর্ সনি এবং NH বিনে N ও H উৎপন্ন হয়। তাই ি 3 2 2 মশল্র্ক্ষতরে 200-250 atm উচ্চ চাপ ব্যবহার করা হয়। N (g)+3H (g) \u003c=(Fe, 200-250 atm, 450°C-550°C)=\u003e 2 2 2NH (g); ΔH = -92 kJ 3 ় ় সু তিাং, (ii) েং র মে্ ব যায় রেম্ন তাপমানা ও উচ্চ চাপ NH উৎপাদনেি 3 অেুকূ ল; াতন হার ও উৎপাদ দুনটাই র ন চো করে প্রবণতা কসহ ় ় র্াঝারি তাপমানা ও উচ্চ চার্প বিক্রিয়াটি ঘটানো হয়।"}],"board":"দিনাজপুর বোর্ড ২০২৪"},{"id":"ch8-cq4","chapter":8,"num":4,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: N (g) + O (g) ⇌ 2NO(g), এখ্াজন N=O, O=O এবং N≡N 2 2 ্ ্ ্ এর বন্ ধ ন শততিব যোতরব্ জম 632kJ/mole, 498kJ/mole এবং 946kJ/mole.","subQuestions":[{"label":"ক","question":"বোৈযতা ইলেকট্রন কাকে বলে? টাইপ ভি ﻿ ় ় ় ়","answer":"পরমাণুর স ড ছহঃথ শক্তিস্তরে অ মথত ইনলক ট জনক বোৈযতা ি ি র ় ় ইলেকট্রন বলে। ় ় ় ়"},{"label":"খ","question":"রেউর্োি মিশে বিক্রিয়া লনত কী ুঝাে? [২ বোর্ডে এনসনছ] ় ়","answer":"বে রেউর্োি প্মে্বযায় কোনো ড় ও িািী মৌলের রেউর্োস ল ল ় ় বিনে বছাট বছাট মৌলের নিউক্লিয়াসে পরিণত হয় এবং বসই সাথে ু ্ ় ় ় রেউ ট ে ও প্চি শক্তি উৎপন্ন হয়, তানক রেউর্োি মিশে বিক্রিয়া র ল বলে। ্ ় ় যেমন: স্ব ল্গরতি রেউ ট ে দিয়ে U-235 রেউর্োসনক আঘাত করলে প র ল ় ় তা প্রায় দুটি সমান অংর্শ বিনে Ba-141 ও Kr-92 রেউর্োস, ু ্ রতেটি রেউ ট ে ও প্চি শক্তি উৎপন্ন করে। 235U+1n→141Ba+92Kr+31n+শক্তি"},{"label":"গ","question":"(i) েং বিক্রিয়াটভর থক্ষতরে ΔH এর মান নির্ণয় কি। [২ বোর্ডে এনসনছ] ় ় ়","answer":"উদ্দীপকের বিক্রিয়া: N (g)+O (g)⇌2NO(g) 2 2 গাঠরেক সংনকত অেুযায়ী: N≡N+O=O ⇌ 2(N=O)। এখানে 1 মোল N≡N ও 1 মোল O=O ন্ধে িানে এবং 2 মোল N=O ন্ধে গঠ ি ত হয়। ় ্ ্ ় ় ্ রবভতর্ ব যজকর বন্ ধ ন িাঙজি প্জযােনীয শততিব, B =(1×946)+ র 1 (1 × 498) = 1444kJ ্ ক ্ উৎপাজদর বন্ ধন গেজন রনগি শততিব, B2 = 2 × 632 = 1264kJ ΔH = B -B = (1444-1264)kJ = +180kJ 1 2 ় ় ় ় অতএ, বিক্রিয়াটভর ΔH = +180kJ; ΔH ধোতমক হওয়ায় বিক্রিয়াটি তাপহারী। ় ়"},{"label":"ঘ","question":"উদ্দীপকের বিক্রিয়াে সার্যা থাে চাপ ও ঘেমানাি প্রবণতা লা শানতললনে েীরতি সাহানেয বিশ্লেষণ কি। [২ বোর্ডে এনসনছ]","answer":"উদ্দীপকের বিক্রিয়াটি উির্ুখী এবং সকল র মে্বেক ও উৎপাদ গ্যাসীে: N (g)+O (g)⇌2NO(g); ΔH = +180kJ 2 2 ় ় ় লা-শানতললোি েীরত অনুসারে, সার্যা থাে থাকা কোনো বিক্রিয়াি তাপমানা, চাপ বা ঘেমানা পরি তড ে করলে সার্যা থা এর্ে রদনক ় ় সনি যায় োনত ঐ পরি তড নেি িল প্শমর্ত হয়। ় ় িাথপর প্রবণতাব: র মে্ব েক পর্ক্ষ মোট গ্যাসীে মোল = 1 + 1 = 2 এবং ় ় ় উৎপাদ পর্ক্ষ = 2। উভয় পর্ক্ষ মোল সংখ্যা সমান হওয়ায় চাপ াড় ানল বা কমানল কোনো রদনকই আেতে কমানো বা াড় ানোি ় ় সু নোগ বেই। তাই এ বিক্রিয়াি সার্যা থাে চার্পি কোনো প্রবণতা বেই। ঘনমাতরার প্রবণতাব: N বা O এর ঘেমানা াড় ানল াড় রত র মে্ব েক র 2 2 য হানভর জন্য সম্মখ বিক্রিয়া বেশি ঘনট, িনল সার্যা থা র্ানে সনি ু ি এবং NO এর পরিমাণ ানড়। আ াি NO এর ঘেমানা াড় ানল প্চাৎ বিক্রিয়া বেশি ঘনট, সার্যা থা ানর্ সনি এবং N ও O এবিভব 2 2 পরিমাণ ানড়। একইিান NO সরিনে রেনল সার্যা থা র্ানে সনি। ় ় B −B 1 2 বা, -890 = 2652-(2x + 1856) বা, -890 = 796-2x বা, 2x = 1686 ∴ x = 843kJ/mol ্ ্ সু তিাং, C=O ববন্ধনের ন্ধে শক্তি 843 kJ/mol।"},{"label":"ঘ","question":"(i) ও (ii) েং বিক্রিয়াে সাদশয ও ত সাদশয বিশ্লেষণ কি। ৃ ৃ ্","answer":"উদ্দীপকের বিক্রিয়া দুটি ি সর্তাকৃ ত িূপ: (i)SiCl +4H O → Si(OH) +4HCl 4 2 4 (ii)AgNO3(aq)+KCl(aq) → AgCl(s)+KNO3(aq) সাদশয • দু টি র মে্ ব োনতই কোনো মৌলের জারণ সংখ্যাি পরি তড ে হেরে। (i) এ Si (+4), Cl (-1), H (+1), O (-2) এবং (ii) এ Ag (+1), N (+5), K (+1), Cl (-1) অপরি রতিতড থাকে। তাই দুটি ই েে-বির্ি বিক্রিয়া। টা ﻿ ় ় ় • দু টি র মে্ ব োনতই র মে্ ব জনকি অংশ পিস্পি থাে র রের্ে করে ন ি েতে দুটি যৌগ ততরি করে। (i) এ SiCl এর Cl ও H O এর OH 4 2 + + ় ় থাে র রের্ে করে; (ii) এ Ag ও K থাে র রের্ে করে। ি ি ববসাদশয ত ় ় ় • (i) েং র মে্ ব যায় সমযোজী যৌগ SiCl4 পানির সাথে বিক্রিয়া করে ় ় বিনে Si(OH)4 ও HCl উৎপন্ন করে। পানির সাথে বিক্রিয়াে ় ় যৌগের এরূপ র নোৈজনক আদ্ড বিশ্লেষণ বিক্রিয়া বলে। র ্ ় ় ় ় • (ii) েং র মে্ ব যায় দুটি পানিনত দ্রবণীে আয়নিক ল র্ণি দ্রবণ র র মর্শানল পানিনত অদ্রবণীে AgCl এর সাদা অধঃর্ক্ষপ পনড়। তাই এটি অধঃর্ক্ষপণ বিক্রিয়া। ় ় ় • (i) েং র মে্ ব যায় উৎপাদ ছহনসন এসিড (HCl) ততরি হয়, তাই দ্রবণ ় ় ় অম্ল ীে হে; (ii) েং বিক্রিয়াি দ্রবণ প্শর্ থাকে। 2 র র ় ় সু তিাং, র মে্ ব ো দুটি েে-বির্ি ও উপাদান র রের্নেি রদক থেকে একই িকম হলেও (i) েং আদ্ড বিশ্লেষণ এবং (ii) েং অধঃর্ক্ষপণ র ্ ় ় র মে্ ব ো। ় ় িততড় ৎ-রাসায়নিক প্ভতর্ব যা ়"}],"board":"দিনাজপুর বোর্ড ২০২৫"},{"id":"ch8-cq6","chapter":8,"num":6,"importance":2,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: ় নিচের চিতরটি েে কর এবং প্দি প্েগুজোর উত্তর দাও: র র","subQuestions":[{"label":"ক","question":"হাইন ব াকার্বন কাকে বলে? [২ বোর্ডে এনসনছ]","answer":"শুধু কার্বন ও হাইরোজেন দ্বারা গঠ ি ত তৈ যৌগনক হাইন হাইরোকার্বন ্ ্ বলে। যেমন: মিথেন (CH ), ইরথে (CH =CH )। 4 2 2 ় ় ়"},{"label":"খ","question":"প্শর্ে বিক্রিয়া েেনির্ি কেন? ব্যাখ্যা কি।","answer":"বে বিক্রিয়াে ইলেকট্রন আদাে-প্দাে হয় অর্থাৎ কোনো মৌলের জারণ সংখ্যাি পরি তড ে ঘনট তানক বির্ি বিক্রিয়া বলে। প্শর্ে ় ় ় র মে্ ব যায় এসিড ও ক্ষারক বিক্রিয়া করে লবণ ও পানি উৎপন্ন করে। NaOH+HCl→NaCl+H O 2 এখানে বিক্রিয়াি আগে ও পরে Na (+1), O (-2), H (+1) ও Cl (-1) এর জারণ সংখ্যা একই থাকে; কোনো ইলেকট্রন আদাে-প্দাে হয় ো, + − শুধু H ও OH মর্নল পানি ততরি করে। তাই প্শর্ে বিক্রিয়া েেনির্ি বিক্রিয়া।"},{"label":"গ","question":"উদ্দীপকের বকাষটি ি তপ্ড় ৎ বিশ্লেষণ বকৌশলবণডো কি।","answer":"উদ্দীপকের বকাষটি একটি তপ্ড় ৎ র ন্ল ষয বকাষ। এখানে তপ্ড় ৎ র ন্ল ষয গললত পটাশিয়াম ক্লোরাইড (KCl) এবং দুটি গ্ািাইট দণ্ড ্ র ্ ্ ত ্ তপ্ড় ৎদাি ছহনসন যাটারভর সাথে েুকব। যাটারভর ধোতমক প্ানন্ েুকব ত ্ দণ্ডটি অযানোর্ এবং ঋণাতমক প্ানন্ েুকব দণ্ডটি ক্যাথোড। ় ় গললত অবস্থাে KCl সম্পূর্ণ আেরেত থাকে: KCl → K+ +Cl− ইপ ভিততিক মাস্ট ার সাজেশন চিতর: গললত KCl পূর্ণ পাতরে দুটি গ্ািাইট দণ্ড; ার্ দণ্ড অযানোর্ (+) ও − ্ ় মান দণ্ড ক্যাথোড (-), যাটারভর সাথে েুকব; Cl আয়ন অযানোনর্ি + রদনক এবং K আয়ন ক্যাথোডেি রদনক োনচ্ছ, অযানোর্ থেকে ক্লোরিন গ্যাস ব ি হনচ্ছ। − র দুযৎ প্ াছহত করলে ঋণাতমক Cl আয়ন অযানোনর্ি রদনক এবং + ় ় ধোতমক K আয়ন ক্যাথোডেি রদনক যায়। − অযানোনর্ জারণ: Cl আয়ন ইলেকট্রন তযাগ করে ক্লোরিন গযানস র ল পরিণত হয়। Cl− → Cl +e− Cl +Cl → Cl 2 + ক্যাথোডে র জারণ: K আয়ন ইলেকট্রন গ্রহণ করে ধাত র র ় ় পটামশোনর্ পরিণত হয়। + − K +e →K সার্মগ্ক বিক্রিয়া: র দুযৎ 2KCl ⟶ 2K+Cl 2 সু তিাং গললত KCl এর তপ্ড় ৎ র ন্ল ষর্ণ অযানোনর্ ক্লোরিন গ্যাস এবং ় ় ক্যাথোডে গললত পটাশিয়াম ধাত পাওয়া যায়।"},{"label":"ঘ","question":"উদ্দীপকের কোনষ গললত KCl এর পরি নতড CuSO এর জলীয় 4 দ্রবণ ব্যবহার করলে তপ্ড় ৎ র ন্ল ষর্ণি পি উৎপন্ন অ র্শষটি র ্ একটি নিরুদক—বিশ্লেষণ কি।","answer":"গললত KCl এর পরি নতড CuSO এর জলীয় দ্রবণ ব্যবহার করলে 4 র ্ ় (গ্ািাইট তপ্ড় ৎদাি) দ্রবণে রেনচি আয়নগুনলা থাকে: র র CuSO →Cu2++SO 2− 4 4 + − H O⇌H +OH 2 + 2+ 2+ ক্যাথোডেি রদনক Cu ও H যায়। Cu এর ইলেকট্রন গ্হর্ণি প্ ণতা বেশি, তাই ক্যাথোডে কপাি ৈর্া হয়। 2+ − Cu +2e →Cu 2− − ় ় অযানোনর্ি রদনক SO ও OH যায়। অযাযায়নেি তপ্ড় ৎ 4 − − ় ় রাসায়নিক সারিনত OH রেনচ থাকাে OH আগে চার্জ র্ুকব হয় এবং ় অক্সিজেন গ্যাস উৎপন্ন হয়। − − 4OH →O +2H O+4e 2 2 2− + ় ় িনল দ্রবণে H ও SO আয়ন থেকে যায়, োিা মর্নল র 4 সালমিউরিক এসিড ততরি করে। 2H++SO 2−→H SO 4 2 4 সার্মগ্ক বিক্রিয়া: র দুযৎ 2CuSO +2H O ⟶ 2Cu+O +2H SO 4 2 2 2 অর্থাৎ তপ্ড় ৎ র ন্ল ষর্ণি পি অ র্শষ ছহনসন H SO পাওয়া যায়। এ ্ 2 4 ় ় রদ্রবণনক গাঢ় করলে গাঢ় H SO পাওয়া যায়, ো একটি শক্তিশালী 2 4 নিরুদক (পানি থশাষক)। গাঢ় H SO কোনো যৌগের অণু থেকে H ও 2 4 ় ় O বক 2 : 1 অেুপানত পানি ছহনসন সরিনে বেে। যেমন: চিনিনত গাঢ় H SO যোগ করলে চিনি থেকে পানি অপসারিত হয়ে কানলা কার্বন 2 4 অ মশটট থাকে। গাঢ় H SO 2 4 C H O ⟶ 12C+11H O 12 22 11 2 সু তিাং CuSO দ্রবণেি তপ্ড় ৎ র ন্ল ষর্ণ উৎপন্ন অ র্শষ H SO 4 র ্ একটি নিরুদক। ় ় রাসায়নিক রবভতর্ব যার মাধ্যজম রবদযৎ উৎপাদন"}],"board":"রাজশাহী বোর্ড ২০২০","diagramId":"ch8-cq6"},{"id":"ch8-cq7","chapter":8,"num":7,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: 2+ 2+ Mg(s) + Fe (aq) → Mg (aq) + Fe(s) ﻿","subQuestions":[{"label":"ক","question":"আকরিক কাকে বলে? [২ বোর্ডে এনসনছ]","answer":"বেস খনিজ থেকে লাভজনকভাবে ও সহজে ধাত নিষ্কাশন করা যায় তানদি আকরিক বলে। যেমন: িাইট (Al O .2H O) 2 3 2 অযালুমর্রেোনর্ি আকরিক। ্ ়"},{"label":"খ","question":"গল নকানৈি জলীয় দ্রবণ র দুযৎ পরি হণ করে ো কেন? ব্যাখ্যা ্ু র কি। ় ু","answer":"কোনো দ্রবণ র দুযৎ পরি হণ কিনত হলে দ্রবণে র্ুকব আয়ন র র থাকনত হয়। গলনকাৈ (C H O ) একটি সমযোজী যৌগ। পানিনত ্ ু 6 12 6 ূ ় ্ ় রদ্ ীিত হলে গলনকাৈ অণু আয়নে বিভবকব হয় ো, অণু ছহনসন ই থাকে। ্ু ্ ় ় ্ রদ্রবণে কোনো র্ুকব আয়ন ো থাকাে র দুযৎ হয় করাি র্নতা চার্জ েুকব কণা থাকে ো। তাই গলনকানৈি জলীয় দ্রবণ র দুযৎ পরি হণ করে ো। ্ ু র ় ়"},{"label":"গ","question":"উদ্দীপকের ২ে ধাতি ততরি রৈরেনসি উপর তপ্ড় ৎ প্নলপে প্মে্ ব ো ণডো কি। ় ভ","answer":"উদ্দীপকের বিক্রিয়াি ২ে ধাতটি আেিে (Fe)। বলাহা আদ্ড ় ় াতানস সহজে র্রিচা ধনি ক্ষে হয়, তাই বলাহার রৈরেনসি উপর ় ় অপেক্ষাকৃ ত কম সমে্ব ে রজনকল (Ni) ধাতি প্নলপ দেওয়া হয়। ককৌশে: একটি র কানি তপ্ড় ৎ র ন্লষয ছহনসন রজনকল সালনিট ় ় ্ (NiSO ) দ্রবণ বেওো হয়। র শুদধ রজনকনলি দণ্ক যাটারভর 4 র ্ ত ্ ্ ধোতমক প্ানন্ েুকব করে অযানোর্ এবং পরিষ্ক াি বলাহার চার্চনক ত ্ ু যাটারভর ঋণাতমক প্ানন্ েুকব করে ক্যাথোড ছহনসন দ্রবণে র্ ানো র র হয়। চিতর: NiSO দ্রবণপূর্ণ র কানি রজনকল দণ্ড (অযানোর্, +) ও বলাহার 4 র 2+ ্ ় চার্চ (ক্যাথোড, -) যাটারভর সাথে েুকব; Ni আয়ন চার্নচি রদনক 2− ্ ় এবং SO আয়ন রজনকল দনণ্ডি রদনক োনচ্ছ। 4 রদ্রবণে NiSO আেরেত থাকে: 4 2+ 2− NiSO →Ni +SO 4 4 অযানোনর্ জারণ: 2+ − Ni → Ni +2e ক্যাথোডে র জারণ: 2+ − Ni +2e →Ni 2+ ় ় ় র দুযৎ প্ াছহত করলে অযানোনর্ি রজনকল ক্ষে হয়ে Ni আয়ন 2+ 4 ় ছহনসন দ্রবণে আনস এবং দ্রবণেি Ni আয়ন ক্যাথোড থেকে র র ় ় ইলেকট্রন গ্রহণ করে ধাত রজনকল ছহনসন বলাহার চার্নচি উপর র র ৈর্া হয়। িনল বলাহার চার্নচি উপর রজনকনলি উল প্নলপ পনড়, ো বলাহানক াতাস ও জলীয় ববাষ্পি সংস্পশড থেকে িক্ষা করে র্রিচা পড়া বিাধ করে।"},{"label":"ঘ","question":"উদ্দীপকের বিক্রিয়াি মাধ্যমে র দুযৎ উৎপাদে রক সম্? চচেসহ বিশ্লেষণ কি। [২ বোর্ডে এনসনছ]","answer":"উদ্দীপকের বিক্রিয়া: 2+ 2+ Mg(s)+Fe (aq)→Mg (aq)+Fe(s) এটি একটি জারণ-র জারণ বিক্রিয়া, বেখানে Mg ইলেকট্রন তযাগ 2+ করে (জারণ) এবং Fe ইলেকট্রন গ্রহণ করে (র জারণ)। জারণ ও র র 2 4 ় ় র জারণ অধড-বিক্রিয়া দুটি নক আলাদা পাতরে ঘটিনে গযালিারেক বকাষ ততরি করলে র দুযৎ উৎপাদে সম্। ় ় সমে্ব েতা সারিনত Mg আেিনেি (Fe) উপরে, তাই Mg দণ্ড অযানোর্ এবং Fe দণ্ড ক্যাথোড ছহনসন কাৈ করে। টাইপ ভিততিক মাস্ট ার সাজেশন গেন: একটি র কানি MgSO দ্রবণে Mg দণ্ড এবং অপি র কানি 4 র FeSO দ্রবণে Fe দণ্ড িাখা হয়। দ্রবণ দুটি KCl এর লবণ বসত দিয়ে 4 র র ্ ় এবং দণ্ড দুটি াল্সহ ধাত তাি দিয়ে েুকব করা হয়। চিতর: ার্ র কানি MgSO দ্রবণে Mg দণ্ড (অযানোর্), মান র কানি 4 র FeSO দ্রবণে Fe দণ্ড (ক্যাথোড), র্ানঝ U আকৃ রতি লবণ বসত (K, 4 র − Cl ), উপরে তানি াল্; ইলেকট্রন Mg থেকে Fe এর রদনক প্ াছহত হনচ্ছ। এসিড ে ়"}],"board":"বরিশাল বোর্ড ২০২৪"},{"id":"ch9-cq1","chapter":9,"num":1,"importance":2,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: (i)C H +Cl → C H Cl + HCl 4 10 2 4 9 (ii) ় ়","subQuestions":[{"label":"ক","question":"রেউর্োি মিশে বিক্রিয়া কী? [৩ বোর্ডে এনসনছ] ্ ়","answer":"বে রেউর্োি বিক্রিয়াে কোনো িািী মৌলের রেউর্োস (যেমন ্ ় ় U-235) রেউ ট ে দ্বারা আঘাতপ্াপ্ হয়ে প্রায় সমান ভরের দুটি হালকা র ত র ় ্ ় নিউক্লিয়াসে বিভবকব হয় এবং র পুল পরিমাণ শক্তি রেগডত হয়, তানক ় ় রেউর্োি মিশে বিক্রিয়া বলে।"},{"label":"খ","question":"অযানোর্নক জারণ তপ্ড় ৎদাি লা হয় কেন— ব্যাখ্যা কি। ় ়","answer":"তপ্ড় ৎ র ন্ল ষয কোনষ যাটারভর ধোতমক প্ানন্ি সাথে েুকব ্ র তপ্ড় ৎদািনক অযানোর্ বলে। তপ্ড় ৎ র ন্ল ষর্ণি সময় দ্রবণেি ় ় অযাযায়েগুনলা অযানোনর্ রগনে ইলেকট্রন তযাগ করে চার্জ র্ুকব হয়। ইলেকট্রন তযাগ করা অথড জারণ। 2Cl− → Cl +2e− 2 ় বেনহত অযানোনর্ স সময় জারণ বিক্রিয়া ঘনট, তাই অযানোর্নক ্ ় জারণ তপ্ড় ৎদাি লা হয়।"},{"label":"গ","question":"(i) েং বিক্রিয়াি ΔH এর মান নির্ণয় কি।","answer":"(i) েং বিক্রিয়া: C H +Cl →C H Cl+HCl 4 10 2 4 9 ় ় ় এ বিক্রিয়াে র মে্ব জনকি 1 মোল C-H ন্ধে ও 1 মোল Cl-Cl ন্ধে িানে এবং উৎপানদ 1 মোল C-Cl ন্ধে ও 1 মোল H-Cl ন্ধে গঠ ি ত ় ্ হয়। অেযােয ন্ধে অপরি রতিতড থাকে। ় ্ ্ দেওয়া আনছ, ন্ধে শক্তি: C-H = 414kJ/mol, Cl-Cl = 244kJ/mol, C-Cl = 326kJ/mol, H-Cl = 431kJ/mol ্ ্ ্ বন্ ধ ন িাঙজি ক্ষশারষি শততিব = (414 + 244)kJ = 658kJ ্ ্ ক ্ বন্ ধ ন গেজন রনগি শততিব = (326 + 431)kJ = 757kJ ্ ক ্ ΔH = ক্ষশারষি শততিব − রনগি শততিব = (658 − 757)kJ = −99kJ সু তিাং (i) েং র মে্ ব োি ΔH = −99kJ/mol; ΔH ঋণাতমক হওয়ায় র মে্ ব োটি তার্পাৎপাদী।"},{"label":"ঘ","question":"উদ্দীপকে (ii) েং কোনষি তপ্ড় ৎদানি সংঘটি ত বিক্রিয়া এবং ় উৎপন্ন িারি গ্যাসটি ি জলীয় দ্রবণ এসিড ক্ষারক ক্ষার —বিক্রিয়াসহ বিশ্লেষণ কি।","answer":"(ii) েং কোনষ NaCl এর জলীয় দ্রবণে রেনম্ন াকব আয়ন থাকে: + − NaCl → Na +Cl + − H O⇌H +OH 2 + + কযাথোজড (ঋণাতমক িততড় ৎবার): Na ও H আয়ন আকৃ টট হয়। + ্ ় ় ় চার্জ র্ু কব হওয়ার প্ ণতা বেশি হওয়ায় H আয়ন ইলেকট্রন গ্রহণ করে (র জারণ) H গ্যাস উৎপন্ন করে। 2 ﻿ ় + − 2H +2e →H ↑ 2 − − ্ ় ় অযাজনাজড (ধ্নাতমক িততড় ৎবার): Cl ও OH আয়ন আকৃ টট হয়। − − ় ় ় রদ্রবণে Cl আয়নেি ঘেমানা OH আয়নেি ঘেমানাি বচনে অনেক − ় ় ় বেশি হওয়ায় Cl আয়ন ইলেকট্রন তযাগ করে (জারণ) Cl গ্যাস র 2 উৎপন্ন করে। − − 2Cl →Cl ↑ + 2e 2 + − ় ় ় রদ্রবণে Na ও OH আয়ন থেকে যায়, অর্থাৎ NaOH ততরি হয়। উৎপন্ন গ্যাস দুটি ি আণর ক ভর: H = 2, Cl = 71। সুতিাং িািী 2 2 গ্যাসটি ক্লোরিন (Cl )। ল 2 Cl পানির সাথে বিক্রিয়া করে হাইন ব ান্ারিক এসিড ও 2 ্ ল হাইর্পান্ািাস এসিড উৎপন্ন করে: Cl +H O→HCl+HOCl 2 2 HCl(aq) → H+(aq)+Cl−(aq) + ় ় রদ্রবণে H আয়ন থাকাে এটি েীল ললটর্াসনক লাল করে (HOCl এর বিভবঞ্জে মে্ব োি জন্য পরে বর্ণহীনও করে)। এর pH 7 এর কম। ় সু তিাং উৎপন্ন িািী গ্যাস Cl এর জলীয় দ্রবণ এসিড। 2 ক্ষারক এবং োর"}],"board":"ঢাকা বোর্ড ২০২০","diagramId":"ch9-cq1"},{"id":"ch9-cq2","chapter":9,"num":2,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: ্ ় ত ্ ্ ়","subQuestions":[{"label":"ক","question":"অম্ল কাকে বলে? [৩ বোর্ডে এনসনছ]","answer":"বেস যৌগ জলীয় দ্রবণে হাইরোজেন আয়ন (H ) দেয় তানদিনক অম্ল বা এসিড বলে। যেমন: HCl, H SO। 2 4 ড ়"},{"label":"খ","question":"কৃ রষর্ক্ষতরে pH এর গুিুত ব্যাখ্যা কি। [২ বোর্ডে এনসনছ] ় ়","answer":"প্রতটি িসল একটি নির্দিষ্ট pH সীর্াি মাটি নত িানলা ৈন্মাে; বেশভরিাগ িসনলি জন্য মাটি ি pH প্রায় 6-7 উপনোগী। ় ু মাটি বেশি অম্ল ীে (pH কম) হলে চে (CaO) বা চোপাথি প্নোগ করে pH াড় ানো হয়। ় ় মাটি বেশি ক্ষারীে হলে অম্ল ধর্ী সাি (যেমন অ্যামোনিয়ার্ সালনিট) ় ় ় ় বা তৈ সাি প্নোগ করে pH কমানো হয়। তাই pH বৈনে মাটি সংর্শাধে ও সঠ ি ক িসল রে ডাচে করলে ্ ় উৎপাদে ানড়।"},{"label":"গ","question":"উদ্দীপকের পায়টি নত সংঘটি ত রাসায়নিক প্মে্ব োটি ব্যাখ্যা কি। [২ বোর্ডে এনসনছ] ় ়","answer":"শার্ুনকি থখালনসি প্ধাে উপাদান ক্যালসিয়াম কার্বনেট (CaCO, প্রায় 98%)। 3 র ় ় ় ় পাতরে তাপ রদনল CaCO তাপ থশাষণ করে র নোরৈত হয়ে 3 র ় ু ক্যালসিয়াম অক্সাইড (CaO, থপাড় বা চে) ও CO গ্যাস উৎপন্ন করে। 2 টাইপ ভিততিক মাস্ট ার সাজেশন তাপ CaCO (s) ⟶ CaO(s)+CO (g);ΔH=ধোতমক 3 2 ় ় একটি যৌগ বিনে একারধক পদাথড ততরি হওয়ায় এটি তাপীে ় ় ় ় ় র নোৈে বিক্রিয়া; বিক্রিয়াে তাপ থশারষত হয়, তাই এটি তাপহারী র মে্ ব ো। সু তিাং পাতরে সংঘটি ত প্মে্ ব োটি হলো CaCO এর তাপহারী তাপীে 3 র নোৈে।"},{"label":"ঘ","question":"বিক্রিয়া পাতরে প্াপ্ যৌগটি ি জলীয় দ্রবণে CO গ্যাস চালো র ত র 2 করলে কী ঘনট? সর্ীকিণসহ বিশ্লেষণ কি। [২ বোর্ডে এনসনছ] ্","answer":"বিক্রিয়া পাতরে প্াপ্ যৌগ হলো CaO (ক্ষারক)। এনক পানিনত র ত ু ু রদনল প্চি তাপ উৎপন্ন করে কললচে Ca(OH) ততরি হয়, ো পানিনত 2 ় ্ ় ু দ্রবণীে ক্ষার। এর স্ব চ্ছ জলীয় দ্রবণই চনেি পানি। র র CaO+H O→Ca(OH) +তাপ 2 2 চনেি পানিনত CO চালো করলে অদ্রবণীে CaCO উৎপন্ন হয়, িনল 2 র ় ় রদ্রবণ বঘালা (সাদা) হয়ে যায়। Ca(OH) +CO →CaCO ↓ + H O 2 2 3 আিও বেশি CO চালো কিনত থাকনল CaCO, CO ও পানির সাথে 2 3 ় ় ় র মে্ ব ো করে পানিনত দ্রবণীে ক্যালসিয়াম াইকার্বনেট ততরি করে, ্ ় িনল বঘালা দ্রবণ আ াি স্বচ্ছ হয়। CaCO +CO +H O→Ca(HCO ) 3 2 2 সু তিাং, প্াপ্ যৌগের জলীয় দ্রবণে CO চালো করলে প্রথমে দ্রবণ র ত র 2 ় ় ্ বঘালা হয় এবং অরতরিকব CO চালযায় আ াি স্বচ্ছ হয়। 2 প্শমন রবভতর্ব যা"}],"board":"কুমিল্লা বোর্ড ২০২৪","diagramId":"ch9-cq2"},{"id":"ch9-cq3","chapter":9,"num":3,"importance":3,"stem":"নিচের উদ্দীপকটি পড়ো এবং প্ে গুজোর উত্তর দাও: পাতর - A: HNO, 25 g, 250 ml 3 পাতর - B: Ca(OH)2, 0.5 M, 250 ml","subQuestions":[{"label":"ক","question":"আইসোটোপ কাকে বলে? 2","answer":"বেস পরমাণুর প্রোটন সংখ্যা (পারমাণবিক সংখ্যা) একই কিন্তু ভরসংখ্যা ভিন্ন, তানদিনক পিস্পনভর আইসোটোপ বলে। যেমন: হাইরোজেনের আইসোটোপ 1H, 2H ও 3H। 2"},{"label":"খ","question":"পটাশিয়াম 2n সূজনক সর্থডে করে ো কেন? ব্যাখ্যা কি।","answer":"2n সূে অনুসারে কোনো শক্তিস্তরে সন ডাচ্চ 2n সংখযক ৃ ় ্ত ইলেকট্রন থাকনত পানি। এ অনুসারে ততীে শক্তিস্তরে (n = 3) সন ডাচ্চ 2 2 × 3 = 18টি ইলেকট্রন থাকনত পানি। 2 2 পটামশোনর্ি (19) ইলেকট্রন বিন্যাস: 1s 2s 2p 3s 3p 4s, ্ত ় ৃ অর্থাৎ শক্তিস্তর অেুযায়ী 2, 8, 8, 1। এখানে ততীে শক্তিস্তরে 18টি ইলেকট্রন পূর্ণ ো হয়েই (মান 8টি ) ১৯তর্ ইলেকট্রনটি চতথড শক্তি তনি র র প্রবেশ করে। এর কািণ, 3d অরবিটালেি (n+l = 5) বচনে 4s অরবিটালেি (n+l=4) শক্তি কম, তাই আউি াউ েীরত অনুসারে ইলেকট্রন 2 ় ় আগে 4s এ যায়। এজন্য পটাশিয়াম 2n সূজনক সর্থডে করে ো।"},{"label":"গ","question":"A পাতরেি দ্রবণেি ঘেমানা নির্ণয় কি। [৩ বোর্ডে এনসনছ] ্ ়","answer":"A পাতরে 250 mL দ্রবণে 25 g HNO আনছ। র 3 HNO এর আণরবক ির = 1+14+(16×3) = 63g/mol 3 25 HNO এর কমাে সংখ্যা, n = mol = 0. 397mol 3 63 রদ্বর্ণের আয়তন, V = 250 mL = 0.25 L ﻿ ঘনমাতরা, S = n/V = 0.397 mol/L 0.25 = 1.587 M অতএ, A পাতরেি দ্রবণেি ঘেমানা 1.587 M (মোলাি
