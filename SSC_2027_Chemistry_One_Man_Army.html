ক এসিড উৎপন্ন হয়। K₂Cr₂O₇/H₂SO₄\nCH₃-CHO+[O]⟶CH₃-COOH\nবিকল্পভাবে, ইথাইনকে Ni প্রভাবকের উপস্থিতিতে H₂ দ্বারা ইথিনে, ইথিনকে পানি যোগ করে ইথানলে এবং ইথানলকে জারিত করে ইথানোয়িক এসিডে পরিণত করা যায়।\nNi, 200°C\nHC≡CH+H₂⟶CH₂=CH₂\nH₃PO₄, 300°C, 60 atm\nCH₂=CH₂+H₂O⟶CH₃-CH₂-OH\nK₂Cr₂O₇/H₂SO₄\nCH₃-CH₂-OH+2[O]⟶CH₃-COOH+H₂O\nসুতরাং, উদ্দীপকের শেষোক্ত যৌগ C₂H₂ থেকে জৈব এসিড (CH₃COOH) প্রস্তুত করা সম্ভব ।"}]},{"id":"ch11-cq23","chapter":11,"num":23,"importance":3,"topic":"অ্যালডিহাইড ও জৈব এসিড","board":"মাদ্রাসা বোর্ড ২০২৬","stem":"20% H₂SO₄, 2% HgSO₄, 80°C\n(i)HC≡CH+H₂O⟶P\nK₂Cr₂O₇ + H₂SO₄\n(ii)P+[O]⟶Q","subQuestions":[{"label":"ক","question":"জৈব এসিড কাকে বলে?","answer":"যেসব জৈব যৌগে কার্যকরী মূলক হিসেবে এক বা একাধিক কার্বক্সিল মূলক (-COOH) থাকে, তাদের জৈব এসিড বা কার্বক্সিলিক এসিড বলে। যেমন: অ্যাসিটিক এসিড (CH₃COOH)।"},{"label":"খ","question":"'সকল সংযোজন বিক্রিয়া সংশ্লেষণ বিক্রিয়া নয়'— ব্যাখ্যা কর।","answer":"যে বিক্রিয়ায় দুই বা ততোধিক বিক্রিয়ক (মৌল বা যৌগ) যুক্ত হয়ে একটি মাত্র উৎপাদ তৈরি করে তাকে সংযোজন বিক্রিয়া বলে। সংযোজন বিক্রিয়ায় যদি কেবল মৌলসমূহ যুক্ত হয়ে যৌগ উৎপন্ন হয় তবে তাকে সংশ্লেষণ বিক্রিয়া বলে। যেমন:\nH₂+Cl₂→2HCl\nকিন্তু যৌগ যুক্ত হয়ে নতুন যৌগ উৎপন্ন হলে তা সংযোজন বিক্রিয়া হলেও সংশ্লেষণ বিক্রিয়া নয়। যেমন:\nNi, 200°C\nCH₂=CH₂+H₂⟶CH₃-CH₃\nতাই সকল সংশ্লেষণ বিক্রিয়া সংযোজন বিক্রিয়া হলেও সকল সংযোজন বিক্রিয়া সংশ্লেষণ বিক্রিয়া নয়।"},{"label":"গ","question":"অ্যালকাইল হ্যালাইড হতে কীভাবে P যৌগটি প্রস্তুত করবে সমীকরণসহ ব্যাখ্যা কর।","answer":"উদ্দীপকের (i) নং বিক্রিয়ায় 20% H₂SO₄ ও 2% HgSO₄ এর উপস্থিতিতে 80°C তাপমাত্রায় ইথাইন পানির সাথে বিক্রিয়া করে অ্যাসিটালডিহাইড বা ইথান্যাল উৎপন্ন করে । 20% H₂SO₄, 2% HgSO₄, 80°C\nHC≡CH+H₂O⟶CH₃-CHO\nসুতরাং P যৌগটি হলো অ্যাসিটালডিহাইড বা ইথান্যাল (CH₃CHO)। অ্যালকাইল হ্যালাইড থেকে P প্রস্তুতি ধাপ-১: অ্যালকাইল হ্যালাইড ইথাইল ক্লোরাইড (CH₃-CH₂-Cl) কে জলীয় সোডিয়াম হাইড্রক্সাইড (বা KOH) দ্রবণের সাথে উত্তপ্ত করলে প্রতিস্থাপন বিক্রিয়ায় ইথানল উৎপন্ন হয়।\nতাপ\nCH₃-CH₂-Cl+NaOH(aq)⟶CH₃-CH₂-OH+NaCl\nধাপ-২: উৎপন্ন ইথানলকে জারক পদার্থ পটাসিয়াম ডাইক্রোমেট ও সালফিউরিক এসিডের (K₂Cr₂O₇+H₂SO₄) সাথে মৃদু জারিত করলে অ্যাসিটালডিহাইড উৎপন্ন হয়। এক্ষেত্রে অ্যালডিহাইড উৎপন্ন হওয়ার সাথে সাথে পাতিত করে সরিয়ে নেওয়া হয়, যাতে তা আরও জারিত হয়ে এসিডে পরিণত না হয়। K₂Cr₂O₇ + H₂SO₄\nCH₃-CH₂-OH+[O]⟶CH₃-CHO+H₂O\nএভাবে অ্যালকাইল হ্যালাইড (ইথাইল ক্লোরাইড) থেকে P যৌগ অর্থাৎ অ্যাসিটালডিহাইড প্রস্তুত করা যায়।"},{"label":"ঘ","question":"খাদ্য সংরক্ষণে উদ্দীপকের Q যৌগের ভূমিকা বিশ্লেষণ কর।","answer":"উদ্দীপকের (ii) নং বিক্রিয়ায় P (অ্যাসিটালডিহাইড) কে K₂Cr₂O₇ ও H₂SO₄ এর উপস্থিতিতে জারিত করলে অ্যাসিটিক এসিড বা ইথানয়িক এসিড উৎপন্ন হয়। K₂Cr₂O₇ + H₂SO₄\nCH₃-CHO+[O]⟶CH₃-COOH\nসুতরাং Q যৌগটি হলো অ্যাসিটিক এসিড (CH₃COOH)। অ্যাসিটিক এসিডের 4-10% জলীয় দ্রবণকে ভিনেগার বা সিরকা বলে, যা খাদ্য সংরক্ষণে ব্যাপকভাবে ব্যবহৃত হয়। খাদ্য পচনের মূল কারণ ব্যাকটেরিয়া ও ছত্রাকের মতো অণুজীব। এদের বৃদ্ধির জন্য সাধারণত প্রায় নিরপেক্ষ pH প্রয়োজন । ভিনেগারে উপস্থিত অ্যাসিটিক এসিড জলীয় দ্রবণে আংশিক বিয়োজিত হয়ে H⁺ আয়ন দেয়:\nCH₃COOH⇌CH₃COO⁻+H⁺\n• এই H⁺ আয়ন খাদ্যের pH কমিয়ে (প্রায় 4 এর নিচে) অম্লীয় পরিবেশ তৈরি করে।\n• অম্লীয় পরিবেশে ব্যাকটেরিয়া ও ছত্রাক বৃদ্ধি পেতে ও বংশবিস্তার করতে পারে না; অনেক অণুজীবের কোষীয় এনজাইম নিষ্ক্রিয় হয়ে যায়।\n• ফলে খাদ্য দীর্ঘদিন পচন থেকে রক্ষা পায়। এ কারণে আচার, চাটনি, সস, কেচাপ, মাছ ও সবজির সংরক্ষণে ভিনেগার ব্যবহার করা হয়। ভিনেগার খাদ্যে টক স্বাদও যোগ করে এবং নির্দিষ্ট মাত্রায় এটি স্বাস্থ্যের জন্য ক্ষতিকর নয়। সুতরাং খাদ্য সংরক্ষণে উদ্দীপকের Q যৌগ অর্থাৎ অ্যাসিটিক এসিড (ভিনেগার রূপে) একটি নিরাপদ ও কার্যকর প্রিজারভেটিভ হিসেবে গুরুত্বপূর্ণ ভূমিকা পালন করে ।"}]},{"id":"ch11-cq24","chapter":11,"num":24,"importance":3,"topic":"অ্যালডিহাইড ও জৈব এসিড","board":"রাজশাহী বোর্ড ২০২৬","stem":"যৌগ সাধারণ সংকেত N এর মান P CnH2n+₂ 1 Q CnH2n+₁CHO 1 R CnH2n+₁COOH 1","subQuestions":[{"label":"ক","question":"প্রতীক কাকে বলে?","answer":"প্রতীক: কোনো মৌলের ইংরেজি বা ল্যাটিন নামের সংক্ষিপ্ত রূপকে ঐ মৌলের প্রতীক বলে। যেমন: হাইড্রোজেনের প্রতীক H, সোডিয়ামের প্রতীক Na।"},{"label":"খ","question":"অ্যালকাইল মূলকের যোজনী ব্যাখ্যা কর।","answer":"অ্যালকেন অণু থেকে একটি হাইড্রোজেন পরমাণু অপসারণ করলে যে মূলক পাওয়া যায় তাকে অ্যালকাইল মূলক (CnH2n+₁-) বলে।\nCH₄-H→CH₃- (মিথাইল মূলক)\nমিথেনের কার্বনের চারটি যোজ্যতাই H দ্বারা পূর্ণ। একটি H অপসারণের ফলে কার্বনের একটি যোজ্যতা মুক্ত থাকে, যা দ্বারা মূলকটি অন্য একটি পরমাণু বা মূলকের সাথে একটি বন্ধন গঠন করতে পারে। যেহেতু অ্যালকাইল মূলকে একটি মুক্ত যোজ্যতা থাকে, তাই অ্যালকাইল মূলকের যোজনী 1।"},{"label":"গ","question":"R থেকে P এর প্রস্তুতি সমীকরণসহ ব্যাখ্যা কর।","answer":"উদ্দীপকে n = 1 হলে,\n• P = CnH2n+₂=CH₄ (মিথেন)\n• R = CnH2n+₁COOH=CH₃COOH (ইথানয়িক এসিড বা অ্যাসিটিক এসিড) R (CH₃COOH) থেকে P (CH₄) প্রস্তুতি দুই ধাপে সম্পন্ন হয়। ধাপ-১: সোডিয়াম ইথানয়েট প্রস্তুতি ইথানয়িক এসিডকে NaOH দ্রবণ দ্বারা প্রশমিত করলে সোডিয়াম ইথানয়েট ও পানি উৎপন্ন হয়।\nCH₃COOH+NaOH→CH₃COONa+H₂O\nধাপ-২: ডিকার্বক্সিলেশন শুষ্ক সোডিয়াম ইথানয়েটকে সোডালাইম (NaOH + CaO) সহ উত্তপ্ত করলে কার্বক্সিল মূলক অপসারিত হয়ে মিথেন গ্যাস উৎপন্ন হয়। এখানে CaO পাত্রকে NaOH এর ক্ষয় থেকে রক্ষা করে ও মিশ্রণকে শুষ্ক রাখে। CaO, তাপ\nCH₃COONa+NaOH⟶CH₄+Na₂CO₃\nএভাবে R (ইথানয়িক এসিড) থেকে P (মিথেন) প্রস্তুত করা যায়।"},{"label":"ঘ","question":"P থেকে Q এর সমগোত্রীয় শ্রেণির যৌগ উৎপন্ন করে, উৎপন্ন যৌগটির ব্যবহারিক প্রয়োগ বিশ্লেষণ কর।","answer":"n = 1 হলে Q = CnH2n+₁CHO=CH₃CHO (ইথান্যাল বা অ্যাসিটালডিহাইড), যা অ্যালডিহাইড সমগোত্রীয় শ্রেণির সদস্য। P হলো মিথেন (CH₄)। মিথেন ও অক্সিজেনের মিশ্রণকে উচ্চ চাপে (100 atm) ও 400°C তাপমাত্রায় মলিবডেনাম অক্সাইড প্রভাবকের উপস্থিতিতে চালনা করলে মিথেন জারিত হয়ে মিথান্যাল (ফরমালডিহাইড) উৎপন্ন হয়। MoO₃, 400°C, 100 atm\nCH₄+O₂⟶HCHO+H₂O\nউৎপন্ন HCHO (মিথান্যাল) অ্যালডিহাইড শ্রেণির প্রথম সদস্য, অর্থাৎ এটি Q (CH₃CHO) এর সমগোত্রীয় যৌগ। উৎপন্ন যৌগের (HCHO) ব্যবহারিক প্রয়োগ\n১. ফরমালডিহাইডের 40% জলীয় দ্রবণকে ফরমালিন বলে। ফরমালিন জীবাণুনাশক হিসেবে এবং জীববিজ্ঞান গবেষণাগারে প্রাণী ও উদ্ভিদের নমুনা সংরক্ষণে ব্যবহৃত হয়।\n২. মৃতদেহ সংরক্ষণে ফরমালিন ব্যবহার করা হয়।\n৩. ফেনলের সাথে বিক্রিয়া করে বেকেলাইট প্লাস্টিক এবং ইউরিয়ার সাথে বিক্রিয়া করে ইউরিয়া-ফরমালডিহাইড রেজিন প্রস্তুত করা হয়।\n৪. চামড়া ট্যানিং, রং ও বিভিন্ন রাসায়নিক দ্রব্য তৈরিতে এটি ব্যবহৃত হয়। তবে ফরমালিন বিষাক্ত । মাছ, ফল, দুধ ইত্যাদি খাদ্য সংরক্ষণে ফরমালিন ব্যবহার করলে তা মানবদেহে ক্যান্সার, লিভার ও কিডনির ক্ষতিসহ নানা রোগ সৃষ্টি করে। তাই খাদ্যে এর ব্যবহার নিষিদ্ধ ও দণ্ডনীয় অপরাধ। সুতরাং P থেকে উৎপন্ন মিথান্যাল শিল্প ও চিকিৎসা ক্ষেত্রে অত্যন্ত গুরুত্বপূর্ণ, তবে এর অপব্যবহার স্বাস্থ্যের জন্য মারাত্মক ক্ষতিকর ।"}]},{"id":"ch11-cq25","chapter":11,"num":25,"importance":3,"topic":"পলিমার, প্লাস্টিক ও জৈব-অজৈব যৌগের পার্থক্য","board":"যশোর বোর্ড ২০২১","stem":"X পলিথিনের মনোমার Y প্রাকৃতিক গ্যাসের মূল উপাদান","subQuestions":[{"label":"ক","question":"অ্যালকিন কাকে বলে?","answer":"কার্বন-কার্বন দ্বিবন্ধন (C=C) বিশিষ্ট অসম্পৃক্ত হাইড্রোকার্বনকে অ্যালকিন (Alkene) বলে। এর সাধারণ সংকেত CnH2n। যেমন: ইথিন (CH₂=CH₂)।"},{"label":"খ","question":"পলিমারকরণ বিক্রিয়া ব্যাখ্যা কর।","answer":"উচ্চ চাপ ও তাপে (প্রয়োজনে প্রভাবকের উপস্থিতিতে) একই যৌগের অসংখ্য ক্ষুদ্র অণু (মনোমার) পরস্পর যুক্ত হয়ে বৃহৎ আণবিক ভরবিশিষ্ট নতুন যৌগ (পলিমার) গঠনের বিক্রিয়াকে পলিমারকরণ বিক্রিয়া (Polymerization) বলে।\nযেমন: সামান্য O₂ এর উপস্থিতিতে 1000 atm চাপে ও 200°C তাপমাত্রায় অসংখ্য ইথিন অণু যুক্ত হয়ে পলিথিন গঠন করে। 1000 atm, 200°C, সামান্য O₂\nnCH₂=CH₂⟶[-CH₂-CH₂-]n\nইথিন (মনোমার) → পলিথিন (পলিমার)"},{"label":"গ","question":"উদ্দীপকের \"X\" যৌগটি ব্রোমিনের দ্রবণকে বর্ণহীন করে–ব্যাখ্যা কর।","answer":"X শনাক্তকরণ পলিথিন তৈরি হয় ইথিন থেকে, তাই পলিথিনের মনোমার X = ইথিন (C₂H₄), CH₂=CH₂। ব্যাখ্যা ইথিন একটি অসম্পৃক্ত হাইড্রোকার্বন, কারণ এর দুই কার্বনের মধ্যে একটি দ্বিবন্ধন আছে। দ্বিবন্ধনের একটি বন্ধন (পাই বন্ধন) দুর্বল, তাই এটি সহজেই ভেঙে যায় এবং দুই কার্বনে নতুন পরমাণু যুক্ত হতে পারে (সংযোজন বিক্রিয়া)। ব্রোমিন দ্রবণ লাল বা লালচে বাদামি বর্ণের । ইথিনকে এই দ্রবণে চালনা করলে ব্রোমিন অণু দ্বিবন্ধনে যুক্ত হয়ে বর্ণহীন 1,2- ডাইব্রোমোইথেন উৎপন্ন করে । দ্রবণে আর মুক্ত Br₂ না থাকায় লাল বর্ণ দূর হয়ে দ্রবণ বর্ণহীন হয়ে যায়।\nCH₂=CH₂+Br₂→CH₂Br-CH₂Br\nইথিন + ব্রোমিন (লাল) → 1,2-ডাইব্রোমোইথেন (বর্ণহীন)\n• সম্পৃক্ত অ্যালকেন (যেমন ইথেন) সাধারণ অবস্থায় ব্রোমিন দ্রবণের বর্ণ নষ্ট করে না। তাই এই পরীক্ষা দ্বারা অসম্পৃক্ততা শনাক্ত করা হয়।\nসিদ্ধান্ত: X (ইথিন) দ্বিবন্ধনযুক্ত অসম্পৃক্ত যৌগ বলে ব্রোমিনের সাথে সংযোজন বিক্রিয়া করে ব্রোমিন দ্রবণকে বর্ণহীন করে।"},{"label":"ঘ","question":"উদ্দীপকের \"Y\" যৌগ থেকে CCl₄ প্রস্তুত সম্ভব – বিশ্লেষণ কর।","answer":"Y শনাক্তকরণ প্রাকৃতিক গ্যাসের মূল উপাদান Y = মিথেন (CH₄)। ব্যাখ্যা মিথেন সম্পৃক্ত যৌগ, তাই এটি সংযোজন বিক্রিয়া দেয় না, কিন্তু অতিবেগুনি রশ্মি (UV) বা মৃদু সূর্যালোকে ক্লোরিনের সাথে প্রতিস্থাপন বিক্রিয়া দেয়। প্রতিটি ধাপে মিথেনের একটি H পরমাণু একটি Cl পরমাণু দ্বারা প্রতিস্থাপিত হয় এবং HCl উৎপন্ন হয়। পর্যাপ্ত (অতিরিক্ত) ক্লোরিন দিলে চার ধাপে CCl₄ পাওয়া যায়।\n১. প্রথম ধাপ\nUV\nCH₄+Cl₂⟶CH₃Cl+HCl\nমিথেন → ক্লোরোমিথেন (মিথাইল ক্লোরাইড)\n২. দ্বিতীয় ধাপ\nUV\nCH₃Cl+Cl₂⟶CH₂Cl₂+HCl\nক্লোরোমিথেন → ডাইক্লোরোমিথেন\n৩. তৃতীয় ধাপ\nUV\nCH₂Cl₂+Cl₂⟶CHCl₃+HCl\nডাইক্লোরোমিথেন → ট্রাইক্লোরোমিথেন (ক্লোরোফর্ম)\n৪. চতুর্থ ধাপ\nUV\nCHCl₃+Cl₂⟶CCl₄+HCl\nট্রাইক্লোরোমিথেন → টেট্রাক্লোরোমিথেন (কার্বন টেট্রাক্লোরাইড)\nসামগ্রিক বিক্রিয়া:\nUV\nCH₄+4Cl₂⟶CCl₄+4HCl\n✓ মিথেন : ক্লোরিন অনুপাত বেশি হলে CH₃Cl বেশি পাওয়া যায়; ক্লোরিন অতিরিক্ত দিলে CCl₄ বেশি পাওয়া যায়।\nসিদ্ধান্ত: Y (মিথেন) অতিবেগুনি রশ্মির উপস্থিতিতে অতিরিক্ত ক্লোরিনের সাথে ধাপে ধাপে প্রতিস্থাপন বিক্রিয়ার মাধ্যমে CCl₄ উৎপন্ন করে। সুতরাং Y থেকে CCl₄ প্রস্তুত সম্ভব ।"}]},{"id":"ch12-cq1","chapter":12,"num":1,"importance":2,"topic":"গৃহস্থালির রসায়ন","board":"কুমিল্লা বোর্ড ২০২৪","stem":"A একটি হাইড্রোকার্বন যার আণবিক ভর 26। যৌগটিতে 7.69% হাইড্রোজেন আছে।","subQuestions":[{"label":"ক","question":"অ্যালকোহল কাকে বলে?","answer":"অ্যালিফেটিক হাইড্রোকার্বনের এক বা একাধিক H পরমাণু হাইড্রক্সিল (-OH) মূলক দ্বারা প্রতিস্থাপিত হয়ে যে যৌগ গঠিত হয় তাকে অ্যালকোহল বলে। যেমন- CH₃-CH₂-OH।"},{"label":"খ","question":"ইথানয়িক এসিড একটি দুর্বল এসিড- ব্যাখ্যা কর।","answer":"যে এসিড জলীয় দ্রবণে আংশিক বিয়োজিত হয়ে H⁺ আয়ন দেয় তাকে দুর্বল এসিড বলে। ইথানয়িক এসিড পানিতে সম্পূর্ণ বিয়োজিত হয় না; এর অল্প কিছু অণু CH₃COO⁻ ও H⁺ আয়নে বিয়োজিত হয়, বাকি অণু অবিয়োজিত থাকে।\nআংশিক\nCH₃COOH⟶CH₃COO⁻+H⁺\nফলে দ্রবণে H⁺ আয়নের ঘনমাত্রা কম থাকে। তাই ইথানয়িক এসিড একটি দুর্বল এসিড ।"},{"label":"গ","question":"উদ্দীপক হতে 'A' যৌগটির আণবিক সংকেত নির্ণয় কর।","answer":"দেওয়া আছে, A এর আণবিক ভর = 26; H = 7.69%; অতএব C=100-7.69=92.31%। মৌল শতকরা পরিমাণ পারমাণবিক ভর সরল অনুপাত দিয়ে ভাগ C 92.31 92.31/12=7.69 7.69/7.69=1 H 7.69 7.69/1=7.69 7.69/7.69=1 স্থূল সংকেত = CH; স্থূল সংকেতের ভর =12+1=13। n = আণবিক ভর / স্থূল সংকেতের ভর =26/13=2 আণবিক সংকেত = (CH)n=(CH)₂=C₂H₂ অতএব, A যৌগটির আণবিক সংকেত C₂H₂; যৌগটি ইথাইন (CH≡CH)।"},{"label":"ঘ","question":"উদ্দীপকের 'A' যৌগটি থেকে খাদ্য সংরক্ষক প্রস্তুত সম্ভব- বিশ্লেষণ কর।","answer":"উদ্দীপকের A যৌগটি ইথাইন (CH≡CH)। খাদ্য সংরক্ষক ভিনেগার হলো ইথানয়িক এসিডের (CH₃COOH) 4% – 10% জলীয় দ্রবণ । ইথাইন থেকে দুই ধাপে ইথানয়িক এসিড প্রস্তুত করা যায়। ধাপ ১: 80°C তাপমাত্রায় 20% H₂SO₄ ও 2% HgSO₄ এর উপস্থিতিতে ইথাইনে পানি যোগ করলে ইথান্যাল উৎপন্ন হয়। 20% H₂SO₄, 2% HgSO₄, 80°C\nCH≡CH+H₂O⟶CH₃-CHO\nধাপ ২: ইথান্যালকে K₂Cr₂O₇ ও গাঢ় H₂SO₄ এর জায়মান অক্সিজেন দ্বারা জারিত করলে ইথানয়িক এসিড উৎপন্ন হয়। K₂Cr₂O₇, H₂SO₄\nCH₃-CHO+[O]⟶CH₃-COOH\nউৎপন্ন ইথানয়িক এসিডকে পানিতে মিশিয়ে 4% – 10% দ্রবণ তৈরি করলে ভিনেগার পাওয়া যায়। ভিনেগারের ইথানয়িক এসিড H⁺ আয়ন ত্যাগ করে, যা খাদ্য পচনকারী ব্যাকটেরিয়া ধ্বংস করে; তাই এটি আচারসহ বিভিন্ন খাদ্য সংরক্ষণে ব্যবহৃত হয়। সুতরাং, উদ্দীপকের A যৌগ (ইথাইন) থেকে খাদ্য সংরক্ষক ভিনেগার প্রস্তুত করা সম্ভব ।"}]},{"id":"ch12-cq2","chapter":12,"num":2,"importance":3,"topic":"পরিষ্কার-পরিচ্ছন্নতায় রসায়ন","board":"ঢাকা বোর্ড ২০২৫","stem":"(i)C₁₂H₂₆SO₄+NaOH→M+H₂O\n(ii) NH₄Cl, Na₂CO₃","subQuestions":[{"label":"ক","question":"ইলেকট্রনীয় পরিবাহী কাকে বলে?","answer":"যেসব পরিবাহী ইলেকট্রন প্রবাহের মাধ্যমে বিদ্যুৎ পরিবহন করে কিন্তু নিজে কোনো রাসায়নিক পরিবর্তনের শিকার হয় না, তাদের ইলেকট্রনীয় পরিবাহী বলে। যেমন: Cu, Al, গ্রাফাইট ।"},{"label":"খ","question":"প্রোপিনকে অলিফিন বলা হয় কেন? ব্যাখ্যা কর।","answer":"প্রোপিন (CH₃-CH=CH₂) একটি অ্যালকিন। হ্যালোজেনের (Cl₂, Br₂) সাথে বিক্রিয়ায় অ্যালকিন তৈলাক্ত পদার্থ উৎপন্ন করে বলে অ্যালকিনকে অলিফিন (oil forming) বলা হয়।\nCH₃-CH=CH₂+Br₂→CH₃-CHBr-CH₂Br\nপ্রোপিন ব্রোমিনের সাথে যুত বিক্রিয়ায় তৈলাক্ত তরল 1,2- ডাইব্রোমোপ্রোপেন উৎপন্ন করে । তাই প্রোপিনকে অলিফিন বলা হয়।"},{"label":"গ","question":"উদ্দীপকের 'M' যৌগটির ময়লা পরিষ্কারের কৌশল বর্ণনা কর।","answer":"উদ্দীপকের (i) নং বিক্রিয়ায় লরাইল হাইড্রোজেন সালফেট (C₁₂H₂₆SO₄) NaOH এর সাথে বিক্রিয়া করে সোডিয়াম লরাইল সালফেট ও পানি উৎপন্ন করে।\nC₁₂H₂₆SO₄+NaOH→C₁₂H₂₅SO₄Na+H₂O\nসুতরাং M যৌগটি হলো সোডিয়াম লরাইল সালফেট (C₁₂H₂₅SO₄Na), যা ডিটারজেন্ট নামে পরিচিত। ময়লা পরিষ্কারের কৌশল শরীর ও বাতাস থেকে তৈলাক্ত পদার্থ কাপড়ে লাগে এবং তার উপর ধুলাবালি জমে ময়লা তৈরি হয়। পানিতে দ্রবীভূত হলে ডিটারজেন্ট ঋণাত্মক ডিটারজেন্ট আয়ন ও Na⁺ আয়নে বিয়োজিত হয়।\nC₁₂H₂₅SO₄Na→C₁₂H₂₅SO₄⁻+Na⁺\nডিটারজেন্ট আয়নের ঋণাত্মক চার্জযুক্ত প্রান্ত (-SO₄⁻) পানি আকর্ষী বা হাইড্রোফিলিক এবং দীর্ঘ হাইড্রোকার্বন শিকল (C₁₂H₂₅-) পানি বিকর্ষী বা হাইড্রোফোবিক, যা তেল বা গ্রিজে দ্রবীভূত হয়। ময়লাযুক্ত কাপড় ডিটারজেন্ট দ্রবণে ভেজালে হাইড্রোফোবিক প্রান্ত তেলের মধ্যে প্রবেশ করে এবং হাইড্রোফিলিক প্রান্ত পানির দিকে থাকে। কাপড় ঘষলে বা মোচড়ালে তেলের কণা চারদিক থেকে ডিটারজেন্ট আয়ন দ্বারা আবৃত হয়ে কাপড় থেকে আলাদা হয়ে যায়। প্রতিটি তেলের কণার চারপাশে ঋণাত্মক চার্জের বলয় তৈরি হওয়ায় কণাগুলো পরস্পরকে বিকর্ষণ করে আর একত্র হতে পারে না; তেল, ডিটারজেন্ট ও পানি মিলে ফেনা তৈরি হয়। পরে পানি দিয়ে ধুলে ফেনার সাথে তেল ও ধুলাবালি কাপড় থেকে অপসারিত হয়। এভাবেই M যৌগ (ডিটারজেন্ট) কাপড়ের ময়লা পরিষ্কার করে ।"},{"label":"ঘ","question":"(ii) নং এর লবণদ্বয়ের জলীয় দ্রবণের প্রকৃতি কি একই হবে? বিশ্লেষণ কর।","answer":"(ii) নং এর লবণদ্বয় হলো অ্যামোনিয়াম ক্লোরাইড (NH₄Cl) ও সোডিয়াম কার্বনেট (Na₂CO₃)। এদের জলীয় দ্রবণের প্রকৃতি একই হবে না। NH₄Cl এর জলীয় দ্রবণ NH₄Cl দুর্বল ক্ষারক NH₄OH ও তীব্র এসিড HCl থেকে উৎপন্ন লবণ। পানিতে আর্দ্রবিশ্লেষিত হয়ে এটি NH₄OH ও HCl উৎপন্ন করে।\nNH₄Cl+H₂O→NH₄OH+HCl\nHCl প্রায় সম্পূর্ণ বিয়োজিত হয়ে অধিক H⁺ দেয়, কিন্তু NH₄OH সামান্য বিয়োজিত হয়ে অল্প OH⁻ দেয়। ফলে [H⁺] \u003e [OH⁻]; দ্রবণ অম্লীয়, pH \u003c 7। Na₂CO₃ এর জলীয় দ্রবণ Na₂CO₃ তীব্র ক্ষারক NaOH ও দুর্বল এসিড H₂CO₃ থেকে উৎপন্ন লবণ । পানিতে আর্দ্রবিশ্লেষিত হয়ে এটি NaOH ও H₂CO₃ উৎপন্ন করে।\nNa₂CO₃+2H₂O→2NaOH+H₂CO₃\nNaOH প্রায় সম্পূর্ণ বিয়োজিত হয়ে অধিক OH⁻ দেয়, কিন্তু H₂CO₃ সামান্য বিয়োজিত হয়। ফলে [OH⁻] \u003e [H⁺]; দ্রবণ ক্ষারীয়, pH \u003e 7। সুতরাং NH₄Cl এর জলীয় দ্রবণ অম্লীয় এবং Na₂CO₃ এর জলীয় দ্রবণ ক্ষারীয়; তাই লবণদ্বয়ের জলীয় দ্রবণের প্রকৃতি একই নয়।"}]},{"id":"ch12-cq3","chapter":12,"num":3,"importance":3,"topic":"পরিষ্কার-পরিচ্ছন্নতায় রসায়ন","board":"বরিশাল বোর্ড ২০২৪","stem":"(i) অ্যামোনিয়া + পানি + আইসো প্রোপাইল অ্যালকোহল → P\n(ii) লরাইল অ্যালকোহল + এসিড → Q + পানি\n(iii) Q + ক্ষার → R","subQuestions":[{"label":"ক","question":"সুপার হিটেড ওয়াটার কাকে বলে?","answer":"উচ্চ চাপে 100°C থেকে 374°C তাপমাত্রার মধ্যবর্তী যেকোনো তাপমাত্রার তরল পানিকে সুপার হিটেড ওয়াটার বলে।"},{"label":"খ","question":"ধাতু তাপ সুপরিবাহী কেন? ব্যাখ্যা কর।","answer":"ধাতব বন্ধনে ধাতুর পরমাণুগুলো যোজ্যতা ইলেকট্রন ত্যাগ করে ধনাত্মক আয়নে পরিণত হয় এবং মুক্ত ইলেকট্রনগুলো সমগ্র ধাতব কেলাসে ইলেকট্রন সমুদ্রের মতো চলাচল করে। ধাতুর কোনো অংশে তাপ দিলে সেখানকার মুক্ত ইলেকট্রনগুলোর গতিশক্তি বেড়ে যায়। এরা দ্রুত চলাচল করে কেলাসের অন্য অংশের ইলেকট্রন ও ধনাত্মক আয়নের সাথে সংঘর্ষে গতিশক্তি তথা তাপ স্থানান্তর করে। ফলে খুব দ্রুত ধাতুর সর্বত্র তাপ ছড়িয়ে পড়ে । এজন্য ধাতু তাপ সুপরিবাহী।"},{"label":"গ","question":"উদ্দীপকের 'P' যৌগটি পরিষ্কারক হিসেবে ক্রিয়া করে–বর্ণনা কর।","answer":"অ্যামোনিয়া গ্যাসকে পানিতে দ্রবীভূত করলে অ্যামোনিয়াম হাইড্রোক্সাইড (NH₄OH) বা অ্যামোনিয়া দ্রবণ তৈরি হয়। এর সাথে আইসো প্রোপাইল অ্যালকোহল, CH₃CH(OH)CH₃ মিশিয়ে গ্লাস ক্লিনার প্রস্তুত করা হয়।\nNH₃+H₂O→NH₄OH\nসুতরাং, উদ্দীপকের P যৌগটি হলো গ্লাস ক্লিনার । পরিষ্কারক হিসেবে ক্রিয়া: কাচের গায়ে তেল, চর্বি বা গ্রিজ লাগলে এগুলোর উপর ধুলাবালি পড়ে ময়লা তৈরি হয়। গ্লাস ক্লিনার কাচের গায়ে দিলে—\n১. NH₄OH কাচের গায়ে লেগে থাকা তেল, চর্বি বা গ্রিজের সাথে বিক্রিয়া করে এগুলোকে কাচ থেকে অপসারণ করে। ফলে এর সাথে লেগে থাকা ধুলাবালিও সরে যায়।\n২. কাচের গায়ে কোনো জৈব পদার্থ লেগে থাকলে আইসো প্রোপাইল অ্যালকোহল সেই জৈব পদার্থকে দ্রবীভূত করে কাচ থেকে অপসারণ করে ।\n৩. NH₄OH কাচের উপাদান সোডিয়াম সিলিকেট বা ক্যালসিয়াম সিলিকেটের সাথে বিক্রিয়া করে না, তাই কাচের কোনো ক্ষতি হয় না। এভাবে P যৌগটি (গ্লাস ক্লিনার) কাচের পরিষ্কারক হিসেবে ক্রিয়া করে। তবে গ্লাস ক্লিনার থেকে অ্যামোনিয়া গ্যাস বের হতে পারে বলে ব্যবহারের সময় নাকে-মুখে মাস্ক পরা উচিত।"},{"label":"ঘ","question":"উদ্দীপকের 'R' যৌগটি কাপড় পরিষ্কারে সাবানের চেয়ে অধিকতর উপযোগী–বিশ্লেষণ কর।","answer":"লরাইল অ্যালকোহল সালফিউরিক এসিডের সাথে বিক্রিয়া করে লরাইল হাইড্রোজেন সালফেট (Q) ও পানি উৎপন্ন করে । Q ক্ষার NaOH এর সাথে বিক্রিয়া করে সোডিয়াম লরাইল সালফেট (R) উৎপন্ন করে ।\nC₁₂H₂₆O+H₂SO₄→C₁₂H₂₆SO₄(Q)+H₂O\nC₁₂H₂₆SO₄+NaOH→C₁₂H₂₅SO₄Na(R)+H₂O\nসুতরাং, Q = লরাইল হাইড্রোজেন সালফেট এবং R = সোডিয়াম লরাইল সালফেট বা ডিটারজেন্ট । সাবান (C₁₇H₃₅COONa) ও ডিটারজেন্ট উভয়ই একই কৌশলে (হাইড্রোফোবিক প্রান্ত তেলে ও হাইড্রোফিলিক প্রান্ত পানিতে আকৃষ্ট হয়ে) ময়লা পরিষ্কার করে। কিন্তু খর পানিতে এদের আচরণ ভিন্ন। খর পানিতে Ca₂+ ও Mg₂+ আয়নের লবণ থাকে। সাবান এদের সাথে বিক্রিয়া করে পানিতে অদ্রবণীয় ক্যালসিয়াম ও ম্যাগনেসিয়াম স্টিয়ারেটের অধঃক্ষেপ (গাদ) তৈরি করে।\n2C₁₇H₃₅COONa+CaCl₂→(C₁₇H₃₅COO)₂Ca↓ + 2NaCl\n2C₁₇H₃₅COONa+MgCl₂→(C₁₇H₃₅COO)₂Mg↓ + 2NaCl\nফলে সাবানের অপচয় হয়, সহজে ফেনা হয় না, ময়লা ঠিকমতো পরিষ্কার হয় না এবং অধঃক্ষেপ কাপড়ে লেগে কাপড় মলিন করে। অপরদিকে ডিটারজেন্ট (R) খর পানির Ca₂+ ও Mg₂+ আয়নের সাথে বিক্রিয়া করলে যে লবণ উৎপন্ন হয় তা পানিতে দ্রবণীয়; কোনো অধঃক্ষেপ পড়ে না।\n2C₁₂H₂₅SO₄Na+CaCl₂→(C₁₂H₂₅SO₄)₂Ca (দ্রবণীয়) +\n2NaCl তাই খর পানিতেও ডিটারজেন্ট সহজে ফেনা তৈরি করে কাপড় পরিষ্কার করতে পারে; তাছাড়া সাবানের চেয়ে এর পরিষ্কারকরণ ক্ষমতাও বেশি। সুতরাং, উদ্দীপকের R যৌগটি (ডিটারজেন্ট) কাপড় পরিষ্কারে সাবানের চেয়ে অধিকতর উপযোগী ।"}]},{"id":"ch12-cq4","chapter":12,"num":4,"importance":2,"topic":"পরিষ্কার-পরিচ্ছন্নতায় রসায়ন","board":"রাজশাহী বোর্ড ২০২০","stem":"কয়েকটি পরিষ্কারক সামগ্রী হলো — (i) সাবান (ii) ব্লিচিং পাউডার (iii) ডিটারজেন্ট","subQuestions":[{"label":"ক","question":"প্রতিস্থাপন বিক্রিয়া কাকে বলে?","answer":"যে বিক্রিয়ায় কোনো যৌগের একটি মৌল বা মূলক অন্য কোনো মৌল বা মূলক দ্বারা প্রতিস্থাপিত হয় তাকে প্রতিস্থাপন বিক্রিয়া বলে।\nযেমন: Zn+CuSO₄→ZnSO₄+Cu।"},{"label":"খ","question":"নাইলন ঘনীভবন পলিমার কেন? ব্যাখ্যা কর।","answer":"যে পলিমারকরণ বিক্রিয়ায় মনোমার অণুগুলো যুক্ত হওয়ার সময় H₂O, CO₂ ইত্যাদি ক্ষুদ্র অণু অপসারিত হয় তাকে ঘনীভবন পলিমারকরণ এবং উৎপন্ন পলিমারকে ঘনীভবন পলিমার বলে । নাইলন 6:6 তৈরির সময় অ্যাডিপিক এসিড ও হেক্সামিথিলিন ডাই- অ্যামিন মনোমার যুক্ত হয় এবং প্রতিটি সংযোগে পানির অণু অপসারিত হয়। nHOOC-(CH₂)₄-COOH TiO₂, Δ\n+nH₂N-(CH₂)₆-NH₂⟶(-OC-(CH₂)₄-CONH-(CH₂)₆-NH-)n+2nH₂O\nতাই নাইলন একটি ঘনীভবন পলিমার ।"},{"label":"গ","question":"(ii) নং যৌগের পরিষ্কারকরণের কৌশল বর্ণনা কর।","answer":"উদ্দীপকের (ii) নং যৌগটি হলো ব্লিচিং পাউডার, যার রাসায়নিক নাম ক্যালসিয়াম ক্লোরো হাইপোক্লোরাইট, Ca(OCl)Cl। এটি কাপড়ের রঙিন দাগ দূর করে (বিরঞ্জন) এবং মেঝে, কমোড, বেসিনের জীবাণু ধ্বংস করে পরিষ্কার করে। দাগ বা জীবাণুযুক্ত স্থানে ব্লিচিং পাউডার রেখে পানি যোগ করলে এটি পানির সাথে বিক্রিয়া করে হাইপোক্লোরাস এসিড তৈরি করে, যা ভেঙে জায়মান অক্সিজেন [O] দেয়।\nCa(OCl)Cl+H₂O→CaCl₂+HOCl\nHOCl→HCl+[O]\nদাগ উঠানো: জায়মান অক্সিজেন কাপড়ের রঙিন দাগকে জারিত করে বর্ণহীন করে।\nরঙিন পদার্থ + [O] → বর্ণহীন পদার্থ\nজীবাণু ধ্বংস: জায়মান অক্সিজেন জীবাণুকে জারিত করে মেরে ফেলে ।\nজীবাণু + [O] → মৃত জীবাণু\nএভাবে (ii) নং যৌগ অর্থাৎ ব্লিচিং পাউডার জায়মান অক্সিজেনের মাধ্যমে পরিষ্কারকরণের কাজ করে।"},{"label":"ঘ","question":"(i) নং অপেক্ষা (iii) নং যৌগ উত্তম পরিষ্কারক —বিশ্লেষণ কর।","answer":"উদ্দীপকের (i) নং যৌগ সাবান (যেমন: সোডিয়াম স্টিয়ারেট, C₁₇H₃₅COONa) এবং (iii) নং যৌগ ডিটারজেন্ট (সোডিয়াম লরাইল সালফেট, C₁₂H₂₅SO₄Na)। উভয়ের অণুতে একটি দীর্ঘ হাইড্রোকার্বন শিকল (হাইড্রোফোবিক, তেল আকর্ষী প্রান্ত) ও একটি আয়নিক প্রান্ত (হাইড্রোফিলিক, পানি আকর্ষী প্রান্ত) আছে। হাইড্রোফোবিক প্রান্ত কাপড়ের তেল বা গ্রিজে দ্রবীভূত হয় এবং হাইড্রোফিলিক প্রান্ত পানির দিকে থাকে; কাপড় ঘষলে তেলের কণা আয়ন দ্বারা আবৃত হয়ে পানিতে চলে আসে । মৃদু পানিতে উভয়ই এভাবে কাপড় পরিষ্কার করে। কিন্তু খর পানিতে Ca₂+ ও Mg₂+ আয়ন থাকে। সাবান এদের সাথে বিক্রিয়া করে অদ্রবণীয় অধঃক্ষেপ তৈরি করে।\n2C₁₇H₃₅COONa+CaCl₂→(C₁₇H₃₅COO)₂Ca↓ + 2NaCl\n2C₁₇H₃₅COONa+MgCl₂→(C₁₇H₃₅COO)₂Mg↓ + 2NaCl\nফলে সাবানের অপচয় হয়, ফেনা হয় না এবং কাপড় ভালোভাবে পরিষ্কার হয় না; উল্টো অধঃক্ষেপ কাপড়ে লেগে যায়। অন্যদিকে ডিটারজেন্টের ক্যালসিয়াম ও ম্যাগনেসিয়াম লবণ পানিতে দ্রবণীয়, তাই খর পানিতে কোনো অধঃক্ষেপ পড়ে না এবং ডিটারজেন্টের অপচয় হয় না।\n2C₁₂H₂₅SO₄Na+MgCl₂→(C₁₂H₂₅SO₄)₂Mg (দ্রবণীয়) +\n2NaCl তাছাড়া সাবানের চেয়ে ডিটারজেন্টের পরিষ্কারকরণ ক্ষমতা বেশি এবং এটি মৃদু ও খর উভয় পানিতে কাজ করে। সুতরাং, (i) নং যৌগ সাবান অপেক্ষা (iii) নং যৌগ ডিটারজেন্ট উত্তম পরিষ্কারক ।"}]},{"id":"ch12-cq5","chapter":12,"num":5,"importance":2,"topic":"পরিষ্কার-পরিচ্ছন্নতায় রসায়ন","board":"যশোর বোর্ড ২০২০","stem":"নিচের উদ্দীপকটি পড়ো এবং প্রশ্নগুলোর উত্তর দাও:","diagramId":"ch12-cq5","subQuestions":[{"label":"ক","question":"গ্যালভানিক কোষ কাকে বলে?","answer":"যে কোষে স্বতঃস্ফূর্ত জারণ-বিজারণ বিক্রিয়ার মাধ্যমে রাসায়নিক শক্তি তড়িৎ শক্তিতে রূপান্তরিত হয় তাকে গ্যালভানিক কোষ বলে।\nযেমন: ড্যানিয়েল কোষ।"},{"label":"খ","question":"ইথানলকে জ্বালানি হিসেবে ব্যবহার করা হয় কেন?","answer":"ইথানল (CH₃-CH₂-OH) বাতাসের অক্সিজেনে সহজে পুড়ে প্রচুর তাপশক্তি উৎপন্ন করে।\nCH₃-CH₂-OH+3O₂→2CO₂+3H₂O+তাপশক্তি\nইথানল ধোঁয়াহীন নীল শিখায় জ্বলে, কোনো ছাই বা কালি তৈরি করে না এবং পেট্রোলিয়াম জ্বালানির তুলনায় পরিবেশ কম দূষিত করে। তাছাড়া চিনি বা শ্বেতসারের গাঁজন থেকে একে বারবার উৎপাদন করা যায়। এসব কারণে ইথানলকে জ্বালানি হিসেবে ব্যবহার করা হয়।"},{"label":"গ","question":"উদ্দীপকের কোষটির ক্যাথোড ও অ্যানোডে সংঘটিত বিক্রিয়াসমূহ বর্ণনা কর।","answer":"উদ্দীপকের কোষটি একটি তড়িৎ বিশ্লেষ্য কোষ, যেখানে পটাশিয়াম ক্লোরাইডের (KCl) গাঢ় জলীয় দ্রবণ তড়িৎ বিশ্লেষ্য হিসেবে আছে। দ্রবণে KCl ও পানি আয়নিত অবস্থায় থাকে।\nKCl→K++Cl-H₂O⇌H++OH-\nতড়িৎ চালনা করলে ধনাত্মক আয়ন (K+, H+) ক্যাথোডের দিকে এবং ঋণাত্মক আয়ন (Cl-, OH-) অ্যানোডের দিকে যায়।\nক্যাথোডে বিক্রিয়া (বিজারণ): সক্রিয়তা সিরিজে পটাশিয়াম হাইড্রোজেনের অনেক উপরে, তাই K+ অপেক্ষা H+ এর ইলেকট্রন গ্রহণের প্রবণতা বেশি। ফলে H+ আয়ন ইলেকট্রন গ্রহণ করে হাইড্রোজেন গ্যাস হিসেবে মুক্ত হয়।\nH++e-→H\nH+H→H₂↑\nঅ্যানোডে বিক্রিয়া (জারণ): দ্রবণটি গাঢ় হওয়ায় অ্যানোডের কাছে OH- অপেক্ষা Cl- আয়নের ঘনমাত্রা অনেক বেশি। তাই Cl- আয়ন ইলেকট্রন ত্যাগ করে ক্লোরিন গ্যাস হিসেবে মুক্ত হয়।\nCl-→Cl+e-Cl+Cl→Cl₂↑\nদ্রবণে K+ ও OH- আয়ন থেকে যায়, ফলে দ্রবণটি ক্রমে KOH দ্রবণে পরিণত হয়। সুতরাং, কোষটির ক্যাথোডে H₂ গ্যাস এবং অ্যানোডে Cl₂ গ্যাস উৎপন্ন হয়।"},{"label":"ঘ","question":"অ্যানোডে উৎপন্ন পদার্থটিকে কলিচুনের মধ্যে চালনা করলে যে মূল পদার্থটি উৎপন্ন হয় তা একটি শক্তিশালি জীবাণুনাশক- বিশ্লেষণ কর।","answer":"'গ' থেকে পাই, অ্যানোডে উৎপন্ন পদার্থটি ক্লোরিন গ্যাস (Cl₂)। কলিচুন হলো ক্যালসিয়াম হাইড্রোক্সাইড, Ca(OH)₂। 40°C তাপমাত্রায় কঠিন কলিচুনের মধ্যে ক্লোরিন গ্যাস চালনা করলে ব্লিচিং পাউডার উৎপন্ন হয়। 40°C\nCa(OH)₂+Cl₂⟶Ca(OCl)Cl+H₂O\nসুতরাং, উৎপন্ন মূল পদার্থটি হলো ক্যালসিয়াম ক্লোরো হাইপোক্লোরাইট বা ব্লিচিং পাউডার, Ca(OCl)Cl। ঘরের মেঝে, কমোড, বেসিন ইত্যাদির উপর ব্লিচিং পাউডার রেখে পানি যোগ করলে এটি পানির সাথে বিক্রিয়া করে ক্যালসিয়াম ক্লোরাইড ও হাইপোক্লোরাস এসিড উৎপন্ন করে ।\nCa(OCl)Cl+H₂O→CaCl₂+HOCl\nহাইপোক্লোরাস এসিড ভেঙে জায়মান অক্সিজেন [O] তৈরি করে ।\nHOCl→HCl+[O]\nজায়মান অক্সিজেন অত্যন্ত সক্রিয় জারক; এটি জীবাণুর কোষের উপাদানকে জারিত করে জীবাণুকে মেরে ফেলে ।\nজীবাণু + [O] → মৃত জীবাণু\nএ কারণে পানি বিশুদ্ধকরণ এবং টয়লেট, মেঝে ও বেসিন জীবাণুমুক্ত করতে ব্লিচিং পাউডার ব্যবহার করা হয়। সুতরাং, অ্যানোডে উৎপন্ন ক্লোরিনকে কলিচুনে চালনা করে প্রাপ্ত ব্লিচিং পাউডার একটি শক্তিশালী জীবাণুনাশক ।"}]},{"id":"ch12-cq6","chapter":12,"num":6,"importance":2,"topic":"কৃষি ও শিল্পক্ষেত্রে রসায়ন","board":"সিলেট বোর্ড ২০২৫","stem":"Δ\n(i)NH₄Cl+CaO⟶′P′+CaCl₂+H₂O\nΔ\n(ii)CO₂+NH₃⟶′X′\n′X′→′Y′+H₂O |পাঠ্যবইয়ের শিখন-ফল ৫|","subQuestions":[{"label":"ক","question":"ক্ষারক কাকে বলে?","answer":"যে সকল পদার্থ এসিডের সাথে বিক্রিয়া করে লবণ ও পানি উৎপন্ন করে তাদের ক্ষারক বলে । ধাতব অক্সাইড ও হাইড্রোক্সাইড সাধারণত ক্ষারক, যেমন: CaO, NaOH, Cu(OH)₂।"},{"label":"খ","question":"রোগ নিরাময়ে আইসোটোপের ভূমিকা ব্যাখ্যা কর।","answer":"তেজস্ক্রিয় আইসোটোপ থেকে নির্গত রশ্মি রোগ নির্ণয় ও নিরাময়ে ব্যবহৃত হয়। কোবাল্ট-60 (Co-60) থেকে নির্গত গামা রশ্মি ক্যান্সার আক্রান্ত কোষ ধ্বংস করতে ব্যবহার করা হয় (রেডিওথেরাপি)। আয়োডিন-131 (I-131) থাইরয়েড গ্রন্থির রোগ (যেমন: গলগণ্ড) নির্ণয় ও চিকিৎসায় ব্যবহৃত হয়। আবার টেকনিসিয়াম-99m দিয়ে দেহের টিউমার বা রোগাক্রান্ত অংশ শনাক্ত করা হয়। এছাড়া গামা রশ্মি দিয়ে চিকিৎসা সরঞ্জাম জীবাণুমুক্ত করা হয়।"},{"label":"গ","question":"'P' যৌগটি ক্ষারধর্মী —ব্যাখ্যা কর।","answer":"উদ্দীপকের (i) নং বিক্রিয়ায় অ্যামোনিয়াম ক্লোরাইড ও ক্যালসিয়াম অক্সাইডের মিশ্রণকে উত্তপ্ত করলে অ্যামোনিয়া গ্যাস উৎপন্ন হয়। সুতরাং P = অ্যামোনিয়া (NH₃)।\nΔ\n2NH₄Cl+CaO⟶2NH₃(P)+CaCl₂+H₂O\nNH₃ ক্ষারধর্মী হওয়ার কারণ:\n১. NH₃ অণুর নাইট্রোজেন পরমাণুতে একটি নিঃসঙ্গ ইলেকট্রন জোড় আছে, যা দিয়ে এটি প্রোটন (H⁺) গ্রহণ করতে পারে।\n২. পানিতে দ্রবীভূত হয়ে NH₃ পানি থেকে H⁺ গ্রহণ করে এবং দ্রবণে OH⁻ আয়ন তৈরি করে। তাই এর জলীয় দ্রবণ লাল লিটমাসকে নীল করে।\nNH₃+H₂O→NH₄⁺+OH⁻\n৩. NH₃ এসিডের সাথে বিক্রিয়া করে লবণ উৎপন্ন করে।\nNH₃(g)+HCl(g)→NH4Cl(s)\nসুতরাং, জলীয় দ্রবণে OH⁻ আয়ন দেয় এবং এসিডকে প্রশমিত করে বলে 'P' যৌগ (NH₃) ক্ষারধর্মী ।"},{"label":"ঘ","question":"উদ্দীপকের 'Y' যৌগটির প্রস্তুতিসহ কৃষিক্ষেত্রে ব্যবহারের উপযোগিতা বিশ্লেষণ কর।","answer":"উদ্দীপকের (ii) নং এ CO₂ ও NH₃ উত্তপ্ত করে প্রথমে 'X' এবং X ভেঙে 'Y' ও পানি উৎপন্ন হয়। সুতরাং X = অ্যামোনিয়াম কার্বামেট (NH₂COONH₄) এবং Y = ইউরিয়া (NH₂-CO-NH₂)। প্রস্তুতি: CO₂ ও NH₃ গ্যাসের মিশ্রণকে উচ্চ চাপে এবং 130°-150°C তাপমাত্রায় উত্তপ্ত করলে প্রথমে অ্যামোনিয়াম কার্বামেট উৎপন্ন হয়। পরে অ্যামোনিয়াম কার্বামেট ভেঙে ইউরিয়া তৈরি হয়। উচ্চ চাপ, 130° -150° C\n2NH₃+CO₂⟶NH₂COONH₄(X)\nΔ\nNH₂COONH₄⟶NH₂-CO-NH₂(Y)+H₂O\nকৃষিক্ষেত্রে উপযোগিতা:\n১. নাইট্রোজেন উদ্ভিদের অন্যতম প্রধান পুষ্টি উপাদান, কিন্তু উদ্ভিদ বায়ু থেকে সরাসরি N₂ গ্রহণ করতে পারে না। ইউরিয়াতে নাইট্রোজেনের পরিমাণ প্রায় 46.67%, তাই এটি নাইট্রোজেনের উৎকৃষ্ট উৎস।\n২. মাটিতে ইউরিয়েজ এনজাইমের উপস্থিতিতে ইউরিয়া পানির সাথে বিক্রিয়া করে NH₄⁺ আয়ন তৈরি করে, যা উদ্ভিদ সহজে শোষণ করতে পারে। ইউরিয়েজ এনজাইম+\nNH₂-CO-NH₂+3H₂O⟶2NH₄+2OH⁻\n+CO₂\n৩. এতে গাছের পাতা সবুজ ও সতেজ হয়, গাছের দৈহিক বৃদ্ধি ঘটে এবং ফসলের ফলন বাড়ে । সুতরাং, 'Y' যৌগ ইউরিয়া নাইট্রোজেন সার হিসেবে কৃষিক্ষেত্রে অত্যন্ত উপযোগী।"}]}]};

function esc(s){
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function applyTheme(){
  const r = document.documentElement;
  r.dataset.theme = state.theme;
  r.classList.toggle('dark', state.dark);
  document.body.className = 'fs-' + state.fs;
  document.getElementById('darkBtn').textContent = state.dark ? '☀️' : '🌙';
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta){
    const t = DB.themes.find(x=>x.id===state.theme);
    meta.setAttribute('content', state.dark ? '#0D1117' : (t ? t.swatch : '#FAF8F5'));
  }
  saveLS(SK.theme, state.theme);
  saveLS(SK.dark, state.dark);
  saveLS(SK.fs, state.fs);
}

function toggleDark(){ state.dark = !state.dark; applyTheme(); if(state.panelOpen) renderPopover(); }
function setTheme(id){ state.dark = false; state.theme = id; applyTheme(); renderPopover(); }
function setFs(fs){ state.fs = fs; applyTheme(); renderPopover(); }
function togglePanel(){ state.panelOpen = !state.panelOpen; renderPopover(); }
function renderPopover(){
  const pop = document.getElementById('themePopover');
  if(!state.panelOpen){ pop.classList.add('hidden'); return; }
  pop.classList.remove('hidden');
  pop.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><strong>পড়ার থিম ও টেক্সট সাইজ</strong><button type="button" class="btn sm" onclick="togglePanel()">✕</button></div>'
    + '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:10px;background:var(--bg-subtle);margin-bottom:10px"><span style="font-size:12px">ডার্ক মোড</span><button type="button" class="btn sm primary" onclick="toggleDark()">' + (state.dark ? 'লাইট চালু' : 'ডার্ক চালু') + '</button></div>'
    + '<div style="font-size:12px;color:var(--text-secondary)">৬টি হালকা রঙের থিম</div>'
    + '<div class="theme-grid">' + DB.themes.map(t => {
        const sel = state.theme === t.id && !state.dark;
        return '<button type="button" class="swatch-btn" style="border-color:' + (sel ? t.accent : 'var(--border-subtle)') + ';background:' + (sel ? 'var(--accent-soft)' : 'var(--bg-canvas)') + '" onclick="setTheme(\'' + t.id + '\')"><span class="swatch-dot" style="background:' + t.swatch + ';box-shadow:inset 0 0 0 3px ' + t.accent + '"></span><span>' + esc(t.nameBn) + '</span></button>';

    + '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:6px">লেখার আকার</div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">'

function setTab(tab, ch){
  if(ch !== undefined){
    state.chapter = ch;
    if(tab === 'exam'){
      state.exam.scope = ch === 'all' ? 'full' : 'chapters';
      if(ch !== 'all') state.exam.chapters = [ch];
    }
  }
  state.tab = tab;
  state.panelOpen = false;
  renderPopover();
  renderNav();
  renderMain();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderShellSvg(atoms){
  const w = atoms.length * 155 + 20;
  return '<svg viewBox="0 0 ' + w + ' 165" style="width:100%;max-width:480px;height:auto">' + atoms.map((a, idx) => {
    const cx = 85 + idx * 155, cy = 78;
    const rings = a.shells.map((ec, si) => {
      const r = 24 + si * 16;
      let dots = '';
      for(let di=0;di<ec;di++){
        const ang = (2*Math.PI*di)/ec - Math.PI/2;
        dots += '<circle cx="'+(cx+r*Math.cos(ang)).toFixed(1)+'" cy="'+(cy+r*Math.sin(ang)).toFixed(1)+'" r="3" fill="var(--accent)"/>';
      }
      return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--text-secondary)" stroke-width="1.4" '+(si===a.shells.length-1?'':'stroke-dasharray="3 2"')+'/>'+dots;
    }).join('');
    return rings + '<circle cx="'+cx+'" cy="'+cy+'" r="13" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.6"/>'
      + '<text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" font-size="10" font-weight="700" fill="var(--text-primary)">'+esc(a.n)+'</text>'
      + '<text x="'+cx+'" y="154" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--text-primary)">'+esc(a.l)+'</text>';
  }).join('') + '</svg>';
}

function setCh(c){ state.chapter = c; state.mcqLimit = 30; state.cqLimit = 20; state.sqLimit = 30; state.sqCardIdx = 0; state.sqFlipped = false; renderMain(); }
function pickMcq(id, idx){ if(state.mcqAns[id]!==undefined) return; state.mcqAns[id]=idx; saveLS(SK.mcqAns, state.mcqAns); renderMain(); }
function toggleBm(id){ const i=state.mcqBm.indexOf(id); if(i>=0) state.mcqBm.splice(i,1); else state.mcqBm.push(id); saveLS(SK.mcqBm, state.mcqBm); renderMain(); }
function resetMcqScope(){
  const scoped = state.chapter==='all' ? DB.mcqs : DB.mcqs.filter(q=>q.chapter===state.chapter);
  scoped.forEach(q => delete state.mcqAns[q.id]);
  saveLS(SK.mcqAns, state.mcqAns);
  renderMain();
}
function toggleExp(id){ state.mcqExpOpen[id]=!state.mcqExpOpen[id]; renderMain(); }

function renderMcq(){
  const scoped = state.chapter==='all' ? DB.mcqs : DB.mcqs.filter(q=>q.chapter===state.chapter);
  const att = scoped.filter(q=>state.mcqAns[q.id]!==undefined).length;
  const cor = scoped.filter(q=>state.mcqAns[q.id]===q.answerIndex).length;
  const qStr = state.mcqSearch.trim().toLowerCase();
  const filtered = scoped.filter(item => {
    if(state.mcqImp!=='all' && item.importance!==state.mcqImp) return false;
    if(state.mcqStatus==='bookmarked' && !state.mcqBm.includes(item.id)) return false;
    if(state.mcqStatus==='wrong'){ const p=state.mcqAns[item.id]; if(p===undefined||p===item.answerIndex) return false; }
    if(state.mcqStatus==='unanswered' && state.mcqAns[item.id]!==undefined) return false;
    if(qStr && !(item.question+' '+(item.boards||'')+' '+item.options.join(' ')).toLowerCase().includes(qStr)) return false;
    return true;
  });
  let html = '<section class="card"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center"><div><h2 style="margin:0;font-size:20px">MCQ অনুশীলন</h2><div style="font-size:13px;color:var(--text-secondary)">অধ্যায়ভিত্তিক ও সম্পূর্ণ বইয়ের বহুনির্বাচনি</div></div><div style="display:flex;gap:10px;align-items:center"><div class="mono" style="font-size:13px;font-weight:700;color:var(--accent)">'+cor+'/'+att+' সঠিক (মোট '+scoped.length+')</div>'+(att?'<button type="button" class="btn sm" onclick="resetMcqScope()">রিসেট</button>':'')+'</div></div>'
    + chapterStrip('setCh')
    + '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px"><input class="input" style="flex:1;min-width:190px" type="search" placeholder="প্রশ্ন বা বোর্ড খুঁজুন..." value="'+esc(state.mcqSearch)+'" oninput="state.mcqSearch=this.value;renderMain()"/>'
    + '<select class="input" style="width:auto" onchange="state.mcqImp=this.value===\'all\'?\'all\':Number(this.value);renderMain()"><option value="all"'+(state.mcqImp==='all'?' selected':'')+'>সব গুরুত্ব</option><option value="3"'+(state.mcqImp===3?' selected':'')+'>★★★</option><option value="2"'+(state.mcqImp===2?' selected':'')+'>★★</option></select>'
    + '<select class="input" style="width:auto" onchange="state.mcqStatus=this.value;renderMain()"><option value="all"'+(state.mcqStatus==='all'?' selected':'')+'>সব প্রশ্ন</option><option value="unanswered"'+(state.mcqStatus==='unanswered'?' selected':'')+'>বাকি প্রশ্ন</option><option value="wrong"'+(state.mcqStatus==='wrong'?' selected':'')+'>ভুল উত্তর</option><option value="bookmarked"'+(state.mcqStatus==='bookmarked'?' selected':'')+'>বুকমার্ক</option></select>'
    + '</div></section>';

  const vis = filtered.slice(0, state.mcqLimit);
  html += vis.map(item => {
    const chMeta = DB.chapters.find(c=>c.id===item.chapter);
    const picked = state.mcqAns[item.id];
    const answered = picked !== undefined;
    const isBm = state.mcqBm.includes(item.id);
    const expOpen = !!state.mcqExpOpen[item.id];
    return '<article class="card"><div class="meta"><span><strong style="color:var(--accent)">অধ্যায় '+(chMeta?chMeta.code:item.chapter)+' · #'+String(item.num).padStart(2,'0')+'</strong> · '+(item.importance===3?'★★★':'★★')+(item.boards?' · '+esc(item.boards):'')+'</span>'
      + '<button type="button" class="btn sm '+(isBm?'soft':'')+'" onclick="toggleBm(\''+item.id+'\')">'+(isBm?'★ সংরক্ষিত':'☆ বুকমার্ক')+'</button></div>'
      + (item.stemPrefix ? '<div class="box" style="margin-top:0;margin-bottom:10px">'+esc(item.stemPrefix)+'</div>' : '')
      + '<div class="qtext" style="font-weight:600;margin-bottom:12px">'+esc(item.question)+'</div>'
      + '<div class="grid-2">' + item.options.map((opt, idx) => {
          let cls = 'opt-btn';
          if(answered){ if(idx===item.answerIndex) cls+=' correct'; else if(idx===picked) cls+=' wrong'; }
          return '<button type="button" class="'+cls+'" '+(answered?'disabled':'')+' onclick="pickMcq(\''+item.id+'\','+idx+')"><span class="opt-key">'+OPT_LBL[idx]+'</span><span>'+esc(opt)+'</span></button>';
        }).join('') + '</div>'
      + (answered ? '<div style="margin-top:10px"><button type="button" class="btn sm" onclick="toggleExp(\''+item.id+'\')">'+(expOpen?'ব্যাখ্যা লুকান ▲':'ব্যাখ্যা দেখুন ▼')+'</button>'+(expOpen?'<div class="box soft">'+esc(item.explanation)+'</div>':'')+'</div>' : '')
      + '</article>';
  }).join('');

  if(filtered.length > state.mcqLimit){
    html += '<div style="text-align:center"><button type="button" class="btn soft" onclick="state.mcqLimit+=30;renderMain()">আরও দেখুন ('+(filtered.length-state.mcqLimit)+' বাকি)</button></div>';
  }
  return html;
}

function toggleSqMast(id){ const i=state.sqMast.indexOf(id); if(i>=0) state.sqMast.splice(i,1); else state.sqMast.push(id); saveLS(SK.sqMast, state.sqMast); renderMain(); }

  return html;

function fmtClock(sec){ const m=Math.floor(sec/60), s=sec%60; return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function calcGrade(pct){
  if(pct>=80)return{g:'A+',gpa:'5.00',r:'অসাধারণ ফলাফল!'};
  if(pct>=70)return{g:'A',gpa:'4.00',r:'খুব ভালো প্রস্তুতি!'};
  if(pct>=60)return{g:'A-',gpa:'3.50',r:'ভালো, আরও অনুশীলন করুন।'};
  if(pct>=50)return{g:'B',gpa:'3.00',r:'মোটামুটি, দুর্বল অধ্যায় ঝালাই করুন।'};
  if(pct>=40)return{g:'C',gpa:'2.00',r:'আরও মনোযোগ প্রয়োজন।'};
  if(pct>=33)return{g:'D',gpa:'1.00',r:'কোনোমতে উত্তীর্ণ।'};
  return{g:'F',gpa:'0.00',r:'অকৃতকার্য — অধ্যায়গুলো পুনরায় পড়ুন।'};
}

function toggleExamCh(id){
  const a = state.exam.chapters;
  const i = a.indexOf(id);
  if(i>=0){ if(a.length>1) a.splice(i,1); } else a.push(id);
  renderMain();
}

function startExam(){
  const e = state.exam;
  const pool = e.scope==='full' ? DB.mcqs : DB.mcqs.filter(q=>e.chapters.includes(q.chapter));
  if(!pool.length) return;
  const copy = pool.slice();
  for(let i=copy.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [copy[i],copy[j]]=[copy[j],copy[i]]; }
  e.qs = copy.slice(0, Math.min(e.count, copy.length));
  e.ans = {};
  e.idx = 0;
  e.totalSec = e.mins * 60;
  e.left = e.totalSec;
  e.scopeLabel = e.scope==='full' ? 'সম্পূর্ণ বই (অধ্যায় ০১–১২)' : e.chapters.slice().sort((a,b)=>a-b).map(id=>'অধ্যায় '+DB.chapters.find(c=>c.id===id).code).join(', ');
  e.emailStatus = 'idle';
  e.phase = 'running';
  if(e.timerId) clearInterval(e.timerId);
  e.timerId = setInterval(() => {
    if(state.exam.phase !== 'running') return;
    state.exam.left--;
    const clk = document.getElementById('examClock');
    if(clk) clk.textContent = fmtClock(Math.max(0, state.exam.left));
    if(state.exam.left <= 0){ finishExam(); }
  }, 1000);
  renderMain();
}

function computeExamResult(){
  const e = state.exam;
  let correct=0, wrong=0, skipped=0;
  const byCh = {};
  e.qs.forEach(q => {
    if(!byCh[q.chapter]) byCh[q.chapter]={ok:0,tot:0};
    byCh[q.chapter].tot++;
    const p = e.ans[q.id];
    if(p===undefined) skipped++;
    else if(p===q.answerIndex){ correct++; byCh[q.chapter].ok++; }
    else wrong++;
  });
  const total = e.qs.length;
  const pct = total ? Math.round((correct/total)*100) : 0;
  const gr = calcGrade(pct);
  const used = Math.max(1, e.totalSec - e.left);
  const chSum = Object.entries(byCh).map(([cid,st])=>'অধ্যায় '+DB.chapters.find(c=>c.id===Number(cid)).code+': '+st.ok+'/'+st.tot).join(' | ');
  return {correct, wrong, skipped, total, pct, ...gr, used, byCh, chSum};
}

function dispatchExamEmail(res){
  const e = state.exam;
  e.emailStatus = 'sending';
  e.emailMsg = '';
  renderMain();
  fetch('https://formsubmit.co/ajax/' + DB.resultEmail, {
    method: 'POST',
    headers: {'Content-Type':'application/json','Accept':'application/json'},
    body: JSON.stringify({
      _subject: 'SSC 2027 রসায়ন পরীক্ষা: ' + (e.name||'Student') + ' — ' + res.correct + '/' + res.total + ' (' + res.pct + '%, ' + res.g + ')',
      _template: 'table',
      _captcha: 'false',
      Student_Name: e.name || 'উল্লেখ করা হয়নি',
      Roll_ID: e.roll || 'N/A',
      Batch: e.batch || 'SSC 2027',
      Exam_Scope: e.scopeLabel,
      Score: res.correct + ' / ' + res.total,
      Wrong: String(res.wrong),
      Skipped: String(res.skipped),
      Percentage: res.pct + '%',
      Grade_GPA: res.g + ' (GPA ' + res.gpa + ')',
      Time_Used: fmtClock(res.used),
      Chapter_Breakdown: res.chSum,
      Submitted_At: new Date().toLocaleString('en-GB',{hour12:true})
    })
  }).then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(() => {
      state.exam.emailStatus = 'sent';
      state.exam.emailMsg = 'ফলাফল স্বয়ংক্রিয়ভাবে ' + DB.resultEmail + ' ঠিকানায় পাঠানো হয়েছে।';
      renderMain();
    }).catch(() => {
      state.exam.emailStatus = 'error';
      state.exam.emailMsg = 'স্বয়ংক্রিয় সার্ভারে সংযোগ করা যায়নি। নিচের "ইমেইল অ্যাপে পাঠান" বাটন ব্যবহার করুন।';
      renderMain();
    });
}

function finishExam(){
  const e = state.exam;
  if(e.phase !== 'running') return;
  if(e.timerId){ clearInterval(e.timerId); e.timerId = null; }
  e.phase = 'result';
  const res = computeExamResult();
  state.exams.unshift({
    id: 'ex-' + Date.now(),
    name: e.name || 'পরীক্ষার্থী',
    scope: e.scopeLabel,
    correct: res.correct,
    total: res.total,
    pct: res.pct,
    grade: res.g
  });
  state.exams = state.exams.slice(0, 30);
  saveLS(SK.exams, state.exams);
  dispatchExamEmail(res);
}

function renderExam(){
  const e = state.exam;
  if(e.phase === 'running' && e.qs.length){
    const q = e.qs[e.idx];
    const chMeta = DB.chapters.find(c=>c.id===q.chapter);
    const ansCnt = Object.keys(e.ans).length;
    return '<div class="card" style="position:sticky;top:60px;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:10px"><div><div style="font-size:12px;font-weight:700;color:var(--accent)">'+esc(e.scopeLabel)+'</div><div class="mono" style="font-size:12px;color:var(--text-secondary)">উত্তর: '+ansCnt+'/'+e.qs.length+'</div></div>'
      + '<div style="display:flex;gap:8px;align-items:center"><div class="mono" id="examClock" style="padding:6px 12px;border-radius:10px;border:1px solid var(--border-subtle);background:var(--bg-subtle);font-weight:700">'+fmtClock(e.left)+'</div>'
      + '<button type="button" class="btn primary sm" onclick="finishExam()">সাবমিট</button></div></div>'
      + '<div class="card"><div class="meta"><span><strong style="color:var(--accent)">প্রশ্ন '+(e.idx+1)+'/'+e.qs.length+' · অধ্যায় '+(chMeta?chMeta.code:q.chapter)+'</strong></span><span>'+(q.importance===3?'★★★':'★★')+'</span></div>'
      + (q.stemPrefix?'<div class="box" style="margin-top:0;margin-bottom:10px">'+esc(q.stemPrefix)+'</div>':'')
      + '<div class="qtext" style="font-weight:600;margin-bottom:12px">'+esc(q.question)+'</div>'
      + '<div class="grid-2">' + q.options.map((opt, idx) => {
          const sel = e.ans[q.id] === idx;
          return '<button type="button" class="opt-btn '+(sel?'selected':'')+'" onclick="state.exam.ans[\''+q.id+'\']='+idx+';renderMain()"><span class="opt-key">'+OPT_LBL[idx]+'</span><span>'+esc(opt)+'</span></button>';
        }).join('') + '</div>'
      + '<div style="display:flex;justify-content:space-between;margin-top:14px"><button type="button" class="btn" '+(e.idx===0?'disabled':'')+' onclick="state.exam.idx--;renderMain()">পূর্ববর্তী</button>'
      + '<button type="button" class="btn primary" onclick="'+(e.idx<e.qs.length-1?'state.exam.idx++;renderMain()':'finishExam()')+'">'+(e.idx<e.qs.length-1?'পরবর্তী প্রশ্ন':'পরীক্ষা শেষ ও ফলাফল')+'</button></div></div>'
      + '<div class="card"><div style="font-size:12px;font-weight:700;margin-bottom:8px;color:var(--text-secondary)">প্রশ্ন নেভিগেটর</div><div style="display:flex;flex-wrap:wrap;gap:6px">'
      + e.qs.map((it, idx) => '<button type="button" class="btn sm mono '+(idx===e.idx?'primary':(e.ans[it.id]!==undefined?'soft':''))+'" style="min-width:36px" onclick="state.exam.idx='+idx+';renderMain()">'+(idx+1)+'</button>').join('')
      + '</div></div>';
  }

  if(e.phase === 'result'){
    const res = computeExamResult();
    const reportText = 'SSC 2027 রসায়ন — মডেল পরীক্ষা ফলাফল\nশিক্ষার্থী: '+(e.name||'পরীক্ষার্থী')+' (রোল: '+(e.roll||'-')+')\nসিলেবাস: '+e.scopeLabel+'\nনম্বর: '+res.correct+'/'+res.total+' ('+res.pct+'%)\nগ্রেড: '+res.g+' (GPA '+res.gpa+')\n'+res.chSum;
    const mailto = 'mailto:'+DB.resultEmail+'?subject='+encodeURIComponent('SSC 2027 রসায়ন পরীক্ষা: '+(e.name||'Student')+' ('+res.pct+'%)')+'&body='+encodeURIComponent(reportText);
    return '<section class="card"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-start"><div><div style="font-size:12px;font-weight:700;color:var(--accent)">তাৎক্ষণিক ফলাফল</div><h2 style="margin:4px 0">'+esc(e.name||'পরীক্ষার্থী')+' — গ্রেড '+res.g+' (GPA '+res.gpa+')</h2><div style="font-size:13px;color:var(--text-secondary)">'+res.r+' · '+esc(e.scopeLabel)+'</div></div>'
      + '<div class="no-print" style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn sm" onclick="window.print()">প্রিন্ট / PDF</button><button type="button" class="btn primary sm" onclick="state.exam.phase=\'setup\';renderMain()">নতুন পরীক্ষা</button></div></div>'
      + '<div class="grid-4" style="margin-top:14px">'
      + '<div class="card" style="margin:0;padding:12px;background:var(--bg-canvas)"><div style="font-size:12px;color:var(--text-secondary)">প্রাপ্ত নম্বর</div><div class="mono" style="font-size:22px;font-weight:700;color:var(--accent)">'+res.correct+'/'+res.total+'</div><div style="font-size:12px">'+res.pct+'%</div></div>'
      + '<div class="card" style="margin:0;padding:12px;background:var(--bg-canvas)"><div style="font-size:12px;color:var(--text-secondary)">ভুল উত্তর</div><div class="mono" style="font-size:22px;font-weight:700;color:#DC2626">'+res.wrong+'</div><div style="font-size:12px">বাকি: '+res.skipped+'</div></div>'
      + '<div class="card" style="margin:0;padding:12px;background:var(--bg-canvas)"><div style="font-size:12px;color:var(--text-secondary)">গ্রেড</div><div class="mono" style="font-size:22px;font-weight:700">'+res.g+'</div><div style="font-size:12px">GPA '+res.gpa+'</div></div>'
      + '<div class="card" style="margin:0;padding:12px;background:var(--bg-canvas)"><div style="font-size:12px;color:var(--text-secondary)">সময়</div><div class="mono" style="font-size:22px;font-weight:700">'+fmtClock(res.used)+'</div><div style="font-size:12px">রোল: '+esc(e.roll||'-')+'</div></div>'
      + '</div>'
      + '<div class="box soft" style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px"><div><strong>ফলাফল প্রাপক: '+DB.resultEmail+'</strong><div>'+esc(e.emailStatus==='sending'?'পাঠানো হচ্ছে...':e.emailMsg)+'</div></div>'
      + '<div class="no-print" style="display:flex;gap:8px"><a class="btn primary sm" href="'+mailto+'">ইমেইল অ্যাপে পাঠান</a></div></div>'
      + '</section>'
      + e.qs.map((q, idx) => {
          const p = e.ans[q.id];
          const ok = p === q.answerIndex;
          return '<article class="card" style="border-color:'+(ok?'#16A34A':(p===undefined?'var(--border-subtle)':'#DC2626'))+'"><div class="meta"><strong>প্রশ্ন '+(idx+1)+'</strong><span>'+(ok?'✓ সঠিক':(p===undefined?'উত্তরহীন':'✕ ভুল'))+'</span></div>'
            + '<div style="font-weight:600;margin-bottom:6px">'+esc(q.question)+'</div>'
            + (p!==undefined&&!ok?'<div style="font-size:13px;color:#DC2626">আপনার উত্তর: ('+OPT_LBL[p]+') '+esc(q.options[p])+'</div>':'')
            + '<div style="font-size:13px;font-weight:700;color:#16A34A">সঠিক উত্তর: ('+OPT_LBL[q.answerIndex]+') '+esc(q.options[q.answerIndex])+'</div>'
            + '<div class="box">'+esc(q.explanation)+'</div></article>';
        }).join('');
  }

  const pool = e.scope==='full' ? DB.mcqs : DB.mcqs.filter(q=>e.chapters.includes(q.chapter));
  return '<section class="card"><h2 style="margin:0 0 6px">সময়বদ্ধ মডেল পরীক্ষা (Timed Exam)</h2>'
    + '<p style="margin:0 0 14px;font-size:13px;color:var(--text-secondary)">পরীক্ষা শেষে তাৎক্ষণিক ফলাফল এবং স্বয়ংক্রিয়ভাবে <strong>'+DB.resultEmail+'</strong> ঠিকানায় ইমেইল রিপোর্ট পাঠানো হবে।</p>'
    + '<div class="grid-2">'
    + '<div><div style="font-size:12px;font-weight:700;margin-bottom:6px">১. সিলেবাস</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">'
    + '<button type="button" class="btn '+(e.scope==='full'?'primary':'')+'" onclick="state.exam.scope=\'full\';renderMain()">সম্পূর্ণ বই ('+DB.mcqs.length+')</button>'
    + '<button type="button" class="btn '+(e.scope==='chapters'?'primary':'')+'" onclick="state.exam.scope=\'chapters\';renderMain()">নির্দিষ্ট অধ্যায়</button></div>'
    + (e.scope==='chapters' ? '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:12px">' + DB.chapters.map(ch =>
        '<button type="button" class="btn sm '+(e.chapters.includes(ch.id)?'soft':'')+'" style="justify-content:flex-start" onclick="toggleExamCh('+ch.id+')">'+ch.code+'. '+esc(ch.titleBn)+'</button>'
      ).join('') + '</div>' : '')
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><div style="font-size:12px;font-weight:700;margin-bottom:6px">২. প্রশ্ন সংখ্যা ('+pool.length+')</div><div style="display:flex;gap:6px;flex-wrap:wrap">'
    + [10,25,30,50].map(c=>'<button type="button" class="btn sm mono '+(e.count===c?'soft':'')+'" onclick="state.exam.count='+c+';state.exam.mins='+c+';renderMain()">'+c+'</button>').join('')
    + '</div></div><div><div style="font-size:12px;font-weight:700;margin-bottom:6px">৩. সময় (মিনিট)</div><div style="display:flex;gap:6px;flex-wrap:wrap">'
    + [10,15,25,30,45].map(m=>'<button type="button" class="btn sm mono '+(e.mins===m?'soft':'')+'" onclick="state.exam.mins='+m+';renderMain()">'+m+'m</button>').join('')
    + '</div></div></div></div>'
    + '<div style="background:var(--bg-canvas);border:1px solid var(--border-subtle);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;justify-content:space-between">'
    + '<div style="display:grid;gap:8px"><div style="font-size:12px;font-weight:700">৪. পরীক্ষার্থীর তথ্য</div>'
    + '<input class="input" placeholder="শিক্ষার্থীর নাম" value="'+esc(e.name)+'" oninput="state.exam.name=this.value"/>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input class="input" placeholder="রোল / আইডি" value="'+esc(e.roll)+'" oninput="state.exam.roll=this.value"/><input class="input" placeholder="ব্যাচ" value="'+esc(e.batch)+'" oninput="state.exam.batch=this.value"/></div>'
    + '<div class="box soft" style="margin:0;font-size:12px">প্রশ্ন: <strong>'+Math.min(e.count,pool.length)+' টি</strong> · সময়: <strong>'+e.mins+' মিনিট</strong> · প্রাপক: <strong>'+DB.resultEmail+'</strong></div></div>'
    + '<button type="button" class="btn primary" '+(pool.length===0?'disabled':'')+' onclick="startExam()">▶ পরীক্ষা শুরু করুন</button>'
    + '</div></div></section>';
}

function renderMain(){
  const root = document.getElementById('appRoot');
  if(state.tab==='home') root.innerHTML = renderHome();
  else if(state.tab==='mcq') root.innerHTML = renderMcq();
  else if(state.tab==='cq') root.innerHTML = renderCq();
  else if(state.tab==='sq') root.innerHTML = renderSq();
  else if(state.tab==='exam') root.innerHTML = renderExam();
}

applyTheme();
renderNav();
renderMain();
</script>
</body>
